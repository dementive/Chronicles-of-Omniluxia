l_english:
 LOADING_TIP_0: "'And I tell you truly, not one thing that I have promised you will fail to come true; the Creator has abandoned us, and the true god will only be made manifest once the spirit of renewal transforms the hearts of the people.' - From the Musings of Bachin, Lord of Dui-Pattar"
 LOADING_TIP_1: "'Do not trust the Werhenlanders - they believe that the sword is always the answer, even when there is no question being asked.' - Zorgolis of Gevanni"
 LOADING_TIP_2: "'Weep, ye daughters of Zani, and pour ashes on your head and cast your eyes to the ground; the Empire has fallen, never to be restored, and the mercy of the gods are nowhere to be found.' - Hymn for the Fall of the Zani Empire"
 LOADING_TIP_3: "'The only thing that matters in this life is the Way - everything else shall be as snares set before your feet, a distraction for your eyes. Unless ye be willing to Seek the Way with your whole being, then in the Day of Judgment, your name shall be stricken from the Records of the Seekers.' - Excerpt from a Seeker holy text, 'The Proclamation'"
 LOADING_TIP_4: "'For many days, we traveled underneath the ground of Morrigon, our caravans moving in utter darkness as we wandered through the abandoned realms of the Silver Dwarves. The threat of Drow raiding parties kept us on our toes, but we would not be dissuaded - if the Godslayer were to be found somewhere in these god-forsaken lands, then I would be the one to take it from its resting place.' - The Travels of the Treasure Hunter Tincomarus Zunn"
 LOADING_TIP_5: "When presented a bowl of unmixed wine by the Hazalars, it is best to pace yourself slowly and take tiny sips at first; the wild tribesmen are famous for their rowdy hospitality and will seek an opportunity to become drunk with their guests."
 LOADING_TIP_6: "'Burn brightly, Inner Flame, and consume my body if you have need for fuel; I will not deny your light.'' - Orcanite Precept"
 LOADING_TIP_7: "'I did not come to make peace with God; I came to destroy his throne of lies. The Helluvian Faith is a worm-chewed corpse, but the gift of Zainudians is a truth that surpasses understanding.' - Excerpt from a sermon given by Jaoz the Bold"
 LOADING_TIP_8: "'All things pass, and so shall this moment, but when all is forgotten, all that remains is love.' - Celtican folk saying"
 LOADING_TIP_9: "'Do not smoke opium with the Orcs, my son, and do not develop a taste for the mixed wine of the Borderlanders, but choose sobriety in body and spirit for all of your days.' - from The Philosophies of the Patreic Paterfamilias"
 LOADING_TIP_10: "The Polarian Bear can swim for many hours under water, is impervious to the bitter cold and can run as fast as a horse, if need be. If one is tracking you in the Glaciers, then make your peace with your gods..."
 LOADING_TIP_11: "'If only every soldier was like Cyrogelos, then the whole world would be under my command...' - Emperor Zanis I The Great"
 LOADING_TIP_12: "'You may strip me of my blood, my flesh; but you will never strip me of my faith. Enjoy my death in this world, because you should be so lucky to meet me in the next.' - Vivi 'The Martyr,' reincarnation of the god Lula"
 LOADING_TIP_13: "'My lord, I will follow you across all of Luxterra, Morrigon, and beyond. But your soldiers tire, they ask to turn back, and I fear they will soon turn without your command.' - Archon Cyregelos 'The Loyal'"
 LOADING_TIP_14: "Borderlanders are some of the best trackers and rangers that are found within Morrigon, a cultural relic from the times where their people waged guerilla warfare against the encroaching Zani Empire."
 LOADING_TIP_15: "'Here, we examine the formulae necessary for calculating the speed of a moving object traveling along a curve.' - excerpt from Volume Three of the Postulates of Tadm of Yewubdar"
 LOADING_TIP_16: "'Seek nothing but the Way; turn from your families, your children, your gods, your loved ones.' - The First Seeker Teaching" 
 LOADING_TIP_17: "'As handsome as a Euryalean and as loyal as a Zerywani' - a common insult used by the Helluvians"
 LOADING_TIP_18: "'Then let my flesh and scales be of use, for what kind of father shall I be if I am not to give life to my own kin?' - from Chronicles of The First Dragon" 
 LOADING_TIP_19: "At such horror, Mother Earth and the Stone Father were appalled of their own creations, and at the behest of one of the remaining Three Gods, they were all sent away, forever resenting their father, their architects, and those made in the other three Gods' images."
 LOADING_TIP_20: "It was through great suffering and struggle that many of these Dragons were dispersed throughout the lands, and it was through a long, agonizing process of training and becoming accustomed to their forms, that they sought to create their own children."
 LOADING_TIP_21: "Both Mother Earth and the Stone Father attempted to ease their misery, yet only made it worse. " 
 LOADING_TIP_22: "With eyes of blood and scales of gold, the three-headed hydra stood proudly upon its two great legs. Yet Mother Earth declared there was nothing to use to make such things, for no Earth could possibly hold such form."
 LOADING_TIP_23: "'And with that declaration, the heads each snapped and dug their fangs to puncture the scales of his own necks. No pain was felt, except the mere thought that he would not see his children be born into the world'. - from Chronicles of The First Dragon"
 LOADING_TIP_24: "'Who hath cursed us to these forms? Why must we toil in unjust agony, for does our father not love us so?'' - from Chronicles of The First Dragon"
 LOADING_TIP_25: "Although the Polarians live in some of the harshest climates of Omniluxia, their cities are said to be among the most inviting and charming of all nations. As a people forced to spend time indoors, they take their creature comforts seriously."
 LOADING_TIP_26: "'For, in my studies of the firmament and the heavenly orbs that travel across the sky, I have come to discover that there are many distant worlds like our own.' - excerpt from Volume Six of the Celestial Compendium of Tadm of Yewubdar"
 LOADING_TIP_27: "'Forward, forward/Ever forward/Death is but a doorway forward.' - Viktreic Battle Hymn of Victory"
 LOADING_TIP_28: "Those that trespass into the swamps of the Austropetolian Archipelago without a native guide are courting death, for the Snakefolk do not welcome outsiders and will attack strangers on sight."
 LOADING_TIP_29: "Although the Great Collapse brought devastation to the four corners of Omniluxia, none suffered more than the Empire of the Ular-Pria, who saw their cities sink under the sea - the giant tsunamis literally destroyed the Snakefolk Empire."
 LOADING_TIP_30: "'Do not worry about tomorrow, for the day has its own dwarves to deal with - one step at a time.' - Kinone folk saying"
 LOADING_TIP_31: "'It is the destiny of the Dragkhanic to devour, consume and destroy...does the lion feel guilty about taking down a lamb?' - Jarenam the Formidable Dragon"
 LOADING_TIP_32: "If you quiet your inner murmuring and allow the ears of your soul to listen, then the Great Forest shall speak to you. - Waldonian saying"
 LOADING_TIP_33: "The Stellaric Guildmasters will happily extend lines of credit to anyone with collateral - even Emperors have approached the merchants, hat in hand, asking for temporary loans."
 LOADING_TIP_34: "'Again, I command you earnestly - Seeking the Way is the only thing that matters. Only fools remain attached to mortal things; keep your eyes on the Path.' - The Second Seeker Teaching"
 LOADING_TIP_35: "'Of course we shall welcome them in true Zani style. Archmage, sink their ships.' - the Grand Admiral Pedentruztu, upon seeing the fleets of the Werhenlander diplomats approaching Gevanni"
 LOADING_TIP_36: "It is best to avoid the waters that surround the Dissolved Lands, as many ships have disappeared without a trace beneath the murky waves."
 LOADING_TIP_37: "If you desire safe passage through Dragon Pass, then be sure to know a few words in Droitra - the Hobgoblins are always pleased when a foreigner makes an attempt to learn their tongue, and they will appreciate the effort."
 LOADING_TIP_38: "The Skyreach Passages are home to the largest mountains in Luxterra, with dizzying heights that often terrify those unused to the jaw-dropping vistas at the roof of the world."
 LOADING_TIP_39: "'Oh, bury me in Mazos/With a gold coin to my name/And toast your kin when harvest's in/And I shall do the same' - Mazonian drinking song"
 LOADING_TIP_40: "The tsunamis that destroyed the cities of the Ular-Pria Imperium were so large that they hid the Sun in the sky - the destruction was unimaginable."
 LOADING_TIP_41: "In the years following the Great Collapse, goblin armies from the mountains pillaged most of the cities of Wegalia and stole a great deal of plunder."
 LOADING_TIP_42: "Because of the conflicts gripping the island of Arteon, there are many battle-seasoned Artheousian mercenaries to be found around the port cities of the Central Omniluxian Sea."
 LOADING_TIP_43: "The Borderlanders have been struggling to keep the Orcs from Rendun from settling throughout northern Morrigon, and some believe that they are working with the Nazani Empire to destabilize the Borderlands."
 LOADING_TIP_44: "The vast marshlands of eastern Morrigon are known as the 'Emzalian Swamp', or 'Emzalia', and has long been a refuge for the Borderlanders."
 LOADING_TIP_45: "The Green Valley Region of Morrigon is populated mostly by the Anvindr Silver Dwarves, who are perhaps the most suspicious of all dwarven races. However, some speculate that long ago their domains used to encompass the Dragon's Pass."
 LOADING_TIP_46: "The Hebric god Edis is buried in Bad-Furqorin, the city on the fertile plains that he conquered and founded himself."
 LOADING_TIP_47: "The island of Rendun, north of Morrigon, is the homeland of the Orcs, but their Orcanite Faith came from the nearby isle of Remun."
 LOADING_TIP_48: "'Unless we secure the rights of the people by laws and regulations, then we will be battered about by the whims of the Razani Emperors and their cronies. The time has come for us to chain the beast that Zanis unleashed.' - excerpt from a speech of Zorgolis of Gevanni"
 LOADING_TIP_49: "'It's hard to say which group of people were more personally disloyal to me and the cause for which I fought; the Baetep and the Werherlander care only for themselves, and they proved this time and time again in the years to come.' - from the Memoirs of Zanis the Great"
 LOADING_TIP_50: "The Deep Rift Valley, home to twisting and expansive caves that no one has fully explored, was the place that the Drow emerged from. They soon fell upon the West Wild Northlands and destroyed the Norrfaliens, showing no mercy."
 LOADING_TIP_51: "'The lands of the East/Filled with great beasts/Consisting of mountains/Spewing their bloodied fountains/Hot, boiling rivers of red/Filling the victims with naught but dread/A land cursed where nothing is grown/For the eyes believe what only is shown.' - excerpt from the text 'The Eastern Wilds'"
 LOADING_TIP_52: "The grand city of Branrhylvilelli in the country of Lindum is home to the 'World's End Port'; the last major harbor town of western Morrigon."
 LOADING_TIP_53: "The Boblo District in the city of Droishuilco is filled with wretched Dragkhanic mercenaries, Borderlander trackers, Imperial Nazani exiles, and bloodthirsty Orcish caravan guards protecting rich Celtican merchants."
 LOADING_TIP_54: "Bharamuntacho Zani, the first city of the Nazani Empire, was once the western capital of the Zani Empire. Zani Emperors would spend the warmer months living at Durobaeraste in Luxterra and sail west over to Bharamuntacho Zani in Morrigon during the winters."
 LOADING_TIP_55: "The Kaffira Kingdom is a Dunydurceg monarchy that has taken advantage of the Azar decline over the last few decades, expanding their presence in the Iron Foothills at the expense of the Golden Dwarves. "
 LOADING_TIP_56: "The islands of the Austropetolian Archipelago have some of the most diverse wildlife living in Omniluxia, and many rare trade goods, like sugar and coffee, grow in the fertile volcanic soil of its jungles."
 LOADING_TIP_57: "The Pomegranate Throne of Baetep is one of the most famous royal thrones in all Omniluxia and has a storied history of its own.  Many legendary Pharons have ruled from its marbled seat, and when Zanis the Great conquered the Baetep Kingdom, he took the throne for himself. Since then it has been the royal seat of the successors of the Zani in the region, much to the chagrin of the kingdoms of the Upper Baetep."
 LOADING_TIP_58: "'A sword of two metals is stronger than a blade of the purest iron.' - Dolln 'to Fildligh'"
 LOADING_TIP_59: "'May my descendents not remember my misdeeds, my errors, or my faults. Only the glory of my final hour.' - Last words of Inarr 'to Sosatt'"
 LOADING_TIP_60: "The Dolin Silver Dwarves are a hardy people who escaped the destruction of the Unification Wars and settled in the Dragon's Pass, signing the Treaty of Two Friends with the local Kana'i goblins."
 LOADING_TIP_61: "'Hear me, instruments of my will, the followers of Helluvius' deceit cannot be saved. Their devotion to his lies only clouds their minds, and so they cannot accept my word. Thus, they must be destroyed. Go south and find the #E People of the Rock#!. There, you must lead them back here to Hashamñax and reconquer it in my name, driving the Helluvian dogs into the sea.' - The Second Revelation of Zain'ud"
 LOADING_TIP_62: "'I am #E Zain'ud#! and my word is law, hear me now, this is my final message: Spread my word to the ends of this world, and tell the devoted to come and pray to me at this altar.' - The Third Revelation of Zain'ud"
 LOADING_TIP_63: "'Magic at its core is a tool to create reality out of imagination. While Kings try to enforce their dreams on others, Mages choose their own reality.' - Magonis the Wise"
 LOADING_TIP_64: "'Mistress of Misery, O Melodias! Hear me, Theolosius Sipolarius Magnar! Lend my your power and I shall release you onto my enemies!' - Theolosius 'the Mad'"
 LOADING_TIP_65: "There is much mystery behind the Great Collapse, but the Zani blame a Northern sorcerer who they claim released an uncontrollable power, destroying the world of the Zanic Age."
 LOADING_TIP_66: "After unsuccessfully agitating for land reforms within the Razani Empire, Zorgolis of Gevanni, one of the most famed orators living within Durobaereste, was executed at dawn on the first day of the year 1001."
 LOADING_TIP_67: "The religious figure known as the Shannah is the head of the Helluvian Faith and lives in the Apostolic Palace in the city of Ddu-Nuinop."
 LOADING_TIP_68: "Whenever Hellas makes his will known to the Shannah, the head of the Helluvian Faith is able to call a crusade against anyone that the Creator of All Things That Can Never Be Known desires to be destroyed." 
 LOADING_TIP_69: "While many living within Morrigon decry the practice as barbaric, the Nazani Empire has adopted the policy of blinding their political enemies in order to ensure that former prisoners are unable to lead an army."
 LOADING_TIP_70: "One of the few cultural traditions that unites all of people living throughout Omniluxia is the affinity for jousting and games - the common people love it when their Ruler calls for a Royal Tournament to be held within the capital."
 LOADING_TIP_71: "'A crown may command a man to kneel, but only a story can persuade his grandchildren that he was right to do so.' - attributed to Zorgolis of Gevanni"
 LOADING_TIP_72: "The Luxterran Calendar was adopted by Sumun the Great in the first year of his kingdom. Zanis the Great later added two months to it, proving that even the measurement of time is not safe from an Emperor's ambition."
 LOADING_TIP_73: "Sumun the Great united the Eagelian peoples beneath one banner, but the troubled succession after his death opened the path by which Zanis would eventually seize the throne."
 LOADING_TIP_74: "'Loyalty is not standing beside your lord at a feast. It is standing before him when the knives are drawn.' - saying attributed to Cyrogelos the Loyal"
 LOADING_TIP_75: "The Cyrogelos Reforms transformed the Zani army into a professional force. In the Cult of Zanis, the faithful general is remembered as Sol, the companion who stood between the Emperor and death."
 LOADING_TIP_76: "During the Betrayal at Ruzel, border states permitted Zanis to march freely through their lands, leaving the Azar unprepared for the army suddenly descending upon Tiuban."
 LOADING_TIP_77: "When Zanis conquered Baetep, loyalists smuggled the Pomegranate Throne away to the Old Kingdom of Dune rather than allow the conqueror to claim it without a struggle."
 LOADING_TIP_78: "The body of Zanis the Great was never found. Zanisites teach that he ascended to demigodhood, while less reverent historians suspect that even great conquerors may die quietly and leave no corpse behind."
 LOADING_TIP_79: "'I have conquered cities that believed their walls eternal. Never trust a wall merely because the dead called it strong.' - apocryphal maxim of Zanis the Great"
 LOADING_TIP_80: "The Great Northern War ended when Theolosius the Mad opened the sealed Primordial Well beneath Petramonis. His desperate weapon destroyed the city it was meant to save and began the Great Collapse."
 LOADING_TIP_81: "'There are doors beneath the earth which were sealed not to keep thieves out, but to keep mercy in.' - warning attributed to a Northern mage before the Incident at Petramonis"
 LOADING_TIP_82: "The Great Collapse split Greater Luxterra, drowned ancient cities, weakened the Eldritch Forests, and reduced mighty civilizations to scattered embers. Few peoples escaped it unchanged."
 LOADING_TIP_83: "The High Elven Civil War began after the death of Atheus the Younger in 635 LC. Rival heirs tore at the slaver-empire until the Great Collapse forced an unofficial truce."
 LOADING_TIP_84: "The High Elven Peace was peaceful chiefly for the High Elves; for their oppressed subjects, it was a precious pause in which to recover, organize, and prepare resistance."
 LOADING_TIP_85: "The ancestors of the Sea Elves were High Elves shipwrecked upon the Central Omniluxian Isles. Mainland sailors often dismiss tales of blue-skinned mariners, which suits the Sea Elves perfectly."
 LOADING_TIP_86: "Na'athran brought saplings from the World's Lungs Forest to barren Anror Ta-Oswir. In exchange for making the islands bloom, the Sea Elves surrendered much of the longevity of their race."
 LOADING_TIP_87: "'You cannot catch a Sea Elf ship. If you have seen one twice, it is because its captain wished to see you again.' - Marenican sailor's proverb"
 LOADING_TIP_88: "The Sea Elves rule the eastern waters through vessels no mainland fleet can overtake. Contact with their hidden civilization occurs by their design, never by chance."
 LOADING_TIP_89: "The Yaga Trees of the Eldritch Forests produce unusually potent mana. The forests themselves are hostile to trespassers and have guarded elven peoples more faithfully than many armies."
 LOADING_TIP_90: "Although the Eldritch Forests regained much of their strength after the Great Collapse, their mana has never returned to its former abundance. Outsiders have exploited that weakness ever since."
 LOADING_TIP_91: "'Every tree remembers the axe, though the axe remembers only the work.' - Wendaghan saying"
 LOADING_TIP_92: "According to dwarven tradition, the Stone Father fashioned three brothers and three sisters from clay mixed with silver, gold, and copper, and from these pairs came the three dwarven races."
 LOADING_TIP_93: "Htgarth and Ferja emerged from the Silver Caves, Summsir and Ava from the Gold Caves, and Frei and Dwadais from the Copper Caves. Each pair founded a great dwarven realm."
 LOADING_TIP_94: "'Silver remembers, gold endures, and copper defies.' - traditional summary of the three dwarven kindreds"
 LOADING_TIP_95: "When the six dwarven founders died, their peoples returned them to the caves of their emergence. There they became great stones and were reunited with the Stone Father."
 LOADING_TIP_96: "The wars over which founding pair were the true heirs of the Stone Father helped end the Dwarven Golden Age, leaving the ancient kingdoms vulnerable to their enemies."
 LOADING_TIP_97: "Anempanso, the ancient realm of Frei and Dwadais, is translated as Skyreach - a fitting name for the forbidding mountains of the Copper Dwarves."
 LOADING_TIP_98: "Bad-Furqorin, the City of Cinnabar, survives on the wealth beneath its stones despite chronic hunger and near-constant attacks from goblin and Selaskusian tribes."
 LOADING_TIP_99: "Edis the Grim founded Bad-Furqorin upon the fertile Skyreach Steppes. His descendants still hold the fortress, although every generation fears it may be the last."
 LOADING_TIP_100: "'Stone does not boast that it has survived the storm. It simply remains when the storm has exhausted its name.' - proverb of Bad-Furqorin"
 LOADING_TIP_101: "The Copper Dwarves developed Donenforr, an ancient system of writing later adopted by their Gold and Silver cousins. Some tablets have outlived the kingdoms that commissioned them."
 LOADING_TIP_102: "The first great dwarven cities became fortified holds after the First Goblintide. What began as a refuge hardened into the defining shape of dwarven civilization."
 LOADING_TIP_103: "The Deep Gnomes descend from refugees who fled into the Deep Rift Valley after King Skol Skuuva committed the Great Sin by gazing upon Wielkopan's true form."
 LOADING_TIP_104: "Wielkopan cursed the Deep Gnomes never to see the Sun and abandoned them to Melodias. Their burning purple skin and hostility are remembered as marks of that ancient sentence."
 LOADING_TIP_105: "'The Sun forgot us first. We merely learned to return the insult.' - saying attributed to the Deep Gnomes"
 LOADING_TIP_106: "The Drow originated from High Elves driven into lightless caverns, where they survived by eating food corrupted by Melodias. The refuge preserved their lives and transformed their race."
 LOADING_TIP_107: "Hobgoblins arose through the mingling of Elven and Goblin blood under the influence of Melodias. Their conquest of Dragon's Pass expelled nearly all earlier inhabitants."
 LOADING_TIP_108: "The Treaty of Two Friends between Dolin Silver Dwarves and Kana'i goblins is a rare reminder that the ancient enemies of the mountains have not always chosen war."
 LOADING_TIP_109: "The Orcish Igeoris once tested the strength of would-be heirs upon Mount Arteth. Guer defeated King Onageter through divine trickery and returned bearing an obsidian stone and the dead king's crown."
 LOADING_TIP_110: "After overcoming Onageter, Guer taught the Orcs to cultivate the Inner Flame through reflection, isolation, and opium. Orcanites remember him as Gotzon, the Chosen."
 LOADING_TIP_111: "'Strength without stillness is only a fire in dry grass: bright, hungry, and soon gone.' - Orcanite meditation"
 LOADING_TIP_112: "The first Orcs emerged from the mists of Mount Arteth and spread across northern Morrigon. For ages, great warchiefs held authority through force, religion, and the favor of shamans."
 LOADING_TIP_113: "The Modern Dragkhanic race was made from the blood of Udanalankar, Last of the Dragons, who led his children across the Dragon Mountains into a homeland protected from their enemies."
 LOADING_TIP_114: "Old Dragons gained intelligence through the Servant's Pact with the Lord of the Winds. The price came later, when their children's minds were exchanged for the creation of vast Dragkhan hordes."
 LOADING_TIP_115: "'The dragon calls it inheritance; the village beneath its shadow calls it hunger.' - Borderlander saying"
 LOADING_TIP_116: "Wyrms once dominated Arteonia and exterminated its early settlements. Artheousan slew the beasts with the aid of the Victory Goddess and was thereafter worshipped as a god."
 LOADING_TIP_117: "The ancient religious quarrel of Arteonia asks whether Artheous was wholly human or a demigod. Centuries of argument have shed nearly as much blood as the Wyrms themselves."
 LOADING_TIP_118: "Vampires may arise from any race. They draw vigor from blood and possess unnatural strength, but sunlight, wooden weapons, and garlic remain common weaknesses."
 LOADING_TIP_119: "Three Arungdirong princes accepted a Vampire Lord's dark covenant: power and eternal life in return for his curse. Their bloodlines still rule hidden houses in northern Arteon."
 LOADING_TIP_120: "'An immortal prince has forever to learn wisdom, and forever to avoid it.' - southern Arteonian proverb"
 LOADING_TIP_121: "A vampire ruler may establish an Undying Court, extending dominion through enthralled servants, sealed crypts, and a cold mist that refuses to lift."
 LOADING_TIP_122: "The ancestors of the Wraiths were cast into a chasm by the Great Collapse. Centuries in the void changed them into beings whose gaze and touch spread black corruption."
 LOADING_TIP_123: "Most mortals who behold a Wraith die before they can turn away, their souls consumed by the darkness that clings to the creature."
 LOADING_TIP_124: "'When the lantern burns black, do not pray, do not stare, and do not wait for your companions.' - warning carved near the Chasm Lands"
 LOADING_TIP_125: "Magic is the shaping of reality through imagination, fueled by the life-force called mana. Magonis the Wise gave that force the name by which nearly every later school knows it."
 LOADING_TIP_126: "The Primordial Wells were formed from the dispersed essence of the last Kosmonic Being and became the foundation of mana throughout Omniluxia."
 LOADING_TIP_127: "The Party of Great Heroes sealed the Primordial Wells to shield the mortal races from Melodias. The seal beneath Petramonis endured until Theolosius chose desperation over caution."
 LOADING_TIP_128: "'A spell begins as a wish, matures into a calculation, and ends as somebody else's problem.' - academy joke attributed to Magonis the Wise"
 LOADING_TIP_129: "The Mycelar are joined through the vast fungal networks beneath the New World. Whispers and secrets pass through the deep earth more patiently than any mounted courier."
 LOADING_TIP_130: "Those who bear the Blood of the Deep Mycelium are regarded as living avatars of the Great Mycelium, commanding the obedience of Sporn and Verdhan alike."
 LOADING_TIP_131: "'Let the young races burn brightly. Beneath their battlefields, we are growing.' - Mycelar teaching"
 LOADING_TIP_132: "The Mycelar reproduce slowly and measure the growth of civilization in centuries. Empires rise and vanish while their subterranean gardens advance by inches."
 LOADING_TIP_133: "The winged Ayrith have ruled the high aeries of the New World since before Old World sails appeared on the horizon. Their peoples include the Ayrithi, Condar, and Skrael."
 LOADING_TIP_134: "The Blood of the High Aerie marks descendants of the first Winged Lords, whose covenants bound their lineages to the winds and the sovereignty of the mountain fastnesses."
 LOADING_TIP_135: "'Those who rule the valley argue over roads. Those who rule the peak decide where the storm shall travel.' - Ayrithi court saying"
 LOADING_TIP_136: "Illorian civilization won freedom from Razani rule in 912 LC, yet the cities of the Marenica Sea have enjoyed only brief intervals of independence since the Zani-Illorian Wars."
 LOADING_TIP_137: "The Marenican Sea Trade enriches republics, ancient Aollan cities, Helluvian domains, and foreign merchants alike - which is why peace upon the Great Green Sea never lasts."
 LOADING_TIP_138: "Ioninna is counted among the last bastions of old Illorian tradition, while the Shannah seeks to turn spiritual supremacy into temporal power across the Marenica Sea."
 LOADING_TIP_139: "'Every Marenican treaty has three signatures: the prince's, the merchant's, and the pirate's, though the last is written in invisible ink.' - Phanician proverb"
 LOADING_TIP_140: "Werhenlander kingdoms drove the northern Pollians close to extinction before turning their ambitions toward the divided Ullydian states of Yr-Marrenica."
 LOADING_TIP_141: "Omniluxia has known the Omnic, Mythic, Wonder, Human, Zanic, Post-Zanic, and Changing Ages. Chroniclers disagree on their boundaries, but all agree that each age ended sooner than its rulers expected."
 LOADING_TIP_142: "The Forest Elves preserve their oldest histories in Weylls, enchanted tapestries whose woven patterns record the deeds and memories of ages long past."
 LOADING_TIP_143: "'A historian requires ink, a king requires gold, and a survivor requires a good pair of boots.' - Geallian proverb"
 LOADING_TIP_144: "The World's Lungs Forest was created by Mother Earth alongside the first Elves. Its distant saplings later gave life to the barren homeland of the Sea Elves."
 LOADING_TIP_145: "The Old Dragkhans overwhelmed the Terran Coalition at the Battle of the Dragon's Head, where the six dwarven founders and the great Elven Kings met their end."
 LOADING_TIP_146: "'Never ask a goblin how he entered your fortress. Ask how many of his cousins followed him.' - Song of the Silver Dwarf"
 LOADING_TIP_147: "The Peaceful Valley was fashioned as a paradise by Wielkopan and called Jaaltuvesk by the Gnomes. Its peace ended when their king dared to gaze upon the god's true form."
 LOADING_TIP_148: "The Central Omniluxian Isles hide more than Sea Elven cities. The second High Elven Slaver Fleet vanished there so completely that no further fleet dared follow."
 LOADING_TIP_149: "'The world has ended many times. Fortunately, the people have never been consulted on the matter.' - anonymous Post-Zanic chronicler"
 LOADING_TIP_150: "The Aentoran faith teaches that life and death exist in eternal balance, embodied by the divine twins Aentora and Muerthos."
 LOADING_TIP_151: "Aentora, Goddess of Life, sent Kulnnona the Everything-King to drive the monstrous Muerthans from Marrenica and establish the homeland of the Aentora-Torr."
 LOADING_TIP_152: "Though Muerthos is feared as the God of Death and antagonist of humanity, Aentorans acknowledge him as the necessary opposite of his life-giving twin."
 LOADING_TIP_153: "'Life builds the house; death reminds the king that he is only a guest.' - Aentoran proverb"
 LOADING_TIP_154: "Aneic worship centers upon Mother Cafea and the Idrasil, divine aspects governing the many parts of nature and daily life."
 LOADING_TIP_155: "Most Aneids hold their ceremonies beneath the forest canopy rather than inside marble temples, believing in the Oneness of Nature."
 LOADING_TIP_156: "Wood Elven faiths are traditionally pacifist and favor defensive war, although the diversity of forest cults makes any simple rule dangerous."
 LOADING_TIP_157: "'A temple has a roof because its god is far away. Cafea needs no roof.' - Wood Elven saying"
 LOADING_TIP_158: "The militarized Aralans inhabit southern Rohenevia, where every prince rules his own lands like a king and guards his autonomy fiercely."
 LOADING_TIP_159: "Aralan boys train for war and hunting from youth, while elaborate systems of fealty prevent their intensely competitive society from splintering completely."
 LOADING_TIP_160: "'An Aralan bows only to inspect the ground upon which his rival will fall.' - Rohenoan jest"
 LOADING_TIP_161: "In the year 1001, Ara Sertem rules Baetep with ambition and cruelty, determined to prevent the Djedhid dynasty from reclaiming the throne it lost nearly nine centuries ago."
 LOADING_TIP_162: "The Sertem dynasty descends from Srandenr Sertem, an admiral rewarded by Zanis with the governorship of Baetep before his heirs betrayed the weakening empire and seized the valuable province for themselves."
 LOADING_TIP_163: "'A throne belongs to whoever can keep the last claimant from sitting upon it.' - saying attributed to Ara Sertem"
 LOADING_TIP_164: "The Naga are descended from human slaves of the former Ular-Pria Empire and possess the forms of half-serpents."
 LOADING_TIP_165: "Rejected by humans and treated as inferiors by Snakefolk, Austropetolian Naga communities prize martial skill because neither world can be trusted to protect them."
 LOADING_TIP_166: "'Two worlds rejected us; therefore we learned to stand between them with spears.' - Naga saying"
 LOADING_TIP_167: "The Baetepian Order of Khetet contains only the first three generations of native gods, excluding the feared fourth generation foretold to surpass Atepr."
 LOADING_TIP_168: "Dekh-Sedjet is the Baetepian god of wisdom who mediates divine quarrels, while Shetop the Lioness Goddess embodies ruthless discipline."
 LOADING_TIP_169: "Native Baetepian worship survived suppression by both Zani and Sertem rulers, preserved by believers loyal to the True Pharon of Dune."
 LOADING_TIP_170: "'The false god demands a statue; the old gods require only that we remember.' - Baetepian saying"
 LOADING_TIP_171: "The Blood-Stained pantheon includes Eteus of War, Dhilotl of Culture, Godur of Fertility, and Phamir of Economy. Its rites are steeped in conquest and blood."
 LOADING_TIP_172: "Some desperate Norrfalians adopted the Blood-Stained faith of the very Drow who ravaged their lands after the Balthazarian Knights failed to protect them."
 LOADING_TIP_173: "'If the gods drink blood, see that the cup is filled by your enemy.' - Blood-Stained maxim"
 LOADING_TIP_174: "The Great Borderlander Revolt freed the Native Morrigonians from Nazani rule, but victory did not persuade their fiercely independent tribes to unite."
 LOADING_TIP_175: "The Leslesi betrayal drew the vengeance of re-emergent Silver Dwarven kingdoms against the Borderlands. Old mountain grudges are rarely measured in human lifetimes."
 LOADING_TIP_176: "The southern Marshlanders have maintained an uneasy seven-year peace with the Nazani, even as rumors warn of Soventeir ambitions."
 LOADING_TIP_177: "'A Borderlander alliance lasts until the enemy leaves, and sometimes not quite that long.' - Morrigonian proverb"
 LOADING_TIP_178: "The insectoid Chivix share the collective consciousness of the Hive Concord, giving each individual a purpose from the moment of hatching."
 LOADING_TIP_179: "Chivix lives are short, but their numbers grow rapidly and their coordination allows them to raise great cities where wilderness once stood."
 LOADING_TIP_180: "The Blood of the Hive Queen links Chivix rulers to the collective memory and chorus of their civilization."
 LOADING_TIP_181: "Chivixi fill the central hives, Mantheen build fortresses, and Hkkru range far afield as hunting parties."
 LOADING_TIP_182: "'The lone voice asks what must be done. The Hive has already begun.' - Chivix maxim"
 LOADING_TIP_183: "The prized silk spun from Chivix spinnerets could become the foundation of a realm remembered as the Silk Court."
 LOADING_TIP_184: "The Soveneria Dragkhans exploited the Second Marshlander Revolt to seize the Nazani province of Kainaxarthos."
 LOADING_TIP_185: "Uttarasmake the Great was proclaimed Qhagan in 868 LC and led the Sovenerians toward Helluvianism and Geallian customs."
 LOADING_TIP_186: "The Soventeir Empire claims to be a legitimate heir of the Zani Empire despite its Dragkhanic origins. It is now among Morrigon's great powers."
 LOADING_TIP_187: "'An heir is merely a conqueror who arrives carrying genealogies instead of ladders.' - Kainaxari saying"
 LOADING_TIP_188: "The Drow recently emerged beneath the Wild Northlands and overran tribes around the Norrfalian Sea, whose defenders never expected armies from mountain caves."
 LOADING_TIP_189: "A defeat at Svardenni left the Drow determined to avenge their fallen and recover Iolsim, the land now held by the human Kingdom of Herue."
 LOADING_TIP_190: "Surface coalitions formed to contain the Drow, but Blood-Stained influence spread beyond the borders won by their armies."
 LOADING_TIP_191: "'Watch the road if you fear men. Watch the mountain if you fear Drow.' - Norrfalian warning"
 LOADING_TIP_192: "Duggmannrum is one of six Silver Dwarven kingdoms in the Green Valley, risen from the old principality of Duggmannri."
 LOADING_TIP_193: "The young king of Duggmannrum dreams of restoring the Second Kingdom of Srrørum and claims the legacy of Hefdarr 'to Tögg.'"
 LOADING_TIP_194: "Duggmannrum covets the soul-gem mines held by the Guardians of the Eastern Gate, whose allegiance could secure the kingdom against Elven raiders."
 LOADING_TIP_195: "The Sennmöggen Knights are counted among the finest troops of the Green Valley, heirs to a military tradition older than many human states."
 LOADING_TIP_196: "Duggmannrum imports human mages from oppressed Soveneria to enlarge its small and mistrusted community of Silver Dwarven spellcasters."
 LOADING_TIP_197: "'A rival divided is a border defended.' - Duggmannri political maxim"
 LOADING_TIP_198: "The Eagelian Kingdom became an oligarchy after a mob killed Tzunnenun the Cruel, but noble intrigue soon produced another puppet king."
 LOADING_TIP_199: "Dbunnpun the Fat was the last Eagelian king. Zanis rebuilt the army, won popular favor, and overthrew him in 44 LC."
 LOADING_TIP_200: "Eagelian traditions survived within Zanic religion, calendar-keeping, statecraft, and the imperial claim to rule every Geallian people."
 LOADING_TIP_201: "The Esquelian Rezishus once tested whether a chieftain could defend himself through argument as effectively as through combat."
 LOADING_TIP_202: "Under Zanic influence, elected Esquelian war leaders became hereditary chiefs and the Rezishus declined into a performance staged by loyal supporters."
 LOADING_TIP_203: "Geallians adopted Esquelian mock Rezishus as training in oral debate, much to the displeasure of traditional Geallian orators."
 LOADING_TIP_204: "'A weak chief fears criticism. A clever chief hires it.' - Esquelian proverb"
 LOADING_TIP_205: "Fai are woodland creatures transformed by the filtered mana of Yaga Trees into magical and frequently terrifying beings."
 LOADING_TIP_206: "The mana that grants Fai sentience and long life also drives most of them insane, making the deepest Eldritch Forests deadly to outsiders."
 LOADING_TIP_207: "Some tales of powerful Fai correspond with accounts from the Mythic Age, leading scholars to suspect that the oldest may be nearly immortal."
 LOADING_TIP_208: "Fai despise bright light, fade easily into shadow, and help ensure that only Forest Elves can live sustainably within the Eldritch Forests."
 LOADING_TIP_209: "'If the deer speaks your name, it is already too late to wonder where it learned it.' - Eldritch Forest warning"
 LOADING_TIP_210: "A human exposed to the deepest Eldritch Forest for roughly seventy years may complete the rare transformation into a Wendaghan."
 LOADING_TIP_211: "Wendaghans are described as seven-foot, antlered humanoids with hollow eyes, no mouths, and three long clawed fingers on each hand."
 LOADING_TIP_212: "The uncertain behavior of a Wendaghan is part of its terror: it may ignore one traveler and savagely kill the next without apparent reason."
 LOADING_TIP_213: "The four strongest beings remaining after the Primordials faded or slept are Wishtheon, Wielkopan, Na'athran, and Melodias."
 LOADING_TIP_214: "Wishtheon urged Zanis to travel west and open his sealed Well, but the Emperor never completed that divine invitation."
 LOADING_TIP_215: "Na'athran's Primordial Well lies in the far east, distant from the lands most familiar to Luxterran chroniclers."
 LOADING_TIP_216: "'A sealed god is still a god. It is merely one with fewer opportunities to disappoint us.' - Post-Zanic theological joke"
 LOADING_TIP_217: "Forest Elves were created by Mother Cafea to protect the forests and guide the creatures living beneath their boughs."
 LOADING_TIP_218: "Forest Elven societies vary widely, but reverence for the living forest binds peoples separated by great distances and divergent customs."
 LOADING_TIP_219: "The Geallian League was founded in 184 BLC by northern states seeking common protection against external threats."
 LOADING_TIP_220: "'A Geallian can forgive an insult, provided he is given a public square in which to answer it.' - Ytalian jest"
 LOADING_TIP_221: "Gnomes were created by Wielkopan to share his Peaceful Valley, but later demanded the right to be ruled by a king of their own race."
 LOADING_TIP_222: "Wielkopan permitted Skaal Skuuva to become the first Gnomish king; his son's forbidden curiosity later brought ruin upon Jaaltuvesk."
 LOADING_TIP_223: "The Waal language is spoken chiefly by Mudskvas Gnomes, with distinct dialects among the Vdaami and Saav tribes."
 LOADING_TIP_224: "Goblins began as Wishtheon's thwarted attempt to create humanity, disfigured by Mother Earth and cast into the world's caves."
 LOADING_TIP_225: "The First Goblintide drove into the caverns around 29,000 BLC and helped force the surviving dwarven cities to become fortified holds."
 LOADING_TIP_226: "'A goblin sees no abandoned tunnel, only a road whose toll has not yet been collected.' - dwarven proverb"
 LOADING_TIP_227: "Gold Dwarves trace their ancestry to Summsir and Ava, the middle pair fashioned by the Stone Father."
 LOADING_TIP_228: "The ancient Azari realm of Mâhdad Sho-Tan'Mâat Mâ'Azarî flourished in the Iron Foothills before invasions and civil wars shattered its Golden Age."
 LOADING_TIP_229: "Etemenazari, the great Ziggurat of the Azari, was destroyed after Zanis conquered the Golden Dwarven kingdom."
 LOADING_TIP_230: "'Gold buried in a mountain is wealth. Gold carried away from a mountain is slavery.' - Azari saying"
 LOADING_TIP_231: "Halflings descend from unions between Humans and Copper Dwarves, carrying traits and traditions from both peoples."
 LOADING_TIP_232: "Half-Elves live between human and elven worlds, and their mixed ancestry has produced communities distinct from either parent people."
 LOADING_TIP_233: "Helluvians worship Hellas as the Creator of All Things That Can Never Be Known and recognize the Shannah as head of their organized faith."
 LOADING_TIP_234: "The Shannah rules from the Apostolic Palace at Ddu-Nuinop and may call a crusade when Hellas makes his will known."
 LOADING_TIP_235: "Helluvianism erodes the religious unity once provided by the Cult of Zanis throughout the eastern successor states."
 LOADING_TIP_236: "'If the Creator can never be known, beware the man who claims to know exactly whom He hates.' - Illorian skeptic's saying"
 LOADING_TIP_237: "Atheus the Conqueror commanded a slaver fleet that raided Luxterra and Polaria before establishing a High Elven realm at Ousred'Eson."
 LOADING_TIP_238: "Atheus repeatedly outmaneuvered Horteonian enemies during wars that lasted across his unnaturally long life."
 LOADING_TIP_239: "By the Third Atheusian-Horteonian War, human slave labor allowed High Elven society to turn nearly every free male into an elite soldier."
 LOADING_TIP_240: "'An empire that makes slaves build everything eventually discovers that its masters have forgotten how.' - Horteonian saying"
 LOADING_TIP_241: "Illorian cities regained freedom from Razani rule in 912 LC, but rivalry around the Marenica Sea quickly replaced imperial unity."
 LOADING_TIP_242: "The Old Believers survive at the fringes of the Illorian world while Helluvian rulers seek to extend their faith across the Great Green Sea."
 LOADING_TIP_243: "Bachin met the warrior Jaoz during his travels, and together the two prophets received later revelations and began the Jaxan Conquests."
 LOADING_TIP_244: "Bachin wrote the Uphin, the central collection of Zain'ud's teachings, as well as the theological and political work known as the Musings."
 LOADING_TIP_245: "Bachin died at the age of sixty-seven and was buried at Nunahnu, leaving Jaoz as the martial face of their shared revelation."
 LOADING_TIP_246: "'A revelation heard by one man begins a faith; heard by an army, it begins an age.' - Zainudian saying"
 LOADING_TIP_247: "Jarenam the Formidable was a Dragkhanic conqueror whose invasion carved a new empire across the eastern lands."
 LOADING_TIP_248: "After Jarenam's death, Sakhir Totrazi seized control as Qhagan, demonstrating how quickly conquest turns into succession."
 LOADING_TIP_249: "The Jarenamid realm is crumbling by 1000 LC, but remains dangerous enough to threaten the Zainudian holy city."
 LOADING_TIP_250: "'The dragon conquers with flame; his heirs conquer one another with genealogy.' - eastern proverb"
 LOADING_TIP_251: "The Kingdom of Dune preserves native Baetepian rule and presents its Pharon as the rightful alternative to the Sertem dynasty."
 LOADING_TIP_252: "Djedhid rulers of Upper Dune seek to restore a throne lost through centuries of Zani and Sertem domination."
 LOADING_TIP_253: "The Kingdom of Herue occupies lands once held as the Drow kingdom of Iolsim and remains a target of Drow reconquest."
 LOADING_TIP_254: "Civil wars weakened Herue and the Balthazarian Knights, leaving Norrfalian communities exposed to invasion and religious upheaval."
 LOADING_TIP_255: "The Kingdom of Ytalia was entrusted to Cyrogelos after his loyalty helped secure Zani rule over the Ytalians."
 LOADING_TIP_256: "Ytalia guards the Golden Pathway but is divided between devotion to the Cult of Zanis and the spread of Helluvianism."
 LOADING_TIP_257: "'A pathway is golden chiefly because every conqueror wishes to own it.' - Ytalian merchant's saying"
 LOADING_TIP_258: "The Kinones evolved from the ancient proto-humans and count their history through successive ages marked by migrations and new homelands."
 LOADING_TIP_259: "Kinones entered Wielkopan's Peaceful Valley long after the Gnomes were banished, beginning another age of their people."
 LOADING_TIP_260: "Magic schools divide their arts into styles such as Aldic manipulation, Amten elemental practice, and specialized traditions of stone, soul, and charm."
 LOADING_TIP_261: "Aldic illusionists can bolster an army's confidence, deceive observers, damage minds, and at their greatest heights alter physical shape."
 LOADING_TIP_262: "Amten elementalists detect minerals, provide irrigation, summon violent winds, and hurl fire against besieged fortifications."
 LOADING_TIP_263: "Druidic Amten magic encourages plant growth, restores health, and can transform a forest into both granary and fortress."
 LOADING_TIP_264: "'The difference between irrigation and a flood is whether the mage has been paid.' - a Mage Academy joke"
 LOADING_TIP_265: "Melodias is one of the Four Great Gods and the dark power whose influence created or transformed several subterranean peoples."
 LOADING_TIP_266: "The Party of Great Heroes sealed Melodias into the final Primordial Well after she threatened the future of humanity."
 LOADING_TIP_267: "Mother Earth created the first Elves and later helped shape the proto-humans from whom modern humanity emerged."
 LOADING_TIP_268: "After believing her children safe, Mother Earth joined the Stone Father in eternal slumber. Their absence left later ages to lesser gods and mortals."
 LOADING_TIP_269: "The Nazani Empire is the western successor of the Zani state, ruled by a dynasty styling itself as the Empire of the West."
 LOADING_TIP_270: "Nazani rulers present a stable and cautious face to their neighboring states while secretly supporting Orcish settlements intended to destabilize the Borderlands."
 LOADING_TIP_271: "'The Purple Phoenix rises carefully from the flames, after first ensuring that its neighbor's roof is burning from the fire of its creation.' - Borderlander accusation against the Nazani"
 LOADING_TIP_272: "The Razani Empire rules the eastern Zani heartland from the Unconquered City, but an aging dynasty and uncertain succession threaten civil war."
 LOADING_TIP_273: "The Razani Theon System empowers entrenched vassals whose privileges make imperial reform difficult and rebellion tempting."
 LOADING_TIP_274: "Razani authorities executed Zorgolis after his campaign for reform, only to see riots and fires spread through their capital."
 LOADING_TIP_275: "The Old Pantheon preserves divine traditions older than the ascendant faiths that now contest the Zani successor states."
 LOADING_TIP_276: "The Order of Sennmöggen supplies elite knights whose loyalty could decide which Silver Dwarven kingdom unites the Green Valley."
 LOADING_TIP_277: "Polarians survive a climate so bitter that warmth, hospitality, and comfortable interiors have become matters of cultural pride."
 LOADING_TIP_278: "'A Polarian locks out the cold, never the traveler fleeing it.' - Polaric saying"
 LOADING_TIP_279: "The Cult of the Soul teaches that fragments of the dead become trapped in soulgems and that consuming such a gem means consuming a soul."
 LOADING_TIP_280: "Rzezimir discovered that eating soulgems empowered a mage while driving him mad, and from his followers arose the Soul Devourers."
 LOADING_TIP_281: "The Cult of the Soul began at Starogod among elixir-brewers rejected by the established schools of the Jelenia University of Magecraft."
 LOADING_TIP_282: "'Power whispers from the gem because madness has not yet taught it to shout.' - warning of Starogod"
 LOADING_TIP_283: "The Stellarics believe luminous Visitors emerged from a fallen Star in Northstar Bay, taught them their faith, and built their earliest cities."
 LOADING_TIP_284: "Stellaric Guildmasters govern from an ancient city within a city, the famed Stellaric Guildhouses, a magnificent wonder sheltered by the Tayngvw Mountains near Northstar Bay."
 LOADING_TIP_285: "Ying-Pin commands storms in Stellaric belief, while Renjuun is invoked by those seeking martial glory."
 LOADING_TIP_286: "Stellaric artisans combine prized dyes and glass into celebrated stained glass, while the Bloody Peninsula supplies red beryls and potent brandy."
 LOADING_TIP_287: "The proposed Stellaric Consortium would unite the faithful as an economic and religious bulwark against Drow and Norrskalkiean enemies."
 LOADING_TIP_288: "'Credit travels farther than an army and demands better quarters when it arrives.' - Stellaric Guildmaster's proverb"
 LOADING_TIP_289: "Sunset Elves worship Aheol, a wrathful solar god whose rays may destroy life or bless the faithful with rich harvests."
 LOADING_TIP_290: "Through the Amahario Ritual, a worshipper offers blood to Aheol in exchange for the Sun God's favor."
 LOADING_TIP_291: "The Sunset Elves credit Aheol with rescuing them from the worship of Cafea and granting victory over their enemies."
 LOADING_TIP_292: "Viktreic worship divides victory into Vike over invaders, Vale through cultural survival, and Vona over hostile nature."
 LOADING_TIP_293: "The Goddess of Victory revealed herself after the Zani conquest of the Esquelians and became a divine symbol of resistance."
 LOADING_TIP_294: "The Vothkin carve nearly unbreachable cities into the mountains of the New World and bind solemn oaths in stone and blood."
 LOADING_TIP_295: "The Blood of the Stone Forge carries sacred knowledge of deep delving and ancient runes among Vothkin rulers and craftsmen."
 LOADING_TIP_296: "Vothkini inhabit subterranean cities, Volthari hold the highlands, and Grimmel dwell in mountain halls where the forges burn without rest."
 LOADING_TIP_297: "Yedidyhan is said to have emerged from the hills of Yehya after Melodias was released, becoming progenitor and patron of vampires."
 LOADING_TIP_298: "The alien Zorg arrived aboard a triangular-prism ship said to be miles wide, which was apparently destroyed when it struck Omniluxia."
 LOADING_TIP_299: "Every known Zorg has identical genetic material, reddish skin, and wide, piercing eyes, leaving scholars unsure whether the newcomers are truly living beings."

