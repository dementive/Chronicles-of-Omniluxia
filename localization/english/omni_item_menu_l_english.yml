 omni_items.1.t:0 "Equipment"
 omni_items.1.desc:0 "You review what [ROOT.Char.GetName|Y] carries. What would you like to do?"
 omni_items.1.equip:0 "#Y Equip an item#!"
 omni_items.1.unequip:0 "#Y Unequip an item#!"
 omni_items.1.discard:0 "#R Discard an item#!"
 omni_items.1.close:0 "Close"
 omni_items.2.t:0 "Equip an Item"
 omni_items.2.desc:0 "Choose an item to equip. Only items [ROOT.Char.GetName|Y] owns and has an open slot for are shown."
 omni_items.3.t:0 "Unequip an Item"
 omni_items.3.desc:0 "Choose an item to unequip. It stays in the inventory and can be equipped again later."
 omni_items.4.t:0 "Discard an Item"
 omni_items.4.desc:0 "Choose an item to discard. This removes it from [ROOT.Char.GetName|Y] permanently, along with any bonus it granted."
 omni_items.5.t:0 "Sell an Item"
 omni_items.5.desc:0 "[SCOPE.sChar('omni_item_merchant').GetName|Y] waits among the stalls of [SCOPE.sP('omni_item_market_province').GetName|Y], ready to appraise what [ROOT.Char.GetName|Y] carries. Choose an item to sell for gold. The sale is final."
 omni_items.6.t:0 "Outfit Your Armies"
 omni_items.6.desc:0 "[SCOPE.sChar('omni_item_merchant').GetName|Y] has laid out a selection of goods gathered from the markets of [SCOPE.sP('omni_item_market_province').GetName|Y]. Commissioning a design equips it across your realm; your #Y Ruler #! equips a fine example (personal bonus), while your #Y armies#! adopt it nationwide (a country-wide bonus). You may field one weapon, one ranged weapon, one armor, and one shield at a time; a new commission replaces the old. Wealthier, larger, and more civilized local markets can draw rarer wares.\n\nIf no items appear in the shops, it is because you do not have enough money to purchase anything."
 omni_items.7.t:0 "City Buildings"
 omni_items.7.desc:0 "Which building would you like to visit?"
 omni_items.7.desc.small.1:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] rises modest and unhurried, a huddle of thatch and timber wrapped around a single crooked square, with just enough streets and rooftops to make a proper market and not much else. The air hangs thick with the scent of fresh-baked bread, turned earth, and the curling smoke of a few hardworking hearths.\n\nIt is no grand city, but it is alive in the way small places are alive - every face is known, every stranger is marked, and even gossip travels as a whisper passed hand to hand rather than shouted from the rooftops. Which corner of [ROOT.GetCharacter.GetLocation.GetName|Y] would you like to visit?"
 omni_items.7.desc.small.2:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] is a small jewel cupped in the land's palm, its lanes narrow and winding, its market crowded only on the brightest of days. The town watch knows the names of half the souls who pass beneath its timeworn gate.\n\nStill, the town has its own pulse: smiths hammer bright sparks into the dusk, children laugh between the eaves, and a patient old innkeeper keeps the hearthfire burning for whoever wanders in after dark. There are simple pleasures to be found here in [ROOT.GetCharacter.GetLocation.GetName|Y] - which would you like to seek out?"
 omni_items.7.desc.small.3:0 "The streets of [ROOT.GetCharacter.GetLocation.GetName|Y] are few, but they hum busily enough to raise a trail of dust and chatter from one crooked end to the other. The local merchants have learned exactly how much coin to squeeze from anyone wearing decent boots.\n\nA visitor can hear goats bleating, cartwheels groaning, and neighbors quarreling from one end of the place to the other - proof enough that the town has a heart, however small it beats. Which building would you like to visit?"
 omni_items.7.desc.small.4:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] does not sprawl; it clings, close-built and huddled, its houses packed shoulder to shoulder as though the town itself begrudges wasting a single span of ground.\n\nThat makes every step feel deliberate. A baker calls out to a fishmonger, a child chases a squawking hen down the lane, and everyone knows exactly who borrowed from whom, and who still has not paid it back. Where would you like to spend your time in [ROOT.GetCharacter.GetLocation.GetName|Y]?"
 omni_items.7.desc.small.5:0 "From a distance, [ROOT.GetCharacter.GetLocation.GetName|Y] looks like a handful of weathered roofs huddled together beneath the open sky. Up close, it grows more complicated: a shrine hung with fresh-cut flowers, a well loud with gossip, a market that opens only when the sun deigns to smile, and a tavern where every patron swears he knows a shorter road than the next man.\n\nIt is not large, but it is stubbornly, unmistakably lived in. Which of its few doors will you knock upon?"
 omni_items.7.desc.small.6:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] survives on instinct and old habit, its walls plain and practical, its cobbles worn smooth by generations of hurrying feet. Its people have long since learned the art of making much from little.\n\nA few carts, a few soldiers, a few merchants, and a great many stubborn opinions are all it takes to keep the place turning. What business brings you here today?"
 omni_items.7.desc.small.7:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] is the sort of place where a visitor hears every trade grievance in a single afternoon. The baker laments his flour, the tanner curses the rain, and the guardsman grumbles at everything else besides.\n\nThe town has shaped itself into a practical little knot of streets, built for endurance rather than grandeur. Which of them would you like to walk?"
 omni_items.7.desc.small.8:0 "The town of [ROOT.GetCharacter.GetLocation.GetName|Y] is small enough that its single bell tower still feels like a wonder. Its lanes carry the mingled smells of simmering stew, damp wool, and penned livestock, all stirred together on the evening breeze.\n\nIt is the kind of place where even a minor festival feels like a grand occasion worth remembering for a year. What would you like to do while you are here?"
 omni_items.7.desc.small.9:0 "There is a rough charm to [ROOT.GetCharacter.GetLocation.GetName|Y]. The roads are not wide, the stalls are not many, and its people have had to build with care against whatever fortune allowed them.\n\nThat has not made them dull. It has made them determined. There are a few services to be found here in [ROOT.GetCharacter.GetLocation.GetName|Y] - which would you like to visit?"
 omni_items.7.desc.small.10:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] is a little town with a loud soul. Somewhere a smith is swearing at a stubborn nail, somewhere a baker is singing off-key, and somewhere a child is dragging a mutt through the dust as though it were the grandest parade in the world.\n\nThe whole place feels hand-built, stone by stone and story by story - which is often the finest kind of town there is. Which building would you like to visit?"
 omni_items.7.desc.mid.1:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] has grown beyond a mere market town and claimed a rhythm all its own. Its roads are busier now, its houses climb taller, and its merchants shout over one another with newfound confidence.\n\nThere are enough souls here that every errand becomes a small pilgrimage through half the city, and enough noise that no one could mistake the place for sleepy any longer. There is much to see in [ROOT.GetCharacter.GetLocation.GetName|Y] - which district would you like to visit?"
 omni_items.7.desc.mid.2:0 "In [ROOT.GetCharacter.GetLocation.GetName|Y], the streets stir from first light until deep dusk. Bakers, scribes, caravan guards, potters, and priests all cross paths beneath the same weathered eaves, each certain their labor matters most.\n\nThe city presses outward against its own walls, restless and ever hungry to grow. Where would you like to begin?"
 omni_items.7.desc.mid.3:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] is large enough that strangers can lose themselves in it, yet small enough that no one truly vanishes. It has become a busy knot of workshops, taverns, shrines, and counting houses.\n\nThe sound of commerce fills every corner: hammers ringing, hooves clattering, coin changing hands, and the occasional shout of a pickpocket who has chosen the wrong purse. Which building would you like to visit?"
 omni_items.7.desc.mid.4:0 "The city of [ROOT.GetCharacter.GetLocation.GetName|Y] feels woven rather than built. Its roads curl and bend with a will of their own, its markets spill gladly into neighboring squares, and its citizens move with the easy confidence of people who know every stone by heart.\n\nEven so, there is still room for wonder. A single new caravan can send half the city rushing to the gates in an instant. Where shall we send you?"
 omni_items.7.desc.mid.5:0 "There is a strong pulse to [ROOT.GetCharacter.GetLocation.GetName|Y]. Its lanes are lined with craftsmen at their benches, its plazas thick with rumor, and the air carries smoke, spice, and the damp boots of travelers who arrived long before dawn.\n\nA city this size has enough gold to glitter, enough poverty to gossip about, and enough ambition to argue with itself from sunup to starlight. There are many services to be found here in [ROOT.GetCharacter.GetLocation.GetName|Y] - which would you like to visit?"
 omni_items.7.desc.mid.6:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] has learned the art of being useful. Fortune may not have been generous to it, yet the city has turned every ledge, field, and courtyard into something productive.\n\nIt hums with workshops, carts, and neighborhood quarrels - all of them the unmistakable signs of a place that has made itself indispensable. Which of its many trades would you like to seek out?"
 omni_items.7.desc.mid.7:0 "A traveler walking through [ROOT.GetCharacter.GetLocation.GetName|Y] will notice its layers before anything else. Old stone walls sit beside newer towers, fresh paint hides worn plaster, and every district seems to be growing in its own slightly different direction.\n\nThe people have shaped their streets with patient hands, and the result is practical, lively, and just chaotic enough to be endlessly interesting. Which building would you like to visit?"
 omni_items.7.desc.mid.8:0 "The markets of [ROOT.GetCharacter.GetLocation.GetName|Y] keep a marching rhythm all their own. In the squares, porters shoulder through the crowds, fishmongers bellow at innkeepers, and children dart between carts with the confidence of seasoned thieves.\n\nThe city never sits still, not for a single moment. What would you like to do while you are here?"
 omni_items.7.desc.mid.9:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] has the healthy disorder of a city that matters. Its streets are packed, its buildings patched and patched again, and every district nurses its own quarrel over who owns the loudest alley.\n\nEven the land itself seems drawn into the conversation, pressed into the city's endless service. Which corner would you like to explore?"
 omni_items.7.desc.mid.10:0 "The bustle of [ROOT.GetCharacter.GetLocation.GetName|Y] is impossible to ignore. On one side of the avenue, laborers unload sacks of grain; on the other, tailors, gamblers, and wandering philosophers compete for attention as though each were equally vital to the city's survival.\n\nThat is the secret of any thriving city: everyone believes they are necessary, and more often than not, most of them are. Which building would you like to visit?"
 omni_items.7.desc.mid.11:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] balances neatly between comfort and commotion. It holds enough people to make every market vibrant, enough soldiers to keep every thief nervous, and enough trade to keep every dock, road, and granary humming with labor.\n\nThe city thrives on the bounty around it, and repays that bounty by emptying cart after cart into its own crowded streets. Where would you like to spend your time?"
 omni_items.7.desc.mid.12:0 "In [ROOT.GetCharacter.GetLocation.GetName|Y], the day begins with shouting and ends with music. Between those two moments, the city fills with the honest labor that makes civilization possible: grain weighed, cloth cut, children taught, shutters mended, and gossip endlessly refined.\n\nNothing slows such energy. It has simply become part of the city's very character. Which building would you like to visit?"
 omni_items.7.desc.mid.13:0 "The city of [ROOT.GetCharacter.GetLocation.GetName|Y] carries itself with confidence now. It has outgrown its rougher edges and become the sort of place where visitors linger far longer than they intended.\n\nThere is always something new to see: a procession, a sale, a sermon, a duel, or some fresh scandal racing across the square faster than wildfire. Where would you like to look first?"
 omni_items.7.desc.mid.14:0 "The streets of [ROOT.GetCharacter.GetLocation.GetName|Y] are alive with purpose. There are too many carts, too many voices, and too many competing smells for anyone to call the city quiet.\n\nCommerce has been welcomed in, but never so far as to dull the city's edge. Which building would you like to visit?"
 omni_items.7.desc.mid.15:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] is no provincial backwater. It carries the weight of a true city now, with proper markets, busy craftsmen, and a growing appetite for spectacle and song.\n\nIts people do not merely live here; they have built a civilization that argues, profits, and sings of its own making. There are many services to be found here in [ROOT.GetCharacter.GetLocation.GetName|Y] - which would you like to visit?"
 omni_items.7.desc.big.1:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] is a city of consequence, a true seat of splendor where the avenues are thronged, the markets clamor without pause, and the air itself is thick with incense, hearth-smoke, and the warmth of ten thousand bodies pressed close.\n\nFrom one district to the next, the city changes its mood like a living creature. A temple quarter may lie hushed as a grave at dawn, while by noon the docks, granaries, and counting houses roar so loudly they seem ready to burst at the seams. There is much to see in [ROOT.GetCharacter.GetLocation.GetName|Y] - which district would you like to visit?"
 omni_items.7.desc.big.2:0 "The scale of [ROOT.GetCharacter.GetLocation.GetName|Y] is impossible to miss. It rises like a proud boast carved in stone, timber, and painted plaster, daring anyone to call it small.\n\nCaravans crowd its roads, hawkers crowd its squares, and even its beggars seem to keep to their own appointed districts. Which of its many quarters would you like to visit?"
 omni_items.7.desc.big.3:0 "In [ROOT.GetCharacter.GetLocation.GetName|Y], every street seems to spill into another crowd. The city is broad, busy, and utterly self-assured, with wealth enough to raise monuments and hunger enough to keep its bakeries honest.\n\nThe surrounding country is no longer mere scenery. It is a resource the city has learned to claim, adorn, and command. Where would you like to go?"
 omni_items.7.desc.big.4:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] does not merely hold people; it orders them. Merchants, priests, magistrates, laborers, and soldiers all move through a carefully layered maze of streets that never quite falls silent.\n\nThe city sprawls ever outward, forever expanding, forever mending itself, and forever finding fresh reason to boast. Which building would you like to visit?"
 omni_items.7.desc.big.5:0 "The city of [ROOT.GetCharacter.GetLocation.GetName|Y] is a riot of motion. Scribes hurry with wax tablets tucked under their arms, masons swing hammer and chisel, spice sellers call out from shaded stalls, and bands of children claim the alleys as their own private kingdom.\n\nIt is the sort of place where a ruler can feel the whole realm breathing through its streets. Where shall we send you?"
 omni_items.7.desc.big.6:0 "From the outer roads, [ROOT.GetCharacter.GetLocation.GetName|Y] already looks immense. Once inside, the impression only grows: layered districts, sprawling markets, civic halls, shrines, workshops, and drill yards all packed together in glorious disorder.\n\nThe city has enough scale that every rumor becomes a procession, and every procession becomes a rumor in turn. Which building would you like to visit?"
 omni_items.7.desc.big.7:0 "The greatness of [ROOT.GetCharacter.GetLocation.GetName|Y] is written into its very stones. Broad avenues cut through the heart of the city, courtyards overflow with merchants and petitioners, and even the humblest quarter reeks of industry rather than neglect.\n\nThis place has become a forge for turning ambition into civilization. Which of its many halls would you like to visit?"
 omni_items.7.desc.big.8:0 "The bustle of [ROOT.GetCharacter.GetLocation.GetName|Y] is impossible to ignore. Bells, hammers, prayer chants, wagon wheels, and market cries all mingle into a constant, glorious storm.\n\nA visitor can lose an entire afternoon simply following the scent of fresh bread, roasting meat, or newly cut cedar from one district to the next. Which building would you like to visit?"
 omni_items.7.desc.big.9:0 "There is confidence in every wall of [ROOT.GetCharacter.GetLocation.GetName|Y]. The city has grown so vast that its districts feel like smaller towns bound together by shared ambition, while the roads around it stream endlessly with people bringing food, labor, and luxury into its heart.\n\nNo one here pretends to be unimportant. Even the porters move as though they were participants in history. Where would you like to begin?"
 omni_items.7.desc.big.10:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] is the kind of city where everything has a market: cloth, grain, silk, maps, gossip, favors, weapons, charms, and secrets.\n\nThe population presses against the streets in dense, restless waves, and the surrounding land has been reshaped entirely around the city's appetite. It feels less like a settlement now, and more like a power in its own right. Which building would you like to visit?"
 omni_items.7.desc.big.11:0 "In the vastness of [ROOT.GetCharacter.GetLocation.GetName|Y], it is easy to forget where one district ends and another begins. The city has grown so large that the names of its neighborhoods matter nearly as much as the name of the city itself.\n\nIts life spills far beyond its walls, and the surrounding land seems almost honored by the weight it now carries. Which district would you like to visit?"
 omni_items.7.desc.big.12:0 "The streets of [ROOT.GetCharacter.GetLocation.GetName|Y] are thick with consequence. Petitions are carried to palaces, freight is carried to warehouses, and quarrels are carried from one end of the city to the other by servants with remarkably sharp ears.\n\nThis great city has learned to make every hour busy and every block important. Where would you like to go?"
 omni_items.7.desc.big.13:0 "The city of [ROOT.GetCharacter.GetLocation.GetName|Y] can be heard before it can be seen. The clang of metal, the cries of vendors, and the roar of the crowd carry far across the open country long before its walls ever come into view.\n\nOnce inside, the scale becomes almost dizzying: processions, bathhouses, barracks, shrines, banquet halls, and market arcades all jostling for space beneath the same wide sky. Which building would you like to visit?"
 omni_items.7.desc.big.14:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] bears all the signs of a city that expects the world to come to it. Nobles keep grand houses here, merchants keep vast warehouses here, and even the humblest holy men speak as though their prayers deserve an audience of thousands.\n\nThis place has been forged, by sheer force of will, into grandeur itself. Which of its many services would you like to seek out?"
 omni_items.7.desc.big.15:0 "A true urban giant, [ROOT.GetCharacter.GetLocation.GetName|Y] is swollen with trade, ceremony, and the endless business of daily life. The roads leading in are never empty, and the roads leading out carry goods, gossip, and hopeful migrants seeking their share of the city's fortune.\n\nThe city has grown so large that even its shadows feel populated. Where would you like to spend your time?"
 omni_items.7.desc.big.16:0 "In [ROOT.GetCharacter.GetLocation.GetName|Y], the rich and poor alike wind through a maze built to endure. Marble facades stand beside soot-dark workshops, while broad plazas give way to cramped side streets that carry the scent of tallow, onions, and wet stone.\n\nThe land beneath is not merely ground the city rests upon. It is the very stage upon which the city has built its splendor. Which building would you like to visit?"
 omni_items.7.desc.big.17:0 "The city of [ROOT.GetCharacter.GetLocation.GetName|Y] is the sort of place poets exaggerate and tax collectors underestimate. It is too busy, too crowded, and too spirited to fit neatly into a single sentence.\n\nEvery corner carries a different sound: the bray of donkeys, the crash of cargo, the ring of temple bells, and the muttered schemes of people convinced they are about to become rich. Which corner would you like to explore?"
 omni_items.7.desc.big.18:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] rises with the confidence of a place that has long since forgotten what modesty is. Markets overflow, temples glitter with gilded finery, and the streets are so crowded that even noble processions must slow their stride.\n\nA ruler visiting here does not merely inspect a city; they step into a living organism built of stone and appetite. Where would you like to begin?"
 omni_items.7.desc.big.19:0 "The traffic through [ROOT.GetCharacter.GetLocation.GetName|Y] never seems to cease. Grain, wine, bronze, silk, timber, and soldiers all flow through the city like blood through a mighty heart, while each district pulses with its own smaller, stubborn life.\n\nThe city has become a masterwork of endurance and scale. Which building would you like to visit?"
 omni_items.7.desc.big.20:0 "In [ROOT.GetCharacter.GetLocation.GetName|Y], grandeur is simply ordinary. A palace quarter, a merchant quarter, a temple quarter, and a crowded quarter for everyone else all compete for space, attention, and the favor of the city's rulers.\n\nThe land beyond gives the city its bones, but the city gives that land its fame. Which quarter would you like to visit?"
 omni_items.7.desc.big.21:0 "A metropolis like [ROOT.GetCharacter.GetLocation.GetName|Y] does not sleep so much as change shifts. Markets empty and refill, patrols pass in the night, kitchens light their fires before dawn, and somewhere in the maze of streets a festival always seems to be gathering itself.\n\nThe whole place feels transformed by the sheer, relentless force of human presence. Where would you like to go?"
 omni_items.7.desc.big.22:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] is dense with life. There are enough people here to fill entire villages twice over, with crowds left besides for the forums, the theaters, the granaries, and the roads beyond the walls.\n\nEvery stone seems polished by footsteps, every square worn smooth by argument, and every marketplace warmed by the hopeful clamor of trade. Which building would you like to visit?"
 omni_items.7.desc.big.23:0 "The city of [ROOT.GetCharacter.GetLocation.GetName|Y] is a marvel of noise and necessity. Bakers feed laborers, laborers feed builders, builders feed the pride of governors, and governors feast upon reports that the city fares better than the last man claimed.\n\nIt has become a monument to the sheer stubbornness of civilization. Which building would you like to visit?"
 omni_items.7.desc.big.24:0 "You could spend days in [ROOT.GetCharacter.GetLocation.GetName|Y] and still not see the whole of it. Districts unfold into further districts, roads into markets, and markets into the private schemes of people who never stop believing this city can be made greater still.\n\nThe city itself has become the landscape, sprawling and magnificent in equal measure. Where would you like to go?"
 omni_items.7.desc.big.25:0 "A great capital like [ROOT.GetCharacter.GetLocation.GetName|Y] feels less built than accumulated. One generation raised shrines, another raised walls, another raised warehouses, and now its streets stand packed with the living proof that every age has added its own layer to the whole.\n\nThe result is overwhelming: a city of roaring markets, glittering halls, restless soldiers, ambitious priests, and a hundred thousand small lives all insisting, each in their own way, that the place belongs to them. Which building would you like to visit?"
 omni_items.7.desc.hostile.1:0 "The gates of [ROOT.GetCharacter.GetLocation.GetName|Y] stand shut and barred, its walls manned by sentries who have made their intentions plain without ever needing to speak. Your business here is conducted entirely outside the walls, among the mills, the pens, and the huts of tenants too poor to have fled.\n\nWhatever lies within the city remains firmly out of reach. Which building would you like to visit?"
 omni_items.7.desc.hostile.2:0 "No gate opens for you in [ROOT.GetCharacter.GetLocation.GetName|Y]. From atop the ramparts, watchful eyes track your every move, while below, the scattered farmsteads and outlying market stalls carry on their business at a careful distance from the wall.\n\nThe city keeps its secrets close and its gate closer. Which building would you like to visit?"
 omni_items.7.desc.hostile.3:0 "The walls of [ROOT.GetCharacter.GetLocation.GetName|Y] rise unbroken against you, its garrison thick along every rampart. You are left to make do with the sprawling outskirts - the workshops, the granaries, and the shanties that cling to the base of the wall - while the heart of the city stays sealed away behind stone.\n\nWhoever governs this place has made their answer clear without ever opening the gate. Which building would you like to visit?"
 omni_items.7.desc.hostile.4:0 "[ROOT.GetCharacter.GetLocation.GetName|Y] has drawn itself entirely behind its walls, leaving its outer wards - the stables, the tanneries, the drovers' roads - to absorb whatever business you bring. Wagons that once rolled freely through the gate now sit abandoned in the mud outside it.\n\nThe city has made its choice, and it does not include you. Which building would you like to visit?"
 omni_items.7.desc.hostile.5:0 "You will find no welcome within the walls of [ROOT.GetCharacter.GetLocation.GetName|Y], only the outbuildings and hovels that ring it from a cautious distance. Archers pace the battlements above, watching to see whether you intend to press the matter further.\n\nEverything you might want from this city lies just beyond your reach, behind a gate that has not so much as creaked open. Which building would you like to visit?"
 omni_items.7.desc.hostile.6:0 "The people of [ROOT.GetCharacter.GetLocation.GetName|Y] have retreated fully behind their walls, leaving the caravan roads and outer markets to fend for themselves under your watchful presence. A few desperate stallholders are still willing to trade, so long as it happens well beyond the reach of the gate.\n\nThe city itself remains a stone-faced stranger. Which building would you like to visit?"
 omni_items.7.desc.hostile.7:0 "The gate of [ROOT.GetCharacter.GetLocation.GetName|Y] has not opened since your banners came into view, and by the look of the spearmen along the wall, it does not intend to. You are left to pick through the mills, pens, and hamlets that ring the city, watched always from above.\n\nThe city keeps its stores and its people safely behind stone, leaving you only the fields at its feet. Which building would you like to visit?"
 omni_items.7.desc.hostile.8:0 "Whatever grandeur or misery [ROOT.GetCharacter.GetLocation.GetName|Y] holds within its walls, it intends to keep entirely to itself. You make camp among the outer wards and unwalled sprawl, where frightened tenants and wary merchants watch you from a safe remove.\n\nThe gate remains shut, and no argument you can make will open it. Which building would you like to visit?"
 omni_items.7.market:0 "#Y Market#!"
 omni_items.7.adventurer_guild:0 "#Y Adventurer's Guild#!"
 omni_items.7.brewery:0 "#Y Tavern#!"
 omni_items.7.circus:0 "#Y Entertainment District#!"
 omni_items.7.magic_academy:0 "#Y Magic Academy#!"
 omni_items.7.black_market:0 "#R Black Market#! - Buy Food"
 omni_items.7.black_market_cannot_afford_tt:0 "Your treasury cannot cover the black market's price."
 omni_items.7.steal_food:0 "#R Requisition Food#! (Steal from the City)"
 omni_items.7.steal_food_none_available_tt:0 "This city's granaries have already been stripped bare."
 omni_hostile_city_buy_food_effect_tt:0 "Smugglers slip out from behind the walls to meet your quartermasters in secret, trading grain and dried meat for coin no questions asked. [ROOT.Char.GetName|Y]'s army resupplies at once, its food reserves filled to bursting - a price paid in gold rather than goodwill."
 omni_hostile_city_steal_food_effect_tt:0 "There is no haggling this time. Your soldiers fan out beyond the walls and take what they need from granaries, cellars, and hidden stores, leaving the locals with empty larders and a fresh grudge. [ROOT.Char.GetName|Y]'s army resupplies at once, though the countryside will remember who did this to them."
 omni_food_requisitioned:0 "Food Requisitioned"
 omni_food_requisitioned_desc:0 "A foreign army has forcibly stripped this province's granaries and stores bare, leaving the population hungry, resentful, and less productive until the stocks can be rebuilt."
 omni_items.13.t:0 "Magic Academy"
 omni_items.13.desc:0 "The academy is alive with lectures, experiments, and the smell of old parchment. What would you like to do?"
 omni_items.13.study_magic:0 "#Y Study Magic#!"
 omni_items.13.study_magic_wip_tt:0 "The masters of the academy are still cataloguing their spellbooks - formal study is not yet available."
 omni_items.8.t:0 "Market"
 omni_items.8.desc:0 "The market is open. What would you like to do?"
 omni_items.8.buy:0 "#Y Buy an Item#!"
 omni_items.8.sell:0 "#G Sell an Item#!"
 omni_items.9.t:0 "Adventurer's Guild"
 omni_items.9.desc:0 "The guild hall is crowded with maps, contracts, and brave fools. What kind of trouble would you like to start?"
 omni_items.10.t:0 "Tavern"
 omni_items.10.desc:0 "The tavern is loud, smoky, and full of gamblers with more confidence than sense. Pick a wager and test your luck. Win, and the house pays you double. Lose, and the stake is gone."
 omni_items.10.wager_25:0 "#Y Wager 25 Gold#!"
 omni_items.10.wager_50:0 "#Y Wager 50 Gold#!"
 omni_items.10.wager_100:0 "#Y Wager 100 Gold#!"
 omni_items.10.wager_500:0 "#Y Wager 500 Gold#!"
 omni_items.10.wager_1000:0 "#Y Wager 1,000 Gold#!"
 omni_items.11.t:0 "The Dice Table"
 omni_items.11.win_desc:0 "The dice come up in your favor. Your [ROOT.Char.MakeScope.Var('omni_brewery_wager').GetValue|0] gold wager returns doubled, and the table groans as the house pays out."
 omni_items.11.lose_desc:0 "The dice betray you. Your [ROOT.Char.MakeScope.Var('omni_brewery_wager').GetValue|0] gold wager is gone, and the table erupts in laughter."
 omni_items.12.t:0 "Entertainment District"
 omni_items.12.desc:0 "The arena is buzzing with anticipation. This is where great spectacles begin."
 omni_items.12.tournament:0 "#Y Hold A Royal Tournament#!"
omni_items.sell_price_tt:0 "The sale price is affected by market haggling, stability, ruler popularity, and the traits of [ROOT.Char.GetName], [ROOT.Char.GetEmployer.GetRuler.GetName], and the merchant."
omni_items.back:0 "#I Back#!"
omni_items.1.equip_artifact:0 "#Y Equip Reliquary Artifact#!"
omni_items.1.unequip_artifact:0 "#Y Unequip Reliquary Artifact#!"

 item_instructions:0 "Item Instructions"
 item_instructions_desc:0 "Opens an in-depth guide to the army-supply item system: commissioning equipment, the Ruler and army bonuses, the four national loadout slots, treasury costs, where to shop, and succession."
 omni_item_inst.1.t:0 "Item Instructions"
 omni_item_inst.1.desc:0 "#T Outfitting Your Armies#!\n\nItems in Omniluxia are not personal trinkets locked to a single hero - they are #Y equipment patterns your whole realm adopts#!. When your Ruler purchases an item at a #G Market#!, two things happen at once: your Ruler carries a fine example of it, and your armies across the entire realm are outfitted with it.\n\n#T Two Bonuses On Every Item#!\nEach piece of gear grants two separate bonuses:\n#G Personal (Ruler):#! an attribute for your #Y Ruler#! alone - such as @military_icon! Martial or Health - because your Ruler wields the finest example.\n#G Army (Nation):#! a #Y country-wide#! combat bonus applied to every army you field - because your smiths equip your cohorts with the design. Weapons and ranged weapons grant #Y offense#!; armor and shields grant #Y defense#!. Each item favors one unit type, so a light-infantry blade strengthens light infantry, an archer bow strengthens archers, and so on.\n\n#T The Four Loadout Slots#!\nYour realm fields one item in each of four national slots at a time:\n#Y Weapon#! (melee)  -  #Y Ranged Weapon#!  -  #Y Armor#!  -  #Y Shield#!\nCommissioning an item fills its slot. Commissioning another of the same type #R replaces#! it - the old bonuses are stripped and the new ones applied. To review everything currently equipped and its bonuses, hover the #G Items#! button on your Ruler and read the #Y Currently Equipped#! list.\n\n#T Paying For Equipment#!\nCommissions are paid from your #Y National Treasury#!. If the treasury cannot afford an item, you cannot buy it. Quality costs more: #G Common#! wares are cheap, while #G Uncommon#! and #G Rare#! wares cost far more but grant markedly stronger bonuses.\n\n#T Where To Shop#!\nYour Ruler buys from markets in your own cities and from foreign cities you hold #Y Military Access#! to - visit a friendly neighbor's capital and browse their stalls. Wealthier, larger, more civilized and more developed cities stock better and rarer wares: a thriving metropolis with many pops, multiple market buildings and high civilization offers the finest equipment, while a backwater offers little. Markets are also flavored by local culture - a people of archers in forested lands will sell bows that boost archers and forest fighting.\n\n#T Succession#!\nYour loadout belongs to your #Y Ruler#!. When your Ruler dies, the realm's equipment is lost and the #R new Ruler begins with empty slots#! - you must re-outfit your armies anew each reign.\n\n#T Rivals#!\nAI realms outfit their armies the same way, spending from their own treasuries, so expect rival nations to grow stronger over a long campaign.\n\n#T Legendary Gear & Artifacts#!\nFamous named weapons and armor are commissioned just like ordinary gear, but their #Y personal#! bonus to the Ruler is exceptionally strong - a legendary blade can make your Ruler a peerless general - while their army bonus stays modest. Certain relics and regalia are borne by your Ruler alone."
 omni_item_inst.1.a: "I think I understand"
