 omni_items.1.t:0 "Equipment"
 omni_items.1.desc:0 "You review what [ROOT.Char.GetName] carries. What would you like to do?"
 omni_items.1.equip:0 "#Y Equip an item#!"
 omni_items.1.unequip:0 "#Y Unequip an item#!"
 omni_items.1.discard:0 "#R Discard an item#!"
 omni_items.1.close:0 "Close"
 omni_items.2.t:0 "Equip an Item"
 omni_items.2.desc:0 "Choose an item to equip. Only items [ROOT.Char.GetName] owns and has an open slot for are shown."
 omni_items.3.t:0 "Unequip an Item"
 omni_items.3.desc:0 "Choose an item to unequip. It stays in the inventory and can be equipped again later."
 omni_items.4.t:0 "Discard an Item"
 omni_items.4.desc:0 "Choose an item to discard. This removes it from [ROOT.Char.GetName] permanently, along with any bonus it granted."
 omni_items.5.t:0 "Sell an Item"
 omni_items.5.desc:0 "[SCOPE.sChar('omni_item_merchant').GetName] waits among the stalls of [SCOPE.sP('omni_item_market_province').GetName], ready to appraise what [ROOT.Char.GetName] carries. Choose an item to sell for gold. The sale is final."
 omni_items.6.t:0 "Outfit Your Armies"
 omni_items.6.desc:0 "[SCOPE.sChar('omni_item_merchant').GetName|Y] has laid out a selection of goods gathered from the markets of [SCOPE.sP('omni_item_market_province').GetName|Y]. Commissioning a design equips it across your realm; your #Y Ruler #! equips a fine example (personal bonus), while your #Y armies#! adopt it nationwide (a country-wide bonus). You may field one weapon, one ranged weapon, one armor, and one shield at a time; a new commission replaces the old. Wealthier, larger, and more civilized local markets can draw rarer wares.\n\nIf no items appear in the shops, it is because you do not have enough money to purchase anything."
 omni_items.7.t:0 "City Buildings"
 omni_items.7.desc:0 "You look over the city interactions available here. Which building would you like to visit?"
 omni_items.7.market:0 "#Y Market#!"
 omni_items.7.adventurer_guild:0 "#Y Adventurer's Guild#!"
 omni_items.7.brewery:0 "#Y Tavern#!"
 omni_items.7.circus:0 "#Y Entertainment District#!"
 omni_items.8.t:0 "Market"
 omni_items.8.desc:0 "The market is open. What would you like to do?"
 omni_items.8.buy:0 "#Y Buy an Item#!"
 omni_items.8.sell:0 "#G Sell an Item#!"
 omni_items.9.t:0 "Adventurer's Guild"
 omni_items.9.desc:0 "The guild hall is crowded with maps, contracts, and brave fools. What kind of trouble would you like to start?"
 omni_items.10.t:0 "Tavern"
 omni_items.10.desc:0 "The tavern is loud, smoky, and full of gamblers with more confidence than sense. Pick a wager and test your luck. Win, and the house pays you double. Lose, and the stake is gone."
 omni_items.10.wager_25:0 "#Y Wager 25 Gold#!"
 omni_items.10.wager_50:0 "#Y Wager 50 Gold#!"
 omni_items.10.wager_100:0 "#Y Wager 100 Gold#!"
 omni_items.10.wager_500:0 "#Y Wager 500 Gold#!"
 omni_items.10.wager_1000:0 "#Y Wager 1,000 Gold#!"
 omni_items.11.t:0 "The Dice Table"
 omni_items.11.win_desc:0 "The dice come up in your favor. Your [ROOT.Char.MakeScope.Var('omni_brewery_wager').GetValue|0] gold wager returns doubled, and the table groans as the house pays out."
 omni_items.11.lose_desc:0 "The dice betray you. Your [ROOT.Char.MakeScope.Var('omni_brewery_wager').GetValue|0] gold wager is gone, and the table erupts in laughter."
 omni_items.12.t:0 "Entertainment District"
 omni_items.12.desc:0 "The arena is buzzing with anticipation. This is where great spectacles begin."
 omni_items.12.tournament:0 "#Y Hold A Royal Tournament#!"
omni_items.sell_price_tt:0 "The sale price is affected by market haggling, stability, ruler popularity, and the traits of [ROOT.Char.GetName], [ROOT.Char.GetEmployer.GetRuler.GetName], and the merchant."
omni_items.back:0 "#I Back#!"
omni_items.1.equip_artifact:0 "#Y Equip Reliquary Artifact#!"
omni_items.1.unequip_artifact:0 "#Y Unequip Reliquary Artifact#!"

 item_instructions:0 "Item Instructions"
 item_instructions_desc:0 "Opens an in-depth guide to the army-supply item system: commissioning equipment, the ruler and army bonuses, the four national loadout slots, treasury costs, where to shop, and succession."
 omni_item_inst.1.t:0 "Item Instructions"
 omni_item_inst.1.desc:0 "#T Outfitting Your Armies#!\n\nItems in Omniluxia are not personal trinkets locked to a single hero - they are #Y equipment patterns your whole realm adopts#!. When your ruler commissions a design at a market, two things happen at once: your ruler carries a fine example of it, and your armies across the entire realm are outfitted with it.\n\n#T Two Bonuses On Every Item#!\nEach piece of gear grants two separate bonuses:\n#G Personal (Ruler):#! an attribute for your #Y ruler#! alone - such as @military_icon! Martial or Health - because your ruler wields the finest example.\n#G Army (Nation):#! a #Y country-wide#! combat bonus applied to every army you field - because your smiths equip your cohorts with the design. Weapons and ranged weapons grant #Y offense#!; armor and shields grant #Y defense#!. Each item favors one unit type, so a light-infantry blade strengthens light infantry, an archer bow strengthens archers, and so on.\n\n#T The Four Loadout Slots#!\nYour realm fields one item in each of four national slots at a time:\n#Y Weapon#! (melee)  -  #Y Ranged Weapon#!  -  #Y Armor#!  -  #Y Shield#!\nCommissioning an item fills its slot. Commissioning another of the same type #R replaces#! it - the old bonuses are stripped and the new ones applied. To review everything currently equipped and its bonuses, hover the #G Items#! button on your ruler and read the #Y Currently Equipped#! list.\n\n#T Paying For Equipment#!\nCommissions are paid from your #Y National Treasury#!. If the treasury cannot afford an item, you cannot buy it. Quality costs more: #G Common#! wares are cheap, while #G Uncommon#! and #G Rare#! wares cost far more but grant markedly stronger bonuses.\n\n#T Where To Shop#!\nYour ruler buys from markets in your own cities and from foreign cities you hold #Y Military Access#! to - visit a friendly neighbor's capital and browse their stalls. Wealthier, larger, more civilized and more developed cities stock better and rarer wares: a thriving metropolis with many pops, multiple market buildings and high civilization offers the finest equipment, while a backwater offers little. Markets are also flavored by local culture - a people of archers in forested lands will sell bows that boost archers and forest fighting.\n\n#T Succession#!\nYour loadout belongs to your #Y ruler#!. When your ruler dies, the realm's equipment is lost and the #R new ruler begins with empty slots#! - you must re-outfit your armies anew each reign.\n\n#T Rivals#!\nAI realms outfit their armies the same way, spending from their own treasuries, so expect rival nations to grow stronger over a long campaign.\n\n#T Legendary Gear & Artifacts#!\nFamous named weapons and armor are commissioned just like ordinary gear, but their #Y personal#! bonus to the ruler is exceptionally strong - a legendary blade can make your ruler a peerless general - while their army bonus stays modest. Certain relics and regalia are borne by your ruler alone."
 omni_item_inst.1.a: "I think I understand"
