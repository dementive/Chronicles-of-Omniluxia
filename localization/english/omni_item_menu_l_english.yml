 omni_items.1.close:0 "Close"
 omni_items.2.t:0 "Equip an Item"
 omni_items.2.desc:0 "Choose an item to equip. Only items [ROOT.Char.GetName] owns and has an open slot for are shown."
 omni_items.3.t:0 "Unequip an Item"
 omni_items.3.desc:0 "Choose an item to unequip. It stays in the inventory and can be equipped again later."
 omni_items.4.t:0 "Discard an Item"
 omni_items.4.desc:0 "Choose an item to discard. This removes it from [ROOT.Char.GetName] permanently, along with any bonus it granted."
 omni_items.5.t:0 "Sell an Item"
 omni_items.5.desc:0 "[SCOPE.sChar('omni_item_merchant').GetName] waits among the stalls of [SCOPE.sP('omni_item_market_province').GetName], ready to appraise what [ROOT.Char.GetName] carries. Choose an item to sell for gold. The sale is final."
 omni_items.6.t:0 "Outfit Your Armies"
 omni_items.6.desc:0 "[SCOPE.sChar('omni_item_merchant').GetName] has laid out a selection of goods gathered from the markets of [SCOPE.sP('omni_item_market_province').GetName]. Commissioning a design equips it across your realm: your #Y ruler#! carries a fine example (a personal bonus), while your #Y armies#! adopt it nationwide (a country-wide bonus). You may field one weapon, one ranged weapon, one armor, and one shield at a time; a new commission replaces the old. Wealthier, larger, and more civilized local markets can draw rarer wares."
 omni_items.sell_price_tt:0 "The sale price is affected by market haggling, stability, ruler popularity, and the traits of [ROOT.Char.GetName], [ROOT.Char.GetEmployer.GetRuler.GetName], and the merchant."
 omni_items.back:0 "#I Back#!"
 omni_items.1.equip_artifact:0 "#Y Equip Reliquary Artifact#!"
 omni_items.1.unequip_artifact:0 "#Y Unequip Reliquary Artifact#!"

 item_instructions:0 "Item Instructions"
 item_instructions_desc:0 "Opens an in-depth guide to the army-supply item system: commissioning equipment, the ruler and army bonuses, the four national loadout slots, treasury costs, where to shop, and succession."
 omni_item_inst.1.t:0 "Item Instructions"
 omni_item_inst.1.desc:0 "#T Outfitting Your Armies#!\n\nItems in Omniluxia are not personal trinkets locked to a single hero - they are #Y equipment patterns your whole realm adopts#!. When your ruler commissions a design at a market, two things happen at once: your ruler carries a fine example of it, and your armies across the entire realm are outfitted with it.\n\n#T Two Bonuses On Every Item#!\nEach piece of gear grants two separate bonuses:\n#G Personal (Ruler):#! an attribute for your #Y ruler#! alone - such as @military_icon! Martial or Health - because your ruler wields the finest example.\n#G Army (Nation):#! a #Y country-wide#! combat bonus applied to every army you field - because your smiths equip your cohorts with the design. Weapons and ranged weapons grant #Y offense#!; armor and shields grant #Y defense#!. Each item favors one unit type, so a light-infantry blade strengthens light infantry, an archer bow strengthens archers, and so on.\n\n#T The Four Loadout Slots#!\nYour realm fields one item in each of four national slots at a time:\n#Y Weapon#! (melee)  -  #Y Ranged Weapon#!  -  #Y Armor#!  -  #Y Shield#!\nCommissioning an item fills its slot. Commissioning another of the same type #R replaces#! it - the old bonuses are stripped and the new ones applied. To review everything currently equipped and its bonuses, hover the #G Items#! button on your ruler and read the #Y Currently Equipped#! list.\n\n#T Paying For Equipment#!\nCommissions are paid from your #Y National Treasury#!. If the treasury cannot afford an item, you cannot buy it. Quality costs more: #G Common#! wares are cheap, while #G Uncommon#! and #G Rare#! wares cost far more but grant markedly stronger bonuses. You may commission one item per month.\n\n#T Where To Shop#!\nYour ruler buys from markets in your own cities and from foreign cities you hold #Y Military Access#! to - visit a friendly neighbor's capital and browse their stalls. Wealthier, larger, more civilized and more developed cities stock better and rarer wares: a thriving metropolis with many pops, multiple market buildings and high civilization offers the finest equipment, while a backwater offers little. Markets are also flavoured by local culture - a people of archers in forested lands will sell bows that boost archers and forest fighting.\n\n#T Succession#!\nYour loadout belongs to your #Y ruler#!. When your ruler dies, the realm's equipment is lost and the #R new ruler begins with empty slots#! - you must re-outfit your armies anew each reign.\n\n#T Rivals#!\nAI realms outfit their armies the same way, spending from their own treasuries, so expect rival nations to grow stronger over a long campaign.\n\n#T Legendary Gear & Artifacts#!\nFamous named weapons and armor are commissioned just like ordinary gear, but their #Y personal#! bonus to the ruler is exceptionally strong - a legendary blade can make your ruler a peerless general - while their army bonus stays modest. Certain relics and regalia are borne by your ruler alone."
 omni_item_inst.1.a: "I think I understand"
