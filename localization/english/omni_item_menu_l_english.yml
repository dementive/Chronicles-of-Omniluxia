l_english:
 omni_items.1.t:0 "Equipment"
 omni_items.1.desc:0 "You review what [ROOT.Char.GetName] carries. What would you like to do?"
 omni_items.1.equip:0 "#Y Equip an item#!"
 omni_items.1.unequip:0 "#Y Unequip an item#!"
 omni_items.1.sell:0 "#G Sell an Item#!"
 omni_items.1.buy:0 "#Y Buy an Item#!"
 omni_items.1.discard:0 "#R Discard an item#!"
 omni_items.1.close:0 "Close"
 omni_items.2.t:0 "Equip an Item"
 omni_items.2.desc:0 "Choose an item to equip. Only items [ROOT.Char.GetName] owns and has an open slot for are shown."
 omni_items.3.t:0 "Unequip an Item"
 omni_items.3.desc:0 "Choose an item to unequip. It stays in the inventory and can be equipped again later."
 omni_items.4.t:0 "Discard an Item"
 omni_items.4.desc:0 "Choose an item to discard. This removes it from [ROOT.Char.GetName] permanently, along with any bonus it granted."
 omni_items.5.t:0 "Sell an Item"
 omni_items.5.desc:0 "[SCOPE.sChar('omni_item_merchant').GetName] waits among the stalls of [SCOPE.sP('omni_item_market_province').GetName], ready to appraise what [ROOT.Char.GetName] carries. Choose an item to sell for gold. The sale is final."
 omni_items.6.t:0 "Buy an Item"
 omni_items.6.desc:0 "[SCOPE.sChar('omni_item_merchant').GetName] has laid out a selection of goods gathered from the markets of [SCOPE.sP('omni_item_market_province').GetName]. Wealthier, larger, and more civilized local markets can draw rarer wares."
 omni_items.sell_price_tt:0 "The sale price is affected by market haggling, stability, ruler popularity, and the traits of [ROOT.Char.GetName], [ROOT.Char.GetEmployer.GetRuler.GetName], and the merchant."
 omni_items.back:0 "#I Back#!"
 omni_items.1.equip_artifact:0 "#Y Equip Reliquary Artifact#!"
 omni_items.1.unequip_artifact:0 "#Y Unequip Reliquary Artifact#!"

 item_instructions:0 "Item Instructions"
 item_instructions_desc:0 "Opens a short guide explaining how items work, including buying, selling, and how items spawn."
 omni_item_inst.1.t:0 "Item Instructions"
 omni_item_inst.1.desc:0 "Your Ruler can visit places with markets to purchase items using their personal wealth - if the unit is standing in a city with a market, when you click on the #G Inventory#! icon, you will see #G Buy#! and #G Sell#! options are available. Every city's market is different.\n\nYour Ruler can purchase items from markets in your cities and also from foreign cities that you have #Y Military Access#! to - try visiting the capital of a friendly neighbor and shopping in their markets. You can only purchase one item per month, but you can sell items whenever you want to.\n\nImportant characters in the world - rulers, governors, generals, and people with offices - will automatically equip the best items they can afford. The quality of the items that spawn in markets are different from country to country and culture to culture, and usually benefit the country's levy composition; a culture with a lot of archer units and a forested homeland will make and sell items that boost archer units and fighting in forest tiles.\n\nTo have more and better items appear in your stores, build wealthier, larger, and more civilized cities that are highly developed. The better and more thriving your city is, the better stocked your stores will be. A backwater capital with one market and no pops will not have much for sale, but a metropolis with maxed out civilization level, a hundred pops, multiple market buildings and lots of buildings in general - these are the places where a player can find the best items.\n\nShopkeepers can spawn with character traits that affect the prices of goods. From the Inventory menu, you can also manage your owned items by choosing to #Y Equip#!, #Y Unequip#!, or #R Discard#! them (which removes them permanently). Furthermore, if your country possesses powerful #T Reliquary Artifacts#! — often stored in Holy Sites — your Ruler can choose to equip these legendary treasures to gain their unique benefits."
 omni_item_inst.1.a:0 "I understand"
