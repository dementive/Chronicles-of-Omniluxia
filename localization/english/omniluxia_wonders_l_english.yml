l_english:
 gw_effect_gerrbaen:0 "$wonder_gerrbaen$"
 gw_effect_gerrbaen_DESC:0 "The terraced farms and gardens of Gerrbaen sustain a growing population, fill our granaries, and bring renown to our ruler."
 gw_effect_veddtunn:0 "$wonder_veddtunn$"
 gw_effect_veddtunn_DESC:0 "The scholars of Veddtunn preserve and advance our learning in matters of faith, government, and public life."
 gw_effect_sorrsalla_DESC:0 "The Great Hall brings our people together, nurturing commerce, learning, and the traditions of civilized life."
 wonder_jelen_uni:0 "$gw_effect_jelen$"
 greek_academy:0 "Great Academy"
 wonder_emberforge_bastion:0 "Hall of the Six Stoneborn"
 gw_effect_stoneborn_oaths:0 "Hall of the Six Stoneborn"
 gw_effect_stoneborn_oaths_DESC:0 "Beneath six colossal ancestral effigies, the Jade Dwarf clans of Luthrhunith swear that no child of the Stone Father shall stand alone. Masters of jade and bronze gather here to exchange the old crafts, while the oath-guard carries the strength of all six lineages into battle."
 wonder_tideward_sanctum:0 "Shrine of the Unbroken Watch"
 gw_effect_unbroken_watch:0 "Shrine of the Unbroken Watch"
 gw_effect_unbroken_watch_DESC:0 "Eresteria's circular sea-wall shelters the ships of the Wardenite faithful. Its beacon is kept alight for Na'athran's promised return; until that day, generations of harbor-wardens preserve the charts, drill the crews, and guarantee safe passage to merchants who sail beneath their watch."
 wonder_heartspore_colossus:0 "Sanctuary of the First Spore"
 gw_effect_first_spore:0 "Sanctuary of the First Spore"
 gw_effect_first_spore_DESC:0 "The open crown of Yokoshkyo's sanctuary admits the drifting spores of the imperial Great Mycelium. Priest-gardeners tend an unbroken living archive beneath its colonnade, sharing the secrets of rich harvests and guiding the mages who listen to the oldest voices within the bloom."
 wonder_shadowmoon_ziggurat:0 "Steps of the Everywhen"
 gw_effect_everywhen:0 "Steps of the Everywhen"
 gw_effect_everywhen_DESC:0 "At Mimgong, the dream-keepers ascend the terraces at dusk and sleep beneath the summit shrine. In Ijminga, past and future share a single horizon: the ancestors instruct rulers yet unborn, and forgotten kings lend their wisdom to those who wake with the dawn."
