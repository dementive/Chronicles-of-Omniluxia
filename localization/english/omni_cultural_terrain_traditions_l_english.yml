l_english:
 drow_cavern_philosophy:0 "Drow Cavern Warfare"
 drow_cavern_ambush:0 "Ambushes in the Deep"
 drow_cavern_ambush_desc:0 "Drow archers learn to use the bends and ledges of the caverns to fire from cover. The quarrymen who lend the archers their ledges ask that the arrows be cleared away before the next shift."
 archers_cavern_combat_bonus:0 "Archers Cavern Combat Bonus"
 archers_dry_hills_combat_bonus:0 "Archers Dry Hills Combat Bonus"
 archers_taiga_combat_bonus:0 "Archers Taiga Combat Bonus"
 camels_dry_plains_combat_bonus:0 "Camels Dry Plains Combat Bonus"
 heavy_infantry_cavern_combat_bonus:0 "Heavy Infantry Cavern Combat Bonus"
 light_infantry_cavern_combat_bonus:0 "Light Infantry Cavern Combat Bonus"
 light_infantry_dry_hills_combat_bonus:0 "Light Infantry Dry Hills Combat Bonus"
 light_infantry_eldritch_forest_combat_bonus:0 "Light Infantry Eldritch Forest Combat Bonus"
 light_infantry_flood_plain_combat_bonus:0 "Light Infantry Flood Plain Combat Bonus"
 light_infantry_mushroom_forest_combat_bonus:0 "Light Infantry Mushroom Forest Combat Bonus"
 drow_cavern_hidden_ledges:0 "Hidden Ledges"
 drow_cavern_hidden_ledges_desc:0 "Archers rehearse falling back between covered firing positions. The men who choose the ledges sometimes allow room for the bow."
 drow_cavern_tunnel_runners:0 "Tunnel Runners"
 drow_cavern_tunnel_runners_desc:0 "Light infantry drill in side passages where formed ranks cannot follow. The runners mark a low roof after the first rehearsal, if the tallest recruit has left them anything to mark it with."
 drow_cavern_crossfire:0 "Crossfire at the Bend"
 drow_cavern_crossfire_desc:0 "Scouts signal the archers when an enemy column enters the killing ground. A scout who mistakes an echo for the signal is put on lantern duty, where he can make himself useful without being heard."
 drow_cavern_silent_relays:0 "Silent Relays"
 drow_cavern_silent_relays_desc:0 "Messengers use rehearsed hand signals to guide detachments between outposts. The relay captains settle disputes above ground, where everyone can see what the other man claims to have meant."
 drow_cavern_picked_bowstrings:0 "Picked Bowstrings"
 drow_cavern_picked_bowstrings_desc:0 "Veteran bowyers select strings that hold their tension in damp air. The bowyers hang the rejected strings by the door, so the next man to propose buying cheap can try one on his way out."
 drow_cavern_deep_company:0 "Companies of the Deep"
 drow_cavern_deep_company_desc:0 "Scouts and bow companies practice together until they can change positions on a single signal. The scouts lend their captain to the bow companies for drill, and are always pleased to hear what he learns about waiting."
 drow_hold_gate_guard:0 "Gate Guard"
 drow_hold_gate_guard_desc:0 "The best-armored companies train to hold the gates that connect the great caverns. A gate captain judges a new coat of armor by how much he can hear of the man wearing it before he comes round the bend."
 drow_hold_shield_relief:0 "Shield Relief"
 drow_hold_shield_relief_desc:0 "Fresh ranks rotate forward before the gate guard tires. The cook has learned to serve the relief their supper in something they can carry."
 drow_hold_reserve_companies:0 "Reserve Companies"
 drow_hold_reserve_companies_desc:0 "Each garrison keeps trained replacements ready to fill gaps in its ranks. The spare names go on the back of the watch tablet, where the captain can still find them after somebody has dropped it."
 drow_hold_stone_stores:0 "Stores Behind Stone"
 drow_hold_stone_stores_desc:0 "Hidden magazines keep garrisons supplied when the main routes are cut. The store keeper knows which ledges stay dry through the seep season, and entrusts that knowledge to fewer people than know the way to his door."
 drow_hold_sealed_gates:0 "Sealed Gates"
 drow_hold_sealed_gates_desc:0 "Engineers use local stone to repair gates and reinforce the walls around them. The masons keep a tally of what each gate has cost to put back. The captains prefer to count the days it held."
 drow_hold_breach_crews:0 "Breach Crews"
 drow_hold_breach_crews_desc:0 "Sappers bring down enemy gates while armored companies hold the approach. The sappers inspect the hinges after a gate falls, once the company that paid for the lesson has finished passing through."
 drow_hold_oath_of_the_gate:0 "Oath of the Gate"
 drow_hold_oath_of_the_gate_desc:0 "Armored companies swear to hold the passage until the last company has withdrawn. The gate captain takes the oath where the first company can hear him. The last company knows its words by the time it goes through."
 drow_march_outer_patrols:0 "Outer Patrols"
 drow_march_outer_patrols_desc:0 "Light infantry range beyond the cavern mouths to screen the army on open ground. The outer watch still gives directions by the cavern mouths, which works well until someone asks it to go farther."
 drow_march_pack_columns:0 "Pack Columns"
 drow_march_pack_columns_desc:0 "Quartermasters divide the baggage into small loads that can take separate routes. Several paths will bring back a missing mule, and only one will bring it to the cook who had charge of it."
 drow_march_rear_guard:0 "Rearguard Drills"
 drow_march_rear_guard_desc:0 "Patrols practice covering a withdrawal under pressure from mounted troops. The rearguard learns to judge a horse by its shadow, which is usually new enough to the recruits to keep them looking the right way."
 drow_march_camp_schools:0 "Camp Schools"
 drow_march_camp_schools_desc:0 "Campaign veterans teach recruits how to keep formation beyond the cavern mouths. The veterans set their stools out in daylight, and let each class discover how much of its drill depends on being able to see the ceiling."
 drow_march_forward_depots:0 "Forward Depots"
 drow_march_forward_depots_desc:0 "Supplies cached along the march let infantry travel with lighter loads. The depot keeper counts sacks by the companies expected on the road, though those that arrive first tend to have a different reckoning."
 drow_march_storming_parties:0 "Storming Parties"
 drow_march_storming_parties_desc:0 "Infantry carrying ladders rehearse taking walls before the defenders can regroup. The ladder crews choose a stretch of wall their instructors can see from below, which is also where the instructors prefer to remain."
 drow_march_surface_veterans:0 "Veterans of the Surface"
 drow_march_surface_veterans_desc:0 "The Deep Rift captains bring their surface journals to the next muster. The recruits copy the entries on marching in daylight, while the captains disagree about how long it took them to stop looking for a roof."
