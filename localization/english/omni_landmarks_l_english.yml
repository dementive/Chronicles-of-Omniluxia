l_english:
 omni_landmark_brodgar_mod:0 "Circle of the First Frost"
 desc_omni_landmark_brodgar_mod:0 "Fachmite families gather among these stones at the first frost to settle pasture boundaries and renew grazing rights before the winter snows."
 omni_landmark_carnac_mod:0 "The Old Father's Measure"
 desc_omni_landmark_carnac_mod:0 "The Dragokhar of Gailbre say the Old Father counted out the fields in stone. Each spring the families walk the rows before renewing their boundary markers."
 omni_landmark_passage_tomb_mod:0 "Brelimin's Long Hearth"
 desc_omni_landmark_passage_tomb_mod:0 "At midwinter the Thiorais carry embers to the passage tomb. Each household takes a coal home from the common brazier, and the keeper recites the names of those buried within."
 omni_landmark_megaliths_mod:0 "The Stone Chambers of Qaaloq"
 desc_omni_landmark_megaliths_mod:0 "Duny families at Qaaloq lay their elders in low chambers built into the Bronze Foothills. After the harvest, they leave a share of their stored roots at the entrances."
 omni_landmark_twin_temples_mod:0 "The Twin Houses of the Pact"
 desc_omni_landmark_twin_temples_mod:0 "Esmita herders bring their witness stones to the pillared court when a bargain is sworn. In the round temple the keepers record the debt and name the households pledged to honor it."
 omni_landmark_mounds_xabibulla_mod:0 "The Bronze Rein Barrows"
 desc_omni_landmark_mounds_xabibulla_mod:0 "Kharesmian riders leave worn bronze bridle fittings at these graves. The oldest mound is said to hold the rider who first marked the autumn route across the steppe."
 omni_landmark_mounds_nureyev_mod:0 "Barrows of the Winter Road"
 desc_omni_landmark_mounds_nureyev_mod:0 "The Kharesmian herds turn at these mounds when the first snow covers the track. Returning families set aside the first bundle of firewood for the families that keep the graves."
 omni_landmark_mounds_hamdurn_mod:0 "The Cedar Post Graves"
 desc_omni_landmark_mounds_hamdurn_mod:0 "Haidian families mark the dead with carved hardwood posts. As the posts weather away, their descendants plant replacements on the same low mounds."
 omni_landmark_mounds_zacapuato_mod:0 "The Honey-Cup Mounds"
 desc_omni_landmark_mounds_zacapuato_mod:0 "Chipewyan households leave a little of the year's honey at these earthen graves. At the autumn gathering, elders use the offerings to teach children the names of their kin."
 omni_landmark_pact_oracle_mod:0 "Oracle of the Witness Stone"
 desc_omni_landmark_pact_oracle_mod:0 "Esmita visitors bring the keepers questions about disputed promises. The keepers hear both accounts in the courtyard before consulting their records of the Pact."
 omni_landmark_reef_fort_mod:0 "Sini Reef Fort"
 desc_omni_landmark_reef_fort_mod:0 "The island crews built a fort on the outer reef and used it to signal ships through the channel. Its garrison still watches the approaches and can shut the landing to hostile crews."
 omni_landmark_harbor_fort_mod:0 "Dunzpon Breakwater Citadel"
 desc_omni_landmark_harbor_fort_mod:0 "The coastal garrison keeps its stores in a walled citadel across the harbor. Watch boats pass between the citadel and the shore to report unfamiliar sails."
 omni_landmark_lighthouse_mod:0 "Kui-Shumo Harbor Light"
 desc_omni_landmark_lighthouse_mod:0 "Wine shippers pay for oil to keep the harbor light burning. Its keepers guide late arrivals past the shoals and mark the ships due to pay dues when the harbor opens."
