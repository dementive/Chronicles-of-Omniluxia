l_english:
 imperial_mages:0 "Imperial Mages"
 imperial_mages_noculturegroup:0 "Imperial Mages"
 imperial_mages_desc:0 "In the academy yards, students of the #E Imperial Standard#! learn to raise their wards and release a working on the same count, and a cohort that holds that count under fire is worth more to a general than any wall of shields. When the infantry in front of them keeps the enemy at a spear's length, their volleys can split a shield line or turn an elephant charge back into its own ranks.\n\nEvery working leaves them drained for a long moment afterward, however, and riders who reach them in that moment find robed scholars with no armor and nowhere to run. A general who sends them out without a screen should expect to read their names on the casualty rolls before the week is out."
 folk_mages:0 "Folk Mages"
 folk_mages_noculturegroup:0 "Folk Mages"
 folk_mages_desc:0 "Folk mages learned their craft from a grandmother's charms, a miller's weather-sayings, or the hedge-witch who kept the village wells sweet, and when the muster is called they come down from the hill farms with herbs and gem-shards wrapped in waxed cloth. Their workings are rougher than anything taught in the academies, although a cohort of them can set dry grass burning under an enemy's feet or unsettle a levy that has never faced magic before.\n\nThey march farther on less bread than any drilled cohort, and they know which paths through a marsh will hold a man's weight. When heavy horse reach them on open ground, though, they break like any other villagers, and a band of them caught without infantry in front rarely comes home to tell the village what happened."

