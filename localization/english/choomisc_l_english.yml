l_english:

 ZANNI_LORE_DESCRIPTION: "The #T Zani Empire#! was once the mightiest nation in #G Omniluxia#! but is now shattered, a mere shadow of itself, divided and on the verge of destruction from all sides.\nWill it ever reunite or stay divided between two separate centers of legislative is a question that many claimants have sought to answer, and yet none have thus far managed to reforge the Broken Empire."

 LUXTERRICHE_LORE_DESCRIPTION: "Werhenland was located in centre of #G Omniluxia#! when it was one continent, and long did the #Y Werhenlanders#! struggle against the encroachments of the #T Zani Empire#!. Most of Werhenlandish nations converted to the #T Helluvian#! faith, and the proud Knights that rule over their society were quick to harness the religious strife within their lands in order to wage wars of aggression against the heretics."


 HIGH_ELVEN_LORE_DESCRIPTION: "#Y High Elven#! nations mastered the ocean and sent their colonists around #G Omniluxia#!, where a large portion of them settled on #Y Arteon#!, waging war against the human kingdoms and enslaving their population. #G Elven#! domination is seen by independent nations of the isle as an existential threat, but they are seemingly unable to place aside their personal squabbles in order to repel the invaders. Undeterred by any resistance they have encountered, #Y High Elves#! send various expeditions around #Y Omniluxian#! continents to seek more land and power."

 FOREST_ELVEN_LORE_DESCRIPTION: "Long, long ago, Wood #T Elves#! were present in every corner of #G Omniluxia#!, but the expansion of human nations pushed them deeper into the woods that birthed them. As a culture, they find themselves in dire straights, for their forests are dying and their vicious neighbors are threatening to invade their homes. Although waging war is anathema to their spiritual beliefs, they are finding themselves more and more involved in the affairs of humankind, oftentimes being forced to fight for their very survival."

 COMMON_DWARVEN_LORE_DESCRIPTION: "In various regions of #G Omniluxia#!, one can encounter the Common #T Dwarves#!, who originally hailed from the #Y Skyreach Mountains#! but can now be found all across the world. Common #T Dwarves#! are masterful miners and architects, but chose to live on the surface of #G Omniluxia#! instead of deep underground, like their cousins the #Y Silver Dwarves#!. Once, it was said that the #T Dwarves#! ruled over one-fifth of #G Luxterra#!, but hordes of #T Old Dragkhans#! and #T Elves#! shattered the #Y Dwarven#! Empire and scattered their communities; ever since then, the #T Dwarves#! have contented themselves with what they have."

 DUNYDURCEG_LORE_DESCRIPTION: "#Y Dunydurceg#! were once the proud inhabitants living on the Great Steppes, content to live their simple lives under the stars until political meddling by the #Y Zani#! #Y Emperor#! forced their wrath upon the civilized lands. Heeding the call to war, their migration was the greatest disaster that the #T Zani Empire#! ever faced; caught unawares by the roving nomads, the #Y Zani#! lost a third of their empire in the initial invasion and almost saw their capital city fall to the invaders. One of the last accomplishments of the fading #Y Zani#! state was the campaign that saved them from the #Y Dunydurceg#! Horde, but they were unable to destroy the tribes, who proceeded to sack the rest of the Empire before permanently settling in the south."

