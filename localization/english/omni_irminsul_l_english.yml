l_english:
 root_of_first_spring_mod:0 "The Root of the First Spring"
 desc_root_of_first_spring_mod:0 "When the elves of Wenelru found a new hearth, they bring a bowl of its soil to Venerurich. The Seedwatcher presses a fallen leaf from the Root of First Spring into the earth and names the families who will tend it. In spring, those families return with the first green shoots from their fields."
 omni_venerurich_rootward_districts_mod:0 "The Rootward Districts"
 desc_omni_venerurich_rootward_districts_mod:0 "The families of Venerurich build their halls alongside the great roots that grow in this region, leaving the sacred soil undisturbed."
 wenelru_settled_tribe:0 "Covenant of the First Spring"
 wenelru_settled_tribe_desc:0 "The clan leaders of Wenelru choose a Seedwatcher to serve for life. Under the canopy at Venerurich, the Seedwatcher presses a fallen leaf from the Root of First Spring into the soil of each new hearth and names the families who will tend it. When the first shoots break the earth, those families bring them back as an offering to Mother Cafea."
 wenelru_settled_tribe_ruler:0 "Seedwatcher"
 wenelru_settled_tribe_ruler_female:0 "Seedwatcher"
