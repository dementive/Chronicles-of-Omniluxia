 omni_realm_ward_tt:0 "Removes Pestilence from your country, or wards it for 180 days against the next hostile country curse through Tier III. Your country can cast this spell once every 365 days. Base mana cost 100."
 omni_arcane_aegis_ii_tt:0 "For 30 days, the force gains +10% Land and Naval Morale, +5% Discipline and -5% Naval Damage Taken. Its ward absorbs one hostile troop spell through Tier III. A spent ward takes 30 days to rearm. Base mana cost 75."
