l_english:
 generic_vampire_dominion_title:0 "Dominion of the Night"
 generic_vampire_dominion:0 "The Sapping of [SCOPE.sP('generic_vampire_dominion_target').GetName]"
 generic_vampire_dominion_DESCRIPTION:0 "[ROOT.GetCountry.GetRuler.GetName|Y] has chosen the province of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] as [ROOT.GetCountry.GetRuler.GetHerHis] discreet larder for darker rites. Its people will endure a season of pallor, dread, and missing hours, while their [ROOT.GetCountry.GetRulerTitle] rises from the blood feast sharper, stronger, and more terrible than before."
 generic_vampire_dominion_CRITERIA_DESCRIPTION:0 "This mission will be considered complete after the vampire ruler has drawn enough strength from #Y [SCOPE.sP('generic_vampire_dominion_target').GetName]#! to found an undying court."

 generic_vampire_dominion_first_thirst:0 "The First Thirst"
 generic_vampire_dominion_first_thirst_desc:0 "The rite begins simply: a sealed road, a quiet house, a missing bell-ringer, and a ruler who wakes before dawn with color in [ROOT.GetCountry.GetRuler.GetHerHis] cheeks."
 generic_vampire_dominion_first_thirst_DESCRIPTION:0 "The rite begins simply: a sealed road, a quiet house, a missing bell-ringer, and a ruler who wakes before dawn with color in [ROOT.GetCountry.GetRuler.GetHerHis] cheeks."
 generic_vampire_dominion_cull_skeptics:0 "Cull the Skeptics"
 generic_vampire_dominion_cull_skeptics_desc:0 "A few people in [SCOPE.sP('generic_vampire_dominion_target').GetName] have seen too much and talk too freely. Their fear will teach the rest to lower their eyes."
 generic_vampire_dominion_cull_skeptics_DESCRIPTION:0 "A few people in [SCOPE.sP('generic_vampire_dominion_target').GetName] have seen too much and talk too freely. Their fear will teach the rest to lower their eyes."
 generic_vampire_dominion_midnight_feeding:0 "The Midnight Tithe"
 generic_vampire_dominion_midnight_feeding_desc:0 "The strongest households will leave a bowl, a name, and an unlocked door at midnight. By morning they will remember nothing but the command to obey."
 generic_vampire_dominion_midnight_feeding_DESCRIPTION:0 "The strongest households will leave a bowl, a name, and an unlocked door at midnight. By morning they will remember nothing but the command to obey."
 generic_vampire_dominion_thralls_in_silk:0 "Thralls In Silk"
 generic_vampire_dominion_thralls_in_silk_desc:0 "Not every servant must be chained. Some are flensed more subtly: five souls from the region will be quietly surrendered to the dark, and in their place a pale host of wraiths will gather at the ruler's call."
 generic_vampire_dominion_thralls_in_silk_DESCRIPTION:0 "Not every servant must be chained. Some are flensed more subtly: five souls from the region will be quietly surrendered to the dark, and in their place a pale host of wraiths will gather at the ruler's call."
 generic_vampire_dominion_sealed_crypt:0 "The Sealed Crypt"
 generic_vampire_dominion_sealed_crypt_desc:0 "A cold chamber will be dug beneath [SCOPE.sP('generic_vampire_dominion_target').GetName], where the sun cannot pry and the stones remember every whispered oath."
 generic_vampire_dominion_sealed_crypt_DESCRIPTION:0 "A cold chamber will be dug beneath [SCOPE.sP('generic_vampire_dominion_target').GetName], where the sun cannot pry and the stones remember every whispered oath."
 generic_vampire_dominion_taste_for_politics:0 "A Taste for Politics"
 generic_vampire_dominion_taste_for_politics_desc:0 "Envoys, advocates, and ambitious local worthies all carry excellent blood. Their secrets are almost as nourishing as their terror."
 generic_vampire_dominion_taste_for_politics_DESCRIPTION:0 "Envoys, advocates, and ambitious local worthies all carry excellent blood. Their secrets are almost as nourishing as their terror."
 generic_vampire_dominion_pale_retinue:0 "The Pale Retinue"
 generic_vampire_dominion_pale_retinue_desc:0 "The bravest youths of [SCOPE.sP('generic_vampire_dominion_target').GetName] will guard the night roads. They will be less brave afterward, but far more useful."
 generic_vampire_dominion_pale_retinue_DESCRIPTION:0 "The bravest youths of [SCOPE.sP('generic_vampire_dominion_target').GetName] will guard the night roads. They will be less brave afterward, but far more useful."
 generic_vampire_dominion_court_of_whispers:0 "Court of Whispers"
 generic_vampire_dominion_court_of_whispers_desc:0 "Every secret in the province will pass through the same dark room. By dawn, [ROOT.GetCountry.GetRuler.GetFirstName] will know which lies are worth drinking."
 generic_vampire_dominion_court_of_whispers_DESCRIPTION:0 "Every secret in the province will pass through the same dark room. By dawn, [ROOT.GetCountry.GetRuler.GetFirstName] will know which lies are worth drinking."
 generic_vampire_dominion_unnatural_mist:0 "The Mist That Does Not Lift"
 generic_vampire_dominion_unnatural_mist_desc:0 "A grey veil will settle over [SCOPE.sP('generic_vampire_dominion_target').GetName]. Travelers will lose roads they have walked since childhood, and the ruler will never lose a scent."
 generic_vampire_dominion_unnatural_mist_DESCRIPTION:0 "A grey veil will settle over [SCOPE.sP('generic_vampire_dominion_target').GetName]. Travelers will lose roads they have walked since childhood, and the ruler will never lose a scent."
 generic_vampire_dominion_drained_herds:0 "Livestock Found Drained"
 generic_vampire_dominion_drained_herds_desc:0 "The cattle will be found pale in the fields, the shepherds pale beside them. Crude blood is still blood, and hunger is not always refined."
 generic_vampire_dominion_drained_herds_DESCRIPTION:0 "The cattle will be found pale in the fields, the shepherds pale beside them. Crude blood is still blood, and hunger is not always refined."
 generic_vampire_dominion_wolves_at_treeline:0 "Wolves at the Treeline"
 generic_vampire_dominion_wolves_at_treeline_desc:0 "The night beasts have learned who rules these fields. A little blood thrown to the dark will buy their teeth, if not their affection."
 generic_vampire_dominion_wolves_at_treeline_DESCRIPTION:0 "The night beasts have learned who rules these fields. A little blood thrown to the dark will buy their teeth, if not their affection."
 generic_vampire_dominion_crows_never_leave:0 "The Crows Never Leave"
 generic_vampire_dominion_crows_never_leave_desc:0 "Black wings gather on roofs, shrines, and gallows. They see everything in [SCOPE.sP('generic_vampire_dominion_target').GetName], and some master has taught them where to look."
 generic_vampire_dominion_crows_never_leave_DESCRIPTION:0 "Black wings gather on roofs, shrines, and gallows. They see everything in [SCOPE.sP('generic_vampire_dominion_target').GetName], and some master has taught them where to look."
 generic_vampire_dominion_candlelight_never_gutters:0 "Candlelight Never Gutters"
 generic_vampire_dominion_candlelight_never_gutters_desc:0 "The people of [SCOPE.sP('generic_vampire_dominion_target').GetName] will work all night rather than close their eyes. Their fear is inefficient, but their exhaustion is instructive."
 generic_vampire_dominion_candlelight_never_gutters_DESCRIPTION:0 "The people of [SCOPE.sP('generic_vampire_dominion_target').GetName] will work all night rather than close their eyes. Their fear is inefficient, but their exhaustion is instructive."
 generic_vampire_dominion_silence_after_dusk:0 "Silence After Dusk"
 generic_vampire_dominion_silence_after_dusk_desc:0 "At sunset, [SCOPE.sP('generic_vampire_dominion_target').GetName] will become obediently still. No song, no cartwheel, no prayer loud enough to interrupt the ruler's thoughts."
 generic_vampire_dominion_silence_after_dusk_DESCRIPTION:0 "At sunset, [SCOPE.sP('generic_vampire_dominion_target').GetName] will become obediently still. No song, no cartwheel, no prayer loud enough to interrupt the ruler's thoughts."
 generic_vampire_dominion_undying_court:0 "The Undying Court"
 generic_vampire_dominion_undying_court_desc:0 "The province has yielded blood, fear, secrets, beasts, and sleepless devotion. It is time to crown the harvest and leave a pale court in its wake."
 generic_vampire_dominion_undying_court_DESCRIPTION:0 "The province has yielded blood, fear, secrets, beasts, and sleepless devotion. It is time to crown the harvest and leave a pale court in its wake."

 generic_vampire_dominion_bloodless_nights_pmod:0 "Bloodless Nights"
 generic_vampire_dominion_bloodless_nights_pmod_desc:0 "People wake weak and bloodless, unable to explain the pinprick wounds at their throats."
 generic_vampire_dominion_culled_doubters_pmod:0 "Culled Doubters"
 generic_vampire_dominion_culled_doubters_pmod_desc:0 "The loudest skeptics have vanished. The survivors are quiet, obedient, and much less productive."
 generic_vampire_dominion_night_tithe_pmod:0 "The Night Tithe"
 generic_vampire_dominion_night_tithe_pmod_desc:0 "Households leave offerings after sundown, and every offering seems to leave the province a little weaker."
 generic_vampire_dominion_thrall_levies_pmod:0 "Thrall Levies"
 generic_vampire_dominion_thrall_levies_pmod_desc:0 "Able-bodied locals have been drawn into private service, leaving farms and muster rolls thin."
 generic_vampire_dominion_sealed_crypt_pmod:0 "The Sealed Crypt"
 generic_vampire_dominion_sealed_crypt_pmod_desc:0 "A hidden crypt chills the land above it. The locals avoid the place, though none can say why."
 generic_vampire_dominion_guest_who_never_left_pmod:0 "The Guest Who Never Left"
 generic_vampire_dominion_guest_who_never_left_pmod_desc:0 "An important visitor entered the ruler's hospitality and never departed. Trade and trust have both suffered."
 generic_vampire_dominion_pale_retinue_pmod:0 "The Pale Retinue"
 generic_vampire_dominion_pale_retinue_pmod_desc:0 "The province's strongest recruits have become silent attendants to the throne."
 generic_vampire_dominion_court_of_whispers_pmod:0 "Court of Whispers"
 generic_vampire_dominion_court_of_whispers_pmod_desc:0 "Informers and frightened petitioners crowd the shadows. Good ideas die quickly in such air."
 generic_vampire_dominion_unnatural_mist_pmod:0 "Unnatural Mist"
 generic_vampire_dominion_unnatural_mist_pmod_desc:0 "A strange mist clings to the roads and fields, slowing travelers and dulling local labor."
 generic_vampire_dominion_drained_herds_pmod:0 "The Drained Herds"
 generic_vampire_dominion_drained_herds_pmod_desc:0 "Livestock are found empty in the morning fields, and the granaries seem to empty with them."
 generic_vampire_dominion_wolves_grown_bold_pmod:0 "Wolves Grown Bold"
 generic_vampire_dominion_wolves_grown_bold_pmod_desc:0 "Predators prowl too close to the roads, and fewer locals volunteer for hard service."
 generic_vampire_dominion_where_crows_gather_pmod:0 "Where the Crows Gather"
 generic_vampire_dominion_where_crows_gather_pmod_desc:0 "Watching birds crowd the shrines and rooftops, souring worship and daily life."
 generic_vampire_dominion_sleepless_village_pmod:0 "The Sleepless Village"
 generic_vampire_dominion_sleepless_village_pmod_desc:0 "The people keep candles burning until dawn. Work continues, but no one works well without sleep."
 generic_vampire_dominion_quiet_hours_pmod:0 "The Quiet Hours"
 generic_vampire_dominion_quiet_hours_pmod_desc:0 "Fear keeps the peace after sunset, though markets and hearths both suffer from the silence."
 generic_vampire_dominion_seat_of_pale_court_pmod:0 "Seat of the Pale Court"
 generic_vampire_dominion_seat_of_pale_court_pmod_desc:0 "The province has become a chosen haunt of the ruler's undying court, honored only in the way prey is honored."
 generic_vampire_dominion_culled_doubters_cmod:0 "Culled the Skeptics"
 generic_vampire_dominion_culled_doubters_cmod_desc:0 "Those who questioned the ruler's nature have learned that discretion is healthier than curiosity."
 generic_vampire_dominion_taste_for_politics_cmod:0 "A Taste for Politics"
 generic_vampire_dominion_taste_for_politics_cmod_desc:0 "Diplomacy seems easier after sampling the fears and ambitions of important guests."
 generic_vampire_dominion_pale_retinue_cmod:0 "The Pale Retinue"
 generic_vampire_dominion_pale_retinue_cmod_desc:0 "Unnaturally loyal attendants haunt the palace corridors and obey without hesitation."
 generic_vampire_dominion_realm_of_the_undying_cmod:0 "Realm of the Undying"
 generic_vampire_dominion_realm_of_the_undying_cmod_desc:0 "The realm remembers a season when the night ruled openly and few dared to resist."

 generic_vampire_dominion_vigor_of_the_drained_charmod:0 "Vigor of the Drained"
 generic_vampire_dominion_vigor_of_the_drained_charmod_desc:0 "Borrowed life quickens the body and sharpens the hand."
 generic_vampire_dominion_scent_of_obedience_charmod:0 "Scent of Obedience"
 generic_vampire_dominion_scent_of_obedience_charmod_desc:0 "Fear has a flavor, and this ruler has learned to savor it."
 generic_vampire_dominion_warm_blood_charmod:0 "Warm Blood"
 generic_vampire_dominion_warm_blood_charmod_desc:0 "Fresh strength burns beneath dead flesh."
 generic_vampire_dominion_silken_thralls_charmod:0 "Silken Thralls"
 generic_vampire_dominion_silken_thralls_charmod_desc:0 "Charmed servants anticipate commands before they are spoken."
 generic_vampire_dominion_deathless_repose_charmod:0 "Deathless Repose"
 generic_vampire_dominion_deathless_repose_charmod_desc:0 "Hidden rest and stolen warmth make the ruler unnervingly lucid."
 generic_vampire_dominion_sweetened_tongue_charmod:0 "Sweetened Tongue"
 generic_vampire_dominion_sweetened_tongue_charmod_desc:0 "The ruler's voice carries the softness of invitation and the weight of a locked door."
 generic_vampire_dominion_pale_captain_charmod:0 "Pale Captain"
 generic_vampire_dominion_pale_captain_charmod_desc:0 "The ruler commands with cold precision, and bloodless attendants move as one."
 generic_vampire_dominion_whisper_drinker_charmod:0 "Whisper Drinker"
 generic_vampire_dominion_whisper_drinker_charmod_desc:0 "Secrets settle in the mind like rich wine."
 generic_vampire_dominion_mist_walker_charmod:0 "Mist Walker"
 generic_vampire_dominion_mist_walker_charmod_desc:0 "No fog can confuse a predator who made it."
 generic_vampire_dominion_beast_blood_charmod:0 "Beast Blood"
 generic_vampire_dominion_beast_blood_charmod_desc:0 "Cruder feedings stir older instincts."
 generic_vampire_dominion_lord_of_hungers_charmod:0 "Lord of Hungers"
 generic_vampire_dominion_lord_of_hungers_charmod_desc:0 "The ruler's predatory will has become almost martial in its clarity."
 generic_vampire_dominion_carrion_sight_charmod:0 "Carrion Sight"
 generic_vampire_dominion_carrion_sight_charmod_desc:0 "Omens gather wherever weakness is about to become useful."
 generic_vampire_dominion_sleepless_mind_charmod:0 "Sleepless Mind"
 generic_vampire_dominion_sleepless_mind_charmod_desc:0 "The stolen nights of others become a ruler's impossible focus."
 generic_vampire_dominion_dusk_command_charmod:0 "Dusk Command"
 generic_vampire_dominion_dusk_command_charmod_desc:0 "When the sun falls, every voice seems to wait for permission."
 generic_vampire_dominion_lord_of_the_sapped_domain_charmod:0 "Lord of the Sapped Domain"
 generic_vampire_dominion_lord_of_the_sapped_domain_charmod_desc:0 "An entire province's dread has been rendered into poise, hunger, and terrible authority."
