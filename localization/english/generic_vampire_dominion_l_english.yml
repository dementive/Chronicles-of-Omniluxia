l_english:
 generic_vampire_dominion:0 "The Undying Court of [ROOT.GetCountry.GetRuler.GetFirstName]"
 generic_vampire_dominion_DESCRIPTION:0 "The hunger is constant. It is time to embrace what we have become and shape our domain accordingly."
 generic_vampire_dominion_CRITERIA_DESCRIPTION:0 "This mission will be considered complete after we spread our #R Vampiric#! authority throughout the realm."
 generic_vampire_dominion_first_thirst:0 "The First Thirst"
 generic_vampire_dominion_first_thirst_desc:0 "The hunger is constant. It is time to embrace what we have become and shape our domain accordingly."
 generic_vampire_dominion_first_thirst_DESCRIPTION:0 "The hunger is constant. It is time to embrace what we have become and shape our domain accordingly."
 generic_vampire_dominion_cull_skeptics:0 "Cull The Skeptics"
 generic_vampire_dominion_cull_skeptics_desc:0 "There are always those who suspect too much. They must be dealt with before their whispers take root."
 generic_vampire_dominion_cull_skeptics_DESCRIPTION:0 "There are always those who suspect too much. They must be dealt with before their whispers take root."
 generic_vampire_dominion_midnight_feeding:0 "The Midnight Feeding"
 generic_vampire_dominion_midnight_feeding_desc:0 "We must feed. Choose a victim from among our court and take what is owed to us."
 generic_vampire_dominion_midnight_feeding_DESCRIPTION:0 "We must feed. Choose a victim from among our court and take what is owed to us."
 generic_vampire_dominion_thralls_in_silk:0 "Thralls In Silk"
 generic_vampire_dominion_thralls_in_silk_desc:0 "Loyal servants are worth more than gold. A few well-placed thralls among the nobility will serve us better than any army."
 generic_vampire_dominion_thralls_in_silk_DESCRIPTION:0 "Loyal servants are worth more than gold. A few well-placed thralls among the nobility will serve us better than any army."
 generic_vampire_dominion_sealed_crypt:0 "The Sealed Crypt"
 generic_vampire_dominion_sealed_crypt_desc:0 "Every lord of the night requires a sanctum. A place of rest where the sun's rays cannot reach."
 generic_vampire_dominion_sealed_crypt_DESCRIPTION:0 "Every lord of the night requires a sanctum. A place of rest where the sun's rays cannot reach."
 generic_vampire_dominion_taste_for_politics:0 "A Taste For Politics"
 generic_vampire_dominion_taste_for_politics_desc:0 "The blood of ambassadors and emissaries carries a certain refinement. Let us extend our hospitality to a foreign envoy."
 generic_vampire_dominion_taste_for_politics_DESCRIPTION:0 "The blood of ambassadors and emissaries carries a certain refinement. Let us extend our hospitality to a foreign envoy."
 generic_vampire_dominion_pale_retinue:0 "The Pale Retinue"
 generic_vampire_dominion_pale_retinue_desc:0 "Our thralled servants shall be formally ordained as our personal guard. None will harm us while they draw breath."
 generic_vampire_dominion_pale_retinue_DESCRIPTION:0 "Our thralled servants shall be formally ordained as our personal guard. None will harm us while they draw breath."
 generic_vampire_dominion_court_of_whispers:0 "Court Of Whispers"
 generic_vampire_dominion_court_of_whispers_desc:0 "Let the courtiers gossip and scheme in fearful whispers. Their paranoia is our harvest."
 generic_vampire_dominion_court_of_whispers_DESCRIPTION:0 "Let the courtiers gossip and scheme in fearful whispers. Their paranoia is our harvest."
 generic_vampire_dominion_unnatural_mist:0 "The Mist That Doesn't Lift"
 generic_vampire_dominion_unnatural_mist_desc:0 "A strange mist has settled over the land. It confuses travelers and smothers the light. Let it linger."
 generic_vampire_dominion_unnatural_mist_DESCRIPTION:0 "A strange mist has settled over the land. It confuses travelers and smothers the light. Let it linger."
 generic_vampire_dominion_drained_herds:0 "Livestock Found Drained"
 generic_vampire_dominion_drained_herds_desc:0 "The cattle are found pale and empty in the morning fields. The farmers whisper of blight. We know better."
 generic_vampire_dominion_drained_herds_DESCRIPTION:0 "The cattle are found pale and empty in the morning fields. The farmers whisper of blight. We know better."
 generic_vampire_dominion_wolves_at_treeline:0 "Wolves At The Treeline"
 generic_vampire_dominion_wolves_at_treeline_desc:0 "The wolves grow bolder with each passing night. They have learned that the master of this land provides."
 generic_vampire_dominion_wolves_at_treeline_DESCRIPTION:0 "The wolves grow bolder with each passing night. They have learned that the master of this land provides."
 generic_vampire_dominion_crows_never_leave:0 "The Crows Never Leave"
 generic_vampire_dominion_crows_never_leave_desc:0 "The crows have stopped migrating. They perch on every rooftop and fencepost, watching. The superstitious folk are terrified."
 generic_vampire_dominion_crows_never_leave_DESCRIPTION:0 "The crows have stopped migrating. They perch on every rooftop and fencepost, watching. The superstitious folk are terrified."
 generic_vampire_dominion_candlelight_never_gutters:0 "Candlelight Never Gutters"
 generic_vampire_dominion_candlelight_never_gutters_desc:0 "The villagers burn their candles through the night, afraid to sleep in the dark. Their industry is tireless."
 generic_vampire_dominion_candlelight_never_gutters_DESCRIPTION:0 "The villagers burn their candles through the night, afraid to sleep in the dark. Their industry is tireless."
 generic_vampire_dominion_silence_after_dusk:0 "Silence After Dusk"
 generic_vampire_dominion_silence_after_dusk_desc:0 "When the sun sets, the realm falls silent. Doors are barred. Curtains drawn. The night belongs to us."
 generic_vampire_dominion_silence_after_dusk_DESCRIPTION:0 "When the sun sets, the realm falls silent. Doors are barred. Curtains drawn. The night belongs to us."
 generic_vampire_dominion_undying_court:0 "The Undying Court"
 generic_vampire_dominion_undying_court_desc:0 "The realm has accepted its true nature. We rule not in spite of what we are, but because of it."
 generic_vampire_dominion_undying_court_DESCRIPTION:0 "The realm has accepted its true nature. We rule not in spite of what we are, but because of it."
 generic_vampire_dominion_bloodless_nights_pmod:0 "Bloodless Nights"
 generic_vampire_dominion_bloodless_nights_pmod_desc:0 "The smallfolk grow pale and tired. They sleep uneasily and wake exhausted. Something is draining the life from this province."
 generic_vampire_dominion_sealed_crypt_pmod:0 "The Sealed Crypt"
 generic_vampire_dominion_sealed_crypt_pmod_desc:0 "A cold crypt lies hidden beneath the capital. The air around it is unnaturally still, and locals give it a wide berth."
 generic_vampire_dominion_guest_who_never_left_pmod:0 "The Guest Who Never Left"
 generic_vampire_dominion_guest_who_never_left_pmod_desc:0 "A foreign envoy came to court and never departed. They are seen sometimes, pale and silent, at odd hours."
 generic_vampire_dominion_court_of_whispers_pmod:0 "Court of Whispers"
 generic_vampire_dominion_court_of_whispers_pmod_desc:0 "Nobles speak in hushed tones. Betrayal is plotted in every shadow, but loyalty is bought with fear. The court is alive with paranoid energy."
 generic_vampire_dominion_unnatural_mist_pmod:0 "Unnatural Mist"
 generic_vampire_dominion_unnatural_mist_pmod_desc:0 "A strange mist clings to the ground long after dawn. Travelers lose their way and merchants arrive late, if at all."
 generic_vampire_dominion_drained_herds_pmod:0 "The Drained Herds"
 generic_vampire_dominion_drained_herds_pmod_desc:0 "Livestock are found drained of blood each morning. The farmers are too afraid to speak of it, but the herds dwindle."
 generic_vampire_dominion_wolves_grown_bold_pmod:0 "Wolves Grown Bold"
 generic_vampire_dominion_wolves_grown_bold_pmod_desc:0 "The wolves have grown bold, taking livestock and the occasional traveler. But they also guard the approaches, savaging any who come uninvited."
 generic_vampire_dominion_where_crows_gather_pmod:0 "Where the Crows Gather"
 generic_vampire_dominion_where_crows_gather_pmod_desc:0 "The crows never leave. They watch from every branch and rooftop, and their presence has unsettled the faithful."
 generic_vampire_dominion_sleepless_village_pmod:0 "The Sleepless Village"
 generic_vampire_dominion_sleepless_village_pmod_desc:0 "The villagers work through the night, too afraid to sleep. Their productivity has increased, but their eyes are hollow."
 generic_vampire_dominion_quiet_hours_pmod:0 "The Quiet Hours"
 generic_vampire_dominion_quiet_hours_pmod_desc:0 "After dusk, the realm falls silent. No one ventures out. Fear keeps perfect order until dawn."
 generic_vampire_dominion_seat_of_pale_court_pmod:0 "Seat of the Pale Court"
 generic_vampire_dominion_seat_of_pale_court_pmod_desc:0 "The capital is the heart of a realm that belongs to the night. Visitors feel watched, and the locals know better than to ask questions."
 generic_vampire_dominion_culled_doubters_cmod:0 "Culled the Skeptics"
 generic_vampire_dominion_culled_doubters_cmod_desc:0 "Those who questioned our rule have been silenced. The court has learned that discretion is the better part of survival."
 generic_vampire_dominion_taste_for_politics_cmod:0 "A Taste for Politics"
 generic_vampire_dominion_taste_for_politics_cmod_desc:0 "Our reach extends beyond our borders. Foreign courts have begun to fear our envoys, and fear commands respect."
 generic_vampire_dominion_pale_retinue_cmod:0 "The Pale Retinue"
 generic_vampire_dominion_pale_retinue_cmod_desc:0 "A cadre of unnervingly loyal attendants surrounds the throne. Their devotion is absolute, their obedience unquestioning."
 generic_vampire_dominion_realm_of_the_undying_cmod:0 "Realm of the Undying"
 generic_vampire_dominion_realm_of_the_undying_cmod_desc:0 "This realm has fully accepted its master's nature. The people know what their ruler is, and they have made their peace with it. Order prevails."
