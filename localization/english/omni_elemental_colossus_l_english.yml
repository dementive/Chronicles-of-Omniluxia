l_english:
 omni_elemental_colossus:0 "Elemental Colossus"
 omni_elemental_colossus_desc:0 "A towering stone elemental called forth to break sieges."
 omni_colossus_siege_mod:0 "Elemental Colossus"
 desc_omni_colossus_siege_mod:0 "A towering stone elemental lends its strength to this army's sieges."
 omni_elemental_colossus_casting_requirement_tt:0 "The casting mage must have #Y Elementalist or Druid mastery#! and #Y personally command one of your armies on land#!. The army must be out of exile."
 omni_elemental_colossus_effect_tt:0 "$omni_elemental_colossus_casting_requirement_tt$\nSummons #Y one Elemental Colossus#! with #Y 5,000 strength#! across ten cohorts at the caster's army on land. The Colossus lasts until destroyed and cannot recover lost strength. Each country can sustain only #Y one Colossus#!. Its army gains #Y +40% Siege Ability#!, and the Colossus can assault.\nOutside battle, it forms a separate army you can merge with your siege force.\nBase cost: #Y 200 mana#!.\n#R Cooldown:#! #Y 365 days#!, shared by all mages in your country."
 omni_elemental_colossus_spellbook_effect_tt:0 "Summons #Y one Elemental Colossus#! with #Y 5,000 strength#! across ten cohorts in a land territory your country owns and controls. It forms a separate army that you can merge with your siege force. The Colossus lasts until destroyed and cannot recover lost strength. Each country can sustain only #Y one Colossus#!. Its army gains #Y +40% Siege Ability#!, and the Colossus can assault.\nBase cost: #Y 200 mana#!.\n#R Cooldown:#! #Y 365 days#!, shared by all mages in your country."
 omni_elemental_colossus_hills_combat_bonus:0 "Colossus Combat Bonus in Hills"
 omni_elemental_colossus_dry_hills_combat_bonus:0 "Colossus Combat Bonus in Dry Hills"
 omni_elemental_colossus_mountain_combat_bonus:0 "Colossus Combat Bonus in Mountains"
 omni_elemental_colossus_forest_combat_bonus:0 "Colossus Combat Bonus in Forests"
 omni_elemental_colossus_eldritch_forest_combat_bonus:0 "Colossus Combat Bonus in Eldritch Forests"
 omni_elemental_colossus_jungle_combat_bonus:0 "Colossus Combat Bonus in Jungles"
 omni_elemental_colossus_marsh_combat_bonus:0 "Colossus Combat Bonus in Marshes"
