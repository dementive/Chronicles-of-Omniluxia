l_english:
 ######RELIGIONS######
 the_first_emperor: "Zanisite"
 desc_the_first_emperor: "The Imperial #G Pantheon#! of #T Zanis#!, the first #Y Emperor#! of the #Y Zani#!, persists in the #Y Zani#! peoples who descend from him. #T Zanis#! continues to protect his people as a half-god, and the #T Zanisite#! Faith focuses upon honoring the memory and achievements of the greatest #Y Zani#! #Y Emperor#! with a series of rituals that ensures his divine presence remains within the land."

 the_old_pantheon: "Elemenic"
 desc_the_old_pantheon: "The #T Elemenic#! Faith is one of the most ancient forms of worship within #G Omniluxia#!, followed by the various #Y Goblin#! and #G Hobgoblin#! cultures around the world. They worship the primordial gods of #G Omniluxia#!, long-forgotten memories of ancient deities who shaped the world when it was young.\n\nAs inheritors of #Y Melodias#!' gift, the #T Elemenic#! faithful believe someone's 'man'a', or spiritual power, determines their place in the socio-religious hierarchy. One is able to increase their man'a by consuming the hearts of defeated foes."

 beatepian_pantheon: "Baetepian"
 desc_beatepian_pantheon: "The history of the indigenous #Y Baetep#! religion stretches back many thousands of years and is defined by the rituals that the priestly caste faithfully uphold. Manifesting as a polytheistic faith, the worship of #G Sutet#!, #Y Atepr#!, Sunet and others displays a deep reverence for the fundamental aspects of the natural world."

 great_wolf_pantheon: "Lupinite"
 desc_great_wolf_pantheon: "The pantheon of #G Lula#!, the Great Wolf God and his many reincarnations throughout time, #T Lupinite#! is an ancient religion that was once widespread throughout #G Omniluxia#!, but now remains at the edge of #Y Weagelia#! near where #G Lula#! is said to reside."

 victory_pantheon: "Viktreic"
 desc_victory_pantheon: "This pantheon praises the goddess of Victory, who gains her powers when successful conquests are consecrated to her; the more kingdoms that fall before her holy symbols, the stronger her omens become." 

 helluvian: "Helluvian"
 desc_helluvian: "The #T Helluvian#! Church claims to serve the one true god, the '#T Creator of All Things That Can Never Be Known#!', commonly referred to as '#T Hellas#!'. As well as #T Hellas#!, the #Y Helluvians#! honor #G Helluvius#!, the demi-god son of #T Hellas#! who preached his word until he ultimately sacrificed his own life to save the souls of all intelligent beings.\n\nWhile the Church has expanded under the guidance of the Shannahs, the spiritual leaders of the faith who reside in the Holy #Y City#! of #G Ddu-Nuinop#!, their authority and faith have been challenged by both heretics and heathens, most notably the #T Zainudian#! heresy. For centuries the #Y Helluvians#! have battled the followers of the Two #Y Prophets#!, hoping one day to destroy their heresy once and for all." 

 zainuddian: "Zainudian"
 desc_zainuddian: "Originally viewed as a heresy of the #T Helluvian#! faith, the #Y Zainudians#! claim that the true god #T Zain'ud#! revealed himself to two prophets, #G Jaoz the Bold#! and #G Bachin, Lord of Dui-Pattar#!, who abandoned their former lives of opulence and wealth in the northern cities to preach his word to the #Y Helluvians#!. Prosecuted by those they sought to save, the prophets were told to go south and find the #Y Zinduidian#! tribes, who would help expand the faith's influence across Southwestern #G Luxterra#! like wildfire, with many Jaxan, or Holy Defensive, Wars declared against those who held hopes of stamping out their beliefs.\n\nThe #Y Zainudians#! overcame their enemies, however, and now their religion thrives, with the faithful awaiting the promised Apocalypse that will free them from this mortal coil." 

 yedidyhan: "Yedidyhan"
 desc_yedidyhan: "Worshippers of the first #Y Vampire#!, #T Yedidyhan#!, the #Y Yedizi#! faithful are fanatic cultists feared and despised by all races. Despite being ostracized throughout the world, the #Y Vampire#! God's few but devoted followers dedicate their lives to bringing forth the Eternal Night which will set him free."

 blood_tainted_pantheon: "Melodianism"
 desc_blood_tainted_pantheon: "The religious movement known to most as '#T Blood-Stained#!' has recently been rapidly spreading across northeast #G Luxterra#!. It comes from the ways of the mysterious #Y Drow#! that once resided deep in the mountains there. Recently, many #Y Northlander#! and Norrfallian tribes have been embracing the dark ancient faith that the #Y Drow#! have followed for centuries. It is similar in some ways to the ancient #T Norrskalkiean#! faiths, but instead of embracing all aspects of emotional experience, the followers focus only upon the joys of misery, murder, and violence. Deceit and destruction are the prerogatives of the #T Blood-Stained#!, who have given themselves over entirely to the darkness." 

 zerywan_pantheon: "Zerywanic"
 desc_zerywan_pantheon: "The #T Zerywanic#! Faith comprises the traditional belief system of the ancient tribes that once conquered all across #G Luxterra#! before settling in the southern plains, and as such, contains many precepts and notions that were taken from the subjugated peoples that lived under the yoke of the #Y Zerywani#! Horde." 

 soul_cult:0 "Cult of the Soul"
 desc_soul_cult:0 "The #T Cult of the Soul#! is a cult which believes the consumption of soulgems is the only way to set the self free as well as the supposed souls trapped within the magic resource. Generally considered to be insane, with the lunacy being set off by the soulgems they consume, they are also often called the #Y Soul Devourers#!."

 father_protector_pantheon: "Peauxdu Houmon"
 desc_father_protector_pantheon: "The Chivalric Code. Patreic religious beliefs borrow heavily from the #Y Celtican#! manner of worship, but they are not as community-oriented as their traditionalist neighbors, which value the family over the individual; the Patreics have borrowed many of the Orcanite mantras that preach the worthiness of the Self, and there are even some #T Helluvian#! influences at play. Patreic beliefs have been favorably compared to a cosmopolitan version of the #Y Celtican#! Faith; they learn from those around them, adopting and growing to meet the challenges of the day." 

 dragkhan_pantheon: "Dragkhanic"
 desc_dragkhan_pantheon: "The #T Dragkhanic#! religion is the worship of the self, where one's own desires and wants are the only thing in the universe that matters. Rewards are given only to those who will take them and nothing is assured in this life except for one's own death; a dark philosophy that has many nihilistic connotations for the #T Dragkhanic#! faithful. #T Dragkhanic#! gods are creatures of cruelty and despair, leading armies of misery against the armies of good."  

 artheous_pantheon: "Artheousan"
 desc_artheous_pantheon: "When the world was young and the gods of #G Omniluxia#! struggled to contain the threat of the #G Dragons#! from destroying everything, there was a giant wyrm, a timeless beast of darkness named #Y Arteon#!, who was slain by the legendary human hero #T Artheousan#!. As the dragon lay dying, its breath and blood coalesced into the form of a beautiful woman; a bride for the mighty #T Artheousan#!, and the mother of the first #Y Arteonians#!. The #T Artheousan#! Faith honors the tradition of this first hero and founder of nations."  

 celtican_pantheon: "Celtican"
 desc_celtican_pantheon: "The #Y Celtican#! Faith comprises the traditional belief systems of the #Y Celtican#! people, who value simplicity in thinking, hard work and good, upstanding moral character. #Y Celtican#! beliefs are centered around the home and the hearth, with many families leading their own religious ceremonies. This is not a centralized religion, but one where the people are expected to manage their spiritual state themselves - a notion that is squarely #Y Celtican#! and reflects their pragmatic values."  

 shamanist_beliefs: "Velkopic"
 desc_shamanist_beliefs: "#T Velkopic#!, the religion of the snakefolk. #T Velkopic#! beliefs were once akin to that of a pantheon, however it now is filled with prophets all relating somehow to the last of the #Y World-Serpents#! called Ssertryss. Many such prophets gain powers thanks to this link to Ssertryss, and they all represent well what it means to be a good serpent... unfortunately what makes a good serpent and what makes a good man are quite different."   

 mother_earth_pantheon: "Aneic"
 desc_mother_earth_pantheon: "#T Aneic#! represents the various beliefs of the Wood #T Elves#!, mainly centered around worship of the forest and #Y Mother Earth#!, known to them as #G Cafea#!. Their gods are all #T Idrasil#!, or aspects of #G Mother Cafea#!, that preside over specific areas of everyday life.\n\nMost variations of this faith preach the Oneness of Nature and encourage followers to spend their time outdoors, where ceremonies are held under the canopy of the forest instead of the marble halls of the Temple. Aneids are traditionally pacifists that only fight defensive wars, however the large variety of beliefs across the Wood #G Elven#! tribes allows for certain cults to emphasize certain ideas and traditions."

 orcish_ancestral_faith: "Shta Mogddu" # Theravada
 desc_orcish_ancestral_faith: "The oldest and traditional form of #Y Orcish#! worship, the 'Old Path' promotes the nurturing and control of one's #T Inner Flame#! similar to newer sects. The key difference is that this branch puts the priestly Bugino class at the top of the caste system. Achieving #Y Otziggu#! is emphasized as the ultimate goal, thus the path to becoming a Soddhuzi is not encouraged and instead isolationism is promoted as a means to both control one's #T Inner Flame#! and attain enlightenment.\n\nIn decline since the rise of the #Y Great Nuhargorkan#!, '#Y Old Believers#!' stick to the mountains and jungles of the #G Bloody Isles#!, whose slopes have preserved their way of life for centuries."

 orcish_new_faith: "Mogdduzana" # Mahayana
 desc_orcish_new_faith: "Orkansuar is the umbrella term used to define the various cults and philosophies that make up the beliefs of the Orcs. Nearly all of these schools of thought are focused upon finding and nurturing one's #T Inner Flame#!, the divine spark that some other religions refer to as the 'soul'.\n\nA follower's relationship with their own #T Inner Flame#! changes and matures throughout life, and although most are content to let their lights naturally dim when it is time to pass into the next world, there are heretical Orkansuar sects that magically lengthen their lifespan through utilizing the dark arts known as the 'Black Flame'."   

 orcish_colony_faith: "Surath Mogddu" # Vajrayana
 desc_orcish_colony_faith: "A radical sect reflecting the circumstances of its founders, the 'Golden Path' argue that all races have the capability to achieve #Y Otziggu#!, and that adherence to the demands of one's caste does not affect one's #T Inner Flame#!. Rather, they argue, i"

 the_old_father_stone: "Hebric"
 desc_the_old_father_stone: "The #T Hebric#! religion of the Copper #T Dwarves#! is the most widespread of the three denominations. They believe that #Y Frei#! and #Y Dwadais#! are the true heirs of the #Y Stone#! Father, and their pantheon is filled with ancient dwarf-heroes of yore that ascended into godhood via their virtuous and mighty deeds; a promise to every dwarf that they, too, can hope to become like the gods themselves.\n\nProlific traders, their faith has been spread across #G Omniluxia#!, and although there are some humans that have converted to their ways, it remains mostly a dwarven faith." 

 the_old_father_silver: "Srrøhebrikk"
 desc_the_old_father_silver: "#T Srrøhebrikk#! is the #Y Silver Dwarven#! variation of the #T Hebric#! religion. The main split between #T Srrøhebrikk#! and the other #T Hebric#! faiths is the worship of the #Y Silver Dwarven#! pair, #G Hthgart#! and #Y Ferja#!, as the true heirs of the #Y Stone#! Father over the other two.\n\nThe most isolated and traditional of the three main groups, the #Y Silver Dwarves#! have retained many customs and ideas that disappeared as the Gold and Copper dwarves interacted with the other races of #G Omniluxia#!. Aside from that, the faith also promotes grand building projects and the promise of godhood in the form of ancestor worship. Due to the majority of their gods being mythical #Y Silver Dwarven#! heroes, there are few followers of the faith outside of the three main centers of #Y Silver Dwarven#! civilization. However, interactions with neighboring peoples have led some to converting and venerating their own ancestors alongside dwarven ones." 

 the_old_father_gold: "Da Ash-Hêbriq"
 desc_the_old_father_gold: "#T Da Ash-Hêbriq#! is the #Y Gold Dwarven#! interpretation of the #T Hebric#! faith. Followers worship the #Y Gold Dwarven#! pair, #Y Summsîr#! and Ava, as the true heirs of the #Y Stone#! Father over the others. Aside from that, deities are #Y Gold Dwarven#! heroes who have been laid to rest in the sacred Gold Caves alongside #Y Summsîr#! and Ava, which means that few other races outside of the #Y Gold Dwarves#! themselves adhere to the faith.\n\nThe #Y Gold Dwarves#! also pride themselves in their crafts, with the most beautiful and unique creations considered the most prestigious. The most faithful often create beautiful golden idols to commemorate their gods." 

 kuulvaal: "Kuulvåal"
 desc_kuulvaal: "#T Kuulvåal#!, or the 'One Worship' is the monothestic religion of the #Y Gnomes#!, who worship and revere only #G Wielkopan#!, or #G Wekuaa#!, over all other false gods. Believers also venerate various #T Taalvut#!, or angels, that help the common people in daily life.\n\nFinally, followers hope their devotion will be rewarded when a prophet emerges that will lead them back to their former homeland, a paradise known as Jaaltuvesk." 

 transcendence_enlighten: "Ascendic"
 desc_transcendence_enlighten: "#T Ascendic#! is the religion of the #Y High Elves#!, a name that is as much of a promise as it is a threat. The #Y High Elves#! view their culture to be superior over every others, and this includes spiritual matters as well; the adherents of the #T Ascendic#! Faith believe that their hour is at hand, and that soon they shall smash the false pantheons of the unbelievers - #T Ascendic#! supremacy is an inevitability."  

 vetalian_pantheon: "Vetalian"
 desc_vetalian_pantheon: "The #Y Vetalian#! beliefs are very old indeed, and those that worship the #Y Vetalian#! gods cling to their pantheon with a fervor that belies the people's love for their traditional deities. Throughout different periods of her history, #Y Vetalian#! beliefs have been suppressed by the invading armies, and it was only the faith of the people that kept their spirits high during the dark days of slavery. The #Y Vetalians#! Faith preaches the universality and inevitability of suffering, but promises that there is an end to the misery that we must endure."   

 seekers_beliefs: "Seekism"
 desc_seekers_beliefs: "The #Y Seekers#! are a religious cult that preaches the dissolution of one's ego, where one must renounce their identity and self in order to truly be free, for it is only when we have abandoned the chains of our past that we are able to Seek the Way. Their prophets and wise men agree that all that matters is the 'Seeking', although what exactly is being sought after is not told to non-believers. While the Way remains supreme, they pray to various deities, believing them to be avatars of the Path. Akin to something like a secret society, #Y Seekers#! have managed to seize control of entire kingdoms, turning the resources of their captive nations to furthering the Way." 

 ancestral_beliefs: "Karric"
 desc_ancestral_beliefs: "#T Karric#! belief refers to ancestor worship, and although there are religious differences between various cultures of #G Omniluxia#! that practice the #T Karric#! Faith, they are similar enough to be recognized as originating from the same source. #T Karric#! adherents value the memory of their forebears and try to be mindful of their own influences on the generations to come."  

 fallen_star_pantheon: "Stellaric"
 desc_fallen_star_pantheon:0 "The #T Stellaric#! faith is a fusion of 'the foreign' teachings coming from the mysterious eastern continent. The faith is filled with different philosophical beings with the ultimate goal being reaching the divine enlightment and becoming a star in the sky."
 #desc_fallen_star_pantheon: "The Stellaric Faith literally worships wealth, claiming it to be a visible sign of the blessing of the gods. Stellaric Ministers all but rule the Merchant Republics of the Errnorfallians, and the prime motivation of these nations remains on the making of money." 

 ####NEW RELIGIONS##### 
 northlander_pantheon: "Norrskalkiean"
 desc_northlander_pantheon: "The traditional religion of the various peoples of Northeastern #G Luxterra#! goes by many names, however they are united in their worship of the various nature spirits and ancestors which they believe inhabit the physical world.\n\nParticular emphasis is placed on the importance of emotions, which the northern tribes believe are gods that flow through all things and move the world."

 polari_pantheon: "Polaric"
 desc_polari_pantheon: "The beliefs of the #Y Polarians#! reflects their outlook on life due to the circumstances of their polar home. The #T Polaric#! Faith teaches that one should do their best to help others, but argues that the world is slowly corrupting into a state where nothing will be able to save it, not even the interventions of the #T Polaric#! faithful, and that when this happens, the Great Eclipse will occur and end the world. Being an important part of their history, the #Y Great Collapse#! is seen by the Polarics as the first sign of the end of days."

 werhenic_pantheon: "Werfudrian"
 desc_werhenic_pantheon: "The #T Werfudrian#! Faith is a belief system that is tempered by philosophy, with the good stewardship of the nation-state being the ultimate form of worship and a sign of true religious devotion. While not as exciting as other faiths - #T Werfudrian#! has been drily described as a librarian's religion, suitable only for bookworms and bores - the followers of this simple way of life often live happy and productive lives."

 eptelon_pantheon: "Eptelenic"
 desc_eptelon_pantheon: "The #T Eptelenic#! religion does not preach a universal truth or promise salvation to the entire world; it is only concerned with the island of #G Eptelon#! and its inhabitants. Because of its insular nature, many foreigners have completely ignored the #T Eptelenic#! religion, and perhaps with good reason, but the #T Eptelenic#! faithful see no reason to abandon the gods that protect their sacred island."

 mother_warrior_pantheon: "Madreic"
 desc_mother_warrior_pantheon: "A reactionary faith born from the conflict between the #Y Vetalians#! and #Y Zani#!, those who call themselves Knights of the Mother #Y Warrior#! split from the wider #Y Vetalian#! cults around the 5th century, and credit themselves for the #Y Zanic#! Evacuation of #Y Vetalia#!. Their esoteric rituals and tight-knit communities are hidden amongst the various Tonormo Orders found in the deep forests of #Y Vetalia#!.\n\nThe tenets of their faith are simple, yet strictly followed. Holding a Cyanh, initiates swear an oath to surrender their lives to the Mother #Y Warrior#!, their fellow knights, and to the Great Mission: driving out the foreigners from #Y Vetalia#!."

 light_religion: "Luminist"
 desc_light_religion: "The esoteric religion of the #Y Wraithkin#! is poorly understood, as the few willing to explain struggle to put into words their concepts of divinity. #Y Wraiths#! have no recollection of their previous lives, and instead can only fathom service to their mission and master, which they call the Light."

 kinone_pantheon: "Kino"
 desc_kinone_pantheon: "The religion of the #Y Kinones#! is based on the teachings of the twelve prophets, or #T Koni-Koni#!, and the worship of Kon. The '#T Kino#!', or expected way of life, that followers uphold are based on the writings of the prophets that often reflect the generous and altruistic nature of their people. Their various religious texts speak out against the cruelty of serfdom and slavery, preaching that no man is better than any other, but that all are equal in the eyes of Kon."

 hortenic_pantheon: "Hortenic"
 desc_hortenic_pantheon: "The ancient faith of the #T Hortenic#! people is as grim and humorless as its inhabitants, and its sacred texts are mostly filled with fearsome imagery of never-ending blizzards, frozen hells with howling winds, and demons made of ice. It is no wonder that most of the #Y Horteonians#! abandoned their traditional ways after they invaded the southern islands, although some back home still follow the old #T Hortenic#! rites."

 zorg_religion: "Zorganite"
 desc_zorg_religion: "The mysterious religion of the #Y Zorg#! is not possible to comprehend for most in #G Omniluxia#!; to many it would seem as if the #Y Zorg#! have no religious practices at all. It is all but impossible to find out for sure, though, as anyone close enough to communicate with the #Y Zorg#! does not last long; inevitably, they too become #Y Zorg#!."

 sun_religion: "Aheolist"
 desc_sun_religion: "The enigmatic religion of the #Y Sunset Elves#!, the cult of the #T Sun God#! #Y Aheol#! reveres him as an omnipotent being. Secret rituals are often conducted to earn his favor, and Kings that rule in his name achieve a sort of demi-god status amongst their people."

 aentora_religion: "Kka-Shatothui"
 desc_aentora_religion: "The traditional faith of the #Y Illorians#! consists of a pantheon of various different gods and deified heroes, including the #G Everything-King#! and his Twin Sons. However, the most important gods to these '#Y Old Believers#!' are #Y Aentora#! and #Y Muerthos#!, the dualistic gods of life and death. Followers value intelligence and skill over brute force and strength, values and traditions that still remain amongst #Y Illorian#! communities that have abandoned the old rites.\n\nWith the founding of the popular #T Helluvianism#!, the traditional faith of the '#Y Twin Gods#!' has been relegated to the far ends of the #Y Illorian#! world, with those faithful few carrying on the beliefs of their ancestors."

 godlost: "Maenuskartli"
 desc_godlost: "Centuries ago, the #T Manu#! were slaves serving the a great empire ruled by a tyrannical god. Thus, when the empire began to crack once their God-#Y Emperor#! was killed, the #T Manu#! rose up in revolt and killed their oppressors, claiming their destiny for themselves. Their religion centers around this story, and the destruction of tyrannical deities that restrict us from being truly free."
 
 the_hive_concord: "Hive Concord"
 desc_the_hive_concord: "The simple religion of the #Y Chivix#! revolves around the worship of the Queen and the hive, with an emphasis placed on the wellness of the community over the self."
 
 naathran_pact: "Wardenite Pact"
 desc_naathran_pact: "Across the East, outposts were created by #Y Na'athran#! to maintain imperial across the continent. When #Y Na'athran#! disappeared and the Empire fell, these outposts remained faithful to their oaths, swearing to protect the small pockets of imperial civilization until his eventual return."
 
 the_great_mycelium: "Hundred Schools of Kagayamashko"
 desc_the_great_mycelium: "All #Y Mycelar#! believe in the #T Great Mycelium#!, a fungal network that connects the world from the undergound. Despite this, Purplecap scholars and kings have fought over the answers to questions like their connection to Kagayamashko, it's role in their lives, and whether they should attempt to reconnect with it for centuries across their island home. Collectively, these beliefs are known as the Hundred Schools, although some speculate there were once more than a thousand different schools of thought amongst the inhabitants of #G Wiishmshoo#!."
 
 the_great_mycelium_imperial: "Kyoshii Kagayamashko"
 desc_the_great_mycelium_imperial: "The Imperial Canon enforced by the Kyoshii family across their empire declares that their royal lineage was divinely birthed from Kagayamashko itself to reabsorb all independent minds into it's fold once again. This state religion preaches absolute loyalty to the royal family and emphasizes followers' sacred mission to reconnect all minds that were once severed from the #T Great Mycelium#!."
 
 arame_dreaming: "Ijminga"
 desc_arame_dreaming: "The strange faith of the #Y Arame#! preaches concepts that are often poorly understood to outsiders. For the devoted, every creature passes through #T Ijminga#! during their sleep, a plain that encompasses the past, present, and future at the same time. It is in this sacred space that kings can learn from ancestors, long-forgotten empires, and see glimpses of the future."
 
 the_old_father_jade: "Destwa Hebred"
 desc_the_old_father_jade: "Perhaps the strangest denomination of #T Hebric#!, the faith practiced by the #Y Jade#! #T Dwarves#! of Dawastir retains many ancient dwarven traditions and customs lost in the west. Destwa shamans claim that their people descend from all six of the #Y Stone#! Father's children, and wear ornaments of jade and precious metals to symbolize their proximity to the divine earth. Like the other dwarven religions, hero-worship and deified kings are widespread, with the most prominent being Baodolin Lodiao. "
 
 moon_mothers: "Soluwai"
 desc_moon_mothers: "A minor cult practiced by some of the coastal #Y Cirenai#! peoples of western Gurin, devotees of this faith worship various goddesses they believe to live on the moon. Elaborate ceremonies and sacrifices are held to ensure that the goddesses continue their eternal dances and feasts that provide the moonlight which brings life to the lands. Followers also wear masks, so that the #T Soluwai#! know which of the beings on our world to bless."
 
 tide_mothers: "Gorwunai"
 desc_tide_mothers: "The cults of the Tide Mothers holds sway across the various coasts of Gurin, where their followers make sure to provide adequate sacrifices to ensure a safe and bountiful voyage."

 mountain_mothers: "Kalkanu"
 desc_mountain_mothers: "On the hills of Gurin where the #T Gorwunai#! hold no power, the #Y Wananu#! worship the Mountain Goddesses that live inside the small crevices of the rocky hills that dominate their environment. Only through proper sacrifice and elaborate costumed dances can these #T Kalkanu#! be appeased and allow for safe passages through the jagged peaks of Gurin."

 jungle_mothers: "Talaoskanu"
 desc_jungle_mothers: "Across the jungles of Gurin the jungle is said to sing at night, a symphony known to the faithful as the songs of the Jungle Goddesses. The plentiful fruits of the jungle of gurin are used both as body paint during ceremonies and for sacrifice to ensure that tribes are protected against monsters and creatures that prowl through the jungle at night."



# Possible use for another religion
# Happiness and sadness, joy and despair, love and hatred, war and peace - the duality of human emotional experience is viewed to flow from the same unified divine source, with all things being preordained from the beginning of time

