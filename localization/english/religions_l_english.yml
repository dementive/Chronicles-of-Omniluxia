l_english:
 ######RELIGIONS######
 the_first_emperor: "Zanisite"
 desc_the_first_emperor: "The Imperial Pantheon of Zanis, the first Emperor of the Zani, persists in the Zani peoples who descend from him. Zanis continues to protect his people as a half-god, and the Zanisite Faith focuses upon honoring the memory and achievements of the greatest Zani Emperor with a series of rituals that ensures his divine presence remains within the land."

 the_old_pantheon: "Elemenic"
 desc_the_old_pantheon: "The Elemenic Faith is one of the most ancient forms of worship within Omniluxia, followed by the various Goblin and Hobgoblin cultures around the world. They worship the primordial gods of Omniluxia, long-forgotten memories of ancient deities who shaped the world when it was young.\n\nAs inheritors of Melodias' gift, the Elemenic faithful believe someone's 'man'a', or spiritual power, determines their place in the socio-religious heirarchy. One is able to increase their man'a by consuming the hearts of defeated foes."

 beatepian_pantheon: "Baetepian"
 desc_beatepian_pantheon: "The history of the indigenous Baetep religion stretches back many thousands of years and is defined by the rituals that the priestly caste faithfully uphold. Manifesting as a polytheistic faith, the worship of Sutet, Atepr, Sunet and others displays a deep reverence for the fundamental aspects of the natural world."

 great_wolf_pantheon: "Lupinite"
 desc_great_wolf_pantheon: "The pantheon of Lula, the Great Wolf God and his many reincarnations throughout time, Lupinite is an ancient religion that was once widespread throughout Omniluxia, but now remains at the edge of Weagelia near where Lula is said to reside."

 victory_pantheon: "Viktreic"
 desc_victory_pantheon: "This pantheon praises the goddess of Victory, who gains her powers when successful conquests are consecrated to her; the more kingdoms that fall before her holy symbols, the stronger her omens become." 

 helluvian: "Helluvian"
 desc_helluvian: "The Helluvian Church claims to serve the one true god, the 'Creator of All Things That Can Never Be Known', commonly referred to as 'Hellas'. As well as Hellas, the Helluvians honor Helluvius, the demi-god son of Hellas who preached his word until he ultimately sacrificed his own life to save the souls of all intelligent beings.\n\nWhile the Church has expanded under the guidance of the Shannahs, the spiritual leaders of the faith who reside in the Holy City of Ddu-Nuinop, their authority and faith have been challenged by both heretics and heathens, most notably the Zainudian heresy. For centuries the Helluvians have battled the followers of the Two Prophets, hoping one day to destroy their heresy once and for all." 

 zainuddian: "Zainudian"
 desc_zainuddian: "Originally viewed as a heresy of the Helluvian faith, the Zainudians claim that the true god Zain'ud revealed himself to two prophets, Jaoz the Bold and Bachin, Lord of Dui-Pattar, who abandoned their former lives of opulence and wealth in the northern cities to preach his word to the Helluvians. Prosecuted by those they sought to save, the prophets were told to go south and find the Zinduidian tribes, who would help expand the faith's influence across Southwestern Luxterra  like wildfire, with many Jaxan, or Holy Defensive, Wars declared against those who held hopes of stamping out their beliefs.\n\nThe Zainudians overcame their enemies, however, and now their religion thrives, with the faithful awaiting the promised Apocalypse that will free them from this mortal coil." 

 yedidyhan: "Yedidyhan"
 desc_yedidyhan: "Worshippers of the first Vampire, Yedidyhan, the Yedizi faithful are fanatic cultists feared and despised by all races. Despite being ostracized throughout the world, the Vampire God's few but devoted followers dedicate their lives to bringing forth the Eternal Night which will set him free."

 blood_tainted_pantheon: "Blood-Stained"
 desc_blood_tainted_pantheon: "The religious movement known to most as 'Blood-Stained' has recently been rapidly spreading across northeast Luxterra. It comes from the ways of the mysterious Drow that once resided deep in the mountains there. Recently, many Northlander and Norrfallian tribes have been embracing the dark ancient faith that the Drow have followed for centuries. It is similar in some ways to the ancient Elemenic faith, but instead of embracing all aspects of emotional experience, the followers focus only upon the joys of misery, murder, and violence. Deceit and destruction are the prerogatives of the Blood-Stained, who have given themselves over entirely to the darkness." 

 zerywan_pantheon: "Zerywanic"
 desc_zerywan_pantheon: "The Zerywanic Faith comprises the traditional belief system of the ancient tribes that once conquered all across Luxterra before settling in the southern plains, and as such, contains many precepts and notions that were taken from the subjugated peoples that lived under the yoke of the Zerywani Horde." 

 soul_cult:0 "Cult of the Soul"
 desc_soul_cult:0 "The Cult of the Soul is a cult which believes the consumption of soulgems is the only way to set the self free as well as the supposed souls trapped within the magic resource. Generally considered to be insane, with the lunacy being set off by the soulgems they consume, they are also often called the Soul Devourers."

 father_protector_pantheon: "Patreic"
 desc_father_protector_pantheon: "Patreic religious beliefs borrow heavily from the Celtican manner of worship, but they are not as community-oriented as their traditionalist neighbors, which value the family over the individual; the Patreics have borrowed many of the Orcanite mantras that preach the worthiness of the Self, and there are even some Helluvian influences at play. Patreic beliefs have been favorably compared to a cosmopolitan version of the Celtican Faith; they learn from those around them, adopting and growing to meet the challenges of the day." 

 dragkhan_pantheon: "Dragkhanic"
 desc_dragkhan_pantheon: "The Dragkhanic religion is the worship of the self, where one's own desires and wants are the only thing in the universe that matters. Rewards are given only to those who will take them and nothing is assured in this life except for one's own death; a dark philosophy that has many nihilistic connotations for the Dragkhanic faithful. Dragkhanic gods are creatures of cruelty and despair, leading armies of misery against the armies of good."  

 artheous_pantheon: "Artheousan"
 desc_artheous_pantheon: "When the world was young and the gods of Omniluxia struggled to contain the threat of the Dragons from destroying everything, there was a giant wyrm, a timeless beast of darkness named Arteon, who was slain by the legendary human hero Artheousan. As the dragon lay dying, its breath and blood coalesced into the form of a beautiful woman; a bride for the mighty Artheousan, and the mother of the first Arteonians. The Artheousan Faith honors the tradition of this first hero and founder of nations."  

 celtican_pantheon: "Celtican"
 desc_celtican_pantheon: "The Celtican Faith comprises the traditional belief systems of the Celtican people, who value simplicity in thinking, hard work and good, upstanding moral character. Celtican beliefs are centered around the home and the hearth, with many families leading their own religious ceremonies. This is not a centralized religion, but one where the people are expected to manage their spiritual state themselves - a notion that is squarely Celtican and reflects their pragmatic values."  

 shamanist_beliefs: "Velkopic"
 desc_shamanist_beliefs: "Velkopic, the religion of the snakefolk. Velkopic beliefs were once akin to that of a pantheon, however it now is filled with prophets all relating somehow to the last of the World-Serpents called Ssertryss. Many such prophets gain powers thanks to this link to Ssertryss, and they all represent well what it means to be a good serpent... unfortunately what makes a good serpent and what makes a good man are quite different."   

 mother_earth_pantheon: "Aneic"
 desc_mother_earth_pantheon: "Aneic represents the various beliefs of the Wood Elves, mainly centered around worship of the forest and Mother Earth, known to them as Cafea. Their gods are all Idrasil, or aspects of Mother Cafea, that preside over specific areas of everyday life.\n\nMost variations of this faith preach the Oneness of Nature and encourage followers to spend their time outdoors, where ceremonies are held under the canopy of the forest instead of the marble halls of the Temple. Aneids are traditionally pacifists that only fight defensive wars, however the large variety of beliefs across the Wood Elven tribes allows for certain cults to emphasize certain ideas and traditions."

 orcish_ancestral_faith: "Shta Mogddu" # Theravada
 desc_orcish_ancestral_faith: "The oldest and traditional form of Orcish worship, the 'Old Path' promotes the nurturing and control of one's Inner Flame similar to newer sects. The key difference is that this branch puts the priestly Bugino class at the top of the caste system. Achieving Otziggu is emphasized as the ultimate goal, thus the path to becoming a Soddhuzi is not encouraged and instead isolationism is promoted as a means to both control one's Inner Flame and attain enlightenment.\n\nIn decline since the rise of the Great Nuhargorkan, 'Old Believers' stick to the mountains and jungles of the Bloody Isles, whose slopes have preserved their way of life for centuries."

 orcish_new_faith: "Mogdduzana" # Mahayana
 desc_orcish_new_faith: "Orkansuar is the umbrella term used to define the various cults and philosophies that make up the beliefs of the Orcs. Nearly all of these schools of thought are focused upon finding and nurturing one's Inner Flame, the divine spark that some other religions refer to as the 'soul'.\n\nA follower's relationship with their own Inner Flame changes and matures throughout life, and although most are content to let their lights naturally dim when it is time to pass into the next world, there are heretical Orkansuar sects that magically lengthen their lifespan through utilizing the dark arts known as the 'Black Flame'."   

 orcish_colony_faith: "Surath Mogddu" # Vajrayana
 desc_orcish_colony_faith: "A radical sect reflecting the circumstances of its founders, the 'Golden Path' argue that all races have the capability to achieve Otziggu, and that adherence to the demands of one's caste does not affect one's Inner Flame. Rather, they argue, i"

 the_old_father_stone: "Hebric"
 desc_the_old_father_stone: "The Hebric religion of the Copper Dwarves is the most widespread of the three denominations. They believe that Frei and Dwadais are the true heirs of the Stone Father, and their pantheon is filled with ancient dwarf-heroes of yore that ascended into godhood via their virtuous and mighty deeds; a promise to every dwarf that they, too, can hope to become like the gods themselves.\n\nProlific traders, their faith has been spread across Omniluxia, and although there are some humans that have converted to their ways, it remains mostly a dwarven faith." 

 the_old_father_silver: "Srrøhebrikk"
 desc_the_old_father_silver: "Srrøhebrikk is the Silver Dwarven variation of the Hebric religion. The main split between Srrøhebrikk and the other Hebric faiths is the worship of the Silver Dwarven pair, Hthgart and Ferja, as the true heirs of the Stone Father over the other two.\n\nThe most isolated and traditional of the three main groups, the Silver Dwarves have retained many customs and ideas that disappeared as the Gold and Copper dwarves interacted with the other races of Omniluxia. Aside from that, the faith also promotes grand building projects and the promise of godhood in the form of ancestor worship. Due to the majority of their gods being mythical Silver Dwarven heroes, there are few followers of the faith outside of the three main centers of Silver Dwarven civilization. However, interactions with neighboring peoples have led some to converting and venerating their own ancestors alongside dwarven ones." 

 the_old_father_gold: "Da Ash-Hêbriq"
 desc_the_old_father_gold: "Da Ash-Hêbriq is the Gold Dwarven interpretation of the Hebric faith. Followers worship the Gold Dwarven pair, Summsîr and Ava, as the true heirs of the Stone Father over the others. Aside from that, deities are Gold Dwarven heroes who have been laid to rest in the sacred Gold Caves alongside Summsîr and Ava, which means that few other races outside of the Gold Dwarves themselves adhere to the faith.\n\nThe Gold Dwarves also pride themselves in their crafts, with the most beautiful and unique creations considered the most prestigious. The most faithful often create beautiful golden idols to commemorate their gods." 

 kuulvaal: "Kuulvåal"
 desc_kuulvaal: "Kuulvåal, or the 'One Worship' is the monothestic religion of the Gnomes, who worship and revere only Wielkopan, or Wekuaa, over all other false gods. Believers also venerate various Taalvut, or angels, that help the common people in daily life.\n\nFinally, followers hope their devotion will be rewarded when a prophet emerges that will lead them back to their former homeland, a paradise known as Jaaltuvesk." 

 transcendence_enlighten: "Ascendic"
 desc_transcendence_enlighten: "Ascendic is the religion of the High Elves, a name that is as much of a promise as it is a threat. The High Elves view their culture to be superior over every others, and this includes spiritual matters as well; the adherents of the Ascendic Faith believe that their hour is at hand, and that soon they shall smash the false pantheons of the unbelievers - Ascendic supremacy is an inevitability."  

 vetalian_pantheon: "Vetalian"
 desc_vetalian_pantheon: "The Vetalian beliefs are very old indeed, and those that worship the Vetalian gods cling to their pantheon with a fervor that belies the people's love for their traditional deities. Throughout different periods of her history, Vetalian beliefs have been suppressed by the invading armies, and it was only the faith of the people that kept their spirits high during the dark days of slavery. The Vetalians Faith preaches the universality and inevitability of suffering, but promises that there is an end to the misery that we must endure."   

 seekers_beliefs: "Seekism"
 desc_seekers_beliefs: "The Seekers are a religious cult that preaches the dissolution of one's ego, where one must renounce their identity and self in order to truly be free, for it is only when we have abandoned the chains of our past that we are able to Seek the Way. Their prophets and wise men agree that all that matters is the 'Seeking', although what exactly is being sought after is not told to non-believers. While the Way remains supreme, they pray to various deities, believing them to be avatars of the Path. Akin to something like a secret society, Seekers have managed to seize control of entire kingdoms, turning the resources of their captive nations to furthering the Way." 

 ancestral_beliefs: "Karric"
 desc_ancestral_beliefs: "Karric belief refers to ancestor worship, and although there are religious differences between various cultures of Omniluxia that practice the Karric Faith, they are similar enough to be recognized as originating from the same source. Karric adherents value the memory of their forebears and try to be mindful of their own influences on the generations to come."  

 fallen_star_pantheon: "Stellaric"
 desc_fallen_star_pantheon:0 "The Stellaric faith is a fusion of 'the foreign' teachings coming from the mysterious eastern continent. The faith is filled with different philosophical beings with the ultimate goal being reaching the divine enlightment and becoming a star in the sky."
 #desc_fallen_star_pantheon: "The Stellaric Faith literally worships wealth, claiming it to be a visible sign of the blessing of the gods. Stellaric Ministers all but rule the Merchant Republics of the Errnorfallians, and the prime motivation of these nations remains on the making of money." 

 ####NEW RELIGIONS##### 
 northlander_pantheon: "Norrskalkiean"
 desc_northlander_pantheon: "The traditional religion of the various peoples of Northeastern Luxterra goes by many names, however they are united in their worship of the various nature spirits and ancestors which they believe inhabit the physical world."

 polari_pantheon: "Polaric"
 desc_polari_pantheon: "The beliefs of the Polarians reflects their outlook on life due to the circumstances of their polar home. The Polaric Faith teaches that one should do their best to help others, but argues that the world is slowly corrupting into a state where nothing will be able to save it, not even the interventions of the Polaric faithful, and that when this happens, the Great Eclipse will occur and end the world. Being an important part of their history, the Great Collapse is seen by the Polarics as the first sign of the end of days."

 werhenic_pantheon: "Werfudrian"
 desc_werhenic_pantheon: "The Werfudrian Faith is a belief system that is tempered by philosophy, with the good stewardship of the nation-state being the ultimate form of worship and a sign of true religious devotion. While not as exciting as other faiths - Werfudrian has been drily described as a librarian's religion, suitable only for bookworms and bores - the followers of this simple way of life often live happy and productive lives."

 eptelon_pantheon: "Eptelenic"
 desc_eptelon_pantheon: "The Eptelenic religion does not preach a universal truth or promise salvation to the entire world; it is only concerned with the island of Eptelon and its inhabitants. Because of its insular nature, many foreigners have completely ignored the Eptelenic religion, and perhaps with good reason, but the Eptelenic faithful see no reason to abandon the gods that protect their sacred island."

 mother_warrior_pantheon: "Madreic"
 desc_mother_warrior_pantheon: "A reactionary faith born from the conflict between the Vetalians and Zani, those who call themselves Knights of the Mother Warrior split from the wider Vetalian cults around the 5th century, and credit themselves for the Zanic Evacuation of Vetalia. Their esoteric rituals and tight-knit communities are hidden amongst the various Tonormo Orders found in the deep forests of Vetalia.\n\nThe tenets of their faith are simple, yet strictly followed. Holding a Cyanh, initiates swear an oath to surrender their lives to the Mother Warrior, their fellow knights, and to the Great Mission: driving out the foreigners from Vetalia."

 light_religion: "Luminist"
 desc_light_religion: "The esoteric religion of the Wraithkin is poorly understood, as the few willing to explain struggle to put into words their concepts of divinity. Wraiths have no recollection of their previous lives, and instead can only fathom service to their mission and master, which they call the Light."

 kinone_pantheon: "Kino"
 desc_kinone_pantheon: "The religion of the Kinones is based on the teachings of the twelve prophets, or Koni-Koni, and the worship of Kon. The 'Kino', or expected way of life, that followers uphold are based on the writings of the prophets that often reflect the generous and altruistic nature of their people. Their various religious texts speak out against the cruelty of serfdom and slavery, preaching that no man is better than any other, but that all are equal in the eyes of Kon."

 hortenic_pantheon: "Hortenic"
 desc_hortenic_pantheon: "The ancient faith of the Hortenic people is as grim and humorless as its inhabitants, and its sacred texts are mostly filled with fearsome imagery of never-ending blizzards, frozen hells with howling winds, and demons made of ice. It is no wonder that most of the Horteonians abandoned their traditional ways after they invaded the southern islands, although some back home still follow the old Hortenic rites."

 zorg_religion: "Zorganite"
 desc_zorg_religion: "The mysterious religion of the Zorg is not possible to comprehend for most in Omniluxia; to many it would seem as if the Zorg have no religious practices at all. It is all but impossible to find out for sure, though, as anyone close enough to communicate with the Zorg does not last long; inevitably, they too become Zorg."

 sun_religion: "Aheolist"
 desc_sun_religion: "The enigmatic religion of the Sunset Elves, the cult of the Sun God Aheol reveres him as an omnipotent being. Secret rituals are often conducted to earn his favor, and Kings that rule in his name achieve a sort of demi-god status amongst their people."

 aentora_religion: "Kka-Shatothui"
 desc_aentora_religion: "The traditional faith of the Illorians consists of a pantheon of various different gods and deified heroes, including the Everything-King and his Twin Sons. However, the most important gods to these 'Old Believers' are Aentora and Muerthos, the dualistic gods of life and death. Followers value intelligence and skill over brute force and strength, values and traditions that still remain amongst Illorian communities that have abandoned the old rites.\n\nWith the founding of the popular Helluvianism, the traditional faith of the 'Twin Gods' has been relegated to the far ends of the Illorian world, with those faithful few carrying on the beliefs of their ancestors."

# Possible use for another religion
# Happiness and sadness, joy and despair, love and hatred, war and peace - the duality of human emotional experience is viewed to flow from the same unified divine source, with all things being preordained from the beginning of time

 ####NEW RELIGION CATEGORY LOCALIZATION####
 religion_category_firetemples: "Theon"
 religion_category_sages: "Saint"
 religion_category_pantheon: "Deity"
 religion_category_prophets: "Prophet"

 ####CONVERSIONS####
 # Conversions
convert_to_baetepian: "Convert to Baetepian"
convert_to_baetepian_desc: "As one of the oldest civilizations on Omniluxia, the Baetepians' religion contains half-forgotten memories of gods and souls that are said to still reside in the #E Cursed Aneser Desert#!."
convert_to_norrskalkiean: "Convert to Norrskalkiean"
convert_to_norrskalkiean_desc: "The religion of the Norrfallian people, considered barbaric by the settled peoples of #E Central Luxterra#!, is a faith based on spirits and gods that reflect the reality of the natural world."
convert_to_elemenic: "Convert to Elemenic"
convert_to_elemenic_desc: "The cryptic religion of the goblinic peoples holds many faded memories that tell the story of the origins of Omniluxia. By embracing their myths, we may be able to gleam some knowledge about the ancient past."
convert_to_zanism: "Convert to Zanisite"
convert_to_zanism_desc: "A blend of traditional Geallian beliefs and the Imperial Cult established by the descendents of #E Zanis Zani#!, #E Zanisite#! remains one of the strongest faiths on Omniluxia even in the face of #E Helluvian#! and #E Zaniudianism#!."
convert_to_lupinite: "Convert to Lupinite"
convert_to_lupinite_desc: "The occult folk religion of the #E Borderlander#! peoples tells the story of cultural diversity and conquest, as the various incarnations of #E Lula#! share characteristics with the gods of neighboring peoples and past invaders."
convert_to_viktriec: "Convert to Viktriec"
convert_to_viktriec_desc: "Praise be to the #E Victory Goddess#!! May our sons find courageous victory in every battle they fight in, against any enemy that dares to threaten our home!"
convert_to_helluvian: "Convert to Helluvian"
convert_to_helluvian_desc: "The most expansive religion in the world, traditional #E Helluvianism#! preaches peace and cooperation that have helped foster a sense of connection between #E Helluvian#! communities across Omniluxia."
convert_to_zainudian: "Convert to Zainudian"
convert_to_zainudian_desc: "The fastest growing religion on Omniluxia, #E Zainudianism#! remains the greatest rival to the followers of #E Hellas#!. As each community grows, the scale of conflicts between these two religions grows as well."
convert_to_yedidyhan: "Convert to Yedidyhan"
convert_to_yedidyhan_desc: "Little is known about the elusive cult of the #E Dark Lord#!, as the #E Vampires#! that follow it are very secretive and induct few mortals into their circles. According to popular myth, the great #E Vampire#! God #E Yedidyhan#! emerged during the #E Great Collapse#!, and spawned the first #E True Vampires#!, sending them across the world on a mission to corrupt the mortal realm."
convert_to_zerywanic: "Convert to Zerywanic"
convert_to_zerywanic_desc: "Considered by many to be humanity's oldest religion, the folk tales of the semi-nomadic #E Zerywanic#! peoples contain many stories whose reappearance in other human faiths may provide clues about humanity's past."
convert_to_soul_cult: "Convert to Soul Cult"
convert_to_soul_cult_desc: "THE GREAT DEVOURER SHALL ARRIVE AND CLEANSE THIS WORLD OF THE INFESTATION OF SOULS THAT PLAGUE ITS SURFACE."
convert_to_blood_stained: "Convert to Blood Stained"
convert_to_blood_stained_desc: "The goddess #E Melodias#! reappears with many different names across almost every faith in the world, nearly universally reviled and feared. However, there are those who attempt to follow her to gain access to her power, namely #E Witches#!, #E Warlocks#!, and #E Melodian#! peoples."
convert_to_patriec: "Convert to Patriec"
convert_to_patriec_desc: "A relatively new religion, #E Patriec#! is a reflection of the melting pot that is the #E Orcish Sea#!, where traders of many faiths interact and exchange ideas and goods."
convert_to_dragkhanic: "Convert to Dragkhanic"
convert_to_dragkhanic_desc: "A cruel faith that praises the acquisition of strength and power at any cost, the traditional beliefs of the #E Dragkhans#! have more often than not been their demise. If not led by a strong leader with a powerful cult of personality, any aspiring #E Great Ulus#! is bound to collapse."
convert_to_artheousian: "Convert to Artheousian"
convert_to_artheousian_desc: "Many scholars debate on whether the great Wyrm of #E Arteonian#! folk tales truly existed. For many, the sheer amount of monstrous bones and teeth that are found on the island of #E Arteon#! indicate that such creatures were common in the days of old."
convert_to_celtican: "Convert to Celtican"
convert_to_celtican_desc: "Slowly being pushed back by the larger religions around it and attached to a relatively small people population-wise, many across #E Morrigan#! see the traditional faiths of the #E Celtican#! peoples as tales that will soon be extinct."
convert_to_velkopic: "Convert to Velkopic"
convert_to_velkopic_desc: "For the #E Snakefolk#!, the rarely seen #E Sea Serpents#! that roam around the #E Serpentine Seas#! are considered a brother-race, as they both descend from the #E World Serpents#! of old."
convert_to_aneic: "Convert to Aneic"
convert_to_aneic_desc: "Although often seen as an traditional elven religion, many other races, particularly humans, have embraced the nature-loving beliefs promoted by the children of #E Cafea#!."
convert_to_ancient_orcism: "Convert to Shta Mogddu"
convert_to_ancient_orcism_desc: "The oldest of the Orcanite faiths, followers of the traditions of the ancient Orcs are strict isolationists that emphasize the importance of the Priest class that rules over their societies. For them, the way to #E Otziggu#! is solely achieved through the actions of the individual, and most intent on reaching enlightenment turn to monkhood and asceticism."
convert_to_new_orcism: "Convert to Mogdduzana"
convert_to_new_orcism_desc: "The beliefs and traditions of Mogdduzana can be traced back to the time of the #E Great Nuhargorkan#!, during which the structure of traditional orcish society saw major upheavals. This new faith, more attuned to the needs of a large empire, emphasizes and solidifies the existing caste system by claiming that the way to enlightenment is to faithfully follow what is expected of one's caste in society."
convert_to_colonial_orcism: "Convert to Surath Mogddu"
convert_to_colonial_orcism_desc: "When the Orcs began to migrate outside of the #E Bloody Isles#!, they came into contact with the cultural and religious diversity found along the coast of #E Northern Morrigan#!. Adopting many ideas from these foreigners as well as adapting their own beliefs to fit their new society, this reformed Orcanite religion is much more egalitarian in nature than its predecessors."
convert_to_hebric: "Convert to Hebric"
convert_to_hebric_desc: "The most widespread dwarven religion, this faith is known by many names across the various copper dwarves scattered across Omniluxia who follow the claim of Frei and Dwadais. Despite their differences, all faithful dwarves consider themselves 'Hebrics', an ancient word from a long forgotten age."
convert_to_srrohebric: "Convert to Srrøhebrikk"
convert_to_srrohebric_desc: "Those few pockets of Silver Dwarven civilization still adhere to the oldest of the dwarven faiths, in which they venerate the honorable Hthgart and Ferja as the true heirs of the Stone Father."
convert_to_daashhebric: "Convert to Da Ash-Hêbriq"
convert_to_daashhebric_desc: "Once found across the plains of what was #E Central Omniluxia#!, those that worship the twin pair Summsîr and Ava have slowly seen their civilization fall further and further in the face of invasion after invasion. Despite this, the #E Gold Dwarves#! retain their faith that their gods will continue to protect them, and one day bring them into another golden age."
convert_to_kuulvaal: "Convert to Kuulvåal"
convert_to_kuulvaal_desc: "The esoteric religion of the gnomes is best understood through the various Gnomic languages, as certain concepts such as angels can be easily mistaken for deities."
convert_to_ascendic: "Convert to Ascendic"
convert_to_ascendic_desc: "The borderline atheistic, philosophically-focused 'religion' of the #E High Elves#! reflects the effects their long lives have had on their society and values. As creatures that live for hundreds of years, they are more focused on how to best experience such a long life rather than achieve salvation in the next."
convert_to_vetalian: "Convert to Vetalian"
convert_to_vetalian_desc: "Similar to the beliefs of the Norrfallians, the various spirits and gods of the Vetalians were considered 'barbaric' and 'backwards' to the invading #E Zani Empire#!. Their deities are often of natural phenomena, reflecting the practicality and simplicity of their reality."
convert_to_seekism: "Convert to Seekism"
convert_to_seekism_desc: "Nearly a decade ago, a single message was revealed to an obscure hermit named #E Cerwain#!: 'The Way will be revealed.' What this message meant, when the Way would be revealed, how it would be revealed, and the steps necessary to discover the Way have become the cause of many wars, arguments, and alliances in #E Central Morrigon#!."
convert_to_karric: "Convert to Karric"
convert_to_karric_desc: "The ancient beliefs of the nomadic peoples of #E Southern Luxterra#! reflects their reality. The Great Blue Sky hosts the One god. That god is the god of the strongest tribe."
convert_to_stellaric: "Convert to Stellaric"
convert_to_stellaric_desc: "Long ago, eastern visitors appeared off the coast of #E Eastern Morrigon#!. These fallen stars imparted wisdom and ideas that brought civilization and progress to the tribes that would become the #E Stellaric#! republics."
convert_to_polaric: "Convert to Polaric"
convert_to_polaric_desc: "Followers of the Polaric tradition wait patiently for the end of days, and try their best to improve their situation in this realm to ensure their future survival in the next."
convert_to_werhenic: "Convert to Werfudrian"
convert_to_werhenic_desc: "Reflecting the mixed culture of the Werhenic peoples, Werfudrian is a logic-based faith that serves more as a philosophy than a religion."
convert_to_eptelonic: "Convert to Eptelonic"
convert_to_eptelonic_desc: "The various cults of Eptelon all have vary similar gods and beliefs that reflect their constant state of war with the outside world. Defensive deities and river spirits that drown invaders all tell the same story: resist."
convert_to_madriec: "Convert to Madreic"
convert_to_madriec_desc: "The Madreic Knights of Vetalia were once just another vetalian cult before their ancestors beat the Zani long ago. Since that day, their patron deity, the Mother Warrior, has become the sole god amongst the various nature spirits that inhabit the forests of #E Northeastern Morrigon#!."
convert_to_luminist: "Convert to Luminist"
convert_to_luminist_desc: "Those few mortals that gain even a glimpse into the 'religion' of the undead no longer retain any sanity to explain what they saw. Some stories say that they see the true face of god, heaven, or some realm beyond our comprehension."
convert_to_kino: "Convert to Kino"
convert_to_kino_desc: "Although primarily connected to the Kinones, the wisdom shared by the twelve Koni-Koni has proved to be popular amongst other races and cultures outside of the Peaceful Valley. Perhaps, with more outside contact, Kon's disciples might have a significant impact on the philosophers of #E Luxterra#!."
convert_to_hortenic: "Convert to Hortenic"
convert_to_hortenic_desc: "Traditional Hortenic beliefs and rites are grim and cruel, reflecting the realities of their frozen homeland. It is for this reason that during their southern migration most that settled in lush grasslands gave up their old beliefs."
convert_to_zorgism: "Convert to Zorganite"
convert_to_zorgism_desc: "⨅𝙹∷⊣𝙹ʖᔑꖎꖎ ∴ᔑᓭ ⍑ᒷ∷ᒷ"
convert_to_aheolist: "Convert to Aheolist"
convert_to_aheolist_desc: "For the #E Sun Elves#! that live on the harsh #E Dragonlands#!, the forest has long forgotten about them and left their communities to die. The only powerful deity that continues to watch over them is the Sun."
convert_to_kkashatothui: "Convert to Kka-Shatothui"
convert_to_kkashatothui_desc: "Kka-Shatothui is the name given to the various traditional beliefs of the #E Illorians#! prior to the spread of #E Helluvianism#!. Due to its similarity to traditional #E Geallian#! mythology and the favored status of the #E Illorians#! during their occupation by the #E Zani Empire#! they were not persecuted as long as they placed #E Zanis Zani#! at the top of their pantheon, a demand that many patriotic #E Illorians#! resent."

