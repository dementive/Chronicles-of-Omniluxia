 ####CONVERSIONS####
 # Conversions
convert_to_baetepian: "Convert to Baetepian"
convert_to_baetepian_desc: "As one of the oldest civilizations on #G Omniluxia#!, the #Y Baetepians#!' religion contains half-forgotten memories of gods and souls that are said to still reside in the #G Cursed Aneser Desert#!."
convert_to_norrskalkiean: "Convert to Norrskalkiean"
convert_to_norrskalkiean_desc: "The religion of the Norrfallian people, considered barbaric by the settled peoples of #Y Central Luxterra#!, is a faith based on spirits and gods that reflect the reality of the natural world."
convert_to_elemenic: "Convert to Elemenic"
convert_to_elemenic_desc: "The cryptic religion of the goblinic peoples holds many faded memories that tell the story of the origins of #G Omniluxia#!. By embracing their myths, we may be able to gleam some knowledge about the ancient past."
convert_to_zanism: "Convert to Zanisite"
convert_to_zanism_desc: "A blend of traditional #Y Geallian#! beliefs and the Imperial Cult established by the descendents of #G Zanis Zani#!, #T Zanisite#! remains one of the strongest faiths on #G Omniluxia#! even in the face of #T Helluvian#! and #Y Zaniudianism#!."
convert_to_lupinite: "Convert to Lupinite"
convert_to_lupinite_desc: "The occult folk religion of the #Y Borderlander#! peoples tells the story of cultural diversity and conquest, as the various incarnations of #G Lula#! share characteristics with the gods of neighboring peoples and past invaders."
convert_to_viktriec: "Convert to Viktriec"
convert_to_viktriec_desc: "Praise be to the #G Victory Goddess#!! May our sons find courageous victory in every battle they fight in, against any enemy that dares to threaten our home!"
convert_to_helluvian: "Convert to Helluvian"
convert_to_helluvian_desc: "The most expansive religion in the world, traditional #T Helluvianism#! preaches peace and cooperation that have helped foster a sense of connection between #T Helluvian#! communities across #G Omniluxia#!."
convert_to_zainudian: "Convert to Zainudian"
convert_to_zainudian_desc: "The fastest growing religion on #G Omniluxia#!, #Y Zainudianism#! remains the greatest rival to the followers of #T Hellas#!. As each community grows, the scale of conflicts between these two religions grows as well."
convert_to_yedidyhan: "Convert to Yedidyhan"
convert_to_yedidyhan_desc: "Little is known about the elusive cult of the #Y Dark Lord#!, as the #Y Vampires#! that follow it are very secretive and induct few mortals into their circles. According to popular myth, the great #Y Vampire#! God #T Yedidyhan#! emerged during the #Y Great Collapse#!, and spawned the first #Y True Vampires#!, sending them across the world on a mission to corrupt the mortal realm."
convert_to_zerywanic: "Convert to Zerywanic"
convert_to_zerywanic_desc: "Considered by many to be humanity's oldest religion, the folk tales of the semi-nomadic #T Zerywanic#! peoples contain many stories whose reappearance in other human faiths may provide clues about humanity's past."
convert_to_soul_cult: "Convert to Soul Cult"
convert_to_soul_cult_desc: "THE GREAT DEVOURER SHALL ARRIVE AND CLEANSE THIS WORLD OF THE INFESTATION OF SOULS THAT PLAGUE ITS SURFACE."
convert_to_blood_stained: "Convert to Blood Stained"
convert_to_blood_stained_desc: "The goddess #Y Melodias#! reappears with many different names across almost every faith in the world, nearly universally reviled and feared. However, there are those who attempt to follow her to gain access to her power, namely #Y Witches#!, #Y Warlocks#!, and #T Melodian#! peoples."
convert_to_patriec: "Convert to Patriec"
convert_to_patriec_desc: "A relatively new religion, #Y Patriec#! is a reflection of the melting pot that is the #G Orcish Sea#!, where traders of many faiths interact and exchange ideas and goods."
convert_to_dragkhanic: "Convert to Dragkhanic"
convert_to_dragkhanic_desc: "A cruel faith that praises the acquisition of strength and power at any cost, the traditional beliefs of the #Y Dragkhans#! have more often than not been their demise. If not led by a strong leader with a powerful cult of personality, any aspiring #Y Great Ulus#! is bound to collapse."
convert_to_artheousian: "Convert to Artheousian"
convert_to_artheousian_desc: "Many scholars debate on whether the great Wyrm of #T Arteonian#! folk tales truly existed. For many, the sheer amount of monstrous bones and teeth that are found on the island of #Y Arteon#! indicate that such creatures were common in the days of old."
convert_to_celtican: "Convert to Celtican"
convert_to_celtican_desc: "Slowly being pushed back by the larger religions around it and attached to a relatively small people population-wise, many across #Y Morrigan#! see the traditional faiths of the #Y Celtican#! peoples as tales that will soon be extinct."
convert_to_velkopic: "Convert to Velkopic"
convert_to_velkopic_desc: "For the #Y Snakefolk#!, the rarely seen #Y Sea Serpents#! that roam around the #Y Serpentine Seas#! are considered a brother-race, as they both descend from the #Y World Serpents#! of old."
convert_to_aneic: "Convert to Aneic"
convert_to_aneic_desc: "Although often seen as an traditional elven religion, many other races, particularly humans, have embraced the nature-loving beliefs promoted by the children of #G Cafea#!."
convert_to_ancient_orcism: "Convert to Shta Mogddu"
convert_to_ancient_orcism_desc: "The oldest of the Orcanite faiths, followers of the traditions of the ancient Orcs are strict isolationists that emphasize the importance of the Priest class that rules over their societies. For them, the way to #Y Otziggu#! is solely achieved through the actions of the individual, and most intent on reaching enlightenment turn to monkhood and asceticism."
convert_to_new_orcism: "Convert to Mogdduzana"
convert_to_new_orcism_desc: "The beliefs and traditions of #T Mogdduzana#! can be traced back to the time of the #Y Great Nuhargorkan#!, during which the structure of traditional orcish society saw major upheavals. This new faith, more attuned to the needs of a large empire, emphasizes and solidifies the existing caste system by claiming that the way to enlightenment is to faithfully follow what is expected of one's caste in society."
convert_to_colonial_orcism: "Convert to Surath Mogddu"
convert_to_colonial_orcism_desc: "When the Orcs began to migrate outside of the #G Bloody Isles#!, they came into contact with the cultural and religious diversity found along the coast of #Y Northern Morrigan#!. Adopting many ideas from these foreigners as well as adapting their own beliefs to fit their new society, this reformed Orcanite religion is much more egalitarian in nature than its predecessors."
convert_to_hebric: "Convert to Hebric"
convert_to_hebric_desc: "The most widespread dwarven religion, this faith is known by many names across the various copper dwarves scattered across #G Omniluxia#! who follow the claim of #Y Frei#! and #Y Dwadais#!. Despite their differences, all faithful dwarves consider themselves '#Y Hebrics#!', an ancient word from a long forgotten age."
convert_to_srrohebric: "Convert to Srrøhebrikk"
convert_to_srrohebric_desc: "Those few pockets of #Y Silver Dwarven#! civilization still adhere to the oldest of the dwarven faiths, in which they venerate the honorable #G Hthgart#! and #Y Ferja#! as the true heirs of the #Y Stone#! Father."
convert_to_daashhebric: "Convert to Da Ash-Hêbriq"
convert_to_daashhebric_desc: "Once found across the plains of what was #Y Central Omniluxia#!, those that worship the twin pair #Y Summsîr#! and Ava have slowly seen their civilization fall further and further in the face of invasion after invasion. Despite this, the #Y Gold Dwarves#! retain their faith that their gods will continue to protect them, and one day bring them into another golden age."
convert_to_kuulvaal: "Convert to Kuulvåal"
convert_to_kuulvaal_desc: "The esoteric religion of the gnomes is best understood through the various #Y Gnomic#! languages, as certain concepts such as angels can be easily mistaken for deities."
convert_to_ascendic: "Convert to Ascendic"
convert_to_ascendic_desc: "The borderline atheistic, philosophically-focused 'religion' of the #Y High Elves#! reflects the effects their long lives have had on their society and values. As creatures that live for hundreds of years, they are more focused on how to best experience such a long life rather than achieve salvation in the next."
convert_to_vetalian: "Convert to Vetalian"
convert_to_vetalian_desc: "Similar to the beliefs of the Norrfallians, the various spirits and gods of the #Y Vetalians#! were considered 'barbaric' and 'backwards' to the invading #T Zani Empire#!. Their deities are often of natural phenomena, reflecting the practicality and simplicity of their reality."
convert_to_seekism: "Convert to Seekism"
convert_to_seekism_desc: "Nearly a decade ago, a single message was revealed to an obscure hermit named #Y Cerwain#!: 'The Way will be revealed.' What this message meant, when the Way would be revealed, how it would be revealed, and the steps necessary to discover the Way have become the cause of many wars, arguments, and alliances in #Y Central Morrigon#!."
convert_to_karric: "Convert to Karric"
convert_to_karric_desc: "The ancient beliefs of the nomadic peoples of #Y Southern Luxterra#! reflects their reality. The Great #T Blue#! Sky hosts the One god. That god is the god of the strongest tribe."
convert_to_stellaric: "Convert to Stellaric"
convert_to_stellaric_desc: "Long ago, eastern visitors appeared off the coast of #Y Eastern Morrigon#!. These fallen stars imparted wisdom and ideas that brought civilization and progress to the tribes that would become the #T Stellaric#! republics."
convert_to_polaric: "Convert to Polaric"
convert_to_polaric_desc: "Followers of the #T Polaric#! tradition wait patiently for the end of days, and try their best to improve their situation in this realm to ensure their future survival in the next."
convert_to_werhenic: "Convert to Werfudrian"
convert_to_werhenic_desc: "Reflecting the mixed culture of the Werhenic peoples, #T Werfudrian#! is a logic-based faith that serves more as a philosophy than a religion."
convert_to_eptelenic: "Convert to Eptelonic"
convert_to_eptelenic_desc: "The various cults of #G Eptelon#! all have vary similar gods and beliefs that reflect their constant state of war with the outside world. Defensive deities and river spirits that drown invaders all tell the same story: resist."
convert_to_madriec: "Convert to Madreic"
convert_to_madriec_desc: "The #T Madreic#! Knights of #Y Vetalia#! were once just another vetalian cult before their ancestors beat the #Y Zani#! long ago. Since that day, their patron deity, the Mother #Y Warrior#!, has become the sole god amongst the various nature spirits that inhabit the forests of #Y Northeastern Morrigon#!."
convert_to_luminist: "Convert to Luminist"
convert_to_luminist_desc: "Those few mortals that gain even a glimpse into the 'religion' of the undead no longer retain any sanity to explain what they saw. Some stories say that they see the true face of god, heaven, or some realm beyond our comprehension."
convert_to_kino: "Convert to Kino"
convert_to_kino_desc: "Although primarily connected to the #Y Kinones#!, the wisdom shared by the twelve #T Koni-Koni#! has proved to be popular amongst other races and cultures outside of the #G Peaceful Valley#!. Perhaps, with more outside contact, Kon's disciples might have a significant impact on the philosophers of #G Luxterra#!."
convert_to_hortenic: "Convert to Hortenic"
convert_to_hortenic_desc: "Traditional #T Hortenic#! beliefs and rites are grim and cruel, reflecting the realities of their frozen homeland. It is for this reason that during their southern migration most that settled in lush grasslands gave up their old beliefs."
convert_to_zorgism: "Convert to Zorganite"
convert_to_zorgism_desc: "⨅𝙹∷⊣𝙹ʖᔑꖎꖎ ∴ᔑᓭ ⍑ᒷ∷ᒷ"
convert_to_aheolist: "Convert to Aheolist"
convert_to_aheolist_desc: "For the #Y Sun Elves#! that live on the harsh #Y Dragonlands#!, the forest has long forgotten about them and left their communities to die. The only powerful deity that continues to watch over them is the Sun."
convert_to_kkashatothui: "Convert to Kka-Shatothui"
convert_to_kkashatothui_desc: "#T Kka-Shatothui#! is the name given to the various traditional beliefs of the #Y Illorians#! prior to the spread of #T Helluvianism#!. Due to its similarity to traditional #Y Geallian#! mythology and the favored status of the #Y Illorians#! during their occupation by the #T Zani Empire#! they were not persecuted as long as they placed #G Zanis Zani#! at the top of their pantheon, a demand that many patriotic #Y Illorians#! resent."
# New World
convert_to_godlost: "Convert to Maenuskartli"
convert_to_godlost_desc: "Those who hate tyranny are all the same, since only once those tyrants who rule above the cosmos are dead can we truly be free."
convert_to_the_hive_concord: "Convert to Hive Concord"
convert_to_the_hive_concord_desc: "The #T Hive Concord#! binds every life to the life of the Queen, placing the survival of the hive above the pride of any single self."
convert_to_naathran_pact: "Convert to Wardenite Pact"
convert_to_naathran_pact_desc: "#Y Na'athran#! promised his faithful that he would one day return, and reward those who served him well in his absence. We must maintain his imperium and faithfully await his expected return."
convert_to_the_great_mycelium: "Convert to The Hundred Schools of Kagayamashko"
convert_to_the_great_mycelium_desc: "The #T Hundred Schools of Kagayamashko#! are a result of centuries of #Y Mycelar#! thought and philosophy, and provide wise rulers with knowledge that is worth more than the greatest treasure in the world."
convert_to_the_great_mycelium_imperial: "Convert to Kyoshii Kagayamashko"
convert_to_the_great_mycelium_imperial_desc: ""
convert_to_arame_dreaming: "Convert to Ijminga"
convert_to_arame_dreaming_desc: "Every creature that has laid to rest has passed through #T Ijminga#!, the plain of Everywhen, where creator gods, ancestors, and ancient empires all exist at once to provide knowledge to those across all time."
convert_to_the_old_father_jade: "Convert to Destwa Hebred"
convert_to_the_old_father_jade_desc: "The folk traditions and stories of the #Y Jade#! #T Dwarves#! have a strong appeal with foreign travelers, who marvel at the scale of their ancient history and bizarreness of their rituals."
convert_to_moon_mothers: "Convert to Soluwai"
convert_to_moon_mothers_desc: "The sacred moon mothers that grant blessings to us from their celestial realm welcome all children who embrace her truth through holy sacrifice and mystical dances. Once must simply mask their faces so that the lunar goddesses know who are the true faithful."
convert_to_tide_mothers: "Convert to Gorwunai"
convert_to_tide_mothers_desc: "The Tide Mothers are honored by coastal and aquatic peoples who know that every harbor, net, and voyage owes a tithe to the sea. Sacred paints allow the goddesses to recognize her faithful."
convert_to_mountain_mothers: "Convert to Kalkanu"
convert_to_mountain_mothers_desc: "The Mountain Matrons of the Gurin Highlands bless all travelers who seek save passage through her barren plateaus and jagged cliffs. #Y Small#! sacrifices and costumed dances ensure that the faithful remain in the goddesses' good graces."
convert_to_jungle_mothers: "Convert to Talaoskanu"
convert_to_jungle_mothers_desc: "The sweet songs of the jungle played throughout the night are the siren-like songs of the Jungle Goddesses hiding in the trees and the animals of the vast jungles of Gurin. Through sacred costumed ceremonies and sacrifices alone can the faithful stay protected against monsters and creatures of the night."

