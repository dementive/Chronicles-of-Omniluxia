 # ═══════════════════════════════════════════════════════════════════════
 # ME_EPTELON_GEN — EVENT LOCALIZATION
 # The Beleaguered Shore mission tree events
 # ═══════════════════════════════════════════════════════════════════════

 # ─────────────────────────────────────────────
 # SHARED EARLY GAME
 # ─────────────────────────────────────────────

 me_eptelon_gen.1.t: "Tested by the Shore"
 me_eptelon_gen.1.desc: "The drills are done and the veterans are satisfied. In the old tongue the saying goes 'the island does not remember who holds it, only who bleeds for it'. Our soldiers have earned their place on Eptelonian ground. The slaver captains who watched our coastline with comfortable confidence will find the mathematics of easy profit have changed."
 me_eptelon_gen.1.a: "Let them come. We are ready."

 me_eptelon_gen.2.t: "The Watchtowers of the Shore"
 me_eptelon_gen.2.desc: "The signal fires are lit on every headland. Our patrol fleet has its orders. Three slaver vessels appeared on the horizon this past month and turned north when they saw our sails — the first time in living memory that has happened without a battle. The harbor master says the sailors are calling it the Quiet Month. We intend to make it a quiet decade."
 me_eptelon_gen.2.a: "The slavers will find easier water elsewhere."

 me_eptelon_gen.3.t: "The Island Counts Its Wealth"
 me_eptelon_gen.3.desc: "The first complete trade census of our territories has come back from the factors. The numbers are better than anyone expected — Eptelon has been poor not because it lacks resources but because those resources have never been organized under a single authority with the will to protect them. That changes today. The treasury is heavier. The first of many."
 me_eptelon_gen.3.a: "Wealth organized is wealth that can be spent."

 me_eptelon_gen.4.t: "The Ledgers Are Set"
 me_eptelon_gen.4.desc: "The Harbor Ledger — the combined account of all Heptelonian trade passing through Eptelonian ports — has been formalized and signed by every factor-house in the colony. The numbers it represents are substantial. More importantly, those numbers are now visible, auditable, and subject to colonial law. Our merchants know exactly how much they are worth. So does our treasury."
 me_eptelon_gen.4.a: "Good accounts make for good governance."

 me_eptelon_gen.5.t: "The Heartland Holds"
 me_eptelon_gen.5.desc: "Our banners are planted in ground that is demonstrably, defensibly ours. The last skirmish along our contested border ended with the enemy pulling back rather than pressing — a calculation, not a defeat, but calculations have a way of becoming facts. We are not leaving. The others on this island have begun to understand that."
 me_eptelon_gen.5.a: "This soil is ours to defend."

 # ─────────────────────────────────────────────
 # BRANCH A — NATIVE EPTELONIAN EVENTS
 # ─────────────────────────────────────────────

 me_eptelon_gen.10.t: "The Warchief's Covenant"
 me_eptelon_gen.10.desc: "The last holdout chieftain has made his mark on the Covenant stone — grudgingly, with three of his lieutenants watching to make sure he was not being forced, which he was not, exactly. A unified warchief is not the same as a king. The clan-heads still rule their own lands. But they have sworn, for the first time in memory, to face a common enemy with a single army. The Eptelonian people have found their voice. It is very loud."
 me_eptelon_gen.10.a: "Let the covenant be heard on every shore."

 me_eptelon_gen.11.t: "The Northern Highlands Reclaimed"
 me_eptelon_gen.11.desc: "The last High Elven garrison in the north packed what they could carry and marched east three days before our main force arrived. They left the citadel intact — they did not want the reputation of having destroyed what their ancestors built. We did not want to destroy it either. It will make an excellent granary. The highland passes that have been colonist territory for two generations are Eptelonian again. The people who live there are weeping."
 me_eptelon_gen.11.a: "The north remembers us. We have not forgotten it."

 me_eptelon_gen.12.t: "The Elder's Mark is Found"
 me_eptelon_gen.12.desc: "It was buried beneath the floor of what the colonists had been using as a storage cellar — three layers of stone down, wrapped in oilcloth that had survived the centuries because someone, long ago, knew it might need to. The Elder's Mark is a carved wooden standard bound in hammered copper, its inscription in a dialect so old the shamans had to argue for two days about its precise meaning. They agree it says: what was given by blood is held by blood.\n\nOur warchief holds it now. The army saw it raised above the ruins of Edaur and made a sound our chronicler could not find words for."
 me_eptelon_gen.12.a: "What was given by blood is held by blood."

 me_eptelon_gen.13.t: "The Council of Clans"
 me_eptelon_gen.13.desc: "The Edaur Council has been restored — not in the original hall, which the invaders burned, but in the open air of the old meeting ground, under sky that has seen every council the Eptelonian people have ever held. Fourteen clan-heads spoke in turn. Eleven disputes were formally acknowledged and assigned to arbitration. Three feuds that have cost Eptelonian lives for forty years were dissolved by mutual oath. This is what the Eptelonian people can be when they are not spending themselves on fighting each other."
 me_eptelon_gen.13.a: "The council is the voice of the island's people."

 me_eptelon_gen.14.t: "The Ancestral Shore"
 me_eptelon_gen.14.desc: "Three footholds on the Shout coast, and the shamans said they could feel the shift — the land's memory stirring under feet that belong to it. Whether that is poetry or prophecy is not our concern today. Our concern is the expression on the face of the Heptelonian factor-house manager who watched our soldiers establish those positions and realized what it meant for his colony's long-term tenure. That expression was illuminating."
 me_eptelon_gen.14.a: "The ancestors are watching. We will not disappoint them."

 me_eptelon_gen.15.t: "The Final Expulsion"
 me_eptelon_gen.15.desc: "There are no foreign banners on Eptelon. There are no High Elven garrison commanders issuing orders from stolen citadels. There are no Heptelonian factors writing letters back to the mainland about the reliability of Eptelonian labor. There is only the island, and the people who have been on it since before the first invading ship drew its keel through Eptelonian surf. The expulsion is final. Let no one say the Eptelonians forgot what was theirs."
 me_eptelon_gen.15.a: "The island is ours. It has always been ours."

 # ─────────────────────────────────────────────
 # BRANCH B — HIGH ELVEN COLONIST EVENTS
 # ─────────────────────────────────────────────

 me_eptelon_gen.20.t: "The Ascendic Order Established"
 me_eptelon_gen.20.desc: "The colonial administration has been reorganized along Ascendic principles: every official examined, every record audited, every border station staffed by someone who has demonstrated mastery of their own appetites before being trusted with authority over others. The doctrine holds that order flows from within. Our colony is orderly. We are ready to project that order outward."
 me_eptelon_gen.20.a: "Order first. Then authority. Then expansion."

 me_eptelon_gen.21.t: "The Tribes Turn on Themselves"
 me_eptelon_gen.21.desc: "The clan-head of the Ghergian sent gifts to the Kuazien chieftain. The gifts were intercepted and slightly modified — nothing so crude as poison, merely some adjustments to the attached letter that suggested the Kuazien were being treated as inferiors in the proposed alliance. Our agents in the relevant court tell us the subsequent meeting between the two clan-heads was brief and very loud. The Eptelonian confederation is not currently forming. We have bought ourselves a season, perhaps more."
 me_eptelon_gen.21.a: "A people divided by old feuds is a people that cannot block our advance."

 me_eptelon_gen.22.t: "The Black Pearl of Atheus Recovered"
 me_eptelon_gen.22.desc: "The archivists had listed it as lost in the chaos following the High Elven Civil War — one of a hundred relics scattered when the great citadel-libraries were abandoned during the succession conflicts. But it was not lost. It was simply waiting. The Black Pearl of Atheus — the navigation instrument that Atheus the Conqueror himself is said to have used to chart the first crossing to Eptelon — has been recovered from a private collection and returned to the custody of the colonial administration. The soldiers saw it displayed above the citadel gate and began cheering. The Pearl has come home to the shore it helped discover."
 me_eptelon_gen.22.a: "The Conqueror's legacy endures on this shore."

 me_eptelon_gen.23.t: "The Ascendic Shore"
 me_eptelon_gen.23.desc: "The Shout coastline is ours. The last of the significant resistance has been absorbed — some of it through negotiated submission, some through less negotiated processes, but all of it through the application of the Ascendic principle: that chaos yields to order, always, eventually. The colonists who have governed this territory for three generations are no longer colonists. They are administrators of an Ascendic state. The distinction matters, and they know it."
 me_eptelon_gen.23.a: "The philosophy holds. The shore holds. We hold."

 # ─────────────────────────────────────────────
 # BRANCH C — HEPTELONIAN COLONIST EVENTS
 # ─────────────────────────────────────────────

 me_eptelon_gen.30.t: "The Port Towns Secured"
 me_eptelon_gen.30.desc: "The harbor works are finished — walls, warehouses, wharves, and the counting houses that make all of it profitable. The colony master walked the finished fortifications yesterday morning and did not find a single gap that a landing party could exploit without taking casualties. The Horteonian merchant fleet that arrived this week unloaded its cargo and reloaded with Eptelonian timber without a single incident. That is, in its way, the definition of success."
 me_eptelon_gen.30.a: "A safe harbor is the colony's heartbeat."

 me_eptelon_gen.31.t: "The Inner Sea Routes Restored"
 me_eptelon_gen.31.desc: "The first scheduled convoy from the Horteonian mainland has arrived — not a single merchant vessel taking its chances, but a formal convoy with an agreed schedule, an agreed tariff structure, and an agreed mechanism for resolving disputes. The merchant houses of the coast have signed their names to it. For the first time since the founding generation, Eptelon is connected to the wider Horteonian world not by hope but by contract. Trade follows contract the way water follows channels."
 me_eptelon_gen.31.a: "We are no longer alone on this island."

 me_eptelon_gen.32.t: "The Colonial Levy Stands Ready"
 me_eptelon_gen.32.desc: "The drill-master's report: the levy is ready. Not professional soldiers — we were not trying to build professional soldiers, we were trying to build citizens who can fight. Men and women who have grown up on Eptelonian soil, who know its terrain, who have reason beyond coin to hold the line when the line gets difficult. There is a quality to that kind of soldier that mercenaries cannot replicate: they are not going to leave when the pay runs out, because they have nowhere else to be."
 me_eptelon_gen.32.a: "This island made us. We will defend it."

 me_eptelon_gen.33.t: "A Colony No Longer"
 me_eptelon_gen.33.desc: "The Harbor Charter has been signed — a founding document that formalize what three generations of births and marriages and deaths on Eptelonian soil have already made true. The colony's eldest citizen cannot remember Horteon. His grandfather could remember it, dimly, as a coastline seen from the deck of an outbound ship. His children know only this island, its winds, its tides, its forests, its feuds.\n\nThe charter does not transform us. We transformed ourselves. The charter simply acknowledges what the island already knows: that we are not colonists. We are Eptelonians. We were just the last to say so."
 me_eptelon_gen.33.a: "This island is our home. We are not leaving."

 # ─────────────────────────────────────────────
 # LATE GAME SHARED EVENTS
 # ─────────────────────────────────────────────

 me_eptelon_gen.40.t: "The Beleaguered Shore — Answered"
 me_eptelon_gen.40.desc: "We hold Eptelon. Both the north and the south, the highlands and the harbor mouths. The last enemy garrisons have withdrawn or submitted. The flags that were not ours have come down.\n\nBut there is a question that victory has not answered, only deferred: what do we do with the people who were on the wrong side of it? The island is full of communities that remember a different ruler, a different language, a different kind of authority. They are not going anywhere. Neither are we. The nature of what comes next — for them, and for us — must be decided deliberately, or it will be decided by accident."
 me_eptelon_gen.40.a: "Victory is not governance. The harder work begins now."

 me_eptelon_gen.41.t: "The Settlers' Compact Signed"
 me_eptelon_gen.41.desc: "The negotiations took longer than the war. That is the nature of peace terms — they must be lived with, which means every party has to be able to claim something. The remaining displaced communities will be granted residency rights within the new administrative structure. Tax obligations will replace tribute. Courts will hear cases without regard to a petitioner's origin culture. The people who were not on our side will not, by this compact, be made into enemies for the next generation. That is not generosity. That is mathematics."
 me_eptelon_gen.41.a: "A stable island requires people who have a reason to want it stable."

 me_eptelon_gen.42.t: "The Price Has Been Paid"
 me_eptelon_gen.42.desc: "The terms are what they are. Those who fought against us and lost have been reduced to the condition appropriate to their defeat. Property has been redistributed. Populations have been reclassified. The labor force at the capital's construction sites is considerably larger than it was this time last year.\n\nThis will generate unrest for a generation. It will also generate a generation of stories in the kingdoms beyond Eptelon's shores: that we are serious people, that we mean what we say, and that the cost of opposing us is not theoretical. Both things are true. Both things are, in their different ways, useful."
 me_eptelon_gen.42.a: "Let the price speak for itself."

 me_eptelon_gen.43.t: "The Shore Rebuilt"
 me_eptelon_gen.43.desc: "The scaffolding has come down from the last city. Ten settlements across Eptelon — some of them barely recognizable as the burned or abandoned shells they were when we started — are functioning again. Markets open. Courts judge. Children are born in the new buildings. There is something quietly defiant about a city that refuses to stay ruined: it insists on existing, which is another way of insisting that the people who built it intend to exist as well."
 me_eptelon_gen.43.a: "The island is healing. That is no small thing."

 me_eptelon_gen.44.t: "Fleet of the Fractured Shore"
 me_eptelon_gen.44.desc: "Forty warships, their pennants snapping in the harbor wind. The harbor master walked the line of them at dawn and counted twice, because forty seemed too many and he wanted to be certain. The fleet's commander sent a letter to the nearest slaver port informing their admiralty of the new patrol boundaries. The letter was politely worded. The fleet was not politely worded. The fleet was simply there, which was sufficient."
 me_eptelon_gen.44.a: "The sea around Eptelon is our water now."

 me_eptelon_gen.45.t: "The Capital Made Unassailable"
 me_eptelon_gen.45.desc: "The second curtain wall is finished. The garrison is reviewed, the courts are sitting, the administrative buildings are open and staffed. A delegation from a neighboring power came through last month — ostensibly diplomatic, actually evaluating. Their envoy spent three hours walking the walls. When he left, he sent a message back to his masters. We have not been told its contents, but he went home faster than he arrived, which suggests it contained useful information."
 me_eptelon_gen.45.a: "A strong capital makes a credible state."

 me_eptelon_gen.46.t: "The Island Finds Its Shape"
 me_eptelon_gen.46.desc: "The capital has been formally elevated — a ceremony, but ceremonies matter, because they are how societies tell themselves who they have decided to become. The aggressive expansion tallies are fading. The navies are strong. The cities are large. For the first time, a census of Eptelon's total population could be conducted, tallied, and compared to the numbers from a generation ago without producing expressions of despair. The island is growing. It is time to give it a name that matches what it has become."
 me_eptelon_gen.46.a: "Eptelon is ready. So are we."

 me_eptelon_gen.47.t: "Eptelon Endures"
 me_eptelon_gen.47.desc: "The decision is made. The seal is pressed. The herald has spoken the name aloud in every harbor town on the island, and in each place the crowd reacted differently — some with cheering, some with silence, some with tears whose precise meaning the chronicler chose not to guess at.\n\nBut the island is one thing now, under one name, held by one power whose claim is not inherited or negotiated or borrowed but earned. The beleaguered shore has found its ruler. Whatever it took to get here, whatever was paid — look at the map. Read the name on it. That is what it was paid for."
 me_eptelon_gen.47.a: "The island has a name. We gave it one."

 # ─────────────────────────────────────────────
 # BLOODLINE TRAIT NAMES
 # ─────────────────────────────────────────────

 blood_of_the_eptelonian_chiefs: "Blood of the Eptelonian Chiefs"
 blood_of_the_eptelonian_chiefs_desc: "This character carries the blood of those who led the great reclamation of Eptelon — the warchiefs who gathered the clans, found the Elder's Mark, and drove the colonists from shores the Eptelonian people had held since before history was written down."

 blood_of_atheusian_shores: "Blood of the Atheusian Shore"
 blood_of_atheusian_shores_desc: "This character carries the legacy of those who brought Ascendic order to the fractured shore of Eptelon — the colonial administrators who held the citadels, exploited the feuds, and transformed a colonial outpost into a sovereign Ascendic state."

 blood_of_the_harbor_founders: "Blood of the Harbor Founders"
 blood_of_the_harbor_founders_desc: "This character descends from those who turned a Heptelonian trading post into a sovereign nation — the founders whose ledgers, contracts, and colonial levies made Eptelon's harbor towns into something the island had never seen: a state that grew from commerce rather than conquest."

 # ─────────────────────────────────────────────
 # ITEM DESCRIPTIONS
 # ─────────────────────────────────────────────

 item_eptelon_elder_mark_desc: "A carved war-standard of ancient Eptelonian craftsmanship, bound in hammered copper and marked with clan-seals from a dozen tribes. Recovered from the ruins of Edaur, it is said to carry the oath of the first warchief who united the island's clans against the initial Atheusian invasion. The inscription reads: what was given by blood is held by blood. Whoever holds this relic in battle finds the island's warriors fighting as if every loss since the First Occupation were being repaid in a single hour."

 item_eptelon_harbor_charter_desc: "The formal founding document of the Heptelonian colonial claim to Eptelon — signed by the original factor-houses, witnessed by three generations of subsequent administrators, and bearing the salt-stain of a voyage made across the Inner Sea in a winter storm because the messenger could not wait for spring. It is not a weapon or a crown. It is something more durable: a legal claim, backed by generations of habitation, that no army can simply fight its way out of."

 # ─────────────────────────────────────────────
 # TRIBAL VASSALS — Demand Submission (50–54)
 # ─────────────────────────────────────────────

 me_eptelon_gen.50.t: "The Chieftains' Choice"
 me_eptelon_gen.50.desc: "Our warchief has sent messengers to the neighboring tribal clans: an offer, not a demand, backed by silver and the quiet assurance that submission to our overlordship will bring order to the fractured island. The neighboring chieftains will receive these envoys with the courtesy due to equals — for now. But the offer carries weight, and the silver carries weight, and our growing strength carries weight. We have determined to sponsor the submission of some number of these independent tribes. The cost is modest. The benefit, if they consent, is control over the island's interior peoples, and the prevention of their unification against us.\n\nHow many chieftains should we ask to submit?"
 me_eptelon_gen.50.a.text: "Send one envoy. (50 gold)"
 me_eptelon_gen.50.b.text: "Send two envoys. (100 gold)"
 me_eptelon_gen.50.c.text: "Send three envoys. (150 gold)"
 me_eptelon_gen.50.d.text: "Send four envoys. (200 gold)"
 me_eptelon_gen.50.e.text: "Send five envoys. (250 gold)"

 me_eptelon_gen.51.t: "Envoys Depart for the Tribal Lands"
 me_eptelon_gen.51.desc: "The warchief's messengers ride out with sealed letters and bags of coin. They carry words of honor, offers of vassalage on terms that will preserve the chieftains' autonomy within their own territories — the Eptelonian state will guarantee their borders, arbitrate their feuds, but let them rule their own people as they see fit. It is a reasonable offer, for those desperate enough to accept it.\n\nThe chieftains will now decide whether to accept or refuse. Their responses will come in time."
 me_eptelon_gen.51.a: "The die is cast."

 me_eptelon_gen.52.t: "A Messenger from [scope:eptelon_demanding_country.GetName]"
 me_eptelon_gen.52.desc: "A rider approaches bearing a sealed letter and a small purse of coin. The sender identifies themselves as an emissary of [scope:eptelon_demanding_country.GetName], the rising power on the western shore of Eptelon. The letter contains an offer: become [scope:eptelon_demanding_country.GetName]'s tribal vassal, and in exchange, [scope:eptelon_demanding_country.GetName]'s authority will stand behind your borders and your authority within them. You will keep your throne, your territory, and your independence in internal matters — but you will acknowledge [scope:eptelon_demanding_country.GetName] as the overlord of Eptelon.\n\nThe emissary waits for your response. The coin is yours to keep regardless of your answer. The letter, however, is an offer that demands one."
 me_eptelon_gen.52.a.text: "Accept. We will bend the knee to [scope:eptelon_demanding_country.GetName]."
 me_eptelon_gen.52.b.text: "Refuse. We remain independent."

 me_eptelon_gen.53.t: "The Chieftains' Responses Arrive"
 me_eptelon_gen.53.desc: "The messengers return one by one over the course of many days. Some carry the chieftains' seals of acceptance, pressed into wax on documents that formalize their submission. Others return empty-handed, their chieftains' refusal spoken with courtesy or defiance as each chieftain's temperament dictates.\n\nWe now see the fruits of our effort. Some of the island's interior tribes will bend to our will. Others will remain independent — for now, or perhaps for all time. The balance of power on Eptelon has shifted, but the shift is not complete. Not yet."
 me_eptelon_gen.53.a: "This is a beginning, not an ending."

