 WRS:0 "Yaravun"
 WRS_ADJ:0 "Yaravuni"
 WRS_island_lore_title:0 "The Reavers of the Westreach"
 WRS_island_lore:0 "The #G Outer Westreach#! lies at the edge of the known sea, where the rock of [GetProvince('(int32)5995').GetName|G] looks out over the empty western ocean. The #Y Dragkhan#! clans have kept their hearths on these islands for generations, and the thin soil of [GetProvince('(int32)5989').GetName|G] and [GetProvince('(int32)5991').GetName|G] fed them poorly from the very beginning.\n\nHunger made them sea wolves. Over the generations, the Westreach clans learned that a fast longboat and a hungry crew could take in a single night what a whole summer of fishing could not, and the spring moot at Yaravun became a muster of raiding fleets rather than a gathering of fishermen. Captains are chosen for their luck and kept for their plunder, and a chief who comes home empty-handed twice is seldom given a third chance. They raid the Morrigon coast, the villages of their own Dragkhan kin in [GetCountry('VYT').GetName|Y] and anyone else who looks weak, and they sell what they take in the #T Chain Market#! of [GetCountry('ESQ').GetName|Y].\n\n[ROOT.GetCountry.GetRuler.GetName|Y] commands the largest raiding fleet in the #G Western Isles#!, but holds it only by keeping it fed. The watchfires of [GetCountry('SVC').GetName|Y] now give warning of every Westreach sail, the merchant houses of [GetCountry('AUV').GetName|Y] hire mainland swords to guard their ships, and the elven castellans of [GetCountry('LTX').GetName|Y] are as likely to buy their captives as to clap the reavers themselves in chains. Will the Westreach carve out a kingdom of the sea, or will its own crews turn on their chief first?"
