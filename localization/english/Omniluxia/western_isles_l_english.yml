 WRS_ADJ:0 "Yaravuni"
 SRU:0 "Saruvai"
 SRU_ADJ:0 "Saruvai"
 SRU_island_lore_title:0 "The Seal Hearths of Saruvai"
 SRU_island_lore:0 "The western shore of #G Veyat#! belongs to the seal hunters. From [GetProvince('(int32)6082').GetName|G] to [GetProvince('(int32)6090').GetName|G] the clans of Saruvai spend each winter on the rookeries, and Saruvai sealskins and lamp oil warm half the halls of the Sound. They were once the loudest voices at the moot of [GetProvince('(int32)5979').GetName|G], until they tired of sending their best catch east as tribute and stopped coming.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] now holds a moot of their own beneath the cliffs of [GetProvince('(int32)6086').GetName|G], and keeps the old law of hospitality as faithfully as any Veyati hearth. The chief of [GetCountry('VYT').GetName|Y] still calls Saruvai a daughter of the Sound, and the young hunters of [GetCountry('OYE').GetName|Y] say the rookeries should be shared. Will the seal hearths keep their freedom, or be called home to Rashveli?"
 OYE:0 "Oyeral"
 OYE_ADJ:0 "Oyerali"
 OYE_island_lore_title:0 "The Boatwrights of Oyeral"
 OYE_island_lore:0 "The northern headlands of #G Veyat#! hold the only tall timber in the Sound, and the clans of [GetProvince('(int32)6083').GetName|G] have made it their fortune. Nearly every longboat that fishes the shoals of the #G Western Isles#! was raised in the yards of [GetProvince('(int32)6087').GetName|G] or [GetProvince('(int32)6091').GetName|G], and an Oyerali boatwright is said to know a keel's luck before the first plank is fitted.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] sells boats to anyone who pays in honest silver, and that is the trouble. The fishers of [GetCountry('VYT').GetName|Y] complain that Oyerali hulls now carry reavers out of [GetCountry('LSV').GetName|Y] and [GetCountry('WRS').GetName|Y], while the boatwrights answer that a hull has no say in who sails it. How long can Oyeral profit from both sides of the Sound?"
 VAO:0 "Vaonua"
 VAO_ADJ:0 "Vaonuan"
 VAO_island_lore_title:0 "The Last Hearth of Vaonua"
 VAO_island_lore:0 "West of #G Veyat#! lies [GetProvince('(int32)6075').GetName|G], the furthest hearth of the #Y Dragkhan#! clans. Beyond its cliffs there is nothing but open sea, and the shrine on its summit has burned a fire for the old gods for longer than any song remembers. The clans of the Sound send their dead here to be blessed, and every crew that sails west stops to leave an offering at the shrine.\n\nThe priest-chiefs of Vaonua have never bowed to the moot of [GetCountry('VYT').GetName|Y], for the island answers only to the gods. [ROOT.GetCountry.GetRuler.GetName|Y] keeps the fire with a handful of families and a few fishing boats, and the isle's only defense is the fear of what the gods would do to anyone who raided it. Will that fear hold now that the reavers of the Westreach fear so little?"
 AVR:0 "Avaroa"
 AVR_ADJ:0 "Avaroan"
 AVR_island_lore_title:0 "The Watch of Avaroa"
 AVR_island_lore:0 "[GetProvince('(int32)6077').GetName|G] lies between #G Veyat Sound#! and the reaver isles of the Westreach, and its clans have paid for it. The tower on [GetProvince('(int32)5992').GetName|G] was raised after a summer when the Yaravuni took every boat and every child on the island, and it has been manned day and night ever since.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] keeps the watch and sells warning to anyone who will pay. A fire on Khayu tells the Sound that the longboats are coming, while a fire on Avaroa tells the Westreach that the Sound is ready for them. The chiefs of [GetCountry('LSV').GetName|Y] would dearly love to put that fire out. Can a single island keep the sea between the clans and the reavers?"
 HRK:0 "Hirakava"
 HRK_ADJ:0 "Hirakavan"
 HRK_island_lore_title:0 "The Autumn Shoals of Hirakava"
 HRK_island_lore:0 "Every autumn the great shoals run past [GetProvince('(int32)6097').GetName|G] and [GetProvince('(int32)5980').GetName|G], and the clans of Hirakava catch more fish in a month than the rest of #G Arukava#! does in a year. The rocks of [GetProvince('(int32)5988').GetName|G] are white with drying racks until the winter storms come in.\n\nThe catch has made Hirakava proud and its neighbors jealous. [ROOT.GetCountry.GetRuler.GetName|Y] refuses to share the shoals with the salt clans of [GetCountry('ARK').GetName|Y], though their grandfathers shared a single moot, and the fishers of [GetCountry('VYT').GetName|Y] still claim the shoals by ancient right. Will the silver of the shoals bring Hirakava fortune, or only enemies?"
 ARK:0 "Arukava"
 ARK_ADJ:0 "Arukavan"
 ARK_island_lore_title:0 "The Salt Pans of Arukava"
 ARK_island_lore:0 "The eastern shore of #G Arukava#! is flat and dry, and its clans long ago learned to turn the sea into salt. The pans around [GetProvince('(int32)6074').GetName|G] and [GetProvince('(int32)6100').GetName|G] preserve the catch of half the isles, and Arukavan salt traders are welcome in every harbor from [GetCountry('AUV').GetName|Y] to the Morrigon coast.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] grows wealthy on the trade, but salt draws reavers as surely as silver does. The longboats of [GetCountry('PYL').GetName|Y] are only a short crossing to the south, and the fishers of [GetCountry('HRK').GetName|Y] have made it plain they will not answer the salt clans' fires. Can Arukava buy its safety, or will it have to fight for it?"
 LSV:0 "Lushvai"
 LSV_ADJ:0 "Lushvai"
 LSV_island_lore_title:0 "The Reavers of Lushvai"
 LSV_island_lore:0 "The northern clans of #G Yaravun#! live closest to the fat fishing hearths of #G Veyat Sound#!, and they have never let that chance pass. From [GetProvince('(int32)6095').GetName|G], the longboats of Lushvai cross by way of [GetProvince('(int32)6076').GetName|G] to strike the Veyati shore, and they are home again before the alarm fires burn out.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] sits at the spring moot of [GetCountry('WRS').GetName|Y] as an equal and obeys it only when it suits. The Lushvai crews say the old chief at Yaravun has grown fat and slow, and that the north should lead the Westreach. Will Lushvai raid its way to the high seat of the moot?"
 HUR:0 "Huaren"
 HUR_ADJ:0 "Huareni"
 HUR_island_lore_title:0 "The Wreckers of Huaren"
 HUR_island_lore:0 "[GetProvince('(int32)5994').GetName|G] faces the bare rock of [GetProvince('(int32)5995').GetName|G], and between them run some of the most treacherous waters of the western sea. The clans of Huaren learned long ago that the sea does half their raiding for them: a false fire on the wrong headland, and a merchant ship tears itself open on the reefs.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] claims every wreck that washes ashore and every sailor who survives one. The castellans of [GetCountry('LTX').GetName|Y] curse the false lights, the merchants of [GetCountry('AUV').GetName|Y] pay to have their ships guided past, and the Chain Market of [GetCountry('ESQ').GetName|Y] buys whatever crews the reefs spare. How long before the sea, or someone angrier, claims the wreckers in turn?"
 PYL:0 "Puyarel"
 PYL_ADJ:0 "Puyareli"
 PYL_island_lore_title:0 "The Chain Crews of Puyarel"
 PYL_island_lore:0 "The southern isle of [GetProvince('(int32)5981').GetName|G] has the best harbor in the Westreach and the worst soil. Its clans gave up the plough generations ago and turned to the trade that pays best in the #G Western Isles#!: they take captives on the Morrigon coast and in the fishing hearths of [GetCountry('ARK').GetName|Y], and sell them in the Chain Market of [GetCountry('ESQ').GetName|Y].\n\n[ROOT.GetCountry.GetRuler.GetName|Y] keeps the pens at [GetProvince('(int32)6101').GetName|G] full and the merchant princes of Eshqara happy. The Puyareli crews have little love for the moot of [GetCountry('WRS').GetName|Y], which takes its share of every raid and gives nothing back. Will the chain crews of Puyarel prosper, or end in chains of their own?"
 MMY:0 "Mimoya"
 MMY_ADJ:0 "Mimoyan"
 MMY_island_lore_title:0 "The Exiles of Mimoya"
 MMY_island_lore:0 "[GetProvince('(int32)5991').GetName|G] is a small island at the very edge of the Westreach, and it has always taken in those with nowhere else to go. Its clans are made up of crews outlawed by the moot of [GetCountry('WRS').GetName|Y], reavers who lost their ships, and fishers who fled the raids of their own kin.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] is the chief of a people who have no friends and nothing to lose. They raid whoever is weakest, trade with whoever will deal with them, and keep a feud with almost every other clan of the Westreach. Can the exiles of Mimoya make a home of the last rock in the sea?"
 WRS_island_lore_title:0 "The Reavers of the Westreach"
 WRS_island_lore:0 "The #G Outer Westreach#! lies at the edge of the known sea, where the rock of [GetProvince('(int32)5995').GetName|G] looks out over the empty western ocean. The #Y Dragkhan#! clans have kept their hearths on these islands for generations, and the thin soil of [GetProvince('(int32)5989').GetName|G] and [GetProvince('(int32)5991').GetName|G] fed them poorly from the very beginning.\n\nHunger made them sea wolves. Over the generations, the Westreach clans learned that a fast longboat and a hungry crew could take in a single night what a whole summer of fishing could not, and the spring moot at Yaravun became a muster of raiding fleets rather than a gathering of fishermen. Captains are chosen for their luck and kept for their plunder, and a chief who comes home empty-handed twice is seldom given a third chance. They raid the Morrigon coast, the villages of their own Dragkhan kin in [GetCountry('VYT').GetName|Y] and anyone else who looks weak, and they sell what they take in the #T Chain Market#! of [GetCountry('ESQ').GetName|Y].\n\n[ROOT.GetCountry.GetRuler.GetName|Y] holds the spring moot at Yaravun, but every chief of the Westreach now keeps a fleet of their own, and the crews of [GetCountry('LSV').GetName|Y], [GetCountry('HUR').GetName|Y], [GetCountry('PYL').GetName|Y] and [GetCountry('MMY').GetName|Y] answer the moot only when the plunder is good. The watchfires of [GetCountry('SVC').GetName|Y] now give warning of every Westreach sail, the merchant houses of [GetCountry('AUV').GetName|Y] hire mainland swords to guard their ships, and the elven castellans of [GetCountry('LTX').GetName|Y] are as likely to buy their captives as to clap the reavers themselves in chains. Will the Westreach carve out a kingdom of the sea, or will its own crews turn on their chief first?"
