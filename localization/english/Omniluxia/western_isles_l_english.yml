 VYT:0 "Veyat"
 VYT_ADJ:0 "Veyati"
 VYT_island_lore:0 "The chiefs came to Rashveli with scales on their sleeves and news of the shoals, and [ROOT.GetCountry.GetRuler.GetName|Y] heard three accounts of the same morning before anyone sat down to divide the winter grounds. The Puyonga clans had followed the fish through the Sound all season, and two crews that had shared a net in summer now wanted the same stretch of sheltered water.\n\nWhile the chiefs argued over where to set the boundary, a stranger came in from the landing and asked for a pilot. Someone put another bowl by the hearth, and the youngest hand went down to look at the stranger's boat, for a guest can ask for a pilot at any clan hearth in Veyat Sound."
