l_english:
 AUV:0 "Auravel"
 AUV_ADJ:0 "Auraveli"
 AUV_island_lore:0 "By the time [ROOT.GetCountry.GetRuler.GetName|Y] reached the quay at Auravel, the pilots had opened the anchorage register on a bale of sailcloth, and a boatman was holding the pages down with both hands. An old pilot ran a finger down the names that the Alusian and Sarian crews had carried out of Arteon during the Second Great War, and showed the younger hands where their families had first come ashore.\n\nA skipper had come to ask why one of the coves was missing from his copy, and the keeper of the register told him that its harbor had taken in a raider. The skipper said there was good holding ground there in a westerly, and the keeper agreed, but he turned the page all the same."
