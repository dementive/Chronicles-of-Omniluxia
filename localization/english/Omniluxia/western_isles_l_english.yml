 LTX:0 "Therys"
 LTX_ADJ:0 "Therysian"
 LTX_island_lore_title:0 "The Lanterns of Therys"
 LTX_island_lore:0 "When the #Y High Elves#! sent their #T Slaver Fleets#! to plant colonies on #G Arteon#! in 95 LC, they needed a place to gather their galleys beyond the reach of Arteonian spears. They found it at #G Therys#!, where the first castellans raised a chain of white lantern towers from [GetProvince('(int32)5968').GetName|G] to [GetProvince('(int32)5972').GetName|G] so that the fleets could make landfall by night. For nine centuries nearly every #Y Ascendic#! invasion of the western shore was mustered beneath those lights, and the isle of [GetProvince('(int32)5971').GetName|G] still bears the name of the #Y Usrevani#! colonists who sailed from it and never returned.\n\nThen #T Atheus the Younger#! fell at #G Athlarethere#! in 635 LC, #T Calidriel#! and #T Cymeva Atheus#! turned their swords on each other, and the galleys stopped coming. The castellans of Therys waited for their orders through the #T High Elven Civil War#! and the #R Great Collapse#!, and when no orders came, they began to give their own. The lanterns now burn for whoever pays. A merchant who brings silver to [GetProvince('(int32)5969').GetName|G] is shown a safe channel, while one who refuses finds the lights put out and Therysian galleys waiting for him on the rocks, and the pens beneath the towers are never empty for long.\n\nBoth the [GetCountry('ATH').GetName|Y] and [GetCountry('ACY').GetName|Y] claim the Lanterns as their rightful inheritance, and [ROOT.GetCountry.GetRuler.GetName|Y] has grown skilled at promising each of them loyalty while sending neither a single ship. The castellans sell their captives in the #T Chain Market#! of [GetCountry('ESQ').GetName|Y], though the free men who run that market have not forgotten what elves once did to them. With the #T Great Slaver Navies#! once more abroad on the western sea, will Therys again become the spearhead of an elven invasion, or will its castellans make themselves kings of the lanterns forever?"
