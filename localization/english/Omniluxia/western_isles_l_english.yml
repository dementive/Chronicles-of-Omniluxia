 SVC:0 "Searvari"
 SVC_ADJ:0 "Searvari"
 SVC_island_lore_title:0 "The Watchfires of Searvari"
 SVC_island_lore:0 "The #Y Iwuregan#! have fished the waters off western #G Arteon#! for as long as any song remembers, and when the #T Second Great War of Arteon#! drove refugees to the coast, it was Iwuregan boats that carried them across to #G Searvari#!. Among them came a band of #Y Sarian#! highlanders, who had fought the #Y High Elves#! since the Atheusian push into the south was thrown back in 498 LC. The fishermen gave them the bare headland of [GetProvince('(int32)5978').GetName|G], and the Sarians have kept watch from it ever since.\n\nThe peace did not last. When the #T High Elven Peace#! freed the #T Great Slaver Navies#! to hunt the western sea once more, the elven galleys came for the fishing villages first. The Iwuregan elders answered by raising watchfires on every headland from [GetProvince('(int32)5978').GetName|G] to [GetProvince('(int32)5973').GetName|G], so that a single sail sighted at dawn can set the whole chain alight before noon and send every boat in the isles running for shelter. A watchman who sleeps beside his fire is cast out of his village, and the households still name their children after those who lit the fires in time.\n\nUnder [ROOT.GetCountry.GetRuler.GetName|Y], Searvari remains a poor realm of fishermen, flax and stubborn pride, and its people still bring their first catch to the shrines of #T Artheous#!, who slew the wyrms of Arteon when men were on the verge of extinction. Its boats have not been taken in harbor for three generations. The merchants of [GetCountry('AUV').GetName|Y] and the clans of [GetCountry('VYT').GetName|Y] have sworn to answer its fires under the #T Watchfire Compact#!, yet the towers of [GetCountry('LTX').GetName|Y] are only a few days' sail away, and every summer brings more sails to the horizon. How long can the fires of Searvari keep the chains from its shores?"
