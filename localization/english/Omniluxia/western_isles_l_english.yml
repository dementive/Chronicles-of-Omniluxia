 SVC:0 "Searvari"
 SVC_ADJ:0 "Searvari"
 SVC_island_lore:0 "A fire went up on Maresh Watch before dawn, and the first boat off Searvari was halfway out of the harbor before its crew had finished pulling on their coats. By the time [ROOT.GetCountry.GetRuler.GetName|Y] came down to the landing, the rowers were back with a fishing boat in tow, and a lookout was calling down to ask how many hands they had brought in.\n\nThe Sarian fishing families built the first watch posts when the Great Slaver Navies returned, and every island has tended its own beacon since. At the next landing the fishwives will set a basket aside for the crew that answered first, and by noon there will be somebody on the quay who swears they could have been quicker."
