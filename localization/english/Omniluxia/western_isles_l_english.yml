 ESQ:0 "Eshqara"
 ESQ_ADJ:0 "Eshqaran"
 ESQ_island_lore_title:0 "The Chain Market of Eshqara"
 ESQ_island_lore:0 "#G Eshqara#! was among the first of the #Y Usrevani#! colonies planted when the #Y High Elven#! #T Slaver Fleets#! came to #G Arteon#! in 95 LC. Its elven lords raised a citadel above a #Y Mimoyunde#! harbor town, worked its people as serfs, and grew rich shipping Arteonian captives across the sea. When the #T High Elven Civil War#! cut the colony off from its overlords after 635 LC, the serfs of [GetProvince('(int32)5985').GetName|G] rose, dragged their masters down from the citadel, and sold every last one of them in their own market.\n\nThey never closed it. The #T Chain Market#! below the citadel is now the largest slave market of the #G Western Isles#!, and the #Y Mimoyunde#! merchant princes who run it see no contradiction in being the grandchildren of serfs. Every ship that anchors in the roads is welcome so long as it pays the harbor tithe: the reavers of the Westreach, the galleys of [GetCountry('LTX').GetName|Y] and the captains of the #T Great Slaver Navies#! all sell their catch here, and the princes will buy whatever no honest market will touch, whether it be stolen cargo or stolen people. Elven captives fetch the highest price of all.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] rules through gold and fear, for Eshqara has no friends, only customers and creditors. Its walls are guarded by #Y Orcish#! sea-blades hired from [GetCountry('ZBR').GetName|Y], the merchants of [GetCountry('AUV').GetName|Y] curse every chain that leaves the harbor, and the castellans of Therys have never forgiven the market for the elves it sold. Can Eshqara grow fat on the misery of the western sea without being swallowed by it?"
 eshqara_roads_area:0 "Eshqaraa"
