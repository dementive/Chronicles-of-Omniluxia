 VYT:0 "Veyat"
 VYT_ADJ:0 "Veyati"
 VYT_island_lore_title:0 "The Hearths of Veyat Sound"
 VYT_island_lore:0 "The #Y Dragkhan#! clans of #G Veyat Sound#! have fished the waters off southwestern Morrigon for generations. Each autumn the shoals return between [GetProvince('(int32)5979').GetName|G] and [GetProvince('(int32)5980').GetName|G], where the fishers offer the first catch to the old gods.\n\nThe Sound is ruled by its clan moot, and the chief who sits at Rashveli is first among equals rather than a king. Hospitality is the oldest law of the Dragkhan: a stranger who comes to their hearth is fed before he is asked his name, and any clan will send its best boatman to guide a guest through the shoals. Veyati salt fish, seal oil and sealskins fetch good prices in the markets of [GetCountry('AUV').GetName|Y], and the clans have long cared little for anything beyond their own waters.\n\nNot every Dragkhan has kept to the old ways. Out on the #G Outer Westreach#!, the clans of [GetCountry('WRS').GetName|Y] have learned that raiding pays better than fishing, and Veyati boats now come home with tales of kinsmen who would cut a net for its catch. [ROOT.GetCountry.GetRuler.GetName|Y] has bound the Sound to [GetCountry('AUV').GetName|Y] and [GetCountry('SVC').GetName|Y] in the #T Watchfire Compact#!, but can a hearth that is open to every guest stay open while reavers sail the Sound?"
