 WRS:0 "Yaravun"
 WRS_ADJ:0 "Yaravuni"
 WRS_island_lore:0 "The first crews came into Yaravun before the spring moot, and by the time [ROOT.GetCountry.GetRuler.GetName|Y] took a seat, there were wet cloaks on every peg and two clans disputing where their nets had lain the year before. Their families had come from western Arteon in several waves, and the older settlers still reckoned some fishing grounds by the names of the boats that had found them.\n\nThe moot heard the crews in turn, and when the last claim was settled, a keeper from Last Lantern put a piece of rotten roofing on the table. Before the boats went out again, there were names beside every shelter that needed timber, and the keeper had found room in a returning boat for the first bundle."
