 LTX:0 "Therys"
 LTX_ADJ:0 "Therysian"
 LTX_island_lore:0 "At Atherion Light, the keeper was trimming the wick when [ROOT.GetCountry.GetRuler.GetName|Y] came up the stairs, and below them an Atheusian skipper was shouting across the water to a Horteonian who had come in on the same tide. The two had made the headland after dark, and each had taken the light for his own.\n\nThe keeper brought out the old garrison accounts, and the last page to record a mainland payment was still folded at the corner. When the High Elven Civil War cut the garrisons off from their patrons, the crews had taken their pay at the quay, and the harbor dues still bought the oil that brought both skippers safely in."
