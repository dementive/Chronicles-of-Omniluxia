l_english:
 AUV:0 "Auravel"
 AUV_ADJ:0 "Auraveli"
 AUV_island_lore_title:0 "The Harbor of the Emra"
 AUV_island_lore:0 "When the #T Second Great War of Arteon#! broke out in 587 LC, the #Y Alu-sarian#! half elves of the highlands found themselves hunted from both sides. The #Y Atheusian#! garrisons called them #R 'Emra'#! and wanted them in chains, while many native warbands saw only elven blood in their faces. Hundreds of families fled down to the western shore and put to sea, and the crews who found the sheltered anchorage of [GetProvince('(int32)5964').GetName|G] swore that their children would never again live within a day's march of an elven citadel.\n\nMore than four centuries later, #G Auravel#! is the wealthiest harbor of the #G Western Isles#!. Its merchant houses buy grain, timber and dye from #G Arteon#! and sell them on to anyone who pays honestly, and their kinship with the [GetCountry('ALS').GetName|Y] keeps the mainland markets open to Auravel ships. The half-elven captains still keep the #T Ascendic#! faith of their elven forebears, even as they curse the elves who use that same faith to justify their chains, and the merchant council under [ROOT.GetCountry.GetRuler.GetName|Y] keeps a long ledger of every harbor known to have sold a half elf to the slavers.\n\nThe sea has proven no kinder than the highlands. The castellans of [GetCountry('LTX').GetName|Y] watch the Auravel trade from their lantern towers, the #T Chain Market#! of [GetCountry('ESQ').GetName|Y] pays well for half-elven captives, and the reavers of [GetCountry('WRS').GetName|Y] know every cove in the isles. Together with [GetCountry('SVC').GetName|Y] and [GetCountry('VYT').GetName|Y], the merchant houses have sworn the #T Watchfire Compact#! for their mutual defense, but can coin and kinship keep the Emra free?"
