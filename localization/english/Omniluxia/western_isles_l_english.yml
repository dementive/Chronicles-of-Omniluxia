 ESQ:0 "Eshqara"
 ESQ_ADJ:0 "Eshqaran"
 ESQ_island_lore:0 "The harbor court at Eshqara met with the warehouse doors open, and [ROOT.GetCountry.GetRuler.GetName|Y] could hear the porters counting jars while a Myahudyan skipper gave an account of the ones he had lost. His clerk laid a salt-stiff receipt on the table, and the judges passed it from hand to hand while they asked whether the ship that took the cargo had sailed under a commission.\n\nThe first warehouses went up when the wars on Arteon made the coastal trade uncertain, and the same walls now hold the records of cargoes that never reached them. The clerk asked for a day to find a witness, and the judges gave him until the next tide."
