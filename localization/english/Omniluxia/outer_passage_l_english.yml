 RXD_HAS_ANCIENT_DRAGON:0 "#Y This realm is ruled by a#! #G Dragon#! #Y named#! #T Sarthovar#!."
 RXD_TREE:0 "#Y $RXD$#!\n$RXD_HAS_ANCIENT_DRAGON$\n\nThe inhabitants of #G Urzhaketh#! are native Dragkhan clans who have worked the island's silver veins for generations. #Y Sarthovar#!, a #G Dragon#! from #T Morrigon#!, conquered the island's meager defenses and has lived above its rich mines for over a hundred years."
 urzhaketh.1.t:0 "Isle of the Silver Dragon"
 urzhaketh.1.desc:0 "Long ago, when the first settlers arrived on the island of #T Urzhaketh#! and discovered the silver @precious_metals! buried in its mountains, they were overjoyed and truly believed that they had found paradise. Over the decades that followed, buildings of stone replaced the humble wooden huts of the early colonists and a grand city was built into the sides of the mountain. Ships carrying silver sailed back and forth to #T Morrigon#!, and life there was simple and good, following the natural rhythms of the seasons, and the people thanked the gods for their kindnesses. \n\nThat was before the arrival of #Y Sarthovar#!, a #G Dragon#! that had heard of the riches and splendor of the realm. Its greed awakened, the Wyrm breathed fire and destroyed the armies sent against it, and for over one hundred years, Sarthovar has roosted in the high mountains surrounding the city that it conquered, ruling over a terrified populace that lives in his shadow."
 urzhaketh.1.a:0 "The fate of Omniluxia is now in our claws."
 omni_sarthovar_longevity:0 "An Ancient Dragon's Vigor"
 desc_omni_sarthovar_longevity:0 "Sarthovar has roosted on Urzhaketh for over a century."
