l_english:

 generic_migration_invasion:0 "The Invasion of [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName]"
 generic_migration_invasion_DESCRIPTION:0 "The settled peoples beyond our border have grown comfortable behind fields, roads, granaries, and walls. Their lands are close enough for our warbands to reach, and rich enough that their ruin would feed our people, frighten our rivals, and open new ground for migration."
 generic_migration_invasion_CRITERIA_DESCRIPTION:0 "This mission will be completed when our tribes have established a foothold, driven captives before the warbands, and broken enough of #Y [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName]#! to claim the spoils."
 generic_migration_invasion_BUTTON_TOOLTIP:0 "Gather the clans for a war of plunder and migration."
 generic_migration_invasion_BUTTON_DETAILS:0 "A neighboring foreign region will be chosen as the target of a migratory invasion."
 generic_migration_invasion_REWARD_DESCRIPTION:0 "Completing this mission grants military experience, a temporary migration legend modifier, and a final choice over the conquered lands."

 generic_migration_invasion_prepare:0 "Gather The Warbands"
 generic_migration_invasion_prepare_DESC:0 "Before crossing into [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName|Y], the clans must be called to arms. It is time to gather the raiding parties and unleash the hounds of war!"
 generic_migration_invasion_prepare_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! must use the #T Government Interaction#! #Y Assemble Raiding Parties#!."

 generic_migration_invasion_raise_horde:0 "Raise The Horde"
 generic_migration_invasion_raise_horde_DESC:0 "Promises of plunder are wind until families, herds, wagons, and warriors begin to move. A true invasion requires more than a raiding party: it requires a people ready to leave old ground behind."
 generic_migration_invasion_raise_horde_tt:0 "#Y [SCOPE.GetRootScope.GetCountry.GetName]#! must raise at least #Y 1#! migratory horde. (#Y [SCOPE.ScriptValue('generic_migration_invasion_migratory_horde_svalue')|0]#!/#Y 1#!)"

 generic_migration_invasion_foothold:0 "Make Camp In [SCOPE.sArea('migration_invasion_target_area').GetName]"
 generic_migration_invasion_foothold_DESC:0 "A migrating host does not need walls to begin an invasion. Once our wagons, herds, and warriors are inside [SCOPE.sArea('migration_invasion_target_area').GetName|Y], the clans can turn open ground into a forward camp and begin stripping the enemy countryside."
 generic_migration_invasion_foothold_tt:0 "Have at least #Y 1#! non-exiled migratory horde in #Y [SCOPE.sArea('migration_invasion_target_area').GetName]#!. (#Y [SCOPE.ScriptValue('generic_migration_invasion_target_area_foothold_svalue')|0]#!/#Y 1#!)"

 generic_migration_invasion_scour_area:0 "Scour [SCOPE.sArea('migration_invasion_target_area').GetName]"
 generic_migration_invasion_scour_area_DESC:0 "Not every settlement needs to be held. Some need only be made into warnings. A few burned storehouses and emptied villages in [SCOPE.sArea('migration_invasion_target_area').GetName|Y] will make the enemy spend soldiers protecting homes instead of meeting us in battle."
 generic_migration_invasion_scour_area_tt:0 "At least #Y 2#! territories in #Y [SCOPE.sArea('migration_invasion_target_area').GetName]#! have been #R Razed#! or #R Pillaged#!. (#Y [SCOPE.ScriptValue('generic_migration_invasion_target_area_devastated_svalue')|0]#!/#Y 2#!)"

 generic_migration_invasion_seize_stronghold:0 "Sack A Stronghold"
 generic_migration_invasion_seize_stronghold_DESC:0 "A city taken by storm is more than a place on a map. Storehouses, shrines, armories, hostages, and scribal vaults all lie behind its gates. If we occupy such a city in [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName|Y], the warriors can search it for plunder."
 generic_migration_invasion_seize_stronghold_tt:0 "Occupy at least #Y 1#! foreign city in #Y [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName]#!. (#Y [SCOPE.ScriptValue('generic_migration_invasion_region_strongholds_controlled_svalue')|0]#!/#Y 1#!)"
 generic_migration_invasion_seize_stronghold_reward_tt:0 "A random #R Sack Event#! will take place in the occupied city."

 generic_migration_invasion_drive_captives:0 "Burn The Fields"
 generic_migration_invasion_drive_captives_DESC:0 "The enemy's granaries and harvest yards are as useful to us as their silver. With a month of raiding, the host can strip food from the countryside of [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName|Y] and send it back to feed our capital."
 generic_migration_invasion_drive_captives_tt:0 "Occupy, raze, or pillage at least #Y 1#! foreign territory in #Y [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName]#! whose province has at least #Y [SCOPE.ScriptValue('generic_migration_invasion_burned_fields_food_svalue')|0]#! Food @food_icon!."
 generic_migration_invasion_burn_fields_reward_tt:0 "One eligible enemy territory will be #R Pillaged#!. Its province loses #R [SCOPE.ScriptValue('generic_migration_invasion_burned_fields_food_svalue')|0]#! Food @food_icon!, and our capital province gains #G [SCOPE.ScriptValue('generic_migration_invasion_burned_fields_food_svalue')|0]#! Food @food_icon!."

 generic_migration_invasion_sell_captives:0 "Sell The Captives"
 generic_migration_invasion_sell_captives_DESC:0 "The long march has gathered more captives than the clans can easily feed or guard. Traders, client chiefs, and distant markets will pay for the strongest among them, though such cruelty will leave its own stain on our rule."
 generic_migration_invasion_sell_captives_tt:0 "Control, raze, or pillage at least #Y 3#! foreign territories in #Y [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName]#!. (#Y [SCOPE.ScriptValue('generic_migration_invasion_captives_available_svalue')|0]#!/#Y 3#!)"
 generic_migration_invasion_sell_captives_reward_tt:0 "We will gain #G [SCOPE.ScriptValue('generic_migration_invasion_captive_sale_income_svalue')|0]#! @gold! from selling captives gathered during the invasion, but also gain #R 5#! Tyranny @tyranny!."

 generic_migration_invasion_complete:0 "Claim The Spoils"
 generic_migration_invasion_complete_DESC:0 "The invasion has shattered the old order beyond our border. Now we must decide whether these lands are to be kept, stripped bare, or remembered as a warning to the next people in our path."
 generic_migration_invasion_complete_tt:0 "Own, or have subjects own, at least #Y 50%#! of the territories in #Y [SCOPE.sArea('migration_invasion_target_area').GetName]#!. (#Y [SCOPE.ScriptValue('generic_migration_invasion_target_area_owned_or_subject_owned_svalue')|0]#!/#Y [SCOPE.ScriptValue('generic_migration_invasion_target_area_total_territories_svalue')|0]#!)"
 generic_migration_invasion_complete_reward_tt:0 "A final event will decide what becomes of the conquered lands."

 generic_migration_invasion_warbands:0 "Invasion Warbands"
 desc_generic_migration_invasion_warbands:0 "The clans have gathered for an invasion across the border."
 generic_migration_invasion_burned_paths:0 "Burned Paths"
 desc_generic_migration_invasion_burned_paths:0 "The first border settlements have been put to the torch, clearing the way for the warbands behind them."
 generic_migration_invasion_forward_camps:0 "Forward Camps"
 desc_generic_migration_invasion_forward_camps:0 "The migrating host has established camps, corrals, and waystations just beyond the border."
 generic_migration_invasion_seized_stronghold:0 "Seized Stronghold"
 desc_generic_migration_invasion_seized_stronghold:0 "A captured strongpoint has given the invasion a defensible center of gravity."
 generic_migration_invasion_slave_drivers:0 "Slave Drivers"
 desc_generic_migration_invasion_slave_drivers:0 "Captives are being gathered and driven back toward our people."
 generic_migration_invasion_legend:0 "Legend of the Invasion"
 desc_generic_migration_invasion_legend:0 "The success of the invasion has stirred the clans and made new migrations easier to justify, though nearby rulers will not soon forget our brutality."

 generic_migration_invasion.1.t:0 "Loose Silver"
 generic_migration_invasion.1.desc:0 "The gates of [SCOPE.sP('migration_invasion_sacked_city').GetName] have barely cooled before warriors begin dragging strongboxes, temple bowls, and hidden coin jars into the streets. The haul is not legendary, but it is real enough to quiet the hungry."
 generic_migration_invasion.1.a:0 "Take what they carried."

 generic_migration_invasion.2.t:0 "Captured Armories"
 generic_migration_invasion.2.desc:0 "The defenders of [SCOPE.sP('migration_invasion_sacked_city').GetName] kept more spears, shields, and horse gear than our scouts expected. Much of it is battered, but the host knows how to make use of captured iron."
 generic_migration_invasion.2.a:0 "Hand the weapons to the host."

 generic_migration_invasion.3.t:0 "Cold Ashes"
 generic_migration_invasion.3.desc:0 "By the time our warriors break into the storehouses of [SCOPE.sP('migration_invasion_sacked_city').GetName], the best goods are gone. What remains is smoke, broken jars, and frightened locals with little left to surrender."
 generic_migration_invasion.3.a:0 "There is nothing worth taking."
 generic_migration_invasion_sack_bust_tt:0 "No additional plunder is found."

 generic_migration_invasion.4.t:0 "Hostages of Rank"
 generic_migration_invasion.4.desc:0 "Among the captives taken in [SCOPE.sP('migration_invasion_sacked_city').GetName] are merchants, priests, and kin of local nobles. Their families will pay, and the clans will remember who delivered such valuable prisoners."
 generic_migration_invasion.4.a:0 "Ransom them for a king's price."

 generic_migration_invasion.5.t:0 "Tablets of the Old Masters"
 generic_migration_invasion.5.desc:0 "Hidden beneath the halls of [SCOPE.sP('migration_invasion_sacked_city').GetName], our warriors find maps, tablets, and instruments whose worth is not measured in silver. The learned among our people insist these spoils could change how we rule and fight."
 generic_migration_invasion.5.a:0 "Let our wisest learn from them."

 generic_migration_invasion.6.t:0 "The Spoils of [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName]"
 generic_migration_invasion.6.desc:0 "The invasion has shattered the old order in [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName]. Smoke, captives, abandoned fields, and frightened chiefs now lie behind the warbands. The clans gather to decide what should remain when our host moves on."
 generic_migration_invasion.6.a:0 "Keep the conquered lands."
 generic_migration_invasion.6.b:0 "Raise a tribal vassal."
 generic_migration_invasion.6.c:0 "Send their elites to our capital."
 generic_migration_invasion.6.d:0 "Leave none but our own."
 generic_migration_invasion.6.e:0 "Let the warning stand."
 generic_migration_invasion_claim_annex_tt:0 "We will annex up to #Y [SCOPE.ScriptValue('generic_migration_invasion_annexable_territories_svalue')|0]#! occupied or subject-held territories in #Y [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName]#!, gaining Tyranny and Aggressive Expansion."
 generic_migration_invasion_claim_vassal_tt:0 "A new #Y Tribal Vassal#! will be created from up to #Y [SCOPE.ScriptValue('generic_migration_invasion_vassalizable_territories_svalue')|0]#! territories that we own or occupy in #Y [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName]#!, at a small cost in Political Influence and Aggressive Expansion."
 generic_migration_invasion_claim_elites_tt:0 "One #Y Noble#! or #Y Citizen#! pop from each owned, subject-held, or occupied territory in #Y [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName]#! will be moved to our capital and enslaved, where possible."
 generic_migration_invasion_claim_purge_tt:0 "Every pop in our owned, subject-held, or occupied territories in #Y [SCOPE.sP('migration_invasion_target').GetArea.GetRegion.GetName]#! whose culture is neither our primary culture nor one of our integrated cultures will be killed. This will cost Stability and bring heavy Tyranny and Aggressive Expansion."
 generic_migration_invasion_claim_warning_tt:0 "We make no further settlement, but the tale of the invasion will strengthen our hand among the clans."
