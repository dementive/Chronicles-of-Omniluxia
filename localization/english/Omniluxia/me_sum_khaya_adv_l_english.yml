l_english:
 # ═══════════════════════════════════════════════════════════════════════
 # SUM KHAYA ADVENTURE EVENT CHAIN — me_sum_khaya_adv
 # ═══════════════════════════════════════════════════════════════════════

 # ─────────────────────────────────────────────
 # EVENT 1: THE CITY OF THIEVES (initial choice)
 # ─────────────────────────────────────────────

 sum_khaya_adv.1.t: "The City of Thieves"
 sum_khaya_adv.1.desc: "The harbor of [GetProvince('(int32)653').GetName|Y] smells of mud, cheap wine, and blood — the accumulated residue of three generations of people who came here because they had nowhere else to go and stayed. The slums run from the waterfront all the way to the base of the hill where the governor's offices sit. There is a large training camp outside of these administrative buildings that serves as a warning to the pirates and rogues passing through - leave official business alone, and we will leave you alone.\n\nOur advisors recommended against this visit. They were, as usual, worried about the wrong things. The slums are not dangerous because of the people in them — the people in them are simply surviving, the way people always survive when no one is paying attention. They are dangerous because of what they know, and what they know is worth knowing.\n\nThe question is how to go about getting it - there is a chance that the [ROOT.GetCountry.GetRulerTitle] of [ROOT.GetCountry.GetName|Y] might be recognized, which would complicate everything."

 sum_khaya_adv.1.a: "Enter in disguise. See what they say when they don't know who's listening."
 sum_khaya_adv.1.a.tt: "Requires #Y Finesse 7#!. The ruler slips into the slums incognito. High risk of discovery, high potential reward."

 sum_khaya_adv.1.b: "Walk in openly. I will not hide from sailors and thieves."
 sum_khaya_adv.1.b.tt: "Requires #Y Martial 6#!. The ruler enters the slums as themselves — an open challenge and an open statement of authority."

 sum_khaya_adv.1.c: "Buy an introduction to whoever actually runs this place."
 sum_khaya_adv.1.c.tt: "Costs #Y 100 Gold#!. The ruler purchases an audience with the underworld's leadership."

 sum_khaya_adv.1.d: "The slums can wait. There is more important business."

 # ─────────────────────────────────────────────
 # EVENT 2: THE UNRECOGNIZED RULER (stealth path)
 # ─────────────────────────────────────────────

 sum_khaya_adv.2.t: "The Unrecognized [ROOT.GetCountry.GetRulerTitle]"
 sum_khaya_adv.2.desc: "Three hours into the slums, wearing a dockworker's coat and smelling convincingly of fish, [ROOT.GetCountry.GetRuler.GetName|Y] found a seat in a tavern called The Broken Tally and began to listen.\n\nWhat [ROOT.GetCountry.GetRuler.GetSheHe] heard, eventually, was this: Sum Khaya operates as a clearing house for information as much as for goods. Every faction working through Eptelon — foreign agents, rival merchants, mercenary middlemen, political exiles — eventually passes through the Tally, because the Tally's proprietress has a gift for not remembering things she's been adequately compensated to forget.\n\nUnder a loose floorboard in a private room the proprietress did not notice the disguised ruler enter, [ROOT.GetCountry.GetRuler.GetSheHe] found a ledger. Compact, written in a cipher that takes about ten minutes to break once you understand the pattern. A record of every significant bribe, debt, and piece of blackmail material passing through Sum Khaya's underworld in the last two years.\n\nThe ruler holds it now, in a borrowed coat, in a dim room, while the proprietress chatters to her customers outside. The question is what to do with it."

 sum_khaya_adv.2.a: "Take the ledger. Quietly. No one needs to know we were here."
 sum_khaya_adv.2.b: "Use this knowledge as an entry point"

 # ─────────────────────────────────────────────
 # EVENT 3: THE DOCKSIDE TEST (open/force path)
 # ─────────────────────────────────────────────

 sum_khaya_adv.3.t: "The Dockside Test"
 sum_khaya_adv.3.desc: "[ROOT.GetCountry.GetRuler.GetName|Y] had been in the slums for approximately twelve minutes before someone recognized [ROOT.GetCountry.GetRuler.GetHerHim].\n\nThis was, in retrospect, inevitable. The literal ruler of [GetProvince('(int32)653').GetName|Y] walking openly through its most notorious district is either very powerful or very foolish, and in the absence of certainty, the dockside crews wanted to test the question empirically. The man who walked up was not large — he didn't need to be, because the circle that formed around him and the [ROOT.GetCountry.GetRulerTitle] was.\n\n'The last three people who walked in here without asking came out looking very different,' the man said in a quiet but hard voice. 'I am curious what kind of person you are.'\n\nHe gestured at the open space around them. The crowd watched. This was clearly a regular entertainment."

 sum_khaya_adv.3.a: "Accept. Step into the circle. Show them what kind of person their ruler is."
 sum_khaya_adv.3.b: "Decline the brawl. But make clear that the decision not to fight is not the decision of someone who cannot."

 # ─────────────────────────────────────────────
 # EVENT 4: THE KING OF THIEVES (coin/gold path)
 # ─────────────────────────────────────────────

 sum_khaya_adv.4.t: "An Audience with the King of Thieves"
 sum_khaya_adv.4.desc: "The man who actually runs [GetProvince('(int32)653').GetName|Y]'s criminal infrastructure is not what [ROOT.GetCountry.GetRuler.GetName|Y] expected. He was rather small in size, dressed simply, and clearly accustomed to being underestimated - a habit he has apparently cultivated deliberately over a long career. He received [ROOT.GetCountry.GetRuler.GetFirstName] in a room above a counting house with good wine, a clean table, and the kind of quiet that suggests everyone within earshot has been paid to find somewhere else to be.\n\n'You sent gold and a letter,' he said. 'The gold was generous. The letter was intelligent — you didn't ask for anything specific, just for a conversation. Most rulers ask for things immediately. It suggests you understand how this works better than most.' He refilled the wine. 'So. What do you actually want?'\n\nThe ruler had arrived in Sum Khaya's underworld expecting to negotiate with criminals. What sits across the table is something considerably more interesting: a man who has built a functioning parallel administration over a major port city, and who is now, apparently, willing to discuss terms."

 sum_khaya_adv.4.a: "Accept the arrangement. His network protects certain things; we look the other way on certain others. Mutual benefit."
 sum_khaya_adv.4.b: "Take the information he is offering. Decline the long-term arrangement — we are not in the business of having business partners in the underworld."

 # ─────────────────────────────────────────────
 # OPTION OUTCOME TOOLTIPS AND CONFIRMATIONS
 # ─────────────────────────────────────────────

 sum_khaya_adv.2.a.tt: "We gain #G The Rogue's Ledger#! item, finesse, political influence, and a #Y spy effectiveness#! modifier. The ledger stays ours. The proprietress never knows what happened."
 sum_khaya_adv.2.b.tt: "We gain #G finesse, political influence, and stability#!. The proprietress is now, against her better judgment, on our side."

 sum_khaya_adv.3.a.tt: "The ruler #G wins#! and earns the genuine respect of Sum Khaya's dockworkers. Province 653 gains a permanent #Y Street Respect#! modifier. The ruler gains #Y martial#! and #Y popularity#!."
 sum_khaya_adv.3.b.tt: "The crowd disperses. The ruler's reputation in the slums is cold rather than warm, but cold respect is still respect. Province 653 gains a permanent #Y Cold Authority#! modifier."

 sum_khaya_adv.4.a.tt: "Province 653 gains a permanent #G King's Compact#! modifier (commerce and tax). We gain a #Y spy network#! country modifier and political influence."
 sum_khaya_adv.4.b.tt: "We gain #G substantial political influence#!, a #Y spy effectiveness#! modifier, and charisma. No strings. No debts."

 # ─────────────────────────────────────────────
 # MODIFIER NAMES
 # ─────────────────────────────────────────────

 sum_khaya_shadows_compact_mod: "Shadows of Sum Khaya"
 desc_sum_khaya_shadows_compact_mod: "The ruler has cultivated contacts within Sum Khaya's criminal network. Information flows that would never reach official channels finds its way, eventually, to the right ears. Operatives who need to move through Eptelon's underworld find the doors slightly more open than before."

 sum_khaya_underworld_network_mod: "The King's Network"
 desc_sum_khaya_underworld_network_mod: "A formal arrangement with Sum Khaya's criminal kingpin. He provides intelligence, controlled access to certain underworld services, and a hands-off policy toward our interests. In exchange, we look the other way on a carefully specified list of activities. Both parties consider this a good deal, which suggests it probably is one."

 sum_khaya_street_respect_mod: "Respect of the Slums"
 desc_sum_khaya_street_respect_mod: "The ruler walked into the most dangerous district in Eptelon, accepted a public challenge from the local power structure, and won. Word travels fast in Sum Khaya. The kind of people who live in the slums have seen rulers come and go — they do not offer easy respect to anyone. They offered it here."

 sum_khaya_cold_authority_mod: "Cold Authority"
 desc_sum_khaya_cold_authority_mod: "The ruler declined the dockside challenge not out of weakness, but out of a clear-eyed calculation that they did not need to prove anything. The slums understood the distinction — the absence of aggression from someone who clearly could have brought it is its own kind of statement."

 sum_khaya_kings_compact_mod: "The King's Compact"
 desc_sum_khaya_kings_compact_mod: "A private arrangement between the legitimate governor of Sum Khaya and the man who actually runs it. Commerce moves more efficiently when the people controlling the docks on both sides of legality are coordinating rather than fighting. The merchants haven't been told why the harbor fees are flowing more smoothly. They don't need to know."

 # ─────────────────────────────────────────────
 # ITEM NAME
 # ─────────────────────────────────────────────

 item_sum_khaya_rogue_ledger: "The Rogue's Ledger of Sum Khaya"
 item_sum_khaya_rogue_ledger_desc: "A compact, cipher-coded ledger recovered from a loose floorboard in a Sum Khaya tavern — a record of every significant bribe, debt, and piece of blackmail material passing through the city's criminal network in the last two years. The names in it would be embarrassing to people in positions of considerable authority across three regions. The ruler who carries this does not need to use it. The knowledge that it exists — and is in the right hands — is enough."
