l_english:
 auravel_anchorage_heritage: "The Free Anchorage"
 auravel_anchorage_heritage_desc: "The first names in #G Auravel's#! harbor register belonged to #Y Alu-sarian#! families who fled #G Arteon#! rather than wear elven chains. Any half elf who reaches the anchorage is written into the register as free, and the merchant houses still buy their grain from the mainland at an honest price. Auravel never lacks ships or hands to sail them, but it must hire mainland swords to defend its shores, and it pays dearly for them."
 searvari_watch_heritage: "The Watchfires"
 searvari_watch_heritage_desc: "Every headland on #G Searvari#! keeps dry wood for its watchfire and smoked fish for the crews that answer it. A captain who has sailed out under the fires knows that every harbor in the isles will shelter him. The watchmen and the crews are paid their share before any tax collector sees a coin."
 eshqara_harbor_law_heritage: "The Chain Market"
 eshqara_harbor_law_heritage_desc: "The merchant princes of #G Eshqara#! were serfs until they sold their elven masters in their own market, and they have never seen a reason to close it. Captives, stolen cargo and honest goods all pass through the same tithe houses and leave on the same ships. Its captives are brought from every coast of the western sea and keep their own tongues and gods, for the market has no interest in their souls."
 lhaegardi_sky_tables_heritage: "The Longship Oath"
 lhaegardi_sky_tables_heritage_desc: "Every free man of #G Lhaegard#! swears his oath to a jarl on the deck of a longship, and a jarl can fill his benches with oarsmen within a week of calling for them. The crews fight hard for a lord who keeps them in silver, and a jarl who stops paying them soon finds that his crew has sworn itself to somebody else."
 veylandi_outer_reef_heritage: "The Outer Reef Watch"
 veylandi_outer_reef_heritage_desc: "The #Y Ioni-sir#! of #G Sir-Veylan#! keep their shallow-draft vessels in coves marked only on their own charts. Visiting merchants must wait at the outer reef for an escort. Captains who tire of waiting take their cargo elsewhere."
 vaereli_first_groves_heritage: "The Stolen Groves"
 vaereli_first_groves_heritage_desc: "The #Y Waldonian#! settlers of #G Vaerel#! carried soil and seedlings across the water in the name of #Y Mother Cafea#!, and the #Y Sreirrie#! castellans who took the islands from them have let none of it go to waste. Waldonian thralls tend the groves and fields that feed the citadel, but the galley yards take the best timber first, and every hall or wall must wait until the fleet has what it needs."
 qaruzhtan_crown_beacon_heritage: "The Crown Beacon"
 qaruzhtan_crown_beacon_heritage_desc: "The shipmasters of #G Qaruzhta#! once carried supplies for #Y Jarenam the Formidable Dragon#!. Today their beacon above #G Kharazgapt#! guides merchantmen to a harbor that always has hands for a new crew. The old levy rolls are kept in the council house, though few of the names on them would still answer a call to march."
 bazhari_nurago_watch_heritage: "The Exiles' Share"
 bazhari_nurago_watch_heritage_desc: "The #Y Orc#! exiles who settled #G Bazhar#! swore that no Great Family of #G Rendun#! would ever take a share of their plunder again, and they have kept that oath. Each crew divides its pay and plunder on the beach before its boats are hauled up, and the crews follow a chief who honors the custom anywhere. Very little of it ever finds its way into the chief's treasury."
 veyravel_raft_yards_heritage: "The Cedar Rafts"
 veyravel_raft_yards_heritage_desc: "The sawyers of #G Vaelisar#! lash cedar trunks into rafts and tow them to the iron quays of #G Veyravel#!. The guild keeps seasoned timber for keels and sells the rest by the raft. Every dock on the passage owes the guild a crew, even the ferries whose owners would rather send a soldier."
 ilytheon_beacon_tithes_heritage: "The Beacon Tithe"
 ilytheon_beacon_tithes_heritage_desc: "Ships that make it through the fog pay their dues at #G Ilytheon#!. Part of every payment buys lamp oil for the shrine on #G Ostraeth#!, where the keepers also maintain a store of grain for vessels forced to winter. The league pays dearly for the light, but foreign captains know which harbor to seek."
 gorsztog_assay_heritage: "The Assay Stones"
 gorsztog_assay_heritage_desc: "Ore from #G Urzhaketh#! is weighed on stones stamped by both dragons of the ruling pair. Shipmasters pay good silver for an ingot with the twin marks. Only sworn households may work the scales or take shelter inside the roost walls, and merchants born abroad can spend a lifetime waiting for a household to sponsor them."
 mairavun_salt_shares_heritage: "The Salt Shares"
 mairavun_salt_shares_heritage_desc: "The #Y Puyonga#! clans of #G Oquraya#! divide the salt pans anew after every flood. Fishers at #G Mairavun#! draw their shares before the merchants do and pack away enough catch to feed the crews through the lean months. Assemblies often pay a claim in salt, leaving little coin for the treasury."
 targuzh_iron_oath_heritage: "The Iron Oath"
 targuzh_iron_oath_heritage_desc: "When a ship clears #G Targuzh#!, its captain leaves a nail on the altar and swears to return for any crew sighted in distress. A captain who keeps that oath will find the roost behind them when they come ashore under arms. The court keeps spare ships rigged through the storm season and pays for every sail the wind takes."
