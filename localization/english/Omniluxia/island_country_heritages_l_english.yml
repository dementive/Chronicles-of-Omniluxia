l_english:
 auravel_anchorage_heritage: "The Anchorage Register"
 auravel_anchorage_heritage_desc: "The first names in #Y Auravel's#! harbor register belonged to #Y Alusian#! and #Y Sarian#! families driven from #G Arteon#!. A registered anchorage offers them passage and a fair price for imported grain. The league can always find carpenters and pilots for its ships, but it pays mainland rates to keep troops ashore."
 searvari_watch_heritage: "The Beacon Compact"
 searvari_watch_heritage_desc: "Every #Y Searvari#! watch post keeps dry wood for the beacon and smoked fish for the crews that answer it. Captains who served on the watch know they can count on the next harbor. The shares promised to the crews are paid before a collector sees a coin."
 eshqara_harbor_law_heritage: "The Harbor Court"
 eshqara_harbor_law_heritage_desc: "The warehouse houses of #G Eshqara#! measure a cargo by the same weights from the outer roadstead to the harbor court. Merchants come to sell and settle claims on goods lost at sea. The court lets foreign quarters keep their own customs, and most of them do."
 lhaegardi_sky_tables_heritage: "The Sound Pilots"
 lhaegardi_sky_tables_heritage_desc: "The #Y Stellaric#! pilots of #G Lhaegard#! reckon their courses by sky tables said to descend from the visitors of #G Northstar Bay#!. Every watch keeps crews ready to sail after dark. Recruiting them is easy, but keeping enough trained hands on the payroll is expensive."
 veylandi_outer_reef_heritage: "The Outer Reef Watch"
 veylandi_outer_reef_heritage_desc: "The #Y Ioni-sir#! of #G Sir-Veylan#! keep their shallow-draft vessels in coves marked only on their own charts. Visiting merchants must wait at the outer reef for an escort. Captains who tire of waiting take their cargo elsewhere."
 vaereli_first_groves_heritage: "The First Groves"
 vaereli_first_groves_heritage_desc: "The first #Y Waldonian#! households of #G Vaerel#! brought soil and seedlings across the channel in the name of #Y Mother Cafea#!. Their groves still feed new settlements. A builder who wants to clear a hillside must first pay for land and plantings to replace what the village loses."
 qaruzhtan_crown_beacon_heritage: "The Crown Beacon"
 qaruzhtan_crown_beacon_heritage_desc: "The shipmasters of #G Qaruzhta#! once carried supplies for #Y Jarenam the Formidable Dragon#!. Today their beacon above #G Kharazgapt#! guides merchantmen to a harbor that always has hands for a new crew. The old levy rolls are kept in the council house, though few of the names on them would still answer a call to march."
 bazhari_nurago_watch_heritage: "The Skerry Watch"
 bazhari_nurago_watch_heritage_desc: "The #Y Orc#! families of #G Bazhar#! brought the watch customs of #G Rendun#! to three small skerries. Each household owes a turn at the harbor, and crews keep a share of the berth dues. The harbors rarely want for defenders, but little of that money reaches the treasury."
