l_english:
 go_on_adventure:0 "Join An Expedition"
 adventure_cooldown_ready_tt:0 "The ruler is not already adventuring and has not returned from an adventure in the last 3 years."
 adventure_at_guild_tt:0 "The ruler is standing in a province that has its own #Y Adventurer's Guild#! building. Being elsewhere in the same realm, or in a neighboring province of the same city, does not count: move the ruler to the guild's province first."
 adventure_requires_party_tt:0 "At least three loyal (40+), unoccupied adult characters are available who are not generals, admirals, or governors."
 adventure_score:0 "Expedition Readiness"

 adventure.1.t:0 "Pick Your Party"
 adventure.1.desc:0 "#Y [ROOT.GetCharacter.Custom('omni_adv_contract_name')]#! at #Y [SCOPE.sP('adventure_target').GetName]#!. The board wants a #G [ROOT.GetCharacter.Custom('omni_adv_contract_wants')]#!.\n\n#Y Company:#! [ROOT.GetCharacter.GetName], with three seats open.\n\nEvery empty seat in the party makes the road harder and the share larger."
 adventure.1.a:0 "[SCOPE.sChar('adventurer_candidate_1').GetName][SCOPE.sChar('adventurer_candidate_1').Custom('omni_adv_role_tags')][SCOPE.sChar('adventurer_candidate_1').Custom('omni_adv_fit_tag')][SCOPE.sChar('adventurer_candidate_1').Custom('omni_adv_wound_tag')]"
 adventure.1.b:0 "[SCOPE.sChar('adventurer_candidate_2').GetName][SCOPE.sChar('adventurer_candidate_2').Custom('omni_adv_role_tags')][SCOPE.sChar('adventurer_candidate_2').Custom('omni_adv_fit_tag')][SCOPE.sChar('adventurer_candidate_2').Custom('omni_adv_wound_tag')]"
 adventure.1.c:0 "[SCOPE.sChar('adventurer_candidate_3').GetName][SCOPE.sChar('adventurer_candidate_3').Custom('omni_adv_role_tags')][SCOPE.sChar('adventurer_candidate_3').Custom('omni_adv_fit_tag')][SCOPE.sChar('adventurer_candidate_3').Custom('omni_adv_wound_tag')]"
 adventure.1.d:0 "[SCOPE.sChar('adventurer_candidate_4').GetName][SCOPE.sChar('adventurer_candidate_4').Custom('omni_adv_role_tags')][SCOPE.sChar('adventurer_candidate_4').Custom('omni_adv_fit_tag')][SCOPE.sChar('adventurer_candidate_4').Custom('omni_adv_wound_tag')]"
 adventure.1.e:0 "[SCOPE.sChar('adventurer_candidate_5').GetName][SCOPE.sChar('adventurer_candidate_5').Custom('omni_adv_role_tags')][SCOPE.sChar('adventurer_candidate_5').Custom('omni_adv_fit_tag')][SCOPE.sChar('adventurer_candidate_5').Custom('omni_adv_wound_tag')]"
 adventure.1.f:0 "[SCOPE.sChar('adventurer_candidate_6').GetName][SCOPE.sChar('adventurer_candidate_6').Custom('omni_adv_role_tags')][SCOPE.sChar('adventurer_candidate_6').Custom('omni_adv_fit_tag')][SCOPE.sChar('adventurer_candidate_6').Custom('omni_adv_wound_tag')]"
 adventure.1.g:0 "No one else is free to come. Call it off."
 adventure_no_valid_companions_tt:0 "You need three valid companions before the expedition can depart."
 adventure_needs_3_tt:0 "You need 3 more companions to complete the party."
 adventure_needs_2_tt:0 "You need 2 more companions to complete the party."
 adventure_needs_1_tt:0 "You need 1 more companion to complete the party."
 adventure_candidate_warrior_tt:0 "#G Warrior:#! improves monster hunts, escorts, and physical dangers."
 adventure_candidate_scout_tt:0 "#G Scout:#! improves ruin exploration, navigation, and trap avoidance."
 adventure_candidate_scholar_tt:0 "#G Scholar:#! improves relic, magical, and religious encounters."
 adventure_candidate_diplomat_tt:0 "#G Diplomat:#! improves rescues, intrigue, and negotiation."

 adventure.2.t:0 "The Contract Board"
 adventure.2.desc:0 "The guildmasters present their contracts with the solemn dignity of people who will not personally be chased through the dark. Each parchment names a place, a problem, and a fee written smaller than the problem.\n\nPick the job first, then the company. Every contract says plainly which sort of companion it wants; bringing one is the difference between a story and an obituary."
 adventure.2.a:0 "#Y Rescue:#! find the caravan that stopped writing home."
 adventure.2.b:0 "#Y Monster Hunt:#! search the wilds where the witnesses stopped returning."
 adventure.2.c:0 "#Y Intrigue:#! investigate the city rumors before they grow legs."
 adventure.2.d:0 "#Y Ruin:#! open the sealed place in the dangerous country."
 adventure.2.e:0 "#Y Relic:#! recover the thing everyone keeps praying near."
 adventure.2.f:0 "#Y Escort:#! guard travelers near the capital. Danger is more polite nearby."
 adventure_province_1_tt:0 "#Y Rescue contract#! at [SCOPE.sP('adventure_province_1').GetName|Y].\n#G Best with a Diplomat#! (Charisma 9+). Without one, the hard way is a fight."
 adventure_province_2_tt:0 "#Y Monster Hunt contract#! at [SCOPE.sP('adventure_province_2').GetName|Y].\n#G Best with a Warrior#! (Martial 9+ or Brave)."
 adventure_province_3_tt:0 "#Y Intrigue contract#! at [SCOPE.sP('adventure_province_3').GetName|Y].\n#G Best with a Diplomat#! (Charisma 9+)."
 adventure_province_4_tt:0 "#Y Ruin contract#! at [SCOPE.sP('adventure_province_4').GetName|Y].\n#G Best with a Scout#! (Finesse 9+, Cautious, or Suspicious)."
 adventure_province_5_tt:0 "#Y Relic contract#! at [SCOPE.sP('adventure_province_5').GetName|Y].\n#G Best with a Scholar#! (Zeal 9+, Scholar, Pious, Mage, or Cleric)."
 adventure_province_6_tt:0 "#Y Escort contract#! at [SCOPE.sP('adventure_province_6').GetName|Y].\n#G Best with a Warrior#! (Martial 9+ or Brave)."

 adventure.3.t:0 "Final Preparations"
 adventure.3.desc:0 "[ROOT.GetCharacter.GetName|Y] and the chosen companions gather in the guild yard, where porters argue over mule prices, guides swear the old roads are perfectly safe, and half the city has come to watch someone else take the risk.\n\nThere is time for one last preparation. The party cannot bring everything, but it can decide which sort of trouble it intends to disappoint."
 adventure_option_trait_pious_tt:0 "This option is available because your character is Pious."
 adventure_option_trait_brave_tt:0 "This option is available because your character is Brave."
 adventure_option_trait_cautious_tt:0 "This option is available because your character is Cautious."
 adventure_option_trait_suspicious_tt:0 "This option is available because your character is Suspicious."
 adventure_option_trait_scholar_tt:0 "This option is available because your character is a Scholar."
 adventure.3.a:0 "Buy proper supplies, including the boring things that save lives."
 adventure.3.b:0 "Hire scouts and guides who know where not to step."
 adventure.3.c:0 "Ask the priests and mages for wards, blessings, and stern warnings."
 adventure.3.d:0 "Consecrate every boot, blade, and suspiciously quiet mule."
 adventure.3.e:0 "Pack light. Courage is famously easy to carry."
 adventure.3.f:0 "Buy the second map, the third rope, and a guide who looks afraid."
 adventure_preparation_supplies_tt:0 "#G Slightly raises readiness.#! Improves #Y physical#! and #Y social#! gambles, halves the wound risk of failed gambles, and steers encounters toward hardships you packed for."
 adventure_preparation_scouts_tt:0 "Free, but no readiness bonus. Improves #Y wits#! gambles and steers encounters toward the kind scouts are good at."
 adventure_preparation_rituals_tt:0 "#G Raises readiness.#! Improves #Y lore#! gambles and steers encounters toward the supernatural."
 adventure_party_warrior_used_tt:0 "A #Y Warrior#! companion makes this approach much safer."
 adventure_party_scout_used_tt:0 "A #Y Scout#! companion finds the safest route."
 adventure_party_scholar_used_tt:0 "A #Y Scholar#! companion understands the danger."
 adventure_party_diplomat_used_tt:0 "A #Y Diplomat#! companion finds the right words."

 adventure.4000.t:0 "Tracks In The Rain"
 adventure.4000.desc:0 "Heavy weather smothers the road, turning dust to paste and heroic speeches into wet coughing. By dusk, the party finds two trails where the guild map promised only one.\n\nThe first path is slow, miserable, and marked by old waystones carved with prayers from travelers passing through. The second is fresh, direct, and watched by trees that have become much too quiet."
 adventure.4000.a:0 "Trust the old road and its anxious little stones."
 adventure.4000.b:0 "Take the direct path before good sense catches up."
 adventure.4000.c:0 "Stop, count the waystones, and notice which one is lying."
 adventure.4000.d:0 "Lead from the front. If the trees want trouble, they can ask directly."

 adventure.5.t:0 "The Adventure Begins"
 adventure.5.desc:0 "At last, [ROOT.GetCharacter.GetName|Y] and the companions reach the chosen destination. Seen from the guild board, the contract looked almost respectable. Seen up close, it has acquired several unpleasant details, including a smell that no one wants to identify and locals who go silent whenever the party enters a room.\n\nStill, the road has brought them here...wherever here is. Now the adventure must stop being a story and become a problem to be solved."
 adventure.5.a:0 "Question the locals and learn what they are afraid to say."
 adventure.5.b:0 "Strike now, before the trail grows cold and the danger grows teeth."
 adventure.5.c:0 "Kick the story's door open and make danger introduce itself."
 adventure.5.d:0 "Watch who stops whispering when the party looks away."
 adventure.5.e:0 "Compare the rumors to older, stranger disasters."

 adventure.6001.t:0 "The Locked Door"
 adventure.6001.desc:0 "The party finds a sealed passage where no honest map admits one should exist. The lock is newer than the wall, a sword has been scratched over the lintel as either a warning or an advertisement, and from the other side comes the faint sound of something dragging across the floor.\n\nIt can be picked, given patience and steady nerves. Patience also gives whatever waits inside time to arrange itself."
 adventure.6001.a:0 "Pick the lock while it is still a lock."
 adventure.6001.b:0 "Leave it sealed and sell the lock. It is a very good lock."
 adventure.6002.t:0 "The Root Bridge"
 adventure.6002.desc:0 "A ravine splits the forest path, deep enough that thrown stones take an impertinent amount of time to answer. The only crossing is a bridge of living roots twisted together by age, weather, or someone with a questionable sense of charity. The roots hum faintly, and something pale glows in the bark.\n\nThe far side promises a shorter route. The near side has the distinct advantage of not being over there."
 adventure.6002.a:0 "Cross one at a time, light-footed and prayer-heavy."
 adventure.6002.b:0 "Climb down, wade the stream, climb back up. Slowly."
 adventure.6003.t:0 "Voices By The Fire"
 adventure.6003.desc:0 "At night, the campfire burns blue without asking permission. Old voices speak through the sparks, some whispering warnings, some making accusations, and one helpfully naming a place that no one in camp admits to recognizing.\n\nThe companions sit very still. Even the horses seem unwilling to interrupt."
 adventure.6003.a:0 "Listen until dawn, no matter what answers back."
 adventure.6003.b:0 "Douse the fire and write down what the voices said."
 adventure.6004.t:0 "Shrine With No God"
 adventure.6004.desc:0 "The party discovers a spotless shrine without idols, inscriptions, or any symbol that a sensible person could blame later. Its altar is warm, its offerings are fresh, and its silence is so complete that every whispered joke sounds like blasphemy.\n\nSomeone, or something, is being honored here. The rude question is whether it is listening."
 adventure.6004.a:0 "Make a careful offering and wait for an answer."
 adventure.6004.b:0 "Take the fresh offerings. Someone left them for somebody."
 adventure.6005.t:0 "A Sudden Collapse"
 adventure.6005.desc:0 "A sharp crack runs through the roof of the passage like a sentence of death being read aloud. Dust pours down, pebbles begin to fall, and the light catches an old miner's helmet half-buried in the rubble, its owner presumably having made the same discovery earlier.\n\nThe party has moments before the roof gives way and the adventure becomes an excavation."
 adventure.6005.a:0 "Brace the stubborn stones and hold the passage open."
 adventure.6005.b:0 "Run, and let the mountain keep the shortcut."
 adventure.6006.t:0 "Hungry Blades"
 adventure.6006.desc:0 "Armed wanderers block the route, wearing the expressions of men who have rehearsed their threats and neglected their baths. They claim hunger, lost pay, and a willingness to settle both problems with steel.\n\nTheir leader speaks politely enough, but his knife does not."
 adventure.6006.a:0 "Talk them down and hire their information."
 adventure.6006.b:0 "Let their leader show you the long way around the trouble."
 adventure.6007.t:0 "The Riddle Stone"
 adventure.6007.desc:0 "A black stone blocks the next chamber, its surface opening into a mouth only when the party comes near. It asks questions in three dead languages, two of which sound offended to be spoken aloud.\n\nEach wrong answer makes the floor sink another finger's width. Each correct answer makes the stone look, somehow, more smug."
 adventure.6007.a:0 "Solve it properly and deny the stone its fun."
 adventure.6007.b:0 "Pry out the smaller gems while scholarship looks away."
 adventure.6008.t:0 "The Mirror Pool"
 adventure.6008.desc:0 "A still pool waits in the dark, reflecting not faces but possible futures. In one vision, wounds close and old pains loosen their grip. In another, secrets glitter like coins at the bottom of a well.\n\nThe water is perfectly calm, which is never a good sign."
 adventure.6008.a:0 "Seek the healing vision and leave the rest untouched."
 adventure.6008.b:0 "Steal a useful secret from tomorrow."
 adventure.6009.t:0 "The Wounded Guardian"
 adventure.6009.desc:0 "Something ancient and half-buried blocks the way, too vast to be called a beast and too wounded to be called a threat without feeling cruel. Its cracked hide is packed with old arrows, and one dim eye follows the party with the patience of a broken statue.\n\nThe chamber beyond it is rich. The creature before it is suffering. These facts, tragically, are both true."
 adventure.6009.a:0 "Bind its wounds and hope mercy has a memory."
 adventure.6009.b:0 "Loot the chamber while the guardian watches, sadly."
 adventure.6010.t:0 "The Old Battlefield"
 adventure.6010.desc:0 "Rusty arms, sunken standards, and bones arranged in the impolite geometry of battle litter the ground. Whatever happened here was desperate, organized, and, judging by the silence, very final.\n\nThe party can study the formation and learn from the dead, or strip the field and let the dead keep their secrets."
 adventure.6010.a:0 "Study the old formation and honor its hard lesson."
 adventure.6010.b:0 "Strip the field before rust claims the rest."
 adventure.6011.t:0 "The Poisoned Feast"
 adventure.6011.desc:0 "A welcoming table waits in a sealed room, set with steaming dishes, fresh bread, and cups already poured. No servants wait nearby. No chimney carries smoke. The silverware is real, and one plate has a silver ring under it, which is either a test or a tip.\n\nSomeone meant this hospitality to be found, and that someone had a very theatrical opinion of hunger."
 adventure.6011.a:0 "Test every dish with the silver ring and a steady hand."
 adventure.6011.b:0 "Pocket the silverware and let fate complain."
 adventure.6012.t:0 "The Whispering Idol"
 adventure.6012.desc:0 "An idol no taller than a child sits alone on a stone shelf, whispering the party's names in reverse order. Its little mouth does not move. Its little eyes absolutely do.\n\nIt promises victory if carried onward, ruin if ignored, and several other things in a voice that sounds disturbingly familiar."
 adventure.6012.a:0 "Answer with a prayer from the book left on the shelf."
 adventure.6012.b:0 "Pocket the idol. It did ask to come along."
 adventure.6013.t:0 "The Flooded Passage"
 adventure.6013.desc:0 "Cold water rises through the stones, swallowing the path one patient inch at a time. Loose gear drifts into the dark. Something bumps against a boot and is unanimously agreed to be debris.\n\nThe party must choose between time and safety, as if those two have ever been friends."
 adventure.6013.a:0 "Build a rope line and cross with dignity intact."
 adventure.6013.b:0 "Wait for the water to drop and fish out what drifts by."
 adventure.6014.t:0 "A Rival Party"
 adventure.6014.desc:0 "Another band reaches the prize chamber at the same time, tired, suspicious, and very clearly rehearsing lies about having arrived first. Their leader smiles with all the warmth of a tax collector at a funeral.\n\nThere is enough treasure to start an argument and not quite enough to end one."
 adventure.6014.a:0 "Offer a public bargain while everyone can hear it."
 adventure.6014.b:0 "Sell them the map to the next room. It is mostly accurate."
 adventure.6015.t:0 "The Merchant's Map"
 adventure.6015.desc:0 "A nervous trader produces a map marked with fresh ink, old blood, and several corrections that do not inspire confidence. He claims it shows a shortcut. He also refuses to explain why he is selling it from behind a locked door.\n\nIt may be a shortcut, a trap, or the traditional bargain of being both."
 adventure.6015.a:0 "Pay for the whole story, census rolls included."
 adventure.6015.b:0 "Buy only the map and trust the ink."
 adventure.6016.t:0 "The Sleeping Guardian"
 adventure.6016.desc:0 "The next door is watched by a sleeping sentinel large enough to make the doorway seem apologetic. Each breath shakes dust from the lintel, and every snore rolls through the chamber like distant thunder.\n\nOne wrong sound could turn passage into battle. One bold sound could do the same thing faster."
 adventure.6016.a:0 "Move in silence past the bow hanging by the door."
 adventure.6016.b:0 "Leave it a sausage and go around."
 adventure.6017.t:0 "Singing Crystals"
 adventure.6017.desc:0 "Crystals hum from the walls, each note tugging at memory, bone, and several old embarrassments the party would rather leave buried. The song points deeper into the ruin, clear as a road under starlight.\n\nUnfortunately, the richest shards sing loudest, and greed has always had excellent hearing."
 adventure.6017.a:0 "Follow the true note and ignore the glittering bait."
 adventure.6017.b:0 "Harvest the loudest shards while teeth still feel solid."
 adventure.6018.t:0 "The False Floor"
 adventure.6018.desc:0 "A flawless mosaic spreads across the floor, all heroic kings, grateful priests, and tiny decorative skulls no one likes. At the far end a statue wears a very grand helmet. Beneath the tiles waits old machinery, judging by the faint ticking, and the ceiling is lined with suspiciously loose tiles of its own.\n\nThe pattern can be read, if the party is patient and no one steps on the wrong heroic king."
 adventure.6018.a:0 "Trace the safe path one careful tile at a time."
 adventure.6018.b:0 "Spring the trap from a distance and keep the parts."
 adventure.6019.t:0 "The Deserter Guide"
 adventure.6019.desc:0 "A frightened guide stumbles from a side passage with empty hands raised and a story already falling apart. They offer to lead the party onward, claiming to know the route, the traps, and the name of the thing that took their former companions.\n\nThey know too much about the way ahead, and not nearly enough about why they survived it."
 adventure.6019.a:0 "Question them gently and listen for the lie that hurts."
 adventure.6019.b:0 "Sell them safe passage home. Fear has value."
 adventure.6020.t:0 "The Plague Lantern"
 adventure.6020.desc:0 "A green lantern burns in a room full of sealed beds, each marked with a name, a date, and a warning carved by someone with shaking hands. The air beyond the lamp's glow is thick, sweet, and deeply unwelcome.\n\nThe lantern keeps the sickness back, but only while fed with costly oil. Even mercy, it seems, keeps accounts."
 adventure.6020.a:0 "Push through the fumes before the oil runs out."
 adventure.6020.b:0 "Feed the lantern the good oil and walk slowly past the beds."
 adventure.6021.t:0 "The Forgotten Oath"
 adventure.6021.desc:0 "Words cut into the wall accuse the party of trespass, theft, ignorance, bad manners, and several crimes too old to translate. The inner chamber will not open until a promise is spoken aloud.\n\nThe oldest places in the world are very particular about etiquette."
 adventure.6021.a:0 "Swear only what can be kept, however inconvenient."
 adventure.6021.b:0 "Recite the last visitor's oath, word for word."
 adventure.6022.t:0 "The Watchful Village"
 adventure.6022.desc:0 "A village near the site locks every door as the party approaches. Shutters snap closed, children are pulled indoors, and even the dogs seem to have signed a pact of silence.\n\nFrom behind one narrow window, someone whispers the answer to the next danger. Then the shutter closes again, as if kindness were a punishable offense."
 adventure.6022.a:0 "Win their trust and make fear speak plainly."
 adventure.6022.b:0 "Pay for the answer and leave before they think of a price."
 adventure.6023.t:0 "Tomb Of Coins"
 adventure.6023.desc:0 "A burial chamber is carpeted with coins, each stamped with a different face and arranged around a sarcophagus that has the look of a man who died rich and suspicious. The floor shines beautifully. It also whispers whenever someone bends down.\n\nRemoving the coins carelessly may wake old debts, and old debts tend to charge interest."
 adventure.6023.a:0 "Count and claim the lawful tithe, with witnesses."
 adventure.6023.b:0 "Fill every pack and let the dead audit later."
 adventure.6024.t:0 "Storm-Tossed Cliffs"
 adventure.6024.desc:0 "The route climbs into a storm that seems to have taken the party's existence personally. Rain turns stone slick, wind snatches words from mouths, and every handhold feels like an argument with the sky.\n\nSomewhere above, the path continues. Somewhere below, the ground waits with theatrical patience."
 adventure.6024.a:0 "Climb by discipline, knot by knot and curse by curse."
 adventure.6024.b:0 "Shelter under the overhang and let the storm win this round."
 adventure.6025.t:0 "The Silver Bargain"
 adventure.6025.desc:0 "A silver-tongued stranger waits at a crossroads that was not there yesterday. Their cloak is dry despite the weather, their smile is practiced, and their shadow is doing something independent with its hands.\n\nThey offer a shortcut in exchange for a secret, a name, and the first story told when the party returns. This is almost certainly unwise, which is not the same as useless."
 adventure.6025.a:0 "Haggle. The stranger clearly expects it."
 adventure.6025.b:0 "Trade a harmless secret for the shortcut, if such a thing exists."
 adventure.6026.t:0 "The Bound Spirit"
 adventure.6026.desc:0 "A pale figure is chained to a cracked pillar, repeating the same apology in a voice worn thin by centuries. Around it are scratched warnings, prayer marks, and one surprisingly recent complaint about the smell.\n\nFreeing the spirit may reveal the way. It may also erase the warning it was forced to guard. Ancient punishments rarely come with tidy explanations."
 adventure.6026.a:0 "Release it with proper rites and cautious sympathy."
 adventure.6026.b:0 "Demand payment first. Eternity should have savings."
 adventure.6027.t:0 "The Luminous Garden"
 adventure.6027.desc:0 "Soft light grows from damp stone in a hidden garden, where pale flowers open without sun and fungi pulse like sleeping hearts. The air smells of rain, medicine, and very old mistakes.\n\nSome growths soothe fever. Others leave bright stains on the tongue and thoughts that do not belong to the thinker."
 adventure.6027.a:0 "Taste the rarest sample in the name of discovery."
 adventure.6027.b:0 "Gather only the safe growth and sell it to the guild apothecary."
 adventure.6028.t:0 "The Black Market Relic"
 adventure.6028.desc:0 "A smuggler waits in an impossible side room, surrounded by crates that could not have fit through the door and invoices written in three currencies. On the table rests a relic already wrapped for sale.\n\nThe price is high because the risk is real. The cheaper offer is available because the risk is someone else's problem until it is not."
 adventure.6028.a:0 "Haggle for the expensive relic and all of its receipts."
 adventure.6028.b:0 "Take the cheaper offer and try not to ask why."
 adventure.6029.t:0 "Siege Of One Door"
 adventure.6029.desc:0 "The final approach narrows to a single reinforced door, iron-bound and ugly with practical menace. It has murder holes, fresh scratches, and no interest whatsoever in being opened politely.\n\nWhoever built it expected visitors. Whoever scratched it expected to leave."
 adventure.6029.a:0 "Break it like a wall and make the hinges regret service."
 adventure.6029.b:0 "Find the builders' back door. There is always one."
 adventure.6030.t:0 "The Last Camp"
 adventure.6030.desc:0 "Before the deepest chamber, the party finds an abandoned camp. The ashes are still warm, the bedrolls are still laid out, and a half-finished warning has been scratched into the floor by someone who ran out of time or fingers.\n\nNo bodies remain. That is comforting only to people with poor imaginations."
 adventure.6030.a:0 "Finish the warning before becoming part of it."
 adventure.6030.b:0 "Search the packs. The absent cannot object."

 adventure.51.t:0 "The High Pass"
 adventure.51.desc:0 "The contract leads onto a high pass where the cairns have been pulled apart and the wind carries a sound like distant horns. The mountain is not hostile, exactly. It simply has no interest in making survival convenient.\n\nA goatherd offers, for a modest fee and a long story, to show the party a path that avoids most of the mountain. Goatherds and mountains have an understanding."
 adventure.51.a:0 "Take the exposed ridge before the weather turns."
 adventure.51.b:0 "Follow the goatherd and skip a stretch of mountain."
 adventure.52.t:0 "The Silent Sanctuary"
 adventure.52.desc:0 "Every lamp at the holy site burns with a clean white flame, and the priests have barred the inner hall. Something beneath the altar has begun answering prayers in the voices of the dead, which the priests describe as a theological development and the party describes as a reason to leave.\n\nThe priests would accept help, provided nobody does anything irregular."
 adventure.52.a:0 "Ask the thing under the altar a direct question."
 adventure.52.b:0 "Observe the rites for a week and learn what they are for."
 adventure.53.t:0 "Arcane Fault"
 adventure.53.desc:0 "#Y Magic#! leaks through the site in blue threads, making iron hum and shadows point the wrong way. The guild report called it a disturbance. The party calls it a problem with teeth.\n\nThe humming iron, it turns out, sells very well to the kind of buyer who does not ask where it came from."
 adventure.53.a:0 "Map the anomaly by walking straight through it."
 adventure.53.b:0 "Collect humming iron for the guild's quieter buyers."
 adventure.54.t:0 "The City Contract"
 adventure.54.desc:0 "The city has locked its gates to strangers while rumors move freely through every tavern. A missing person, a stolen ledger, and a locked district all point toward the same patron, who is having a lovely week.\n\nThe alleys will talk for coin. They will also talk about whoever paid them."
 adventure.54.a:0 "Make the inquiry public and force the city to answer."
 adventure.54.b:0 "Work the alleys, and sell what you hear to the highest bidder."
 adventure.55.t:0 "The Salt Road"
 adventure.55.desc:0 "On the coast, wreckage has washed ashore without a storm, and the harbor master insists no ship is missing. At night, lights drift beyond the breakers where no boat should be anchored.\n\nThe fishers know the tides. The fishers also know which questions get people drowned, and they are very polite about not answering them."
 adventure.55.a:0 "Take a boat out after the false lights."
 adventure.55.b:0 "Question the fishers and follow the tide marks on foot."
 adventure.56.t:0 "The Watching Wood"
 adventure.56.desc:0 "The trees near the site lean inward, their bark carved with fresh symbols no map mentions. The forest has swallowed the old road but left a trail of deliberate signs, which is either a kindness or bait.\n\nCutting straight through would be quicker. The trees seem to have an opinion about that."
 adventure.56.a:0 "Read the signs and follow them where they lead."
 adventure.56.b:0 "Cut straight through and skip whatever the signs wanted."
 adventure.57.t:0 "Below the Surface"
 adventure.57.desc:0 "The cave mouth breathes cold air over a scatter of abandoned tools. Something deeper within has been moving stones into careful piles, as though preparing a welcome, or a filing system.\n\nAnother party's ropes are already tied off at the edge. Their owners are not in evidence."
 adventure.57.a:0 "Descend fast before the other party claims the find."
 adventure.57.b:0 "Re-rig the ropes properly and mark a way home."
 adventure.58.t:0 "A Contract Without a Map"
 adventure.58.desc:0 "The guild's directions end at an ordinary-looking road, which is precisely why nobody trusts them. The locals offer three incompatible warnings and one very confident lie.\n\nThe warnings, at least, would be worth something to the next party the Guild sends."
 adventure.58.a:0 "Trust the confident liar and keep a hand near the blade."
 adventure.58.b:0 "Write up all three warnings and sell them to the Guild."

 adventure.59.t:0 "The Missing Caravan"
 adventure.59.desc:0 "The missing travelers are alive, cornered in a ruined tollhouse while their captors argue about what they are worth. The captors have done the arithmetic twice and got two different answers, which is the only reason everyone is still breathing.\n\nA negotiator could make the numbers agree. Failing that, there is the door, and there is the ransom."
 adventure.59.a:0 "Let our diplomat do the arithmetic for them."
 adventure.59.b:0 "Storm the tollhouse before negotiations become an execution."
 adventure.60.t:0 "The Contract's Monster"
 adventure.60.desc:0 "The claw marks belong to a hulking predator nesting among the remains of the previous hunters, whose contract fee is presumably still available. It circles the company from cover, testing for weakness and finding several.\n\nThe local farmers will sell a cow for bait at what they describe as monster-adjacent prices."
 adventure.60.a:0 "Let our warrior choose the ground and lead the attack."
 adventure.60.b:0 "Close ranks and meet it head-on."
 adventure.61.t:0 "The Stolen Ledger"
 adventure.61.desc:0 "The rumors lead to a stolen ledger naming officials, smugglers, and one guild patron who swore no such book existed. Holding it is dangerous. Knowing whom to approach with it is valuable. Reading it aloud in public is a career.\n\nA forger in the next street offers to make a second copy, so that everyone can be blackmailed fairly."
 adventure.61.a:0 "Let our diplomat sell the truth to the least dishonest buyer."
 adventure.61.b:0 "Read it aloud in the square and accept the enemies it makes."
 adventure.62.t:0 "The Sealed Ruin"
 adventure.62.desc:0 "The ruin is guarded by false steps, concealed vents, and an inscription warning intruders in an extinct dialect. The builders expected determined thieves and planned accordingly, which is flattering in its way.\n\nLocal diggers will open a side passage for a fee, on the theory that traps are installed at front doors."
 adventure.62.a:0 "Let our scout dismantle the route one trap at a time."
 adventure.62.b:0 "Press through the front before the ruin claims the daylight."
 adventure.63.t:0 "The Disputed Relic"
 adventure.63.desc:0 "The relic rests in a warded reliquary surrounded by contradictory prayers. Taking it the wrong way could profane the site or wake whatever the prayers are restraining, and the prayers do not agree on which.\n\nThe resident priests will bless the opening for a donation, and are quick to explain that this is not the same thing as a fee."
 adventure.63.a:0 "Let our scholar reconcile the rites before opening it."
 adventure.63.b:0 "Break the seal and trust conviction over scholarship."
 adventure.64.t:0 "Ambush on the Escort Road"
 adventure.64.desc:0 "The escort route narrows between steep banks where fresh bootprints vanish behind prepared screens. The ambushers have chosen their ground well and are, by the sound of it, arguing about who gets the mules.\n\nA carter swears his cousin is among them, and that his cousin can be paid to recommend another road."
 adventure.64.a:0 "Let our warrior form a shield around the travelers."
 adventure.64.b:0 "Run the gauntlet and hope everyone reaches the far side."

 adventure.71.t:0 "A Legendary Return"
 adventure.71.desc:0 "The company returns with proof enough to silence skeptics: trophies, witnesses, and a story that grows larger every time it is told. The Guild records the expedition as a triumph and quietly raises its fees.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.71.a:0 "Dedicate the legendary spoils to the realm."
 adventure.71.b:0 "Honor the companions who made the legend possible."
 adventure.72.t:0 "A Successful Return"
 adventure.72.desc:0 "The party comes home scarred, tired, and unmistakably successful. The contract is settled, the Guild is satisfied, and the company has earned a story worth retelling, with only minor improvements."
 adventure.72.a:0 "Present the spoils to the realm."
 adventure.72.b:0 "Keep the lessons of the road."
 adventure.73.t:0 "A Hard-Won Return"
 adventure.73.desc:0 "The party returns with the contract technically complete and several arguments about what that word means. The road took its share, but the company is home, and the Guild has agreed not to mention the mules."
 adventure.73.a:0 "Take the modest reward and be grateful."
 adventure.73.b:0 "Turn the hard road into hard-earned experience."
 adventure.74.t:0 "A Failed Expedition"
 adventure.74.desc:0 "The company limps back before the contract is solved. Some supplies are gone, the tale is unpleasant, and at least one wound will be remembered every time the weather turns. The Guild files the contract under Unresolved, which is where it keeps its worst ones."
 adventure.74.a:0 "Pay the losses and close the contract."
 adventure.74.b:0 "Remember the failure and prepare for another day."

 adventure.90.t:0 "Adventure Test Controls"
 adventure.90.desc:0 "Developer-only smoke-test controls for an arrived expedition. Force a known theme, encounter count, and item state, check that an exhausted pool ends cleanly, or jump straight to a legendary ending."
 adventure.90.a:0 "Force mountain: two encounters, no item."
 adventure.90.b:0 "Force holy site: three encounters, item enabled."
 adventure.90.c:0 "Force caverns: four encounters, item enabled."

