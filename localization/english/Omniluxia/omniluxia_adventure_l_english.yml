 adventure_not_now_tt:0 "Cancel. Nobody leaves, nothing is spent, and #G no cooldown#! is set."
 adventure_away_status_tt:0 "While the expedition is out the ruler is #Y On the Road#! (+popularity, +prominence) and cannot use court actions. The party returns with a 3-year cooldown."
 adventure.2.g:0 "Not now. Contracts keep; adventurers spoil."
 adventure.1.desc_diplomat:0 "Maps have been nailed over maps in the hall of the #Y Adventurer's Guild#!, and every sellsword within earshot is explaining why everyone else is doomed.\n\nThe contract involves people, which means lying, which means [ROOT.GetCharacter.GetName|Y] wants a #Y Diplomat#! along. Candidates who fit are marked. The other two seats are for whoever carries the luggage."
 adventure.1.desc_warrior:0 "Maps have been nailed over maps in the hall of the #Y Adventurer's Guild#!, and every sellsword within earshot is explaining why everyone else is doomed.\n\nThe contract involves something with teeth, or people who wish they had them, so [ROOT.GetCharacter.GetName|Y] wants a #Y Warrior#! along. Candidates who fit are marked."
 adventure.1.desc_scout:0 "Maps have been nailed over maps in the hall of the #Y Adventurer's Guild#!, and every sellsword within earshot is explaining why everyone else is doomed.\n\nThe contract is a ruin full of floors that are not floors, so [ROOT.GetCharacter.GetName|Y] wants a #Y Scout#! along. Candidates who fit are marked."
 adventure.1.desc_scholar:0 "Maps have been nailed over maps in the hall of the #Y Adventurer's Guild#!, and every sellsword within earshot is explaining why everyone else is doomed.\n\nThe contract concerns a relic and the prayers around it, so [ROOT.GetCharacter.GetName|Y] wants a #Y Scholar#! along, ideally one who reads the warnings before touching things. Candidates who fit are marked."
 adventure.1.h:0 "Not now. The Guild will keep the contract warm."
