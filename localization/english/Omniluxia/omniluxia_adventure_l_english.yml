 adventure_press_wits_tt:0 "#Y Gamble (wits):#! better odds with #Y Scouts#! and a #Y Scout#!."
 adventure_press_lore_tt:0 "#Y Gamble (lore):#! better odds with #Y Rituals#! and a #Y Scholar#!."
 adventure_press_social_tt:0 "#Y Gamble (social):#! better odds with #Y Supplies#! and a #Y Diplomat#!."
