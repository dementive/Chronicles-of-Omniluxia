 adventure_press_loss_tt:0 "#R It does not.#! Expedition Readiness drops, and a companion may be wounded. #R A companion who is already wounded may die.#!"
 adventure_hedge_tt:0 "#Y Play it safe:#! Expedition Readiness slips, but nobody gets hurt."
 adventure_hedge_loot_tt:0 "Better odds that this expedition turns up equipment, and of it being rare."
 adventure_hedge_shortcut_tt:0 "Shorter expedition: skip one later encounter."
 adventure_hedge_hurry_tt:0 "The party reaches its destination sooner."
 adventure_hedge_safe_tt:0 "The ruler's wounds are tended; if there are none, the companions get a breather."
 adventure_arrival_fast_tt:0 "The contract scene comes in days rather than weeks. No readiness bonus."
 adventure_contract_specialist_bonus_tt:0 "#G The specialist this contract asked for is in the party.#!"
 adventure_contract_paid_tt:0 "#Y Pay 30 gold#! for a safe, modest result."
 adventure_legendary_attribute_tt:0 "Gain #G +1#! in the attribute this contract was about: Martial for hunts and escorts, Finesse for ruins, Zeal for relics, Charisma for rescues and intrigue. If a point was already earned on this expedition, take gold and renown instead."
 adventure_legendary_attribute_taken_tt:0 "A point was already earned on the road, so the story pays out in #Y 100 gold#! and renown instead."
 omni_adventure_on_the_road:0 "On the Road"
 omni_adventure_on_the_road_desc:0 "Away with an Adventurer's Guild expedition. Tales travel home faster than the ruler does."
 omni_adventure_road_wary:0 "Road-Wary"
 omni_adventure_road_wary_desc:0 "Learned on a wet road that the slow way is usually the way. Wears off in a year."
 omni_adventure_road_bold:0 "Road-Bold"
 omni_adventure_road_bold_desc:0 "Took the direct path and survived it, which proves very little but feels like a lot. Wears off in a year."
 adventure.4001.t:0 "The Ferryman's Rates"
 adventure.4001.desc:0 "The river is high, brown, and moving with purpose. The ferryman watches the party arrive and raises his price twice before anyone speaks, once for the weather and once for the look on [ROOT.GetCharacter.GetName|Y]'s face.\n\nThere is a ford upstream. The ferryman says it is perfectly safe, in the tone of a man who has buried people who believed him."
 adventure.4001.a:0 "Ford it upstream. Rivers respect confidence."
 adventure.4001.b:0 "Pay the urgent rate and arrive early."
 adventure.4001.c:0 "Camp on the bank until the water and the price both come down."
 adventure.4002.t:0 "A Suspiciously Cheap Inn"
 adventure.4002.desc:0 "The inn is warm, the stew is hot, and the rooms cost less than the stew. The innkeeper is delighted to have guests and asks only where they are going, how long they will be gone, and whether anyone at home is expecting them back.\n\nThe cellar door is locked. It is also, faintly, breathing."
 adventure.4002.a:0 "Take the rooms and keep one eye open all night."
 adventure.4002.b:0 "Sleep in the stable. The mules are honest."
 adventure.4003.t:0 "Pilgrims Going The Other Way"
 adventure.4003.desc:0 "A long line of pilgrims passes the party heading in the opposite direction, which is never a good sign for a road. They are cheerful, well fed, and very keen to explain that they finished their devotions early and certainly did not run.\n\nOne old woman presses a blessing on the company, then a second one, then asks if anyone has spare boots."
 adventure.4003.a:0 "Ask, politely and at length, what they are walking away from."
 adventure.4003.b:0 "Trade boots for blessings and pray along for a mile."
 adventure.4004.t:0 "The Lame Mule"
 adventure.4004.desc:0 "The best mule in the train, the one carrying the important things, has gone lame. It looks at [ROOT.GetCharacter.GetName|Y] with the patient contempt of an animal that has always known this would happen.\n\nThe load can be shared out among the companions, who are already finding reasons to walk at the back. Or the mule's cargo can be sold at the next farm for whatever farmers pay for adventure."
 adventure.4004.a:0 "Share out the load and keep the pace."
 adventure.4004.b:0 "Sell the cargo, keep the mule, and travel lighter."
 adventure.6031.t:0 "The Hermit's Toll"
 adventure.6031.desc:0 "Halfway up the pass a hermit sits on a rock beside a hand-painted sign announcing a toll. He does not own the mountain. He has, however, been sitting on it long enough to feel that ownership is a matter of attendance.\n\nHe accepts coin, cheese, or a convincing argument, and he wears a ring that suggests someone once won one."
 adventure.6031.a:0 "Debate his claim to the mountain. Win the ring."
 adventure.6031.b:0 "Pay in cheese. He knows a quicker way up."
 adventure.6032.t:0 "The Avalanche Bell"
 adventure.6032.desc:0 "Above the pass stands a monastery whose monks ring a great bell to bring the snow down on anyone they dislike. They have flown a faded war banner from the bell tower ever since the last army tried to rush the pass, which was the last thing that army tried.\n\nThe monks are watching the party with professional interest."
 adventure.6032.a:0 "Climb to the tower before anyone reaches the rope."
 adventure.6032.b:0 "Wait for the bell, then walk where the snow used to be."
 adventure.6033.t:0 "The Relic Auction"
 adventure.6033.desc:0 "In the courtyard of the shrine, pilgrims are bidding on the knucklebone of a saint. This is the seventh knucklebone of that saint offered today, and the saint is not recorded as having had extra hands.\n\nThe last lot is a spear said to have been carried by an angel, with paperwork that is at least eight days old."
 adventure.6033.a:0 "Bid on the spear with the best paperwork."
 adventure.6033.b:0 "Expose the forgeries and collect the shrine's finder's fee."
 adventure.6034.t:0 "The Penitent Bells"
 adventure.6034.desc:0 "The sanctuary's bells ring by themselves whenever someone inside tells a lie. Visitors are expected to walk the nave and say only true things. The priests note that the bells have been very busy since the tax collectors started visiting.\n\nAt the far end of the nave, on the altar, lies the sanctuary's holy book, waiting for anyone who can reach it in silence or in truth."
 adventure.6034.a:0 "Walk the nave speaking only truths, however unflattering."
 adventure.6034.b:0 "Stuff the bells with wool and keep very quiet."
 adventure.6035.t:0 "The Apprentice's Mistake"
 adventure.6035.desc:0 "A summoning circle has been left running in an abandoned study. Inside it, a small and furious elemental is trying to file a complaint with whoever is in charge. Nobody is in charge. The apprentice who drew the circle is gone, though his notes, in a very forbidden binding, are still on the desk.\n\nThe elemental would like a quill."
 adventure.6035.a:0 "Close the circle before the elemental finishes its sentence."
 adventure.6035.b:0 "Help the elemental write its complaint properly."
 adventure.6036.t:0 "The Upward Room"
 adventure.6036.desc:0 "In this room everything falls up. Dust drifts to the ceiling, the candles burn downward, and a masterwork sword hangs point-first from the rafters where some earlier visitor dropped it.\n\nThe scout reports that walking on the ceiling is easy. The scout is currently on the ceiling and would like to come down."
 adventure.6036.a:0 "Climb down to the ceiling and fetch what fell up."
 adventure.6036.b:0 "Tie everyone together and cross the floor slowly."
 adventure.6037.t:0 "The Tax Assessor"
 adventure.6037.desc:0 "A city official stops the party at the district gate. He has heard they are on a dangerous errand, and danger, by local statute, is a taxable good. He has a ledger, a codex of the relevant ordinances, and the serene confidence of a man who has never once been stabbed.\n\nThe district beyond the gate is where the trouble is."
 adventure.6037.a:0 "Argue that danger is not a good. Ask to see the codex."
 adventure.6037.b:0 "Pay the tax, demand a receipt, and wave it at the next gate."
 adventure.6038.t:0 "The Rooftop Chase"
 adventure.6038.desc:0 "A thief in a gray hood snatches the contract papers from the party's table and goes straight up the wall. The rooftops of the city are steep, slick, and crowded with laundry, and the thief is laughing in a way that suggests long practice.\n\nThe papers can be bought back at the market tomorrow, at a price. The thief's daggers can only be had today."
 adventure.6038.a:0 "Chase the thief across the roofs."
 adventure.6038.b:0 "Let the thief go and learn the routes for next time."
 adventure.6039.t:0 "The Wrecker's Lantern"
 adventure.6039.desc:0 "On the cliffs above the bay, someone has been lighting a lantern on stormy nights where the harbor light should be. Ships steer for it and find rocks instead, and in the morning the wreckers walk the beach with boarding spears and sacks.\n\nThere is a storm coming in tonight. The lantern will be lit."
 adventure.6039.a:0 "Find the lantern on the cliff before the next ship does."
 adventure.6039.b:0 "Warn the harbor watch and collect their reward."
 adventure.6040.t:0 "The Reef Pilot"
 adventure.6040.desc:0 "The only way through the reef is with a pilot, and the only pilot is a woman who steers by singing to the rocks. She claims the rocks sing back. Her fee is reasonable, her boat is old, and she wears a golden ring that she says the reef gave her.\n\nThe long way around the reef takes three days and a great deal less faith."
 adventure.6040.a:0 "Hire the pilot and trust the singing."
 adventure.6040.b:0 "Row the long way around and arrive dry."
 adventure.6041.t:0 "The Low-Tide Causeway"
 adventure.6041.desc:0 "An island sits offshore, joined to the beach by a stone causeway that appears only at low tide. It is already disappearing at both ends. Halfway along, wedged between two stones, a barnacled shield waits for someone foolish enough to stop and pull.\n\nThe tide tables in the guild notes are, as always, approximately correct."
 adventure.6041.a:0 "Run the causeway before the tide remembers."
 adventure.6041.b:0 "Wait a whole tide on the beach and comb the wrack line."
 adventure.6042.t:0 "The Charcoal Burners"
 adventure.6042.desc:0 "Deep in the wood, a family of charcoal burners tends smoking mounds and swears that the forest moves at night. Not the trees. The paths. They are cheerful about it in the way of people who have stopped expecting outsiders to believe them.\n\nThey sell charcoal, directions, and a very good axe, and they will talk all night for the price of company."
 adventure.6042.a:0 "Share their fire, their opinions, and their axe."
 adventure.6042.b:0 "Buy charcoal and directions, in that order."
 adventure.6043.t:0 "The Hollow Stag"
 adventure.6043.desc:0 "A great stag walks through the clearing at dusk. It is hollow. Light shines through it where its ribs should be, and its footsteps make no sound on the leaves. It stops, looks at the party, and waits, like a guide who has been paid in advance.\n\nWhere it walks, a pale glow lingers on the ferns."
 adventure.6043.a:0 "Follow it at a respectful distance."
 adventure.6043.b:0 "Mark the trail it leaves and walk the other way."
 adventure.6044.t:0 "The Echo That Answers Late"
 adventure.6044.desc:0 "In this cavern the echo comes back an hour later, and not always with the same words. Someone shouted a question here long ago, and the answer, directions to an old armory deeper in, is still arriving in pieces.\n\nThe companions have started whispering, in case the echo is listening."
 adventure.6044.a:0 "Shout a question and wait for the answer."
 adventure.6044.b:0 "Chalk the walls, ignore the echo, and take the marked tunnel."
 adventure.6045.t:0 "The Blind Fish Market"
 adventure.6045.desc:0 "Far below the surface, traders who have not seen daylight in generations hold a market in total darkness. Prices are set by touch. Change is given in pebbles of uncertain value. A merchant offers a stone that is either a precious gem or a very smooth rock, and swears by every god he has never seen.\n\nEveryone here can hear the party's purses."
 adventure.6045.a:0 "Haggle in the dark like a local."
 adventure.6045.b:0 "Overpay for lamp oil, a map, and a rumor of something rare."
 adventure.59.c:0 "Pay the smaller of the two numbers."
 adventure.60.c:0 "Buy the cow. Strike while it is busy."
 adventure.61.c:0 "Pay the forger, hand over the copy, and keep the original."
 adventure.62.c:0 "Hire the diggers and go in through the wall."
 adventure.63.c:0 "Make a donation and let the priests open it."
 adventure.64.c:0 "Pay the cousin and take the other road."
 adventure.71.c:0 "Keep the lesson. Some stories change the teller."
 adventure.90.d:0 "Force coast: four encounters, item enabled."
 adventure.90.e:0 "Exhaust the mountain and generic pools: must end cleanly."
 adventure.90.f:0 "Skip to a legendary ending."
 adventure.4005.t:0 "The Wrong District"
 adventure.4005.desc:0 "The toll-keepers at the bridge into the valley have read the guild warrant twice, and both times they have found the same clause naming the district on the far side of the ridge. Their captain admits that the last company came through on a warrant just like it, although he remembers that they paid the bridge fee in silver and asked no questions about the wording.\n\nHis men would rather collect the fee than argue law with armed travelers, while the captain wants it understood that a warrant which names the wrong valley is no warrant at all. The drovers' road around the district adds four days, and the drovers say it is dry."
 adventure.4005.a:0 "Read the clause aloud and make the captain point to his objection."
 adventure.4005.b:0 "Pay the bridge fee in silver, as the last company did."
 adventure.4005.c:0 "Take the drovers' road around the district."
 adventure.4006.t:0 "The Courier's Satchel"
 adventure.4006.desc:0 "Two days out, the party meets a guild courier riding hard the other way with a sealed satchel addressed to the guildmasters. When [ROOT.GetCharacter.GetName|Y] asks where he has come from, he names the district in the contract, and by the time the waterskin comes back empty he has admitted that the last company paid him to carry their report home and did not come with it.\n\nA courier who lets a guild seal be broken on the road can expect that fact to follow him to every hall the guild keeps. He would still rather be paid for his silence than lectured for his loyalty, and the wax is soft enough to lift with a warm knife."
 adventure.4006.a:0 "Lift the seal with a warm knife and read what they wrote."
 adventure.4006.b:0 "Let him ride on with the seal unbroken."
 adventure.4007.t:0 "Ash at the Waystation"
 adventure.4007.desc:0 "The guild waystation where the party meant to buy fodder and lamp oil is a ring of black posts around a cold hearth, and the keeper is sitting on what is left of the woodpile with his ledger in his lap. He says the fire started in the hayloft a week ago, while his son was away driving the mules to market, and that nobody on the road has stopped long enough to ask him what he owes.\n\nThe ledger lists every company that has drawn on the guild's credit here since the spring, and the guildmasters pay a finder's fee to have such books back. Without fodder, the animals will have to work on what they carry."
 adventure.4007.a:0 "Push on and let the animals live on the load."
 adventure.4007.b:0 "Buy the keeper a meal and carry his ledger home for the fee."
 adventure.4008.t:0 "Four Hundred Head"
 adventure.4008.desc:0 "A drover and his sons are moving four hundred head of cattle to the autumn market, and for most of a day's march the road is nothing but horns, dust, and the shouting of boys who have been awake since before dawn. The drover keeps a tally stick for every beast he must answer for at the market, and he has no intention of letting strangers scatter his count into the fields.\n\nHe will open a lane at the next ford if someone gives him a reason, and he will open one sooner for coin. The companions point out that the herd is moving at exactly the speed of a herd."
 adventure.4008.a:0 "Walk beside the drover and ask him about the market prices."
 adventure.4008.b:0 "Pay him for the trouble of opening a lane."
 adventure.4008.c:0 "Make camp and let the herd pass."
 adventure.4009.t:0 "Deserters at the Watchfire"
 adventure.4009.desc:0 "Six men in the realm's own colors are already sitting around the only watchfire on the ridge when the party comes up the road, and none of them stands to give a name. Their sergeant says the company was owed three months of pay when the paymaster's wagon went back to the capital empty, and that a soldier who walks home is only collecting what he is owed in the one coin left to him.\n\nThey would carry packs for food and a word in their favor, and they know the next stretch of road. Every one of them also knows who is sitting across the fire."
 adventure.4009.a:0 "Take them on as porters and promise to hear their case at home."
 adventure.4009.b:0 "Send them back to their company with a letter for their captain."
 adventure.4010.t:0 "The Gray Lantern Company"
 adventure.4010.desc:0 "Another guild company is camped at the crossroads when the party arrives, with a gray lantern hung from a pole above their wagons and their own copy of the contract terms tacked to the tailboard. Their captain is courteous, and when [ROOT.GetCharacter.GetName|Y] asks where they are bound, she names a destination near enough to the party's that both companies start counting the other's mules.\n\nThe guild's rule is that the first company to file a report is paid and the second is thanked. Sharing the road would make the nights safer, although it would also mean that the Gray Lantern sees everything the party finds along the way."
 adventure.4010.desc_again:0 "The gray lantern is hanging above a wagon at the crossroads again, and its captain greets the party by name before anyone has dismounted. Her company has filled out since the last meeting, with two new porters and a mule that still carries another guild's brand, and she makes a point of mentioning every contract they have filed since.\n\nShe offers to share the watchfire, as is the custom between companies, and asks with perfect courtesy where the party is bound this time. Her quartermaster is already counting the party's packs."
 adventure.4010.a:0 "Keep pace with them and watch what they carry."
 adventure.4010.b:0 "Share the watchfire and keep the guild's custom."
 adventure.4011.t:0 "Camp Fever"
 adventure.4011.desc:0 "By the third morning one of the companions cannot keep down the porridge and is sweating through a blanket in weather that has the rest of the camp blowing on their hands. The guide says the water at the last spring was fouled, while the porters, who drank the same water, say it is a curse and want to know whose.\n\nThe village below has a healer who sets her prices by how far the patient has come, and she will want the party to stay three days. The scholar has a book of remedies and the confidence of someone who has read it twice."
 adventure.4011.a:0 "Let the scholar treat the fever from the book of remedies."
 adventure.4011.b:0 "Carry the sick companion down to the healer and pay her rate."
 adventure.4012.t:0 "Guest-Right"
 adventure.4012.desc:0 "The road runs through a village in the middle of a wedding, and before the party can water the horses the bride's father has put a cup into [ROOT.GetCharacter.GetName|Y]'s hands. In this valley a traveler who passes a wedding without drinking to the couple is remembered as an ill omen at every naming feast for a generation, and the old women at the well have already begun to count the strangers.\n\nThe feast will run until the second night, with dancing, gifts, and a great many questions about the contract. A generous gift and an early departure might satisfy custom, provided the gift is generous enough to be talked about."
 adventure.4012.a:0 "Drink to the couple and stay for the feast."
 adventure.4012.b:0 "Leave a generous gift and ride on before the dancing."
 adventure.4013.t:0 "Mana Weather"
 adventure.4013.desc:0 "Out on the open plain the sky turns the color of a cut soulgem, and lightning begins to walk the grass in long blue strides that leave the ground smelling of hot copper. The packs start humming where the buckles touch, and the mules, who have seen weather like this before, lie down without being told.\n\nThe herders say mana storms pass by nightfall and that the safe thing is to bury the iron and lie flat. The scholar believes the strikes follow a pattern, and that a party which reads it correctly could cross the plain while the storm is still deciding where to land."
 adventure.4013.a:0 "Read the strikes and cross between them."
 adventure.4013.b:0 "Bury the iron, lie flat, and wait for nightfall."
 adventure.4014.t:0 "The Surveyor's Correction"
 adventure.4014.desc:0 "A surveyor with a chain, two assistants, and a cart full of stakes has been working along the road for a month, and he is happy to tell anyone who stops that the guild map is a full day's march wrong. He has drawn a corrected copy on good vellum and dated it, because in his trade a map without a date is only an opinion.\n\nHe will sell the copy for what he calls the price of the vellum. His assistants, while their master is talking, quietly admit that the corrected road crosses a stretch he has not walked himself."
 adventure.4014.a:0 "Check his figures against the guild map before trusting either one."
 adventure.4014.b:0 "Buy the corrected map and follow it."
 adventure.4015.t:0 "The Second Letter"
 adventure.4015.desc:0 "A boy on a borrowed pony catches up with the party and hands over a letter wrapped around a ring that the missing family will recognize. The captors have raised their price since the guild accepted the contract, and they have written the new sum in a careful clerk's hand, as though the matter were a debt being renegotiated.\n\nThe boy has been told to wait for an answer and to carry nothing else. Answering through him would tell the captors that someone is coming, while keeping silent would leave them to wonder how long their prisoners are worth feeding."
 adventure.4015.a:0 "Write an answer that keeps them talking."
 adventure.4015.b:0 "Keep the ring, send the boy home, and give them nothing."
 adventure.4016.t:0 "Carcasses by the Road"
 adventure.4016.desc:0 "For two days the party has passed dead livestock in the ditches, and each carcass lies further from any farm than the one before it. The farmers have stopped burying them, since whatever killed the animals comes back for each one within the week, and they now leave them where they fall and drive their herds the other way.\n\nThe kills would show how the beast hunts and how far it ranges, if someone is willing to kneel in the ditch and study them. The farmers would rather the party took the long way around, and they would rather not be the reason anyone was eaten."
 adventure.4016.a:0 "Study the kills and learn how it hunts."
 adventure.4016.b:0 "Take the farmers' advice and the long way around its range."
 adventure.4017.t:0 "The Same Gray Cloak"
 adventure.4017.desc:0 "The scout has seen the same man three times since the guild hall: once at the city gate, once at a ford two days later, and once this morning drinking at the inn where the party broke its fast. He wears a gray cloak that is too good for the road and boots that are too worn for the cloak, and he has never once looked toward the party's table.\n\nWhoever sent him wants to know where the contract leads before the party arrives. Taking him on the road would answer that question, although it would also tell his employer that the party has noticed."
 adventure.4017.a:0 "Double back after dark and take him at his camp."
 adventure.4017.b:0 "Talk about the wrong road at every inn and let him follow it."
 adventure.4018.t:0 "Diggers Coming Home"
 adventure.4018.desc:0 "A string of diggers is coming up the road with picks over their shoulders and empty sacks at their belts, and their foreman wants to sell the map they made of the ruin's lower galleries. He says the outer halls have been picked clean for three generations, while the deep chambers have been left alone because the men who mapped them did not come back to collect their share.\n\nHis map is drawn on the back of a grain receipt and marked with crosses where his crew turned around. He swears it is honest, and his crew carefully say nothing."
 adventure.4018.a:0 "Question the crew one by one and compare their stories to the map."
 adventure.4018.b:0 "Pay for the map and the names of the deep chambers."
 adventure.4019.t:0 "The Pilgrim's Hand"
 adventure.4019.desc:0 "An old pilgrim has walked beside the party since the last shrine, and every evening she asks to touch the relic that the party has not yet found. She describes its weight, its wrappings, and the stain on the left side of the reliquary, and she says she knelt beside it as a girl, before the priests began locking the inner doors.\n\nThe scholar wants to know how much she remembers, and she is happy to talk once someone has prayed with her. The porters have started keeping to the far side of the fire, because a woman who knows the relic that well might also know what it does."
 adventure.4019.a:0 "Ask her what the relic did when she knelt beside it."
 adventure.4019.b:0 "Pray with her and leave the questions for the priests."
 adventure.4020.t:0 "The Crate Knocks"
 adventure.4020.desc:0 "On the fourth night out, one of the crates the party has been hired to guard begins to knock from the inside in a slow, regular rhythm that stops whenever someone lifts a lamp to it. The client's manifest lists the crate as dyed wool for the weavers' market, and the client himself, once he is woken, insists that wool is exactly what it is.\n\nThe porters have already moved their bedrolls away from the cart. Opening the crate would break the client's seal and the terms of the escort, while leaving it shut means another three days of guarding whatever has learned to knock."
 adventure.4020.a:0 "Break the seal and open the crate."
 adventure.4020.b:0 "Nail the lid down tighter and keep the client's secret."
 adventure_read_satchel_tt:0 "The last company's report will give the party #G a better approach on arrival#!."
 adventure_read_satchel_used_tt:0 "#G The last company's report shows the way they went in.#!"
 adventure_memory_bonus_tt:0 "#G They remember how the realm treated them last time.#!"
 adventure.65.t:0 "The Captive Who Stays"
 adventure.65.desc:0 "The family who posted the contract believed their daughter had been carried off, but the party finds her keeping house in the captors' camp with a husband, a pot on the fire, and the guild notice of her own disappearance pinned above the door as a joke. Her husband's people took her the old way, by agreement between the young people rather than between the households, and she has no intention of being rescued from her own wedding.\n\nThe contract fee is still owed if she comes home. Her husband's mother says the matter can be settled with a proper bride-price, and her brothers would settle it with spears."
 adventure.65.a:0 "Hear her out, then sit both households down together."
 adventure.65.b:0 "Bring her home as the contract says, whatever she wants."
 adventure.65.c:0 "Pay the bride-price and carry the settlement home instead."
 adventure.66.t:0 "The Brood"
 adventure.66.desc:0 "The beast the farmers want dead has dug a den under the roots of a fallen oak, and the scout comes back from it with mud to the elbows and the news that there are young inside. The mother has been killing livestock to feed them, and she has had to range farther from the den each night as the herds are driven away from her.\n\nThe farmers want every one of them dead before the young are old enough to hunt. The hunters who came with the party want the hides undamaged, since a mother's pelt sells for twice the bounty, and they are not eager to go into the den for it."
 adventure.66.a:0 "Draw the mother out into open ground and take her there."
 adventure.66.b:0 "Fire the den and stand ready at the mouth."
 adventure.66.c:0 "Pay the hunters to take the den with nets and spears."
 adventure.67.t:0 "Two Clerks, One Seal"
 adventure.67.desc:0 "The forged warrants behind the rumors were sealed with the magistrate's own seal, and the party learns that the seal is kept in a box with two locks and two keys, held by two clerks who have not spoken to each other since the spring. Each clerk swears that the other must have opened the box, and each has a pardon ready for whoever helps prove it.\n\nBoth clerks have friends in the magistrate's household, and both would pay well to see the other hanged. Neither seems to have noticed that the box cannot be opened without both keys."
 adventure.67.a:0 "Bring both clerks to the same table and let each hear the other's story."
 adventure.67.b:0 "Work the household servants and find out who drank with whom."
 adventure.67.c:0 "Buy one clerk's pardon and let the magistrate sort out the rest."
 adventure.68.t:0 "The Diggers Down Tools"
 adventure.68.desc:0 "The local diggers the party hired opened the first two galleries in a week, but at the mouth of the third they laid down their picks and sat on their sacks. Their foreman says that his grandfather's crew opened the third gallery forty years ago and only half of them walked out, and that a man who digs where his grandfather died should be paid for both of them.\n\nHe wants double the rate before anyone lifts a pick. His crew would go back to work if someone went into the gallery first and came out again, although none of them will say which part frightens them."
 adventure.68.a:0 "Go into the third gallery first and come back out where they can see."
 adventure.68.b:0 "Find the old shoring and read where the first crew went wrong."
 adventure.68.c:0 "Pay the double rate."
 adventure.69.t:0 "The Empty Reliquary"
 adventure.69.desc:0 "The reliquary named in the contract is open when the party reaches it, and the wrappings are folded on the altar with the care of someone who expected to be judged on how they left things. The candles beside it have burned down only two fingers since they were lit, and the dust on the step shows bare feet going out toward the village.\n\nThe priests are certain the relic was taken by a thief, while the village says it left on its own and went where it was needed. Whoever has it now is close, and everyone in the village knows exactly who it is."
 adventure.69.a:0 "Read the wrappings and the prayer stubs before anyone else touches them."
 adventure.69.b:0 "Follow the footprints on the step into the village."
 adventure.69.c:0 "Offer the village a reward for the relic's return, no questions asked."
 adventure.70.t:0 "The Client's Detour"
 adventure.70.desc:0 "Halfway along the escort road the client announces that he has letters for a buyer in a market town two days off the route, and that the contract never said the party could not go there. His carters have already turned the lead wagon, while the guild agent who signed the contract is three valleys away and cannot be asked what was meant.\n\nThe market town lies across hill country where the road has not been patrolled since the spring. The client points out, quite reasonably, that he is paying for the escort whichever road he takes."
 adventure.70.a:0 "Ride ahead on the detour road and clear it before the wagons come up."
 adventure.70.b:0 "Take the detour and keep the wagons closed up."
 adventure.70.c:0 "Hire local riders to scout the hill road."
 adventure.76.t:0 "The Gray Lantern Besieged"
 adventure.76.desc:0 "The Gray Lantern Company is holed up in a shepherds' fold on the hillside, with their lantern pole broken across the gate and their wagons drawn into a ring around the last of their water. Their captain took a contract the guild later admitted was underpriced, and the men who now hold the slopes around the fold have spent three days making sure none of her company carries that news home.\n\nShe sees the party from the wall and lifts a hand. The besiegers have seen the party too, and they have begun to talk among themselves about whether a second company is worth the same price as the first."
 adventure.76.desc_friendly:0 "The Gray Lantern Company is holed up in a shepherds' fold on the hillside, with their lantern pole broken across the gate and their wagons drawn into a ring around the last of their water. When their captain sees the party from the wall, she lifts the same hand she offered when the two companies split their last find by the old guild rule, and her men begin to cheer before she can stop them.\n\nThe men holding the slopes around the fold have heard the cheering. They have begun to talk among themselves about whether a second company is worth the same price as the first."
 adventure.76.desc_bitter:0 "The Gray Lantern Company is holed up in a shepherds' fold on the hillside, with their lantern pole broken across the gate and their wagons drawn into a ring around the last of their water. Their captain sees the party from the wall and watches for a long time without raising a hand, because the last time the two companies met over a prize, the party reached it first and did not look back.\n\nThe men holding the slopes have seen the party as well. They have begun to talk among themselves about whether a second company is worth the same price as the first."
 adventure.76.a:0 "Walk up to the besiegers under a guild flag and talk."
 adventure.76.b:0 "Break the ring from the downhill side."
 adventure.76.c:0 "Buy the besiegers off with the contract's advance."
 adventure.81.t:0 "The Frozen Cairn"
 adventure.81.desc:0 "The supply cairn the guild built below the pass is still standing, but the oiled hides over it have split and the grain inside has frozen into a single block the shape of the sacks. Someone has chipped at one corner with an axe and given up, and their tally of what they took is scratched into the lid stone in the guild's own marks.\n\nThe pass above is a hard day's climb on full rations. The shepherds' track below it is longer and lower, although the shepherds charge for it in grain, and the only grain on the mountain is frozen."
 adventure.81.a:0 "Load what can be cut free and climb the pass."
 adventure.81.b:0 "Hack out grain for the shepherds and take their track."
 adventure.82.t:0 "The Pilgrim Count"
 adventure.82.desc:0 "The priests at the holy site have closed the outer gate for a count, as they do every seventh year, and every traveler inside the walls must give a name, a home, and a reason before the gate will open again. The line of pilgrims stretches down to the river, and the clerks at the gate write slowly, because whatever they write will be read aloud at the next great feast.\n\nThe senior clerk has a cousin in the guild, and he would like to know whether the party's contract belongs in his book. The junior priests would rather nobody wrote anything about it at all."
 adventure.82.a:0 "Give the senior clerk a version of the contract he can write down."
 adventure.82.b:0 "Wait in line with the pilgrims and give only your name."
 adventure.83.t:0 "The Academy Quarantine"
 adventure.83.desc:0 "The academy at the site has closed its gates and painted a blue ring on the paving in front of them, and the porters say no one has gone in or out since the last bell before the quarantine. Through the bars the party can see apprentices carrying crates of ruined glassware into the courtyard and stacking them in neat rows, as though someone will count them later.\n\nThe master of the gate will open a postern for anyone with business that cannot wait. The apprentices, meanwhile, are selling the broken glass through the bars, and some of it is still warm."
 adventure.83.a:0 "Argue at the postern that the contract is academy business."
 adventure.83.b:0 "Buy the warm glass through the bars."
 adventure.84.t:0 "The Curfew Bell"
 adventure.84.desc:0 "The bell in the watch tower rings the curfew an hour earlier than the guild notes say it should, and by the time the party has stabled the horses the streets are emptying into locked doors and lit shutters. A watch sergeant explains that the council moved the curfew after the last company arrived, although he cannot say what that company did and suspects the council cannot either.\n\nThe night watch will look the other way for a fee that depends on the street. The innkeeper would like the party to stay in, pay for supper, and let the city sleep."
 adventure.84.a:0 "Learn the watch's rounds and move between them."
 adventure.84.b:0 "Stay in, sell the innkeeper the spare horse, and wait for morning."
 adventure.85.t:0 "The Chain Across the Harbor"
 adventure.85.desc:0 "A chain has been drawn across the harbor mouth, and the harbor master is collecting the oars from every boat at the quay and stacking them in the customs house. A ship from the south came in with sickness aboard, or with smugglers, or with both, depending on which tavern is telling it, and nothing will leave the harbor until the council decides which.\n\nThe fishermen are losing a week's catch and would row the party anywhere for a share of the contract. The harbor master would like everyone to stay ashore, where he can count them."
 adventure.85.a:0 "Hire a fisherman to row under the chain at night."
 adventure.85.b:0 "Stay ashore and go round by the coast road."
 adventure.86.t:0 "The Woodcutters' Boundary"
 adventure.86.desc:0 "Two woodcutters' villages have argued over the same stand of oak for longer than either headman has been alive, and each side has marked the trees with its own sign. The party arrives on the morning after somebody felled a marked tree in the night, and both villages have turned out with axes to stand on either side of the stump.\n\nThe only road to the site runs between them. Each headman would welcome armed strangers as witnesses for his side, and each has already noticed that the party has not yet chosen one."
 adventure.86.a:0 "Stand between them and ask who swung the axe."
 adventure.86.b:0 "Leave the road and cut through trees nobody has marked."
 adventure.87.t:0 "The Miners' Lift"
 adventure.87.desc:0 "The only way down to the lower workings is a cage lift on a chain, and the winding crew has chained the wheel and gone home to wait for their wages. The mine's owner, who pays them, has been away at the assizes for a month, and the crew has nailed a notice to the wheelhouse door listing every week they are owed and the name of the man who signed for each one.\n\nThe ladders down the old air shaft are older than the lift and have had no one to look after them. The crew foreman lives in the end house, and he says he would turn the wheel for anyone who listened to the whole list."
 adventure.87.a:0 "Climb down the old air shaft."
 adventure.87.b:0 "Sit with the foreman, hear the list, and ride the cage down."
 adventure.88.t:0 "The Last Company's Slate"
 adventure.88.desc:0 "At the inn nearest the site, the landlord greets the party warmly and brings out a slate covered in chalk. The last company the guild sent here ate, drank, and stabled their horses on credit for most of a month, he says, and they promised that the next company would settle the account, which he assumes is why the party has come.\n\nHalf the village has a line on the slate, from the smith to the woman who washed the company's shirts. Not one of them will talk about where the last company went until the slate has been wiped."
 adventure.88.a:0 "Ask each of them what the last company said before it left."
 adventure.88.b:0 "Sell the last company's abandoned mules, wipe the slate, and keep the rest."
 adventure.2.h:0 "#Y Rescue:#! bring the Gray Lantern Company home."
 adventure_contract_rival_tt:0 "#Y Rescue contract#! at [SCOPE.sP('adventure_province_1').GetName|Y]. The #Y Gray Lantern Company#! is besieged.\n#G Best with a Diplomat#! (Charisma 9+). If they come home, their veterans may join the realm."
 adventure.5.f:0 "Follow the route in the last company's report."
 omni_adventure_gray_lantern_veterans:0 "Gray Lantern Veterans"
 omni_adventure_gray_lantern_veterans_desc:0 "The surviving veterans of the Gray Lantern Company now march under our banner, and they know every road the guild has ever mapped."
 adventure.6046.t:0 "The Lamp Ration"
 adventure.6046.desc:0 "The miners who once worked these passages chalked a rule at every junction, one lamp for every three walkers, and the party has spent the morning learning why. The oil is burning faster than the quartermaster planned for, since the air down here draws the flame up tall and hungry, and the next cache marked on the old miners' plan lies another half day further in.\n\nThe porters want to turn back to the last junction while there is still oil to see by. The quartermaster believes the party can reach the cache on one lamp if everyone keeps a hand on the shoulder in front."
 adventure.6046.a:0 "Put out all but one lamp and go on in a line."
 adventure.6046.b:0 "Go back to the junction and refill from the last cache."
 adventure.6047.t:0 "Tally Marks on the Wall"
 adventure.6047.desc:0 "Someone trapped in this side chamber kept count of the days in groups of five scratched into the soft rock, and the tally runs along the wall at the height of a sitting man until it stops at forty-one. Beneath the last mark an arrow points into a crawlway too narrow for a man in armor, and beside it a smaller arrow points back the way the party came.\n\nThe scout believes the first arrow was cut later, by a steadier hand. The porters have found where the tally-keeper slept, and the hollow in the rock is still lined with things he did not take with him."
 adventure.6047.a:0 "Strip off the armor and follow the first arrow."
 adventure.6047.b:0 "Search the hollow where the tally-keeper slept."
 adventure.6048.t:0 "The Underground Ferryman"
 adventure.6048.desc:0 "A black lake fills the cavern from wall to wall, and a pole-man in a flat boat waits at the landing with a set of scales hung from the stern. He charges by weight, he explains, because the lake does not care how important a passenger is, and he has been weighing travelers across this water since before the party's guide was born.\n\nHis rate for the party, the porters, and the gear is more than the quartermaster wants to pay. The pole-man allows that he has been known to weigh a passenger lighter for a good story, and he wears a silver ring that someone must once have paid him in."
 adventure.6048.a:0 "Tell him a story worth a lighter weighing."
 adventure.6048.b:0 "Pay his rate and cross straight to the far landing."
 adventure.6049.t:0 "The Fungus Farmers' Tithe"
 adventure.6049.desc:0 "Pale fungus grows in long tended beds along the cavern floor, and the farmers who keep them come out of the dark with their eyes half closed against the party's lamps. They tithe light, their headwoman explains, and every traveler who crosses the beds leaves a candle at the shrine by the far wall, because a bed that sees too much flame stops bearing for a season.\n\nThe party has candles enough for the road ahead and none to spare. The headwoman will accept a promise of candles sent down later, provided the promise is made where her whole village can hear it."
 adventure.6049.a:0 "Make the promise loudly enough for the whole village."
 adventure.6049.b:0 "Leave the candles at the shrine and walk on in the dark."
 adventure.6050.t:0 "The Sealed Shaft Warrant"
 adventure.6050.desc:0 "The shaft that leads toward the contract has been boarded over, and a mine magistrate's warrant is nailed to the timbers with the date, the reason, and the penalty for breaking the seal written out in a clerk's hand. The reason given is bad air. The penalty is a fine, a flogging, and the forfeit of anything found below, and the magistrate's men still walk past twice a day to check the boards.\n\nThe old miners say an air crawl from the next gallery joins the shaft below the seal. The long way round avoids both the crawl and the magistrate, although it adds two days underground."
 adventure.6050.a:0 "Find the old air crawl and come in below the seal."
 adventure.6050.b:0 "Respect the warrant and take the long way round."
 adventure.6051.t:0 "The Breathing Stone"
 adventure.6051.desc:0 "Warm air pours out of a crack in the cavern wall in long, slow breaths, and between each breath the crack opens just wide enough for a person to slip through sideways. The miners who worked here called it the bellows, and they kept a pick wedged in the crack until the stone closed on it and kept the pick.\n\nThe scholar has been counting the breaths and thinks the rhythm changes with the hour, which would leave a longer gap some time after midnight. The quartermaster still has a spare pick, and he would rather trust iron than arithmetic."
 adventure.6051.a:0 "Count the breaths and go through on the longest one."
 adventure.6051.b:0 "Wedge the crack with the spare pick and go through at once."
 adventure.6052.t:0 "The Unpaid Militia"
 adventure.6052.desc:0 "The bridge into the village is held by its own militia, a dozen farmers with spears and a captain who keeps the company's pay roll rolled up in his belt. The council has not paid them since the spring, and they have closed the bridge to everyone until the council comes out to explain why, which it has so far declined to do.\n\nThe captain has no quarrel with the party. He would let them cross for a promise that the ruler will hear the militia's case, while the ford below the weir is deep and slow and can be crossed by anyone willing to get wet."
 adventure.6052.a:0 "Promise in the ruler's name that their case will be heard."
 adventure.6052.b:0 "Leave the bridge to them and wade the ford below the weir."
 adventure.6053.t:0 "The Moved Boundary Stones"
 adventure.6053.desc:0 "Two hamlets share a valley and a boundary marked by a row of standing stones, and this morning the stones stand twenty paces closer to the eastern hamlet than they did at sunset. Both headmen have come out to meet the party at the stones, since strangers make the best witnesses, and each has brought the oldest man in his hamlet to swear where the stones used to stand.\n\nThe drag marks in the turf are already being trampled by the crowd. The eastern headman has also let it be known, quietly, that a witness who sees things his way will be paid for the trouble."
 adventure.6053.a:0 "Read the drag marks before the crowd erases them."
 adventure.6053.b:0 "Take the eastern headman's fee and witness for his side."
 adventure.6054.t:0 "The Widow's Claim"
 adventure.6054.desc:0 "A woman stops the party on the road with a guild token in her hand, the bronze kind given to every member of a company when they sign for a contract. It belonged to her husband, who went to the site with the last company and did not come back, and she says the guild still owes his share of the fee to whoever holds the token.\n\nShe knows the way the last company went, since she walked with them as far as the stream. She will show the party the same road once her husband's share is paid, and not before."
 adventure.6054.a:0 "Promise his share from the contract fee and ask her to lead."
 adventure.6054.b:0 "Pay her husband's share now, from the purse."
 adventure.6055.t:0 "The Stopped Mill"
 adventure.6055.desc:0 "The mill wheel at the edge of the village has not turned in three days, and the miller has been standing on the bank with a boathook, prodding at something wedged in the race that is too heavy to move and too dark to see. The village has stopped grinding, and the women are already rationing the last of the flour.\n\nThe miller will pay anyone who clears the race, and he would pay more if he knew what was in it. The quartermaster, who has been listening, points out that the miller does not have enough rope to do the job himself, and that the party has a great deal of it."
 adventure.6055.a:0 "Go down into the race and clear it."
 adventure.6055.b:0 "Sell the miller the spare rope and let him do the work."
 adventure.6056.t:0 "The Census Taker"
 adventure.6056.desc:0 "A census clerk from the capital has set up his table in the village square, and every household is lining up to swear to its names, its hearths, and its herds. He asks the party the same questions, since anyone sleeping in the district on the night of the count must be written down, and he makes clear that the ruler's own seal on the warrant does not excuse the ruler's own companions.\n\nHis book holds a record of everyone who has slept here this year, including the last company. He will let a reader turn its pages for a little while, if the reader is quick and does not smudge the ink."
 adventure.6056.a:0 "Read through his book for the last company's names."
 adventure.6056.b:0 "Answer his questions exactly and move on."
 adventure.6057.t:0 "A Grave Dug Too Early"
 adventure.6057.desc:0 "The village sexton is digging a grave in the churchyard for a man who is standing beside it, the party's own guide, who explains that it is the custom here for anyone who goes into the site to have a grave ready for his return. The grave is filled in again when he comes back, and if he does not, the village does not have to wait for the ground to thaw.\n\nThe guide is perfectly calm about it. The scholar wants to know who began the custom and why, while the porters have quietly begun to ask whether graves are dug for hired men as well."
 adventure.6057.a:0 "Ask the sexton when the custom began, and what it was meant to keep away."
 adventure.6057.b:0 "Pay for the grave to be filled in before the party leaves."
 adventure.6058.t:0 "The Rope Bridge Tally"
 adventure.6058.desc:0 "The bridge across the gorge is kept by an old woman who cuts a notch in a stick for every crossing, and she explains that the rope is good for six hundred crossings a season before it must be replaced. Her stick has five hundred and ninety notches on it. The new rope is coming up from the valley on her son's mules, and he is expected in three days if the weather holds.\n\nThe party has eleven people and a mule. She will let them cross if they insist, although she would like it remembered that she warned them, and she has already begun cutting the notches."
 adventure.6058.a:0 "Cross now, one at a time, with a rope tied to every belt."
 adventure.6058.b:0 "Wait for her son and the new rope."
 adventure.6059.t:0 "Snow Blind"
 adventure.6059.desc:0 "The sun came out after two days of snow, and by midday the whole slope is a sheet of white light that turns the scout's eyes red and running. The guide has seen it take men before, and he says that by tomorrow the scout will see nothing at all if the party keeps climbing in the glare.\n\nThe shepherds' hut on the ridge would shelter them until dusk, when the light softens. The scout has another suggestion, which is to cut slit visors from birch bark, as the hill people do, and go on with the snow at their backs."
 adventure.6059.a:0 "Cut bark visors and keep climbing."
 adventure.6059.b:0 "Lay up in the shepherds' hut until dusk."
 adventure.6060.t:0 "The Watchtower That Answers"
 adventure.6060.desc:0 "An old signal tower stands on the saddle of the ridge, its brazier black and its stair half fallen, and the party lights it out of habit when they make camp in its lee. Within the hour a fire answers from the next peak, and then another from the peak beyond it, each one burning in the old pattern of a garrison passing a message along the line.\n\nNo garrison has been posted on these peaks in living memory. The guide wants to put the fire out and leave before morning, while the scout wants to answer it in the same pattern and see what comes back."
 adventure.6060.a:0 "Answer the fires in their own pattern."
 adventure.6060.b:0 "Put out the brazier and move on before first light."
 adventure.6061.t:0 "The Goat Path Dispute"
 adventure.6061.desc:0 "Two herding clans use the same goat path over the shoulder of the mountain, and each has put a man at the foot of it to collect a toll in its own name. The two tollmen sit twenty paces apart, they have not spoken since the thaw, and each tells the party that paying the other is an insult his clan will remember.\n\nThe path is the only way to the high meadows that does not cost a day. The clans are short of salt this year, and both tollmen have noticed the party's packs."
 adventure.6061.a:0 "Sit down between the two tollmen and settle one toll for both."
 adventure.6061.b:0 "Sell the clans salt from the packs and pay neither toll."
 adventure.6062.t:0 "The Pilgrim Ledger"
 adventure.6062.desc:0 "Every pilgrim who enters the sanctuary signs the great ledger at the door, and every pilgrim who leaves signs it again on the facing page. The last company signed in on a feast day at the end of the summer, and the facing page beside their names is empty, although the priests insist that no one has stayed inside the walls since the feast.\n\nThe archivist will let the party read the ledger for the weeks that followed, provided someone reads the evening office with him first. The priests at the door would like the party to sign in like everyone else and leave the old pages alone."
 adventure.6062.a:0 "Read the office with the archivist, then read the ledger."
 adventure.6062.b:0 "Sign in like every other pilgrim and kneel where you are told."
 adventure.6063.t:0 "Two Feast Days"
 adventure.6063.desc:0 "Two priesthoods share the holy site, and they keep their great feasts on consecutive days, with processions that each take the long way round the sanctuary so as not to walk in the other's footsteps. The party arrives on the evening between the feasts, when both processions are rehearsing in the same courtyard and both sets of priests are watching each other's banners.\n\nEach priesthood would welcome armed strangers in its procession, since a full procession is a sign of favor. Marching in one will close the other's gates, while marching in neither means waiting two days for the courtyard to clear."
 adventure.6063.a:0 "March in the first procession and talk your way into the second."
 adventure.6063.b:0 "Wait out both feasts in the pilgrims' hostel."
 adventure.6064.t:0 "The Penitents' Road"
 adventure.6064.desc:0 "The last mile to the shrine is walked barefoot with a stone carried in each hand, and the priests along the road count the stones at the gate to make sure nobody has dropped one on the way. The penitents walk slowly and in silence, and the road is worn into two smooth grooves by the generations of bare feet that came before.\n\nThe guard captain says that a party in a hurry could carry their stones at a march, although the priests will remember who did it. The penitents would gladly have the party walk with them, at their pace, singing what they sing."
 adventure.6064.a:0 "Carry the stones at a march."
 adventure.6064.b:0 "Walk at the penitents' pace and learn their song."
 adventure.6065.t:0 "The Returned Bones"
 adventure.6065.desc:0 "A man in a stained traveling cloak is kneeling at the shrine gate with a bundle in his arms, and he says it holds the saint's bones that were stolen from the reliquary ten years ago. He wants absolution before sundown, he wants it in front of witnesses, and he wants the priests to stop looking at him as though he were the one who stole them.\n\nThe priests think the bones are a fake and the man a fraud, while the pilgrims around the gate already believe in both. The priests will pay a reward to anyone who holds him for the magistrate."
 adventure.6065.a:0 "Examine the bones before anyone decides what they are."
 adventure.6065.b:0 "Hold him for the magistrate and take the priests' reward."
 adventure.6066.t:0 "The Overdrawn Ward"
 adventure.6066.desc:0 "The ward that keeps the old laboratory sealed draws its strength from a ring of soulgems set into the threshold, and the keeper who maintains it has watched the gems go dark one by one since the spring. He has written to the academy for replacements four times and received four polite letters explaining that the matter is under consideration.\n\nTwo gems are still alight, and the keeper says that when the last one fails, whatever the ward was built to hold will have the run of the building. He would let the party past the ward in exchange for help keeping it lit."
 adventure.6066.a:0 "Help the keeper redraw the ward around the last two gems."
 adventure.6066.b:0 "Go round the laboratory by the outer wall and leave the ward to the academy."
 adventure.6067.t:0 "The Apprentices' Strike"
 adventure.6067.desc:0 "The apprentices who stoke the wards and grind the reagents have downed their tools in the courtyard and painted their grievances on a bedsheet hung from the dormitory window. The masters are away at a conclave, the bursar has locked himself in the counting house, and the wards that nobody is stoking have begun to flicker in a way that makes the porters uneasy.\n\nThe apprentices' leader would send her people back to work for a promise that somebody will speak for them when the masters return. In the meantime, the apprentices are selling the workshop's spoiled stock through the courtyard gate."
 adventure.6067.a:0 "Speak for the apprentices and get the wards stoked."
 adventure.6067.b:0 "Buy the spoiled stock and let the strike take its course."
 adventure.6068.t:0 "Elixir Under Seal"
 adventure.6068.desc:0 "A row of elixir casks stands in the academy cellar under an assayer's seal, each one stamped with the date it was tested and the strength it was found to have. One of them is leaking, and the elixir pooled on the stone floor gives off a faint light and a smell like warm bread and lightning.\n\nThe cellar-master wants the leak reported to the assayer, who pays a finder's fee for anything that saves the academy a cask. The scholar would like to know why a sealed cask has started to glow, and whether the others are about to do the same."
 adventure.6068.a:0 "Find out why the cask is glowing before reporting it."
 adventure.6068.b:0 "Report the leak to the assayer and take the finder's fee."
 adventure.6069.t:0 "The Soulgem Weigher"
 adventure.6069.desc:0 "The soulgem weigher in the academy market sets his scales in the open, so that every buyer can watch the beam settle, and he has kept his stall in the same place for thirty years. The scout has watched him weigh three gems this morning, and each time the beam has dipped a little before the gem touched the pan.\n\nThe weigher has friends among the masters and the testimony of thirty years behind him. The market wardens would act against him only with proof, and they would like that proof to come from someone who is leaving town soon."
 adventure.6069.a:0 "Catch the trick in the scales while the wardens are watching."
 adventure.6069.b:0 "Say nothing and buy nothing from him."
 adventure.6070.t:0 "Guild Hall Dues"
 adventure.6070.desc:0 "The guild keeps a branch hall in the city, and its clerk is waiting at the gate with a ledger to remind the party that a company working inside the walls owes dues to the local hall as well as to the one that issued the contract. He is apologetic about it, in a way that suggests he has apologized to a great many companies before, and he mentions that the hall's maps of the district are excellent.\n\nThe branch master has a long memory for companies that do not pay. He also has a short temper with clerks who overcharge the guild's own members under rules nobody voted on."
 adventure.6070.a:0 "Ask to see the branch master about the rule."
 adventure.6070.b:0 "Pay the dues and use the hall's maps."
 adventure.6071.t:0 "The Night Watch Roster"
 adventure.6071.desc:0 "The watch roster for the district is nailed up outside the watch house, with every street, every hour, and every watchman's name written in a neat hand the sergeant is proud of. The scout has noticed that one street goes unwatched for an hour after midnight on the same three nights of every week, and that the same name is crossed out beside it every time.\n\nThe sergeant says the man in question is ill. The man's neighbors say he has never been healthier, and that on those nights he comes home with mud on his boots and new shoes for his children."
 adventure.6071.a:0 "Watch the unwatched street on the next empty night."
 adventure.6071.b:0 "Tell the sergeant what the roster shows and leave it to him."
 adventure.6072.t:0 "Water Rights"
 adventure.6072.desc:0 "The fountain at the center of the district has stopped running, and the barrel-men who carry water to the upper streets have set their prices at whatever each house can pay. The fountain-keeper says the conduit is blocked somewhere under the hill, while the barrel-men say the conduit is fine and the fountain-keeper should look to his own key.\n\nThe upper streets are where the party needs to go, and the barrel-men are the only people moving freely through them. They would buy the party's mules outright, since a mule is worth a great deal in a city without water."
 adventure.6072.a:0 "Find out from the fountain-keeper who else holds a conduit key."
 adventure.6072.b:0 "Sell the barrel-men a mule and walk."
 adventure.6073.t:0 "The Debtors' Gate"
 adventure.6073.desc:0 "The road to the site passes through the debtors' quarter, where the gates are locked from the outside at dusk and opened from the inside only by the warden. The party's local guide has stopped at the gate and will not go in, and after a little questioning he admits that his name is written in the warden's book beside a sum he has no means to pay.\n\nThe warden will let the guide pass if someone stands surety for him. The guide's creditors are waiting in the tavern across the street, and they would very much like to meet whoever does."
 adventure.6073.a:0 "Stand surety for the guide and speak to the creditors yourself."
 adventure.6073.b:0 "Leave the guide at the gate and find the way without him."
 adventure.6074.t:0 "Salvage Rights"
 adventure.6074.desc:0 "A merchantman has gone aground on the bar, and the beach is already covered with salvagers, each crew working under a writ from a different lord and each writ claiming the whole wreck. The tide has turned, and whatever is not carried above the high-water mark in the next few hours will go back to the sea with the next storm.\n\nThe salvage master of the largest crew would buy the party's claim for coin. The other crews have noticed that the party is armed and has no writ at all."
 adventure.6074.a:0 "Stake a claim on the stern and argue it with the crews."
 adventure.6074.b:0 "Sell the salvage master whatever claim the party has."
 adventure.6075.t:0 "The Drowned Bell"
 adventure.6075.desc:0 "At the lowest tide of the month a bell rings under the water in the bay, clear and slow, from the place where the fishermen say a chapel stood before the sea came in. The fishermen will not put out their nets while it rings, and the old women say that whoever finds the bell will hear from it the name of whatever drowned the chapel.\n\nThe scholar would like to find the bell and hear the name. The fishermen would like the party to come ashore, let the tide turn, and leave them to put their nets out before dark."
 adventure.6075.a:0 "Row out over the chapel and listen for the bell."
 adventure.6075.b:0 "Come ashore and let the fishermen have the tide."
 adventure.6076.t:0 "The Net-Menders' Warning"
 adventure.6076.desc:0 "Three old women are mending nets on the quay, and when the party asks about the site they go on mending without looking up. After a while the eldest says that the last company asked them the same question, and that they gave the same answer, which was to look at the nets and count the holes.\n\nThe holes are large, regular, and all torn the same way. The younger fishermen laugh at the old women's warnings, although none of them has put out past the point since the last company sailed."
 adventure.6076.a:0 "Study the torn nets and learn what made the holes."
 adventure.6076.b:0 "Sit and mend nets with them until they are ready to talk."
 adventure.6077.t:0 "The Lighthouse Keeper's Debt"
 adventure.6077.desc:0 "The keeper of the lighthouse has not been paid by the harbor council since the winter, and he has begun burning the light at half strength to save oil he must buy with his own money. Two boats have struck the reef this month, and the council has sent the keeper a letter blaming him for both.\n\nThe party needs the light at full strength to make the crossing tonight. The keeper would trim it full for his arrears, or he would let the party climb the tower and tend it themselves, if they think they can keep it burning in this wind."
 adventure.6077.a:0 "Climb the tower and keep the light burning through the night."
 adventure.6077.b:0 "Pay the keeper's arrears and let him trim the light."
 adventure.6078.t:0 "The Woodward's Mark"
 adventure.6078.desc:0 "The trees along the only clear line toward the site are marked with the lord's axe, a cut in the shape of a crown made at chest height, and the woodward who made the marks lives in a hut at the forest edge. Cutting a marked tree is a fine for a commoner and an insult for anyone else, and the woodward walks the line every week to count them.\n\nHe would sell a cutting license for a few silver pieces. The scout believes there is a way between the marked trees that the woodward has not walked in years."
 adventure.6078.a:0 "Find a way between the marked trees."
 adventure.6078.b:0 "Buy the woodward's license and cut straight through."
 adventure.6079.t:0 "The Antler Shrine"
 adventure.6079.desc:0 "An old oak at the crossing of two game trails is hung with antlers, hundreds of them, nailed on by hunters over more generations than the oldest of them can count. Each set carries a scratched mark, and the hunters who still come here say that every mark is a name and every name a promise of the next kill, given in thanks for the last.\n\nThe guide will not pass the oak without leaving something on it. The scholar has noticed that the oldest antlers, high on the trunk, are carved with marks that are not names at all."
 adventure.6079.a:0 "Climb the oak and read the oldest marks."
 adventure.6079.b:0 "Leave an offering on the oak as the hunters do."
 adventure.6080.t:0 "The Hunters' Truce"
 adventure.6080.desc:0 "Two hunting parties from rival villages have met in the same clearing, and by the custom of the forest they have laid their bows together on a stump and agreed to a truce until morning. Both parties have been tracking the same stag for three days, and each believes the other has been driving it off their ground.\n\nThey would both welcome a stranger to hold the bows overnight, since a stranger has no reason to favor either village. Whoever holds them will also be asked, at dawn, to say which party gets the first shot."
 adventure.6080.a:0 "Hold the bows and give them a fair ruling at dawn."
 adventure.6080.b:0 "Leave the clearing before anyone asks for a ruling."
 adventure.6081.t:0 "The Path That Wasn't There"
 adventure.6081.desc:0 "The scout walked the forest edge yesterday evening and found nothing but brambles. This morning there is a path through them, beaten flat and a full stride wide, leading straight toward the site, and the brambles on either side have been pressed back as though something wide walked through in the night.\n\nThe guide says the forest makes paths for those it means to keep, and that the old trail, slow and overgrown, is the only one he will walk. The scout points out that the tracks on the new path lead in but not out."
 adventure.6081.a:0 "Follow the tracks and learn what made them."
 adventure.6081.b:0 "Take the new path at a march and trust it to the end."
 adventure.6082.t:0 "The Gray Lantern at the Prize"
 adventure.6082.desc:0 "The party reaches the inner chamber to find the Gray Lantern Company already there, their lantern hung from a peg in the wall and their quartermaster on his knees beside a chest that neither company has yet opened. Their captain has a hand on her sword hilt, although she has not drawn it, and she reminds [ROOT.GetCharacter.GetName|Y] that the guild's old rule splits a find between companies who reach it together.\n\nHer men are tired, and there are fewer of them than there were on the road. The chest is heavy, and whoever carries it out first will be the one to say what was inside."
 adventure.6082.a:0 "Split the chest by the old guild rule."
 adventure.6082.b:0 "Reach the chest first and let the guild sort it out."
 adventure.6082.c:0 "Sell them the party's claim and leave the chest to them."
 adventure.4001.desc_paid:0 "The ferryman remembers the party, or at least remembers their silver, and he raises a hand in greeting before they reach the landing. The river is high again, brown and quick, and he says it has run like this since the last time they crossed, as though it had been waiting for them to come back.\n\nHe offers the old rate, less a little for good customers, and he mentions that the ford upstream has taken two carts since the spring. He seems to think this is something friends should know."
 adventure.4001.desc_refused:0 "The ferryman sees the party coming and sits down on his bench with his arms folded, because he remembers who chose the ford over his boat the last time the river was high. He has painted a new price on the board beside the landing, and he has painted it large.\n\nThe ford upstream is still there, and the water over it is higher than it was. He would be glad to tell the party how many people have drowned in it since they last crossed, although he would want paying for that as well."
 adventure.4001.d:0 "Pay his new price and let the matter rest."
 adventure.4001.e:0 "Pay the old rate, less a little for good customers."
 adventure.6031.desc_paid:0 "The hermit is still on his rock beside the hand-painted sign, and he brightens when he sees the party, because he remembers the cheese. He has repainted the sign since then and added a line granting free passage to friends of the mountain, although he is careful to explain that friendship on this mountain is renewed with each visit.\n\nHe is wearing the same ring, and he turns it on his finger as he talks. He would be glad of cheese again, and gladder still of news from the valley."
 adventure.6031.desc_argued:0 "The hermit sees the party from far down the pass and is on his feet before they reach the sign, because he has spent the time since their last visit preparing his answer to their argument. He has scratched the main points into the rock beside him, and he refers to them as he talks.\n\nHe would like a rematch. He has put the ring up again as the stakes, and he has made it clear that the toll this time will be paid in cheese or in an apology, and that he will accept either one."
 adventure.6031.c:0 "Bring him the cheese and the news from the valley."
 adventure.6037.desc_paid:0 "The tax assessor is at the district gate again with his ledger and his codex, and when the party produces the receipt from their last visit, he reads it twice, holds it up to the light, and pronounces it entirely in order. By his reading of the ordinances it covers every dangerous errand undertaken by the same company, and he is plainly delighted to have found a clause that says so.\n\nHe seems pleased to have been paid once and asked nothing more. He also mentions, without being asked, which part of the district the watch has stopped patrolling."
 adventure.6037.desc_argued:0 "The tax assessor is waiting at the district gate, and he has brought a second codex. He remembers the argument from the party's last visit and has spent the months since then finding the ordinance that settles it, which he has marked with a ribbon and is holding open on his arm.\n\nThe new ordinance taxes danger, the threat of danger, and the reasonable expectation of danger. He would be happy to read the party the whole of it."
 adventure.6037.c:0 "Show him the old receipt."
 adventure.71.desc_rescue:0 "The rescued travelers walk into the capital ahead of the company, and by the time the party reaches the guild hall their families have told the story at every well in the city. The Guild records the contract as a triumph, pins the captors' demand letter to the wall as a lesson for future companies, and quietly raises its fees for rescues.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.71.desc_monster:0 "The company comes home with the beast's head on a pole and the farmers who posted the bounty walking behind it, arguing about which of them saw it first. The Guild has the skull cleaned and mounted above the contract board, where it looks down at every new company with an expression the clerks have learned to ignore.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.71.desc_intrigue:0 "The stolen ledger goes back to its rightful keepers, and three of the names written in it are no longer seen at court by the end of the month. The Guild files the contract under its most private seal, and the guildmasters begin greeting the ruler with the particular warmth men show to someone who knows where their accounts are kept.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.71.desc_ruin:0 "The company comes up out of the ruin with sacks of old coin, a sealed coffer, and a map of the lower galleries that the Guild buys on the spot for its own archive. The diggers who opened the side passage tell everyone that they were part of it, and for once the Guild does not correct them.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.71.desc_relic:0 "The relic is carried home on a litter with priests walking before it, and the road to the capital fills with pilgrims who want to touch the wrappings as it passes. The Guild records the contract in its own calendar of saints' days, which it keeps for reasons of business rather than devotion.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.71.desc_escort:0 "The travelers arrive without a scratch on them or their cargo, and the merchants' guild writes to ask for the same company by name on their next road. The Guild frames the letter and hangs it beside the contract board, where it does more for its fees than anything the guildmasters could say.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.71.desc_rival:0 "The Gray Lantern Company marches into the capital behind the party with their broken lantern pole carried at the front, and their captain signs her company's contracts over to the realm in front of the whole guild hall. Her veterans know every road the guild has ever mapped, and they have let it be known that they will travel them now under the ruler's banner.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.72.desc_rescue:0 "The missing travelers are home, a little thinner and with a story they will tell for the rest of their lives, and the Guild has marked the contract settled. Their families have sent a cart of food to the guild hall, and the clerks have eaten most of it."
 adventure.72.desc_monster:0 "The beast is dead, the farmers are driving their herds back onto the high pastures, and the Guild has paid the bounty in full. The company has kept one claw as a token and several scars as evidence."
 adventure.72.desc_intrigue:0 "The ledger has been delivered to the people who most needed to read it, and the city's rumors have turned toward someone else's business. The Guild marks the contract settled and suggests, gently, that the company avoid the tavern by the east gate for a season."
 adventure.72.desc_ruin:0 "The ruin has been opened, its galleries mapped, and its better finds carried home under the Guild's seal. The diggers have already gone back for whatever the company left behind."
 adventure.72.desc_relic:0 "The relic is home, wrapped in fresh linen and set in a new reliquary paid for by the Guild's patrons. The priests who argued about the relic now argue about the reliquary instead."
 adventure.72.desc_escort:0 "The travelers and their goods have arrived, the client has paid in full, and the Guild has added the escort road to its list of routes this company can be trusted with."
 adventure.72.desc_rival:0 "The Gray Lantern Company is out of the fold and home, and its captain has signed her surviving veterans over to the realm in front of the guild clerks. They are fewer than they were, but every one of them remembers who came up the hill."
 adventure.73.desc_rescue:0 "Most of the missing travelers are home, and the families of those who are not have been told what the company could learn. The Guild marks the contract settled, although no one in the hall uses the word success."
 adventure.73.desc_monster:0 "The beast was driven off rather than killed, and the farmers are still keeping their herds close to the villages. The Guild has paid half the bounty and posted the other half as a new contract."
 adventure.73.desc_intrigue:0 "The ledger was recovered, but not before two of the names in it had heard who was looking. The Guild marks the contract settled and keeps the company's report in a locked drawer."
 adventure.73.desc_ruin:0 "The ruin was opened, but its deeper galleries were left unmapped when the company ran short of oil and patience. The Guild has paid for what was carried out and posted the rest as a new contract."
 adventure.73.desc_relic:0 "The relic came home, although the priests at the site have written to the Guild about the manner of its taking, and the letter is long. The Guild has paid the fee and kept the letter."
 adventure.73.desc_escort:0 "The travelers arrived, but some of their cargo did not, and the client has paid only for what reached the market. The Guild has added a note to the contract about the hill road."
 adventure.73.desc_rival:0 "Some of the Gray Lantern Company came home, and their captain thanked the party in front of the guild clerks before taking her people back to their own hall. She did not offer her company's contracts, and nobody asked for them."
 adventure.74.desc_rescue:0 "The company comes back without the missing travelers, and the families who posted the contract are waiting at the guild hall to hear why. The Guild has returned their fee, which they did not want."
 adventure.74.desc_monster:0 "The beast is still out there, and the farmers who posted the bounty have begun moving their herds to the next valley. The Guild has raised the bounty and taken the company's name off the board."
 adventure.74.desc_intrigue:0 "The ledger is gone, burned or sold, and the people named in it have had time to put their affairs in order. The Guild files the contract under Unresolved and asks the company not to discuss it."
 adventure.74.desc_ruin:0 "The ruin has kept its secrets, along with a good deal of the company's gear. The Guild files the contract under Unresolved, where it joins the reports of every company that went before."
 adventure.74.desc_relic:0 "The relic stays where it was, and the priests at the site have written to the Guild asking that no more companies be sent. The Guild files the contract under Unresolved."
 adventure.74.desc_escort:0 "The escort road was cut, the cargo lost, and the client has gone to a lawyer. The Guild files the contract under Unresolved and starts looking for a lawyer of its own."
 adventure.74.desc_rival:0 "The company comes back alone. The Gray Lantern's broken pole was still lying across the gate of the fold when the party withdrew, and the Guild has struck that company's name from its rolls."
 adventure.4100.t:0 "Words at the Watchfire"
 adventure.4100.desc:0 "The argument between [SCOPE.sChar('adv_companion').GetName|Y] and [SCOPE.sChar('adv_companion_2').GetName|Y] began over whose turn it was to carry the water, and by the third night it has become an argument about everything either of them has done since the guild hall. The porters have started taking sides, and the cook has begun serving the two of them at opposite ends of the fire.\n\nEach has come to [ROOT.GetCharacter.GetName|Y] separately to ask for a ruling. A ruling will please one of them, while splitting the watches would keep them apart and leave the camp short of sleep."
 adventure.4100.a:0 "Sit them both down and settle it before morning."
 adventure.4100.b:0 "Split the watches and keep them apart until the road does it for us."
 adventure.4101.t:0 "The Home Road"
 adventure.4101.desc:0 "The road passes within half a day of the village where [SCOPE.sChar('adv_companion').GetName|Y] grew up, and since the last ford the companion has been naming every farm and every bend before anyone asks. By the time the party makes camp there is a boy at the edge of the firelight with a message from the village headman, who would be honored to feed the whole company.\n\nA night at the companion's hearth would cost a day and mean a great deal. The village is also full of people who remember the companion as a child, and who will want to know whether the ruler is pleased with them."
 adventure.4101.a:0 "Take the day and eat at their mother's table."
 adventure.4101.b:0 "Send our thanks and keep to the road."
 adventure.4102.t:0 "A Better Offer"
 adventure.4102.desc:0 "The scout saw [SCOPE.sChar('adv_companion').GetName|Y] drinking at the last inn with a man in good boots who paid for both cups, and this morning the companion is unusually quiet about where the road goes next. The man in good boots carries letters for a rival household, and households that hire away another company's people mid-contract usually pay double to do it.\n\nThe companion has not yet said yes. They have not said no either, and the rest of the party is watching to see what the ruler does about it."
 adventure.4102.a:0 "Ask them plainly, in front of the others, what they were offered."
 adventure.4102.b:0 "Raise their share before anyone else can."
 adventure.4102.c:0 "Let them go, and tell the man in good boots he is welcome to them."
 adventure.4103.t:0 "Sent Home"
 adventure.4103.desc:0 "The wound [SCOPE.sChar('adv_companion').GetName|Y] took has opened again, and this morning the companion needed two porters to get into the saddle. They have asked, very quietly and only once, whether it would shame them to be sent home, and they have made it clear that they will keep riding if the ruler says so.\n\nA carter going back toward the capital would take a passenger for a few coins. The company would be one pair of hands short for the rest of the road, and the companion would not be there for the end of the story."
 adventure.4103.a:0 "Send them home with the carter and a letter in their praise."
 adventure.4103.b:0 "Bind the wound tighter and keep them with us."
 adventure.4104.t:0 "The Old Debt"
 adventure.4104.desc:0 "At the inn tonight a moneylender recognized [SCOPE.sChar('adv_companion').GetName|Y] across the room and sat down at the party's table without being asked. He has a note in the companion's hand from some years ago, a sum that has been growing ever since, and the patience of a man who knows that companies on the road cannot easily leave a town in a hurry.\n\nThe companion says the debt was paid. The moneylender says it was not, and the innkeeper, who has seen this before, has quietly moved the good cups behind the bar."
 adventure.4104.a:0 "Read the note and argue it line by line."
 adventure.4104.b:0 "Pay the note and have him tear it up where we can see."
 adventure.4105.t:0 "The Inscription"
 adventure.4105.desc:0 "[SCOPE.sChar('adv_companion').GetName|Y] has found an inscription on a boundary stone by the road and has been copying it for most of the afternoon, kneeling in the mud with a wax tablet and refusing to move. The script is older than anything in the guild archives, the companion says, and at least one of the words in it is a name that appears in the contract.\n\nThe porters would like to reach the next village before dark. The companion would like another day, and says the stone will not be here when the next company passes, since the farmer who owns the field is going to plough it under."
 adventure.4105.a:0 "Give them the day and help with the copying."
 adventure.4105.b:0 "Copy what can be copied by sunset and ride on."
 adventure.4106.t:0 "The Champion's Challenge"
 adventure.4106.desc:0 "The village the party stops in tonight keeps a champion, a broad young man who wrestles every stranger who will agree to it, and [SCOPE.sChar('adv_companion').GetName|Y] has already agreed. The whole village has turned out, the headman is holding the wagers, and the champion has never lost to anyone from outside the valley.\n\nA win would make the party welcome for as far as the village's name carries. A loss in front of the village, with the ruler watching, would carry just as far, and the companion has stopped listening to advice."
 adventure.4106.a:0 "Let them wrestle, and stand in their corner."
 adventure.4106.b:0 "Pay the headman for an early night and take the companion with us."
 adventure.4107.t:0 "The Fast Day"
 adventure.4107.desc:0 "[SCOPE.sChar('adv_companion').GetName|Y] has announced that tomorrow is a fast day, and that a faithful traveler keeps it by walking no further than a stone can be thrown from the place where they slept. The companion has kept every fast day since childhood and does not intend to break one now, although they say the rest of the party is free to go on without them.\n\nThe road ahead is open and the weather is good. The porters, who have their own gods, would quietly welcome a day of rest."
 adventure.4107.a:0 "Keep the fast with them, all of us."
 adventure.4107.b:0 "Ask what their teachers say about fasts kept on the road."
 adventure.4108.t:0 "The Guide's Story"
 adventure.4108.desc:0 "[SCOPE.sChar('adv_companion').GetName|Y] has been listening to the guide for three days and says the man's story keeps changing in small ways. He has given two names for the village he came from, he knows the road too well for a man who claims never to have walked it, and he stopped talking very suddenly when the companion asked about the last company.\n\nThe guide is the only one who knows the way. He would also be the easiest person in the world to sell the party to, if someone were buying."
 adventure.4108.a:0 "Let the companion question him, gently, by the fire."
 adventure.4108.b:0 "Keep him close, keep him fed, and post a second watch."
 adventure.4109.t:0 "The Light Purse"
 adventure.4109.desc:0 "The quartermaster has counted the company purse twice and come up short both times, by roughly the price of the new boots [SCOPE.sChar('adv_companion').GetName|Y] bought at the last market. The companion says the boots were bought with their own money and that the quartermaster cannot count, and the quartermaster has offered to count again in front of everyone.\n\nThe rest of the party would like this settled before anyone else's share goes missing. The companion would like it settled quietly."
 adventure.4109.a:0 "Settle it in front of everyone, with the purse on the table."
 adventure.4109.b:0 "Dock their share and send the difference home to the treasury."
 adventure.4110.t:0 "Who Leads the Column"
 adventure.4110.desc:0 "[SCOPE.sChar('adv_companion').GetName|Y] has taken to riding at the head of the column and giving the porters orders as though the contract had been signed in the companion's own name. The porters obey because it is easier than arguing, while the other companions have started riding at the back so they do not have to watch.\n\nThe companion is good at it, which makes the matter harder. A word from the ruler would settle who leads the company, and the whole column would hear which way it went."
 adventure.4110.a:0 "Give them the vanguard in name and keep the orders for yourself."
 adventure.4110.b:0 "Ride to the head of the column and stay there."
 adventure.4111.t:0 "Around the Fire"
 adventure.4111.desc:0 "On a cold night with nothing to do but keep the fire going, [SCOPE.sChar('adv_companion').GetName|Y] begins to talk about the first time they ever left home, and the porters, who have heard nothing personal from the companion in weeks, put down their dice to listen. The story wanders through two wars and a bad winter, and then stops at a place the companion clearly did not mean to reach.\n\nThe others are waiting to hear the rest. The companion is looking at the fire, and has not yet decided whether to go on."
 adventure.4111.a:0 "Ask quietly for the rest of the story."
 adventure.4111.b:0 "Throw another log on the fire and talk about the road instead."
 adventure.4200.t:0 "A Letter from the Regent"
 adventure.4200.desc:0 "A rider in the realm's colors caught up with the company at noon, carrying a letter sealed by the regent and written in the careful hand of someone choosing every word. The governors are quarreling, the court is talking about who will speak for the ruler while the ruler is away, and the regent would like to know how long that will be.\n\nThe rider will carry an answer back. A firm letter would steady the court for a while, and someone the court trusts would steady it for longer."
 adventure.4200.a:0 "Write firm orders and send them back by the fastest horse."
 adventure.4200.b:0 "Send [SCOPE.sChar('adv_companion').GetName] home to steady the court."
 adventure.4200.c:0 "Tell the regent the court will keep until we return."
 adventure.4201.t:0 "A Letter from the Treasurer"
 adventure.4201.desc:0 "The treasurer's letter is short and has been sealed twice, once by the treasurer and once by a clerk who added a page of figures. The harvest tax is late, the garrisons want their pay, and the treasury that funded this expedition is close to empty, which the treasurer mentions without quite saying whose fault that is.\n\nThe company carries spare gear and a good deal of rope that would fetch silver in the next town. The treasurer would also accept a promise that the contract fee is coming, if the promise were written in the ruler's own hand."
 adventure.4201.a:0 "Sell the spare gear and send the silver home."
 adventure.4201.b:0 "Promise the fee and keep the gear."
 adventure.4202.t:0 "The Muster Call"
 adventure.4202.desc:0 "The letter that reached the camp this morning was carried by three riders in relays, and it says that the realm is at war. The generals have mustered what they can, the borders are being watched, and the court would like to know whether the ruler means to lead the army or leave it to the men who are already in the field.\n\nThe expedition is far from home and the contract is not finished. A ruler who rides home now leaves the guild with half a story, while a ruler who rides on leaves the generals to fight the war without one."
 adventure.4202.a:0 "Ride home now and take command."
 adventure.4202.b:0 "Leave the war to the generals and finish the contract."
 adventure.4203.t:0 "A Friend at Court"
 adventure.4203.desc:0 "A letter in a hand the ruler knows well, from a friend at court who signs with a single initial, says that [SCOPE.sChar('adv_schemer').GetName|Y] has been holding dinners while the ruler is away. The guests have been well chosen, the wine has been good, and the talk after the second course has turned more than once to who would be best placed if the ruler did not come home.\n\nThe friend can watch, for a price, or carry a gift and a warm letter that would remind the host whose table they eat at. The friend would rather not be asked to do both."
 adventure.4203.a:0 "Ask our friend to watch every dinner and write after each one."
 adventure.4203.b:0 "Send a generous gift and a warm letter to the host."
 adventure.4204.t:0 "Envoys at the Capital"
 adventure.4204.desc:0 "The steward writes that envoys from a neighboring court have arrived at the capital with gifts and a letter they will deliver only to the ruler's own hands. They have been housed and fed for a week, and they have begun asking the servants how long a ruler's expedition usually lasts, which the steward suspects is the question their own court sent them to answer.\n\nThe steward could receive them in the ruler's name, although that would cost some standing at court. The envoys could also be made to wait, which costs nothing now and something later."
 adventure.4204.a:0 "Have the steward receive them in my name."
 adventure.4204.b:0 "Let them wait. They came to us."
 adventure.4204.c:0 "Write to them myself from the road."
 adventure_companion_leaves_tt:0 "#Y [SCOPE.sChar('adv_companion').GetName]#! #R leaves the company.#! Their skills go with them."
 adventure_called_home_tt:0 "#Y The expedition ends here.#! It is recorded as a hard-won return, and the contract leaves nothing unfinished behind."
 adventure.4021.t:0 "The Warrant on the Post"
 adventure.4021.desc:0 "The warrant naming the outlaw has been nailed to the post at every crossroads since the capital, and at every crossroads since the river someone has torn it down again. The villagers in this valley say the outlaw has never robbed a local, that he pays for his bread, and that the reward on the warrant is more than the village has seen in coin in ten years.\n\nAn old woman at the well says she knows which farm he sleeps at when it rains. Her neighbors are watching her say it, and they are not pleased."
 adventure.4021.a:0 "Hear the old woman out, somewhere her neighbors cannot see."
 adventure.4021.b:0 "Nail the warrant back up and ride on."
 adventure.4022.t:0 "The Chief's Herald"
 adventure.4022.desc:0 "A herald from the border chief meets the company two days short of the meeting place, with a staff of office and a list of conditions the chief wants agreed before the parley can begin. The list covers where each side will camp, how many armed men each may bring, who speaks first, and which gods will witness, and it runs to both sides of the hide.\n\nThe herald is plainly ready to argue every line, and just as plainly hopes not to. He mentions that his chief has never yet broken a parley, and that the last envoy who refused the conditions was sent home with his horse's tail cut off."
 adventure.4022.a:0 "Argue the conditions line by line, here on the road."
 adventure.4022.b:0 "Accept every condition and send the herald back with a gift."
 adventure.4023.t:0 "The Broken Cairn Line"
 adventure.4023.desc:0 "The guild's last surveyors built a line of cairns across the high ground to mark their route, one every half mile, and the party has been following them since dawn. The fourth cairn has been kicked apart, the fifth is missing entirely, and the sixth has been rebuilt by someone who did not know how the guild sets its stones, so that it points the wrong way.\n\nThe scholar can rebuild the line from the survey notes, which would take a day. The guide would rather follow the cattle trail below, which runs in roughly the right direction and has never been surveyed by anyone."
 adventure.4023.a:0 "Rebuild the cairn line from the survey notes."
 adventure.4023.b:0 "Follow the cattle trail and trust the guide."
 adventure.4024.t:0 "The Same Claw Marks"
 adventure.4024.desc:0 "The first kill the party finds on the road has claw marks the scout recognizes at once, four deep cuts and a fifth, shallower one, where the beast drags a toe it was wounded in last time. The farmers say the kills started again in the spring, and that this time the beast takes the herd dogs first, as though it has learned which animals give warning.\n\nThe beast has learned from the last company that hunted it. The party has the advantage of having been that company, provided the scout is right about the toe."
 adventure.4024.a:0 "Follow the dragging toe and learn where it beds down now."
 adventure.4024.b:0 "Hire the farmers' dogs and let the beast come to us."
 adventure.4025.t:0 "A Familiar Hand"
 adventure.4025.desc:0 "The ransom letter that reached the guild was written in the same careful clerk's hand as the one the party carried home after the last rescue went wrong, and the clerk has grown confident. This letter names a price, a place, and a date, and it adds a line hoping that the guild will send the same company as before, since they already know the way.\n\nThe captor has been waiting for this. A party that arrives on the date and at the place will be expected, while a party that comes early or late might find the camp less ready for them."
 adventure.4025.a:0 "Come early, by a road the letter does not name."
 adventure.4025.b:0 "Arrive on the date, at the place, as the letter asks."
 adventure.4026.t:0 "Pages for Sale"
 adventure.4026.desc:0 "In the market of a town on the road, a bookseller is offering single pages torn from a ledger, and the scout recognizes the hand on them as the same one the party failed to recover last time. Each page names a few officials and a few sums, and each is priced according to how important the names are, which means someone in the town knows exactly what they are selling.\n\nThe bookseller says he buys from a carter who passes through every month. The carter is due tomorrow, and the bookseller would like to know why the party is so interested."
 adventure.4026.a:0 "Buy one page and wait for the carter."
 adventure.4026.b:0 "Buy every page he has and burn the ones that matter."
 adventure.110.t:0 "The Outlaw's Friends"
 adventure.110.desc:0 "The outlaw named in the warrant is living in the open, eating at the villages' tables and sleeping in a different barn every night, and every village in the district is feeding him. He robs only tax carts and the stewards of absent landlords, he pays for what he eats, and the villages have learned that a man the steward hates is a man worth keeping.\n\nTaking him in a village means taking him in front of people who will remember who did it. The district reeve will pay informers if the party wants to buy the barn he sleeps in tonight, although informers in this district have a way of being found in ditches."
 adventure.110.a:0 "Track him from barn to barn without asking anyone anything."
 adventure.110.b:0 "Watch the villages and see who carries bread out after dark."
 adventure.110.c:0 "Pay the reeve's informers."
 adventure.111.t:0 "The Outlaw's Wedding"
 adventure.111.desc:0 "The outlaw is to be married on the next market day to the miller's daughter, in front of the whole village, and the village has invited every armed man in the district to the feast so that no one will be fool enough to start anything there. The bride's father has been heard to say that a son-in-law with a price on his head is still a son-in-law, and that he would rather it were a smaller price.\n\nThe outlaw will be sober and unarmed only once in the whole affair, during the vows. The miller would quietly accept a payment that lowered the price."
 adventure.111.a:0 "Find the road he takes home from the feast and wait there."
 adventure.111.b:0 "Take him at the vows, in front of everyone."
 adventure.111.c:0 "Pay the miller and let the wedding go ahead without the groom."
 adventure.112.t:0 "Terms at the Ford"
 adventure.112.desc:0 "The border chief has come to the ford with exactly the number of riders the herald agreed and not one more, and he is sitting on his horse in the middle of the river, where the water is deepest, waiting for the ruler's party to come to him. Whoever crosses to the other has conceded something before a word is said, and both sides know it, which is why nobody has moved for most of the morning.\n\nThe chief's riders are getting cold. So are the porters, and one of them has already asked whether the ford can be crossed further up, where the water is shallow and the gods are presumably less particular."
 adventure.112.a:0 "Ride out to meet him exactly halfway, and get wet doing it."
 adventure.112.b:0 "Wait him out on the bank and send over hot wine."
 adventure.112.c:0 "Send gifts across first, and let them speak for us."
 adventure.113.t:0 "The Hostage Exchange"
 adventure.113.desc:0 "The chief will talk peace only after hostages have been exchanged, one of rank from each side, to be returned when the terms are sworn. He has sent his youngest nephew, a cheerful boy of twelve who has already made friends with the porters, and he expects someone of equal standing in return, since a hostage of no standing is an insult.\n\nThe company has no one of the right rank to spare except the ruler's own companions. The chief's shaman says that a large enough gift of silver has stood in for a hostage before, in hard years, although never in a good one."
 adventure.113.a:0 "Offer our own word as the hostage, and make the chief believe it."
 adventure.113.b:0 "Hold the nephew as an honored guest and talk terms over his head."
 adventure.113.c:0 "Pay the silver in place of a hostage."
 adventure.114.t:0 "The Blank on the Map"
 adventure.114.desc:0 "The guild map of the district has a blank in the middle of it, a valley that every earlier survey walked around rather than through, and the local guides will not say its name. The surveyors' notes give no reason for the blank, only a line in three different hands across three different years saying that the valley was not surveyed this season.\n\nThe guides will go as far as the ridge and no further. Shepherds from the next district would take the party in for a fee, although they say the valley has no name because names are what it listens for."
 adventure.114.a:0 "Read the old surveyors' notes for what they left out."
 adventure.114.b:0 "Walk into the valley and survey it properly."
 adventure.114.c:0 "Hire the shepherds and do not ask them its name."
 adventure.115.t:0 "The Contradicting Stones"
 adventure.115.desc:0 "Two earlier surveys of the district disagree by half a mile on where the boundary of the realm runs, and both sets of survey stones are still standing, one set carved with a crown and the other with a tower. The farmers on the strip between them have paid taxes to whichever collector arrived first for forty years, and they would very much like the matter left exactly as it is.\n\nThe new survey will settle it for good. The farmers' elder has made the party a quiet offer of hospitality for as long as the measuring takes, provided the measuring takes a very long time."
 adventure.115.a:0 "Measure from the oldest fixed point and let the stones fall where they fall."
 adventure.115.b:0 "Find out which stones were moved, and when."
 adventure.115.c:0 "Hire the district's own surveyor and accept his line."
 adventure.120.t:0 "The Beast Remembers"
 adventure.120.desc:0 "The beast the last company failed to kill has made its den in the same place, under the same roots, and this time it has fouled every approach with the bones of the animals it took over the winter. It is bigger than it was, and it carries the old wound on its left forefoot, where the last company's spear went in and was broken off.\n\nThe farmers who posted the first bounty have doubled it out of their own pockets. They have also stopped believing that the guild can do the job, and they say so to the party's faces."
 adventure.120.a:0 "Go in on the left side, where the old wound slows it."
 adventure.120.b:0 "Clear the bones and draw it out into the open."
 adventure.120.c:0 "Hire every hunter in the district and close the ring together."
 adventure.121.t:0 "The Captor's Second Trade"
 adventure.121.desc:0 "The captor who escaped the last rescue has set up in a fortified farmhouse with better walls, better men, and a better class of prisoner, a merchant's family whose ransom has already been half paid. The captor recognizes the party from the wall and calls down a greeting, along with the news that the price has gone up because of who has come to collect.\n\nThe captor's men are paid by the week, and some of them have heard what happened to the men who held the last tollhouse. The merchant has sent the rest of the ransom with the party, in case it is needed."
 adventure.121.a:0 "Talk to the hired men, not the captor."
 adventure.121.b:0 "Take the farmhouse before the price goes up again."
 adventure.121.c:0 "Pay the ransom and follow the captor's men home."
 adventure.122.t:0 "The Ledger's New Owner"
 adventure.122.desc:0 "The ledger the party failed to recover has a new owner, a quiet official in the provincial treasury who has used it to make himself indispensable to every name written in it. He receives visitors in an office with two doors, keeps a clerk at each one, and has let it be known that if anything should happen to him, the ledger goes to the capital in a sealed box.\n\nThe officials named in the ledger would pay well to have it taken from him. The official himself would pay better to have the party go home and report that it was burned."
 adventure.122.a:0 "Get one of the named officials to open the second door for us."
 adventure.122.b:0 "Win over the clerks at both doors."
 adventure.122.c:0 "Pay for a forged report and a real ledger."
 adventure.2.i:0 "#Y Bounty:#! bring in the outlaw the district keeps feeding."
 adventure.2.j:0 "#Y Parley:#! carry the realm's terms to a border chief."
 adventure.2.k:0 "#Y Survey:#! map the ground the guild keeps walking around."
 adventure.2.l:0 "#Y The Beast Returns:#! finish the hunt we left undone."
 adventure.2.m:0 "#Y The Captor's Trail:#! the one who got away is trading again."
 adventure.2.n:0 "#Y The Ledger Resurfaces:#! someone is selling the pages we lost."
 adventure_province_7_tt:0 "#Y Bounty contract#! at [SCOPE.sP('adventure_province_7').GetName|Y].\n#G Best with a Scout#! (Finesse 9+, Cautious or Suspicious)."
 adventure_province_8_tt:0 "#Y Parley contract#! at [SCOPE.sP('adventure_province_8').GetName|Y], on the border.\n#G Best with a Diplomat#! (Charisma 9+)."
 adventure_province_9_tt:0 "#Y Survey contract#! at [SCOPE.sP('adventure_province_9').GetName|Y].\n#G Best with a Scholar#! (Zeal 9+, Scholar, Pious, Mage or Cleric)."
 adventure_nemesis_beast_tt:0 "#Y Monster contract#! at [SCOPE.sP('adventure_province_2').GetName|Y]. The beast that escaped us is back, and bigger.\n#G Best with a Warrior.#! Success pays #G +100 gold#! and #G +6 popularity#! more, and settles it."
 adventure_nemesis_captor_tt:0 "#Y Rescue contract#! at [SCOPE.sP('adventure_province_1').GetName|Y]. The captor who got away has new prisoners.\n#G Best with a Diplomat.#! Success pays #G +100 gold#! and #G +6 popularity#! more, and settles it."
 adventure_nemesis_ledger_tt:0 "#Y Intrigue contract#! at [SCOPE.sP('adventure_province_3').GetName|Y]. The ledger we lost has a new owner.\n#G Best with a Diplomat.#! Success pays #G +100 gold#! and #G +6 popularity#! more, and settles it."
 adventure_bonus_short_tt:0 "#G Short-handed share:#! every empty seat pays extra gold and popularity."
 adventure_bonus_nemesis_tt:0 "#G An old score settled:#! +100 gold and +6 popularity."
 adventure.6100.t:0 "The Sleeping Dragon"
 adventure.6100.desc:0 "The last chamber is a dragon's hoard, and the dragon is asleep on it. Each breath lifts a drift of old coin and lets it fall again with a sound like rain on a roof, and the heat coming off the scales has softened the wax seals on every chest within twenty paces. Lying across the nearest pile, as though it had been dropped there on purpose, is a spear with a blackened head that the scholar says was made for exactly this.\n\nThe dragon has not woken in the time it took the party to light a lamp. The porters are already backing toward the passage, and the scout is looking at the spear."
 adventure.6100.a:0 "Take the spear from the hoard while it sleeps."
 adventure.6100.b:0 "Wake it, and fight for the whole hoard."
 adventure.6100.c:0 "Back out quietly and tell no one but the guild."
 adventure.6101.t:0 "The Crown in the Well"
 adventure.6101.desc:0 "The village well has gone foul, and when the party lowers a lamp to see why, the light catches gold at the bottom, a crown sitting upright on the silt as though someone had set it there and expected to come back. The village elders say the well was dug by a king who lost his realm in a single season, and that every generation someone climbs down for the crown and comes up empty-handed.\n\nThe scholar says the stories are all the same story, told about different kings. The elders say that is exactly what a crown in a well would want people to think."
 adventure.6101.a:0 "Climb down and bring it up."
 adventure.6101.b:0 "Sell the elders the story of where it lies and leave it in the well."
 adventure.6102.t:0 "The Last of the Old Guild"
 adventure.6102.desc:0 "In the deepest room of the site an old man is sitting at a desk under a lamp, writing in a ledger, and he looks up as though the party were late. He says he was a guildmaster when the Adventurer's Guild still met in a single room above a tavern, and that he came here to finish the contract the guild gave him, which he admits has taken somewhat longer than the fee allowed for.\n\nHe has the guild's original charter in a chest beside him, and he would like it to go home with someone who will keep its terms. He has not yet decided whether the party is that someone."
 adventure.6102.a:0 "Swear to the charter's terms and carry it home."
 adventure.6102.b:0 "Sit with him a while and hear how the guild began."
 adventure.6103.t:0 "The Hammer in the Altar"
 adventure.6103.desc:0 "A war hammer has been driven head-first into the altar stone, so deep that only the haft stands out, and the priests say it has been there since before the temple was built around it. Every pilgrim who comes here tries to draw it, and the stone around the haft is worn smooth by generations of hands, although none of the priests has ever seen it move.\n\nThe priests do not mind the party trying, since a failed attempt is a kind of prayer. They mind very much the idea of someone succeeding, and they have not yet thought about what they would do if it happened."
 adventure.6103.a:0 "Take hold of the haft and pull."
 adventure.6103.b:0 "Leave the hammer where it stands and pray beside it."
 adventure.6110.t:0 "The Blades Keep Their Word"
 adventure.6110.desc:0 "Before the last stretch of the approach, the party meets the hungry men from the road again, the ones who were talked down and paid for their information. Their leader has shaved, bought a new belt, and walked a day out of his way to say that the passage ahead is watched from both sides and that the watchers change at moonrise.\n\nHe wants nothing for it. He says that a man who is paid fairly once remembers it longer than a man who is paid well twice, and his men are standing a little behind him in case the ruler would like them to come along."
 adventure.6110.a:0 "Take his advice and go in at moonrise."
 adventure.6110.b:0 "Bring his men along and go in at once."
 adventure.6111.t:0 "The Map's Other Half"
 adventure.6111.desc:0 "The merchant's map was only half a map. The party learns this when his partner, a thin woman with ink on her fingers and a second sheet in her sleeve, catches up with them at the edge of the district and explains that the two halves are always sold separately, because nobody would buy the second half if they had seen the first.\n\nThe second half shows the way out. She will sell it at a fair price, she says, which she has worked out by estimating how badly the party wants to come back."
 adventure.6111.a:0 "Pay her price for the way out."
 adventure.6111.b:0 "Work out the second half from the first."
 adventure.6111.c:0 "Go back the way the party came in."
 adventure.6112.t:0 "The Spirit's Warning"
 adventure.6112.desc:0 "At the threshold of the last chamber, the pale figure the party freed from its chain is waiting, no longer bound and no longer apologizing. It says that it kept the warning for three hundred years, and that the least it can do for the people who freed it is deliver the warning in person.\n\nThe warning is short and specific, and it concerns the third step past the door. The spirit asks for nothing in return, although it would like someone to remember its name, which it has not said aloud in three hundred years either."
 adventure.6112.a:0 "Learn its name and heed the warning."
 adventure.6112.b:0 "Thank it, and trust our own eyes on the third step."
 adventure_old_charter_tt:0 "The realm gains #G The Old Guild Charter#! for ten years."
 omni_adventure_old_guild_charter:0 "The Old Guild Charter"
 omni_adventure_old_guild_charter_desc:0 "The Adventurer's Guild's founding charter, carried home from the deep and kept by the realm."
 omni_adventure_lone_legend:0 "Lone Legend"
 omni_adventure_lone_legend_desc:0 "Went alone where companies fail, and came back with the proof."
 adventure.73.desc_called_home:0 "The ruler rides home before the contract is finished, called back by the realm's own business, and the company follows a few days behind with the gear and the unfinished story. The Guild records the expedition as a hard-won return and keeps the contract open, since nothing that was started has yet been lost."
 adventure.71.desc_bounty:0 "The outlaw comes into the capital in chains, with half the district walking behind to see whether the ruler will hang him or hire him. The Guild pays the bounty in full and pins the torn warrants to the wall beside the contract board, where they make a better story than the one on the warrant ever did.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.71.desc_parley:0 "The border chief swears the terms in front of both camps, and then insists on feasting the company for three days, during which he swears several more. The Guild files the treaty with the court and the drinking songs with its own archive, where the clerks agree they are the more valuable record.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.71.desc_survey:0 "The company comes home with the blank on the map filled in, the cairn lines rebuilt, and a survey so complete that the court's own geographers ask to borrow it. The Guild has it copied twice and keeps both copies.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.71.desc_nemesis_beast:0 "The beast that escaped the last company is dead, and its broken-off spearhead comes home with it, pulled from the old wound and polished by the farmers who doubled the bounty. The Guild hangs both above the contract board and stops mentioning the first attempt.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.71.desc_nemesis_captor:0 "The captor who escaped the last rescue is in chains, the merchant's family is home, and the clerk's careful letters have been bound together and presented to the Guild as evidence. The Guild has them read aloud at the next meeting, to general satisfaction.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.71.desc_nemesis_ledger:0 "The ledger is home at last, all of its pages, and the quiet official who kept it has been given a much quieter office far from any treasury. Several of the names in it have sent the ruler gifts, and the Guild has sent a bill.\n\nThere are three ways to spend a legend: on the realm, on the people who made it, or on the ruler who will be telling it at dinner for the next twenty years."
 adventure.72.desc_bounty:0 "The outlaw is in custody and the bounty is paid. The villages that fed him have gone quiet, and the reeve has been advised not to visit them for a season."
 adventure.72.desc_parley:0 "The border chief has sworn the terms, and the realm's border is quieter by one argument. The Guild has filed the treaty and asked, gently, whether anyone kept the herald's list."
 adventure.72.desc_survey:0 "The survey is finished, the new stones are set, and the Guild has added the district to its maps. The farmers on the boundary strip have already begun arguing with the new line."
 adventure.72.desc_nemesis_beast:0 "The beast is dead at last, and this time it stays dead. The farmers have taken back their pastures and the Guild has taken back its reputation."
 adventure.72.desc_nemesis_captor:0 "The captor is taken and the prisoners are home. The Guild has marked both contracts settled, the old one and the new."
 adventure.72.desc_nemesis_ledger:0 "The ledger is recovered and its new owner has been persuaded to retire. The Guild marks the matter closed, and hopes it means it this time."
 adventure.73.desc_bounty:0 "The outlaw slipped away into the hills, but his friends in the villages have stopped feeding him, and the warrant now stays up on the posts. The Guild pays a part of the bounty for that."
 adventure.73.desc_parley:0 "The chief agreed to some terms and refused others, and both sides went home claiming to have won. The Guild has filed the parts that were sworn."
 adventure.73.desc_survey:0 "Most of the district is surveyed, although the blank in the middle of the map is smaller rather than gone. The Guild has paid for what was measured."
 adventure.73.desc_nemesis_beast:0 "The beast was wounded again and driven deeper into the wilds. The farmers have not asked for their money back, but they have not said thank you either."
 adventure.73.desc_nemesis_captor:0 "Some of the prisoners came home, and the captor's farmhouse has been burned. The captor was not inside it when it burned."
 adventure.73.desc_nemesis_ledger:0 "Half the ledger was recovered, and the other half is still in a sealed box somewhere on the road to the capital. The Guild is watching the road."
 adventure.74.desc_bounty:0 "The outlaw is still free, and the district now sings a song about the company that came to take him. The Guild files the contract under Unresolved and asks the company not to learn the song."
 adventure.74.desc_parley:0 "The chief left the ford before anything was sworn, and the border is no quieter than it was. The Guild files the contract under Unresolved."
 adventure.74.desc_survey:0 "The survey was abandoned, the cairns are down again, and the blank on the map is exactly where it was. The Guild files the contract under Unresolved."
 adventure.74.desc_nemesis_beast:0 "The beast has beaten the guild twice now, and the farmers have begun leaving offerings for it instead. The Guild files the contract under Unresolved, again."
 adventure.74.desc_nemesis_captor:0 "The captor has escaped a second time and doubled the price of everyone held. The Guild files the contract under Unresolved, again."
 adventure.74.desc_nemesis_ledger:0 "The ledger's owner has sent the guild a polite letter thanking it for the visit. The Guild files the contract under Unresolved, again."
 adventure.1.desc_p1:0 "#Y [ROOT.GetCharacter.Custom('omni_adv_contract_name')]#! at #Y [SCOPE.sP('adventure_target').GetName]#!. The board wants a #G [ROOT.GetCharacter.Custom('omni_adv_contract_wants')]#!.\n\n#Y Company:#! [ROOT.GetCharacter.GetName] and [SCOPE.sChar('adventure_member_1').GetName], with two seats open.\nEvery empty seat makes the road harder and the share larger."
 adventure.1.desc_p2:0 "#Y [ROOT.GetCharacter.Custom('omni_adv_contract_name')]#! at #Y [SCOPE.sP('adventure_target').GetName]#!. The board wants a #G [ROOT.GetCharacter.Custom('omni_adv_contract_wants')]#!.\n\n#Y Company:#! [ROOT.GetCharacter.GetName], [SCOPE.sChar('adventure_member_1').GetName] and [SCOPE.sChar('adventure_member_2').GetName], with one seat open.\nEvery empty seat makes the road harder and the share larger."
 adventure.1.i:0 "Set out with the company as it stands."
 adventure.1.j:0 "Go alone."
 adventure_short_party_tt:0 "#Y Short-handed:#! #R -4 readiness#! for each empty seat, and the ruler covers the missing roles.\nIf the contract succeeds, each empty seat pays #G +50 gold#! and #G +3 popularity#!."
 adventure_solo_tt:0 "#R Alone:#! #R -12 readiness#!, and every wound falls on the ruler. #R A ruler who fails alone while already wounded may not come home.#!\nSuccess pays #G +150 gold#! and #G +9 popularity#!. A legendary return alone makes the ruler a #G Lone Legend#! for ten years."
