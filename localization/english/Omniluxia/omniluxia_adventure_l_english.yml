 adventure.57.c:0 "Let our dwarf read the old marks and set the pace."
 adventure.57.desc_dwarf:0 "The cave mouth breathes cold air over a scatter of abandoned tools, and [ROOT.GetCharacter.GetName|Y] knows the makers' marks on them before anyone else has picked one up. They are dwarven tools of an old pattern, laid out in the careful order a crew uses when it means to come back, and the stones piled deeper in are a waymark every dwarven miner learns before learning to read.\n\nAnother party's ropes are already tied off at the edge. Their owners did not know what the piles meant, and they are not in evidence."
 adventure.6045.c:0 "Let our dwarf read the old marks and set the pace."
 adventure.6045.desc_dwarf:0 "Far below the surface, traders who have not seen daylight in generations hold a market in total darkness, and they fall silent when [ROOT.GetCharacter.GetName|Y] speaks, because the trade-cant of the deep halls has not been heard down here since their grandparents' time. Prices are set by touch and change is given in pebbles, and the oldest trader asks to feel the ruler's hands before naming a price.\n\nEveryone here can hear the party's purses. For once, they can also hear someone who knows what a fair weight feels like."
 adventure.52.c:0 "Go down to the altar and speak to the dead in their own manner."
 adventure.52.desc_undead:0 "Every lamp at the holy site burns with a clean white flame, and when [ROOT.GetCharacter.GetName|Y] comes within sight of the gate the flames lean away like grass in a wind. The priests have barred the inner hall against something beneath the altar that answers prayers in the voices of the dead, and they now watch the party with the look of men who think the problem has come to them.\n\nThe senior priest says the dead below stopped answering when the party arrived. He is not sure whether to be grateful."
 adventure.56.c:0 "Answer the wards in the same script and ask leave to pass."
 adventure.56.desc_elf:0 "The trees near the site lean inward, their bark carved with fresh symbols no map mentions, and [ROOT.GetCharacter.GetName|Y] can read them, because they are a warding script the old forest houses still teach their children. Someone has warded the road shut and left the signs as a courtesy, the way a household bars its door and leaves a lamp in the window.\n\nCutting straight through would be quicker. To anyone who can read the signs, it would also be very rude."
 adventure.54.c:0 "Walk up to the postern and knock until it opens."
 adventure.54.desc_orc:0 "The city has locked its gates to strangers, and when [ROOT.GetCharacter.GetName|Y] rides up to the last open postern the guards close that one too, slowly, so that nobody can call it rude. Rumors move freely through every tavern inside, about a missing person, a stolen ledger, and a locked district, and by evening they include a new one about a war-band camped outside the walls.\n\nThe alleys will talk for coin. They will also, it turns out, talk very quickly to anyone who frightens them."
 adventure.55.c:0 "Wade out to the breakers at night and listen."
 adventure.55.desc_sea_elf:0 "On the coast, wreckage has washed ashore without a storm, and the harbor master insists no ship is missing. The fishers know [ROOT.GetCharacter.GetName|Y] for one of the sea-born the moment the party reaches the strand, and the eldest of them comes down to the waterline to ask, very politely, what the lights beyond the breakers are saying.\n\nThe fishers know the tides. They believe the sea elves know what lives under them, and they have decided that the party's arrival is the answer to something."
 adventure.4012.c:0 "Lead the first dance and bless the couple."
 adventure.4012.desc_halfling:0 "The road runs through a village in the middle of a wedding, and when the bride's father sees that [ROOT.GetCharacter.GetName|Y] is a halfling he sends a boy running for the good cheese. In this valley the little folk are counted lucky at a wedding, and a halfling guest who stays for the dancing is talked about at every naming feast for a generation.\n\nThe feast will run until the second night. A generous gift and an early departure might satisfy custom, although the bride's mother has already set a place at the head table."
 adventure.6049.c:0 "Walk the beds and tell the farmers what they need."
 adventure.6049.desc_mycelar:0 "Pale fungus grows in long tended beds along the cavern floor, and the farmers who keep them stop work and stare at [ROOT.GetCharacter.GetName|Y], because down here the mycelar are spoken of as the beds' cousins. Their headwoman explains that every traveler leaves a candle at the shrine, since a bed that sees too much flame stops bearing for a season, and then asks whether a mycelar would rather simply walk across them in the dark.\n\nThe party has candles enough for the road and none to spare. The farmers would be honored to be asked how their beds are doing."
 adventure_option_race_dwarf_tt:0 "#G A dwarf in the company#! knows the marks, the cant, and the stone."
 adventure_option_race_undead_tt:0 "#G One of the dead walks with the company,#! and the dead below will listen."
 adventure_option_race_elf_tt:0 "#G An elf in the company#! can read and answer the forest wards."
 adventure_option_race_orc_tt:0 "#G An orc, goblin or hobgoblin in the company#! gets doors opened, one way or another."
 adventure_option_race_sea_elf_tt:0 "#G A sea elf in the company#! hears what the tide carries."
 adventure_option_race_halfling_tt:0 "#G A halfling in the company#! is welcome at any feast in this valley."
 adventure_option_race_mycelar_tt:0 "#G A mycelar in the company#! is kin to these beds."
 adventure.6120.t:0 "One Fewer at the Fire"
 adventure.6120.desc:0 "[SCOPE.sChar('adventure_fallen').GetName|Y] took the first wound well and the second one badly, and by the time the porters had the fire lit the companion was gone. The others have laid them out under a cloak at the edge of the camp, and nobody has yet said what everyone is thinking, which is that the contract is not finished and the road goes on in the morning.\n\nThe ground here is soft enough to dig. The capital is many days behind, and a body carried that far slows a company that is already one pair of hands short."
 adventure.6120.a:0 "Bury them by the road and mark the place for the guild."
 adventure.6120.b:0 "Carry them home to their family, however long it takes."
 adventure.75.t:0 "The Ruler Did Not Return"
 adventure.75.desc:0 "The guild sent a rider ahead of the company, and he reached the capital two days before them with a sealed letter and his hat in his hand. [SCOPE.sChar('adventure_fallen').GetName|Y] went where the contract led and did not come back from it, and the companions who are still walking home are bringing what proof they could carry.\n\nThe court has already begun to gather around the heir. In the guild hall, the clerks have taken the contract down from the board and laid it, unfiled, on the guildmaster's desk."
 adventure.75.a:0 "The realm will remember where they fell."
 adventure_mortal_risk_tt:0 "#R This could kill the ruler.#! There is no second attempt."
 omni_adv_wound_yes:0 "   #R(wounded: a second wound can kill)#!"
