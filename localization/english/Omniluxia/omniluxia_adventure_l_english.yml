l_english:
 go_on_adventure:0 "Go On An Adventure"
 go_on_adventure_act:0 "#Y Send $CHAR$ and a hand-picked party after one of the Adventurer's Guild's more alarming contracts.#!"
 is_on_omni_adventure_tt:0 "Has not gone on an adventure in the last 3 years and is not already on one."
 adventure_requires_party_tt:0 "There must be at least three available adult characters in the country. Even the Guild frowns upon sending a lone fool into certain doom."

 adventure.1.t:0 "Pick Your Party"
 adventure.1.desc:0 "A curious thing is happening in the hall of the #E Adventurer's Guild#!. Maps have been nailed over maps, old warnings have been copied by nervous scribes, and every sellsword within earshot is loudly explaining why everyone else is doomed.\n\nIn the middle of this excellent confusion stands [ROOT.GetCharacter.GetName], who must choose three companions before the expedition can leave. The Guild recommends courage, caution, and at least one person who can count the rations without eating them."
 adventure.1.a:0 "Invite [SCOPE.sChar('adventurer_candidate_1').GetName] to join the company."
 adventure.1.b:0 "Invite [SCOPE.sChar('adventurer_candidate_2').GetName] to join the company."
 adventure.1.c:0 "Invite [SCOPE.sChar('adventurer_candidate_3').GetName] to join the company."
 adventure.1.d:0 "Invite [SCOPE.sChar('adventurer_candidate_4').GetName] to join the company."
 adventure.1.e:0 "Invite [SCOPE.sChar('adventurer_candidate_5').GetName] to join the company."
 adventure.1.f:0 "Invite [SCOPE.sChar('adventurer_candidate_6').GetName] to join the company."
 adventure.1.g:0 "A fine party. Probably."
 adventure_needs_3_tt:0 "You need 3 more companions to complete the party."
 adventure_needs_2_tt:0 "You need 2 more companions to complete the party."
 adventure_needs_1_tt:0 "You need 1 more companion to complete the party."

 adventure.2.t:0 "Choose A Quest"
 adventure.2.desc:0 "The guildmasters present their contracts with the solemn dignity of men who will not personally be chased through the dark. One parchment speaks of missing caravans, another of sealed ruins, another of strange claw marks on a shrine door, and several make suspiciously cheerful promises about treasure.\n\nNeedless to say, each road has its admirers. The only question is which disaster sounds most profitable."
 adventure.2.a:0 "Follow the map with the least blood on it."
 adventure.2.b:0 "Search the wilds where the witnesses stopped returning."
 adventure.2.c:0 "Investigate the city rumors before they grow legs."
 adventure.2.d:0 "Seek the dangerous country and make a name there."
 adventure.2.e:0 "Pursue the contract everyone keeps avoiding."
 adventure.2.f:0 "Stay near the capital. Danger is more polite when nearby."
 adventure_province_1_tt:0 "The party will travel to [SCOPE.sP('adventure_province_1').GetName]."
 adventure_province_2_tt:0 "The party will travel to [SCOPE.sP('adventure_province_2').GetName]."
 adventure_province_3_tt:0 "The party will travel to [SCOPE.sP('adventure_province_3').GetName]."
 adventure_province_4_tt:0 "The party will travel to [SCOPE.sP('adventure_province_4').GetName]."
 adventure_province_5_tt:0 "The party will travel to [SCOPE.sP('adventure_province_5').GetName]."
 adventure_province_6_tt:0 "The party will travel to [SCOPE.sP('adventure_province_6').GetName]."

 adventure.3.t:0 "Final Preparations"
 adventure.3.desc:0 "[ROOT.GetCharacter.GetName] and the chosen companions gather in the guild yard, where porters are arguing over mule prices, guides are swearing that the old roads are perfectly safe, and half the city has arrived to watch someone else take the risk.\n\nThere is still time to make one last preparation. The party cannot bring everything, but it can at least decide which sort of trouble it intends to disappoint."
 adventure_option_trait_pious_tt:0 "This option is available because your character is Pious."
 adventure_option_trait_brave_tt:0 "This option is available because your character is Brave."
 adventure_option_trait_cautious_tt:0 "This option is available because your character is Cautious."
 adventure_option_trait_suspicious_tt:0 "This option is available because your character is Suspicious."
 adventure_option_trait_scholar_tt:0 "This option is available because your character is a Scholar."
 adventure.3.a:0 "Buy proper supplies, including the boring things that save lives."
 adventure.3.b:0 "Hire scouts and guides who know where not to step."
 adventure.3.c:0 "Ask the priests and mages for wards, blessings, and stern warnings."
 adventure.3.d:0 "Consecrate every boot, blade, and suspiciously quiet mule."
 adventure.3.e:0 "Pack light. Courage is famously easy to carry."
 adventure.3.f:0 "Buy the second map, the third rope, and a guide who looks afraid."

 adventure.4000.t:0 "Tracks In The Rain"
 adventure.4000.desc:0 "Heavy weather smothers the road, turning dust to paste and heroic speeches into wet coughing. By dusk, the party finds two trails where the guild map promised only one.\n\nThe first path is slow, miserable, and marked by old waystones carved with prayers from travelers passing through. The second is fresh, direct, and watched by trees that have become much too quiet."
 adventure.4000.a:0 "Trust the old road and its anxious little stones."
 adventure.4000.b:0 "Take the direct path before good sense catches up."
 adventure.4000.c:0 "Stop, count the waystones, and notice which one is lying."
 adventure.4000.d:0 "Lead from the front. If the trees want trouble, they can ask directly."

 adventure.5.t:0 "The Adventure Begins"
 adventure.5.desc:0 "At last, [ROOT.GetCharacter.GetName] and the companions reach the chosen destination. Seen from the guild board, the contract looked almost respectable. Seen up close, it has acquired several unpleasant details, including a smell that no one wants to identify and locals who go silent whenever the party enters a room.\n\nStill, the road has brought them here...wherever here is. Now the adventure must stop being a story and become a problem to be solved."
 adventure.5.a:0 "Question the locals and learn what they are afraid to say."
 adventure.5.b:0 "Strike before the trail grows cold and the danger grows teeth."
 adventure.5.c:0 "Kick the story's door open and make danger introduce itself."
 adventure.5.d:0 "Watch who stops whispering when the party looks away."
 adventure.5.e:0 "Compare the rumors to older, stranger disasters."

 adventure.6001.t:0 "The Locked Door"
 adventure.6001.desc:0 "The party finds a sealed passage where no honest map admits one should exist. The stones around it have been scratched by desperate hands, the lock is newer than the wall, and from the other side comes the faint sound of something dragging across the floor.\n\nIt can be opened carefully, given patience and steady nerves. Of course, patience also gives whatever waits inside time to arrange itself. [ROOT.GetCharacter.GetName] does not know what to do."
 adventure.6001.a:0 "Open it with care and pretend that is reassuring."
 adventure.6001.b:0 "Force it open before the thing within finishes preparing."
 adventure.6002.t:0 "The Root Bridge"
 adventure.6002.desc:0 "A ravine splits the path ahead, deep enough that thrown stones take an impertinent amount of time to answer. The only crossing is a bridge of living roots twisted together by age, weather, or someone with a questionable sense of charity.\n\nThe far side promises a shorter route and better ground. The near side has the distinct advantage of not being over there."
 adventure.6002.a:0 "Cross one at a time, light-footed and prayer-heavy."
 adventure.6002.b:0 "Rush across before the roots remember gravity."
 adventure.6003.t:0 "Voices By The Fire"
 adventure.6003.desc:0 "At night, the campfire burns blue without asking permission. Old voices speak through the sparks, some whispering warnings, some making accusations, and one helpfully naming a place that no one in camp admits to recognizing.\n\nThe companions sit very still. Even the horses seem unwilling to interrupt."
 adventure.6003.a:0 "Listen until dawn, no matter what answers back."
 adventure.6003.b:0 "Test the story against the map and the party's remaining courage."
 adventure.6004.t:0 "Shrine With No God"
 adventure.6004.desc:0 "The party discovers a spotless shrine without idols, inscriptions, or any symbol that a sensible person could blame later. Its altar is warm, its offerings are fresh, and its silence is so complete that every whispered joke sounds like blasphemy.\n\nSomeone, or something, is being honored here. The rude question is whether it is listening."
 adventure.6004.a:0 "Make a careful offering and step away respectfully."
 adventure.6004.b:0 "Take what the shrine hides. Quietly, if possible."
 adventure.6005.t:0 "A Sudden Collapse"
 adventure.6005.desc:0 "A sharp crack runs through the roof of the cave's passage like a sentence of death being read aloud. Dust pours from the ceiling, pebbles begin to fall, and someone makes the unhelpful observation that they had better run for their lives.\n\nThe party has only moments before the roof gives way and the adventure becomes an excavation."
 adventure.6005.a:0 "Read the fault lines and find the stubborn stones."
 adventure.6005.b:0 "Run through the falling rock and argue with physics later."
 adventure.6006.t:0 "Hungry Blades"
 adventure.6006.desc:0 "Armed wanderers block the route, wearing the expressions of men who have rehearsed their threats and neglected their baths. They claim hunger, lost pay, and a willingness to settle both problems with steel.\n\nTheir leader speaks politely enough, but his knife does not."
 adventure.6006.a:0 "Buy their information before they remember they are criminals."
 adventure.6006.b:0 "Break their nerve and clear the road."
 adventure.6007.t:0 "The Riddle Stone"
 adventure.6007.desc:0 "A black stone blocks the next chamber, its surface opening into a mouth only when the party comes near. It asks questions in three dead languages, two of which sound offended to be spoken aloud.\n\nEach wrong answer makes the floor sink another finger's width. Each correct answer makes the stone look, somehow, more smug."
 adventure.6007.a:0 "Solve it properly and deny the stone its fun."
 adventure.6007.b:0 "Pry out the smaller gems while scholarship looks away."
 adventure.6008.t:0 "The Mirror Pool"
 adventure.6008.desc:0 "A still pool waits in the dark, reflecting not faces but possible futures. In one vision, wounds close and old pains loosen their grip. In another, secrets glitter like coins at the bottom of a well.\n\nThe water is perfectly calm, which is never a good sign."
 adventure.6008.a:0 "Seek the healing vision and leave the rest untouched."
 adventure.6008.b:0 "Steal a useful secret from tomorrow."
 adventure.6009.t:0 "The Wounded Guardian"
 adventure.6009.desc:0 "Something ancient and half-buried blocks the way, too vast to be called a beast and too wounded to be called a threat without feeling cruel. Its cracked hide is packed with old arrows, and one dim eye follows the party with the patience of a broken statue.\n\nThe chamber beyond it is rich. The creature before it is suffering. These facts, tragically, are both true."
 adventure.6009.a:0 "Bind its wounds and hope mercy has a memory."
 adventure.6009.b:0 "Loot the chamber while the guardian weakens."
 adventure.6010.t:0 "The Old Battlefield"
 adventure.6010.desc:0 "Rusty arms, sunken standards, and bones arranged in the impolite geometry of battle litter the ground. Whatever happened here was desperate, organized, and, judging by the silence, very final.\n\nThe party can study the formation and learn from the dead, or strip the field and let the dead keep their secrets."
 adventure.6010.a:0 "Study the old formation and honor its hard lesson."
 adventure.6010.b:0 "Recover what can be sold before rust claims the rest."
 adventure.6011.t:0 "The Poisoned Feast"
 adventure.6011.desc:0 "A welcoming table appears in a sealed room, set with steaming dishes, fresh bread, and cups already poured. No servants wait nearby. No chimney carries smoke. The wine, most offensively, smells excellent.\n\nSomeone meant this hospitality to be found, and that someone had a very theatrical opinion of hunger."
 adventure.6011.a:0 "Test every dish before trusting a generous room."
 adventure.6011.b:0 "Eat quickly, pocket the silver, and let fate complain."
 adventure.6012.t:0 "The Whispering Idol"
 adventure.6012.desc:0 "An idol no taller than a child sits alone on a stone shelf, whispering the party's names in reverse order. Its little mouth does not move. Its little eyes absolutely do.\n\nIt promises victory if carried onward, ruin if ignored, and several other things in a voice that sounds disturbingly familiar."
 adventure.6012.a:0 "Answer with a prayer and leave it where it sits."
 adventure.6012.b:0 "Pocket the idol. It did ask to come along."
 adventure.6013.t:0 "The Flooded Passage"
 adventure.6013.desc:0 "Cold water rises through the stones, swallowing the path one patient inch at a time. Loose gear drifts into the dark. Something bumps against a boot and is unanimously agreed to be debris.\n\nThe party must choose between time and safety, as if those two have ever been friends."
 adventure.6013.a:0 "Build a rope line and cross with dignity intact."
 adventure.6013.b:0 "Dive for the lower tunnel before it disappears."
 adventure.6014.t:0 "A Rival Party"
 adventure.6014.desc:0 "Another band reaches the prize chamber at the same time, tired, suspicious, and very clearly rehearsing lies about having arrived first. Their leader smiles with all the warmth of a tax collector at a funeral.\n\nThere is enough treasure to start an argument and not quite enough to end one."
 adventure.6014.a:0 "Offer a public bargain while everyone can hear it."
 adventure.6014.b:0 "Cut a private deal and hope no one counts too closely."
 adventure.6015.t:0 "The Merchant's Map"
 adventure.6015.desc:0 "A nervous trader produces a map marked with fresh ink, old blood, and several corrections that do not inspire confidence. He claims it shows a shortcut. He also refuses to explain why he is selling it from behind a locked door.\n\nIt may be a shortcut, a trap, or the traditional bargain of being both."
 adventure.6015.a:0 "Pay for the whole story, including the embarrassing parts."
 adventure.6015.b:0 "Compare it to the guild notes before trusting ink with motives."
 adventure.6016.t:0 "The Sleeping Guardian"
 adventure.6016.desc:0 "The next door is watched by a sleeping sentinel large enough to make the doorway seem apologetic. Each breath shakes dust from the lintel, and every snore rolls through the chamber like distant thunder.\n\nOne wrong sound could turn passage into battle. One bold sound could do the same thing faster."
 adventure.6016.a:0 "Move in silence and let the beast keep dreaming."
 adventure.6016.b:0 "Wake it with a challenge worthy of being regretted."
 adventure.6017.t:0 "Singing Crystals"
 adventure.6017.desc:0 "Crystals hum from the walls, each note tugging at memory, bone, and several old embarrassments the party would rather leave buried. The song points deeper into the ruin, clear as a road under starlight.\n\nUnfortunately, the richest shards sing loudest, and greed has always had excellent hearing."
 adventure.6017.a:0 "Follow the true note and ignore the glittering bait."
 adventure.6017.b:0 "Harvest the loudest shards while teeth still feel solid."
 adventure.6018.t:0 "The False Floor"
 adventure.6018.desc:0 "A flawless mosaic spreads across the floor, all heroic kings, grateful priests, and tiny decorative skulls no one likes. Beneath the tiles waits a drop into old machinery, judging by the faint ticking below.\n\nThe pattern can be read, if the party is patient enough and no one steps on the wrong heroic king."
 adventure.6018.a:0 "Trace the safe path one careful tile at a time."
 adventure.6018.b:0 "Spring the mechanism and see what ancient cleverness costs."
 adventure.6019.t:0 "The Deserter Guide"
 adventure.6019.desc:0 "A frightened guide stumbles from a side passage with empty hands raised and a story already falling apart. They offer to lead the party onward, claiming to know the route, the traps, and the name of the thing that took their former companions.\n\nThey know too much about the way ahead, and not nearly enough about why they survived it."
 adventure.6019.a:0 "Question them gently and listen for the lie that hurts."
 adventure.6019.b:0 "Sell them safe passage home. Fear has value."
 adventure.6020.t:0 "The Plague Lantern"
 adventure.6020.desc:0 "A green lantern burns in a room full of sealed beds, each marked with a name, a date, and a warning carved by someone with shaking hands. The air beyond the lamp's glow is thick, sweet, and deeply unwelcome.\n\nThe lantern keeps the sickness back, but only while fed with costly oil. Even mercy, it seems, keeps accounts."
 adventure.6020.a:0 "Use the good oil and keep breathing clean air."
 adventure.6020.b:0 "Push through the fumes before the purse grows lighter."
 adventure.6021.t:0 "The Forgotten Oath"
 adventure.6021.desc:0 "Words cut into the wall accuse the party of trespass, theft, ignorance, bad manners, and several crimes too old to translate. The inner chamber will not open until a promise is spoken aloud.\n\nThe oldest places in the world are very particular about etiquette."
 adventure.6021.a:0 "Swear only what can be kept, however inconvenient."
 adventure.6021.b:0 "Forge a convenient oath and trust the wall's memory is poor."
 adventure.6022.t:0 "The Watchful Village"
 adventure.6022.desc:0 "A village near the site locks every door as the party approaches. Shutters snap closed, children are pulled indoors, and even the dogs seem to have signed a pact of silence.\n\nFrom behind one narrow window, someone whispers the answer to the next danger. Then the shutter closes again, as if kindness were a punishable offense."
 adventure.6022.a:0 "Win their trust and make fear speak plainly."
 adventure.6022.b:0 "Take what the party needs before the village grows braver."
 adventure.6023.t:0 "Tomb Of Coins"
 adventure.6023.desc:0 "A burial chamber is carpeted with coins, each stamped with a different face and arranged around a sarcophagus that has the look of a man who died rich and suspicious. The floor shines beautifully. It also whispers whenever someone bends down.\n\nRemoving the coins carelessly may wake old debts, and old debts tend to charge interest."
 adventure.6023.a:0 "Count and claim the lawful tithe, with witnesses."
 adventure.6023.b:0 "Fill every pack and let the dead audit later."
 adventure.6024.t:0 "Storm-Tossed Cliffs"
 adventure.6024.desc:0 "The route climbs into a storm that seems to have taken the party's existence personally. Rain turns stone slick, wind snatches words from mouths, and every handhold feels like an argument with the sky.\n\nSomewhere above, the path continues. Somewhere below, the ground waits with theatrical patience."
 adventure.6024.a:0 "Climb by discipline, knot by knot and curse by curse."
 adventure.6024.b:0 "Race the storm before it finds a better argument."
 adventure.6025.t:0 "The Silver Bargain"
 adventure.6025.desc:0 "A silver-tongued stranger waits at a crossroads that was not there yesterday. Their cloak is dry despite the weather, their smile is practiced, and their shadow is doing something independent with its hands.\n\nThey offer a shortcut in exchange for a secret, a name, and the first story told when the party returns. This is almost certainly unwise, which is not the same as useless."
 adventure.6025.a:0 "Refuse the bargain and keep every name where it belongs."
 adventure.6025.b:0 "Trade a harmless secret, if such a thing exists."
 adventure.6026.t:0 "The Bound Spirit"
 adventure.6026.desc:0 "A pale figure is chained to a cracked pillar, repeating the same apology in a voice worn thin by centuries. Around it are scratched warnings, prayer marks, and one surprisingly recent complaint about the smell.\n\nFreeing the spirit may reveal the way. It may also erase the warning it was forced to guard. Ancient punishments rarely come with tidy explanations."
 adventure.6026.a:0 "Release it with proper rites and cautious sympathy."
 adventure.6026.b:0 "Demand payment first. Eternity should have savings."
 adventure.6027.t:0 "The Luminous Garden"
 adventure.6027.desc:0 "Soft light grows from damp stone in a hidden garden, where pale flowers open without sun and fungi pulse like sleeping hearts. The air smells of rain, medicine, and very old mistakes.\n\nSome growths soothe fever. Others leave bright stains on the tongue and thoughts that do not belong to the thinker."
 adventure.6027.a:0 "Gather only the safe growth and label the baskets twice."
 adventure.6027.b:0 "Taste the rarest sample in the name of discovery."
 adventure.6028.t:0 "The Black Market Relic"
 adventure.6028.desc:0 "A smuggler waits in an impossible side room, surrounded by crates that could not have fit through the door and invoices written in three currencies. On the table rests a relic already wrapped for sale.\n\nThe price is high because the risk is real. The cheaper offer is available because the risk is someone else's problem until it is not."
 adventure.6028.a:0 "Buy it for study, receipts, and future deniability."
 adventure.6028.b:0 "Take the cheaper offer and try not to ask why."
 adventure.6029.t:0 "Siege Of One Door"
 adventure.6029.desc:0 "The final approach narrows to a single reinforced door, iron-bound and ugly with practical menace. It has murder holes, fresh scratches, and no interest whatsoever in being opened politely.\n\nWhoever built it expected visitors. Whoever scratched it expected to leave."
 adventure.6029.a:0 "Break it like a wall and make the hinges regret service."
 adventure.6029.b:0 "Charge through the kill zone before fear votes twice."
 adventure.6030.t:0 "The Last Camp"
 adventure.6030.desc:0 "Before the deepest chamber, the party finds an abandoned camp. The ashes are still warm, the bedrolls are still laid out, and a half-finished warning has been scratched into the floor by someone who ran out of time or fingers.\n\nNo bodies remain. That is comforting only to people with poor imaginations."
 adventure.6030.a:0 "Finish the warning before becoming part of it."
 adventure.6030.b:0 "Search the packs. The absent cannot object."

 adventure.7.t:0 "The Party Returns"
 adventure.7.desc_intro:0 "Weeks after leaving the guildhall, [ROOT.GetCharacter.GetName] and the surviving companions return from the chosen destination. Their boots are ruined, their cloaks have become philosophical arguments against travel, and at least one pack is making a noise no pack should make. "
 adventure.7.desc_legendary:0 "They bring trophies, witnesses, and a story already growing larger in every tavern that repeats it. By tomorrow, someone will claim there were twice as many foes and half as many survivors."
 adventure.7.desc_success:0 "Their packs are heavy, their scars are fresh, and their tale contains enough truth to satisfy the Guild, which is more than most tales manage."
 adventure.7.desc_mixed:0 "They return worn down, short of several promised prizes, and visibly older in the eyes. Still, they are not empty-handed, and in adventuring circles that counts as scholarship."
 adventure.7.a:0 "Dedicate the spoils to the realm and let the bards exaggerate responsibly."
 adventure.7.b:0 "Let the party divide the treasure before friendship becomes arithmetic."
 adventure.7.c:0 "Even a hard road teaches, though it charges cruel tuition."

