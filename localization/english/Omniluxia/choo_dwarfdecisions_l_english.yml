l_english:

unite_hebric: "Unite the Hebric Faith"
unite_hebric_desc: "Since the conception of our people we have argued over which of the three #Y demi-god pairs#! are the true heirs of the great #Y Stone Father#!.\n\nThe #Y Silver Dwarves#! claim #Y Htgarth#! and #Y Ferja#! as the oldest pair are the clear chosen of our creator. The #Y Gold Dwarves#! argue instead that the warlike #Y Summsîr#! and #Y Ava#! have claimed the title through their conquests of #G Luxterra#!. Finally, the #Y Copper Dwarves#! press their claim that the crafty #Y Frei#! and #Y Dwadais#! managed to trick the eldest pair into giving up their birthright to them.\n\nWhatever the other groups may claim, by uniting the #Y Dwarven#! world under our rule and owning the caves from whence our people emerged, we may be able to finally press our claim to the heritage of the great #Y Stone Father#!!"

stone_heir_mod: "True Heirs of the Stone Father"
stone_heir_mod_desc: "Since the conception of our people we have argued over which of the three #Y demi-god pairs#! are the true heirs of the great #Y Stone Father#!.\n\nThe #Y Silver Dwarves#! claim #Y Htgarth#! and #Y Ferja#! as the oldest pair are the clear chosen of our creator. The #Y Gold Dwarves#! argue instead that the warlike #Y Summsîr#! and #Y Ava#! have claimed the title through their conquests of #G Luxterra#!. Finally, the #Y Copper Dwarves#! press their claim that the crafty #Y Frei#! and #Y Dwadais#! managed to trick the eldest pair into giving up their birthright to them.\n\n Whatever the other groups may claim, by uniting the #Y Dwarven#! world under our rule and owning the caves from whence our people emerged, we may be able to finally press our claim to the heritage of the great #Y Stone Father#!!"

omniluxia_develop_hold: "Develop Hold"
omniluxia_develop_hold_desc: "The jewel of our prosperous nation is our magnificent #Y Hold#!, a marvel of ancient dwarven science and architecture. However, to maintain a steady population, it is important to continually renovate and improve the city to maintain and build upon its ancient foundations."

me_omnispecial_2_title: "The Second Unification Wars"
me_omnispecial_2_desc: "Incoming merchants have recently begun sharing stories from far off in the mountains of #G Morrigon#! that talk about a great conflict between the #Y Silver Dwarves#!.\n\nThe last our people have heard of the #Y Silver Dwarves#! were tales of resistance against the #T Zani Empire#!, culminating in a great battle won by a legendary King. However his death centuries ago broke apart their great kingdom.\n\nTales have been spun about a new King who seeks to emulate this ancient hero, and only time will tell if he is successful. If the #Y Silver Dwarves#! were to unite again it could change the political landscape of #G Omniluxia#! forever..."
me_omnispecial_2.a: "Who cares about some brutes in far off mountains?"
me_omnispecial_2_tooltip: "#G The Rulers of the #E Green Valley#! will fight until one unifies them all!#!"

me_omnispecial_3_title: "Rise Of The Golden Empire"
me_omnispecial_3_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], #Y Azari#! diplomats from the city of [GetProvince('(int32)4262').GetName|G] have arrived within [ROOT.GetCountry.GetCapital.GetName|G] bearing news of their homeland, the '[GetCountry('AKK').GetName|T]'.\n\nThese strangers have proudly proclaimed to us that their [GetCountry('AKK').GetRulerTitle], [GetCountry('AKK').GetRuler.GetName|Y], has reunified their ancient Empire that was destroyed hundreds of years ago by the #T Zani Empire#!. The #T Golden Dwarves#! were once very powerful players in #G Luxterra#!, but this was before the #Y Great Collapse#!...yet now it seems that they have reconstituted their strength of old.\n\nWe should be wary of a resurgent Golden #Y Dwarf#! Empire, my [ROOT.GetCountry.GetRulerTitle] - the #Y Azari#! are said to be natural tyrants and difficult foes."
me_omnispecial_3.a: "This doesn't sound like a good thing for [ROOT.GetCountry.GetName]..."
me_omnispecial_3_tooltip: "#Y Beware the rise of the#! #T Golden Dwarves!#!"

me_omnispecial_5_title: "The Formation of Nouvel Aralan"
me_omnispecial_5_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], #Y Aralanoc#! diplomats from the city of [GetProvince('(int32)2994').GetName|G] have arrived within [ROOT.GetCountry.GetCapital.GetName|G] bearing news of their homeland, '#Y Nouvel Aralan#!'.\n\nThese strangers have proudly announced that the people of #Y Nouvel Aralan#! have solidified their holdings north of the #G Rohanoan Mountains#!, and that they intend to conquer the remaining kingdoms within the #G Rohenevian Peninsula#!. It now appears that [GetProvince('(int32)2994').GetName|G], the famed city that lies at the foothills of the mountains, is no longer a mere regional capital, but the home of a growing power that could dominate the political landscape of #Y Rohenevia#! for years to come."
me_omnispecial_5.a: "Congratulate the diplomats and send them on their way"
me_omnispecial_5_tooltip: "#Y All hail the kingdom of#! #G Nouvel Aralan!#!"

me_omnispecial_6_title: "The Rise of Rohenevia"
me_omnispecial_6_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], #Y Rohenoan#! messengers from the city of [GetProvince('(int32)2509').GetName|G] have arrived within [ROOT.GetCountry.GetCapital.GetName|G] bearing news of their homeland, '#Y Rohenevia#!'.\n\nThese diplomats have proudly announced that their #Y Emperor#! has gathered the kingdoms of the #G Rohenevian Peninsula#! in #G Morrigon#! into one glorious realm, and that all rival claimants to the throne have been executed. It now appears that [GetProvince('(int32)2509').GetName|G], home to the famed #Y Citadel of the Jodok#! that has long protected its royal family, is the preeminent city of the peninsula and the capital of a new Imperial dynasty.\n\nOur sources have told us that for many years there have been brutal wars throughout the peninsula, as the various human kingdoms have struggled mightily to subdue each other, but now it seems that this period of strife has reached its conclusion. What this news means for the people of [ROOT.GetCountry.GetName|T] remains to be seen."
me_omnispecial_6.a: "Congratulate the diplomats and send them on their way"
me_omnispecial_6_tooltip: "#Y All hail the#! #G Empire of Rohenevia!#!"

me_omnispecial_7_title: "The Kingdom of Rohenoa"
me_omnispecial_7_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], #Y Rohenoan#! riders have arrived within [ROOT.GetCountry.GetCapital.GetName|G] with a message.\n\nThese diplomats have proudly announced that their ruler has united the northern kingdoms of the #G Rohenevian Peninsula#! in #G Morrigon#! under one banner, and that they request the friendship of the [ROOT.GetCountry.GetAdjective] people.\n\nWhen pressed regarding their intentions for the future, their messengers vowed to conquer the entirety of the peninsula and bring stability and prosperity to their people - an admirable goal, it must be said."
me_omnispecial_7.a: "Send their ruler our greetings and wish them the best"
me_omnispecial_7_tooltip: "#Y The Kingdom of Rohenoa has been established.#!"

me_omnispecial_8_title: "The Unification of Arteon"
me_omnispecial_8_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], electrifying news has reached [ROOT.GetCountry.GetCapital.GetName|G] that has sent shockwaves throughout our realm - after decades of vicious warfare, the island of #Y Arteon#! has been conquered by a single ruler.\n\nFor as long as our people can remember, #Y Arteon#! has been an island ravaged by rampaging armies, and it seemed that peace would never come to the '#Y Bloodsoaked Isle'#!. But the gods have shown mercy to the inhabitants of the island, and at long last, the exhausted armies have been disbanded to their cities and farms and the plundering mercenary companies, the source of so many ills, have been banished from its shores. Let us hope that the war-hardened soldiers of the new #T Arteonian#! power do not turn their attention elsewhere..."
me_omnispecial_8.a: "I never imagined that this day would come"
me_omnispecial_8_tooltip: "#Y The island of#! #G Arteon#! #Y has been united!#!"

me_omnispecial_9_title: "The Rise of Eptelon"
me_omnispecial_9_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], news from #G Eptelon#! - it seems that the tribes have been gathered under one banner, and for the first time in its history, an #Y Emperor#! rules over the island; truly a curious development.\n\nFor many years, #G Eptelon#! has been the plaything of its stronger neighbors, and many a raider from the lands of the #Y Ular-Pria#! have landed on its shores, burning settlements and sacking citadels with impunity. The #Y Snakefolk#! were matched in their savagery by the #Y Arteonians#!, who viewed the eastern isle as a source of manpower and plunder for their own purposes, but this era seems to have come to an end.\n\nThe #Y Eptelonians#! have vowed to protect their interests, and while they seek friendship with all that would reciprocate, they have made it clear that they will not be pushed around anymore."
me_omnispecial_9.a: "I never knew the Eptelonians had it in them"
me_omnispecial_9_tooltip: "#Y The island of#! #G Eptelon#! #Y has been united!#!"

me_omnispecial_10_title: "The Sanguine Confederacy"
me_omnispecial_10_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], we have received dire warnings from traders arriving from the #G Errfalian Sea#! - it appears that the vile #Y Drow#! elves have overcome the human kingdoms of northern #G Luxterra#! and, after many years of bitter warfare, have proclaimed the #Y Sanguine Confederacy#!.\n\nGrim messages have long filtered into [ROOT.GetCountry.GetCapital.GetName|G] of the atrocities committed by the #T Blood-Stained#! #Y Drow#! in their attempts to establish their empire, but we were content to dismiss these warnings as the exaggerations of fools. For who could truly believe that tens of thousands of people were slaughtered en masse and thrown into communal graves? And who could imagine entire cities burnt to the ground, their ashes scattered to the winds?\n\nBut now it seems that the worst has come to pass - the #Y Drow#! are triumphant and their newly-proclaimed Empire threatens the free peoples of #G Luxterra#!."
me_omnispecial_10.a: "May the gods protect us from this scourge!"
me_omnispecial_10_tooltip: "#Y Beware the rise of the#! #R Sanguine Confederacy!#!"

me_omnispecial_11_title: "Empire of Snakes"
me_omnispecial_11_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], dire news has reached our shores from traders frequenting the #Y Austropetolian Isles#! - the hated #Y Ular-Pria#! have managed to reclaim the islands and have proclaimed a new Empire. Our histories are filled with stories of the atrocities committed by the evil #Y Snakefolk#!, and although the calamitous #Y Great Collapse#! brought untold miseries to the inhabitants of #G Omniluxia#!, the destruction of their realm was a blessing.\n\nYet the capricious gods have seen fit to restore their empire of old, and the resurgent #Y Snakefolk#! have vowed to reconquer their former holdings."
me_omnispecial_11.a: "What a dark and cursed day this is!"
me_omnispecial_11_tooltip: "#Y Beware the return of the#! #R Empire of the Ular-Pria!#!"

me_omnispecial_12_title: "The Dragkhanic Empire"
me_omnispecial_12_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], a shocking piece of news has reached [ROOT.GetCountry.GetCapital.GetName|G] - it seems that the [GetCountry('SOV').GetName|T] has conquered southern #G Morrigon#! and have declared themselves to be the #Y Dragkhanic Empire#!. [GetProvince('(int32)4864').GetName|G], their city on the wind-blasted shores of the #G Intergealian Sea#!, has seen hundreds of diplomats from all across #G Omniluxia#! arrive in its port, all bearing gifts as they seek to curry the favor of the triumphant #Y Emperor#!.\n\nWho could have foreseen the rise of these upstart #Y Dragkhans#!? Truly, their rise to power has been meteoric, and they show no signs of slowing down."
me_omnispecial_12.a: "Keep an eye on their activities and inform me of further developments"
me_omnispecial_12_tooltip: "#Y Beware the rise of the#! #R Dragkhanic Empire!#!"

me_omnispecial_13_title: "The Proclamation of Ketep"
me_omnispecial_13_desc: "We have recently received messengers from the ancient city of [GetProvince('(int32)2805').GetName|G] - it seems that the #G Pharon#! of [GetCountry('EGY').GetName|T] has conquered lands to the south and has proclaimed the formation of a new realm, one that will heretoafter be known as '#Y Ketep#!'.\n\nTo celebrate this remarkable achievement, it is said that the #G Pharon#! has claimed divinity, and the inhabitants of the desert lands will be ruled by a living god forevermore."
me_omnispecial_13.a: "Who could have foreseen this day? Truly astonishing..."
me_omnispecial_13_tooltip: "#Y All hail the#! #G Kingdom of Ketep!#!"

me_omnispecial_14_title: "The Avatar Of Khewer"
me_omnispecial_14_desc: "A spirit of joyous revelry has fallen over [ROOT.GetCountry.GetCapital.GetName|G] as the people celebrate the establishment of #Y Ketep#!, and a year-long festival has been proclaimed within the capital.\n\nBut the best news of all was delivered to [ROOT.GetCountry.GetRuler.GetName|Y] by the #Y Priests of Khewer#!, who arrived in the capital city one morning bearing gifts of incense, perfumed oil and a mysterious revelation.\n\nSigns have been given and omens have been taken, and the gods have made their will known; [ROOT.GetCountry.GetRuler.GetFirstName|Y] is none other than the #Y Avatar of [GetDeityDefinition('omen_khewer').GetName]#!, for [ROOT.GetCountry.GetRuler.GetSheHe] has proven [ROOT.GetCountry.GetRuler.GetHerHim]self through words and deed - only a god could have achieved what our [ROOT.GetCountry.GetRulerTitle] has."
me_omnispecial_14.a: "Bow before me, for I am Khewer, God of Kings!"
me_omnispecial_14_tooltip: "#Y Our#! #G Pharon#! will be worshipped as a deity.#!"

me_omnispecial_15_title: "Herue Restored"
me_omnispecial_15_desc: "News comes to us from the far north of #G Luxterra#!, Great #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!!\n\nThe ancient #Y Kingdom#! of #G Herue#!, once divided amongst the sons of the #Y Walandottir#! family, has once again been reunited! The stalwart bastion of #T Helluvianism#! amongst the #Y Norrfallae#! tribes, it appears that this once-great power has finally re-emerged out of its decades-long civil war under the leadership of King #Y [GetCountry('GN2').GetRuler.GetFirstName][GetCountry('NR7').GetRuler.GetFirstName][GetCountry('NR5').GetRuler.GetFirstName][GetCountry('NR8').GetRuler.GetFirstName]!#!\n\nWith the #Y Drow#! planning another invasion of the weakened north, we shall see if this ancient #T Helluvian#! power still has the strength to protect the northern faithful. Regardless of the outcome of this future battle, the unification of a potential northern power may determine the fate of the northern #G Luxterra#! for the next century!"
me_omnispecial_15.a: "King of the North eh?"
me_omnispecial_15_tooltip: "#Y The Helluvian Kingdom of #E Herue#! has once again been reunited!#!"

me_omnispecial_16_title: "The Imperium of the Three Crowns"
me_omnispecial_16_desc: "Centuries ago, the great king #T Atheus the Conqueror#! permanently etched his name into the histories of the peoples of #Y Arteon#! and #G Eptelon#! when he sent out the infamous #Y Great Slaver Navy#! to plunder and conquer the continents for his growing kingdom. While most #Y High Elven#! lords were content with the small holdings and slaves they received from the initial campaigns, #T Atheus#! had much larger ambitions that pushed the #Y High Elven#! military to its limit. While the official histories claim that #T Atheus#! died heroically at the siege of what would become [GetProvince('(int32)662').GetName|G], rumors still suggest that treason was the true end of the mightiest king of the high elves.\n\nSo what was this great dream that drove #T Atheus#! to the war-torn shores of #Y Arteon#! and #G Eptelon#!?\n\nIn various letters and his personal journal, #T Atheus#! repeatedly mentions a great imperium ruled by #Y High Elves#! that would encompass the three continents of the northwest. Having led his people when they were refugees, he believed such an empire would finally create a permanent homeland for the #Y High Elves#!. Furthermore, the great king had begun thinking of succession in his old age, and desired to give each of his three sons a kingdom of their own that would serve the empire. While this dream was shattered by his descendants with his death and the death of his heir, many elites in the courts of the [GetCountry('ATH').GetName|T] and [GetCountry('ACY').GetName|T] still speak of the other continents as if it was their rightful dominion.\n\nMighty #Y Emperor#!, with all three continents unified under #Y High Elven#! rule, the #Y Imperium of the Three Crowns#! can once again build a #Y Great Slaver Navy#!! Will our newfound wealth, the imperium's ships will reach even the isolated #G Polaria#!, and challenge even the powerful #Y Ular-Pria#! for dominance over the sea!"
me_omnispecial_16.a: "Onwards!"
me_omnispecial_16_tooltip: "#Y The #E Great Slaver Navies#! of the #E Atheusians#! will be rebuilt and once again be sent across Omniluxia!#!"

atheusian_slaver_navies_mod: "Rebuilding the Great Slaver Navies"
