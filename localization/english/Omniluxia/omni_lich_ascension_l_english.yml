l_english:
 omni_lich_ascension_decision: "The Second Rite"
 omni_lich_phylactery_atlas_tt: "#T Lich's Phylactery#!\nA lich has bound their soul to a vessel in this territory. If a wartime enemy occupies it, the vessel is destroyed and the lich dies."
 omni_lich_ascension_decision_desc: "#T Phylactery Maturation#! #G [GuiScope.SetRoot(Player.MakeScope).ScriptValue('omni_lich_ascension_progress')|0] / [GuiScope.SetRoot(Player.MakeScope).ScriptValue('omni_lich_ascension_required_months')|0] months#!\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('omni_lich_ascension_meter')]\n\nKeep the territory where the phylactery was placed safe while it gathers power. If a wartime enemy occupies it, the lich dies. When the phylactery matures, its keeper may undertake the Second Rite."
 omni_lich_ascension_ready_tt: "The ruling lich's phylactery has matured."
 omni_lich_ascension.2.t: "The Third Key"
 omni_lich_ascension.2.desc: "There were three keys to the room below the old treasury. The watch kept the first and the keeper of the seals wore the second on a chain. The third had been buried with the mason. This morning it was found in the lock.\n\nBelow, the cup that held [SCOPE.sChar('omni_ascending_lich').GetName|Y]'s last breath was warm enough to take the chill out of a hand laid against it. Nobody had dared move it. The keeper had put a carpenter's mark on the shelf when the cup was first brought down, and the dust lay unbroken right up to that mark. Beside it stood two things the night watch swore had never passed their door: a crown of black iron, and a dragon's lower jaw with all its teeth.\n\nThe old notes said the crown would let its wearer draw more deeply from the cup. They were less clear about the jaw. The last scholar to translate that passage had drawn a little figure beside it, standing under the open ribs of a wyrm. The figure and the wyrm cast the same shadow.\n\nThe keeper took the watch upstairs and locked the door behind them. He left the third key on the inside."
 omni_lich_ascension.2.archlich: "Set the iron on my brow."
 omni_lich_ascension.2.dracolich: "Bring me the jaw. Open the vault doors."
 omni_lich_ascension.2.later: "Leave the key where it lies."
 omni_archlich_trait: "Archlich"
 omni_archlich_trait_desc:0 "When the Archlich [CHARACTER.GetName|Y] rides to war, the dead rise at the roll call and answer to names that have been struck from the muster for a hundred years - [CHARACTER.GetSheHe] is a creature of unfathomable evil. Immune to offensive spells, including spells targeting forces under [CHARACTER.GetHerHis] command."
 omni_dracolich_trait: "Dracolich"
 omni_dracolich_trait_desc:0 "A creature of unfathomable darkness, #Y Dracolich#! is a lich who has used the #Y Second Rite#! to take the form of an undead dragon. Its bones mend over time, sustained by the phylactery that holds its soul. The Dracolich and the forces it commands are immune to offensive spells."
 omni_dracolich_take_flight: "Take Flight"
 omni_dracolich_take_flight_desc: "The Dracolich first takes wing from the capital with #Y 10,000 strength#!. Its surviving cohorts slowly mend in territory you control. Use #Y Return Home#! to land at the capital. Raising levies from the Military screen also calls the Dracolich to the field when it is ready."
 omni_dracolich_take_flight_tt: "Deploy the Dracolich at the capital. The first flight begins at #Y 10,000 strength#!. After landing, the Dracolich returns with its surviving strength."
 omni_dracolich_flight_cooldown_tt: "The two-year flight cooldown must have expired."
 omni_dracolich_not_deployed_tt: "The Dracolich must be off the field."
 omni_dracolich_return_home: "Return Home"
 omni_dracolich_return_home_desc: "Bring the Dracolich back to the capital and let it fold its wings. Every surviving cohort must be at the capital, stationary and out of combat. Landing preserves surviving strength and begins a two-year cooldown before the next flight."
 omni_dracolich_return_home_tt: "Land at the capital and preserve the Dracolich's surviving strength. Take Flight becomes available again in #Y two years#!."
 omni_dracolich_landing_location_tt: "All surviving Dracolich cohorts must be stationary at the capital, out of combat, and unexiled."
 omni_dracolich_landing_cooldown_tt: "At least #Y 90 days#! must have passed since takeoff."
 omni_dracolich_slow_recovery: "Bones of the Wyrm"
 desc_omni_dracolich_slow_recovery: "The bones knit by the force of the soul within. Surviving cohorts regain up to #Y 1%#! of their strength each month in territory the realm controls, outside battle."
 omni_dracolich_army_name: "Dracolich"
 omni_dracolich: "Dracolich"
 omni_dracolich_desc: "The ruler takes the field in the bones of an ancient wyrm."
