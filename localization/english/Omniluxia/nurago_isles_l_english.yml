 ZBR:0 "Bazhar"
 ZBR_ADJ:0 "Bazhari"
 ZBR_island_lore_title:0 "The Sea-Blades of Bazhar"
 ZBR_island_lore:0 "On #G Rendun#!, the eldest of the #G Bloody Isles#!, the noble #Y Egerya#! rule from their fortified #T Nurago#! palaces, and the #T Great Families#! of the #T Nurhanuoragias#! fight endlessly for supremacy. Every feud leaves losers, and for generations the beaten crews of Rendun have sailed out to the bare rocks of the outer isles rather than kneel to the families who broke them. The exiles who cut the first mooring holes at [GetProvince('(int32)6031').GetName|G] were such men, and their descendants still swear by no Great Family at all.\n\n#Y Orcs#! are prized as warriors in every royal retinue of #G Omniluxia#!, and the crews of #G Bazhar#! have made a trade of it. They hire out their longships and their blades to any king who can pay, the merchant princes of [GetCountry('ESQ').GetName|Y] keep a company of them on their walls, and between contracts they raid whoever cannot pay. The fishing clans of [GetCountry('VYT').GetName|Y] and the reavers of [GetCountry('WRS').GetName|Y] have both learned to give the skerries a wide berth. As followers of #T Gotzon#!, they spend the night before every voyage in silence before the harbor fires, tending their inner flame, and many a mainland garrison has learned that a calm orc is far more dangerous than an angry one.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] holds the three skerries by the strength of the crews alone, for Bazhar has no palace and no Great Family to protect it. The families of Rendun call the Bazhari traitors, yet hire them gladly when a rival needs to be humbled, and some of the crews whisper that the prophesied #T Krozon#! will rise from the exiles rather than the palaces. Will the sea-blades of Bazhar remain swords for hire, or become a power in their own right?"
