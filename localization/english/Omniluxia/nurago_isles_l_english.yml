 ZBR_ADJ:0 "Bazhari"
 ZBR_island_lore:0 "At Nurul Rock the orc crews from Rendun had cut their first mooring holes where a boat could ride out the tide, and the harbor moot still meets close enough to hear the ropes pull against the stone. [ROOT.GetCountry.GetRuler.GetName|Y] came down while the berth dues were being counted, and the crew just off watch stood dripping by the table until its share was weighed out.\n\nThe three skerries keep a common watch over the channel, and a keeper on one rock knows which of the others should answer before a ship reaches the harbor. The next crew pushed off while the counting was still going on, and the clerk held their coins under his palm until somebody could take them out."
