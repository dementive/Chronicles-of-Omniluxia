l_english:
 oracle_trait: "Oracle"
 oracle_trait_desc: "The Rite of the Oracle opened [CHARACTER.GetName|Y]'s eyes to what lies ahead. When a vision comes, blue light spills from those eyes and a voice from beyond speaks of things yet to pass. At court, these glimpses guide the realm's scholars."
 mindlord_trait: "Mindlord"
 mindlord_trait_desc: "Through Dominion of the Mind, [CHARACTER.GetName|Y] can bend the will of others. Mindlords take half damage from direct hostile spells and are immune to mind control, magical curses, and instant-kill spells. They cannot hold personal wards."

 omni_oracle_sanctum: "Oracle's Sanctum"
 omni_vision_learning: "Vision of Learning"
 omni_vision_plenty: "Vision of Plenty"
 omni_vision_omens: "Vision of Omens"

 loyalty_omni_enthralled: "Enthralled"
 loyalty_omni_enthralled_foreign: "Enthralled by a Foreign Mindlord"

 omni_oracle_foresight: "Divine Eyes"
 omni_oracle_foresight_act: "Ask $CHAR$ for a vision"
 omni_oracle_foresight_desc: "Our Oracle looks ahead and chooses one vision to guide the realm for two years."
 omni_foresight_cooldown_tt: "The Oracle has had a vision in the last 2 years"
 omni_foresight_capital_tt: "Our capital is neither besieged nor occupied"
 omni_foresight_general_tt: "The Oracle does not command troops"

 omni_mindlord_enthrall: "Enthrall"
 omni_mindlord_enthrall_act: "Enthrall $CHAR$"
 omni_mindlord_enthrall_desc: "Our Mindlord sways this character's loyalty or improves a foreign ruler's opinion of our realm. A personal ward blocks the attempt and is spent."
 omni_enthrall_cooldown_tt: "Our Mindlord has not used Enthrall or Sever the Bond in the last 3 years"
 omni_mindlord_free_tt: "A free Mindlord serves at our court"
 omni_enthrall_effect_tt: "A personal ward blocks the attempt and is spent. An unwarded target has one of these effects.\n#Y Our realm#! · The character gains #G +25 loyalty#! for 10 years.\n#Y Foreign ruler or co-ruler#! · Their realm gains #G +50 opinion#! of us, fading by 10 per year. Recasting refreshes the bonus.\n#Y Other foreign character#! · The character loses #R 30 loyalty#! for 5 years."
 omni_enthralled_ruler_opinion: "Ruler Swayed by Enthrall"

 omni_mindlord_sever_bond: "Sever the Bond"
 omni_mindlord_sever_bond_act: "Sever $CHAR$'s dragon bond"
 omni_mindlord_sever_bond_desc: "Our Mindlord tears the bond between this enemy commander and the dragon they lead."
 omni_sever_not_in_battle_tt: "The dragon is not in battle"
 omni_sever_effect_tt: "Each dragon this commander leads loses #R half#! its strength. A dragon already below half strength breaks free and flies off, and its realm cannot summon another for 365 days."

 omni_tier_v.1.t: "The Oracle's Vision"
 omni_tier_v.1.desc: "[SCOPE.sChar('target').GetName|Y] had one hand on the sanctum door when the trance came on. The Oracle tried to call out to a priest for help, but the first syllable caught in [SCOPE.sChar('target').GetHerHis] throat, and by the time the monk reached the door, [SCOPE.sChar('target').GetFirstName] was holding the latch so hard that he had to ease the fingers off it one at a time. He called [SCOPE.sChar('target').GetFirstName] by name, as he had been taught to do at the first sign of a trance, and begged the Oracle to bless the people of [ROOT.GetCountry.GetName|Y] with prophecy.\n\nAt the sound of his voice, the Oracle's eyes began to glow a vibrant blue color, filling the room with swirling light. When [SCOPE.sChar('target').GetFirstName] replied, it was not [SCOPE.sChar('target').GetHerHis] voice that spoke, but someone or something else that answered."
 omni_tier_v.1.a: "For two years, our scholars shall find answers where they left questions"
 omni_tier_v.1.b: "For two years, our merchants shall come home with full purses"
 omni_tier_v.1.c: "For two years, our streets shall keep their peace"
 omni_tier_v.2.t: "The Dragon Falters"
 omni_tier_v.2.desc: "An enemy Mindlord has reached into the mind of our dragon. The bond held, but the creature is badly wounded."
 omni_tier_v.2.a: "It will not heal."
 omni_tier_v.3.t: "The Dragon Breaks Free"
 omni_tier_v.3.desc: "An enemy Mindlord has severed the bond with our dragon. Already wounded, the creature tore free and has flown off."
 omni_tier_v.3.a: "We must wait a year before we can call another."
