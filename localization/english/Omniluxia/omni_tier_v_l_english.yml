l_english:
 oracle_trait: "Oracle"
 oracle_trait_desc: "Through the Rite of the Oracle, [CHARACTER.GetName|Y] sees the threads of what is to come. While an Oracle lives at court, the realm's scholars work by their light."
 mindlord_trait: "Mindlord"
 mindlord_trait_desc: "Through Dominion of the Mind, [CHARACTER.GetName|Y] can bend the will of others. No ward will ever again settle on a mind so open to the minds of others."

 omni_oracle_sanctum: "Oracle's Sanctum"
 omni_vision_learning: "Vision of Learning"
 omni_vision_plenty: "Vision of Plenty"
 omni_vision_omens: "Vision of Omens"

 loyalty_omni_enthralled: "Enthralled"
 loyalty_omni_enthralled_foreign: "Enthralled by a Foreign Mindlord"

 omni_oracle_foresight: "Foresight"
 omni_oracle_foresight_act: "Ask $CHAR$ for a vision"
 omni_oracle_foresight_desc: "Our Oracle looks ahead and chooses one vision to guide the realm for two years."
 omni_foresight_cooldown_tt: "The Oracle has had a vision in the last 2 years"
 omni_foresight_capital_tt: "Our capital is neither besieged nor occupied"
 omni_foresight_general_tt: "The Oracle does not command troops"

 omni_mindlord_enthrall: "Enthrall"
 omni_mindlord_enthrall_act: "Enthrall $CHAR$"
 omni_mindlord_enthrall_desc: "Our Mindlord binds this character's mind. Our own subjects grow loyal; a foreign character turns against their realm. Any personal ward absorbs the attempt."
 omni_enthrall_cooldown_tt: "Our Mindlord has not used Enthrall or Sever the Bond in the last 3 years"
 omni_mindlord_free_tt: "A free Mindlord serves at our court"
 omni_enthrall_effect_tt: "If the target holds a personal ward, the ward absorbs the attempt and is spent.\nOtherwise, our own subject gains #G +25#! loyalty for 10 years, or a foreign character loses #R 30#! loyalty to their realm for 5 years."

 omni_mindlord_sever_bond: "Sever the Bond"
 omni_mindlord_sever_bond_act: "Sever $CHAR$'s dragon bond"
 omni_mindlord_sever_bond_desc: "Our Mindlord tears the bond between this enemy commander and the dragon they lead."
 omni_sever_not_in_battle_tt: "The dragon is not in battle"
 omni_sever_effect_tt: "Each dragon this commander leads loses #R half#! its strength. A dragon already below half strength breaks free and flies off, and its realm cannot summon another for 365 days."

 omni_tier_v.1.t: "The Oracle's Vision"
 omni_tier_v.1.desc: "Our Oracle has gone into the sanctum and come out with a vision. Which path should the realm follow for the next two years?"
 omni_tier_v.1.a: "A vision of learning."
 omni_tier_v.1.b: "A vision of plenty."
 omni_tier_v.1.c: "A vision of omens."
 omni_tier_v.2.t: "The Dragon Falters"
 omni_tier_v.2.desc: "An enemy Mindlord has reached into the mind of our dragon. The bond held, but the creature is badly wounded."
 omni_tier_v.2.a: "It will not heal."
 omni_tier_v.3.t: "The Dragon Breaks Free"
 omni_tier_v.3.desc: "An enemy Mindlord has severed the bond with our dragon. Already wounded, the creature tore free and has flown off."
 omni_tier_v.3.a: "We must wait a year before we can call another."
