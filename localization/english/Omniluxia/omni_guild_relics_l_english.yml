 treasure_chalice_blood:0 "Chalice of Blood"
 treasure_chalice_blood_desc:0 "A drinking horn of gilded bronze whose inside has stained a red that no scrubbing will lift. Old warlords drank from it on the eve of battle, and the stories agree that each of them won, although they also agree that none of them lived long afterward. More than one temple has offered good silver for the chance to bury it."
