 treasure_eye_storm:0 "Eye of the Storm"
 treasure_eye_storm_desc:0 "A black stone ground into a sphere, in which a pale light turns like weather seen from a mountaintop. Sailors say it darkens a day before a storm, and the commanders who carried it were said to know which way a battle would break before the first lines closed."
