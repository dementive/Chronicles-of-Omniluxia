 treasure_staff_elements:0 "Staff of Elements"
 treasure_staff_elements_desc:0 "A staff of twisted bronze set with shards of four colored stones, one for each element the mages of the old schools claimed to command. It has been broken and rebuilt so many times that no one can say which of its parts is original, and every mage who has carried it has added a stone of his own."
