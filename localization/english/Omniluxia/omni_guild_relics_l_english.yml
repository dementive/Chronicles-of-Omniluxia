l_english:
 omni_guild_relic.1.t:0 "A Relic from the Road"
 omni_guild_relic.1.desc:0 "The company has come home with something the Guild clerks could not price."
 omni_guild_relic.1.a:0 "Put it in the treasury, and pay the clerk for keeping quiet."
 omni_guild_relic_found_gilded_axe_dimnas_tt:0 "#G Rare find:#! the company recovers the #Y Gilded Axe of Dimnas#!, a lost relic that can be equipped from the treasury."
 omni_guild_relic.1.desc_gilded_axe_dimnas:0 "When the company unpacked its saddlebags in front of the Guild clerk, the last bundle was wrapped in a cloak nobody in the party owned. Inside lay the #Y Gilded Axe of Dimnas#!, which the old hands at the contract board had long since stopped believing in.\n\nThe clerk entered it in the ledger under a false name, so that no rival company would come asking where it was found. It now sits in the treasury of [ROOT.GetCharacter.GetEmployer.GetName], where a commander may take it up."
