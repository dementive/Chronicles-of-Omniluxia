 treasure_helm_ancients:0 "Helm of the Ancients"
 treasure_helm_ancients_desc:0 "A battered helm of red and gold work, so old that its leather lining has crumbled to dust. The people who made it are long gone, but the dents in its crown are said to be the marks of the #T Old Dragkhans#!, and anyone who wears it finds that blows land a little softer than they should."
