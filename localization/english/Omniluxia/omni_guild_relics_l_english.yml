 treasure_cloak_shadows:0 "Cloak of Shadows"
 treasure_cloak_shadows_desc:0 "A dark mantle so fine that it folds into a closed fist, although it falls to the ankles once it is worn. Smugglers' songs credit it with every escape from every prison in the #G Intermarenica#!, and the guild clerks note that none of the songs say who wore it last."
