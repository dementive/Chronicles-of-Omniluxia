 omni_guild_relic_board_hint:0 "\n\n#T Lost relics:#! now and then a successful company comes home with an artifact that exists nowhere else. Legendary results, relic and ruin contracts, and well-chosen loot all improve the odds."
 treasure_amulet_life:0 "Amulet of Life"
 treasure_amulet_life_desc:0 "A disc of green stone pierced for a cord, warm in the hand even in the dead of winter. Healers who have held it swear that a wound closed while they watched, and the #Y Adventurer's Guild#! keeps a long file of families who claim to have owned it before the #Y Great Collapse#!. None of them can say where it went afterward, which has not stopped any of them from asking for it back."
 equip_treasure_amulet_life:0 "Equip $item_artifact_treasure_amulet_life_modifier$"
 unequip_treasure_amulet_life:0 "Unequip $item_artifact_treasure_amulet_life_modifier$"
 omni_equipped_item_artifact_treasure_amulet_life:0 "  #Y Amulet of Life:#!  #D Charisma#! +12, #R Martial#! +4, #G Health#! +5%, #D Monthly Mana#! +46%, #T Discipline#! +9.1%, #G Fort Defense#! +7.8%, #Y Morale of Armies#! +7%, #T Heavy Cavalry Desert Combat#! +5.3%, #R Assault Ability#! +9.2%"
