 treasure_ring_power:0 "Hungering Ring"
 treasure_ring_power_desc:0 "A heavy gold arm-ring whose ends are clasped by two beast-heads, and which hums faintly once it is warm. Petty kings have fought over it for centuries, and the Guild's records show it changing hands more often than any other relic the clerks track."
