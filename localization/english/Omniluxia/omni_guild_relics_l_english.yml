 treasure_orb_knowledge:0 "Orb of Knowledge"
 treasure_orb_knowledge_desc:0 "A sphere of clouded green stone that scholars believe holds the notes of a library lost in the #Y Great Collapse#!. Those who gaze into it come away with a word or a figure they did not know before, and a few come away unable to stop looking."
 equip_treasure_orb_knowledge:0 "Equip $item_artifact_treasure_orb_knowledge_modifier$"
