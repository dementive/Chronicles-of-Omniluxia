 treasure_blade_night:0 "Blade of Night"
 treasure_blade_night_desc:0 "A short dark blade that throws back no light, even when it is drawn beside a fire. Assassins of the old #Y Razani#! courts were said to carry knives like it, and every guild company that pulls a black dagger out of a ruin is certain for a night or two that it has found this one."
