 treasure_horn_beasts:0 "Horn of Beasts"
 treasure_horn_beasts_desc:0 "A curved bronze horn cast in the shape of a beast's open throat. When it is sounded every hound within earshot begins to howl, and the Guild holds standing contracts from several farming villages to make sure it is never blown near them again."
 equip_treasure_horn_beasts:0 "Equip $item_artifact_treasure_horn_beasts_modifier$"
