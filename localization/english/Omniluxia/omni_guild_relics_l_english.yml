 treasure_kings_heart:0 "King's Heart"
 treasure_kings_heart_desc:0 "A red lacquered box no larger than two hands, holding a heart that has never rotted. The story goes that it belonged to a king who would not let his realm be divided after his death, and that it still gives counsel to whoever keeps it, although few of its keepers have agreed with one another about what it said."
