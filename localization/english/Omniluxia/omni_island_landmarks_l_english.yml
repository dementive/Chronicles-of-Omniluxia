l_english:
 omni_island_refugee_register_mod:0 "The First Page of the Register"
 desc_omni_island_refugee_register_mod:0 "Alusian and Sarian families who fled #G Arteon#! wrote their names in the harbor book at #G Auravel#!. A newcomer who can point to a family name on that first page can usually find a bed before the tide turns."
 omni_island_keepers_landing_mod:0 "The Keepers' Landing"
 desc_omni_island_keepers_landing_mod:0 "When the mainland stopped paying the garrison at #G Atherion Light#!, the keepers began collecting oil money at the foot of the headland. Atheusian and Horteonian skippers still pay into the same tin."
 omni_island_pilots_hearth_mod:0 "The Boatmen's Hearth"
 desc_omni_island_pilots_hearth_mod:0 "The #Y Puyonga#! clans meet at #G Rashveli#! to divide the winter fishing grounds. Even while the chiefs are hearing a claim, a guest who sets a bowl by the hearth may ask a boatman for passage through the Sound."
 omni_island_cargo_weights_mod:0 "The Court Weights"
 desc_omni_island_cargo_weights_mod:0 "A merchant may borrow the bronze weights from the harbor court at #G Eshqara#! and weigh a disputed cargo in front of both crews. The smallest weight has a hole through its middle from generations on the clerk's cord."
 omni_island_shelter_roll_mod:0 "The Shelter Roll"
 desc_omni_island_shelter_roll_mod:0 "At the spring moot on #G Yaravun#!, each crew takes a turn mending one of the outlying shelters. The keeper at #G Last Lantern#! carves the name of the boat that brought the timber into the underside of each new roof beam."
 omni_island_sound_tables_mod:0 "The Star Tables of Lhaegard"
 desc_omni_island_sound_tables_mod:0 "Apprentices at #G Lhaegard#! copy the star tables by lamplight, then put out with an old mariner to learn how to steer by them. The oldest sheet begins with the star said to have fallen into #G Northstar Bay#!."
 omni_island_storm_wood_mod:0 "The Storm Woodpiles"
 desc_omni_island_storm_wood_mod:0 "Every hearth on #G Skutalik#! sets aside a bundle of driftwood above the reach of the spray. When a fishing boat comes in iced over, the first sticks go under a kettle and the rest go home with the crew."
 omni_island_seedling_beds_mod:0 "The Crossing Beds"
 desc_omni_island_seedling_beds_mod:0 "At #G First Sprig#!, the oldest seedling beds still hold earth the Waldonians carried across the channel for #T Mother Cafea#!. At planting time the fishers leave their first baskets by the garden gate for the households tending the young trees."
 omni_island_harvest_scales_mod:0 "The Harvest Scales"
 desc_omni_island_harvest_scales_mod:0 "Above the winter tide line at #G Leshava#!, orchard fruit and the last catch of the season are weighed in the same hall. The clerk calls out every household at the feast, including those whose boats have yet to come home."
 omni_island_summit_beacon_mod:0 "The Split Summit Beacon"
 desc_omni_island_summit_beacon_mod:0 "From the cleft above #G Kharazgapt#! the fire is visible as far as the approaches to #G Otrar#! and #G Karetxem#!. Shipmasters who now sail under three flags still buy their lamp wicks from the same chandler at the foot of the hill."
 omni_island_mooring_rings_mod:0 "The Rendun Moorings"
 desc_omni_island_mooring_rings_mod:0 "The first orcs from #G Rendun#! cut mooring holes straight through the rock here. At the harbor moot on #G Nurul Rock#!, the outgoing watch ties up beside the pay table to collect its share of the berth dues."
 omni_island_keel_timber_mod:0 "The Keel Timber Racks"
 desc_omni_island_keel_timber_mod:0 "Before the cedar rafts leave #G Vaelisar#! for #G Veyravel#!, a shipwright walks their length with a pot of chalk. The trunks she marks are hauled out to season above the tide until a keel of that length is laid."
 omni_island_winter_lamp_mod:0 "The Shrine of the Winter Lamp"
 desc_omni_island_winter_lamp_mod:0 "Harbor dues from #G Ilytheon#! keep a light burning at the shrine on #G Ostraeth#!. Crews driven in by fog may draw grain from the keepers' store, and many return in clear weather with a jar of oil for the lamp."
 omni_island_twin_stamps_mod:0 "The Twin Assay Stamps"
 desc_omni_island_twin_stamps_mod:0 "Every silver ingot that leaves #G Urzhaketh#! bears the marks of #Y Sarthovar#! and #Y Iravessa#!. A buyer who doubts its weight may have it weighed again on the quay, within earshot of the dragons who stand surety for it."
 omni_island_first_salt_mod:0 "The Fishers' Salt Share"
 desc_omni_island_first_salt_mod:0 "When the salt boats arrive from #G Oquraya#!, the fishers of #G Mairavun#! draw their measure before a merchant can bid. By the time the rest goes to auction, the first barrels of the winter catch are packed."
 omni_island_nail_altar_mod:0 "The Altar of Nails"
 desc_omni_island_nail_altar_mod:0 "Before sailing from #G Targuzh#!, a captain drives a nail into the altar and swears to turn back for a crew in distress. In storm season the shipwright leaves a hammer there for captains called out in the night."
 omni_island_coffee_steps_mod:0 "The Coffee Steps"
 desc_omni_island_coffee_steps_mod:0 "Growers on #G Qelthar#! spread their coffee on the broad stone steps above the landing. Buyers climb the steps as the beans dry, leaving a copper token on the mat of each lot they mean to take aboard."
 omni_island_reef_measures_mod:0 "The Spice Measures"
 desc_omni_island_reef_measures_mod:0 "On #G Vaqara#!, a spice seller carries a nest of little measures tied to her wrist. A sailor spending the last of his pay can buy the smallest cup on the quay and have it counted out just as carefully as a merchant's whole sack."
 omni_island_star_wax_mod:0 "The Stargazers' Candles"
 desc_omni_island_star_wax_mod:0 "Beekeepers in the woods of #G Veyruth#! save their palest wax for the #Y Stellaric#! faithful. On clear nights each household lights a wick for the dead, and children learn their names beneath the stars."
 omni_island_amber_ladle_mod:0 "The Amber Ladle"
 desc_omni_island_amber_ladle_mod:0 "Amber cutters on #G Qasuda#! set aside the price of their first sale each market day for a pot of broth on the quay. The handle of the serving ladle has been mended twice. Both times the cutters kept the old amber grip."
