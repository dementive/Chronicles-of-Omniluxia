l_english:

 generic_trade_expedition:0 "A Trade Mission To [SCOPE.sCountry('generic_trade_expedition_partner').GetName]"
 generic_trade_expedition_DESCRIPTION:0 "There is money to be made in the marketplaces of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], my [ROOT.GetCountry.GetRulerTitle], and they are close enough that we could reach them without much trouble. If we charter the venture properly, name a good envoy, prepare the convoy and choose our cargo with some care, our merchants will come home with full holds; they will also come home with stories, foreign contacts, and a much better idea of what the world outside [ROOT.GetCountry.GetName] is willing to pay for."
 generic_trade_expedition_CRITERIA_DESCRIPTION:0 "This venture will be finished once a trade fleet has sailed from [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] to the market at [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], taken on cargo, returned home in one piece, and the ledgers have been settled."
 generic_trade_expedition_BUTTON_TOOLTIP:0 "Send a friendly trading expedition to a neighboring coastal country."
 generic_trade_expedition_BUTTON_DETAILS:0 "A nearby country that does not dislike us, and that holds a port with a Marketplace in it, will be chosen as our trade partner."
 generic_trade_expedition_REWARD_DESCRIPTION:0 "Completing this venture grants gold, Political Influence, warmer relations and trade modifiers; at the end we shall also choose a permanent #Y Charter#! that decides what our foreign trade becomes for a generation."

 generic_trade_expedition_open_contacts:0 "Charter The Venture"
 generic_trade_expedition_open_contacts_DESC:0 "The merchants of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] do not lack for visitors, my [ROOT.GetCountry.GetRulerTitle], and their rulers will not throw open their warehouses to strangers who simply turn up; someone must be named, someone must be paid, and word must be sent ahead. Let us charter the expedition properly and choose an envoy before a single sail is raised."
 generic_trade_expedition_eligible_envoy_tt:0 "We must have a suitable adult courtier who can lead the expedition."
 generic_trade_expedition_envoy_selected_tt:0 "We must choose an envoy to lead the expedition."

 generic_trade_expedition_hire_interpreters:0 "Hire Interpreters"
 generic_trade_expedition_hire_interpreters_DESC:0 "A good bargain can sour over a single badly chosen word. Interpreters, harbor guides and scribes who understand foreign weights and measures will keep our envoy from mistaking courtesy for insult; they will also keep him from mistaking idle talk for a promise, which is the more expensive mistake of the two."

 generic_trade_expedition_survey_home_market:0 "Survey Home Demand"
 generic_trade_expedition_survey_home_market_DESC:0 "Before our ships leave [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y], our merchants ought to find out what will actually sell here; there is no glory in sailing across the sea and returning with a hold full of something the [ROOT.GetCountry.GetAdjective] people have no use for."

 generic_trade_expedition_exchange_gifts:0 "Exchange Gifts"
 generic_trade_expedition_exchange_gifts_DESC:0 "Fine cloth, polished vessels, oath-gifts and carefully measured courtesy will show the court of [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] that we mean to enrich them as well as ourselves. What we put in the gift ledger now decides how we are received later; as honored guests, as careful traders, or as petitioners with good manners and nothing else."

 generic_trade_expedition_harbor_rights:0 "Negotiate Harbor Rights"
 generic_trade_expedition_harbor_rights_DESC:0 "Our envoys must secure safe harbor in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. This is no conquest and no demand for tribute; it is a friendly request that our ships be allowed to enter, trade and leave again under formal protection."

 generic_trade_expedition_chart_course:0 "Chart The Course"
 generic_trade_expedition_chart_course_DESC:0 "The route between [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] and [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] must be copied into sailing notes that a captain can actually use. Even familiar water looks unfamiliar when the holds are full and foreign pilots are watching to see how well we know it."

 generic_trade_expedition_provision_convoy:0 "Provision The Convoy"
 generic_trade_expedition_provision_convoy_DESC:0 "Water casks, spare cordage, sealed grain, deck tools and guards who can be trusted; none of it is as impressive as the gifts, my [ROOT.GetCountry.GetRulerTitle], and the whole venture will fail without it."

 generic_trade_expedition_departure_feast:0 "Host A Departure Feast"
 generic_trade_expedition_departure_feast_DESC:0 "A feast before the ships leave will show our own merchants that the crown stands behind this venture; it will also give any foreign eyes in [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] a pleasant taste of [ROOT.GetCountry.GetAdjective] generosity, which never hurts."

 generic_trade_expedition_assemble_convoy:0 "Assemble The Convoy"
 generic_trade_expedition_assemble_convoy_DESC:0 "No ruler ever won respect by sending a few leaking skiffs to a foreign market. A proper fleet must gather at [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] under the command of our chosen envoy before we go anywhere."
 generic_trade_expedition_assemble_convoy_tt:0 "Have a navy of at least #Y 10#! ships docked in #Y [SCOPE.sP('generic_trade_expedition_home_port').GetName]#! and commanded by the chosen envoy. (#Y [SCOPE.ScriptValue('generic_trade_expedition_home_convoys_svalue')|0]#!/#Y 1#!)"

 generic_trade_expedition_reach_partner_port:0 "Reach [SCOPE.sP('generic_trade_expedition_partner_port').GetName]"
 generic_trade_expedition_reach_partner_port_DESC:0 "The harbor rights are granted and the way is open. Our envoy must now bring the fleet into [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], where pilots from [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] will guide our merchants in to the market."
 generic_trade_expedition_reach_partner_port_tt:0 "Have the envoy-commanded navy of at least #Y 10#! ships docked in #Y [SCOPE.sP('generic_trade_expedition_partner_port').GetName]#!. (#Y [SCOPE.ScriptValue('generic_trade_expedition_partner_convoys_svalue')|0]#!/#Y 1#!)"

 generic_trade_expedition_register_harbor_master:0 "Register With The Harbor Master"
 generic_trade_expedition_register_harbor_master_DESC:0 "Nothing comes ashore in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] without seals, dues, inspections and our names written into the correct ledgers. Our envoy must spend some days in the harbor office deciding how honestly to enter those records; a convoy must become visible to a port before it can become profitable in one."

 generic_trade_expedition_inspect_warehouses:0 "Inspect Bonded Warehouses"
 generic_trade_expedition_inspect_warehouses_DESC:0 "Registration only puts us in the ledgers. Before any serious bargaining begins, our envoy should walk through the warehouses, quay sheds, locks and weighing rooms where our cargo will be sitting; it is remarkable what a man notices when he looks at the locks himself."
 generic_trade_expedition_harbor_registered_tt:0 "We must register the convoy with the harbor master in #Y [SCOPE.sP('generic_trade_expedition_partner_port').GetName]#!."

 generic_trade_expedition_meet_market_guilds:0 "Meet The Market Guilds"
 generic_trade_expedition_meet_market_guilds_DESC:0 "The marketplace of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] is a web of guilds, brokers, weighers, lenders and quiet family arrangements that nobody will explain to a stranger. Our envoy must sit with them and work out what sort of cargo is worth carrying home."

 generic_trade_expedition_record_customs:0 "Record Foreign Customs"
 generic_trade_expedition_record_customs_DESC:0 "Our expedition is not only buying goods, my [ROOT.GetCountry.GetRulerTitle]. It is watching how foreign clerks write their contracts, how harbor dues are collected, how the guilds settle a quarrel, and how a busy market manages to keep its people honest; all of that is worth bringing home as well."

 generic_trade_expedition_load_cargo:0 "Gather Trade Goods"
 generic_trade_expedition_load_cargo_DESC:0 "For several months our merchants will be weighing cargo, arguing over measures, hiring and re-hiring interpreters, and slowly learning what is genuinely worth the voyage home. The envoy's fleet must stay at anchor in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] while all this goes on."
 generic_trade_expedition_load_cargo_tt:0 "Keep the envoy-commanded navy of at least #Y 10#! ships docked in #Y [SCOPE.sP('generic_trade_expedition_partner_port').GetName]#!. (#Y [SCOPE.ScriptValue('generic_trade_expedition_partner_convoys_svalue')|0]#!/#Y 1#!)"

 generic_trade_expedition_plant_factor_house:0 "Plant A Factor House"
 generic_trade_expedition_plant_factor_house_DESC:0 "A few trusted agents could stay behind in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] after the fleet sails; keeping ledgers, writing letters, and doing the small favors that make the next expedition arrive somewhere rather than merely arrive."

 generic_trade_expedition_seal_manifest:0 "Seal The Manifest"
 generic_trade_expedition_seal_manifest_DESC:0 "The goods are aboard, but cargo without a sealed manifest is simply an argument waiting to happen at the other end. Every chest, jar, bundle and debt must be written down and witnessed before we sail."

 generic_trade_expedition_return_home:0 "Return To [SCOPE.sP('generic_trade_expedition_home_port').GetName]"
 generic_trade_expedition_return_home_DESC:0 "The holds are full, the contracts are sealed, and every sailor in the fleet has his own account of which merchant cheated whom. Bring the envoy home to [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] before the profit, the lessons and the blame can all be divided without us."
 generic_trade_expedition_return_home_tt:0 "Return the envoy-commanded navy of at least #Y 10#! ships to dock in #Y [SCOPE.sP('generic_trade_expedition_home_port').GetName]#!. (#Y [SCOPE.ScriptValue('generic_trade_expedition_home_convoys_svalue')|0]#!/#Y 1#!)"

 generic_trade_expedition_honor_envoy:0 "Honor The Envoy"
 generic_trade_expedition_honor_envoy_DESC:0 "Our envoy carried our words, ate foreign dust, haggled under strange roofs and brought the fleet back whole. What we do with him now is worth thinking about carefully."

 generic_trade_expedition_publish_charts:0 "Publish The Charts"
 generic_trade_expedition_publish_charts_DESC:0 "The routes, harbor notes and warnings gathered on this voyage should not disappear into some captain's private chest. Copied out and given to our own masters, they will make the next voyage a good deal less uncertain."

 generic_trade_expedition_count_profits:0 "Count The Profits"
 generic_trade_expedition_count_profits_DESC:0 "The fleet is home, my [ROOT.GetCountry.GetRulerTitle]. The cargo must be sold, the gifts displayed, the ledgers checked; and then we must decide what this venture is going to become."

 generic_trade_expedition_harbor_rights_cmod:0 "Foreign Harbor Rights"
 desc_generic_trade_expedition_harbor_rights_cmod:0 "A friendly ruler across the water has formally granted our merchants leave to enter one of their ports."
 generic_trade_expedition_chartered_venture_cmod:0 "Chartered Trade Venture"
 desc_generic_trade_expedition_chartered_venture_cmod:0 "Merchants, courtiers and harbor officials have all begun treating this expedition as a serious venture with the crown behind it."
 generic_trade_expedition_interpreters_cmod:0 "Hired Trade Interpreters"
 desc_generic_trade_expedition_interpreters_cmod:0 "Interpreters and scribes are keeping our envoys from making the worst mistakes that foreign bargaining offers."
 generic_trade_expedition_envoy_charmod:0 "Expedition Envoy"
 desc_generic_trade_expedition_envoy_charmod:0 "This one has been trusted with a friendly trading venture overseas."
 generic_trade_expedition_home_market_survey_pmod:0 "Surveyed Home Demand"
 desc_generic_trade_expedition_home_market_survey_pmod:0 "The merchants of this harbor have worked out what foreign goods will actually sell to their neighbors."
 generic_trade_expedition_outbound_charts_cmod:0 "Prepared Sailing Notes"
 desc_generic_trade_expedition_outbound_charts_cmod:0 "Our captains have proper notes for the route now, rather than somebody's memory of it."
 generic_trade_expedition_provisioned_convoy_cmod:0 "Provisioned Convoy"
 desc_generic_trade_expedition_provisioned_convoy_cmod:0 "Water, grain, cordage and spare gear enough that the crossing will not have to be argued about halfway through it."
 generic_trade_expedition_outfitting_quays_pmod:0 "Outfitting Quays"
 desc_generic_trade_expedition_outfitting_quays_pmod:0 "These quays have been busy fitting out a serious venture, and the shipwrights here have got rather good at it."
 generic_trade_expedition_departure_feast_cmod:0 "Departure Feast"
 desc_generic_trade_expedition_departure_feast_cmod:0 "The whole town turned out to watch the ships go, and everyone ate well doing it."
 generic_trade_expedition_loading_cargo:0 "Loading Cargo"
 desc_generic_trade_expedition_loading_cargo:0 "Our merchants are tied up in a foreign market, and our own trade is quieter for it."
 generic_trade_expedition_full_holds:0 "Full Holds"
 desc_generic_trade_expedition_full_holds:0 "A trade fleet is coming home heavy, slow, and under very careful orders."
 generic_trade_expedition_successful:0 "Successful Trade Expedition"
 desc_generic_trade_expedition_successful:0 "A friendly expedition has come home with goods, contacts, and a far wider view of the markets beyond our borders."
 generic_trade_expedition_returned_merchants:0 "Returned Merchants"
 desc_generic_trade_expedition_returned_merchants:0 "Merchants who have seen a foreign market with their own eyes have settled here, and they are not shy about what they learned."
 generic_trade_expedition_foreign_quarter:0 "Foreign Quarter"
 desc_generic_trade_expedition_foreign_quarter:0 "There is a corner of this port where our countrymen do business, and the locals have stopped remarking on it."
 generic_trade_expedition_factor_house_pmod:0 "Factor House"
 desc_generic_trade_expedition_factor_house_pmod:0 "Our own agents keep a house here; ledgers, letters and small favors moving quietly between two harbors."
 generic_trade_expedition_foreign_charts_cmod:0 "Foreign Charts"
 desc_generic_trade_expedition_foreign_charts_cmod:0 "Sailing notes copied from pilots who have worked this water their whole lives."
 generic_trade_expedition_published_charts_cmod:0 "Published Charts"
 desc_generic_trade_expedition_published_charts_cmod:0 "The routes are no longer one captain's secret; every master in our service can read them now."
 generic_trade_expedition_dockside_contacts_cmod:0 "Dockside Contacts"
 desc_generic_trade_expedition_dockside_contacts_cmod:0 "Our people know who to ask in a foreign port, which is worth more than most treaties."
 generic_trade_expedition_market_confusion_cmod:0 "Market Confusion"
 desc_generic_trade_expedition_market_confusion_cmod:0 "Nobody is quite sure what anything is worth this season, and our merchants are guessing along with everyone else."
 generic_trade_expedition_registered_cleanly_cmod:0 "Cleanly Registered"
 desc_generic_trade_expedition_registered_cleanly_cmod:0 "Our names went into the foreign ledgers honestly, and there is nothing there that anyone can hold over us."
 generic_trade_expedition_bonded_warehouses_pmod:0 "Bonded Warehouses"
 desc_generic_trade_expedition_bonded_warehouses_pmod:0 "Goods can sit here under lock and seal without anybody losing sleep about it."
 generic_trade_expedition_guarded_cargo_cmod:0 "Guarded Cargo"
 desc_generic_trade_expedition_guarded_cargo_cmod:0 "Our cargo travels with men whose only task is to see that it arrives."
 generic_trade_expedition_quayside_storage_pmod:0 "Quayside Storage"
 desc_generic_trade_expedition_quayside_storage_pmod:0 "Cheap space on a crowded quay; convenient, and not especially secure."
 generic_trade_expedition_shipwright_notes_pmod:0 "Shipwright's Notes"
 desc_generic_trade_expedition_shipwright_notes_pmod:0 "Our shipwrights have been studying foreign hulls, and some of what they saw was better than ours."
 generic_trade_expedition_manifest_sealed_cmod:0 "Sealed Manifest"
 desc_generic_trade_expedition_manifest_sealed_cmod:0 "Every chest and every debt written down and witnessed, so that landfall brings no arguments."
 generic_trade_expedition_returned_home_cmod:0 "Expedition Returned"
 desc_generic_trade_expedition_returned_home_cmod:0 "The fleet is at anchor and the accounts are not yet settled."
 generic_trade_expedition_honored_envoy_cmod:0 "Honored Envoy"
 desc_generic_trade_expedition_honored_envoy_cmod:0 "The man who led our venture was thanked in front of the whole town, and everyone saw it."
 generic_trade_expedition_bulk_cargo_cmod:0 "Bulk Cargo"
 desc_generic_trade_expedition_bulk_cargo_cmod:0 "Grain, timber, salt and hides; unglamorous, and it sells every single season."
 generic_trade_expedition_luxury_cargo_cmod:0 "Luxury Cargo"
 desc_generic_trade_expedition_luxury_cargo_cmod:0 "Things that only the rich will buy, at prices only the rich will pay."
 generic_trade_expedition_knowledge_cargo_cmod:0 "Knowledge Cargo"
 desc_generic_trade_expedition_knowledge_cargo_cmod:0 "Books, drawings, methods and the odd talkative craftsman; the cheapest cargo we brought and possibly the most valuable."

 opinion_trade_expedition_envoys:0 "We Sent Them Envoys"
 opinion_trade_expedition_gifts:0 "We Sent Them Gifts"
 opinion_trade_expedition_lavish_gifts:0 "We Sent Them Lavish Gifts"
 opinion_trade_expedition_ceremonial_gifts:0 "We Sent Them Ceremonial Gifts"
 opinion_trade_expedition_interpreters:0 "We Took The Trouble To Learn Their Tongue"
 opinion_trade_expedition_harbor_rights:0 "Granted Us Harbor Rights"
 opinion_trade_expedition_departure_feast:0 "Feasted Our Departure"
 opinion_trade_expedition_feasted_with_envoy:0 "Feasted With Our Envoy"
 opinion_trade_expedition_success:0 "Traded Well With Us"
 opinion_trade_expedition_harbor_dues:0 "We Paid Their Harbor Dues"
 opinion_trade_expedition_bonded_warehouses:0 "Shares Warehouses With Us"
 opinion_trade_expedition_factor_house:0 "Hosts Our Factor House"
 opinion_trade_expedition_good_port_conduct:0 "Our Sailors Behaved Themselves"
 opinion_trade_expedition_bad_port_conduct:0 "Our Sailors Did Not Behave Themselves"

 generic_trade_expedition.4.t:0 "An Envoy For The Expedition"
 generic_trade_expedition.4.desc:0 "There are many among us who would like the honor of carrying our words across the water. The chosen envoy will not merely stand in a court with gifts, but command the trade convoy itself, sleep among sailors, bargain with foreign brokers, and return home with either glory or blame."
 generic_trade_expedition.4.a:0 "Send [SCOPE.sCharacter('generic_trade_expedition_envoy_1').GetName]; the provinces will manage without him"
 generic_trade_expedition.4.b:0 "Send [SCOPE.sCharacter('generic_trade_expedition_envoy_2').GetName]; our own blood should speak for us"
 generic_trade_expedition.4.c:0 "Send [SCOPE.sCharacter('generic_trade_expedition_envoy_3').GetName]; a safe pair of hands"
 generic_trade_expedition.4.d:0 "Send [SCOPE.sCharacter('generic_trade_expedition_envoy_4').GetName]; a merchant, and nobody's kinsman"

 generic_trade_expedition.5.t:0 "The Gift Ledger"
 generic_trade_expedition.5.desc:0 "The gifts bound for [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] are laid out across the hall for your inspection, my [ROOT.GetCountry.GetRulerTitle], and the steward has been fretting over the arrangement since dawn.\n\nThere is a way to do this that says we are rich; a way that says we are serious men who expect to do business for twenty years; and a way that says we understand their customs better than they expected us to. All three are correct. Only one of them is what we want their chamberlain thinking as he walks back down the corridor."
 generic_trade_expedition.5.a:0 "Arrive with lavish gifts; let them count the value"
 generic_trade_expedition.5.b:0 "Send practical gifts for practical people"
 generic_trade_expedition.5.c:0 "Let ceremony carry the meaning"

 generic_trade_expedition.6.t:0 "Before The Harbor Master"
 generic_trade_expedition.6.desc:0 "The harbor master of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] has received [SCOPE.sChar('generic_trade_expedition_envoy').GetName] in a room with one window and a very great many ledgers, and has begun the business of writing us down.\n\nEverything here can be done properly, slowly, and at full cost; or it can be argued over line by line, which will save us money and make us memorable; or we can accept the arrangement he keeps hinting at, which is faster than either and which nobody will write down anywhere at all."
 generic_trade_expedition.6.a:0 "Pay the dues cleanly and take proper seals"
 generic_trade_expedition.6.b:0 "Let [SCOPE.sChar('generic_trade_expedition_envoy').GetPraenomen] bargain over every line"
 generic_trade_expedition.6.c:0 "Accept the shortcut he is not quite offering"

 generic_trade_expedition.8.t:0 "Locks, Seals And Storehouses"
 generic_trade_expedition.8.desc:0 "The harbor ledgers are open to us, [ROOT.GetCountry.GetRuler.GetName], but goods do not wait politely in the street while their owners decide what to do with them.\n\nThe bonded warehouses are secure, official, and priced accordingly. We could instead hire our own guards and trust our own factors, which is cheaper and depends entirely on the men we hire. Or there are the quay sheds; cheap, close, and roofed in a manner best described as optimistic."
 generic_trade_expedition.8.a:0 "Use the official bonded warehouses"
 generic_trade_expedition.8.b:0 "Hire private guards and trusted factors"
 generic_trade_expedition.8.c:0 "Make do with the cheap quay sheds"

 generic_trade_expedition.7.t:0 "The Market Guilds"
 generic_trade_expedition.7.desc:0 "The guild elders have crowded around [SCOPE.sChar('generic_trade_expedition_envoy').GetName] on the floor of the market hall, and each of them is entirely certain that his goods are the ones we came all this way for.\n\nGrain, hides, timber and salt from the men who have been here longest; spices, dyed cloth and worked silver from the ones with the better clothes; and, standing quietly at the back, two guildmasters offering to sell us nothing at all except their methods of weighing, contracting and keeping accounts. Our envoy asks which of them we would like him to disappoint."
 generic_trade_expedition.7.a:0 "Reliable bulk goods will steady the ledgers"
 generic_trade_expedition.7.b:0 "Rare luxuries will make the voyage famous"
 generic_trade_expedition.7.c:0 "Methods and measures are cargo too"

 generic_trade_expedition.1.t:0 "Harbor Rights In [SCOPE.sP('generic_trade_expedition_partner_port').GetName]"
 generic_trade_expedition.1.desc:0 "The court of [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] has answered our gifts with a formal welcome, [ROOT.GetCountry.GetRuler.GetName], and their reply was read out twice because nobody quite believed the terms the first time. Our ships may enter the water of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], trade under local protection, and buy from the city market without fear of seizure or insult.\n\nIt is a single sheet of parchment with three seals on it; I would not trade it for three warships."
 generic_trade_expedition.1.a:0 "Ready the fleet!"

 generic_trade_expedition.2.t:0 "The Markets Of [SCOPE.sP('generic_trade_expedition_partner_port').GetName]"
 generic_trade_expedition.2.desc:0 "Our convoy has come into [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], my [ROOT.GetCountry.GetRulerTitle]. Local pilots took us through water so crowded that our captains simply handed over the steering and watched; and the moment the ropes were fast, half the market came down the quay to look at us.\n\nWarehousemen, weighers, money changers, and a great many men whose profession nobody has yet explained. [SCOPE.sChar('generic_trade_expedition_envoy').GetName] says he has been offered eleven different bargains and understood perhaps four of them."
 generic_trade_expedition.2.a:0 "Let the bargaining begin"

 generic_trade_expedition.3.t:0 "The Fleet Returns"
 generic_trade_expedition.3.desc:0 "The fleet is back at [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] and sitting low in the water, [ROOT.GetCountry.GetRuler.GetName]. Every merchant in the town has an opinion about how the profit ought to be divided, and every one of those opinions favours the man holding it.\n\nThe courtiers are admiring the foreign gifts, the scholars are asking whether the visiting factors might be persuaded to stay through the winter, and somebody has already begun quietly reselling his share on the quay before the ropes were coiled."
 generic_trade_expedition.3.a:0 "Sell the finest goods while the town is still talking"
 generic_trade_expedition.3.b:0 "Display the gifts at court"
 generic_trade_expedition.3.c:0 "Invite the foreign factors to lecture our scholars"

 generic_trade_expedition.110.t:0 "Dockside Brokers"
 generic_trade_expedition.110.desc:0 "[SCOPE.sChar('generic_trade_expedition_envoy').GetName] has fallen in with a circle of brokers who know which warehouse leaks, which weigher drinks, and which official can be found at which tavern on which evening.\n\nNone of them will put any of it in writing and all of them expect to be thanked. Our envoy asks whether we would rather have the coin they would cost us, or the year of trouble they will save us."
 generic_trade_expedition.110.a:0 "Useful friends are worth the price"
 generic_trade_expedition.110.b:0 "Build the network, not the ledger"

 generic_trade_expedition.111.t:0 "False Weights"
 generic_trade_expedition.111.desc:0 "A tidy row of foreign weights has caused a furious argument among our merchants, my [ROOT.GetCountry.GetRulerTitle]. Two of them are light; not much, not enough to notice on one transaction, but we have made rather a lot of transactions.\n\nBy the time [SCOPE.sChar('generic_trade_expedition_envoy').GetName] arrived, one of our factors had the weigher by the collar and the whole row was watching with the air of people who have seen this before and are wondering how the strangers will handle it."
 generic_trade_expedition.111.a:0 "Count the loss and learn from it"
 generic_trade_expedition.111.b:0 "Expose the fraud to the whole harbor"

 generic_trade_expedition.112.t:0 "A Quayside Brawl"
 generic_trade_expedition.112.desc:0 "Sailors, [ROOT.GetCountry.GetRuler.GetName], make poor diplomats after wine. A shoving match near the third quay became a brawl, the brawl became a crowd, and the crowd became a matter the harbor watch felt obliged to notice.\n\nNobody drew a blade and nobody drowned, which our envoy is presenting as a triumph of discipline. Two of our men are in a foreign cell and a local fishmonger is presenting an invoice for his stall."
 generic_trade_expedition.112.a:0 "At least no blades were drawn"

 generic_trade_expedition.113.t:0 "A Procession Through The Market"
 generic_trade_expedition.113.desc:0 "A procession wound through the market lanes this morning while our convoy sat in harbor; drums, a covered litter, and several hundred people for whom business simply stopped.\n\n[SCOPE.sChar('generic_trade_expedition_envoy').GetName] had the sense to have every one of our men off the quay and standing still with their heads uncovered before it reached us. It cost us half a day. It has been mentioned to him three times since, by three different people who matter."
 generic_trade_expedition.113.a:0 "Respect opens doors that money cannot"

 generic_trade_expedition.114.t:0 "Harbor Dues"
 generic_trade_expedition.114.desc:0 "The harbormaster has presented [SCOPE.sChar('generic_trade_expedition_envoy').GetName] with a list of fees, and it is a work of considerable imagination. There is a charge for mooring, a charge for the privilege of being charged for mooring, and a levy in support of a shrine our envoy has been unable to locate.\n\nIt is all perfectly official, and every other ship on this quay has paid it."
 generic_trade_expedition.114.a:0 "Pay, and smile while doing it"

 generic_trade_expedition.115.t:0 "Stormbound"
 generic_trade_expedition.115.desc:0 "Bad weather has pinned the convoy in harbor for six days, my [ROOT.GetCountry.GetRulerTitle], and tempers have gone accordingly. But six days is a long time on a foreign quay with nothing to do, and our sailors have spent it the way sailors do; drinking with the local men and asking questions.\n\nWe now know a great deal about which routes the harbor's own captains avoid in autumn, and why."
 generic_trade_expedition.115.a:0 "The sea teaches in its own way"

 generic_trade_expedition.116.t:0 "Words For Trade"
 generic_trade_expedition.116.desc:0 "Our envoy has found an interpreter who appears to know every merchant in the harbor and to be owed money by most of them. He works cheaply, listens twice as much as he speaks, and has already corrected [SCOPE.sChar('generic_trade_expedition_envoy').GetName] in front of a guildmaster.\n\nThe correction was right, which is why he has been kept on."
 generic_trade_expedition.116.a:0 "Language is cargo too"

 generic_trade_expedition.117.t:0 "Foreign Shipwrights"
 generic_trade_expedition.117.desc:0 "Our sailors have been spending their evenings in the yards with the local shipwrights, trading small tools and much sharper opinions about hull design.\n\nSeveral of our men have come back with sketches; one has come back rather quiet, having been shown a joint he cannot work out how to cut. The yardmaster is willing to explain it properly, for a price."
 generic_trade_expedition.117.a:0 "Bring those sketches home"
 generic_trade_expedition.117.b:0 "Pay for a careful copy of their methods"

 generic_trade_expedition.118.t:0 "Spoiled Cargo"
 generic_trade_expedition.118.desc:0 "A good lot of grain and oil has gone over in a rented warehouse, [ROOT.GetCountry.GetRuler.GetName], and nobody can agree whose fault it is. The warehouseman blames our sealing, our factor blames the roof, and the roof has been blaming itself audibly for some weeks.\n\nThe loss is real and the argument will outlast the expedition."
 generic_trade_expedition.118.a:0 "A bitter lesson, and an expensive one"

 generic_trade_expedition.119.t:0 "Honest Measures"
 generic_trade_expedition.119.desc:0 "After a fortnight of quiet suspicion, [SCOPE.sChar('generic_trade_expedition_envoy').GetName] has found a guild whose weights are exactly what they claim to be. He had them checked three times against our own, twice without telling anyone.\n\nThey seem to have noticed, and to have been rather pleased about it; their elder remarked that most foreigners only check once."
 generic_trade_expedition.119.a:0 "Trust, but verified"

 generic_trade_expedition.120.t:0 "Fire In The Warehouse"
 generic_trade_expedition.120.desc:0 "Fire broke out near the foreign warehouses before dawn, my [ROOT.GetCountry.GetRulerTitle], and our sailors were on the quay forming a line to the water before most of the harbor was awake. They saved two storehouses that were not ours and lost nothing of our own.\n\nBy breakfast the story had gone round the whole port, improving slightly with each telling. Our envoy has wisely declined to correct any version of it."
 generic_trade_expedition.120.a:0 "We did what honor required"

 generic_trade_expedition.121.t:0 "A Feast Aboard Ship"
 generic_trade_expedition.121.desc:0 "[SCOPE.sChar('generic_trade_expedition_envoy').GetName] has hosted the brokers, pilots and minor officials of the harbor aboard our largest ship; foreign wine, our own cook, and an evening that ran a good deal later than intended.\n\nA pilot fell in the water and was retrieved. Two contracts were agreed on the deck and written down the following morning by men who had to be reminded of what they had said."
 generic_trade_expedition.121.a:0 "A fine use of a deck"

 generic_trade_expedition.122.t:0 "Rare Spice"
 generic_trade_expedition.122.desc:0 "A merchant led our envoy down a lane behind the market, through a yard, and into a room with nothing in it but a locked chest and a very old man.\n\nWhat was in the chest is worth more by weight than anything else in our holds, [ROOT.GetCountry.GetRuler.GetName], and there is not much of it. [SCOPE.sChar('generic_trade_expedition_envoy').GetName] has bought what there was and has since been sleeping rather closer to it than to his own cabin."
 generic_trade_expedition.122.a:0 "Guard it well"

 generic_trade_expedition.123.t:0 "Borrowed Charts"
 generic_trade_expedition.123.desc:0 "A retired pilot has let our sailors copy several harbor charts in exchange for gifts and a promise that his name stays off them. He is old, he no longer sails, and he seems mostly pleased that somebody wanted them.\n\nHe has also offered to sit with our captains directly and explain what the charts do not show, which our sailing master says is worth rather more than the charts."
 generic_trade_expedition.123.a:0 "A chart can be worth a hold of silver"
 generic_trade_expedition.123.b:0 "Have him teach the captains himself"

 generic_trade_expedition.124.t:0 "Quiet Profits"
 generic_trade_expedition.124.desc:0 "Nothing has happened, my [ROOT.GetCountry.GetRulerTitle], and it has been happening for several weeks. No disputes, no losses, no incidents worth reporting; simply cargo bought at sensible prices by men who now know what they are doing.\n\nOur envoy's report on the period is four lines long. I have read it twice and can find no fault in it whatsoever."
 generic_trade_expedition.124.a:0 "The very best kind of news"

 generic_trade_expedition.125.t:0 "The Interpreter's Triumph"
 generic_trade_expedition.125.desc:0 "A negotiation nearly collapsed this week over a single word that means 'deposit' in the market and something considerably ruder three streets away.\n\nOur interpreter caught it, said nothing to either party, and quietly offered both of them a different word. The bargain was struck an hour later by two men who will never know how close they came to insulting one another."
 generic_trade_expedition.125.a:0 "Remember who actually saved that"

 generic_trade_expedition.126.t:0 "Merchant Quarrels"
 generic_trade_expedition.126.desc:0 "Our own merchants have begun quarrelling among themselves, [ROOT.GetCountry.GetRuler.GetName]; over hold space, over who paid for which guards, and over whose cousin was promised what before we ever left home.\n\nNone of it concerns the people we came here to trade with, all of it is happening loudly on a foreign quay, and [SCOPE.sChar('generic_trade_expedition_envoy').GetName] has spent two days settling arguments he did not create."
 generic_trade_expedition.126.a:0 "Order them back to work"

 generic_trade_expedition.127.t:0 "The Local Pilot"
 generic_trade_expedition.127.desc:0 "A pilot has walked our envoy through the harbor's hidden currents; the bar that shifts every spring, the berth that dries at low water, the corner where three ships have been lost by captains who were certain they knew better.\n\nHe charged a great deal for a morning's walking and talking, my [ROOT.GetCountry.GetRulerTitle], and our sailing master paid it without a word of complaint, which from him is extraordinary."
 generic_trade_expedition.127.a:0 "Worth every coin of it"

 generic_trade_expedition.128.t:0 "Debate In The Market Hall"
 generic_trade_expedition.128.desc:0 "A scholar attached to the marketplace has challenged our scribes in open hall over weights, contracts, temple dues, and the proper way to record a debt between two men of different cities.\n\nOur people did not win, exactly. They did not lose either, and a crowd gathered, and by the end of it the scholar was writing things down as fast as our scribes were."
 generic_trade_expedition.128.a:0 "Questions can be profitable"
 generic_trade_expedition.128.b:0 "Turn the debate into goodwill"

 generic_trade_expedition.129.t:0 "A Gift For The Hosts"
 generic_trade_expedition.129.desc:0 "[SCOPE.sChar('generic_trade_expedition_envoy').GetName] has chosen a parting gift for the officials who made this possible, and has been agonising over it for a week.\n\nSomething costly says we are grateful and can afford to be. Something useful says we intend to come back and expect to be remembered. He has asked for guidance, which means he has already decided and would like it confirmed."
 generic_trade_expedition.129.a:0 "Courtesy has a price; pay it handsomely"
 generic_trade_expedition.129.b:0 "A practical gift is the more honest one"

 generic_trade_expedition.130.t:0 "Weights And Ledgers"
 generic_trade_expedition.130.desc:0 "A harbor clerk has insisted on weighing our cargo twice, and then a third time, purely to be certain. It is slow, it is tedious, and it is entirely correct of him.\n\nOur factors are furious. Our envoy has pointed out, quietly, that a harbor where the clerk weighs three times is a harbor where nobody has cheated us either."
 generic_trade_expedition.130.desc.bulk:0 "A harbor clerk has insisted on weighing our cargo twice, and then a third time, purely to be certain; and since our cargo is grain and hides and salt, that means counting it sack by sack in the sun.\n\nHe seems almost relieved by it, [ROOT.GetCountry.GetRuler.GetName]. Our factors are not, but the clerks of this harbor have clearly been cheated by cleverer men than us and would rather be slow than sorry."
 generic_trade_expedition.130.desc.luxury:0 "A harbor clerk has insisted on weighing our cargo three separate times, and with what is in our crates I cannot entirely blame him.\n\nThe counting house has been quietly filling up with people who have no business being there, my [ROOT.GetCountry.GetRulerTitle]. Suspicion and greed are fighting for possession of the same ledger, and our envoy has taken to standing where he can see both the scales and the door."
 generic_trade_expedition.130.desc.knowledge:0 "A harbor clerk has insisted on weighing our cargo three times over, which is proving difficult, because a good part of what we are carrying home does not weigh anything worth recording.\n\nHe has given up on the chests and started reading the notes inside them instead. One of his juniors has been copying our measurement tables for an hour, [ROOT.GetCountry.GetRuler.GetName], and has not noticed that we have noticed."
 generic_trade_expedition.130.a:0 "Keep the books clean"
 generic_trade_expedition.130.b:0 "Let our hosts keep a clean copy too"

 generic_trade_expedition.131.t:0 "A Missing Seal"
 generic_trade_expedition.131.desc:0 "One of the export seals has gone missing at the worst possible hour, my [ROOT.GetCountry.GetRulerTitle]. The convoy is in no danger and nothing has been stolen; but a seal that cannot be found is a seal that might be anywhere, and the harbor office is required to write that down.\n\nOnce it is written down it becomes a matter, and matters here take weeks."
 generic_trade_expedition.131.a:0 "Find it before the paperwork spreads"

 generic_trade_expedition.132.t:0 "A Sudden Squall"
 generic_trade_expedition.132.desc:0 "A squall came over the port and stopped all work at the quay for a day and a half. The sailors grumbled; the sailmaker did not, having been handed a day and a half in which nobody could ask him to do anything else.\n\nEvery sail in the convoy has now been gone over properly, which would not otherwise have happened before we sailed."
 generic_trade_expedition.132.a:0 "A useful inconvenience"

 generic_trade_expedition.133.t:0 "Rival Buyers"
 generic_trade_expedition.133.desc:0 "Two merchants have begun competing for the same cargo, [ROOT.GetCountry.GetRuler.GetName], and both have worked out that our envoy is in no hurry.\n\nEach has now approached him separately to explain what is wrong with the other's goods. The price has moved twice in our favour without [SCOPE.sChar('generic_trade_expedition_envoy').GetName] saying anything at all, which he reports is the easiest work he has done all season."
 generic_trade_expedition.133.desc.luxury:0 "Two buyers are circling our cargo like gulls, [ROOT.GetCountry.GetRuler.GetName], and each is doing his very best to appear to be the only man in this harbor willing to pay properly for it.\n\nThey have both now taken [SCOPE.sChar('generic_trade_expedition_envoy').GetName] aside separately to explain, in confidence, that the other cannot really afford it. The price has climbed twice this week without our envoy making a single offer."
 generic_trade_expedition.133.desc.bulk:0 "Two merchants have begun competing for the same cargo, my [ROOT.GetCountry.GetRulerTitle], and both have worked out that our envoy is in no hurry.\n\nIt is grain and timber, so the argument is not about quality but about volume, transport, and which of them should carry the risk once the holds are full. Neither wishes to be the one who blinks, and [SCOPE.sChar('generic_trade_expedition_envoy').GetName] has discovered that saying nothing at all moves the price quite nicely."
 generic_trade_expedition.133.desc.knowledge:0 "Two men are competing for what we are carrying, my [ROOT.GetCountry.GetRulerTitle], and neither of them is a merchant.\n\nOne is a scholar attached to the market hall and the other keeps the accounts for a guild; both want access to the notes, tables and methods tucked in among our goods, and both are quietly appalled to find the other wants them too. They are bidding in favours rather than coin, which our envoy reports is far harder to value."
 generic_trade_expedition.133.a:0 "Press the advantage"
 generic_trade_expedition.133.b:0 "Take the coin and move on"

 generic_trade_expedition.134.t:0 "Hands In The Hold"
 generic_trade_expedition.134.desc:0 "Some dockhands were caught helping themselves to our cargo overnight. The theft was small; what it tells us is not.\n\nThey knew which hold, they knew which crates, and they knew when the watch changed. Somebody told them, and that somebody is still on this quay."
 generic_trade_expedition.134.a:0 "Set extra watches, and say nothing"

 generic_trade_expedition.135.t:0 "A Dockside Feast"
 generic_trade_expedition.135.desc:0 "Our envoy accepted an invitation to a feast on the quays, where the merchants and pilots of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] traded gossip as readily as goods.\n\nHe came away with the name of a man who is about to go bankrupt, the name of a man who does not yet know he is about to be undercut, and a fairly clear idea of which guild elder has been quietly buying grain against a bad harvest nobody has announced."
 generic_trade_expedition.135.a:0 "Remember every face at that table"

 generic_trade_expedition.136.t:0 "Quarrel Over Measures"
 generic_trade_expedition.136.desc:0 "A disagreement over weights, measures and tally marks has turned half the market into a shouting match, my [ROOT.GetCountry.GetRulerTitle], and a good deal of it is being conducted in languages our envoy does not have.\n\nHe can restore the peace and get us back to work; or he can spend rather longer and try to get the whole market to agree on one standard, which would benefit everyone here and us most of all."
 generic_trade_expedition.136.a:0 "Restore order and get back to work"
 generic_trade_expedition.136.b:0 "Settle the market standards properly"

 generic_trade_expedition.137.t:0 "A Retired Pilot's Notes"
 generic_trade_expedition.137.desc:0 "An old pilot has offered us his harbor notes in exchange for gifts and an evening of stories from home. The notes are decades old and cover water that has not changed nearly as much as anyone assumes.\n\nHe does not want money, [ROOT.GetCountry.GetRuler.GetName]. He wants somebody to sit with him and listen, which our envoy assures me he is prepared to endure."
 generic_trade_expedition.137.a:0 "Copy every page of it"

 generic_trade_expedition.138.t:0 "Smoke In The Warehouse"
 generic_trade_expedition.138.desc:0 "Smoke was seen coming from a storehouse beside our own yard, and it was put out quickly; but not before a good deal of water had gone over a good deal of our cloth.\n\nNothing burned that was ours. A great deal of what is ours is now wet, and cloth does not improve."
 generic_trade_expedition.138.a:0 "Count the loss and move on"

 generic_trade_expedition.139.t:0 "A Midnight Bargain"
 generic_trade_expedition.139.desc:0 "A broker came to our envoy after dark, my [ROOT.GetCountry.GetRulerTitle], with an offer that would see our convoy cleared and away days ahead of schedule.\n\nIt requires no bribe and breaks no law he was willing to name; it simply requires that certain paperwork be dated a little before it was signed, and that nobody ask why. He was very insistent about the hour at which we answer."
 generic_trade_expedition.139.a:0 "Take the offer"
 generic_trade_expedition.139.b:0 "No deal that will not survive daylight"

 generic_trade_expedition.host.a:0 "So noted"

 generic_trade_expedition.200.t:0 "Foreign Trade Envoys"
 generic_trade_expedition.200.desc:0 "Envoys from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have arrived at court to propose a trading expedition to [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], my [ROOT.GetCountry.GetRulerTitle]. They were courteous, well briefed, and rather better prepared than the last three embassies that came through that door.\n\nThey want harbor rights and they are willing to pay for them. Our harbormaster has already begun calculating what the traffic would be worth."

 generic_trade_expedition.202.t:0 "Gifts From [SCOPE.sCountry('generic_trade_expedition_sender').GetName]"
 generic_trade_expedition.202.desc:0 "The gifts have arrived ahead of the expedition, [ROOT.GetCountry.GetRuler.GetName], and they have been laid out in the hall for the court to admire and quietly appraise.\n\nThe chamberlain has priced them already, as chamberlains do, and reports that [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has spent real money on us. Whether that is respect or investment is a question for after the ships arrive."
 generic_trade_expedition.202.desc.lavish:0 "The envoys of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have sent gifts that made the whole hall go quiet, [ROOT.GetCountry.GetRuler.GetName]; worked ornaments, costly wares, and letters of friendship written by somebody who was paid very well to write them.\n\nOur chamberlain has appraised the lot twice. They want something substantial from us, and they have had the courtesy to say so in a language we all understand."
 generic_trade_expedition.202.desc.practical:0 "The envoys of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have sent gifts of a distinctly unromantic kind, my [ROOT.GetCountry.GetRulerTitle]; good tools, accurate measures, and wares chosen by somebody who knew exactly what our craftsmen actually lack.\n\nThere is nothing here to display at a feast. Half the workshops in the city would take it over gold, and the envoys clearly knew that before they packed."
 generic_trade_expedition.202.desc.ceremonial:0 "The envoys of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have sent ceremonial gifts and formal letters, correct in every particular and modest in value.\n\nIt is not a display of wealth, [ROOT.GetCountry.GetRuler.GetName]; it is a display of homework. Somebody over there took the trouble to learn how these things are properly done here, which in its way says more than a chest of silver would."
 generic_trade_expedition.202.a:0 "Receive them graciously"

 generic_trade_expedition.203.t:0 "Harbor Rights Granted"
 generic_trade_expedition.203.desc:0 "We have granted the expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] leave to enter [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], trade under our protection, and depart unmolested.\n\nThe harbormaster has been instructed accordingly and the guilds have been told to expect strangers with money. Both, in their different ways, are pleased."
 generic_trade_expedition.203.a:0 "Let the harbormaster prepare"

 generic_trade_expedition.204.t:0 "A Foreign Convoy Arrives"
 generic_trade_expedition.204.desc:0 "The convoy from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has come into [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] and it is larger than the letters suggested, my [ROOT.GetCountry.GetRulerTitle]. Our pilots brought them in without incident; the quay has not stopped talking since.\n\nEvery broker in the city has already found a reason to walk past their berth."
 generic_trade_expedition.204.a:0 "Watch the quays closely"

 generic_trade_expedition.205.t:0 "Before Our Harbor Master"
 generic_trade_expedition.205.desc:0 "The foreigners have registered with our harbor office. The manner in which they did it has been noted, [ROOT.GetCountry.GetRuler.GetName]; our harbormaster forms opinions about people from how they behave in that room, and he is rarely wrong."
 generic_trade_expedition.205.desc.seals:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] registered cleanly with our harbor master; every due paid, every seal taken, no argument offered.\n\nHe reports them as the least troublesome foreigners to come through his office in years, which from that man is close to affection."
 generic_trade_expedition.205.desc.bargained:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] registered with our harbor master only after contesting nearly every line of the schedule.\n\nThey paid in the end, my [ROOT.GetCountry.GetRulerTitle], and they paid less than they were first asked. Our harbormaster is torn between irritation and a certain grudging professional respect."
 generic_trade_expedition.205.desc.shortcut:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has entered our harbor records by a route that our harbor master did not put in his report, and that somebody in his office certainly did.\n\nNothing is provably wrong. Everything about it is slightly convenient, and convenience of that sort is usually paid for somewhere."

 generic_trade_expedition.206.t:0 "Foreign Warehouses"
 generic_trade_expedition.206.desc:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has arranged storage in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. Where they chose to put their goods, and what they were willing to pay to keep them safe, tells us a good deal about how much they trust us."
 generic_trade_expedition.206.desc.bonded:0 "The foreigners have taken official bonded storage in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] at full price and without haggling, [ROOT.GetCountry.GetRuler.GetName].\n\nThey are carrying something they are unwilling to gamble on a cheap roof, which is worth knowing."
 generic_trade_expedition.206.desc.guarded:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has declined our warehouses and hired its own guards and factors instead.\n\nIt is their right, my [ROOT.GetCountry.GetRulerTitle]. It also says, without saying it, exactly how much they trust our locks."
 generic_trade_expedition.206.desc.cramped:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has settled for the cheap quay sheds; the ones with the optimistic roofs.\n\nEither they are carrying nothing worth stealing, or they are a great deal poorer than their gifts suggested. The quay is already betting on which."

 generic_trade_expedition.207.t:0 "Our Guilds Receive The Foreigners"
 generic_trade_expedition.207.desc:0 "The brokers and guild elders of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] have met the merchants of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y], and the meeting went on some hours longer than anyone scheduled.\n\nWhat the foreigners came to buy is now the subject of a great deal of conversation in this city, my [ROOT.GetCountry.GetRulerTitle], and several of our own prices have already moved."
 generic_trade_expedition.207.desc.bulk:0 "The merchants of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have gone for grain, hides, timber and salt; the dull, dependable trade that our older houses live on.\n\nNo one will write a song about it, [ROOT.GetCountry.GetRuler.GetName], and every bulk guild in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] is suddenly very pleased to see foreigners."
 generic_trade_expedition.207.desc.luxury:0 "The merchants of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] are chasing rare goods; spice, dyed cloth, worked silver, and anything else our guilds can describe as scarce with a straight face.\n\nPrices in that quarter of the market have already moved, my [ROOT.GetCountry.GetRulerTitle], and not all of the movement is honest."
 generic_trade_expedition.207.desc.knowledge:0 "The merchants of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] seem nearly as interested in how we do business as in what we sell. Their scribes are in the market hall daily, asking about measures, contracts and dues.\n\nThey are buying our methods, [ROOT.GetCountry.GetRuler.GetName], and paying for them in ordinary trade. It is the cheapest thing in this harbor and possibly the most valuable."

 generic_trade_expedition.208.t:0 "Foreign Scribes In The Market"
 generic_trade_expedition.208.desc:0 "The expedition's scribes have begun writing down how our market works, [ROOT.GetCountry.GetRuler.GetName]. Our dues, our contracts, our weights, and the small customs that no law of ours has ever recorded.\n\nIt is not forbidden. It is not quite comfortable either."

 generic_trade_expedition.209.t:0 "Foreign Cargo Loading"
 generic_trade_expedition.209.desc:0 "The convoy from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has begun loading in earnest, and the quays of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] have not been this busy in a decade. Every porter in the city is employed and every one of them is being paid in foreign silver."

 generic_trade_expedition.210.t:0 "A Foreign Quarter Takes Shape"
 generic_trade_expedition.210.desc:0 "The merchants of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have gathered their business into one corner of the harbor, my [ROOT.GetCountry.GetRulerTitle]; the same warehouses, the same lanes, the same tavern.\n\nNobody planned it and nobody objects. That is generally how a foreign quarter begins."

 generic_trade_expedition.211.t:0 "A Foreign Factor House"
 generic_trade_expedition.211.desc:0 "Agents of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have taken rooms in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] and intend to stay after their ships have gone; a seal on the door, a clerk, and a strongbox.\n\nIt is a small thing, [ROOT.GetCountry.GetRuler.GetName], and small things of this kind have a way of still being there in thirty years."
 generic_trade_expedition.211.a:0 "Keep their seals in order"

 generic_trade_expedition.212.t:0 "Their Manifest Is Sealed"
 generic_trade_expedition.212.desc:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has sealed its manifest and settled its accounts with our harbor office. Everything they owe us has been paid, which our harbormaster reports with the faint disappointment of a man who had prepared for an argument."
 generic_trade_expedition.212.a:0 "Clear their departure"

 generic_trade_expedition.213.t:0 "The Foreign Convoy Departs"
 generic_trade_expedition.213.desc:0 "They sailed this morning on the tide, my [ROOT.GetCountry.GetRulerTitle], low in the water and in good order. A fair part of the quay turned out to watch them go, which for this city is a considerable compliment.\n\nThey have said they will return. Rather more importantly, our merchants have begun assuming that they will."
 generic_trade_expedition.213.a:0 "May the route stay open"

 generic_trade_expedition.214.t:0 "A Trade Mission Concluded"
 generic_trade_expedition.214.desc:0 "Word has come that the expedition of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] reached home safely and profitably, [ROOT.GetCountry.GetRuler.GetName].\n\nTheir merchants have done well out of us and ours have done well out of them, which is the only sort of arrangement that survives a change of ruler on either side."
 generic_trade_expedition.214.a:0 "A profitable friendship"

 generic_trade_expedition.215.t:0 "The Interpreter's Ledger"
 generic_trade_expedition.215.desc:0 "The interpreters are hired, and [SCOPE.sChar('generic_trade_expedition_envoy').GetName] has spent a night at a table with them sorting the vocabulary he will need into three columns; market terms, courtesies, and insults.\n\nThe third column, he reports, is by far the longest, and two of the entries in it are words he had been using all week believing them to be greetings."

 generic_trade_expedition.216.t:0 "Surveying The Home Quays"
 generic_trade_expedition.216.desc:0 "The survey of our own market is finished, and it has turned up rather more than old habits and familiar faces. There is a shed at the end of the quay that three separate men believe they are renting; there is a weighing house nobody has used since the last [ROOT.GetCountry.GetAdjective] census; and there is, apparently, a great deal of money to be made in things our own merchants have never thought to ask for."

 generic_trade_expedition.217.t:0 "Charting The Course"
 generic_trade_expedition.217.desc:0 "The route is drawn out in full at last; shoals, currents, the two headlands where the wind turns without warning, and the stretch of coast our oldest pilot marks with a symbol he declined to explain to the scribe.\n\nIt has taken four men a month and it will save the next captain who reads it a great deal more than that."

 generic_trade_expedition.218.t:0 "Provisioning The Convoy"
 generic_trade_expedition.218.desc:0 "The stores have been packed, unpacked and packed again, my [ROOT.GetCountry.GetRulerTitle], because the quartermaster and the senior pilot disagree profoundly about where water should be stowed and neither will yield the point.\n\nIt has been resolved in the traditional manner; the quartermaster has won, the pilot has said nothing further, and the pilot has quietly moved four barrels back to where he wanted them in the first place."

 generic_trade_expedition.219.t:0 "A Feast For Departure"
 generic_trade_expedition.219.desc:0 "The whole quay ate together last night, [ROOT.GetCountry.GetRuler.GetName]. There were speeches; there were rather too many speeches; and by the end of them every man sailing tomorrow had been promised something by somebody staying behind.\n\nThe crews went aboard at dawn in poor condition and excellent spirits, which the sailing master assures me is the correct order of those two things."

 generic_trade_expedition.220.t:0 "The Customs Ledger"
 generic_trade_expedition.220.desc:0 "Our scribes have copied out the foreign customs tables in full, along with the small exceptions that are the only reason the harbor functions at all; which goods are weighed and which are counted, which quarrel goes to the guild and which goes to the temple, and which two families are never assigned to the same weighing house.\n\nNone of it is written in their own law. All of it is how their law actually works."

 generic_trade_expedition.221.t:0 "Cargo Loading Finished"
 generic_trade_expedition.221.desc:0 "The holds are full, and the quay has gone strangely quiet after four months of shouting. What is left is the creak of rope taking weight and a crew standing about looking at ships that suddenly sit a great deal lower than they did.\n\n[SCOPE.sChar('generic_trade_expedition_envoy').GetName] has walked the length of every deck twice and can be seen doing it a third time."

 generic_trade_expedition.222.t:0 "A Factor House Established"
 generic_trade_expedition.222.desc:0 "It is no longer a proposal, my [ROOT.GetCountry.GetRulerTitle]; it is an address. Two rooms above a cooper's yard, a strongbox, a seal, a clerk who is being paid in a currency he has agreed to accept, and our name painted on the door in a script none of us can read.\n\nThe neighbours have already begun treating it as a permanent feature of the street, which is precisely what we wanted and rather faster than we expected."

 generic_trade_expedition.223.t:0 "The Manifest Is Sealed"
 generic_trade_expedition.223.desc:0 "Every crate, contract and debt now sits beneath a final seal, witnessed by three men who will never meet again.\n\nWhatever mistakes are in it are in it now; they will have to survive the voyage home along with everything else, and be argued about on our own quay where at least the argument will be in our own language."

 generic_trade_expedition.224.t:0 "Home Water"
 generic_trade_expedition.224.desc:0 "The lookout sighted our own coast this morning, [ROOT.GetCountry.GetRuler.GetName], and the cheer that went up was heard by a fishing boat two miles off, which promptly turned and raced us in so as to be first with the news.\n\nThey lost. The convoy came in under full sail with every man who could stand standing, and the town had begun gathering on the quay before we had a rope ashore."

 generic_trade_expedition.225.t:0 "The Envoy Is Honored"
 generic_trade_expedition.225.desc:0 "[SCOPE.sChar('generic_trade_expedition_envoy').GetName] was honored publicly this morning, and bore it with the expression of a man who has rehearsed being modest and is discovering that it is harder than it looks.\n\nThe crews cheered him. The merchants cheered him rather louder, having done well out of him. Somewhere toward the back of the crowd, several men who had not previously thought much of him were observed applauding thoughtfully."

 generic_trade_expedition.226.t:0 "The Charts Are Published"
 generic_trade_expedition.226.desc:0 "The routes, soundings and warnings are copied out and given to every master in our service, my [ROOT.GetCountry.GetRulerTitle]. What was one expedition's hard-won secret is now simply how one sails to [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y].\n\nOur older captains are said to be unhappy about this, which I take as proof that it was worth doing."

 #################### EXPANDED VOYAGE - TASKS ####################

 generic_trade_expedition_appoint_escort:0 "Appoint An Escort"
 generic_trade_expedition_appoint_escort_DESC:0 "Merchantmen ride low and slow, and every pilot between here and [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] knows exactly what that means. A few warships and a captain who answers to our envoy will cost us something now; they will be worth every coin the first time a strange sail turns toward the convoy."

 generic_trade_expedition_make_stopover:0 "Put In At [SCOPE.sP('generic_trade_expedition_stopover_port_scope').GetName]"
 generic_trade_expedition_make_stopover_DESC:0 "The crossing is long enough that our holds will want fresh water and our hulls fresh pitch before we ever see the marketplace. [SCOPE.sCountry('generic_trade_expedition_stopover_country').GetName|Y] keeps a harbor on our route; whether we enter it as guests or simply enter it is for us to decide."

 generic_trade_expedition_settle_customs:0 "Settle The Customs Duties"
 generic_trade_expedition_settle_customs_DESC:0 "Nothing leaves the quays of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] until the ledger agrees with the cargo. We may pay what is written; or we may pay rather less to the man holding the pen, and have him write something friendlier."

 generic_trade_expedition_outbid_rival:0 "Outbid The Rival Merchants"
 generic_trade_expedition_outbid_rival_DESC:0 "The factors of [SCOPE.sCountry('generic_trade_expedition_rival').GetName|Y] were here long before us, and the guildmasters of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] already know their names and drink their wine. We can buy their place at the table, share the market with them, or find out what the guilds do when nobody bids at all."

 generic_trade_expedition_return_passage:0 "Run The Passage Home"
 generic_trade_expedition_return_passage_DESC:0 "Laden ships are slow ships, my [ROOT.GetCountry.GetRulerTitle], and every hull between [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] and home is now carrying the entire profit of the venture. This is the leg that has drowned more fortunes than any storm at the outset."

 generic_trade_expedition_factor_house_cap_tt:0 "We must keep fewer than #Y three#! foreign factor houses."

 #################### CHARTER TOOLTIPS ####################

 generic_trade_expedition_charter_company_tt:0 "#Y We shall grant the venture to a merchant house as a Chartered Company.#!\n  #G Permanent commerce, trade routes and standing abroad.#!\n  #R The house will grow into a power of its own; the crown pays for it in influence, forever.#!"
 generic_trade_expedition_charter_monopoly_tt:0 "#Y We shall take the trade into the treasury as a Crown Monopoly.#!\n  #G Permanent tax and export revenue, and a steadier state.#!\n  #R Tyranny, unhappy citizens, and a partner who now bargains with a cartel instead of with traders.#!"
 generic_trade_expedition_charter_colony_tt:0 "#Y We shall raise the factor house into a Factor Colony.#!\n  #G A permanent foothold, a claim on the port, and room for our people to grow there.#!\n  #R Aggressive expansion, a frightened partner, and a reputation that follows us.#!"
 generic_trade_expedition_charter_replace_tt:0 "#R This will tear up the Charter we already hold.#! Its modifiers are lost, the men who built their lives around it will not forget it, and our stability will suffer for it."

 #################### CHARTER MODIFIERS ####################

 generic_trade_expedition_charter_company_cmod:0 "Chartered Company"
 desc_generic_trade_expedition_charter_company_cmod:0 "A merchant house holds our foreign trade by charter. They are extremely good at it; they are also no longer entirely ours to command."
 generic_trade_expedition_charter_company_pmod:0 "Company Seat"
 desc_generic_trade_expedition_charter_company_pmod:0 "The company keeps its counting houses, its warehouses and its own private quay here."

 generic_trade_expedition_crown_monopoly_cmod:0 "Crown Monopoly"
 desc_generic_trade_expedition_crown_monopoly_cmod:0 "Foreign trade belongs to the state now. The revenue is excellent; the merchants who built the routes are still writing letters about it."
 generic_trade_expedition_crown_monopoly_pmod:0 "Monopoly Warehouse"
 desc_generic_trade_expedition_crown_monopoly_pmod:0 "State warehouses, state scales, state prices, and a quayside that resents all three."

 generic_trade_expedition_factor_colony_cmod:0 "Factor Colony"
 desc_generic_trade_expedition_factor_colony_cmod:0 "Our people hold a quarter of a foreign port; a wharf, a shrine, a burial ground, and a claim that everybody can see."
 generic_trade_expedition_factor_colony_pmod:0 "Foreign Colony"
 desc_generic_trade_expedition_factor_colony_pmod:0 "A walled quarter of our own countrymen, growing quietly inside somebody else's harbor."

 generic_trade_expedition_charter_dissolved_cmod:0 "Dissolved Charter"
 desc_generic_trade_expedition_charter_dissolved_cmod:0 "We tore up our own trading settlement in order to write a different one; the men who had built their lives around the old arrangement noticed."

 #################### VOYAGE MODIFIERS ####################

 generic_trade_expedition_escort_cmod:0 "Trade Escort"
 desc_generic_trade_expedition_escort_cmod:0 "Warships sail with the convoy, and their captains have orders about strange sails."
 generic_trade_expedition_stopover_pmod:0 "Waystation"
 desc_generic_trade_expedition_stopover_pmod:0 "Our ships water and refit here on the long crossing."
 generic_trade_expedition_stopover_cmod:0 "Secured Waystation"
 desc_generic_trade_expedition_stopover_cmod:0 "A friendly harbor halfway out makes the whole route shorter than it looks on any chart."
 generic_trade_expedition_guild_favour_cmod:0 "Guild Favour"
 desc_generic_trade_expedition_guild_favour_cmod:0 "The guildmasters of a foreign market would rather deal with our factors than with anybody else's."
 generic_trade_expedition_customs_bribed_cmod:0 "Bought Ledgers"
 desc_generic_trade_expedition_customs_bribed_cmod:0 "Our cargo passes cheaply through a foreign customs house; somebody there could ruin us with one honest afternoon."

 generic_trade_expedition_storm_damage_cmod:0 "Storm Damage"
 desc_generic_trade_expedition_storm_damage_cmod:0 "Sprung timbers, split canvas, and a crew that has stopped talking about the crossing altogether."
 generic_trade_expedition_pirate_losses_cmod:0 "Losses To Pirates"
 desc_generic_trade_expedition_pirate_losses_cmod:0 "Word travels fast; our convoys can be taken, and every underwriter on our coast has heard about it."
 generic_trade_expedition_mutinous_crew_cmod:0 "Mutinous Crews"
 desc_generic_trade_expedition_mutinous_crew_cmod:0 "The ships sail. The crews sail because they must, which is not the same thing."
 generic_trade_expedition_lost_envoy_cmod:0 "Abandoned Our Envoy"
 desc_generic_trade_expedition_lost_envoy_cmod:0 "We left the man who spoke for us standing on a foreign quay; others who might have spoken for us have drawn their own conclusions."

 generic_trade_expedition_partner_tariffs_cmod:0 "Foreign Tariffs"
 desc_generic_trade_expedition_partner_tariffs_cmod:0 "A partner who feels slighted has discovered a tremendous enthusiasm for harbor dues."
 generic_trade_expedition_exclusivity_cmod:0 "Exclusive Partnership"
 desc_generic_trade_expedition_exclusivity_cmod:0 "Excellent terms in one market, bought with a promise to seek no other."
 generic_trade_expedition_rival_undercut_cmod:0 "Undercut By Rivals"
 desc_generic_trade_expedition_rival_undercut_cmod:0 "Somebody else's factors are setting the price in a market we had hoped to make our own."

 generic_trade_expedition_envoy_rival_charmod:0 "Sent Abroad"
 desc_generic_trade_expedition_envoy_rival_charmod:0 "Four years at sea is four years not spent building a following at home; he is entirely aware of this."
 generic_trade_expedition_envoy_client_charmod:0 "Trusted Envoy"
 desc_generic_trade_expedition_envoy_client_charmod:0 "A safe pair of hands, sent abroad precisely because they are a safe pair of hands."
 generic_trade_expedition_envoy_kin_charmod:0 "Royal Envoy"
 desc_generic_trade_expedition_envoy_kin_charmod:0 "The ruler's own blood speaks for us abroad, and will come home knowing exactly what that was worth."
 generic_trade_expedition_envoy_lowborn_charmod:0 "Merchant Envoy"
 desc_generic_trade_expedition_envoy_lowborn_charmod:0 "No house behind him and no estates to come home to; nothing to build on but the voyage itself."
 generic_trade_expedition_sidelined_envoy_cmod:0 "A Quiet Homecoming"
 desc_generic_trade_expedition_sidelined_envoy_cmod:0 "The venture succeeded. The man who led it was thanked in a small room and sent home."

 #################### OPINIONS ####################

 opinion_trade_expedition_monopoly_resented:0 "Resents Our Trade Monopoly"
 opinion_trade_expedition_colony_alarm:0 "Alarmed By Our Foreign Colony"
 opinion_trade_expedition_company_respected:0 "Respects Our Chartered Company"
 opinion_trade_expedition_demand_met:0 "We Met Their Price"
 opinion_trade_expedition_demand_refused:0 "We Refused Their Price"
 opinion_trade_expedition_exclusive_partner:0 "Our Exclusive Trade Partner"
 opinion_trade_expedition_exclusivity_refused:0 "We Declined Their Exclusive Offer"
 opinion_trade_expedition_envoy_poached:0 "Courted Our Envoy"
 opinion_trade_expedition_customs_bribed:0 "Suspects Our Dealings At Customs"
 opinion_trade_expedition_customs_honest:0 "We Paid Our Duties Honestly"
 opinion_trade_expedition_stopover_paid:0 "We Paid Their Harbor Dues"
 opinion_trade_expedition_stopover_forced:0 "We Used Their Harbor Uninvited"

 #################### EVENTS - ENVOY ARCHETYPES ####################


 #################### EVENTS - THE CHARTER ####################

 generic_trade_expedition.300.t:0 "The Charter"
 generic_trade_expedition.300.desc:0 "The ledgers are closed, the cargo is sold, and the council has finally stopped arguing about whether the venture was worth the trouble, [ROOT.GetCountry.GetRuler.GetName]. Now they are arguing about something rather more important; what it becomes.\n\nA voyage is only a voyage. What we write down this week will decide what [ROOT.GetCountry.GetAdjective] trade with [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] looks like for a generation, and we can hold only one such charter at a time. Whatever we choose here, the others go back into the chest."
 generic_trade_expedition.300.a:0 "Charter a company; let merchants do what merchants do"
 generic_trade_expedition.300.b:0 "Take it for the crown; trade is far too valuable to leave to traders"
 generic_trade_expedition.300.c:0 "Raise the factor house into a colony of our own"
 generic_trade_expedition.300.d:0 "Take the profit and let the venture disperse"

 generic_trade_expedition.310.t:0 "The Envoy Returns"
 generic_trade_expedition.310.desc:0 "[SCOPE.sCharacter('generic_trade_expedition_envoy').GetName] has come home rich, brown as a sailor, and followed by a crowd that did not exist when he left, my [ROOT.GetCountry.GetRulerTitle]. Half the quayside turned out to watch the ships come in; it was not the ships they were shouting for.\n\nHe has served [ROOT.GetCountry.GetName] very well indeed. That, if I may say so, is precisely the difficulty."
 generic_trade_expedition.310.a:0 "Honor him publicly; he has earned every bit of it"
 generic_trade_expedition.310.b:0 "Thank him quietly, and let the treasury take the credit"

 #################### EVENTS - VOYAGE FLAVOUR ####################

 generic_trade_expedition.230.t:0 "An Escort Assigned"
 generic_trade_expedition.230.desc:0 "Three warships now ride at anchor beside the merchantmen at [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y], and their captains have been given orders that they clearly consider beneath them; follow the fat ships, do not outrun the fat ships, and come back with the fat ships."
 generic_trade_expedition.230.a:0 "They shall earn their keep before this is over"

 generic_trade_expedition.231.t:0 "The Passage Home"
 generic_trade_expedition.231.desc:0 "The holds are full, the manifest is sealed, and every hull in the convoy is now carrying rather more value than it cost to build. Our envoy has taken to sleeping on deck.\n\nOn the way out we risked ships, my [ROOT.GetCountry.GetRulerTitle]; on the way home we risk the whole venture."
 generic_trade_expedition.231.a:0 "Make for home, and quickly"

 #################### EVENTS - VOYAGE RISK ####################

 generic_trade_expedition.400.t:0 "Weather Off The Cape"
 generic_trade_expedition.400.desc:0 "The wind came round in the night and stayed there for three days, [ROOT.GetCountry.GetRuler.GetName]. When it finally let go of us the convoy was scattered across forty miles of grey water, one ship was towing another, and the pitch had boiled out of a dozen seams.\n\nEvery hull will want a yard and a month before it is worth anything to anyone."
 generic_trade_expedition.400.a:0 "Sailors' luck; pay the shipwrights and say no more about it"

 generic_trade_expedition.401.t:0 "Strange Sails"
 generic_trade_expedition.401.desc:0 "They came out from behind an island at first light, low and fast and far too confident, and they did not trouble themselves to show any colours at all. These men have been watching this route for a season; they know exactly what a convoy moving that slowly is carrying."
 generic_trade_expedition.401.a:0 "Signal the escort and let them come!"
 generic_trade_expedition.401.b:0 "We have nothing to fight with; give them the cargo"

 generic_trade_expedition.402.t:0 "Trouble Below Decks"
 generic_trade_expedition.402.desc:0 "The water has been foul for a fortnight, the crossing is a good deal longer than anyone was told it would be, and this morning the crews of two ships declined to work until somebody explains the arrangement to them properly.\n\nOur envoy has sent to ask what, exactly, we would like him to explain."
 generic_trade_expedition.402.a:0 "Pay them out of the expedition purse"
 generic_trade_expedition.402.b:0 "Hang the ringleaders and sail short-handed"

 generic_trade_expedition.403.t:0 "The Harbor Is Closed"
 generic_trade_expedition.403.desc:0 "A fast courier has caught the convoy in mid-passage with unwelcome news, my [ROOT.GetCountry.GetRulerTitle]. [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] has raised its harbor dues without any warning whatsoever, and the new schedule appears to have been written with our ships specifically in mind.\n\nWe may still trade there. It will simply cost us a great deal more than we had planned for."
 generic_trade_expedition.403.a:0 "Then it costs more; we have come too far to turn about"

 generic_trade_expedition.404.t:0 "The Envoy Is Taken Ill"
 generic_trade_expedition.404.desc:0 "[SCOPE.sCharacter('generic_trade_expedition_envoy').GetName] has been carried off the ship with a fever that the local physicians recognise at once and ours have never seen. They say he may mend within the month; they also say he may not mend at all.\n\nThe cargo does not have a month, and neither the tide nor the season much cares who is sick."
 generic_trade_expedition.404.a:0 "The expedition waits for its envoy"
 generic_trade_expedition.404.b:0 "Press on; he can follow when he can stand"

 #################### EVENTS - PARTNERS AND RIVALS ####################

 generic_trade_expedition.450.t:0 "The Harbor At [SCOPE.sP('generic_trade_expedition_stopover_port_scope').GetName]"
 generic_trade_expedition.450.desc:0 "Our water has gone green, our bread is very nearly walking, and the nearest safe anchorage belongs to [SCOPE.sCountry('generic_trade_expedition_stopover_country').GetName|Y]. Their harbor master has rowed out to ask us, most politely, what our business is and what we intend to pay for it.\n\nHe has four boats behind him. It is a polite question; it is being asked in a particular way."
 generic_trade_expedition.450.a:0 "Pay the dues; we are traders, not raiders"
 generic_trade_expedition.450.b:0 "Take on water and go, and let them send us a bill"
 generic_trade_expedition.450.c:0 "Stand off the coast and press on thirsty"

 generic_trade_expedition.451.t:0 "The Customs House"
 generic_trade_expedition.451.desc:0 "The customs house of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] is a cool stone room with a very warm official sitting in it, and he has now been counting our amphorae for two hours with the air of a man who fully intends to be here all week.\n\nHe has mentioned twice, without appearing to mention it at all, that the schedule of duties allows for a certain amount of interpretation; and that he is the interpreter."
 generic_trade_expedition.451.a:0 "Pay what the ledger says and be done with it"
 generic_trade_expedition.451.b:0 "Pay the man holding the pen instead"

 generic_trade_expedition.452.t:0 "We Are Not The First Here"
 generic_trade_expedition.452.desc:0 "The factors of [SCOPE.sCountry('generic_trade_expedition_rival').GetName|Y] have kept a house on this street for six years, [ROOT.GetCountry.GetRuler.GetName]. The guildmasters know their names, drink their wine, and have already been told at some length what our arrival is likely to do to the price of everything.\n\nOur envoy reports that he was received courteously; and that courteously is doing a great deal of work in that sentence."
 generic_trade_expedition.452.a:0 "Buy their place at the table"
 generic_trade_expedition.452.b:0 "Divide the market with them and keep the peace"
 generic_trade_expedition.452.c:0 "Let the guilds decide on merit"

 generic_trade_expedition.453.t:0 "The Price Has Changed"
 generic_trade_expedition.453.desc:0 "The gifts were received, admired, and described at the court of [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] as a most promising beginning.\n\nA promising beginning, their chamberlain went on to explain, is not at all the same thing as an arrangement; there are other courts, and other convoys. He said all of this while gazing out of a window at our ships."
 generic_trade_expedition.453.a:0 "Meet the new price; we have come this far"
 generic_trade_expedition.453.b:0 "Refuse! We came here to trade, not to be milked"

 generic_trade_expedition.454.t:0 "An Exclusive Offer"
 generic_trade_expedition.454.desc:0 "[SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] has made us an offer of the sort that is flattering until one reads it a second time, my [ROOT.GetCountry.GetRulerTitle]. Preferential dues, a permanent berth, first refusal on the whole season's cargo; and our sworn word that no expedition of ours will seek another market for ten years.\n\nThey would very much like to be our trade partner. They would like it to be singular."
 generic_trade_expedition.454.a:0 "Accept; one good market is worth three uncertain ones"
 generic_trade_expedition.454.b:0 "Decline; our ships go where we send them"

 #################### RISK TOOLTIPS ####################

 generic_trade_expedition_risk_check_tt:0 "#Y The crossing is not a safe one.#!\n  There is a [SCOPE.ScriptValue('generic_trade_expedition_risk_svalue')|Y0]% chance of trouble on this leg; #R foul weather#!, #R pirates#!, #R quarrels among the crews#!, a #R harbor closed against us#!, or #R our envoy taken ill#! far from home.\n  An escort, full provisions, prepared charts and a friendly waystation all make this less likely; distance, foreign tariffs and a rival working the same market all make it worse."
 generic_trade_expedition_return_risk_check_tt:0 "#Y The laden passage home is the dangerous one, my [ROOT.GetCountry.GetRulerTitle].#!\n  The convoy is tested #Y twice#! on this leg, each time with a [SCOPE.ScriptValue('generic_trade_expedition_risk_svalue')|Y0]% chance of trouble; #R foul weather#!, #R pirates#!, #R quarrels among the crews#!, a #R harbor closed against us#!, or #R our envoy taken ill#!.\n  Every hull is carrying the whole profit of the venture. If we lose the cargo now, we lose very nearly everything the expedition was worth."

 generic_trade_expedition_partner_haggle_tt:0 "#Y [SCOPE.sCountry('generic_trade_expedition_partner').GetName] may decide our gifts were not quite enough#!, and ask for more before they open their harbor to us."
 generic_trade_expedition_exclusivity_offer_tt:0 "#Y [SCOPE.sCountry('generic_trade_expedition_partner').GetName] may offer us an exclusive partnership#!; better terms in their market, in exchange for our word that we shall send no other expedition anywhere for a decade."

 #################### THE PURSE - NEW TASKS ####################

 generic_trade_expedition_raise_capital:0 "Raise The Capital"
 generic_trade_expedition_raise_capital_DESC:0 "Somebody has to pay for all of this before a single rope is bought, my [ROOT.GetCountry.GetRulerTitle]; and whoever pays for a venture tends to end up owning it. The treasury can carry it alone, our merchant houses would be delighted to help, and the temples have been known to lend at very reasonable rates to ventures they approve of."

 generic_trade_expedition_commission_merchants:0 "Commission The Merchants"
 generic_trade_expedition_commission_merchants_DESC:0 "Names on contracts, shares agreed, and the factors who will actually do the bargaining chosen and sworn. Our envoy speaks for [ROOT.GetCountry.GetName]; these are the men who will speak for the purse."

 #################### FUNDING MODIFIERS ####################

 generic_trade_expedition_crown_funded_cmod:0 "Crown-Funded Venture"
 desc_generic_trade_expedition_crown_funded_cmod:0 "The treasury carried this expedition by itself, and the treasury will expect to be remembered for it."
 generic_trade_expedition_merchant_funded_cmod:0 "Merchant-Funded Venture"
 desc_generic_trade_expedition_merchant_funded_cmod:0 "Our merchant houses put up the money without being asked twice; they will not be shy about what they expect in return."
 generic_trade_expedition_temple_funded_cmod:0 "Temple-Funded Venture"
 desc_generic_trade_expedition_temple_funded_cmod:0 "The temples lent us the money at a respectable rate, and now take a respectable interest in how the venture conducts itself."
 generic_trade_expedition_commissioned_merchants_cmod:0 "Commissioned Merchants"
 desc_generic_trade_expedition_commissioned_merchants_cmod:0 "Contracts signed, shares agreed, and every factor knows precisely what he is owed and what he owes."

 #################### THE PURSE - EVENTS ####################

 generic_trade_expedition.320.t:0 "Who Pays For The Ships"
 generic_trade_expedition.320.desc:0 "The accounting is done, [ROOT.GetCountry.GetRuler.GetName], and the accounting is unpleasant. A venture of this size cannot be paid for out of the ordinary revenues; somebody must be found who is willing to put up the money before the first rope is bought.\n\nThere are three doors we might knock on, and I would ask you to consider carefully which one we choose. Whoever pays for a venture has a habit of ending up owning it."
 generic_trade_expedition.320.a:0 "The treasury will carry it; the crown pays, the crown owns"
 generic_trade_expedition.320.b:0 "Let the merchant houses invest; they have been asking"
 generic_trade_expedition.320.c:0 "Borrow from the temples at a decent rate"

 generic_trade_expedition.321.t:0 "The Factors Are Sworn"
 generic_trade_expedition.321.desc:0 "The contracts are signed and the shares are agreed. Our envoy will speak for [ROOT.GetCountry.GetName] abroad; these men will speak for the purse, and they have spent the entire morning making very sure that everyone understands the difference."
 generic_trade_expedition.321.a:0 "Then we are ready to sail"

 #################### AT SEA ####################

 generic_trade_expedition.410.t:0 "A Good Wind"
 generic_trade_expedition.410.desc:0 "Nothing whatever has gone wrong, [ROOT.GetCountry.GetRuler.GetName], which after the last fortnight the crews are treating as an event in itself. The wind has held from the same quarter for six days, the convoy is together, and the cook has been persuaded to open the good barrel.\n\n[SCOPE.sCharacter('generic_trade_expedition_envoy').GetName] reports that morale aboard is dangerously high."
 generic_trade_expedition.410.a:0 "Long may it hold"

 generic_trade_expedition.411.t:0 "The Envoy Among The Crews"
 generic_trade_expedition.411.desc:0 "Word has come back with a returning coaster that our envoy has taken to eating with the crews rather than apart from them, and has spent most of a week learning to splice rope badly while the sailmaker laughed at him.\n\nIt is not what one expects of a man of his standing. The crews, I am told, have decided they will follow him anywhere."
 generic_trade_expedition.411.a:0 "A wiser man than his father, then"

 generic_trade_expedition.412.t:0 "Weather Ahead"
 generic_trade_expedition.412.desc:0 "There is a wall of cloud sitting across our course with lightning inside it, and the oldest pilot in the convoy has gone very quiet about what he thinks of it. We can put in behind the headland and let it pass, which costs us days we do not have; or we can run before it and make up all the time we lost provisioning.\n\nThe pilot has an opinion about that as well, my [ROOT.GetCountry.GetRulerTitle], and he has not offered it."
 generic_trade_expedition.412.a:0 "Put in and wait it out"
 generic_trade_expedition.412.b:0 "Run before it and make up the days"

 generic_trade_expedition.413.t:0 "Water And Shelter"
 generic_trade_expedition.413.desc:0 "The casks are lower than they ought to be and there is an anchorage a half day off our course; small, poor, and belonging to somebody. Their headman has already seen our sails and come down to the beach to watch us, which tells us he has thought about this before.\n\nWe can pay him, we can simply take on water and leave, or we can stay off the coast and be thirsty for another week."
 generic_trade_expedition.413.a:0 "Pay for the water like guests"
 generic_trade_expedition.413.b:0 "Take the water and go"
 generic_trade_expedition.413.c:0 "Stand off and stay thirsty"

 generic_trade_expedition.414.t:0 "A Boat Adrift"
 generic_trade_expedition.414.desc:0 "We came upon them a little after dawn; a fishing boat well out of sight of any land it had any business being near, four men aboard, three of them still alive. They have been out here eleven days.\n\nThey are nobody's subjects and nobody's problem, and one of them appears to be a pilot who has worked this coast his whole life."
 generic_trade_expedition.414.a:0 "Take them aboard and hear what the pilot knows"
 generic_trade_expedition.414.b:0 "We have not the water to spare; leave them"

 generic_trade_expedition.415.t:0 "The Envoy's Notes"
 generic_trade_expedition.415.desc:0 "[SCOPE.sCharacter('generic_trade_expedition_envoy').GetName] has apparently been keeping a book, and a returning ship has brought back a copy of what is in it so far; soundings, currents, the price of grain in three foreign harbors, a drawing of a rig none of our shipwrights have seen, and four pages on how a particular customs house cheats.\n\nHe seems to think of it as a pastime. Our scholars have asked, urgently, for the rest of it."
 generic_trade_expedition.415.a:0 "Copy every page of it"

 generic_trade_expedition.416.t:0 "Something Has Spoiled"
 generic_trade_expedition.416.desc:0 "One of the holds was not as dry as the man who sold us the caulking promised, my [ROOT.GetCountry.GetRulerTitle], and a good part of what is stowed in it has gone over. It cannot be sold as what it is; it could, with a certain flexibility, be sold as something else.\n\n[SCOPE.sCharacter('generic_trade_expedition_envoy').GetName] has asked for instructions, in writing, which I think tells us what he thinks of the idea."
 generic_trade_expedition.416.a:0 "Over the side with it"
 generic_trade_expedition.416.b:0 "Sell it quietly at home and say nothing"

 generic_trade_expedition.417.t:0 "Sails On The Same Course"
 generic_trade_expedition.417.desc:0 "We have company, [ROOT.GetCountry.GetRuler.GetName]. A convoy out of [SCOPE.sCountry('generic_trade_expedition_rival').GetName|Y] has been holding the same course a few miles off our beam since yesterday morning, bound, quite obviously, for exactly the same market we are.\n\nWhoever makes harbor first will have the guildmasters' whole attention for a week. Our captains have noticed this. They are looking at our envoy rather expectantly."
 generic_trade_expedition.417.a:0 "Salute them and hold our course"
 generic_trade_expedition.417.b:0 "Crowd them off the wind and let them remember it"


 #################### EVENT FLAVOUR ####################
 generic_trade_expedition.215.a:0 "Better to learn it here than there"
 generic_trade_expedition.216.a:0 "Put the survey to use"
 generic_trade_expedition.217.a:0 "Copy it, and copy it again"
 generic_trade_expedition.218.a:0 "Let them settle it between themselves"
 generic_trade_expedition.219.a:0 "A good send-off is never wasted"
 generic_trade_expedition.220.a:0 "Our own clerks should read every page"
 generic_trade_expedition.221.a:0 "Let him count them once more if it helps"
 generic_trade_expedition.222.a:0 "See that the seals stay in order"
 generic_trade_expedition.223.a:0 "Then we are finished here"
 generic_trade_expedition.224.a:0 "Bring them in"
 generic_trade_expedition.225.a:0 "He has earned the day"
 generic_trade_expedition.226.a:0 "Knowledge hoarded is knowledge wasted"

 generic_trade_expedition.200.a:0 "Hear what they are offering"
 generic_trade_expedition.205.a:0 "Our harbormaster is rarely wrong about people"
 generic_trade_expedition.206.a:0 "Note where they put their trust"
 generic_trade_expedition.207.a:0 "Let the guilds bargain hard"
 generic_trade_expedition.208.a:0 "Let them write; we shall read it too"
 generic_trade_expedition.209.a:0 "Every porter in the city is eating well"
 generic_trade_expedition.210.a:0 "These things have a way of becoming permanent"