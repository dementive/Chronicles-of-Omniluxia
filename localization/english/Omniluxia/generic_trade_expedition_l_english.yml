l_english:

 generic_trade_expedition:0 "A Trade Mission To [SCOPE.sCountry('generic_trade_expedition_partner').GetName]"
 generic_trade_expedition_DESCRIPTION:0 "The marketplaces of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] are rich, open, and close enough for a friendly expedition. If we charter the venture, prepare the convoy, negotiate properly, and choose our cargo with care, our merchants can return with goods, stories, and useful foreign contacts."
 generic_trade_expedition_CRITERIA_DESCRIPTION:0 "This mission will be completed when a trade fleet has sailed from [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] to the marketplace port of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], gathered cargo, returned home, and counted the profit."
 generic_trade_expedition_BUTTON_TOOLTIP:0 "Send a friendly trade expedition to a neighboring coastal country."
 generic_trade_expedition_BUTTON_DETAILS:0 "A nearby country with at least neutral opinion and a port containing a Marketplace will be chosen as our trade partner."
 generic_trade_expedition_REWARD_DESCRIPTION:0 "Completing this mission grants gold, Political Influence, improved relations, trade modifiers, and extra rewards based on the choices made during the expedition."

 generic_trade_expedition_open_contacts:0 "Charter The Venture"
 generic_trade_expedition_open_contacts_DESC:0 "The merchants of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] do not lack visitors, and their rulers will not open warehouses to strangers without preparation. We should charter the expedition, name an envoy, and begin the work before the first sail is raised."
 generic_trade_expedition_eligible_envoy_tt:0 "Have an eligible adult courtier who can lead the expedition."
 generic_trade_expedition_envoy_selected_tt:0 "Choose an envoy to lead the expedition."

 generic_trade_expedition_hire_interpreters:0 "Hire Interpreters"
 generic_trade_expedition_hire_interpreters_DESC:0 "A bargain can sour over one badly chosen word. Interpreters, harbor guides, and scribes familiar with foreign measures will keep our envoy from mistaking courtesy for insult or promises for idle talk."

 generic_trade_expedition_survey_home_market:0 "Survey Home Demand"
 generic_trade_expedition_survey_home_market_DESC:0 "Before our ships leave [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y], our merchants should learn what foreign luxuries, staples, tools, and curiosities will actually sell at home. A well-loaded fleet begins with honest questions."

 generic_trade_expedition_exchange_gifts:0 "Exchange Gifts"
 generic_trade_expedition_exchange_gifts_DESC:0 "Fine cloth, polished vessels, oath-gifts, and measured courtesy will prove that our visit to [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] is meant to enrich both courts. The gift ledger will decide whether we arrive as honored guests, careful traders, or ceremonious petitioners."

 generic_trade_expedition_harbor_rights:0 "Negotiate Harbor Rights"
 generic_trade_expedition_harbor_rights_DESC:0 "Our envoys must secure safe harbor in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. This is not conquest, tribute, or threat: it is a friendly request for our ships to enter, trade, and depart under formal protection."

 generic_trade_expedition_chart_course:0 "Chart The Course"
 generic_trade_expedition_chart_course_DESC:0 "The route between [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] and [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] must be copied into usable sailing notes. Even familiar waters look different when the holds are full and foreign pilots are watching."

 generic_trade_expedition_provision_convoy:0 "Provision The Convoy"
 generic_trade_expedition_provision_convoy_DESC:0 "Water casks, spare cordage, sealed grain, deck tools, and trustworthy guards are less glamorous than gifts, but the expedition will fail without them. The convoy must be outfitted like a serious venture."

 generic_trade_expedition_departure_feast:0 "Host A Departure Feast"
 generic_trade_expedition_departure_feast_DESC:0 "A public feast before departure will show our own merchants that the crown stands behind the venture, while also giving foreign observers a taste of our generosity."

 generic_trade_expedition_assemble_convoy:0 "Assemble The Convoy"
 generic_trade_expedition_assemble_convoy_DESC:0 "No ruler wins respect by sending a few leaking skiffs to a foreign market. A proper expedition must gather at [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] under the command of our chosen envoy."
 generic_trade_expedition_assemble_convoy_tt:0 "Have a navy of at least #Y 10#! ships docked in #Y [SCOPE.sP('generic_trade_expedition_home_port').GetName]#! and commanded by the chosen envoy. (#Y [SCOPE.ScriptValue('generic_trade_expedition_home_convoys_svalue')|0]#!/#Y 1#!)"

 generic_trade_expedition_reach_partner_port:0 "Reach [SCOPE.sP('generic_trade_expedition_partner_port').GetName]"
 generic_trade_expedition_reach_partner_port_DESC:0 "The harbor rights have been granted. Our envoy must now sail into [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], where pilots from [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] can guide our merchants into the market."
 generic_trade_expedition_reach_partner_port_tt:0 "Have the envoy-commanded navy of at least #Y 10#! ships docked in #Y [SCOPE.sP('generic_trade_expedition_partner_port').GetName]#!. (#Y [SCOPE.ScriptValue('generic_trade_expedition_partner_convoys_svalue')|0]#!/#Y 1#!)"

 generic_trade_expedition_register_harbor_master:0 "Register With The Harbor Master"
 generic_trade_expedition_register_harbor_master_DESC:0 "No cargo enters [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] without seals, dues, inspections, and names written in the right ledgers. The expedition must spend time inside the harbor office, decide how cleanly to enter the records, and become visible to the port before it can become profitable."

 generic_trade_expedition_inspect_warehouses:0 "Inspect Bonded Warehouses"
 generic_trade_expedition_inspect_warehouses_DESC:0 "Registration only puts our convoy into the ledgers. Before the serious bargaining begins, our envoy must inspect the warehouses, quay sheds, locks, guards, and weighing rooms where our foreign cargo will wait."
 generic_trade_expedition_harbor_registered_tt:0 "Register the convoy with the harbor master in #Y [SCOPE.sP('generic_trade_expedition_partner_port').GetName]#!."

 generic_trade_expedition_meet_market_guilds:0 "Meet The Market Guilds"
 generic_trade_expedition_meet_market_guilds_DESC:0 "The Marketplace of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] is a web of guilds, brokers, weighers, lenders, and quiet family agreements. Our envoy must decide what kind of cargo is worth the voyage home."

 generic_trade_expedition_record_customs:0 "Record Foreign Customs"
 generic_trade_expedition_record_customs_DESC:0 "The expedition is not only buying goods. It is observing how foreign clerks write contracts, how harbor dues are enforced, how guilds settle disputes, and how a busy market keeps trust from collapsing."

 generic_trade_expedition_load_cargo:0 "Gather Trade Goods"
 generic_trade_expedition_load_cargo_DESC:0 "For several months our merchants will weigh cargo, compare measures, hire interpreters, bargain in the market, and learn which goods are worth the voyage home. The envoy's fleet should remain docked in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] while this work continues."
 generic_trade_expedition_load_cargo_tt:0 "Keep the envoy-commanded navy of at least #Y 10#! ships docked in #Y [SCOPE.sP('generic_trade_expedition_partner_port').GetName]#!. (#Y [SCOPE.ScriptValue('generic_trade_expedition_partner_convoys_svalue')|0]#!/#Y 1#!)"

 generic_trade_expedition_plant_factor_house:0 "Plant A Factor House"
 generic_trade_expedition_plant_factor_house_DESC:0 "A few trusted agents could remain in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] after the fleet departs, keeping ledgers, letters, and small favors moving between our harbors."

 generic_trade_expedition_seal_manifest:0 "Seal The Manifest"
 generic_trade_expedition_seal_manifest_DESC:0 "The goods have been loaded, but cargo without a sealed manifest is only an argument waiting for landfall. Every chest, jar, bundle, and debt must be written down before the convoy sails home."

 generic_trade_expedition_return_home:0 "Return To [SCOPE.sP('generic_trade_expedition_home_port').GetName]"
 generic_trade_expedition_return_home_DESC:0 "The holds are full, the contracts are sealed, and every sailor claims to know which merchant cheated whom. Bring the envoy's fleet back to [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] before the profit, lessons, and blame can be divided."
 generic_trade_expedition_return_home_tt:0 "Return the envoy-commanded navy of at least #Y 10#! ships to dock in #Y [SCOPE.sP('generic_trade_expedition_home_port').GetName]#!. (#Y [SCOPE.ScriptValue('generic_trade_expedition_home_convoys_svalue')|0]#!/#Y 1#!)"

 generic_trade_expedition_honor_envoy:0 "Honor The Envoy"
 generic_trade_expedition_honor_envoy_DESC:0 "The expedition's envoy carried our words, ate foreign dust, bargained under strange roofs, and returned with the fleet intact. Public gratitude would bind the story of the venture to a living face."

 generic_trade_expedition_publish_charts:0 "Publish The Charts"
 generic_trade_expedition_publish_charts_DESC:0 "The copied routes, harbor notes, and warnings gathered on the voyage should not vanish into private chests. Publishing them for our captains will make the next voyage less uncertain."

 generic_trade_expedition_count_profits:0 "Count The Profits"
 generic_trade_expedition_count_profits_DESC:0 "The fleet is home. Now the cargo must be sold, gifts displayed, ledgers checked, and the expedition's lessons turned into something the whole country can use."

 generic_trade_expedition_harbor_rights_cmod:0 "Foreign Harbor Rights"
 desc_generic_trade_expedition_harbor_rights_cmod:0 "A friendly coastal ruler has granted our merchants formal permission to enter one of their ports."
 generic_trade_expedition_chartered_venture_cmod:0 "Chartered Trade Venture"
 desc_generic_trade_expedition_chartered_venture_cmod:0 "Merchants, courtiers, and harbor officials have begun treating a foreign expedition as a serious state-backed venture."
 generic_trade_expedition_interpreters_cmod:0 "Hired Trade Interpreters"
 desc_generic_trade_expedition_interpreters_cmod:0 "Interpreters and scribes are helping our envoys avoid the worst mistakes of foreign bargaining."
 generic_trade_expedition_envoy_charmod:0 "Expedition Envoy"
 desc_generic_trade_expedition_envoy_charmod:0 "This character has been entrusted with a friendly overseas trade expedition."
 generic_trade_expedition_home_market_survey_pmod:0 "Surveyed Home Demand"
 desc_generic_trade_expedition_home_market_survey_pmod:0 "Merchants in this harbor have taken stock of what foreign goods are most likely to sell at home."
 generic_trade_expedition_outbound_charts_cmod:0 "Prepared Sailing Notes"
 desc_generic_trade_expedition_outbound_charts_cmod:0 "The route to a friendly foreign port has been copied into practical notes for captains and pilots."
 generic_trade_expedition_provisioned_convoy_cmod:0 "Provisioned Trade Convoy"
 desc_generic_trade_expedition_provisioned_convoy_cmod:0 "The trade convoy has been stocked with food, tools, guards, spare rigging, and enough patience to survive foreign harbor delays."
 generic_trade_expedition_outfitting_quays_pmod:0 "Outfitting Quays"
 desc_generic_trade_expedition_outfitting_quays_pmod:0 "This harbor has been busy provisioning and checking a serious trade convoy."
 generic_trade_expedition_departure_feast_cmod:0 "Departure Feast"
 desc_generic_trade_expedition_departure_feast_cmod:0 "A public farewell feast has made the expedition feel like a shared national venture."
 generic_trade_expedition_loading_cargo:0 "Loading Foreign Cargo"
 desc_generic_trade_expedition_loading_cargo:0 "Some of our best merchants are abroad, spending time and coin to gather foreign goods."
 generic_trade_expedition_full_holds:0 "Full Holds"
 desc_generic_trade_expedition_full_holds:0 "A trade fleet is returning with valuable cargo and cautious orders to protect it."
 generic_trade_expedition_successful:0 "Successful Trade Expedition"
 desc_generic_trade_expedition_successful:0 "A friendly expedition has returned from a foreign port with goods, contacts, and a wider view of the markets beyond our borders."
 generic_trade_expedition_returned_merchants:0 "Returned Trade Fleet"
 desc_generic_trade_expedition_returned_merchants:0 "Merchants, sailors, brokers, and curious locals have crowded this harbor since the expedition returned with foreign cargo."
 generic_trade_expedition_foreign_quarter:0 "Welcomed Foreign Merchants"
 desc_generic_trade_expedition_foreign_quarter:0 "A friendly foreign expedition has left behind contacts, translators, and merchant families eager to keep trade moving."
 generic_trade_expedition_factor_house_pmod:0 "Foreign Factor House"
 desc_generic_trade_expedition_factor_house_pmod:0 "Agents from a friendly foreign power remain here to keep ledgers, letters, and small favors moving across the water."
 generic_trade_expedition_foreign_charts_cmod:0 "Foreign Harbor Charts"
 desc_generic_trade_expedition_foreign_charts_cmod:0 "Charts copied during a trade expedition have made our navigators more confident in unfamiliar waters."
 generic_trade_expedition_published_charts_cmod:0 "Published Harbor Charts"
 desc_generic_trade_expedition_published_charts_cmod:0 "Foreign harbor notes from a returned expedition have been copied for our captains and pilots."
 generic_trade_expedition_dockside_contacts_cmod:0 "Dockside Contacts"
 desc_generic_trade_expedition_dockside_contacts_cmod:0 "Merchants, interpreters, and harbor brokers from a foreign port are keeping useful channels open."
 generic_trade_expedition_market_confusion_cmod:0 "Market Confusion"
 desc_generic_trade_expedition_market_confusion_cmod:0 "Foreign weights, tariffs, and contracts have left some of our merchants arguing over what was actually agreed."
 generic_trade_expedition_registered_cleanly_cmod:0 "Clean Harbor Seals"
 desc_generic_trade_expedition_registered_cleanly_cmod:0 "The expedition entered a foreign harbor through proper seals, dues, and ledgers, making later bargaining easier to defend."
 generic_trade_expedition_bonded_warehouses_pmod:0 "Bonded Expedition Warehouses"
 desc_generic_trade_expedition_bonded_warehouses_pmod:0 "A friendly foreign expedition has rented official warehouse space, bringing extra fees, clerks, and activity to this port."
 generic_trade_expedition_guarded_cargo_cmod:0 "Guarded Foreign Cargo"
 desc_generic_trade_expedition_guarded_cargo_cmod:0 "Private guards and trusted factors are watching the expedition's foreign cargo before it is loaded for the voyage home."
 generic_trade_expedition_quayside_storage_pmod:0 "Crowded Quay Storage"
 desc_generic_trade_expedition_quayside_storage_pmod:0 "Foreign merchants have filled cheap quay sheds with goods, bringing trade but also clutter, arguments, and confused paperwork."
 generic_trade_expedition_shipwright_notes_pmod:0 "Shipwright Notes"
 desc_generic_trade_expedition_shipwright_notes_pmod:0 "Techniques learned in a foreign harbor have given this port's shipwrights new ideas."
 generic_trade_expedition_manifest_sealed_cmod:0 "Sealed Cargo Manifest"
 desc_generic_trade_expedition_manifest_sealed_cmod:0 "The expedition's cargo has been checked, counted, sealed, and assigned to the proper merchants."
 generic_trade_expedition_returned_home_cmod:0 "Returned Trade Expedition"
 desc_generic_trade_expedition_returned_home_cmod:0 "The trade fleet has returned home, and the harbor waits for the cargo to be sold and the ledgers to be settled."
 generic_trade_expedition_honored_envoy_cmod:0 "Honored Expedition Envoy"
 desc_generic_trade_expedition_honored_envoy_cmod:0 "The returned envoy has been honored publicly, lending prestige to future diplomatic ventures."
 generic_trade_expedition_bulk_cargo_cmod:0 "Bulk Trade Cargo"
 desc_generic_trade_expedition_bulk_cargo_cmod:0 "The expedition focused on reliable goods with predictable markets and steady profits."
 generic_trade_expedition_luxury_cargo_cmod:0 "Luxury Trade Cargo"
 desc_generic_trade_expedition_luxury_cargo_cmod:0 "The expedition risked more money on rare, prestigious goods that can transform a successful voyage into a famous one."
 generic_trade_expedition_knowledge_cargo_cmod:0 "Mercantile Notes"
 desc_generic_trade_expedition_knowledge_cargo_cmod:0 "The expedition brought home methods, measures, and observations as valuable as cargo."

 opinion_trade_expedition_envoys:0 "Trade Envoys"
 opinion_trade_expedition_gifts:0 "Trade Gifts"
 opinion_trade_expedition_lavish_gifts:0 "Lavish Trade Gifts"
 opinion_trade_expedition_ceremonial_gifts:0 "Ceremonial Trade Gifts"
 opinion_trade_expedition_interpreters:0 "Careful Interpreters"
 opinion_trade_expedition_harbor_rights:0 "Harbor Rights"
 opinion_trade_expedition_departure_feast:0 "Departure Feast"
 opinion_trade_expedition_feasted_with_envoy:0 "Departure Feast"
 opinion_trade_expedition_success:0 "Successful Trade Expedition"
 opinion_trade_expedition_harbor_dues:0 "Respectful Harbor Dues"
 opinion_trade_expedition_bonded_warehouses:0 "Bonded Warehouses"
 opinion_trade_expedition_factor_house:0 "Foreign Factor House"
 opinion_trade_expedition_good_port_conduct:0 "Courteous Port Conduct"
 opinion_trade_expedition_bad_port_conduct:0 "Awkward Port Incident"

 generic_trade_expedition.4.t:0 "An Envoy For The Expedition"
 generic_trade_expedition.4.desc:0 "There are many among us who would like the honor of carrying our words across the water. The chosen envoy will not merely stand in a court with gifts, but command the trade convoy itself, sleep among sailors, bargain with foreign brokers, and return home with either glory or blame."
 generic_trade_expedition.4.a:0 "Entrust [SCOPE.sChar('generic_trade_expedition_envoy_1').GetName]"
 generic_trade_expedition.4.b:0 "[SCOPE.sChar('generic_trade_expedition_envoy_2').GetName] is the one"
 generic_trade_expedition.4.c:0 "Hmm, how about [SCOPE.sChar('generic_trade_expedition_envoy_3').GetName]?"
 generic_trade_expedition.4.d:0 "[SCOPE.sChar('generic_trade_expedition_envoy_4').GetName], you are the envoy"

 generic_trade_expedition.5.t:0 "The Gift Ledger"
 generic_trade_expedition.5.desc:0 "The gifts bound for [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] have been laid out for inspection: costly ornaments, useful wares, ceremonial tokens, and letters dense with courtesy. [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] asks what tone the expedition should set before requesting harbor rights."
 generic_trade_expedition.5.a:0 "Arrive with lavish gifts"
 generic_trade_expedition.5.b:0 "Send practical gifts for practical people"
 generic_trade_expedition.5.c:0 "Let ceremony carry the meaning"

 generic_trade_expedition.6.t:0 "Before The Harbor Master"
 generic_trade_expedition.6.desc:0 "The harbor master of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] receives [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] with ledgers, seals, tariff marks, and the weary confidence of someone who knows every ship must eventually ask permission. Every page signed here will follow our cargo through the warehouses, markets, and customs tables."
 generic_trade_expedition.6.a:0 "Pay the dues cleanly and take proper seals"
 generic_trade_expedition.6.b:0 "Let [SCOPE.sChar('generic_trade_expedition_envoy').GetPraenomen] bargain over every line"
 generic_trade_expedition.6.c:0 "Accept a confusing local shortcut"

 generic_trade_expedition.8.t:0 "Locks, Seals, And Storehouses"
 generic_trade_expedition.8.desc:0 "The harbor ledgers are open, but goods do not wait politely in the street. [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] tours the storehouses of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]; official bonded warehouses with stamped locks, private rooms watched by hired guards, and cramped quay sheds where every merchant swears their goods will only be there for a day."
 generic_trade_expedition.8.a:0 "Use the official bonded warehouses"
 generic_trade_expedition.8.b:0 "Hire private guards and trusted factors"
 generic_trade_expedition.8.c:0 "Make do with cheap quay sheds"

 generic_trade_expedition.7.t:0 "The Market Guilds"
 generic_trade_expedition.7.desc:0 "Brokers and guild elders crowd around [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y], each insisting that their goods are the only wise cargo for the voyage home. There is room in the holds for many things, but the expedition needs a guiding strategy."
 generic_trade_expedition.7.a:0 "Reliable bulk goods will steady the ledgers"
 generic_trade_expedition.7.b:0 "Rare luxuries will make the voyage famous"
 generic_trade_expedition.7.c:0 "Methods and measures are cargo too"

 generic_trade_expedition.1.t:0 "Harbor Rights In [SCOPE.sP('generic_trade_expedition_partner_port').GetName]"
 generic_trade_expedition.1.desc:0 "The envoys of [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] have answered our gifts with a formal welcome. Our ships may enter the waters of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], trade under local protection, and purchase goods from the city's marketplace without fear of seizure or insult."
 generic_trade_expedition.1.a:0 "Ready the fleet"

 generic_trade_expedition.2.t:0 "The Markets Of [SCOPE.sP('generic_trade_expedition_partner_port').GetName]"
 generic_trade_expedition.2.desc:0 "Our convoy has reached [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. Local pilots guide the ships through crowded waters while merchants pour across the quays, pointing out warehouses, weighing houses, money changers, and the lanes where the best goods are sold."
 generic_trade_expedition.2.a:0 "Let the bargaining begin"

 generic_trade_expedition.3.t:0 "The Fleet Returns"
 generic_trade_expedition.3.desc:0 "The trade fleet has returned to [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] heavy with cargo from [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. Merchants argue over the fairest distribution of profit, courtiers admire foreign gifts, and our scholars keep asking whether the visiting factors can be persuaded to stay a little longer."
 generic_trade_expedition.3.a:0 "Sell the finest goods"
 generic_trade_expedition.3.b:0 "Display the gifts at court"
 generic_trade_expedition.3.c:0 "Invite the foreign factors to lecture"

 generic_trade_expedition.110.t:0 "Dockside Brokers"
 generic_trade_expedition.110.desc:0 "[SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] has found a circle of brokers who know which warehouses are honest, which scales are crooked, and which families are worth greeting first. The advice costs favors, but saves more than it spends."
 generic_trade_expedition.110.a:0 "Useful friends are worth the price."
 generic_trade_expedition.110.b:0 "Build the network, not the ledger"

 generic_trade_expedition.111.t:0 "False Weights"
 generic_trade_expedition.111.desc:0 "A tidy row of foreign weights has caused a furious argument among our merchants. By the time [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] proves the measures were shaved, several contracts have already been written in bad faith."
 generic_trade_expedition.111.a:0 "Count the loss and learn from it"
 generic_trade_expedition.111.b:0 "Expose the fraud to the whole harbor"

 generic_trade_expedition.112.t:0 "A Quayside Brawl"
 generic_trade_expedition.112.desc:0 "Sailors are poor diplomats after too much wine. A shoving match near the quay became a loud, embarrassing brawl before [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] dragged our people back aboard."
 generic_trade_expedition.112.a:0 "At least no blades were drawn..."

 generic_trade_expedition.113.t:0 "A Procession Through The Market"
 generic_trade_expedition.113.desc:0 "A local procession wound through the market lanes while our convoy sat in harbor. [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] made the proper offerings, watched the route carefully, and learned which shrines matter most to the city."
 generic_trade_expedition.113.a:0 "Respect opens doors, as my father would say"

 generic_trade_expedition.114.t:0 "Harbor Dues"
 generic_trade_expedition.114.desc:0 "The harbormaster has presented [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] with a list of fees, dues, seals, and inspection charges long enough to wrap around a mast. Paying them cleanly has avoided trouble."
 generic_trade_expedition.114.a:0 "Pay and smile"

 generic_trade_expedition.115.t:0 "Stormbound"
 generic_trade_expedition.115.desc:0 "Bad weather pinned the convoy in harbor for several days. The delay tried everyone's patience, but the sailors used the time to trade stories with local pilots and compare how foreign captains read the sky."
 generic_trade_expedition.115.a:0 "The sea teaches in its own way"

 generic_trade_expedition.116.t:0 "Words For Trade"
 generic_trade_expedition.116.desc:0 "[SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] has hired a patient interpreter who seems to know every market phrase, oath, insult, and apology in the harbor. Our scribes are writing down as much as they can."
 generic_trade_expedition.116.a:0 "Language is cargo too"

 generic_trade_expedition.117.t:0 "Foreign Shipwrights"
 generic_trade_expedition.117.desc:0 "Our sailors have spent evenings with the local shipwrights, trading small tools and sharper opinions. Several techniques used in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] could be copied at home."
 generic_trade_expedition.117.a:0 "Bring those notes back"
 generic_trade_expedition.117.b:0 "Pay for a careful copy of their methods"

 generic_trade_expedition.118.t:0 "Spoiled Cargo"
 generic_trade_expedition.118.desc:0 "A promising lot of grain and oil has spoiled in a rented warehouse. No one agrees whether the fault lies with the roof, the seals, the guards, or the weather, but the loss belongs to us."
 generic_trade_expedition.118.a:0 "A bitter lesson"

 generic_trade_expedition.119.t:0 "Honest Measures"
 generic_trade_expedition.119.desc:0 "After days of suspicion, [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] has found a guild whose measures match ours almost perfectly. The discovery has sped up a dozen bargains that were nearly abandoned."
 generic_trade_expedition.119.a:0 "Trust, verified"

 generic_trade_expedition.120.t:0 "Fire In The Warehouse"
 generic_trade_expedition.120.desc:0 "A fire broke out near the foreign warehouses before dawn. Our sailors helped form a line from the harbor and saved several stores of goods, but the smoke, shouting, and panic have shaken the expedition."
 generic_trade_expedition.120.a:0 "We did what honor required"

 generic_trade_expedition.121.t:0 "A Feast Aboard Ship"
 generic_trade_expedition.121.desc:0 "[SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] invited local brokers, pilots, and minor officials aboard the flagship. The food was uneven, the wine was good, and everyone left claiming friendship."
 generic_trade_expedition.121.a:0 "A fine use of the deck"

 generic_trade_expedition.122.t:0 "Rare Spice"
 generic_trade_expedition.122.desc:0 "One merchant led [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] into a narrow lane behind the market and produced a small chest of rare spice. The price was steep, but the cargo should sell beautifully at home."
 generic_trade_expedition.122.a:0 "Guard it well"

 generic_trade_expedition.123.t:0 "Borrowed Charts"
 generic_trade_expedition.123.desc:0 "A retired pilot has allowed our sailors to copy several harbor charts in exchange for gifts and a promise that his name will be remembered. The routes are cramped with notes, warnings, and old grudges."
 generic_trade_expedition.123.a:0 "A chart can be worth a hold of silver"
 generic_trade_expedition.123.b:0 "Teach the captains directly"

 generic_trade_expedition.124.t:0 "Quiet Profits"
 generic_trade_expedition.124.desc:0 "Not every success announces itself. For several calm weeks, [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] has overseen steady bargains, careful loading, and no drama worth reporting."
 generic_trade_expedition.124.a:0 "The best kind of news"

 generic_trade_expedition.125.t:0 "Interpreter's Triumph"
 generic_trade_expedition.125.desc:0 "A tense negotiation nearly collapsed over a word with two meanings. [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] caught the mistake, corrected both sides without insult, and turned a fragile bargain into a public success."
 generic_trade_expedition.125.a:0 "Remember who solved it"

 generic_trade_expedition.126.t:0 "Merchant Quarrels"
 generic_trade_expedition.126.desc:0 "Our merchants have begun arguing among themselves over space in the holds, who paid for which guards, and whose cargo deserves the driest corner. [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] has restored order, but not speed."
 generic_trade_expedition.126.a:0 "Order them back to work"

 generic_trade_expedition.127.t:0 "The Local Pilot"
 generic_trade_expedition.127.desc:0 "A local pilot walked [SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] through the harbor's hidden currents, awkward shoals, and sudden winds. Our captains listened closely, and even the proud ones admitted the lesson was useful."
 generic_trade_expedition.127.a:0 "Worth every coin"

 generic_trade_expedition.128.t:0 "Debate In The Market Hall"
 generic_trade_expedition.128.desc:0 "A scholar attached to the marketplace challenged our scribes over weights, contracts, temple dues, and the proper tax on foreign cloth. The debate lasted until sunset and left our people with more notes than answers."
 generic_trade_expedition.128.a:0 "Questions can be profitable"
 generic_trade_expedition.128.b:0 "Turn debate into goodwill"

 generic_trade_expedition.129.t:0 "A Gift For The Hosts"
 generic_trade_expedition.129.desc:0 "[SCOPE.sChar('generic_trade_expedition_envoy').GetName|Y] has chosen a costly gift for the officials who made our stay possible. The merchants grumble at the expense, but the harbor doors are open wider than before."
 generic_trade_expedition.129.a:0 "Courtesy has a price"
 generic_trade_expedition.129.b:0 "A practical gift is more honest"

 generic_trade_expedition.130.t:0 "Weights And Ledgers"
 generic_trade_expedition.130.desc:0 "A harbor clerk insists on weighing the cargo twice, then three times, just to be certain. The delay is annoying, but a precise ledger can save a voyage later."
 generic_trade_expedition.130.desc.bulk:0 "The bulk cargo is being counted sack by sack, and the clerks seem almost relieved to find something so ordinary and easy to record."
 generic_trade_expedition.130.desc.luxury:0 "The luxury crates are drawing every eye in the counting house, where suspicion and greed are fighting to keep the same ledger."
 generic_trade_expedition.130.desc.knowledge:0 "The scribes are less interested in the chests than in the notes inside them, and one clerk has already started copying our measurements."
 generic_trade_expedition.130.a:0 "Keep the books clean"
 generic_trade_expedition.130.b:0 "Let the partner keep a clean copy too"

 generic_trade_expedition.131.t:0 "A Missing Seal"
 generic_trade_expedition.131.desc:0 "One of the export seals has gone missing at the worst possible moment. The convoy is not in danger, but everyone involved is now very interested in whose pocket the seal might be in."
 generic_trade_expedition.131.a:0 "Find it before the paperwork spreads"

 generic_trade_expedition.132.t:0 "A Sudden Squall"
 generic_trade_expedition.132.desc:0 "A sharp storm rolled over the port and pinned our work to the quay. The sailors grumble, but the delay gave our captains time to learn the harbor's moods."
 generic_trade_expedition.132.a:0 "A useful inconvenience"

 generic_trade_expedition.133.t:0 "Rival Buyers"
 generic_trade_expedition.133.desc:0 "Two merchants have started competing for the same cargo, and both are trying to turn our envoy's patience into a discount."
 generic_trade_expedition.133.desc.luxury:0 "Luxury buyers are circling the cargo like gulls, each pretending to be the only one willing to pay proper coin."
 generic_trade_expedition.133.desc.bulk:0 "The bulk merchants are haggling over volume, transport, and who should bear the risk once the holds are full."
 generic_trade_expedition.133.desc.knowledge:0 "The scholars are less concerned with price than with access to the notes, tables, and methods tucked among the goods."
 generic_trade_expedition.133.a:0 "Press the advantage"
 generic_trade_expedition.133.b:0 "Take the coin and move on"

 generic_trade_expedition.134.t:0 "Hands In The Hold"
 generic_trade_expedition.134.desc:0 "A few dockhands were caught trying to help themselves to the expedition's cargo. The theft was small, but the message was not."
 generic_trade_expedition.134.a:0 "Set extra watches"

 generic_trade_expedition.135.t:0 "A Dockside Feast"
 generic_trade_expedition.135.desc:0 "The envoy accepted an invitation to a local feast on the quays, where merchants and pilots traded gossip as readily as wine."
 generic_trade_expedition.135.a:0 "Remember every face"

 generic_trade_expedition.136.t:0 "Quarrel Over Measures"
 generic_trade_expedition.136.desc:0 "A disagreement over weights, measures, and tally marks has turned half the market into a shouting match. The envoy can calm it, but not without costs."
 generic_trade_expedition.136.a:0 "Restore order"
 generic_trade_expedition.136.b:0 "Settle the market standards now"

 generic_trade_expedition.137.t:0 "A Retired Pilot's Notes"
 generic_trade_expedition.137.desc:0 "An old pilot has offered to share his harbor notes in exchange for gifts and a good story from home. The maps are rough, but they are full of wisdom."
 generic_trade_expedition.137.a:0 "Copy everything"

 generic_trade_expedition.138.t:0 "Smoke In The Warehouse"
 generic_trade_expedition.138.desc:0 "Smoke was spotted in a warehouse near the expedition's storage yard. The fire was contained quickly, but not before everyone ran for the doors."
 generic_trade_expedition.138.a:0 "Count the loss and move on"

 generic_trade_expedition.139.t:0 "A Midnight Bargain"
 generic_trade_expedition.139.desc:0 "Late at night, a broker slipped the envoy a private offer that could speed the expedition's departure if we are willing to trust a stranger."
 generic_trade_expedition.139.a:0 "Take the offer"
 generic_trade_expedition.139.b:0 "No deal without daylight"

 generic_trade_expedition.host.a:0 "So noted"

 generic_trade_expedition.200.t:0 "Foreign Trade Envoys"
 generic_trade_expedition.200.desc:0 "Envoys from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have begun the formal work of arranging a trade expedition to [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. Their letters speak of friendship, merchant profit, and a desire to deal openly under our protection."

 generic_trade_expedition.202.t:0 "Gifts From [SCOPE.sCountry('generic_trade_expedition_sender').GetName]"
 generic_trade_expedition.202.desc:0 "The envoys of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have sent gifts ahead of their trade expedition. Whatever else they may seek from [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], they understand that courtesy has its own ledger."
 generic_trade_expedition.202.desc.lavish:0 "The envoys of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have sent lavish gifts to our court: ornaments, costly wares, and carefully written assurances of friendship. Their expedition plainly means to arrive as honored guests, not ordinary dockside traders."
 generic_trade_expedition.202.desc.practical:0 "The envoys of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have sent practical gifts: useful goods, measures, tools, and wares chosen for people who understand trade better than ceremony. The message is clear enough: they hope to profit with us, not merely flatter us."
 generic_trade_expedition.202.desc.ceremonial:0 "The envoys of [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have sent ceremonial gifts and formal letters to our court. The offering is modest, but properly made, and gives their expedition a respectable beginning."
 generic_trade_expedition.202.a:0 "Receive them graciously"

 generic_trade_expedition.203.t:0 "Harbor Rights Granted"
 generic_trade_expedition.203.desc:0 "Our officials have granted the trade expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] formal harbor rights. Their ships may enter [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], dock under our protection, and trade according to our local rules."
 generic_trade_expedition.203.a:0 "Let the harbormaster prepare"

 generic_trade_expedition.204.t:0 "Foreign Convoy Arrives"
 generic_trade_expedition.204.desc:0 "The convoy from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has reached [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. Local pilots have guided the ships into safe waters, and merchants are already gathering near the quays to judge the newcomers."
 generic_trade_expedition.204.a:0 "Watch the quays closely"

 generic_trade_expedition.205.t:0 "Before Our Harbor Master"
 generic_trade_expedition.205.desc:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has registered with the harbor master of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. Their names, seals, dues, and cargo marks are now part of our official ledgers."
 generic_trade_expedition.205.desc.seals:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has registered cleanly with the harbor master of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], paying the proper dues and taking the proper seals. Our clerks will appreciate such orderly foreigners."
 generic_trade_expedition.205.desc.bargained:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has registered with the harbor master of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], though not without bargaining over nearly every line in the ledger. Their envoy is patient, if nothing else."
 generic_trade_expedition.205.desc.shortcut:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has entered the harbor records of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] through a local shortcut. The seals are acceptable, though our clerks may be untangling the paperwork for weeks."

 generic_trade_expedition.206.t:0 "Foreign Warehouses"
 generic_trade_expedition.206.desc:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has arranged storage in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. Their cargo will soon be mixed into the ordinary noise of our quays, ledgers, and market arguments."
 generic_trade_expedition.206.desc.bonded:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has rented official bonded warehouses in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. The fees are paid, the locks are stamped, and our clerks will know exactly where their cargo sits."
 generic_trade_expedition.206.desc.guarded:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has hired private guards and trusted factors to watch their cargo in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. It is respectable caution, though it gives their corner of the harbor a sharper edge."
 generic_trade_expedition.206.desc.cramped:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has settled for cheap quay sheds in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. The extra trade is welcome, but the harbor officers are already complaining about clutter."

 generic_trade_expedition.207.t:0 "Market Guilds Receive Foreigners"
 generic_trade_expedition.207.desc:0 "Brokers and guild elders in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] have met the merchants from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y]. Their convoy is now choosing what kind of cargo will fill the voyage home."
 generic_trade_expedition.207.desc.bulk:0 "The merchants from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have favored reliable bulk goods in the markets of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. Their bargains may not dazzle the court, but they will keep the quays busy."
 generic_trade_expedition.207.desc.luxury:0 "The merchants from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] are pursuing rare luxuries in the markets of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. Our brokers smell profit, vanity, and risk in equal measure."
 generic_trade_expedition.207.desc.knowledge:0 "The merchants from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] seem as interested in our measures, contracts, and market customs as in our goods. Their scribes are filling tablets as quickly as their factors fill orders."

 generic_trade_expedition.208.t:0 "Foreign Scribes In The Market"
 generic_trade_expedition.208.desc:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has begun recording the customs of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]; tariffs, contracts, guild procedures, and the small courtesies that keep trade from becoming argument."

 generic_trade_expedition.209.t:0 "Foreign Cargo Loading"
 generic_trade_expedition.209.desc:0 "The convoy from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has begun loading cargo in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. Their sailors, interpreters, and merchants will be a familiar sight in the harbor until the holds are full."

 generic_trade_expedition.210.t:0 "A Foreign Quarter Takes Shape"
 generic_trade_expedition.210.desc:0 "The merchants from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have finished gathering their cargo, but their stay has left traces in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]; interpreters, contacts, rented rooms, and families already asking when the next convoy will come."

 generic_trade_expedition.211.t:0 "A Foreign Factor House"
 generic_trade_expedition.211.desc:0 "Agents from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] have established a small factor house in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. They promise only ledgers, letters, and orderly trade, but even small foreign offices have a way of becoming permanent."
 generic_trade_expedition.211.a:0 "Keep their seals in order"

 generic_trade_expedition.212.t:0 "The Manifest Is Sealed"
 generic_trade_expedition.212.desc:0 "The expedition from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has sealed its manifest in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y]. Every chest, jar, bundle, and debt is now written down, and their convoy is preparing to depart."
 generic_trade_expedition.212.a:0 "Clear their departure"

 generic_trade_expedition.213.t:0 "Foreign Convoy Departs"
 generic_trade_expedition.213.desc:0 "The trade convoy from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] has left [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] with full holds and sealed contracts. Our harbormaster reports that the visit ended without serious disorder, and our merchants are already measuring what future voyages might bring."
 generic_trade_expedition.213.a:0 "May the route stay open"

 generic_trade_expedition.214.t:0 "Trade Mission Concluded"
 generic_trade_expedition.214.desc:0 "Reports from [SCOPE.sCountry('generic_trade_expedition_sender').GetName|Y] say their trade expedition to [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] has returned home successfully. Their merchants have profited from our harbor, and our own brokers are already speaking more warmly of future dealings."
 generic_trade_expedition.214.a:0 "A profitable friendship"

 generic_trade_expedition.215.t:0 "The Interpreter's Ledger"
 generic_trade_expedition.215.desc:0 "Now that the interpreters are hired, the envoy spends a night sorting market terms, insults, and measurements. A good translator can turn a border into a bridge."

 generic_trade_expedition.216.t:0 "Surveying The Home Quays"
 generic_trade_expedition.216.desc:0 "The survey of our own market shows more than old habits and familiar faces; it reveals wasted space, neglected corners, and a few easy improvements."

 generic_trade_expedition.217.t:0 "Charting The Course"
 generic_trade_expedition.217.desc:0 "The route has been plotted in full, with shoals, currents, and favorable winds marked for the captains who will follow it."

 generic_trade_expedition.218.t:0 "Provisioning The Convoy"
 generic_trade_expedition.218.desc:0 "The convoy's stores are packed and repacked until every jar, rope, and barrel has a place."

 generic_trade_expedition.219.t:0 "A Feast For Departure"
 generic_trade_expedition.219.desc:0 "Before the sails rise, the crew and their hosts share one last meal and one last round of promises."

 generic_trade_expedition.220.t:0 "The Customs Ledger"
 generic_trade_expedition.220.desc:0 "The foreign customs tables have been copied into our own ledgers, along with the little exceptions that make a harbor's rules truly work."

 generic_trade_expedition.221.t:0 "Cargo Loading Finished"
 generic_trade_expedition.221.desc:0 "The holds are full at last, and the clamor of the quays has given way to the steady creak of ropes and the satisfaction of a job nearly done."

 generic_trade_expedition.222.t:0 "A Factor House Established"
 generic_trade_expedition.222.desc:0 "The factor house is no longer an idea but a permanent address, with seals, desks, and a place in the port's routine."

 generic_trade_expedition.223.t:0 "The Manifest Is Sealed"
 generic_trade_expedition.223.desc:0 "Every crate and contract now sits beneath a final seal. If there were mistakes, they must survive the voyage home."

 generic_trade_expedition.224.t:0 "Homeward Bound"
 generic_trade_expedition.224.desc:0 "With the convoy turning for home, the sea feels less like a challenge and more like a road back to profit."

 generic_trade_expedition.225.t:0 "An Honored Envoy"
 generic_trade_expedition.225.desc:0 "The envoy's conduct has earned attention back home. The court is pleased, the merchants are pleased, and the envoy is very pleased."

 generic_trade_expedition.226.t:0 "Publishing The Charts"
 generic_trade_expedition.226.desc:0 "The charts are ready to be copied, taught, and argued over. What was once a trader's secret can now guide the next voyage."
