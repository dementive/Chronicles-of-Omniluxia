l_english:
 omni_pastoral_council.5.t:0 "The Pastoral Council Opens"
 omni_pastoral_council.5.desc:0 "Sixty days after the summons left the #G Apostolic Palace#!, the result now fills every guest chamber in the city: bishops with too much luggage, envoys with too many instructions, and a procession of secretaries who have each been told their master's seat is the one nearest the #T Shannah#!. Somewhere in the palace a steward is quietly counting the wine.\n\nA council is not merely a gathering of the pious. It is the faithful world in miniature: who comes, who sends an observer, and who conspicuously stays at home are all statements, and everyone present is keeping score."
 omni_pastoral_council.5.attendance:0 "\n\n#Y [ROOT.GetCountry.MakeScope.Var('omni_pc_delegates').GetValue|0]#! realms have sent full delegations bearing gifts. #Y [ROOT.GetCountry.MakeScope.Var('omni_pc_observers').GetValue|0]#! realms have sent observers. #R [ROOT.GetCountry.MakeScope.Var('omni_pc_boycotts').GetValue|0]#! realms declined the summons outright; the rest sent no answer, or none we have been told about."
 omni_pastoral_council.5.empty:0 "\n\nThe benches are mostly empty. No foreign realm answered the summons with so much as an observer, so the council will be a domestic affair: our own clergy, our own courtiers, and #R [ROOT.GetCountry.MakeScope.Var('omni_pc_boycotts').GetValue|0]#! formal refusals pinned to the door."
 omni_pastoral_council.5.dissenter:0 "\n\nAmong the absent, [SCOPE.sCountry('omni_pc_dissenter').GetName|T] contests the Shannah outright but has not been condemned. Its court might still be persuaded."
 omni_pastoral_council.5.rules:0 "\n\nPropose the council's agenda. Full delegations vote for thirty days; a majority against defeats the proposal, while a tie favors the Shannah. An adopted agenda costs #Y 25 political influence#!. Turnout counts delegations and observers; only full delegations share in the Canons of Unity and Endow the Faith. Some weeks after the council closes, #Y something will happen#! among the departing delegations.\n\nShahanat Authority: #Y [ROOT.GetCountry.MakeScope.ScriptValue('omni_hc_authority')|0]#! ([ROOT.GetCountry.Custom('omni_hc_authority_tier')]). Below #Y 50#! Authority, firebrands and heresy are likelier and gambles riskier; at #Y 75#! and #Y 90#!, embassies, debates and miracles favor the palace. Every Authority change here also moves the realm between Authority tiers."
 omni_pastoral_council.5.a:0 "Proclaim the Canons of Unity."
 omni_pastoral_council.5.b:0 "Discipline the clergy."
 omni_pastoral_council.5.c:0 "Send an embassy to [SCOPE.sCountry('omni_pc_dissenter').GetName]."
 omni_pastoral_council.5.d:0 "Endow the faith across the attending realms."
 omni_pastoral_council.5.e:0 "Dismiss the delegates."
 omni_pc_canons_tt:0 "#G +3 Authority#!, plus #G +1#! more at #Y 3#!, #Y 6#! and #Y 10#! attending realms. Every full delegation gains #G +15 opinion#! of us, which fades over five years."
 omni_pc_discipline_tt:0 "#G +3 Authority#!. For #Y five years#!, the next scandal costs #G no Authority#! instead of #R -5#!."
 omni_pc_embassy_tt:0 "About #Y 40%#! chance (better at high Authority, worse at low): [SCOPE.sCountry('omni_pc_dissenter').GetName|T] agrees to #G open recognition talks#!: it moves to conditional recognition and offers the Shahanat a concession, which we may accept for its full recognition. It gains #G +25 opinion#! of us and we gain #G +2 Authority#!. Otherwise the embassy is rebuffed: #R -2 Authority#!."
 omni_pc_endow_tt:0 "#G +3 Authority#!. We and every full delegation receive #T Canons of the Pastoral Council#! for #Y three years#!: #G +3% omen power#! and #G +3% happiness for pops of our religion#!."

 omni_pastoral_council.2.t:0 "Word from the Pastoral Council"
 omni_pastoral_council.2.desc:0 "Couriers from [SCOPE.sCountry('omni_pc_host').GetName|T] arrive with sealed copies of the council's acts. The #T Shannah#! [SCOPE.sChar('omni_pc_shannah').GetName|Y] has convened the faithful, and the faithful have, after a great deal of argument about seating, agreed on something."
 omni_pastoral_council.2.canons:0 "\n\nThe council proclaimed the #T Canons of Unity#!: a long document mostly about obedience, with a short appendix about who should have sat nearer the altar."
 omni_pastoral_council.2.discipline:0 "\n\nThe council turned inward and disciplined the clergy. Several bishops left the city earlier than planned, and with noticeably lighter baggage."
 omni_pastoral_council.2.embassy_won:0 "\n\nThe council sent an embassy to [SCOPE.sCountry('omni_pc_dissenter').GetName|T], and against expectations it was received. That realm has reopened talks on recognizing the Shannah."
 omni_pastoral_council.2.embassy_lost:0 "\n\nThe council sent an embassy to [SCOPE.sCountry('omni_pc_dissenter').GetName|T]. It was received coldly and sent home with nothing but a polite letter, which reads worse the more often it is quoted."
 omni_pastoral_council.2.endow:0 "\n\nThe council endowed the faith across every attending realm: chapels repaired, rites funded, and a great many grateful sermons."
 omni_pastoral_council.2.we_attended:0 "\n\nOur delegation, and our gifts, were received with honor."
 omni_pastoral_council.2.we_observed:0 "\n\nOur observers watched from the gallery, as neither committed nor absent."
 omni_pastoral_council.2.we_boycotted:0 "\n\nWe declined the summons. The acts were sent to us anyway."
 omni_pastoral_council.2.we_spied:0 "\n\nOfficially, we were not there. Our agent's account of the sessions, delivered a day before the couriers, is considerably less flattering."
 omni_pastoral_council.2.we_ignored:0 "\n\nThe summons went unanswered at our court. The palace has noted the silence."
 omni_pastoral_council.2.not_invited:0 "\n\nWe were not invited."
 omni_pastoral_council.2.a:0 "Let it be read aloud."

 omni_pastoral_council.3.t:0 "The Embassy Returns"
 omni_pastoral_council.3.won:0 "The embassy to [SCOPE.sCountry('omni_pc_dissenter').GetName|T] returns road-weary but smiling. The court there heard our envoys out, argued among itself for a week, and has agreed to reopen the question of recognition. Its terms will follow shortly; a qualified yes may yet become a full one."
 omni_pastoral_council.3.lost:0 "The embassy to [SCOPE.sCountry('omni_pc_dissenter').GetName|T] returns early. It was received with every courtesy and given nothing at all. Word of the refusal has reached the delegates still lingering in the palace."
 omni_pastoral_council.3.a:0 "Conditions can be softened in time."
 omni_pastoral_council.3.b:0 "Their stubbornness is recorded."
 omni_pastoral_council.3.won_tt:0 "[SCOPE.sCountry('omni_pc_dissenter').GetName|T] moves to #G conditional recognition#! and will propose a concession; accepting it secures full recognition. It has #G +25 opinion#! of us. #G +2 Authority#!."
 omni_pastoral_council.3.lost_tt:0 "#R -2 Authority#!."

 omni_pastoral_council.11.t:0 "A Firebrand at the Council"
 omni_pastoral_council.11.desc:0 "On the council's last morning, a provincial bishop seized the lectern and spoke for an hour against the luxury of the palace, the laxity of the clergy and, by heavy implication, the person of the #T Shannah#!. Half the hall was scandalized. The other half was taking notes. Copies of the sermon are already leaving the city faster than the delegates."
 omni_pastoral_council.11.a:0 "Confine him to a monastery. Quietly."
 omni_pastoral_council.11.a_tt:0 "#R -2 Authority#!, because silencing critics is noticed."
 omni_pastoral_council.11.b:0 "Let him speak. Hellas will judge."
 omni_pastoral_council.11.b_tt:0 "A gamble. Either his fire rallies the faithful behind reform (#G +2 Authority#!) or it becomes a #R scandal#! (#R -5 Authority#!, unless the clergy has been disciplined). Better odds at high Authority."
 omni_pastoral_council.15.t:0 "The Firebrand's Sermon Rallies the Faithful"
 omni_pastoral_council.15.desc:0 "The bishop's sermon has done something nobody expected: it made the #T Shannah#! look magnanimous. Congregations that came to hear criticism heard instead that the palace let the criticism be spoken, and they have drawn their own conclusions."
 omni_pastoral_council.15.a:0 "Magnanimity costs so little."
 omni_pastoral_council.15.a_tt:0 "#G +2 Authority#!."
 omni_pastoral_council.16.t:0 "The Sermon Becomes a Scandal"
 omni_pastoral_council.16.desc:0 "The bishop's words have found an audience in every court that ever resented the Shahanat. Pamphlets name names. Some of the names are even correct."
 omni_pastoral_council.16.shielded:0 "\n\nFortunately, the council's earlier #T discipline of the clergy#! left little for the pamphleteers to find. The storm passes without lasting harm, though the protection is now spent."
 omni_pastoral_council.16.exposed:0 "\n\nThe Shahanat's standing suffers: #R -5 Authority#!."
 omni_pastoral_council.16.a:0 "This will pass."

 omni_pastoral_council.12.t:0 "A Quarrel over Precedence"
 omni_pastoral_council.12.desc:0 "The delegations of [SCOPE.sCountry('omni_pc_rival_a').GetName|T] and [SCOPE.sCountry('omni_pc_rival_b').GetName|T] have refused to enter the closing liturgy, because neither will walk behind the other. Each has produced a scroll proving its precedence. Both scrolls are very old and, the palace archivists murmur, both are forgeries. Whatever the #T Shannah#! decides, one court will remember it fondly and the other will not."
 omni_pastoral_council.12.a:0 "[SCOPE.sCountry('omni_pc_rival_a').GetName] walks first."
 omni_pastoral_council.12.a_tt:0 "[SCOPE.sCountry('omni_pc_rival_a').GetName|T]: #G +20 opinion#! of us. [SCOPE.sCountry('omni_pc_rival_b').GetName|T]: #R -20 opinion#! of us. Both fade over five years."
 omni_pastoral_council.12.b:0 "[SCOPE.sCountry('omni_pc_rival_b').GetName] walks first."
 omni_pastoral_council.12.b_tt:0 "[SCOPE.sCountry('omni_pc_rival_b').GetName|T]: #G +20 opinion#! of us. [SCOPE.sCountry('omni_pc_rival_a').GetName|T]: #R -20 opinion#! of us. Both fade over five years."
 omni_pastoral_council.12.c:0 "They will draw lots, like children."
 omni_pastoral_council.12.c_tt:0 "Neither court is offended, but the Shahanat looks indecisive: #R -1 Authority#!."

 omni_pastoral_council.13.t:0 "A Miracle at the Closing Liturgy"
 omni_pastoral_council.13.desc:0 "As the final hymn ended, witnesses swear, the lamps above the altar flared without any hand to trim them and stayed bright until dawn. A dozen bishops saw it. Forty claim to have seen it. By tomorrow there will be hundreds. The palace sacristan suspects a draft, but has wisely kept that to himself."
 omni_pastoral_council.13.a:0 "Proclaim it to every faithful realm."
 omni_pastoral_council.13.a_tt:0 "#G +3 Authority#!. The miracle is announced across the Helluvian world."
 omni_pastoral_council.13.b:0 "Record it in the archives and let the faithful talk."
 omni_pastoral_council.13.b_tt:0 "#G +1 Authority#!."
 omni_pastoral_council.20.t:0 "A Miracle Is Proclaimed"
 omni_pastoral_council.20.desc:0 "Couriers from [SCOPE.sCountry('omni_pc_host').GetName|T] bring astonishing news: at the close of the #T Shannah#! [SCOPE.sChar('omni_pc_shannah').GetName|Y]'s Pastoral Council, the altar lamps burned unattended through the night. The proclamation does not mention drafts."
 omni_pastoral_council.20.a:0 "Hellas is watching."

 omni_pastoral_council.14.t:0 "A Heretical Tract"
 omni_pastoral_council.14.desc:0 "A slim, anonymous pamphlet has appeared under the doors of half the delegates' lodgings. It argues, with irritating clarity, that the #T Creator of All Things That Can Never Be Known#! cannot meaningfully be spoken for by anyone, including the #T Shannah#!. Several delegates have read it twice."
 omni_pastoral_council.14.a:0 "Burn every copy in the palace square."
 omni_pastoral_council.14.a_tt:0 "#G +1 Authority#!. The bonfire is impressive and a little frightening."
 omni_pastoral_council.14.b:0 "Refute it in open debate."
 omni_pastoral_council.14.b_tt:0 "A gamble. A convincing refutation earns #G +3 Authority#!; a stumble costs #R -3 Authority#!. Better odds at high Authority."
 omni_pastoral_council.14.c:0 "Ignore it. Pamphlets die of neglect."
 omni_pastoral_council.14.c_tt:0 "It does not die of neglect: #R -1 Authority#!."
 omni_pastoral_council.17.t:0 "The Tract Refuted"
 omni_pastoral_council.17.desc:0 "The palace's best theologian took the pamphlet apart line by line before the assembled delegates. By the end, even its admirers were pretending they had only read it in order to condemn it."
 omni_pastoral_council.17.a:0 "Truth needs only a good advocate."
 omni_pastoral_council.17.a_tt:0 "#G +3 Authority#!."
 omni_pastoral_council.18.t:0 "The Debate Goes Badly"
 omni_pastoral_council.18.desc:0 "The palace's champion was learned, eloquent and, unfortunately, wrong about a key passage of scripture, as a junior delegate pointed out to general delight. The pamphlet now circulates with a new preface describing the debate."
 omni_pastoral_council.18.a:0 "We will not debate again soon."
 omni_pastoral_council.18.a_tt:0 "#R -3 Authority#!."

 omni_pc_council_canons:0 "Canons of the Pastoral Council"
 desc_omni_pc_council_canons:0 "The Pastoral Council has endowed this realm's rites and clergy."
 omni_pc_canons_opinion:0 "Attended the Pastoral Council"
 omni_pc_embassy_opinion:0 "Received the Council's Embassy"
 omni_pc_precedence_favored_opinion:0 "Granted Precedence at Council"
 omni_pc_precedence_slighted_opinion:0 "Slighted at Council"

 omni_pastoral_council.1.t:0 "Summon the Faithful"
 omni_pastoral_council.1.desc:0 "The secretaries have prepared the letters already, which suggests they expected this. Each bears the seal of the #G Apostolic Palace#! and the same courteous phrase: the #T Shannah#! requests the presence of the faithful at a Pastoral Council in #Y sixty days#!.\n\nRequests from the palace are seldom refused lightly. Every Helluvian court that receives one must now decide whether to send a delegation with gifts, a handful of observers, or a refusal it will have to explain later. Courts that contest the Shannah may prefer to send someone who will not admit to being there at all.\n\nSending the summons is #Y free#! and starts the #Y three-year#! cooldown. When the council opens you will choose its agenda for #Y 25 political influence#!; keep it in reserve. Excommunicated realms are not invited."
 omni_pastoral_council.1.a:0 "Send the summons."
 omni_pastoral_council.1.a_tt:0 "Every landed Helluvian realm that is not condemned is invited and must reply. The council opens in #Y 60 days#!."
 omni_pastoral_council.1.b:0 "Not yet."
 omni_pastoral_council.1.b_tt:0 "Nothing is sent or spent."

 omni_pastoral_council.4.t:0 "A Summons from the Apostolic Palace"
 omni_pastoral_council.4.desc:0 "A courier in palace colors has delivered a letter sealed by the #T Shannah#! [SCOPE.sChar('omni_pc_shannah').GetName|Y] of [SCOPE.sCountry('omni_pc_host').GetName|T]. The faithful are summoned to a Pastoral Council, to open in about #Y sixty days#!. The letter is warm, brief and entirely clear that the palace will remember who came."
 omni_pastoral_council.4.recognizing:0 "\n\nWe recognize this Shannah. A refusal from us would be noticed, and discussed."
 omni_pastoral_council.4.conditional:0 "\n\nOur position on this Shannah is not unconditional. Our presence, or absence, will be read as a statement either way."
 omni_pastoral_council.4.rejecting:0 "\n\nWe contest this Shannah's claim. Sending a delegation is out of the question, but there is nothing to stop a discreet guest from taking a room near the palace."
 omni_pastoral_council.4.rules:0 "\n\nA #Y full delegation#! brings #Y 50 gold#! in gifts to the palace and shares in the council's rewards. #Y Observers#! count toward turnout but receive nothing. Declining costs nothing today, but the Shannah remembers, and a second refusal in a row is remembered much longer."
 omni_pastoral_council.4.a:0 "Send a full delegation, with gifts."
 omni_pastoral_council.4.b:0 "Send observers."
 omni_pastoral_council.4.c:0 "Decline the summons."
 omni_pastoral_council.4.d:0 "Send someone who was never there."
 omni_pastoral_council.4.e:0 "The council has already gathered."
 omni_pc_reply_delegation_tt:0 "The palace receives #Y 50 gold#!. Our delegation counts toward turnout, gains #G +15 opinion#! of the Shannah's realm if the council proclaims the Canons of Unity, and receives the #T Canons of the Pastoral Council#! if it endows the faith. #G +5 Favor#! with the Shannah if we hold the Shannah's favor. Clears our record of refusals."
 omni_pc_reply_observers_tt:0 "Our observers count toward turnout but share in no rewards. Clears our record of refusals."
 omni_pc_reply_decline_tt:0 "The Shannah's realm gains #R -10 opinion#! of us. A second consecutive refusal adds a further #R -25 opinion#!, which fades slowly; a Shannah who dislikes us enough may consider sterner measures."
 omni_pc_reply_spy_tt:0 "We receive the council's report as if we had attended. There is a #Y 25%#! chance our agent is caught: #R -20 opinion#! from the Shannah's realm."
 omni_pastoral_council.5.spies:0 "\n\nThe palace guard has also detained #R [ROOT.GetCountry.MakeScope.Var('omni_pc_spies_caught').GetValue|0]#! visitor(s) who were very interested in the sessions and very vague about their employers. Their employers were not hard to find."
 omni_pc_dismiss_tt:0 "The delegates go home with nothing to show for the journey: #R -2 Authority#!. The three-year cooldown remains."
 omni_pc_declined_opinion:0 "Declined the Pastoral Council"
 omni_pc_repeated_refusal_opinion:0 "Repeatedly Refused the Council"
 omni_pc_spy_caught_opinion:0 "Caught Spying on the Council"

 omni_pc_proposal_tt:0 "Put this agenda to the full delegations for a thirty-day ballot. The host has one supporting vote; ties favor the proposal. Rewards and the 25 Political Influence cost apply only after adoption. If defeated or no longer possible, the council closes without an act."
 omni_pastoral_council.6.t:0 "The Council Calls for Our Vote"
 omni_pastoral_council.6.desc:0 "A letter bearing our delegation's seal arrives from the #G Apostolic Palace#!. Beneath the painted vaults, the #T Shannah#! has laid an agenda before the assembled realms. The herald now calls for #Y our vote#!.\n\nInstruct our delegates to #G support#! or #R oppose#! the proposal below. The ballot closes in #Y thirty days#!; silence is an abstention. Only full delegations vote. A majority against defeats the proposal; a tie favors the Shannah."
 omni_pastoral_council.6.canons:0 "\n\n#T Canons of Unity#!\nBind the attending realms more closely to the palace. Adoption strengthens #G Shahanat Authority#! and gives each full delegation #G +15 opinion#! of the Shannah's realm."
 omni_pastoral_council.6.discipline:0 "\n\n#T Discipline the Clergy#!\nCall the bishops to account. Adoption strengthens #G Shahanat Authority#! and shields the palace from #G one scandal#! within #Y five years#!."
 omni_pastoral_council.6.embassy:0 "\n\n#T Embassy to the Dissenters#!\nSend envoys to a realm contesting the Shannah and attempt to reopen #Y recognition talks#!. Success strengthens the palace; a rebuff #R weakens its Authority#!."
 omni_pastoral_council.6.endow:0 "\n\n#T Endow the Faith#!\nThe palace provides #Y 100 gold#!. It and every full delegation receive #G +3% omen power#! and #G +3% state religion happiness#! for #Y three years#!."
 omni_pastoral_council.6.a:0 "Our delegation supports the proposal."
 omni_pastoral_council.6.b:0 "Our delegation votes against it."
 omni_pastoral_council.6.c:0 "The ballot has already closed."
 omni_pastoral_council.8.t:0 "The Council Disperses"
 omni_pastoral_council.8.desc:0 "The doors of the #G Apostolic Palace#! stand open. Bishops descend the steps in small, quarrelling groups; the secretaries carry away their unfinished acts. The #T Shannah#! has closed the gathering #R without adopting a decree#!.\n\nOur envoys return with their seals unbroken. #Y No council rewards were granted#!, and the #Y 50 gold#! presented with our delegation remains with the palace. If a ballot was held, its count appears below; otherwise, the gathering closed #R before a proposal reached the delegates#!."

 omni_pastoral_council.vote_tally:0 "\n\nThe final ballot recorded #G [SCOPE.sCountry('omni_pc_host').MakeScope.Var('omni_pc_votes_for').GetValue|0] votes in favor#! and #R [SCOPE.sCountry('omni_pc_host').MakeScope.Var('omni_pc_votes_against').GetValue|0] against#!, including the host's supporting vote. Delegations that sent no answer abstained."
 omni_pastoral_council.6.vote_tt:0 "Record our delegation's vote. The council announces its decision when the thirty-day ballot closes."

 omni_pastoral_council.5.f:0 "Adjourn until the palace can proceed."
 omni_pastoral_council.5.f_tt:0 "The council remains summoned. Its agenda will be reconsidered in fifteen days; gifts and delegation replies are preserved. No vote or reward is skipped."
