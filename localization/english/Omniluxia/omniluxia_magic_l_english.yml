  dementive_debug.1_title: "Magic Mana Debug"
  dementive_debug.1_desc: "Use this console event to test whether the ruler's mana variables update from character magic modifiers. Fire it with: event dementive_debug.1"
  dementive_debug.1.a: "Initialize ruler mana variables"
  dementive_debug.1.a.tt: "Ensures the ruler has current, monthly, and maximum mana variables, then recalculates the modifier-backed values."
  dementive_debug.1.b: "Add +4 ruler monthly mana"
  dementive_debug.1.b.tt: "Adds #Y chararacter_magic_4#! to the ruler. The character mana tooltip should show Monthly +4 after recalculation."
  dementive_debug.1.c: "Add +25 ruler maximum mana"
  dementive_debug.1.c.tt: "Adds one stacked #Y magic_debug_character_max_25#! to the ruler. The character mana tooltip should increase maximum mana by 25 after recalculation."
  dementive_debug.1.d: "Run one ruler mana tick"
  dementive_debug.1.d.tt: "Uses the ruler's character monthly mana modifier to increase current mana while respecting maximum mana."
  dementive_debug.1.e: "Add 25 current ruler mana"
  dementive_debug.1.e.tt: "Directly adds 25 current mana to the ruler, then caps current mana at the ruler's maximum mana."
  dementive_debug.1.f: "Clear ruler debug mana"
  dementive_debug.1.f.tt: "Removes the debug ruler magic modifiers and resets current ruler mana to 0."
  dementive_debug.1.g: "Close"
  dementive_debug.2.a: "Back"

