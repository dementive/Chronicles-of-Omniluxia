l_english:
 omni_dragon_cinderstorm:0 "Cinderstorm"
 omni_sb_dragon_cinderstorm_tt:0 "The sovereign leads the host beneath a rain of dragonfire. For 180 days, gain +30% Siege Ability and +20% Land Morale.\n\nRequires war. Costs no mana. Cooldown: 720 days. All dragon spells share a 360-day recovery after each cast."
 omni_dragon_aegis_of_scales:0 "Aegis of Scales"
 omni_sb_dragon_aegis_of_scales_tt:0 "Draconic wards harden the realm's walls and rally its armies. For 180 days, gain +35% Fort Defense and +25% Land Morale Recovery.\n\nRequires war. Costs no mana. Cooldown: 720 days. All dragon spells share a 360-day recovery after each cast."
 omni_dragon_hearthfire_blessing:0 "Hearthfire Blessing"
 omni_sb_dragon_hearthfire_blessing_tt:0 "The sovereign's banked fire warms granaries and hearths. For 360 days, gain -3 National Unrest, +20% Monthly Food and +20% National Tax.\n\nRequires peace. Costs no mana. Cooldown: 720 days. All dragon spells share a 360-day recovery after each cast."
 omni_sb_dragon_recovering_tt:0 "#R This spell or the shared recovery is on cooldown.#!"
