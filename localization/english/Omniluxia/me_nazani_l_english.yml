l_english:

# ==============================================================================
# MISSION HEADER
# ==============================================================================

03_nazani: "The Reforged Diadem"
03_nazani_DESCRIPTION: "The #Y Nazani Empire#! was born from the western half of the old Zani world, but its survival has depended on more than inherited glory. The people of #Y Bharamuntacho Zani#! are neither the old eastern Zani nor simple conquerors among strangers; they are Weagelian, imperial, and reborn.\n\nIf the #T Empire of the West#! is to survive its enemies and outgrow the shadow of #Y Durobaeraste#!, the #P Purple Emperor#! must strengthen the capital, choose a second city worthy of balancing the imperial court, and decide whether the future of the Nazani lies in disciplined expansion or a perfected imperial heartland."
03_nazani_CRITERIA_DESCRIPTION: "This mission will be completed when the Nazani have strengthened #Y Bharamuntacho Zani#!, raised a second city beside it, and chosen the future direction of the #T Empire of the West#!."
03_nazani_BUTTON_TOOLTIP: "The Nazani must strengthen their homeland before they can claim to be the true inheritors of the western Zani world."

# ==============================================================================
# TASKS 1-12 (ORIGINAL TASKS)
# ==============================================================================

03_nazani_task_1: "The Winter Capital"
03_nazani_task_1_DESC: "#E Bharamuntacho Zani#! was once the western capital of the old Zani Empire, the city where emperors spent the gentler months far from the eastern court. For the Nazani, it must become more than a seasonal palace; it must be the permanent heart of a reborn imperial order."

03_nazani_task_2: "Temple Of The Unconquered Zani"
03_nazani_task_2_DESC: "The old imperial gods still watch the streets of [GetProvince('(int32)2720').GetName|Y], and the Temple of the Unconquered Zani remains one of the clearest proofs that the western court is no provincial accident. By renewing the sacred district around the temple, [ROOT.GetCountry.GetRuler.GetName] can bind dynasty, city, and faith together."

03_nazani_task_3: "The Purple Workshops"
03_nazani_task_3_DESC: "Cloth from [GetProvince('(int32)2720').GetName|Y] already clothes officials, priests, and merchants across the capital. With proper mills, dyes, and guild oversight, those workshops can become the foundation of a courtly economy worthy of a Purple Emperor."

03_nazani_task_4: "The Imperial Chancery"
03_nazani_task_4_DESC: "A great empire is not held together by soldiers alone. It survives through ledgers, seals, courts, educated clerks, and the terrifying certainty that every governor's report eventually reaches the palace. The Nazani court must build a chancery capable of ruling more than a ceremonial capital."

03_nazani_task_5: "Granaries Of Wegalia"
03_nazani_task_5_DESC: "The capital cannot grow on purple cloth and imperial pride alone. The fields, fisheries, and cattle lands around [GetProvince('(int32)2720').GetName|Y] must be organized into a proper food network, feeding the city even when war or intrigue strains the countryside."

03_nazani_task_6_pdeso: "Pdeso, Shield Of The Southern Sea"
03_nazani_task_6_pdeso_DESC: "[GetProvince('(int32)3382').GetName|Y] is already a city of stone walls, sea traffic, and southern soldiers. If the #P Purple Emperor#! raises Pdeso as the second city of the realm, the Nazani homeland will lean toward ports, fortresses, and the disciplined projection of power."

03_nazani_task_6_esenzeu: "Esenzeu, Northern Counterweight"
03_nazani_task_6_esenzeu_DESC: "[GetProvince('(int32)2347').GetName|Y] already guards the northern forests as a fortified city of glassmakers, soldiers, and Great Wolf rites. If the #P Purple Emperor#! raises Esenzeu as the second city of the realm, the Nazani homeland will gain a stern northern counterweight to the court at Bharamuntacho Zani."

03_nazani_task_7: "The Road Between Crowns"
03_nazani_task_7_DESC: "A second imperial city is useful only if the wider realm can move with imperial speed. Protected routes must carry officials, soldiers, grain, and rumor through every part of the country, until the roads themselves become proof of the Purple Emperor's reach."

03_nazani_task_8: "Guilds Of The Second City"
03_nazani_task_8_DESC: "A second city must do more than mirror the capital. In [GetProvince('(int32)3382').GetName|Y], imperial guilds can turn stone, walls, and harbor dues into southern strength; in [GetProvince('(int32)2347').GetName|Y], they can bind glassmakers, garrisons, and northern markets to the imperial court."

03_nazani_task_9: "Eyes Of The Emperor"
03_nazani_task_9_DESC: "The Nazani practice of imperial blinding is reviled by many enemies and feared by every ambitious courtier. Whether [ROOT.GetCountry.GetRuler.GetName|Y] rules through restraint or through the memory of darkened eyes, the palace must make clear that treason has consequences and justice has a procedure."

03_nazani_task_10: "The Two Cities Of The West"
03_nazani_task_10_DESC: "At last, [GetProvince('(int32)2720').GetName|Y] and the chosen second city stand as twin pillars of the Nazani homeland. One is the sacred capital of the reborn Zani; the other is the counterweight that turns imperial ambition into revenue, movement, and authority beyond the palace."

03_nazani_task_11_wide: "Theme Armies Of Wegalia"
03_nazani_task_11_wide_DESC: "If the Nazani are to play wide, the heartland must support frontier armies without collapsing behind them. The old provinces of Wegalia should provide disciplined soldiers, loyal officers, and roads ready for campaigns beyond the marshes and borderlands."

03_nazani_task_11_tall: "A Palace Between Two Seas"
03_nazani_task_11_tall_DESC: "If the Nazani are to play tall, then the capital and its chosen counterpart must become imperial machines of wealth, ceremony, and administration. Palaces, academies, and noble districts will prove that the Empire of the West need not conquer half the world to stand above it."

03_nazani_task_12: "The Reborn Empire Of The West"
03_nazani_task_12_DESC: "The Nazani have strengthened the capital, raised a second city beside it, and chosen the shape of their future. The western empire is no longer merely a weaker sibling of Durobaeraste. It is its own power, its own court, and its own promise of Zani rebirth."

# ==============================================================================
# TASK 13: SECRET ACCORD WITH THE BORDERLANDS
# ==============================================================================

03_nazani_task_13: "Secret Accord With The Orcs"
03_nazani_task_13_DESC: "With the Nazani homeland secured and the future of the empire chosen, the final step toward continental dominion lies before us. The [GetProvince('(int32)2187').GetArea.GetRegion.GetName|Y] remain unaware of our sabotuers operating within its midst, and by all accounts, they are not ready for what is to come.\n\nThrough shadow and secrecy, we have kept contacts with #G Orcish mercenaries#! in the region - warriors that help protect the colonies that we have funded over the years. Gold and promises will purchase their loyalty, and together, we shall reshape the western lands into an empire worthy of the Zani name.\n\n#R This option will lead to a war in the #E Borderlands.#! #!"

# Task 13 Events

me_nazani.1.t: "The Silent Dawn"
me_nazani.1.desc: "Before the sun breaks the horizon, a figure enters the imperial palace through channels known only to the #T Purple Emperor#! and [ROOT.GetCountry.GetRuler.GetHerHis] most trusted courtiers. The visitor is an Orcish warrior — scarred, powerful, and bearing the unmistakable aura of one that is comfortable with killing. It is [SCOPE.sCharacter('orcish_captain').GetName|Y], a name that is very familiar to [ROOT.GetCountry.GetRuler.GetName|Y]. For many years, Grommash has received a princely sum from the Nazani treasuries to serve as our agent in the Borderlands - a situation that has, so far, proved to be mutually beneficial, albeit very expensive to maintain.\n\nMartios spoke in a cold, clear voice. 'I appreciate you making the journey to [ROOT.GetCountry.GetCapital.GetName|Y] in person, Grommash - the matters that we are about to discuss could not be trusted to courier. Are your men ready?'\n\n'Everything awaits your command, my Emperor - my men are in place and will gather for the invasion once I give the word. But before we blacken our blades with Borderlander blood, I must ask you; have you considered my previous request?'\n\nMartios frowned, his eyes narrowing slightly - he had forgotten their previous conversation until now. Grommash had promised to deliver the Emperor the Borderlands when the time came to strike, but the price he asked for in return was steep - the Orc wanted to become Governor of the province once the war concluded."

me_nazani.1.a: "Let us win this thing first, Grommash, and then we will see"
me_nazani.1.a.tt: "#Y Nazani Empire#! will gain claims on all provinces in the #E Borderlands#!, and war will begin soon."
me_nazani.1.b: "The time for the invasion is not right..."
end_event_chain_tt: "#Y This will end the event chain.#!"

me_nazani.2.t: "The Green Tide Gathers"
me_nazani.2.desc: "One week have passed since Grommash's visit to the imperial palace. Since then, the Orc has called in favors owed to him, awakened blood pacts between the clans, and hired a couple thousand mercenaries. His army, the #H Green Tide#!, is gathering in the city of [GetProvince('(int32)2347').GetName|Y], and is a force numbering perhaps six thousand strong.\n\nYet there is a complication. The Orcish captain's presence in our lands is known to our enemies. Spies report that the power controlling [GetProvince('(int32)2187').GetName] has discovered Grommash's involvement with us, and there are rumors that he has been offered a hefty sum to betray us in the hour of battle.\n\nThe decision rests with [ROOT.GetCountry.GetRuler.GetName|Y]. Will we commit fully, or does the scope of what we have heard give us pause?"

me_nazani.2.a: "Bah! I trust Grommash - let his men gather for the attack"
me_nazani.2.a_tt: "We will gain an army in #Y Esenzeu#!."
me_nazani.2.b: "This has gone too far. Abandon the attempt while we still can."

me_nazani.3.t: "The Point of No Return"
me_nazani.3.desc: "Grommash stands at the gates of [GetProvince('(int32)2347').GetName|Y] with his armies and has sent word to [ROOT.GetCountry.GetCapital.GetName|Y] that his men are ready to march - there is nothing left to do but declare war on our enemies."

me_nazani.3.a: "At long last, we retake the Borderlands for the Nazani Empire!"
me_nazani.3.a_tt: "#R We will declare war.#!"
me_nazani.3.b: "This madness ends. We must withdraw immediately"

me_nazani.4.t: ""
me_nazani.4.desc: ""

me_nazani.4.a: ""

me_nazani.5.t: ""
me_nazani.5.desc: ""

me_nazani.5.a: ""


# ==============================================================================
# TASK 14: THE MARSHLANDS RECLAIMED
# ==============================================================================

03_nazani_task_14: "The Marshlands Reclaimed"
03_nazani_task_14_DESC: "With the [GetProvince('(int32)2187').GetArea.GetRegion.GetName|Y] now secured by orcish forces and Nazani might, the time has come to turn our attention to the waterlogged territories of the [GetProvince('(int32)4012').GetArea.GetRegion.GetName|G]. These treacherous wetlands were once held by the #Y Nazani Empire#! and and lost in darker days, but the sun is beginning to shine in lands where it has hid its face for so long.\n\nThe current inhabitants of the [GetProvince('(int32)4012').GetArea.GetRegion.GetName|G] are fractious and unprepared—native tribes, minor lords, and scattered settlements filled with face-painting savages. They have no unified defense, no great armies, and no allies who will come to their aid. A swift military campaign can secure these territories and expand the Nazani heartland eastward."

me_nazani.14.t: "The Waters Rise"
me_nazani.14.desc: "Runners arrive from the the border bearing dire tidings. From the east comes word of a great #Y Nazani#! host, having swept through the conquered lands of the [GetProvince('(int32)2187').GetArea.GetRegion.GetName|Y]. The reports speak of bloodthirsty soldiers bearing the imperial purple who have slaughtered thousands in their determination to reclaim the wetlands.\n\nLocal lords scramble to organize a defense, but their forces are scattered and weak. Our fortifications, designed to protect against river pirates and tribal raiders, are wholly inadequate against a professional army marching under unified command of an Emperor. The common folk have fled into the deep marshes, seeking sanctuary in the trackless waters, but no one knows if safety can be found anywhere.\n\nThe choice before the rulers of the Marshlands is stark; resist and be crushed beneath the Nazani boot, or submit and hope for mercy from the victors. Sadly, [ROOT.GetCountry.GetRuler.GetName] had foolishly believed that there would be a choice - that somehow, [ROOT.GetCountry.GetRuler.GetSheHe] could negotiate [ROOT.GetCountry.GetRuler.GetHerHis] way out of it, but this was another delusion."

me_nazani.14.a: "We are conquered. The Marshlands fall to the Nazani."
me_nazani.14.a_tt: "#R The Nazani Empire is invading the Marshlands #!"

# ==============================================================================
# TASK 15: KAINAXARTHOS AVENGED
# ==============================================================================

03_nazani_task_15: "Invasion Of Kainaxarthos"
03_nazani_task_15_DESC: "The greatest wound upon the #Y Nazani#! honor is the loss of #Y Kainaxarthos#!, the jewel of the dragon-lands, ceded to the barbaric #R Soventeir Empire#! centuries ago. With the #Y Borderlands#! conquered and the #G Marshlands#! reclaimed, the [ROOT.GetCountry.GetName|Y] can finally turn to settle this ancient score.\n\nThe [GetProvince('(int32)4775').GetArea.GetRegion.GetName|Y] holds territories of immense strategic and cultural significance. To retake them from the Soventeir will require not merely military might, but diplomatic acumen and political will. Yet with a prepared, unified realm behind [ROOT.GetCountry.GetRuler.GetName|Y], even the hated Soventeir can be brought to heel.\n\nSuccess in this endeavor will restore Nazani honor, reclaim lost imperial patrimony, and position the Empire of the West as the undisputed successor to the ancient Zani world."

me_nazani.15.t: "The Dragon's Throne Beckons"
me_nazani.15.desc: "A proclamation arrives, bearing the seal of the Purple Emperor and the insignia of the reborn Nazani Empire. The message is unmistakable: the time has come to settle ancient debts.\n\n[ROOT.GetCountry.GetRuler.GetName] declares that the [GetRegion('dragon_lands_west').GetName], and particularly the great city of #E Kainaxarthos#!, are rightful Nazani patrimony. For centuries, these lands have been held by the #Y Soventeir#!, who seized them in the chaos of imperial collapse. No longer.\n\nWith the Borderlands conquered through orcish might, with the Marshlands reclaimed through martial prowess, with the Nazani heartland unified and strengthened, the moment of reckoning has arrived. The Purple Emperor will not suffer the continued occupation of ancestral territories by lesser powers.\n\nThe Soventeir are warned: submit and accept vassal status, or face the full wrath of a reborn Nazani Empire. The choice, as always, belongs to those who hold power—but the consequences belong to all.\n\nWar comes to the [GetRegion('dragon_lands_west').GetName], and none can say how it will end."

me_nazani.15.a: "The Nazani march upon Kainaxarthos. War is declared."

