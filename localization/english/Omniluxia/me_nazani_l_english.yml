me_nazani.101.t: "The Winter Capital Restored"
me_nazani.101.desc: "The scaffolding comes down and the imperial standards rise over [GetProvince('(int32)2720').GetName|Y]. What was once a seasonal retreat for eastern emperors is now the permanent seat of the western court, its halls readied to house the whole apparatus of Nazani rule.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] walks the renewed streets and understands the meaning of the work; the Empire of the West now has a heart of its own."
me_nazani.101.a: "Let the court make its home here."

me_nazani.102.t: "The Unconquered Zani"
me_nazani.102.desc: "After many weeks of grueling labor, the sacred precinct around the #T Temple of the Unconquered Zani#! has been renewed and the people of [ROOT.GetCountry.GetCapital.GetName|Y] are praising [ROOT.GetCountry.GetRuler.GetName|Y] for spearheading the restoration efforts.\n\nIt must be said that the Temple looks practically brand new. Its marble columns have been gilded with fine gold, its pediments repaved with marble from #Y Luxterra#!, and its interior has been purified and sanctified by ritual and practice. Priest, peasant, and Emperor are bound together in the dutiful worship of #T Zanis#!, for all are equal under his eye, and the people of [GetProvince('(int32)2720').GetName|Y] see the hand of our great ancestor and god guiding [ROOT.GetCountry.GetRuler.GetFirstName] at this very moment."
me_nazani.102.a: "I will not fail my ancestors...the blood of Zanis flows within me!"

me_nazani.103.t: "The Purple Workshops"
me_nazani.103.desc: "Under imperial charter, the mills and dye-houses of [GetProvince('(int32)2720').GetName|Y] have been organized into a courtly industry. The famed purple cloth that clothes officials, priests, and merchants across the realm now flows through guilds answerable to the palace.\n\nCeremonial prestige has become lasting revenue, and the treasury of [ROOT.GetCountry.GetRuler.GetName|Y] is the richer for it."
me_nazani.103.a: "Let the looms of empire never rest."

me_nazani.104.t: "The Imperial Chancery"
me_nazani.104.desc: "Clerks bend over ledgers, seals press into wax, and couriers depart bearing the will of the #T Purple Emperor.#! The new chancery gives the Nazani court the one thing soldiers cannot provide: the patient machinery of administration that turns a ceremonial capital into a governing one.\n\nEvery governor now knows that his reports will, in time, reach the palace of [ROOT.GetCountry.GetRuler.GetName|Y], and as long as they can be a little patient, they will eventually receive a reply from the [ROOT.GetCountry.GetRulerTitle]."
me_nazani.104.a: "The empire is held together by ink as much as iron"

me_nazani.105.t: "The Granaries Of Wegalia"
me_nazani.105.desc: "The fields, fisheries, and cattle-lands around [GetProvince('(int32)2720').GetName|Y] have been drawn into a single food network, its granaries filled against the lean seasons of war and intrigue. The capital can grow now on more than purple cloth and imperial pride.\n\nA city that can feed itself is a city that cannot be starved into submission."
me_nazani.105.a: "Let the storehouses stand full."

me_nazani.106.t: "Pdeso Rises"
me_nazani.106.desc: "The stone walls of [GetProvince('(int32)3382').GetName|Y] have been raised higher and its harbor works extended, and the Purple Emperor has proclaimed it the second city of the realm. The Nazani homeland now leans toward the sea — toward ports, fortresses, and the disciplined projection of imperial power along the southern coast.\n\nPdeso is the shield of the southern sea, and it answers to [ROOT.GetCountry.GetRuler.GetName|Y]."
me_nazani.106.a: "The south is secured."

me_nazani.107.t: "Esenzeu Rises"
me_nazani.107.desc: "In the fortified city of [GetProvince('(int32)2347').GetName|Y], glassmakers, garrisons, and the keepers of the Great Wolf rites have received the Purple Emperor's charter. Raised as the second city of the realm, Esenzeu stands as a stern northern counterweight to the court at Bharamuntacho Zani.\n\nThe forests of the north now have an imperial anchor, and it answers to [ROOT.GetCountry.GetRuler.GetName|Y]."
me_nazani.107.a: "The north stands guard."

me_nazani.108.t: "The Road Between Crowns"
me_nazani.108.desc: "Protected imperial roads now bind the capital, the second city, and the towns between them. Officials, soldiers, grain, and rumor all move with imperial speed, and the roads themselves have become proof of the Purple Emperor's reach.\n\nA realm that moves together is a realm that cannot easily be broken apart."
me_nazani.108.a: "Let the crowns be joined by stone."

me_nazani.109.t: "The Guilds Of The Second City"
me_nazani.109.desc: "The second city no longer merely mirrors the capital. Imperial guilds have been granted the privileges that turn walls, harbors, and markets into durable revenue and authority of their own.\n\nThe counterweight to Bharamuntacho Zani now generates its own strength, and the balance of the Nazani homeland is the surer for it."
me_nazani.109.a: "Two cities, two engines of empire."

me_nazani.110.t: "The Eyes Of The Emperor"
me_nazani.110.desc: "The court has codified its terrible procedures: the charge of treason, the sentence, and the memory of darkened eyes. Whether [ROOT.GetCountry.GetRuler.GetName|Y] rules through restraint or through fear, every ambitious courtier now understands that imperial justice has a procedure — and consequences.\n\nThe Purple Justice of the Nazani is established."
me_nazani.110.a: "Let treason look upon its reward."

me_nazani.111.t: "The Two Cities Of The West"
me_nazani.111.desc: "At last [GetProvince('(int32)2720').GetName|Y] and its chosen counterpart stand as twin pillars of the Nazani homeland — one the sacred capital of the reborn Zani, the other the counterweight that turns imperial ambition into revenue, movement, and authority beyond the palace.\n\nThe heartland of [ROOT.GetCountry.GetRuler.GetName|Y] is whole, and now the empire must choose the shape of its future."
me_nazani.111.a: "The homeland stands complete."

me_nazani.112.t: "The Theme Armies Of Wegalia"
me_nazani.112.desc: "The old provinces of Wegalia have been organized to raise and sustain disciplined soldiers, loyal officers, and campaign roads ready for war beyond the marshes and borderlands. The heartland can now support frontier armies without collapsing behind them.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] has chosen the wide path — and the west is arming for it."
me_nazani.112.a: "Let the themes muster their spears."

me_nazani.113.t: "A Palace Between Two Seas"
me_nazani.113.desc: "Palaces, academies, and noble districts have risen in the great cities of the Nazani homeland, imperial machines of wealth, ceremony, and administration. The Empire of the West has proven it need not conquer half the world to stand above it.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] has chosen the tall path — perfection over expanse."
me_nazani.113.a: "Let glory be gathered, not scattered."

me_nazani.114.t: "The Reborn Empire Of The West"
me_nazani.114.desc: "The capital is strengthened, the second city raised beside it, and the future of the empire chosen. The western realm is no longer merely the weaker sibling of #Y Durobaeraste#! — it is its own power, its own court, and its own promise of Zani rebirth.\n\nThe reign of [ROOT.GetCountry.GetRuler.GetName|Y] will be remembered as the one that reforged the diadem of the west."
me_nazani.114.a: "The Empire of the West is reborn."

me_nazani.115.t: "The Dragon Slayer"
me_nazani.115.desc: "The borderlands are conquered, the marshlands reclaimed, and the dragon-lands of #E Kainaxarthos#! returned to Nazani rule. The whole of the ancient western patrimony now answers to the Purple Emperor, and the barbaric Soventeir have been driven from the throne of dragons at last.\n\nThe heralds have already begun to speak the name that will follow [ROOT.GetCountry.GetRuler.GetName|Y] into legend: the Dragon Slayer, undisputed successor to the ancient Zani world."
me_nazani.115.a: "The Zani world is whole once more."
