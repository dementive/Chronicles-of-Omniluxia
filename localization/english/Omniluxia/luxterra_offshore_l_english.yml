 LHV:0 "Leshava"
 LHV_ADJ:0 "Leshavi"
 LHV_island_lore:0 "Above the winter tide line, the first orchard rows were still visible through the open doors of the harvest hall, and someone had left a basket of their fruit beside the scales. [ROOT.GetCountry.GetRuler.GetName|Y] arrived as the Lesmaria fishing families began to weigh the offshore catch, and the clerk called out each household in the order it sat at the feast.\n\nTheir grandparents had planted the orchards where a winter sea could not reach them, and their descendants still moor in coves that belong to all the households. A crew may work its own boat through the season, but at the feast the fish are weighed together, and an empty berth at the quay does not leave an empty plate."
