 SVI:0 "Sir-Veylan"
 SVI_ADJ:0 "Veylani"
 SVI_island_lore_title:0 "The Hidden Reef of Sir-Veylan"
 SVI_island_lore:0 "Nine centuries before the Luxterran Calendar began, the #T Second Slaver Ship Fleet#! of the #Y High Elves#! set out to follow #T Atheus the Conqueror#! across the sea. It never arrived. Wrecked upon the #G Central Omniluxian Isles#!, its survivors made a pact with #Y Na'athran#!, trading away their long lives so that the barren islands might bloom, and from them came the #Y Sea Elves#!. The #Y Ioni-sir#! of #G Sir-Veylan#! are their children, and they remain the undisputed masters of the waters.\n\nSince the #R Great Collapse#! scattered the cities of their people, the Ioni-sir have held only a few far-flung reefs, and Sir-Veylan is among the most remote. The passage into [GetProvince('(int32)6009').GetName|G] is known only to its own crews, who find their way by the sound of the water against the hull, and visiting ships must anchor at the outer reef and wait to be invited in. Contact with the mainland happens by Veylani design and never by chance, for no mainland ship can overtake them. They keep the #T Ascendic#! rites of their forebears, but want nothing to do with their cousins' chains.\n\nMost mainlanders still dismiss the blue-skinned mariners as an old wives' tale, which suits the council of [ROOT.GetCountry.GetRuler.GetName|Y] perfectly. Yet the slavers of the High Elven citadels have begun to ask questions in the ports, and the Veylani know better than anyone what their cousins do with a secret. How long can the masters of the waters remain a rumor?"
