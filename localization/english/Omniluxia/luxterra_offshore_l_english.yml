 SVI:0 "Sir-Veylan"
 SVI_ADJ:0 "Veylani"
 SVI_island_lore:0 "The visiting ship dropped anchor outside the reef, and by the time its captain had lowered a boat, an Ioni-sir crew was waiting to take his message. From the inner harbor [ROOT.GetCountry.GetRuler.GetName|Y] could see the messenger come in under oars, and the visitor's boat stayed beside its ship while the crew waited for an answer.\n\nOur crews have long crossed the North Inter Sea without being seen, and some know the reef by the change in the sound of water against the hull. A visitor may do business at the outer reef, and if an invitation comes back, one of the crews that knows the passage will bring the ship in."
