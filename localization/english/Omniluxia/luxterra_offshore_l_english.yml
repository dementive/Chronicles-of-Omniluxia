 AZQ_island_lore:0 "The shipmasters brought their tallies to the split summit of Kharazgapt, where [ROOT.GetCountry.GetRuler.GetName|Y] was hearing the harbor accounts. One captain still used a tally stick from the days when his forebears provisioned #T Jarenam the Formidable Dragon#!. It had room for every sack of grain on his boat, but the council wanted to know how many boats had stopped paying their dues.\n\nOtrar now flies its own colors over the western coves, and Karetxem keeps its own harbor on the eastern shore. The beacon still burns for all three, though the shipmasters watch the flags below it as closely as they watch the light."
