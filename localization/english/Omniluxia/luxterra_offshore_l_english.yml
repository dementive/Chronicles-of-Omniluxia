 CFW:0 "Vaerel"
 CFW_ADJ:0 "Vaereli"
 CFW_island_lore_title:0 "The Citadel Groves of Vaerel"
 CFW_island_lore:0 "When the #R Great Collapse#! of 670 LC weakened the mana of the #G World's Lungs Forest#!, some #Y Waldonian#! clans carried sacks of their own soil and crates of seedlings across the water in the name of #T Mother Cafea#!, and planted their groves on the empty islands of #G Vaerel#!. For a few generations they lived there in peace, out of reach of the raiders who plagued the mainland woods.\n\nThey were not out of reach of the #Y High Elves#!. #Y Sreirrie#! galleys found the islands, and their captains saw at once what the Waldonians had not: a sheltered anchorage off the coast of #G Luxterra#!, with timber for a fleet growing right beside it. The #Y Ascendic#! castellans raised their citadel at [GetProvince('(int32)6014').GetName|G], felled the groves of [GetProvince('(int32)6013').GetName|G] for keels, and drove the surviving Waldonians onto [GetProvince('(int32)6015').GetName|G] and [GetProvince('(int32)6017').GetName|G], where they tend the last of their trees under elven overseers. Every galley that has raided the Luxterran coast in living memory was built from Waldonian oak.\n\nLike their kin who serve the house of #T Cymeva Atheus#!, the Sreirrie of Vaerel still dream of the conquests that the #T High Elven Civil War#! interrupted, and [ROOT.GetCountry.GetRuler.GetName|Y] intends to be ready when the galleys of Atheus sail again. Until then, the citadel lives on raids and tribute. Will Vaerel become the spearhead of a new elven conquest of Luxterra, or will the mainlanders finally burn the nest before it hatches?"
