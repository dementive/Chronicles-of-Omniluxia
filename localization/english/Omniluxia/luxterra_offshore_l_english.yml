 SKU:0 "Skutalik"
 SKU_ADJ:0 "Skutalik"
 SKU_island_lore_title:0 "The Winter Hearths of Skutalik"
 SKU_island_lore:0 "The first #Y Siamiu#! families came to #G Skutalik#! from the coasts near #G Mirus#! when the fishing grounds there grew too crowded, meaning only to spend their winters among the islands. They never left, and their sod halls at [GetProvince('(int32)6002').GetName|G], [GetProvince('(int32)6003').GetName|G] and [GetProvince('(int32)6004').GetName|G] are now the farthest hearths of the #Y Polarian#! peoples.\n\nNothing on Skutalik comes easily. Timber is gathered from the driftwood beaches, oil is rendered from seal and whale, and when the winter storms close the sea, the hearth moot sends wood and dried fish from the fullest halls to the emptiest. A crew driven ashore by the weather is fed by whoever finds them, and it is said on Skutalik that a hall which turns away a frozen stranger will find its own fire cold before the spring.\n\nThe isles are poor and have little worth stealing, which has long been their best defense. Yet southern ships now come every summer seeking furs, walrus ivory and seal oil, and their captains pay in iron and grain that a Siamiu hearth could never make for itself. [ROOT.GetCountry.GetRuler.GetName|Y] and the elders must decide whether to welcome the trade of the south, and whether the hearths of Skutalik can remain the quiet edge of the Polarian world once the wider world knows the way there."
