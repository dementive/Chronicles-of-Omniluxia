 QTB:0 "Otrar"
 QTB_ADJ:0 "Otrari"
 QTB_island_lore_title:0 "The Western Coves of Otrar"
 QTB_island_lore:0 "When #T Jarenam the Formidable Dragon#! led the #Y Yarenamian#! slaves in revolt in 977 LC and swept across #G Luxterra#!, his hordes needed grain, horses and ships more than they needed anything else. The #Y Kossian#! shipmasters of #G Kharaz#! became the larder of his conquests, and although they had little love for the Dragon, they grew rich feeding his armies by sea, and gave thanks at the shrines of #T Zainudianism#! for every voyage that came home with its silver.\n\nWhen Jarenam died in 993 LC and the fleet's pay stopped coming, the boldest of those shipmasters held the western coves around [GetProvince('(int32)6025').GetName|G]. They refused to hand their share of the plunder to the old treasury on [GetProvince('(int32)6026').GetName|G], and soon afterward they hauled down the old fleet's banner and raised their own. Otrar has the most ships and the fewest scruples of the three Kharaz harbors, and its crews will raid a Luxterran town in the morning and sell its grain back to it by evening.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] has made Otrar the terror of the coast, but enemies surround it on every side. [GetCountry('AZQ').GetName|Y] still calls the Otrari captains rebels and thieves, [GetCountry('QTR').GetName|Y] sells its loyalty to whoever pays the most, and the mainland towns have begun to raise walls and hire swords. Can the captains of the western coves become the masters of the Kharaz roads, or will Otrar burn in the same fire it has spread along every shore?"
 QTR:0 "Karetxem"
 QTR_ADJ:0 "Karetxemi"
 QTR_island_lore_title:0 "The Harbor Lords of Karetxem"
 QTR_island_lore:0 "When #T Jarenam the Formidable Dragon#! led the #Y Yarenamian#! slaves in revolt in 977 LC and swept across #G Luxterra#!, his hordes needed grain, horses and ships more than they needed anything else. The #Y Kossian#! shipmasters of #G Kharaz#! became the larder of his conquests, and although they had little love for the Dragon, they grew rich feeding his armies by sea, and gave thanks at the shrines of #T Zainudianism#! for every voyage that came home with its silver.\n\nOf the shipmasters who carved up the fleet after Jarenam died in 993 LC, only one family had the patience to build walls instead of ships. That house still rules [GetProvince('(int32)6030').GetName|G] on the eastern shore of Kharaz, and while its fleet is the smallest of the three harbors, its harbor is the only one that has never been taken. The lords of Karetxem sell their ships and their oaths with equal ease, and both Otrari and Qaruzhtan captains have learned to their cost that a Karetxemi alliance lasts exactly as long as the payment.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] watches the war between [GetCountry('AZQ').GetName|Y] and [GetCountry('QTB').GetName|Y] from behind those walls, ready to sell ships to whichever side is losing and to take the spoils from whichever side wins. Can the harbor lords of Karetxem outlast both of their rivals, or will the other harbors finally agree on something, and turn on the house that sold them out?"
 AZQ_island_lore_title:0 "The Dragon's Larder"
 AZQ_island_lore:0 "When #T Jarenam the Formidable Dragon#! led the #Y Yarenamian#! slaves in revolt in 977 LC and swept across #G Luxterra#!, his hordes needed grain, horses and ships more than they needed anything else. The #Y Kossian#! shipmasters of #G Kharaz#! became the larder of his conquests, and although they had little love for the Dragon, they grew rich feeding his armies by sea, and gave thanks at the shrines of #T Zainudianism#! for every voyage that came home with its silver.\n\nJarenam died in 993 LC without naming an heir, and the gold that had paid the fleet stopped coming. The shipmasters turned their ships against the very coasts they had once supplied, and before long they were turning them on each other. [GetCountry('QTB').GetName|Y] now flies its own colors over the western coves, and [GetCountry('QTR').GetName|Y] keeps its own harbor on the eastern shore, while #G Qaruzhta#! holds the split summit of [GetProvince('(int32)6026').GetName|G], the great beacon and the old fleet's treasury, and claims to be the only rightful master of the Kharaz roads.\n\n#T Qhagan Sakhir Totrazi#!, who seized the empire of Jarenam in 998 LC, demands that the Kharaz harbors resume the old deliveries, and [ROOT.GetCountry.GetRuler.GetName|Y] has answered him with promises and nothing else. Meanwhile, the coastal towns of Luxterra pay Qaruzhta more in tribute than they ever paid the Dragon. Will Qaruzhta bring the rebel harbors back to heel and rule the Kharaz roads, or will the Dragon's larder be picked clean by its own shipmasters?"
