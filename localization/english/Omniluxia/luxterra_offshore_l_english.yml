 TSR:0 "Lhaegard"
 TSR_ADJ:0 "Lhaegardi"
 TSR_island_lore_title:0 "The Amber Jarls of Lhaegard"
 TSR_island_lore:0 "The #Y Alveconian#! jarls of #G Lhaegard#! came across from the #G Norrfallian#! coast in the days when every jarl with a longship went looking for a hall of his own. They worship the #T Norrskalkiean#! gods, who are honored in every storm, every feast and every grief, and whom the settled folk of central #G Luxterra#! call barbaric. The first jarls found these islands empty but for seabirds, and found the narrow water between them and the mainland far more valuable than the islands themselves.\n\nLhaegard has lived on #G Tayngvw Sound#! ever since. Every amber trader bound south from the jarldoms of #G Falmankia#! and #G Norrkia#! must pass beneath the hall at [GetProvince('(int32)5996').GetName|G], and a ship that pays the jarl's toll passes in peace, while one that tries to slip through by night may meet the longships off [GetProvince('(int32)5999').GetName|G]. In lean years the jarls do not wait for ships to come to them. They take their crews across to raid the coasts of the peninsula, and the mainland jarls, who would do the same in their place, curse them as thieves while quietly hiring Lhaegardi crews for their own feuds.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] holds the toll by keeping the mainland jarls quarreling among themselves, but the amber trade has made them rich, and rich jarls have begun to build longships of their own. A jarl of Lhaegard sits on his high seat only so long as his crews believe he can fill their hands with silver. Will the jarls of the Sound make the toll a crown, or will the mainland finally come to collect what it has paid?"
