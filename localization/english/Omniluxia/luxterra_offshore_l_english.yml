 SKU:0 "Skutalik"
 SKU_ADJ:0 "Skutalik"
 SKU_island_lore:0 "The wind kept two boats off the landing all morning, and by the time they came in the hearths had already sent down bundles of driftwood and panniers of dry fish. [ROOT.GetCountry.GetRuler.GetName|Y] watched a woman untie her bundle to pull out the driest sticks, and she sent those ahead with a boy who could still feel his fingers.\n\nThe first Siamiu families came from near Mirus when the fishing grounds there grew crowded, and they meant to spend their winters here while there was room for their nets. Their descendants still count out wood and fish when the weather closes in, and word goes from hearth to hearth whenever another crew is driven ashore."
