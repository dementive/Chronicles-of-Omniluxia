 LHV:0 "Leshava"
 LHV_ADJ:0 "Leshavi"
 LHV_island_lore_title:0 "The Orchards of Leshava"
 LHV_island_lore:0 "The #Y Rossovii#! who settled #G Leshava#! came across from the eastern #G Zerywani#! coasts in search of land that no horde could ride over. They found it on these islands, where they planted orchards above the winter tide line and built their halls in the shelter of the coves, and they have kept faith with the #T Zerywani#! gods of their forefathers ever since.\n\nLeshava is a realm of shared harbors and shared harvests. Fishing families from [GetProvince('(int32)6021').GetName|G] to [GetProvince('(int32)6023').GetName|G] moor in coves that belong to all the households, and although every crew works its own boat through the season, the catch is weighed together at the harvest feast. An empty berth at the quay never leaves an empty plate in the hall, and Leshavi cider and dried fruit are sold in every port that will take them.\n\nThat quiet prosperity has not gone unnoticed. The elven citadel of [GetCountry('CFW').GetName|Y] lies only a few days' sail to the north, and every year its galleys come back from their raids with more captives than the year before. [ROOT.GetCountry.GetRuler.GetName|Y] has no walls worth the name and few men who have ever held a spear. Can the orchard folk of Leshava learn to fight before the elves come south for them?"
