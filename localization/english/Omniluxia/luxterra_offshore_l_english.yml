 CFW:0 "Vaerel"
 CFW_ADJ:0 "Vaereli"
 CFW_island_lore:0 "The first boat in at the spring moot brought fish still shining in the baskets, and [ROOT.GetCountry.GetRuler.GetName|Y] watched the crews set them down beside the households that had spent the morning in the young groves. There was earth on their sleeves, and one woman was still carrying the cord she used to tie a sapling to its stake.\n\nThe first Waldonian settlers carried sacks of mainland soil and crates of seedlings across the water in the name of #T Mother Cafea#!, and their children still work that soil around the roots each spring. The first catch goes to the households that tend the trees, and the boat crews wait to sell their own fish until those baskets have been carried up from the shore."
