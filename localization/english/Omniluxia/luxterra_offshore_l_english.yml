l_english:
 TSR:0 "Lhaegard"
 TSR_ADJ:0 "Lhaegardi"
 TSR_island_lore:0 "The headlands had been out of sight since dusk, and when the pilots of Tayngvw Sound came ashore they brought their sky tables straight to [ROOT.GetCountry.GetRuler.GetName|Y]. One laid a damp finger on the mark that had brought them between the islands, and another went to fetch a lamp so the younger hands could see how little room they had left themselves.\n\nThey tell the same story as the Stellarics, that visitors rose from a fallen star in Northstar Bay, and the oldest pilot tells it whenever a new hand first reads the tables. By morning the headlands were clear again, and the young hands were still at the table, working out where they would have gone without the stars."
