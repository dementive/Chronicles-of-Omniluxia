l_english:
 omni_sf_open:0 "The Shannah's Court"
 omni_sf_open_desc:0 "View your personal favor with the Shannah and request religious favors."
 omni_sf_build:0 "Cultivate the Shannah's Favor"
 omni_sf_build_desc:0 "Begin three encounters over the coming months. Gifts and services earn favor, up to 100. This does not create friendship. One cultivation attempt per year."
 omni_sf_favor_tt:0 "@religious_icon! #T Favor at the Shannah's Court#!\nGifts, patronage and quiet services earn #G Favor#!. Submitting a petition spends it immediately, even if refused.\n\n#T Personal Patronage#!\nYour ruler and the selected #Y Shannah#! share this understanding. #R Succession ends the balance.#!\n\n#T Sacred Authority#!\nFavor covers the full cost. Neither realm pays @political_influence! Influence or @gold! Gold; ordinary power cooldowns do not apply."
 omni_sf_no_shannah:0 "No eligible foreign Shannah is currently available. Reopen the court after one takes office."
 omni_sf_balance:0 "Favor: [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('omni_sf_favor_value')|0] / 100"
 omni_sf_cultivate:0 "Cultivate the Shannah's Favor"
 omni_sf_cultivate_desc:0 "Open a private audience to build and spend favor with this Shannah."
 omni_sf_cultivate_act:0 "Open a private audience with this Shannah. Viewing the court is free."
 omni_sf_cultivate_act_past:0 "$COUNTRY$ has sought the patronage of $CHAR$."
 omni_sf_cultivate_past:0 "Sought the Shannah's patronage"
 omni_sf_request_1:0 "Apostolic Blessing â€” 20 Favor"
 omni_sf_request_1_desc:0 "+5% omen power for five years. Favor covers the full cost; ordinary power cooldowns do not apply."
 omni_sf_request_2:0 "Holy Mission â€” 30 Favor"
 omni_sf_request_2_desc:0 "+25% pop conversion speed for five years. Favor covers the full cost; ordinary power cooldowns do not apply."
 omni_sf_request_3:0 "Recognize Your Crown â€” 40 Favor"
 omni_sf_request_3_desc:0 "+10 legitimacy. Once per ruler; monarchies only. Favor covers the full cost; ordinary power cooldowns do not apply."
 omni_sf_request_4:0 "Grant Absolution â€” 50 Favor"
 omni_sf_request_4_desc:0 "Remove 10 aggressive expansion. Requires at least 5 AE. Favor covers the full cost; ordinary power cooldowns do not apply."
 omni_sf_request_5:0 "Lift Excommunication â€” 65 Favor"
 omni_sf_request_5_desc:0 "Remove your realm's sentence and its opinion penalties."
 omni_sf_request_6:0 "Excommunicate a Ruler â€” 85 Favor"
 omni_sf_request_6_desc:0 "Condemn another Helluvian realm, enabling War of Penance. Favor covers the full cost; ordinary power cooldowns do not apply."
 omni_sf_begin:0 "Let us give the court a reason to remember us."
 omni_sf_menu_1:0 "Apostolic Blessing"
 omni_sf_menu_2:0 "Holy Mission"
 omni_sf_menu_3:0 "Recognize Your Crown"
 omni_sf_menu_4:0 "Grant Absolution"
 omni_sf_menu_5:0 "Lift Excommunication"
 omni_sf_menu_6:0 "Excommunicate a Ruler"
 omni_sf_close:0 "We have taken enough of the court's time."
 omni_sf_1_t:0 "The Shannah's Court"
 omni_sf_1_d:0 "My [ROOT.GetCountry.GetRulerTitle], the doors of the #Y Shannah's#! court open more readily to some petitioners than to others. Beyond the public audience chamber, stewards remember who repaired a leaking temple roof, who paid for the feast, and who came bearing only a very long speech. A ruler of [ROOT.GetCountry.GetName|T] should surely be remembered for the right reasons.\n\nGifts and quiet services may win us a place among the familiar faces. Yet this understanding belongs to two living rulers; neither an heir nor a successor is obliged to remember it.\n\n#T Court standing:#! #Y [ROOT.GetCountry.MakeScope.Var('omni_sf_favor').GetValue|0] / 100 Favor#!. Submitting a petition spends Favor immediately, even if refused. Ordinary Shannah power costs and cooldowns do not apply."
 omni_sf_switch:0 "Our next gift shall go to a different court."
 omni_sf_keep:0 "We shall keep faith with our present patron."
 omni_sf_2_t:0 "A Different Patron"
 omni_sf_2_d:0 "My [ROOT.GetCountry.GetRulerTitle], our envoys have found another #Y Shannah#! willing to receive them. The servants are gracious, the refreshments excellent, and someone has already asked whether we intend to become regular visitors.\n\nOur present patron will hear of this, of course. Years of carefully remembered courtesies can become forgotten remarkably quickly when their author is seen at another table.\n\nChanging patrons #R forfeits our existing Favor#!. The annual cultivation cooldown still applies."
 omni_sf_skip:0 "Fine words will have to serve."
 omni_sf_withdraw:0 "Recall our envoys; we have courted long enough."
 omni_sf_temple:0 "Let the faithful pray beneath a sound roof."
 omni_sf_purse:0 "The household need not trouble the public accounts."
 omni_sf_11_t:0 "A Donation Without Conditions"
 omni_sf_11_d:0 "My [ROOT.GetCountry.GetRulerTitle], a temple steward has arrived with a cracked roof tile, a list of repairs, and an impressive account of how many prayers are interrupted whenever it rains. A donation from [ROOT.GetCountry.GetName|T], he assures us, would be remembered before #T Hellas#! and entered very neatly in the public accounts.\n\nAfter the steward leaves, a second messenger lingers by the door. The #Y Shannah's#! household also has expenses, it seems, though these require neither roof tiles nor public accounts. Shall we pay for a dry sanctuary, or a warmer welcome behind closed doors?\n\nTemple patronage earns #G 10 Favor#!, plus #G 5#! with a #Y Pious#! or #Y Devout#! Shannah. The private purse earns #G 15 Favor#!, plus #G 5#! if #Y Corrupt#!; a #Y Righteous#! Shannah sends it to the temple and we lose #R 5 Favor#! instead. Both gifts come from our treasury."
 omni_sf_beast:0 "Send the beast. We can pay for a wider door."
 omni_sf_art:0 "Let our gift tend the Inner Flame."
 omni_sf_13_t:0 "The Gift That Cannot Fit Through the Door"
 omni_sf_13_d:0 "You will scarcely believe the offer, my [ROOT.GetCountry.GetRulerTitle]! An animal merchant waiting outside [ROOT.GetCountry.GetCapital.GetName|G] claims to possess a beast fit for the greatest court in the world. Its coat is splendid, its appetite prodigious, and its arrival at the #Y Shannah's#! residence would require the removal of a perfectly respectable door. The merchant considers this last point a recommendation.\n\nA sculptor offers a quieter tribute: a carved scene of #T Hellas#! tending the #T Inner Flame#! of the humble. It would stand in the sanctuary long after the merchant's marvel had eaten its third keeper out of house and home. Both promise to make our generosity memorable. Which memory should we purchase?\n\nThe beast earns #G 15 Favor#!, reduced to #G 5#! with a #Y Miserly#! Shannah. Religious art earns #G 10 Favor#!, plus #G 5#! with a #Y Generous#! Shannah."
 omni_sf_defend:0 "A sacred office deserves a public defense."
 omni_sf_silence:0 "Find the poet a reason to put down the pen."
 omni_sf_14_t:0 "The Insulted Holy Person"
 omni_sf_14_d:0 "My [ROOT.GetCountry.GetRulerTitle], a little sheet of verses has made its way from the taverns to our own audience chamber. Its author has discovered that a rhyme about the #Y Shannah's#! robes sells rather better than a sermon, and now even the servants are trying not to laugh.\n\nOur orators urge us to defend the dignity of the office before the joke becomes an insult repeated across [ROOT.GetCountry.GetName|T]. Other advisers know men who can persuade the poet to discover a less troublesome subject. A public declaration would carry our name; the other arrangement would, naturally, require discretion.\n\nA public defense earns #G 10 Favor#!, plus #G 5#! if our ruler is #Y Silver-Tongued#!. Silencing the critic earns #G 15 Favor#!, plus #G 5#! with a #Y Vengeful#! Shannah, at the cost of #R Corruption#! and #R Tyranny#!."
 omni_sf_done:0 "See that our next letter reaches the right hands."
 omni_sf_12_t:0 "An Audience Earned"
 omni_sf_12_d:0 "My [ROOT.GetCountry.GetRulerTitle], our envoys no longer need to explain whom they represent. A steward finds them seats, a clerk sets aside their letters, and the #Y Shannah's#! attendants speak of [ROOT.GetCountry.GetName|T] with a familiarity that was absent a few months ago. Our attentions have done their work.\n\nNo oath has been sworn and no friendship proclaimed. Still, a petition placed in a familiar hand is less likely to gather dust. When we next require an exercise of #T Helluvian#! authority, the court will remember our generosity.\n\nEarned #G Favor#! is available in the Shannah's Court until spent or either ruler leaves office. Petitions cost Favor alone; valid recipients are still required."
 omni_sf_abort:0 "Bring the envoys home."
 omni_sf_15_t:0 "An Interrupted Understanding"
 omni_sf_15_d:0 "My [ROOT.GetCountry.GetRulerTitle], the next audience will not take place. Our messengers have returned with unopened letters: death, succession, captivity or absence has closed the passage through which our carefully chosen gifts were to travel. The servants can promise nothing, and the doors remain shut.\n\nThere is little dignity in asking for a donation back. The treasury must bear what has already been spent, and our envoys must wait for another opportunity to make themselves welcome.\n\nThis cultivation attempt ends. Gifts are #R not refunded#!, and the #Y annual cultivation cooldown#! remains."
 omni_sf_victim_1:0 "Petition against [SCOPE.sChar('omni_sf_candidate_1').GetName] of [SCOPE.sChar('omni_sf_candidate_1').GetEmployer.GetName]."
 omni_sf_victim_2:0 "Petition against [SCOPE.sChar('omni_sf_candidate_2').GetName] of [SCOPE.sChar('omni_sf_candidate_2').GetEmployer.GetName]."
 omni_sf_victim_3:0 "Petition against [SCOPE.sChar('omni_sf_candidate_3').GetName] of [SCOPE.sChar('omni_sf_candidate_3').GetEmployer.GetName]."
 omni_sf_victim_4:0 "Petition against [SCOPE.sChar('omni_sf_candidate_4').GetName] of [SCOPE.sChar('omni_sf_candidate_4').GetEmployer.GetName]."
 omni_sf_victim_5:0 "Petition against [SCOPE.sChar('omni_sf_candidate_5').GetName] of [SCOPE.sChar('omni_sf_candidate_5').GetEmployer.GetName]."
 omni_sf_more:0 "Consider other rulers."
 omni_sf_cancel:0 "Withdraw the petition."
 omni_sf_30_t:0 "A Most Convenient Heresy"
 omni_sf_30_d:0 "My [ROOT.GetCountry.GetRulerTitle], the clerks have brought us a list of #T Helluvian#! rulers whose conduct might bear closer religious examination. There is room on the parchment for charges of impiety, contempt for sacred authority, and several offenses that our diplomats have only recently thought to describe in such terms.\n\nA word from the #Y Shannah#! could turn our quarrel into a matter for every faithful court. Before we ask for that word, however, we must choose whose name is to be written beneath the accusations.\n\nFive eligible rulers are shown at a time. Submitting this petition costs #Y 85 Favor#!, even if refused, and enables the #T War of Penance#!. Favor covers the full cost; the ordinary excommunication cooldown does not apply."
 omni_sf_accept:0 "Prepare the proclamation. Our word shall be honored."
 omni_sf_refuse:0 "Our authority is not theirs to command."
 omni_sf_50_t:0 "A Favor Called In"
 omni_sf_50_d:0 "An envoy bearing the seal of [SCOPE.sChar('omni_sf_request_patron').GetName|Y] has asked for a private audience. After the customary compliments, the visitor recalls the gifts and services once offered to our court. Now, it seems, their author would like to be remembered in return.\n\nThe petition asks us to exercise #T Helluvian#! authority. Our clerks await a decision, their pens poised above the register; the envoy watches rather more closely than courtesy requires.\n\nWe may grant or refuse. The Favor has #Y already been paid#!; refusal does not refund it. Favor covers the full cost; the recipient must still be valid."
 omni_sf_invalid:0 "Put away the petition. We shall find another occasion."
 omni_sf_53_t:0 "The Petition Cannot Proceed"
 omni_sf_53_d:0 "My [ROOT.GetCountry.GetRulerTitle], our petition has returned with its ribbons intact and its seal unbroken. Somewhere between its drafting and the final audience, circumstances changed. The clerks will not prepare a proclamation that the #Y Shannah#! can no longer lawfully issue.\n\nOur envoy has secured an assurance that this failure will not be charged against our standing. There is nothing to do but put the parchment away and consider another approach.\n\nThe recipient or personal relationship no longer permits this act. #R The Favor paid for this petition is not refunded.#!"
 omni_sf_refused:0 "Such gracious words for so little help."
 omni_sf_54_t:0 "A Petition Refused"
 omni_sf_54_d:0 "My [ROOT.GetCountry.GetRulerTitle], the #Y Shannah#! has answered. The letter praises our devotion, remembers our generosity, and spends a remarkable number of lines approaching the word that matters: no.\n\nOur envoy reports that the refusal was delivered with every courtesy. The doors remain open, the servants remain agreeable, and our petition remains ungranted. We may decide for ourselves how much comfort there is in that distinction.\n\n#R The Favor paid for this petition is not refunded.#!"
 omni_sf_granted:0 "Have the proclamation read before the court!"
 omni_sf_55_t:0 "The Signature and the Seal"
 omni_sf_55_d:0 "My [ROOT.GetCountry.GetRulerTitle], the seal is set! A messenger has brought the #Y Shannah's#! proclamation, and our clerks are already preparing copies for the courts that must hear it. What began with gifts and whispered recommendations now bears the full dignity of #T Helluvian#! authority.\n\nThe public document says nothing of earlier kindnesses. Those belong to the quieter register kept between our courts, where an obligation has now been answered.\n\nThe requested act has been granted using the #Y Favor#! already paid on submission."
 omni_sf_scandal:0 "Must every kindness have an audience?"
 omni_sf_56_t:0 "The Ledger Has Two Columns"
 omni_sf_56_d:0 "My [ROOT.GetCountry.GetRulerTitle], someone has been reading the wrong ledger aloud. Copies of our private arrangements are passing between courtiers, each accompanied by a very pious expression of concern. Donations once praised as generous are now being weighed against the #Y Shannah's#! recent proclamation. The sums, our enemies observe, are remarkably instructive.\n\nThe religious act stands. Our reputation is proving less durable. Even those who benefited from the arrangement have discovered reasons to deplore it in public."
 omni_sf_human_1:0 "An envoy from [SCOPE.sChar('omni_sf_request_patron').GetName|Y] bows before us, presenting a carefully sealed petition. Its author asks for a blessing to strengthen the omens proclaimed before their people.\n\nThe envoy speaks warmly of earlier gifts and services, then falls silent. Our clerks await the word that will turn a private understanding into a public act of #T Helluvian#! authority.\n\n#T Petition:#! Apostolic Blessing (#Y 20 Favor#! already paid by the petitioner). You may approve or deny. The petitioner has already paid the Favor; refusal does not refund it. No Influence or Gold is charged. The recipient is checked again if approved."
 omni_sf_human_2:0 "An envoy from [SCOPE.sChar('omni_sf_request_patron').GetName|Y] bows before us, presenting a carefully sealed petition. Its author asks for a holy mission to bring more souls into the light of #T Hellas#!.\n\nThe envoy speaks warmly of earlier gifts and services, then falls silent. Our clerks await the word that will turn a private understanding into a public act of #T Helluvian#! authority.\n\n#T Petition:#! Holy Mission (#Y 30 Favor#! already paid by the petitioner). You may approve or deny. The petitioner has already paid the Favor; refusal does not refund it. No Influence or Gold is charged. The recipient is checked again if approved."
 omni_sf_human_3:0 "An envoy from [SCOPE.sChar('omni_sf_request_patron').GetName|Y] bows before us, presenting a carefully sealed petition. Its author asks for recognition of their crown, so that sacred authority may lend weight to a mortal throne.\n\nThe envoy speaks warmly of earlier gifts and services, then falls silent. Our clerks await the word that will turn a private understanding into a public act of #T Helluvian#! authority.\n\n#T Petition:#! Recognize Your Crown (#Y 40 Favor#! already paid by the petitioner). You may approve or deny. The petitioner has already paid the Favor; refusal does not refund it. No Influence or Gold is charged. The recipient is checked again if approved."
 omni_sf_human_4:0 "An envoy from [SCOPE.sChar('omni_sf_request_patron').GetName|Y] bows before us, presenting a carefully sealed petition. Its author asks for absolution for the deeds by which their realm has grown.\n\nThe envoy speaks warmly of earlier gifts and services, then falls silent. Our clerks await the word that will turn a private understanding into a public act of #T Helluvian#! authority.\n\n#T Petition:#! Grant Absolution (#Y 50 Favor#! already paid by the petitioner). You may approve or deny. The petitioner has already paid the Favor; refusal does not refund it. No Influence or Gold is charged. The recipient is checked again if approved."
 omni_sf_human_5:0 "An envoy from [SCOPE.sChar('omni_sf_request_patron').GetName|Y] bows before us, presenting a carefully sealed petition. Its author asks for release from excommunication and a place once more among the faithful.\n\nThe envoy speaks warmly of earlier gifts and services, then falls silent. Our clerks await the word that will turn a private understanding into a public act of #T Helluvian#! authority.\n\n#T Petition:#! Lift Excommunication (#Y 65 Favor#! already paid by the petitioner). You may approve or deny. The petitioner has already paid the Favor; refusal does not refund it. No Influence or Gold is charged. The recipient is checked again if approved."
 omni_sf_human_6:0 "An envoy from [SCOPE.sChar('omni_sf_request_patron').GetName|Y] bows before us, presenting a carefully sealed petition. Its author asks for a sentence of excommunication against a fellow ruler. The accused is [SCOPE.sChar('omni_sf_request_victim').GetName|Y] of [SCOPE.sChar('omni_sf_request_victim').GetEmployer.GetName|T].\n\nThe envoy speaks warmly of earlier gifts and services, then falls silent. Our clerks await the word that will turn a private understanding into a public act of #T Helluvian#! authority.\n\n#T Petition:#! Excommunicate a Ruler (#Y 85 Favor#! already paid by the petitioner). You may approve or deny. The petitioner has already paid the Favor; refusal does not refund it. No Influence or Gold is charged. The recipient is checked again if approved."
 omni_sf_panel_title:0 "THE SHANNAH'S COURT"
 omni_sf_panel_hint:0 "Gifts and services earn favor. Granted requests spend it."
 omni_sf_panel_name:0 "[Player.MakeScope.GetVariable('omni_sf_shannah').GetCharacter.GetName]"
 omni_sf_close_panel:0 "Close"
