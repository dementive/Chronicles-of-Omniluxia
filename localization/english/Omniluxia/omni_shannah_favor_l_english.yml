 omni_sf_launcher_tt:0 "@religious_icon! #T The Shannah's Court#!\n#Y Favor: [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('omni_sf_favor_value')|0] / 100#!\n\nCultivate #G Favor#! through gifts and services, or petition for an act of #T Helluvian#! authority.\n\nFavor is spent #G when a petition is submitted#!."
 omni_sf_relationship_tt:0 "Your ruler has a valid personal relationship with this Shannah."
 omni_sf_no_pending_tt:0 "No cultivation or religious request is awaiting a response. Resolve your active encounter, or wait for the human Shannah to answer their event."
 omni_sf_no_active_tt:0 "No cultivation chain is currently active."
 omni_sf_build_cooldown_tt:0 "At least 365 days have passed since your last cultivation attempt."
 omni_sf_below_cap_tt:0 "Your favor is below the maximum of 100."
 omni_sf_temple_choice_tt:0 "Spend #Y 50 Gold#! from the treasury and give it to the Shannah's realm. Gain #G 10 Favor#!, or #G 15#! with a #Y Pious#! or #Y Devout#! Shannah."
 omni_sf_purse_choice_tt:0 "Spend #Y 75 Gold#!. Gain #G 15 Favor#!, or #G 20#! with a #Y Corrupt#! Shannah. Your ruler gains #R 3 Corruption#! and the arrangement may cause a later scandal. The Shannah receives the purse and gains #R 2 Corruption#!. A #Y Righteous#! Shannah instead gives the money to the temple and you lose #R 5 Favor#! (the #Y Corrupt#! bonus still applies). Your ruler still gains corruption and risks scandal."
 omni_sf_beast_choice_tt:0 "Spend #Y 100 Gold#!. Gain #G 15 Favor#!, reduced to #G 5#! with a #Y Miserly#! Shannah."
 omni_sf_art_choice_tt:0 "Spend #Y 40 Gold#!. Gain #G 10 Favor#!, or #G 15#! with a #Y Generous#! Shannah."
 omni_sf_defend_choice_tt:0 "Spend #Y 10 Political Influence#!. Gain #G 10 Favor#!, or #G 15#! if your ruler is #Y Silver-Tongued#!."
 omni_sf_silence_choice_tt:0 "Spend #Y 60 Gold#!. Gain #G 15 Favor#!, or #G 20#! with a #Y Vengeful#! Shannah. Your ruler gains #R 3 Corruption#! and your country gains #R 2 Tyranny#!. The arrangement may cause a later scandal."
 omni_sf_skip_choice_tt:0 "Gain no Favor. Continue to the next encounter."
 omni_sf_menu_1_tt:0 "Submitting this petition spends #Y 20 Favor#! immediately, even if refused. No Gold or Political Influence is charged."
 omni_sf_menu_2_tt:0 "Submitting this petition spends #Y 30 Favor#! immediately, even if refused. No Gold or Political Influence is charged."
 omni_sf_menu_3_tt:0 "Submitting this petition spends #Y 40 Favor#! immediately, even if refused. No Gold or Political Influence is charged."
 omni_sf_menu_4_tt:0 "Submitting this petition spends #Y 50 Favor#! immediately, even if refused. No Gold or Political Influence is charged."
 omni_sf_menu_5_tt:0 "Submitting this petition spends #Y 65 Favor#! immediately, even if refused. No Gold or Political Influence is charged."
 omni_sf_menu_6_tt:0 "Submitting this petition spends #Y 85 Favor#! immediately, even if refused. No Gold or Political Influence is charged."

 omni_sf_60_t:0 "A New Petition"
 omni_sf_60_d:0 "An envoy from [SCOPE.sCountry('omni_sf_petitioner').GetName|Y], bearing the seal of [SCOPE.sChar('omni_sf_request_patron').GetName|Y], has brought a new petition before the Shannah.\n\nYou may review it now or hear the appeal later through #Y Review Petitions#! in the Helluvian Faith window."
 omni_sf_review_petition:0 "Review the petition."
 omni_sf_petition_later:0 "I will consider it later."
