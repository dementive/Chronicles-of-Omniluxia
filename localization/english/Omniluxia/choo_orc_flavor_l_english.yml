l_english:

daimyo_to_shogun: "Declare an Independent Nuoragia"
daimyo_to_shogun_desc: "While there are many smaller families willing to be obedient Jauzkar to one of the great Nurhanuoragia, ours has more ambition than to be a simple pawn. Should we be able to free ourselves from our overlord, we can take the first step to becoming one of the Great Clans of the Bloody Isles, declaring ourselves an independent Nuoragia!"

shogun_to_shogunate: "Declare a Nurhanuoragia"
shogun_to_shogunate_desc: "Our clan has come far from its humble beginnings, and has now accumulated enough power and land to be considered one of the Great Clans of the Bloody Isles! With an official declaration, we can now stand on equal footing with the other Nurhanuoragia, who will be be forced to acknowledge our place as a regional power!"

orc_levelup1_tt: "#Y We will declare ourselves an #E Independent Nuoragia#!#!"
orc_levelup2_tt: "#Y We will declare ourselves a #E Nurhanuoragia#!#!"
orc_shogun_subjects_tt: "#Y Has two or more subjects#!"

orc_flavor_1_title: "Fall of a Nurhanuoragia"
orc_flavor_1_desc: "Long has our clan been known as a powerful and prestigious Nurhanuoragia, one of the great spiritual and earthly powers of #E Gozon's Islands#!! However, time has slowly chipped away at our power, our prestige, and our lands. It seems that the other clans no longer consider us a #E Nurhanuoragia#!, and now respond to us with the courtesy afforded to one of the many lowborn clans of the islands!\n\nThis slight will not be forgotten! We must restore our clan's honor and status through whatever means necessary, for it is better to die in a blaze of glory than to have one's embers slowly extinguish!"
orc_flavor_1.a: "What a shameful display!"
orc_flavor_1_tooltip.a: "#R Our clan has lost enough prestige to no longer be considered a great #E Nurhanuoragia#!!#!"

orc_flavor_2_title: "Subjugation of a Jauzkar"
orc_flavor_2_desc: "Wise #E [ROOT.GetCountry.GetRuler.GetFirstName]#!, we have been vanquished.\n\nHaving been overrun by the barbaric hordes of a great #E Orcish#! clan, our subjugated realm is now considered a #E Jauzkar#! of our overlord, and is expected to provide money and manpower to our liege while we defend their borders from invaders.\n\nAlthough hope seems bleak, our fate is not yet sealed. Should our overlord grow too weak and the vultures begin to circle, we may once again have a chance at freedom."
orc_flavor_2.a: "This is not the end..."
orc_flavor_2_tooltip.a: "#R We have been subjugated by a powerful #E Nuoragia#!!"

orc_flavor_3_title: "Rise of a Nuoragia"
orc_flavor_3_desc: "Great #E [ROOT.GetCountry.GetRuler.GetFirstName]#!, our clan, having freed itself from the shackles of oppression, is now a recognized independent realm!\n\nWhile we are only one of the many lowborn clans that inhabit the #E Orcish Isles#!, we may one day dream of becoming powerful enough to declare ourselves an equal to the great #E Nurhanuoragia#!!"
orc_flavor_3.a: "Greatness awaits!"
orc_flavor_3_tooltip.a: "#G Our clan is now recognized as a powerful #E Nuoragia#!!"

orc_flavor_4_title: "Rise of a Nurhanuoragia"
orc_flavor_4_desc: "Wise M'Orokoro, it is a privilege to to be in the presence of one of the few #E Great Infernos#! of the islands!\n\nYour eminence has been officially recognized by the sages as follower of the #E White Flame#!, the highest honor and spiritual authority one can have! As the keeper of this great #E Nurhanuoragia#!, your people humbly ask that you temper their inner fires and guide their labors to achieve true enlightenment!"
orc_flavor_4.a: "I shall be the shepard my clan needs"
orc_flavor_4_tooltip.a: "#G Our clan is now recognized as a powerful #E Nurhanuoragia#!!"

orc_flavor_5_title: "The Ascent Begins"
orc_flavor_5_desc: "Wise M'Orokoro, it is a privilege to to be in the presence of one of the few #E Great Infernos#! of the islands!\n\nYour eminence has been officially recognized by the sages as follower of the #E White Flame#!, the highest honor and spiritual authority one can have! As the keeper of this great #E Nurhanuoragia#!, your people humbly ask that you temper their inner fires and guide their labors to achieve true enlightenment!"
orc_flavor_5.a: "I shall be the shepard my clan needs"
orc_flavor_5_tooltip.a: "#G Our clan is now recognized as a powerful #E Nurhanuoragia#!!"

