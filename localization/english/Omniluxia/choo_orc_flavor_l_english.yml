white_flame_trait: "White Flame"
white_flame_trait_desc: "Often only found amongst the royal families of the Bloody Isles, very few in society have managed to achieve to this level through The Ascent."
yellow_flame_trait: "Yellow Flame"
yellow_flame_trait_desc: "A prestigious level often only achieved by the upper echelons of society, the majority of those maintaining a yellow flame have inherited it from their family line. This level is notoriously hard to achieve, and more than enough corrupt priests have known to demote ambitious commoners from this level."
orange_flame_trait: "Orange Flame"
orange_flame_trait_desc: "The most common flame found on the Bloody Isles, those maintaining an orange flame are seen as respectable and faithful followers of Gozon's teachings."
red_flame_trait: "Red Flame"
red_flame_trait_desc: "A dim flame associated with brutes and drunkards, those whose flame deteriorates to red often either don't have the time or the means to properly develop their Inner Flame. Looked down upon in civilized Orc society, these poor individuals are often forced into lower-rank jobs, continuing the cycle of poverty that keeps them at this level."
crimson_flame_trait: "Crimson Flame"
crimson_flame_trait_desc: "Barely more than monsters, the #E Duarsh#! that refuse the pipe allow their Inner Flame to grow dim enough that they lose their sanity. Although blessed with the strength associated with our savage ancestors, these Orcs are often reduced to a primitive existence as slaves or roving hunting parties."
black_flame_trait: "Black Flame"
black_flame_trait_desc: "The few dark followers of the mysterious 'Black Flame' have only appeared on the Bloody Isles in the last few centuries. Followers of dark gods, these individuals manage to retain their sanity despite their sobriety through the use of Melodian magic."

# Snake Events because Imperator Hates Localization Files

destroy_lodge: "Destroy Lodge"
war_on_lodge_tt: "#R The #E Lodge Master#! will rally the members of the destroyed Lodge to fight!#!\n\n"
destroy_lodge_desc: "Now that we've made enemies of the #E Ishtar Society#!, the only way to ensure their influence doesn't destroy our realm is by eliminating their gathering places: their #E Lodges#!. Let us send out an army of men to destroy their demonic shrines in a righteous fire."

appease_society: "Send Gift to the Ishtar Society"
appease_society_tt: "#Y We will attempt to appease the #E Ishtar Society#! through a gift#!\n\n"
appease_society_desc: "We've made a terrible enemy in the #E Ishtar Society#!, and unless they are appeased, their wrath will continue to rage like a fiery tornado. Perhaps a gift may help ease tensions between us?"

snake_flavor_1_title: "A New Mage"
snake_flavor_1_desc: "The #E Ishtar Society#! is a secretive order of Mage-Serpents who operate from their secretive Lodges found across the #E Austropetolian Archipelago#!. Ever since anyone can remember, their mages have advised and supported the rulers of [ROOT.GetCountry.GetName] in all magical affairs.\n\nFollowing the untimely passing of our previous magical advisor, a man claiming to be a member of the society has recently approached #E [ROOT.GetCountry.GetRuler.GetFirstName]#! with a message from a nearby Lodge.\n\n'Our Lodge has faithfully served this state for generations, and thus, they have sent me to be the next mage to serve [ROOT.GetCountry.GetName] in this time of mourning.'\n\nRejecting this gift from the society would be breaking from centuries of tradition and put our realm at risk of being targeted by the notoriously vengeful #E Ishtar Society#!. However, destroying these age-old institutions may pave the way for further magical development. Is this a risk #E [ROOT.GetCountry.GetRuler.GetFirstName]#! is willing to take?"
snake_flavor_1.a: "We appreciate this gift"
snake_flavor_1_tooltip.a: "#Y #E [SCOPE.sCharacter('illu_snake_mage').GetFirstName]#! will become the new #E Court Mage#!#!"
snake_flavor_1.b: "We do not need the Society's 'help'"
snake_flavor_1_tooltip.b: "#R The #E Ishtar Society#! will not forget this insult#!"

snake_flavor_2_title: "A Threat"
snake_flavor_2_desc: "The #E Ishtar Society#! is a secretive order of Mage-Serpents whose members can be found advising and serving polities across the #E Austropetolian Archipelago#!.\n\nRecently, a hooded figure has approached #E [ROOT.GetCountry.GetRuler.GetFirstName]#! with a demand from the Society itself.\n\n'#R As a ssign of goodwill we have generously ssent a mage by the name of #E [SCOPE.sCharacter('illu_snake_mage').GetFirstName]#! to advise and sserve you.#!'\n\n'#R Now, we have been told that hiss servicess have be spurned in favor of some lessser noble.#!'\n\n'#R The Ssociety will not take this slight lightly. However, we are willing to forgive such a transsgression should #E [SCOPE.sCharacter('illu_snake_mage').GetFirstName]#! be returned hiss position and the Ssociety be compensated as a ssign of goodwill between us and your realm.#!'\n\nAgreeing to their terms would surely tarnish #E [ROOT.GetCountry.GetRuler.GetFirstName]#!'s image, however, kingdoms who oppose the Society do not last long. Is this a risk #E [ROOT.GetCountry.GetRuler.GetFirstName]#! is willing to take?"
snake_flavor_2.a: "Please let the Lodge Masters know I meant no disrespect"
snake_flavor_2_tooltip.a: "#Y #E [SCOPE.sCharacter('illu_snake_mage').GetFirstName]#! will take #E [SCOPE.sCharacter('poor_sap').GetFirstName]#!'s position as #E Court Mage#!#!"
snake_flavor_2.b: "The Society does not intimidate me!"
snake_flavor_2_tooltip.b: "#R The #E Ishtar Society#! will not forget this insult#!"

snake_flavor_4_title: "An Assassination Attempt"
snake_flavor_4_desc: "You awake, but you cannot move. No matter what commands your head shouts at your body, no muscle responds.\n\nYour perspective starts floating as you witness an intruder enter your room. Suddenly, you are simply a spectator, watching as a great serpent slithers into your chambers, slowly making its way to your body.\n\nYou can see the fear in your eyes as the beast slithers into your bed. It's long body coils around your helpless corpse and squeezes.\n\nYou suffocate while being unable to return to your body. All you can do is try and scream as you watch your body disappear, covered by the vibrant green scales of your killer.\n\n...\n\nYou jolt awake.\n\nIt was just a dream.\n\nHeart still pounding you release an extended sigh of relief. That's when you see [SCOPE.sCharacter('snake_assassin').GetHerHim] out the corner of your eye.\n\nYour quick reaction means the dagger now pierces your empty bed sheets. The assassin, surprised, momentarily stops, their second mistake that night.\n\nThe door bursts open, and your guards flood into the room. They take more than a moment to assess the situation, so you remind them of their duties."
snake_flavor_4.a: "Guards, kill [SCOPE.sCharacter('snake_assassin').GetHerHim]!"
snake_flavor_4_tooltip.a: "#Y The #E Ishtar Society#! has attempted to take your life!#!"

snake_flavor_5_title: "The Assassin"
snake_flavor_5_desc: "Silence.\n\nSuddenly, a soft noise followed by a sharp pain.\n\nYou stare, now wide awake, at the figure standing above you. At the figure who holds the dagger now firmly in your chest.\n\nYou look into their eyes, and see their blank expression. You look at their hands, you look at your blood.\n\nYou take one final look at the few purple scales on their hands.\n\nYou close your eyes.\n\nYou know who did this, you knew there was a chance this could happen. Yet, you still never thought it would end like this.\n\nThere was so much left to do, there were lands to conquer, palaces to build, you were meant to build a legacy that your successors would remember for generations.\n\nCould you truly have peace, even at your final moments?\n\nSilence."
snake_flavor_5.a: "..."
snake_flavor_5_tooltip.a: "#R The #E Ishtar Society#! has taken your life!#!"

snake_flavor_6_title: "Civil War"
snake_flavor_6_desc: "Great #E [ROOT.GetCountry.GetRuler.GetFirstName]#!, urgent news!\n\nIt seems that the treacherous #E [SCOPE.sCharacter('rebel_scum').GetFirstName]#! has secretly been plotting against your reign! Many nobles have rallied behind [SCOPE.sCharacter('rebel_scum').GetHerHis] cause, and have now begun an armed rebellion against your rule!\n\nAdditionally, various lodges have lent their support to the traitor, and have send soldiers to help [SCOPE.sCharacter('rebel_scum').GetHerHis] cause! Their mages are formidable opponents on the battlefield, so our army must be prepared to deal with this rebel noble swiftly and efficiently!"
snake_flavor_6.a: "I know the Society is behind this..."

snake_flavor_7_title: "A Lodge Destroyed"
snake_flavor_7_desc: "The #E Ishtari Lodge#! in [SCOPE.sProvince('lodge_revolt_cap').GetName] burns!\n\nThose #E Ishtari#! dogs lucky enough to escape have rallied behind their #E Lodge Master#!, a man named #E [SCOPE.sCharacter('illu_local_leader').GetFirstName]#!, who has been rumored to be a powerful mage.\n\nAlthough their numbers are small compared to us, we must not forget that their arcane abilities still make their soldiers formidable foes."
snake_flavor_7.a: "Let us see how truly strong your Society is"
snake_flavor_7_tooltip.a: "#R We have destroyed an #E Ishtari Lodge#!#!"

snake_flavor_8_title: "Appeasing the Society"
snake_flavor_8_desc: "With no other options left, #E [ROOT.GetCountry.GetRuler.GetFirstName]#! has decided that the best course of action is to attempt to appease the Society with a large gift as a token of [ROOT.GetCountry.GetRuler.GetHerHis] submission.\n\nAfter several tense days of waiting, a response from the Society finally arrives. Impressed with the size of the gift, they have decided to forgive #E [ROOT.GetCountry.GetRuler.GetFirstName]#!, and, as a token of goodwill, have sent a young mage by the name of #E [SCOPE.sCharacter('illu_snake_mage').GetFirstName]#! to serve the realm.\n\nHowever, they warn, crossing them again will not bode well for #E [ROOT.GetCountry.GetRuler.GetFirstName]#!. Should [ROOT.GetCountry.GetRuler.GetSheHe] disrespect them again, they say the consequences will be felt across the realm."
snake_flavor_8.a: "We are thankful for your forgiveness"
snake_flavor_8_tooltip.a: "#Y #E [SCOPE.sCharacter('illu_snake_mage').GetFirstName]#! will take #E [SCOPE.sCharacter('poor_sap').GetFirstName]#!'s position as #E Court Mage#!#!"

