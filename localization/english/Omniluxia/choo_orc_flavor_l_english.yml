l_english:

daimyo_to_shogun: "Declare an Independent Nuoragia"
daimyo_to_shogun_desc: "While there are many smaller families willing to be obedient Jauzkar to one of the great Nurhanuoragia, ours has more ambition than to be a simple pawn. Should we be able to free ourselves from our overlord, we can take the first step to becoming one of the Great Clans of the Bloody Isles, declaring ourselves an independent Nuoragia!"

shogun_to_shogunate: "Declare a Nurhanuoragia"
shogun_to_shogunate_desc: "Our clan has come far from its humble beginnings, and has now accumulated enough power and land to be considered one of the Great Clans of the Bloody Isles! With an official declaration, we can now stand on equal footing with the other Nurhanuoragia, who will be be forced to acknowledge our place as a regional power!"

orc_flavor_3_title: "The Second Unification Wars"
orc_flavor_3_desc: "Incoming merchants have recently begun sharing stories from far off in the mountains of #E Morrigon#! that talk about a great conflict between the #E Silver Dwarves#!.\n\nThe last our people have heard of the #E Silver Dwarves#! were tales of resistance against the #E Zani Empire#!, culminating in a great battle won by a legendary King. However his death centuries ago broke apart their great kingdom.\n\nTales have been spun about a new King who seeks to emulate this ancient hero, and only time will tell if he is successful. If the #E Silver Dwarves#! were to unite again it could change the political landscape of Omniluxia forever..."
orc_flavor_3.a: "Who cares about some brutes in far off mountains?"
orc_flavor_3_tooltip: "#G The Rulers of the #E Green Valley#! will fight until one unifies them all!#!"
