 omni_shannah_powers_guide:0 "The Powers of the Shannah"
 omni_shannah_powers_guide_desc:0 "Consult a free guide to the authority of the Shannah: excommunication, reconciliation, blessings, recognition of crowns, absolution, holy missions, and the Omostthanat. Reading this guide spends no resources and uses no powers."
 omni_shannah_powers.1.t:0 "The Authority of the Shannah"
 omni_shannah_powers.1.desc:0 "The cleric waiting beside the great ledger has ink on both sleeves and the weary expression of a person who has explained the same matter to three ambassadors already. At the mention of the #T Shannah#!, however, the back straightens. There are crowns enough in the world, the cleric observes, but only one office claims to speak for the #T Creator of All Things That Can Never Be Known#!. Even kings find it prudent to listen.\n\nFrom the #G Apostolic Palace#! at #G Ddu-Nuinop#! come blessings, pardons, and sentences that can make a ruler's own subjects question the safety of their souls. A favorable word can steady a crown; an unfavorable one can give a neighboring king a remarkably pious reason to sharpen a sword. The ledger contains examples of both.\n\nSelect a subject below. This consultation is #Y free#!. The six powers are used through #Y foreign rulers' character windows#! by a landed #T Helluvian#! country whose ruler bears the #T Shannah#! trait. Favorable powers require a #T Helluvian#! recipient in communion; none can target the issuer's own country, and no additional diplomatic-range limit applies. Each use is announced throughout the landed #T Helluvian#! world. AI Shannahs hold a council every #Y three years#!, preserving #Y 50 political influence#! and #Y 250 gold#! after spending; ordinary powers still need eligible targets and sufficient resources. If none can be used, the council's pastoral duty supplies a free blessing or reconciliation so another eligible Helluvian realm hears from the palace at each council."
 omni_shannah_powers.close:0 "The cleric may return to the ledger."
 omni_shannah_powers.back:0 "And what of the other powers?"
 omni_shannah_powers.acknowledge:0 "The faithful shall hear of this."
 omni_shannah_powers.2.t:0 "Excommunication"
 omni_shannah_powers.2.desc:0 "The cleric turns to a page whose margins are crowded with names. Some have been carefully crossed out. Others have been restored in a different hand. A crown, we are told, provides very little protection when a priest begins asking whether its wearer has abandoned #T Hellas#!. The #T Shannah#! need only pronounce the sentence; the condemned ruler must then explain it to an entire kingdom.\n\nAt foreign courts, old grievances suddenly acquire the dignity of religious duty. At home, the faithful wonder whether obedience to their sovereign imperils their souls. It is a dangerous thing to place between a ruler and the people who fill the granaries, pay the taxes, and carry the spears.\n\n#R Excommunication#! costs #Y 25 political influence#!; the issuer may pronounce one sentence every #Y 365 days#!. Other existing landed #T Helluvian#! countries receive persistent #R -50 opinion#! of the target, which also suffers #R -10% happiness for pops of its state religion#!. The sentence survives succession until lifted. Independent #T Helluvian#! countries in communion gain a claim-free #T War of Penance#! against the Helluvian target: battle-based warscore, #G -10% province conquest cost#!, and ordinary negotiated peace. Normal diplomatic restrictions apply. Victory does not lift the sentence. Later Helluvian countries gain CB access, but not the historical opinion penalty."
 omni_shannah_powers.3.t:0 "Lifting Excommunication"
 omni_shannah_powers.3.desc:0 "The next page is considerably cleaner. Once a ruler has been condemned, the cleric explains, everyone discovers a great interest in the precise wording of a pardon. The court wants its dignity restored, the priests want their authority acknowledged, and the neighbors would prefer that no one mention the troops they have been gathering.\n\nStill, the #T Shannah#! may open the door that was closed. A new letter is read before the faithful, the sentence is withdrawn, and a ruler who yesterday stood outside communion may once again claim a place among the children of #T Hellas#!. Whether forgiveness reaches the hearts of old enemies is another question; the palace can withdraw its decree more easily than an army can forget its losses.\n\n#Y Lift Excommunication#! is #Y free#! with #Y no cooldown#!, and can target a condemned foreign country even after it converts. It removes the sentence, its historical opinion penalties, and its #R -10% state-religion happiness#! penalty. New #T Wars of Penance#! become unavailable; existing wars continue. Conversion alone does not remove the sentence or its penalties."
 omni_shannah_powers.4.t:0 "Apostolic Blessing"
 omni_shannah_powers.4.desc:0 "There is a brief disagreement outside the chamber over which ambassador arrived first. Both, it seems, have come to ask whether the #T Shannah#! has looked favorably upon their master's devotion. The cleric closes the door before either can explain just how devout that master has become.\n\nAn #T Apostolic Blessing#! travels farther than a court compliment. Priests repeat it before their congregations, officials arrange particularly impressive observances, and the favored ruler makes certain that no one mistakes whose piety has attracted the attention of #T Hellas#!. Even a well-established throne benefits from having heaven mentioned approvingly in the same sentence.\n\nThe blessing costs #Y 25 political influence#! and grants a foreign #T Helluvian#! country in communion #G +5% omen power#! for #Y 1,825 days#!. The issuing country may grant one every #Y 365 days#!. An active blessing cannot be renewed early. When an AI council can perform no ordinary action, its pastoral duty grants a #Y free#! blessing to another #T Helluvian#! country in communion, refreshing an existing blessing if necessary. If every eligible foreign realm is condemned, the council instead lifts one sentence."
 omni_shannah_powers.5.t:0 "Recognizing a Crown"
 omni_shannah_powers.5.desc:0 "A clerk brings in a petition decorated with a family tree of extraordinary length. Its owner wishes the #T Shannah#! to recognize a crown, and has apparently decided that the safest argument is to name every ancestor who ever possessed a respectable horse. The palace has seen worse claims.\n\nWhat matters is the answer. When the head of the #T Helluvian#! faith acknowledges a monarch, doubtful subjects hear that their sovereign's rule has received sacred approval. Rival claimants may continue to mutter, but they must now do so in disagreement with a rather important priest. The newly recognized court generally remembers the favor.\n\nRecognition costs #Y 25 political influence#! and grants a foreign #T Helluvian#! monarchy in communion #G +10 legitimacy#! and #G +25 opinion#! of the issuer, decaying by #Y 5 yearly#!. It is available #Y once per target ruler's lifetime#!, including after a return to office, and once every #Y 365 days#! for the issuer. Successors may seek their own recognition; the same issuer's opinion bonus is replaced, not stacked."
 omni_shannah_powers.6.t:0 "Granting Absolution"
 omni_shannah_powers.6.desc:0 "The cleric lowers the voice slightly. Rulers, we are informed, occasionally discover that their victories have been misunderstood. A burned town becomes an unfortunate necessity, a broken promise becomes a matter of interpretation, and the conquest of a neighbor becomes a burden accepted with the greatest reluctance. Such explanations arrive at the palace with remarkable regularity.\n\nThe #T Shannah#! cannot rebuild every town or return every disputed field, but a public pardon can persuade the faithful that the offender has been heard and forgiven. There will always be some who call this convenient. They are seldom the ones requesting the pardon.\n\n#T Absolution#! costs #Y 25 political influence#! and removes #G 10 aggressive expansion#! from a foreign #T Helluvian#! country in communion with at least #Y 5 aggressive expansion#!. The issuer may grant it every #Y 365 days#!; each recipient must wait #Y 3,650 days#! between pardons, regardless of who holds the office. It does not lift #R excommunication#!."
 omni_shannah_powers.7.t:0 "Sponsoring a Holy Mission"
 omni_shannah_powers.7.desc:0 "Beyond the chamber, a small party of clergy is arguing over the weight of its baggage. Books, vestments, provisions, and a seemingly indispensable collection of ceremonial vessels have all been declared essential. The cleric assures us that a #T Holy Mission#! is a serious undertaking, although the mule charged with carrying it may have formed another opinion.\n\nWith the #T Shannah#! paying for the journey, priests can establish themselves abroad and bring the teachings of #T Hellas#! to those who have scarcely heard them. The work is patient: sermons must be understood, customs explained, and the confidence of local families earned. A purse can send a preacher down the road; it cannot make every listener believe by sunset.\n\nSponsorship costs #Y 50 gold#! and #Y 25 political influence#!. A foreign #T Helluvian#! country in communion gains #G +25% pop conversion speed#! for #Y 1,825 days#! through normal conversion. The issuer may sponsor one mission every #Y 365 days#!; active missions cannot be renewed early. No pops convert instantly."
 omni_shannah_powers.8.t:0 "The Omostthanat"
 omni_shannah_powers.8.desc:0 "Here the ledger gives way to a map. The cleric spreads it across the table and weighs down one corner with an empty cup. When #T Hellas#! makes his will known, we are told, the #T Shannah#! may summon an #T Omostthanat#!. Throughout the faithful lands, rulers must then decide whether their devotion is best expressed in soldiers, money, or a particularly convincing explanation of why neither can presently be spared.\n\nThe #Y Swords of Hellas#! do not assemble in an afternoon. Messengers must ride, provisions must be purchased, and promises must survive the arrival of an actual departure date. Across the frontier, the intended foe has messengers of its own.\n\nThe Omostthanat decision opens a #Y free council#!; confirmation costs #Y 250 gold#! and #Y 50 political influence#!, with #Y 180 days#! of preparation and a #Y 3,650-day cooldown#!. Only one worldwide expedition can be prepared or active. The Shannah must be independent, at peace, and free of civil war. Targets must be independent non-Helluvian countries without civil war, within diplomatic range and either neighboring or within #Y 250 capital-distance units#!; allies and truce partners are excluded. Eligible Helluvian realms may pledge, donate, or decline; the defender may seek support. Pledges are checked at launch. Conquest uses negotiated peace, verified military service earns religious rewards, and eligible retained conquests may receive postwar conversion missions. #Y Review the Omostthanat#! records the expedition's progress."
 omni_shannah_powers.10.t:0 "A Crown Beneath Condemnation"
 omni_shannah_powers.10.desc:0 "The great doors have been thrown open, but the messengers waiting outside the #G Apostolic Palace#! have heard nothing resembling a blessing. Before the assembled clergy, the #T Shannah#! [SCOPE.sChar('omni_papal_shannah').GetName|Y] has pronounced judgment upon [SCOPE.sChar('omni_papal_target_ruler').GetName|Y] and the realm of [SCOPE.sCountry('omni_papal_target_country').GetName|T]. The sentence is #R excommunication#!. Copies bearing the authority of [SCOPE.sCountry('omni_papal_actor_country').GetName|T] are already being carried to the courts of the faithful.\n\nFor the condemned ruler, the trouble will scarcely end with an angry letter. Priests must explain the decree to their congregations, subjects must wonder where obedience leaves their souls, and foreign kings may discover that a quarrel they have nursed for years is now a sacred cause. A throne can command silence in its own hall; it is rather harder to command what people whisper after prayers."
 omni_shannah_powers.11.t:0 "The Sentence Withdrawn"
 omni_shannah_powers.11.desc:0 "A second proclamation has followed the first, and this time the messengers have considerably better news for [SCOPE.sCountry('omni_papal_target_country').GetName|T]. The #T Shannah#! [SCOPE.sChar('omni_papal_shannah').GetName|Y], speaking with the authority of [SCOPE.sCountry('omni_papal_actor_country').GetName|T], has withdrawn the sentence against the country ruled by [SCOPE.sChar('omni_papal_target_ruler').GetName|Y]. The condemnation is to be set aside; the decree that troubled so many consciences is no longer in force.\n\nAt court, the pardon will doubtless be described as the natural outcome of a most reasonable dispute. Elsewhere, priests will find gentler words for their next sermons, and rulers who were considering a conveniently righteous war must seek another justification. There are wounds a letter cannot close, but the palace has at least stopped pressing its seal into them."
 omni_shannah_powers.12.t:0 "A Letter of Sacred Favor"
 omni_shannah_powers.12.desc:0 "There is good news for [SCOPE.sChar('omni_papal_target_ruler').GetName|Y], and it will surely be repeated in every place where a priest can find an audience. The #T Shannah#! [SCOPE.sChar('omni_papal_shannah').GetName|Y] has sent an #T Apostolic Blessing#! from [SCOPE.sCountry('omni_papal_actor_country').GetName|T] to [SCOPE.sCountry('omni_papal_target_country').GetName|T], commending the realm to the favor of #T Hellas#!. A court that receives such a letter generally discovers an urgent need to have it read aloud more than once.\n\nThe clergy are preparing their observances with renewed confidence, and the ruler's supporters are already discussing what this recognition says about their sovereign's devotion. Those less impressed by the court may still take comfort in the ceremonies. It is agreeable, after all, to be told that the heavens have remembered one's country kindly."
 omni_shannah_powers.13.t:0 "Heaven and the Crown"
 omni_shannah_powers.13.desc:0 "A crown can be inherited, seized, or disputed for generations; a favorable word from the #T Shannah#! is another matter entirely. Today, [SCOPE.sChar('omni_papal_shannah').GetName|Y] of [SCOPE.sCountry('omni_papal_actor_country').GetName|T] has formally recognized the crown of [SCOPE.sChar('omni_papal_target_ruler').GetName|Y], sovereign of [SCOPE.sCountry('omni_papal_target_country').GetName|T]. The proclamation leaves little room for doubt about which claimant the palace considers worthy of obedience.\n\nSupporters of the monarch have greeted the news with the satisfaction of people whose opinion has just acquired divine approval. Any rivals will have to explain why the head of the #T Helluvian#! faith has come to a different conclusion. The recognized court, meanwhile, has every reason to remember who supplied so useful a letter."
 omni_shannah_powers.14.t:0 "The Weight of Forgiveness"
 omni_shannah_powers.14.desc:0 "The envoys of [SCOPE.sCountry('omni_papal_target_country').GetName|T] have received the answer for which they came. The #T Shannah#! [SCOPE.sChar('omni_papal_shannah').GetName|Y] of [SCOPE.sCountry('omni_papal_actor_country').GetName|T] has granted #T absolution#! to the realm of [SCOPE.sChar('omni_papal_target_ruler').GetName|Y], and the pardon is now being announced among the faithful. Whatever accounts of the country's conduct reached the palace, its ruler may now point to a rather distinguished authority willing to speak of forgiveness.\n\nThose who have suffered at the country's hands may find this difficult to appreciate. A proclamation does little for a trampled field, and the dispossessed are seldom impressed by the eloquence of the victorious. Yet among the faithful, a public pardon carries weight; accusations that once passed unchallenged may now meet the reply that the matter has been heard before the Shannah."
 omni_shannah_powers.15.t:0 "Provisions for the Faithful"
 omni_shannah_powers.15.desc:0 "The clergy bound for [SCOPE.sCountry('omni_papal_target_country').GetName|T] have at last secured their provisions, their letters, and enough beasts to carry the baggage. Their journey has the backing of the #T Shannah#! [SCOPE.sChar('omni_papal_shannah').GetName|Y] of [SCOPE.sCountry('omni_papal_actor_country').GetName|T], who has endowed a #T Holy Mission#! to work in the lands ruled by [SCOPE.sChar('omni_papal_target_ruler').GetName|Y]. The faithful have much to say about the importance of the undertaking; the quartermaster would prefer to know when everyone intends to depart.\n\nSoon there will be unfamiliar voices preaching the word of #T Hellas#! in village squares and market streets. Some listeners will be curious, others suspicious, and a good many occupied with the business of earning supper. The missionaries have been given the means to remain long enough to make their case. What becomes of their sermons will depend upon more than the generosity of the palace."
 omni_shannah_powers.12.a:0 "May Hellas look kindly upon them."
 omni_shannah_powers.15.a:0 "May their sermons travel as far as their provisions."
 omni_shannah_powers.10.a:0 "A heavy sentence for any crown to bear."
 omni_shannah_powers.14.a:0 "Some will find forgiveness easier than others."
 omni_shannah_powers.11.a:0 "Let the letter be read before the faithful."
 omni_shannah_powers.13.a:0 "The crown has found a powerful friend."
 omni_shannah_powers.10.effects_tt:0 "Other existing landed #T Helluvian#! countries receive #R -50 opinion#! of the condemned realm, whose state-religion pops suffer #R -10% happiness#!. Independent Helluvian countries in communion may declare a #T War of Penance#! against it while it remains Helluvian and excommunicated. The sentence survives succession until the Shannah lifts it."
 omni_shannah_powers.11.effects_tt:0 "The #R excommunication#! sentence, its historical opinion penalties, and the #R -10% state-religion happiness#! penalty are removed. Further #T Wars of Penance#! against the country are no longer authorized. Armies already at war must still make their peace in the usual fashion."
 omni_shannah_powers.12.effects_tt:0 "The blessed realm gains #G +5% omen power#! for #Y five years#!. A renewed blessing refreshes this duration without stacking the bonus."
 omni_shannah_powers.13.effects_tt:0 "The monarchy receives #G +10 legitimacy#! and mutual #G +25 opinion#! with all existing landed #T Helluvian#! countries until the current ruler dies. Recognition costs the Shannah #Y 25 political influence#! and cannot be granted to this monarch again."
 omni_shannah_powers.14.effects_tt:0 "The recipient loses #G 10 aggressive expansion#! and cannot receive another absolution for #Y ten years#!. The Shannah has spent #Y 25 political influence#!. This pardon concerns worldly transgressions; it does not lift a sentence of excommunication."
 omni_shannah_powers.15.effects_tt:0 "The host country gains #G +25% pop conversion speed#! for #Y five years#! through ordinary conversion. The Shannah has supplied #Y 50 gold#! and spent #Y 25 political influence#!; this mission does not instantly convert the population."
