l_english:
 omni_shannah_foreign.1.t:0 "A Palace in Search of a Prophet"
 omni_shannah_foreign.1.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the inventory of our newest possession has taken a rather unexpected turn. The officers sent to inspect the #G Apostolic Palace#! at #G Ddu-Nuinop#! have returned with the usual accounts of chambers, storehouses, and things the previous occupants would very much like returned. They have also brought a delegation of #T Helluvian#! clergy, who insist that the most valuable thing in the building cannot be carried off in a cart.\n\nIt is, apparently, authority. The #T Shannah#! may bless distant kingdoms, acknowledge a disputed crown, or pronounce a sentence that makes a sovereign's own subjects fear for their souls. When the will of #T Hellas#! demands an #T Omostthanat#!, rulers across the faithful world are invited to provide the swords and purses. We already possess the palace from which these instructions are issued. According to our visitors, there remains only the small matter of believing the correct things.\n\nThe proposition has caused considerable interest among our advisers. One has asked whether a sincere conversion might conveniently be arranged before the next embassy arrives. Another has observed that our old priests, our household, and rather a large number of our subjects may have their own opinions about exchanging the faith of our ancestors for a particularly useful chair. The clergy wait politely for an answer. They have been careful to mention the chair's importance more than once."
 omni_shannah_foreign.1.a:0 "Perhaps Hellas has brought us here for a reason."
 omni_shannah_foreign.1.a.tt:0 "Our state and current ruler convert to the #T Helluvian#! faith, and we immediately claim the #T Shahanat#! through the existing office-transfer rules. Our capital moves to #G Ddu-Nuinop#!, our government becomes a Shahanat, and our ruler gains the #T Shannah#! trait. Other incumbents are displaced. Our first-ever claim grants #G 50 legitimacy#! and #G 100 political influence#!; previous holders receive no repeat reward.\n\nThe abrupt religious reversal costs #R 25 stability#!. Our population and other characters do not convert automatically. As Shannah, we gain access to blessings, crown recognition, absolution, holy missions, excommunication, and the #T Omostthanat#!, subject to their normal requirements."
 omni_shannah_foreign.1.b:0 "We conquered a palace, not a new conscience."
 omni_shannah_foreign.1.b.tt:0 "Keep our ruler's faith, state religion, government, and capital. Public loyalty to our traditions grants #G 5 stability#! and #G +5% omen power#! for #Y five years#!. We do not claim the #T Shahanat#! or receive its first-claim rewards and religious powers.\n\nThis offer will not repeat for our country, even after succession or reconquest. We may still convert voluntarily and use the normal claim decision later if we meet its requirements."
 omni_shannah_ancestral_devotion:0 "Faith of Our Forebears"
 desc_omni_shannah_ancestral_devotion:0 "Our ruler refused to exchange ancestral worship for the authority of the Apostolic Palace. The priests celebrate this public declaration of devotion."
