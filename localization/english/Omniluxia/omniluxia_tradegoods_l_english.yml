l_english:

 coffee: "Coffee"
 coffeeDESC: "The beans of the coffee plant are ground and roasted, and when mixed with hot water, create a stimulating and refreshing beverage that is said to banish sleep and restore energy."
 ivory: "Ivory"
 ivoryDESC: "Made from the tusks of rare creatures like the Polarian Bear and the Hostile Walrus, ivory is sought after by master craftsmen who use the material to beautify their tradegoods."
 liquor: "Liquor"
 liquorDESC: "When the Silver Dwarves discovered the secret to distillation, it did not take them long to figure out how to make liquor, and now intoxicating spirits can be found all across Omniluxia."
 meat: "Meat"
 meatDESC: "While some peoples, like the Wood Elves, try not to overindulge in meat, it remains a staple of the Omniluxian diet."
 opium: "Opium"
 opiumDESC: "Opium, named the 'Soul-Drinker' for its ability to dim one's light, is a narcotic that is used by most Omniluxians very infrequently, although some poor people have become addicted to the intoxicating plant."
 porcelain: "Porcelain"
 porcelainDESC: "The dense, pale clay that is found near marshlands can be used to craft porcelain, a tradegood that was prevalent during the height of the Zani Empire and is synonymous with luxury and elegance."
 saffron: "Saffron"
 saffronDESC: "The delicate fragrance of saffron is used by Omniluxians to flavor both savory and sweet dishes."
 tea: "Tea"
 teaDESC: "The three main varieties of tea harvested - green, black or blue - each have their own medicinal properties and are used by almost every culture in Omniluxia. "
 tobacco: "Tobacco"
 tobaccoDESC: "When leaves of the tobacco plant are dried and cured, they can then be smoked in pipes, and many dwarven city streets are clouded with the stench of pipe-weed."
 whales: "Whales"
 whalesDESC: "The harvesting of whales throughout Omniluxia, although a dangerous endeavor, is an essential part of life for the northern people, who use whale-fat and blubber in their diets."
 cheese: "Cheese"
 cheeseDESC: "Whether it be crumbly and sour, like the Eptelonians prefer, or pressed into a hard wheel, Werhenlander-style, most Omniluxians love cheese and it features in every country's cuisine."
 hardwood: "Hardwood"
 hardwoodDESC: "One of the heartiest trees to grow in all of Omniluxia, hardwood is prized for constructing ships and weapons. A good piece of hardwood is stronger than steel."

 soulgems: "Soulgems"
 soulgemsDESC: "Soulgems are consumed in certain magical experiments and spells that Mages utilize, and are thus a cornerstone of every magical institution."
 elixir: "Elixirs"
 elixirDESC: "Magical concoctions simply known as 'elixirs', created only by specialists using soul gems, have been said to have a wide range of effects, most common being the rejuvenation of mana and energies of those that drink it."

 # INVICTUS

 cedar: "Cedar"
 cedarDESC: "Cedar is a fragrant wood that is valued for its durability and strength, used in the construction of the finest ships."
 myrrh: "Myrrh"
 myrrhDESC: "Myrrh, a fragrant gum resin that is found in deserts and badlands, is used to make perfumes and ointments that are fit for royalty."
 cinnabar: "Cinnabar"
 cinnabarDESC: "Cinnabar is a specialized, reddish mineral that is used in the manufacturing of jewelry and other precious, high-value trade goods. Its fiery color and rarity in the trade markets make it extremely valuable."
 lapis: "Lapis Lazuli"
 lapisDESC: "Found in only a few locations, lapis lazuli is a precious gemstone that is desired for its deep blue color. Its scarcity makes it all the more alluring."
 jade: "Jade"
 jadeDESC: "Hailing from lands far to the East, where rumors of its quasi-mystical powers are shared by merchants speaking in strange tongues, jade is a hard, greenish mineral with pale overtones and is highly sought after for its beauty and rarity."
 fruits: "Fruits"
 fruitsDESC: "A mouth-watering assortment of a wide variety of the freshest stone fruits and berries, apples and citruses, gathered from fragrant, well-tended groves."
 silphium: "Silphium"
 silphiumDESC: "Silphium is a wondrous plant with a variety of useful applications; whether ground into the special powders prescribed by physicians for a myriad of ailments, sprinkled and savored as a food seasoning for discerning gourmands, or simply ingested solely for its contraceptive properties, silphium is naturally scarce but overwhelmingly desired by many."
 sugar: "Sugar"
 sugarDESC: "A sweet substance refined from sugarcane grasses."

 #Terrain
 eldritch_forest: "Eldritch Forest"
 eldritch_forest_desc: "Eldritch Forests are home to many Fai, woodland creatures turned into monsters by the mana emitted by the #Y Yaga#! trees that dominate the landscape. The dangerous fauna and difficult terrain make them sparsely inhabited and hard to cross."
 cavern: "Caverns"
 cavern_desc: "Dangerous fauna and difficult supply lines make the vast caverns of #G Omniluxia#! difficult to traverse through. However many underground species such as the #T Dwarves#! and the #Y Goblins#! have learned to thrive in this environment."
 mushroom_forest: "Mushroom Forest"
 mushroom_forest_desc: "Homes to the elusive #Y Mycelar#!, the great Mushroom Forests that inhabit the former domains of #Y Na'athran#! are dark, unforgiving places where few foreign species thrive."

 #Decisions 

 rebuild_azar_ziggurat: "Rebuild the Great Ziggurat of Tiuban"
 rebuild_azar_ziggurat_desc: "Ages ago, the invading forces of the #T Zani Empire#! sacked and destroyed the capital of the #T Azar#! #T Golden Dwarves#!, and the ultimate humiliation was seeing the #T Great Ziggurat of Tiuban#!, #Y Etemenazari#!, the heart of their city, completely destroyed - not even the foundation remained once the #Y Zani#! were finished.\n\nIn a sign of the growing power of the #T Golden Dwarves#!, they have rebuilt the towering Ziggurat, proclaiming to the world that they are ascendent once again."
 great_ziggurat_of_azar_mod: "Great Ziggurat of Tiuban"
 great_ziggurat_of_azar_mod_desc: "In the heart of #G Tiuban#!, capital city of the #T Azar#! dwarves, the #T Great Ziggurat#! has been rebuilt by the rulers." 
 build_shrine_to_atheus: "Build a Shrine to Atheus"
 build_shrine_to_atheus_desc: "The southern #T Hortenic#! port city of #Y Ussonbrifhaerme#! was the first city that fell to the great #Y High Elven#! conqueror #T Atheus#!, and as such, remains a sacred place to those that honor the memory of the founder of multiple dynasties."
 shrine_of_atheus_mod: "Shrine to Atheus"
 shrine_of_atheus_mod_desc: "Here, in the city where the great #Y High Elven#! conquer #T Atheus#! first stepped foot onto the island of #G Horteon#!, an ornate shrine that contains his mortal remains has been built."
 build_snakesilk_workshop: "Build the Snakesilk Workshops"
 build_snakesilk_workshop_desc: "Our master craftsmen tell us that if we invest in building workshops in the province of #G Ugiasn#!, they will be able to produce a magnificent quality snakesilk that is exceptionally valuable."
 snakesilk_workshop_mod: "Snakesilk Workshop"
 snakesilk_workshop_mod_desc: "In this province, specialized craftsmen live in workshops and produce a type of exquisite silk that can only be found in this region."
 build_seeker_temple: "Build the First Seeker Temple"
 build_seeker_temple_desc: "It was in the province of Aberaber that the Way was first revealed, and thus, it must be the place where a grand #Y Seeker Temple#! is built. This magnificent structure, which is built to serve as a fortress as well as a temple, will protect Aberaber from those that might seek to destroy our knowledge."

 #Game Start Modifiers
 blue_marble_birth_palace_mod: "Blue Marble Palace of Durobaeraste"
 desc_blue_marble_birth_palace_mod: "In the #T Zani Empire#!, the luckiest children of the Emperors and Empresses were born in a luxurious palace built entirely of blue marble. The epithet 'Blueborn' is given to one fortunate enough to be sired in this ancient building."
 walls_of_muno_mod: "Walls of Muno"
 desc_walls_of_muno_mod: "The city of #G Muno#! suffered a devastating siege and sack at the hands of the #T Zani Empire#!, and, vowing to never suffer such an ignoble defeat again, erected massive fortifications to protect their rebuilt city."
 site_of_the_seeker_revelation_mod: "The Hill Ganara"
 desc_site_of_the_seeker_revelation_mod: "There is a hill outside of Aberaber, known as 'Ganara' in the local dialect, which is the place that #Y Cerwain the Hermit#! received the #Y Seeker#! #T Revelation#! of the Way."
 hobgoblin_conquest_stele_mod: "Kana'i Victory Stele"
 desc_hobgoblin_conquest_stele_mod: "Hundreds of years ago, feral #G Kana'i#! hordes from southern #G Morrigon#! raided as far north as the #G Borderlands#!, even sacking the city of Barramunatko before returning home. The #Y Goblin#! invaders stole many of the city's treasures and killed many of its residents. The #Y Nazani#! Emperors erected a stone stele in the center of town documenting the names of those slain by the #Y Goblins#! and the heroes who fought against overwhelming odds to stop them."
 walls_of_jelen_starting_mod: "Great Walls of Jelen"
 desc_walls_of_jelen_starting_mod: "In a time of dire need, the #G Great Celestial Deer Jelen#! erected the Walls named after her in order to protect the #Y Zechii#! locals."
 majestic_markets_mazos_mod: "Grand Port of Mazos"
 desc_majestic_markets_mazos_mod: "#T Mazos#!, the famous city in the #G Marenica Sea#! which has captivated the hearts of poets and writers for centuries, has a historic port district that is well-known throughout all #G Luxterra#!."
 lake_gater_holy_shrine_mod: "Lake Forest Temple"
 desc_lake_gater_holy_shrine_mod: "By the calm waters of #T Lake#! #G Gater#!, a small #T Aneic#! temple that is devoted to venerating the spirit of the forest stands near the Shrine of Cokysus."
 forum_of_gevanni_mod: "Forum of Gevanni"
 desc_forum_of_gevanni_mod: "#G Gevanni#! has long been home to dissident voices, and is a political counterbalance to conservative Dorbaherru. #G Gevanni#!'s forum has seen its fair share of public orations challenging the status quo over the years, and many of the aspiring Senators from this city practice their speeches in its squares."
 desc_forum_of_gevanni_mod: "#G Gevanni#! has long been home to dissident voices, and is a political counterbalance to conservative #G Durobaeraste#!. #G Gevanni#!'s forum has seen its fair share of public orations challenging the status quo over the years, and many of the aspiring Senators from this city practice their speeches in its squares."
 jarenam_first_starting_slave_market_mod: "Slave Market of Zemmairthia"
 desc_jarenam_first_starting_slave_market_mod: "The vast slave markets that have been built in the capital city of the #T Jarenam Empire#! defy belief, as the pens and cells underground have enough room for ten thousand inhabitants."
 droitrai_foreigner_district_mod: "Boblo District"
 desc_droitrai_foreigner_district_mod: "As the only city of note within the desolate #G Dragon Pass#!, #G Droishuilco#! sees its fair share of travelers and merchants, and the suspicious #Y Droishu#! have set aside a district of their capital for these foreigners, or 'Boblo', in their tongue."
 celtican_priestly_meeting_place_mod: "Meeting Place of the Celtican Priests"
 desc_celtican_priestly_meeting_place_mod: "Every twenty years, a conclave of #Y Celtican#! Priests gathers in humble #G Ginlean#! to offer sacrifices for the next generation."
 mercenaries_district_sum_khaya_start_mod: "Slums of Sum Khaya"
 desc_mercenaries_district_sum_khaya_start_mod: "The city of #G Sum Khaya#! has the great misfortune of being close to the island of #Y Arteon#!, and over the years, it has become a hotbed of activity for war refugees, sellswords and pirates. The slums on the outskirts of the city, close to the port, are notoriously dangerous."
 free_harbor_of_arsedr_mod: "Gateway of Arsedr"
 desc_free_harbor_of_arsedr_mod: "The island city of #G Arsedr#! is the port of call for those wishing to trade with the #Y Ular-Pria#! without the hassle of sailing through the snake-infested waters of the Archipelago. Over the years, #G Arsedr#! has become an important market, often referred to as the 'Gateway' to the lands beyond."
 usreva_starting_mod: "Skymarket of Usreva"
 desc_usreva_starting_mod: "The city of #G Usreva#! is famed for its open-air markets that are built on the ramparts that overlook the #G Herpolian Sea#!, giving one the impression that they are walking through the sky."
 ancient_canals_tiuban_mod: "Ancient Canals of Tiuban"
 desc_ancient_canals_tiuban_mod: "In days of old, the same #T Azar#! dwarves that built the #T Great Ziggurat#! constructed massive canals throughout the city, hoping to bring water down from the mountains."
 birthplace_of_tadm_start_mod: "Birthplace of Tadm of Yewubdar"
 desc_birthplace_of_tadm_start_mod: "Before he went to study in #G Gevanni#!, the local genius and future author Tadm was raised in #G Yewubdar#!, and the humble cottage that served as his home still stands on the outskirts of town. Over the years, it has become a place of pilgrimage for those that honor the scientist."
 monument_to_battle_of_khillighkorsword_mod: "Monument to the Battle of Khillighkorsword"
 desc_monument_to_battle_of_khillighkorsword_mod: "Hundreds of years ago, the local #G Celticans#! defeated a large field army of the #T Zani Empire#! in these hills, and their bold actions stopped the #Y Zani#! from expanding westward. There is a small monument in this province to commemorate the historic event."
 gamzudaon_startup_mod: "Stone Gates of Gamzudaon"
 desc_Gamzudaon_startup_mod: "#G Gamzudaon#!, once the capital of #Y Zanic#! #Y Vetalia#!, has impressive stone gates that discourage locals from attacking the walls."
 branrhyl_worlds_end_port_mod: "The World's End Port"
 desc_branrhyl_worlds_end_port_mod: "The Zanazi-#Y Vetalia#! city of #G Linupom#!, on the western coasts of #G Morrigon#!, is one of the most distant harbors in all of #G Omniluxia#!. It is colloquially known as the World's End #T Port#!, for nothing lies to the west."
 zanis_victory_stele_startup_mod: "Shrine to Zanis the Wanderer"
 desc_zanis_victory_stele_startup_mod: "Before he forged the Empire that would bear his name, the ambitious young general #T Zanis#! traveled across #G Morrigon#! in search of wisdom. The farthest he traveled was this province, #G Rhylpennewgo#!, before being summoned back to #G Gevanni#!. A small shrine in this region commemorates his visit."
 worlds_lungs_nirmegos_shrine_mod: "Shrine of the Seeds"
 desc_worlds_lungs_nirmegos_shrine_mod: "One of the holiest #T Aneic#! sites within #G Morrigon#!, the province of #G Nirmegos#! has a shrine that was built to hold seeds from the World's Lungs Forests. They are protected there by special #T Aneic#! Priests known as Seedwatchers."
 ruins_of_apmld_startup_mod: "Ruins of Apmld"
 desc_ruins_of_apmld_startup_mod: "The ancient capital of the #Y Ular-Pria Imperium#!, #G Apmld#! was completely destroyed during the #Y Great Collapse#!. The island is covered with collapsing ruins, sunken temples and the half-buried foundations of many buildings."
 silver_caves_mod: "Silver Caves"
 desc_silver_caves_mod: "Birthplace of the mythical #G Hthgart#! and #Y Ferja#!, the sacred #Y Silver Caves#! are where deified ancestors of the #Y Silver Dwarves#! are buried, and is considered the holiest place in the #Y Silver Dwarven#! world. The caves themselves are filled with Silver and Platinum, and nobody has been able to fully map them out due to their vast size, with many speculating that they reach to the center of the planet."
 gold_caves_mod: "Gold Caves"
 desc_gold_caves_mod: "Birthplace of the opulant #Y Summsîr#! and Ava, the sacred Gold Caves are where deified ancestors of the #Y Gold Dwarves#! are buried, and used to be considered the holiest place in the #Y Gold Dwarven#! world, only surpassed by the #T Great Ziggurat#!. The caves themselves are filled with a seemingly unlimited supply of Gold, and nobody has been able to fully map them out due to their vast size, with many speculating that they reach to the center of the planet."
 copper_caves_mod: "Copper Caves"
 desc_copper_caves_mod: "Birthplace of the cunning #Y Frei#! and #Y Dwadais#!, the sacred Copper Caves are where deified ancestors of the Copper #T Dwarves#! are buried, and is a major pilgrimage site for Copper #T Dwarves#!. The caves themselves are filled with a copper and tin, and used to supply early Copper #Y Dwarven#! merchants with large amounts of bronze. While the caves stretch on for miles, it is believed that they have been nearly mapped out entirely, with a scarce few speculating that there are tunnels that make the caves reach much deeper than previously believed."
 gnomish_hearth_mod: "Iaawu Hearth"
 desc_gnomish_hearth_mod: "The Iaawu Hearths are ancient magical fires created by #G Wielkopan#! himself inside a select few #Y Gnomish#! cities of the far north. Melting the surrounding glaciers and granting fertility to the surrounding lands, the Iaawu Hearths allow these arctic cities to thrive in their hostile environment."
 racgerrac_start_mod: "Rohanoan Walls of Racgerrac"
 desc_racgerrac_start_mod: "The inhabitants of #G Racgerrac#! have built extensively into the mountains that surround their capital city, incoporating them not only into their city walls, but also their residential and commercial districts."
 nalafu_start_mod: "Caverns of Var-Noqo"
 desc_nalafu_start_mod: "The crafty #Y Goblins#! of #T Nalafu#! have constructed their capital city deep underground within the caverns of the #G Var-Noqo#! valley."
 naathran_sea_elf_start_mod: "The Spring of Na'athran"
 desc_naathran_sea_elf_start_mod: "In the center of the island of #G Anror Ta-Oswir#!, there is a sacred spring of dark blue water that is dedicated to #Y Na'athran#!. Legends claim that these magical waters were left behind by #Y Na'athran#! himself as a reminder to the #Y Dori-sir#! of his ancient promise."
 ugone_temple_naoned_start_mod: "Grand Temple of Ugone"
 desc_ugone_temple_naoned_start_mod: "In the city the native Rohenoans called #G Naoned#!, the heart of the #Y Rohenoan#! Peninsula, is an enormous temple for Ugone, #Y God of Closed Doors#! and protector of the Patreic faithful."
 athens_city_mod: "The Academy City"
 desc_athens_city_mod: "The home of thinkers such as Yshanne and Aniope, the birthplace of philosophy is a city of nobles, academics, and even wizards, all enjoying the vaste and ancient collection of tomes that the city has to offer."
 sparta_city_mod: "The Fortress City"
 desc_sparta_city_mod: "The warlike #Y Anaktorians#!, with enemies on every border, built their capital like a fortress to ensure that nobody could strike at the heart of their nation."
 ruins_of_kunnstisha_startup_mod: "Ruins of Kunnstisha"
 desc_ruins_of_kunnstisha_startup_mod: "Centuries ago, the #Y Illorian#! kingdom of Ku-Kunnstis led the #Y Illorians#! to victory over the #T Razani#!, ushering in a hundred years of freedom for the #Y Illorians#! unseen since their conquest by #T Zanis#! the Great. Now all that remains of this once-great kingdom is the ruins of their capital, torn to pieces by the vengeful #T Razani#!."
 stone_of_wishtheon_mod: "Stone of Wishtheon"
 desc_stone_of_wishtheon_mod: "Local legend recounts that when #T Zanis#! conquered the peoples of the #G Ztuzu#! #G Desert#! he went to pray in a nearby cave. In this cave, #G Wishtheon#! spoke to him from a great stone, commanding him to go west until he reached the end of the world."
 dwarven_hold_mod: "Hold"
 desc_dwarven_hold_mod: "While most dwarven cities are often built into the nearby hills or mountains, the most complex and grandiose cities can be found deep in the caverns of #G Omniluxia#!, where dwarven architects have excavated beautiful stone complexes right inside of the mountain itself."
 yedidyhan_emergence_mod: "Yedidyhan's Hills"
 desc_yedidyhan_emergence_mod: "It is said that the #Y Vampire#! God #T Yedidyhan#! first emerged amongst these hills over three hundred years ago. While nobody has seen him for many decades, the surrounding nomadic tribes avoid these quiet hills for fear of encountering vampires hidden within."
 shrine_of_bachin_dui_pattar: "The Birthplace of Bachin"
 desc_shrine_of_bachin_dui_pattar: "Despite the efforts of the #T Helluvian#! authorities to discourage #T Zainudian#! pilgrims from visiting the birthplace of #G Bachin, Lord of Dui-Pattar#!, a humble cairn marks the place where the great #T Prophet#! first entered the world.\n\nEfforts to destroy the shrine are fruitless; if the stones are scattered, in the morning, they always reappear in the same place."
 opium_port_mod: "Opium Port"
 desc_opium_port_mod: "Five ports used to dominate the lucrative #G Orcish Sea#! trade, transporting goods between the various human and dwarven realms. However, as the Orcs began moving onto the mainland, they began to trade in #Y Opium#! imported from the mainland. These new '#Y Opium Ports#!' would soon dominate trade in the #G Orcish Sea#!, and the Orcs would soon conquer some of the existing major ports to expand their opium trade and influence much to the chagrin of their human and dwarven enemies."
 unkedak_mod: "Ruins of Old Unkedak"
 desc_unkedak_mod: "#T Unkedak#! is a truly ancient city with ruins believed to be built during the #T Dwarven Golden Age#!. The stories say that #T Unkedak#! held strong against the hordes of monsters that constantly hounded its walls, and was even saved from destruction by an ancient #T Baetepian#! hero. Alas, as its population dwindled and horse lords took over the steppes, #T Unkedak#! was razed, never to rise again to its former glory."

 jerusalem_mod: "The Holy City"
 desc_jerusalem_mod: "The city of #G Ddu-Nuinop#! is considered both by the #Y Helluvians#! and the #Y Zainudians#! as a holy city, as it is both where #G Helluvius#! was burned and close to the mountains where the prophets #G Bachin#! and #G Jaoz#! received their second revelation."
 bethlehem_mod: "Birthplace of Helluvius"
 desc_bethlehem_mod: "The once small town of #G Ka-Shorrnnurr#! was the birthplace of the prophet #G Helluvius#!. Each year it receives hundreds of pilgrims who will begin their pilgrimage to #G Ddu-Nuinop#!, retracing the steps of the great prophet."
 mecca_mod: "The City of Zain'ud"
 desc_mecca_mod: "After they were chased out of #Y Zaraken#! territory, the prophets #G Bachin#! and #G Jaoz#! arrived in the city described by #T Zain'ud#! in their Second #T Revelation#!, #T Makox#!. The pagan #Y Zinduidians#! welcomed them, citing a prophecy that two foreign prophets would bring the word of the true god and deliver their people from foreign domination. Clearing the #Y Zaindaxan#! of idols, the two prophets received the Third #T Revelation#! from #T Zain'ud#! himself."
 holy_mountains_mod: "Dartha Zainudian Communities"
 desc_holy_mountains_mod: "Up in the mountains near the birthplace of the prophet #G Jaoz the Bold#! lies various small communities of '#Y Old Believers#!' of #Y Zainudianism#! who were said to have descended from the first converts to follow #G Bachin, Lord of Dui-Pattar#!. Surrounded by #Y Helluvians#!, they exist in relative isolation on the hostile slopes of the mountains where #T Zain'ud#! first spoke to the prophet #G Bachin#!."

 #New World Flavor
 sovaelorrr_sunken_coils_mod: "The Sunken Coils of Sovaelorrr"
 desc_sovaelorrr_sunken_coils_mod: "Half-swallowed by the black swamp waters, the temple-coils of #G Sovaelorrr#! were raised by the earliest #Y Saurthi#! broods in honor of ancestors who are said to have shed their skins and slithered down into the deep to become gods. Pilgrims of the serpent-kind still wind their way through the flooded galleries, leaving eggs and offerings on the highest dry stone they can find."
 vethbrin_spawning_pools_mod: "The Spawning Pools of Vethbrin"
 desc_vethbrin_spawning_pools_mod: "The warm, mineral-rich pools outside #G Vethbrin#! have been tended by the #Y Saurthi#! since before memory, and broods hatched within their waters are considered blessed with unusual vigor. Clutch-wardens guard the pools jealously, and rival broods have gone to war over the right to lay their eggs there."
 vethaelhek_howling_cairn_mod: "The Howling Cairn of Vethaelhek"
 desc_vethaelhek_howling_cairn_mod: "A great cairn of frost-cracked stone stands over #G Vethaelhek#!, raised by the #Y Ulvenar#! to mark the place where the first pack-mother is said to have called down the moon itself. On cold nights, travelers swear they can still hear the howling carried on the wind, though no wolves are ever found."
 morbrin_cinder_wake_mod: "The Cinder Wake of Morbrin"
 desc_morbrin_cinder_wake_mod: "A long scar of blackened, glassy earth trails away from #G Morbrin#!, the remnant of some ancient conflagration that the locals refuse to speak of by name. Ash-nomads passing through still barter cautiously along its edge, wary of disturbing whatever burned it into being."
 brinorr_skywatch_stones_mod: "The Skywatch Stones of Brinorr"
 desc_brinorr_skywatch_stones_mod: "Atop the windswept heights above #G Brinorr#!, a ring of standing stones has been aligned since ancient days to track the passage of the stars. Scholars from across the New World make the long climb to study the sky through the gaps between the pillars, hoping to glimpse whatever secrets the ancients once read there."
 ulkrukru_drowned_bazaar_mod: "The Drowned Bazaar of Ulkrukru"
 desc_ulkrukru_drowned_bazaar_mod: "At low tide, the crumbling stalls of a much older market emerge from the shallows outside #G Ulkrukru#!, and it is said the ancestors once traded there before the sea reclaimed the shorefront. Merchants of #G Ulkrukru#! still time their finest deals to the tides, considering it good luck to haggle atop the drowned stones."
 morxiln_ashen_barrows_mod: "The Ashen Barrows of Morxiln"
 desc_morxiln_ashen_barrows_mod: "Row upon row of low grey mounds surround #G Morxiln#!, each one raised over the ashes of a #Y Tsaalan#! chieftain and their household. The barrows are considered sacrosanct even among warring clans, and to loot them is thought to invite the restless dead to follow the thief home."
 luthith_shining_grove_mod: "The Shining Grove of Luthith"
 desc_luthith_shining_grove_mod: "A stand of pale, faintly luminous fungal trees grows undisturbed outside #G Luthith#!, tended for generations by those who believe the grove to be a living memory of the world before the New World was severed from it. Scholars and mystics alike are drawn to study beneath its soft, ever-present glow."


