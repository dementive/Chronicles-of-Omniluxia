l_english:
 revant_modifier:0 "Revant"
 revant_country_modifier:0 "Revant"

 revant_heritage:0 "Revant Heritage"
 revant_heritage_desc:0 "A race of wraith-like people that bring darkness and destruction everywhere they go. Having recently emerged from the legendary chasm that was once thought to be entirely dormant and utterly uninhabitable, left at the heart of the world by the Great Collapse, these people loyally follow their leader 'The Revant' to their death. Although some who have met them on the battlefield say that death is not something that wraiths experience, and they simply rise again if they are struck down in battle..."

 bloodsworn_heritage:0 "Bloodsworn Heritage"
 bloodsworn_heritage_desc:0 "The Bloodsworn are a small band of Helluvian knights led by the Blood Angel A-Rezu dedicated to freeing the Geallian people from the wrath of the Revant's army of demonic souls."

 revant.3.t: "Arrival of The Revant"
 revant.3.desc: "A dark cloud has appeared over the #E Dissolved Lands#! that were considered by many to be entirely devoid of any life and impossible to live on due to the catastrophic effects of the #E Great Collapse#!.\n\nBy all accounts, the legendary chasm at the heart of the world seems to be bleeding darkness, and the skies above the island are choked by swirling clouds of unlight. Tales told by sailors passing through the area speak of endless hordes of wraith-like people who appear as nothing more than darkness to any unlucky enough to be close enough to see them. As word spreads throughout Omniluxia of the unfolding disaster, ancient tomes have been consulted all across the libraries and academies as sages and seers attempt to understand what is happening.\n\nPre-Collapse histories speak of a legendary hero known to his people as #E 'The Revant'#! who spent his life fighting against the dark forces of magic, and later joined his country against the invading Zani. Defending the Northern capital on the fateful day of the Great Collapse, he, alongside with his loyal army, were cast into the chasm that formed when the world was nearly split in two.\n\nBut rumors say that the Revant did not die that day, and that when the light has left the world, he would arise from the deep darkness and wreak havoc on the people of Omniluxia. Most do not believe these fables, but it seems that the day of reckoning has come...The Revant has arrived and all we can do now is hope that our people can avoid the marauding hordes of darkness that have risen from the void."
 revant.3.a: "The end is near!"
 revant.3.b: "I pledge myself to thee, #E King of Shadows#!"

 revant.7.t: "The Fall of Durobaeste"
 revant.7.desc: "Despair, o #E [ROOT.GetCountry.GetRuler.GetFirstName]#!!\n\nWord has come to us from the thousands fleeing #E Eagelia#!! The cultural heart of the #E Geallians#!, the ancestral capital of the great #E Zani Empire#!, and the birthplace of #E Zanis Zani#! himself lays in ruins! The undead army of the vile #E Revant#! marches across the former empire, razing all remnants of #E Zanic#! civilization still left after the devastating #E Razani Civil War#!! Nigh unkillable, his spectral armies take no prisoners, and leave nothing but death and destruction in their wake.\n\nWe must prepare our armies quickly! For if the great #E Shadow Lord#! can topple the heirs of one of the greatest empires in the history of #E Omniluxia#!, our current forces are no match for his demonic strength!"
 revant.7.a: "So far have the Geallians fallen..."

 revant.9.t: "Rise of the Bloodsworn"
 revant.9.desc: "News from the far reaches of the heartlands of the former #E Zani Empire#!!\n\nReports have come in regailing tales about a small band of knights fighting back against the demons that infest the lands of the descendents of #E Zanis Zani#!! Most of these stories call them the #E Bloodsworn#!, as they have sworn a blood oath to their commander, who has earned the nickname #E Blood Angel#! due to her unique curse. These knights have dedicated themselves to ridding the world of #E Wraiths#! in the name of their god, #E Hellas#!, and are said to enjoy widespread popularity amongst the #E Geallian#! people.\n\nThe stories say that the #E Blood Angel#! has superhuman strength and agility unseen since perhaps the time before #E Zanis Zani#! himself, and that she has effortlessly slain thousands of malicious spirits across #E Nalia#!! Whether these stories are just a fantasy or embellishment is yet to be seen, but in these trying times it is good to have heroes to place our hopes in."
 revant.9.a: "There may be hope after all"
 revant.9.b: "I must join her noble cause!"

 revant.10.t: "Duel of the Fates"
 revant.10.desc: "It was on the final day of the siege that the two heroes met in the ruins of the ancient throne room of a long dead empire.\n\nSounds of battle could be heard outside as the two armies ferociously fought for control over what was left of the ancient capital. Men screamed, spirits wailed, centuries-old walls collapsed, but none of these sounds seemed to reach the ears of the two foes. Each stared intensely at the other, hoping to find a weakness they could exploit. However, their observations only ascertained each others' strength.\n\n#E A-Rezu#! made the first move, her vicious charge emblematic of her offensive style of fighting. Although the #E Revant#! blocked the blow, the force behind it reverberated through the spectre's body and shattered the ornate tiles that once decorated the sacred hall of the Zani. Pushing back the #E Blood Angel#!, the #E Revant's#! translucent blade swiftly arcs towards #E A-Rezu's#! neck, a killing blow only narrowly dodged by the agile angel. Regaining her composure, the deadly heroine once again charges forward, and the two trade blows.\n\nThe legendary fight has gone on for more than hour now, with neither warrior able to get the upper hand on the other. The #E Revant's#! undead abilities have saved him from a permanent death countless times, however his blade is unable to match #E A-Rezu's#! superhuman agility and intuition. Both are tired, the #E Blood Angel#! from pushing her curse's power to it's limits and the #E Lord of Shadows#! from absorbing so many powerful blows. Any outside combatants unlucky enough to find themselves in the great hall are nearly instantaneously killed by one of the two, regardless of whether they are friend or foe.\n\nKnowing his opponent is at her limits, the #E Revant#! aims to cripple the #E Blood Angel#! by delivering several smaller blows. Invoking #E Melodias'#! power, he divides his shadowy saber into eighteen blades that fly towards the exhausted #E A-Rezu#!.\n\nUnknowingly, the invincible #E Lord of Shadows#! had made a fatal error.\n\nThe #E Blood Angel#! steels her resolve and charges through the blades, ignoring the lacerations from those that do not break against her unstoppable charge. The #E Revant#! stumbles backwards, and for the first time since his emergence the spectre's unreadable face seems to display an emotion that resembles fear. #E A-Rezu's#! blade pierces through the wraith's magical armor, and the fight ends.\n\nEye to eye, the spirit speaks,\n\n'#R Did you not fear death, child?#!'\n\n#E A-Rezu#! stares at the #E Revant's#! face, stunned. For a moment she is sure she can see confusion behind the spirit's helm. She coughs up blood, breaking her trance, and responds,\n\n'#G Do you?#!'\n\nFading, the #E Revant#! seems to contemplate the #E Blood Angel's#! question.\n\n'#R Death cannot take what I have already lost.#!'\n\n#E A-Rezu#! stares at the #E Revant#!. His face seems to contort into something that resembles remorse.\n\n'#G What I stand to lose, death cannot take from me.#!'\n\nThe spirit nods. As his essence departs this plane, he leaves this world with his final words,\n\n'#Y Udme, mano brangioji, mano sviesa...#!'\n\nDays later, the old throne room is filled with #E Geallians#! that have arrived from all corners of the empire to deliver flowers to their savior. Images of her patron god now spread across the empire like the petals scattered across her cadaver. The demons are gone, and the #E Blood Angel#! expelled them."
 revant.10.a: "Your sacrifice will not be forgotten"

 revant.11.t: "Death of the Revant"
 revant.11.desc: "Hopeful news from the land of the #E Geallians#!!\n\nIt seems that the young heroine known to many as the #E Blood Angel#! has defeated the #E Revant#!! Although this news comes to us through rumors, it appears that many of the events attributed to the #E Revant's#! influence have not been reported for many weeks!\n\nIf this so-called #E Blood Angel#! truly did kill the #E Lord of Shadows#!, her victory may well be celebrated across all of Omnuluxia!"
 revant.11.a: "Praise be to the #E Blood Angel#!!"

 revant_tooltip.3: "#Y We will join #E The Revant#!#!"
 revant_tooltip.9: "#Y We will join #E the Bloodsworn#! in their mission to retake [GetProvince('(int32)2478').GetName]!#!"


 zorg_country_modifier: "Zorg"
 ZRG: "Zorg"
 ZRGADJ: "Zorgian"
 new_world_region: "The New World"

 zorg.2.t: "The Zorg"
 zorg.2.desc: "Word has come from the far off province of [zorg_landing_site.GetNameWithNoTooltip|E] of the crash landing of a strange triangular prism-shaped flying object that has descended from the skies of Omniluxia. There are even many citizens in [SCOPE.GetRootScope.GetCountry.GetNameWithNoTooltip] who have reported seeing the object flying by over head; some say it was miles across and could be seen passing for several minutes, even though it was falling through the sky at an extreme speed. The object seems to have been entirely destroyed on impact with the ground, but most horrifying is what seems to have emerged from the fallen object...alien beings, clearly not from this planet.\n\nThose who were unlucky enough to be there at the first encounter claim that they called themselves #E 'Zorg'#!. The Zorg are unlike anything Omniluxia has ever seen; they have a strange red hue to their skin, wide penetrating eyes, and somehow every member of their species seems to have precisely the same genetics, with no variation in their population whatsoever. Their strange appearance, and the fact that they are all the same, has led many to question if they are even living beings at all or if they are...something else.\n\nOnly time will tell what intentions the Zorg have and why they have arrived in Omniluxia...although it does not seem good, as they have taken over the province of [zorg_landing_site.GetArea.GetNameWithNoTooltip] in the short time after they crash landed. Some in the area have even reported seeing their friends and family become one of the Zorg when they came into contact - everything about their old selves was immediately erased and they adopted precisely the same attributes of the rest of the species...\n\nLet us hope that these are merely outlandish tales and nothing more, for if the Zorg we have been told about were to arrive on the borders of [SCOPE.GetRootScope.GetCountry.GetNameWithNoTooltip], there seems to be little we could do but hope they come in peace."
 zorg.2.a: "This must be the end of days!"

 deepgnome_1_title: "Rumblings from the Caves"
 deepgnome_1_desc: "While occasional raids from the #E #R Deep Gnomes#!#! living in the caverns of the #E #R Deep Rift Valley#!#! aren't uncommon, we have recieved recent reports of larger and larger hordes raiding neighboring villages for long periods of time. Some have even reported #E #R Deep Gnome#!#! establishing settlements outside of the caves, a phenomenon that should be impossible.\n\nThe #E #R Deep Gnomes#!#! are destructive and savage people, but they are traditionally divided between dozens of tribes and clans, and it was believed that they would forever be unable to unite their people. Furthermore, their curse means that they cannot be exposed to sunlight, lest their skin burn until there is nothing left of them but ash.\n\nHowever, these concerning reports indicate that there is a possibility that someone or something has managed to unite them all under one banner, and that their curse has somehow been broken. The implications of this alone are terrifying, and it is best to prepare for the inevitable invasion coming soon!"
 deepgnome_1.a: "Run!"
 deepgnome_1_tooltip.a: "#R The #E Deep Gnomes#! have united and will descend upon the civilized people of #E Eastern Luxterra#!#!"
 

 me_omnispecial_4.a: "Who cares about some brutes in far off mountains?"
 me_omnispecial_4_tooltip: "#G The Rulers of the #E Green Valley#! will fight until one unifies them all!#!"


