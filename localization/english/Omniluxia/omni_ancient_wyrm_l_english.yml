l_english:
 omni_wyrm_take_flight: "Take Flight"
 omni_wyrm_take_flight_desc: "#Y Sarthovar#! spreads his wings over #G Urzhaketh#! and takes the field with up to #Y 4,000 strength#!. His surviving cohorts slowly mend in territory you control, but never beyond #Y 4,000#!. Use #Y Return Home#! to land at the capital. Raising levies from the Military screen also calls him to the field when he is ready.\n\n#R If his flight is wiped out, Sarthovar dies.#!"
 omni_wyrm_take_flight_tt: "Deploy #Y Sarthovar#! at the capital. The first flight begins at #Y 4,000 strength#!. After landing, he returns with his surviving strength.\n#R If every cohort is destroyed, Sarthovar dies.#!"
 omni_wyrm_flight_cooldown_tt: "The two-year flight cooldown must have expired."
 omni_wyrm_not_deployed_tt: "Sarthovar must be off the field."
 omni_wyrm_capital_control_tt: "The realm must control its capital."
 omni_wyrm_return_home: "Return Home"
 omni_wyrm_return_home_desc: "Bring #Y Sarthovar#! back to the capital to roost above the mines. Every surviving cohort must be at the capital, stationary and out of combat. Landing preserves his surviving strength and begins a two-year cooldown before the next flight."
 omni_wyrm_return_home_tt: "Land at the capital and preserve Sarthovar's surviving strength. Take Flight becomes available again in #Y two years#!."
 omni_wyrm_landing_location_tt: "All of Sarthovar's surviving cohorts must be stationary at the capital, out of combat, and unexiled."
 omni_wyrm_landing_cooldown_tt: "At least #Y 90 days#! must have passed since takeoff."
 omni_wyrm_slow_recovery: "Scales of the Silver Wyrm"
 desc_omni_wyrm_slow_recovery: "Sarthovar's wounds close slowly. Surviving cohorts regain up to #Y 1%#! of their strength each month in territory the realm controls, outside battle, never beyond full strength."
 omni_wyrm_army_name: "Sarthovar"
