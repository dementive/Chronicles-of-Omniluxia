l_english:
 alarm_clock_inv:0 "Gnomish Alarm Clocks"
 alarm_clock_inv_desc:0 "Gnomish alarm clocks use a turning wheel to release a bell at a set hour. A night watch can change shifts even when clouds hide the stars."
 wooden_construction_iapyges_inv:0 "Celtican Timber Framing"
 wooden_construction_iapyges_inv_desc:0 "Celtican timber framing uses joints cut and fitted before the posts go up. Carpenters can prepare a frame under cover and raise it as soon as the ground dries."
 coins_inv:0 "Coins"
 coins_inv_desc:0 "Coins struck to a standard weight let traders count payments in place of weighing each lump of metal. Market keepers retain sample pieces against which unfamiliar issues can be tested."
 taulantia_mead_honey_inv:0 "Honey Mead"
 taulantia_mead_honey_inv_desc:0 "Mead is made by fermenting honey diluted with water. Brewers keep honey from different flowering seasons apart, since each batch carries something of the plants the bees fed on."
 lacemaking_inv:0 "Lacemaking"
 lacemaking_inv_desc:0 "Lace is worked by crossing fine threads into patterns that hold without a woven backing. A sample pinned above the bench lets apprentices reproduce the same border."
 iberian_capital_inv:0 "Vetalian Column Capitals"
 iberian_capital_inv_desc:0 "Vetalian column capitals broaden the top of a stone shaft to carry the beam above it. Carvers keep a finished model so a later crew can replace a damaged capital."
 thracian_mercs_inv:0 "Rohenoan Mercenary Companies"
 thracian_mercs_inv_desc:0 "Rohenoan mercenary companies hire out as formed units under their own captains. A pay roll lets their employer see who has been mustered and which riders are still owed a mount."
 illyrian_fishing_nets_inv:0 "Fishing Nets"
 illyrian_fishing_nets_inv_desc:0 "Fishing nets woven around a standard gauge have openings of a consistent size. The same gauge lets any crew repair a torn panel without drawing the neighboring meshes out of shape."
 monoxyla_canoe_inv:0 "Dugout Canoes"
 monoxyla_canoe_inv_desc:0 "A dugout canoe is hollowed from a single trunk. Its shallow hull can pass through water where a larger boat would ground, and the crew can carry it around broken stretches of river."
 camarae_craft_inv:0 "Light Coastal Craft"
 camarae_craft_inv_desc:0 "Light coastal craft are built to land on beaches and pull up beyond the tide. A fishing village can keep them in service without maintaining a deep harbor."
 numidian_script_inv:0 "Upper Baetepian Script"
 numidian_script_inv_desc:0 "Upper Baetepian scribes use a shared set of letters for names and accounts. Orders sent downriver can be copied without losing the forms that distinguish one household from another."
 shaduf_inv:0 "Shaduf"
 shaduf_inv_desc:0 "A shaduf lifts water with a bucket hung from a counterweighted pole. One worker can fill a channel above the riverbank while another clears the intake."
 seeder_plough_inv:0 "Seeder Plough"
 seeder_plough_inv_desc:0 "The seeder plough drops seed through a tube into the furrow as it is opened. Seed is laid at a more even depth, and sowing can keep pace with the plough team."
 thracian_metalworking_inv:0 "Morrigon Metalworking"
 thracian_metalworking_inv_desc:0 "Morrigon smiths sort their ore before smelting and grade the resulting iron by how well it takes an edge. The strongest stock goes into tools and weapons that will be repaired many times."
 bones_of_antaeus_inv:0 "Relics of Upper Baetep"
 bones_of_antaeus_inv_desc:0 "Upper Baetepian sanctuaries keep relics attributed to their earliest protectors. Offerings left beside them help maintain shrines that serve households from several settlements."
 nilometer_inv:0 "Tetepen Flood Gauge"
 nilometer_inv_desc:0 "The Tetepen flood gauge is a graduated stone set into the riverbank. Keepers send the highest reading downriver so villages can judge which fields the flood reached and which will still need watering."
 mass_produced_bricks_inv:0 "Mass-Produced Bricks"
 mass_produced_bricks_inv_desc:0 "Bricks made in standard molds can be dried in large batches and laid in regular courses. Another yard can supply replacements when a wall needs repair."
 horse_mill_inv:0 "Horse Mill"
 horse_mill_inv_desc:0 "A horse mill uses a team walking in a circle to turn the millstone. With teams working in shifts, a mill can keep grinding when several villages bring in their grain together."
 basin_irrigation_inv:0 "Basin Irrigation"
 basin_irrigation_inv_desc:0 "Basin irrigation uses low banks to hold floodwater on a field until it soaks into the soil. Villages on the Tetepen agree when each cut will open so the upper basins leave enough water for those below."
 textile_mill_inv:0 "Textile Mill"
 textile_mill_inv_desc:0 "Textile mills bring several looms under one roof and use common measures for their cloth. Weavers working different shifts can finish bolts to the same width and length."
 gum_trade_inv:0 "Gum Trade"
 gum_trade_inv_desc:0 "Dried plant gums are traded as binders for inks and other workshop preparations. Collectors sort the resin at the market, where a clear grade free of bark and sand fetches more."
 gentian_royal_coinage_inv:0 "Aralan Royal Coinage"
 gentian_royal_coinage_inv_desc:0 "Aralan royal coinage gives the frontier paymasters pieces of a recognized weight and stamp. Troops paid at one post can spend the same issue in the next market town."
 cistern_inv:0 "Cistern"
 cistern_inv_desc:0 "A cistern collects rainwater in a lined chamber, often beneath a courtyard. A ward with a well-sealed cistern can draw water far into the dry months."
 phoenician_colonies_inv:0 "Phanician Merchant Colonies"
 phoenician_colonies_inv_desc:0 "Phanician merchants maintained colonies under Zani rule. Renewing their old charters gives families sailing out today known terms for land, harbor dues, and trade with the home ports."
 canals_and_levees_inv:0 "Canals and Levees"
 canals_and_levees_inv_desc:0 "Canals bring river water to the fields, and levees keep the flood out of houses and stores. Villages along the Tetepen clear the shared drains before the river rises."
 myrrh_trade_inv:0 "Myrrh Trade"
 myrrh_trade_inv_desc:0 "Myrrh is a fragrant resin sold for incense and oils. Caravans carry the best grades in sealed jars and open a sample at market so the whole load need not be exposed."
 ivory_trade_inv:0 "Ivory Trade"
 ivory_trade_inv_desc:0 "River merchants buy ivory by weight at the landings and seal it before shipment. Written tallies allow buyers farther downriver to check a consignment against what was paid."
 tyrian_purple_inv:0 "Phanician Purple"
 tyrian_purple_inv_desc:0 "Phanician dyers make purple in vats kept working from one season to the next. Merchants from overseas still order the color by name, even where the local workshops have passed out of use."
 pepper_trade_inv:0 "Pepper Trade"
 pepper_trade_inv_desc:0 "Dried pepper keeps well enough to travel between distant ports. Buyers agree on a grade from a sample before the sealed cargo goes aboard."
 silent_trade_inv:0 "Silent Trade"
 silent_trade_inv_desc:0 "Silent trade allows parties without a common language to barter by setting their goods and offers down in turn. Each side can inspect what is offered before accepting it."
 cinnamon_trade_inv:0 "Cinnamon Trade"
 cinnamon_trade_inv_desc:0 "Cinnamon reaches the ports as dried lengths of fragrant bark. Buyers shave the end of each bundle to judge whether its scent survived the voyage."
 pannonian_mining_inv:0 "Kankolmie Ironworking"
 pannonian_mining_inv_desc:0 "Kankolmie ironworking combines knowledge of the seams at Swordsordnua with the sorting and smelting of local ore. Brigantian overseers depend on miners who know which workings will hold through winter."
 brass_coinage_inv:0 "Brass Coinage"
 brass_coinage_inv_desc:0 "Brass coinage gives moneyers an alloy suited to small denominations. When the mix and weight are consistent, shopkeepers can give change without weighing every piece."
 door_locks_inv:0 "Door Locks"
 door_locks_inv_desc:0 "A keyed lock limits access to a storehouse to those entrusted with a key. The keeper and the night watch can count the stock together before responsibility passes from one to the other."
 polyspaston_inv:0 "Compound Pulley Cranes"
 polyspaston_inv_desc:0 "A compound pulley crane spreads the weight of a load across several lengths of rope. A small crew can raise a lintel while others guide it into its bed."
 iberian_ceramics_inv:0 "Vetalian Ceramics"
 iberian_ceramics_inv_desc:0 "Vetalian potters use common profiles for jars, bowls, and lids. A household can replace one part of a vessel without commissioning another from the same maker."
 tartessian_script_inv:0 "Vetalian Inscribed Tablets"
 tartessian_script_inv_desc:0 "Vetalian clerks inscribe accounts and agreements on durable tablets. The witnesses can hear a record read while it is made and refer to it after the original parties are gone."
 mastic_gum_inv:0 "Mastic Gum"
 mastic_gum_inv_desc:0 "Mastic gum is the hardened resin collected from trees grown on the islands. Pickers let it set before sorting it, since clean pieces hold their price on the mainland."
 hillock_inv:0 "Hillock"
 hillock_inv_desc:0 "A hillock gives a village a raised site for a palisade and watch post. From the crest a small watch can see traffic on both approaches to a valley."
 kariz_inv:0 "Kyaxaran Underground Canals"
 kariz_inv_desc:0 "Kyaxaran underground canals carry water downhill through tunnels linked by vertical shafts. Water reaches fields across dry ground, and crews can clear the channel through the shafts."
 imperial_diaspora_inv:0 "Imperial Diaspora"
 imperial_diaspora_inv_desc:0 "Descendants of old Zaraken imperial households still live in towns beyond the crown's rule. Their family ties give the court people it can approach for news, introductions, and terms of return."
 yakhchal_inv:0 "Kyaxaran Ice Houses"
 yakhchal_inv_desc:0 "Kyaxaran ice houses store winter ice in deep chambers protected from summer heat. A keeper can draw from the lower store without uncovering the entire supply."
 sacred_band_inv:0 "Phanician Temple Guard"
 sacred_band_inv_desc:0 "The Phanician Temple Guard is a standing force maintained from the harbor's temple revenues. The crews sailing out know who will hold the landing in their absence."
 backgammon_inv:0 "Backgammon"
 backgammon_inv_desc:0 "Backgammon is a race between sets of counters moved by throws of the dice. Travelers can bring the game to a new inn, where a written set of rules settles disputes over play."
 karduchian_longbow_inv:0 "Highland Longbows"
 karduchian_longbow_inv_desc:0 "Highland longbows use long, seasoned staves that bend over much of their length. Bowyers match the draw to the archer so practice on the range carries over to service on the ridge."
 iron_club_inv:0 "Iron Clubs"
 iron_club_inv_desc:0 "An iron head adds weight to a club and can be fitted to a replacement handle. A company can put damaged weapons back into service with work done at a camp forge."
 boulder_assaults_inv:0 "Boulder Assaults"
 boulder_assaults_inv_desc:0 "Highland defenses store loose stones above approaches that pass close to the works. The watch can defend a steep path from above, though it has to know when villagers are still on the road."
 khanjali_inv:0 "Arteonian Highland Daggers"
 khanjali_inv_desc:0 "Arteonian highland daggers are short sidearms balanced for close fighting. Smiths mark the tang so a guard can find the maker if the hilt needs refitting."
 sibyna_inv:0 "Morrigon Throwing Spears"
 sibyna_inv_desc:0 "Morrigon throwing spears are light enough for infantry to carry in bundles. Companies distribute them separately from the longer spears used to hold a line."
 corinth_helmet_inv:0 "Aralan Full-Faced Helmets"
 corinth_helmet_inv_desc:0 "Aralan full-faced helmets shield the nose and cheeks along with the crown. Armorers fit each one closely so it stays in place when the wearer braces a shield."
 rhomphaia_inv:0 "Rohenoan Long Blades"
 rhomphaia_inv_desc:0 "Rohenoan long blades have grips that allow the wielder to use both hands. The companies drill with wider spacing where each soldier needs room to bring the blade around."
 slavemaster_inv:0 "Slave Masters"
 slavemaster_inv_desc:0 "Estate overseers use rolls to assign enslaved workers to tasks and record what each crew produces. Owners can demand more from an estate, and the workers spend more of the day under direct watch."
 cured_ham_inv:0 "Cured Ham"
 cured_ham_inv_desc:0 "Salting and drying ham preserve meat after the slaughter season. A household that puts by a portion for winter can draw from it when fresh meat is scarce."
 toxic_honey_inv:0 "Toxic Honey"
 toxic_honey_inv_desc:0 "Honey gathered from certain upland plants can make a traveler ill. Local guides recognize the suspect combs and warn soldiers who would otherwise take them for provisions."
 draco_inv:0 "Dragkhanic Windsock Standards"
 draco_inv_desc:0 "The Dragkhanic windsock standard is a cloth tube that fills as the mounted column moves. Riders separated on the march can recognize the sign and return to their company."
 club_inv:0 "Club"
 club_inv_desc:0 "A club is a stout wooden weapon that local craftsmen can make and replace cheaply. Recruits can train with the same equipment they will carry on the march."
 akinakes_inv:0 "Skyreach Short Blades"
 akinakes_inv_desc:0 "Skyreach riders wear a short blade at the hip where it clears the saddle. They can draw it while keeping their other hand on the reins."
 pelte_shield_inv:0 "Rohenoan Light Shields"
 pelte_shield_inv_desc:0 "The Rohenoan light shield has a wicker or wood core covered in hide. Its weight lets skirmishers carry it through brush and broken ground without losing much speed."
 tribulus_inv:0 "Zani Field Caltrops"
 tribulus_inv_desc:0 "Zani engineers scatter iron caltrops to slow horses across a selected approach. The company records where they were laid so its own riders have a clear route back."
 dogs_of_war_inv:0 "Dogs of War"
 dogs_of_war_inv_desc:0 "Trained dogs accompany sentries and help detect people approaching out of sight. Handlers walk the boundary first so the night watch can tell an alarm from the usual sounds of the camp."
 iberian_cavalry_inv:0 "Vetalian Horsemen"
 iberian_cavalry_inv_desc:0 "Vetalian breeders select horses that stay steady in crowded formations, and mounted households draw their remounts from the same stock. A company can take fresh horses into service with less time spent retraining them."
 falconry_inv:0 "Falconry"
 falconry_inv_desc:0 "Falconers train a bird of prey to hunt and return to a known call and glove. The keeper starts with young birds and brings each into the courtyard separately."
 illyrian_helmet_inv:0 "Morrigon Open-Faced Helmets"
 illyrian_helmet_inv_desc:0 "Morrigon open-faced helmets protect the head while leaving a soldier's hearing and side vision clear. A company can still hear orders when it turns under pressure."
 bitless_bridle_inv:0 "Bitless Bridle"
 bitless_bridle_inv_desc:0 "A bitless bridle guides a horse through pressure around the nose and jaw. Riders train a mount to turn from those signals before taking it out at speed."
 werewolves_inv:0 "Werewolves"
 werewolves_inv_desc:0 "Morrigon tales of people taking wolf form have shaped the customs of the woodland watch. Sentries patrol in pairs where a lone report of movement would be hard to confirm."
 postal_service_inv:0 "Kyaxaran Relay Posts"
 postal_service_inv_desc:0 "Kyaxaran relay posts keep fresh riders and mounts on the roads from the court. A keeper records when a sealed letter arrived, and the next rider takes it on while the first rests."
 decimal_command_inv:0 "Decimal Command"
 decimal_command_inv_desc:0 "Decimal command organizes mounted troops in groups of ten under named officers. At muster a captain can tell which units are short and which households owe the missing riders."
 khatru_inv:0 "Court Board Games"
 khatru_inv_desc:0 "Court board games give visitors a shared pastime while they wait for an audience. People who rarely meet on equal terms can learn one another's habits over a game."
 crossbow_inv:0 "Crossbow"
 crossbow_inv_desc:0 "A crossbow holds a drawn bowstring on a stock until the trigger releases it. Recruits can aim with the tension already held by the lock."
 battering_ram_inv:0 "Battering Ram"
 battering_ram_inv_desc:0 "A battering ram brings the weight of a beam against a gate under a supporting frame. Carpenters test its fittings before the march so the crew can repair them in the field."
 chalcidian_helmet_inv:0 "Aralan Cheek-Guard Helmets"
 chalcidian_helmet_inv_desc:0 "Aralan cheek-guard helmets use hinged plates to protect the sides of the face in battle. On the march the wearer can open them without taking the helmet apart."
 phrygian_helmet_inv:0 "Arteonian Crested Helmets"
 phrygian_helmet_inv_desc:0 "The high crest on an Arteonian helmet identifies its wearer from a distance. Armorers keep the lining and straps simple enough for a campaign repair."
 scythian_helmet_inv:0 "Skyreach Horsemen's Helmets"
 scythian_helmet_inv_desc:0 "Skyreach horsemen wear close-fitting helmets that stay in place when they turn in the saddle. A rider can look back during a chase without steadying his helmet by hand."
 syrian_elephants_inv:0 "Tetepen Elephant Corps"
 syrian_elephants_inv_desc:0 "Tetepen elephant corps train beasts and their handlers as permanent teams. The crews learn which animals can stand beside formed infantry at the sound of the drums."
 kikkuli_inv:0 "Equestrian Training"
 kikkuli_inv_desc:0 "Regular changes of pace and rest prepare cavalry mounts for work over several days. Zaraken trainers associate this practice with the horsemanship Eszarakayn learned during his years among the Umbushmir."
 castella_inv:0 "Vetalian Hill Forts"
 castella_inv_desc:0 "Vetalian hill forts stand within sight of neighboring posts so a watch can pass an alarm by fire. Villages below know which refuge to prepare when a signal appears."
 bloomeries_inv:0 "Bloomeries"
 bloomeries_inv_desc:0 "A bloomery smelts iron ore into a spongy mass containing slag. Smiths work the bloom while it is hot, driving out impurities and consolidating the iron."
 royal_iron_monopoly_inv:0 "Royal Iron Monopoly"
 royal_iron_monopoly_inv_desc:0 "A royal iron monopoly puts the weighing and sale of ore under officers of the crown. The smiths receive measured shares, and the court can reserve stock for its own orders."
 helepolis_inv:0 "Imperial Siege Towers"
 helepolis_inv_desc:0 "A siege tower carries soldiers up to the height of a wall behind protective cladding. Engineers survey its approach before construction because a wheel sunk into soft ground can halt the whole tower."
 boetia_flamethrower_inv:0 "Projection Siege Engines"
 boetia_flamethrower_inv_desc:0 "Projection siege engines extend the reach of mages serving with a siege train. Their crews practice beside the infantry so the rest of the company knows when the approach is clear."
 lembus_inv:0 "Karuakua Warships"
 lembus_inv_desc:0 "The karuakua is an Ular-Pria warship rigged with the older crab-claw sail. Its maneuverability proved useful in the channels that opened after the Great Collapse."
 galaia_inv:0 "Ular-Pria Auxiliary Ships"
 galaia_inv_desc:0 "Ular-Pria fleets use auxiliary ships to carry provisions that warships have little room to stow. The datus developed this service from privateer crews that once supplied their allies from shore raids."
 archimedes_steam_cannon_inv:0 "Gnomish Steam Artillery"
 archimedes_steam_cannon_inv_desc:0 "Gnomish steam artillery uses the pressure of heated water to drive its shot. A trial aboard ship gives the engineers and deck crew a chance to judge whether the mount will hold."
 archimedes_death_ray_inv:0 "Gnomish Fortification Mirrors"
 archimedes_death_ray_inv_desc:0 "Gnomish fortification mirrors concentrate sunlight on the approaches to a landing. Their batteries make a direct attempt to seize a defended harbor harder for an enemy fleet."
 sewn_planks_inv:0 "Sewn-Plank Ships"
 sewn_planks_inv_desc:0 "Sewn-plank hulls join their boards with cordage passed through holes along the seams. Ular-Pria boat crews can carry the materials for repairs on routes where iron fittings are hard to find."
 cotton_trade_inv:0 "Cotton Trade"
 cotton_trade_inv_desc:0 "Phanician merchants buy cotton in bales weighed dry and entered separately in the harbor books. A factor can check the delivery before the cargo goes into the storehouse."
 monsoon_navigation_inv:0 "Monsoon Navigation"
 monsoon_navigation_inv_desc:0 "Monsoon navigation uses seasonal changes in prevailing winds to time long crossings. Pilots compare the dates of earlier passages before committing a ship to sail."
 beden_inv:0 "Shallow-Draft Rivercraft"
 beden_inv_desc:0 "Shallow-draft rivercraft spread the weight of cargo across a broad hull. They can unload at landings that shift with the river and have no deep berth."
 dhow_inv:0 "Austropetolian Sailing Craft"
 dhow_inv_desc:0 "Austropetolian sailing craft carry provisions for longer passages while remaining light enough to unload close to shore. They serve routes where one or more stops have no quay."
 sambuca_siege_inv:0 "Shipborne Siege Ladders"
 sambuca_siege_inv_desc:0 "A shipborne siege ladder lets the crew of a heavy galley reach a landing from its own deck. Fittings measured to the ship reduce the strain on the vessel during a port attack."
 serial_production_inv:0 "Serial Production"
 serial_production_inv_desc:0 "Phanician yards make matching parts from shared templates and fit them at separate slips. A plank spoiled in fitting can be replaced from stock before the tide changes."
 imperial_navy_inv:0 "Imperial Navy"
 imperial_navy_inv_desc:0 "An imperial navy brings crews, ships, and provisions under a common muster. Harbor officers send their rolls inland so the treasury can pay a fleet that is ready to sail together."
 cedar_planks_inv:0 "Cedar Planks"
 cedar_planks_inv_desc:0 "Cedar planks are seasoned under cover before fitting so they are less likely to shift once aboard. Phanician yards reserve the best timber for the ships that spend longest at sea."
 solar_calendar_inv:0 "Solar Calendar"
 solar_calendar_inv_desc:0 "A solar calendar divides the year by recurring changes in the sun's course. Temple observers publish dates for festivals before the villages disperse to work their fields."
 lezgiwal_inv:0 "Highland Codes of Honor"
 lezgiwal_inv_desc:0 "Highland codes of honor set out what a host owes a guest and who may give a pledge for a household. A visitor knows whose word he has received when he is offered a night's lodging."
 royal_blemmyan_signature_inv:0 "Upper Tetepen Royal Seals"
 royal_blemmyan_signature_inv_desc:0 "Upper Tetepen courts authenticate orders with the ruler's seal. Governors downriver can distinguish the confirmed copy from drafts or reports of what was said at court."
 sporting_theft_inv:0 "The Prize Chase"
 sporting_theft_inv_desc:0 "The Prize Chase is a contest in which villages try to carry off an agreed prize by a set time. The winners keep the prize and must make good any damage done along the way."
 periplus_inv:0 "Phanician Sailing Directions"
 periplus_inv_desc:0 "Phanician sailing directions record coastal landmarks, shoals, and places to take on water in the order a ship will pass them. A captain can follow a route without waiting for someone who has sailed it to return."
 eternal_pyramids_inv:0 "Eternal Pyramids"
 eternal_pyramids_inv_desc:0 "Pyramids are intended to preserve a burial place across generations. Their builders track stone deliveries and completed courses so the next crew can resume work after the river falls."
 hieroglyphs_inv:0 "Hieroglyphs"
 hieroglyphs_inv_desc:0 "Hieroglyphs use carved signs for sounds, words, and ideas. A monument can preserve a name and the record of the gifts or harvests set aside in its honor."
 compass_inv:0 "Compass"
 compass_inv_desc:0 "A compass uses a magnetized needle that settles in a consistent direction. Pilots can compare their heading with the marks on its case after the shore disappears."
 alphabet_inv:0 "Phanician Merchant Alphabet"
 alphabet_inv_desc:0 "The Phanician merchant alphabet represents speech with a small set of signs. Factors can teach apprentices enough letters to keep orders and verify a captain's tally in another port."
 cosmetics_inv:0 "Cosmetics"
 cosmetics_inv_desc:0 "Cosmetics are preparations applied to the skin for color, sheen, or scent. Makers test mixtures through the hot season so merchants can stock jars that will still be usable when opened."
 beer_inv:0 "Beer"
 beer_inv_desc:0 "Beer is brewed by fermenting an extract of grain. Keeping a little from an earlier batch helps start the next, and households can plan how much grain a feast will take."
 meroitic_script_inv:0 "Southern Tetepen Script"
 meroitic_script_inv_desc:0 "Southern Tetepen courts write local names and rulings in their own script. Petitioners can take home a copy that can be read without first finding an interpreter."
 hundred_four_inv:0 "Phanician Council of Auditors"
 hundred_four_inv_desc:0 "The Phanician Council of Auditors reviews what captains spent and took in abroad. Merchants can bring witnesses when the council reads out disputed expenses."
 mint_toothpaste_inv:0 "Mint Toothpaste"
 mint_toothpaste_inv_desc:0 "Dried mint can be ground with a mild abrasive to make a paste for cleaning teeth. Households keep the ingredients separately and mix a little when it is needed."
 ink_inv:0 "Ink"
 ink_inv_desc:0 "Ink suspends a pigment or dye in liquid so a clerk can write with a reed or brush. A dried mark remains legible after the letter has been folded and carried to the far post."
 sexagesimal_inv:0 "Sexagesimal"
 sexagesimal_inv_desc:0 "A sexagesimal reckoning divides a unit into sixty parts. Clerks can halve or divide the same measure by three without changing the fractions used on either side of a ledger."
 saqiya_inv:0 "Water-Lifting Wheels"
 saqiya_inv_desc:0 "A water-lifting wheel raises a succession of pots or buckets from the river into a channel above the bank. The crew can keep water flowing while they clear the far end of the ditch."
 musnad_script_inv:0 "Zainudian Monumental Script"
 musnad_script_inv_desc:0 "Zainudian stonecutters cut monumental letters deep enough to stay legible after years of blowing sand. The names of donors and witnesses can outlast those who remember the dedication."
 water_clock_inv:0 "Water Clock"
 water_clock_inv_desc:0 "A water clock measures time by the steady flow of water into or out of a marked vessel. At a hearing, both speakers can see how much of their time remains."
 cuneiform_inv:0 "Gold Dwarven Wedge Script"
 cuneiform_inv_desc:0 "Gold Dwarven wedge script is impressed into soft clay with the end of a stylus. Once dry, a tablet can identify a delivery long after its paper tally would have worn away."
 ukaz_poetry_fair_inv:0 "Oasis Poetry Fairs"
 ukaz_poetry_fair_inv_desc:0 "Oasis poetry fairs bring singers together at the wells where families already gather for market. Visitors hear verses from distant routes before the farthest caravans turn for home."
 cicones_blood_inv:0 "Songs of the Founding Lineages"
 cicones_blood_inv_desc:0 "Songs of the founding lineages preserve relationships that reach back before the great households divided. Elders can hear who stood for a line when an heir asks them to recognize a claim."
 cylinder_seals_inv:0 "Cylinder Seals"
 cylinder_seals_inv_desc:0 "A cylinder seal leaves a continuous impression when rolled over soft clay. Storekeepers use it to identify whose goods were shut inside and whose authority was needed to open them."
 qunnabu_inv:0 "Hemp Cultivation"
 qunnabu_inv_desc:0 "Hemp is grown for long fibers that can be worked into rope and cloth. Growers set aside seed from their strongest plants before the rope makers take the stems."
 achaemenid_legacy_inv:0 "Legacy of Eszarakayn"
 achaemenid_legacy_inv_desc:0 "Eszarakayn reclaimed Kyaxares with the aid of the Umbushmir riders. A restored Zaraken court can invoke the agreements that brought those riders into his service when it asks the districts to renew their obligations."
 antikythera_mechanism_inv:0 "Gnomish Orrery"
 antikythera_mechanism_inv_desc:0 "A Gnomish orrery uses linked gears to model the motion of lights in the sky. Turning its crank lets an observer compare a season's expected positions with the readings kept by the watch."
 perfume_inv:0 "Perfume"
 perfume_inv_desc:0 "Perfume carries the scent of flowers, resins, or herbs in an oil. A maker lets the mixture settle and draws off the clear layer, then compares samples after they have stood through the day."
 agathrysi_song_laws_inv:0 "Morrigon Song Laws"
 agathrysi_song_laws_inv_desc:0 "Morrigon song laws put judgments and obligations into verses that witnesses can repeat. A young speaker learns the changes in the lines before he is trusted to recite a judgment alone."
 albanian_administrative_language_inv:0 "Arteonian Chancery Language"
 albanian_administrative_language_inv_desc:0 "The Arteonian chancery writes orders and grants in a form its district clerks share. An official coming over the pass can read an order in the hand he learned at home."
 northwest_persian_administrative_language_inv:0 "Highland Court Registers"
 northwest_persian_administrative_language_inv_desc:0 "Highland court registers keep separate accounts of land grants, debts, and judgments. When the governor changes, a village can still show where its agreement was recorded."
 suani_blood_revenge_inv:0 "Blood Revenge"
 suani_blood_revenge_inv_desc:0 "Blood revenge makes a household answer for injuries done to one of its members. Elders call the families together to identify the people responsible before the quarrel spreads to their neighbors."
 kithara_inv:0 "Lyre"
 kithara_inv_desc:0 "A lyre stretches strings between a resonating body and a crossbar. Players tune it before a gathering so the instrument can accompany singing as people settle."
 phrygian_mode_inv:0 "Arteonian Mountain Modes"
 phrygian_mode_inv_desc:0 "Arteonian mountain modes set out the intervals used in songs shared among the valleys. A visiting party can recognize a familiar melody even where the local words differ."
 egyptian_makeup_inv:0 "Makeup"
 egyptian_makeup_inv_desc:0 "Baetepian face paints use dyes and minerals ground into mixtures that can be worn for a day. Makers along the Tetepen reserve suitable preparations for the stalls that supply festivals."
 nimrud_lens_inv:0 "Dwarven Ground Lenses"
 nimrud_lens_inv_desc:0 "A ground lens makes small details on a seal or inscription easier to see. Gold Dwarven grinders test their work against a clerk's finest marks before sending the lens out of the workshop."
 thracian_poetry_inv:0 "Rohenoan Verse"
 thracian_poetry_inv_desc:0 "Rohenoan verse preserves the names of settlements and the deeds people remember of them. Singers leave room to add the names of those still coming home from war."
 duduk_inv:0 "Arteonian Reed Pipes"
 duduk_inv_desc:0 "Arteonian reed pipes produce a sustained note from a softened reed fitted at the mouth of the instrument. Players can carry a tune from the gate to the square during a procession."
 police_baboon_inv:0 "Baboon Police"
 police_baboon_inv_desc:0 "Baetepian harbor watches use trained baboons to help spot people moving through a crowd. The keepers take along animals that will stay with them while they search the quay."
 martial_dancing_inv:0 "Martial Dancing"
 martial_dancing_inv_desc:0 "Martial dances rehearse turns and changes of place in time with a shared beat. Veterans teach the steps before handing out shields, when recruits can still see who should stand beside them."
 egyptian_mints_inv:0 "Baetepian Mints"
 egyptian_mints_inv_desc:0 "Baetepian mints strike coin to a published weight and keep a sample from each issue. A merchant can challenge a payment against the piece retained by the mint."
 tablet_maps_inv:0 "Survey Tablets of Kr'ou"
 tablet_maps_inv_desc:0 "The Kinone surveyor began by measuring the road out of Kr'ou after two wardens charged for the same bridge. His survey tablets give travelers distances they can verify themselves."
 royal_gift_exchance_inv:0 "Royal Gift Exchange"
 royal_gift_exchance_inv_desc:0 "Royal gift exchange uses household gifts to renew obligations between courts. Stewards record who carried each gift so the next messenger knows what courtesy is due."
 ritual_suicide_inv:0 "Last Oaths of the Retinue"
 ritual_suicide_inv_desc:0 "The final oath of a mounted retinue renews its obligations after the death of the person it served. At the burial, each member names one duty he will carry forward."
 imperial_aramaic_inv:0 "Esquelian Chancery Language"
 imperial_aramaic_inv_desc:0 "Esquelian clerks and interpreters served Zani officials in lands where several languages were spoken. A common chancery language let them record local terms alongside a version the court could enforce."
 achaemenid_administration_inv:0 "Regional Governorships"
 achaemenid_administration_inv_desc:0 "Regional governorships give a local officer authority to collect levies and hear business for the crown. Keeping records at both court and district lets a successor see what households already paid."
 polycentric_administration_inv:0 "Poly-centric Administration"
 polycentric_administration_inv_desc:0 "A government with several administrative centers leaves ordinary judgments to courts near the people affected. Each court keeps its own records and sends the capital copies when a decision crosses district lines."
 pahlavi_script_inv:0 "Kyaxaran Chancery Script"
 pahlavi_script_inv_desc:0 "Kyaxaran clerks use a shared chancery hand for records that travel between districts. A copy can retain its original signature while being legible to readers trained elsewhere."
 court_procedures_inv:0 "Court Procedures"
 court_procedures_inv_desc:0 "Court procedures fix the order in which petitions are heard and how judgments are recorded. A visitor can find which officials heard a case even after the parties have left."
 paradisial_gardens_inv:0 "Paradisal Gardens"
 paradisial_gardens_inv_desc:0 "Court gardens use channels and shade trees to maintain planted grounds near the audience halls. Petitioners can wait beside the water while the usher works through the day's names."
 astrology_inv:0 "Astrology"
 astrology_inv_desc:0 "Astrology interprets recurring movements in the sky through records kept over many seasons. Observers compare their own readings with those of earlier watches before advising the court."
 subterranean_dwellings_inv:0 "Subterranean Dwellings"
 subterranean_dwellings_inv_desc:0 "Subterranean dwellings use rock or earth as shelter from extremes of weather. Ventilation passages and floors sloped toward a drain make the rooms fit for year-round use."
 hittite_case_law_inv:0 "Highland Case Law"
 hittite_case_law_inv_desc:0 "Highland case law draws on written judgments from earlier disputes. A judge can consult the award made in a similar case before sending another household home with a ruling."
 sambuca_inv:0 "Upper Tetepen String Instruments"
 sambuca_inv_desc:0 "Upper Tetepen musicians make string instruments that can carry a voice across a gathering on the riverbank. Players assemble and tune them while the boats are still unloading."
 blemmyan_script_inv:0 "Upper Tetepen Court Script"
 blemmyan_script_inv_desc:0 "The Upper Tetepen court preserves a distinct script for orders and formal names. Clerks learn to read older records as well as the hand used for current business."
 apiculture_inv:0 "Apiculture"
 apiculture_inv_desc:0 "Apiculture keeps bees in managed hives for honey and wax. The keeper can move a hive to feed the colony through a different flowering season and warn nearby households before opening it."
 favomancy_inv:0 "Favomancy"
 favomancy_inv_desc:0 "Favomancy reads signs in the shape and openings of a honeycomb. Celtican families may save part of the last comb to have it examined when the harvest is in."
 scapulimancy_inv:0 "Scapulimancy"
 scapulimancy_inv_desc:0 "Scapulimancy interprets the marks that appear when a shoulder blade is heated. A Celtican keeper asks the household that brought the bone to stay and hear the reading together."
 advanced_ageing_inv:0 "Advanced Ageing"
 advanced_ageing_inv_desc:0 "Controlled ageing improves wine and other stores by holding batches under stable conditions. A cellar keeper dates each barrel and can tell which cask is ready without opening the rest."
 dalmatia_weapons_cult_inv:0 "Aralan Votive Arms"
 dalmatia_weapons_cult_inv_desc:0 "Aralan votive arms are weapons left at a shrine to commemorate service or fulfill a vow. The keeper records where a weapon was carried so visitors know what its owner came to remember."
 danubian_horsemen_inv:0 "Duny Horsemen"
 danubian_horsemen_inv_desc:0 "Duny cavalry relies on riders who bring spare mounts to muster. Kayarah and Darmerush companies can replace tired horses on a long journey and arrive with more of their riders ready to serve."
 dardanian_death_currency_inv:0 "Coins for the Dead"
 dardanian_death_currency_inv_desc:0 "Placing a coin with the dead is a funeral offering made from the household purse. Relatives see whose gift it was before the grave is closed."
 polygamy_inv:0 "Household Alliances"
 polygamy_inv_desc:0 "Household alliances set down obligations between family branches joined by marriage. Witnesses record who stands surety and who must meet each debt if a household head dies."
 cappadocian_calendar_inv:0 "Arteonian Seasonal Calendar"
 cappadocian_calendar_inv_desc:0 "The Arteonian seasonal calendar combines observations of the year with the usual arrival of snow and spring thaw. Towns at lower elevations time their couriers for when the passes are likely to reopen."
 mago_inv:0 "Phanician Books of Husbandry"
 mago_inv_desc:0 "Phanician books of husbandry compile advice on seed, orchards, soils, and the care of livestock. Factors keep copies on hand for settlers choosing what to buy before a voyage."
 temple_estates_inv:0 "Temple Estates"
 temple_estates_inv_desc:0 "Temple estates provide a shrine with regular income from land and rents. Keeping rolls of contributions lets tenants show what they paid and gives the priests an account of what they have to maintain."
 oasis_agriculture_inv:0 "Oasis Agriculture"
 oasis_agriculture_inv_desc:0 "Oasis agriculture grows crops in layers beneath shade trees irrigated from the same source. Water passing the trees can supply the lower beds, and the shade slows the drying of the soil."
 winemaking_inv:0 "Wine Making"
 winemaking_inv_desc:0 "Winemaking ferments pressed grape juice in vessels kept out of the heat. Growers bring fruit in as it ripens, so the early press can be in use while the higher slopes finish."
 cult_of_the_serpent_inv:0 "Cult of the Serpent"
 cult_of_the_serpent_inv_desc:0 "Old Mignadg remembers the four prophets whose sisterhood guided its rulers. The keepers name each sister when a household brings an offering, preserving the tradition in a form visitors can learn."
 threshing_board_inv:0 "Threshing Board"
 threshing_board_inv_desc:0 "A threshing board is a sledge set with hard stones and drawn over cut grain. Its weight separates the kernels from the heads, and the stones can be replaced as they wear."
 paphlagonian_rock_cut_tombs_inv:0 "Highland Rock-Cut Tombs"
 paphlagonian_rock_cut_tombs_inv_desc:0 "Highland rock-cut tombs provide a burial chamber in a hillside rather than in a freestanding building. A ledge at the entrance lets later visitors leave a lamp for those who come after them."
 paphlagonian_lion_guards_inv:0 "Carved Tomb Guardians"
 paphlagonian_lion_guards_inv_desc:0 "Stone guardians mark the entrances of highland tombs. Families can recognize the figures when the names on the lintels have worn away."
 paphlagonian_bithynian_tomb_cylinders_inv:0 "Carved Tomb Markers"
 paphlagonian_bithynian_tomb_cylinders_inv_desc:0 "Carved stone markers establish the entrance and limits of a burial plot. Set well apart, they let the bearers reach a grave without turning the bier."
 hair_braids_inv:0 "Hair Braiding"
 hair_braids_inv_desc:0 "Braiding binds the hair into sections that hold through travel and work. Families along the Tetepen use formal patterns for gatherings on the river, where relatives can recognize one another's work."
 tripartite_cellae_building_inv:0 "Three-Chambered Temples"
 tripartite_cellae_building_inv_desc:0 "A three-chambered temple divides its inner rooms between separate rites or offerings. Keepers can attend to each chamber without disturbing the service in the next one."
 incineration_inv:0 "Funerary Pyres"
 incineration_inv_desc:0 "A funerary pyre reduces the dead to ashes that a household can gather and keep. The family tends the fire beyond the houses and returns when the remains can be collected."
 ritual_tattooing_inv:0 "Ritual Tattooing"
 ritual_tattooing_inv_desc:0 "Ritual tattoos leave permanent marks of vows, service, or entry into a community. Someone returning after years away can meet people who still recognize what was promised."
 child_sacrifice_inv:0 "Vows of the Harbor"
 child_sacrifice_inv_desc:0 "Harbor vows are prayers and offerings made for the safe return of ships. Priests keep the names of the crews and households so a promise can be remembered when the vessel comes in."
 oasis_ammon_ra_inv:0 "Sanctuary of the Oasis"
 oasis_ammon_ra_inv_desc:0 "An oasis sanctuary keeps the well and its obligations under a guardian. Caravans can draw water and leave a contribution for the travelers still on the road."
 book_of_the_dead_inv:0 "Book of the Dead"
 book_of_the_dead_inv_desc:0 "Books of the dead preserve prayers and instructions intended to accompany a burial. Keepers copy the passages a family requests and leave space for the name to be spoken at the grave."
 carpets_inv:0 "Carpets"
 carpets_inv_desc:0 "Woven carpets use repeated patterns recorded by weavers for future orders. A second shop can finish a missing length when the court sends it the pattern and the proper measures."
 thracian_heroes_inv:0 "Rohenoan Hero Cults"
 thracian_heroes_inv_desc:0 "Rohenoan hero cults preserve the names of the dead through local rites and offerings. Villages keep their own lists, and visitors can see which families still tend each commemoration."
 burial_towers_inv:0 "Burial Towers"
 burial_towers_inv_desc:0 "Burial towers provide a durable family landmark after farms and houses change hands. Masons leave room to add later names beside those already carved."
 alexander_legacy_inv:0 "Legacy of Zanis the Great"
 alexander_legacy_inv_desc:0 "Zanis the Great founded the Zani Empire in 44 LC. Successor courts preserve his name in their public acts and appeal to the obligations of his old settlements when laying claim to imperial authority."
 pyramidal_tombs_inv:0 "Pyramidal Tombs"
 pyramidal_tombs_inv_desc:0 "Pyramidal tombs use broad lower courses to support a narrowing monument over the burial chamber. Their profile lets descendants find the grave long after the road has shifted."
 embalming_inv:0 "Embalming"
 embalming_inv_desc:0 "Embalming preserves the dead long enough for funeral arrangements and visits by family. In the riverlands it gives relatives coming from upriver time to arrive before burial."
 hindu_sati_inv:0 "Funeral Trusts"
 hindu_sati_inv_desc:0 "Funeral trusts reserve part of an estate to support named dependents after a death. Trustees take down the names before the property is divided, when witnesses can still confirm each obligation."
 dream_divination_inv:0 "Dream Divination"
 dream_divination_inv_desc:0 "Dream divination treats remembered dreams as a source of signs. A diviner takes each account separately so that the dreamer gives his own particulars before hearing the others."
 god_king_inv:0 "God King"
 god_king_inv_desc:0 "The rite of the God King gives the ruler sacred standing before witnesses from court and temple. The priests retain a copy of the promises made at the ceremony."
 kaaba_pilgrimage_inv:0 "Pilgrimage to Dui-Pattar"
 kaaba_pilgrimage_inv_desc:0 "Zainudian pilgrims visit the cairn at Dui-Pattar, where Bachin was born. Households along the route set out water as the first travelers approach the shrine."
 chandragupta_legacy_inv:0 "Legacy of Jarenam the Formidable"
 chandragupta_legacy_inv_desc:0 "Phanician elders date their independence from the death of Jarenam the Formidable. His successors remember the same reign for the districts it brought under one court and the obligations they would renew."
 omni_archimedes_death_ray_inv_tt:0 "Hostile fleets cannot capture our ports directly with the Capture Port ability."
 omni_sambuca_siege_inv_tt:0 "Heavy ships take less damage when using Capture Port."
 omni_cultural_inventions.1.t:0 "The Temple Accounts"
 omni_cultural_inventions.1.desc:0 "The temple keepers have brought their rolls. Two villages paid in grain last winter, and the clerk found both loads entered under the same name. The tenants are asking for a witness before the next carts go out, while the keepers would like the old storehouse repaired before any more grain is put inside."
 omni_cultural_inventions.1.a:0 "Pay to repair the storehouse."
 omni_cultural_inventions.1.b:0 "Send a clerk to hear the tenants."
 omni_temple_storehouse:0 "Temple Storehouse"
