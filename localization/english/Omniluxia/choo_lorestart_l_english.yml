l_english:

 lorestart.1.t: "The Legacy of Zanis"
 lorestart.1.desc: "The #E Eastern Empire of the Zani#! born from the #E #R Great Split of 690 LC#!#! following the chaos of the #R #E Great Collapse#!#!, the #E Razani#! led by the #E Razani#! wing of the #E Zani Family#! lay claim to the legacy of [GetCharacter('(int32)48').GetName], holding his imperial capital of [GetProvince('(int32)2478').GetName].\n\nRuling over the 'True Geallians' from the #E Unconquered City#!, the #E Razani#!'s influence has waned in the past few centuries, losing many former imperial provinces to revolts or invasions. The #E Helluvian Heresy#! in particular has taken its toll on the religious unity of the Empire, with once-loyal groups such as the #E Ytalians#! now questioning their loyalty to the Emperor.\n\nStill reeling from their near-destruction at the hands of #E Jarenam the Formidable Dragon#!, the #E Razani#! under the aging [GetCharacter('(int32)12').GetName] now face internal forces that threaten to tear apart their crumbling empire. Due to his lack of a clear heir, uneasy whispers permeate the walls of the #E Blue Marble Palace#!. While many in the palace assume the emperor's adopted son, [GetCharacter('(int32)137').GetName], will take the throne, there are a number of #E Gonessionem#! and cities that have quietly put their support behind the popular [GetCharacter('(int138').GetName], the #E Dragkhan-Slayer#!.\n\nOn top of internal issues, the Empire must now defend their vast territories from both nomadic invaders as well as the various kingdoms and empires on their borders without the support of the wealthy Baetep province, lost to the cowardly #E House of Sertem#! during the #E Invasions of Jarenam#!.\n\nWith civil war and external invasions seemingly imminent, can the aging ruler of the #E Razani#! find a solution that could save the Empire of the 'True Geallians'?" 
 lorestart.1.a: "The fate of Omniluxia is now in our hands."

 lorestart.2.t: "Rise of the Purple Pheonix"
 lorestart.2.desc: "The #E Western Empire of the Zani#!, one of the two states emerging from the #E #R Great Split of 690 LC#!#! which followed the #R #E Great Collapse#!#!, are led by the #E Weagelians#!, sons of #E Geallian#! invaders and the native peoples of #E Weagelia#!. The last three hundred years of relatively stable rule has given the leading #E House of Nazani#! a reputation as more than just a cadet branch of the #E Zani Family#!, as they are known among their people as the #E Emperors of the West#! first and foremost.\n\nHowever, this stability and growth did not come without any losses. First giving up the #E Borderlands#! to native rebels in 697 LC and then Kainaxarthos to the [GetCountry('SOV').GetName] in 795 LC, many assumed that their hold on their continent would slip to younger empires like their eastern counterpart. Recognizing this threat, Emperor [GetCharacter('(int32)18').GetName] decided to act following the decisive loss of the #E Marshlands#! after centuries of stubborn native resistance. Focusing inwards, the Emperor developed his cities and farmlands, stabilizing the realm while filling his ranks with able-bodied men. Watching the success of his endeavors, the cautious Emperor decided to expand the #E Nazani#!'s influence through more subtle means rather than make rash offensive decisions.\n\nSecretly supporting the developing #R #E Orcish colonies#!#!, the #E Nazani#! have strategically been destabilizing and weakening the #E Borderlander#! and #E Celtican#! tribes. Should the cautious Emperor decide to decisively strike, they are sure to reconquer the divided #E Borderlands#!.\n\nWith relatively few enemies who can match their strength and a stable state loyal to its Emperor. The only threat to the Emperor's power are a number of small heretical #E Helluvian#! communities spreading across his nation like a plague. Despite this, the #E Nazani#! are in an enviable position, poised to become one of the #E #G Great Powers#!#! of #E Omniluxia#!." 
 lorestart.2.a: "The fate of Omniluxia is now in our hands."

 lorestart.3.t: "The Sertemic Kingdom of Baetep"
 lorestart.3.desc: "The #E Sertemic#! [GetCountry('EGY').GetName] has only recently seen its freedom following the #E #R Conquests of Jarenam the Formidable Dragon#!#! and his subsequent death. Tying themselves to a legacy much older than even the #E Geallians#!, the ruling #E Sertem Family#! are actually descended from Zanicized #E Phanicians#!, who used their guile and cunning to be appointed governors of the Imperial province of #E Baetep#!.\n\nWith the crumbling [GetCountry('EGA').GetName] losing their hold over their Empire, the #E House of Sertem#! under #E Tzondunnan Sertem#! managed to seize control of the #E Baetep#! in order to 'secure' it against invading #E #R Jarenamid#!#! hordes, claiming the province as the core of his new kingdom once he realized he could gain more power than he could ever have under the weakened [GetCountry('EGA').GetName].\n\nRuling a stable and wealthy realm, the #E Sertemic Dynasty#! controls one of the strongest empires in #E Luxterra#!, and should they properly utilize its potential they could easily surpass or even conquer the ailing [GetCountry('EGA').GetName].\n\nHowever, while the #E Baetepians#! have grown used to #E Zanic#! rule, this small taste of freedom has lingered in their mouths. If the Pharon does not act to unify the people of the #E Baetep#! under their foreign rule and faith, they might face the consequences of letting this hunger for liberty grow, held strong by the various independent kingdoms of the south." 
 lorestart.3.a: "The fate of Omniluxia is now in our hands."

 lorestart.4.t: "The Dragkhanic Zani"
 lorestart.4.desc: "The Empire of #E Uttarasmake the Great#! started out as a group of Dragkhanic clans living under the shadow of the #E Celica Mountains#! centuries ago. Under the leadership of the #E Soveneria#! clan, hordes of dragkhanic horsemen took advantage of the #E #R Second Marshlander Revolt#!#! to invade the wealthy Nazani province of #E Kainaxarthos#!.\n\n The following #E #R Nazani-Sovenerian War#!#! saw the #R [GetCountry('WGA').GetName]#! retreat from southern #E Morrigon#! in 795 LC, allowing the victorious #E Soventeir Ulus#! to conquer most of their former territories. With no other rivals able to match their strength, the Sovenerians invaded the remaining dragkhanic clans, controlling most of southern Morrigon by 852 LC.\n\n In this environment, #E Uttarasmake the Great#! was declared #E Qhagan#! of Soveneria in 868 LC. Taught by #E Helluvian#! missionaries, the new Qhagan was a Zanophile who promoted the culture and traditions of the #E Geallian#! #E Kainaxari#! people in his borders. Seeking to further imitate the Zani, he declared himself #E Shanuzushanuz#! of the [GetCountry('SOV').GetName] in 874 LC, as well as formally converting to Helluvianism. Claiming to be the legitimate heir of the #E Zani Empire#!, he spent the remainder of his reign spreading Helluvianism to his dragkhanic subjects, morphing and replacing cruel dragkhanic traditions with Helluvian or #E Geallian#! ones, as well as crushing all threats to his power. This included defeating and selling the hostile #E #R Jazari#!#! tribes to the [GetCountry('EGA').GetName] in 870 LC.\n\nHowever, the centuries have not been kind to the great #E Empire of the Zanic Dragkhans#!, as the years of prosperity and stability have allowed for corruption and complacency to seep into Sovenerian society.\n\nSeeking to emulate the recent successes of his Nazani counterpart, the young [GetCharacter('(int32)16').GetName] was declared #E Shanuzushanuz#! of the [GetCountry('SOV').GetName] in 999 LC. With the new milennia comes a new beginning, and he has vowed to banish corrupt officials and bring the empire to new heights.\n\nHowever, with corrupt officials endorsing his brother [GetCharacter('(int32)123').GetName] for the throne, unrest growing amongst their more traditionally dragkhanic subjects, and rumors of a #E #R Hobgoblin#!#! horde growing in the north, the young emperor has much work to be done." 
 lorestart.4.a: "The fate of Omniluxia is now in our hands."

 lorestart.5.t: "The Hobgoblin Horde"
 lorestart.5.desc: "The #E #R Great [GetCountry('HOB').GetName] Horde#!#! was forged by blood through the conquests of the great Droishu warlord [GetCharacter('(int32)74').GetName] of the #E Zalthu Clan#!. Controlling all the #E Hobgoblins#! of the #E Dragon's Pass#! by 998 LC, the great chief left his realm to his eldest son, [GetCharacter('(int32)97').GetName], and the city of [GetProvince('(int32)4187').GetName] to his younger son [GetCharacter('(int32)95').GetName], before finally laying to rest in 999 LC.\n\nWhile the #E Hobgoblins#! are united in the face of foreign hostiliy, centuries of isolation and distance has led them to divide themselves into complicated polities led by clans and blood-ties. With loyalties changing on a whim, true unity seemed like a distant dream until [GetCharacter('(int32)74').GetName] led his clan to war against all others, rewarding those loyal to him based on merit rather than on clan affiliation.\n\nLeft with a realm of disparate tribes only recently united, the great [GetCharacter('(int32)97').GetName] will have to unite the #E Five Great Tribes#! and the #E Two Great Cities#! under one banner, and lead the many sons of #E Melodias#! against the hostile peoples that exist beyond the #E Dragon's Pass#!. \n\nThe #E Hobgoblins#!, rumored to be a twisted mixture of #E Elvish#! and #E Goblinic#! blood, are a warlike and unruly people not united since the ascendance of the #E Zalthu Clan#!. From the skilled horsemen of the #E Urhuk#! clans, to the #E Shoishoni#! mages of [GetProvince('(int32)4187').GetName], to the hardy mountain warriors of the #E Jishani#! and #E Ahualtzi#! peoples, their warbands are only matched by the organization and unity of more settled peoples. Should the #E Zalthu#! be able to utilize their full strength, they could easily create a force able to conquer all of #E Morrigon#!, and make a name for themselves in the history of #E Omniluxia#!!" 
 lorestart.5.a: "The fate of Omniluxia is now in our hands."

 lorestart.6.t: "The Zarakens of Kyaxares"
 lorestart.6.desc: "Following the fall of the #E Zakara Kephal#! and the #E Sacking of [GetProvince('(int32)4662').GetName]#! in 946 LC, the once-mighty #E Zarakens#! of the #E Eastern Foothills#! have been reduced to a mere imitation of their former empires. Now just a rump state restricted to their core territories, the few surviving members of the ancient #E House of Zakara#! are now left to rebuild their broken empire amidst the various hostile #E Zainudians#! and nomadic raiders.\n\nSeen as heretics by the divided #E Zinduidians#! for their friendly attitudes towards #E Helluvian#! merchants, the tolerant [GetCharacter('(int32)21').GetName] now looks north for expansion and opportunities.\n\nShould this great king reclaim his people's empire, many believe he may try to return the #E Zarakens#! to their roots, ridding them of the influence of the cursed prophets." 
 lorestart.6.a: "The fate of Omniluxia is now in our hands."

 lorestart.7.t: "The Cities of the Marenica Sea"
 lorestart.7.desc: "Having re-established their civilization after winning their freedom from the #R [GetCountry('EGA').GetName]#! in 912 LC, the various #E Illorian#! peoples of the #E Marenica Sea#! have only seen brief moments of independence ever since their conquest by the #E Zani#! following the various #E Zani-Illorian Wars#!. However, they are not the only people alongside these picturesque coasts, as various #E Halflings#!, #E Geallians#!, #E Werhenlanders#!, and even #E Phanicians#! have made their homes near the #E Great Green Sea#!.\n\nThroughout the centuries the #E Illorians#! have found themselves being pushed out of their homelands, first by the #E Geallian#! settlers and later by free #E Werhenlanders#!. In this environment, various ancient and new countries now vie for control of the lucrative #E Marenican Sea Trade#!.\n\nThe young [GetCountry('IT8').GetName] thrives from their large cities and famous #E Acropolis#!, their merchants only rivaled by the less opulent and more warlike [GetCountry('ITC').GetName].\n\nThe ancient cities of the #E Aollans#! are once again independent, with great #E Ioninna#! like [GetCountry('IP7').GetName], [GetCountry('IP6').GetName], [GetCountry('IP8').GetName] once again free. Their ancient knowledge and traditions dying out, they may be the last bastion of true #E Illorian#! traditions amongst a sea of foreigners.\n\nThe #E Shannah#! comfortably leads the #E Helluvian#! faith from his realm, the [GetCountry('IF3').GetName]. Hoping to turn his religious power into political power, the new #E Shannah#! hopes to spread #E Helluvianism#! and his influence to pagan lands outside of the range of the #E Marenican Sea#!. Meanwhile, the final communities of #E Old Believers#! remain at the fringes of the #E Illorian#! world, clinging on to the beliefs of their ancestors.\n\nWhile the #E Illorians#! squabble over their slice of the #E Marenican Sea#!, the incoming #E Werhenlanders#! under Kingdoms such as [GetCountry('PW3').GetName] and [GetCountry('PW0').GetName] seek to expand their influence through force. Having driven the northern #E Pollians#! to near extinction, their armies now march on the divided #E Ullydian#! states of #E Yr-Marrenica#!, threatening the heartlands of the #E Illorian#! peoples.\n\nMeanwhile, ignored by the major powers of the region, the small halfling county of [GetCountry('HF3').GetName] has big dreams for the unification of the various realms of #E South Intermarenica#!.\n\nWith empires and barbarians on all sides, the one who manages to control this beacon of the civilized world may be able to create an empire to rival the #E Zani#!!" 
 lorestart.7.a: "The fate of Omniluxia is now in our hands."

 lorestart.8.t: "The Zainudian World"
 lorestart.8.desc: "After the spectacular collapse of the unequal and cruel #E #R Zakara Kephal#!#! at the hands of the #E Great Zinduidian Revolt#! of 934 LC, the various #E Zainudian#! faithful have splintered into their original tribal groups that preceeded the mighty #E #G Zi'had Kephal#!#!.\n\nWhile the #E Zinduidian#! tribes squabble for amongst themselves, the emergent [GetCountry('KAF').GetName] and crumbling [GetCountry('JRE').GetName] pose a significant threat to the safety of the holy city of [GetProvince('(int32)4790').GetName]. Having recently overthrown foreign heretics, the #E Zinduidians#! are fiercly hostile to those who would seek to emulate the #E #R Zakaran Kalifs#!#!. However, there remains hope that a #E Zinduidian Kalif#! will one day unite the #E Zainudians#! under his rule, treating all equally and destroying the heretical #E #R Helluvians#!#!.\n\nWhile many look to the independent city of [GetCountry('ZTC').GetName] for guidance, a warlord by the name of [GetCharacter('(int32)49').GetName] has been expanding his realm with dreams of making his capital a city to rival [GetProvince('(int32)4790').GetName]'s splendor.\n\nTo the east lie the various #E Zarakens#! peoples. Much like their #E Zinduidian#! neighbors, they too were treated like second-class citizens under the rule of the empire of #E Daro Zakara#!. With the [GetCountry('ZAK').GetName] once again looking to expand their influence, many of these smaller states have banded together to preserve their indepedence.\n\nWhoever comes out victorious in this power struggle will have the responsibility of nurturing and spreading the #E Zainudian#! faith, as #E Zain'ud#! told the prophets:\n\n#R 'I am #E Zain'ud#! and my word is law, hear me now, this is my final message: Spread my word to the ends of this world, and tell the devoted to come and pray to me at this altar.#!' - The Second Revelation (Dacañan)" 
 lorestart.8.a: "The fate of Omniluxia is now in our hands."

 lorestart.9.t: "The Gold Dwarves"
 lorestart.9.desc: "After the collapse of the great #E Mâhdad Sho-Tan'Mâat Mâ'Azarî#! and the division of the #E Gold Dwarven#! people, the various kingdoms of the #E Gold Dwarven#! world have suffered repeated invasions and subjugations by foreign conquerers.\n\nFormerly owning much of #E Western Luxterra#!, always defeating the other two #E Mythic Dwarven Kingdoms#! in battle, their lands were slowly taken from them and their cities razed and lost to the sands of time. First by the invasions of the #E Old Dragkhans#!, then the #E Nomadic Dragkhans#!, followed by the #E Human Migrations#!, the #E Goblin Awakening#!, then the various #E Human#! and recently #E Dragkhanic#! empires, even the mighty #E #R Zani Empire#!#! are only a footnote in their vast history.\n\nHowever, it was this small footnote that would end the prosperous #E Golden Kingdom#!, known to us as the #E Mâkdid Sho-Tan Azarî#!, and destroy the great #E Etemenazari#!.\n\nNow our people once again face invaders who seek to take away our freedoms. No more, we say!\n\nThe #E Gezari#! have united for the first time in their history, with the rival cities of [GetProvince('(int32)4438').GetName] and [GetProvince('(int32)4446').GetName] working together against the expansionist [GetCountry('KAF').GetName].\n\nThe various #E Azari#! kingdoms have recovered from the damage done by the #E #R Zakara Kephal#!#!, with some rumoring that the King of [GetCountry('AKK').GetName] seeks to reclaim the #E Golden Kingdom#!.\n\n[GetCountry('YMH').GetName] stands strong from the #E City of the Hammer#!, denying nomadic raiders entrace to the western kingdoms. However, their #E Yamhadi#! brethren in the east aren't doing as well, eking out a living trading what spices remain after their yearly tribute to the powerful nomads on their borders.\n\nDespite what they have done to us, foreign religions tempt our people away from worship of the ancestors. In particular, word has spread that that the King of [GetCountry('KDM').GetName] has adopted the religion of the #E One God#!, declaring that he shall help him reconquer the #E Baetep#! from the arrogant #E Pharons#!!\n\nIn this time of great change, it is time for our people to once again rise and become conquerers like our ancestors, lest we become the subjugated." 
 lorestart.9.a: "The fate of Omniluxia is now in our hands."

 lorestart.10.t: "The Silver Dwarves"
 lorestart.10.desc: "The #E Silver Dwarves#! of #E Morrigon#! are possibly the oldest race on the continent. Emerging long before even the ancient #E Goblins#!, they ruled much of #E Southern Morrigon#! during the #E First Kingdom of Srrørum#!, enjoying the relative peace and stability under the rule of the demi-god twins [GetCharacter('(int32)75').GetName] and [GetCharacter('(int32)85').GetName].\n\nHowever, their Golden Age was ended with the start of the #E Great Primordial War#!, which saw the death of the #E Sacred Pair#! at the #E #R Battle of Dragon's Head#!#!. With the empire of the Silver Dwarves crumbling, they were pushed back into their homeland of the #E Green Valley#! by the massive hoards of #E #R Old Dragkhans#!#!, with opportunistic #E Elves#! and #E Goblins#! migrating into their lands during the chaos. Eventually, their last few citadels were razed by the #E #R Hobgoblins#!#! when they arose during 6,000 BLC.\n\nWhile the those who followed [GetCharacter('(int32)84').GetName] went on #E The Great Walk#! to what would become [GetProvince('(int32)2559')GetName|E], the #E Anvindr#! principalities fought over the small fragments of what was #E Srrørum#! until the ascent of the great [GetCharacter('(int32)76').GetName] in 602 LC.\n\nReforming the already powerful principality of #E Duggmanri#!, the future King would start a series of expansionist wars against his neighbors that would come to be known as the #E Unification Wars#! to once again unite the #E Anvindr#! under one banner. While many fled the violence, notably those who would go on to found [GetProvince('(int32)5562')GetName|E], the king and his various ministers and generals successfully gained control of the entire valley. Thus, [GetCharacter('(int32)76').GetName] declared himself #E Togg#! of the #E Second Kingdom of Srrørum#! in 610 LC.\n\nThe fledgling kingdom had little time to rebuild, as it would find itself tested by the powerful #E #R Zani Empire#!#!. Word had reached the emperor of a dwarven kingdom to the west overflowing with great riches, and thus he would launch two expeditions to find the #E Silver Dwarven#! kingdom where peasants wore platinum.\n\nThe #E Governor of Imperial Wegalia#! led an expedition of 30,000 men that would sack the city of [GetProvince('(int32)2559')GetName|E] in 619 LC, causing their Kingdom to fall into decline and ending the #E Aspatta#! bloodline.\n\nMeanwhile, the #E Governor of Imperial Rohevia#! sent an expedition of 25,000 south, where they were met at [GetProvince('(int32)4048')GetName|E] with fierce resistance. After defeating the forces of the traitorous #E Prince Harttol 'to Ommor'#!, the King's forces met the #E Zani#! at the #E Battle of Hlivikkabi#! in 621 LC, a decisive victory which would ensure the independence of his people for the rest of his reign.\n\nHowever, following his death in 669 LC and the breakup of his kingdom, the #E Green Valley#! has been divided between various petty realms who each seek to reform the mighty kingdom of #E Htgarth#! and #E Hefdarr#!. To the north, the #E Saptans#! have recently been expanding their influence for the first time in centuries, buying the city of [GetProvince('(int32)2651')GetName|E] from friendly #E Borderlander#! tribes. To the south, [GetCountry('SV0')GetName|E] has seen the ascent of the #E #R Tyrant King#!#! [GetCharacter('(int32)87').GetName], who must deal with increasing tensions between his people and the #E Kana'i Goblins#! of the #E Dragon's Pass#!.\n\nIn this time of great change, will the #E Silver Dwarves#! once again ascend to become one of the #E Great Powers#! of #E Omniluxia#!?" 
 lorestart.10.a: "The fate of Omniluxia is now in our hands."

 lorestart.11.t: "The Heirs of Jarenam the Formidable"
 lorestart.11.desc: "Whether adored or feared, it cannot be denied that the conquests of the great Qhagan #E Jarenam the Formidable Dragon#! have forever changed the political and cultural landscape of #E Western Luxterra#!\n\nFreeing many peoples who were under #E Zanic#! rule for centuries such as the #E Baetepians#! and #E Phanicians#!, subjugating the #E Esquelians#! with the help of #E Eteradican#! auxiliaries, and accidentally setting the groundwork for the founding of the emergent [GetCountry('KAF').GetName] in the west, the Empire at its height rivaled the grandness of even the #E Zani#!.\n\nHowever, the collapse of #E Jarenam#!'s legacy led to a moment of weakness, during which the various vultures big and small picked apart pieces of his empire for their own. The realm stabilized under the ascent of the cunning [GetCharacter('(int32)29').GetName] in 998 LC, but the damage was already done.\n\nThe #E Phanicians#! have carved out two rival kingdoms, eyeing up their comrades still under #E Totrazi#! rule.\n\nThe [GetCountry('EGY').GetName] took the opportunity to consolidate its power under the cowardly #E Sertems#!, now seeking to make itself the strongest power in #E Western Luxterra#!. The #E Majarian Kingdom#!, ruled by former #E Alaguric#! mercenaries of the [GetCountry('EGA').GetName], now stand as nothing more than a symbol of this imperialist attitude towards the west.\n\nThe various #E Esquelian#! and #E Eteradicans#! of #E Central Bhaxnmrechtem#! have fought guerilla campaigns to harass and cripple the empire's ability to secure its own borders while also stoking the flames of ethnic uprisings within #E Totrazi#! borders.\n\nThe #E Gold Dwarves#! are too occupied with the reconstruction of their states, and the #E Kaffarians#! and #E Zinduidians#! to the east have no interest in #E Western Luxterra#! at the moment.\n\nRuling an unstable empire with enemies on all sides, [GetCharacter('(int32)29').GetName] must find a way to save #E Jarenam#!'s vision before the circling vultures descend on his crumbling state!" 
 lorestart.11.a: "The fate of Omniluxia is now in our hands."

 lorestart.12.t: "The Kingdoms Of Rohenoa And Rohevia"
 lorestart.12.desc: "The vast realms of [GetProvince('(int32)2222').GetArea.GetRegion.GetName|E] and [GetProvince('(int32)2818').GetArea.GetRegion.GetName|E] can be found north of the #E Rohanoan Mountains#!, the impassable range that separates their homelands from central #E Morrigon#!. The #E Rohenevian Peninsula#! is a chivalrous place, a land of Knights and Kings, of Lords and Ladies living in cities and castles, and there are hundreds of beloved songs and ballads recounting the heroic history of this region. The two strongest Rohenoan kingdoms, [GetCountry('BRE').GetName] and [GetCountry('ARL').GetName], dominate regional politics, and a clash between the two powers and their allies seems imminent. While many distrust the foreign culture of the Aralans, there are many that would see Bretagne fall, for they have acquired many enemies since the #E Great Collapse#!." 
 lorestart.12.a: "The fate of Omniluxia is now in our hands."

 lorestart.13.t: "The Borderlands"
 lorestart.13.desc: "Centuries have passed since the #E Great Borderlander Revolt#! and yet the #E Native Morrigonians#! to the west of the [GetCountry('WGA').GetName] have not managed to unite, and have instead regressed to their traditional tribal lifestyles.\n\nHowever, all is not well in the #E Borderlands#!, as the #E Northern Borderlanders#! face the wrath of invading #E Orcish#! colonies said to be funded by the #E Nazani#! to destabilize the region. The great backstab of the #E Leslesi#! tribes has proved to be a grave mistake, as the re-emergent [GetCountry('SV2').GetName] now looks to avenge their allies.\n\nIn the south, the #E Marshlanders#! have enjoyed seven years of peace with the [GetCountry('WGA').GetName] following their truce with Emperor [GetCharacter('(int32)18').GetName]. However, this brief respite is soon to end, as rumors circulate that Emperor [GetCharacter('(int32)16').GetName] of the [GetCountry('SOV').GetName] plans to expand his empire into the lands of the #E Marshlanders#!!\n\nWhatever this new milennia will throw at them, the resiliant #E Borderlanders#! and #E Marshlanders#! will be able to manage them, once again preserving thier people and heritage." 
 lorestart.13.a: "The fate of Omniluxia is now in our hands."

 lorestart.14.t: "The Snake Isles"
 lorestart.14.desc: "While some fortunate countries were untouched by the calamitous #E Great Collapse#!, the #E Snake Isles#! of the #E Ular-Pria#! were absolutely devastated by the ensuing earthquakes and tidal waves, and their Empire collapsed overnight in the utter destruction.\n\nIn the difficult years since those dark days, the Snakefolk have managed to rebuild their islands, with two rival cities, [GetProvince('(int32)5694')GetName|E] of [GetCountry('UP4').GetName] and [GetProvince('(int32)5607')GetName|E] of the [GetCountry('UPJ').GetName], struggling against each other for supremacy over the #E Austropetolian Archipelago#!. While their Empire is gone, the memory of their cruelty lingers in lands they once controlled, and many curse the Snakefolk and fear them to this day." 
 lorestart.14.a: "The fate of Omniluxia is now in our hands."

 lorestart.15.t: "The Island Of Eternal War"
 lorestart.15.desc: "The island of #E Arteon#! has suffered greatly for many centuries, perhaps moreso than any other place within #E Omniluxia#!, as #E High Elven#! invasions from abroad and internal dissension between the settled human tribes have brought a state of eternal war to the island. The #E First Great War of Arteon#! and the expansion of the #E High Elven Colonies#! resulted in the native Arteonians losing many of their coastal territories to High Elves, and native armies are gathering in the interior of the island for a campaign to retake these lands.\n\nIn this environment, the Alu-sarian half elves were born from the union of the fleeing pacifist #E Alusian#! High Elves and the highland #E Sarian#! tribes. Called 'Emra' by the xenophobic High Elves, this derogatory term is emblematic of their attitudes towards them - disgust and hostility. Living outside the reach of the hostile High Elven colonies, the major Half Elven communities of the region as well as neighboring Alusian and Sarian settlements have recently loosely united under King [GetCharacter('(int32)129').GetName] of the [GetCountry('ALS').GetName] Kingdom.\n\nMeanwhile, the aftermath of both the #E Second Great War of Arteon#! and the #E High Elven Civil War#! has meant that the newly independent colonies of the High Elves no longer had the support of their overlords, allowing the rise of the wealthy [GetCountry('MH1').GetName].\n\nThe constant fighting between the major powers of the island allowed for the small city-state of [GetCountry('AR3').GetName] to take over surrounding major cities such as [GetProvince('(int32)791').GetName] and [GetProvince('(int32)942').GetName]. Their esoteric King, [GetCharacter('(int32)130').GetName] is rumored to be involved with numerous sightings of #E #R Vampires#!#! reported on the island.\n\nWith the coming of the #E High Elven Peace#! and the return of raids by the #E Great Slaver Navies#!, the tension on the island has only increased. Tens of thousands of soldiers have fallen in the battles between the various factions vying for control of the island, and the cities and ports are filled with ruthless mercenary companies selling their swords to the highest bidder, heartless slavers with thousands of chained thralls and cynical weapon dealers that sell to all sides involved in conflict - there is no escaping the violence on Arteon.\n\nWith the island split between the native [GetCountry('MH1').GetName] and the High Elven [GetCountry('DMR').GetName], the winner of this conflict will be decided by the reaction of the various minor players in this inevitable clash of cultures." 
 lorestart.15.a: "The fate of Omniluxia is now in our hands."

 lorestart.16.t: "Of Gnomes and Northerners"
 lorestart.16.desc: "For centuries the #E Gnomes#! of #E Kemi#! lived peacefully in their snow-filled environment, dedicating themselves to worship and the continuation of their culture and traditions. However, after the #E #R Great Collapse#!#! foreigners arrived on the shores of what they called #E Polaria#!. Initially greeting them with open arms, the #E Gnomes#! learned to fear these new arrived as their people were pushed further into the ice by the waves of migrating #E Northerners#!.\n\nHaving been pushed out of the fertile plains of the south, the #E Gnomish#! clans met to decide the fate of their people. Many 'Saamskoo' decided to move north into the inhospitable glaciers where no #E Polarian#! could reach them, while the remaining 'Jemskoo' were firm in their decision to stay and fight.\n\nHowever this battle was a losing one, and the short stature of the #E Gnomes#! combined with their poor martial abilites meant that by 779 LC the #E Polarians#! had pushed the divided clans into the harsh mountains and hills.\n\nHowever it was this year that the #E #G Taalvut Åkoo#!#! revealed himself to the desperate #E Jemskoo#!. Teaching them the secrets of #Y Projection Magic#!, the #E Gnomes#! now had their own giants that they could use against the foreigners. Instructed to build a magic school to teach this #Y Taanka Technique#! to their young mages, the #E Gnomes#! have been able to greatly develop their magical capabilities in only a few generations.\n\nAt the turn of the milennia the #E Gnomes#! of #E Polaria#! now find themselves united under the #E Jemskoo#! king [GetCharacter('(int32)124').GetName] and prepared to retake their homeland. In contrast, the last sons of the #E #R Northern Empire#!#! are divided into various squabbling clans, their greatest hope being the #E Bear Hunters#! of [GetCountry('PS4').GetName]. In this critical moment in #E Polarian#! history, the fate of two peoples shall be decided once the first spark is lit." 
 lorestart.16.a: "The fate of Omniluxia is now in our hands."

 lorestart.17.t: "A Land of Fire and Ice"
 lorestart.17.desc: "While skirmishes between the #E Horteonians#! and the native #E Gnomes#! took place ever since the #E Horteonian Migrations#!, the #E Continent of Fire and Ice#! saw relative peace as the #E Horteonians#!, #E Eptelonians#!, and #E Arteonians#! traded between themselves and even with the #E Gnomish#! tribes.\n\nHowever, the landing of #E Atheus the Conquerer#!'s #E Great Slaver Fleet#! over two thousand years ago brought ruinous war to all those who lived in the #E Melodian Continents#!.\n\nThe various #E Atheusian-Horteonian#! wars saw the borders change, with the #E Horteonians#! suffering the same fate they inflicted onto the #E Gnomes#!, retreating futher into the hilly interior of the continent.\n\nDespite this tragedy, hope revealed itself to the various human tribes in the form of the #E Great High Elven Civil War#!.\n\nSince the death of #E Atheus the Younger#! in 635 LC, his cousins [GetCharacter('(int32)33').GetName] and [GetCharacter('(int32)125').GetName] split the empire, only briefly pausing to recover their manpower following the #E Great Collapse#!, leading to the #E High Elven Peace#!. With both sides focusing on their lost colonies and each other, a united coalition of #E Horteonian#! tribes might be able to kick out the invaders once and for all.\n\nMeanwhile, to the North, the neutral #E Gnomish Nookti Cities#! are beacons of civilization among the various nomadic #E Gnomish#! clans. Should they decide to finally intervene, they might be able to create a better future for the native people of #E Wuskouu#!!" 
 lorestart.17.a: "The fate of Omniluxia is now in our hands."

 lorestart.18.t: "The Star Lords"
 lorestart.18.desc: "The human civilizations that live around the #E Northstar Bay#! in eastern #E Luxterra#! are easily divided into two groups; the settled tribes of the plains and forests of [GetProvince('(int32)1849').GetArea.GetRegion.GetName|E] and the powerful Stellaric Republics centered around the #E Tayngvw Mountains#!. Ascendic High Elves have claimed a few territories on the coast, but they are too weak to challenge the Errnorfallians and remain in their citadels, watching and waiting for an opportunity to expand their holdings.\n\nLong ago, it is believed that strange #E Visitors#! arrived in a falling #E Star from the East#! that crashed into the Bay, and the luminous gods that emerged from the waters taught the #E Stellarics#! their faith and built them cities and castles, allowing them to consolidate power and dominate trade within the region." 
 lorestart.18.a: "The fate of Omniluxia is now in our hands."

 lorestart.19.t: "Descendants Of Edis"
 lorestart.19.desc: "The Copper Dwarves that live within the walled city of [GetProvince('(int32)3816')GetName|E] on the #E Skyreach Steppes#! have survived against all odds, barely holding out against the near-constant sieges by the neighboring #E Goblin#! and #E Selaskusian#! tribes that seek to avenge their ancestors and reclaim lost territory.\n\nHundreds of years ago, the bold explorer #E Edis the Grim#! managed to beat back his foes and build strong fortifications to keep them away, but his descendants have good reason to believe that their luck might be running out. Only time will tell as to whether or not the City will remain in the possession of the [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] dynasty." 
 lorestart.19.a: "The fate of Omniluxia is now in our hands."

 lorestart.20.t: "The Azari Dwarves"
 lorestart.20.desc: "The Golden Dwarves of [GetCountry('AKK').GetName] once ruled over an extensive empire, the #E Mahdad Sho-Tan'Maat Ma'Azari#!, controlling large portions of territory throughout #E Western Luxterra#! and ruling as tyrants. Their cruelty was their undoing, for they were betrayed by their kinsmen and destroyed by the Zani Empire.\n\nIn an act of desecration that has never been forgotten, the armies of Zanis the Great destroyed the famed ziggurat #E Etemenazari#! in the Azari capital [GetProvince('(int32)4262')GetName|E] after a decade long siege. The heart of Azari civilization was methodically torn down, brick by brick, in a display of contempt and domination. A century of slavery passed before the Zani civil wars and the #E Great Collapse#! ravaged Luxterra, and although the Azari eventually rebuilt Tiuban and reconquered the hinterlands of their capital, the Dwarves yearn for the glorious days of the past." 
 lorestart.20.a: "The fate of Omniluxia is now in our hands."

 lorestart.21.t: "The Primeval Woods"
 lorestart.21.desc: "One of the most magical and ancient places within all #E Omniluxia#!, the [GetProvince('(int32)2228').GetArea.GetRegion.GetName|E] is home to the Waldonian Wood Elves that inhabit the Eldritch woods in the center of #E Luxterra#!. The Forests have not been polluted by cities of stone, for the Elves live in small settlements alongside nature, where they are able to commune with the spirits living deep within the World's Lungs Forest." 
 lorestart.21.a: "The fate of Omniluxia is now in our hands."

 lorestart.22.t: "Valley Of The Kinones"
 lorestart.22.desc: "Living within the [GetProvince('(int32)1654').GetArea.GetRegion.GetName|E], the Kinones are perhaps the most misunderstood of all races and religions living within #E Omniluxia#! - a reputation they have earned by keeping to themselves, although occasional adventurers leave the safety of their quiet valley to visit the hustle and bustle of the wider world.\n\nThe various Kinones #E Clans#! are spread out across the various valleys and forests of the #E Peaceful Valley#!, all with different interests, rivarlies, and #E Kino#!. However, all Kinones are united in their faith, and while the #E Kino#! of each #E B'au-B'au#! may differ, all submit to the will of #E Kon#! and wish to improve the lives of their fellow kinsmen.\n\nThe great city of [GetProvince('(int32)1641')GetName|E] is the largest settlement of the Kinones, and has been built up and ruled over by the #E White Faced Clan#! for the last century. Their urban lifestyle contrasts the traditional tight-knit communities that the Kinones are used to, however the manpower they command have made them the hegemons of the Kinones of the #E Central Valley#!.\n\nRivals of the #E White Faced Clan#!, the #E Mlo'n Clan#! rules from the #E House of Mlo'n#! that oversees the various villages of the western slopes of the #E Peaceful Valley#!. Isolated from the other tribes, their #E Kino#! has been shaped primarily by the interests of the #E Mlo'n Clan#!, who's expansionist views are justified as being for the 'betterment' of Kinones society. Their frequentment of the warpath has paid off in the form of territory, however, it has also made them many enemies, and united the various central and southern city-states against them.\n\nThe southern valleys are home to various city-states whose #E Kino#! emphasizes trade, agriculture, and hospitality. As most foreign travelers arrive in this region, their #E Kino#! has grown to become what the Kinones are known for, as these travelers fondly remember the warm hospitality and friendly culture shown to them by the #E Sons of the South#!.\n\nThe north and east are home to Kinones who are more cold to foreigners, as raids by #E Northlanders#! and #E Deep Gnomes#! respectively have shaped their #E Kino#! to prioritize the defense of the local families over the hospitality shown to foreigners.\n\nAlthough they currently enjoy the benefits of being ignored by the wider world, the various Kinones clans of the #E Peaceful Valley#! will be faced with various upcoming threats that may pose a danger to their entire society. Amongst the squabbling families, there are those that call for a #E Great League#!, where all Kinones work together under one #E Kino#! to defend their way of life in a changing world."
 lorestart.22.a: "The fate of Omniluxia is now in our hands."

 lorestart.23.t: "The Blood-Stained Drow"
 lorestart.23.desc: "Over the last few decades, the #E Wild Northlands#! of eastern #E Luxterra#! have seen Drow elves emerge from deep underground to conquer new kingdoms. These believers of the dark #E Blood-Stained#! faith savagely conquered the unsuspecting tribes living by the Norrfalian Sea with ease - the humans could not imagine that armies would appear from the mountain caves and never prepared for the possibility.\n\nOnce the wars of conquest drew to their bloody conclusions, the Drow established kingdoms close to the mountains, and in the following years, their influence and religious beliefs spread far beyond their current borders. Many humans fear the Drow elves, and alliances have been formed to keep them at bay." 
 lorestart.23.a: "The fate of Omniluxia is now in our hands."

 lorestart.24.t: "The Bloody Isles"
 lorestart.24.desc: "The swamps and jungles of [GetProvince('(int32)2060').GetArea.GetRegion.GetName|E] and [GetProvince('(int32)1793').GetArea.GetRegion.GetName|E] are the traditional homelands of the Orcish tribes. While most Orcs live on the Bloody Isles, isolated from the rest of Morrigon, the few 'Gozen Orcs' who decided to leave their island homelands can be found all throughout Morrigon. Their services are in high demand as soldiers and mercenaries, for they are physically hearty and exceptional fighters, and it is not uncommon to find one within the personal retinues of Kings and Emperors throughout Omniluxia.\n\nWhile the two islands have a shared history and faith, the political and cultural development of the two diverged significantly following the fall of the Great Nuhargorkan. Rendunian Orcs have organized their society around the fortified #E Nurago#! palaces of the noble #E Egerya#!, and although their society is more stratified, their large urban settlements and port cities host the few foreigners allowed on Orcish soil. Western Remunian Orcs have adopted the ways of the Big Islanders, however, most Remunians live in clans that roam the various jungles, swamps, and mountains of the Holy Island, practicing traditions that predate the Great Nuhargorkan.\n\nThe dominant powers in the Orcish world are the Great Families at the helm of the #E Nurhanuoragias#!. These great polities command great spiritual and martial power, however, they are also astute when it comes to maintaining their hegemony. Over the centuries, dozens of Nurhanuoragias have risen and fallen, and each Great Family knows that they must fight viciously to maintain their position at the top.\n\nOn Rendun, the [GetCountry('BT9').GetName] and [GetCountry('BT6').GetName] families have been ardent rivals for decades, having both risen from the ashes of the [GetCountry('BT5').GetName] family, who once controlled the entirety of the south. To the north, the [GetCountry('BTI').GetName] and [GetCountry('BTF').GetName] families have made an uneasy alliance in an attempt to stop the incredible rise of the [GetCountry('ORC').GetName] family. Once a minor noble family, the [GetCountry('ORC').GetName] have seen explosive growth under M'Orokoro [GetCharacter('(int32)96').GetFirstName], known as 'the Butcher' for his brutal methods of maintaining order. His secretive court is said to worship what they call the 'Black Flame', a barbaric belief that one's Inner Flame can only be regulated through consuming the flames of others. The only lands free from fuedal yoke are the free temples of the [GetCountry('BT4').GetName] monks who reside in Opium Valleys. Due to the high cost of conquering these fearsome warrior-monks, many Nurhanuoragias instead choose to send their sons to learn from the various academies and temples across the monks' domains, further ensuring the independence of these wise holy men.\n\nAcross the sea, Remun is dominated by two families, the [GetCountry('BIG').GetName] and the [GetCountry('BI6').GetName]. Having originally come from Rendun, their superior technology, numbers, and political structure has allowed them to dominate the west coast of Remun. Bitter rivals, their expansion has been halted by a mutual distrust of the other and the thick jungles and mountains of the island that protect the native tribes.\n\nFinally, a small band of Orcish adventurers who have called themselves 'Gotzon's Chosen' have been rallying the various clans behind their banner. While their aims are unknown, they certainly seem poised to uproot the control of the dominant Iparatai families.\n\nHaving been divided for centuries, the idea of a unified Orcish realm is a foreign concept to most Orcs of the Bloody Isles. However, with the world around them finally restoring order centuries after the Great Collapse, the prophesized Krozon may finally arrive!"
 lorestart.24.a: "The fate of Omniluxia is now in our hands."

 lorestart.25.t: "Sons And Daughters Of Cafea"
 lorestart.25.desc: "Although many Wood Elves have chosen to live underneath the sprawling canopy of the [GetProvince('(int32)2228').GetArea.GetRegion.GetName|E], there are many isolated pockets of Aneic faithful living within the Eldritch Forests that are scattered across all of Omniluxia. The peaceful Wood Elves desire nothing more than to walk undisturbed within their wooded realms, pray to Mother Cafea and tend to their forests, and for the most part, they are left alone by the other races living alongside them, who view their presence as an omen of good fortune." 
 lorestart.25.a: "The fate of Omniluxia is now in our hands."

 lorestart.26.t: "Tribes Of The Three Brothers"
 lorestart.26.desc: "Ages ago, the #E Zerywani Hordes#! gathered under one banner and conquered across the entirety of #E Luxterra#!, bringing death and destruction to Empires and Kingdoms before returning to the vast plains that are their homes - their greatest moment, and the memory of their campaign still causes fright amongst the settled peoples living in the west.\n\nIn the years since these battles changed the political landscape of Omniluxia forever, the descendants of the Three Brothers #E Zehi#!, #E Rossovi#! and #E Lechi#! have kept to their traditional territories, although the Western Zerywani have been moving their herds onto the steppes over the last few decades." 
 lorestart.26.a: "The fate of Omniluxia is now in our hands."

 lorestart.27.t: "The Werhenlanders"
 lorestart.27.desc: "#E Greater Werhen#! was once the easternmost province of the #E Zani Empire#!, and many famous generals, statesmen and inventors hail from the region. The #E Great Rebellion of the Werhen#!, an attempt by the locals to free themselves from Zani clutches, ultimately failed, but the wounds inflicted upon the #E #R Zani#!#! by the valiant #E Werhenlanders#! would contribute to the Empire's collapse a century later.\n\nThe #E Great Collapse#! brought devastation and destruction to #E Werhen#!, but it was the first taste of freedom for many, and the people have resisted unification ever since; a problem that has worsened because of meddling by their neighboring countries, especially the [GetCountry('EGA').GetName]. And so the inhabitants of #E Werhen#! continue to squabble with each other, their potential strength diluted by greed and suspicion. Petty warlords rule over duchies as self-styled 'Kings' and an ever-shifting network of alliances and defensive leagues has ensured that no one country becomes too powerful.\n\nFacing hostile #E Illorians#! and #E Geallians#! looking to expand their lands to their south and east as well as marauding #E Northlanders#! pillaging their villages, the #E Werherlanders#! have many challenges ahead of them." 
 lorestart.27.a: "The fate of Omniluxia is now in our hands."

 lorestart.28.t: "Eptelon"
 lorestart.28.desc: "The island of #E Eptelon#! has the great misfortune of being located close to both #E Arteon#! and the #E Austropetolian Archipelago#!, and over the centuries, the native inhabitants have dealt with incursions by Arteonian raiders, High Elves invaders and Ular-Pria slavers. The settled tribes of the Eptelonians were once peaceful, desiring nothing more than to live quietly in their villages and worship the traditional gods of their homeland undisturbed, but their recent circumstances have made the islanders suspicious of all outsiders.\n\nThere are many cities on Eptelon; some built by the local tribes, and many others have been constructed by the Arteonians and High Elves. The best farmlands on the isle are located near the coasts and have been taken over by the foreigners, who have forced the Eptelonians deep into the marshes and mountains of the interior." 
 lorestart.28.a: "The fate of Omniluxia is now in our hands."

 lorestart.29.t: "The Central Omniluxian Isles"
 lorestart.29.desc: "Along the eastern coasts of #E Luxterra#!, there are stories shared by fishermen and sailors about a blue-skinned race of magical #E Sea Elves#! that live on islands in the #E North Inter Sea#!, and while many laugh and dismiss these as old wives' tales, the existence of the Ioni-sir, Dori-sir and Coriti-sir Elves is no myth.\n\nThe undisputed masters of the waters, the Sea Elves have kept their affairs separate from the rest of Omniluxia for many hundreds of years. Contact between the Elves and the mainlanders happens only by design, never by chance, for their ships are simply too fast to overtake. Their origins are difficult to discern and their motivations remain unclear." 
 lorestart.29.a: "The fate of Omniluxia is now in our hands."

 lorestart.30.t: "Children of the Sands"
 lorestart.30.desc: "The #E Upper Baetepians#! that have chafed under #R Zanic#! dominion for centuries now boil in outrage as their northern cousins are once again subjugated to foreign rule!\n\nThe silver-tongued #E Sertem#! that have oppressed the #E Baetep#! for generations now return to rule them in earnest, continuing the Zanic tradition of suppressing the gods of [GetProvince('(int32)2805').GetName] that once liberated the #E Baetepians#! from foreign rule and expanded their empire to become the greatest in #E Luxterra#!.\n\nHowever, there is still hope. The enduring [GetCountry('DUN').GetName] under the #E True Pharon#! [GetCharacter('(int32)9').GetName] have allied themselves to the rival [GetCountry('AGE').GetName], finally setting their differences aside in order to free their land from the false god #R Zanis#! of the #R Geallians#!.\n\nWaiting for a moment of weakness in the fledgling [GetCountry('EGY').GetName], the alliance plans to finally restore rightful #E Djehid#! rule to the lands of the #E Baetepian#! people!" 
 lorestart.30.a: "The fate of Omniluxia is now in our hands."

 lorestart.31.t: "The Five Tribes of Dzunge Duny"
 lorestart.31.desc: "The #E Dzunge-dunylin Toçulkar#!, children of the great Sky God #E Dzunge Duny#!, have for centuries lived at the periphery of the #E #R Geallian#!#! world, often raiding their more civilized neighbors as much as they raid each other. Fiercely independent, the divided #E Duny#! were slowly forced to bend the knee to the #E #R Zani Empire#!#!, who pushed into their lands and settled their hunting grounds with foreign peoples.\n\nDuring the #E Great Invasions#! of the 650s, it seemed that the #E Duny#! would become just another assimilated people within the great empire, however the heroic #E Orçuz Gundogdu#! led the five tribes to victory against #E #R Zanic#!#! and #E Selaskusian#! armies, buying the #E Duny#! enough time for #E Dzunge Duny#! to intervene. What the #E #R Geallians#!#! call the 'Great Collapse', the #E Duny#! celebrate as the sky god punishing the encroaching #E #R Zani#!#! by clouding his realm with a great layer of smoke and shaking the earth as he rained thunderbolts upon the invaders. The weakened #E #R Zani#!#! were no match for the hordes of vengeful horsemen that razed many cities of the south, reclaiming their homelands and freedom.\n\nHowever, the five tribes grew complacent, and continued their nomadic ways while extoriting the southern #E Ytalians#! for tribute in the form of grain and gold. Thus, while they squabbled amongst themselves for larger portions of tribute, the #R [GetCountry('EGA').GetName]#! consolidated its power over the east. Once they fully recovered from the destructive #E #R Great Split of 690 LC#!#!, their armies began to march on the lands of the #E Duny#!.\n\nOnce again it seemed that the sons of #E Dzunge Duny#! would be destroyed by the #E #R Geallians#!#!, however, the sky god once again intervened to save his people. He sent the demon known to the #E #R Razani#!#! as #E Jarenam the Formidable Dragon#! to ravage their lands and divide their empire. Once again, the #E Duny#! hordes descended on the edges of #E Razani#! territory, and retook their lost lands.\n\nWhile the [GetCountry('GT1').GetName] and [GetCountry('GT4').GetName] are content with raiding the #E Ytalians#!, the great chief of the [GetCountry('DNY').GetName], [GetCharacter('(int32)26').GetName], has bigger ideas for the five tribes. Learning from the oral histories, he's determined to break the cycle and ensure prosperity for the divided tribes. His tolerance of conquered people and adoption of their technologies has given him an edge over his rivals. His hosts have so far subdued the [GetCountry('GT3').GetName] and integrated the #E Teçuklar#!, and he now sets his eyes on the remaining two tribes who are alarmed at his rapid expansion.\n\nShould he be able to unite the #E Duny#!, the children of #E Dzunge Duny#! might escape the growing hordes of the south and find true prosperity."
 lorestart.31.a: "The fate of Omniluxia is now in our hands."

 lorestart.32.t: "Heirs of Cyrogelos"
 lorestart.32.desc: "The Kings of [GetCountry('YGA').GetName] have been faithful subjects of the #E Zani Empire#! ever since the founding of their kingdom by #E Cyrogelos the Loyal#!. Located at the southern edges of the #E Zani#! world, they are known as the defenders of the #E Golden Pathway#!, fighting off nomadic horsemen and goblin hordes, as well as maintaining order in the surrounding regions. Rivals of the warlike #E Anaktorians#!, the #E Ytalians#! are a bellicose people whose warriors and military culture laid the foundation for massive armies of the #E Zani Empire#!.\n\nAfter the #E #R Great Collapse#!#! the #E Ytalians#! continued to serve the weakened [GetCountry('EGA').GetName] loyally, protecting their south from #E Duny#! and #E Selaskusian#! hordes, while sending soldiers north to participate in wars against the #E Illorians#!, #E Etaredicans#!, and eventually the invading [GetCountry('JRE').GetName].\n\nWith the death of King [GetCharacter('(int32)94').GetName] came the question of succession. A friend of [GetCharacter('(int32)12').GetName], #E [GetCharacter('(int32)94').GetFirstName]#! enforce his overlord's policy of persecution towards the popular #E #R Helluvian#!#! faith, which had come to dominate large parts of eastern and southern #E Ytalia#!. Thus, when his son #E [GetCharacter('(int32)140').GetFirstName]#! came to the throne, it came as a surprise when he promoted tolerance amongst the small kingdom, even pardoning and releasing his brother, [GetCharacter('(int32)139').GetName], a devout #E #R Helluvian#!#!.\n\nDespite having abandoned his faith, #E [GetCharacter('(int32)140').GetFirstName]#! still maintained the #E Cult of Zanis#! as the state religion to placate his overlord, who chafed at the disobediance shown by the young King. For many more radical believers, this was unacceptable. Rumors of rebellion now linger amongst isolated #E #R Helluvian#!#! communities, who scoff at the idea of the emperor in [GetProvince('(int32)2478').GetName] dictating the fate of their eternal souls.\n\nWith unrest building in the eastern regions, can [GetCharacter('(int32)140').GetName] maintain control of his kingdom, or will #E Ytalia#! finally seek its own path free from #E Zanic#! oppression?" 
 lorestart.32.a: "The fate of Omniluxia is now in our hands."

 lorestart.33.t: "Claimants of the Iron Crown"
 lorestart.33.desc: "Ever since King #E [GetCharacter('(int32)151').GetFirstName]#!'s conquest of [GetProvince('(int32)1199').GetName], the #E Kingdom of Herue#! has been the most prominent player amongst the various warring Norrfalian tribes. Founded upon the ruins of the #E Drow#! kingdom of Iolsim, #E Herue#! has stood as a bastion of #E Helluvianism#! and humanity against the hostile #E Drow#! who thirst to avenge those fallen during the #E Svardenni#!. However, the last few decades have brought this once-mighty kingdom to it's knees, and while her sons fight each other for possesion of the #E Iron Crown#!, the #E Drow#! watch hungrily for a chance to reconquer their lost lands.\n\nIn the year 987 LC, King #E [GetCharacter('(int32)156').GetFirstName]#!, head of the renown #E Walantidottir#! dynasty, died. While the crown is de jure passed onto an appointed heir, Herulian tradition consistantly affirms primogeniture, and since the days of #E [GetCharacter('(int32)151').GetFirstName]#! the #E Walantidottir#! have appointed their first-born as their heir. The deceased king broke this tradition, appointing his youngest son, #E [GetCharacter('(int32)158').GetFirstName]#!, as his primary heir, leaving minor duchies to his other sons.\n\nThose around the young king were known to say that he, 'would have been a better scholar than a ruler'. This sentiment led many to question his right to rule, and held weight amongst those who supported pretenders to the throne. The brothers #E [GetCharacter('(int32)160').GetFirstName]#! and #E [GetCharacter('(int32)161').GetFirstName]#! allied themselves to make a play for the throne, and launched their rebellion the following year. By fall of 988 LC they had managed to take [GetProvince('(int32)1199').GetName] with the held of sympathetic nobles, however, the disgraced king managed to escape and regroup around [GetProvince('(int32)1230').GetName]. Tasting victory, the brothers turned on each other prematurely, further fracturing the realm.\n\nThis civil war sewed chaos across the north. Surrounding norfallian tribes took advantage of the infighting to raid and pillage Herulian lands, while many #E Balthazarian Knights#! fought on all sides of the conflict, weakening the Order's authority. This came to a head when a large force of invading #E Drow#! defeated a large host of Balthazarian Knights at the Battle of [GetProvince('(int32)1078').GetName] in 993 LC.\n\nThe #E Drow#! ravaged the lands outside of their caves, spurring many norrfalians to take up their #E Blood-Stained#! religion, since the weakened Order could not save them. The brothers made a brief peace to combat this threat, barely scoring a win against the #E Drow#! at [GetProvince('(int32)1228').GetName] in 996 LC.\n\nWhile the coalition solemnly celebrated their victory, #E [GetCharacter('(int32)159').GetFirstName]#! made his play for the throne. Popular amongst the peasantry, #E [GetCharacter('(int32)159').GetFirstName]#! led an army of veteran soldiers to victory against the various invading tribes, defending the borders of #E Herue#! while the #E Walantidottir#! ravaged the lands. The last member of the #E Docsjaldutson#! family, a cadet branch of the #E Walantidottir#! dynasty,  #E [GetCharacter('(int32)159').GetFirstName]#! swiftly conquered [GetProvince('(int32)1199').GetName] and claimed the #E Iron Crown#! for himself. Recognizing the shift situation they were now in, the two #E Walantidottir#! brothers formed an alliance to defeat this new rival, while the cities of [GetProvince('(int32)1331').GetName] and [GetProvince('(int32)1230').GetName] declared independence from the absent #E [GetCharacter('(int32)158').GetFirstName]#!.\n\nWith four claimants to the #E Iron Crown#! on the cusp of war, the [GetCountry('BLZ').GetName] in disarray, and the #E Drow#! preparing a larger, more organized invasion, only #E Hellas#! knows the future of #E Norrfalia#!."
 lorestart.33.a: "The fate of Omniluxia is now in our hands."

