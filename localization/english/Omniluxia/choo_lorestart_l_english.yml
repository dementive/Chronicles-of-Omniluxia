l_english:

 lorestart.1.t: "The Legacy of Zanis" 
 lorestart.1.desc: "The mighty #T Eastern Empire of the Zani#!, born from the the chaos that followed the #R Great Collapse#!, has been led by the #Y Razani#! wing of the #T Zani Family#! since the #R Great Split of 690 LC#!. Just like their western counterparts, the Razani lay claim to the legacy of [GetCharacter('(int32)168').GetName|Y], and argue that their connection is stronger due to their control of his imperial capital of [GetProvince('(int32)2478').GetName|G] .\n\nRuling over the 'True Geallians' from the #G Unconquered City#!, the #Y Razani#!'s influence has waned in the past few centuries, losing many former imperial provinces to revolts or invasions. The #T Helluvian Heresy#! in particular has taken its toll on the religious unity of the Empire, with once-loyal groups such as the #Y Ytalians#! now questioning their loyalty to the Emperor.\n\nStill reeling from their near-destruction at the hands of #T Jarenam the Formidable Dragon#!, the #Y Razani#! under the aging [GetCharacter('(int32)228').GetName|Y] now face internal forces that threaten to tear apart their crumbling empire. Due to his lack of a clear heir, uneasy whispers permeate the walls of the #G Blue Marble Palace#!. While many in the palace support the emperor's adopted son, [GetCharacter('(int32)137').GetFirstName|Y], the fact that he does not contain any #Y Zani#! blood makes him ineligible in the eyes of most of those on the #T Imperial Council#!. The families of the council alongside several #T Gonessemshom#! have instead put their support behind the young #Y Uzani#! general [GetCharacter('(int32)138').GetFirstName|Y], a war hero whose deeds earned him the position of Gonessemshom of what's left of the [GetCountry('EGM').GetName|Y].\n\nOutside the palace walls, the wanton consequences of the #T Theon System#! have made administration of the empire increasingly difficult and volatile. Although initially efficient at defending against the invaders that threatened the early #Y Razani#! emperors, the entrenched Esemamshauzas and Gonessemshoms across the empire act more akin to vassals than provinces. Their loyalty is questionable at best, and with a civil war on the horizon, the empire can only pray they remain apathetic to court politics.\n\nOn top of internal issues, the Empire must now defend their vast territories from both nomadic invaders as well as the various kingdoms and empires on their borders without the support of the wealthy Baetep province, lost to the cowardly #T House of Sertem#! during the #T Invasions of Jarenam#!.\n\nWith civil war and external invasions seemingly imminent, can the aging ruler of the #Y Razani#! find a solution that could save the Empire of the 'True Geallians'?" 
 lorestart.1.a: "The fate of Omniluxia is now in our hands."

 lorestart.2.t: "Rise of the Purple Phoenix"
 lorestart.2.desc: "The #T Western Empire of the Zani#!, one of the two states emerging from the #R Great Split of 690 LC#! which followed the #R Great Collapse#!, are led by the #Y Weagelians#!, sons of #Y Geallian#! invaders and the native peoples of #Y Weagelia#!. The last three hundred years of relatively stable rule has given the leading #T House of Nazani#! a reputation as more than just a cadet branch of the #T Zani Family#!, as they are known among their people as the #Y Emperors of the West#! first and foremost.\n\nHowever, this stability and growth did not come without any losses. First giving up the #G Borderlands#! to native rebels in 697 LC and then Kainaxarthos to the [GetCountry('SOV').GetName|R] in 795 LC, many assumed that their hold on their continent would slip to younger empires like their eastern counterpart.\n\nRecognizing this threat, Emperor [GetCharacter('(int32)18').GetName|Y] decided to act following the decisive loss of the #G Marshlands#! after centuries of stubborn native resistance. Focusing inwards, the Emperor developed his cities and farmlands, stabilizing the realm while filling his ranks with able-bodied men. Watching the success of his endeavors, the cautious Emperor decided to expand the #Y Nazani#!'s influence through more subtle means rather than make rash offensive decisions.\n\nSecretly supporting the developing #R Orcish colonies#!, the #Y Nazani#! have strategically been destabilizing and weakening the #Y Borderlander#! and #Y Celtican#! tribes. Should the cautious Emperor decide to decisively strike, they are sure to reconquer the divided #G Borderlands#!.\n\nWith relatively few enemies who can match their strength and a stable state loyal to its Emperor. The only threat to the Emperor's power are a number of small heretical #T Helluvian#! communities spreading across his nation like a plague. Despite this, the #Y Nazani#! are in an enviable position, poised to become one of the #G Great Powers#! of #G Omniluxia#!." 
 lorestart.2.a: "The fate of Omniluxia is now in our hands."

 lorestart.3.t: "The Sertemic Kingdom of Baetep"
 lorestart.3.desc: "The #Y Sertemic#! [GetCountry('EGY').GetName|Y] has only recently seen its freedom following the #R Conquests of Jarenam the Formidable Dragon#! and his subsequent death. Tying themselves to a legacy much older than even the #Y Geallians#!, the ruling #T Sertem Family#! are actually descended from Zanicized #Y Phanicians#!, who used their guile and cunning to be appointed governors of the Imperial province of #G Baetep#!.\n\nWith the crumbling [GetCountry('EGA').GetName|Y] losing their hold over their Empire, the #T House of Sertem#! under #T Tzondunnan Sertem#! managed to seize control of the #G Baetep#! in order to 'secure' it against invading #R Jarenamid#! hordes, claiming the province as the core of his new kingdom once he realized he could gain more power than he could ever have under the weakened [GetCountry('EGA').GetName|Y].\n\nRuling a stable and wealthy realm, the #T Sertemic Dynasty#! controls one of the strongest empires in #G Luxterra#!, and should they properly utilize its potential they could easily surpass or even conquer the ailing [GetCountry('EGA').GetName|Y].\n\nHowever, while the #Y Baetepians#! have grown used to #Y Zanic#! rule, this small taste of freedom has lingered in their mouths. If the Pharon does not act to unify the people of the #G Baetep#! under their foreign rule and faith, they might face the consequences of letting this hunger for liberty grow, held strong by the various independent kingdoms of the south." 
 lorestart.3.a: "The fate of Omniluxia is now in our hands."

 lorestart.4.t: "The Dragkhanic Zani"
 lorestart.4.desc: "The Empire of #T Uttarasmake the Great#! started out as a group of Dragkhanic clans living under the shadow of the #G Celica Mountains#! centuries ago. Under the leadership of the #Y Soveneria#! clan, hordes of dragkhanic horsemen took advantage of the #R Second Marshlander Revolt#! to invade the wealthy Nazani province of #G Kainaxarthos#!.\n\n The following #R Nazani-Sovenerian War#! saw the #R [GetCountry('WGA').GetName|Y]#! retreat from southern #G Morrigon#! in 795 LC, allowing the victorious #T Soventeir Ulus#! to conquer most of their former territories. With no other rivals able to match their strength, the Sovenerians invaded the remaining dragkhanic clans, controlling most of southern Morrigon by 852 LC.\n\n In this environment, #T Uttarasmake the Great#! was declared #T Qhagan#! of Soveneria in 868 LC. Taught by #T Helluvian#! missionaries, the new Qhagan was a Zanophile who promoted the culture and traditions of the #Y Geallian#! #Y Kainaxari#! people in his borders. Seeking to further imitate the Zani, he declared himself #T Shanuzushanuz#! of the [GetCountry('SOV').GetName|Y] in 874 LC, as well as formally converting to Helluvianism. Claiming to be the legitimate heir of the #T Zani Empire#!, he spent the remainder of his reign spreading Helluvianism to his dragkhanic subjects, morphing and replacing cruel dragkhanic traditions with Helluvian or #Y Geallian#! ones, as well as crushing all threats to his power. This included defeating and selling the hostile #R Jazari#! tribes to the [GetCountry('EGA').GetName|Y] in 870 LC.\n\nHowever, the centuries have not been kind to the great #T Empire of the Zanic Dragkhans#!, as the years of prosperity and stability have allowed for corruption and complacency to seep into Sovenerian society.\n\nSeeking to emulate the recent successes of his Nazani counterpart, the young [GetCharacter('(int32)16').GetName|Y] was declared #T Shanuzushanuz#! of the [GetCountry('SOV').GetName|Y] in 999 LC. With the new milennia comes a new beginning, and he has vowed to banish corrupt officials and bring the empire to new heights.\n\nHowever, with corrupt officials endorsing his brother [GetCharacter('(int32)123').GetName|Y] for the throne, unrest growing amongst their more traditionally dragkhanic subjects, and rumors of a #R Hobgoblin#! horde growing in the north, the young emperor has much work to be done." 
 lorestart.4.a: "The fate of Omniluxia is now in our hands."

 lorestart.5.t: "The Hobgoblin Horde"
 lorestart.5.desc: "The #R Great [GetCountry('HOB').GetName|Y] Horde#! was forged by blood through the conquests of the great Droishu warlord [GetCharacter('(int32)63').GetName|Y] of the #Y Zalthu Clan#!. Controlling all the #R Hobgoblins#! of the #G Dragon's Pass#! by 998 LC, the great chief left his realm to his eldest son, [GetCharacter('(int32)86').GetName|Y], and the city of [GetProvince('(int32)4187').GetName|G] to his younger son [GetCharacter('(int32)84').GetName|Y], before finally laying to rest in 999 LC.\n\nWhile the #R Hobgoblins#! are united in the face of foreign hostiliy, centuries of isolation and distance has led them to divide themselves into complicated polities led by clans and blood-ties. With loyalties changing on a whim, true unity seemed like a distant dream until [GetCharacter('(int32)63').GetFirstName|Y] led his clan to war against all others, rewarding those loyal to him based on merit rather than on clan affiliation.\n\nLeft with a realm of disparate tribes only recently united, the great [GetCharacter('(int32)86').GetName|Y] will have to unite the #T Five Great Tribes#! and the #T Two Great Cities#! under one banner, and lead the many sons of #Y Melodias#! against the hostile peoples that exist beyond the #G Dragon's Pass#!. \n\nThe #R Hobgoblins#!, rumored to be a twisted mixture of #Y Elvish#! and #Y Goblinic#! blood, are a warlike and unruly people not united since the ascendance of the #Y Zalthu Clan#!. From the skilled horsemen of the #Y Urhuk#! clans, to the #Y Shoishoni#! mages of [GetProvince('(int32)4187').GetName|G], to the hardy mountain warriors of the #Y Jishani#! and #Y Ahualtzi#! peoples, their warbands are only matched by the organization and unity of more settled peoples. Should the #Y Zalthu#! be able to utilize their full strength, they could easily create a force able to conquer all of #G Morrigon#!, and make a name for themselves in the history of #G Omniluxia#!!" 
 lorestart.5.a: "The fate of Omniluxia is now in our hands."

 lorestart.6.t: "The Zarakens of Kyaxares"
 lorestart.6.desc: "Following the fall of the #R Zakara Kephal#! and the #G Sacking of [GetProvince('(int32)4662').GetName|G]#! in 946 LC, the once-mighty #Y Zarakens#! of the #G Eastern Foothills#! have been reduced to a mere imitation of their former empires. Now just a rump state restricted to their core territories, the few surviving members of the ancient #T House of Zakara#! are now left to rebuild their broken empire amidst the various hostile #Y Zainudians#! and nomadic raiders.\n\nSeen as heretics by the divided #Y Zinduidians#! for their friendly attitudes towards #T Helluvian#! merchants, the tolerant [GetCharacter('(int32)21').GetName|Y] now looks north for expansion and opportunities.\n\nShould this great king reclaim his people's empire, many believe he may try to return the #Y Zarakens#! to their roots, ridding them of the influence of the cursed prophets." 
 lorestart.6.a: "The fate of Omniluxia is now in our hands."

 lorestart.7.t: "The Cities of the Marenica Sea"
 lorestart.7.desc: "Having re-established their civilization after winning their freedom from the #R [GetCountry('EGA').GetName|Y]#! in 912 LC, the various #Y Illorian#! peoples of the #G Marenica Sea#! have only seen brief moments of independence ever since their conquest by the #Y Zani#! following the various #T Zani-Illorian Wars#!. However, they are not the only people alongside these picturesque coasts, as various #Y Halflings#!, #Y Geallians#!, #Y Werhenlanders#!, and even #Y Phanicians#! have made their homes near the #G Great Green Sea#!.\n\nThroughout the centuries the #Y Illorians#! have found themselves being pushed out of their homelands, first by the #Y Geallian#! settlers and later by free #Y Werhenlanders#!. In this environment, various ancient and new countries now vie for control of the lucrative #T Marenican Sea Trade#!.\n\nThe young [GetCountry('IT8').GetName|Y] thrives from their large cities and famous #T Acropolis#!, their merchants only rivaled by the less opulent and more warlike [GetCountry('ITC').GetName|Y].\n\nThe ancient cities of the #Y Aollans#! are once again independent, with great #Y Ioninna#! like [GetCountry('IP7').GetName|Y], [GetCountry('IP6').GetName|Y], [GetCountry('IP8').GetName|Y] once again free. Their ancient knowledge and traditions dying out, they may be the last bastion of true #Y Illorian#! traditions amongst a sea of foreigners.\n\nThe #T Shannah#! comfortably leads the #T Helluvian#! faith from his realm, the [GetCountry('IF3').GetName|Y]. Hoping to turn his religious power into political power, the new #T Shannah#! hopes to spread #T Helluvianism#! and his influence to pagan lands outside of the range of the #G Marenican Sea#!. Meanwhile, the final communities of #Y Old Believers#! remain at the fringes of the #Y Illorian#! world, clinging on to the beliefs of their ancestors.\n\nWhile the #Y Illorians#! squabble over their slice of the #G Marenican Sea#!, the incoming #Y Werhenlanders#! under Kingdoms such as [GetCountry('PW3').GetName|Y] and [GetCountry('PW0').GetName|Y] seek to expand their influence through force. Having driven the northern #Y Pollians#! to near extinction, their armies now march on the divided #Y Ullydian#! states of #G Yr-Marrenica#!, threatening the heartlands of the #Y Illorian#! peoples.\n\nMeanwhile, ignored by the major powers of the region, the small halfling county of [GetCountry('HF3').GetName|Y] has big dreams for the unification of the various realms of #G South Intermarenica#!.\n\nWith empires and barbarians on all sides, the one who manages to control this beacon of the civilized world may be able to create an empire to rival the #Y Zani#!!" 
 lorestart.7.a: "The fate of Omniluxia is now in our hands."

 lorestart.8.t: "The Zainudian World"
 lorestart.8.desc: "After the spectacular collapse of the unequal and cruel #R Zakara Kephal#! at the hands of the #T Great Zinduidian Revolt#! of 934 LC, the various #Y Zainudian#! faithful have splintered into their original tribal groups that preceeded the mighty #G Zi'had Kephal#!.\n\nWhile the #Y Zinduidian#! tribes squabble for amongst themselves, the emergent [GetCountry('KAF').GetName|Y] and crumbling [GetCountry('JRE').GetName|Y] pose a significant threat to the safety of the holy city of [GetProvince('(int32)4790').GetName|G]. Having recently overthrown foreign heretics, the #Y Zinduidians#! are fiercly hostile to those who would seek to emulate the #R Zakaran Kalifs#!. However, there remains hope that a #T Zinduidian Kalif#! will one day unite the #Y Zainudians#! under his rule, treating all equally and destroying the heretical #R Helluvians#!.\n\nWhile many look to the independent city of [GetCountry('ZTC').GetName|Y] for guidance, a warlord by the name of [GetCharacter('(int32)49').GetName|Y] has been expanding his realm with dreams of making his capital a city to rival [GetProvince('(int32)4790').GetName|G]'s splendor.\n\nTo the east lie the various #Y Zarakens#! peoples. Much like their #Y Zinduidian#! neighbors, they too were treated like second-class citizens under the rule of the empire of #T Daro Zakara#!. With the [GetCountry('ZAK').GetName|Y] once again looking to expand their influence, many of these smaller states have banded together to preserve their indepedence.\n\nWhoever comes out victorious in this power struggle will have the responsibility of nurturing and spreading the #Y Zainudian#! faith, as #T Zain'ud#! told the prophets:\n\n#R 'I am #T Zain'ud#! and my word is law, hear me now, this is my final message: Spread my word to the ends of this world, and tell the devoted to come and pray to me at this altar.#!' - The Second Revelation (Dacañan)" 
 lorestart.8.a: "The fate of Omniluxia is now in our hands."

 lorestart.9.t: "The Gold Dwarves"
 lorestart.9.desc: "After the collapse of the great #T Mâhdad Sho-Tan'Mâat Mâ'Azarî#! and the division of the #Y Gold Dwarven#! people, the various kingdoms of the #Y Gold Dwarven#! world have suffered repeated invasions and subjugations by foreign conquerers.\n\nFormerly owning much of #G Western Luxterra#!, always defeating the other two #T Mythic Dwarven Kingdoms#! in battle, their lands were slowly taken from them and their cities razed and lost to the sands of time. First by the invasions of the #T Old Dragkhans#!, then the #T Nomadic Dragkhans#!, followed by the #T Human Migrations#!, the #T Goblin Awakening#!, then the various #Y Human#! and recently #Y Dragkhanic#! empires, even the mighty #R Zani Empire#! are only a footnote in their vast history.\n\nHowever, it was this small footnote that would end the prosperous #T Golden Kingdom#!, known to us as the #T Mâkdid Sho-Tan Azarî#!, and destroy the great #T Etemenazari#!.\n\nNow our people once again face invaders who seek to take away our freedoms. No more, we say!\n\nThe #Y Gezari#! have united for the first time in their history, with the rival cities of [GetProvince('(int32)4438').GetName|G] and [GetProvince('(int32)4446').GetName|G] working together against the expansionist [GetCountry('KAF').GetName|Y].\n\nThe various #Y Azari#! kingdoms have recovered from the damage done by the #R Zakara Kephal#!, with some rumoring that the King of [GetCountry('AKK').GetName|Y] seeks to reclaim the #T Golden Kingdom#!.\n\n[GetCountry('YMH').GetName|Y] stands strong from the #G City of the Hammer#!, denying nomadic raiders entrace to the western kingdoms. However, their #Y Yamhadi#! brethren in the east aren't doing as well, eking out a living trading what spices remain after their yearly tribute to the powerful nomads on their borders.\n\nDespite what they have done to us, foreign religions tempt our people away from worship of the ancestors. In particular, word has spread that that the King of [GetCountry('KDM').GetName|Y] has adopted the religion of the #T One God#!, declaring that he shall help him reconquer the #G Baetep#! from the arrogant #Y Pharons#!!\n\nIn this time of great change, it is time for our people to once again rise and become conquerers like our ancestors, lest we become the subjugated." 
 lorestart.9.a: "The fate of Omniluxia is now in our hands."

 lorestart.10.t: "Children of the Silver Kingdom"
 lorestart.10.desc: "The #Y Silver Dwarves#! of #G Morrigon#! are possibly the oldest race on the continent. Emerging long before even the ancient #Y Goblins#! or #Y Elves#!, the oldest stories recount how they ruled much of #G Southern Morrigon#! during the #T First Kingdom of Srrørum#!, enjoying the relative peace and stability under the rule of the demi-god twins [GetCharacter('(int32)75').GetFirstName|Y] and [GetCharacter('(int32)85').GetFirstName|Y].\n\nHowever, the end of the #T Dwarven Golden Age#! marked the decline of their civilization, and it is said that the few remaining survivors were pushed back all the way to the homelands of the #Y Silver Dwarven#! people, the #G Green Valley#!. There, the few fractured clans fought amongst themselves over the former territories of the #T Silver Kingdom#!, ushering in millennia of unending wars that destroyed much of what was left of [GetCharacter('(int32)75').GetFirstName|Y]'s realm. Thousands fled the valley for the uncertainty of the outside world, and those that remained were forced to either participate in the fighting or submit to belligerent petty kings.\n\nThe endless bloodshed only ended during the great #T Unification Wars#! waged by the legendary king, [GetCharacter('(int32)76').GetName|Y]. From his castle at what would become [GetProvince('(int32)3883').GetName|G], the ambitious prince of #Y Duggmannri#! fought hundreds of spectacular battles to unite the #Y Anvindr#! under one banner. With the capture of the last pockets of resistance at [GetProvince('(int32)4048').GetName|G], [GetCharacter('(int32)76').GetFirstName|Y] was declared the great #Y Togg#! of the #T Second Kingdom of Srrørum#! in 610 LC.\n\nTales of the legendary 59 year reign of the #T God of War#! claim he connected and developed his kingdom, patronized the Order of Sennmoggen, ordered the construction of great works like Gerrbaen, and even defeated a #Y Zani#! army sent to subjugate him. Despite having to deal will several dissenting nobles, notably the infamous #T Prince Harttol#!, all #Y Anvindr#! Silver Dwarves grew to view him as the second father of their people. So beloved was he, that on the first full moon of every year every Silver Dwarf in the #G Green Valley#! takes a minute to participate in the #Y Thrygg#! to mourn his passing.\n\nIn the centuries since then the #G Green Valley#! has seen the rise and fall of many petty despots and cruel tyrants, however none have ever managed to restore the great kingdom of the #T True King#! since its dissolution following his death. From hundreds of principalities and city-states only six nations remain, maintaining a delicate balance of power: [GetCountry('SV1').GetName|Y], [GetCountry('SV3').GetName|Y], [GetCountry('SV5').GetName|Y], [GetCountry('SV6').GetName|Y], [GetCountry('SV8').GetName|Y], and [GetCountry('SV7').GetName|Y].\n\nAlthough they currently enjoy a moment of peace, war is inevitably on the horizon. The only way out of this period of warring states is the reunification of the #G Green Valley#! and the restoration of #G Srrørum#!, a feat so legendary only two figures in all of #Y Silver Dwarven#! history have been able to achieve it. Will the next great king of the #Y Anvindr#! be yours?" 
 lorestart.10.a: "The fate of Omniluxia is now in our hands."

 lorestart.11.t: "The Heirs of Jarenam the Formidable"
 lorestart.11.desc: "Whether adored or feared, it cannot be denied that the conquests of the great Qhagan #T Jarenam the Formidable Dragon#! have forever changed the political and cultural landscape of #G Western Luxterra#!\n\nFreeing many peoples who were under #Y Zanic#! rule for centuries such as the #Y Baetepians#! and #Y Phanicians#!, subjugating the #Y Esquelians#! with the help of #Y Eteradican#! auxiliaries, and accidentally setting the groundwork for the founding of the emergent [GetCountry('KAF').GetName|Y] in the west, the Empire at its height rivaled the grandness of even the #Y Zani#!.\n\nHowever, the collapse of #Y Jarenam#!'s legacy led to a moment of weakness, during which the various vultures big and small picked apart pieces of his empire for their own. The realm stabilized under the ascent of the cunning [GetCharacter('(int32)29').GetName|Y] in 998 LC, but the damage was already done.\n\nThe #Y Phanicians#! have carved out two rival kingdoms, eyeing up their comrades still under #Y Totrazi#! rule.\n\nThe [GetCountry('EGY').GetName|Y] took the opportunity to consolidate its power under the cowardly #Y Sertems#!, now seeking to make itself the strongest power in #G Western Luxterra#!. The #T Majarian Kingdom#!, ruled by former #Y Alaguric#! mercenaries of the [GetCountry('EGA').GetName|Y], now stand as nothing more than a symbol of this imperialist attitude towards the west.\n\nThe various #Y Esquelian#! and #Y Eteradicans#! of #G Central Bhaxnmrechtem#! have fought guerilla campaigns to harass and cripple the empire's ability to secure its own borders while also stoking the flames of ethnic uprisings within #Y Totrazi#! borders.\n\nThe #Y Gold Dwarves#! are too occupied with the reconstruction of their states, and the #Y Kaffarians#! and #Y Zinduidians#! to the east have no interest in #G Western Luxterra#! at the moment.\n\nRuling an unstable empire with enemies on all sides, [GetCharacter('(int32)18').GetName|Y] must find a way to save #Y Jarenam#!'s vision before the circling vultures descend on his crumbling state!" 
 lorestart.11.a: "The fate of Omniluxia is now in our hands."

 lorestart.12.t: "The Kingdoms Of Rohenoa And Rohevia"
 lorestart.12.desc: "The vast realms of [GetProvince('(int32)2222').GetArea.GetRegion.GetName|G] and [GetProvince('(int32)2818').GetArea.GetRegion.GetName|G] can be found north of the #G Rohanoan Mountains#!, the impassable range that separates their homelands from central #G Morrigon#!. The #G Rohenevian Peninsula#! is a chivalrous place, a land of Knights and Kings, of Lords and Ladies living in cities and castles, and there are hundreds of beloved songs and ballads recounting the heroic history of this region. The two strongest Rohenoan kingdoms, [GetCountry('BRE').GetName|Y] and [GetCountry('ARL').GetName|Y], dominate regional politics, and a clash between the two powers and their allies seems imminent. While many distrust the foreign culture of the Aralans, there are many that would see #G Aurezdun#! fall, for they have acquired many enemies since the #R Great Collapse#!." 
 lorestart.12.a: "The fate of Omniluxia is now in our hands."

 lorestart.13.t: "The Borderlands"
 lorestart.13.desc: "Centuries have passed since the #T Great Borderlander Revolt#! and yet the #Y Native Morrigonians#! to the west of the [GetCountry('WGA').GetName|Y] have not managed to unite, and have instead regressed to their traditional tribal lifestyles.\n\nHowever, all is not well in the #G Borderlands#!, as the #Y Northern Borderlanders#! face the wrath of invading #Y Orcish#! colonies said to be funded by the #Y Nazani#! to destabilize the region. The great backstab of the #Y Leslesi#! tribes has proved to be a grave mistake, as the re-emergent [GetCountry('SV2').GetName|Y] now looks to avenge their allies.\n\nIn the south, the #Y Marshlanders#! have enjoyed seven years of peace with the [GetCountry('WGA').GetName|Y] following their truce with Emperor [GetCharacter('(int32)18').GetName|Y]. However, this brief respite is soon to end, as rumors circulate that Emperor [GetCharacter('(int32)16').GetName|Y] of the [GetCountry('SOV').GetName|Y] plans to expand his empire into the lands of the #Y Marshlanders#!!\n\nWhatever this new milennia will throw at them, the resiliant #Y Borderlanders#! and #Y Marshlanders#! will be able to manage them, once again preserving thier people and heritage." 
 lorestart.13.a: "The fate of Omniluxia is now in our hands."

 lorestart.14.t: "The Snake Isles"
 lorestart.14.desc: "While some fortunate countries were untouched by the calamitous #R Great Collapse#!, the #G Snake Isles#! of the #G Ular-Pria#! were absolutely devastated by the ensuing earthquakes and tidal waves, and their Empire collapsed overnight in the utter destruction.\n\nIn the difficult years since those dark days, the Snakefolk have managed to rebuild their islands, with two rival cities, [GetProvince('(int32)5694').GetName|G] of [GetCountry('UP4').GetName|Y] and [GetProvince('(int32)5607').GetName|G] of the [GetCountry('UPJ').GetName|Y], struggling against each other for supremacy over the #G Austropetolian Archipelago#!. While their Empire is gone, the memory of their cruelty lingers in lands they once controlled, and many curse the Snakefolk and fear them to this day." 
 lorestart.14.a: "The fate of Omniluxia is now in our hands."

 lorestart.15.t: "The Island Of Eternal War"
 lorestart.15.desc: "The island of #G Arteon#! has suffered greatly for many centuries, perhaps moreso than any other place within #G Omniluxia#!, as #Y High Elven#! invasions from abroad and internal dissension between the settled human tribes have brought a state of eternal war to the island. The #T First Great War of Arteon#! and the expansion of the #Y High Elven Colonies#! resulted in the native Arteonians losing many of their coastal territories to High Elves, and native armies are gathering in the interior of the island for a campaign to retake these lands.\n\nIn this environment, the Alu-sarian half elves were born from the union of the fleeing pacifist #Y Alusian#! High Elves and the highland #Y Sarian#! tribes. Called 'Emra' by the xenophobic High Elves, this derogatory term is emblematic of their attitudes towards them - disgust and hostility. Living outside the reach of the hostile High Elven colonies, the major Half Elven communities of the region as well as neighboring Alusian and Sarian settlements have recently loosely united under King [GetCharacter('(int32)129').GetName|Y] of the [GetCountry('ALS').GetName|Y] Kingdom.\n\nMeanwhile, the aftermath of both the #T Second Great War of Arteon#! and the #T High Elven Civil War#! has meant that the newly independent colonies of the High Elves no longer had the support of their overlords, allowing the rise of the wealthy [GetCountry('MH1').GetName|Y].\n\nThe constant fighting between the major powers of the island allowed for the small city-state of [GetCountry('AR3').GetName|Y] to take over surrounding major cities such as [GetProvince('(int32)791').GetName|G] and [GetProvince('(int32)942').GetName|G]. Their esoteric King, [GetCharacter('(int32)130').GetName|Y] is rumored to be involved with numerous sightings of #R Vampires#! reported on the island.\n\nWith the coming of the #T High Elven Peace#! and the return of raids by the #T Great Slaver Navies#!, the tension on the island has only increased. Tens of thousands of soldiers have fallen in the battles between the various factions vying for control of the island, and the cities and ports are filled with ruthless mercenary companies selling their swords to the highest bidder, heartless slavers with thousands of chained thralls and cynical weapon dealers that sell to all sides involved in conflict - there is no escaping the violence on Arteon.\n\nWith the island split between the native [GetCountry('MH1').GetName|Y] and the High Elven [GetCountry('DMR').GetName|Y], the winner of this conflict will be decided by the reaction of the various minor players in this inevitable clash of cultures." 
 lorestart.15.a: "The fate of Omniluxia is now in our hands."

 lorestart.16.t: "Of Gnomes and Northerners"
 lorestart.16.desc: "For centuries the #Y Gnomes#! of #Y Kemi#! lived peacefully in their snow-filled environment, dedicating themselves to worship and the continuation of their culture and traditions. However, after the #R Great Collapse#! foreigners arrived on the shores of what they called #G Polaria#!. Initially greeting them with open arms, the #Y Gnomes#! learned to fear these new arrived as their people were pushed further into the ice by the waves of migrating #Y Northerners#!.\n\nHaving been pushed out of the fertile plains of the south, the #Y Gnomish#! clans met to decide the fate of their people. Many 'Saamskoo' decided to move north into the inhospitable glaciers where no #Y Polarian#! could reach them, while the remaining 'Jemskoo' were firm in their decision to stay and fight.\n\nHowever this battle was a losing one, and the short stature of the #Y Gnomes#! combined with their poor martial abilites meant that by 779 LC the #Y Polarians#! had pushed the divided clans into the harsh mountains and hills.\n\nHowever it was this year that the #G Taalvut Åkoo#! revealed himself to the desperate #Y Jemskoo#!. Teaching them the secrets of #Y Projection Magic#!, the #Y Gnomes#! now had their own giants that they could use against the foreigners. Instructed to build a magic school to teach this #Y Taanka Technique#! to their young mages, the #Y Gnomes#! have been able to greatly develop their magical capabilities in only a few generations.\n\nAt the turn of the milennia the #Y Gnomes#! of #G Polaria#! now find themselves united under the #Y Jemskoo#! king [GetCharacter('(int32)124').GetName|Y] and prepared to retake their homeland. In contrast, the last sons of the #R Northern Empire#! are divided into various squabbling clans, their greatest hope being the #Y Bear Hunters#! of [GetCountry('PS4').GetName|Y]. In this critical moment in #Y Polarian#! history, the fate of two peoples shall be decided once the first spark is lit." 
 lorestart.16.a: "The fate of Omniluxia is now in our hands."

 lorestart.17.t: "A Land of Fire and Ice"
 lorestart.17.desc: "While skirmishes between the #Y Horteonians#! and the native #Y Gnomes#! took place ever since the #T Horteonian Migrations#!, the #G Continent of Fire and Ice#! saw relative peace as the #Y Horteonians#!, #Y Eptelonians#!, and #Y Arteonians#! traded between themselves and even with the #Y Gnomish#! tribes.\n\nHowever, the landing of #T Atheus the Conquerer#!'s #T Great Slaver Fleet#! over two thousand years ago brought ruinous war to all those who lived in the #G Melodian Continents#!.\n\nThe various #Y Atheusian-Horteonian#! wars saw the borders change, with the #Y Horteonians#! suffering the same fate they inflicted onto the #Y Gnomes#!, retreating futher into the hilly interior of the continent.\n\nDespite this tragedy, hope revealed itself to the various human tribes in the form of the #T Great High Elven Civil War#!.\n\nSince the death of #T Atheus the Younger#! in 635 LC, his cousins [GetCharacter('(int32)33').GetName|Y] and [GetCharacter('(int32)125').GetName|Y] split the empire, only briefly pausing to recover their manpower following the #R Great Collapse#!, leading to the #T High Elven Peace#!. With both sides focusing on their lost colonies and each other, a united coalition of #Y Horteonian#! tribes might be able to kick out the invaders once and for all.\n\nMeanwhile, to the North, the neutral #G Gnomish Nookti Cities#! are beacons of civilization among the various nomadic #Y Gnomish#! clans. Should they decide to finally intervene, they might be able to create a better future for the native people of #Y Wuskouu#!!" 
 lorestart.17.a: "The fate of Omniluxia is now in our hands."

 lorestart.18.t: "The Star Lords"
 lorestart.18.desc: "The human civilizations that live around the #G Northstar Bay#! in eastern #G Luxterra#! are easily divided into two groups; the settled tribes of the plains and forests of [GetProvince('(int32)1849').GetArea.GetRegion.GetName|G] and the powerful Stellaric Republics centered around the #G Tayngvw Mountains#!. Ascendic High Elves have claimed a few territories on the coast, but they are too weak to challenge the Errnorfallians and remain in their citadels, watching and waiting for an opportunity to expand their holdings.\n\nLong ago, it is believed that strange #Y Visitors#! arrived in a falling #T Star from the East#! that crashed into the Bay, and the luminous gods that emerged from the waters taught the #Y Stellarics#! their faith and built them cities and castles, allowing them to consolidate power and dominate trade within the region." 
 lorestart.18.a: "The fate of Omniluxia is now in our hands."

 lorestart.19.t: "Descendants Of Edis"
 lorestart.19.desc: "The Copper Dwarves that live within the walled city of [GetProvince('(int32)3816').GetName|G] on the #G Skyreach Steppes#! have survived against all odds, barely holding out against the near-constant sieges by the neighboring #Y Goblin#! and #Y Selaskusian#! tribes that seek to avenge their ancestors and reclaim lost territory.\n\nHundreds of years ago, the bold explorer #T Edis the Grim#! managed to beat back his foes and build strong fortifications to keep them away, but his descendants have good reason to believe that their luck might be running out. Only time will tell as to whether or not the City will remain in the possession of the [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] dynasty." 
 lorestart.19.a: "The fate of Omniluxia is now in our hands."

 lorestart.20.t: "The Azari Dwarves"
 lorestart.20.desc: "The Golden Dwarves of [GetCountry('AKK').GetName|Y] once ruled over an extensive empire, the #T Mahdad Sho-Tan'Maat Ma'Azari#!, controlling large portions of territory throughout #G Western Luxterra#! and ruling as tyrants. Their cruelty was their undoing, for they were betrayed by their kinsmen and destroyed by the Zani Empire.\n\nIn an act of desecration that has never been forgotten, the armies of Zanis the Great destroyed the famed ziggurat #T Etemenazari#! in the Azari capital [GetProvince('(int32)4262').GetName|G] after a decade long siege. The heart of Azari civilization was methodically torn down, brick by brick, in a display of contempt and domination. A century of slavery passed before the Zani civil wars and the #R Great Collapse#! ravaged Luxterra, and although the Azari eventually rebuilt Tiuban and reconquered the hinterlands of their capital, the Dwarves yearn for the glorious days of the past." 
 lorestart.20.a: "The fate of Omniluxia is now in our hands."

 lorestart.21.t: "The Primeval Woods"
 lorestart.21.desc: "One of the most magical and ancient places within all #G Omniluxia#!, the [GetProvince('(int32)2228').GetArea.GetRegion.GetName|G] is home to the Waldonian Wood Elves that inhabit the Eldritch woods in the center of #G Luxterra#!. The Forests have not been polluted by cities of stone, for the Elves live in small settlements alongside nature, where they are able to commune with the spirits living deep within the World's Lungs Forest." 
 lorestart.21.a: "The fate of Omniluxia is now in our hands."

 lorestart.22.t: "Valley Of The Kinones"
 lorestart.22.desc: "Living within the [GetProvince('(int32)1654').GetArea.GetRegion.GetName|G], the Kinones are perhaps the most misunderstood of all races and religions living within #G Omniluxia#! - a reputation they have earned by keeping to themselves, although occasional adventurers leave the safety of their quiet valley to visit the hustle and bustle of the wider world.\n\nThe various Kinones #Y Clans#! are spread out across the various valleys and forests of the #G Peaceful Valley#!, all with different interests, rivarlies, and #Y Kino#!. However, all Kinones are united in their faith, and while the #Y Kino#! of each #Y B'au-B'au#! may differ, all submit to the will of #Y Kon#! and wish to improve the lives of their fellow kinsmen.\n\nThe great city of [GetProvince('(int32)1641').GetName|G] is the largest settlement of the Kinones, and has been built up and ruled over by the #Y White Faced Clan#! for the last century. Their urban lifestyle contrasts the traditional tight-knit communities that the Kinones are used to, however the manpower they command have made them the hegemons of the Kinones of the #G Central Valley#!.\n\nRivals of the #Y White Faced Clan#!, the #Y Mlo'n Clan#! rules from the #T House of Mlo'n#! that oversees the various villages of the western slopes of the #G Peaceful Valley#!. Isolated from the other tribes, their #Y Kino#! has been shaped primarily by the interests of the #Y Mlo'n Clan#!, who's expansionist views are justified as being for the 'betterment' of Kinones society. Their frequentment of the warpath has paid off in the form of territory, however, it has also made them many enemies, and united the various central and southern city-states against them.\n\nThe southern valleys are home to various city-states whose #Y Kino#! emphasizes trade, agriculture, and hospitality. As most foreign travelers arrive in this region, their #Y Kino#! has grown to become what the Kinones are known for, as these travelers fondly remember the warm hospitality and friendly culture shown to them by the #Y Sons of the South#!.\n\nThe north and east are home to Kinones who are more cold to foreigners, as raids by #Y Northlanders#! and #Y Deep Gnomes#! respectively have shaped their #Y Kino#! to prioritize the defense of the local families over the hospitality shown to foreigners.\n\nAlthough they currently enjoy the benefits of being ignored by the wider world, the various Kinones clans of the #G Peaceful Valley#! will be faced with various upcoming threats that may pose a danger to their entire society. Amongst the squabbling families, there are those that call for a #T Great League#!, where all Kinones work together under one #Y Kino#! to defend their way of life in a changing world."
 lorestart.22.a: "The fate of Omniluxia is now in our hands."

 lorestart.23.t: "The Blood-Stained Drow"
 lorestart.23.desc: "Over the last few decades, the #G Wild Northlands#! of eastern #G Luxterra#! have seen Drow elves emerge from deep underground to conquer new kingdoms. These believers of the dark #T Blood-Stained#! faith savagely conquered the unsuspecting tribes living by the Norrfalian Sea with ease - the humans could not imagine that armies would appear from the mountain caves and never prepared for the possibility.\n\nOnce the wars of conquest drew to their bloody conclusions, the Drow established kingdoms close to the mountains, and in the following years, their influence and religious beliefs spread far beyond their current borders. Many humans fear the Drow elves, and alliances have been formed to keep them at bay." 
 lorestart.23.a: "The fate of Omniluxia is now in our hands."

 lorestart.24.t: "The Bloody Isles"
 lorestart.24.desc: "The swamps and jungles of [GetProvince('(int32)2060').GetArea.GetRegion.GetName|G] and [GetProvince('(int32)1793').GetArea.GetRegion.GetName|G] are the traditional homelands of the Orcish tribes. While most Orcs live on the Bloody Isles, isolated from the rest of Morrigon, the few 'Gozen Orcs' who decided to leave their island homelands can be found all throughout Morrigon. Their services are in high demand as soldiers and mercenaries, for they are physically hearty and exceptional fighters, and it is not uncommon to find one within the personal retinues of Kings and Emperors throughout Omniluxia.\n\nWhile the two islands have a shared history and faith, the political and cultural development of the two diverged significantly following the fall of the Great Nuhargorkan. Rendunian Orcs have organized their society around the fortified #Y Nurago#! palaces of the noble #Y Egerya#!, and although their society is more stratified, their large urban settlements and port cities host the few foreigners allowed on Orcish soil. Western Remunian Orcs have adopted the ways of the Big Islanders, however, most Remunians live in clans that roam the various jungles, swamps, and mountains of the Holy Island, practicing traditions that predate the Great Nuhargorkan.\n\nThe dominant powers in the Orcish world are the Great Families at the helm of the #Y Nurhanuoragias#!. These great polities command great spiritual and martial power, however, they are also astute when it comes to maintaining their hegemony. Over the centuries, dozens of Nurhanuoragias have risen and fallen, and each Great Family knows that they must fight viciously to maintain their position at the top.\n\nOn Rendun, the [GetCountry('BT9').GetName|Y] and [GetCountry('BT6').GetName|Y] families have been ardent rivals for decades, having both risen from the ashes of the [GetCountry('BT5').GetName|Y] family, who once controlled the entirety of the south. To the north, the [GetCountry('BTI').GetName|Y] and [GetCountry('BTF').GetName|Y] families have made an uneasy alliance in an attempt to stop the incredible rise of the [GetCountry('ORC').GetName|Y] family. Once a minor noble family, the [GetCountry('ORC').GetName|Y] have seen explosive growth under M'Orokoro [GetCharacter('(int32)96').GetFirstName|Y], known as 'the Butcher' for his brutal methods of maintaining order. His secretive court is said to worship what they call the 'Black Flame', a barbaric belief that one's Inner Flame can only be regulated through consuming the flames of others. The only lands free from fuedal yoke are the free temples of the [GetCountry('BT4').GetName|Y] monks who reside in Opium Valleys. Due to the high cost of conquering these fearsome warrior-monks, many Nurhanuoragias instead choose to send their sons to learn from the various academies and temples across the monks' domains, further ensuring the independence of these wise holy men.\n\nAcross the sea, Remun is dominated by two families, the [GetCountry('BIG').GetName|Y] and the [GetCountry('BI6').GetName|Y]. Having originally come from Rendun, their superior technology, numbers, and political structure has allowed them to dominate the west coast of Remun. Bitter rivals, their expansion has been halted by a mutual distrust of the other and the thick jungles and mountains of the island that protect the native tribes.\n\nFinally, a small band of Orcish adventurers who have called themselves 'Gozon's Chosen' have been rallying the various clans behind their banner. While their aims are unknown, they certainly seem poised to uproot the control of the dominant Iparatai families.\n\nHaving been divided for centuries, the idea of a unified Orcish realm is a foreign concept to most Orcs of the Bloody Isles. However, with the world around them finally restoring order centuries after the Great Collapse, the prophesized Krozon may finally arrive!"
 lorestart.24.a: "The fate of Omniluxia is now in our hands."

 lorestart.25.t: "Sons And Daughters Of Cafea"
 lorestart.25.desc: "Although many Wood Elves have chosen to live underneath the sprawling canopy of the [GetProvince('(int32)2228').GetArea.GetRegion.GetName|G], there are many isolated pockets of Aneic faithful living within the Eldritch Forests that are scattered across all of Omniluxia. The peaceful Wood Elves desire nothing more than to walk undisturbed within their wooded realms, pray to Mother Cafea and tend to their forests, and for the most part, they are left alone by the other races living alongside them, who view their presence as an omen of good fortune." 
 lorestart.25.a: "The fate of Omniluxia is now in our hands."

 lorestart.26.t: "Tribes Of The Three Brothers"
 lorestart.26.desc: "Ages ago, the #Y Zerywani Hordes#! gathered under one banner and conquered across the entirety of #G Luxterra#!, bringing death and destruction to Empires and Kingdoms before returning to the vast plains that are their homes - their greatest moment, and the memory of their campaign still causes fright amongst the settled peoples living in the west.\n\nIn the years since these battles changed the political landscape of Omniluxia forever, the descendants of the Three Brothers #Y Zehi#!, #Y Rossovi#! and #Y Lechi#! have kept to their traditional territories, although the Western Zerywani have been moving their herds onto the steppes over the last few decades." 
 lorestart.26.a: "The fate of Omniluxia is now in our hands."

 lorestart.27.t: "The Werhenlanders"
 lorestart.27.desc: "#T Greater Werhen#! was once the easternmost province of the #T Zani Empire#!, and many famous generals, statesmen and inventors hail from the region. The #T Great Rebellion of the Werhen#!, an attempt by the locals to free themselves from Zani clutches, ultimately failed, but the wounds inflicted upon the #R Zani#! by the valiant #Y Werhenlanders#! would contribute to the Empire's collapse a century later.\n\nThe #R Great Collapse#! brought devastation and destruction to #Y Werhen#!, but it was the first taste of freedom for many, and the people have resisted unification ever since; a problem that has worsened because of meddling by their neighboring countries, especially the [GetCountry('EGA').GetName|Y]. And so the inhabitants of #Y Werhen#! continue to squabble with each other, their potential strength diluted by greed and suspicion. Petty warlords rule over duchies as self-styled 'Kings' and an ever-shifting network of alliances and defensive leagues has ensured that no one country becomes too powerful.\n\nFacing hostile #Y Illorians#! and #Y Geallians#! looking to expand their lands to their south and east as well as marauding #Y Northlanders#! pillaging their villages, the #Y Werherlanders#! have many challenges ahead of them." 
 lorestart.27.a: "The fate of Omniluxia is now in our hands."

 lorestart.28.t: "Eptelon"
 lorestart.28.desc: "The island of #G Eptelon#! has the great misfortune of being located close to both #Y Arteon#! and the #G Austropetolian Archipelago#!, and over the centuries, the native inhabitants have dealt with incursions by #T Arteonian#! raiders, #T High Elven#! invaders and #T Ular-Pria#! slavers. The settled tribes of the Eptelonians were once peaceful, desiring nothing more than to live quietly in their villages and worship the traditional gods of their homeland undisturbed, but their recent circumstances have made the islanders suspicious of all outsiders.\n\nThere are many cities on Eptelon; some built by the local tribes, and many others have been constructed by the Arteonians and High Elves. The best farmlands on the isle are located near the coasts and have been taken over by the foreigners, who have forced the Eptelonians deep into the marshes and mountains of the interior." 
 lorestart.28.a: "The fate of Omniluxia is now in our hands."

 lorestart.29.t: "The Central Omniluxian Isles"
 lorestart.29.desc: "Along the eastern coasts of #G Luxterra#!, there are stories shared by fishermen and sailors about a blue-skinned race of magical #Y Sea Elves#! that live on islands in the #G North Inter Sea#!, and while many laugh and dismiss these as old wives' tales, the existence of the Ioni-sir, Dori-sir and Coriti-sir Elves is no myth.\n\nThe undisputed masters of the waters, the Sea Elves have kept their affairs separate from the rest of Omniluxia for many hundreds of years. Contact between the Elves and the mainlanders happens only by design, never by chance, for their ships are simply too fast to overtake. Their origins are difficult to discern and their motivations remain unclear." 
 lorestart.29.a: "The fate of Omniluxia is now in our hands."

 lorestart.30.t: "Children of the Sands"
 lorestart.30.desc: "The #Y Upper Baetepians#! that have chafed under #R Zanic#! dominion for centuries now boil in outrage as their northern cousins are once again subjugated to foreign rule!\n\nThe silver-tongued #Y Sertem#! that have oppressed the #G Baetep#! for generations now return to rule them in earnest, continuing the Zanic tradition of suppressing the gods of [GetProvince('(int32)2805').GetName|G] that once liberated the #Y Baetepians#! from foreign rule and expanded their empire to become the greatest in #G Luxterra#!.\n\nHowever, there is still hope. The enduring [GetCountry('DUN').GetName|Y] under the #T True Pharon#! [GetCharacter('(int32)9').GetName|Y] have allied themselves to the rival [GetCountry('AGE').GetName|Y], finally setting their differences aside in order to free their land from the false god #R Zanis#! of the #R Geallians#!.\n\nWaiting for a moment of weakness in the fledgling [GetCountry('EGY').GetName|Y], the alliance plans to finally restore rightful #Y Djehid#! rule to the lands of the #Y Baetepian#! people!" 
 lorestart.30.a: "The fate of Omniluxia is now in our hands."

 lorestart.31.t: "The Five Tribes of Dzunge Duny"
 lorestart.31.desc: "The #Y Dzunge-dunylin Toçulkar#!, children of the great Sky God #Y Dzunge Duny#!, have for centuries lived at the periphery of the #R Geallian#! world, often raiding their more civilized neighbors as much as they raid each other. Fiercely independent, the divided #Y Duny#! were slowly forced to bend the knee to the #R Zani Empire#!, who pushed into their lands and settled their hunting grounds with foreign peoples.\n\nDuring the #T Great Invasions#! of the 650s, it seemed that the #Y Duny#! would become just another assimilated people within the great empire, however the heroic #Y Orçuz Gundogdu#! led the five tribes to victory against #R Zanic#! and #Y Selaskusian#! armies, buying the #Y Duny#! enough time for #Y Dzunge Duny#! to intervene. What the #R Geallians#! call the 'Great Collapse', the #Y Duny#! celebrate as the sky god punishing the encroaching #R Zani#! by clouding his realm with a great layer of smoke and shaking the earth as he rained thunderbolts upon the invaders. The weakened #R Zani#! were no match for the hordes of vengeful horsemen that razed many cities of the south, reclaiming their homelands and freedom.\n\nHowever, the five tribes grew complacent, and continued their nomadic ways while extoriting the southern #Y Ytalians#! for tribute in the form of grain and gold. Thus, while they squabbled amongst themselves for larger portions of tribute, the #R [GetCountry('EGA').GetName|Y]#! consolidated its power over the east. Once they fully recovered from the destructive #R Great Split of 690 LC#!, their armies began to march on the lands of the #Y Duny#!.\n\nOnce again it seemed that the sons of #Y Dzunge Duny#! would be destroyed by the #R Geallians#!, however, the sky god once again intervened to save his people. He sent the demon known to the #R Razani#! as #T Jarenam the Formidable Dragon#! to ravage their lands and divide their empire. Once again, the #Y Duny#! hordes descended on the edges of #Y Razani#! territory, and retook their lost lands.\n\nWhile the [GetCountry('GT1').GetName|Y] and [GetCountry('GT4').GetName|Y] are content with raiding the #Y Ytalians#!, the great chief of the [GetCountry('DNY').GetName|Y], [GetCharacter('(int32)26').GetName|Y], has bigger ideas for the five tribes. Learning from the oral histories, he's determined to break the cycle and ensure prosperity for the divided tribes. His tolerance of conquered people and adoption of their technologies has given him an edge over his rivals. His hosts have so far subdued the [GetCountry('GT3').GetName|Y] and integrated the #Y Teçuklar#!, and he now sets his eyes on the remaining two tribes who are alarmed at his rapid expansion.\n\nShould he be able to unite the #Y Duny#!, the children of #Y Dzunge Duny#! might escape the growing hordes of the south and find true prosperity."
 lorestart.31.a: "The fate of Omniluxia is now in our hands."

 lorestart.32.t: "Heirs of Cyrogelos"
 lorestart.32.desc: "The Kings of [GetCountry('YGA').GetName|Y] have been faithful subjects of the #T Zani Empire#! ever since the founding of their kingdom by #T Cyrogelos the Loyal#!. Located at the southern edges of the #Y Zani#! world, they are known as the defenders of the #G Golden Pathway#!, fighting off nomadic horsemen and goblin hordes, as well as maintaining order in the surrounding regions. Rivals of the warlike #Y Anaktorians#!, the #Y Ytalians#! are a bellicose people whose warriors and military culture laid the foundation for massive armies of the #T Zani Empire#!.\n\nAfter the #R Great Collapse#! the #Y Ytalians#! continued to serve the weakened [GetCountry('EGA').GetName|Y] loyally, protecting their south from #Y Duny#! and #Y Selaskusian#! hordes, while sending soldiers north to participate in wars against the #Y Illorians#!, #Y Etaredicans#!, and eventually the invading [GetCountry('JRE').GetName|Y].\n\nWith the death of King [GetCharacter('(int32)94').GetName|Y] came the question of succession. A friend of [GetCharacter('(int32)12').GetName|Y], [GetCharacter('(int32)94').GetFirstName|Y] enforce his overlord's policy of persecution towards the popular #T Helluvian#! faith, which had come to dominate large parts of eastern and southern #G Ytalia#!. Thus, when his son [GetCharacter('(int32)140').GetFirstName|Y] came to the throne, it came as a surprise when he promoted tolerance amongst the small kingdom, even pardoning and releasing his brother, [GetCharacter('(int32)139').GetName|Y], a devout #T Helluvian#!.\n\nDespite having abandoned his faith, [GetCharacter('(int32)140').GetFirstName|Y] still maintained the #T Cult of Zanis#! as the state religion to placate his overlord, who chafed at the disobediance shown by the young King. For many more radical believers, this was unacceptable. Rumors of rebellion now linger amongst isolated #T Helluvian#! communities, who scoff at the idea of the emperor in [GetProvince('(int32)2478').GetName|G] dictating the fate of their eternal souls.\n\nWith unrest building in the eastern regions, can [GetCharacter('(int32)140').GetName|Y] maintain control of his kingdom, or will #G Ytalia#! finally seek its own path free from #Y Zanic#! oppression?" 
 lorestart.32.a: "The fate of Omniluxia is now in our hands."

 lorestart.33.t: "Claimants of the Iron Crown"
 lorestart.33.desc: "Ever since King [GetCharacter('(int32)151').GetFirstName|Y]'s conquest of [GetProvince('(int32)1199').GetName|G], the #G Kingdom of Herue#! has been the most prominent player amongst the various warring Norrfalian tribes. Founded upon the ruins of the #Y Drow#! kingdom of Iolsim, #G Herue#! has stood as a bastion of #T Helluvianism#! and humanity against the hostile #Y Drow#! who thirst to avenge those fallen during the #Y Svardenni#!. However, the last few decades have brought this once-mighty kingdom to it's knees, and while her sons fight each other for possesion of the #T Iron Crown#!, the #Y Drow#! watch hungrily for a chance to reconquer their lost lands.\n\nIn the year 987 LC, King [GetCharacter('(int32)156').GetFirstName|Y], head of the renown #Y Walantidottir#! dynasty, died. While the crown is de jure passed onto an appointed heir, Herulian tradition consistantly affirms primogeniture, and since the days of [GetCharacter('(int32)151').GetFirstName|Y] the #Y Walantidottir#! have appointed their first-born as their heir. The deceased king broke this tradition, appointing his youngest son, [GetCharacter('(int32)158').GetFirstName|Y], as his primary heir, leaving minor duchies to his other sons.\n\nThose around the young king were known to say that he, 'would have been a better scholar than a ruler'. This sentiment led many to question his right to rule, and held weight amongst those who supported pretenders to the throne. The brothers [GetCharacter('(int32)160').GetFirstName|Y] and [GetCharacter('(int32)161').GetFirstName|Y] agreed to an alliance to make a play for the throne, and launched a rebellion the following year. By fall of 988 LC they had managed to take [GetProvince('(int32)1199').GetName|G] with the help of sympathetic nobles, banishing the disgraced king to [GetProvince('(int32)1303').GetName|G] with those few who still followed him. With victory all but assured the greedy brothers turned on each other, fracturing the realm once again.\n\nThis civil war sewed chaos across the north. Surrounding norfallian tribes took advantage of the infighting to raid and pillage Herulian lands, while many #Y Balthazarian Knights#! fought on all sides of the conflict, weakening the Order's authority. This came to a head when a large force of invading #Y Drow#! defeated a large host of Balthazarian Knights at the Battle of [GetProvince('(int32)1078').GetName|G] in 993 LC.\n\nThe #Y Drow#! ravaged the lands outside of their caves, spurring many norrfalians to take up their #T Blood-Stained#! religion, since the weakened Order could not save them. The brothers made a brief peace to combat this threat, winning a phyrric victory against the #Y Drow#! at [GetProvince('(int32)1228').GetName|G] in 996 LC that cost the experienced Grandmaster his life.\n\nWhile the #Y Walantidottir#! recovered from the battle, the last member of the #Y Docsjaldutson#! family, a cadet branch of the #Y Walantidottir#! dynasty, [GetCharacter('(int32)159').GetFirstName|Y] made his play for the throne. [GetCharacter('(int32)159').GetFirstName|Y] had won the hearts of the people as the head of the Crimson Army, made of veteran soldiers followed him to victory against the various invading tribes during the civil war, defending the borders of #G Herue#! while the #Y Walantidottir#! ravaged the realm. [GetCharacter('(int32)159').GetFirstName|Y] swiftly conquered [GetProvince('(int32)1199').GetName|G] and claimed the #T Iron Crown#! for himself. Recognizing the threat this outsider posed, the two #Y Walantidottir#! brothers once again formed an alliance to defend their dynasty's rightful lands. Seeking to avoid more bloodshed and knowing all sides in this conflict would be too distracted to stop them, the merchants of the port cities of [GetProvince('(int32)1331').GetName|G] and [GetProvince('(int32)1230').GetName|G] declared independence, ensuring that the inland towns of #G Herue#! would be cut off from the wider #Y Luxterran#! world.\n\nWith four claimants to the #T Iron Crown#! on the cusp of war, the [GetCountry('BLZ').GetName|Y] in disarray, and the #Y Drow#! preparing a larger, more organized invasion, only #Y Hellas#! knows the future of #G Norrfalia#!."
 lorestart.33.a: "The fate of Omniluxia is now in our hands."

