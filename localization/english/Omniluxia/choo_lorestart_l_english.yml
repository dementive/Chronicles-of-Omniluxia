 lorestart.45.t: "Heirs of the Shadowed Throne"
 lorestart.45.desc: "Deep beneath the bright world above, where root and rock swallow all but the faintest whisper of daylight, the #Y Tenmari#! have endured in caverns strung with witch-glow, vault-cities carved from the bones of the earth, and half-forgotten strongholds sealed behind doors no surface hand has opened in a thousand years. Their people are bound by old bloodlines thick as ore-veins, secret bargains sworn in blood and shadow, and a long, patient memory of every betrayal ever done to them - a memory that does not fade, only sharpens.\n\nNow the deep halls stir. Torches long banked flare back to life, and the covenants of an older age are read aloud once more by firelight. Some among the Tenmari would remain cloaked in darkness, content to guard their ancient vaults and let the surface world rot in ignorance of them. Others taste opportunity in the chaos of this changing age, and dream of leading their kin up through forgotten tunnels to reclaim what was stolen, and to settle old scores with rivals who thought them buried and gone. Whichever path they choose, the Tenmari will not remain a footnote for long - the deep is waking, and it remembers everything."
 lorestart.45.a: "The fate of Omniluxia is now in our hands."

 lorestart.46.t: "The Death of Zorgolis"
 lorestart.46.desc: "Protests and riots have erupted in the streets of [GetProvince('(int32)2478').GetName|Y] following the execution of [GetCharacter('(int32)129').GetName|Y], or #Y 'Zorgolis of Gevanni'#!, at dawn today. The crowds refuse to disperse and there have been numerous fires set throughout the streets of the capital - things are getting worse by the minute and could spiral out of our control.\n\nThe famed writer and orator spent his final years writing his memoirs in #G 'Tales from the Zanic Age'#! in a dungeon under charges of treason, sentenced to death after unsuccessfully agitating for land reforms to benefit soldiers returning from war. The common people demand justice, while the landed aristocracy, nervous about what they have already lost and vowing not to lose anything more, demands we maintain order with an iron fist. How shall we handle the public unrest in our capital?"
 lorestart.46.a: "Enact the Law Against Tyrants to appease the populace"
 lorestart.46.b: "Clear the streets by force! We must preserve imperial authority"
 lorestart.46.c: "Distribute cheap bread and grain to quiet the mobs"
 zorgolis_brutal_crackdown: "Brutal Crackdown"
 desc_zorgolis_brutal_crackdown: "In the wake of Zorgolis's execution, we used military force to clear the streets of Durobaeraste, asserting imperial dominance but sparking silent resentment among the lower classes."
 capital_unrest_crackdown: "Martial Law in Capital"
 desc_capital_unrest_crackdown: "Soldiers patrol the streets of the capital, suppressing riots through fear and force."
 capital_bread_dole: "Capital Grain Dole"
 desc_capital_bread_dole: "We are distributing cheap bread from state granaries, keeping the stomachs full and the streets quiet."

 lorestart.47.t: "The Unholy Pact of Arteon"
 lorestart.47.desc: "Behind the closed doors of our keeps, a dark and ancient secret binds the ruling families of [GetCountry('MH3').GetName|Y], [GetCountry('MH4').GetName|Y], and [GetCountry('AR7').GetName|Y].\n\nGenerations ago, our ancestors — three Arungdirong princes who were cousins — sought a way to secure their families' dominance over the war-torn lands of #Y Arteon#!. In their pursuit of supreme power, they met a mysterious #R Vampire Lord#! who offered them a dark covenant: power and eternal life in exchange for accepting his gift.\n\nBlindsided by greed, the three princes swore an ancient oath and accepted the curse and today, their bloodlines endure in our houses. We rule over the northern mountains of Arteon as vampires, preying upon the very subjects we are sworn to protect, bound by a mutual, unholy pact that has lasted for centuries."
 lorestart.47.a: "The blood is the life and it shall be ours."
 lorestart.48.t: "The Borderland Cities"
 lorestart.48.desc: "Across the muddy roads, timber river crossings, and palisaded market towns of the northern interior, the peoples of #Y Werhen#! and the nearby lowlands have spent generations learning the hardest lesson a small folk can learn: how to survive wedged between the boots of larger powers. Their cities may be small, walled with little more than earthworks and stubbornness, but they are loud with commerce, thick with ambition, and fiercely unwilling to bow - shaped in equal parts by grasping merchants, ink-stained scholars, hard-eyed militia captains, and a tangle of rival dynasties who trust their neighbors about as far as they can throw them.\n\nSome of these border realms cast their gaze south, courting trade and the false comfort of a stronger patron's shadow. Others swear that the old freedoms of the frontier - won in blood, kept by the sword - must be defended to the last palisade, whatever the cost. Whatever grand titles their rulers claim for themselves, every one of these towns carries the same scar tissue of border life: practical to the point of ruthlessness, suspicious of every stranger at the gate, and never, not for one season, fully at peace."
 lorestart.48.a: "The fate of Omniluxia is now in our hands."
 lorestart.49.t: "The Old North"
 lorestart.49.desc: "The #Y Norrfalian#! peoples have long made their home in a harsh and unforgiving land of black-timbered forests, iron-cold coasts, and old stone fortresses where memory is honed as sharp and kept as close as any blade. Their kingdoms are stitched together not by law but by ancient feuds passed down like heirlooms, by pious brotherhoods who guard their oaths as fiercely as their relics, and by a fierce, unshakeable conviction that the north belongs to northern hands alone, and always will.\n\nEven when they turn on one another - and they often do, with knives drawn over grudges older than their grandfathers - the people of the old north share a single unbending instinct: to endure the winter, to raid when the ice allows it, to rebuild what fire and axe have broken, and above all, to remember who wronged them, for generations if need be. That stubbornness, cold and patient as the frost itself, has carried them through harder ages than most southern chroniclers could ever imagine, or survive."
 lorestart.49.a: "The fate of Omniluxia is now in our hands."
 lorestart.50.t: "Frontier Peoples"
 lorestart.50.desc: "Not every King in #G Omniluxia#! was born beneath the gilded roofs of palaces and grand capitals. Some were forged instead upon the marshes, the fortified river crossings, and the long, wary centuries of living squeezed between stronger neighbors. These frontier cultures are practical to their bones, watchful as hawks, and resilient in ways softer folk cannot fathom, for their survival has always hinged on knowing precisely when to bargain, when to vanish into the hills, and when to bare steel and fight to the last furrow.\n\nTheir rulers may drape themselves in many grand and borrowed titles, but their subjects know the truer, harder lesson passed down at every hearth; on the frontier, every city is a shield raised against the dark, and every household, however humble, is one more stone in the wall that keeps the world at bay."
 lorestart.50.a: "The fate of Omniluxia is now in our hands."
 lorestart.51.t: "The Northern Tribes"
 lorestart.51.desc: "In the far north, where the wind cuts like honed flint and the sun itself seems to grow tired of the effort, survival has always depended on raw endurance, unbreakable kinship, and the willingness to wrest from the frozen land what it will not give freely. The tribes of the north are a hard, weathered people, cradled among howling winds, black pine forests, and long, merciless winters that starve out the weak and forge the stubborn into something harder than iron.\n\nTheir settlements may be scattered across the tundra and their laws no grander than a chieftain's word around a fire, but their people carry a shared memory of raids under the aurora, desperate migrations in times nearly forgotten, and survival wrung from odds that would break lesser folk. Whether they cling to the old rites of their ancestors or chase new and hungrier ambitions, the northern tribes never forget one hard truth; the world beyond their snowline shows no mercy, and neither, when pressed, should they."
 lorestart.51.a: "The fate of Omniluxia is now in our hands."
 lorestart.52.t: "Children of the Deep"
 lorestart.52.desc: "Far beneath the surface, past where roots give way to bare rock and the last sliver of daylight finally drowns, hidden communities have carved out entire lives from stone and shadow, sheltered from the sun and from the grasping empires that squabble over the world above. The deep-rift peoples are cautious by grim necessity, their strength built brick by brick through secrecy, endless tunnels, and the hard, unforgiving lessons that isolation teaches those who wish to survive it.\n\nSome cling fast to the old vault traditions, sealing their halls tighter with every passing generation, while others dream of clawing their way back into the wider world above, hungry for light and reckoning alike. All of them, whatever their persuasion, know the same iron truth carved into every deep threshold: in the dark places beneath the world, a nation survives only if it can adapt faster than its enemies can dig down to find it."
 lorestart.52.a: "The fate of Omniluxia is now in our hands."
 lorestart.53.t: "The Starfall Marches"
 lorestart.53.desc: "Along the northern frontier, where the sky hangs so close and vast that travelers swear they can hear it moving through the skies, the people of the old #Y Starfall#! lands have grown accustomed to living at the very edge of the known world - neither friend or foe to the city dweller nor the barbarian, but something in between. Their towns and holds are bound together not by comfort or plenty but by shared and constant danger, for invaders, howling storms, and rival claimants alike all seem to arrive together beneath the same bruised and starlit heavens.\n\nThese hardy communities are famed far beyond their frozen borders for their fireside hospitality, their stubborn and unyielding ways, and their peculiar habit of turning every fresh hardship into another verse of legend before the scars have even healed - they are truly a musical people, singing their dirges and ballads throughout the long winter nights. If any place in #G Omniluxia#! can outlast the turning of the age through sheer, bloody-minded will and long memory alone, it is this one."
 lorestart.53.a: "The fate of Omniluxia is now in our hands."
 lorestart.54.t: "Children of Two Bloods"
 lorestart.54.desc: "In #G Morrigon#!, there are people who fit neatly into no one's tidy story, no matter how each side tells it. Born of elf and human alike, the #Y Half Elves#! of the region have learned, out of necessity and no small amount of grace, to move between glittering courts, whispering forests, and rough-hewn border towns with equal ease.\n\nSome have embraced the old elven ways entirely, learning the long patience and older songs of their kin, others have taken wholly to the bustling customs of human settlements, and many more still have woven something wholly new from the threads of both. Their true strength has never been in blood alone, but in adaptation, in hard-won patience, and in the rare gift of surviving - and often thriving - in places where being merely ordinary was never once an option."
 lorestart.54.a: "The fate of Omniluxia is now in our hands."
 lorestart.55.t: "The Southern Isles"
 lorestart.55.desc: "From the sheltered coves to the wind-scoured, scattered islands of the far south, the island peoples have long made their peace with a simple truth: the sea is both road and wall, provider and executioner, and it answers to no one's crown. Trade, opportunistic raiding, the daily grind of fishing, and shipwright traditions passed down through calloused hands shape nearly every waking hour of their lives, while foreign visitors quickly learn - often the hard way - that every harbor keeps its own customs, and every island guards its own fierce and particular pride.\n\nSome of these salt-hardened communities have grown fat and gleaming with wealth hauled up from the water, while others cling white-knuckled to their independence against the covetous eyes of stronger mainland powers. Either way, the southern isles remain stubbornly, unmistakably themselves, bound together not by any crown or creed but by waves, wind, and the long memory of the tide."
 lorestart.55.a: "The fate of Omniluxia is now in our hands."
 lorestart.56.t: "Faiths of the Old World"
 lorestart.56.desc: "Not every faith in #G Omniluxia#! kneels beneath the towering domes of the great imperial temples or bows to the dominant creeds of the age. Across the continent, older and smaller traditions still endure, tucked into the cracks history forgot to seal: hearth cults tended by candlelight, mountain gods spoken to only in storm season, ancestral rites older than the nations that outlawed them, hidden pantheons worshipped behind false walls, and quiet schools of belief that have survived only by learning, again and again, how to bend without ever quite breaking.\n\nTheir followers are rarely bound together by politics or crown, but they share a common burden: the quiet indignity of being overlooked, dismissed, or hunted by the larger powers that claim dominion over their souls. Yet in times of true upheaval, when empires crack and their gleaming temples crumble to rubble, these stubborn, half-forgotten faiths have a curious habit of outlasting them all."
 lorestart.56.a: "The fate of Omniluxia is now in our hands."
 lorestart.57.t: "Children of the Zani Fringe"
 lorestart.57.desc: "Not all descendants of the #Y Zani#! dwell within the marble heart of the old empire, beneath its purple banners and its emperors' watchful gaze. Some have long since settled in salt-worn coastal colonies, muddy river cities, and mixed frontier towns far from the capital, where the old imperial customs have slowly frayed and rewoven themselves into something new, blended thread by thread with the ways of their neighbors. These distant offshoots still carry the bones of imperial discipline in how they build, how they judge, and how they pray, but far from the center's reach they are just as often forced to improvise, bending old law to fit local needs and newer, more immediate loyalties.\n\nTheir identity, then, is defined less by the empire that birthed them than by the sheer distance that now separates them from it: part inherited legacy, part stubborn reinvention, and always, unmistakably, shaped by the strange and distant lands they have since come to call home."
 lorestart.57.a: "The fate of Omniluxia is now in our hands."
 lorestart.58.t: "Peoples of the New World"
 lorestart.58.desc: "Beyond the crumbling old empires of #G Omniluxia#!, past the edges of every well-worn map, live peoples whose histories were carved not by emperors but by deep forests, storm-battered islands, strange and uncharted coastlines, and the long, stubborn isolation of the far reaches of the world. Some are ancient beyond reckoning, older than the empires that never noticed them. Some were remade entirely by migration, arriving as strangers and staying as something new. And some simply endured, quietly and fiercely, in places stronger powers never troubled themselves to reach.\n\nThough their customs differ as wildly as their homelands, they share one unshakable truth: the New World breeds resilience, and nothing less. Whether through half-forgotten magic, daring seafaring, shrewd trade, or sheer stubborn self-rule, these peoples have carved out their homes on the very edges of the known world - and dare anyone to come and take it from them."
 lorestart.58.a: "The fate of Omniluxia is now in our hands."
