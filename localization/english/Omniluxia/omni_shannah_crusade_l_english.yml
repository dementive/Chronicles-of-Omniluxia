l_english:
 omni_crusade_propose_tt: "Convene a council and choose between up to #Y three distinct eligible nearby countries#! as the target of a #T Omostthanat#!. We will confirm the chosen target before spending gold or political influence."
 omni_crusade_choose_target_tt: "Consider this country as the target of our #T Omostthanat#!. The next event lets us confirm the expedition or dismiss it at no cost."
 omni_shannah_transfer_tt: "Move our capital to #G Ddu-Nuinop#! and establish our ruler as the sole #T Shannah#!. Other holders lose the trait; their Shahanats become feudal monarchies. Their unlaunched Omostthanat campaigns are cancelled and refunded, while existing wars continue.\n\nOur first claim grants #Y 50 legitimacy#! and #Y 100 political influence#!. Former holders may reclaim the office after retaking the holy city, but do not receive those rewards again."
 omni_crusade_preparation_tt: "We will spend #Y 250#! gold and #Y 50#! political influence to prepare a #T Omostthanat#! over #Y 180 days#!. Eligible independent #T Helluvian#! countries will be invited to pledge military assistance, contribute gold in proportion to the Shahanat's size, or refuse.\n\nWe cannot call another Omostthanat for #Y 3,650 days#!, even if this expedition is cancelled. Only one Omostthanat may be prepared or conducted at a time."
 omni_crusade_pledge_tt: "We will promise to join the #T Shannah's Omostthanat#! when preparations are complete. We must still be independent, #T Helluvian#!, at peace, and free of conflicting alliances or truces when called.\n\nEntering the Omostthanat grants #Y Answered the Shannah's Call#! for #Y 5 years#!."
 omni_crusade_donate_tt: "The #T Shahanat#! will receive #Y [SCOPE.ScriptValue('omni_crusade_current_offering_svalue')|0]#! gold and improve its opinion of us. Our contribution will be returned if the Shahanat cancels preparation while it still exists."
 omni_crusade_launch_tt: "We will declare a #T Omostthanat#! for the target's capital province and raise the #Y Helluvian Omostthanat warriors#!. Eligible pledged countries will join our side. Territorial concessions must be secured through peace negotiations. After peace, clergy will visit up to #Y five conquered territories per day#!. In retained conquests, roughly #Y half#! of the non-Helluvian pops in original target territories held by the Shannah or Helluvian military supporters will embrace #T Helluvianism#!."
 omni_crusade_postpone_tt: "Keep our preparations, pledges, and offerings intact. The question of departure will return in #Y 30 days#!. We must be at peace and free of civil war before launching; the target must remain within diplomatic range and free of an alliance or truce with us."
 omni_crusade_briefing: "Review the Omostthanat"
 omni_crusade_briefing_desc: "Beneath the sacred banners, the names of those who answered our summons are read aloud. Some have offered their swords, others the gold that will sustain them. Before the faithful march, the #T Shannah#! must know whose vows will accompany them."
 omni_shannah_crusade_wargoal: "Helluvian Omostthanat"
 war_goal_omni_shannah_crusade_wargoal: "Helluvian Omostthanat"
 war_goal_omni_shannah_crusade_wargoal_desc: "The #T Shannah#! has called upon the faithful to take the enemy's capital province in the name of #T Hellas#!. What we secure in battle must still be defended at the peace table."
 omni_crusade_answered_call: "Answered the Shannah's Call"
 desc_omni_crusade_answered_call: "Our banners have joined the #T Shannah's#! host. In temples and humble homes alike, prayers follow those who have taken up the sword in the name of #T Hellas#!."
 omni_crusade_military_support: "Answered our Omostthanat"
 omni_crusade_financial_support: "Funded our Omostthanat"
 omni_crusade_refused_support: "Declined our Omostthanat"
 omni_crusade.1.t: "A Sword for Hellas"
 omni_crusade.1.desc: "Incense hangs beneath the vaults of [ROOT.GetCountry.GetCapital.GetName|G], and the last prayer has faded into silence. Before the assembled clergy lies a map of [SCOPE.sCountry('omni_crusade_target').GetName|T]. For days its borders have occupied their sermons; now they await the judgment of the one who claims to speak for #T Hellas#!.\n\nSome urge you to raise the sword, promising that the faithful will flock beneath your banners. Others speak more softly. The will of the #T Creator of All Things That Can Never Be Known#! is no simple thing to discern, and even a holy army leaves widows in its wake. Beyond the sanctuary, captains and ambitious lords wait for an answer of their own.\n\nA word from you will set six months of preparation in motion. Offerings will be gathered, messengers dispatched, and the rulers of the #T Helluvian#! world asked to stand beside you. Shall this neighboring realm become the object of a #T Omostthanat#!?"
 omni_crusade.1.a: "Let the faithful hear our summons!"
 omni_crusade.1.b: "The sword must wait."
 omni_crusade.2.t: "The Shannah Calls"
 omni_crusade.2.desc: "The doors of your hall open to admit a messenger from [SCOPE.sCountry('omni_crusade_actor').GetName|T]. He carries the #T Shannah's#! summons, and when its seal is broken the court falls quiet. A #T Omostthanat#! is being prepared against [SCOPE.sCountry('omni_crusade_target').GetName|T]. The faithful are called to offer their strength in the service of #T Hellas#!.\n\nThe priests gathered around your throne speak eagerly of sacred duty. Your captains look instead toward the men who would have to leave their fields, and the borders they would leave behind. An offering of gold might sustain the expedition without sending our own banners abroad; the #T Shannah's#! messenger will accept either pledge.\n\nThere is a third answer, though it will win little affection from those who issued the call. A ruler must answer for the living as well as pray for the souls of the dead. Will you take up the summons, my [ROOT.GetCountry.GetRulerTitle]?"
 omni_crusade.2.a: "Our armies will march in the service of #T Hellas#!."
 omni_crusade.2.b: "Let our offering sustain the faithful."
 omni_crusade.2.c: "Our people will bear no part in this war."
 omni_crusade.3.t: "The Faithful Await Our Word"
 omni_crusade.3.desc: "For six months, the summons has passed from temple steps to distant courts. Now the banners stand ready in [ROOT.GetCountry.GetCapital.GetName|G], their cloth stirring above a gathering of soldiers, pilgrims, and those who have come only to witness the departure. Prayers rise from the crowd as the clergy take their places.\n\nThe names of our supporters are read aloud: #Y [ROOT.GetCountry.MakeScope.Var('omni_crusade_pledge_count').GetValue|0]#! rulers have promised military aid, and #Y [ROOT.GetCountry.MakeScope.Var('omni_crusade_donor_count').GetValue|0]#! have sent offerings of gold. Whether every promise can still be honored remains uncertain. The affairs of mortal kingdoms have not stood still while we prepared for holy war.\n\nAt last, the chanting subsides. Those nearest you kneel, and the movement passes through the gathering like wind through grain. They await your word, Your Holiness. Will the swords of the faithful be drawn?"
 omni_crusade.3.a: "Let the banners of #T Hellas#! advance!"
 omni_crusade.3.b: "Lay down the banners. There will be no Omostthanat."
 omni_crusade.3.c: "Keep the banners ready. Our hour has not yet come."
 omni_crusade.4.t: "Beneath the Sacred Banners"
 omni_crusade.4.desc: "Our banners have joined the #T Omostthanat#!. In [ROOT.GetCountry.GetCapital.GetName|G], priests speak the names of those departing while their families crowd the roads to watch them pass. Some soldiers carry tokens pressed into their hands at the last farewell; others march with nothing but their weapons and the conviction that #T Hellas#! will remember their service.\n\nWe now stand beside the #T Shannah#! in war. Whatever awaits our armies beyond the border, the faithful will remember that we answered the call when it came. May their courage prove equal to their devotion, and may there be homes left for them to return to."
 omni_crusade.4.a: "May #T Hellas#! guide them home again."
 omni_crusade.5.t: "A Vow Unfulfilled"
 omni_crusade.5.desc: "The expedition is setting forth, but our banners will not accompany it. Since we gave our promise, the affairs of our country have placed obligations in our path that a vow to the #T Shannah#! cannot sweep aside. The word has gone out: our pledge will not bring us into this war.\n\nAt the temples, prayers once intended for our departing soldiers are offered instead for those who march without us. There will be no share in the honors granted to the countries that took up the summons. For now, the service we owe our own people must be enough."
 omni_crusade.5.a: "We have obligations of our own."
 omni_crusade.6.t: "The Banners Are Lowered"
 omni_crusade.6.desc: "One by one, the sacred banners are taken down. The call to arms has been withdrawn, and the crowds that gathered beneath them begin to disperse. Some depart in disappointment, others in a relief they are careful not to show before the priests. The #T Omostthanat#! will not march.\n\nOur own funds have been restored, the commitments made for the expedition released, and the offerings of surviving foreign benefactors returned. Yet a summons cannot be recalled as easily as a purse can be opened. Those who prepared to leave their homes will remember this day when another messenger asks them to do so.\n\nFor some years, the sword must rest. Whether the faithful name this restraint wisdom or weakness is a judgment beyond any decree of the #T Shannah#!."
 omni_crusade.6.a: "May they find peace on the road home."
 omni_crusade.6.faith: "#Y The expedition has ended because our country no longer follows the Helluvian faith.#!\n\n$omni_crusade.6.desc$"
 omni_crusade.6.independence: "#Y The expedition has ended because our country is no longer independent.#!\n\n$omni_crusade.6.desc$"
 omni_crusade.6.office: "#Y The expedition has ended because our current ruler does not hold the Shannah trait, or the throne is vacant.#!\n\n$omni_crusade.6.desc$"
 omni_crusade.6.target_lost: "#Y The expedition has ended because its intended target no longer exists as a landed country, or its recorded identity has been lost.#!\n\n$omni_crusade.6.desc$"
 omni_crusade.6.target_faith: "#Y The expedition has ended because the intended target has embraced the Helluvian faith.#!\n\n$omni_crusade.6.desc$"
 omni_crusade.6.target_subject: "#Y The expedition has ended because the intended target has become another country's subject.#!\n\n$omni_crusade.6.desc$"
 omni_crusade.6.declaration: "#Y The expedition has ended because its declaration did not produce a war against the recorded target under our leadership.#!\n\n$omni_crusade.6.desc$"
 omni_crusade.7.t: "The Offerings Returned"
 omni_crusade.7.desc: "The chest bears familiar seals. Within it lies the full offering we sent to sustain the #T Shannah's#! expedition, returned with word that the preparations have been abandoned. The offering made in hope of a holy victory has come home without ever crossing a battlefield.\n\nThe messenger offers thanks for our generosity, though he can promise no new departure. Our priests receive the news in silence. What was set aside for the swords of the faithful may now serve those who remained beneath our protection."
 omni_crusade.7.a: "There are faithful here who need our care."
 omni_crusade.8.t: "When the Summons Falls Silent"
 omni_crusade.8.desc: "The undertaking called forth by our summons has reached its end. No longer does the #T Shahanat#! lead the assembled faithful against the realm named in that first proclamation. The pledges that bound the expedition together are laid aside, and its story passes into the keeping of those who took part.\n\nThere will be sermons about these days, and songs whose telling grows grander with every hearth at which they are heard. There will also be quieter accounts, spoken by soldiers who remember faces more clearly than banners. #T Hellas#! alone may know the whole measure of what was done in his name.\n\nOur armies remain ours to command, and other wars may yet demand their service. The summons has fallen silent; the burdens of the #T Shannah#! have not."
 omni_crusade.8.a: "Let #T Hellas#! judge our deeds."
 omni_crusade.11.t: "The Swords of Hellas"
 omni_crusade.11.desc: "The proclamation is read, and the waiting ends. Across [ROOT.GetCountry.GetCapital.GetName|G], voices rise in prayer as the #Y Helluvian Omostthanat warriors#! gather beneath their standards. Steel catches the light between the ranks. Behind them stand those who have come to bless the departure, and those who cannot bear to watch it.\n\nOf the countries that pledged their armies, #Y [ROOT.GetCountry.MakeScope.Var('omni_crusade_join_count').GetValue|0]#! have entered the war beside us. Their rulers have taken up the cause; now their promises must endure the hardships of a campaign. No sermon can carry provisions, and no banner can hold a road without soldiers beneath it.\n\nYet the host marches with a conviction that needs no answering voice from heaven. The #T Shannah#! has spoken, the swords are drawn, and the faithful go forth in the name of #T Hellas#!!"
 omni_crusade.11.a: "May our deeds be worthy of his name!"
 omni_crusade.17.t: "The Omostthanat Begins!"
 omni_crusade.17.desc: "The time for promises has passed. The #T Shannah#! of [SCOPE.sCountry('omni_crusade_actor').GetName|T] has launched a #T Omostthanat#! against [SCOPE.sCountry('omni_crusade_target').GetName|T], and our country now stands among those caught in the war. Across [ROOT.GetCountry.GetCapital.GetName|G], the news travels faster than any marching army.\n\nIn the #T Shannah's#! temples, the expedition is proclaimed a sacred undertaking. Elsewhere, rulers call upon older loyalties, treaties, and duties that no holy summons can sweep aside. Whatever brought our banners into this struggle, the men who carry them must now face its dangers.\n\nThe priests may dispute what heaven desires. Our soldiers will learn what the enemy intends soon enough."
 omni_crusade.17.a: "Our banners are committed."
 omni_crusade.18.t: "A Omostthanat Against Us!"
 omni_crusade.18.desc: "The proclamation names our country. Before an assembly of the faithful, the #T Shannah#! of [SCOPE.sCountry('omni_crusade_actor').GetName|T] has called for a #R Omostthanat#! against us, blessing the swords that will be turned upon our people. What was once the subject of distant sermons has become a declaration of war.\n\nMessengers bring word of banners gathering beneath the name of #T Hellas#!. Those who march behind them are promised the honors of a holy undertaking; those who live in their path must wonder what mercy such certainty will leave them. In [ROOT.GetCountry.GetCapital.GetName|G], our own people look to their ruler for an answer.\n\nLet the #T Shannah#! speak of heaven. The roads to our cities, the strength of our walls, and the courage of those who defend them remain matters of this world. We must see that the invaders find no easy victory here."
 omni_crusade.18.a: "They will find us ready."
 omni_crusade.19.t: "A Holy War Abroad"
 omni_crusade.19.desc: "News of a #T Omostthanat#! has reached [ROOT.GetCountry.GetCapital.GetName|G]. The #T Shannah#! of [SCOPE.sCountry('omni_crusade_actor').GetName|T] has declared war upon [SCOPE.sCountry('omni_crusade_target').GetName|T], sending the faithful into battle beneath the name of #T Hellas#!. The summons has become a marching host.\n\nTravelers repeat accounts of sacred banners and crowded temples, though each telling seems to gather a few more soldiers than the last. In distant courts, rulers weigh what the expedition might mean for their neighbors. A holy war may begin with a sermon, but its consequences seldom remain within the lands named by the preacher.\n\nOur country has not entered this struggle. For now, we may watch its course from beyond the battlefield and wonder what sort of world will greet the survivors."
 omni_crusade.19.unfulfilled: "\n\nAlthough we once pledged military assistance, our present circumstances have kept that promise from bringing us into the war. Our banners remain outside the expedition."
 omni_crusade.19.a: "We shall watch what follows."
 omni_crusade.12.t: "Those Who Answered"
 omni_crusade.12.desc: "The names are read before you, each joined to a promise made in the service of the #T Omostthanat#!. There are #Y [ROOT.GetCountry.MakeScope.Var('omni_crusade_pledge_count').GetValue|0]#! pledges of military support and #Y [ROOT.GetCountry.MakeScope.Var('omni_crusade_donor_count').GetValue|0]#! offerings of gold. Of those who promised their swords, #Y [ROOT.GetCountry.MakeScope.Var('omni_crusade_join_count').GetValue|0]#! have entered the war at our side.\n\nBehind every seal lies a different hope. One ruler seeks the favor of #T Hellas#!, another the affection of the faithful, and another perhaps sees a crown made greater by the glory of a distant campaign. Their reasons are their own; it falls to the #T Shannah#! to decide what can be accomplished with the strength they offer.\n\nWhile preparations continue, the summons may still be recalled and its offerings returned. Once the host has taken the field, its fate must be met there."
 omni_crusade.12.a: "Read the roll of those summoned."
 omni_crusade.16.t: "The Roll of the Faithful"
 omni_crusade.16.header: "\n#Y Names [ROOT.GetCountry.MakeScope.Var('omni_crusade_roster_first').GetValue|0]–[ROOT.GetCountry.MakeScope.Var('omni_crusade_roster_last').GetValue|0] of [ROOT.GetCountry.MakeScope.Var('omni_crusade_roster_index').GetValue|0]#!\n"
 omni_crusade.16.row_1: "\n[SCOPE.sCountry('omni_crusade_roster_row_1').GetName|T]"
 omni_crusade.16.row_2: "\n[SCOPE.sCountry('omni_crusade_roster_row_2').GetName|T]"
 omni_crusade.16.row_3: "\n[SCOPE.sCountry('omni_crusade_roster_row_3').GetName|T]"
 omni_crusade.16.row_4: "\n[SCOPE.sCountry('omni_crusade_roster_row_4').GetName|T]"
 omni_crusade.16.row_5: "\n[SCOPE.sCountry('omni_crusade_roster_row_5').GetName|T]"
 omni_crusade.16.next: "Read the next names."
 omni_crusade.16.previous: "Return to the previous page."
 omni_crusade.16.back: "Return to the Omostthanat report."
 omni_crusade.16.close: "That will be all."
 omni_crusade_status_joined: "#G Entered the Omostthanat.#!"
 omni_crusade_status_pledged: "#Y Pledged military support; awaiting departure.#!"
 omni_crusade_status_unfulfilled: "#Y Pledged support, but did not join through that pledge.#!"
 omni_crusade_status_donated: "Contributed gold instead of pledging troops."
 omni_crusade_status_refused: "#R Declined the summons.#!"
 omni_crusade_status_pending: "Awaiting a reply."
 omni_crusade_status_unanswered: "No reply before departure."
 omni_crusade_roster_empty_tt: "No surviving countries are recorded in this category."
 omni_crusade.12.b: "Recall the summons and return the offerings."
 omni_crusade.14.t: "Another Takes the Sacred Seat"
 omni_crusade.14.desc: "From #G Ddu-Nuinop#! comes a proclamation bearing the authority we once claimed as our own. The ruler of [SCOPE.sCountry('omni_shannah_claimant').GetName|T] has taken the #T Shahanat#!, and our rule over the faithful has come to an end. The sacred title will no longer pass to our successors.\n\nThere are still lands to govern and subjects who await our commands. Any war already begun must find its own conclusion, but the preparations for an expedition that had yet to march have been recalled and its funding returned.\n\nShould we recover the holy city, we may claim the seat again. Until then, another voice speaks in the name of #T Hellas#!."
 omni_crusade.14.a: "The holy city may yet be ours again."
 omni_crusade.15.t: "Before the Sacred Council"
 omni_crusade.15.desc: "Maps lie open beneath the lamps, their borders half concealed by the hands of those gathered around them. Beyond these lines are temples raised to other gods, rulers who will never bow to the #T Shannah#!, and lands that some among the clergy already imagine beneath our banners.\n\nEach voice offers a different road for the faithful. One speaks of the glory to be won, another of the dangers along the march, and another of the souls that might be brought into the embrace of #T Hellas#!. Yet no finger upon a map can command the host to rise.\n\nThat judgment belongs to you. Which of the realms laid before the council shall we consider for a #T Omostthanat#!?"
 omni_crusade.15.a: "Let us consider [SCOPE.sCountry('omni_crusade_candidate_1').GetName|T]."
 omni_crusade.15.b: "Let us consider [SCOPE.sCountry('omni_crusade_candidate_2').GetName|T]."
 omni_crusade.15.c: "Let us consider [SCOPE.sCountry('omni_crusade_candidate_3').GetName|T]."
 omni_crusade.15.d: "There will be no summons today."
 omni_crusade.90.t: "An Earlier Omostthanat Is Recalled"
 omni_crusade.90.desc: "The earlier summons is recalled. Those who had begun preparing for the expedition must lay aside their plans, and the wealth committed to its departure is to be released. There will be no host marching beneath those promised banners.\n\nSome will ask why the call was ever given. Others will be grateful that a farewell need not become a parting. For now, the #T Shahanat#! must recover what it set aside and allow the faithful time before asking them to assemble again."
 omni_crusade.90.a: "Release what was pledged to the expedition."

 omni_crusade.20.t: "A Shadow upon Our Gates"
 omni_crusade.20.desc: "Word has come from [SCOPE.sCountry('omni_crusade_actor').GetName|T]: the #T Shannah#! has named our lands for a #R Omostthanat#!. The banners have yet to march, but messengers already carry the summons through the courts of the faithful.\n\nWe have #Y 180 days#! before the appointed departure, though their preparations may falter or be delayed. Let our own riders seek those who would stand beside us, lest we face the gathering storm alone."
 omni_crusade.20.a: "Send riders to our allies and neighboring courts."
 omni_crusade.20.b: "We shall make our own preparations."
 omni_crusade.21.t: "Before the Holy Storm"
 omni_crusade.21.desc: "An appeal has reached our court from [SCOPE.sCountry('omni_crusade_target').GetName|T]. The #T Shannah#! is gathering a #R Omostthanat#! against them, and they ask that our swords stand beside theirs when the host arrives.\n\nTheir messenger lays no treaty before us, only a plea against the coming war. Our promise would bind us to this defense alone; if the summons is recalled, so too is our pledge."
 omni_crusade.21.a: "They shall not face the host alone."
 omni_crusade.21.b: "Our swords must remain at home."
 omni_crusade.22.desc: "The replies lie beneath their several seals. Choose the company whose names you would read."
