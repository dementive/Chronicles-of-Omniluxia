 omni_crusade.22.joined: "#Y Entered the sacred host#!"
 omni_crusade.22.defense_joined: "#Y Entered the defense#!"
 omni_crusade.22.unfulfilled: "#R Military pledges not fulfilled#!"
 omni_crusade.22.other: "Read defensive replies and war entries."
 omni_crusade.23.desc: "Here are the answers to the defensive appeal and the names of those who have taken the field. A pledge is a promise; only entry into the war makes it fulfilled."
 omni_crusade.24.desc: "Our clerks keep the replies to our appeal against [SCOPE.sCountry('omni_crusade_actor').GetName|T]. Promised swords will be called when the #T Omostthanat#! begins, provided their rulers remain free to honor their word."
 omni_crusade.24.roll: "Read the defensive replies."
 omni_crusade_defense_briefing: "Review the Defense against the Omostthanat"
 omni_crusade_defense_briefing_desc: "Send an appeal while the #T Shannah#! prepares, or read the replies of those asked to stand beside us."

 omni_crusade.25.open: "Read who has taken the field."
 omni_crusade.25.desc: "Promises now meet the test of war. These rolls distinguish those who entered the struggle from those whose pledges remain unfulfilled."
 omni_crusade.25.back: "Return to the defensive replies."
 omni_crusade.22.defense_unfulfilled: "#R Defensive pledges not fulfilled#!"

 omni_crusade.8.conversions: "\n\nWhere our banners have remained, the bells now summon new voices to prayer. Across #Y [ROOT.GetCountry.MakeScope.Var('omni_crusade_conversion_territories').GetValue|0]#! conquered territories held by the faithful, #Y [ROOT.GetCountry.MakeScope.Var('omni_crusade_conversion_pops').GetValue|0]#! pops have embraced #T Hellas#!. The swords have fallen silent; the work of the altars has begun."

 omni_crusade.8.conversion_queue: "\n\nThe swords have won their ground; now the clergy follow. Missions will spread through #Y [ROOT.GetCountry.MakeScope.Var('omni_crusade_conversion_pending').GetValue|0]#! conquered territories over the coming days, carrying the prayers of #T Hellas#! beneath our settled banners. A report will follow when their work is done."
 omni_crusade.27.t: "Bells beneath New Banners"
 omni_crusade.27.a: "Let the new faithful be welcomed."
