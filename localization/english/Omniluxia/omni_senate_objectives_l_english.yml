l_english:
 omni_senate_objectives.7.desc:0 "Ever eager to tighten their grip on the [ROOT.GetCountry.GetAdjective] ship of state, the [sen_obj_len_ter_gen_party.GetName] have brought a bill to the [SCOPE.Custom('get_court_type')] which will extend the term of the sitting [ROOT.GetCountry.GetRulerTitle], thereby keeping power in the hands of one [ROOT.GetCountry.GetRuler.GetWomanMan] for longer. Their majority is sure to pass the motion, unless the sitting [ROOT.GetCountry.GetRulerTitle] has any objections."
