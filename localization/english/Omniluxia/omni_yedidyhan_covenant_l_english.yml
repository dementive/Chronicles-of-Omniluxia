l_english:
 omni_yedidyhan_covenant_effect_tt: "#Y Offer the blood-curse to an adult courtier. At#! #Y 70 loyalty#! #Y or higher, they accept and become a#! #Y Vampire#! #Y after#! #Y 30 days#! #Y if the fever runs its course. Otherwise they lose#! #R 10 loyalty#! #Y for#! #Y 3 years#!#Y . Making the offer starts a#! #Y 5-year#! #Y cooldown for your country. No mana or spell point cost.#!"
 omni_yedidyhan_covenant.1.t: "Yedidyhan's Covenant"
 omni_yedidyhan_covenant.1.desc: "When [SCOPE.sChar('selected_mage').GetName|Y] sent for [SCOPE.sChar('target').GetName|Y] after supper, the servants left two cups and a jug at the table. By the time the lamps in the passage were put out, the wine was still standing where they had set it, and the courtier had begun to ask why the door was barred.\n\nThe vampire has a room ready with shutters that can be fastened from inside. If the courtier takes the covenant, there will be a fever first, and the household will have to be persuaded to leave food at the door and keep its questions for the morning. There is still time to call for the wine and let the courtier go home."
 omni_yedidyhan_covenant.1.a: "Tell [SCOPE.sChar('target').GetPraenomen] what the fever will cost."
 omni_yedidyhan_covenant.1.a_tt: "$omni_yedidyhan_covenant_effect_tt$"
 omni_yedidyhan_covenant.1.b: "Unbar the door and finish the wine."
 omni_yedidyhan_covenant.2.t: "When the Fever Broke"
 omni_yedidyhan_covenant.2.desc: "For a month the servants left a tray at the door of [SCOPE.sChar('target').GetName|Y], and each evening they carried it away as full as when it came. This morning someone had drawn the bolt from within, and the servant who went to open the shutters found the courtier standing behind the door, asking when the sun would set.\n\nThe household has been told that the fever broke during the night. There are duties waiting at court, and the servants want to know which of them can be moved until after sunset. They have already taken the supper tray away."
 omni_yedidyhan_covenant.2.a: "Have the courtier attend us after sunset."
 omni_yedidyhan_covenant.3.t: "The Cup Left Full"
 omni_yedidyhan_covenant.3.desc: "[SCOPE.sChar('target').GetName|Y] heard what [SCOPE.sChar('selected_mage').GetName|Y] had to offer and asked for the door to be opened. The courtier made it as far as the outer passage before a servant remembered the cloak left beside the table. By then there was nobody at the gate to take it.\n\nWhen the cloak was sent back in the morning, the household took it at the door and sent the messenger away. There has been no answer to the summons to court."
 omni_yedidyhan_covenant.3.a: "Let the matter rest."
 loyalty_omni_yedidyhan_covenant_refused: "Refused Yedidyhan's Covenant"
