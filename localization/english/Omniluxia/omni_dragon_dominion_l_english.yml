 omni_dragon.12.t:0 "The Draconic Throne at [SCOPE.sP('omni_dragon_herald_seat').GetName|G]"
 omni_dragon.12.desc:0 "The news came down the high road on a mule with singed ears. Its rider, a salt trader out of [SCOPE.sP('omni_dragon_herald_seat').GetName|G], had not slept in three days and would not sit down now. He stood in the hall with his hat crushed in both hands and told it plainly: the garrison had yielded, the old banners had come down, and there was a #T Dragon#! on the throne of [SCOPE.sP('omni_dragon_herald_seat').GetName|G]. It had a crown. It had a queen. It had a name, [SCOPE.sChar('omni_dragon_herald_king').GetFirstName|Y], which the heralds there had already learned to say without flinching.\n\nHe had seen the coronation himself. The beast lay across the citadel steps with its tail down the whole length of the market street, while the magistrates filed past one at a time to set their seals between its claws. It listened to every oath. When the last was sworn it yawned, and the trader swore the heat of that yawn took the bloom off every orange in the square. The new realm calls itself [SCOPE.sC('omni_dragon_herald_realm').GetName|Y]. Its envoys have not reached us yet, but [ROOT.GetCountry.GetRuler.GetName|Y]'s counselors are already shouting over one another about what we will say when they do."
 omni_dragon.12.a:0 "Light the signal fires on every ridge that faces [SCOPE.sP('omni_dragon_herald_seat').GetName|G]."
 omni_dragon.12.b:0 "Send a cart of silver and a very polite letter. Dragons like both."
 omni_dragon.12.c:0 "A lizard in a hat. Tell the market to stop gossiping."
 omni_dragon_vigil:0 "Dragonwatch"
 desc_omni_dragon_vigil:0 "Signal fires stand stacked and dry on every ridge, the garrisons sleep in their boots, and the fort masons are paid double to raise the walls a little higher."
 omni_dragon_dread:0 "Dragon Dread"
 desc_omni_dragon_dread:0 "Every shadow on the hills is a wing. Farmers keep a cart half-packed by the door, and the tax collectors find a great many houses empty when they call."
