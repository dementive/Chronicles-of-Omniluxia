l_english:
 # New World racial heritages (auto-generated)
 saurthi_heritage: "Heritage of the Moss-Walkers"
 saurthi_heritage_desc: "The Saurthi are fierce nomads that are most at home in the deep forests and swamps. These coldblooded hunters stalk the woods and fetid fens as ranger-scouts, moving unseen through paths that no warmblood can follow. Their patrols range far and their arrows fly true, yet their pale constitution keeps their numbers ever thin and their armies slow to replenish."
 tsaalan_heritage: "Heritage of the Shifting Dunes"
 tsaalan_heritage_desc: "The Tsaalan read fate in the dunes and ride them as easily as the sea. Their riders are swift and their oracles ever ready to justify a new conquest, but a wandering people lay down few roots from which to draw taxes."
 vothkin_heritage: "Heritage of the Deep Holds"
 vothkin_heritage_desc: "The Vothkin carve their cities into the bones of the world, binding oaths in stone and blood. Their deep-holds are nigh impregnable and their veins of ore run rich, but beneath the open sky their columns march slow and ill at ease."
 ulvenar_heritage: "Heritage of the Moonhowl"
 ulvenar_heritage_desc: "The Ulvenar packs answer the silver moon, and a chief rules only so long as the pack still howls his name. Their hunters are ferocious and their hosts brave, but their proud war-leaders are forever testing the strength of those above them."
 tenmari_heritage: "Heritage of the Jade Throne"
 tenmari_heritage_desc: "The Tenmari built the first cities of jade and gold and have not forgotten the art of empire. They bind conquered peoples swiftly into the fold and grow rich on the trade of a hundred provinces, but so sprawling a realm is wearied easily by long wars."
