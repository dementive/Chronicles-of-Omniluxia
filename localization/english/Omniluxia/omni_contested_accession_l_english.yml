l_english:
 omni_cacc.10.t:0 "A Name Restored to the Register"
 omni_cacc.10.desc:0 "The envoys of [SCOPE.sCountry('omni_cacc_contester').GetName|T] arrived at [ROOT.GetCountry.GetCapital.GetName|G] with their banners furled and a letter sealed in the presence of three witnesses, since their ruler [SCOPE.sChar('omni_cacc_contester_ruler').GetName|Y] wished no one to say afterward that the words had been altered on the road. The letter acknowledges the #Y Shannah#! [SCOPE.sChar('omni_cacc_shannah_ruler').GetName|Y] as the spiritual head of the #T Helluvian#! faithful, and the clerks of the Shahanat have already found the empty place beside their name and filled it.\n\nThe priests who preached patience through the campaign are now preaching that #T Hellas#! settled the question on the field, and few in the city are inclined to argue with them. Other rulers who left their own places empty will have heard how this one was filled, and some of them will be rereading their letters."
 omni_cacc.10.a:0 "Enter their name and ring the bells."
 omni_cacc.10.effects_tt:0 "The Shahanat gains #G +5 Authority#!. [SCOPE.sCountry('omni_cacc_contester').GetName|T] now recognizes the Shannah, which ends the #T War of Contested Accession#! casus belli between our realms."
 omni_cacc.11.t:0 "The Seal We Withheld"
 omni_cacc.11.desc:0 "When the peace was signed, the envoys of the Shahanat set one more document beside it, and our negotiators understood that they would not be allowed to leave without our seal on both. We have recognized the #Y Shannah#! [SCOPE.sChar('omni_cacc_shannah_ruler').GetName|Y] of [SCOPE.sCountry('omni_cacc_shannah').GetName|T], and the place we kept empty in the register at Ddu-Nuinop now carries our name.\n\nThe priests who urged us to defy the accession are quieter than they were, although several of them have let it be known that a seal pressed under duress weighs less in the eyes of #T Hellas#! than one given freely. The court can take some comfort in that, while the treasury counts what the war has cost us."
 omni_cacc.11.a:0 "Seal it, and let the priests say what they like."
 omni_cacc.11.effects_tt:0 "We now recognize the Shannah of [SCOPE.sCountry('omni_cacc_shannah').GetName|T]. The #T War of Contested Accession#! casus belli between our realms has ended."
 omni_cacc.12.t:0 "The Question Left Open"
 omni_cacc.12.desc:0 "The war against [SCOPE.sCountry('omni_cacc_contester').GetName|T] has ended without the submission the #Y Shannah#! [SCOPE.sChar('omni_cacc_shannah_ruler').GetName|Y] meant to win from it, and the terms our envoys carried home say nothing at all about the register. Its ruler [SCOPE.sChar('omni_cacc_contester_ruler').GetName|Y] still refuses the accession, and that refusal now has a peace treaty behind it.\n\nPreachers in distant temples have begun to ask, carefully, whether #T Hellas#! would have let His chosen servant lose. The palace clerks answer that providence works over longer spans than a single campaign, but the bishops who once hurried to Ddu-Nuinop are taking their time about the next journey."
 omni_cacc.12.a:0 "We will answer them another year."
 omni_cacc.12.effects_tt:0 "The Shahanat loses #R 5 Authority#!. [SCOPE.sCountry('omni_cacc_contester').GetName|T] continues to contest the accession."
 omni_cacc.13.t:0 "The Empty Place Defended"
 omni_cacc.13.desc:0 "The Shahanat sent its armies to put our name into the register, and our soldiers sent them home without it. The peace we have signed with [SCOPE.sCountry('omni_cacc_shannah').GetName|T] demands nothing of our faith, and the #Y Shannah#! [SCOPE.sChar('omni_cacc_shannah_ruler').GetName|Y] must go on governing the faithful with our place beside his seat still empty.\n\nOur priests are delighted to report that the bishops in Ddu-Nuinop sound less certain than they did before the war. Our envoys are less delighted, because an office that has been shamed in public has every reason to try again when its armies are rested."
 omni_cacc.13.a:0 "Let them keep looking at the empty place."
 omni_cacc.13.effects_tt:0 "The Shahanat of [SCOPE.sCountry('omni_cacc_shannah').GetName|T] loses #R 5 Authority#!. We continue to contest the accession."
