l_english:
 # Pureon treasure art ported from Invictus; lore is Omniluxia-original.
 treasure_omni_rain_shrine_nivdall:0 "Rain-Shrine of Nivdall"
 treasure_omni_rain_shrine_nivdall_desc:0 "A squat tower of mortared fieldstone, no taller than a child, with a window cut in each side so that #T Nivdall#! can look out over every field at once. The farmers of #G Ginlean#! carry it to the edge of the barley each spring, and when the rains come late the oldest woman of the village sleeps beside it until they arrive."
 treasure_omni_gilded_axe_dimnas:0 "Gilded Axe of Dimnas"
 treasure_omni_gilded_axe_dimnas_desc:0 "A broad double-bladed axe of beaten gold over an iron core, far too soft to split anything harder than a wedding loaf. The #Y Duny#! chieftains of #G Isernes#! once swore their oaths to #T Dimnas#! with a hand on its haft, until a feud between two clans ended with the axe buried in a barrow that neither side would admit to knowing. Guild companies still dig in the hills above the town on the strength of old drinking songs."
 treasure_omni_spearhead_spear_wind:0 "Spearhead of the Spear Wind"
 treasure_omni_spearhead_spear_wind_desc:0 "A long iron leaf, polished until it rings when the wind crosses its edge. The wardens of the #Y Southwatch#! say it was the first point fixed to a shaft after #T The Spear Wind#! taught their ancestors to hold the passes, and that it went over the wall with a commander who never came back. They pay a standing bounty for it, and they have paid out on eleven forgeries."
 treasure_omni_graven_face_edis:0 "Graven Face of Edis the Grim"
 treasure_omni_graven_face_edis_desc:0 "A bearded face cut from the red stone of the #G Var-Gloliba#! deeps, scowling as though its carver had disappointed it. The masons of #Y Zedgg#! set it above the gate of each new hold until the walls are finished, so that #T Edis the Grim#! may judge whether the work deserves his blessing."
 treasure_omni_copper_aegis_usreva:0 "Copper Aegis of Usreva"
 treasure_omni_copper_aegis_usreva_desc:0 "A round shield of hammered copper with a sunburst boss, once polished each morning by acolytes of #T Relios#! in the palace court of #G Usreva#!. It was carried out of the city during a siege that nobody won, and the #Y Usrevani#! have been buying back its rivets one at a time from peddlers ever since. The rest of it is still out there, presumably holding the rivets' absence against them."
 treasure_omni_marble_youth_rren:0 "Marble Youth of Rren"
 treasure_omni_marble_youth_rren_desc:0 "A white marble bust of a curly-haired youth whose name was chipped from the plinth long before the #Y Lisintheon#! governors took #G Rren#!. The city's scholars argue whether he is a young #T Wishtheon#! or merely the son of some sculptor's patron, and both sides bring their students to sketch him while they argue."
 treasure_omni_throne_idol_gorcaetha:0 "Throne-Idol of Gorcaetha"
 treasure_omni_throne_idol_gorcaetha_desc:0 "A painted clay figure of #T Gorcaetha#! seated in a winged chair, her lap left hollow to hold the first seed of each harvest. The forest elves of #G Venerurich#! repaint her robes red every seventh year, and the family that mixes the pigment is excused from that season's labor tithe."
 treasure_omni_pearl_tithe_idol:0 "Idol of the Pearl Tithe"
 treasure_omni_pearl_tithe_idol_desc:0 "A tall sea-goddess hung from shoulder to knee with rows of carved shell beads, one added for every boat that has come home to #G Mazos#! with its tithe. #Y Mazonian#! divers who return empty-handed touch the oldest strand for luck, and the priests say the idol has grown heavier by a full hand's weight in living memory."
 treasure_omni_mask_great_hunt:0 "Mask of the Great Hunt"
 treasure_omni_mask_great_hunt_desc:0 "A snarling cat-face of fired clay with holes bored at the temples for a leather cord. The #Y Munthzali#! of #G Asen#! pass it to whoever led the season's greatest kill, and that hunter wears it through the feast of #T Emzal#! while the others recount the chase in turn."
 treasure_omni_horseman_csebe:0 "Horseman of Csebe"
 treasure_omni_horseman_csebe_desc:0 "A small figure of a crowned rider, worn smooth at the horse's muzzle where generations of #Y Samoyi#! riders have rubbed it before the spring muster. The herdsmen of #G Csebe#! insist that the rider is the first of their khans, and that the horse beneath him has never once been allowed to face west."
 treasure_omni_coiled_stand_euryal:0 "Coiled Stand of Euryal"
 treasure_omni_coiled_stand_euryal_desc:0 "Three serpents of gilded bronze wound into a single column, their heads splayed outward to hold a bowl that has long since been lost. The #Y Uriyalok#! priests of #G Siznl#! still burn oil in a clay dish set between the open jaws, and read the will of #T Euryal#! in the way its smoke climbs the coils."
 treasure_omni_winged_guardian_atis:0 "Winged Guardian of Atis"
 treasure_omni_winged_guardian_atis_desc:0 "A crouching beast with a woman's face and a hawk's wings, carved from a single block of pale stone for the gate of #G Atis#!. When the city was rebuilt after a flood, the masons refused to set a new lintel until the guardian was back on her plinth, and the gatekeepers still salute her before opening the doors at dawn."
 treasure_omni_helmed_bust_aara:0 "Helmed Bust of Aara"
 treasure_omni_helmed_bust_aara_desc:0 "A marble bust of #T Aara#! with her crested war-helm pushed back from her brow, as the #Y Atheusian#! sculptors show her once the battle is already won. The magistrates of #G Ussonbrifhaerme#! hang a fresh wreath on the helm whenever a dispute is settled without bloodshed, and the plinth beneath is crowded with dried ones."
 treasure_omni_dancer_thesrilpon:0 "Dancer of Thesrilpon"
 treasure_omni_dancer_thesrilpon_desc:0 "A marble girl caught mid-turn with one arm thrown overhead, her skirts carved so thin that lamplight passes through them. The #Y Ioni-sir#! of #G Thesrilpon#! hold that she was carved from life during the first festival of the harbor, and the city's dancers are still judged by whether they can hold her pose for a full verse."
 treasure_omni_golden_vikatora:0 "Golden Vikatora of Gamzudaon"
 treasure_omni_golden_vikatora_desc:0 "A winged figure of #T Vikatora#! in gold leaf over cedar, her arms spread as she alights upon a victory. The #Y Gamza#! carry her before the army only when the king himself takes the field, and the soldiers of #G Gamzudaon#! count it an ill omen to march home without a fresh scrap of enemy cloth tied at her feet."
 treasure_omni_stele_summsir:0 "Stele of Summsîr"
 treasure_omni_stele_summsir_desc:0 "A round-topped stone tablet showing #T Summsîr#! enthroned between two smaller figures who offer him ingots. The #Y Azari#! merchants of #G Edkedat'#! leave a single coin in the cleft beneath it after every profitable venture, and the temple clerks record each one in a ledger older than the city walls."
 treasure_omni_boundary_stone_pileser:0 "Boundary Stone of Pileser"
 treasure_omni_boundary_stone_pileser_desc:0 "A squared block of limestone cut on every face with the rights of land, water and tunnel that the first #Y Pileseri#! lords granted to their clans. Disputes in #G Nidiabtit#! are still settled by reading it aloud, and when its wording proves unclear the judges rule for whichever party the carver was least likely to have liked."
 treasure_omni_lamp_bearer_gozon:0 "Lamp-Bearer of Gozon"
 treasure_omni_lamp_bearer_gozon_desc:0 "A bronze figure of #T Gozon#! holding up a crown of small lamps on long stems, so that the god seems to walk beneath a cluster of stars. The #Y Pililuocu#! smiths of #G Tharros#! light it whenever a new forge is first fired, and an apprentice may not strike iron until he has trimmed every wick without burning his fingers."
 treasure_omni_founders_frieze_sampan:0 "Founders' Frieze of Sampan"
 treasure_omni_founders_frieze_sampan_desc:0 "A weathered marble slab showing a crowd laying the first stones of #G Sampan#! while a robed priest of #T Zanis#! marks the boundary with a plough. The #Y Ozomon#! say that every family of the old city can find its ancestor somewhere in the press of bodies, though no two families agree on which figure is theirs."
 treasure_omni_glass_reliquary_pouirruipa:0 "Glass Reliquary of Pouirruipa"
 treasure_omni_glass_reliquary_pouirruipa_desc:0 "A gilded box on lion's feet, its lid set with a pane of green glass through which pilgrims may see a worn leather sandal. The #Y Herulian#! priests of #G Wamannyk#! say it belonged to #T Pouirruipa the Follower#!, who walked behind #T Helluvius#! for twelve years and never once asked where they were going."
 treasure_omni_bone_carvings_pala_anga:0 "Bone Carvings of Pala'anga"
 treasure_omni_bone_carvings_pala_anga_desc:0 "A bundle of figures carved from whale bone, each no longer than a finger and each showing a goblin carrying some burden on its head. The #Y Ta'ata#! storytellers of #G Var-Nofi#! lay them out in a row and recite the debt each ancestor paid off before the next figure may be picked up."
 treasure_omni_bull_cauldron_lakhnghasgh:0 "Bull Cauldron of Lakhnghasgh"
 treasure_omni_bull_cauldron_lakhnghasgh_desc:0 "A great round cauldron of riveted bronze with a bull's head cast on its rim, large enough to stew three oxen at once. The #Y Derbican#! lords of #G Lakhnghasgh#! fill it at every clan gathering, and a guest who refuses its broth is understood to have come looking for a quarrel."
 treasure_omni_hand_sxossathar:0 "Hand of Sxossathar"
 treasure_omni_hand_sxossathar_desc:0 "A bronze hand raised in blessing, its palm and fingers crawling with tiny cast serpents, beetles and other creeping things. The #Y Isoluwis#! of #G Cruzhorrs#! say #T Sxossathar#! speaks through every small thing that crawls, and a petitioner who wants an answer must sit with the hand until something living climbs onto it."
 treasure_omni_oath_cup_akge:0 "Oath-Cup of Akge"
 treasure_omni_oath_cup_akge_desc:0 "A shallow golden cup on a tall stem, dented at the rim where a drunken prince once bit it to prove the gold was real. The #Y Kaffarian#! nobles of #G Akge#! pass it round when they take service with the crown, and each drinks only water from it, since the #T Musings#! warn against oaths sworn in wine."
 treasure_omni_clay_hound_lula:0 "Clay Hound of Lula"
 treasure_omni_clay_hound_lula_desc:0 "A stubby terracotta hound with its ears pricked and a hole through its belly where a cord once passed. Children of #G Thuzal#! are taught that #T Lula#! sent it to watch the gates while the wolves were away hunting, and the city watch still sets it on the wall above the north gate each night."
 treasure_omni_golden_ancestor_gurhak:0 "Golden Ancestor of Gurhak"
 treasure_omni_golden_ancestor_gurhak_desc:0 "A small standing figure of solid gold, his beard and robe picked out with a fine punch and his face rubbed featureless by centuries of devoted thumbs. The #Y Yamhadi#! of #G Gurhak#! say he was the first of their line to strike a vein below the mountain, and no new mine is opened until his image has been carried to its mouth."
 treasure_omni_peaked_helm_aydar:0 "Peaked Helm of Aydar"
 treasure_omni_peaked_helm_aydar_desc:0 "A tall conical helm of bronze, its point drawn up to resemble the horn of a drake, with a band of pale script running round the brim. The #Y Kharesmian#! khans of #G Aydar#! wore it to receive the submission of rival clans until one of those clans stopped submitting and took the helm with them into the steppe. The script is said to list every clan that knelt before it, and the last name is scratched out."
 treasure_omni_moon_collar_jelenia:0 "Moon-Collar of Jelenia"
 treasure_omni_moon_collar_jelenia_desc:0 "A crescent collar of beaten gold, worked in rows of tiny grains so that it glimmers like moonlight on a river. Among the #Y Rossovii#! of #G Lyuboml#! it is worn by the bride of the reigning prince on her wedding night alone, after which it returns to the shrine of #T Jelenia#! until the next marriage."
 treasure_omni_sarcophagus_ahun:0 "Sarcophagus of the Ahun Kings"
 treasure_omni_sarcophagus_ahun_desc:0 "A heavy limestone coffin carved along each side with a procession of mourners, its lid resting on four crouching beasts. The #Y Tosepian#! priests of #G Ahun#! keep it empty, for the first king refused to lie in it until his people had built him a city worthy of the tomb, and he died before the work was done."
 treasure_omni_oath_altar_lairgeathkor:0 "Oath-Altar of Lairgeathkor"
 treasure_omni_oath_altar_lairgeathkor_desc:0 "A squared altar of grey stone, its four faces carved with warriors who grip each other's forearms in the old greeting. The #Y Cathiarax#! chiefs of #G Lairgeathkor#! settle their feuds across it, and the price of breaking an oath sworn here is fixed by the elders before the oath is spoken, so that no one may claim he did not know."
 treasure_omni_mead_bowl_saptabi:0 "Mead-Bowl of Saptabi"
 treasure_omni_mead_bowl_saptabi_desc:0 "A deep silver bowl, scratched inside with the runes of every guild that has drunk from it at a hall-feast in #G Saptabi#!. The #Y Galmar#! fill it with dark mead whenever a new deep is opened, and the last guild to have its rune scratched in must buy the next barrel."
 treasure_omni_silver_idol_xyella:0 "Silver Idol of Xyella"
 treasure_omni_silver_idol_xyella_desc:0 "A slender silver figure of a cloaked woman, one hand lifted as though calling across a great distance. The #Y Ostyakie#! of #G Dasayeva#! hold that #T Xyella#! calls out to any hunter lost in the snow, and a hunter who comes back from such a night is never asked to repeat what he heard."
 treasure_omni_disc_first_sowing:0 "Disc of the First Sowing"
 treasure_omni_disc_first_sowing_desc:0 "A bronze disc cast with a ring of linked dancers circling a single bound sheaf. The #Y Waldonian#! farmers of #G Gjaranir#! bury it in the first field each autumn as a gift to #T Thanda#! and dig it up at the first warm rain, and they judge the coming harvest by how deeply the roots have wound across its face."
 treasure_omni_gilded_walker_fihataam:0 "Gilded Walker of Fihataam"
 treasure_omni_gilded_walker_fihataam_desc:0 "A striding figure in gilded bronze, one foot forward and one hand raised as though he has just called a halt to a column of travelers. The #Y Niavan#! of #G Fihataam#! set him at the crossroads on market days, and every merchant who passes beneath his hand pays a copper to the temple of #T Qhateus#!."
 treasure_omni_bronze_watchman_jaegerwald:0 "Bronze Watchman of Jaegerwald"
 treasure_omni_bronze_watchman_jaegerwald_desc:0 "A dark bronze warrior in a short tunic, his spear long since lost and his empty fist still closed around its shaft. The #Y Werter#! foresters of #G Jaegerwald#! stand him at the edge of the trees whenever the woodcutters work far from the village, and they have never lost a crew while he kept the clearing."
 treasure_omni_oath_taker_arsiemtskhe:0 "Oath-Taker of Arsiemtskhe"
 treasure_omni_oath_taker_arsiemtskhe_desc:0 "A pale stone figure with one arm raised and the palm turned outward, as a witness stands while an agreement is spoken aloud. The #Y Iwuregan#! of #G Arsiemtskhe#! conclude every contract of land or marriage before him, and anyone who breaks such a contract may not pass the statue again without paying a fine to its keepers."
 treasure_omni_sun_wagon_norrkia:0 "Sun-Wagon of Norrkia"
 treasure_omni_sun_wagon_norrkia_desc:0 "A little bronze horse drawing a gilded disc on six spoked wheels, made to be rolled across the floor of a hall from east to west. The #Y Alveconian#! of #G Norrkia#! roll it once at midwinter, and if it reaches the far wall without toppling the elders declare that the sun has agreed to return."
 treasure_omni_bull_rider_yarus:0 "Bull-Rider of Yarus"
 treasure_omni_bull_rider_yarus_desc:0 "A bronze god standing upright on the back of a charging bull, an axe in one hand and a thunderbolt in the other. The #Y Xazalars#! of #G Huyidid#! say #T Yarus#! rode the storm into the steppe this way, and the riders of every clan muster beneath his image before a raid."
 treasure_omni_golden_bough_sidhwenthal:0 "Golden Bough of Sidhwenthal"
 treasure_omni_golden_bough_sidhwenthal_desc:0 "A spray of oak leaves and acorns hammered from gold so thin that it trembles at a breath. The #Y Waldonian#! elders of #G Thalddeme#! crown each new lord of the wood with it, and every leaf was beaten from the gold of a different family, so that the bough carries the assent of the whole forest."
 treasure_omni_spearman_stone_mikgard:0 "Spearman Stone of Mikgard"
 treasure_omni_spearman_stone_mikgard_desc:0 "A grey slab carved in low relief with a warrior holding his spear upright beside him. The #Y Kosrfalie#! of #G Mikgard#! believe it marks the place where the first captain of their town fell, and recruits must stand beside it through a night in the cold before they are given spears of their own."
 treasure_omni_clay_hawk_balthazaria:0 "Clay Hawk of Balthazaria"
 treasure_omni_clay_hawk_balthazaria_desc:0 "A clay hawk with its wings spread flat, its belly hollowed to hold water and its beak bored to let it run out in a thin stream. The brothers of #G Balthazaria#! use it to time the watches on the towers, and the keeper who lets it run dry is assigned the next watch himself."
 treasure_omni_burden_bearer_var_ki:0 "Burden-Bearer of Var-Ki"
 treasure_omni_burden_bearer_var_ki_desc:0 "A stooped bronze figure with his arms lifted over his head and his back bent beneath a weight that is no longer there. The #Y Dureban#! of #G Var-Ki#! set him at the foot of every new pillar as a vow to #T Axjun#!, reminding the masons that a hall stands only so long as someone is willing to carry it."
 treasure_omni_medallion_quva:0 "Medallion of Quva"
 treasure_omni_medallion_quva_desc:0 "A heavy bronze medallion struck with the face of #T Quva#! crowned in leaves, the last coin of a mint that no longer exists. The money-changers of #G Iasanatesbri#! keep it in the scale-house and weigh the first coin of each new striking against it."
 treasure_omni_champion_narbolia:0 "Champion of Portua Narbolia"
 treasure_omni_champion_narbolia_desc:0 "A blackened bronze wrestler, his arm cocked to throw and his face twisted in a grin that shows every tusk. The #Y Turisi#! of #G Portua Narbolia#! wrestle for the right to oil the statue before the summer games, and the winner's name is scratched into the plinth with a nail."
 treasure_omni_shrine_plate_lierin:0 "Golden Shrine-Plate of Lierin"
 treasure_omni_shrine_plate_lierin_desc:0 "A pointed gold plaque framing a seated figure of #T Lierin#! with her hands folded in her lap. The #Y Busukwi#! of #G Gimaprld#! nail it above the door of whichever house has most recently lost a child, so that #T Lierin#! will know where her care is needed."
 treasure_omni_seated_senut:0 "Seated Senut of Emkhasut"
 treasure_omni_seated_senut_desc:0 "A clay figure of #T Senut#! sitting stiffly upright on a block throne, painted in the black and red of the river silt. The women of #G Emkhasut#! bring her a small loaf on the morning they learn they are with child, and the temple bakers grind the stale loaves into flour for the poor."
 treasure_omni_laughing_mask_nallarra:0 "Laughing Mask of Nallarra"
 treasure_omni_laughing_mask_nallarra_desc:0 "A grinning clay mask with a bulbous nose and a gaping mouth, made for an actor who had to be heard from the back row. The #Y Lidyan#! players of #G Dda-Lonrurruim#! let only the eldest of their company wear it, and he alone may mock the governor from the stage without fear of a fine."
 treasure_omni_marble_herald_niakov:0 "Marble Herald of Niakov"
 treasure_omni_marble_herald_niakov_desc:0 "A slender marble youth with a lyre in the crook of one arm and his other hand raised to quiet a crowd. The #Y Werhenssian#! elves of #G Niakov#! say he stood in the square before the city had a name, and that the first heralds learned to read proclamations by copying his posture."
 treasure_omni_bust_little_mayor:0 "Bust of the Little Mayor"
 treasure_omni_bust_little_mayor_desc:0 "A plump marble bust of a solemn young halfling, carved for a mayor of #G Bad-Doin#! who was elected at the age of nine after the rest of the council fell ill. The #Y Qelthean#! say he governed for a single autumn and balanced the town's accounts better than anyone before or since."
 treasure_omni_glazed_riders_zemmairthia:0 "Glazed Riders of Zemmairthia"
 treasure_omni_glazed_riders_zemmairthia_desc:0 "A long panel of glazed tiles showing a file of horsemen in red and blue beneath a border of white rosettes. The emperors of #G Zemmairthia Jarenam#! have it taken down and reset whenever they move their court, and tilers who can lift it without cracking a single piece are paid as well as generals."
 treasure_omni_three_sisters_desivoj:0 "Three Sisters of Desivoj"
 treasure_omni_three_sisters_desivoj_desc:0 "Three marble women with their arms about one another's shoulders, carved from one stone so that none can be moved without the others. The #Y Shallashim#! of #G Desivoj#! read them as the three virtues of a household, and families who have quarreled come to sit before them until someone speaks first."
 treasure_omni_bronze_singer_ieasac:0 "Bronze Singer of Ieasac"
 treasure_omni_bronze_singer_ieasac_desc:0 "A dark bronze woman with one hand lifted and her mouth open on a held note. The #Y Xanvr#! of #G Ieasac#! claim she was cast around a shaman who sang a #T Melodian#! working for so long that the metal set before she could finish, and the drow still strike her plinth to tune their voices before a ritual."
 treasure_omni_gold_band_dyddri:0 "Gold Band of the Dyddri Kings"
 treasure_omni_gold_band_dyddri_desc:0 "A broad diadem of hammered gold, plain except for a fine row of dots punched along each edge. The #Y Vetali#! kings of #G Dyddri#! wear it only on the day they are acclaimed, after which it hangs above the altar of #T Yxton#! for the rest of the reign."
 treasure_omni_winged_child_aeldescyhil:0 "Winged Child of Aeldescyhil"
 treasure_omni_winged_child_aeldescyhil_desc:0 "A small marble boy with folded wings, his chin tucked as though he has just been scolded. The #Y Malvanie#! of #G Aeldescyhil#! say a child born with a cowlick at the crown was touched by him, and such children are given the first ripe fruit of every year."
 treasure_omni_gilded_mother_warrior:0 "Gilded Mother Warrior of Branrhylelli"
 treasure_omni_gilded_mother_warrior_desc:0 "A painted bust of the #T Mother Warrior#! in a gilded crested helm, her stern face streaked where old paint has run in the rain. The #Y Chruchi#! of #G Branrhylelli#! carry her to the field when the levies are called, and every mother whose child marches ties a thread from her own shawl about the plinth."
 treasure_omni_avenger_peltokorpi:0 "Avenger of Peltokorpi"
 treasure_omni_avenger_peltokorpi_desc:0 "A white marble woman holding a measuring rod against her breast, her eyes fixed on something past the viewer's shoulder. The #Y Ostyakie#! of #G Peltokorpi#! believe she sees every wrong done in the valley and keeps count of it, and a thief caught in the town must confess before her before he can be sentenced."
 treasure_omni_glazed_fish_phrytheria:0 "Glazed Fish of Phrytheria"
 treasure_omni_glazed_fish_phrytheria_desc:0 "A fat fish of blue-glazed clay, its scales picked out in golden yellow. The fishers of #G Phrytheria#! set it on the prow of the first boat out each spring as an offering to the sea, and the boat that carries it is excused from the harbor tax for the season."
 treasure_omni_bust_dverkuu:0 "Bust of Dverkuu the Healer"
 treasure_omni_bust_dverkuu_desc:0 "A bearded marble head, kindly and tired, worn bald at the crown by the hands of the sick. The #Y Jemskoo#! of #G Åsgavskoo#! keep it in their house of healing and let the dying rest a palm upon it, for they hold that #T Dverkuu#! eases the pain of anyone who touches him in good faith."
 treasure_omni_tomb_archons_anaktora:0 "Tomb of the Anaktoran Archons"
 treasure_omni_tomb_archons_anaktora_desc:0 "A marble chest carved like a little temple, with a lion's-head handle on each side so that it may be borne in procession. The #Y Urretolian#! of #G Kui-Anaktora#! seal the ashes of each archon inside it in turn, and the urn of the last archon is removed only when the next one dies."
 treasure_omni_mantle_istrilneth:0 "Mantle of Istrilneth"
 treasure_omni_mantle_istrilneth_desc:0 "A heavy mantle of gold-embroidered wool, so finely worked that it looks like woven bark. The #Y Mihuldorian#! weavers of #G Rilgiaon#! say #T Istrilneth#! wore it to walk unseen among the trees, and that the last elf to wear it walked off unseen as well. Hunters still report a glint of gold thread in places where no one should be standing."
 treasure_omni_cuirass_uttarasmake:0 "Cuirass of Uttarasmake"
 treasure_omni_cuirass_uttarasmake_desc:0 "A bronze breastplate shaped to the muscles of a powerful chest, its surface gone green except where the straps have kept it bright. The #Y Aralanoc#! of #G Racgerrac#! say #T Uttarasmake the Great#! wore it in the wars that carried the faith of #T Helluvius#! westward, and that the dent below the left breast was made by a spear that should have killed him."
 treasure_omni_bronze_helm_lanieonguth:0 "Bronze Helm of Lanieonguth"
 treasure_omni_bronze_helm_lanieonguth_desc:0 "A bronze cavalry helm with a flared brim and a high crown, polished so often that its edges have worn thin. The #Y Herulian#! riders of #G Lanieonguth#! gave it to the captain who led the first charge of each war, and it outlasted nineteen of them before the twentieth was lost with it in a river crossing. Fishermen downstream have been finding horse brasses ever since."
 treasure_omni_bathing_maiden_kassadria:0 "Bathing Maiden of Kassadria"
 treasure_omni_bathing_maiden_kassadria_desc:0 "A marble sea-elf maiden stepping from her bath, one hand resting on the water jar beside her. The sculptor who made her was banished from #G Kassadria#! for the scandal, and the #Y Coriti-sir#! recalled him a year later, once the pilgrims coming to see her had filled every inn in the city."
 treasure_omni_golden_leaf_musings:0 "Golden Leaf of the Musings"
 treasure_omni_golden_leaf_musings_desc:0 "A single leaf of thin gold, folded many times and pressed with tiny letters that preserve a passage of the #T Musings#! of #G Bachin#!. The #Y Haidian#! of #G Masista#! unfold it only for the crowning of a new ruler, who must read it aloud by candlelight without missing a word."
 treasure_omni_twin_serpent_wand:0 "Twin-Serpent Wand of the Caravan Star"
 treasure_omni_twin_serpent_wand_desc:0 "A short rod of blackened bronze around which two serpents twine to meet beneath a pair of spread wings. The #Y Yadjarri#! of #G Yadjar#! give it to the leader of each great caravan, and any well-keeper who sees it raised must water the travelers before he names his price, by the law of #T The Caravan Star#!."
 treasure_omni_drake_horse_kankli:0 "Bronze Drake-Horse of Kankli"
 treasure_omni_drake_horse_kankli_desc:0 "A bronze beast with a horse's body and a drake's wings, rearing back with its forelegs pawing at the air. The #Y Turayesho#! of #G Kankli#! hold that their first chieftain tamed such a creature in the age of the #T Old Dragkhans#!, and they breed warhorses only from mares that have been led three times round its plinth."
 treasure_omni_oath_ring_falmankia:0 "Oath-Ring of Falmankia"
 treasure_omni_oath_ring_falmankia_desc:0 "A thick ring of iron and silver, wide enough to close about a man's arm, its two ends shaped into the heads of snarling beasts. The #Y Alveconian#! jarls of #G Falmankia#! swear with an arm through it, and a broken oath is said to make the ring tighten until the oathbreaker can no longer lift a sword."
 treasure_omni_enthroned_matron_nabrie:0 "Enthroned Matron of Nabrie"
 treasure_omni_enthroned_matron_nabrie_desc:0 "A headless seated woman draped in heavy folds, her hands resting flat upon her knees. The #Y Ustesoi#! of #G Nabrie#! say her head was struck off by the first conquerors of the island and buried somewhere beneath the city, and that the city will not fall again until it is found."
 treasure_omni_netted_spore_stone:0 "Netted Spore-Stone of Yokoshkyo"
 treasure_omni_netted_spore_stone_desc:0 "A domed stone wrapped in a lattice of carved threads, like a fruiting body seen through a net. The #Y Imperial Mycelar#! hold that it marks the place where #T The First Spore#! touched the ground, and the scholars of #G Yokoshkyo#! lay their palms on it before each examination."
 treasure_omni_ward_figure_eastern_fist:0 "Ward-Figure of the Eastern Fist"
 treasure_omni_ward_figure_eastern_fist_desc:0 "A small dark figure holding a spear upright and a round shield against her side, carved from the trunk of a lightning-struck tree. The wardens of the #Y Eastwatch#! say the fortress will stand as long as she remains within its walls, and a brother is set to guard her even when the gates themselves go unwatched."
 treasure_omni_pediment_adem:0 "Pediment of Adem"
 treasure_omni_pediment_adem_desc:0 "A marble pediment from a temple long since torn down, carved with warriors and priests crowding around a fallen king. The #Y Shewesnep#! of #G Adem#! have rebuilt their temple twice to fit around it, and no two of its keepers agree on the name of the king."
 treasure_omni_garlanded_frieze_seshatmashv:0 "Garlanded Frieze of Seshatmashv"
 treasure_omni_garlanded_frieze_seshatmashv_desc:0 "A long marble panel carved with garlands of fruit held up by laughing children between the masks of weeping elders. The #Y Gyulekhy#! of #G Seshatmashv#! set it over the door of whichever hall holds the harvest feast, and the host is expected to feed every guest who can name the fruits in order."
 treasure_omni_temple_rattle_shetop:0 "Temple Rattle of Shetop"
 treasure_omni_temple_rattle_shetop_desc:0 "A looped bronze frame strung with loose metal bars that clatter when it is shaken. The priests of #T Shetop#! in #G Djeba#! shake it at the edge of the river each dawn to wake the god, and the fishermen wait for its sound before pushing their boats into the water."
 treasure_omni_keel_splinter_first_ship:0 "Keel-Splinter of the First Ship"
 treasure_omni_keel_splinter_first_ship_desc:0 "A long sliver of dark, salt-hardened timber, wrapped in red cord at the end where it was broken from a keel. The shipwrights of #G D'-Rre#! claim it came from the first ship to cross the #Y Intermarenican#! sea, and they set a shaving from it into the keel of every hull they build."
 treasure_omni_green_face_rilsidhiar:0 "Green Face of Rilsidhiar"
 treasure_omni_green_face_rilsidhiar_desc:0 "A round bronze plaque of a bearded face whose hair and beard grow into tangled leaves. The #Y Hiari#! of #G Rilsidhiar#! hang it in the oldest tree of the grove, and when it turns green with weather they say the forest has accepted another year of their keeping."
 treasure_omni_scribe_figure_auruk:0 "Scribe-Figure of Auruk"
 treasure_omni_scribe_figure_auruk_desc:0 "A clay figure of a robed scribe, his hands clasped before him and his beard combed into neat ridges. The #Y Gezari#! of #G Auruk#! set a fresh tablet before him each morning, and an apprentice who makes three errors in a day must spend the night copying at his side."
 treasure_omni_black_stele_cinder_drake:0 "Black Stele of the Cinder Drake"
 treasure_omni_black_stele_cinder_drake_desc:0 "A dark stone stele carved with rows of small figures beneath a great winged shape that spreads above them all. The #Y Manu#! of #G Kulshem#! say it records the coming of #T The Cinder Drake#!, and they rub ash from the temple hearth into its carvings so that the figures never fade."
 treasure_omni_golden_contracts_tikotepa:0 "Three Golden Contracts of Tikotepa"
 treasure_omni_golden_contracts_tikotepa_desc:0 "Three thin sheets of gold, each pressed with the terms of an agreement in two scripts. The #Y Ta'ata#! of #G Bad-Linmburnil#! hold them as the first contracts their ancestors ever made with an outside people, and in true goblin fashion they still collect the interest owed on all three."
 treasure_omni_spore_staff_tzagrin:0 "Spore-Staff of Tzagrin"
 treasure_omni_spore_staff_tzagrin_desc:0 "A long staff of dark wood topped with a great knot of dried fungus bound in place with strips of hide. The #Y Rishii#! of #G Tzagrin#! say it was cut by the first teacher of the #T Kagayamashko#! schools and handed down until a student walked out with it in protest at a curriculum. The schools have changed the curriculum twice since, and the student has not come back."
 treasure_omni_carved_ancestor_cuautitlende:0 "Carved Ancestor of Cuautitlende"
 treasure_omni_carved_ancestor_cuautitlende_desc:0 "A tall figure carved from a single dark trunk, its arms pressed to its sides and its face worn soft by wind and hands. The #Y Achabascan#! of #G Cuautitlende#! carry it to the council fire whenever the clans meet, so that the first of their ancestors may hear what is decided in his name."
 treasure_omni_bronze_effigy_droishuilco:0 "Bronze Effigy of Droishuilco"
 treasure_omni_bronze_effigy_droishuilco_desc:0 "A tiny bronze figure of a soft-skinned warrior in a flowing cloak, taken from an enemy camp in the first war the #Y Droishu#! ever won. The captains of #G Droishuilco#! keep it in the war-hall and hand it to each new recruit with the same lesson: the enemy wears cloth where a hobgoblin wears iron."
 treasure_omni_bronze_archer_huehuecruz:0 "Bronze Archer of Huehuecruz"
 treasure_omni_bronze_archer_huehuecruz_desc:0 "A slim bronze youth holding a bow in one hand and a small animal in the other. The #Y Yokutska#! of #G Huehuecruz#! say he was the first to hunt their valley, and young hunters must lay the first game they kill at his feet before they may eat it."
 treasure_omni_boar_horn_killdrukaath:0 "Boar-Mouthed Horn of Killdrukaath"
 treasure_omni_boar_horn_killdrukaath_desc:0 "A tall bronze war horn whose bell is shaped like the open jaws of a boar, with a wooden tongue that rattles when it is blown. The #Y Baithrais#! of #G Killdrukaath#! raised it above the shield wall until a raid carried it off, and herders in the far valleys still claim to hear it bellowing on stormy nights. The Guild has posted the contract so often that the clerks no longer bother to rewrite it."

