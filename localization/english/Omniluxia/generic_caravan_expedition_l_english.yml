l_english:

 generic_caravan_expedition:0 "An Overland Caravan To [SCOPE.sCountry('generic_trade_expedition_partner').GetName]"
 generic_caravan_expedition_DESCRIPTION:0 "There is no sea road to [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y], my [ROOT.GetCountry.GetRulerTitle], and there does not need to be one. The markets of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] can be reached by anybody willing to feed several hundred animals across open country and arrive at the other end with the load still on their backs; our people have been doing precisely that since long before anyone here owned a ship."
 generic_caravan_expedition_CRITERIA_DESCRIPTION:0 "This venture will be finished once a caravan has travelled from [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] to the market at [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y], taken on cargo, returned home, and the accounts have been settled."
 generic_caravan_expedition_BUTTON_TOOLTIP:0 "Send an overland trading caravan to a neighboring country."
 generic_caravan_expedition_BUTTON_DETAILS:0 "For realms with no coast to sail from, and for those who never did see the point of ships. A nearby country with a market and no quarrel with us will be chosen as our trade partner."
 generic_caravan_expedition_REWARD_DESCRIPTION:0 "Completing this venture grants gold, Political Influence, warmer relations and trade modifiers; at the end we shall also choose a permanent #Y Charter#! that decides what our foreign trade becomes for a generation."

 generic_caravan_expedition_open_contacts:0 "Charter The Caravan"
 generic_caravan_expedition_open_contacts_DESC:0 "Caravans do not simply happen, my [ROOT.GetCountry.GetRulerTitle]. Someone must be named to lead it, someone must be persuaded to pay for it, and someone in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] must be told that we are coming well before we arrive; a caravan that surprises a market gets the price it deserves."

 generic_caravan_expedition_hire_guides:0 "Hire Guides And Drovers"
 generic_caravan_expedition_hire_guides_DESC:0 "Men who know the wells, the passes, the seasons, and the people who live near all three. The route exists inside their heads and nowhere else in the world; they are perfectly aware of what that is worth to us."

 generic_caravan_expedition_survey_home_market:0 "Survey Home Demand"
 generic_caravan_expedition_survey_home_market_DESC:0 "Before we load a single beast we ought to know what will actually sell when we get back. A caravan that returns with the wrong goods has simply walked a very long way for nothing."

 generic_caravan_expedition_exchange_gifts:0 "Exchange Gifts"
 generic_caravan_expedition_exchange_gifts_DESC:0 "Courtesy travels ahead of the caravan or it does not travel at all. What we send to [SCOPE.sCountry('generic_trade_expedition_partner').GetName|Y] now will decide how the [ROOT.GetCountry.GetAdjective] are received in three months' time."

 generic_caravan_expedition_appoint_escort:0 "Appoint An Escort"
 generic_caravan_expedition_appoint_escort_DESC:0 "A loaded caravan moves at the pace of its slowest animal and can be seen from a very long way off. Riders who can discourage the curious are not a luxury on this road; they are the difference between a venture and a gift."

 generic_caravan_expedition_secure_passage:0 "Secure Right Of Passage"
 generic_caravan_expedition_secure_passage_DESC:0 "Between here and [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] the road belongs to other people. We would much rather cross it with their blessing than explain ourselves at every ford and every guard post along the way."

 generic_caravan_expedition_chart_route:0 "Chart The Route"
 generic_caravan_expedition_chart_route_DESC:0 "Wells, grazing, passes, the stages where water must be carried and the stages where the water must not be trusted. Written down, all of it becomes a road; left unwritten, it dies with whichever old man happens to remember it."

 generic_caravan_expedition_provision_caravan:0 "Provision The Caravan"
 generic_caravan_expedition_provision_caravan_DESC:0 "Fodder, waterskins, spare harness, salt, and the several hundred small things whose absence turns a profitable venture into a line of bones across the dry country."

 generic_caravan_expedition_departure_feast:0 "Hold A Departure Feast"
 generic_caravan_expedition_departure_feast_DESC:0 "The caravan leaves at dawn, and half of those watching it go are related to somebody walking with it. A feast the night before is worth a good deal more than the meat costs us."

 generic_caravan_expedition_assemble_caravan:0 "Assemble The Caravan"
 generic_caravan_expedition_assemble_caravan_DESC:0 "Bring the beasts, the goods and the escort together at [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] under our envoy's command, and put them all on the road."
 generic_caravan_expedition_assemble_tt:0 "Our envoy must command an army of at least #Y 5#! units."
 generic_caravan_expedition_reach_market_tt:0 "Our envoy's caravan must be at #Y [SCOPE.sP('generic_trade_expedition_partner_port').GetName]#!."
 generic_caravan_expedition_return_home_tt:0 "Our envoy's caravan must have returned to #Y [SCOPE.sP('generic_trade_expedition_home_port').GetName]#!."

 generic_caravan_expedition_reach_waystation:0 "Rest At [SCOPE.sP('generic_trade_expedition_stopover_port_scope').GetName]"
 generic_caravan_expedition_reach_waystation_DESC:0 "The stage is far too long to walk in one go. [SCOPE.sCountry('generic_trade_expedition_stopover_country').GetName|Y] holds the only water on it, and knows perfectly well that it does."

 generic_caravan_expedition_reach_partner_market:0 "Reach The Market"
 generic_caravan_expedition_reach_partner_market_DESC:0 "Bring the caravan into [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] with the load intact and the animals still standing; anything less and we shall be selling our beasts to pay for the journey home."

 generic_caravan_expedition_register_with_warden:0 "Register With The Market Warden"
 generic_caravan_expedition_register_with_warden_DESC:0 "No stall, no scales and no storage until the warden of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] has written our names into his book and decided how he feels about them."

 generic_caravan_expedition_settle_customs:0 "Settle The Customs Duties"
 generic_caravan_expedition_settle_customs_DESC:0 "The duties on a caravan this size are a matter of judgement, my [ROOT.GetCountry.GetRulerTitle]; and the judgement belongs entirely to a man who can be reasoned with in more than one way."

 generic_caravan_expedition_meet_market_guilds:0 "Meet The Market Guilds"
 generic_caravan_expedition_meet_market_guilds_DESC:0 "The guilds of [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] decide what a stranger's goods are worth long before the stranger has finished unpacking them."

 generic_caravan_expedition_outbid_rival:0 "Outbid The Rival Merchants"
 generic_caravan_expedition_outbid_rival_DESC:0 "[SCOPE.sCountry('generic_trade_expedition_rival').GetName|Y] has been trading here for years, and the guildmasters have already been warned about us at some length."

 generic_caravan_expedition_load_cargo:0 "Load The Caravan"
 generic_caravan_expedition_load_cargo_DESC:0 "Choose what goes home with us. Every beast can carry one load and no more; what we decide here is the whole profit of the venture."

 generic_caravan_expedition_plant_factor_house:0 "Plant A Factor House"
 generic_caravan_expedition_plant_factor_house_DESC:0 "A permanent house in [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] with our own factors sitting in it, so that the next caravan arrives somewhere rather than merely arriving."

 generic_caravan_expedition_seal_manifest:0 "Seal The Manifest"
 generic_caravan_expedition_seal_manifest_DESC:0 "Everything counted, everything witnessed, everything sealed. Whatever is not on the list will not be missed until it is far too late to ask anybody about it."

 generic_caravan_expedition_return_passage:0 "Walk The Road Home"
 generic_caravan_expedition_return_passage_DESC:0 "Every animal in the train is now carrying the profit of the whole venture, at walking pace, through open country. This is the dangerous half, my [ROOT.GetCountry.GetRulerTitle]."

 generic_caravan_expedition_return_home:0 "Return Home"
 generic_caravan_expedition_return_home_DESC:0 "Bring the caravan back to [SCOPE.sP('generic_trade_expedition_home_port').GetName|Y] and let the counting begin."

 generic_caravan_expedition_honor_envoy:0 "Honor The Envoy"
 generic_caravan_expedition_honor_envoy_DESC:0 "The man who walked to a foreign market and back has come home rich, and rather better known than he was when he left."

 generic_caravan_expedition_count_profits:0 "Count The Profits"
 generic_caravan_expedition_count_profits_DESC:0 "Close the accounts, and decide what this venture is going to become."

 #################### RISK TOOLTIPS ####################

 generic_caravan_expedition_risk_check_tt:0 "#Y The road is not a safe one.#!\n  There is a [SCOPE.ScriptValue('generic_trade_expedition_risk_svalue')|Y0]% chance of trouble on this stage; #R hard country and dry wells#!, #R riders on the ridge#!, #R the drovers refusing to move#!, a #R market closed against us#!, or #R our envoy taken ill#! far from home.\n  An escort, full provisions, a charted route and a friendly waystation all make this less likely; distance, foreign tariffs and a rival working the same market all make it worse."
 generic_caravan_expedition_return_risk_check_tt:0 "#Y The loaded road home is the dangerous one, my [ROOT.GetCountry.GetRulerTitle].#!\n  The caravan is tested #Y twice#! on this stage, each time with a [SCOPE.ScriptValue('generic_trade_expedition_risk_svalue')|Y0]% chance of trouble; #R hard country#!, #R bandits#!, #R the drovers refusing to move#!, a #R market closed against us#!, or #R our envoy taken ill#!.\n  Every animal in the train is carrying the profit of the whole venture, at walking pace, in open country."

 #################### CARAVAN EVENTS ####################

 generic_caravan_expedition.1.t:0 "The Road Is Open"
 generic_caravan_expedition.1.desc:0 "Right of passage is granted, [ROOT.GetCountry.GetRuler.GetName]. Our caravan may cross, water at the wells, graze along the margins, and pass the guard posts without having to explain itself twice.\n\nThe whole agreement is written on a single sheet of parchment; it is worth considerably more to us than the escort is."
 generic_caravan_expedition.1.a:0 "Then we walk"

 generic_caravan_expedition.2.t:0 "The Market"
 generic_caravan_expedition.2.desc:0 "The caravan came into [SCOPE.sP('generic_trade_expedition_partner_port').GetName|Y] at dusk after nine weeks on the road, a good deal thinner than it left and entirely intact. The animals were watered before anybody thought to feed the men.\n\nBy morning the whole market knew exactly what we had brought with us."
 generic_caravan_expedition.2.a:0 "Now we trade"

 generic_caravan_expedition.3.t:0 "The Caravan Returns"
 generic_caravan_expedition.3.desc:0 "They came over the last ridge in the afternoon, my [ROOT.GetCountry.GetRulerTitle], and somebody's child saw them first and ran the entire way back to say so. The beasts are ruined, the drovers are owed a season's pay, and the loads are worth more than the town they are walking into.\n\nAll of it arrived. That is not usual."
 generic_caravan_expedition.3.a:0 "Open the packs!"

 generic_caravan_expedition.400.t:0 "Hard Country"
 generic_caravan_expedition.400.desc:0 "The middle stages were a great deal drier than the guides promised, and the guides have since stopped promising anything at all. We have lost animals, we have abandoned loads in order to save other loads, and we have learned that one of the wells on our fine new chart has been dry since before our envoy was born."
 generic_caravan_expedition.400.a:0 "Replace what we can and go on"

 generic_caravan_expedition.401.t:0 "Riders On The Ridge"
 generic_caravan_expedition.401.desc:0 "They have been shadowing the caravan since the second day; always on the high ground, always just far enough off that nobody can count them properly. This morning one of them rode down alone to discuss what he called the customary arrangement.\n\nHe was unarmed, extremely polite, and entirely confident."
 generic_caravan_expedition.401.a:0 "Pay the toll; it is cheaper than the alternative"
 generic_caravan_expedition.401.b:0 "We pay no tolls to men without a country!"

 generic_caravan_expedition.402.t:0 "The Drovers Have Stopped"
 generic_caravan_expedition.402.desc:0 "The caravan is sitting down in the road, [ROOT.GetCountry.GetRuler.GetName]. The drovers say the stages have been longer than they agreed to, the water shorter than they were promised, and the pay unchanged since a bargain struck in a very much cooler month.\n\nThey are not wrong, which is rather the difficulty."
 generic_caravan_expedition.402.a:0 "Pay them properly and get moving"
 generic_caravan_expedition.402.b:0 "Make an example of a few and move on"

 generic_caravan_expedition.450.t:0 "The Waystation"
 generic_caravan_expedition.450.desc:0 "[SCOPE.sP('generic_trade_expedition_stopover_port_scope').GetName|Y] holds the only water for two days in any direction, and [SCOPE.sCountry('generic_trade_expedition_stopover_country').GetName|Y] holds [SCOPE.sP('generic_trade_expedition_stopover_port_scope').GetName|Y]. Their headman has come out to name a price for the wells, the grazing, and the right to sleep inside the wall.\n\nThere is no second well to go to, my [ROOT.GetCountry.GetRulerTitle]."
 generic_caravan_expedition.450.a:0 "Pay for the water like guests"
 generic_caravan_expedition.450.b:0 "Water the animals now and settle the argument later"
 generic_caravan_expedition.450.c:0 "Press on dry"

 #################### THE PURSE - NEW TASKS ####################

 generic_caravan_expedition_raise_capital:0 "Raise The Capital"
 generic_caravan_expedition_raise_capital_DESC:0 "Somebody has to pay for several hundred animals and the men who walk beside them, my [ROOT.GetCountry.GetRulerTitle]; and whoever pays for a venture tends to end up owning it. The treasury can carry it, our merchant houses would be glad to help, and the temples lend at reasonable rates to ventures they approve of."

 generic_caravan_expedition_commission_merchants:0 "Commission The Merchants"
 generic_caravan_expedition_commission_merchants_DESC:0 "Names on contracts, shares agreed, and the factors who will do the actual bargaining chosen and sworn. Our envoy speaks for [ROOT.GetCountry.GetName]; these men will speak for the purse."

 generic_caravan_expedition_publish_charts:0 "Publish The Route"
 generic_caravan_expedition_publish_charts_DESC:0 "The wells, the passes and the warnings gathered on this journey should not stay in one guide's head. Written out and copied, they turn a dangerous crossing into a road."

 generic_caravan_expedition_departure_feast:0 "Hold A Departure Feast"
 generic_caravan_expedition_departure_feast_DESC:0 "The caravan leaves at dawn, and half of those watching it go are related to somebody walking with it. A feast the night before is worth more than the meat costs us."

 #################### THE ROAD ####################

 generic_caravan_expedition.410.t:0 "Good Going"
 generic_caravan_expedition.410.desc:0 "Nothing has gone wrong, [ROOT.GetCountry.GetRuler.GetName], which the drovers are treating as suspicious. The wells have been where the guides said they would be, the beasts are sound, and we have made three more stages this week than anybody planned for.\n\n[SCOPE.sCharacter('generic_trade_expedition_envoy').GetName] reports that the whole train is in an alarmingly good mood."
 generic_caravan_expedition.410.a:0 "Let us not say so out loud"

 generic_caravan_expedition.411.t:0 "Another Caravan On The Road"
 generic_caravan_expedition.411.desc:0 "We have met a train coming the other way, my [ROOT.GetCountry.GetRulerTitle]; forty beasts, half our size, and a headman who has been walking this road since before our guides were born.\n\nHe is willing to trade a little, and rather more willing to talk. He knows which wells ahead are dry, which headman is taking more than he used to, and precisely what our goods will fetch where we are going."
 generic_caravan_expedition.411.a:0 "Trade with them, and buy the man a meal for his news"
 generic_caravan_expedition.411.b:0 "Keep moving; we know our own road"
