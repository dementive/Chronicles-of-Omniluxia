l_english:
 omni_shannah_accession.2.t:0 "A New Voice from the Apostolic Palace"
 omni_shannah_accession.2.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a proclamation has reached our court from [SCOPE.sC('omni_accession_see').GetName|T]. [SCOPE.sChar('omni_accession_shannah').GetName|Y] has assumed the office of #Y Shannah#!, and the bells of #G Ddu-Nuinop#! have announced the news to the faithful. The priests of the #T Helluvian#! Church are already offering prayers for the new holder of the sacred office. Copies of the proclamation are being carried to rather more distant courts, including our own.\n\nFrom the #G Apostolic Palace#!, the new #Y Shannah#! claims the spiritual authority inherited from the successors of #Y Pouirruipa#!, the first to guide the faithful after #T Helluvius#!. To the #T Helluvians#!, this is the voice charged with preserving the teachings of #T Hellas#! and tending the #T Inner Flame#! of his followers. To the rulers who must deal with the palace, there is also the question of what its new master intends to do with that authority.\n\nOur advisers have examined the proclamation with considerable interest. It says a great deal about sacred duties and the welfare of the faithful, though rather less about which neighboring rulers may expect a friendly reception. Those details, one suspects, will become clear soon enough. For now, [ROOT.GetCountry.GetName|T] knows the name to which its next letter must be addressed."
 omni_shannah_accession.2.a:0 "We shall see what comes of this #Y Shannah#!."
 omni_shannah_accession.3.t:0 "A Gift for the New Shannah"
 omni_shannah_accession.3.desc:0 "My [ROOT.GetCountry.GetRulerTitle], an envoy of [SCOPE.sChar('omni_accession_shannah').GetName|Y] has presented the new #Y Shannah's#! proclamation before our court. Having finished his account of the celebrations in #G Ddu-Nuinop#!, he now waits to learn whether [ROOT.GetCountry.GetRuler.GetName|Y] will acknowledge his master's authority over the #T Helluvian#! faithful. He assures us that a declaration of support from [ROOT.GetCountry.GetName|T] would be received with great satisfaction at the #G Apostolic Palace#!.\n\nOur priests urge us to send our congratulations, accompanied by a gift suitable for the occasion. The treasury's contribution need not be extravagant, they explain; what matters is that our devotion should be remembered when our own envoys next require an audience. The envoy agrees that this would be an excellent beginning to the new reign. He has, helpfully, brought someone capable of receiving the money.\n\nOthers at court are less eager to offer either our recognition or our gold. A sacred title, they argue, does not oblige us to accept every claimant who wears it. We could send the envoy home with a refusal, though the #Y Shannah#! is unlikely to forget a public challenge to his authority. Shall we make ourselves welcome at the palace, or give its new master reason to remember us less fondly?\n\n#T A Gift of Recognition#!\nSend #Y 25#! @gold! to [SCOPE.sC('omni_accession_see').GetName|T] and gain #G 15 personal Favor#! with [SCOPE.sChar('omni_accession_shannah').GetName|Y]. Supporting a different patron #R replaces your existing Favor#!.\n\n#T Refuse Recognition#!\nThe Shannah's realm loses #R 25 Opinion#! of us, recovering by #G 5#! each year."
 omni_shannah_accession.3.a:0 "Send our blessing, and #Y 25#! @gold! with it."
 omni_shannah_accession.3.b:0 "Robes alone do not make a #Y Shannah#!."
 omni_shannah_accession_rejected:0 "Rejected Our Shannah's Legitimacy"
