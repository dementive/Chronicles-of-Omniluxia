l_english:
 me_arteon_gen.1.t: "Forged in Eternal Flame"
 me_arteon_gen.1.desc: "Arteon does not grant peace — it grants survivors. [ROOT.GetCountry.GetRuler.GetName|Y] stands before the assembled warriors of the realm, their battle-scarred faces a testament to generations of warfare on this blood-soaked shore. No great speech is given. None is needed. The drums of war have never stopped beating here. What matters now is whether those who answer them are ready for what comes next. They are."
 me_arteon_gen.1.a: "We were born ready."
 me_arteon_gen.2.t: "The Price of Foreign Steel"
 me_arteon_gen.2.desc: "From taverns of distant ports and war camps of foreign kingdoms, sellswords and spear-for-hire pour into [ROOT.GetCountry.GetCapital.GetName|Y]. Coin has a language all its own, and [ROOT.GetCountry.GetRuler.GetName|Y] speaks it fluently. With mercenary bands now under contract, [ROOT.GetCountry.GetAdjective] forces gain the strength of warriors who have fought in a dozen different wars — men who care little for the politics of #Y Arteon#!, but everything for gold."
 me_arteon_gen.2.a: "We buy today what we cannot yet breed."
 me_arteon_gen.3.t: "The Slavers Shall Raid No More"
 me_arteon_gen.3.desc: "For too long, the black sails of the #R Great Slaver Navies#! have darkened the coastlines of #Y Arteon#!, leaving burned villages and empty homes in their wake. [ROOT.GetCountry.GetRuler.GetName|Y] has ordered the construction of coastal watchtowers, hardened harbors, and a standing fleet to meet any raiders before they reach our shores. Let them come. They will find no easy prey here."
 me_arteon_gen.3.a: "Our coasts are ours to defend."
 me_arteon_gen.4.t: "The Heartland Secured"
 me_arteon_gen.4.desc: "Let others squabble over distant prizes. [ROOT.GetCountry.GetRuler.GetName|Y] understands a truth that many warlords on #Y Arteon#! have learned too late: power cannot be projected from a crumbling foundation. Our core territories are now bound together under one banner, and the people of the heartland look to [ROOT.GetCountry.GetRuler.GetName|Y] not as one faction among many, but as their sovereign. The first stone of empire has been laid."
 me_arteon_gen.4.a: "Home is the foundation of empire."
 me_arteon_gen.15.t: "The Children of Artheous Rise"
 me_arteon_gen.15.desc: "The highland priests of #T Artheous#! have long spoken of a day when a true heir would emerge from the chaos of the #R Isle of Eternal War#!. As [ROOT.GetCountry.GetRuler.GetName|Y] accepts the sacred rites before the assembled faithful, a silence falls over the crowd — one that carries the weight of generations of suffering and endurance. The Artheousan claim to this island is not merely political. It is written in blood and in the will of the war god himself."
 me_arteon_gen.15.a: "Artheous marches with us."
 me_arteon_gen.16.t: "The Ascendic Doctrine"
 me_arteon_gen.16.desc: "The High Elven creed of #G Ascendance#! holds that mastery of the self precedes mastery of others. [ROOT.GetCountry.GetRuler.GetName|Y] has long meditated upon this principle, and emerged from contemplation with a clarity of purpose that unsettles even the closest advisors. The #R Isle of Eternal War#! is not a problem to be solved with brute force alone. It is a puzzle that yields to patience, philosophy, and the measured application of power."
 me_arteon_gen.16.a: "We rise above the chaos."
 me_arteon_gen.17.t: "A Holy War for the Goddess"
 me_arteon_gen.17.desc: "The banners of [ROOT.GetCountry.GetName|Y] are raised in the name of [GetDeityDefinition('omen_viza').GetName|G]! [ROOT.GetCountry.GetRuler.GetName|Y], burning with divine conviction, has called upon the faithful to take up arms in a holy crusade. The sermons spread through our camps like wildfire: #Y Arteon#! must be consecrated in the name of the victory goddess, and every unbeliever is an enemy of the divine order. Let the #R Isle of Eternal War#! become the #T Isle of Sacred Victory#!."
 me_arteon_gen.17.a: "For [GetDeityDefinition('omen_viza').GetName|G] and glory!"
 me_arteon_gen.18.t: "South Arteon Falls to the Faithful"
 me_arteon_gen.18.desc: "The armies of #T Artheous#! have descended from the highland passes with a fury that matches the war god's own legend. City by city, the south of #Y Arteon#! has been brought to heel beneath the Artheousan banner. Our enemies burned their bridges and prayed to foreign gods as they fled — but #T Artheous#! was already waiting for them on the far bank. The south is ours. Let the invaders take note."
 me_arteon_gen.18.a: "The war god is pleased."
 me_arteon_gen.19.t: "The Web Is Woven"
 me_arteon_gen.19.desc: "While lesser rulers reach for the sword as a first resort, [ROOT.GetCountry.GetRuler.GetName|Y] has reached instead for the quill, the sealed letter, and the well-placed whisper. The feuding factions of #Y Arteon#! — their hatreds ancient, their grudges deep — have been carefully played against one another. Alliances that should have held have crumbled. Walls that should have stood have opened from within. The island devours itself, and we grow stronger from the feast."
 me_arteon_gen.19.a: "Patience is the sharpest blade."
 me_arteon_gen.20.t: "Gold for the Goddess"
 me_arteon_gen.20.desc: "The coffers of the faithful overflow. Trade routes bring precious metals into our temples, and the priests of [GetDeityDefinition('omen_viza').GetName|G] ensure that not a coin is wasted on frivolity. Our holy wars demand fuel, and the merchants of [ROOT.GetCountry.GetCapital.GetName|Y] have answered the call with surprising eagerness — for gold blessed in the name of the victory goddess is gold doubly spent."
 me_arteon_gen.20.a: "The faithful shall want for nothing."
 me_arteon_gen.21.t: "In the Name of Artheous"
 me_arteon_gen.21.desc: "A roar rises from ten thousand Artheousan throats as the last of the coastal invaders are driven into the sea. [ROOT.GetCountry.GetRuler.GetName|Y] stands upon the bluffs where the #T First Great War#! began, looking out at the retreating sails. The wounds of that ancient conflict are not healed — they never fully are — but today they have been answered. The gods of the highlands do not forget insults. Neither do their chosen."
 me_arteon_gen.21.a: "Drive them from our shores forever."
 me_arteon_gen.22.t: "The Eastern Fires Go Dark"
 me_arteon_gen.22.desc: "The zealots of [GetDeityDefinition('omen_viza').GetName|G] had long screamed their battle-prayers from the shrines of #Y Eastern Arteon#!, hurling fanatical armies against any who would not bow to their goddess. Now their shrines are silent. [ROOT.GetCountry.GetRuler.GetName|Y] has personally overseen the purging of the eastern coast, stripping the holy sites of their power and scattering the faithful. A quiet settles over the east that it has not known in living memory."
 me_arteon_gen.22.a: "The madness ends here."
 me_arteon_gen.23.t: "The Goddess Smiles Upon Us"
 me_arteon_gen.23.desc: "[GetDeityDefinition('omen_viza').GetName|G] has sent a sign. The priests say so, and the fires in the great temple of [ROOT.GetCountry.GetCapital.GetName|Y] blaze with a light that no wind can extinguish. Worshippers of the victory goddess crowd every street of the capital. The fervor of the faithful is not merely spiritual — it is a weapon, sharpened on the whetstone of absolute belief. [ROOT.GetCountry.GetRuler.GetName|Y] stands in the inner sanctum, and for a moment, [ROOT.GetCountry.GetRuler.GetSheHe] feels the goddess's eyes upon [ROOT.GetCountry.GetRuler.GetHerHim]."
 me_arteon_gen.23.a: "We walk in divine light."
 me_arteon_gen.24.t: "The First Great War Avenged"
 me_arteon_gen.24.desc: "They say that on the day the #T First Great War#! ended, the survivors wept not from relief but from exhaustion — there were not enough of them left to feel joy. [ROOT.GetCountry.GetRuler.GetName|Y] has carried that grief to the west and repaid it in full. The banners of [ROOT.GetCountry.GetAdjective] enemies no longer fly over the hills where the ancestors of this people fell. The #R Isle of Eternal War#! has not known peace — but it has, at last, known justice."
 me_arteon_gen.24.a: "Our ancestors can rest."
 me_arteon_gen.25.t: "The High Elven Order Ascends"
 me_arteon_gen.25.desc: "From the decks of the growing fleet, [ROOT.GetCountry.GetRuler.GetName|Y] surveys the coastline of #Y Arteon#! with the quiet satisfaction of a scholar who has correctly predicted the ending of a long and complicated book. The chaos that once defined this island has been channeled, redirected, and ultimately subordinated to the High Elven will. Philosophy has proven itself not merely in the pages of ancient texts, but on the bloodied shores of the most contested island in the world."
 me_arteon_gen.25.a: "We are the order this island has always craved."
 me_arteon_gen.26.t: "The North Trembles Before the Goddess"
 me_arteon_gen.26.desc: "The north of #Y Arteon#! — home of ancient dark lords, blood-cursed dynasties, and powers that have endured for centuries — has been brought to its knees before [GetDeityDefinition('omen_viza').GetName|G]. [ROOT.GetCountry.GetRuler.GetName|Y] looks upon the conquered north not with triumph, but with the serene certainty of one who has merely carried out a divine instruction. The prophets spoke of this day. The goddess promised it. And it has come to pass."
 me_arteon_gen.26.a: "As the goddess wills it, so it is done."
 me_arteon_gen.9.t: "The Blade Is Forged"
 me_arteon_gen.9.desc: "The fires of the forge have burned for three days and three nights without pause. The blade that emerges is not merely a weapon — it is a statement of intent, a declaration of what [ROOT.GetCountry.GetRuler.GetName|Y] intends to become, and a warning to all who would stand against [ROOT.GetCountry.GetRuler.GetHerHim]. Some blades are made to end wars. This one is made to end an era."
 me_arteon_gen.9.a: "Let the world take heed."
 me_arteon_gen.10.t: "From Ruin, A Realm"
 me_arteon_gen.10.desc: "The hammers of peace ring out across #Y Arteon#! for the first time in memory. Workers fill the cracked streets that armies once claimed, laying fresh stone over old blood. [ROOT.GetCountry.GetRuler.GetName|Y] walks through a city that was rubble not long ago and sees in it not what it was, but what it shall be. The #R Isle of Eternal War#! has been many things to many peoples. Today, for just a moment, it is something almost beautiful."
 me_arteon_gen.10.a: "Build it stronger than before."
 me_arteon_gen.11.t: "Arteon Commands the Waves"
 me_arteon_gen.11.desc: "The harbors of [ROOT.GetCountry.GetCapital.GetName|Y] are crowded with warships bearing the banners of a unified realm. [ROOT.GetCountry.GetRuler.GetName|Y] has invested heavily in the sea — for any power that holds #Y Arteon#! without commanding the waters around it is merely a prisoner in a very large cell. Our navy is now sufficient to ensure that no foreign fleet dictates terms to us, and that the trade lanes of this region bow to our sovereign will."
 me_arteon_gen.11.a: "The sea is now our frontier."
 me_arteon_gen.12.t: "An Unbreakable Heart"
 me_arteon_gen.12.desc: "Stone does not lie. The walls that now ring [ROOT.GetCountry.GetCapital.GetName|Y] speak plainly to any who contemplate treachery or invasion: you will not pass. [ROOT.GetCountry.GetRuler.GetName|Y] has invested not merely in height and thickness, but in the full apparatus of a defended capital — garrisons, supply lines, courts of law, and the administrative centers that will keep the realm functioning even in the worst of sieges. Come what may."
 me_arteon_gen.12.a: "Let them come. We are ready."
 me_arteon_gen.13.t: "The Eye of the Storm"
 me_arteon_gen.13.desc: "It is said that the #R Isle of Eternal War#! has never known peace. Technically, the scholars are correct — but they have not stood in [ROOT.GetCountry.GetCapital.GetName|Y] on this day, as trade ships crowd the harbor and foreign dignitaries arrive with gifts rather than ultimatums. Peace of a kind has come to #Y Arteon#!, imperfect and hard-won. [ROOT.GetCountry.GetRuler.GetName|Y] knows better than most that it will require constant tending. But for now, the island breathes."
 me_arteon_gen.13.a: "Peace is the hardest war of all."
 me_arteon_gen.14.t: "The Crown of Arteon"
 me_arteon_gen.14.desc: "For as long as history has been written, #Y Arteon#! has been a wound — a place where civilizations went to bleed, where armies rose and fell with the seasons, where no faction held the whole for more than a generation. Now, for the first time since the ancients drew breath, the island stands united beneath a single sovereign. [ROOT.GetCountry.GetRuler.GetName|Y] accepts the Crown of #T Arteon#! not with ceremony and celebration, but with the quiet gravity of one who truly understands what it cost to reach this moment. The #R Isle of Eternal War#! has a new name today. Let the world learn it."
 me_arteon_gen.14.a: "Long live [ROOT.GetCountry.GetName|Y]!"
 me_arteon_gen.27.t: "The Night of Red Sovereignty"
 me_arteon_gen.27.desc: "#R Blood Drinker#! has tasted the hand of its chosen lord, [ROOT.GetCountry.GetRuler.GetName|Y], and the [ROOT.GetCountry.GetRulerTitle] of [ROOT.GetCountry.GetName|Y] has used its unholy powers to destroy the other vampires on #Y Arteon#! in one fell swoop.\n\nA #R Vampiric Council#! had been called by [ROOT.GetCountry.GetRuler.GetFirstName], and [ROOT.GetCountry.GetRuler.GetHerHis] foolish vampiric kinsmen came freely of their own accords to their deaths. One by one, they were each and every one of them slain by the mighty [ROOT.GetCountry.GetRuler.GetFirstName], who seized their realms and power in a display of ultimate authority."
 me_arteon_gen.27.a: "There can be only one vampire on Arteon!"
 me_arteon_gen.27_tt: "Every other #R Vampire#! ruling on the island of #Y Arteon#! has been #R Killed#! by our Ruler, and we have conquered their former territories."
 me_arteon_gen_eptelon.1.t: "A Foothold on Eptelon"
 me_arteon_gen_eptelon.1.desc: "The city that watches over the straits has long been a stone in the sandal of any power seeking to project influence eastward. No more. With province #G [GetProvince('(int32)653').GetName|Y]#! secured, [ROOT.GetCountry.GetRuler.GetName|Y] has planted the first flag of #Y Arteon#! on the shores of #G Eptelon#! — a neighboring island known for its fierce warriors and abundant, if unruly, population. The east is now open to us."
 me_arteon_gen_eptelon.1.a: "Eptelon will serve us well."
 me_arteon_gen_eptelon.2.t: "The Arteonian Expeditionary Force"
 me_arteon_gen_eptelon.2.desc: "A fleet of transports escorts a force of heavy infantry and archers across the narrow strait, their banners catching the sea wind. [ROOT.GetCountry.GetRuler.GetName|Y] has committed both coin and ships to the subjugation of #Y Eptelon#!, and the assembled officers know there is no half-measure here. The island must be seized. Its defenders are fierce, but they are divided — and [ROOT.GetCountry.GetAdjective] commanders know how to exploit a divided enemy."
 me_arteon_gen_eptelon.2.a: "The expedition sets out. May fortune favor us."
 me_arteon_gen_eptelon.3.t: "Refugees Bound to the Plow"
 me_arteon_gen_eptelon.3.desc: "In the wake of the Eptelonian campaigns, streams of displaced peoples have made their way to [ROOT.GetCountry.GetCapital.GetName|Y] — some fleeing war, others driven from their homes by our advancing armies. [ROOT.GetCountry.GetRuler.GetName|Y] has seen to it that this flow of humanity does not go to waste. Put to work in mines, workshops, and fields, the labor of the displaced will fund the next phase of expansion."
 me_arteon_gen_eptelon.3.a: "Every war produces its survivors. We will use them."
 me_arteon_gen_arth.1.t: "The Fang of Arteon"
 me_arteon_gen_arth.1.desc: "The priests of #T Artheous#! had spoken of the #T Fang#! in hushed, reverent tones for generations — a relic said to have been carried by the first Artheousan war-king, a blade that would mark its bearer as the chosen of the war god. Whether the legend is true or merely useful, [ROOT.GetCountry.GetRuler.GetName|Y] now holds the Fang in hand. The weight of it feels different from other blades. The warriors who witness it fall silent. Sometimes, the legend is the point."
 me_arteon_gen_arth.1.a: "Let all of Arteon see what we carry."
 me_arteon_gen_arth.2.t: "The Horteonian Compact"
 me_arteon_gen_arth.2.desc: "The Horteonians have never been a people of letters or philosophy — they are a people of callused hands and unbreakable endurance, shaped by generations of hard labor in the shadow of greater powers. [ROOT.GetCountry.GetRuler.GetName|Y] has approached their chieftains not as conquerors, but as employers. The terms are simple: service in [ROOT.GetCountry.GetAdjective] legions in exchange for pay, land, and the protection of a sovereign who has already proven capable of projecting force. The Horteonians have accepted."
 me_arteon_gen_arth.2.a: "Sturdy folk. We will put them to good use."
