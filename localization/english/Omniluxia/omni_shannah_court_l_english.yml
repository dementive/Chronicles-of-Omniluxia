 omni_sf_ui_omni_sf_build_tip:0 "@religious_icon! #T Cultivate the Shannah's Favor#!\nA repaired roof, a lavish gift, a service quietly rendered: the court remembers its benefactors.\n\n#T Audience Status#!\n[Player.Custom('omni_sf_ui_build_status')]\n\n#T Gifts and Services#!\n#Y Three encounters#! over the coming months offer opportunities to earn #G Favor#!. Gifts draw on your treasury @gold!; some services cost @political_influence! Political Influence.\n\n#T A Personal Understanding#!\n#Y One attempt per year#!. Favor is capped at #Y 100#! and ends when #R either ruler leaves office#!.\n[Player.Custom('omni_sf_ui_risk')]"
