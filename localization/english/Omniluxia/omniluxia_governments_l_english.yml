 magic_monarchy:0 "Magicratic Monarchy"
 magic_monarchy_desc:0 "The empowerment of the Mage class has infiltrated the highest levels of governance. A Magicratic Monarchy is a monarchy, as such, which is predicated on the Mage class, who control the majority of the politics within the system."
 magic_monarchy_ruler:0 "Sovereign of Souls" 
 magic_monarchy_consort:0 "Mistress of Magic" 
 magic_monarchy_ruler_female:0 "Mistress of Magic"

 kinones_clan:0 "D'ai-D'ai"
 kinones_clan_desc:0 "Although the Sons of Kon are united through faith, their people remain divided amongst hundreds of small kinship groups across the Peaceful Valley. Larger families, or 'D'ai-D'ai', typically maintain a large manor or settlement from where they control minor families through marriage, coercion, and, occasionally, force. Not all of these Great Clans follow the same Kino, however, most treat lower families with the respect preached by Koni-Koni N'de-Bu."
 kinones_clan_ruler:0 "B'au-B'au" 
 kinones_clan_consort:0 "Tz'au-Tz'au" 
 kinones_clan_female:0 "Tz'au-Tz'au"

 