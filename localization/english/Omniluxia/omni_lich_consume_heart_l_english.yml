l_english:
 omni_lich_consume_heart: "Consume Heart"
 omni_lich_consume_heart_act: "Consume $CHAR$'s heart"
 omni_lich_consume_heart_desc: "A lich of our court tears the still-beating heart from this prisoner and devours it, drinking in the life and mana bound within. Each heart sates the undead hunger less than the last; only a full year of fasting restores its potency."
 omni_consume_heart_lich_free_tt: "We have a living lich in our service who is not imprisoned"
 omni_consume_heart_cooldown_tt: "A heart has been consumed within the last month (available again on [SCOPE.sCountry('actor').GetVariableExpiry('omni_consume_heart_cd')|Y])"
 omni_consume_heart_effect_tt: "The lich devours the heart:\n Gains #G 25 + 10%#! of their maximum mana (at most #G 60#!) and #G +5#! health\n Each heart eaten in the past year reduces this by #R 25%#! (to a minimum of #R 25%#!)\n The prisoner #R dies#!\n"
 death_heart_consumed: "Had their heart devoured by a lich"
