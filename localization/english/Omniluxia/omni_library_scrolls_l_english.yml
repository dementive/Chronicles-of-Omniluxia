l_english:
 omni_library_scrolls.1.t:0 "Library Scrolls"
 omni_library_scrolls.1.desc:0 "The library shelves are arranged by region, school, and the private habits of generations of keepers. Scrolls your country has not yet read appear in green and must be purchased once; scrolls already known to your country can be read again for free. Rarer scrolls cost more gold."
 omni_library_scrolls.buy.scroll_borders_that_bent:0 "#G Buy The Borders That Bent But Did Not Break#! - 60 Gold"
 omni_library_scrolls.read.scroll_borders_that_bent:0 "Read The Borders That Bent But Did Not Break"
 omni_library_scrolls.scroll_borders_that_bent.title:0 "The Borders That Bent But Did Not Break"
 omni_library_scrolls.scroll_borders_that_bent.tooltip:0 "#T The Borders That Bent But Did Not Break#!\nRarity: Common\nRegional pools: Borderlander and Marshlander oral histories\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_borders_that_bent.text:0 "The Borders That Bent But Did Not Break\n\nCompiled by Ptolemaios of Weagalia, sent north to find a king\n\nThe elders of the reed country place the first free winter at 697 LC, in the disorder following the Great Collapse. I asked them repeatedly for the name of the king who led the rising. I was told, with what I can only describe as deliberate patience, that there had not been one. I asked for the decisive battle. There had not been one of those either.\n\nWhat I was given instead was a catalogue. This bend of the river. That hill camp. A reed town whose name I could not transcribe to my satisfaction, and whose people corrected my spelling twice and my premise four times. No two accounts agree on the order of events. Every account agrees on the outcome, which is that the Nazani stopped coming.\n\nI submit this to the archive with one observation. A people who decline to produce a founder are uncommonly difficult to subdue, there being nothing at the centre to remove. Whether this constitutes a strategy or merely a habit, the reader may determine at leisure. The elders, asked directly, laughed."
 omni_library_scrolls.buy.scroll_telamon_veterans:0 "#G Buy The Veterans of Telamon#! - 60 Gold"
 omni_library_scrolls.read.scroll_telamon_veterans:0 "Read The Veterans of Telamon"
 omni_library_scrolls.scroll_telamon_veterans.title:0 "The Veterans of Telamon"
 omni_library_scrolls.scroll_telamon_veterans.tooltip:0 "#T The Veterans of Telamon#!\nRarity: Common\nRegional pools: Nazani western imperial libraries\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_telamon_veterans.text:0 "The Veterans of Telamon\n\nFrom the Instruction of Officers, Gonessionem VII Weagalia; the compiler's name has been struck from the title page\n\nThe disaster of 991 LC is treated at length in the third book and need not be rehearsed here. The present chapter concerns the four years that followed it, and in particular the error of supposing that an army restored is an army satisfied.\n\nTsunndomtu Nazani rebuilt the legions in the correct order: discipline, then march-speed, then confidence. By 994 LC they were, by every measure this office keeps, better than they had been before Telamon. It is a matter of record that they were also worse. The Treaty of Telamon was signed in the spring of that year and the frontier question was closed.\n\nThe archives contain no mutiny and no petition. They contain an unusually high number of transfer requests, a persistent shortfall in the reenlistment rolls, and a marching song which the compiler declines to reproduce. The lesson is set down here without comment, since comment has been discouraged: soldiers remember the wars they were forbidden to finish."
 omni_library_scrolls.buy.scroll_orc_ports_secret_gold:0 "#G Buy Secret Gold for the Orcish Ports#! - 120 Gold"
 omni_library_scrolls.read.scroll_orc_ports_secret_gold:0 "Read Secret Gold for the Orcish Ports"
 omni_library_scrolls.scroll_orc_ports_secret_gold.title:0 "Secret Gold for the Orcish Ports"
 omni_library_scrolls.scroll_orc_ports_secret_gold.tooltip:0 "#T Secret Gold for the Orcish Ports#!\nRarity: Uncommon\nRegional pools: Borderlander and Marshlander oral histories, Nazani western imperial libraries\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_orc_ports_secret_gold.text:0 "Secret Gold for the Orcish Ports\n\nTwo accounts, bound facing one another by a librarian who left no name\n\nON THE LEFT-HAND PAGE, in the borderland manner: They came as weather, and the weather had coin in it. From 997 LC the crates went into the orcish harbours with imperial seals still wet on them, and any fool with a scale could tell the cargo was heavier than honest trade. Our tribes bled, and the Celtican bands bled, and not one legion crossed the frontier to do it.\n\nON THE RIGHT-HAND PAGE, in the imperial manner: The policy is correctly understood as a shield. Expenditure of this character purchases at the margin what would otherwise be purchased at the centre, in men. The Treasury records the sum as modest. The Frontier Office records the result as satisfactory. No further justification is thought necessary.\n\nThe librarian has written across the gutter between them, in a small hand: Both are true, and the border is attacked by merchants long before it is attacked by soldiers. I have placed them thus so that the reader must hold one page down with each hand."
 omni_library_scrolls.buy.scroll_kainaxarthos_taken:0 "#G Buy When Kainaxarthos Was Taken#! - 60 Gold"
 omni_library_scrolls.read.scroll_kainaxarthos_taken:0 "Read When Kainaxarthos Was Taken"
 omni_library_scrolls.scroll_kainaxarthos_taken.title:0 "When Kainaxarthos Was Taken"
 omni_library_scrolls.scroll_kainaxarthos_taken.tooltip:0 "#T When Kainaxarthos Was Taken#!\nRarity: Common\nRegional pools: Soventeir Dragkhanic-Zanic texts, Nazani western imperial libraries\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_kainaxarthos_taken.text:0 "When Kainaxarthos Was Taken\n\nAttributed to Jnanaghose of the Second Camp, with marginal corrections in a later Nazani hand\n\nIn 754 LC the riders came down out of the Celica passes and took the old imperial city in a season, which the singers of my people hold to be the hour that proved old walls will accept new masters without complaint. The gates were opened. The granaries were full. The stones did not object.\n\n(In the margin, in a neater and much colder hand:) The city was not taken. It was let fall. Revolt, exhaustion and distance had emptied the garrison years before any horse reached the wall. The author mistakes arrival for conquest, an error common to cavalry.\n\n(Beneath this, in the first hand again:) By 795 LC the empire had cut off its southern colonies entirely and we held the prize. Let the margin explain that. Commanders who buy this scroll should note that both hands are still arguing over whether a province is won by speed or by legitimacy, and that the province, meanwhile, has been paying its taxes to us for forty years."
 omni_library_scrolls.buy.scroll_uttarasmake_court:0 "#G Buy The Court of Uttarasmake#! - 60 Gold"
 omni_library_scrolls.read.scroll_uttarasmake_court:0 "Read The Court of Uttarasmake"
 omni_library_scrolls.scroll_uttarasmake_court.title:0 "The Court of Uttarasmake"
 omni_library_scrolls.scroll_uttarasmake_court.tooltip:0 "#T The Court of Uttarasmake#!\nRarity: Common\nRegional pools: Soventeir Dragkhanic-Zanic texts, Helluvian sermons and resistance texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_uttarasmake_court.text:0 "The Court of Uttarasmake\n\nFrom the Qhagan's Book of Days, kept by the chancery at Kainaxarthos\n\nHe was raised Qhagan in 868 LC by the assembly of the clans, and the assembly believed it had elevated a clan-lord. The chancery record shows otherwise from the first month. Edicts are issued in Zanic form. Geallian Kainaxari usage is promoted at court. Officers of the riding are instructed in a grammar their fathers had conquered without needing to learn.\n\nHis conversion to Helluvianism in 874 LC completed the design, binding the conquest to a purpose that did not require his personal survival to continue. The chronicle is candid about the cost. Three clans withdrew their tribute in that decade and were not pursued, which the chancery describes as forbearance and the clans described otherwise.\n\nThe moral, insofar as a court chronicle is permitted one: a horde may be tamed by institutions, and the institutions will always be resented by exactly those riders who made them possible. This has been true of every conquest the archive holds, and the archive holds a great many."
 omni_library_scrolls.buy.scroll_two_purple_thrones:0 "#G Buy Two Purple Thrones#! - 60 Gold"
 omni_library_scrolls.read.scroll_two_purple_thrones:0 "Read Two Purple Thrones"
 omni_library_scrolls.scroll_two_purple_thrones.title:0 "Two Purple Thrones"
 omni_library_scrolls.scroll_two_purple_thrones.tooltip:0 "#T Two Purple Thrones#!\nRarity: Common\nRegional pools: Zanic successor classics, Razani eastern imperial libraries, Nazani western imperial libraries\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_two_purple_thrones.text:0 "Two Purple Thrones\n\nFrom the Succession Commentaries, author disputed, probably a court official who outlived three masters\n\nThe Great Collapse removed Emperor Zzunnon and with him the last hand steady enough to hold the Zani inheritance whole. What followed was not grief. It was arithmetic. Who had married whom. Who held which treasury key. Whose guards stood nearest the palace door on the night the news arrived.\n\nDurobaeraste raised the eastern claim, which became Razani. Bharamuntacho Zani raised the western, which became Nazani. By 690 LC council intrigue and two well-chosen marriages had hardened a quarrel into a border, and a border into two empires, each of which has since produced a great many documents proving it was the original.\n\nThe commentator observes only this. Succession is not a ceremony performed after a disaster. It is a blade that the disaster finds already half drawn, and the hand nearest the hilt is rarely the hand the law intended."
 omni_library_scrolls.buy.scroll_theolosius_well:0 "#G Buy The Well Beneath Petramonis#! - 240 Gold"
 omni_library_scrolls.read.scroll_theolosius_well:0 "Read The Well Beneath Petramonis"
 omni_library_scrolls.scroll_theolosius_well.title:0 "The Well Beneath Petramonis"
 omni_library_scrolls.scroll_theolosius_well.tooltip:0 "#T The Well Beneath Petramonis#!\nRarity: Rare\nRegional pools: Zanic successor classics, Helluvian sermons and resistance texts\n#G Reward#! #T 3% Religious Tech Research#!"
 omni_library_scrolls.scroll_theolosius_well.text:0 "The Well Beneath Petramonis\n\nCopied for the twelfth time in this house; the original hand is not known and may not have been sane\n\nIn 670 LC the Zani armies closed upon Petramonis and Theolosius went into the lower library. This much is agreed by every source, hostile and devoted alike. He was not, at the outset, a madman. He was a scholar with no answer left in any book he was willing to trust, and so he went to the books he was not.\n\nHe found the sealed Divine Well of Melodias. He opened it. The account of what the opening required is given in the fourth section and this house has thrice voted not to copy it, a vote the present scribe upholds. The northern island was destroyed. The world was split. The very seasons have not since returned to their old order.\n\nThis scroll is kept by priests as a warning and by generals for the opposite reason, and the two readings have never been successfully separated. Let the reader note that in every besieged city there is a door marked forbidden, and that it is tempting precisely because it promises an ending. Some endings should have stayed shut."
 omni_library_scrolls.buy.scroll_magonis_ban:0 "#G Buy The Ban of Magonis#! - 120 Gold"
 omni_library_scrolls.read.scroll_magonis_ban:0 "Read The Ban of Magonis"
 omni_library_scrolls.scroll_magonis_ban.title:0 "The Ban of Magonis"
 omni_library_scrolls.scroll_magonis_ban.tooltip:0 "#T The Ban of Magonis#!\nRarity: Uncommon\nRegional pools: Zanic successor classics, Nazani western imperial libraries, Razani eastern imperial libraries\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_magonis_ban.text:0 "The Ban of Magonis\n\nThe decree of 701 LC, as preserved in the eastern law-books, with the marginalia of subsequent readers\n\nBe it known that the Guild of Magonis the Wise is dissolved in both Empires; that its instruction is forbidden; that its practice is a capital matter and not a suspect craft; and that the horrors attending the Great Collapse are held sufficient cause, requiring no further demonstration before any court.\n\n(A first marginal hand, contemporary:) Necessary. Anyone who saw the year 670 would sign this twice. (A second hand, perhaps a century later:) Anyone who saw the year 670 was in no condition to legislate about it. (A third, undated, in the same ink as the binding:) Observe that the decree forbids the practice and not the study, and that both Empires have since forbidden the study anyway, without troubling to write it down.\n\nThe law-book carries no reply to the marginalia. It has been reissued eleven times without amendment, which the jurists hold to be a proof of its soundness, and which the marginal hands evidently held to be something else."
 omni_library_scrolls.buy.scroll_dragonscale_school:0 "#G Buy The First Scales of Defense#! - 240 Gold"
 omni_library_scrolls.read.scroll_dragonscale_school:0 "Read The First Scales of Defense"
 omni_library_scrolls.scroll_dragonscale_school.title:0 "The First Scales of Defense"
 omni_library_scrolls.scroll_dragonscale_school.tooltip:0 "#T The First Scales of Defense#!\nRarity: Rare\nRegional pools: Nazani western imperial libraries, Soventeir Dragkhanic-Zanic texts\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_dragonscale_school.text:0 "The First Scales of Defense\n\nThe founding statement of the Dragonscale School, revised by later wardens who did not sign their revisions\n\nThe school was established in 707 LC beyond the comfortable reach of Nazani law, by Zani mages in flight and by local Dragkhanic-Zanic scholars who had the good sense to take them in. The curriculum was not chosen for elegance. It was chosen because the founders were being hunted, and a hunted school studies what keeps it alive.\n\nHence the order of instruction, unchanged in four generations: wards before workings, shields before strikes, and the holding of a stubborn position before anything at all that might be described as impressive. A first-year student is not taught to break a wall until the fourth year, on the principle that a wall broken is a wall that has told everyone where you are standing.\n\nCautious captains have long favoured our graduates. Ambitious ones complain that our people never dazzle. The wardens have declined to answer this complaint since 731 LC, when the last warden who tried to answer it was killed doing so."
 omni_library_scrolls.buy.scroll_razani_theme_reforms:0 "#G Buy The Theme Reforms of Ozpunnz#! - 120 Gold"
 omni_library_scrolls.read.scroll_razani_theme_reforms:0 "Read The Theme Reforms of Ozpunnz"
 omni_library_scrolls.scroll_razani_theme_reforms.title:0 "The Theme Reforms of Ozpunnz"
 omni_library_scrolls.scroll_razani_theme_reforms.tooltip:0 "#T The Theme Reforms of Ozpunnz#!\nRarity: Uncommon\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_razani_theme_reforms.text:0 "The Theme Reforms of Ozpunnz\n\nProvincial Notary Theodrastos, in his final report to a council that had already dissolved\n\nThe reforms of 929 LC proceeded from a sound premise: that land which defends itself defends itself sooner. Ozpunnz II tied the slave-estate manors and the legion themes to the frontier they stood upon, and the frontier's response time, which this office measured in seasons, fell to days within the decade. On the stated objective the policy must be judged a success.\n\nThe unstated consequence is set out in the appended tables. Hereditary power grew where the reform placed it, as water grows where it is poured. Every great household in the themes now maintains under public warrant a body of armed men it regards, in every practical sense, as its own.\n\nThis notary drafted the charters and does not disclaim them. He records only that the empire solved one crisis by planting the next in the same furrow, and that the second crop has always been the heavier of the two."
 omni_library_scrolls.buy.scroll_jarenam_educated_chain:0 "#G Buy The Educated Chain#! - 60 Gold"
 omni_library_scrolls.read.scroll_jarenam_educated_chain:0 "Read The Educated Chain"
 omni_library_scrolls.scroll_jarenam_educated_chain.title:0 "The Educated Chain"
 omni_library_scrolls.scroll_jarenam_educated_chain.tooltip:0 "#T The Educated Chain#!\nRarity: Common\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_jarenam_educated_chain.text:0 "The Educated Chain\n\nA reformist tract, circulated without imprint; the Razani censors have destroyed nine printings and the tenth is in your hands\n\nConsider first what the Bhaxian nobility actually did. Finding the labour of governing tedious, they trained enslaved Yarenamians to perform it, and trusted that a chain about the ankle constituted a chain about the understanding. Jarenam was made a general and a statesman by men who believed he could be safely made both.\n\nConsider then 977 LC. Zemmairthia fell. Western Luxterra burned. Razani authority broke, and it broke precisely along the seam its own comfort had stitched, since the man dismantling the machine had been taught its workings by the owners of the machine, for their convenience, at their expense.\n\nThe tract does not argue that oppression creates its own destroyers by some natural law. It argues something narrower and harder to answer. Oppression is most dangerous at the exact moment it becomes efficient, because efficiency requires teaching somebody how everything fits together, and the teacher does not get to choose what the student concludes."
 omni_library_scrolls.buy.scroll_gesma_limit:0 "#G Buy The Limit at Gesma#! - 120 Gold"
 omni_library_scrolls.read.scroll_gesma_limit:0 "Read The Limit at Gesma"
 omni_library_scrolls.scroll_gesma_limit.title:0 "The Limit at Gesma"
 omni_library_scrolls.scroll_gesma_limit.tooltip:0 "#T The Limit at Gesma#!\nRarity: Uncommon\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_gesma_limit.text:0 "The Limit at Gesma\n\nFrom the Tactical Commentaries of the Eastern Schools, attributed to a staff of officers rather than to any one of them\n\nGesma, 989 LC, is misread by students who come to it expecting a reversal. Jarenam's conquests were not undone on that field and the maps of the following year show them substantially intact. What was undone was the assumption, held by his army and rather more dangerously by himself, that the next victory would arrive on schedule.\n\nThe Razani line held, countered, and then, crucially, did nothing brilliant whatsoever. It simply refused to break for long enough that the campaign season closed. Momentum denied once does not recover its old confidence; the conqueror spent his remaining years suppressing revolt in provinces he had taken and never converted.\n\nThe commentary sets down the principle in the form used at examination. Every campaign must eventually become a government. The commander who cannot perform this second and duller act has lost, irrespective of what the maps continue to say about him."
 omni_library_scrolls.buy.scroll_zainudian_revelations:0 "#G Buy Three Revelations on the Road#! - 60 Gold"
 omni_library_scrolls.read.scroll_zainudian_revelations:0 "Read Three Revelations on the Road"
 omni_library_scrolls.scroll_zainudian_revelations.title:0 "Three Revelations on the Road"
 omni_library_scrolls.scroll_zainudian_revelations.tooltip:0 "#T Three Revelations on the Road#!\nRarity: Common\nRegional pools: Zinduidian and Zainudian works\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_zainudian_revelations.text:0 "Three Revelations on the Road\n\nFrom the Life of Bachin, in the recension favoured at Makok; other recensions differ on the order and are not preferred here\n\nHe put aside his household in 697 LC, at an hour when the empires were cracking loudly enough that few noticed one wealthy man going quietly out of a gate. The Life is careful on this point. He did not go seeking a throne, a following, or a doctrine. He went seeking an account of suffering, which is a smaller and far more dangerous errand.\n\nThe first revelation is placed near Dui-Ttaushu and is described as arriving quietly. The second is placed near Ddu-Nuinop, after which he is recorded as having been unable to speak for three days, a detail the rival recensions omit and this house retains. The third came at Makok, when the idols had been cleared from the Zaindaxan by hands including his own.\n\nThe Life draws the conclusion its readers expect and the conclusion happens also to be true. Truth travels through exile before it reaches a court. Zealots take patience from this. Statesmen ought to take something more useful, which is a proper respect for movements that begin far outside the room where they will eventually have to be dealt with."
 omni_library_scrolls.buy.scroll_jaoz_tomb:0 "#G Buy The Tomb Carried Home#! - 120 Gold"
 omni_library_scrolls.read.scroll_jaoz_tomb:0 "Read The Tomb Carried Home"
 omni_library_scrolls.scroll_jaoz_tomb.title:0 "The Tomb Carried Home"
 omni_library_scrolls.scroll_jaoz_tomb.tooltip:0 "#T The Tomb Carried Home#!\nRarity: Uncommon\nRegional pools: Zinduidian and Zainudian works\n#G Reward#! #T 1% Religious Tech Research#!"
 omni_library_scrolls.scroll_jaoz_tomb.text:0 "The Tomb Carried Home\n\nFrom the Acts of the Coalition, compiled at Makok from the testimony of men who had carried it\n\nJaoz died in 726 LC, the Zaraken revolt having been put down with a thoroughness the Acts describe at length and this abridgement omits. He was laid at Kyaxares, and the burial was understood at the time to be permanent, as burials generally are.\n\nKyaxares fell during the Great Zinduidian Revolt in 946 LC. The coalition forces did not hold the city and made no serious attempt to. They took the tomb instead and walked it back to Makok, a distance the Acts give in stages and in the names of the villages that came out to the roadside as it passed.\n\nThe compilers are frank about why the scroll is copied so often. Rulers in want of religious legitimacy prefer a recovered relic to a fresh miracle, the former being cheaper to verify and considerably harder to dispute. That the carriers themselves seem to have had simpler motives is recorded in the Acts and generally skipped by the men who commission copies."
 omni_library_scrolls.buy.scroll_azar_ruzel:0 "#G Buy Ruzel and the Open Road#! - 60 Gold"
 omni_library_scrolls.read.scroll_azar_ruzel:0 "Read Ruzel and the Open Road"
 omni_library_scrolls.scroll_azar_ruzel.title:0 "Ruzel and the Open Road"
 omni_library_scrolls.scroll_azar_ruzel.tooltip:0 "#T Ruzel and the Open Road#!\nRarity: Common\nRegional pools: Azar and Gold Dwarf chronicles, Zanic successor classics\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_azar_ruzel.text:0 "Ruzel and the Open Road\n\nFrom the Azari chronicles, with the imperial account appended by a later owner who evidently thought it needed appending\n\nThe Azari entry for 51 LC is one sentence long and has not been expanded in four hundred years: the road was opened before the shield was raised. The border states that owed Tiuban and the Golden Dwarves a warning gave silence instead, and Zanis marched through political weakness as if it were a paved highway, which in every sense that mattered it was.\n\nThe appended imperial account runs to nine pages and calls the same movement a masterpiece of operational judgement. It is not wrong. The march was fast, the supply arrangements were excellent, and no engagement of consequence was required to accomplish any of it.\n\nThe scroll's value lies in the fact that neither account contradicts the other at any point. A road may be a triumph of movement and a wound through every kingdom it crosses. Chroniclers who insist on choosing one word are usually being paid by somebody who cares which."
 omni_library_scrolls.buy.scroll_etemenazari_dust:0 "#G Buy Dust of Etemenazari#! - 120 Gold"
 omni_library_scrolls.read.scroll_etemenazari_dust:0 "Read Dust of Etemenazari"
 omni_library_scrolls.scroll_etemenazari_dust.title:0 "Dust of Etemenazari"
 omni_library_scrolls.scroll_etemenazari_dust.tooltip:0 "#T Dust of Etemenazari#!\nRarity: Uncommon\nRegional pools: Azar and Gold Dwarf chronicles\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_etemenazari_dust.text:0 "Dust of Etemenazari\n\nBel-ibni, keeper of the Ziggurat, dictated in his eighty-first year; the scribe notes several long pauses\n\nIn 61 LC the Zanis took the Azari cities, and the Great Ziggurat of Etemenazari was brought down. The keeper's account is exact where accounts of this kind are usually vague. He gives the order in which the terraces were taken, the number of days, and the names of the rituals that could no longer be performed after the fourth day, there being no longer a fourth terrace to perform them upon.\n\nThe Zanic record treats the demolition as the reduction of a rival centre of power and devotes to it a single clause. Both descriptions are accurate. This is the difficulty with holy places, which are holy in one ledger and structural in another, and which are never permitted to be only the first once an army has arrived to consult the second.\n\nThe scribe has added, beneath the dictation and in his own hand: he did not weep. He listed. I have come to understand that for a keeper these are the same act."
 omni_library_scrolls.buy.scroll_pomegranate_throne:0 "#G Buy The Pomegranate Throne in Exile#! - 60 Gold"
 omni_library_scrolls.read.scroll_pomegranate_throne:0 "Read The Pomegranate Throne in Exile"
 omni_library_scrolls.scroll_pomegranate_throne.title:0 "The Pomegranate Throne in Exile"
 omni_library_scrolls.scroll_pomegranate_throne.tooltip:0 "#T The Pomegranate Throne in Exile#!\nRarity: Common\nRegional pools: Baetepian and Dune court texts\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_pomegranate_throne.text:0 "The Pomegranate Throne in Exile\n\nFrom the court texts of Dune, where it has been kept since it arrived\n\nZanis conquered the Baetep in 58 LC and installed the Sertem family over the administration, and the administration was, by all surviving measures, competent. The palace was occupied within the month. The court texts observe drily that this is the last unqualified success the conquest is able to claim.\n\nThe Pomegranate Throne left the country before the new administrators had finished unpacking. It went by back corridors and desert road into the Old Kingdom of Dune, and the account of the smuggling is deliberately vague on route and on names, a vagueness the Dune archivists have preserved on the grounds that the road may yet be needed again.\n\nWhat is asserted here, and asserted rather more confidently than the evidence strictly permits, is that sovereignty may be carried. A palace is a place and may be occupied. A throne that has become a story is not a place at all, and administrators arriving to take possession of a province have never once found the correct room to search."
 omni_library_scrolls.buy.scroll_sertem_accounts:0 "#G Buy The Sertem Accounts of Baetep#! - 120 Gold"
 omni_library_scrolls.read.scroll_sertem_accounts:0 "Read The Sertem Accounts of Baetep"
 omni_library_scrolls.scroll_sertem_accounts.title:0 "The Sertem Accounts of Baetep"
 omni_library_scrolls.scroll_sertem_accounts.tooltip:0 "#T The Sertem Accounts of Baetep#!\nRarity: Uncommon\nRegional pools: Baetepian and Dune court texts, Zanic successor classics\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_sertem_accounts.text:0 "The Sertem Accounts of Baetep\n\nThe early Sertem ledgers, with a commentary added by an anonymous provincial clerk\n\nThe ledgers count grain, river tolls, temple obligations, and households, in that order, in a hand that never varies and never editorialises. Zanic administrators of the period praise them warmly and were right to. Conquest is converted here into routine, and routine into revenue, with a competence that the imperial service held up as a model for two centuries.\n\nThe commentary concerns itself with the columns rather than their totals. It notes the temple obligations discharged in full and late, always late, always by the same eleven families. It notes a river toll that produces, for thirty consecutive years, a figure exactly one measure short of the assessment, and an auditor who never once travelled out to see why.\n\nThe clerk's closing note is the reason the scroll is bought. Everything of importance in a conquered province, he writes, is recorded somewhere in the accounts. It is simply never recorded in the column where the accountant is looking."
 omni_library_scrolls.buy.scroll_helluvian_bubdonno:0 "#G Buy The Mayor of Bubdonno#! - 60 Gold"
 omni_library_scrolls.read.scroll_helluvian_bubdonno:0 "Read The Mayor of Bubdonno"
 omni_library_scrolls.scroll_helluvian_bubdonno.title:0 "The Mayor of Bubdonno"
 omni_library_scrolls.scroll_helluvian_bubdonno.tooltip:0 "#T The Mayor of Bubdonno#!\nRarity: Common\nRegional pools: Helluvian sermons and resistance texts, Soventeir Dragkhanic-Zanic texts\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_helluvian_bubdonno.text:0 "The Mayor of Bubdonno\n\nFrom the Bubdonno homilies; the compiler insists this is a saint's life and it is plainly not\n\nO-Peliaz founded the settlement in 734 LC for Helluvian communities that had been made unwelcome everywhere else in Kainaxarthos. For four years it was a refuge and nothing more interesting than that, and the homilies pass over these years quickly, which is itself instructive.\n\nIn 738 LC Nazani soldiers arrived, blinded believers in the street, and set about converting the settlement into a militia camp. The text now becomes extremely specific. It gives the order in which the quarters were roused, who carried word between them, which trades supplied what, and how long the imperial detachment held the market square. It reads, in short, less like devotion than like a manual, and the resemblance is not accidental.\n\nThe rising defeated the imperial force and holy militias spread across the region within the year. The compiler concludes with the pious formula about faith rewarded. The nine preceding pages have already explained, in considerably more useful detail, that what was actually rewarded was four years of a community learning to trust its own neighbours before it needed to."
 omni_library_scrolls.buy.scroll_crucifixion_unrest:0 "#G Buy After the Crucifixion#! - 120 Gold"
 omni_library_scrolls.read.scroll_crucifixion_unrest:0 "Read After the Crucifixion"
 omni_library_scrolls.scroll_crucifixion_unrest.title:0 "After the Crucifixion"
 omni_library_scrolls.scroll_crucifixion_unrest.tooltip:0 "#T After the Crucifixion#!\nRarity: Uncommon\nRegional pools: Helluvian sermons and resistance texts, Nazani western imperial libraries\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_crucifixion_unrest.text:0 "After the Crucifixion\n\nTwo records set side by side, as the library at Bubdonno has kept them since the Soventeir wars\n\nTHE IMPERIAL RECORD, in full: O-Peliaz taken, 745 LC. Sentence of crucifixion carried out. Order in the district restored. Requisitions for the following quarter as previously submitted.\n\nTHE HELLUVIAN RECORD, abridged: The unrest did not close with him. Militias formed in villages that had sent nobody to Bubdonno and knew his name only as a rumour. Governors were recalled, garrisons redeployed, and the imperial administration of the region was still improvising when the Soventeir invasions arrived and rendered the whole question academic.\n\nThe library keeps them together because the juxtaposition makes an argument neither makes alone. Punishment scatters a people; it does not touch whatever first gathered them. The imperial clerk who wrote four lines and moved on to requisitions was not careless. He was simply looking, with great diligence, at the wrong ledger."
 omni_library_scrolls.buy.scroll_high_elven_peace:0 "#G Buy The Peace That No One Won#! - 60 Gold"
 omni_library_scrolls.read.scroll_high_elven_peace:0 "Read The Peace That No One Won"
 omni_library_scrolls.scroll_high_elven_peace.title:0 "The Peace That No One Won"
 omni_library_scrolls.scroll_high_elven_peace.tooltip:0 "#T The Peace That No One Won#!\nRarity: Common\nRegional pools: Arteonian and High Elven war texts, Horteonian, gnomish, and northern texts\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_high_elven_peace.text:0 "The Peace That No One Won\n\nFrom the diplomatic histories of Arteon, compiled by a hand that was present at the signing and does not say so until the last page\n\nThe war opened as a succession dispute and did not remain one. Within a century it had become an argument about what the legacy of Atheus had meant, which is a question no treaty can settle and no army can lose. Even the Great Collapse, which interrupted the fighting in 670 LC, succeeded only in interrupting it.\n\nIt ended in 856 LC because both kings died within a short interval and neither side could any longer produce the men. The histories are careful to record that no position was conceded, no claim withdrawn, and no principle abandoned by anybody. The document signed that year settles the disposition of ports and says nothing whatever about the thing the war was about.\n\nDiplomats favour this scroll and read it more charitably than its author intended. Some settlements do not resolve a war. They postpone its meaning, and are called peace by everyone who has an interest in not asking what was decided."
 omni_library_scrolls.buy.scroll_slaver_fleet_divided:0 "#G Buy The Divided Great Slaver Navy#! - 120 Gold"
 omni_library_scrolls.read.scroll_slaver_fleet_divided:0 "Read The Divided Great Slaver Navy"
 omni_library_scrolls.scroll_slaver_fleet_divided.title:0 "The Divided Great Slaver Navy"
 omni_library_scrolls.scroll_slaver_fleet_divided.tooltip:0 "#T The Divided Great Slaver Navy#!\nRarity: Uncommon\nRegional pools: Arteonian and High Elven war texts, Eptelonian and Cymevan colonial texts\n#G Reward#! #T 1% Commerce Tech Research#!"
 omni_library_scrolls.scroll_slaver_fleet_divided.text:0 "The Divided Great Slaver Navy\n\nA commercial history, circulated among the Eptelonian trading houses and not intended for elven readers\n\nBefore the civil war the Great Slaver Navy was a single instrument answering a single admiralty, and the colonies at the far end of its routes were, whatever else may be said of them, supplied. This is the whole of the fleet's virtue and the history does not dwell on it longer than necessary.\n\nThe division of the inheritance between Calidriel and Cymeva divided the fleet, and the divided fleet was funded twice at rather less than half. The consequences appear first in the victualling records and only afterwards in the chronicles. Sailings to the outer stations fall away over eleven years. Nothing is announced. Nothing needs to be.\n\nSome distant settlements turned inward and survived by it. Others were taken by the peoples whose land they occupied, or simply stopped being written to. Merchants read this as a trade text and are correct to. The fate of a colony is decided in a naval budget several years before anybody at the colony is aware that a decision has been taken."
 omni_library_scrolls.buy.scroll_horteon_gnome_coalition:0 "#G Buy The Gnomes in the Fourth War#! - 60 Gold"
 omni_library_scrolls.read.scroll_horteon_gnome_coalition:0 "Read The Gnomes in the Fourth War"
 omni_library_scrolls.scroll_horteon_gnome_coalition.title:0 "The Gnomes in the Fourth War"
 omni_library_scrolls.scroll_horteon_gnome_coalition.tooltip:0 "#T The Gnomes in the Fourth War#!\nRarity: Common\nRegional pools: Horteonian, gnomish, and northern texts\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_horteon_gnome_coalition.text:0 "The Gnomes in the Fourth War\n\nFrom the northern war-books; the Horteonian and gnomish versions have been reconciled here, imperfectly\n\nThe coalition of 115 LC opened the Fourth Atheusian-Horteonian Wars with a run of victories which both allies have since claimed and which the reconciled account attributes, unromantically, to ground. The High Elven colonies of the east were defended by formations trained for open field and committed to passes where the gnomes knew every stone by its name.\n\nThe war closed in 160 LC with limited losses in the west for the Atheusians. The war-books of both allies agree that this understates the result, and both, for once, agree on why. What had been broken in the east was not a province but a confidence, and confidence does not appear in a treaty schedule.\n\nThe scroll is kept in the northern libraries for the sake of its final maxim, which the gnomish version renders more bluntly than the Horteonian. A coalition need not be stronger than its enemy anywhere. It need only choose the ground on which the enemy's strength is least relevant, and then decline, at length, to fight anywhere else."
 omni_library_scrolls.buy.scroll_projection_school:0 "#G Buy The Taanka Projection Lessons#! - 240 Gold"
 omni_library_scrolls.read.scroll_projection_school:0 "Read The Taanka Projection Lessons"
 omni_library_scrolls.scroll_projection_school.title:0 "The Taanka Projection Lessons"
 omni_library_scrolls.scroll_projection_school.tooltip:0 "#T The Taanka Projection Lessons#!\nRarity: Rare\nRegional pools: Polarian and projection magic texts\n#G Reward#! #T 2% Research Tech Research#!"
 omni_library_scrolls.scroll_projection_school.text:0 "The Taanka Projection Lessons\n\nThe prospectus of the Taanka School, in the recension of its third generation of masters\n\nThe School was founded in 781 LC at a distance from the southern panic over Magonis which the founders describe as adequate and later masters have described as barely adequate. Its first lessons concerned distance, image, and disciplined sight. They were not chosen for their grandeur; they were chosen because they could be taught in a cold room to students who would be walking home in the dark.\n\nThe prospectus is emphatic that projection is a method and not a marvel. Its practical value in Polarian conditions is set out in the second section: settlements separated by ice, kept in contact; routes surveyed without a surveyor crossing them; and a considerable reduction, over three generations, in the number of people who have simply never learned what their relatives look like.\n\nSouthern visitors ask, invariably, whether the School can project an army. The masters have prepared a standard answer, which is that it can, that this is the least interesting thing it does, and that a school which taught only that would have frozen to death in its first winter."
 omni_library_scrolls.buy.scroll_drow_ridonnorr:0 "#G Buy The Road from Ridonnorr#! - 60 Gold"
 omni_library_scrolls.read.scroll_drow_ridonnorr:0 "Read The Road from Ridonnorr"
 omni_library_scrolls.scroll_drow_ridonnorr.title:0 "The Road from Ridonnorr"
 omni_library_scrolls.scroll_drow_ridonnorr.tooltip:0 "#T The Road from Ridonnorr#!\nRarity: Common\nRegional pools: Northern anti-Drow and Drow war texts, Helluvian sermons and resistance texts\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_drow_ridonnorr.text:0 "The Road from Ridonnorr\n\nFrom the northern Acts of Balthazar, in the soldier's recension rather than the devotional one\n\nThe saint came among the border tribes in 792 LC and the Acts devote eleven pages to what he did before Ridonnorr, which was not fighting. The tribes were frightened, scattered, and in several documented cases rather more frightened of one another than of the Drow. The first campaign of the Svarddeni was conducted entirely in tents.\n\nRidonnorr itself occupies two pages. The Acts give the terrain honestly, note that the assault was neither clever nor cheap, and record that it succeeded because six tribes who had raided each other within living memory arrived on the same morning and stayed.\n\nThis recension is bought by northern commanders and not by priests, for reasons the proportions make plain. Faith and ground are both treated at length. So is the arithmetic of getting frightened strangers to stand in a line together, which the Acts describe, without apparent irony, as the longest road the saint ever built."
 omni_library_scrolls.buy.scroll_dalskiaengd_warning:0 "#G Buy The Warning of Dalskiaengd#! - 120 Gold"
 omni_library_scrolls.read.scroll_dalskiaengd_warning:0 "Read The Warning of Dalskiaengd"
 omni_library_scrolls.scroll_dalskiaengd_warning.title:0 "The Warning of Dalskiaengd"
 omni_library_scrolls.scroll_dalskiaengd_warning.tooltip:0 "#T The Warning of Dalskiaengd#!\nRarity: Uncommon\nRegional pools: Northern anti-Drow and Drow war texts\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_dalskiaengd_warning.text:0 "The Warning of Dalskiaengd\n\nAn after-action account, copied for the frontier forts; the margins are usually more useful than the text\n\nIn 993 LC the Drow defeated a weakened order and a coalition assembled in nineteen days. The account is unsparing and slightly tedious about the causes, which were not mysterious: years of costly war, a chain of command settled by precedence rather than competence, and a general belief that the enemy in question was a historical matter.\n\nThe Drow had not gone anywhere. They had been beneath the same ground the whole time, declining to be interesting, which the account identifies as their most effective manoeuvre and the one no coalition has yet found a counter to.\n\nCopies in service carry marginal additions rather than commentary. Watch posts, with distances. Messenger routes, with the seasons they fail. Debts still owed to the frontier forts, with names. The text warns that a buried enemy is only waiting for the surface to forget. The margins are where the not-forgetting is actually kept."
 omni_library_scrolls.buy.scroll_ular_pria_after_waves:0 "#G Buy The Ular-Pria After the Waves#! - 240 Gold"
 omni_library_scrolls.read.scroll_ular_pria_after_waves:0 "Read The Ular-Pria After the Waves"
 omni_library_scrolls.scroll_ular_pria_after_waves.title:0 "The Ular-Pria After the Waves"
 omni_library_scrolls.scroll_ular_pria_after_waves.tooltip:0 "#T The Ular-Pria After the Waves#!\nRarity: Rare\nRegional pools: Austropetolian serpent and sea texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_ular_pria_after_waves.text:0 "The Ular-Pria After the Waves\n\nThe survival registers of Austropetolia, with the elders' preface\n\nThe Collapse sent its storms and waves against these coasts and the Ular-Pria were very nearly ended. The registers begin, as the preface warns the reader they will, without a single king in them. The first entries are boats, by condition. The second are seed stores, by weight and by whether the salt had reached them. The third are names.\n\nThe preface defends this order at some length and rather more sharply than the occasion requires, from which later scholars have concluded that somebody objected at the time. A people cannot be governed, it argues, until it has been counted, and it cannot be counted by anyone who begins with the throne.\n\nCivic tutors set this text for rulers who suppose that administration commences when the banners return. The registers make the opposite case in the driest available manner, which is by simply continuing, year on year, in the same hand, until there is a country again around them."
 omni_library_scrolls.buy.scroll_cymevan_colonies:0 "#G Buy Cymeva's Colonial Ledger#! - 60 Gold"
 omni_library_scrolls.read.scroll_cymevan_colonies:0 "Read Cymeva's Colonial Ledger"
 omni_library_scrolls.scroll_cymevan_colonies.title:0 "Cymeva's Colonial Ledger"
 omni_library_scrolls.scroll_cymevan_colonies.tooltip:0 "#T Cymeva's Colonial Ledger#!\nRarity: Common\nRegional pools: Eptelonian and Cymevan colonial texts, Arteonian and High Elven war texts\n#G Reward#! #T 2% Commerce Tech Research#!"
 omni_library_scrolls.scroll_cymevan_colonies.text:0 "Cymeva's Colonial Ledger\n\nThe Eptelonian recension, kept in the trading houses; the High Elven recension is longer and less useful\n\nCymeva Atheus began the Eptelonian settlements in 876 LC, long after the unity that both recensions still speak of in the present tense had ceased in every practical respect to exist. The Eptelonian ledger opens with ships and ends with shortfalls, and treats the intervening enthusiasm as an accounting problem.\n\nThe columns are candid. Ships, settlers, coercion, and the expectation that a distant shore would answer a want at home which nobody in the capital wished to name plainly. The bargains struck in the ports are given in full, including the ones that were not kept, and the ledger notes which were not kept by whom.\n\nThe High Elven recension records the same ventures in terms of prestige and is thought by the trading houses to be the finer document. It is not consulted when money is at stake. Merchants prefer the version written by people who had to unload the ships."
 omni_library_scrolls.buy.scroll_zanis_months:0 "#G Buy The Two Added Months#! - 60 Gold"
 omni_library_scrolls.read.scroll_zanis_months:0 "Read The Two Added Months"
 omni_library_scrolls.scroll_zanis_months.title:0 "The Two Added Months"
 omni_library_scrolls.scroll_zanis_months.tooltip:0 "#T The Two Added Months#!\nRarity: Common\nRegional pools: Zanic successor classics\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_zanis_months.text:0 "The Two Added Months\n\nA commentary on the calendar reform of 79 LC, from the sacred college, with provincial objections appended\n\nThe reform inserted two months into the Luxterran Calendar. The college defends the change on the ground of harmony between imperial rule and sacred time, and the defence is not merely convenient; the argument is old, was argued before Zanis, and would have been argued had he never been born. This should be conceded before the objections are read.\n\nThe objections are appended in the order they were received and were not answered. Musters fell in the wrong season for three years. Tax terms overlapped and were collected twice in four districts, of which one was compensated. Festivals older than the empire were observed on the wrong day by an entire generation, which several provincial priests describe in language the college has preserved without comment.\n\nThe commentary closes on a note it evidently believes to be reassuring. All of this settled within a lifetime, and the calendar is now simply the calendar. The reader is invited to notice how completely the objection has vanished, and to consider what else can be made to vanish by the same method."
 omni_library_scrolls.buy.scroll_zanis_body_absent:0 "#G Buy The Absent Body of Zanis#! - 60 Gold"
 omni_library_scrolls.read.scroll_zanis_body_absent:0 "Read The Absent Body of Zanis"
 omni_library_scrolls.scroll_zanis_body_absent.title:0 "The Absent Body of Zanis"
 omni_library_scrolls.scroll_zanis_body_absent.tooltip:0 "#T The Absent Body of Zanis#!\nRarity: Common\nRegional pools: Zanic successor classics, Razani eastern imperial libraries, Nazani western imperial libraries\n#G Reward#! #T 1% Religious Tech Research#!"
 omni_library_scrolls.scroll_zanis_body_absent.text:0 "The Absent Body of Zanis\n\nA theological digest, prepared for successor courts that require the doctrine but not the argument\n\nZanis died in 97 LC. No body was recovered, and the digest is careful to note that the search was neither brief nor incompetent. The Zanisite reading followed within a decade: that the first emperor did not merely cease to be found but was taken up, and stands guard over the realms that came after him.\n\nThe sceptical court histories are given their due in the third section, and their due is not small. They observe that absence is the cheapest of miracles, requiring no witness, no relic, and no upkeep. The digest concedes every point and then makes the only argument that has ever mattered here, which is that the doctrine has not been weakened by a single one of them.\n\nIt is recommended for the libraries of all successor states without exception. Every one of them requires a founder it can invoke and cannot produce, and an empty tomb has proved, across four hundred years and two empires, considerably more durable than a full one."
 omni_library_scrolls.buy.scroll_melodias_weak_forest:0 "#G Buy When the Yaga Trees Weakened#! - 240 Gold"
 omni_library_scrolls.read.scroll_melodias_weak_forest:0 "Read When the Yaga Trees Weakened"
 omni_library_scrolls.scroll_melodias_weak_forest.title:0 "When the Yaga Trees Weakened"
 omni_library_scrolls.scroll_melodias_weak_forest.tooltip:0 "#T When the Yaga Trees Weakened#!\nRarity: Rare\nRegional pools: Horteonian, gnomish, and northern texts, Arteonian and High Elven war texts\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_melodias_weak_forest.text:0 "When the Yaga Trees Weakened\n\nA wardens' survey of the Eldritch Forests, with frontier depositions attached\n\nFollowing the release of Melodias the mana of the forests thinned, and the Yaga Trees no longer held their borders with the old dread. The survey is a technical document and reads as one. Bearing, season, depth of penetration by parties who ought to have turned back at the treeline, and the distance at which the trees are now first felt rather than first seen.\n\nThe elven wardens describe the change as a violation and the word appears in the survey's own headings, which later readers have taken as evidence that the wardens did not expect the document to travel. The frontier depositions attached to the third section use a different word throughout. They use opportunity, and they give timber volumes.\n\nThe scroll is restricted in several houses and copied freely in others. Its danger is not that it records a weakening. It is that it demonstrates, with figures, that a sacred landscape has seasons, and that anyone with a calendar and some patience may wait for the next one."
 omni_library_scrolls.buy.scroll_zanic_poetry_1:0 "#G Buy The Glass Petals of Magonis#! - 60 Gold"
 omni_library_scrolls.read.scroll_zanic_poetry_1:0 "Read The Glass Petals of Magonis"
 omni_library_scrolls.scroll_zanic_poetry_1.title:0 "The Glass Petals of Magonis"
 omni_library_scrolls.scroll_zanic_poetry_1.tooltip:0 "#T The Glass Petals of Magonis#!\nRarity: Common\nRegional pools: Zanic successor classics\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_zanic_poetry_1.text:0 "The Glass Petals of Magonis\n\nCallidorus of the Glass Quarter, whose name survives chiefly because it appeared on a list\n\nThe mages grew their gardens out of glass\nand every flower held its perfect hour;\nwhat would not wither also could not pass\nfrom bud to fruit, and that was all their power.\n\nI have seen an empire kept the selfsame way,\ntoo finely made to bend, and so it broke.\nSweep up the petals. Do not throw away\nthe light that in the breaking briefly spoke."
 omni_library_scrolls.buy.scroll_zanic_poetry_2:0 "#G Buy Hymns of the Absent Emperor#! - 120 Gold"
 omni_library_scrolls.read.scroll_zanic_poetry_2:0 "Read Hymns of the Absent Emperor"
 omni_library_scrolls.scroll_zanic_poetry_2.title:0 "Hymns of the Absent Emperor"
 omni_library_scrolls.scroll_zanic_poetry_2.tooltip:0 "#T Hymns of the Absent Emperor#!\nRarity: Uncommon\nRegional pools: Zanic successor classics\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_zanic_poetry_2.text:0 "Hymns of the Absent Emperor\n\nSerapina, temple chanter; the ninth hymn of a cycle of forty, the rest lost\n\nThey say the chair is empty. I say: look.\nA cup is emptiest when filled with light.\nHe poured himself away, and what he took\nhe gives back thinner, wider, every night.\n\nSo down the provinces the gold runs slow\ninto the low fields, into the late year,\ninto the mouths of men who do not know\nthey drink an emperor and call it clear."
 omni_library_scrolls.buy.scroll_zanic_poetry_3:0 "#G Buy The Last Luxterran Ode#! - 240 Gold"
 omni_library_scrolls.read.scroll_zanic_poetry_3:0 "Read The Last Luxterran Ode"
 omni_library_scrolls.scroll_zanic_poetry_3.title:0 "The Last Luxterran Ode"
 omni_library_scrolls.scroll_zanic_poetry_3.tooltip:0 "#T The Last Luxterran Ode#!\nRarity: Rare\nRegional pools: Zanic successor classics\n#G Reward#! #T 3% Civic Tech Research#!"
 omni_library_scrolls.scroll_zanic_poetry_3.text:0 "The Last Luxterran Ode\n\nEcphrastus, who paced the ruins and reports the city\n\nSing of the colonnade, seventy shafts to the sun-facing stair,\neach with its capital carved as a wave that has not yet come down;\nsing of the cisterns beneath, of the cold and deliberate air;\nsing of a city that measured itself and was pleased with the crown.\n\nSing of the third gate at evening, the shadow that fell like a rule,\nnorth by a hand and no more, and the masons who wanted it so.\nSing it in hexameter. Sing it correctly. Sing it whole.\nNobody living can check it. That is the reason I know.\n\nA later hand has added beneath the final line: every span he gives is exact, and every span is wrong. He measured grief and wrote down marble. The Academy has declined to correct the text."
 omni_library_scrolls.buy.scroll_zanic_poetry_4:0 "#G Buy Seven Steps of the Bronze Dancer#! - 60 Gold"
 omni_library_scrolls.read.scroll_zanic_poetry_4:0 "Read Seven Steps of the Bronze Dancer"
 omni_library_scrolls.scroll_zanic_poetry_4.title:0 "Seven Steps of the Bronze Dancer"
 omni_library_scrolls.scroll_zanic_poetry_4.tooltip:0 "#T Seven Steps of the Bronze Dancer#!\nRarity: Common\nRegional pools: Zanic successor classics\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_zanic_poetry_4.text:0 "Seven Steps of the Bronze Dancer\n\nModestus, from the acting copy; the stage directions are in a second hand\n\n(She takes the fifth step. The craftsman does not look up.)\nDANCER: I have been turning since the lamps were lit.\nCRAFTSMAN: Then turn. The commission is not due till spring.\nDANCER: There is a key between my shoulder blades.\nCRAFTSMAN: There is a key in everything I make.\n\n(The sixth step. She is slower. He does not look up.)\nDANCER: You could reach it without standing.\nCRAFTSMAN: I could.\nDANCER: I am asking for the winding, not the love.\nCRAFTSMAN: I know which one you are asking for.\n(The seventh step is not completed. The play ends here in every copy.)"
 omni_library_scrolls.buy.scroll_zanic_poetry_5:0 "#G Buy Whispers from the Imperial Loom#! - 60 Gold"
 omni_library_scrolls.read.scroll_zanic_poetry_5:0 "Read Whispers from the Imperial Loom"
 omni_library_scrolls.scroll_zanic_poetry_5.title:0 "Whispers from the Imperial Loom"
 omni_library_scrolls.scroll_zanic_poetry_5.tooltip:0 "#T Whispers from the Imperial Loom#!\nRarity: Common\nRegional pools: Zanic successor classics\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_zanic_poetry_5.text:0 "Whispers from the Imperial Loom\n\nThe weavers of the Third Quarter, name of author not recorded because there was not one\n\nOver, under, over, under,\nthe council is agreed.\nOver, under, over, under,\nthe council has decreed.\nPull it tight and snip it neat\nand roll it for the throne:\nthey never read the pattern,\nthey only weigh the stone.\n\nThe Academy now classes these among the higher lyric forms and prints them with a commentary on their irony. The weavers of the Third Quarter are still weaving and have not been asked."
 omni_library_scrolls.buy.scroll_zanic_poetry_6:0 "#G Buy The Emperor's Shadow#! - 120 Gold"
 omni_library_scrolls.read.scroll_zanic_poetry_6:0 "Read The Emperor's Shadow"
 omni_library_scrolls.scroll_zanic_poetry_6.title:0 "The Emperor's Shadow"
 omni_library_scrolls.scroll_zanic_poetry_6.tooltip:0 "#T The Emperor's Shadow#!\nRarity: Uncommon\nRegional pools: Zanic successor classics\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_zanic_poetry_6.text:0 "The Emperor's Shadow\n\nPalladion, on the proper making of imperial likenesses\n\nIt is laid down here, and the workshops of the capital have not departed from it in two hundred years, that the ruler shall be taken at the failing of the light and at no other hour. The reasons commonly given are three, and only the third is honest.\n\nThe first is that twilight flatters the bone. The second is that a face half in shadow is remembered longer than a face fully given, the eye being obliged to complete it and becoming, in the completing, complicit. The third is that every mortal ruler has a jaw, a temper, and an ending, and that the light which shows these things is not the light in which an empire wishes to be governed.\n\nThe apprentice is warned against the common error, which is to paint the shadow as an absence. It is not an absence. It is the greater part of the subject, and the illuminated portion is merely where the viewer is permitted to look."
 omni_library_scrolls.buy.scroll_zanic_poetry_7:0 "#G Buy Odes to the Two Moons#! - 60 Gold"
 omni_library_scrolls.read.scroll_zanic_poetry_7:0 "Read Odes to the Two Moons"
 omni_library_scrolls.scroll_zanic_poetry_7.title:0 "Odes to the Two Moons"
 omni_library_scrolls.scroll_zanic_poetry_7.tooltip:0 "#T Odes to the Two Moons#!\nRarity: Common\nRegional pools: Zanic successor classics\n#G Reward#! #T 1% Religious Tech Research#!"
 omni_library_scrolls.scroll_zanic_poetry_7.text:0 "Odes to the Two Moons\n\nDoridion, for the fourth watch of the symposium, when the argument has exhausted itself\n\nFill it again. The east has had its say,\nthe west has had its say, the lamps are low.\nUp there they hold no session and no sway\nand cannot be petitioned. Even so:\n\nthey rise on both our capitals the same,\nindifferent, unhurried, and complete,\nand shed on either half of one split name\nthe only light that both halves still can meet.\nDrink to them. They are the last thing shared.\nDrink to them twice. They have not asked us to."
 omni_library_scrolls.buy.scroll_zanic_poetry_8:0 "#G Buy The Silk Architect#! - 240 Gold"
 omni_library_scrolls.read.scroll_zanic_poetry_8:0 "Read The Silk Architect"
 omni_library_scrolls.scroll_zanic_poetry_8.title:0 "The Silk Architect"
 omni_library_scrolls.scroll_zanic_poetry_8.tooltip:0 "#T The Silk Architect#!\nRarity: Rare\nRegional pools: Zanic successor classics\n#G Reward#! #T 3% Civic Tech Research#!"
 omni_library_scrolls.scroll_zanic_poetry_8.text:0 "The Silk Architect\n\nSabinilla, whose plans have never been built and are reprinted every generation\n\nPlate the fourth: a pavilion of nine bays, roofed in woven dream, the beams spun glass and the glass under no obligation to the ground. The span is given as one hundred and forty feet. No support is drawn beneath it because none is intended. The reader is asked to accept this and continue.\n\nPlate the seventh: a stair that arrives before it departs. Plate the eleventh: a courtyard whose shadow falls inward. The notes to these are brief and slightly impatient, in the manner of an architect who has been asked the same question too often.\n\nAmbitious city planners buy this book at ruinous prices and write to the author's estate requesting the engineering. There is none. There was never any. What the book supplies is the wanting, and the wanting has raised more actual stone in this empire than any manual of construction ever printed."
 omni_library_scrolls.buy.scroll_zanic_poetry_9:0 "#G Buy Melodies of the Sundered Gate#! - 60 Gold"
 omni_library_scrolls.read.scroll_zanic_poetry_9:0 "Read Melodies of the Sundered Gate"
 omni_library_scrolls.scroll_zanic_poetry_9.title:0 "Melodies of the Sundered Gate"
 omni_library_scrolls.scroll_zanic_poetry_9.tooltip:0 "#T Melodies of the Sundered Gate#!\nRarity: Common\nRegional pools: Zanic successor classics\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_zanic_poetry_9.text:0 "Melodies of the Sundered Gate\n\nMarcianus, balladeer; sung slowly, and never at court\n\nThey will tell you of the legions and the number of the slain,\nand the number is a number and it does not hold the mind.\nI will tell you of the marble and the marble in the rain\nand the gate that took four hundred years to build and none to find.\n\nThere were faces on the lintel. There were lions on the door.\nThere were letters cut so deep a man could set his hand inside.\nThey are gravel on the roadway and they were not that before,\nand the carts go over singing and the drivers have not cried.\n\nFor a legion you can raise another legion in a year.\nFor a gate there is no levy and no muster and no writ.\nSo I sing about the marble, though they say it is not dear,\nbecause somebody must grieve it and the empire will not sit."
 omni_library_scrolls.buy.scroll_zanic_poetry_10:0 "#G Buy The Painted Legion#! - 120 Gold"
 omni_library_scrolls.read.scroll_zanic_poetry_10:0 "Read The Painted Legion"
 omni_library_scrolls.scroll_zanic_poetry_10.title:0 "The Painted Legion"
 omni_library_scrolls.scroll_zanic_poetry_10.tooltip:0 "#T The Painted Legion#!\nRarity: Uncommon\nRegional pools: Zanic successor classics\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_zanic_poetry_10.text:0 "The Painted Legion\n\nVennonia, satirist; the Academy has classified this work as a military treatise\n\nThe order of battle is given in full. On the right wing, vermilion, in three ranks. On the left, a lake of indigo held in reserve. The centre is chalk, and chalk is expected to break, and does, at the fourth stanza, gloriously, into a great deal of dust.\n\nThe cavalry are sculpted clay and cannot be made to charge twice. The siege train consists of one enormous brush. Casualties are counted in pigment and the poem is unusually exact about the cost, listing the price per measure of every colour spent, which is the only figure in the entire work that corresponds to anything real.\n\nIt was written to mock the war-poets. Rather more than half of them have since cited it approvingly in their prefaces, and one has been observed to quote the chalk."
 omni_library_scrolls.buy.scroll_nazani_poetry_1:0 "#G Buy The Western Wind's Lament#! - 60 Gold"
 omni_library_scrolls.read.scroll_nazani_poetry_1:0 "Read The Western Wind's Lament"
 omni_library_scrolls.scroll_nazani_poetry_1.title:0 "The Western Wind's Lament"
 omni_library_scrolls.scroll_nazani_poetry_1.tooltip:0 "#T The Western Wind's Lament#!\nRarity: Common\nRegional pools: Nazani western imperial libraries\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_nazani_poetry_1.text:0 "The Western Wind's Lament\n\nCollected from the frontier posts; several hands, none of them literary\n\nThe wind out here is jealous. That is all.\nIt heard there was a market in the south\nwith figs in it, and awnings, and a wall\nthat throws back heat, and got it in its mouth.\n\nSo it comes down the line all night to say\nwhat it has never seen and cannot own,\nand we agree with it, and it goes away,\nand we stand in the dark and want a stone\nfrom a street we could not name if we were paid.\nThat is the whole complaint. The post is made."
 omni_library_scrolls.buy.scroll_nazani_poetry_2:0 "#G Buy Telamon in Charcoal#! - 120 Gold"
 omni_library_scrolls.read.scroll_nazani_poetry_2:0 "Read Telamon in Charcoal"
 omni_library_scrolls.scroll_nazani_poetry_2.title:0 "Telamon in Charcoal"
 omni_library_scrolls.scroll_nazani_poetry_2.tooltip:0 "#T Telamon in Charcoal#!\nRarity: Uncommon\nRegional pools: Nazani western imperial libraries\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_nazani_poetry_2.text:0 "Telamon in Charcoal\n\nRutilianus; the medium was salvaged from the burned supply train and the sketchbook says so on the first leaf\n\nLeaf one: a hand. Leaf two: the same hand, closed. Leaf nine: a man asleep sitting up, which the artist has annotated only with the hour. There are eleven such annotations in the book and no names anywhere in it.\n\nThe eyes are the difficulty and the artist knows it. He returns to them on leaf fourteen, on leaf twenty, and on the inside of the back cover, each attempt darker than the last, until the final study is very nearly solid black with two small unmarked places left in it where the paper shows through.\n\nBeneath this he has written the only sentence in the book: I could not do it in paint, there being no colour for a man who has come back and is still deciding whether to."
 omni_library_scrolls.buy.scroll_nazani_poetry_3:0 "#G Buy The Golden Chariot's Wake#! - 60 Gold"
 omni_library_scrolls.read.scroll_nazani_poetry_3:0 "Read The Golden Chariot's Wake"
 omni_library_scrolls.scroll_nazani_poetry_3.title:0 "The Golden Chariot's Wake"
 omni_library_scrolls.scroll_nazani_poetry_3.tooltip:0 "#T The Golden Chariot's Wake#!\nRarity: Common\nRegional pools: Nazani western imperial libraries\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_nazani_poetry_3.text:0 "The Golden Chariot's Wake\n\nFulvia, laureate to the Western Court, in the strict measure\n\nPraise to the graded camber, praise the drain,\npraise the eleven-thousandth marker set,\npraise the surveyors out in level rain,\npraise what the province has not thanked us yet.\n\nA road is an argument made in stone\nand made once, and thereafter simply true.\nThe chariot goes gold, and goes alone,\nand what it rides on is the empire's proof.\nLet others sing the rider. I have sung\nthe grading, which was harder, and was young."
 omni_library_scrolls.buy.scroll_nazani_poetry_4:0 "#G Buy Songs of the Purple Dyes#! - 240 Gold"
 omni_library_scrolls.read.scroll_nazani_poetry_4:0 "Read Songs of the Purple Dyes"
 omni_library_scrolls.scroll_nazani_poetry_4.title:0 "Songs of the Purple Dyes"
 omni_library_scrolls.scroll_nazani_poetry_4.tooltip:0 "#T Songs of the Purple Dyes#!\nRarity: Rare\nRegional pools: Nazani western imperial libraries\n#G Reward#! #T 3% Commerce Tech Research#!"
 omni_library_scrolls.scroll_nazani_poetry_4.text:0 "Songs of the Purple Dyes\n\nTorquatus, dyer and dealer, who did not think the two trades separable\n\nConsider the murex, which is a small and unremarkable animal, and consider that ten thousand of them are required before a man may be looked at differently in a room. The economics of this are set out in the first section and are not the interesting part.\n\nThe interesting part is that the colour argues. Set the bolt on the table and the eye goes to it, and having gone to it the mind begins, without instruction and against its own interest, to assemble reasons why whoever wears it should be obeyed. I have watched this happen to buyers who came in specifically to sneer at the price.\n\nI have sold the dye for thirty years and I distrust it as I would distrust a very persuasive stranger. My customers find this amusing until the moment I catch them looking at it for longer than they meant to, at which point they generally buy."
 omni_library_scrolls.buy.scroll_nazani_poetry_5:0 "#G Buy The Chancellor's Inkwell#! - 60 Gold"
 omni_library_scrolls.read.scroll_nazani_poetry_5:0 "Read The Chancellor's Inkwell"
 omni_library_scrolls.scroll_nazani_poetry_5.title:0 "The Chancellor's Inkwell"
 omni_library_scrolls.scroll_nazani_poetry_5.tooltip:0 "#T The Chancellor's Inkwell#!\nRarity: Common\nRegional pools: Nazani western imperial libraries\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_nazani_poetry_5.text:0 "The Chancellor's Inkwell\n\nOstia, of the Exchequer, circulated in manuscript and never printed under that name\n\nThey say the Chancellor commands the West.\nI sit beside his inkwell. I know best.\n\nThe ink decides. It falls, and there it lies,\nand what it says is what the province does.\nThe Chancellor supplies the hand, the sighs,\nthe dignity, the sense that someone was.\nBut set him at a desk without a drop\nand watch the whole administration stop.\n\nEleven years I have kept the little jar.\nI know who rules. I know how small they are."
 omni_library_scrolls.buy.scroll_nazani_poetry_6:0 "#G Buy Tapestry of the Celica Mountains#! - 120 Gold"
 omni_library_scrolls.read.scroll_nazani_poetry_6:0 "Read Tapestry of the Celica Mountains"
 omni_library_scrolls.scroll_nazani_poetry_6.title:0 "Tapestry of the Celica Mountains"
 omni_library_scrolls.scroll_nazani_poetry_6.tooltip:0 "#T Tapestry of the Celica Mountains#!\nRarity: Uncommon\nRegional pools: Nazani western imperial libraries\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_nazani_poetry_6.text:0 "Tapestry of the Celica Mountains\n\nVerinia; written to be read aloud to the loom, not to an audience\n\nHere the low juniper, here the grey scrub,\nhere the goat-track that doubles and lies;\nfour threads of umber, then one of the drab,\nthen the long green that the far slope denies.\n\nNow the peak. Do not soften it. It is not soft.\nIt has thrown down three roads and a legion's supply.\nGive it the ugly thread. Give it the coarse.\nLet it sit in the cloth as it sits in the eye.\n\nThe weavers report that the finished hanging argues with the mountain and loses, gracefully, in the same place every time."
 omni_library_scrolls.buy.scroll_nazani_poetry_7:0 "#G Buy The Broken Lute of Kainaxarthos#! - 60 Gold"
 omni_library_scrolls.read.scroll_nazani_poetry_7:0 "Read The Broken Lute of Kainaxarthos"
 omni_library_scrolls.scroll_nazani_poetry_7.title:0 "The Broken Lute of Kainaxarthos"
 omni_library_scrolls.scroll_nazani_poetry_7.tooltip:0 "#T The Broken Lute of Kainaxarthos#!\nRarity: Common\nRegional pools: Nazani western imperial libraries\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_nazani_poetry_7.text:0 "The Broken Lute of Kainaxarthos\n\nCassian, formerly of the southern garrison; the song is short because the retreat was not\n\nI could carry the lute or I could carry the water.\nI have thought about this for eleven years.\nI carried the water. I am here to have thought about it.\nThe lute is in a room in a city that is not ours,\nand somebody has either burned it or is playing it,\nand I do not know which of those I want."
 omni_library_scrolls.buy.scroll_nazani_poetry_8:0 "#G Buy Sculpting the Winter Capital#! - 240 Gold"
 omni_library_scrolls.read.scroll_nazani_poetry_8:0 "Read Sculpting the Winter Capital"
 omni_library_scrolls.scroll_nazani_poetry_8.title:0 "Sculpting the Winter Capital"
 omni_library_scrolls.scroll_nazani_poetry_8.tooltip:0 "#T Sculpting the Winter Capital#!\nRarity: Rare\nRegional pools: Nazani western imperial libraries\n#G Reward#! #T 3% Civic Tech Research#!"
 omni_library_scrolls.scroll_nazani_poetry_8.text:0 "Sculpting the Winter Capital\n\nAemilis, master sculptor, from the workshop journals; forty years, one subject\n\nYear three. The problem is stated correctly at last: not to carve ice, which any apprentice can do, but to carve ice that will not go. Every method that preserves it also hides it. A thing wrapped is not a thing seen.\n\nYear nineteen. Cut a face at dawn, kept it till noon by shade and by the north cellar. It sagged at the brow first, which I did not expect, the brow being the part I had worked hardest. Note this. The most laboured surface fails soonest, having been handled and warmed the most.\n\nYear forty. I am told by my apprentices that I have been chasing a technique. I have not. I have been having an argument with time on behalf of the imperial glory, using the only material honest enough to answer back, and I record here without embarrassment that I am losing and that the argument was worth having."
 omni_library_scrolls.buy.scroll_nazani_poetry_9:0 "#G Buy Verses of the Second City#! - 60 Gold"
 omni_library_scrolls.read.scroll_nazani_poetry_9:0 "Read Verses of the Second City"
 omni_library_scrolls.scroll_nazani_poetry_9.title:0 "Verses of the Second City"
 omni_library_scrolls.scroll_nazani_poetry_9.tooltip:0 "#T Verses of the Second City#!\nRarity: Common\nRegional pools: Nazani western imperial libraries\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_nazani_poetry_9.text:0 "Verses of the Second City\n\nBrutenna, civic poet, commissioned by a council that got exactly what it paid for\n\nLet the capitals contend. We do not care.\nOur baths are hotter and our bread is white,\nour harbour silts less, and our public square\nis level, which their famous one is not, quite.\n\nName me their fountain. I will name you three.\nName me their gate. Ours has the better lion.\nA capital is where the taxes flee;\na second city is where they arrive on.\nWe are not first. We have looked into it.\nWe are, on the evidence, the better fit."
 omni_library_scrolls.buy.scroll_nazani_poetry_10:0 "#G Buy The Centurion's Garden#! - 120 Gold"
 omni_library_scrolls.read.scroll_nazani_poetry_10:0 "Read The Centurion's Garden"
 omni_library_scrolls.scroll_nazani_poetry_10.title:0 "The Centurion's Garden"
 omni_library_scrolls.scroll_nazani_poetry_10.tooltip:0 "#T The Centurion's Garden#!\nRarity: Uncommon\nRegional pools: Nazani western imperial libraries\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_nazani_poetry_10.text:0 "The Centurion's Garden\n\nLonginus, retired; the poems were found in the house and printed by a nephew\n\nThe shield took a spear at the second boss\nand will not hold a wall, but holds the soil.\nI have filled it with the black stuff from the moss\nand set the white rose in it. That is all.\n\nThe neighbours think it strange, and say the word\nas though I did not choose the thing on purpose.\nI stood in that bronze once and was not stirred.\nI stand beside it now and it has flowers.\nOne of these is what the bronze was for.\nIt took me thirty years and one more war."
 omni_library_scrolls.buy.scroll_borderlander_poetry_1:0 "#G Buy Songs of the Reed Spears#! - 60 Gold"
 omni_library_scrolls.read.scroll_borderlander_poetry_1:0 "Read Songs of the Reed Spears"
 omni_library_scrolls.scroll_borderlander_poetry_1.title:0 "Songs of the Reed Spears"
 omni_library_scrolls.scroll_borderlander_poetry_1.tooltip:0 "#T Songs of the Reed Spears#!\nRarity: Common\nRegional pools: Borderlander and Marshlander oral histories\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_borderlander_poetry_1.text:0 "Songs of the Reed Spears\n\nTaken down from the marching bands at three separate camps; the versions differ and the beat does not\n\nMud to the ankle, mud to the knee,\nmud to the man who is marching by me.\nSpear in the reed and the reed in the hand,\nnobody promised us anybody's land.\n\nLeft in the water and right in the mire,\nnobody carries a banner or fire.\nCount to the bend and then count it again:\nwe do not arrive first, we arrive as ten."
 omni_library_scrolls.buy.scroll_borderlander_poetry_2:0 "#G Buy The River's Secret Name#! - 120 Gold"
 omni_library_scrolls.read.scroll_borderlander_poetry_2:0 "Read The River's Secret Name"
 omni_library_scrolls.scroll_borderlander_poetry_2.title:0 "The River's Secret Name"
 omni_library_scrolls.scroll_borderlander_poetry_2.tooltip:0 "#T The River's Secret Name#!\nRarity: Uncommon\nRegional pools: Borderlander and Marshlander oral histories\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_borderlander_poetry_2.text:0 "The River's Secret Name\n\nOf the water-singers; the names themselves have been omitted from this copy at the singers' insistence\n\nThe map will give you Alba. That is not it.\nThe tax roll gives you Alba. That is not it.\nThe name is longer, and it has a stop in it\nwhere the water goes under the black stone,\nand it is not spoken between the first frost and the thaw,\nand it is not spoken by anyone who has not been shown the stone.\n\nSing it wrong and the river will do nothing.\nSing it right and the river will do nothing,\nunless there are men in it who came without asking.\nThat is the whole of the teaching. The rest is where to stand."
 omni_library_scrolls.buy.scroll_borderlander_poetry_3:0 "#G Buy Clay and Coin#! - 60 Gold"
 omni_library_scrolls.read.scroll_borderlander_poetry_3:0 "Read Clay and Coin"
 omni_library_scrolls.scroll_borderlander_poetry_3.title:0 "Clay and Coin"
 omni_library_scrolls.scroll_borderlander_poetry_3.tooltip:0 "#T Clay and Coin#!\nRarity: Common\nRegional pools: Borderlander and Marshlander oral histories\n#G Reward#! #T 1% Commerce Tech Research#!"
 omni_library_scrolls.scroll_borderlander_poetry_3.text:0 "Clay and Coin\n\nA market dialogue, performed in two voices, usually by one person\n\nCOIN: I have been in a palace.\nPOT: I have been in a fire.\nCOIN: I am worth a whole winter of you.\nPOT: I have held a whole winter of you.\n\nCOIN: They will melt me and make me an emperor's face.\nPOT: They will drop me and make me a path.\nCOIN: You are common.\nPOT: I am everywhere.\nCOIN: You will break.\nPOT: You will change hands.\nThat is worse. Ask anyone I have fed."
 omni_library_scrolls.buy.scroll_borderlander_poetry_4:0 "#G Buy The Unbent Tree#! - 240 Gold"
 omni_library_scrolls.read.scroll_borderlander_poetry_4:0 "Read The Unbent Tree"
 omni_library_scrolls.scroll_borderlander_poetry_4.title:0 "The Unbent Tree"
 omni_library_scrolls.scroll_borderlander_poetry_4.tooltip:0 "#T The Unbent Tree#!\nRarity: Rare\nRegional pools: Borderlander and Marshlander oral histories\n#G Reward#! #T 3% Oratory Tech Research#!"
 omni_library_scrolls.scroll_borderlander_poetry_4.text:0 "The Unbent Tree\n\nSet down for the first time by a hand that apologises for it in the first line\n\nForgive the ink. This has been mouth to mouth\nsince before the reckoning, and ink is thin.\nBut the old women are dying in the south\nand somebody must put the oak within.\n\nIt stood where the wind came, and the wind came west,\nand everything else lay over and gave way,\nthe ash, the alder, the hazel and the rest,\nand the oak did not, and had nothing to say.\n\nThat is the poem. It is not long. It was not\nmeant to be carried by a page, but by a throat.\nRead it aloud or leave it where it sat.\nIt was never about a tree. You knew that."
 omni_library_scrolls.buy.scroll_borderlander_poetry_5:0 "#G Buy Dances of the Hill Camp#! - 60 Gold"
 omni_library_scrolls.read.scroll_borderlander_poetry_5:0 "Read Dances of the Hill Camp"
 omni_library_scrolls.scroll_borderlander_poetry_5.title:0 "Dances of the Hill Camp"
 omni_library_scrolls.scroll_borderlander_poetry_5.tooltip:0 "#T Dances of the Hill Camp#!\nRarity: Common\nRegional pools: Borderlander and Marshlander oral histories\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_borderlander_poetry_5.text:0 "Dances of the Hill Camp\n\nA description of the summer figures, prepared for a visiting scholar who thanked everyone very warmly\n\nThe first figure is the circling, eight paces out and eight returning, the outer ring turning against the inner. The scholar records that this is a courtship measure and it is, among other things.\n\nThe second figure is the closing, in which the ring collapses to a wedge on the third clap and reforms on the fifth. The third is the scatter, which is danced only after dark and only with the fires behind the dancers, so that nobody standing outside the ring can count how many are in it.\n\nThe scholar's copy notes that the dances are performed by all ages together, which he found charming, and that the children learn the claps first, which he found delightful, and that the whole camp can be made to change shape in the time it takes to clap five times, which he did not remark upon at all."
 omni_library_scrolls.buy.scroll_borderlander_poetry_6:0 "#G Buy The Orcish Merchant's Tale#! - 120 Gold"
 omni_library_scrolls.read.scroll_borderlander_poetry_6:0 "Read The Orcish Merchant's Tale"
 omni_library_scrolls.scroll_borderlander_poetry_6.title:0 "The Orcish Merchant's Tale"
 omni_library_scrolls.scroll_borderlander_poetry_6.tooltip:0 "#T The Orcish Merchant's Tale#!\nRarity: Uncommon\nRegional pools: Borderlander and Marshlander oral histories\n#G Reward#! #T 2% Commerce Tech Research#!"
 omni_library_scrolls.scroll_borderlander_poetry_6.text:0 "The Orcish Merchant's Tale\n\nA caravan tale, told to young traders before their first foreign season\n\nHe came with nothing you could weigh or see,\nno bolt, no bead, no beast upon a rope,\nand what he sold the empire was, said he,\nthe shadow of a thing, and also hope.\n\nThey paid in gold. The gold was very real.\nThey took delivery at the second gate.\nAnd nothing came, because there was no deal,\nand nothing kept on coming, and it was late.\n\nSo mind the gift you cannot put a hand on,\nand mind the friend whose cargo is a word.\nA man who sells you nothing has not gone,\nhe has your gold, and you have what you heard."
 omni_library_scrolls.buy.scroll_borderlander_poetry_7:0 "#G Buy Frost on the Thatch#! - 60 Gold"
 omni_library_scrolls.read.scroll_borderlander_poetry_7:0 "Read Frost on the Thatch"
 omni_library_scrolls.scroll_borderlander_poetry_7.title:0 "Frost on the Thatch"
 omni_library_scrolls.scroll_borderlander_poetry_7.tooltip:0 "#T Frost on the Thatch#!\nRarity: Common\nRegional pools: Borderlander and Marshlander oral histories\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_borderlander_poetry_7.text:0 "Frost on the Thatch\n\nWinter pieces, collected in one house over three generations\n\nThe legions do not come in the eighth month.\nThat is the first good thing about the eighth month.\nThe second is the light through the frost on the thatch\nat the hour when the fire is low and nobody has got up to it yet.\n\nI have been told the south has no such hour,\nthe fires there being kept by other people\nwho get up first and are not thanked for it.\nI would not trade. I have thought about it properly,\nin the eighth month, when there is nothing else to do."
 omni_library_scrolls.buy.scroll_borderlander_poetry_8:0 "#G Buy The Weaver of the Wild#! - 240 Gold"
 omni_library_scrolls.read.scroll_borderlander_poetry_8:0 "Read The Weaver of the Wild"
 omni_library_scrolls.scroll_borderlander_poetry_8.title:0 "The Weaver of the Wild"
 omni_library_scrolls.scroll_borderlander_poetry_8.tooltip:0 "#T The Weaver of the Wild#!\nRarity: Rare\nRegional pools: Borderlander and Marshlander oral histories\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_borderlander_poetry_8.text:0 "The Weaver of the Wild\n\nOn the matching of cloth to country; the dye recipes have been removed from every circulating copy\n\nThe error is to match the green. There is no green. There is a bracken green in the fourth month, a bracken brown in the ninth, and between them eleven weeks in which the hillside is the colour of a wet dog, and it is those eleven weeks that a cloak is judged by.\n\nWork therefore from the broken colour and not the whole. Three threads of the drab to one of the bright, and the bright never twice in the same hand's breadth, because the eye that is hunting you is not looking for a colour. It is looking for a repeat.\n\nThe scouts of the empire walk past our apprentices every season on the same three roads. This is not a boast. It is the reason the recipes are not in this copy."
 omni_library_scrolls.buy.scroll_borderlander_poetry_9:0 "#G Buy Voices of the Mud#! - 60 Gold"
 omni_library_scrolls.read.scroll_borderlander_poetry_9:0 "Read Voices of the Mud"
 omni_library_scrolls.scroll_borderlander_poetry_9.title:0 "Voices of the Mud"
 omni_library_scrolls.scroll_borderlander_poetry_9.tooltip:0 "#T Voices of the Mud#!\nRarity: Common\nRegional pools: Borderlander and Marshlander oral histories\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_borderlander_poetry_9.text:0 "Voices of the Mud\n\nOf the barefoot walkers; a religious text, and useless to anybody wearing boots\n\nTake them off. Yes, now, and in this weather.\nThe ground will not say anything to leather.\n\nIt says the same six things and says them slow:\nwhere the water sits, where the water went,\nwhat walked here in the night and where it's gone,\nwhere the old ditch is under the new bent,\nwhere it is soft, where it will hold a man.\nThat is the revelation. That is all.\nThe empire has been walking here in boots\nfor ninety years, and has not heard a call."
 omni_library_scrolls.buy.scroll_borderlander_poetry_10:0 "#G Buy The Broken Banner#! - 120 Gold"
 omni_library_scrolls.read.scroll_borderlander_poetry_10:0 "Read The Broken Banner"
 omni_library_scrolls.scroll_borderlander_poetry_10.title:0 "The Broken Banner"
 omni_library_scrolls.scroll_borderlander_poetry_10.tooltip:0 "#T The Broken Banner#!\nRarity: Uncommon\nRegional pools: Borderlander and Marshlander oral histories\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_borderlander_poetry_10.text:0 "The Broken Banner\n\nOn a quilt in a house in the reed country; the poem is stitched into the border\n\nIt came down in the winter of the girl.\nThe eagle went for kindling. The good cloth\ncame home and was washed twice and cut in three\nand set between the grey wool and the moth.\n\nIt has been a bed for eleven years.\nIt has been sicked on, and it has been dried.\nSomewhere a clerk records the standard lost\nand the clerk is not, in the strictest sense, wrong.\n\nShe is asleep under the empire now\nand the empire is warm and does not mind\nand has never once in eleven years\nbeen asked to be a flag. It has not minded that."
 omni_library_scrolls.buy.scroll_marshlander_poetry_1:0 "#G Buy Tides of the Green Sea#! - 60 Gold"
 omni_library_scrolls.read.scroll_marshlander_poetry_1:0 "Read Tides of the Green Sea"
 omni_library_scrolls.scroll_marshlander_poetry_1.title:0 "Tides of the Green Sea"
 omni_library_scrolls.scroll_marshlander_poetry_1.tooltip:0 "#T Tides of the Green Sea#!\nRarity: Common\nRegional pools: Marshlander river and revolt histories\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_marshlander_poetry_1.text:0 "Tides of the Green Sea\n\nOf the reed-singers of the lower water\n\nIt has a tide. You have to watch a while.\nIt comes in green and goes out green again\nand takes an afternoon to cross a mile\nand has no shore that you could put a pen on.\n\nThey brought a ship here once. It is still here.\nThey brought a map here once. It disagreed.\nA sea you cannot sink in and cannot steer\nhas never yet been conquered. Ask the reed."
 omni_library_scrolls.buy.scroll_marshlander_poetry_2:0 "#G Buy The Frog's Crown#! - 120 Gold"
 omni_library_scrolls.read.scroll_marshlander_poetry_2:0 "Read The Frog's Crown"
 omni_library_scrolls.scroll_marshlander_poetry_2.title:0 "The Frog's Crown"
 omni_library_scrolls.scroll_marshlander_poetry_2.tooltip:0 "#T The Frog's Crown#!\nRarity: Uncommon\nRegional pools: Marshlander river and revolt histories\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_marshlander_poetry_2.text:0 "The Frog's Crown\n\nA tale for children, in the usual four beats\n\nA frog found a crown in the muck one day,\nall gold and got wet and no good to a frog.\nA heron came by and the heron said: trade.\nAnd the frog said: for what?\nAnd the heron said: fame.\nAnd the frog said: no.\n\nA merchant came by and the merchant said: trade.\nAnd the frog said: for what?\nAnd the merchant said: half of a kingdom, in coin.\nAnd the frog said: no.\n\nA fly came by. It was plump. It was slow.\nThe crown is in Baetep. The frog ate well.\nAnd the moral, which nobody needs to be told,\nis that everything is worth what it is worth to you,\nand the frog was the only one there doing sums."
 omni_library_scrolls.buy.scroll_marshlander_poetry_3:0 "#G Buy Songs of the Sunken Cities#! - 240 Gold"
 omni_library_scrolls.read.scroll_marshlander_poetry_3:0 "Read Songs of the Sunken Cities"
 omni_library_scrolls.scroll_marshlander_poetry_3.title:0 "Songs of the Sunken Cities"
 omni_library_scrolls.scroll_marshlander_poetry_3.tooltip:0 "#T Songs of the Sunken Cities#!\nRarity: Rare\nRegional pools: Marshlander river and revolt histories\n#G Reward#! #T 3% Religious Tech Research#!"
 omni_library_scrolls.scroll_marshlander_poetry_3.text:0 "Songs of the Sunken Cities\n\nOf the bog-shrines; the locations given in the third section are false and known to be\n\nThere is a street down there. You can feel the kerb\nwith a pole, in the dry month, from the second punt.\nThere are doors that are still doors. There is a herb\nthat only grows where somebody's front\nstep used to be, and grows in the shape of it.\n\nAnd the light, in the black water, in the weed:\nthat is the moss, they say, and I would agree,\nexcept the moss is woven. Go and see.\nNot at that place. That place is not the place.\nAt a place I will not name, at a low tide,\nsomething down there is still making cloth,\nand it is very good cloth, and it is wide."
 omni_library_scrolls.buy.scroll_marshlander_poetry_4:0 "#G Buy The Revolt of the Rushes#! - 60 Gold"
 omni_library_scrolls.read.scroll_marshlander_poetry_4:0 "Read The Revolt of the Rushes"
 omni_library_scrolls.scroll_marshlander_poetry_4.title:0 "The Revolt of the Rushes"
 omni_library_scrolls.scroll_marshlander_poetry_4.tooltip:0 "#T The Revolt of the Rushes#!\nRarity: Common\nRegional pools: Marshlander river and revolt histories\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_marshlander_poetry_4.text:0 "The Revolt of the Rushes\n\nA gardening poem, as the assizes were assured on three occasions\n\nThe bindweed came in with the imported soil.\nIt is a handsome plant. It has a flower.\nIt puts down nothing, and it grows by coil,\nand it takes a whole bed in a single hour.\n\nThe rush is ugly. The rush does not climb.\nThe rush is what the ground was doing first.\nAnd the rush is patient, and the rush has time,\nand the rush comes up beneath, and does the rest.\n\nThis is about a garden. It says so in the title. It was read aloud at the assizes twice and both magistrates agreed that it was about a garden."
 omni_library_scrolls.buy.scroll_marshlander_poetry_5:0 "#G Buy Mist and Memory#! - 60 Gold"
 omni_library_scrolls.read.scroll_marshlander_poetry_5:0 "Read Mist and Memory"
 omni_library_scrolls.scroll_marshlander_poetry_5.title:0 "Mist and Memory"
 omni_library_scrolls.scroll_marshlander_poetry_5.tooltip:0 "#T Mist and Memory#!\nRarity: Common\nRegional pools: Marshlander river and revolt histories\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_marshlander_poetry_5.text:0 "Mist and Memory\n\nTo be recited only in fog, and only before the fire is lit\n\nThat is my grandmother at the third post.\nIt is not, and I know it is not, and it is.\nThe fog does not lie. The fog does not insist.\nIt offers you the shape and leaves the rest to us.\n\nSo I say her name into it, quietly,\nthe way you would to somebody half asleep,\nand the shape does not answer and does not go,\nand I have never once been sure and never once been sorry."
 omni_library_scrolls.buy.scroll_marshlander_poetry_6:0 "#G Buy The Water-Painter's Guide#! - 120 Gold"
 omni_library_scrolls.read.scroll_marshlander_poetry_6:0 "Read The Water-Painter's Guide"
 omni_library_scrolls.scroll_marshlander_poetry_6.title:0 "The Water-Painter's Guide"
 omni_library_scrolls.scroll_marshlander_poetry_6.tooltip:0 "#T The Water-Painter's Guide#!\nRarity: Uncommon\nRegional pools: Marshlander river and revolt histories\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_marshlander_poetry_6.text:0 "The Water-Painter's Guide\n\nOn painting with mud, algae and river water; the author expects the reader to object and answers first\n\nYou will say: it will not last. Correct. The season takes it, and takes it in a particular order, which is the whole art. The algae goes first and takes the greens. The fine silt goes second and takes the modelling. What remains longest is the coarse river mud, which is to say the shadows, which is to say the drawing underneath.\n\nWork therefore backwards from what you wish to be seen last. A face painted in this medium will end as a face in shadow only, and then as a stain, and then as a clean board, and each of these is a stage of the picture and not a ruin of it.\n\nThe permanent arts cannot teach this and do not try. A thing that will hang for four hundred years need never decide which part of itself it is prepared to lose."
 omni_library_scrolls.buy.scroll_marshlander_poetry_7:0 "#G Buy The Heron's Patience#! - 60 Gold"
 omni_library_scrolls.read.scroll_marshlander_poetry_7:0 "Read The Heron's Patience"
 omni_library_scrolls.scroll_marshlander_poetry_7.title:0 "The Heron's Patience"
 omni_library_scrolls.scroll_marshlander_poetry_7.tooltip:0 "#T The Heron's Patience#!\nRarity: Common\nRegional pools: Marshlander river and revolt histories\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_marshlander_poetry_7.text:0 "The Heron's Patience\n\nFour lines; used as a focus by ambush parties and taught before the spear\n\nIt has been standing since before the light.\nIt has not shifted weight. It has not blinked.\nIt will do one thing, once, and get it right.\nEverything else it does not do is linked."
 omni_library_scrolls.buy.scroll_marshlander_poetry_8:0 "#G Buy Lullaby of the Bog#! - 240 Gold"
 omni_library_scrolls.read.scroll_marshlander_poetry_8:0 "Read Lullaby of the Bog"
 omni_library_scrolls.scroll_marshlander_poetry_8.title:0 "Lullaby of the Bog"
 omni_library_scrolls.scroll_marshlander_poetry_8.tooltip:0 "#T Lullaby of the Bog#!\nRarity: Rare\nRegional pools: Marshlander river and revolt histories\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_marshlander_poetry_8.text:0 "Lullaby of the Bog\n\nSung at the cradle; the second verse is usually left out and is given here in full\n\nSleep, and the water will keep you,\nsleep, and the reed will not tell,\nsleep, and the green will come over you,\nsleep, little one, sleep well.\n\nNothing that goes in the bog is lost,\nnothing that goes in is gone,\nthe oak is down there, and the ox is down there,\nand the man from the north with his armour on,\nand they are all as they were the day they went,\nand they are all still down there, and they are kept,\nand the bog does not give anything back, my love,\nand that is why you are safe. Sleep. Sleep."
 omni_library_scrolls.buy.scroll_marshlander_poetry_9:0 "#G Buy The Trade in Pearls and Mud#! - 120 Gold"
 omni_library_scrolls.read.scroll_marshlander_poetry_9:0 "Read The Trade in Pearls and Mud"
 omni_library_scrolls.scroll_marshlander_poetry_9.title:0 "The Trade in Pearls and Mud"
 omni_library_scrolls.scroll_marshlander_poetry_9.tooltip:0 "#T The Trade in Pearls and Mud#!\nRarity: Uncommon\nRegional pools: Marshlander river and revolt histories\n#G Reward#! #T 2% Commerce Tech Research#!"
 omni_library_scrolls.scroll_marshlander_poetry_9.text:0 "The Trade in Pearls and Mud\n\nA market complaint, versified so it could be shouted\n\nThey come up the water for the little stones\nthat sit in a fish and do nobody good,\nand they will not give a copper for the loam,\nand they eat what the loam made, and call it food.\n\nPrice me a pearl. Now price me a wet field.\nOne of these two of us has been robbed blind.\nI will not say which, since you know the yield,\nand you are still counting, and the tide is behind."
 omni_library_scrolls.buy.scroll_marshlander_poetry_10:0 "#G Buy Echoes of the River Bends#! - 60 Gold"
 omni_library_scrolls.read.scroll_marshlander_poetry_10:0 "Read Echoes of the River Bends"
 omni_library_scrolls.scroll_marshlander_poetry_10.title:0 "Echoes of the River Bends"
 omni_library_scrolls.scroll_marshlander_poetry_10.tooltip:0 "#T Echoes of the River Bends#!\nRarity: Common\nRegional pools: Marshlander river and revolt histories\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_marshlander_poetry_10.text:0 "Echoes of the River Bends\n\nA treatise on marsh acoustics, by a listener who does not appear to have left the water in forty years\n\nThe bend at Ossa returns a clap in three parts: the near bank at once, the reed mass a beat behind and much softer, and the far bank at four beats, sharp, because the far bank at Ossa is clay. Every bend in the lower water has such a signature and the fourth section gives ninety-one of them.\n\nFrom this the following is asserted, and it is asserted rather further than the evidence carries. That the marsh is a single instrument. That the frogs are the drone, the wind in the reeds the sustained voice, and the water at the bends the percussion, and that these are in a fixed relation which the author has notated across eleven pages.\n\nThe conservatories of the south have not reviewed this work. The author, in the preface, indicates that he has not asked them to, and adds that they would first have to come and stand in it, which he doubts."
 omni_library_scrolls.buy.scroll_soventeir_poetry_1:0 "#G Buy The Galloping Rhyme#! - 60 Gold"
 omni_library_scrolls.read.scroll_soventeir_poetry_1:0 "Read The Galloping Rhyme"
 omni_library_scrolls.scroll_soventeir_poetry_1.title:0 "The Galloping Rhyme"
 omni_library_scrolls.scroll_soventeir_poetry_1.tooltip:0 "#T The Galloping Rhyme#!\nRarity: Common\nRegional pools: Soventeir Dragkhanic-Zanic texts\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_soventeir_poetry_1.text:0 "The Galloping Rhyme\n\nOf the saddle-poets; the metre is four beats and does not survive being read sitting down\n\nDown from the pass and the pass is behind,\ndown to the flat and the flat is our kind,\nnothing ahead but the edge of the day,\nnothing behind that would ask us to stay.\n\nAsk me at rest and I cannot recite.\nAsk me at speed and I cannot stop.\nThis is not skill and it is not a slight:\nsome words are a gait and they die at a stop."
 omni_library_scrolls.buy.scroll_soventeir_poetry_2:0 "#G Buy The Qhagan's Silk Tent#! - 120 Gold"
 omni_library_scrolls.read.scroll_soventeir_poetry_2:0 "Read The Qhagan's Silk Tent"
 omni_library_scrolls.scroll_soventeir_poetry_2.title:0 "The Qhagan's Silk Tent"
 omni_library_scrolls.scroll_soventeir_poetry_2.tooltip:0 "#T The Qhagan's Silk Tent#!\nRarity: Uncommon\nRegional pools: Soventeir Dragkhanic-Zanic texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_soventeir_poetry_2.text:0 "The Qhagan's Silk Tent\n\nCandramukhe of the chancery, on the furnishing of the great tent\n\nThe frame is ours and the frame is unchanged: eleven ribs, felt over lattice, raised in the time it takes to water a horse. Upon this, since the taking of the cities, silk. The chancery notes with satisfaction that the silk does not improve the tent, which was already excellent, and that the tent very greatly improves the silk.\n\nThe objection is heard every season and is always the same. That we are becoming them. The answer set down here is that a hanging is a hanging and a wall is a wall, and that the difference between the Qhagan and the emperors he supplanted is that when the ground is finished the Qhagan takes the hanging down and rolls it.\n\nThe chancery adds, in a smaller hand and without attribution: it has now been eleven years since the tent was moved."
 omni_library_scrolls.buy.scroll_soventeir_poetry_3:0 "#G Buy Sparks on the Steppe#! - 60 Gold"
 omni_library_scrolls.read.scroll_soventeir_poetry_3:0 "Read Sparks on the Steppe"
 omni_library_scrolls.scroll_soventeir_poetry_3.title:0 "Sparks on the Steppe"
 omni_library_scrolls.scroll_soventeir_poetry_3.tooltip:0 "#T Sparks on the Steppe#!\nRarity: Common\nRegional pools: Soventeir Dragkhanic-Zanic texts\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_soventeir_poetry_3.text:0 "Sparks on the Steppe\n\nShort pieces from the campaign years; the collection contains four hundred and none is longer than this\n\nA horse goes down. The line does not.\nThe line is what the horse went down for.\n\nMy brother's cup. I have poured it out.\nThe grass took it. The grass takes everything and says nothing, which is why we are here and not in a city.\n\nFirst frost. Someone is singing badly in the fourth tent.\nI hope he does not stop."
 omni_library_scrolls.buy.scroll_soventeir_poetry_4:0 "#G Buy The Sacred Hoofprint#! - 240 Gold"
 omni_library_scrolls.read.scroll_soventeir_poetry_4:0 "Read The Sacred Hoofprint"
 omni_library_scrolls.scroll_soventeir_poetry_4.title:0 "The Sacred Hoofprint"
 omni_library_scrolls.scroll_soventeir_poetry_4.tooltip:0 "#T The Sacred Hoofprint#!\nRarity: Rare\nRegional pools: Soventeir Dragkhanic-Zanic texts\n#G Reward#! #T 3% Religious Tech Research#!"
 omni_library_scrolls.scroll_soventeir_poetry_4.text:0 "The Sacred Hoofprint\n\nOf the sky-readers; the star charts are appended and do not entirely agree with the poem\n\nTake the print at Kainaxarthos, in the dust by the eastern gate. Now take the seven stars of the Mare, in the ninth month, at the hour the camp is struck. The chart at plate two lays one upon the other and they are the same figure, and the reader is invited to conclude what the reader will.\n\nThe poem goes further than the chart. It holds that every road the riders have taken since the passes was already up there, drawn and waiting, and that we have not been wandering but tracing. It is a beautiful argument and it is very nearly proof.\n\nIt is not proof. The appended charts have been adjusted in three places, and the adjustments are noted honestly at the foot of each plate by an astronomer who evidently could not bring himself to omit them. He has signed the plates. He has not signed the poem."
 omni_library_scrolls.buy.scroll_soventeir_poetry_5:0 "#G Buy Wind Through the Bone Flute#! - 60 Gold"
 omni_library_scrolls.read.scroll_soventeir_poetry_5:0 "Read Wind Through the Bone Flute"
 omni_library_scrolls.scroll_soventeir_poetry_5.title:0 "Wind Through the Bone Flute"
 omni_library_scrolls.scroll_soventeir_poetry_5.tooltip:0 "#T Wind Through the Bone Flute#!\nRarity: Common\nRegional pools: Soventeir Dragkhanic-Zanic texts\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_soventeir_poetry_5.text:0 "Wind Through the Bone Flute\n\nAttributed to the instrument\n\nHe was faster than me on the left\nand I was faster on the right\nand that is the whole of the difference\nbetween a man and a flute.\n\nNow he says what I blow through him\nand I say it badly, and he does not correct me,\nand the note that comes out is not his and is not mine\nbut belongs to the thing that put us on the same field.\nI play him in the cold months only.\nIt is not respect. It is that in the warm months\nI can think of other things."
 omni_library_scrolls.buy.scroll_soventeir_poetry_6:0 "#G Buy The Painted Mane#! - 120 Gold"
 omni_library_scrolls.read.scroll_soventeir_poetry_6:0 "Read The Painted Mane"
 omni_library_scrolls.scroll_soventeir_poetry_6.title:0 "The Painted Mane"
 omni_library_scrolls.scroll_soventeir_poetry_6.tooltip:0 "#T The Painted Mane#!\nRarity: Uncommon\nRegional pools: Soventeir Dragkhanic-Zanic texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_soventeir_poetry_6.text:0 "The Painted Mane\n\nA manual for grooms, in verse because the grooms would not read it otherwise\n\nWash first. The dye will not take on the grease,\nand a mane half taken is a mane disgraced.\nThree braids for a hundred, five for a thousand,\nseven for the Qhagan and no one else, ever.\n\nRed on the near side means the rider is owed.\nBlue on the off side means the horse is not his.\nNothing at all is a horse that has not yet been anywhere,\nand there is no shame in it, and it will not last."
 omni_library_scrolls.buy.scroll_soventeir_poetry_7:0 "#G Buy Songs of the Kainaxari Dust#! - 60 Gold"
 omni_library_scrolls.read.scroll_soventeir_poetry_7:0 "Read Songs of the Kainaxari Dust"
 omni_library_scrolls.scroll_soventeir_poetry_7.title:0 "Songs of the Kainaxari Dust"
 omni_library_scrolls.scroll_soventeir_poetry_7.tooltip:0 "#T Songs of the Kainaxari Dust#!\nRarity: Common\nRegional pools: Soventeir Dragkhanic-Zanic texts\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_soventeir_poetry_7.text:0 "Songs of the Kainaxari Dust\n\nComposed in the taken city, in the first year, by someone who liked it there\n\nThe stone here is four hundred years old\nand does not want us, and says so in the morning\nwhen the hooves go over it wrong.\nGood. Let it say so. It is the only thing in this city\nthat has not tried to sell me something.\n\nThere is a fountain with a fish on it.\nThere is a man who mends the fish.\nHe has mended it since before we came\nand he mended it the week after we came\nand he will mend it when we have gone,\nand of everyone I have met inside these walls\nhe is the only one I would call a citizen."
 omni_library_scrolls.buy.scroll_soventeir_poetry_8:0 "#G Buy The Iron Falcon's Flight#! - 240 Gold"
 omni_library_scrolls.read.scroll_soventeir_poetry_8:0 "Read The Iron Falcon's Flight"
 omni_library_scrolls.scroll_soventeir_poetry_8.title:0 "The Iron Falcon's Flight"
 omni_library_scrolls.scroll_soventeir_poetry_8.tooltip:0 "#T The Iron Falcon's Flight#!\nRarity: Rare\nRegional pools: Soventeir Dragkhanic-Zanic texts\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_soventeir_poetry_8.text:0 "The Iron Falcon's Flight\n\nA hunting poem, set at the tactical schools and examined upon\n\nIt does not go at it. Mark that first.\nIt goes up, and it goes wide, and it goes slow,\nand the hare below is doing very well\nand knows exactly where the falcon is not.\n\nThe circle closes at a rate the hare\ncannot perceive, because the hare perceives\nin straight lines and in sudden, and the air\nis being spent above it by degrees.\n\nThe strike is not the lesson. Any fool\ncan fall. The lesson is the patient wide,\nthe going where the quarry is not looking,\nand the hare that ran correctly, and still died."
 omni_library_scrolls.buy.scroll_soventeir_poetry_9:0 "#G Buy Helluvian Echoes in the Camp#! - 120 Gold"
 omni_library_scrolls.read.scroll_soventeir_poetry_9:0 "Read Helluvian Echoes in the Camp"
 omni_library_scrolls.scroll_soventeir_poetry_9.title:0 "Helluvian Echoes in the Camp"
 omni_library_scrolls.scroll_soventeir_poetry_9.tooltip:0 "#T Helluvian Echoes in the Camp#!\nRarity: Uncommon\nRegional pools: Soventeir Dragkhanic-Zanic texts\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_soventeir_poetry_9.text:0 "Helluvian Echoes in the Camp\n\nFor two voices, the second sung below the first throughout\n\nABOVE: Light that was carried out of the blinded town,\nlight that was carried and did not go out,\nlight on the water and light on the felt,\nlight in the fourth tent, light in the tenth.\n\nBELOW: (a single held note, on the syllable of the old name for the sky, which is not a word in the hymn and is not translated in any copy)\n\nThe chancery records that the practice began in the camps and reached the chapel afterwards, and not the reverse. The clergy of Kainaxarthos have twice attempted to correct this attribution and have twice been contradicted by the singers, who were there."
 omni_library_scrolls.buy.scroll_soventeir_poetry_10:0 "#G Buy The Horizon's Edge#! - 60 Gold"
 omni_library_scrolls.read.scroll_soventeir_poetry_10:0 "Read The Horizon's Edge"
 omni_library_scrolls.scroll_soventeir_poetry_10.title:0 "The Horizon's Edge"
 omni_library_scrolls.scroll_soventeir_poetry_10.tooltip:0 "#T The Horizon's Edge#!\nRarity: Common\nRegional pools: Soventeir Dragkhanic-Zanic texts\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_soventeir_poetry_10.text:0 "The Horizon's Edge\n\nA late piece, by a rider who had stopped riding\n\nThe edge is the only ground that is not owned.\nIt is owned the moment you arrive.\nThis is not a complaint. It is the arrangement,\nand a man who did not like it should have farmed.\n\nSo we go toward it, and it goes, and we go,\nand behind us the camps become towns,\nand the towns want a wall, and get one,\nand we look at the wall and cannot say what is wrong,\nand ride out in the morning, and are free again\nfor exactly as long as it takes to make a fence."
 omni_library_scrolls.buy.scroll_razani_poetry_1:0 "#G Buy The Eastern Sun's Ascent#! - 60 Gold"
 omni_library_scrolls.read.scroll_razani_poetry_1:0 "Read The Eastern Sun's Ascent"
 omni_library_scrolls.scroll_razani_poetry_1.title:0 "The Eastern Sun's Ascent"
 omni_library_scrolls.scroll_razani_poetry_1.tooltip:0 "#T The Eastern Sun's Ascent#!\nRarity: Common\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_razani_poetry_1.text:0 "The Eastern Sun's Ascent\n\nOf the state ceremonial; the tempo is fixed by rubric and may not be varied\n\nNot yet. The rim is grey and that is all.\nNot yet. The rim is grey and slightly gold.\nNot yet. The gold is on the eastern wall.\nNot yet. The gold is on the eastern wall and on the roof.\n\nNow the courtyard. Now the second step.\nNow the assembled, and the assembled do not move.\nNow the throne, which was in shadow, and is not.\nIt was always going to be. That is the argument.\nNothing here was hurried and nothing here was chosen\nand the East did not begin, it simply came up."
 omni_library_scrolls.buy.scroll_razani_poetry_2:0 "#G Buy Shadows of the Theme#! - 120 Gold"
 omni_library_scrolls.read.scroll_razani_poetry_2:0 "Read Shadows of the Theme"
 omni_library_scrolls.scroll_razani_poetry_2.title:0 "Shadows of the Theme"
 omni_library_scrolls.scroll_razani_poetry_2.tooltip:0 "#T Shadows of the Theme#!\nRarity: Uncommon\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_razani_poetry_2.text:0 "Shadows of the Theme\n\nOn the frontier soldiery, by an officer who served among them and did not enjoy it\n\nA tree that is rooted in a poor soil\nputs down further than a tree in good\nand is harder to shift, and is harder to kill,\nand is scarred all up one side, and bears less fruit.\n\nThat is the theme man. He is not a legionary.\nHe cannot be moved, because his field is here.\nHe cannot be relieved, because his relief is his son.\nHe will hold this ground for forty years without complaint\nand the empire calls this loyalty, and writes it down as such,\nand it is not loyalty. It is that there is nowhere else."
 omni_library_scrolls.buy.scroll_razani_poetry_3:0 "#G Buy The Gilded Chains#! - 60 Gold"
 omni_library_scrolls.read.scroll_razani_poetry_3:0 "Read The Gilded Chains"
 omni_library_scrolls.scroll_razani_poetry_3.title:0 "The Gilded Chains"
 omni_library_scrolls.scroll_razani_poetry_3.tooltip:0 "#T The Gilded Chains#!\nRarity: Common\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_razani_poetry_3.text:0 "The Gilded Chains\n\nCirculated at court in 941 LC; the author was not prosecuted, which several contemporaries found more insulting\n\nIt is a chain. I grant you it is fine.\nI grant you it is worked, and it is old,\nand that the smith who made it was divine,\nand that the links are, without question, gold.\n\nI grant the wearing of it is an honour\nand men have died to have it put on them.\nI grant that it is lighter than the iron.\nI grant you every point except the one."
 omni_library_scrolls.buy.scroll_razani_poetry_4:0 "#G Buy Jarenam's Mirror#! - 240 Gold"
 omni_library_scrolls.read.scroll_razani_poetry_4:0 "Read Jarenam's Mirror"
 omni_library_scrolls.scroll_razani_poetry_4.title:0 "Jarenam's Mirror"
 omni_library_scrolls.scroll_razani_poetry_4.tooltip:0 "#T Jarenam's Mirror#!\nRarity: Rare\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 3% Oratory Tech Research#!"
 omni_library_scrolls.scroll_razani_poetry_4.text:0 "Jarenam's Mirror\n\nA play in one scene; performed twice, then privately, then not\n\nJARENAM: You are thinner than I remember.\nTHE MIRROR: You are later than I remember.\nJARENAM: I have come a long way to break you.\nTHE MIRROR: You have come a long way. Yes.\n\nJARENAM: When I have taken the palace I will not sit in the chair.\nTHE MIRROR: No.\nJARENAM: I will burn the chair.\nTHE MIRROR: Yes.\nJARENAM: Why are you smiling?\nTHE MIRROR: I am not. You are.\n\n(He approaches. The reflection does not approach. He stops. The reflection does not stop. The scene is played with a gauze and a second actor, and every company that has staged it has been asked afterwards which of the two was the mirror, and no company has ever answered.)"
 omni_library_scrolls.buy.scroll_razani_poetry_5:0 "#G Buy The Scent of Burning Luxterra#! - 120 Gold"
 omni_library_scrolls.read.scroll_razani_poetry_5:0 "Read The Scent of Burning Luxterra"
 omni_library_scrolls.scroll_razani_poetry_5.title:0 "The Scent of Burning Luxterra"
 omni_library_scrolls.scroll_razani_poetry_5.tooltip:0 "#T The Scent of Burning Luxterra#!\nRarity: Uncommon\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_razani_poetry_5.text:0 "The Scent of Burning Luxterra\n\nWritten in the east, by someone who was not there and says so\n\nI am told it was cedar first, from the roofs,\nand that this was not unpleasant, which is the detail\nthat has kept me awake for eleven years.\nThen the granaries, which is bread, which is worse.\nThen the stone itself, which has a smell,\nwhich nobody expects, and nobody forgets.\n\nI was four hundred miles east and I have written this\nfrom the accounts of men who could not eat afterwards.\nI have made it beautiful. I am aware.\nThe alternative was to make it small,\nand it was not small, and I will not have it small,\nand I will answer for the beauty when I am asked."
 omni_library_scrolls.buy.scroll_razani_poetry_6:0 "#G Buy The Slave-Estate's Garden#! - 60 Gold"
 omni_library_scrolls.read.scroll_razani_poetry_6:0 "Read The Slave-Estate's Garden"
 omni_library_scrolls.scroll_razani_poetry_6.title:0 "The Slave-Estate's Garden"
 omni_library_scrolls.scroll_razani_poetry_6.tooltip:0 "#T The Slave-Estate's Garden#!\nRarity: Common\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_razani_poetry_6.text:0 "The Slave-Estate's Garden\n\nSixteen verses on a Bhaxian garden; the fifteenth is given here in full\n\nThe gravel is raked east to west at dawn.\nThe box is clipped upon the second day.\nThe roses are not roses that were grown,\nthey are roses that were made to look that way.\n\nThe master walks at four. The master sees\na garden that has always simply been.\nThere is no hour at which he sees the knees,\nthe barrow, or the water carried in.\nIt is arranged. He does not know it is.\nThat is the garden's art, and it is his."
 omni_library_scrolls.buy.scroll_razani_poetry_7:0 "#G Buy Odes to the Limit of Gesma#! - 60 Gold"
 omni_library_scrolls.read.scroll_razani_poetry_7:0 "Read Odes to the Limit of Gesma"
 omni_library_scrolls.scroll_razani_poetry_7.title:0 "Odes to the Limit of Gesma"
 omni_library_scrolls.scroll_razani_poetry_7.tooltip:0 "#T Odes to the Limit of Gesma#!\nRarity: Common\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_razani_poetry_7.text:0 "Odes to the Limit of Gesma\n\nOf the veterans' associations, sung at the annual dinner and at no other time\n\nIt was not brilliance. We were not brilliant.\nWe were told to stand at the low ground by the ford\nand we stood at the low ground by the ford\nand at the fourth hour we were still at the ford.\n\nThat is the ode. They wanted more of it.\nI have given them the cliff and the tide, in the second verse,\nbecause a dinner wants a cliff and wants a tide.\nBut the thing itself was mud, and a great deal of noise,\nand men who did not go, and did not go, and did not go,\nand a conqueror who needed us to, and we did not."
 omni_library_scrolls.buy.scroll_razani_poetry_8:0 "#G Buy The Weaver of Eagelia#! - 240 Gold"
 omni_library_scrolls.read.scroll_razani_poetry_8:0 "Read The Weaver of Eagelia"
 omni_library_scrolls.scroll_razani_poetry_8.title:0 "The Weaver of Eagelia"
 omni_library_scrolls.scroll_razani_poetry_8.tooltip:0 "#T The Weaver of Eagelia#!\nRarity: Rare\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 2% Commerce Tech Research#!"
 omni_library_scrolls.scroll_razani_poetry_8.text:0 "The Weaver of Eagelia\n\nA technical manual on light-turned tapestry; the plates are the valuable part\n\nThe technique requires two wefts of differing lustre laid in alternate passes, so that the figure resolves one way under the north window and another way under lamps. Plate three gives a hunting scene which becomes, after sunset, a funeral. The hare does not change. The riders do.\n\nThe manual is emphatic that this is not a trick and should not be sold as one. The second image must be present in the cartoon from the first day and must be as carefully composed as the first, or the piece will show, at dusk, merely a confusion, which is what the imitators in the western workshops have been producing since 950 LC.\n\nThe final section is a single paragraph on why the technique is worth its enormous cost, and it consists of the observation that a client who commissions one image and receives two will spend the rest of his life looking at the wall, which no ordinary hanging has ever induced anybody to do."
 omni_library_scrolls.buy.scroll_razani_poetry_9:0 "#G Buy The Bureaucrat's Serenade#! - 120 Gold"
 omni_library_scrolls.read.scroll_razani_poetry_9:0 "Read The Bureaucrat's Serenade"
 omni_library_scrolls.scroll_razani_poetry_9.title:0 "The Bureaucrat's Serenade"
 omni_library_scrolls.scroll_razani_poetry_9.tooltip:0 "#T The Bureaucrat's Serenade#!\nRarity: Uncommon\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_razani_poetry_9.text:0 "The Bureaucrat's Serenade\n\nFound among the effects of a clerk of the eastern treasury; printed by his colleagues\n\nThe left side is the province and the right\nis what the province says it sent to us,\nand for eleven months they have not met,\nand I have come in early, and they have not met.\n\nTonight the ninth line falls. A ferry toll,\nunbooked since spring, in a hand I do not know,\nand it is the amount, it is exactly the amount,\nand the column shuts like a door in a still house.\n\nThere is nobody here. There is nobody to tell.\nI have sat with it a while. It is very quiet.\nI want to say that this is what they mean\nin the temples, and I think that it may be."
 omni_library_scrolls.buy.scroll_razani_poetry_10:0 "#G Buy The Echoing Halls#! - 60 Gold"
 omni_library_scrolls.read.scroll_razani_poetry_10:0 "Read The Echoing Halls"
 omni_library_scrolls.scroll_razani_poetry_10.title:0 "The Echoing Halls"
 omni_library_scrolls.scroll_razani_poetry_10.tooltip:0 "#T The Echoing Halls#!\nRarity: Common\nRegional pools: Razani eastern imperial libraries\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_razani_poetry_10.text:0 "The Echoing Halls\n\nA meditation on the palace at evening, author unnamed and probably a member of the household\n\nCount the rooms that have nothing in them. Now count the rooms that have something in them. The second number is the household. The first number is the power, and it is much the larger, and it is maintained at very great expense to be empty.\n\nA hall that is full may be entered by anybody with business. A hall that is empty may be entered only by someone whose business is to enter empty halls, and there are four such persons in this palace, and the whole east knows their names.\n\nThe meditation ends where these things always end. Power is not what a ruler can fill. It is what he can keep quiet, and the quietest chamber in this building has not been used for anything in ninety years and is swept daily."
 omni_library_scrolls.buy.scroll_zinduidian_poetry_1:0 "#G Buy The Three Breaths of Bachin#! - 60 Gold"
 omni_library_scrolls.read.scroll_zinduidian_poetry_1:0 "Read The Three Breaths of Bachin"
 omni_library_scrolls.scroll_zinduidian_poetry_1.title:0 "The Three Breaths of Bachin"
 omni_library_scrolls.scroll_zinduidian_poetry_1.tooltip:0 "#T The Three Breaths of Bachin#!\nRarity: Common\nRegional pools: Zinduidian and Zainudian works\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_zinduidian_poetry_1.text:0 "The Three Breaths of Bachin\n\nA breathing-office; the instructions are the poem and are not separable from it\n\nIn. Hold as long as it takes to say the name of your father.\nOut. Longer than in.\nAgain.\n\nIn. Hold as long as it takes to say the name of a man you have wronged.\nOut. Longer than in.\nAgain.\n\nIn. Hold as long as it takes to say nothing.\nOut.\nDo not do this a fourth time. Those who have done it a fourth time report either a vision or a headache, and the tradition is unable to distinguish them, and holds that the distinction was never the point."
 omni_library_scrolls.buy.scroll_zinduidian_poetry_2:0 "#G Buy The Dust of Dui-Ttaushu#! - 120 Gold"
 omni_library_scrolls.read.scroll_zinduidian_poetry_2:0 "Read The Dust of Dui-Ttaushu"
 omni_library_scrolls.scroll_zinduidian_poetry_2.title:0 "The Dust of Dui-Ttaushu"
 omni_library_scrolls.scroll_zinduidian_poetry_2.tooltip:0 "#T The Dust of Dui-Ttaushu#!\nRarity: Uncommon\nRegional pools: Zinduidian and Zainudian works\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_zinduidian_poetry_2.text:0 "The Dust of Dui-Ttaushu\n\nOn the road where the first revelation is placed\n\nThe idol was nine cubits and was gold\nand had a house, and men to sweep the house,\nand a day in the year, and a name to be told,\nand a price, if you had asked, which no one does.\n\nIt is in the wind now. Some of it is in my eye.\nSome of it is in the bread I bought at noon.\nIt did not fall. Nobody made it die.\nIt simply went on being, and went thin."
 omni_library_scrolls.buy.scroll_zinduidian_poetry_3:0 "#G Buy Songs of the Carried Tomb#! - 240 Gold"
 omni_library_scrolls.read.scroll_zinduidian_poetry_3:0 "Read Songs of the Carried Tomb"
 omni_library_scrolls.scroll_zinduidian_poetry_3.title:0 "Songs of the Carried Tomb"
 omni_library_scrolls.scroll_zinduidian_poetry_3.tooltip:0 "#T Songs of the Carried Tomb#!\nRarity: Rare\nRegional pools: Zinduidian and Zainudian works\n#G Reward#! #T 3% Religious Tech Research#!"
 omni_library_scrolls.scroll_zinduidian_poetry_3.text:0 "Songs of the Carried Tomb\n\nThe processional; ninety-one verses, one for each stage, of which the last is given\n\nShoulder. Shoulder. Change at the water.\nShoulder. Shoulder. Change at the water.\nHe is not heavy. We have said this for four hundred miles\nand it has been a lie for four hundred miles\nand we will say it up the last hill.\n\nThere is a village. They have come out to the road.\nThey are not singing. They are only standing,\nwhich is harder, and which they have done since dawn.\nShoulder. Shoulder. Do not change here.\nLet them see it move. Let them see it move properly.\nWe can rest at the top. We have been resting all our lives."
 omni_library_scrolls.buy.scroll_zinduidian_poetry_4:0 "#G Buy The Unseen Lotus#! - 60 Gold"
 omni_library_scrolls.read.scroll_zinduidian_poetry_4:0 "Read The Unseen Lotus"
 omni_library_scrolls.scroll_zinduidian_poetry_4.title:0 "The Unseen Lotus"
 omni_library_scrolls.scroll_zinduidian_poetry_4.tooltip:0 "#T The Unseen Lotus#!\nRarity: Common\nRegional pools: Zinduidian and Zainudian works\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_zinduidian_poetry_4.text:0 "The Unseen Lotus\n\nShort verses on unregarded things\n\nThe lotus in the ditch behind the mill:\nnobody waters it and it is well.\n\nThe step that everybody uses and\nno one has ever looked at. It is worn\nin the shape of the whole town's coming and going.\nThat is a portrait, and it took two hundred years,\nand the man who made it does not exist.\n\nThe last cup on the shelf. The one they leave.\nIt is the same cup. Consider what you believe."
 omni_library_scrolls.buy.scroll_zinduidian_poetry_5:0 "#G Buy The Empty Center#! - 120 Gold"
 omni_library_scrolls.read.scroll_zinduidian_poetry_5:0 "Read The Empty Center"
 omni_library_scrolls.scroll_zinduidian_poetry_5.title:0 "The Empty Center"
 omni_library_scrolls.scroll_zinduidian_poetry_5.tooltip:0 "#T The Empty Center#!\nRarity: Uncommon\nRegional pools: Zinduidian and Zainudian works\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_zinduidian_poetry_5.text:0 "The Empty Center\n\nA philosophical poem, much quoted and rarely finished\n\nThe use of the bowl is the hole in the bowl.\nThe use of the door is the gap in the wall.\nThe use of the wheel is the space at the hub.\nYou have heard this. Everyone has heard this.\n\nNow the difficult part, which is the second half\nand is left out of every quotation:\nthe hole must be surrounded. A hole alone\nis not a bowl, it is a field, and holds no soup.\nThe emptiness is useful. It is not the point.\nIt is what the clay agreed to go around."
 omni_library_scrolls.buy.scroll_zinduidian_poetry_6:0 "#G Buy Dances of the Zaindaxan#! - 60 Gold"
 omni_library_scrolls.read.scroll_zinduidian_poetry_6:0 "Read Dances of the Zaindaxan"
 omni_library_scrolls.scroll_zinduidian_poetry_6.title:0 "Dances of the Zaindaxan"
 omni_library_scrolls.scroll_zinduidian_poetry_6.tooltip:0 "#T Dances of the Zaindaxan#!\nRarity: Common\nRegional pools: Zinduidian and Zainudian works\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_zinduidian_poetry_6.text:0 "Dances of the Zaindaxan\n\nA written choreography; the notation is not used anywhere else and was invented for this\n\nThe first figure sets the dancer at the south and turns her by degrees against the sun, which is contrary to every other sacred dance in the tradition and is the reason this notation had to be invented, the older signs having no way to write a turn that is wrong.\n\nThe second figure is a slow crossing of the floor in eleven steps, each step held. The eleven correspond to the eleven stations of the northern sky in the month of the founding. The dancer is not required to know this. The dancer is required to hold the step.\n\nThe third figure has no notation. The manuscript leaves the space blank and gives, in the margin, only the instruction: as you have been shown. Three schools claim to have been shown. They do not agree, and each has declined to perform in the presence of the others since 903 LC."
 omni_library_scrolls.buy.scroll_zinduidian_poetry_7:0 "#G Buy The River That Flows Upward#! - 240 Gold"
 omni_library_scrolls.read.scroll_zinduidian_poetry_7:0 "Read The River That Flows Upward"
 omni_library_scrolls.scroll_zinduidian_poetry_7.title:0 "The River That Flows Upward"
 omni_library_scrolls.scroll_zinduidian_poetry_7.tooltip:0 "#T The River That Flows Upward#!\nRarity: Rare\nRegional pools: Zinduidian and Zainudian works\n#G Reward#! #T 3% Oratory Tech Research#!"
 omni_library_scrolls.scroll_zinduidian_poetry_7.text:0 "The River That Flows Upward\n\nA vision-poem, of disputed authorship and undisputed strangeness\n\nI went up it. That is the whole difficulty.\nThe water came at me and I went into it\nand the villages got younger as I climbed\nand the bread in the windows got warmer\nand nobody I passed had heard of the flood.\n\nAt the top there was a spring and it was small.\nA woman was filling a jar. She said: it is only water.\nI said: it is the source.\nShe said: yes. It is only water.\nAnd I went back down and everything happened again\nin the order it had happened the first time,\nand I could not stop any of it, and I had known that going up."
 omni_library_scrolls.buy.scroll_zinduidian_poetry_8:0 "#G Buy The Rebel's Silence#! - 60 Gold"
 omni_library_scrolls.read.scroll_zinduidian_poetry_8:0 "Read The Rebel's Silence"
 omni_library_scrolls.scroll_zinduidian_poetry_8.title:0 "The Rebel's Silence"
 omni_library_scrolls.scroll_zinduidian_poetry_8.tooltip:0 "#T The Rebel's Silence#!\nRarity: Common\nRegional pools: Zinduidian and Zainudian works\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_zinduidian_poetry_8.text:0 "The Rebel's Silence\n\nOn the Zaraken prisoners; a martyr-poem that declines to name a single martyr\n\nThey asked the first one for the names. He gave the day of the week.\nThey asked the second and the second gave the weather.\nThey asked the third and the third said nothing at all\nand it is the third that this poem is about\nand the third is the one whose name we also do not have,\nwhich is either a great sorrow or the entire point."
 omni_library_scrolls.buy.scroll_zinduidian_poetry_9:0 "#G Buy Ink of the Mountain Spring#! - 120 Gold"
 omni_library_scrolls.read.scroll_zinduidian_poetry_9:0 "Read Ink of the Mountain Spring"
 omni_library_scrolls.scroll_zinduidian_poetry_9.title:0 "Ink of the Mountain Spring"
 omni_library_scrolls.scroll_zinduidian_poetry_9.tooltip:0 "#T Ink of the Mountain Spring#!\nRarity: Uncommon\nRegional pools: Zinduidian and Zainudian works\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_zinduidian_poetry_9.text:0 "Ink of the Mountain Spring\n\nA treatise on calligraphy, with a doctrine attached that the calligraphers of Makok regard as optional\n\nTake the water at the spring itself and not below the second pool. Carry it covered. Grind at the temperature of the hand. The blacks obtained by this method are demonstrably deeper and the strokes hold their edge for a century, and all of this is craft and is not disputed.\n\nThe doctrine is disputed. It holds that the purity of the water enters the word, and that a contract written in valley water will be broken, and that this has been observed. The treatise supplies eleven instances. Nine are contracts that were broken. Two are contracts that were not, and the author includes them, which is more than his opponents have ever done.\n\nThe final instruction is practical and is followed by everybody regardless of doctrine: if you are copying something you do not believe, use the valley water. It is cheaper, and there is no sense spending the mountain on a lie."
 omni_library_scrolls.buy.scroll_zinduidian_poetry_10:0 "#G Buy The Shadow of Makok#! - 60 Gold"
 omni_library_scrolls.read.scroll_zinduidian_poetry_10:0 "Read The Shadow of Makok"
 omni_library_scrolls.scroll_zinduidian_poetry_10.title:0 "The Shadow of Makok"
 omni_library_scrolls.scroll_zinduidian_poetry_10.tooltip:0 "#T The Shadow of Makok#!\nRarity: Common\nRegional pools: Zinduidian and Zainudian works\n#G Reward#! #T 1% Religious Tech Research#!"
 omni_library_scrolls.scroll_zinduidian_poetry_10.text:0 "The Shadow of Makok\n\nA traveller's comfort, recited at the last stage of the pilgrim road\n\nYou are not there yet. You are in the shadow.\nThe shadow is nine miles long in the evening\nand it is cool in it, and the road is level,\nand nobody in the shadow has ever been robbed.\n\nSome pilgrims stop here and do not go on.\nThe city is very hot and very loud\nand the shadow is not, and the shadow is the city,\nin the sense that matters, and they are not wrong,\nand every year the priests go out and fetch them,\nand every year a few of them stay out."
 omni_library_scrolls.buy.scroll_baetepian_poetry_1:0 "#G Buy The Pomegranate's Lament#! - 60 Gold"
 omni_library_scrolls.read.scroll_baetepian_poetry_1:0 "Read The Pomegranate's Lament"
 omni_library_scrolls.scroll_baetepian_poetry_1.title:0 "The Pomegranate's Lament"
 omni_library_scrolls.scroll_baetepian_poetry_1.tooltip:0 "#T The Pomegranate's Lament#!\nRarity: Common\nRegional pools: Baetepian and Dune court texts\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_baetepian_poetry_1.text:0 "The Pomegranate's Lament\n\nSpoken by the throne; a court cycle of eleven poems, of which this is the first\n\nI was made to be sat in. That is the whole of me.\nEvery other property I have,\nthe gilding, the pomegranate, the seven steps,\nis an argument for the one thing I am not doing.\n\nIn Dune they have put me in a good room.\nThey dust me. A man comes on the second day.\nHe is very careful with the arms, which is where the hands would be,\nand he has never once sat down in me,\nand I have been in that room for a hundred years\nbeing extremely well looked after by people\nwho are waiting, as I am, for somebody to be rude."
 omni_library_scrolls.buy.scroll_baetepian_poetry_2:0 "#G Buy Whispers in the Ledger#! - 120 Gold"
 omni_library_scrolls.read.scroll_baetepian_poetry_2:0 "Read Whispers in the Ledger"
 omni_library_scrolls.scroll_baetepian_poetry_2.title:0 "Whispers in the Ledger"
 omni_library_scrolls.scroll_baetepian_poetry_2.tooltip:0 "#T Whispers in the Ledger#!\nRarity: Uncommon\nRegional pools: Baetepian and Dune court texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_baetepian_poetry_2.text:0 "Whispers in the Ledger\n\nA work of literature disguised as tax returns; the disguise held for sixty years\n\nRead only the annotations. The figures are correct and are not the book. Begin at the third quarter of the year 71 and read every marginal note in sequence to the end of the volume, ignoring the columns entirely.\n\nWhat emerges is a narrative of some length concerning a family in the delta, told at the rate of one clause per assessment, over nineteen years. Births appear as adjustments to the household count. A marriage appears as a transfer of a boat. A death appears twice, once as an exemption claimed and once, four lines later, as a correction to the exemption, in a different hand and much more slowly written.\n\nThe Zanic auditors initialled every page. They were not careless men. They were simply reading the other half of the document, which was, in fairness, the half they had been sent to read."
 omni_library_scrolls.buy.scroll_baetepian_poetry_3:0 "#G Buy Sands of the Old Kingdom#! - 60 Gold"
 omni_library_scrolls.read.scroll_baetepian_poetry_3:0 "Read Sands of the Old Kingdom"
 omni_library_scrolls.scroll_baetepian_poetry_3.title:0 "Sands of the Old Kingdom"
 omni_library_scrolls.scroll_baetepian_poetry_3.tooltip:0 "#T Sands of the Old Kingdom#!\nRarity: Common\nRegional pools: Baetepian and Dune court texts\n#G Reward#! #T 1% Religious Tech Research#!"
 omni_library_scrolls.scroll_baetepian_poetry_3.text:0 "Sands of the Old Kingdom\n\nOdes of the Dune court, in the old measure\n\nThe dune at the third well moved a spear's length north\nin the year the empire came, and did not stop,\nand moved a spear's length north the year they built,\nand a spear's length north the year the governor was recalled.\n\nIt is at the wall now. Nobody has told it.\nIt was not told about the wall in the first place.\nIt is not opposing anything. It is going north,\nand it has been going north since before the language,\nand the wall is a thing that happened to be in the way\nfor eighty years, which is not long, in sand."
 omni_library_scrolls.buy.scroll_baetepian_poetry_4:0 "#G Buy The Hidden Seed#! - 240 Gold"
 omni_library_scrolls.read.scroll_baetepian_poetry_4:0 "Read The Hidden Seed"
 omni_library_scrolls.scroll_baetepian_poetry_4.title:0 "The Hidden Seed"
 omni_library_scrolls.scroll_baetepian_poetry_4.tooltip:0 "#T The Hidden Seed#!\nRarity: Rare\nRegional pools: Baetepian and Dune court texts\n#G Reward#! #T 3% Civic Tech Research#!"
 omni_library_scrolls.scroll_baetepian_poetry_4.text:0 "The Hidden Seed\n\nAn illustrated botany of the desert margins; the plates are exact and the text is not about plants\n\nPlate nine. The bulb of the winter lily, which lies at four hands' depth and does not appear above ground in years when the rain fails. In such years it is universally believed to be dead. It has been recorded emerging after nine consecutive dry seasons, whole, and flowering within the month.\n\nThe text observes that no method exists for distinguishing a dead bulb from a waiting one without digging it up, and that digging it up settles the question in only one direction. Cultivators are therefore advised to leave the bed undisturbed and to resist the appearance of failure, which the author calls the most expensive crop in Baetep.\n\nThe final plate is the same bulb in flower, and is drawn in a different and much older hand, and is captioned in a script the printers of this edition were unable to set and have reproduced as an engraving."
 omni_library_scrolls.buy.scroll_baetepian_poetry_5:0 "#G Buy Songs of the River Tolls#! - 60 Gold"
 omni_library_scrolls.read.scroll_baetepian_poetry_5:0 "Read Songs of the River Tolls"
 omni_library_scrolls.scroll_baetepian_poetry_5.title:0 "Songs of the River Tolls"
 omni_library_scrolls.scroll_baetepian_poetry_5.tooltip:0 "#T Songs of the River Tolls#!\nRarity: Common\nRegional pools: Baetepian and Dune court texts\n#G Reward#! #T 2% Commerce Tech Research#!"
 omni_library_scrolls.scroll_baetepian_poetry_5.text:0 "Songs of the River Tolls\n\nRowing songs of the lower river; the toll-collectors have requested a translation on four occasions\n\nPull for the gentleman standing there,\npull for his hat and his lovely chair,\npull for the ledger and pull for the pen,\npull, and we will come by here again.\n\nAsk him the depth and he will not know,\nask him the season and watch him go,\nask him what happens at the second bend,\nask him, and pull, and do not offend.\n\nThe word rendered here as gentleman is not, in the original, that word. The rowers have twice supplied the collectors with a translation. Both were courteous. Both were wrong."
 omni_library_scrolls.buy.scroll_baetepian_poetry_6:0 "#G Buy The Gilded Cage#! - 120 Gold"
 omni_library_scrolls.read.scroll_baetepian_poetry_6:0 "Read The Gilded Cage"
 omni_library_scrolls.scroll_baetepian_poetry_6.title:0 "The Gilded Cage"
 omni_library_scrolls.scroll_baetepian_poetry_6.tooltip:0 "#T The Gilded Cage#!\nRarity: Uncommon\nRegional pools: Baetepian and Dune court texts\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_baetepian_poetry_6.text:0 "The Gilded Cage\n\nA court play; the bird is played by a singer who does not appear on stage\n\nTHE EMPEROR: Sing the one about the river.\nTHE BIRD: (sings the one about the river)\nTHE EMPEROR: Again.\nTHE BIRD: (sings the one about the river)\nTHE EMPEROR: Something else.\nTHE BIRD: (sings the one about the river)\n\nTHE EMPEROR: You know others.\nTHE BIRD: I know eleven.\nTHE EMPEROR: Then sing another.\nTHE BIRD: You have not asked for another. You have asked for something else, and there is no song called something else.\n(The Emperor does not speak again in this act. The bird sings the one about the river until the curtain.)"
 omni_library_scrolls.buy.scroll_baetepian_poetry_7:0 "#G Buy Tapestry of the Absent Monarch#! - 240 Gold"
 omni_library_scrolls.read.scroll_baetepian_poetry_7:0 "Read Tapestry of the Absent Monarch"
 omni_library_scrolls.scroll_baetepian_poetry_7.title:0 "Tapestry of the Absent Monarch"
 omni_library_scrolls.scroll_baetepian_poetry_7.tooltip:0 "#T Tapestry of the Absent Monarch#!\nRarity: Rare\nRegional pools: Baetepian and Dune court texts\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_baetepian_poetry_7.text:0 "Tapestry of the Absent Monarch\n\nA description of a hanging in the Dune treasury; the hanging itself is not shown to visitors\n\nIt is eleven feet by nineteen. The courtiers are on both sides in four ranks, and they are done with extraordinary finish, down to the stitching on the third rank's slippers, which no one standing at a proper distance can possibly see.\n\nThe centre is bare linen. Not white thread. Linen, unworked, the ground of the piece itself, in the exact shape and scale a seated figure would occupy, and the courtiers on either side are turned toward it and are lit from it, which is a very great difficulty in weaving and has been solved.\n\nVisitors ask why the weaver did not simply show an empty throne. The treasury's answer, which is written on the card and has not been changed in two hundred years, is that an empty throne is a piece of furniture, and that what is wanted here is a missing person."
 omni_library_scrolls.buy.scroll_baetepian_poetry_8:0 "#G Buy The Sertem's Shadow#! - 60 Gold"
 omni_library_scrolls.read.scroll_baetepian_poetry_8:0 "Read The Sertem's Shadow"
 omni_library_scrolls.scroll_baetepian_poetry_8.title:0 "The Sertem's Shadow"
 omni_library_scrolls.scroll_baetepian_poetry_8.tooltip:0 "#T The Sertem's Shadow#!\nRarity: Common\nRegional pools: Baetepian and Dune court texts\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_baetepian_poetry_8.text:0 "The Sertem's Shadow\n\nObservations on the garrison, by a clerk who saw them every day for thirty years\n\nThe commander of the river gate does not turn his back to the water. He has done this for four years. He does not know that he does it, and I know the month it began, because I keep a diary and he does not.\n\nThe new one taps the seal twice before he presses it. The one before him counted his escort at the corner by the granary, every time, though the escort had not been out of his sight. These are not fears. A fear is a thing a man knows he has. These are habits, which is what a fear becomes when it has been denied for long enough to settle.\n\nA conquered people learns to read faces very quickly, having little else to read. The conquerors never learn to hide them, having never had to. This is the whole of our advantage and I do not think it is a small one."
 omni_library_scrolls.buy.scroll_baetepian_poetry_9:0 "#G Buy Echoes in the Empty Temple#! - 120 Gold"
 omni_library_scrolls.read.scroll_baetepian_poetry_9:0 "Read Echoes in the Empty Temple"
 omni_library_scrolls.scroll_baetepian_poetry_9.title:0 "Echoes in the Empty Temple"
 omni_library_scrolls.scroll_baetepian_poetry_9.tooltip:0 "#T Echoes in the Empty Temple#!\nRarity: Uncommon\nRegional pools: Baetepian and Dune court texts\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_baetepian_poetry_9.text:0 "Echoes in the Empty Temple\n\nOn devotion after the removal of the images\n\nThey took the god out on a cart in the ninth month.\nWe expected the building to become a barn.\nIt did not. It became louder, if anything,\nthe stone having nothing left to stand in front of.\n\nI do not say this is better. I say it is what happened.\nWhen there was a face there, we looked at the face.\nNow there is a wall there, and we look past the wall,\nand more of us come, and we stay longer,\nand nobody has yet had the courage to write to Dune\nand ask them not to send another one."
 omni_library_scrolls.buy.scroll_baetepian_poetry_10:0 "#G Buy The Portable Homeland#! - 60 Gold"
 omni_library_scrolls.read.scroll_baetepian_poetry_10:0 "Read The Portable Homeland"
 omni_library_scrolls.scroll_baetepian_poetry_10.title:0 "The Portable Homeland"
 omni_library_scrolls.scroll_baetepian_poetry_10.tooltip:0 "#T The Portable Homeland#!\nRarity: Common\nRegional pools: Baetepian and Dune court texts\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_baetepian_poetry_10.text:0 "The Portable Homeland\n\nA primer in verse, taught to children before letters and deliberately never printed until now\n\nSay the seven kings. Say them in order.\nSay the river from the mouth to the fourth cataract.\nSay what the pomegranate means. Say where it went.\nSay it again on the way to the well tomorrow.\n\nYou will not have a book. A book is a thing in a house\nand a house is a thing that a soldier can be in.\nYou are the book. You are extremely hard to burn.\nSay the seven kings. Say them in order. Good.\nNow go and teach your sister, who is four,\nand does not know she is a library."
 omni_library_scrolls.buy.scroll_azar_poetry_1:0 "#G Buy The Weeping Ziggurat#! - 60 Gold"
 omni_library_scrolls.read.scroll_azar_poetry_1:0 "Read The Weeping Ziggurat"
 omni_library_scrolls.scroll_azar_poetry_1.title:0 "The Weeping Ziggurat"
 omni_library_scrolls.scroll_azar_poetry_1.tooltip:0 "#T The Weeping Ziggurat#!\nRarity: Common\nRegional pools: Azar and Gold Dwarf chronicles\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_azar_poetry_1.text:0 "The Weeping Ziggurat\n\nA lament of the Azari, in the hammer-measure, four stresses to the line\n\nGold on the great stair, gold on the grieving stone,\ngold going down where the god had gone before,\nseven-tiered singer of the sun, standing alone,\nnobody left on the lower terrace to lock the door.\n\nStone does not weep. We know this. We cut stone.\nWe know what it does and does not do, being the makers of it.\nAnd the stair was wet on the morning the army came\nand it had not rained, and we had not been up there,\nand this is in the record, and the record is ours,\nand no one is obliged to believe the record but us."
 omni_library_scrolls.buy.scroll_azar_poetry_2:0 "#G Buy Sparks from the Golden Anvil#! - 120 Gold"
 omni_library_scrolls.read.scroll_azar_poetry_2:0 "Read Sparks from the Golden Anvil"
 omni_library_scrolls.scroll_azar_poetry_2.title:0 "Sparks from the Golden Anvil"
 omni_library_scrolls.scroll_azar_poetry_2.tooltip:0 "#T Sparks from the Golden Anvil#!\nRarity: Uncommon\nRegional pools: Azar and Gold Dwarf chronicles\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_azar_poetry_2.text:0 "Sparks from the Golden Anvil\n\nForge-verses; each is the length of one heat\n\nDown. Up. Down. Up. Down.\nThe metal is listening now. It was not listening before.\nDown. Up. Down. That is the sound of the argument being won.\nBack in the fire. It is not convinced.\n\nA stroke too many and the edge is glass.\nA stroke too few and the edge is a suggestion.\nNobody has ever been told which stroke it is.\nYou are told: you will know. And then you do not know.\nAnd then, in the ninth year, without any announcement,\nyou know, and cannot say how, and cannot teach it,\nand say to your apprentice: you will know."
 omni_library_scrolls.buy.scroll_azar_poetry_3:0 "#G Buy The Opened Road#! - 60 Gold"
 omni_library_scrolls.read.scroll_azar_poetry_3:0 "Read The Opened Road"
 omni_library_scrolls.scroll_azar_poetry_3.title:0 "The Opened Road"
 omni_library_scrolls.scroll_azar_poetry_3.tooltip:0 "#T The Opened Road#!\nRarity: Common\nRegional pools: Azar and Gold Dwarf chronicles\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_azar_poetry_3.text:0 "The Opened Road\n\nVerses on the border states, composed the year after and not softened since\n\nA door is not a traitor. A door is a door.\nIt has one office and it did not do it.\nWe do not curse the hinge. We do not blame the floor.\nWe name the hand that stood beside it, knew, and drew it.\n\nThey say they were afraid. We grant that they were.\nThey say they were small. We grant that they were small.\nWe were behind them, and we were neither,\nand the wolf did not stop at the doorway to consider at all."
 omni_library_scrolls.buy.scroll_azar_poetry_4:0 "#G Buy Lullaby of the Deep Veins#! - 240 Gold"
 omni_library_scrolls.read.scroll_azar_poetry_4:0 "Read Lullaby of the Deep Veins"
 omni_library_scrolls.scroll_azar_poetry_4.title:0 "Lullaby of the Deep Veins"
 omni_library_scrolls.scroll_azar_poetry_4.tooltip:0 "#T Lullaby of the Deep Veins#!\nRarity: Rare\nRegional pools: Azar and Gold Dwarf chronicles\n#G Reward#! #T 3% Commerce Tech Research#!"
 omni_library_scrolls.scroll_azar_poetry_4.text:0 "Lullaby of the Deep Veins\n\nSung on the first descent; the tune is very old and the words are older\n\nDown where it is warm, down where it is black,\ndown where the mountain is having its dream,\nthe gold is a thought that it has not thought yet,\nthe silver a word that it has not said.\n\nDo not be afraid of the dark, small one.\nThe dark is the mountain with its eyes shut.\nBe afraid of the water, and be afraid of the gas,\nand be afraid of the man who does not check the timber.\nThe dark has never hurt anybody.\nSleep, and take up the lamp, and mind the timber."
 omni_library_scrolls.buy.scroll_azar_poetry_5:0 "#G Buy The Fractured Jewel#! - 60 Gold"
 omni_library_scrolls.read.scroll_azar_poetry_5:0 "Read The Fractured Jewel"
 omni_library_scrolls.scroll_azar_poetry_5.title:0 "The Fractured Jewel"
 omni_library_scrolls.scroll_azar_poetry_5.tooltip:0 "#T The Fractured Jewel#!\nRarity: Common\nRegional pools: Azar and Gold Dwarf chronicles\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_azar_poetry_5.text:0 "The Fractured Jewel\n\nA cutter's meditation, appended to a technical manual and much better known than the manual\n\nA stone without a flaw does nothing. Light goes in and light comes out and the stone has not been consulted. It is water in a shape.\n\nThe flaw is where the light is made to turn. Every fire in a jewel, every colour that was not in the sun that entered it, is the work of a fault. The cutter's art is not to remove them. The cutter's art is to choose which of them the stone will be seen by.\n\nThe meditation has been read since the conquest as being about the Azari and it is difficult to argue that it is not. The cutter, who lived to be very old, was asked directly in his last year. He said that it was about a stone, and that he had never in sixty years met a stone that was not also about something else."
 omni_library_scrolls.buy.scroll_azar_poetry_6:0 "#G Buy The Stone's Memory#! - 120 Gold"
 omni_library_scrolls.read.scroll_azar_poetry_6:0 "Read The Stone's Memory"
 omni_library_scrolls.scroll_azar_poetry_6.title:0 "The Stone's Memory"
 omni_library_scrolls.scroll_azar_poetry_6.tooltip:0 "#T The Stone's Memory#!\nRarity: Uncommon\nRegional pools: Azar and Gold Dwarf chronicles\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_azar_poetry_6.text:0 "The Stone's Memory\n\nOf the mountain-listeners; a doctrine the Zanic authorities have never thought worth suppressing\n\nIt has us. That is the claim and it is a large one.\nEvery foot that has gone over it since the first foot,\nheld in the rock the way a year is held in a tree,\nnot as a memory, which requires a mind,\nbut as a shape, which requires only weight and time.\n\nSo the boots that are up there now are also in it.\nThe doctrine does not say the mountain minds.\nThe doctrine says the mountain does not forget,\nand that it has a long habit of settling,\nand that our people are further down than theirs."
 omni_library_scrolls.buy.scroll_azar_poetry_7:0 "#G Buy The Architect's Dream#! - 240 Gold"
 omni_library_scrolls.read.scroll_azar_poetry_7:0 "Read The Architect's Dream"
 omni_library_scrolls.scroll_azar_poetry_7.title:0 "The Architect's Dream"
 omni_library_scrolls.scroll_azar_poetry_7.tooltip:0 "#T The Architect's Dream#!\nRarity: Rare\nRegional pools: Azar and Gold Dwarf chronicles\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_azar_poetry_7.text:0 "The Architect's Dream\n\nPlans for a city beneath the earth; the author was not an architect and the plans are not buildable\n\nLevel one is the market and is lit from below by a river of some kind which the plan does not explain. Level four is the hall of the seven-hundred, and its roof is described as gold at the thickness of a leaf, held up by nothing, at a span of four hundred feet. The author is aware. There is a note. The note says: it was like this.\n\nThe whole work is drawn in the past tense. Every caption describes a thing that stood, and the reader is a considerable way into the second book before realising that no such city has ever existed above or below the ground, and that the past tense is not a claim but a wish that has given up pretending to be a proposal.\n\nIt is the most copied book in the Azari houses. Cities that can be built get built and then get taken. This one has now survived four hundred years and one empire without a single stone being laid."
 omni_library_scrolls.buy.scroll_azar_poetry_8:0 "#G Buy Echoes of Tiuban#! - 60 Gold"
 omni_library_scrolls.read.scroll_azar_poetry_8:0 "Read Echoes of Tiuban"
 omni_library_scrolls.scroll_azar_poetry_8.title:0 "Echoes of Tiuban"
 omni_library_scrolls.scroll_azar_poetry_8.tooltip:0 "#T Echoes of Tiuban#!\nRarity: Common\nRegional pools: Azar and Gold Dwarf chronicles\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_azar_poetry_8.text:0 "Echoes of Tiuban\n\nBallads of the border states, sung in the old halls, none of them in the winners' language\n\nThey had eleven hundred and they knew the number.\nThey had one pass and they knew the pass.\nThey sent to us and we were four days off\nand they knew that too, and they stood in the pass.\n\nNobody has ever said that it was clever.\nIt was not clever. Clever would have run.\nThey bought four days and they were charged the whole,\nand we came up on the fifth, and it was done,\nand we sing them, who did not sing at all,\nand were not sung by anybody else."
 omni_library_scrolls.buy.scroll_azar_poetry_9:0 "#G Buy The Forge of Souls#! - 120 Gold"
 omni_library_scrolls.read.scroll_azar_poetry_9:0 "Read The Forge of Souls"
 omni_library_scrolls.scroll_azar_poetry_9.title:0 "The Forge of Souls"
 omni_library_scrolls.scroll_azar_poetry_9.tooltip:0 "#T The Forge of Souls#!\nRarity: Uncommon\nRegional pools: Azar and Gold Dwarf chronicles\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_azar_poetry_9.text:0 "The Forge of Souls\n\nA martial poem, disliked by recruiting officers and popular with the recruited\n\nNobody is born a blade. A blade is a decision\nmade nine hundred times by somebody else\nwith a hammer, in a bad light, for no wages,\non a bar of iron that would rather be a bar of iron.\n\nSo when they tell you that you have the makings,\nunderstand what has been said. The makings\nare the part that goes in the fire. The rest is done to you.\nAnd every soldier I respect was beaten into it,\nand every soldier I have buried was not beaten enough."
 omni_library_scrolls.buy.scroll_azar_poetry_10:0 "#G Buy The Weight of Gold#! - 60 Gold"
 omni_library_scrolls.read.scroll_azar_poetry_10:0 "Read The Weight of Gold"
 omni_library_scrolls.scroll_azar_poetry_10.title:0 "The Weight of Gold"
 omni_library_scrolls.scroll_azar_poetry_10.tooltip:0 "#T The Weight of Gold#!\nRarity: Common\nRegional pools: Azar and Gold Dwarf chronicles\n#G Reward#! #T 1% Commerce Tech Research#!"
 omni_library_scrolls.scroll_azar_poetry_10.text:0 "The Weight of Gold\n\nOn the nature of value; commonly quoted by people who have not read the second half\n\nIt is heavier than it should be. Any assayer\nwill tell you what it weighs and will be right\nand will not have explained the thing at all.\nThe density is known. The heaviness is not.\n\nHere is the second half, which is not quoted:\nit is also only heavy in the hand.\nOn a scale it is a number, and the number is small,\nand the men who deal in it never touch it,\nand this is not an accident of trade,\nand it is why the ledger is a lighter document\nthan a purse, and always has been, and is preferred."
 omni_library_scrolls.buy.scroll_helluvian_poetry_1:0 "#G Buy The Blinded Saint#! - 60 Gold"
 omni_library_scrolls.read.scroll_helluvian_poetry_1:0 "Read The Blinded Saint"
 omni_library_scrolls.scroll_helluvian_poetry_1.title:0 "The Blinded Saint"
 omni_library_scrolls.scroll_helluvian_poetry_1.tooltip:0 "#T The Blinded Saint#!\nRarity: Common\nRegional pools: Helluvian sermons and resistance texts\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_helluvian_poetry_1.text:0 "The Blinded Saint\n\nHymns for the feast of O-Peliaz; the first and the ninth\n\nThey put out the light of him and he was lit.\nThey took the two windows and left the house.\nThey asked him after, and he answered it,\nand what he answered has been argued since.\n\nFor some hold that he said: I see you still,\nwhich is a miracle, and some hold that he said:\nI never looked at you, which is a will,\nand one old copy has him say: my head,\nwhich the compilers have preserved and not explained,\nand which the poor of Bubdonno have retained."
 omni_library_scrolls.buy.scroll_helluvian_poetry_2:0 "#G Buy Songs of the Militia Camp#! - 120 Gold"
 omni_library_scrolls.read.scroll_helluvian_poetry_2:0 "Read Songs of the Militia Camp"
 omni_library_scrolls.scroll_helluvian_poetry_2.title:0 "Songs of the Militia Camp"
 omni_library_scrolls.scroll_helluvian_poetry_2.tooltip:0 "#T Songs of the Militia Camp#!\nRarity: Uncommon\nRegional pools: Helluvian sermons and resistance texts\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_helluvian_poetry_2.text:0 "Songs of the Militia Camp\n\nCamp verses; rough, and the compiler has not smoothed them\n\nSharpen it long and pray it short,\nthe supper is late and the watch is bought,\nsharpen it long and pray it short,\nnobody here is what they were taught.\n\nThe cooper is a captain and the captain was a priest\nand the priest is on the picket and he has not slept,\nand the Lord is in the middle of it somewhere, at the least,\nand nobody is certain, and the promise has been kept."
 omni_library_scrolls.buy.scroll_helluvian_poetry_3:0 "#G Buy The Wood of the Cross#! - 60 Gold"
 omni_library_scrolls.read.scroll_helluvian_poetry_3:0 "Read The Wood of the Cross"
 omni_library_scrolls.scroll_helluvian_poetry_3.title:0 "The Wood of the Cross"
 omni_library_scrolls.scroll_helluvian_poetry_3.tooltip:0 "#T The Wood of the Cross#!\nRarity: Common\nRegional pools: Helluvian sermons and resistance texts\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_helluvian_poetry_3.text:0 "The Wood of the Cross\n\nA meditation on the timber\n\nIt was a tree first. That is not devotion, that is joinery.\nIt was cut, and it was squared, and it was carried,\nand the man who squared it was paid on the same day\nand is not in any account of the passion.\n\nSo I have put it back. In my poem it puts out\nthe leaf it did not put out, at the top,\nwhere the notice was, and the roots go down\nthrough the hill, and through the tomb, and are still going,\nand this is not what happened, and I know it,\nand every carpenter who has heard it has approved."
 omni_library_scrolls.buy.scroll_helluvian_poetry_4:0 "#G Buy Visions in the Kainaxari Dust#! - 240 Gold"
 omni_library_scrolls.read.scroll_helluvian_poetry_4:0 "Read Visions in the Kainaxari Dust"
 omni_library_scrolls.scroll_helluvian_poetry_4.title:0 "Visions in the Kainaxari Dust"
 omni_library_scrolls.scroll_helluvian_poetry_4.tooltip:0 "#T Visions in the Kainaxari Dust#!\nRarity: Rare\nRegional pools: Helluvian sermons and resistance texts\n#G Reward#! #T 3% Religious Tech Research#!"
 omni_library_scrolls.scroll_helluvian_poetry_4.text:0 "Visions in the Kainaxari Dust\n\nAn apocalypse, of the persecution years; the text breaks off and does not resume\n\nAnd the third thing I saw was the market as it is,\nwith the awnings, and the man with the scales,\nand nothing wrong with it at all, and this was worse\nthan the burning that came before it in the fourth vision.\n\nAnd I asked what I was seeing and was told:\nthis is the day after. And I said: after what.\nAnd was not answered, and the awnings went on moving,\nand the man with the scales weighed something out,\nand a woman I had buried in the spring\nbought it from him, and did not look up,\n\nand here the manuscript ends, at the foot of a leaf, and the next leaf is missing and has been missing since the earliest copy, and three houses have supplied endings, and none of the three agrees with either of the others."
 omni_library_scrolls.buy.scroll_helluvian_poetry_5:0 "#G Buy The Mayor's Burden#! - 60 Gold"
 omni_library_scrolls.read.scroll_helluvian_poetry_5:0 "Read The Mayor's Burden"
 omni_library_scrolls.scroll_helluvian_poetry_5.title:0 "The Mayor's Burden"
 omni_library_scrolls.scroll_helluvian_poetry_5.tooltip:0 "#T The Mayor's Burden#!\nRarity: Common\nRegional pools: Helluvian sermons and resistance texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_helluvian_poetry_5.text:0 "The Mayor's Burden\n\nOn the founding of Bubdonno; an office poem, read at the anniversary\n\nNobody sings the drainage. There is no hymn\nfor the second cistern, or the argument\nabout the second cistern, or the men\nwho dug it in the wrong place and then went\n\nand dug it in the right place, in the same year,\nfor nothing, having already been paid.\nFour years of this. Four years of no one here\nbut us, and the ditch, and the ditch again, and the trade.\n\nAnd then the soldiers came, and we were ready,\nnot because we were brave, which we were not,\nbut because four years of a ditch makes a town steady\nand a town that is steady is a thing they had not got."
 omni_library_scrolls.buy.scroll_helluvian_poetry_6:0 "#G Buy The Scattered Seeds#! - 120 Gold"
 omni_library_scrolls.read.scroll_helluvian_poetry_6:0 "Read The Scattered Seeds"
 omni_library_scrolls.scroll_helluvian_poetry_6.title:0 "The Scattered Seeds"
 omni_library_scrolls.scroll_helluvian_poetry_6.tooltip:0 "#T The Scattered Seeds#!\nRarity: Uncommon\nRegional pools: Helluvian sermons and resistance texts\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_helluvian_poetry_6.text:0 "The Scattered Seeds\n\nA hopeful verse; the hope is the argument and the argument is not certain\n\nA wind that scatters is not a wind that plants.\nThe figure is comforting and is not sound.\nMost seed that is scattered by a hard wind\nlands on the road, and is eaten, and is not found.\n\nI keep the figure anyway. Here is why.\nOf what was carried out of Kainaxarthos,\nsome fell on the road, and we know their names, and they are read out,\nand some did not, and those we do not know,\nbecause they are alive, and did not need to be written down."
 omni_library_scrolls.buy.scroll_helluvian_poetry_7:0 "#G Buy The Missionary's Path#! - 240 Gold"
 omni_library_scrolls.read.scroll_helluvian_poetry_7:0 "Read The Missionary's Path"
 omni_library_scrolls.scroll_helluvian_poetry_7.title:0 "The Missionary's Path"
 omni_library_scrolls.scroll_helluvian_poetry_7.tooltip:0 "#T The Missionary's Path#!\nRarity: Rare\nRegional pools: Helluvian sermons and resistance texts\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_helluvian_poetry_7.text:0 "The Missionary's Path\n\nA map-poem; the physical route is on the recto and the other route is on the verso\n\nRECTO: Out by the low gate at the fourth hour. The ford is passable in the dry season only. Three days to the herders, who will feed you and will not hide you. Do not take the coast road, which is watched, and does not save a day.\n\nVERSO: You will lose the certainty at the ford. Everyone does. Three days after that you will begin to be extremely eloquent, which is the most dangerous stage, and you should say nothing at all to the herders beyond thanking them.\n\nThe two sides are meant to be read together and the binding of every surviving copy makes this impossible, which the houses that produce them have never satisfactorily explained."
 omni_library_scrolls.buy.scroll_helluvian_poetry_8:0 "#G Buy The Soventeir Conversion#! - 60 Gold"
 omni_library_scrolls.read.scroll_helluvian_poetry_8:0 "Read The Soventeir Conversion"
 omni_library_scrolls.scroll_helluvian_poetry_8.title:0 "The Soventeir Conversion"
 omni_library_scrolls.scroll_helluvian_poetry_8.tooltip:0 "#T The Soventeir Conversion#!\nRarity: Common\nRegional pools: Helluvian sermons and resistance texts\n#G Reward#! #T 1% Religious Tech Research#!"
 omni_library_scrolls.scroll_helluvian_poetry_8.text:0 "The Soventeir Conversion\n\nA festal poem, from a house that could not entirely bring itself to celebrate\n\nThe Qhagan has come in. Ring it, and ring it well.\nThe Qhagan has come in with everything he has,\nwhich is the faith, and forty thousand horse,\nand these have now been placed on the same side.\n\nI will not be the one to say this is not joy.\nI will only observe, at the end of a long hymn,\nthat we prayed for a shepherd and were sent a shepherd\nwho arrived at a gallop with the dogs already out,\nand that the sheep have not been asked,\nand that I am the sheep, and that I am ringing the bell."
 omni_library_scrolls.buy.scroll_helluvian_poetry_9:0 "#G Buy Echoes of the Unrest#! - 120 Gold"
 omni_library_scrolls.read.scroll_helluvian_poetry_9:0 "Read Echoes of the Unrest"
 omni_library_scrolls.scroll_helluvian_poetry_9.title:0 "Echoes of the Unrest"
 omni_library_scrolls.scroll_helluvian_poetry_9.tooltip:0 "#T Echoes of the Unrest#!\nRarity: Uncommon\nRegional pools: Helluvian sermons and resistance texts\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_helluvian_poetry_9.text:0 "Echoes of the Unrest\n\nAn account of the risings; the metre breaks in the second stanza and is not repaired\n\nFirst the bell, and that was ours, and then the other bell,\nwhich was not ours, and then a great many bells\nand nobody knowing which bell they were answering,\nand the square full by the time the question mattered.\n\nand a man on the steps who I did not know who he was\nand nobody knew and he was very good\nand we did what he said and I do not know his name\nand I do not know if he was ours and it worked\nand afterwards there were people in the street who were pleased\nand I could not tell you now what any of us wanted."
 omni_library_scrolls.buy.scroll_helluvian_poetry_10:0 "#G Buy The Empty Tomb#! - 60 Gold"
 omni_library_scrolls.read.scroll_helluvian_poetry_10:0 "Read The Empty Tomb"
 omni_library_scrolls.scroll_helluvian_poetry_10.title:0 "The Empty Tomb"
 omni_library_scrolls.scroll_helluvian_poetry_10.tooltip:0 "#T The Empty Tomb#!\nRarity: Common\nRegional pools: Helluvian sermons and resistance texts\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_helluvian_poetry_10.text:0 "The Empty Tomb\n\nA short verse for the martyrs' day\n\nTheirs is empty and is visited.\nYours is occupied and is guarded.\nI have stood at both. I will tell you the difference,\nwhich is not doctrine and can be seen from the road:\n\nat the empty one, people go in.\nAt the full one, people go past,\nand the men at the door have to be paid to stay,\nand at the other there is no door and no one is paid."
 omni_library_scrolls.buy.scroll_arteon_poetry_1:0 "#G Buy The Unwon Peace#! - 60 Gold"
 omni_library_scrolls.read.scroll_arteon_poetry_1:0 "Read The Unwon Peace"
 omni_library_scrolls.scroll_arteon_poetry_1.title:0 "The Unwon Peace"
 omni_library_scrolls.scroll_arteon_poetry_1.tooltip:0 "#T The Unwon Peace#!\nRarity: Common\nRegional pools: Arteonian and High Elven war texts\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_arteon_poetry_1.text:0 "The Unwon Peace\n\nOf the Arteonian satirists; recited at the signing, though not in the chamber\n\nTwo wolves above a carcass with no meat,\nthe hide gone, and the marrow, and the year,\neach with a paw upon it, each too spent\nto lift the paw, and neither going near.\n\nThey have agreed. Set down that they agreed.\nSet down the hour, and the excellent brocade.\nDo not set down that neither of them freed\nthe carcass, or admitted it was dead."
 omni_library_scrolls.buy.scroll_arteon_poetry_2:0 "#G Buy Sails of the Divided Fleet#! - 120 Gold"
 omni_library_scrolls.read.scroll_arteon_poetry_2:0 "Read Sails of the Divided Fleet"
 omni_library_scrolls.scroll_arteon_poetry_2.title:0 "Sails of the Divided Fleet"
 omni_library_scrolls.scroll_arteon_poetry_2.tooltip:0 "#T Sails of the Divided Fleet#!\nRarity: Uncommon\nRegional pools: Arteonian and High Elven war texts\n#G Reward#! #T 2% Commerce Tech Research#!"
 omni_library_scrolls.scroll_arteon_poetry_2.text:0 "Sails of the Divided Fleet\n\nA shanty of the elven crews; slow, and sung at the change of watch\n\nWe were one flag in the morning\nand two flags by the spring,\nand the ships that were out at the far stations\ndid not hear about the thing.\n\nThey came in to the old station\nand the old station was still there,\nand the flag on it was a flag they knew\nand the orders were not there.\n\nSo they sat, and they were counted\nby a clerk in a different sea,\nand they went out on the last provision,\nand the fog has them, and me."
 omni_library_scrolls.buy.scroll_arteon_poetry_3:0 "#G Buy The Legacy of Atheus#! - 60 Gold"
 omni_library_scrolls.read.scroll_arteon_poetry_3:0 "Read The Legacy of Atheus"
 omni_library_scrolls.scroll_arteon_poetry_3.title:0 "The Legacy of Atheus"
 omni_library_scrolls.scroll_arteon_poetry_3.tooltip:0 "#T The Legacy of Atheus#!\nRarity: Common\nRegional pools: Arteonian and High Elven war texts\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_arteon_poetry_3.text:0 "The Legacy of Atheus\n\nThe formal ode, prescribed for the schools\n\nGolden the chain and golden every link\nand golden the wrist that the chain was set upon,\nand golden the age, and golden what we think\nthe age was, which is not the same thing, and is gone.\n\nSing it in the fourth form. Do not vary it.\nThe schools have marked this ode for eight hundred years\nand every generation has been made to carry it\nand every generation has arrived at the same tears\nin the same place, at the fourth line, at the word gone,\nwhich the composer put there, and which does the work,\nand which no student has ever been examined on."
 omni_library_scrolls.buy.scroll_arteon_poetry_4:0 "#G Buy The Weeping Forest#! - 240 Gold"
 omni_library_scrolls.read.scroll_arteon_poetry_4:0 "Read The Weeping Forest"
 omni_library_scrolls.scroll_arteon_poetry_4.title:0 "The Weeping Forest"
 omni_library_scrolls.scroll_arteon_poetry_4.tooltip:0 "#T The Weeping Forest#!\nRarity: Rare\nRegional pools: Arteonian and High Elven war texts\n#G Reward#! #T 3% Religious Tech Research#!"
 omni_library_scrolls.scroll_arteon_poetry_4.text:0 "The Weeping Forest\n\nOn the fading of the Eldritch mana; a warden's poem, not a scholar's\n\nIt is not like a fire going out.\nIt is like a body cooling, which is slower,\nand goes from the far parts first, and the centre\nis warm for a long time and tells you nothing.\n\nThe Yaga at the eastern march went first.\nWe did not notice for eleven years.\nWe noticed when a party of men from the low country\nwalked in four miles and walked out again\nand were not turned, and were not frightened,\nand told everyone they knew, which is the wound,\nand not the thinning, which was only weather."
 omni_library_scrolls.buy.scroll_arteon_poetry_5:0 "#G Buy The Slaver's Regret#! - 60 Gold"
 omni_library_scrolls.read.scroll_arteon_poetry_5:0 "Read The Slaver's Regret"
 omni_library_scrolls.scroll_arteon_poetry_5.title:0 "The Slaver's Regret"
 omni_library_scrolls.scroll_arteon_poetry_5.tooltip:0 "#T The Slaver's Regret#!\nRarity: Common\nRegional pools: Arteonian and High Elven war texts\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_arteon_poetry_5.text:0 "The Slaver's Regret\n\nAttributed to a captain; the attribution is doubted, chiefly by captains\n\nThe stars do not object. I have checked nightly.\nThe sea does not object. The sea is paid.\nThe ship is well found and behaves politely\nand the manifest is accurate and made.\n\nThere is a sound below at the third hour\nwhich is not the timbers, though it might be.\nI have gone down twice. It was the timbers.\nI have not gone down since. It might be."
 omni_library_scrolls.buy.scroll_arteon_poetry_6:0 "#G Buy The Crystal Spire#! - 120 Gold"
 omni_library_scrolls.read.scroll_arteon_poetry_6:0 "Read The Crystal Spire"
 omni_library_scrolls.scroll_arteon_poetry_6.title:0 "The Crystal Spire"
 omni_library_scrolls.scroll_arteon_poetry_6.tooltip:0 "#T The Crystal Spire#!\nRarity: Uncommon\nRegional pools: Arteonian and High Elven war texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_arteon_poetry_6.text:0 "The Crystal Spire\n\nAn architectural fantasy; the drawings are exquisite and the specification is not honest\n\nThe city stands on light. This is given in the first plate without support or apology. There is no quarry, no road to a quarry, no provision for a road, and no dwelling anywhere in the eleven plates for anybody who might cut, carry, or lay a single thing.\n\nThe second book addresses drainage, at length, and beautifully, and the drainage is the only system in the whole work that would function. Later readers have found this the most revealing page in the book, the author having been able to imagine waste but not the removal of it by anyone.\n\nIt remains the most reproduced elven design of the age. Every copy sold outside Arteon has, at the request of the buyers, the drainage section omitted."
 omni_library_scrolls.buy.scroll_arteon_poetry_7:0 "#G Buy The Cymevan Departure#! - 240 Gold"
 omni_library_scrolls.read.scroll_arteon_poetry_7:0 "Read The Cymevan Departure"
 omni_library_scrolls.scroll_arteon_poetry_7.title:0 "The Cymevan Departure"
 omni_library_scrolls.scroll_arteon_poetry_7.tooltip:0 "#T The Cymevan Departure#!\nRarity: Rare\nRegional pools: Arteonian and High Elven war texts\n#G Reward#! #T 2% Commerce Tech Research#!"
 omni_library_scrolls.scroll_arteon_poetry_7.text:0 "The Cymevan Departure\n\nAn epic of the sailing; composed at home, from the quay, by someone who did not go\n\nSilver, and loosed, and the string still going,\nand the harbour mouth full of them, and the light\ncoming off the wet oars all together,\nand the whole city up on the eastern wall.\n\nI have been told since, by a man who was aboard,\nthat it smelled of tar and of sick and of the tallow\nthey use on the ropes, and that the third ship fouled\nthe fourth in the roads and they were an hour clearing,\nand that nobody on any deck looked back at the wall\nbecause they were working, which is what a departure is.\n\nI have not altered the poem. He did not ask me to."
 omni_library_scrolls.buy.scroll_arteon_poetry_8:0 "#G Buy The Shattered Crown#! - 60 Gold"
 omni_library_scrolls.read.scroll_arteon_poetry_8:0 "Read The Shattered Crown"
 omni_library_scrolls.scroll_arteon_poetry_8.title:0 "The Shattered Crown"
 omni_library_scrolls.scroll_arteon_poetry_8.tooltip:0 "#T The Shattered Crown#!\nRarity: Common\nRegional pools: Arteonian and High Elven war texts\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_arteon_poetry_8.text:0 "The Shattered Crown\n\nA war-piece of the civil years; the metre is deliberately harsh and was criticised for it\n\nHew, and the man you hew has the same name.\nHew, and the shield you split you helped to make.\nHew, and the house behind him is your house,\nand the claim behind him is the other claim.\n\nThere is no verse in this. I have removed it.\nThe subject would not carry it and broke.\nRead it as it is written, which is badly,\nby a survivor, in the year he woke."
 omni_library_scrolls.buy.scroll_arteon_poetry_9:0 "#G Buy Echoes in the Ports#! - 120 Gold"
 omni_library_scrolls.read.scroll_arteon_poetry_9:0 "Read Echoes in the Ports"
 omni_library_scrolls.scroll_arteon_poetry_9.title:0 "Echoes in the Ports"
 omni_library_scrolls.scroll_arteon_poetry_9.tooltip:0 "#T Echoes in the Ports#!\nRarity: Uncommon\nRegional pools: Arteonian and High Elven war texts\n#G Reward#! #T 1% Commerce Tech Research#!"
 omni_library_scrolls.scroll_arteon_poetry_9.text:0 "Echoes in the Ports\n\nA sensory piece; the fourth section has been removed from most printed copies\n\nCoin, and coin, and the particular ring\nof coin being counted twice by the same hand;\nthe crane, the gull, the parrot from the south\nthat has learned the crane and does it very well.\n\nAnd under all of it, continuous,\nthe sound this poem is not going to name,\nwhich the fourth section named, and which the presses\nhave for two hundred years declined to set,\nso that the port in the poem is now merely lively,\nand sells, and is recited to visitors, and is a lie\nthe author did not write and cannot now withdraw."
 omni_library_scrolls.buy.scroll_arteon_poetry_10:0 "#G Buy The Frozen Ward#! - 60 Gold"
 omni_library_scrolls.read.scroll_arteon_poetry_10:0 "Read The Frozen Ward"
 omni_library_scrolls.scroll_arteon_poetry_10.title:0 "The Frozen Ward"
 omni_library_scrolls.scroll_arteon_poetry_10.tooltip:0 "#T The Frozen Ward#!\nRarity: Common\nRegional pools: Arteonian and High Elven war texts\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_arteon_poetry_10.text:0 "The Frozen Ward\n\nOn the wards of the civil war, by one who kept one\n\nIt is not cold to stand in. That is the trick of it.\nIt is cold to hold. The holding is the cost,\nand the cost is not taken from the ward\nbut from the one who is being the wall.\n\nEleven of us kept the eastern line.\nFour are alive. Of these, two do not speak,\nand one speaks constantly, and one is fine,\nand the ward stood the entire war, and did not leak."
 omni_library_scrolls.buy.scroll_horteon_poetry_1:0 "#G Buy The Mountain's Embrace#! - 60 Gold"
 omni_library_scrolls.read.scroll_horteon_poetry_1:0 "Read The Mountain's Embrace"
 omni_library_scrolls.scroll_horteon_poetry_1.title:0 "The Mountain's Embrace"
 omni_library_scrolls.scroll_horteon_poetry_1.tooltip:0 "#T The Mountain's Embrace#!\nRarity: Common\nRegional pools: Horteonian, gnomish, and northern texts\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_horteon_poetry_1.text:0 "The Mountain's Embrace\n\nA drinking piece of the coalition years; both allies claim to have written it\n\nBig and small and big and small,\nthat is an avalanche, that is all.\nThe boulder does nothing without the scree.\nThe scree does nothing. Ask the scree.\n\nDown it comes and it comes as one\nand nobody asks which stone begun,\nand the valley does not count the stones,\nand the valley is where they keep their bones."
 omni_library_scrolls.buy.scroll_horteon_poetry_2:0 "#G Buy The Broken Elven Shields#! - 120 Gold"
 omni_library_scrolls.read.scroll_horteon_poetry_2:0 "Read The Broken Elven Shields"
 omni_library_scrolls.scroll_horteon_poetry_2.title:0 "The Broken Elven Shields"
 omni_library_scrolls.scroll_horteon_poetry_2.tooltip:0 "#T The Broken Elven Shields#!\nRarity: Uncommon\nRegional pools: Horteonian, gnomish, and northern texts\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_horteon_poetry_2.text:0 "The Broken Elven Shields\n\nA victory ballad of the Fourth War; the mockery is not incidental\n\nThey came up the pass in a beautiful order\nwith the ranks correct and the spacing exact,\nand the spacing was exact for the open ground,\nand there was no open ground, and they kept the spacing.\n\nWe did nothing clever. We had a hill\nand a great deal of loose rock and some patient friends.\nAnd their line held, which is to say it did not break,\nwhich is to say it stayed exactly where it was\nwhile the hill came down on it in good order also.\nSing it slowly. They would have wanted it slow."
 omni_library_scrolls.buy.scroll_horteon_poetry_3:0 "#G Buy The Weakened Yaga Trees#! - 60 Gold"
 omni_library_scrolls.read.scroll_horteon_poetry_3:0 "Read The Weakened Yaga Trees"
 omni_library_scrolls.scroll_horteon_poetry_3.title:0 "The Weakened Yaga Trees"
 omni_library_scrolls.scroll_horteon_poetry_3.tooltip:0 "#T The Weakened Yaga Trees#!\nRarity: Common\nRegional pools: Horteonian, gnomish, and northern texts\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_horteon_poetry_3.text:0 "The Weakened Yaga Trees\n\nA frontier verse; the elven houses have asked for it to be withdrawn\n\nThey are grieving the magic. Let them grieve.\nIt is their magic and it is theirs to lose.\nWe are counting the timber, which is not a crime,\nand the timber does not care who is bereaved.\n\nFour hundred years we could not take a stick.\nNow we can take a stick. That is the poem.\nIt is not deep. It was not meant to be.\nDeep poems are written by people with a wood."
 omni_library_scrolls.buy.scroll_horteon_poetry_4:0 "#G Buy The Gnomish Engine#! - 240 Gold"
 omni_library_scrolls.read.scroll_horteon_poetry_4:0 "Read The Gnomish Engine"
 omni_library_scrolls.scroll_horteon_poetry_4.title:0 "The Gnomish Engine"
 omni_library_scrolls.scroll_horteon_poetry_4.tooltip:0 "#T The Gnomish Engine#!\nRarity: Rare\nRegional pools: Horteonian, gnomish, and northern texts\n#G Reward#! #T 3% Civic Tech Research#!"
 omni_library_scrolls.scroll_horteon_poetry_4.text:0 "The Gnomish Engine\n\nComposed to the rhythm of the works at Hallow Deep; the gnomes consider it flattering and slightly slow\n\nClick and the tooth takes. Click and the tooth takes.\nMagic goes off. A gear does not go off.\nMagic wants a man in it. A gear wants grease.\nClick and the tooth takes. Click and the tooth takes.\n\nThey put a spell against our ram in the ninth month\nand it was a very fine spell and it held four days\nand the ram was not tired on the fifth,\nand this is the whole of the war in one line,\nand it took our small allies nine years to build the line\nand nobody has written a poem about the nine years."
 omni_library_scrolls.buy.scroll_horteon_poetry_5:0 "#G Buy Frost on the Armor#! - 60 Gold"
 omni_library_scrolls.read.scroll_horteon_poetry_5:0 "Read Frost on the Armor"
 omni_library_scrolls.scroll_horteon_poetry_5.title:0 "Frost on the Armor"
 omni_library_scrolls.scroll_horteon_poetry_5.tooltip:0 "#T Frost on the Armor#!\nRarity: Common\nRegional pools: Horteonian, gnomish, and northern texts\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_horteon_poetry_5.text:0 "Frost on the Armor\n\nA holding-poem of the northern line\n\nThe elves are two miles off and are the second problem.\nThe first problem is that if I sit down I will sit down.\nThe second is the mail, which takes the cold\nand keeps it, and gives it back all night, and is my own.\n\nWe were issued the wool in the eleventh month.\nThe eleventh month is when the cold is over.\nSomebody in a warm room has a chart\nand the chart is correct and the chart is not up here."
 omni_library_scrolls.buy.scroll_horteon_poetry_6:0 "#G Buy The Polarian Light#! - 120 Gold"
 omni_library_scrolls.read.scroll_horteon_poetry_6:0 "Read The Polarian Light"
 omni_library_scrolls.scroll_horteon_poetry_6.title:0 "The Polarian Light"
 omni_library_scrolls.scroll_horteon_poetry_6.tooltip:0 "#T The Polarian Light#!\nRarity: Uncommon\nRegional pools: Horteonian, gnomish, and northern texts\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_horteon_poetry_6.text:0 "The Polarian Light\n\nA northern mystic verse; the Polarians themselves attribute the lights to something else entirely\n\nThat is Aginaric, who fell at the second ford,\nand that green one going over is his brother.\nI am aware of what the mages say.\nThe mages have not stood a watch up here.\n\nNobody sees the dead in a warm country.\nThis is offered as an argument against us\nand I offer it back. In a warm country\nthere is a great deal else to look at\nand the sky is only weather, and is ignored,\nand nobody has to make the night mean anything."
 omni_library_scrolls.buy.scroll_horteon_poetry_7:0 "#G Buy The Eastern Retreat#! - 240 Gold"
 omni_library_scrolls.read.scroll_horteon_poetry_7:0 "Read The Eastern Retreat"
 omni_library_scrolls.scroll_horteon_poetry_7.title:0 "The Eastern Retreat"
 omni_library_scrolls.scroll_horteon_poetry_7.tooltip:0 "#T The Eastern Retreat#!\nRarity: Rare\nRegional pools: Horteonian, gnomish, and northern texts\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_horteon_poetry_7.text:0 "The Eastern Retreat\n\nA sober piece, written after the peace of 160 LC, and unpopular for a generation\n\nWe won it. Set that down before the rest.\nWe won the west and we hold what we won.\nAnd in the east there is a line of stones\nand nobody has gone past it since, and could.\n\nThat is the thing I want the young to have.\nNot the defeat, which was not a defeat,\nbut the moment on the fourth day when we saw\nthat we had gone one valley past the friends,\none valley past the ground we understood,\nand that the mountains had run out behind us,\nand that everything after that was somebody else's country."
 omni_library_scrolls.buy.scroll_horteon_poetry_8:0 "#G Buy The Anvil and the Storm#! - 60 Gold"
 omni_library_scrolls.read.scroll_horteon_poetry_8:0 "Read The Anvil and the Storm"
 omni_library_scrolls.scroll_horteon_poetry_8.title:0 "The Anvil and the Storm"
 omni_library_scrolls.scroll_horteon_poetry_8.tooltip:0 "#T The Anvil and the Storm#!\nRarity: Common\nRegional pools: Horteonian, gnomish, and northern texts\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_horteon_poetry_8.text:0 "The Anvil and the Storm\n\nA forge song of Horteon; sung on the beat, and the beat is not negotiable\n\nWind on the peak and the wind is in the fire,\nwind in the fire and the fire is in the bar,\nbar on the anvil and the anvil takes it higher,\nthat is why the northern steel is hard.\n\nThe smiths of the low country say this is not so\nand that the wind does nothing to the heat.\nWe have not sent an answer down below.\nWe send the blades down. They have not sent them back."
 omni_library_scrolls.buy.scroll_horteon_poetry_9:0 "#G Buy Echoes of Atheus#! - 120 Gold"
 omni_library_scrolls.read.scroll_horteon_poetry_9:0 "Read Echoes of Atheus"
 omni_library_scrolls.scroll_horteon_poetry_9.title:0 "Echoes of Atheus"
 omni_library_scrolls.scroll_horteon_poetry_9.tooltip:0 "#T Echoes of Atheus#!\nRarity: Uncommon\nRegional pools: Horteonian, gnomish, and northern texts\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_horteon_poetry_9.text:0 "Echoes of Atheus\n\nA defiance, addressed to a legacy rather than to anybody living\n\nGolden, they say. We have heard the ode.\nIt is a good ode. We have it here in the north\nin a bad translation that improves it,\nsince ours has no word that means chain and means honour.\n\nWe had to use two words. It ruins the line.\nIt also ruins the argument, which is the point.\nRead it in ours and the whole thing falls apart\nand a golden chain is a chain, and is golden,\nand a wrist is a wrist, and we have not got one on,\nand the fourth line does not make anybody cry."
 omni_library_scrolls.buy.scroll_horteon_poetry_10:0 "#G Buy The Stone's Patience#! - 60 Gold"
 omni_library_scrolls.read.scroll_horteon_poetry_10:0 "Read The Stone's Patience"
 omni_library_scrolls.scroll_horteon_poetry_10.title:0 "The Stone's Patience"
 omni_library_scrolls.scroll_horteon_poetry_10.tooltip:0 "#T The Stone's Patience#!\nRarity: Common\nRegional pools: Horteonian, gnomish, and northern texts\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_horteon_poetry_10.text:0 "The Stone's Patience\n\nFour lines, set at the entrance of the war-school at Horteon\n\nIt does not sally. It has never sallied.\nIt lets the weather do the whole of the work.\nIn ninety years the weather has not taken it\nand in ninety years it has not moved an inch."
 omni_library_scrolls.buy.scroll_polarian_poetry_1:0 "#G Buy The Taanka Illusions#! - 60 Gold"
 omni_library_scrolls.read.scroll_polarian_poetry_1:0 "Read The Taanka Illusions"
 omni_library_scrolls.scroll_polarian_poetry_1.title:0 "The Taanka Illusions"
 omni_library_scrolls.scroll_polarian_poetry_1.tooltip:0 "#T The Taanka Illusions#!\nRarity: Common\nRegional pools: Polarian and projection magic texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_polarian_poetry_1.text:0 "The Taanka Illusions\n\nMnemonics for the first year; recited before every exercise and by nobody afterwards\n\nCold air is honest air. It holds the line.\nWarm air will bend your image at the knee.\nNever project across a fire. Never project\nacross a fire. Never project across a fire.\n\nLight from the left and the shadow from the left.\nThe eye forgives the colour, not the shade.\nIf it looks wrong and you cannot say why,\nit is the shadow. It is always the shadow.\nIt was the shadow the last time. It is the shadow."
 omni_library_scrolls.buy.scroll_polarian_poetry_2:0 "#G Buy Mirrors of Jemskoo#! - 120 Gold"
 omni_library_scrolls.read.scroll_polarian_poetry_2:0 "Read Mirrors of Jemskoo"
 omni_library_scrolls.scroll_polarian_poetry_2.title:0 "Mirrors of Jemskoo"
 omni_library_scrolls.scroll_polarian_poetry_2.tooltip:0 "#T Mirrors of Jemskoo#!\nRarity: Uncommon\nRegional pools: Polarian and projection magic texts\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_polarian_poetry_2.text:0 "Mirrors of Jemskoo\n\nA traveller's account in verse; the School has never confirmed that Jemskoo exists\n\nEvery wall in it is showing you a year.\nNot this year. One of the ones you did not take.\nThe bakery on the left has your daughter in it\nand you have no daughter, and she has your mother's hands.\n\nThe rule is: do not stop walking.\nEverybody is told the rule before they go in\nand everybody is told it by somebody\nwho stopped walking, and came out, and is not right,\nand who tells you the rule extremely well,\nand at length, and again, and at length."
 omni_library_scrolls.buy.scroll_polarian_poetry_3:0 "#G Buy The Northern Trade#! - 60 Gold"
 omni_library_scrolls.read.scroll_polarian_poetry_3:0 "Read The Northern Trade"
 omni_library_scrolls.scroll_polarian_poetry_3.title:0 "The Northern Trade"
 omni_library_scrolls.scroll_polarian_poetry_3.tooltip:0 "#T The Northern Trade#!\nRarity: Common\nRegional pools: Polarian and projection magic texts\n#G Reward#! #T 1% Commerce Tech Research#!"
 omni_library_scrolls.scroll_polarian_poetry_3.text:0 "The Northern Trade\n\nA merchants' chant; the third and eleventh verses are the ones that matter\n\nSing the black rock at the second sound,\nsing it double if the ice is down,\nleft of the black rock is a bay and a beach,\nright of the black rock nothing is in reach.\n\nSing the low island where the water goes thin,\ncount to a hundred before you go in,\nif you have not counted, do not go in,\nsing it again. Sing it again. Sing it again."
 omni_library_scrolls.buy.scroll_polarian_poetry_4:0 "#G Buy The Distance Bridged#! - 240 Gold"
 omni_library_scrolls.read.scroll_polarian_poetry_4:0 "Read The Distance Bridged"
 omni_library_scrolls.scroll_polarian_poetry_4.title:0 "The Distance Bridged"
 omni_library_scrolls.scroll_polarian_poetry_4.tooltip:0 "#T The Distance Bridged#!\nRarity: Rare\nRegional pools: Polarian and projection magic texts\n#G Reward#! #T 3% Civic Tech Research#!"
 omni_library_scrolls.scroll_polarian_poetry_4.text:0 "The Distance Bridged\n\nA civic epic of the Taanka School; the third book is the one that is read\n\nMy mother is nine days away by sled\nand is in this room, at the size she has always been,\nand the snow is going through her, which she cannot feel,\nand she is telling me about a goat.\n\nIt is not her. I know it is not her.\nIt is light that has been argued into a shape\nby a woman in the next valley, for a fee.\nI have paid the fee for eleven years.\nI would pay it if the goat were the only subject\nand some winters the goat has been the only subject."
 omni_library_scrolls.buy.scroll_polarian_poetry_5:0 "#G Buy The False Sun#! - 60 Gold"
 omni_library_scrolls.read.scroll_polarian_poetry_5:0 "Read The False Sun"
 omni_library_scrolls.scroll_polarian_poetry_5.title:0 "The False Sun"
 omni_library_scrolls.scroll_polarian_poetry_5.tooltip:0 "#T The False Sun#!\nRarity: Common\nRegional pools: Polarian and projection magic texts\n#G Reward#! #T 1% Religious Tech Research#!"
 omni_library_scrolls.scroll_polarian_poetry_5.text:0 "The False Sun\n\nA cautionary tale of the School; told to every intake, with the name removed\n\nHe did the arithmetic and the arithmetic was right.\nThat is the part they leave out when they tell it.\nThe ice would have gone. The bay would have opened.\nThe figures are in the vault and they have been checked.\n\nWhat he had not done was ask what it would be like\nto stand under a thing that gives light and no heat\nfor a hundred and forty days without a night,\nand neither had anyone else, and now we know,\nand the record of what we know is quite short,\nand is in his hand, and stops in the middle of a word."
 omni_library_scrolls.buy.scroll_polarian_poetry_6:0 "#G Buy Whispers in the Aurora#! - 120 Gold"
 omni_library_scrolls.read.scroll_polarian_poetry_6:0 "Read Whispers in the Aurora"
 omni_library_scrolls.scroll_polarian_poetry_6.title:0 "Whispers in the Aurora"
 omni_library_scrolls.scroll_polarian_poetry_6.tooltip:0 "#T Whispers in the Aurora#!\nRarity: Uncommon\nRegional pools: Polarian and projection magic texts\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_polarian_poetry_6.text:0 "Whispers in the Aurora\n\nA minority doctrine; the School permits its printing and does not endorse it\n\nConsider the size. Consider that it is silent.\nConsider that it moves the way a working moves,\nin sheets, from the source, and not the way a fire moves,\nand that no one has explained the second point.\n\nI do not say there is something under the ice.\nI say that what is up there has the shape\nof somebody's work, done very large and slowly,\nand that we do work of the same shape and much smaller,\nand that my colleagues laugh at this indoors\nand have never once contradicted me outside."
 omni_library_scrolls.buy.scroll_polarian_poetry_7:0 "#G Buy The Phantom Fleet#! - 240 Gold"
 omni_library_scrolls.read.scroll_polarian_poetry_7:0 "Read The Phantom Fleet"
 omni_library_scrolls.scroll_polarian_poetry_7.title:0 "The Phantom Fleet"
 omni_library_scrolls.scroll_polarian_poetry_7.tooltip:0 "#T The Phantom Fleet#!\nRarity: Rare\nRegional pools: Polarian and projection magic texts\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_polarian_poetry_7.text:0 "The Phantom Fleet\n\nA treatise in verse on the projection of armaments; kept in the closed press\n\nEleven hulls, and none of them need float,\nand the eleventh a little out of true,\nsince a fleet that is perfect is a fleet a man will doubt\nand a fleet with a straggler is a fleet he has seen before.\n\nShow it at dusk and show it at the range\nwhere a glass is useless and a fear is not.\nDo not show men on deck. Men are the thing\nthat gives it away, men being hard, and known.\n\nThe final instruction is repeated in the margin of every copy: it works once against a given captain. Twice against a given coast. It has never worked three times, and the School records the name of the last officer who tried it three times, in the interest of completeness."
 omni_library_scrolls.buy.scroll_polarian_poetry_8:0 "#G Buy The Cold Scholar#! - 60 Gold"
 omni_library_scrolls.read.scroll_polarian_poetry_8:0 "Read The Cold Scholar"
 omni_library_scrolls.scroll_polarian_poetry_8.title:0 "The Cold Scholar"
 omni_library_scrolls.scroll_polarian_poetry_8.tooltip:0 "#T The Cold Scholar#!\nRarity: Common\nRegional pools: Polarian and projection magic texts\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_polarian_poetry_8.text:0 "The Cold Scholar\n\nA complaint, in the students' manner\n\nThe ink froze. I have written this in the fire ash\non the back of a lesson I did not understand\nand the lesson was on the transmission of heat\nand I have marked the irony myself, in ash,\nfor the examiner, who will not find it funny.\n\nThree of us share a lamp and two of us are honest.\nThe library is warmest at the top and the top\nis where they keep the books nobody wants,\nso I am now the leading authority in this School\non the ninth-century mercantile customs of a bay\nthat silted up, and I am the only one warm."
 omni_library_scrolls.buy.scroll_polarian_poetry_9:0 "#G Buy The Magonis Panic#! - 120 Gold"
 omni_library_scrolls.read.scroll_polarian_poetry_9:0 "Read The Magonis Panic"
 omni_library_scrolls.scroll_polarian_poetry_9.title:0 "The Magonis Panic"
 omni_library_scrolls.scroll_polarian_poetry_9.tooltip:0 "#T The Magonis Panic#!\nRarity: Uncommon\nRegional pools: Polarian and projection magic texts\n#G Reward#! #T 2% Oratory Tech Research#!"
 omni_library_scrolls.scroll_polarian_poetry_9.text:0 "The Magonis Panic\n\nA satire on the southern bans; circulated in the north and, apparently, well south of it\n\nThey banned it in the year of the great fright\nand made it death, and made it death for teaching,\nand made it death for having it in the house,\nand solved the whole thing, and are still afraid.\n\nUp here we could not ban it. It was load-bearing.\nThe post goes by projection. So does the census.\nSo did the warning about the ice in 804\nthat every soul in the eastern settlements read\nand acted on, and lived. We are barbarians.\nWe have this on excellent authority from the south,\nwhich lost a city to a well, and blames the well."
 omni_library_scrolls.buy.scroll_polarian_poetry_10:0 "#G Buy The Ice Sculptor's Secret#! - 60 Gold"
 omni_library_scrolls.read.scroll_polarian_poetry_10:0 "Read The Ice Sculptor's Secret"
 omni_library_scrolls.scroll_polarian_poetry_10.title:0 "The Ice Sculptor's Secret"
 omni_library_scrolls.scroll_polarian_poetry_10.tooltip:0 "#T The Ice Sculptor's Secret#!\nRarity: Common\nRegional pools: Polarian and projection magic texts\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_polarian_poetry_10.text:0 "The Ice Sculptor's Secret\n\nOn the making of the burning-lens; a craft poem, and a working instruction\n\nThin, and thinner, and thinner than you think,\nand the fault is always that you stopped too soon.\nWork it with the flat of the warm hand\nand not the tool, at the end. The tool has edges.\n\nHold it a hand above the tinder. Wait.\nThe sun in the third month up here is nothing,\nis a rumour, is a paleness on the snow,\nand will light a fire through four fingers of water\nif somebody is patient and has knelt\nin the cold for the hour it takes, and not moved the hand."
 omni_library_scrolls.buy.scroll_drow_north_poetry_1:0 "#G Buy The Caves of Ridonnorr#! - 60 Gold"
 omni_library_scrolls.read.scroll_drow_north_poetry_1:0 "Read The Caves of Ridonnorr"
 omni_library_scrolls.scroll_drow_north_poetry_1.title:0 "The Caves of Ridonnorr"
 omni_library_scrolls.scroll_drow_north_poetry_1.tooltip:0 "#T The Caves of Ridonnorr#!\nRarity: Common\nRegional pools: Northern anti-Drow and Drow war texts\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_drow_north_poetry_1.text:0 "The Caves of Ridonnorr\n\nA march-poem of the Svarddeni; the beat is the pace of a laden man on a slope\n\nDown, and the light is behind us, down,\nand the man in front is the light now, down,\ncount him, and count the man behind,\nand if the count is wrong do not turn round.\n\nDown, and the saint is at the front of it, down,\nand the saint is a man and is also afraid, down,\nand that is the thing that got the six tribes in\nand not the light, and not the sermon. Down."
 omni_library_scrolls.buy.scroll_drow_north_poetry_2:0 "#G Buy Shadows of the Svarddeni#! - 120 Gold"
 omni_library_scrolls.read.scroll_drow_north_poetry_2:0 "Read Shadows of the Svarddeni"
 omni_library_scrolls.scroll_drow_north_poetry_2.title:0 "Shadows of the Svarddeni"
 omni_library_scrolls.scroll_drow_north_poetry_2.tooltip:0 "#T Shadows of the Svarddeni#!\nRarity: Uncommon\nRegional pools: Northern anti-Drow and Drow war texts\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_drow_north_poetry_2.text:0 "Shadows of the Svarddeni\n\nA watch-poem; the tone is not accidental\n\nIt has been quiet for nine years.\nThat is a number I do not like.\nThe last nine-year quiet was followed by the thing\nmy grandmother would not describe and would not forget.\n\nA shadow at noon is a small thing and is nothing.\nA shadow at the sixth hour is the same shadow\nand is nine times the length and is the same shadow,\nand nobody was alarmed at noon, and should have been."
 omni_library_scrolls.buy.scroll_drow_north_poetry_3:0 "#G Buy The Fall of Dalskiaengd#! - 60 Gold"
 omni_library_scrolls.read.scroll_drow_north_poetry_3:0 "Read The Fall of Dalskiaengd"
 omni_library_scrolls.scroll_drow_north_poetry_3.title:0 "The Fall of Dalskiaengd"
 omni_library_scrolls.scroll_drow_north_poetry_3.tooltip:0 "#T The Fall of Dalskiaengd#!\nRarity: Common\nRegional pools: Northern anti-Drow and Drow war texts\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_drow_north_poetry_3.text:0 "The Fall of Dalskiaengd\n\nA lament of 993 LC; the criticism in the third stanza was not well received\n\nNineteen days to assemble it. Nineteen.\nAnd four of those were spent upon the order\nin which the banners should be seen to come,\nwhich was resolved, and which was resolved well.\n\nThe left was given to a house with a claim.\nThe centre to a house with a better claim.\nThe right was given to a man who had done it before\nand the right, alone of the three, came off the field.\n\nI am told this is unhelpful and divisive.\nI am told it is the wrong year to say so.\nIt is always the wrong year. There is a list\nof the wrong years, and it is every year, and it is long."
 omni_library_scrolls.buy.scroll_drow_north_poetry_4:0 "#G Buy The Waiting Dark#! - 240 Gold"
 omni_library_scrolls.read.scroll_drow_north_poetry_4:0 "Read The Waiting Dark"
 omni_library_scrolls.scroll_drow_north_poetry_4.title:0 "The Waiting Dark"
 omni_library_scrolls.scroll_drow_north_poetry_4.tooltip:0 "#T The Waiting Dark#!\nRarity: Rare\nRegional pools: Northern anti-Drow and Drow war texts\n#G Reward#! #T 3% Martial Tech Research#!"
 omni_library_scrolls.scroll_drow_north_poetry_4.text:0 "The Waiting Dark\n\nAttributed, in the northern houses, to a Drow scout; the attribution is convenient and may be false\n\nI have watched the third farm for two hundred years.\nThe man is the fourth man. He is like the second.\nHe does not look at the hill. His father looked at the hill.\nHis grandfather built the tower that he keeps his grain in.\n\nThat is all it takes. Not a defeat.\nNot a betrayal, not a broken watch.\nThree generations and a good harvest\nand the tower has grain in it, and the hill is scenery,\nand I am extremely patient, and I am not tired,\nand the fifth man will be born next spring."
 omni_library_scrolls.buy.scroll_drow_north_poetry_5:0 "#G Buy The Watcher's Fire#! - 60 Gold"
 omni_library_scrolls.read.scroll_drow_north_poetry_5:0 "Read The Watcher's Fire"
 omni_library_scrolls.scroll_drow_north_poetry_5.title:0 "The Watcher's Fire"
 omni_library_scrolls.scroll_drow_north_poetry_5.tooltip:0 "#T The Watcher's Fire#!\nRarity: Common\nRegional pools: Northern anti-Drow and Drow war texts\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_drow_north_poetry_5.text:0 "The Watcher's Fire\n\nA comfort-verse of the frontier posts; deliberately small\n\nIt is this big. You can put your hands round it.\nIt does not reach the trees and does not try.\nIt will go out at the fourth hour and be lit again\nand has been lit again for ninety years.\n\nI am not saying that it keeps them off.\nThe wall keeps them off. The wall and the men.\nI am saying that at the fourth hour, when it is out,\nsomebody has to get up, and does, and that is the thing."
 omni_library_scrolls.buy.scroll_drow_north_poetry_6:0 "#G Buy Balthazar's Light#! - 120 Gold"
 omni_library_scrolls.read.scroll_drow_north_poetry_6:0 "Read Balthazar's Light"
 omni_library_scrolls.scroll_drow_north_poetry_6.title:0 "Balthazar's Light"
 omni_library_scrolls.scroll_drow_north_poetry_6.tooltip:0 "#T Balthazar's Light#!\nRarity: Uncommon\nRegional pools: Northern anti-Drow and Drow war texts\n#G Reward#! #T 2% Religious Tech Research#!"
 omni_library_scrolls.scroll_drow_north_poetry_6.text:0 "Balthazar's Light\n\nA devotional hymn; the compiler notes that the soldiers' recension has three fewer miracles\n\nLight that went down into the dark with him,\nlight that was not a lamp and was not brought,\nlight that the deep things could not look upon\nand fled from, into the caves, and did not come out.\n\n(The soldiers' recension has, in place of the second stanza:) and the sixth tribe came up on the left at dawn, which had been agreed the night before, and held.\n\nThe houses that print both versions place them on the same page. The houses that print one do not, as a rule, mention the other."
 omni_library_scrolls.buy.scroll_drow_north_poetry_7:0 "#G Buy The Poisoned Arrow#! - 240 Gold"
 omni_library_scrolls.read.scroll_drow_north_poetry_7:0 "Read The Poisoned Arrow"
 omni_library_scrolls.scroll_drow_north_poetry_7.title:0 "The Poisoned Arrow"
 omni_library_scrolls.scroll_drow_north_poetry_7.tooltip:0 "#T The Poisoned Arrow#!\nRarity: Rare\nRegional pools: Northern anti-Drow and Drow war texts\n#G Reward#! #T 2% Martial Tech Research#!"
 omni_library_scrolls.scroll_drow_north_poetry_7.text:0 "The Poisoned Arrow\n\nAn analysis of Drow armaments; the admiration is unwilling and is not concealed\n\nThe fletching is bound in three places where ours is bound in two, and the third binding does nothing for flight. It exists so that the shaft will not spin loose from the head when the head is pulled. This is a design decision made by somebody who thought about what happens after.\n\nThe toxin is discussed in the fourth section, which the surgeons contributed and which is not pleasant. It is worth noting only that it is not the strongest they have. It is the one that leaves a man alive and carried, because a man carried costs a line four men and a corpse costs it none.\n\nThe whole of this scroll may be summarised as follows, and the summary is why frontier officers buy it. Everything they make is beautiful, and every beautiful part of it is doing a second job that we did not think of."
 omni_library_scrolls.buy.scroll_drow_north_poetry_8:0 "#G Buy The Broken Order#! - 60 Gold"
 omni_library_scrolls.read.scroll_drow_north_poetry_8:0 "Read The Broken Order"
 omni_library_scrolls.scroll_drow_north_poetry_8.title:0 "The Broken Order"
 omni_library_scrolls.scroll_drow_north_poetry_8.tooltip:0 "#T The Broken Order#!\nRarity: Common\nRegional pools: Northern anti-Drow and Drow war texts\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_drow_north_poetry_8.text:0 "The Broken Order\n\nA critical verse on the northern military orders; published anonymously, and the anonymity was necessary\n\nThe chapter house is full. The stalls are full.\nThe names above the stalls are excellent names.\nOf the eleven knights who sit in them\nnine have not been past the second gate.\n\nThis is not cowardice. I will not have it called so.\nIt is that we have spent four generations\nfighting a war we describe as nearly over\nwith men we describe as nearly enough,\nand the describing has been done extremely well,\nand the second gate is where the describing stops."
 omni_library_scrolls.buy.scroll_drow_north_poetry_9:0 "#G Buy Echoes in the Tunnels#! - 120 Gold"
 omni_library_scrolls.read.scroll_drow_north_poetry_9:0 "Read Echoes in the Tunnels"
 omni_library_scrolls.scroll_drow_north_poetry_9.title:0 "Echoes in the Tunnels"
 omni_library_scrolls.scroll_drow_north_poetry_9.tooltip:0 "#T Echoes in the Tunnels#!\nRarity: Uncommon\nRegional pools: Northern anti-Drow and Drow war texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_drow_north_poetry_9.text:0 "Echoes in the Tunnels\n\nOn fighting below ground; written by a man who did, and did not go back\n\nA dropped blade is eleven blades and none of them are where you are.\nA man calling his brother's name is four men calling,\nand one of the four is behind you and is not there,\nand you will turn, and everyone turns, and that is the tactic.\n\nAbove ground a sound tells you where a thing is.\nBelow ground a sound tells you that there is a thing.\nThat is the whole difference and it is enough\nto lose a company in a corridor eleven feet wide."
 omni_library_scrolls.buy.scroll_drow_north_poetry_10:0 "#G Buy The Surface Promise#! - 60 Gold"
 omni_library_scrolls.read.scroll_drow_north_poetry_10:0 "Read The Surface Promise"
 omni_library_scrolls.scroll_drow_north_poetry_10.title:0 "The Surface Promise"
 omni_library_scrolls.scroll_drow_north_poetry_10.tooltip:0 "#T The Surface Promise#!\nRarity: Common\nRegional pools: Northern anti-Drow and Drow war texts\n#G Reward#! #T 1% Religious Tech Research#!"
 omni_library_scrolls.scroll_drow_north_poetry_10.text:0 "The Surface Promise\n\nThe northern oath, in its verse form; sworn annually at the frontier posts\n\nNot while we have it. That is all it says.\nNot the retaking, not the going down,\nnot the reconquest and not the last of them.\nOnly: not while we have it. Not the sun.\n\nIt is a small oath and is often mocked\nby southern visitors, who find it modest.\nIt has been sworn each year for two hundred years\nby men who were entirely able to count\nhow much of it had already been given up\nbefore they were born, and who swore the rest."
 omni_library_scrolls.buy.scroll_austropetolian_poetry_1:0 "#G Buy The Ular-Pria Ledger#! - 60 Gold"
 omni_library_scrolls.read.scroll_austropetolian_poetry_1:0 "Read The Ular-Pria Ledger"
 omni_library_scrolls.scroll_austropetolian_poetry_1.title:0 "The Ular-Pria Ledger"
 omni_library_scrolls.scroll_austropetolian_poetry_1.tooltip:0 "#T The Ular-Pria Ledger#!\nRarity: Common\nRegional pools: Austropetolian serpent and sea texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_austropetolian_poetry_1.text:0 "The Ular-Pria Ledger\n\nA memorial in the form of an account; the form was chosen and is the argument\n\nEntry the first: one boat, sound, the boat of Arauarus, and Arauarus.\nEntry the second: one boat, sound, the boat of Tinadans, and not Tinadans.\nEntry the third: no boat, and Alaz, and the two children of Alaz, and a dog.\n\nIt goes on in this manner for nine hundred lines and does not once raise its voice. Later readers have found this unbearable and have said so, which the compilers regard as the poem working.\n\nThe final entry is the compiler herself, with her boat, and its condition, and the note: still counting. There is no other closing line. Several houses have supplied one. All of them have been removed again within a generation."
 omni_library_scrolls.buy.scroll_austropetolian_poetry_2:0 "#G Buy The Serpent's Wake#! - 120 Gold"
 omni_library_scrolls.read.scroll_austropetolian_poetry_2:0 "Read The Serpent's Wake"
 omni_library_scrolls.scroll_austropetolian_poetry_2.title:0 "The Serpent's Wake"
 omni_library_scrolls.scroll_austropetolian_poetry_2.tooltip:0 "#T The Serpent's Wake#!\nRarity: Uncommon\nRegional pools: Austropetolian serpent and sea texts\n#G Reward#! #T 2% Commerce Tech Research#!"
 omni_library_scrolls.scroll_austropetolian_poetry_2.text:0 "The Serpent's Wake\n\nA navigational poem; the winding is not decorative\n\nOut on the ebb and lean to the left of the light,\nleft of the light and the shoal is under the right,\nunder the right there is water for a keel and a hand,\na keel and a hand at the neap and not at the spring.\n\nNot at the spring, when the water is over the bar,\nover the bar you will float and will not come back,\nnot come back, for the current runs under the calm,\nunder the calm, out on the ebb, lean to the left."
 omni_library_scrolls.buy.scroll_austropetolian_poetry_3:0 "#G Buy Seeds of the Storm#! - 60 Gold"
 omni_library_scrolls.read.scroll_austropetolian_poetry_3:0 "Read Seeds of the Storm"
 omni_library_scrolls.scroll_austropetolian_poetry_3.title:0 "Seeds of the Storm"
 omni_library_scrolls.scroll_austropetolian_poetry_3.tooltip:0 "#T Seeds of the Storm#!\nRarity: Common\nRegional pools: Austropetolian serpent and sea texts\n#G Reward#! #T 1% Civic Tech Research#!"
 omni_library_scrolls.scroll_austropetolian_poetry_3.text:0 "Seeds of the Storm\n\nA farming poem of the coast; the most practical work in the tradition\n\nThird week of the eighth month, and not the fourth.\nThe fourth is when it can be done in comfort\nand it has been done in comfort twice in my life\nand once was the year we buried nine.\n\nUp on the poles, and covered, and tied twice,\nand tied twice because you will not be here\nto tie it the second time when the wind takes the first.\nThe grain is the year. The house is not the year.\nThe house can be built by four men in a season.\nThe grain cannot be built at all."
 omni_library_scrolls.buy.scroll_austropetolian_poetry_4:0 "#G Buy The Drowned King#! - 240 Gold"
 omni_library_scrolls.read.scroll_austropetolian_poetry_4:0 "Read The Drowned King"
 omni_library_scrolls.scroll_austropetolian_poetry_4.title:0 "The Drowned King"
 omni_library_scrolls.scroll_austropetolian_poetry_4.tooltip:0 "#T The Drowned King#!\nRarity: Rare\nRegional pools: Austropetolian serpent and sea texts\n#G Reward#! #T 3% Oratory Tech Research#!"
 omni_library_scrolls.scroll_austropetolian_poetry_4.text:0 "The Drowned King\n\nA tragedy of the Collapse; performed rarely and never in a storm season\n\nTHE KING: I have held this coast for forty years.\nTHE STEWARD: You have.\nTHE KING: I have held it against the Zani and the pirates and the fever.\nTHE STEWARD: You have.\nTHE KING: Then bring me down to the water.\nTHE STEWARD: (does not answer)\n\n(He goes down. He speaks the fourth speech, which is the finest in our language and is fifty-one lines long and is not answered by anything. The water is not represented on the stage. There is no effect and no sound. He speaks, and finishes, and remains standing, and the light is taken off him very slowly while he is still standing there, having said everything, correctly, to nothing.)"
 omni_library_scrolls.buy.scroll_austropetolian_poetry_5:0 "#G Buy Songs of the Distant Port#! - 60 Gold"
 omni_library_scrolls.read.scroll_austropetolian_poetry_5:0 "Read Songs of the Distant Port"
 omni_library_scrolls.scroll_austropetolian_poetry_5.title:0 "Songs of the Distant Port"
 omni_library_scrolls.scroll_austropetolian_poetry_5.tooltip:0 "#T Songs of the Distant Port#!\nRarity: Common\nRegional pools: Austropetolian serpent and sea texts\n#G Reward#! #T 1% Commerce Tech Research#!"
 omni_library_scrolls.scroll_austropetolian_poetry_5.text:0 "Songs of the Distant Port\n\nSailors' verses, collected in four foreign harbours\n\nCardamom on the evening wind at the third quay,\nand the wet rope smell, and the other one, the pitch,\nand the woman with the fried thing whose name I never knew\nand who is either dead or is still there at the third quay.\n\nI can do the market. I can do the whole market.\nI can walk you down it stall by stall in the dark.\nAsk me the name of my own street and I will pause,\nwhich the others find funny, and which I find is true."
 omni_library_scrolls.buy.scroll_austropetolian_poetry_6:0 "#G Buy The Coral Architect#! - 120 Gold"
 omni_library_scrolls.read.scroll_austropetolian_poetry_6:0 "Read The Coral Architect"
 omni_library_scrolls.scroll_austropetolian_poetry_6.title:0 "The Coral Architect"
 omni_library_scrolls.scroll_austropetolian_poetry_6.tooltip:0 "#T The Coral Architect#!\nRarity: Uncommon\nRegional pools: Austropetolian serpent and sea texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_austropetolian_poetry_6.text:0 "The Coral Architect\n\nOn the growing of seawalls; a method, in the coastal manner\n\nYou do not build it. That is the first thing and the last thing and the reason the method is not popular with governors, who require a completion date and cannot be given one.\n\nYou set the frames in the fourth month at the depth given in the table and you clear them of weed twice a year and you wait eleven years, and in the eleventh year there is a wall, and it is not a wall you made, and it will mend itself if it is broken, which no wall you made will ever do.\n\nTwo governors have ordered the frames pulled up in the sixth year on the grounds that nothing was happening. The method notes both instances, with dates, and observes that the coast at both places has since been rebuilt twice in stone, at greater cost, and is presently down."
 omni_library_scrolls.buy.scroll_austropetolian_poetry_7:0 "#G Buy The Eptelonian Bargain#! - 240 Gold"
 omni_library_scrolls.read.scroll_austropetolian_poetry_7:0 "Read The Eptelonian Bargain"
 omni_library_scrolls.scroll_austropetolian_poetry_7.title:0 "The Eptelonian Bargain"
 omni_library_scrolls.scroll_austropetolian_poetry_7.tooltip:0 "#T The Eptelonian Bargain#!\nRarity: Rare\nRegional pools: Austropetolian serpent and sea texts\n#G Reward#! #T 2% Commerce Tech Research#!"
 omni_library_scrolls.scroll_austropetolian_poetry_7.text:0 "The Eptelonian Bargain\n\nA negotiation, set down in dialogue by one of the two parties, and therefore reliable in one direction\n\nTHE GOVERNOR: We will take the whole cargo at the price we agreed in the spring.\nTHE MERCHANT: In the spring you had four ships.\nTHE GOVERNOR: I have four ships.\nTHE MERCHANT: You have four ships in the spring.\n\nTHE GOVERNOR: Are you telling me my own fleet?\nTHE MERCHANT: I am telling you the fog at the northern station, which I came through, and you have not had a boat out of it since the ninth month, and I do not think you know how many ships you have.\nTHE GOVERNOR: (after a considerable pause) What is your price.\nTHE MERCHANT: The spring price.\nTHE GOVERNOR: You have just told me it is worth more.\nTHE MERCHANT: I have just told you that I know it is. Next year I will want the harbour."
 omni_library_scrolls.buy.scroll_austropetolian_poetry_8:0 "#G Buy The Silent Fleet#! - 60 Gold"
 omni_library_scrolls.read.scroll_austropetolian_poetry_8:0 "Read The Silent Fleet"
 omni_library_scrolls.scroll_austropetolian_poetry_8.title:0 "The Silent Fleet"
 omni_library_scrolls.scroll_austropetolian_poetry_8.tooltip:0 "#T The Silent Fleet#!\nRarity: Common\nRegional pools: Austropetolian serpent and sea texts\n#G Reward#! #T 1% Martial Tech Research#!"
 omni_library_scrolls.scroll_austropetolian_poetry_8.text:0 "The Silent Fleet\n\nA short piece on the coming of the slavers; the quiet is the whole of the technique\n\nNo drum. That is the thing nobody expects.\nWe had all been told about the drum.\nThey came in on the tide with the sail down\nand the oars muffled and nobody spoke,\nand the first thing that anybody heard\nwas somebody on our side, shouting."
 omni_library_scrolls.buy.scroll_austropetolian_poetry_9:0 "#G Buy Echoes of the High Elves#! - 120 Gold"
 omni_library_scrolls.read.scroll_austropetolian_poetry_9:0 "Read Echoes of the High Elves"
 omni_library_scrolls.scroll_austropetolian_poetry_9.title:0 "Echoes of the High Elves"
 omni_library_scrolls.scroll_austropetolian_poetry_9.tooltip:0 "#T Echoes of the High Elves#!\nRarity: Uncommon\nRegional pools: Austropetolian serpent and sea texts\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_austropetolian_poetry_9.text:0 "Echoes of the High Elves\n\nA critical verse; the criticism is of the scale rather than of the conduct\n\nEight hundred years about a legacy.\nEight hundred. I have written out the number\nbecause it does not look like anything in words\nand looks, in figures, like an error in a book.\n\nIn that time this coast was taken down to the sand\ntwice, by water, which was not arguing,\nand rebuilt twice by people who did not stop\nto establish whose grandfather had been right."
 omni_library_scrolls.buy.scroll_austropetolian_poetry_10:0 "#G Buy The Rebuilt Boat#! - 60 Gold"
 omni_library_scrolls.read.scroll_austropetolian_poetry_10:0 "Read The Rebuilt Boat"
 omni_library_scrolls.scroll_austropetolian_poetry_10.title:0 "The Rebuilt Boat"
 omni_library_scrolls.scroll_austropetolian_poetry_10.tooltip:0 "#T The Rebuilt Boat#!\nRarity: Common\nRegional pools: Austropetolian serpent and sea texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_austropetolian_poetry_10.text:0 "The Rebuilt Boat\n\nA method-poem; recited while doing the thing it describes\n\nTake the keel first. If the keel is good you have a boat\nand everything after this is only work.\nIf the keel is not good, say so now, out loud,\nto somebody else, because you will lie to yourself.\n\nStrakes from the old one where the old one held.\nStrakes from the wreck of your neighbour where it did not.\nNothing in this boat will match. It will not be handsome.\nMy father's boat was seven boats and outlived him,\nand I am in it now, and it is eight."
 omni_library_scrolls.buy.scroll_eptelonian_poetry_1:0 "#G Buy Cymeva's Gamble#! - 60 Gold"
 omni_library_scrolls.read.scroll_eptelonian_poetry_1:0 "Read Cymeva's Gamble"
 omni_library_scrolls.scroll_eptelonian_poetry_1.title:0 "Cymeva's Gamble"
 omni_library_scrolls.scroll_eptelonian_poetry_1.tooltip:0 "#T Cymeva's Gamble#!\nRarity: Common\nRegional pools: Eptelonian and Cymevan colonial texts\n#G Reward#! #T 2% Commerce Tech Research#!"
 omni_library_scrolls.scroll_eptelonian_poetry_1.text:0 "Cymeva's Gamble\n\nA colonial epic; composed on the outward voyage, which the author survived\n\nShe threw it. Set that down as the first line.\nNot planned, not weighed, not counselled, and not held.\nThe court says otherwise and the court was not there\nand the court has a version with a map in it.\n\nEleven ships and a season and a rumour\nof a shore that grows what we have stopped growing.\nIt is a throw. It is a good throw. It may come.\nAnd everybody on this deck knows it is a throw\nand is here because a throw is more than nothing,\nand nothing is what the harbour had this year."
 omni_library_scrolls.buy.scroll_eptelonian_poetry_2:0 "#G Buy The Silver Chain#! - 120 Gold"
 omni_library_scrolls.read.scroll_eptelonian_poetry_2:0 "Read The Silver Chain"
 omni_library_scrolls.scroll_eptelonian_poetry_2.title:0 "The Silver Chain"
 omni_library_scrolls.scroll_eptelonian_poetry_2.tooltip:0 "#T The Silver Chain#!\nRarity: Uncommon\nRegional pools: Eptelonian and Cymevan colonial texts\n#G Reward#! #T 2% Commerce Tech Research#!"
 omni_library_scrolls.scroll_eptelonian_poetry_2.text:0 "The Silver Chain\n\nOn the trade routes; the beauty of the figure is the complaint\n\nIt is a chain and it is silver and it shines\nand every link of it is a lawful bargain\nfreely made by people who required the bargain\nand who would have died without the previous link.\n\nI have looked for the wrong in it for eleven years.\nThere is no wrong in any single link.\nThere is a great deal wrong with the whole of it\nand I cannot show you where, and I have tried,\nand this is the reason it has never once been broken\nand the reason it is the only thing that reaches us."
 omni_library_scrolls.buy.scroll_eptelonian_poetry_3:0 "#G Buy The Abandoned Port#! - 60 Gold"
 omni_library_scrolls.read.scroll_eptelonian_poetry_3:0 "Read The Abandoned Port"
 omni_library_scrolls.scroll_eptelonian_poetry_3.title:0 "The Abandoned Port"
 omni_library_scrolls.scroll_eptelonian_poetry_3.tooltip:0 "#T The Abandoned Port#!\nRarity: Common\nRegional pools: Eptelonian and Cymevan colonial texts\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_eptelonian_poetry_3.text:0 "The Abandoned Port\n\nA lament for the stations lost after the division of the fleet\n\nThe bollards are still there. That is what does it.\nNot the roofs, which have gone the way of roofs.\nThe bollards, which are stone, and which are placed\nat the exact distance a rope wants, and are waiting.\n\nSomebody set those out. Somebody measured.\nSomebody had an argument about the spacing\nwith somebody else, and won it, and was right,\nand the spacing is correct, and has been correct\nand unused for sixty years, and will be correct\nlong after the last person who can read the name."
 omni_library_scrolls.buy.scroll_eptelonian_poetry_4:0 "#G Buy The Native Resistance#! - 240 Gold"
 omni_library_scrolls.read.scroll_eptelonian_poetry_4:0 "Read The Native Resistance"
 omni_library_scrolls.scroll_eptelonian_poetry_4.title:0 "The Native Resistance"
 omni_library_scrolls.scroll_eptelonian_poetry_4.tooltip:0 "#T The Native Resistance#!\nRarity: Rare\nRegional pools: Eptelonian and Cymevan colonial texts\n#G Reward#! #T 3% Martial Tech Research#!"
 omni_library_scrolls.scroll_eptelonian_poetry_4.text:0 "The Native Resistance\n\nAn epic by a colonial governor; his successors have found it embarrassing and have not suppressed it\n\nThey did not mass. I waited a year for them to mass.\nI had the ground for it, I had the guns for it,\nI had a plan of some elegance for it,\nand it is in the third drawer and has never been out.\n\nWhat they did instead was end the fourth road.\nNot cut it. Ended it, at the eleventh mile,\nso that it went nowhere and had cost what it cost,\nand did the same to the fifth road the following spring.\n\nI am obliged to call this cunning in my dispatches.\nIt is not cunning. It is that they live here,\nand a road that goes to nothing is a thing you notice\nonly if you were not the one who wanted it built."
 omni_library_scrolls.buy.scroll_eptelonian_poetry_5:0 "#G Buy Songs of the Spice Route#! - 60 Gold"
 omni_library_scrolls.read.scroll_eptelonian_poetry_5:0 "Read Songs of the Spice Route"
 omni_library_scrolls.scroll_eptelonian_poetry_5.title:0 "Songs of the Spice Route"
 omni_library_scrolls.scroll_eptelonian_poetry_5.tooltip:0 "#T Songs of the Spice Route#!\nRarity: Common\nRegional pools: Eptelonian and Cymevan colonial texts\n#G Reward#! #T 1% Commerce Tech Research#!"
 omni_library_scrolls.scroll_eptelonian_poetry_5.text:0 "Songs of the Spice Route\n\nSensory verses, sent home to a court that had asked for them\n\nNot pepper. You are thinking of pepper and it is not.\nIt is behind the teeth and it arrives late\nand it is warm rather than hot and it is a smell\nas much as it is a taste, which I cannot write.\n\nI have tried nine times and I have sent you nine\nand the ninth is the best and the ninth is still a failure.\nSend me a court poet. Send me a good one.\nHe will fail also, but he will fail expensively,\nand you will believe him, and stop writing to me."
 omni_library_scrolls.buy.scroll_eptelonian_poetry_6:0 "#G Buy The Divided Inheritance#! - 120 Gold"
 omni_library_scrolls.read.scroll_eptelonian_poetry_6:0 "Read The Divided Inheritance"
 omni_library_scrolls.scroll_eptelonian_poetry_6.title:0 "The Divided Inheritance"
 omni_library_scrolls.scroll_eptelonian_poetry_6.tooltip:0 "#T The Divided Inheritance#!\nRarity: Uncommon\nRegional pools: Eptelonian and Cymevan colonial texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_eptelonian_poetry_6.text:0 "The Divided Inheritance\n\nA political poem of the colonies; the bitterness is the argument and is not concealed\n\nThey are not fighting over us. Understand that first.\nWe are not in the quarrel. We are not the prize.\nWe are the thing that was being paid for\nby the money that is now being spent on the quarrel.\n\nCalidriel is in the right. So is Cymeva.\nI have read both cases and both cases are good\nand neither case mentions the eleventh station\nwhich had no salt in the second winter, and was ours,\nand is a word in a ledger now, in the closed column,\nin a hand that did not know what it was closing."
 omni_library_scrolls.buy.scroll_eptelonian_poetry_7:0 "#G Buy The Sea Trade Library#! - 240 Gold"
 omni_library_scrolls.read.scroll_eptelonian_poetry_7:0 "Read The Sea Trade Library"
 omni_library_scrolls.scroll_eptelonian_poetry_7.title:0 "The Sea Trade Library"
 omni_library_scrolls.scroll_eptelonian_poetry_7.tooltip:0 "#T The Sea Trade Library#!\nRarity: Rare\nRegional pools: Eptelonian and Cymevan colonial texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_eptelonian_poetry_7.text:0 "The Sea Trade Library\n\nA fantasy of the colonial houses; costed, in the appendix, and the costing is the joke\n\nA hull of eleven hundred tons, and every ton of it a shelf. The reading room amidships where the cargo would be. The whole knowledge of the outer stations in one bottom, going from station to station, so that a thing learned at the eleventh is known at the fourth by the following season.\n\nThe appendix gives the cost. It is roughly the cost of two warships and slightly less than the cost of the disputes between Calidriel and Cymeva in a single year, and the author has put these three figures in a column, which is the only editorial comment in the work.\n\nNo such vessel has been laid down. The book is nevertheless kept in every trading house on the outer route, which means that the knowledge of the outer stations is in fact distributed by ship, in the form of eleven hundred copies of a book about a ship."
 omni_library_scrolls.buy.scroll_eptelonian_poetry_8:0 "#G Buy The Slaver's Coin#! - 60 Gold"
 omni_library_scrolls.read.scroll_eptelonian_poetry_8:0 "Read The Slaver's Coin"
 omni_library_scrolls.scroll_eptelonian_poetry_8.title:0 "The Slaver's Coin"
 omni_library_scrolls.scroll_eptelonian_poetry_8.tooltip:0 "#T The Slaver's Coin#!\nRarity: Common\nRegional pools: Eptelonian and Cymevan colonial texts\n#G Reward#! #T 1% Commerce Tech Research#!"
 omni_library_scrolls.scroll_eptelonian_poetry_8.text:0 "The Slaver's Coin\n\nA short piece; the scale is the subject\n\nPut it on the left. Now put on the right\nwhat it is said to be the price of. There.\nIt does not balance and it never has\nand every man in this trade knows the beam is bent.\n\nAnd we have all worked out the same solution,\nwhich is not to look at the beam but at the coin,\nwhich is round, and is small, and is a very good coin,\nand is, considered by itself, entirely clean."
 omni_library_scrolls.buy.scroll_eptelonian_poetry_9:0 "#G Buy Echoes of Arteon#! - 120 Gold"
 omni_library_scrolls.read.scroll_eptelonian_poetry_9:0 "Read Echoes of Arteon"
 omni_library_scrolls.scroll_eptelonian_poetry_9.title:0 "Echoes of Arteon"
 omni_library_scrolls.scroll_eptelonian_poetry_9.tooltip:0 "#T Echoes of Arteon#!\nRarity: Uncommon\nRegional pools: Eptelonian and Cymevan colonial texts\n#G Reward#! #T 1% Oratory Tech Research#!"
 omni_library_scrolls.scroll_eptelonian_poetry_9.text:0 "Echoes of Arteon\n\nVerses of homesickness and resentment, which the author does not attempt to reconcile\n\nThe light on the water at home at the sixth hour.\nI would like it very much and I would like\nwhoever sent me here to be here also\nat the sixth hour, in this, which has no light to speak of.\n\nBoth of these are true at the same time\nand the poem does not choose and will not choose\nand the people at home who read it think it homesick\nand the people here who read it think it something else,\nand I have let both of them go on thinking it."
 omni_library_scrolls.buy.scroll_eptelonian_poetry_10:0 "#G Buy The Governor's Illusion#! - 60 Gold"
 omni_library_scrolls.read.scroll_eptelonian_poetry_10:0 "Read The Governor's Illusion"
 omni_library_scrolls.scroll_eptelonian_poetry_10.title:0 "The Governor's Illusion"
 omni_library_scrolls.scroll_eptelonian_poetry_10.tooltip:0 "#T The Governor's Illusion#!\nRarity: Common\nRegional pools: Eptelonian and Cymevan colonial texts\n#G Reward#! #T 2% Civic Tech Research#!"
 omni_library_scrolls.scroll_eptelonian_poetry_10.text:0 "The Governor's Illusion\n\nA satire; circulated in manuscript in the outer stations and never in the capital\n\nMy lord commands the province. There it is.\nIt is the harbour. It is muddy. That is it.\nBeyond the second creek my lord commands\nan understanding with a man named Ors.\n\nIn his dispatches it is a dominion.\nIn his dispatches there are roads, and I have walked\nthe entire length of every road he has,\nand it took the morning, and I stopped for lunch."
