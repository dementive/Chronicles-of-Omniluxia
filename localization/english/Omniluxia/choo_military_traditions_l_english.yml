 great_steppes_philosophy:0 "Great Steppe Traditions"
 great_steppes_philosophydesc:2 ""
 
 #great steppes migration heritage path 
 great_steppes_migration_heritage_path_1:0 "Selaskusian Horse Tribesman"
 great_steppes_migration_heritage_path_1_desc:0 "Selaskusian riders learn on the herd paths, where a child who drops the reins is expected to bring the horse back anyway."
 great_steppes_migration_heritage_path_2:0 "Nomadic Training"
 great_steppes_migration_heritage_path_2_desc:0 "The tents come down in the order they went up, which lets a camp be ready for the road while a distant clerk is still deciding whether it moved."
 great_steppes_migration_heritage_path_3:1 "Tukin Horse Archers"
 great_steppes_migration_heritage_path_3_desc:0 "Tukin bowmen shoot beside the men they ride with all winter. Each knows how long the other can be trusted to stay in the saddle."
 great_steppes_migration_heritage_path_4:0 "Dunya Horsemen"
 great_steppes_migration_heritage_path_4_desc:0 "The Dunya breeders let the heavy horse spend the cold months with the herds, which saves the regiment from buying every mouthful by the sack."
 great_steppes_migration_heritage_path_5:0 "Okonchi Morale"
 great_steppes_migration_heritage_path_5_desc:0 "Okonchi camps can take the road again after bad news, since the wagons are seldom unpacked far enough for anyone to call it home."
 great_steppes_migration_heritage_path_6:0 "Avit Tribal Infantry"
 great_steppes_migration_heritage_path_6_desc:0 "Avit footmen hold the ground where the herds cross, which teaches them early that stepping aside can make an afternoon considerably longer."
 great_steppes_migration_heritage_path_7:0 "Horsemen Recruitment"
 great_steppes_migration_heritage_path_7_desc:0 "The recruiting riders know which camps have young horses to spare and which only have young men who say they do."
 great_steppes_migration_heritage_path_end_bonus:0 "Rule Of Trhnadunya"
 great_steppes_migration_heritage_path_end_bonus_desc:0 ""
 ######
 ######
 #great steppes harsh terrain path
 great_steppes_harsh_terrain_path_1:0 "Hill Horsemen"
 great_steppes_harsh_terrain_path_1_desc:0 "Hill riders learn to judge a slope with the bow unstrung. On the way back they are trusted with both tasks."
 great_steppes_harsh_terrain_path_2:0 "Tribesmen Armor"
 great_steppes_harsh_terrain_path_2_desc:0 "Clan armorers fit the levy coats at the winter camp, where a tribesman may bring his own iron and complain about the fit for free."
 great_steppes_harsh_terrain_path_3:0 "Nomadic Tribute"
 great_steppes_harsh_terrain_path_3_desc:0 "The tribute collectors wait where the route narrows, and the herders know which animals to bring without needing the demand read aloud."
 great_steppes_harsh_terrain_path_4:0 "Selaskusian Bow"
 great_steppes_harsh_terrain_path_4_desc:0 "Selaskusian bowyers test a stave through the first cold spell before handing it over, having heard what happens to their reputation when they do not."
 great_steppes_harsh_terrain_path_5:0 "Nomadic Steppe Experience"
 great_steppes_harsh_terrain_path_5_desc:0 "A steppe officer keeps track of the families camped beyond the next ridge, where a surveyor might be forgiven for recording nobody at all."
 great_steppes_harsh_terrain_path_6:0 "Scale Shield"
 great_steppes_harsh_terrain_path_6_desc:0 "The watch keep scale shields by the gate, with the loose scales stitched after supper by whoever let them rattle all day."
 great_steppes_harsh_terrain_path_7:0 "Great Steppes Raids"
 great_steppes_harsh_terrain_path_7_desc:0 "A raid that follows an old grazing road is remembered rather differently on either side of the road."
 great_steppes_harsh_terrain_path_end_bonus:0 "Nomadic Pastoralism"
 great_steppes_harsh_terrain_path_end_bonus_desc:0 ""
 #####
 #####
 #great steppes cultural assimilation path
 great_steppes_cultural_assimilation_path_1:0 "Nomadic Assimilation"
 great_steppes_cultural_assimilation_path_1_desc:0 "A household that takes to the herds learns the camp dues with the camp names, and may find both easier to remember than its former landlord."
 great_steppes_cultural_assimilation_path_2:0 "Steppe Land Morale"
 great_steppes_cultural_assimilation_path_2_desc:0 "When a steppe column takes bad news, the cookfires are still lit in the customary order, so each company knows where to find its neighbors."
 great_steppes_cultural_assimilation_path_3:0 "Siege Battering Ram"
 great_steppes_cultural_assimilation_path_3_desc:0 "The ram travels in pieces on the wagons. Its timber is counted as baggage until the defenders ask to talk."
 great_steppes_cultural_assimilation_path_4:0 "Selaskusian Slavery"
 great_steppes_cultural_assimilation_path_4_desc:0 "The Selaskusian traders tally the captives at the crossing, where the clerk keeps a separate list for people who have no right to turn back."
 great_steppes_cultural_assimilation_path_5:0 "Nomadic Warrior"
 great_steppes_cultural_assimilation_path_5_desc:0 "Steppe warriors bring their own blankets and cooking pots, and have strong opinions about what the pay clerk may therefore deduct."
 great_steppes_cultural_assimilation_path_6:0 "War Plunder"
 great_steppes_cultural_assimilation_path_6_desc:0 "The terms are discussed beside the wagons carrying the first spoils, where both parties can take an interest in settling promptly."
 great_steppes_cultural_assimilation_path_7:0 "Silk Trade Dilplomacy"
 great_steppes_cultural_assimilation_path_7_desc:0 "Silk merchants can get an envoy a hearing in a camp whose chiefs would keep a herald waiting until spring."
 great_steppes_cultural_assimilation_path_end_bonus:0 "Exportable Slaves"
 great_steppes_cultural_assimilation_path_end_bonus_desc:0 ""
 
