 arteonian_philosophy:0 "Arteonian Traditions"
 arteonian_philosophydesc:2 ""
 arteonian_philosophy_start_bonus:0 "The Temple of the Arteonian Lion"
 arteonian_philosophy_start_bonus_desc:0 ""
 
 
 #arteonian warrior path
 arteonian_warrior_path_1:0 "Nalasahilnava Jungles"
 arteonian_warrior_path_1_desc:0 "The Nalasahilnava watch measures a march in crossings, since even a good map will give a stranger the wrong idea about distance."
 arteonian_warrior_path_2:0 "The Legacy of Yeza"
 arteonian_warrior_path_2_desc:0 "Yeza's veterans corrected the spacing at muster by walking through the ranks themselves. Their successors use the same measure."
 arteonian_warrior_path_3:1 "Sharp Weapons"
 arteonian_warrior_path_3_desc:0 "Arteonian smiths test an edge on green cane before it leaves the shop, and charge the same whether the first blade passes or the third."
 arteonian_warrior_path_4:0 "Atbay Slave Trade"
 arteonian_warrior_path_4_desc:0 "Atbay brokers keep separate books for the ships and their captives, though both books are balanced at the same table."
 arteonian_warrior_path_5:0 "Hit and Run"
 arteonian_warrior_path_5_desc:0 "An Arteonian company can vanish up a slope its pursuers had taken for the edge of the field."
 arteonian_warrior_path_6:0 "Skilled Recruiters"
 arteonian_warrior_path_6_desc:0 "The recruiting officers visit before the fairs disperse, while the elders can still point out which names on the roll belong to the same man."
 arteonian_warrior_path_7:0 "Imported Iron"
 arteonian_warrior_path_7_desc:0 "Iron arrives at the quay in plain bars, and the fleet and the armory hold their argument over it before the cargo is unloaded."
 arteonian_warrior_path_end_bonus:0 "A Hard Bargain"
 arteonian_warrior_path_end_bonus_desc:0 ""
 ######
 ######
 #arteonian seafaring path
 arteonian_seafaring_path_1:0 "Zewgmyadid Heritage"
 arteonian_seafaring_path_1_desc:0 "Zewgmyadid steersmen judge the run by the sound of the oars. A captain who calls for more speed is generally asked to sit down."
 arteonian_seafaring_path_2:0 "Gwezimanmel Draft"
 arteonian_seafaring_path_2_desc:0 "Gwezimanmel keeps a levy roll at each landing, so a man who misses the muster by taking a ferry may find it waiting on the other bank."
 arteonian_seafaring_path_3:0 "Naval Dominance"
 arteonian_seafaring_path_3_desc:0 "Harbor crews practice on old hulls, which the owners are paid to stop describing as seaworthy."
 arteonian_seafaring_path_4:0 "A Life At Sea"
 arteonian_seafaring_path_4_desc:0 "Sailors brought up on the water learn to hear a change in the sea before the officers get around to naming it."
 arteonian_seafaring_path_5:0 "Noble Warlords"
 arteonian_seafaring_path_5_desc:0 "An Arteonian lord arrives at a siege with his own engineer, who is allowed to speak before the family herald."
 arteonian_seafaring_path_6:0 "Imposing Edifices"
 arteonian_seafaring_path_6_desc:0 "The same sheds turn out fittings for hulls and harness for infantry, and both offices claim they paid for the roof."
 arteonian_seafaring_path_7:0 "Putting Our People To Work"
 arteonian_seafaring_path_7_desc:0 "The port captains hire from the same streets as the merchants. At the end of the season, neither can say quite who trained whose men."
 arteonian_seafaring_path_end_bonus:0 "Maneuverability Above All"
 arteonian_seafaring_path_end_bonus_desc:0 ""
 #####
 #####
 #arteon horteon path
 arteon_horteon_path_1:0 "Horteon Imported Pikes"
 arteon_horteon_path_1_desc:0 "Horteon pikes stand behind the bowmen at muster, and the bowmen have been known to complain when the shipment is late."
 arteon_horteon_path_2:0 "Azatashen Tribes"
 arteon_horteon_path_2_desc:0 "The Azatashen elders send a tally of hands for the season with separate marks for those who can be spared before harvest."
 arteon_horteon_path_3:0 "The Horteon Cold Tribes"
 arteon_horteon_path_3_desc:0 "Horteon riders try their mounts on cold slopes before buying them, where a handsome animal has very little time to make its case."
 arteon_horteon_path_4:0 "High Elven Sphere"
 arteon_horteon_path_4_desc:0 "High Elven tutors bring their own bow cases and send for local smiths when the clasps break."
 arteon_horteon_path_5:0 "Skilled Chariot Riders"
 arteon_horteon_path_5_desc:0 "Chariot crews put a newcomer on the reins before giving him a place in the line. There is seldom a shortage of volunteers for the judging."
 arteon_horteon_path_6:0 "Askanaz Red Chariot"
 arteon_horteon_path_6_desc:0 "The red paint on an Askanaz chariot is renewed before muster, when the infantry can see for themselves that the promised noble was sent."
 arteon_horteon_path_7:0 "Mazran Castles"
 arteon_horteon_path_7_desc:0 "A Mazran castle goes up stone by stone under the eye of a clerk who is expected to know both its cost and what it cost last winter."
 arteon_horteon_path_end_bonus:0 "Horteon Ship"
 arteon_horteon_path_end_bonus_desc:0 ""
###############################################################################################
 ######
 #####Morrigon Celts
 ######
 celtic_philosophy:0 "Morrigon Traditions"
 celtic_philosophydesc:3 "The Barbarian Traditions encompass the fighting styles of the peoples of Vetalian, Rohenoan, Borderlander, and Celtican, among others. They mostly relied on large formations of lightly armored infantry equipped with spears or swords, supported by nimble chariot formations or light cavalry, and made extensive use of ambush tactics, especially in forests.\n\nCan unlock the '#Y Raise Levies#!' Ability\nCan unlock the '#Y Hit and Run#!' Tactic\n\n#G Tradition Focuses#!\nStrong #Y Light Infantry#!\nGood #Y Archers#!, #Y Chariots#!"
 celtic_philosophy_start_bonus:0 "Chariot Culture"
 celtic_philosophy_start_bonus_desc:0 "The use of chariots in warfare stems back many thousands of years and holds strong affiliations with nobility and class; chariot inhumations speak to the honor that can be won through battle. #Y Chariots#! themselves were commonly used as mobile platforms with two to three occupants, from which javelins or other thrown weapons were used to break the ranks of their opponents."
 #Britannic
 celtic_britannic_path_1:0 "Scythed Chariots"
 celtic_britannic_path_1_desc:0 "Affixing scything blades to the wheels of our chariots, adds a lethal deterrent to anyone foolhardy enough to assault them."
 celtic_britannic_path_2:0 "Coming of Age"
 celtic_britannic_path_2_desc:0 "From a young age, our children are taught that they may be called upon to defend their settlements. If every man bears responsibility for arming himself, armies can be raised from the very salt of the earth."
 celtic_britannic_path_3:0 "Living Off The Land"
 celtic_britannic_path_3_desc:0 "Our people know the ways of the land better than most; which berries and plants are edible, and which natural remedies can be used to salve wounds."
 celtic_britannic_path_4:0 "Word of Mouth"
 celtic_britannic_path_4_desc:0 "Whether it be a chance for glory, an opportunity for loot, or merely to revel in the slaughter, news of an imminent battle draws even the elders to our ranks."
 celtic_britannic_path_5:0 "Chariot Mastery"
 celtic_britannic_path_5_desc:0 "The terror inspired by a massed chariot attack can be sufficient to break even the most battle-hardened formations."
 celtic_britannic_path_6:0 "Selective Breeding"
 celtic_britannic_path_6_desc:0 "Revered throughout the bronze age and before, as evident in the chalk hill carvings throughout #Y Vetalia#!, the strong-backed domestic horse is a result of thousands of years of selective breeding, and capable of carrying a single rider into battle."
 celtic_britannic_path_7:0 "Take Up Arms"
 celtic_britannic_path_7_desc:0 "Every man has a place in our armies; not least the hunters, who stalk their prey on battlefield and forest alike."
 celtic_britannic_path_end_bonus:0 "Trained Cavalry"
 celtic_britannic_path_end_bonus_desc:0 "Domestic horses, while sufficient for defense in emergencies, are inclined to panic on the battlefield. Thus, by expanding our stock of horses bred and trained for war, our bold warriors will excel at their true purpose; carnage."
 #Germanic
 celtic_germanic_path_1:0 "Strike and Withdraw"
 celtic_germanic_path_1_desc:0 "The relative fitness of our warriors, combined with our people's contempt for cumbersome equipment, allows us to outmaneuver traditional armies with ease. By harrying our opponents' flanks, they will likely lose enthusiasm for the fight before we do."
 celtic_germanic_path_2:0 "Natural Resources"
 celtic_germanic_path_2_desc:0 "The abundance of arable land and vast tracts of land sporting workable wood, give us unparalleled access to the resources we need to create weapons of war."
 celtic_germanic_path_3:0 "Ambush"
 celtic_germanic_path_3_desc:0 "While a combination of factors contributed to this, the Marshlander familiarity with the dense terrain was a major one."
 celtic_germanic_path_4:0 "The Glory of the Hunt"
 celtic_germanic_path_4_desc:0 "Tribal warfare is a brutal affair. The seizure of slaves, women and valuables is a time-honored practice which we ought not to forgo."
 celtic_germanic_path_5:0 "Shield Wall"
 celtic_germanic_path_5_desc:0 "#Y Rohenoan#! troops often surprised their opponents by utilizing a core of heavily shielded warriors, acting as a deterrent to attackers, and as a particularly cohesive and mobile unit on the battlefield."
 celtic_germanic_path_6:0 "The Young Must Serve"
 celtic_germanic_path_6_desc:0 "Learning the art of warfare is a vital part of every youth's education. If a child can wield a sword and maintain their equipment, then they are ready for war."
 celtic_germanic_path_7:0 "Hail of Stones"
 celtic_germanic_path_7_desc:0 "Those unable or unwilling to hold an axe, learn the art of the sling, or bow. A simple tool it may seem, but even mighty giants can be felled by a single stone."
 celtic_germanic_path_end_bonus:0 "Adaptability"
 celtic_germanic_path_end_bonus_desc:0 "Our brave soldiers may be the fiercest the world has seen, but true humility comes in learning from our defeats. By adopting tactics we encounter on the battlefield, from those who consider themselves more 'civilized', we may outdo any fighting force we meet."
 #Gallic
 celtic_gallic_path_1:0 "Strike From Afar"
 celtic_gallic_path_1_desc:0 "Huntsmen and skirmishers practice from a young age, honing their skills on wildlife and those unlucky enough to constitute a target."
 celtic_gallic_path_2:0 "Confederations"
 celtic_gallic_path_2_desc:0 "Many tribes maintained close relations with their neighbors, guaranteeing a certain amount of cooperation when it came to battle. Warbands likely comprised members of many different local tribes, all fighting for glory."
 celtic_gallic_path_3:0 "The Plains Fight With Us"
 celtic_gallic_path_3_desc:0 "The rolling plains of #G Rohenoa#!, from the coast to the foothills of the mountains, prove ideal terrain for the use of cavalry."
 celtic_gallic_path_4:0 "In Defense of Our Home"
 celtic_gallic_path_4_desc:0 "From blacksmiths to traders, when our hill forts and rural settlements are threatened, all shall take up arms and stand united."
 celtic_gallic_path_5:0 "A People On the Move"
 celtic_gallic_path_5_desc:0 "Our ancestors moved freely, uncaring of borders or territorial claims. These nomadic traditions live on, as our people live in constant readiness to seek out pastures greener than their own."
 celtic_gallic_path_6:0 "Strong Arm"
 celtic_gallic_path_6_desc:0 "While most of our warriors eschew the protection afforded by mail, our strong-armed and well equipped javelin-throwers clad themselves in armor, and can hurl iron-tipped spears capable of punching through plate armor, flesh, and bone."
 celtic_gallic_path_7:0 "Scale the Walls!"
 celtic_gallic_path_7_desc:1 "Our people have taken to residing in walled territories, which, while well-defended, have weaknesses, if one knows where to look."
 celtic_gallic_path_end_bonus:0 "Blow the Trumpet, in the New Moon!"
 celtic_gallic_path_end_bonus_desc:0 "The Carnyx, a trumpet possessed of a harsh and instantly recognizable timbre, inspires our troops, while terrifying our opponents."
###############################################################################################
 ######
 ##### Aralans Traditions
 ######
 aralans_philosophy:0 "Aralans Traditions"
 aralans_philosophydesc:2 ""
 aralans_philosophy_start_bonus:0 "The Aralans Blessings"
 aralans_philosophy_start_bonus_desc:0 ""
 
 
 #Aralans 1
 rohenoa_path_1:0 "Strong Siege Equipment"
 rohenoa_path_1_desc:0 "The siege train travels with the Rohenoan horse, whose officers have learned that a wall seldom comes out to meet a charge."
 rohenoa_path_2:0 "The Rohenoan Mercenaries"
 rohenoa_path_2_desc:0 "The mercenaries of Rohenoa will stand through a long afternoon, provided someone can say when the pay chest is coming."
 rohenoa_path_3:1 "Soventeirian Sail Boats"
 rohenoa_path_3_desc:0 "Soventeirian pilots trim their sails close under the enemy's oars, a practice their passengers prefer to hear about on shore."
 rohenoa_path_4:0 "Strike From Afar"
 rohenoa_path_4_desc:0 "Outlying villages furnish scouts who know how far a signal carries, and how often it is safer to let it pass unanswered."
 rohenoa_path_5:0 "Aurezo Horses"
 rohenoa_path_5_desc:0 "Aurezo breeders judge a horse by the ground it can cover after the first burst, when the rider has usually ceased to be particular about its color."
 rohenoa_path_6:0 "Light Armor"
 rohenoa_path_6_desc:0 "Rohenoan footmen trade plates for a long day's march and keep the discarded iron for their cooking pots."
 rohenoa_path_7:0 "Aralans Imported Cataphracts"
 rohenoa_path_7_desc:0 "The imported cataphracts arrived with instructions for every buckle. The Aralans kept the instructions after discovering what a replacement horse cost."
 rohenoa_path_end_bonus:0 "Soventeirian Imported Horses"
 rohenoa_path_end_bonus_desc:0 ""
 ######
 ######
 #Aralans 2
 nouveau_aralan_path_1:0 "The Young Must Serve"
 nouveau_aralan_path_1_desc:0 "The muster clerk reads the names at the first fair after harvest, when even the young men who work away from home can be found."
 nouveau_aralan_path_2:0 "Heroic Warriors"
 nouveau_aralan_path_2_desc:0 "The oldest shields in the company have been repaired more often than the songs about their owners allow."
 nouveau_aralan_path_3:0 "Barlaria Ship Blueprint"
 nouveau_aralan_path_3_desc:0 "Barlarian shipwrights mark their measurements directly on the slipway, where a visiting admiral can offer advice without disturbing the work."
 nouveau_aralan_path_4:0 "Coming Of Age"
 nouveau_aralan_path_4_desc:0 "A household marks a child's coming of age with a place at the table and, when the summons comes, a place in the line."
 nouveau_aralan_path_5:0 "Trained Cavalry"
 nouveau_aralan_path_5_desc:0 "Aralan riders practice on the flats after harvest, when there is room to turn and fewer farmers to explain the exercise to."
 nouveau_aralan_path_6:0 "Cataphracts To Knights"
 nouveau_aralan_path_6_desc:0 "The old cataphract families still bring their armor to muster, though the herald now calls them knights and charges accordingly."
 nouveau_aralan_path_7:0 "Long Weapons"
 nouveau_aralan_path_7_desc:0 "Recruits learn to carry their long weapons uphill before they are allowed to argue about whose is longest."
 nouveau_aralan_path_end_bonus:0 "Scale The Walls!"
 nouveau_aralan_path_end_bonus_desc:0 ""
 #####
 #####
 #Aralans 3
 helluvian_aralans_path_1:0 "Aurezdun Stone Walls"
 helluvian_aralans_path_1_desc:0 "Aurezdun masons leave a niche for a lamp by every stair, so the watch can count its steps when the valley fires go out."
 helluvian_aralans_path_2:0 "Helluvian Faith"
 helluvian_aralans_path_2_desc:0 "The Helluvian priest visits the new garrison with a book of rites and leaves with a list of roofs that need mending before winter."
 helluvian_aralans_path_3:0 "Rohenoan-Aralan friendship"
 helluvian_aralans_path_3_desc:0 "Aralan and Rohenoan captains drink from the same cup at muster, a small courtesy that saves a great deal of time over the seating."
 helluvian_aralans_path_4:0 "Rohenoan Knight"
 helluvian_aralans_path_4_desc:0 "The Rohenoan knight rides out in plate his family has mended over three generations. The horse is a more recent expense."
 helluvian_aralans_path_5:0 "The King Army"
 helluvian_aralans_path_5_desc:0 "When the king comes to review the army, the pay clerks come with him. Attendance has improved on both sides."
 helluvian_aralans_path_6:0 "Rohenoan Expansion"
 helluvian_aralans_path_6_desc:0 "The surveyors follow the army with cords and tablets, and usually finish their account before anyone asks where the former tenants went."
 helluvian_aralans_path_7:0 "Marsian Heroic Knights"
 helluvian_aralans_path_7_desc:0 "Marsian knights have their harness blessed before riding out. The priests ask that the buckles be checked as well."
 helluvian_aralans_path_end_bonus:0 "Mercenary Regiments"
 helluvian_aralans_path_end_bonus_desc:0 ""
###############################################################################################

######
##### Seeker Traditions
######

zani_seeker_philosophy:0 "Seeker Traditions"
zani_seeker_philosophydesc:0 ""

seekers_reaserchers_path_1:0 "Arbalist Academies"
seekers_reaserchers_path_1_desc:0 "The Arbalist is the favored weapon of #Y Seeker#! crossbowmen, due to its strong piercing power, and far range. However, one downside is that it is slower to fire and reload than the bow."
seekers_reaserchers_path_2:0 "Well-Regulated Levies"
seekers_reaserchers_path_2_desc:0 "#Y Seeker#! levies are no common peasant rabble- their enlisted soldiers train a minimum of 3 months before serving in combat. A small reserve of permanent knights, and reserve soldiers allows the #Y Seekers#! to always have some well experienced soldiers in their army."
seekers_reaserchers_path_3:0 "Military Engineers"
seekers_reaserchers_path_3_desc:0 "Much to the chagrin of enemy nations, #Y Seekers#! are masters in siegecraft. It is said that #Y Seeker#! siege engineers could topple the walls of #G Gamzudaon#! in a mere month, given enough men, of course."
seekers_reaserchers_path_4:0 "Elite Legions"
seekers_reaserchers_path_4_desc:0 "#Y Seeker#! #Y Legions#! train not just the sword arm, but also the mind. In addition to their rigourous martial training, they learn exstensively about The Way. Any enemy army would be very unlucky to be at the end of a zealous soldier's spear."
seekers_reaserchers_path_5:0 "Fleet of Foot, With the Wind In Our Sails"
seekers_reaserchers_path_5_desc:0 "The well-disciplined #Y Seeker#! legions are used to having to march quickly though the #Y Celtican#! forests."
seekers_reaserchers_path_6:0 "Seeker Knights"
seekers_reaserchers_path_6_desc:0 "The knights of the #T Seeker Order#! are fond of rushing straight into the enemy lines, knowing they will be protected by powerful spells, and their heavy armor."
seekers_reaserchers_path_7:0 "Protected At All Costs"
seekers_reaserchers_path_7_desc:0 "#Y Seeker#! knights are known for their thick, heavy plate mail, which even dwarven steel will have a difficult time piercing. "
seekers_technica_path_1:0 "Architectural Standards"
seekers_technica_path_1_desc:0 "A common saying about #Y Seeker#! engineers is that they need two months to draft the plan for a new building, one month to draft the plans, and another month to make sure it looks right."
seekers_technica_path_2:0 "Master of the Fortress"
seekers_technica_path_2_desc:0 "The first thing that is seen when entering a #Y Seeker#! city is the huge, towering fortifications, and the citadel at the center of the city. An army would be hard-pressed to mount an assault on the well constructed #Y Seeker#! walls, and they would have to deal with a lengthy siege, all while the defending #Y Seeker#! battlemages, archers, and ballistae pester the enemy army with spells, arrows, and bolts."
seekers_technica_path_3:0 "Bureau of City Planning"
seekers_technica_path_3_desc:0 "#Y Seeker#! cities are planned and methodical, with engineers being employed to design every city street, and to make sure everything is up to standard"
seekers_technica_path_4:0 "Natural Fortifications"
seekers_technica_path_4_desc:0 "Many #Y Seeker#! cities use the natural fortifications to theit benefit. The grand city of Saint Caertugo, is built into the side of a mountain."
seekers_technica_path_5:0 "Leather Saddle Bags"
seekers_technica_path_5_desc:0 "#Y Large#! leather saddle bags allows soldiers to bring much more supplies with them when on campaign."
seekers_technica_path_6:0 "Technological Workshops"
seekers_technica_path_6_desc:0 "Learned scholars and #Y Mages#! labor away in workshops, studying new technologies, such as new ways to wage war, grow crops, spread propaganda, and construct stronger and more durable fortifications."
seekers_technica_path_7:0 "Swords For Sale"
seekers_technica_path_7_desc:0 "Foreign mercernaries, although not nearly as skilled or experienced as #Y Seeker#! legions, make for excellent cannon fodder."
seekers_magica_path_1:0 "A Wizard's Embrace"
seekers_magica_path_1_desc:0 "#Y Mages#! who have converted to #T Seekism#! flock to #Y Seeker#! controlled cities."
seekers_magica_path_2:0 "Mages and Serfs"
seekers_magica_path_2_desc:0 "In a stark contrast to their neighbors, #Y Seeker#! cities contain almost zero serfs. Instead, the poorer members of society are encouraged by the state to join a mages guild, all expenses paid for by the state."
seekers_magica_path_3:0 "Magically-Augmented Levies"
seekers_magica_path_3_desc:0 "Mighty battlemages fight alongside #Y Seeker#! legions, greatly improving the morale of soldiers."
seekers_magica_path_4:0 "Relaxed Recruitment Standard"
seekers_magica_path_4_desc:0 "Expansion of our #Y Mage#! schools, and recruting less favorable soldiers, will greatly expand our military capacities"
seekers_magica_path_5:0 "The Will to Dominate"
seekers_magica_path_5_desc:0 "#Y Seeker#! soldiers, the most zealous and faithful in the land, rarely let an enemy army escape without first facing their holy and rightous wrath."
seekers_magica_path_6:0 "Practioners of Defensive Spells"
seekers_magica_path_6_desc:0 "Battlemages cast powerful protection spells on the #Y Seeker#! legions, ensuring their victory in combat."
seekers_magica_path_7:0 "Magical Advisors"
seekers_magica_path_7_desc:0 "In the #Y Council#! of every #Y Seeker#! city, there is a Master #Y Warlock#!, to advise the #Y Grand Master#! on all magical matters."
###############################################################################################
# Copper Dwarves
common_dwarf_philosophy: "Copper Dwarven Traditions"
common_dwarf_philosophydesc: ""
skyreach_dwarf_path_1: "Mountain Warriors"
skyreach_dwarf_path_1_desc: "Skyreach recruits learn to relieve the uphill watch with their armor on, since the men coming down are in no mood to carry it for them."
skyreach_dwarf_path_2: "Dwarven Fortifications"
skyreach_dwarf_path_2_desc: "The masons cut each course to fit the rock, and bill the hold for considerably less wall than an engineer would draw on level ground."
skyreach_dwarf_path_3: "A Free and Proud People"
skyreach_dwarf_path_3_desc: "Freemen take their oath at the hold gate, in sight of the households that will answer for them."
skyreach_dwarf_path_4: "Border Outposts"
skyreach_dwarf_path_4_desc: "A Skyreach outpost begins with a cistern and a place to keep a lamp. The name is usually settled by the second winter."
skyreach_dwarf_path_5: "Dwarven Pikemen"
skyreach_dwarf_path_5_desc: "Pikemen on the high roads learn to leave room for the axe companies, especially where the road leaves no room for an argument."
skyreach_dwarf_path_6: "Endless Tribute"
skyreach_dwarf_path_6_desc: "The tribute chest comes up the pass on the same mule each year. It has been known to arrive before the envoy."
skyreach_dwarf_path_7: "Apotheosis Of Dwarvenkind"
skyreach_dwarf_path_7_desc: "Skyreach lords keep spare mounts below the snow line, where their horses can enjoy the advantages of dwarven supremacy in reasonable comfort."
morrigon_dwarf_path_1: "Fighting on the Plains"
morrigon_dwarf_path_1_desc: "Morrigon's heavy companies drill on open ground, where a loose file is visible to the sergeant from an inconvenient distance."
morrigon_dwarf_path_2: "A Focused Infantry"
morrigon_dwarf_path_2_desc: "The smiths make two weights of helmet from the same pattern, which has ended the yearly dispute over whose order to fill first."
morrigon_dwarf_path_3: "Happiness at Home"
morrigon_dwarf_path_3_desc: "Neighbors who keep different feasts can still share a watch rota, once somebody has the sense to write down both sets of dates."
morrigon_dwarf_path_4: "Noble Charioteers"
morrigon_dwarf_path_4_desc: "Morrigon's nobles bring their own teams to the muster, and take it rather better when asked to lead the charge than when asked to pay for it."
morrigon_dwarf_path_5: "Fortified Garrisons"
morrigon_dwarf_path_5_desc: "A garrison whose wages arrive on time is an advertisement that even a reluctant subject can read."
morrigon_dwarf_path_6: "Deadly Archery"
morrigon_dwarf_path_6_desc: "Morrigon's bowyers keep the old staves for drill, and the bowmen know what sort of day is coming when the new ones are issued."
morrigon_dwarf_path_7: "Masters of Siegecraft"
morrigon_dwarf_path_7_desc: "Siege carpenters ask to see the gate before they agree to a price. The men drawing up the campaign usually wish they had asked first."
lone_dwarfs_path_1: "High Spirits"
lone_dwarfs_path_1_desc: "A watch captain carries a little ale with the spare shield straps, and knows which to hand out first."
lone_dwarfs_path_2: "Unstoppable Forces"
lone_dwarfs_path_2_desc: "The bowmen choose the hills that give the foot a way up, since a magnificent position is hard to share with men who cannot reach it."
lone_dwarfs_path_3: "Scorched Earth Tactics"
lone_dwarfs_path_3_desc: "The last wagons leave with the grain, and the enemy is welcome to use the granary once it has cooled."
lone_dwarfs_path_4: "Stocked Citadels"
lone_dwarfs_path_4_desc: "Citadel keepers count the sacks at the start of winter and again after the first rumor of a siege."
lone_dwarfs_path_5: "An Equitable Society"
lone_dwarfs_path_5_desc: "A dwarf who earns a higher place at the table inherits its dues along with its better view of the hall."
lone_dwarfs_path_6: "Protected Cavalry"
lone_dwarfs_path_6_desc: "The Lone holds make their horse armor in sections, so a dent in one plate need not become a debt on the whole animal."
lone_dwarfs_path_7: "A Seat of Dwarven Power"
lone_dwarfs_path_7_desc: "Pack trains that once stopped at the border now unload beneath the seat of the holds, and the foot companies are paid out of the tolls."
###############################################################################################
#Dunydurceg Traditions
dunydurceg_philosophy: "Dunydurceg Traditions"

dunydurceg_migration_heritage_path_1:0 "Tapping into the Tribal Reserves"
dunydurceg_migration_heritage_path_1_desc:0 "The Dunydurceg elders keep a reckoning of what each camp can spare, down to the hands needed to take down its own tents."
dunydurceg_migration_heritage_path_2:0 "Swift Shooters"
dunydurceg_migration_heritage_path_2_desc:0 "Young bowmen learn to draw and loose while the company is moving, since nobody has offered to hold up the march for them."
dunydurceg_migration_heritage_path_3:0 "Skirmisher Training"
dunydurceg_migration_heritage_path_3_desc:0 "The riders learn to leave an opening for the next file as they turn away. The recruit who wants a second look is sent back to drill."
dunydurceg_migration_heritage_path_4:0 "The People Are With Us"
dunydurceg_migration_heritage_path_4_desc:0 "The levy roll passes from camp to camp with the herds, and each headman can read it without waiting for a clerk from the capital."
dunydurceg_migration_heritage_path_5:0 "Legendary Martial Heritage"
dunydurceg_migration_heritage_path_5_desc:0 "A veteran can name the ford where the company last broke and the hill where it gathered again. Recruits are expected to learn both."
dunydurceg_migration_heritage_path_6:0 "Steadfast Levies"
dunydurceg_migration_heritage_path_6_desc:0 "Dunydurceg levies hold in the same groups in which they travel, with the older hands in places where everyone can see them."
dunydurceg_migration_heritage_path_7:0 "Reinforcing the Front"
dunydurceg_migration_heritage_path_7_desc:0 "Replacement companies take the short roads known to the drovers, and reach the front before the baggage clerks have made a place for them."
dunydurceg_harsh_terrain_path_1:0 "Surefooted Mounts"
dunydurceg_harsh_terrain_path_1_desc:0 "A mount that knows where to put its feet is prized in the high country. The rider's judgment can be attended to later."
dunydurceg_harsh_terrain_path_2:0 "Tribal Festivals and Celebrations"
dunydurceg_harsh_terrain_path_2_desc:0 "The clans reckon the year by the meetings where marriages are settled and old quarrels are given a fresh hearing."
dunydurceg_harsh_terrain_path_3:0 "Heavy-Handed Overlords"
dunydurceg_harsh_terrain_path_3_desc:0 "Dunydurceg collectors bring the last receipt with them, in case a village remembers paying a different amount."
dunydurceg_harsh_terrain_path_4:0 "A Storm of Arrows"
dunydurceg_harsh_terrain_path_4_desc:0 "The first bowman to loose is sometimes the best shot in the company. He is still expected to wait."
dunydurceg_harsh_terrain_path_5:0 "Prerogative of the Dunydurceg"
dunydurceg_harsh_terrain_path_5_desc:0 "A Dunydurceg chief can call on every hearth for the levy, though he finds the hearths easier to locate after harvest."
dunydurceg_harsh_terrain_path_6:0 "Safe Within Our Walls"
dunydurceg_harsh_terrain_path_6_desc:0 "The gatekeepers keep planks fitted for the outer doors, so a bad winter and a bad neighbor can be dealt with from the same shed."
dunydurceg_harsh_terrain_path_7:0 "Manifest Destiny"
dunydurceg_harsh_terrain_path_7_desc:0 "The chiefs bring old grazing claims to council, where a new claim can be made to look older by inviting the right witness."
dunydurceg_great_steppes_path_1:0 "Privileges for the Equestrian Class"
dunydurceg_great_steppes_path_1_desc:0 "An able rider can earn the privileges of the horse clans. His neighbors usually hear about it first from the collector."
dunydurceg_great_steppes_path_2:0 "Dunydurceg Marching Tunes"
dunydurceg_great_steppes_path_2_desc:0 "Marching songs keep the files together after dark, and the verses about the officers are generally saved for uphill stretches."
dunydurceg_great_steppes_path_3:0 "Over the Walls"
dunydurceg_great_steppes_path_3_desc:0 "The first men on a wall are promised a share of the prize, which they find easier to collect if the promise was made before witnesses."
dunydurceg_great_steppes_path_4:0 "Thriving Slave Markets"
dunydurceg_great_steppes_path_4_desc:0 "The steppe markets sell people beside the stock pens, with a separate gate where the clerks tally those who cannot bargain for themselves."
dunydurceg_great_steppes_path_5:0 "Leaders from the Legions"
dunydurceg_great_steppes_path_5_desc:0 "Officers who have drawn common rations generally know when a requisition asks for more than a village has."
dunydurceg_great_steppes_path_6:0 "Aggressive Foreign Policy"
dunydurceg_great_steppes_path_6_desc:0 "The Dunydurceg envoys bring a list of terms while the opposing chiefs can still see the army's cookfires."
dunydurceg_great_steppes_path_7:0 "Diplomatic Overtures"
dunydurceg_great_steppes_path_7_desc:0 "A visiting envoy is offered a place at the council fire, where a good cloak can secure as much patience as a long pedigree."
###############################################################################################
#Eastern Navshodian Traditions
eastern_navshodian_philosophy: "Eastern Navshodian Traditions"

przykrainian_path_1: "Masters of the Rough Roads"
przykrainian_path_1_desc: "Przykrainian guides count the rough roads by the places a shield can be rested, which is a surer measure than the milestones."
przykrainian_path_2: "Light Cavalry Maneuvers"
przykrainian_path_2_desc: "The light horse practice wheeling between boundary stones, and the villages charge the regiment for any stone it moves."
przykrainian_path_3: "Garrisoned Citadels"
przykrainian_path_3_desc: "Citadel keepers lend grain to the passing companies on written tallies, so both will know whom to blame when it is gone."
przykrainian_path_4: "Forest Ambushes"
przykrainian_path_4_desc: "Archers of Przykraina pick a stand by what they can see from it and what a man on the road cannot."
przykrainian_path_5: "Navshodian Recruitment Drive"
przykrainian_path_5_desc: "Navshodian clerks send the recruiting lists out with the market wagons and hear of omissions at the next market."
przykrainian_path_6: "Standard Issue Pikes"
przykrainian_path_6_desc: "Pikes are issued to a common measure, so a replacement can be drawn from stores without sending a man to find its former owner."
przykrainian_path_7: "Daily Drilling"
przykrainian_path_7_desc: "The same drum calls the companies out each morning. The men who used to arrive at the second call now help carry it."
rossovie_path_1: "Heavy Infantry Training"
rossovie_path_1_desc: "Rossovie armorers size their harness at muster, when a man has to admit before witnesses how much leather his old coat needed."
rossovie_path_2: "Champion of the Common Man"
rossovie_path_2_desc: "When a village takes its grievance to the captain, he hears it at the granary, where the keeper can fetch the figures."
rossovie_path_3: "Heavy Cavalry Charge"
rossovie_path_3_desc: "The Rossovie horse practice the advance at a pace the rear ranks can keep, letting the men in front save their pride for the charge."
rossovie_path_4: "Elite Navshodian Legionnaires"
rossovie_path_4_desc: "The legion rolls record the quarters where the men trained and who stood surety for them. A general takes more care with names he will hear again."
rossovie_path_5: "The Cult of the King"
rossovie_path_5_desc: "The king's portrait goes beside the pay table, where it is most likely to be viewed with affection."
rossovie_path_6: "Navshodian Knights"
rossovie_path_6_desc: "Navshodian knights have the youngest riders lead their spare horses at muster, where everyone can see what will be expected of them."
rossovie_path_7: "A Unified Polity"
rossovie_path_7_desc: "When the districts send their accounts in the same form, a council can spend the afternoon on something other than the accounts."
dolnozerywian_path_1: "Probing the Enemy's Defenses"
dolnozerywian_path_1_desc: "Dolnozerywian riders come back from a probe with the names of enemy companies and, on a good day, all their own names still on the roll."
dolnozerywian_path_2: "Distant Ports of Call"
dolnozerywian_path_2_desc: "Pilots keep their own list of distant harbors, including the ones where a ship can take water without first finding a gift for the harbor master."
dolnozerywian_path_3: "Mobility Within the Social Classes"
dolnozerywian_path_3_desc: "A freed household can move up the rolls as it takes on new dues, and the clerk is generally persuaded by receipts."
dolnozerywian_path_4: "Silver Baubles and Golden Trinkets"
dolnozerywian_path_4_desc: "The merchants who bring in silver baubles come home with cloth and grain, though the baubles are easier to show to a patron."
dolnozerywian_path_5: "A Life in the Saddle"
dolnozerywian_path_5_desc: "The children learn the saddle on the way to market, and the recruiting officer has only to ask which one usually brings the horse back."
dolnozerywian_path_6: "Horses in the Hills"
dolnozerywian_path_6_desc: "In the hills a Dolnozerywian rider judges a horse by the ground it will cross at a walk, long before he tries it under a bow."
dolnozerywian_path_7: "Navshodian Crossbowman Corp"
dolnozerywian_path_7_desc: "The crossbow companies choose their ground uphill of the baggage, where a fresh bundle of bolts can still be sent up by hand."

###############################################################################################
#Eptelon Traditions
eptelon_philosophy: "Eptelon Traditions"

eptelon_army_path_1:0 "The Call for Archers"
eptelon_army_path_1_desc:0 "Eptelon keeps spare bows in the villages along the road, and the men who draw them know which orchards an invader will try first."
eptelon_army_path_2:0 "Indomitable Levies"
eptelon_army_path_2_desc:0 "The levy drill brings the light and heavy companies to the same field, so neither has to take the other's steadiness on trust."
eptelon_army_path_3:0 "Masters of Warfare"
eptelon_army_path_3_desc:0 "Eptelonian captains learn the advance in the file before they give the order from a horse."
eptelon_army_path_4:0 "The Cruel Whip"
eptelon_army_path_4_desc:0 "The captives are named on the receipt before they are handed over. The overseer is careful about his own name."
eptelon_army_path_5:0 "Training in the Badlands"
eptelon_army_path_5_desc:0 "The badlands school has no covered yard, and the drill goes ahead on whatever ground the recruits reach before noon."
eptelon_army_path_6:0 "Organized Recruitment"
eptelon_army_path_6_desc:0 "Recruiters use a common roll for adjoining towns, having found that a man entered twice seldom turns up twice."
eptelon_army_path_7:0 "Auxiliary Advancements"
eptelon_army_path_7_desc:0 "Auxiliaries rehearse with the chariot teams, whose drivers would rather mark out the lanes in chalk than explain them from a stretcher."
eptelon_navy_path_1:0 "Sinking the Enemy Fleets"
eptelon_navy_path_1_desc:0 "Eptelonian crews take their oldest hull out for ram practice, and the carpenter watches from the shore."
eptelon_navy_path_2:0 "Pensions for Sailors"
eptelon_navy_path_2_desc:0 "A sailor's pension is entered before his first voyage, when his family is most likely to ask whether the navy means to pay it."
eptelon_navy_path_3:0 "Harvester of Souls"
eptelon_navy_path_3_desc:0 "The fleet pours a little wine over the side for those the sea has taken. The living see to it that there is some left for supper."
eptelon_navy_path_4:0 "Defensive Sailing"
eptelon_navy_path_4_desc:0 "The helmsmen drill on the turn back into harbor, which is the part that gets inspected by the men who build the ships."
eptelon_navy_path_5:0 "Scaling the Ramparts"
eptelon_navy_path_5_desc:0 "Rampart crews practice on the town wall, by leave of a gatekeeper who insists they use a different stretch each week."
eptelon_navy_path_6:0 "Master Military Craftsmen"
eptelon_navy_path_6_desc:0 "The shield makers and shipwrights buy their timber together and divide the knots between them after the invoice is paid."
eptelon_navy_path_7:0 "Lords of the Ocean"
eptelon_navy_path_7_desc:0 "The harbor watch salutes a homebound crew by name, even when the admiral's banner is too wet to make out."
eptelon_Aeptelonian_path_1:0 "The First Line in Battle"
eptelon_Aeptelonian_path_1_desc:0 "Aeptelonian bowmen take their place before the shields, and are very particular about where the shields are to be when they come back."
eptelon_Aeptelonian_path_2:0 "Economic Encouragement"
eptelon_Aeptelonian_path_2_desc:0 "Estate stewards count the work by what reaches the storehouse, though they keep a rather different account of who did it."
eptelon_Aeptelonian_path_3:0 "Levies in the Mountains"
eptelon_Aeptelonian_path_3_desc:0 "Mountain levies meet their officers at the upper road, sparing both parties the trouble of pretending a wagon can get there."
eptelon_Aeptelonian_path_4:0 "Chariot Construction Workshops"
eptelon_Aeptelonian_path_4_desc:0 "The chariot sheds turn out wheels by a common measure, and a broken cart can usually be made whole from the remains of another."
eptelon_Aeptelonian_path_5:0 "The Sea Is Home to All"
eptelon_Aeptelonian_path_5_desc:0 "A crew's berth is entered by oar and bench, two particulars the harbor master finds more useful than a man's birthplace."
eptelon_Aeptelonian_path_6:0 "Heavy Weapons Initiative"
eptelon_Aeptelonian_path_6_desc:0 "The heavy companies try their new weapons on old shields, and the smiths are asked to watch from close enough to see the dents."
eptelon_Aeptelonian_path_7:0 "The Destruction of All They Hold Dear"
eptelon_Aeptelonian_path_7_desc:0 "Eptelon sends its terms after the first wall falls, while the remaining households are still deciding what they can carry."

###############################################################################################
#Etaredican Traditions
etaredican_philosophy: "Etaredican Traditions"
etaredican_jaranem_heritage_path_1:0 "Embracing Heavy Cavalry"
etaredican_jaranem_heritage_path_1_desc:0 "Jaranem riders drill in full harness early in the season, while there is still time to tell a poor fit from a poor seat."
etaredican_jaranem_heritage_path_2:0 "A Volley of Arrows"
etaredican_jaranem_heritage_path_2_desc:0 "The bow captain keeps his count audible even when the first arrows come back."
etaredican_jaranem_heritage_path_3:0 "Recruits from the Villages"
etaredican_jaranem_heritage_path_3_desc:0 "Village headmen send their next recruits with the wagons, so the army knows whom to thank for both the men and the oats."
etaredican_jaranem_heritage_path_4:0 "Heavy Horse Training"
etaredican_jaranem_heritage_path_4_desc:0 "The horse masters train the animals to stand through the noise of the yard. The apprentices are expected to learn by themselves."
etaredican_jaranem_heritage_path_5:0 "Fighting As One"
etaredican_jaranem_heritage_path_5_desc:0 "The heavy companies drill to one call, since a captain's private signal is of little use to the man beside him."
etaredican_jaranem_heritage_path_6:0 "Incentives for Commanders"
etaredican_jaranem_heritage_path_6_desc:0 "A commander earns a place on the next pay list by bringing back a company fit for another campaign."
etaredican_jaranem_heritage_path_7:0 "A Horse For Every Soldier"
etaredican_jaranem_heritage_path_7_desc:0 "The stud masters keep a separate list of mounts that can be had for a soldier's wages, which saves everyone a morning at the fair."
etaredican_bhaxnmrectem_path_1:0 "Unmatched Archers"
etaredican_bhaxnmrectem_path_1_desc:0 "Bhaxnmrectem bowmen keep their spare strings inside their coats. They have stopped lending them to visitors."
etaredican_bhaxnmrectem_path_2:0 "Secure Within Our Walls"
etaredican_bhaxnmrectem_path_2_desc:0 "The wall watch tests the shutters on a clear day, when it can still hear which hinges need oil."
etaredican_bhaxnmrectem_path_3:0 "The First to Engage with the Enemy"
etaredican_bhaxnmrectem_path_3_desc:0 "Scouts take the first watch beyond camp and are allowed to keep the small fire when they come back."
etaredican_bhaxnmrectem_path_4:0 "Catching Our Foes Unawares"
etaredican_bhaxnmrectem_path_4_desc:0 "A company that comes home from an ambush with most of its kit earns more praise from the quartermaster than it is accustomed to."
etaredican_bhaxnmrectem_path_5:0 "Trained In Tough Terrain"
etaredican_bhaxnmrectem_path_5_desc:0 "Hill recruits practice on ground where a dropped bundle of arrows may not stop until it reaches the road."
etaredican_bhaxnmrectem_path_6:0 "The Will to Fight"
etaredican_bhaxnmrectem_path_6_desc:0 "Returning levies find places kept for them on the muster roll, even when their farms have been less obliging."
etaredican_bhaxnmrectem_path_7:0 "A Bottomless Barrel"
etaredican_bhaxnmrectem_path_7_desc:0 "The clerk keeps a fresh tablet under the levy list. There is always another hamlet whose headman insists the first notice never came."
etaredican_civilizing_path_1:0 "The People Rejoice"
etaredican_civilizing_path_1_desc:0 "The fair can keep its usual games when the levy is home, though the champion has to remember which spear he brought."
etaredican_civilizing_path_2:0 "Skillful Shipwrights"
etaredican_civilizing_path_2_desc:0 "The Etaredican yards set their ribs by a common pattern, and a shipwright can go to another harbor without starting his apprenticeship again."
etaredican_civilizing_path_3:0 "Leading From the Front"
etaredican_civilizing_path_3_desc:0 "A captain who takes the front watch learns which men need boots before their request reaches his tent."
etaredican_civilizing_path_4:0 "Lords of the High Seas"
etaredican_civilizing_path_4_desc:0 "The high sea crews eat the first meal out of harbor at their benches, when a new man is least inclined to ask for a larger share."
etaredican_civilizing_path_5:0 "An Accepting Attitude"
etaredican_civilizing_path_5_desc:0 "A newcomer may keep his own feast days so long as he can find someone willing to trade watches."
etaredican_civilizing_path_6:0 "Armies For Hire"
etaredican_civilizing_path_6_desc:0 "Hired companies bid for a season's service on a single roll, which does away with a surprising number of their separate expenses."
etaredican_civilizing_path_7:0 "Etaredican Architects"
etaredican_civilizing_path_7_desc:0 "Etaredican builders send the stone list ahead of the masons, who prefer to spend their first day on the site doing something billable."
###############################################################################################
#Flusenlander Migrators Traditions
flusenlander_migrators_philosophy: "Flusenlander Migratory Traditions"
flusenlander_tribal_heritage_path_1:0 "The Way of Our Ancestors"
flusenlander_tribal_heritage_path_1_desc:0 "A Flusenlander elder teaches a child to count the herds from the saddle, and only corrects the count once the child can ride alongside."
flusenlander_tribal_heritage_path_2:0 "An Elegant Court"
flusenlander_tribal_heritage_path_2_desc:0 "At court the chiefs sit in order of precedence, which gives them a new subject to dispute while the steward collects their seals."
flusenlander_tribal_heritage_path_3:0 "Hard-Riding Horsemen"
flusenlander_tribal_heritage_path_3_desc:0 "Flusenlander horse archers drill on the far side of the winter pasture, where a rider who loses the file has a long way to consider it."
flusenlander_tribal_heritage_path_4:0 "Elite Charioteers"
flusenlander_tribal_heritage_path_4_desc:0 "The chariot families keep a second list of riders who can take a horse into battle when the carts have to stay behind."
flusenlander_tribal_heritage_path_5:0 "Thinking On Our Feet"
flusenlander_tribal_heritage_path_5_desc:0 "A Flusenlander captain changes the march when the baggage falls behind. The route on the map can be corrected at leisure."
flusenlander_tribal_heritage_path_6:0 "Protected Light Levies"
flusenlander_tribal_heritage_path_6_desc:0 "Light companies draw broad shields from the clan stores, with the old owner's mark left where the new man can see it."
flusenlander_tribal_heritage_path_7:0 "The Lust for Glory in Battle"
flusenlander_tribal_heritage_path_7_desc:0 "The men who come to replace a fallen cousin usually arrive before the formal summons and ask for his place by name."
flusenlander_culture_path_1:0 "Iron Fetters and Branded Foreheads"
flusenlander_culture_path_1_desc:0 "The fetters are counted out with the other stores, in a column that does not record the people they are intended for."
flusenlander_culture_path_2:0 "A Slave Economy"
flusenlander_culture_path_2_desc:0 "The household receives its allotment of forced labor with a receipt, and the people sent there receive nothing they can keep."
flusenlander_culture_path_3:0 "Heavy-Handed Administrators"
flusenlander_culture_path_3_desc:0 "The collectors call at the same houses each season, so the village has learned to dispute the amount rather than the date."
flusenlander_culture_path_4:0 "Flusenlander Arrowheads"
flusenlander_culture_path_4_desc:0 "Flusenlander smiths bundle arrowheads by weight, and the bowmen can tell which smith sent a batch without opening the wrapping."
flusenlander_culture_path_5:0 "A Surge of Manpower"
flusenlander_culture_path_5_desc:0 "The headmen divide the muster by valley, where relatives can be relied on to know who is claiming to be sick."
flusenlander_culture_path_6:0 "Towering Ramparts"
flusenlander_culture_path_6_desc:0 "The wall grows by another course each summer, and the old watchmen are beginning to regret asking for a better view."
flusenlander_culture_path_7:0 "A Culture of Aggression"
flusenlander_culture_path_7_desc:0 "A neighboring chief who calls the raids a new outrage is invited to consult the older frontier accounts."
flusenlander_horsemen_path_1:0 "The Open Field"
flusenlander_horsemen_path_1_desc:0 "Flusenlander riders take the open field for drill, where a captain can see how far his least eager horse lags behind."
flusenlander_horsemen_path_2:0 "Armored Chariots"
flusenlander_horsemen_path_2_desc:0 "The armorers hang the iron from the harness before the first run. A horse that objects is allowed a hearing."
flusenlander_horsemen_path_3:0 "Shooting From the Saddle"
flusenlander_horsemen_path_3_desc:0 "A recruit begins with the saddle and an empty bow hand, which gives him that much less to drop."
flusenlander_horsemen_path_4:0 "Bloodthirsty Mounts"
flusenlander_horsemen_path_4_desc:0 "The remount buyers favor horses that eat well and turn quickly. A poor disposition is priced separately."
flusenlander_horsemen_path_5:0 "Secure In Their Abilities"
flusenlander_horsemen_path_5_desc:0 "The heavy horse stand saddled while the scouts are out, passing the time by finding fault with the other companies' girths."
flusenlander_horsemen_path_6:0 "Feats of Glory and Renown"
flusenlander_horsemen_path_6_desc:0 "A light rider can earn a verse by carrying a message through a lost battle, though he has to live long enough to correct it."
flusenlander_horsemen_path_7:0 "An Impressive Culture"
flusenlander_horsemen_path_7_desc:0 "Foreign envoys are shown the herds before the council fire, where they are given some time to revise their offers."
###############################################################################################
#Forest Elf Traditions
forest_elf_philosophy: "Wood Elf Traditions"

forest_elves_morrigon_path_1:0 "Blending Into the Treeline"
forest_elves_morrigon_path_2:0 "Unimpeded by Terrain"
forest_elves_morrigon_path_2_desc:0 "The Morrigon guides leave the road where the carts begin to bog down, and meet them at the next village if the carts are fortunate."
forest_elves_morrigon_path_3:0 "Stationed in the Treetops"
forest_elves_morrigon_path_3_desc:0 "A watcher takes his bow up the tree before dawn. His relief knows which branches to avoid by the marks left by the last one."
forest_elves_morrigon_path_4:0 "Every Elf is an Archer"
forest_elves_morrigon_path_4_desc:0 "Children bring staves to the village bowyer and collect the sound ones on their way back from lessons."
forest_elves_morrigon_path_5:0 "The Gentle Hand of the Woods"
forest_elves_morrigon_path_5_desc:0 "The woodland reeve brings his bowmen along when a subject village asks to see him. He brings fewer the following year if the meeting goes well."
forest_elves_morrigon_path_6:0 "To Serve is To Live"
forest_elves_morrigon_path_6_desc:0 "A captain who has served the same wood since his first watch knows whose roofs he would be leaving behind."
forest_elves_morrigon_path_7:0 "Stability Within Society"
forest_elves_morrigon_path_7_desc:0 "The village keeps its watch and harvest lists in the same chest, where each household can see who has done its share of both."
forest_elf_eastlanders_path_1:0 "Crossbowmen Commanders"
forest_elf_eastlanders_path_1_desc:0 "Eastlander crossbow captains keep a rack of loan weapons, so a recruit's first lesson need not wait for his father to settle with a bowyer."
forest_elf_eastlanders_path_2:0 "Embracing Our Ways"
forest_elf_eastlanders_path_2_desc:0 "The new households learn the market calls before the court forms, and the clerk hears the difference when they come to sign their names."
forest_elf_eastlanders_path_3:0 "A Life of Service to the State"
forest_elf_eastlanders_path_3_desc:0 "The forest service keeps its old soldiers on the village rolls as instructors, which put an end to the council's question of what they did all winter."
forest_elf_eastlanders_path_4:0 "Devastating Attacks From Afar"
forest_elf_eastlanders_path_4_desc:0 "Crossbow files practice waiting for the call while the target is still hard to make out. The men who aim early generally have time to aim again."
forest_elf_eastlanders_path_5:0 "Assured Footing in Difficult Places"
forest_elf_eastlanders_path_5_desc:0 "The hill companies test the ledge before setting out their bolts, an order of business the drill book learned from experience."
forest_elf_eastlanders_path_6:0 "Endless Reserves"
forest_elf_eastlanders_path_6_desc:0 "The reserve rolls are kept by ward, and a forester who knows one quiet path out of a village usually knows where to find the men on it."
forest_elf_eastlanders_path_7:0 "Superior Crossbow Training"
forest_elf_eastlanders_path_7_desc:0 "Eastlander crossbowmen learn how long their neighbors take to reload, particularly if their neighbors have been exaggerating."
forest_elf_heart_path_1:0 "Fortresses in the Forests"
forest_elf_heart_path_1_desc:0 "Forest keeps leave the approach under trees, so the defenders may judge an enemy's progress by what falls quiet."
forest_elf_heart_path_2:0 "Masters of Tracking"
forest_elf_heart_path_2_desc:0 "Trackers read a column's passage in bent undergrowth. The officers following behind are asked to leave the same courtesy to nobody."
forest_elf_heart_path_3:0 "Slipping Through The Glades"
forest_elf_heart_path_3_desc:0 "A foot company takes only what it can carry between the trunks, and the baggage clerk learns to write a shorter list."
forest_elf_heart_path_4:0 "Stud Farms in the Woodlands"
forest_elf_heart_path_4_desc:0 "Woodland studs breed for horses that will come home over roots in the dark, a quality the noble buyers have learned to ask about."
forest_elf_heart_path_5:0 "The Upper Classes Rejoice"
forest_elf_heart_path_5_desc:0 "The forest households grant their lords a season away with the horse, provided the lords first settle who is to pay for the road."
forest_elf_heart_path_6:0 "Drilling Year Round"
forest_elf_heart_path_6_desc:0 "The drill carries on under the trees in bad weather, although the recruits are given to understand there was once a dry season."
forest_elf_heart_path_7:0 "Death From the Treetops"
forest_elf_heart_path_7_desc:0 "A forest company knows which tree holds the bowman above it. An army new to the wood is usually counting trees for another reason."

###############################################################################################
#High Elven Philosophy
high_elven_philosophy: "High Elven Traditions"
high_elven_infantry_path_1:0 "Pikemen Levies"
high_elven_infantry_path_1_desc:0 "A pike levy draws its weapons from racks built to one measure. Even the proudest family is asked to return the one it borrowed."
high_elven_infantry_path_2:0 "For the Glory of the High Elves!"
high_elven_infantry_path_2_desc:0 "The High Elven recruiting officers read the honors won by the last levy before they read the names of the next one."
high_elven_infantry_path_3:0 "Iron Cuirasses"
high_elven_infantry_path_3_desc:0 "The armorer checks that a cuirass will let its owner bend at the waist. A coat made for a review may need some work before it goes to war."
high_elven_infantry_path_4:0 "Mixed-Unit Training"
high_elven_infantry_path_4_desc:0 "Light and heavy companies share a drill ground, and each is given an afternoon to find out how slow the other has to move."
high_elven_infantry_path_5:0 "Constructing the Mage Towers"
high_elven_infantry_path_5_desc:0 "The mage towers have store rooms as well as observatories. When talks begin, the envoys are shown the rooms from which supplies have lately gone missing."
high_elven_infantry_path_6:0 "Elven Inevitability"
high_elven_infantry_path_6_desc:0 "Elven quartermasters arrange the march with local stewards, who are more disposed to cooperate when they know how many carts to expect."
high_elven_infantry_path_7:0 "Recruitment Bonuses"
high_elven_infantry_path_7_desc:0 "The recruiting table shows the advance in coin, sparing the young the trouble of weighing the officer's account of glory."
high_elf_colonial_path_1:0 "Crossbowmen Militias"
high_elf_colonial_path_1_desc:0 "Colonial households keep their crossbows by the door and draw bolts from the ward chest, whose keeper is elected by the people who have to return them."
high_elf_colonial_path_2:0 "Overseas Colonies"
high_elf_colonial_path_2_desc:0 "The first colonial party sends back a tally of what the soil will grow and how long the nearest gate stood against them."
high_elf_colonial_path_3:0 "Securing Trade by Any Means Possible"
high_elf_colonial_path_3_desc:0 "The trade factor travels with crossbowmen, who are paid out of the account for opening new markets."
high_elf_colonial_path_4:0 "The Desire for Plunder"
high_elf_colonial_path_4_desc:0 "Crews are offered a share of the cargo, and the clerk's use of that word makes it possible to enter everything in a single column."
high_elf_colonial_path_5:0 "Embracing Life At Sea"
high_elf_colonial_path_5_desc:0 "The port families keep their sons on the crew rolls between voyages, and the yards fit out the next hull with men who remember the last one."
high_elf_colonial_path_6:0 "Relaxed Recruitment Standards"
high_elf_colonial_path_6_desc:0 "A recruit can give his oath in the tongue he knows, provided he learns the words the crossbow captain actually uses."
high_elf_colonial_path_7:0 "High Elven City Construction"
high_elf_colonial_path_7_desc:0 "The surveyors stake out room for the market before the walls go up, since moving a wall is easier than moving a prosperous market."
high_elf_cavalry_path_1:0 "Mastering the Iron Wheel"
high_elf_cavalry_path_1_desc:0 "An iron rim lasts through a run on hard ground, and the harness maker is the next to hear where the cart has been."
high_elf_cavalry_path_2:0 "Blacksmithing Breakthroughs"
high_elf_cavalry_path_2_desc:0 "Smiths save offcuts for chariot fittings, which the light horse also draw upon whenever an officer is looking the other way."
high_elf_cavalry_path_3:0 "Mounted Generals"
high_elf_cavalry_path_3_desc:0 "A mounted commander inspects the studs that furnish his own regiment, and the estates have learned to keep their best horses where he can see them."
high_elf_cavalry_path_4:0 "A Focus on Light Cavalry"
high_elf_cavalry_path_4_desc:0 "The light riders buy their mounts for endurance at the common fairs, where a spirited horse can be had cheaply after the nobles have passed it over."
high_elf_cavalry_path_5:0 "Learning On the Battlefield"
high_elf_cavalry_path_5_desc:0 "Crews mark the broken axles on the muster tablet, beside the names of drivers who had warned about that turn."
high_elf_cavalry_path_6:0 "Chariots of Doom"
high_elf_cavalry_path_6_desc:0 "The ruler reviews the ironbound carts at the opening of each campaign. Children are permitted to count them from behind a stout fence."
high_elf_cavalry_path_7:0 "Elven Horselords"
high_elf_cavalry_path_7_desc:0 "Elven grooms teach a horse to stand while riders jostle beside it, which saves the captains from having to teach the riders much patience."
###############################################################################################
#Orcish Philosophy
orcish_philosophy: "Orcish Traditions"

orcish_warrior_defensive_path_1:0 "The Last Thing Our Enemies Will See"
orcish_warrior_defensive_path_1_desc:0 "The Orcish front rank counts on being seen before it reaches the enemy, and polishes nothing that would make it visible any sooner."
orcish_warrior_defensive_path_2:0 "A Thirst For Blood"
orcish_warrior_defensive_path_2_desc:0 "Orc companies choose a ridge they know how to come down, having more confidence in the descent than in an enemy's judgment of distance."
orcish_warrior_defensive_path_3:0 "Scattering Their Forces"
orcish_warrior_defensive_path_3_desc:0 "The bow captain walks the line once the enemy files separate, since the archers must see for themselves which groups are still listening to orders."
orcish_warrior_defensive_path_4:0 "Impenetrable Walls"
orcish_warrior_defensive_path_4_desc:0 "Orc masons keep the outer wall plain where it can be reached from below. They leave the fine work for people who can afford a second wall."
orcish_warrior_defensive_path_5:0 "Hardship Suits Us Just Fine"
orcish_warrior_defensive_path_5_desc:0 "An Orcish march rolls up its tents while the ground is still wet, a habit the baggage carriers prefer to praise after they have put them down again."
orcish_warrior_defensive_path_6:0 "Protections For Light Infantry"
orcish_warrior_defensive_path_6_desc:0 "The light companies take spare shields from the watch stores, and return enough of them that the keeper has stopped objecting."
orcish_warrior_defensive_path_7:0 "Orcish Garrisons and Citadels"
orcish_warrior_defensive_path_7_desc:0 "The garrison leases its spare rooms to travelers in quiet years, and the gatekeeper can recite exactly how many quiet years there have been."
orcish_seafaring_path_1:0 "Destined To Rule the Sea"
orcish_seafaring_path_1_desc:0 "Orc crews take new hulls out beside the old ones, whose captains are charged with teaching them which dents to avoid acquiring."
orcish_seafaring_path_2:0 "Calling All Sailors"
orcish_seafaring_path_2_desc:0 "The harbor criers recruit on market morning, when the crews can hear the offer and the captains can see who has already spent his advance."
orcish_seafaring_path_3:0 "Fighting From Ship To Ship"
orcish_seafaring_path_3_desc:0 "Boarding crews claim sound prizes for the fleet, and their captains are expected to board before declaring a hull beyond repair."
orcish_seafaring_path_4:0 "Saltwater For Blood"
orcish_seafaring_path_4_desc:0 "An Orcish mate knows which bench will flood first, and gives it to the man most likely to mention it."
orcish_seafaring_path_5:0 "Skillful Boatwrights"
orcish_seafaring_path_5_desc:0 "The big hulls are built to take fittings from one another, an economy no boatwright cares to mention at a launching."
orcish_seafaring_path_6:0 "Squeezing Their Throats"
orcish_seafaring_path_6_desc:0 "Blockading captains count the boats that turn back at the harbor mouth. The customs men on shore keep a shorter list."
orcish_seafaring_path_7:0 "Orcish Naval Traditions"
orcish_seafaring_path_7_desc:0 "A green Orcish crew is issued old hands from several ships, with no two from the same bench if the muster clerk can help it."
orcish_sea_trader_path_1:0 "Slavery Is Preferable To Death"
orcish_sea_trader_path_1_desc:0 "The captives who reach the Orcish quay are offered no choice in the matter, though the sale ledger records that mercy was shown."
orcish_sea_trader_path_2:0 "High-Value Exports"
orcish_sea_trader_path_2_desc:0 "The export factors weigh the best cargo in view of the buyers and keep the rest under canvas until the first price is agreed."
orcish_sea_trader_path_3:0 "Orcish Trade Guilds"
orcish_sea_trader_path_3_desc:0 "The Orcish guilds keep a spare berth for a trader who pays his dues, and a spare clerk for the trader who says he has."
orcish_sea_trader_path_4:0 "Slave Economies"
orcish_sea_trader_path_4_desc:0 "The brokers send forced labor where the port needs it, with freight receipts that tell the recipient everything except how to address the people arriving."
orcish_sea_trader_path_5:0 "Sailing Far and Wide, Searching For Plunder"
orcish_sea_trader_path_5_desc:0 "Orc pilots keep water charts for coasts where the harbor bells never ring for their sails."
orcish_sea_trader_path_6:0 "Counting Coins From Every Nation"
orcish_sea_trader_path_6_desc:0 "The guild weighers keep a box of foreign coins by the scales, which settles most disputes over what a visiting merchant calls silver."
orcish_sea_trader_path_7:0 "An Open Society"
orcish_sea_trader_path_7_desc:0 "The port rolls are open to households that take on the guild dues, though a new name earns no credit until the first payment clears."

# Snakefolk
snakefolk_philosophy:0 "Ular-Pria Traditions"

snakefolk_warrior_path_1:0 "A Land of Foilage and Snakes"
snakefolk_warrior_path_1_desc:0 "A motto nestled deep within the sacred values of serpentkind, the #Y Ular-Pria#! consider their very existence to be synonymous with that of #G Austropetolia#! whole. To respect your homeland is to yield for yourself all of its bounties, for it protects you, it feeds you, and it shields you, such is the ethos of any general made well endowed by the spirits of war. A competent leader is thus able to not only sustain their cohorts with only the most basal of resources avaialble to them, but to as well utilize the very land against those forces of opposition that greater than their own.\n\n Traps such as pitfalls and snares prove to be one of the many hallkmarks of snakefolk warfare, alongside strategies such as trench warfare which can make any band of relatively fewer serpents into a force nigh impossible to dislodge."

snakefolk_warrior_path_2:0 "Mastery of the Coiled Cobra Technique"
snakefolk_warrior_path_2_desc:0 "It was after the demise of the #Y Ular-Pria#! lakanate did warfare in much of #G Austropetolia#! begin to shift from large, professional troops sourced from all across the provinces, and into smaller, more tight-knit units that placed a large emphasis on ritualized one-on-one confrontations due to the depopulated nature of the snakefolk homeland. With the sinking of much of the land's natural sources of metal, there began a flourishing of ligthly armored warfare within the newly dotted islands of serpentkind, and to match this emergent style of apparel, new weapons were needed in order to combat against them. \n\nThus forged the mighty kris, a blade tempered like lightning. In the following years after its invention, the new style of sword began spreading all across the lands of the #Y Ular-Pria#!, and wtith them soon came the rise of numerous techniques based around this one blade. There are many such schools all across the islands inhabited by the snakefolk, but among them one stands out due to its popuarity and range, with its many skills laying the foundations of adjacent orders, the 'Stance of the Coiled Cobra' is meant to be used defensively, in that it eaches its practitioners to evade blows until finally, their opponent has been worn out sufficiently so that they may deliver the final strike."

snakefolk_warrior_path_3:0 "Glorification of the Warrior Broods"
snakefolk_warrior_path_3_desc:0 "During the later stage of the lakanate, in which the country became less and less centralized as the eleventh and final dynasty could no longer keep reigns upon the state, the emergence of the warrior class had begun after two bouts of military protest, in which the armies of the land began clamoring for compensation from the weakening government due to their role in suppressing numerous civilian uprisings. In order to placate those angered cohorts, extra privileges were endowed upon snakes of militant service, and as well with the assurance of allotted land in their following years of retirement. \n\nThus, many of serpentkind's modern nobility can trace their lineage back to those ancient warriors from before the #Y Great Collapse#! of #G Omniluxia#!, and thus seek to keep ablaze their warrior heritage by rearing their youth within the rank and file confines of local warbands."

snakefolk_warrior_path_4:0 "Fangs of Serpentkind"
snakefolk_warrior_path_4_desc:0 "Even though much of the great castles of #G Austropetolia#! have sunk beneath the waves, the #Y Ular-Pria#! remain skilled in the art of siege warfare. In fact, within the many warbands of serpentkind there exists a distinct type of warrior whose skills make them both admired and feared by their fellow snakes at arms, known by the hushed named of 'pemuhbunek'. They are the left-hands of espionage and the right-hands of assassination, tasked primarily with the matters of helping take fortresses rather than claiming victory in plain combat. \n\nNot only that, they are also educated to be exceptional provisioners, capable of hunting their quarry not only within the confines of a citadel complex, but as well among the overgrowth of the jungle floor."

snakefolk_warrior_path_5:0 "Of Silk and Poisons"
snakefolk_warrior_path_5_desc:0 "There exist very few metal deposits among the isles of #G Austropetolia#!, and so the snakefolk thus resort to new methods of warfare when faced with the dangers of enemy combatants. Typical #Y Ular-Pria#! armors are made using boiled leather strung underneath a layer of silk fabrics to serves as cushion to help soften blows. \n\nThis type of protection is used primarilly by those warriors who stand well above the ordinary foot soldier, with the base exception being those archers who wield the infamous longbows of #G Austropetolia#!, whose arrows are tipped within a poisonous substance local to their respective polities."

snakefolk_warrior_path_6:0 "In Memory of the Lakanate"
snakefolk_warrior_path_6_desc:0 "Within the recent years of serpentkind's history, there has emerged a movement that has sought out the rememberance and glorification of the lakanate of old, wishing to emulate the highly urbanized world their ancestors had lived in. As such, many noble households desire to shift from the their decentralized mode of mobilization, and invest their resources in a professional army, paired with state militias funded directly by subordinate governments. \n\nThough, more often than not did these attempts fails, the efforts of past figures are still recognized in this day and age, where hoepfully more successful governments can attain what they could not."

snakefolk_warrior_path_7:0 "The Hooded Ones"
snakefolk_warrior_path_7_desc:0 "Towards the great empires of man who reign upon the southern landmasses, those capable of utilizing magic are detested as abominations who must be purged. To the northern archipelago of Asutropetolia, however, magic is still celebrated as something not only for its practical purposes, but as well for its spiritual origins. Serpentkind believed that through the blessings of their ancestors, of the prophets and great snakes before them, Ruh is able to flourish within the souls of #Y Ular-Pria#!. \n\nThough most do not seek out its benefits, and instead seek to maintain those worldly matters that concern them, for those who seek to empower their spirit with mastery of the arcane, then they must look no further than towards the 'sorkobray', the Hooded Ones. A monastic order of esoteric wild mages who seek to safeguard all of serpentkind through mysterious works, it is their agents who make up the majority of the magic users in #G Austropetolia#!. To have a member of such an order join your ranks government is an event of extreme prestige among the snakefolk states, with their knowledge in militant commands and mystical forces knowing no bounds."

snakefolk_pirate_path_1:0 "Taming of Sea Monsters"
snakefolk_pirate_path_1_desc:0 "While the skin of the last World Serpent became the #Y Ular-Pria#!, with his blood forming the seas surrounding and his corpse itself thus degrading into the lands uncountable, the tongue of Ssertryss became something similar to its parent body. Possessed of the wriggling movements of a worm, this squirming piece of a cadaver burrowed itself deep into the confines of the underground, and there it gestated until its forked tip grew heads, becoming the first and last hydra. \n\nIn time, the two heads yearned to love one another in a way they had never known prior, and thus split themselves in half, one male and female, and so copulated which then filled the depths of the earth with serpentine monsters. When the #Y Great Collapse#! of #G Omniluxia#! befell #G Austropetolia#!, it opened rifts for which the serpents below used to slither free into the waters above. Since then, the #Y Ular-Pria#! have accustomed themselves to the presence of their bestial cousins, using them as mounts of war whenever possible."

snakefolk_pirate_path_2:0 "Crab Claw Sails"
snakefolk_pirate_path_2_desc:0 "Well attributed to the serpentkind's ancient ancestors, the crab claw sail has served the #Y Ular-Pria#! well into the modern age, allowing for a great deal of mobility after the #Y Great Collapse#! of #G Omniluxia#!. In the ancient days, crab claw sails were primarily used by small fishing vessels and trading ships who traversed the inland sea that separated Weaglia from the northern landmass of Old Austrohua. \n\nThough used sparsely by those coastal peoples of the past, vessels designed specifically for conflict  were few and far between among the #Y Ular-Pria#!, who concerned themselves primarily with the development of land-based combat. After the waves rose, however, the importance of naval warfare became exemplified, and the new waterways became filled with a distinct type of war vessel, the 'karuakua', utilizing the same crab claw sails that had long benifitted serpentkind."

snakefolk_pirate_path_3:0 "Auxiliary Vessels"
snakefolk_pirate_path_3_desc:0 "The role of auxiliary ships cannot be understated within the world of #Y Ular-Pria#! warfare. Though they do not typically play any actual combative roles in a conflict, they are integral for supplying their comrades in arms for the many days they may spend out upon the open waters. \n\nInitially, most auxiliary ships were simple priavteers, hired by disparate datus in order to raid the settlements of enemy states and distribiute the goods back to allied vessels. In time, they became standardized among the many polities of #G Austropetolia#!, constructing whole ships with the designation of an auxiliary vessel who harbored state goods rather than looted possessions."

snakefolk_pirate_path_4:0 "Songs Upon the Water"
snakefolk_pirate_path_4_desc:0 "Among the snakefolk of #G Austropetolia#!, there exists a tradition distinct from those foreign warmbloods surrounding them. A type of war ritual that is meant to invigor the souls of all sailors, the 'tapuaka' is ordained under the command of seasoned veterans who have survived more than ten engagements in their lifetime. Accompanied by the sage powers of a wild-mage, the tapuaka's powers are said to gift the recipients with a spirit similar to that of a vicious beast. \n\nWarriors who have undergone such an experience are witnessed to have displayed an unparalleled efficiency in combat, as if they were possessed by the spirits of vengeful deceased."

snakefolk_pirate_path_5:0 "The Art of Goading the Krait"
snakefolk_pirate_path_5_desc:0 "A remnant of the lakanate times, the 'art of goading the krait' is an ancient strategem developed by the admirals of old during their invasion of the savage orc lands. Though many technologies from that period were paired extensively with this tactic, as bombardment from lantaka canons proved to be devestating against the orcanish citadels, the modern #Y Ular-Pria#! make due with their current situation as they always have in the face of extremity. \n\nNow it is the sling that proves to be the most common of ranged equipment as is seen upon the decks of karakoas, with whole cohorts of slingers able to propel volleys of lightweight explosives into the ranks of any coastal village."

snakefolk_pirate_path_6:0 "Floating Nests of Old Austrohua"
snakefolk_pirate_path_6_desc:0 "Back in those ancient days, the waters of the now expanded Ular-Orcanish Gulf were home to a strange and culturally distinct group of snakefolk, whose tongue was an isolate in comparison to the predominant Prianukra language family. These snakes were the one-hundredand-and-ten clan of the tribe of Ouasuarand, as they are named in the Sayujuro Annals, as well as the myths of their descendents who dot the southern islands. \n\nThey lived in large vessels that could dwarf whole palaces on the mainland, and in these trameandous boats they gathered as a community upon the high seas, spending their whole lives here as one. Though the practice of living primarily upon the waves has since been relegated to only a few populations dispersed across the archipelago of #G Austropetolia#!, their designs have since been modified to act more as floating castles by those more martially inclined. "

snakefolk_pirate_path_7:0 "The Right of Karohung"
snakefolk_pirate_path_7_desc:0 "Conflict and bloodshed, these are the two constants that dictate how we live. To be strong is to inflict such things, and to be moral and correct is to be strong. Such is the ethose of much of serpentkind, as such it is considered a simple facet of life that slavery is to be abundant from the western archipelago to the eastern isles. \n\nThe snakefolk as a whole view their people as strong, and thus consider it to be their birthright to enslave those foreign lessers they deem inferior to their blood."

snakefolk_state_path_1:0 "The Elite of Serpentkind"
snakefolk_state_path_1_desc:0 "The nature of #G Austropetolia#!'s jungle floors and hillish terrain makes it a place suited primarilly for light-weight combatants, and paired with its lack of natural ore deposits, heavy armored infantry are a rarity here in the isles. But when they do make an appearance upon the battlefield, the bronze-scaled nobles of serpentkind are among some of the finest warriors to make battle within the lands of #G Austropetolia#!. \n\nIt is a tradition reserved only for the most valiant of aristocratic children, protected head to toe in imported metal from #Y Arteon#!. However, that was all in the past, for now there exists those islands and coastlines that have reemerged with treasures to be had, allowing for serpentkind to begin mining their own metals, and forging their own designs."

snakefolk_state_path_2:0 "The Striking Swarms"
snakefolk_state_path_2_desc:0 "To move as a ravenous horde is simple and without precision, but to march as a legion with the utmost efficiency and discipline, that is a work of art. With the return of heavy armored infantry into the world of snakefolk warfare, there has been a shift in tactics to better integrate this reemergent type of warrior within the ranks of the military. \n\nThe creation of the 'kamipulon' is thus required to arm these men and women of war, a greatsword endowed with much strength, it is often used by its wielders with the intent of taking the heads of their slain enemies."

snakefolk_state_path_3:0 "Snake Faced Shields"
snakefolk_state_path_3_desc:0 "Bedecked with inconogrophy displaying the natural and spiritual worlds that surround the snakefolk of #G Austropetolia#!, the infamous 'sampsanka' targe is a well known piece of equipment made famous in the north in #Y Arteon#! through the many skirmishes between humnanity and serpentkind, making them a highly requested import among the maritime trade lines of the northern isles. \n\nRound-bodied and composed of boiled leathers, sharp copper edges, a braided wooden surface, and a golden middle are the typical makeup of these kinds of shields."

snakefolk_state_path_4:0 "The Path of Perpetual Violence"
snakefolk_state_path_4_desc:0 "War is something the snakefolk have well accustomed themselves to, and as such view it as a way of life no different than an artist would consider their own profession. It seen as something awe inspiring, a chance for the meek to rise above those who have grown lazy and indulgent. Among the states of #G Austropetolia#!, the recruitment of slaves and commoners is a common method by which to recruit eager, and cheap, bodies to take on the more dangerous of military assignments as opposed to sending out those noble children of the ruling aristocracy. \n\nThough many would be offput by such perils, it is all but made up for in the rewards and prestige one can accumulate in this line of work. A chance to become a noble in their own right, there are those  who flock towards these warrior groupings in the hope of finding acceptance amidst their ranks"

snakefolk_state_path_5:0 "The Onokuwal"
snakefolk_state_path_5_desc:0 "The 'onokuwal' are a type of independent warband who yield to no one state, only fighting for sheer thrill of combat, and as well as the supplies needed to maintain their way of life. They are often hard to dislodge, and even the most staunch of datus know better than to pick a fight with these people. \n\nAs such, they have simply co-opted well into the state of warfare within #G Austropetolia#!, with even whole communities across the archipelago taking up such a profession as a source of income and alliance with neighboring polities."

snakefolk_state_path_6:0 "The Spirit of All Snakes"
snakefolk_state_path_6_desc:0 "In the myths of serpentkind, there exists the mention of a collective will that inhabits the souls of all snakes. Considered the ghost of all #Y World-Serpents#!, this raging force is what animates all of serpentkind into a fighting frenzy when needed. It is why they consider all other types of peoples to be inferior, for they do not possess the same 'spirit-energy' like they do.\nCalled 'apamana', the snakefolk view it almsot in the same vein as Ruh, only that it occupies that same space in their souls and works in tandem with it. Whereas as Ruh powers a magical act, Apamana is used for when a serpent finds themselves in more mental and physical situations, able to utilize their burning will to overcome any obstacle."

snakefolk_state_path_7:0 "The Oaths of Leadership"
snakefolk_state_path_7_desc:0 "To lead armies is considered something that should be reserved to a type of person who is not only militarily capable, but as well as morally willed and strong. To entrust someone with the protection of your community, as well as the lives of those men and women they are to lead, to make someone a leader of warriors comes at no easy decision, and people who are chosen for this profession are tested in order to prove themselves in the face of their superiors. \nAs such, the role of oaths and loyalty cannot be overstated within the militaries of serpentkind, for it is what dominates the ranked nature of their armies."


###############################################################################################
#Goblins
goblin_philosophy: "Goblin Traditions"

skyreach_goblin_path_1:0 "Mountain Warriors"
skyreach_goblin_path_1_desc:0 "The Skyreach goblins keep their armored watch at the top of the pass, where a stranger must stop for breath before giving his name."
skyreach_goblin_path_2:0 "Goblin Forts"
skyreach_goblin_path_2_desc:0 "Goblin masons build with the stone already underfoot, which leaves the quartermaster with no road on which to lose the consignment."
skyreach_goblin_path_3:0 "A Proud People"
skyreach_goblin_path_3_desc:0 "At a Skyreach oath taking the new freemen bring their households, who are free to remind them afterward what they promised."
skyreach_goblin_path_4:0 "Border Outposts"
skyreach_goblin_path_4_desc:0 "The first goblin outpost on a road is often a roof over a spring, with a second roof added when people start quarreling over the first."
skyreach_goblin_path_5:0 "Goblin Infantry"
skyreach_goblin_path_5_desc:0 "The hill companies carry what they can lift with one hand on the rock. Visitors tend to bring two hands' worth of advice."
skyreach_goblin_path_6:0 "Endless Tribute"
skyreach_goblin_path_6_desc:0 "Tribute comes down in baskets sized for the paths, and the collector has learned not to ask why the largest baskets are always at the bottom."
skyreach_goblin_path_7:0 "Apotheosis Of Dwarvenkind"
skyreach_goblin_path_7_desc:0 "Skyreach patrons keep light horses in the low valleys, where they can review the troop without having to admit a horse is of little use at home."
lone_goblins_path_1:0 "High Spirits"
lone_goblins_path_1_desc:0 "The Lone companies rest their spear shafts across their knees when the watch is long. Passing officers sometimes mistake this for ease."
lone_goblins_path_2:0 "Unstoppable Forces"
lone_goblins_path_2_desc:0 "A goblin hill company knows the way round a slope that an enemy considers already secured."
lone_goblins_path_3:0 "Scorched Earth Tactics"
lone_goblins_path_3_desc:0 "The goblins take the millstones with them when they leave. They learned the expense of replacing one from the last army that came through."
lone_goblins_path_4:0 "Stocked Citadels"
lone_goblins_path_4_desc:0 "The citadel steward keeps the oldest grain where the watch can smell it cooking, an arrangement that encourages the rest of the stores to stay fresh."
lone_goblins_path_5:0 "An Equitable Society"
lone_goblins_path_5_desc:0 "A goblin who takes a place on the citizen roll is given a stool at the public meeting and a longer list of things to pay for."
lone_goblins_path_6:0 "Protected Cavalry"
lone_goblins_path_6_desc:0 "The light riders of the Lone holds save their best padded coats for duty, which leaves the captains looking rather plain at supper."
lone_goblins_path_7:0 "A Seat of Goblin Power"
lone_goblins_path_7_desc:0 "The roads into the goblin seat are busy enough to pay for a watch, and safe enough that the merchants no longer have to pay for their own."
morrigon_goblin_path_1:0 "Mountaineers"
morrigon_goblin_path_1_desc:0 "Morrigon goblins choose their hill camps by the spring before they look at the view. Officers coming up from below tend to reverse the order."
morrigon_goblin_path_2:0 "A Focused Infantry"
morrigon_goblin_path_2_desc:0 "The Morrigon armory stocks fittings that will serve on several sorts of kit, since nowhere in the muster book does it say that a buckler needs its own buckle."
morrigon_goblin_path_3:0 "Happiness at Home"
morrigon_goblin_path_3_desc:0 "New settlers take their turn on the watch with their neighbors, and nobody asks which holidays they keep until the roster is drawn up."
morrigon_goblin_path_4:0 "Noble Riders"
morrigon_goblin_path_4_desc:0 "Morrigon's wealthier goblins maintain strings of fast mounts, and learn at muster that a fine horse looks much the same from behind."
morrigon_goblin_path_5:0 "Fortified Garrisons"
morrigon_goblin_path_5_desc:0 "Garrison households mend their quarters in exchange for a share of the market toll. Nearby chiefs call this a generous arrangement when they are invited inside."
morrigon_goblin_path_6:0 "Deadly Archery"
morrigon_goblin_path_6_desc:0 "The Morrigon bowyers repair worn bows at the muster instead of selling replacements, which is why the men come early and the merchants do not."
morrigon_goblin_path_7:0 "Masters of Siege"
morrigon_goblin_path_7_desc:0 "Goblin siege crews are paid by the job, and take a close interest in what the defenders have spent on theirs."

###############################################################################################
# Sea Elves
sea_elven_philosophy: "Sea Elven Traditions"
sea_elven_infantry_path_1:0 "Pikemen Levies"
sea_elven_infantry_path_1_desc:0 "Sea Elf levies draw pikes from the shore depots, where the keepers hang them butt up so they can see which heads have started to rust."
sea_elven_infantry_path_2:0 "For the Glory of the Sea Elves!"
sea_elven_infantry_path_2_desc:0 "The harbor bells call the Sea Elven levy home, and the harbor clerks have learned to wait for the next tide before counting the absentees."
sea_elven_infantry_path_3:0 "Iron Cuirasses"
sea_elven_infantry_path_3_desc:0 "The Sea Elven armorers oil each cuirass before it goes into store, and put the man who brings one back salty to work on the entire rack."
sea_elven_infantry_path_4:0 "Mixed-Unit Training"
sea_elven_infantry_path_4_desc:0 "The light companies land first at drill and wait for the armor to come ashore, which gives them a useful point of reference when the captains discuss speed."
sea_elven_infantry_path_5:0 "Constructing the Mage Towers"
sea_elven_infantry_path_5_desc:0 "The first mage tower a coastal town builds is the one its pilots can see from outside the harbor. The second tends to be the one its neighbors can see."
sea_elven_infantry_path_6:0 "Elven Inevitability"
sea_elven_infantry_path_6_desc:0 "Sea Elven supply officers contract with the subject ports before the army sails, so the towns have time to bake the bread they are expected to be glad to offer."
sea_elven_infantry_path_7:0 "Recruitment Bonuses"
sea_elven_infantry_path_7_desc:0 "Recruiting officers pay the first coin at the quay, where nobody who takes it has very far to go to prove that he meant to enlist."
sea_elf_colonial_path_1:0 "Crossbowmen Militias"
sea_elf_colonial_path_1_desc:0 "The outlying Sea Elf wards keep their crossbows under the meeting hall, with each family lending a key to a neighbor before going to sea."
sea_elf_colonial_path_2:0 "Overseas Colonies"
sea_elf_colonial_path_2_desc:0 "A Sea Elven colony sends back its first grain samples in the same ship that carried out the ladders. The ship's master is paid for both journeys."
sea_elf_colonial_path_3:0 "Securing Trade by Any Means Possible"
sea_elf_colonial_path_3_desc:0 "Sea Elf factors ask for a berth and a warehouse, and the crossbow companies wait on the quay while the harbor master considers which he can spare."
sea_elf_colonial_path_4:0 "The Desire for Plunder"
sea_elf_colonial_path_4_desc:0 "The crews have long remembered the share a successful voyage can bring, although the people carried below decks keep a different account of it."
sea_elf_colonial_path_5:0 "Embracing Life At Sea"
sea_elf_colonial_path_5_desc:0 "Sea Elven yards build for crews that will take a hull out in any season, which keeps the berths full and gives the carpenters very little time to admire their work."
sea_elf_colonial_path_6:0 "Relaxed Recruitment Standards"
sea_elf_colonial_path_6_desc:0 "The fleet takes archers from every harbor, and lets the steady hands teach the new recruits which few words have to carry across a deck."
sea_elf_colonial_path_7:0 "Sea Elven City Construction"
sea_elf_colonial_path_7_desc:0 "Sea Elf surveyors leave a wide road from the wharf to the first market. It is cheaper to mark that road out in sand than to put it through houses later."
sea_elf_cavalry_path_1:0 "Mastering the Iron Wheel"
sea_elf_cavalry_path_1_desc:0 "Sea Elven wheelwrights fit iron rims to carts that spend more time on wet stone than the makers of the first ones expected."
sea_elf_cavalry_path_2:0 "Blacksmithing Breakthroughs"
sea_elf_cavalry_path_2_desc:0 "The shore smiths turn out spare pins with each new axle, and the drivers have found that a lost pin is easier to explain when they can produce another."
sea_elf_cavalry_path_3:0 "Mounted Generals"
sea_elf_cavalry_path_3_desc:0 "A Sea Elven commander keeps a horse at each of the main landings. The estate that sends the soundest mount is usually the first to get a visit."
sea_elf_cavalry_path_4:0 "A Focus on Light Cavalry"
sea_elf_cavalry_path_4_desc:0 "Sea Elf light riders make their rounds between the harbor roads, where a horse bought for parade soon finds more puddles than spectators."
sea_elf_cavalry_path_5:0 "Learning On the Battlefield"
sea_elf_cavalry_path_5_desc:0 "The campaign scribes record where each chariot broke, leaving a discreet space for what the driver told his captain before setting out."
sea_elf_cavalry_path_6:0 "Chariots of Doom"
sea_elf_cavalry_path_6_desc:0 "Sea Elven rulers bring the chariot teams down to the quay on review day, where a set of sound wheels makes a finer show than another speech."
sea_elf_cavalry_path_7:0 "Elven Horselords"
sea_elf_cavalry_path_7_desc:0 "The sea lords' grooms start a horse on the wharf before they put it in a troop, since a mount that tolerates the gulls has already learned a good deal of patience."

###############################################################################################
# Halfling Traditions
halfling_philosophy: "Halfling Traditions"
halfling_army_path_1:0 "The Call for Archers"
halfling_army_path_1_desc:0 "Halfling villages keep bows beside the field tools, and a scout who needs a few more hands knows to ask at the far end of the harvest."
halfling_army_path_2:0 "Indomitable Levies"
halfling_army_path_2_desc:0 "The halfling companies take their places by village at muster. A man who slips away from the line can expect the news to reach home before he does."
halfling_army_path_3:0 "Masters of Warfare"
halfling_army_path_3_desc:0 "The captains lead drill in the village fields and get the same sharp word as anyone else when a file turns too late."
halfling_army_path_4:0 "The Cruel Whip"
halfling_army_path_4_desc:0 "The halfling rolls name the estates that take captives, a matter on which the owners would prefer the recruiting officers to exercise discretion."
halfling_army_path_5:0 "Training in the Badlands"
halfling_army_path_5_desc:0 "The badlands posts hold drill on the slopes behind the wells, where the recruits can see all afternoon how far it is back to water."
halfling_army_path_6:0 "Organized Recruitment"
halfling_army_path_6_desc:0 "A halfling recruiter brings a copy of the roll to the village supper. The headmen would rather put him right before he starts reading it aloud."
halfling_army_path_7:0 "Auxiliary Advancements"
halfling_army_path_7_desc:0 "The auxiliary bowmen and drivers share a practice field on alternate days, an arrangement reached after a spirited trial of sharing it on the same day."
halfling_navy_path_1:0 "Sinking the Enemy Fleets"
halfling_navy_path_1_desc:0 "Halfling crews mark the oar benches for a ram run, since the man whose feet are wrong has very little time to move them."
halfling_navy_path_2:0 "Pensions for Sailors"
halfling_navy_path_2_desc:0 "A sailor's pension is witnessed at home before he puts out, where the people who will have to collect it can ask what the clerk meant."
halfling_navy_path_3:0 "Harvester of Souls"
halfling_navy_path_3_desc:0 "The halfling fleet names the drowned at its first meal back ashore, and sets aside their families' share before the captain is served."
halfling_navy_path_4:0 "Defensive Sailing"
halfling_navy_path_4_desc:0 "Halfling coxswains practice turning close to the harbor stakes. The stakes are cheap, which is as well given how the practice began."
halfling_navy_path_5:0 "Scaling the Ramparts"
halfling_navy_path_5_desc:0 "The rampart men borrow the tallest ladders from the orchard keepers, who require them back in good order and before the fruit is ripe."
halfling_navy_path_6:0 "Master Military Craftsmen"
halfling_navy_path_6_desc:0 "Halfling smiths make a common size of rivet for the yard and the armory, and keep a separate pot for the officers who insist theirs are different."
halfling_navy_path_7:0 "Lords of the Ocean"
halfling_navy_path_7_desc:0 "The fleet crews learn the home channels as children, and take a certain satisfaction in hearing a visiting pilot explain where the shoals ought to be."
halfling_Aeptelonian_path_1:0 "The First Line in Battle"
halfling_Aeptelonian_path_1_desc:0 "Halfling archers take the first place in the field, though the men behind them have strict instructions about how long that arrangement is to last."
halfling_Aeptelonian_path_2:0 "Economic Encouragement"
halfling_Aeptelonian_path_2_desc:0 "The village reeves bring the estate tallies in person, since a bale or a sack tells the council very little about whose work filled it."
halfling_Aeptelonian_path_3:0 "Levies in the Mountains"
halfling_Aeptelonian_path_3_desc:0 "The hill levies muster in the upper folds, and their officers have learned to meet them there rather than spend the morning calling from below."
halfling_Aeptelonian_path_4:0 "Chariot Construction Workshops"
halfling_Aeptelonian_path_4_desc:0 "The village workshops use the same hubs for every chariot, and the wheelwright who makes a finer one has to wait for a customer who wants only the one."
halfling_Aeptelonian_path_5:0 "The Sea Is Home to All"
halfling_Aeptelonian_path_5_desc:0 "The crews take their meals by watch, so shipmates learn one another's names long before the harbor clerk asks where they came from."
halfling_Aeptelonian_path_6:0 "Heavy Weapons Initiative"
halfling_Aeptelonian_path_6_desc:0 "Heavy weapons are kept at the drill hall between musters, where the strongest recruits can be persuaded to oil them without quite being asked."
halfling_Aeptelonian_path_7:0 "The Destruction of All They Hold Dear"
halfling_Aeptelonian_path_7_desc:0 "The besiegers show the defenders the shutters salvaged from the first gatehouse. The other wards generally ask for terms while they still have roofs."

###############################################################################################
# Gnome Traditions
gnome_philosophy: "Gnome Traditions"
gnome_jaranem_heritage_path_1:0 "Embracing Heavy Cavalry"
gnome_jaranem_heritage_path_1_desc:0 "Gnome horse masters measure each rider for a saddle before ordering the horse. They have found the rider the easier of the two to replace."
gnome_jaranem_heritage_path_2:0 "A Volley of Arrows"
gnome_jaranem_heritage_path_2_desc:0 "The gnome bow captain calls the volley from a stool, which gives him a clear view of the men who are trying to loose early."
gnome_jaranem_heritage_path_3:0 "Recruits from the Villages"
gnome_jaranem_heritage_path_3_desc:0 "The village rolls stay in the mill through winter, and the recruiter can make his rounds without asking which cottages are still occupied."
gnome_jaranem_heritage_path_4:0 "Heavy Horse Training"
gnome_jaranem_heritage_path_4_desc:0 "Gnome grooms hang a little bell beside the feeding stall. By muster the horse has heard rather more of it than the cavalry trumpeter has."
gnome_jaranem_heritage_path_5:0 "Fighting As One"
gnome_jaranem_heritage_path_5_desc:0 "The heavy companies mark the yard with white stones, and nobody who has fallen over one forgets where his file belongs."
gnome_jaranem_heritage_path_6:0 "Incentives for Commanders"
gnome_jaranem_heritage_path_6_desc:0 "The muster judge awards a commander his bonus after taking a word with the men who marched behind him."
gnome_jaranem_heritage_path_7:0 "A Horse For Every Soldier"
gnome_jaranem_heritage_path_7_desc:0 "Gnome studs offer the regiments first pick of the year's remounts, and offer the horses that bite to less regular customers."
gnome_bhaxnmrectem_path_1:0 "Unmatched Archers"
gnome_bhaxnmrectem_path_1_desc:0 "Gnome bowmen test their strings under cover before taking the watch. The sentry who hears a string snap is seldom looking in the right direction."
gnome_bhaxnmrectem_path_2:0 "Secure Within Our Walls"
gnome_bhaxnmrectem_path_2_desc:0 "The hold's keepers bolt the little doors before they attend to the grand one, which is the only door the visiting architect ever asks to see."
gnome_bhaxnmrectem_path_3:0 "The First to Engage with the Enemy"
gnome_bhaxnmrectem_path_3_desc:0 "The first gnome patrol out of the hold carries a tally of the places where daylight reaches the road. The second can leave its lanterns behind."
gnome_bhaxnmrectem_path_4:0 "Catching Our Foes Unawares"
gnome_bhaxnmrectem_path_4_desc:0 "Gnome quartermasters keep the light companies in small parties, and hear considerably less about missing packs when each is returned to its owner."
gnome_bhaxnmrectem_path_5:0 "Trained In Tough Terrain"
gnome_bhaxnmrectem_path_5_desc:0 "The drill moves from the hills into the caverns in wet weather, which gives the recruits two kinds of dark to complain about."
gnome_bhaxnmrectem_path_6:0 "The Will to Fight"
gnome_bhaxnmrectem_path_6_desc:0 "Veterans return to a gnome company by way of their old section head, who knows exactly how much time they will need before they can stand a full watch."
gnome_bhaxnmrectem_path_7:0 "A Bottomless Barrel"
gnome_bhaxnmrectem_path_7_desc:0 "The hold clerks leave a line for every household on the levy tablet, including those whose doors have been shut for years and might open next spring."
gnome_civilizing_path_1:0 "The People Rejoice"
gnome_civilizing_path_1_desc:0 "The villages set up their feast tables on the drill ground, and for one afternoon the sergeant is allowed to tell people to sit down."
gnome_civilizing_path_2:0 "Skillful Shipwrights"
gnome_civilizing_path_2_desc:0 "Gnome shipwrights keep the molds high on the shed wall, away from the damp and the visiting officers who want to improve them."
gnome_civilizing_path_3:0 "Leading From the Front"
gnome_civilizing_path_3_desc:0 "The captain of a gnome company eats at the first fire on the road, and his men know where to find him if the others have gone out."
gnome_civilizing_path_4:0 "Lords of the High Seas"
gnome_civilizing_path_4_desc:0 "The watch changes at sea even when nobody has slept, since the mate would like there to be some record of whose turn it was to try."
gnome_civilizing_path_5:0 "An Accepting Attitude"
gnome_civilizing_path_5_desc:0 "The council accepts a household's oath from whatever elder it sends, and keeps a bench of the right height for anyone who comes to offer one."
gnome_civilizing_path_6:0 "Armies For Hire"
gnome_civilizing_path_6_desc:0 "Gnome factors hire companies through the same agents who hire their wagons, and insist that the rates for both be written where everyone can see them."
gnome_civilizing_path_7:0 "Etaredican Architects"
gnome_civilizing_path_7_desc:0 "The gnome builders borrow Etaredican plans and send them back with the measurements they actually used in the margins."

