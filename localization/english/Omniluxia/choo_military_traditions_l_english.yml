#Silver Dwarves
silver_dwarf_philosophy: "Silver Dwarven Traditions"
silver_dwarf_philosophydesc: ""
dev_sdwarf_path_1: "Hthgart's Legacy"
dev_sdwarf_path_1_desc: "During the golden age of the First #G Srrørum#! #Y Kingdom#!, #G Hthgart 'to Vernunghaltt'#! was famous for commissioning large building projects that were lost to time, as well as monumental infrastructure projects that made the kingdom one of the most advanced of its time. Now we must honor him by funding similar projects to improve the lives of our people."
dev_sdwarf_path_2: "Citadels of Old"
dev_sdwarf_path_2_desc: "Our ancestors have left behind incredible defensive structures, such as the Citadel of #G Hlivikkabi#!, that have ensured the safety of our valley for centuries. We would benefit greatly from studying the designs and techniques used to build these structures."
dev_sdwarf_path_3: "Organized Storerooms"
dev_sdwarf_path_3_desc: "What many don't tell their children when retelling the story of the Great #Y Zani#! Invasion is that #Y Ulffgrdd 'to Jallurr'#! and his men nearly starved before they were relieved by #Y King Hefdarr#!'s army. We should learn from this and ensure that both our armies and garrisons are fully supplied by a system of storerooms to prevent any catastrophe in the future."
dev_sdwarf_path_4: "Mountain Outposts"
dev_sdwarf_path_4_desc: "To keep a land as divided by hills and mountains as ours connected, it was imperative that we create mountain outposts across the various valleys and isolated villages. Now we should use these same tactics to found fortified centers of administration across our realm."
dev_sdwarf_path_5: "Roads of the Mountain King"
dev_sdwarf_path_5_desc: "Long ago, our #Y Kingdom#! was connected by our great father, #G Hthgart 'to Vernunghaltt'#!, through a series of roads extending from the major cities to even the most isolated villages. With time, these roads fell into disrepair and became little more than dirt paths. Let us restore these roads and connect our kingdom."
dev_sdwarf_path_6: "Mountain Cities"
dev_sdwarf_path_6_desc: "After having established local centers of administration we've experienced a large influx of rural serfs and freemen migrating into urban centers. We should take advantage of this by developing our fledgling cities and further encouraging migration."
war_sdwarf_path_1: "To Sennjallurr"
war_sdwarf_path_1_desc: "The #Y Iron#! Wall is the crown tactical achievement of #G King Hefdarr 'to Togg'#! and his right hand man, #Y Olltar#! 'Sennmogg', who used it to decisively win many battles during the #T Unification Wars#!. Consisting of three rows of heavily armored pikemen, this 'wall of iron' slowly advances toward the enemy in a tight formation, with the second and third line extending slowly to ward off cavalry. While not the most modern technique, it is certainly a maneuver that we can build off of."
war_sdwarf_path_2: "Centralized Forges"
war_sdwarf_path_2_desc: "A #Y Silver Dwarf#!'s armor is more than just protection, it's a marker of rank and social standing. However, with our kingdom's growth, we need to produce more, stronger armor to provide to our soldiers, many of whom cannot afford the ornate, high quality designs of the nobility. Centralizing the forges around our urban centers should allow blacksmiths to meet this demand as well as collaborate to innovate on previous designs."
war_sdwarf_path_3: "The Silver Caves"
war_sdwarf_path_3_desc: "The highest honor any #Y Silver Dwarf#! across #G Morrigon#! can receive is to be laid to rest in the sacred #Y Silver Caves#! alongside our father and mother, #G Hthgart#! and #Y Ferja#!. This honor can only be won through glory in the battlefield and through great deeds, and inspires many young dwarves to take up arms and join campaigns without fear of death."
war_sdwarf_path_4: "Warriors of the Mountains"
war_sdwarf_path_4_desc: "The mountains are the natural home of our people. We are familiar with both its blessings and curses, with its beauties and struggles. We must use our ancestral knowledge of this land to our advantage."
war_sdwarf_path_5: "The Sennmoggen"
war_sdwarf_path_5_desc: "The #Y Order#! of the Sennmoggen are a fierce, disciplined force of elite knights founded by the great #Y Olltar#! 'Sennmogg'. We must adopt their drills and tactics into our own force to make every one of our soldiers have the quality of a Sennmoggen knight."
war_sdwarf_path_6: "Adopting Foreign Tactics"
war_sdwarf_path_6_desc: "Long ago we were almost pushed back by the #Y Zani#! at the Battle of #G Hlivikkabi#! in 621 LC, with our #Y Galmar#! brothers falling to their armies in the infamous Sack of #G Saptabi#! in 619 LC. We must ensure this never happens again by adapting the technology and the tactics of the foreigners to use against them."
war_sdwarf_path_7: "The Sennkallen"
war_sdwarf_path_7_desc: "Our armies have traditionally consisted of heavily armored knights and pikemen marching in tight formations with auxiliary cavalry. However, by covering both the horse and the rider in thick scale armor, we are able to create cohorts of very heavily armored knights that can smash through enemy cavalry and infantry: The #Y Sennkallen#!."
war_sdwarf_path_8: "Foreign Auxiliaries"
war_sdwarf_path_8_desc: "While the #Y Silver Dwarves#! of the #G Green Valley#! are staunchly isolationist, the #Y Galmar#! and #Y Dolin#! dwarves of #G Morrigon#! have had extensive interactions with other races, and have even formed friendships and alliances with them. Through this friendship, many humans, goblins, and even elves have either joined #Y Silver Dwarven#! armies or been hired as mercenaries."
mixed_sdwarf_path_1: "Litt un Dun"
mixed_sdwarf_path_1_desc: "#Y Just#! as #G Hthgart#! could not exist without #Y Ferja#!, men cannot exist without women. Our world operates on what we call, 'Light and Dark', an idea that states our world is full of 'lights' that cannot exist without 'darks'. Therefore, a strong family is a strong value of the #Y Silver Dwarven#! people, and ostracization in our society is akin to death."
mixed_sdwarf_path_2: "Silver Tongues"
mixed_sdwarf_path_2_desc: "The #Y Galmar#! have earned a nickname among the various people of Northern #G Morrigon#!, 'the #Y Silver Tongued#! #T Dwarves#!', as it is said they can talk you into buying a pebble for twenty gold coins. Let us embrace this reputation and support our traders abroad."
mixed_sdwarf_path_3: "Silver Syncretism"
mixed_sdwarf_path_3_desc: "Due to the #Y Dolin#! and #Y Galmar#!'s centuries of interaction with their neighbors, many neighboring goblins, humans, orcs, and even hobgoblins have adopted certain tenets or ideas of the #T Hebric#! faith. Let us promote this syncretism and spread our faith to similar-minded foreigners who honor their ancestors!"
mixed_sdwarf_path_4: "Mountain Men"
mixed_sdwarf_path_4_desc: "Since the #Y Mythic Age#! infamous '#Y Gerrmoggen#!' would perform magical mischief in the hills out of the reach of royal authority. As the world begins to use magic more practically, it is time that we harness these 'Mountain Men' to serve in our administration and army and teach their ancient styles to our mages."
mixed_sdwarf_path_5: "Embracing Foreign Ideas"
mixed_sdwarf_path_5_desc: "Centuries of isolationism has left the #Y Anvindr#! relatively unaware of new developments in the outside world. Foreign magic, tactics, technology, beliefs, and ideas have changed since the last time our people interacted with the outside world. Let us embrace these foreign ideas and use it to develop our society to be on par with the most advanced kingdoms of #G Omniluxia#!!"
mixed_sdwarf_path_6: "Promoting Tradition"
mixed_sdwarf_path_6_desc: "While we must embrace foreign ideas to stand toe-to-toe with the large empires that surround us, we must not forget our traditions and heritage. Our isolationism has allowed us to preserve our ideas and philosophies that our cousins forsook centuries ago, and we should preserve and promote this knowledge to the elites of our society and the general public."



