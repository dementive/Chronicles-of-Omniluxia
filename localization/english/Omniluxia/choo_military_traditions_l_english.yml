 ######
 ##### Zaraken Traditions
 ######
 zarakens_philosophy:0 "Zarakens Traditions"
 zarakens_philosophydesc:2 "The military lores of the semi-nomadic steppe peoples who claim descent from an old empire of Luxterra."
 zarakens_philosophy_start_bonus:0 "Zaraken Horsemen"
 zarakens_philosophy_start_bonus_desc:0 ""
 
 
 #zarakens zagartian path 
 zarakens_zagartian_path_1:0 "Zagarto-Uuxii Stallions"
 zarakens_zagartian_path_1_desc:0 "From those ancient times, having after descended from the eastern mountains of Zagarti and Uuxii mythology, the twin peoples of eastern Zarakia have always kept to themselves their ancestral, and highly exceptional, methods of horse breeding. Possessed of astute know-how in assessing any sort of equine, a typical breeder understands which colts are to be culled, and which ones are meant to rear in the next generation of #Y Zaraken#! war mounts. Bred for their durability and speed, #Y Zaraken#! stallions are renowned all across southern #G Omniluxia#!, the prestige that comes from owning even one of these fine creatures being enough to ignite wars among the sedentary folk. Though their fame as beloved war steeds exceeds them far enough as to reach capity city of the Zanites, the nomads of Zarakia also utilize their bestial companions with matters such as transportation and logistics."
 zarakens_zagartian_path_2:0 "Spirit Of The Ancestors"
 zarakens_zagartian_path_2_desc:0 "The nomadic #Y Zarakens#! of old were a people who had been continously vilified and chased away by foreign adversaries, forced into exile on multiple occasions before they had finally breached the dwarven holds of the #Y Anempanso#!. It was here did the ancestors of the #Y Zarakens#! become mixed with the blood of their dwarven subjects, whose beliefs they partook in readily. As such, the #Y Zarakens#! were quick to adopt the practice of ancestor worship, a custom they have kept close to their hearts even after their expulsion from the eastern mountains. Within their new homeland they have taken with them the memory of their ancestors both human and dwarven, determined to keep their lands for themselves in order to honor the hardships of their forebears. #Y This is a#! sentiment felt most hotly within the context of war, for it is on the battlefield do the #Y Zarakens#! have everything to lose, including their homes."
 zarakens_zagartian_path_3:1 "The Zomendar"
 zarakens_zagartian_path_3_desc:0 "To the undiscerning eyes of sedentary foreigners, the armies of the #Y Zarakens#!, and in fact nomadic peoples as whole, may appear messy and without much coordination. But such an assumption couldn't be farther from the reality of their traditional methods of warfare. Though they do not typically employ formations as how other cultures may view it, the military order of the #Y Zarakens#! do indeed possess a hierarchy, one which cannot easily be broken. Composed into decimals of ten, a typical unit of #Y Zaraken#! warriors is called a Zomend, and its constituent men are thus put through intense training routines in order to foser both comradery between its individual members but as welly loyalty towards their respective war captain."
 zarakens_zagartian_path_4:0 "Uuxii Stirrups"
 zarakens_zagartian_path_4_desc:0 "Considered marvelous innovation which has yet to catch on among neighboring cultures barring members of the wider #Y Zaraken#! peoples, Uxiian saddles are beloved by their nomadic crafters due to their inclusion of the stirrup, a novel item which allows for greater manueverability available to any given mounted warrior. Not only that, it as well offers better stability, giving respective riders a foundation by which they can both hoist themselves upon their steeds, and to manage their form as to not fall over during combative circumstances."
 zarakens_zagartian_path_5:0 "Ascension of the Ashandur"
 zarakens_zagartian_path_5_desc:0 "In contrast to the comman chaff who make up the Zomendar divisions, the Ashand are composed of the noble sons and daughters of the #Y Zaraken#! elites. Handpicked by the elders of any given household. While there do exist cases of plain nepotism in terms of assigning certain aristocracts to such a position, members of the Ashand are generally competent and well trained in the art of not just warfare, but as well as being able to serve in leadership roles sufficiently and without falter. Candidates for the Ashand often come with both their equipment in tow and as well as fertile mares, bronze ingots, slaves, and a herd of sheep, with it being customary for aspiring warriors to bring with them evidence of their family's richness and prestige."
 zarakens_zagartian_path_6:0 "The Sabanshir"
 zarakens_zagartian_path_6_desc:0 "The Sabandshir are in large part composed of servants, slaves, kinsmen, and foreign auxiliaries. They largely play a supplementary role in organizing an army, being in charge of things such as the maintenance of equipment, the cooking and storage of food munitions, and as well as the care required in order to keep the armie's mounts in well condition. Often times when a war has been concluded, an army's constituent members become no different from their prior clans that they had grown up in, and will decide in favor of not disbanding the regiment as a whole, forming a new household composed of all the roles it needed filled. This allows for great mobility and demographic change among the nomadic #Y Zarakens#!, always ensuring that men and women from differing households will always get the chance to find one another and form a married pair in order to prevent possible inbreeding amongst kinfolk."
 zarakens_zagartian_path_7:0 "The Gilded Tribes"
 zarakens_zagartian_path_7_desc:0 "As the dust that once followed the old #Y Zaraken#! hordes begin to settle down as they have again claimed for themselves a new homeland, territory is thus delegated to numerous familial groupings with the intent of easening the burdens of goervnorship upon the ruling elite, and to ensure loyalty among the nobility and their subject peoples. The width of these new holdings are marked by the looming kalmirsh statues, each one crafted in the likeness of their households' respective ancestors. It in these territories do ordinary kinsmen sustain themselves through a mixed lifestyle of both sedentary and nomadic pastoralism, with settlements having popped up due to the availability of easily exploitable resources such as ores and wild game. As such, many of the more permanent residence of the atypically nomadic eastern #Y Zarakens#! tend to be economicaly on par with those shanty villages of neighboring cultures, displaying sizeable wooden structures and as well as impressive smithies that can sufficiently arm the local warriors."
 zarakens_zagartian_path_end_bonus:0 "Born to Ride"
 zarakens_zagartian_path_end_bonus_desc:0 ""
 ######
 ######
 #zarakens imperial path
 zarakens_imperial_path_1:0 "The Legacy Of Eszarakayn Shazum"
 zarakens_imperial_path_1_desc:0 "The founding father of the modern #Y Zaraken#! peoples, a uniter of the sedentary and nomadic polities of his age. Born a noble son to the #Y Zinduidian#! house of Shazum, his family were the stewards of #G Kyaxares#! for generations, lording over the people both fairly and with stern protection for them. The idyllic paradigm of their rule was overturned, however, for the nomadic Uxiians and Zagartians came flooding in from the east, the half-dwarven menace proving far too barbarous to defeat plainly in battle. Even Eszarakayn himself was the victim of one their many punitive raids, whisked away as a captive when he and his brothers were exiled after their uncle seized the kingship through a palace coup. Among the #Y Zagartian#! clan of Umbushmir did he linger, the time he spent there thus garnering for the young aristocract a sense of respect towards his captors, for despite the circumstances of his stay, the nomads treated him, his brothers, and their assorted entourage with respect and courtesy. He learnt much of their ways, their beliefs, and even language, but most importantly did he understand the means to their martial superiority. In their mighty steeds did he find both his salvation and vengeance, for with a stout cunning he concinved their chiefs to lend to him their hordes in a war against his despicable uncle, and in exchange he would devise for them territories by which they would govern for themselves as kings equal to himself. The chiefs, skeptical at first, demanded he would swear a blood pact with them, claiming that they would keep his brothers until the end of Eszrakayn's reconquest, and so they were exchanged for their cooperation and arms, thus laying the foundations for the #Y Zarakens#!' rise to imperial authority."
 zarakens_imperial_path_2:0 "The Kaxham Guards"
 zarakens_imperial_path_2_desc:0 "Descended of the Uuxii clan of Kaax and the #Y Zinduidian#! household of Ehwam, the Kaxham guard is a highly pretigous and hereditary role as seen within most #Y Zaraken#! polities. Born from the unification of the sedentary and nomadic peoples by Eszarakayn the Shazumid, the first and foremost iteration of this acclaimed order formed as a collection of his most loyal companions, of which signed with each other an oath through the spilling of their blood and the declaration that they shall have no allegience other than to Eszarakayn. In the following years of their liege's mighty conquests, each one of them were rewarded with a parcel of land for them to maintain and govern during the Shazumid administration of the #T Zaraken Empire#!. Though their oaths wavered in the later generations, their children, and then their own children with so on and so forth, all upheld the martial lifestyle of their glorious ancestors, acting more as private mercenaries to whoever occupied their land rather than to the true Shazumid bloodline."
 zarakens_imperial_path_3:0 "The Divine Crescent And All Her Gifts"
 zarakens_imperial_path_3_desc:0 "Ancient and myserious, filled to the brim with grand beauties such as singing estuaries and liminal beasts, the so called 'Divine Crescent' had always fed its children, washed them clean when they have been made impure, and saved them whenever foreigners sought to impose their will upon land not meant for their ilk. It is the sire to the 'Brotherly #G Mountains#!' that safeguard the locals from invaders to the north, and inbetween their ranges and the coasts runs their river children who breathe life into the sun dried soils. As for the 'Mother Gulf', it is said that the she taught the people surrounding her the secrets to ship making, how to know the winds blow favorably in their direction, and to discern good waves from the bad. Even after those shifting times when the native #Y Zinduidians#! united with the nomads and took up the name of #Y Zaraken#!, the worldly spirits still looked upon their changed wards favorably and without contempt, continuing to let pass the natural obstacles so that they may prosper forever. As such, the #Y Zarakens#! have since grown only stronger in their maritime traditions, able to buid vessels that may rival the galleys of the #Y Zani#! States."
 zarakens_imperial_path_4:0 "Urban Levies"
 zarakens_imperial_path_4_desc:0 "During the ancient days of #Y Zinduidian#! prominence within Zarakia, it was often uncommon for the residents of any city to actually take part in the act of warfare other than to staff those hierarchial positions of captains and generals. Having relied on the rural folk to do their wars, conflict within the 'Divine Crescent' was often lackluster and sparse, and even highly ritualized in certain regions where the goal was not to kill your opponents, but to simply best them in personal duels. This all changed with the emergence of the Zagartii and Uuxii hordes, led under the sage leadership of Eszarakayn the Shazumid, bringing across the land a sense of martial fevor in the following generations as the bellicose values of the nomads began intermingling with Eszarakayn's sedentary mindset. The governance of city populations thus drastically changed, with it becoming mandatory under Shazumid rule that all men above the age of eighteen be forced to serve at least two years in militant service, this greatly enhancing the military capabilities the #T Zaraken Empire#!. Though their reign has since come to pass, this law stuck itself within the legal codes of most cities, showcasing the extent to which Shazumid rule breached into the normalities of the urban worlds of Zarakia"
 zarakens_imperial_path_5:0 "Shazumid Regality"
 zarakens_imperial_path_5_desc:0 "Most aristocratic families who preside within Zarakia can, one way or another, trace their ancestral lineage back to the house of Shazum, whether by direct descent from Eszarakayn or through one of his many brothers. This allows the noble families to presume lordship over the massess, citing their pretisgious bloodline as evidence of their mandate to govern. While this order may often find itself opposed or even undone in certain cases, this general rule of thumb has allowed there to flourish a sense of peace ever since the fall of the #T Zaraken Empire#!, for gone are the days of constant uprising and revolt, for even the spirit of the land itself can only bear to hold upon it the reign of descendent of the Shazum."
 zarakens_imperial_path_6:0 "Bastardized Dwarven Metal"
 zarakens_imperial_path_6_desc:0 "Though the Uxii and Zagartii can trace their lineage back to those scarce moments of intermingling between man and dwarf, and in turn remain inclined to keep up the spiritual practices of their dwarven ancestors, in terms of material culture they are anything but dwarven. Though their many smithing techniques may take cues from #Y Copper Dwarf#! skill, their products remain that of the ancient humans who make up the rest of their heritage. Their traditions are then further translated into a #Y Zinduidian#! lens, who as well picked many of their smelting techniques from the neighboring #T Golden Dwarves#!. This in turn has led to the creation of an alloy that, while weaker than the typical dwarven product, is often stronger than those produced by neighboring human cultures. A competent smith is able to refine this metal into a sharpened edge that can pierce any material, so much so that it can rival the obsidian blades of the #Y Karksm#!. As such, it is mostly used for in the creation of arrow and spear tips used by the common horse archer and infantry line."
 zarakens_imperial_path_7:0 "The Kaxhamid Knights"
 zarakens_imperial_path_7_desc:0 "Born out of union between the nomadic clan of the Kaxii and the urbanite household of Ewham, Kaxhamid Knights are an order of prestigious warriors sworn to uphold the reign of all Shazumid descendents. Initially, they were composed solely of Eszarakayn's most loyal companions both Zinduindian and #Y Zagartian#!, then made to swear both themselves and their descendents to the Shazumid bloodline whilst wavering all former vows of allegience. Thus, the modern sects of the Kaxhamids are composed of people directly descended from those great brothers in arms to the first Shahanshah, and uphold dutifully their oaths in subservience to whichever branch of the Shazumid dynasty has come to occupy their respective lands."
 zarakens_imperial_path_end_bonus:0 "Massed Assault"
 zarakens_imperial_path_end_bonus_desc:0 ""
 #####
 #####
 #zarakens katssaspion path
 zarakens_katssaspion_path_1:0 "Kossian Horse Javelineers"
 zarakens_katssaspion_path_1_desc:0 "The warriors of western Zarakia typially draw their martial traditions from the lightweight and grounded, possessed of cloth amd leather bound soldiers armed with short swords and spears. But following their integration with their eastern neighbors, it became impossible for them not to fall under the influence of their nomadic kinsmen. Through years of extensive trade and communal intermingling, most horse herds in western Zarakia can one way or another draw their lineage from mounts of the Zagartii and Uuxii, and have since evolved due to both new genetic stock and as well as selective breeding imposed by their sedentary masters. While smaller and less fast, #Y Kossian#! horsemen are bulky and thus extremely durable and stalwart in the heat of battle, able to allow their spear-throwing riders to get close enough as to deliver a piercing blow."
 zarakens_katssaspion_path_2:0 "Parsa Ethos"
 zarakens_katssaspion_path_2_desc:0 "Making up a large part of any auxiliary within the typical #Y Zaraken#! army, the #Y Parsa#! often take up roles such as camp defenders and scouts, sought out for their undying spirit and ability to take on enemy forces larger than their own. They were among some of the deadliest peoples who had been brought under Shazumid reign, regarded by their contemperary foes as a brave and yet primitive people, relegated to footnotes among earlier sources as nothing more than a group of coastal barbarians. When Eszarakayn brought them into the fold of his empire, he elevated them from their lowly lifestyle, thought them how to build cities, and especially how to use their martial prowess most effectively, making them some of the most valued of warriors in all of Zarakia." 
 zarakens_katssaspion_path_3:0 "The Guarded Hill Formation"
 zarakens_katssaspion_path_3_desc:0 "Designed under Hiszorumin Ahakla, one of Eszarakayn's Zinduindian generals of whom he is rumored to have bedded during their campaign together, the Guarded Hill Formation emphasizes cohesion and swift movement. Composed of heavy armored troops and camel mounted skirmishers, the camelry are meant to draw in enemy forces with a round of intense firing, only to retreat back behind the lines of scaled metal that were their comrades in arms. With coordinated movements, these regiments would let way for their compatriots as they hastily sped back behind their defensive wall, quick to charge forth afterwards as they gave the enemy no chance of escape. Bogged down by unyielding forces, those armies who opposed the #Y Zaraken#! encroach were to quick to find themselves utterly destroyed once camelry had charged them from behind, having flanked them as their allies kept them pinned."
 zarakens_katssaspion_path_4:0 "The People Of Forts"
 zarakens_katssaspion_path_4_desc:0 "The land of Zarakia has, from the dawn of its inception, proven itself to be a place lackluster in natural defenses barring the nigh-impassible mountains that separate it from northern #G Luxterra#!. As such, prior to their joining with the Zagartii and Uxii, the local Zinduindian peoples, surrounded by their abundant estuary systes that allowed for a reliable source of mud, became expert brick makers and thus built upon the edges of their ancient homes the impressive walls that protected them against the local beasts and enemy states. Even amongst the more quaint village communities such as farming or mining settlements, there exists a barrier from the outside world that has faithfully protected its makers. This penchant for communal planning has engendered there to be military tactics that keep such civics in mind, creating an arms race in which builders become more proficient in their craft, and generals become more inclined to compose better siege strategies."
 zarakens_katssaspion_path_5:0 "Kaffira Camelry"
 zarakens_katssaspion_path_5_desc:0 "The return of the Dunyducreg from the southern shores of Weaglia have sparked an era of cultural and material influx between the native peoples of #G Luxterra#! and their western neighbors. With the foreign invasion of the qhans there came with them a plethora of military ethos and tactics that then further enriched the locals, chief among them was there import of camels, of which they had whisked away from the lands of #Y Baetep#! with punitive destruction in their wake. With these beasts by their sides, the one sedentary invaders once more took up the nomadic lifestyle of their anceitn forebears before the #Y Great Collapse#! of #G Omniluxia#!, spreading far and wide as both merchants and marauders. To the lands of the #Y Zarakens#!, they became warrions of the coin, making up a good deal of the auxiliary contingents of the local militaries."
 zarakens_katssaspion_path_6:0 "Those Days Of Reckoning"
 zarakens_katssaspion_path_6_desc:0 "Anyone who is well sufficiently educated enough in the history of Zarakia can tell that the #Y Zarakens#!' rise to imperial statehood happened just as fast as their unfortunate downfall. No one force can be pointed towards as the perpetrator behind their demise, with many sources citing western piracy as being a substantial factor in disrupting the local economy and as well pillaging those coastal settlements, whilst on the other hand there are recorded instances detailing the political intrigue that surrounded the reigning branch of the Shazumid dynasty, whose fellow cadet houses were all but too eager to plot for their doom. Most importantly however, was the arrival of even more nomads from the south, the Alagurs and the Selaskusians, whose presence took up a good portion of the military's time. It matters little to most, as the results were all the same, as the realm became weakened enough as to allow those Dunyducreg invaders from Weaglia to sweep in against the native forces and effectively crush them in battle wherever they went. Though the draghkan qhans never went so far as to genuinely conquer all of Zarakia, they createed an event chain that eventually sparked into numerous aristocratic uprisings, as well as giving the eastern nomads an opportunity to gain even more groun. This period in #Y Zaraken#! history is called 'Those Days Of Reckoning', and is thus taught to all aspiring generals of the #Y Zaraken#! nobility as lesson against the fracticious politics that swept the old kingdom."
 zarakens_katssaspion_path_7:0 "Qovra's One Thousand"
 zarakens_katssaspion_path_7_desc:0 "The namesake to the province of Qovra, the 'One Thousand' are a group of independent militia men and vigilantes who are said to have holdings all across Zarakia. What was once an order of policing Omostthanat warriors founded under the command of Eszarakayn II, they eventually cut all ties with the central government following the empire's collapse as it began evermore riddled with political unrest sourced from the numerous branches of the Shazumid bloodline. Since then, they have acted as heroes for the meek and oppressed, choosing to serve as a counteroffensive whenever any one group of nobles once again chooses to step out of line against the interests of the common people. While their efforts may not often succeed, they are beloved by people far and wide for their mission to safeguard the wellbeing of the people. This, however, has led to an unstable relationship between them and their contemporary opposities, that being the reining elite of Zarakia. This relationship can often range from downright hostile to mildly opposed to one another, but when any force of forein origin seeks to raze once more the cities and pastures of the land, these two forces prove more than willing to lend each other a hand in defense of the homeland."
 zarakens_katssaspion_path_end_bonus:0 "Exotic Soldiers"
 zarakens_katssaspion_path_end_bonus_desc:0 ""
