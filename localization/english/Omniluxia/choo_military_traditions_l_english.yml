 ##### Western Zerywani Traditions
 ######
 navshodian_philosophy:0 "Western Zerywani Traditions"
 navshodian_philosophydesc:2 ""
 navshodian_philosophy_start_bonus:0 "Impact of Nobility"
 navshodian_philosophy_start_bonus_desc:0 ""
 
 
 #zehain path
 zehain_path_1:0 "Zehian Warlords"
 zehain_path_1_desc:0 "The numerous #Y Zerywani#! states required each lord to maintain a substantial military force to safeguard their independence from their own brothers, who frequently harbored ambitions of conquest and glory."
 zehain_path_2:0 "Zehian Prince Guard"
 zehain_path_2_desc:0 "To assert their dominance and maintain their legitimacy, the aristocrats made it a point to monopolise military power in their own hands. The great families each had their own prestigious armies that competed with each other to show the greatest feats of arms on the battlefield. It was not uncommon for ambitious young noble to emerge from these forces and rise through the ranks to take command of the army itself."
 zehain_path_3:1 "Cavalry Hillfighting Technique"
 zehain_path_3_desc:0 "Worthy descendants of their nomadic ancestors, the Zeechis have adapted their tactics to their new environment. #Y Cavalry#! has retained its importance, but its use has changed. Using their local knowledge, the commanders methodically place their cavalry in hiding in the many nooks and crannies of the Zeechi Massif to surprise the enemies."
 zehain_path_4:0 "Far Away Inventions"
 zehain_path_4_desc:0 "The Zehains are at the carrfour between the rest of #G Luxterra#! and the Rossovie peninsula, with supplies from all over the world jostling for safe passage to the south of #G Mount Jelen#!. This strategic location allows the Zehains to secure a reliable military supply. "
 zehain_path_5:0 "Zerywian Chivalry"
 zehain_path_5_desc:0 "Through tales and legends, the myth of the knight in the service of his lord, master of the art of the sword and the pen, motivated young nobles to pledge allegiance to other lords in order to prove their worth as successors, thus strengthening the ranks of the kingdom."
 zehain_path_6:0 "Zehian Castles"
 zehain_path_6_desc:0 "#Y Zechia#!, like all the neighboring regions of the Great Steppe, is the victim of numerous raids by the Alaguri nomads. To counter these attacks, it was necessary to promote the construction of numerous fortresses throughout the country. A network of strongholds will allow us to offer our subjects refuge during raids until our armies arrive."
 zehain_path_7:0 "Tabor Tatics"
 zehain_path_7_desc:0 "Faced with constant raids from the west, the Zeechis were often forced to fight alongside merchant convoys. During these battles, the soldiers often used the wagons as makeshift fortifications on certain flanks, which proved extremely effective. This tactic led Prince Dobromir Korecki to the idea of designing special wagons called 'Tabor'. These flying encampments proved to be extremely effective, confusing most opponents with their innovative tactics."
 zehain_path_end_bonus:0 "Rule Of Elites"
 zehain_path_end_bonus_desc:0 ""
 ######
 ######
 #lechian path
 lechian_path_1:0 "Warbands"
 lechian_path_1_desc:0 "The #Y Lechii#! lords' lack of control over their lands has resulted in the formation of local armed groups. These groups have varying values, with some fighting to defend their villages that have been abandoned by distant nobles, others to honor their god, and some simply to earn a living. Some have become skilled mercenaries, while others have been left behind. These circumstances have at least created a large pool of experienced men to fill the ranks of the armies."
 lechian_path_2:0 "Noble Wariors"
 lechian_path_2_desc:0 "Similar to their counterparts in the western regions, the Lechian nobility commands great respect from the general population. Throughout history, the Lechian nobility have valiantly fulfilled their duty as protectors of the innocent, and this has not been forgotten by the people."
 lechian_path_3:0 "Skirmishing"
 lechian_path_3_desc:0 "Known as fierce skirmishers, Lechian soldiers have been known to disrupt enemy forces by skirmishing before contact. This harassment can cause enemy units to charge prematurely, isolating themselves from their comrades and making them easy targets for our cavalry."
 lechian_path_4:0 "Wojevodi"
 lechian_path_4_desc:0 "The Wojevodi are governors responsible for applying the laws of the crown in the name of His Highness. This delegation ensures that the specific territorial characteristics of each province are taken into account more effectively. The governor is closer to their subjects and has helped to strengthen the image of the #Y Zerywani#! nobility."
 lechian_path_5:0 "Hit And Run Tatics"
 lechian_path_5_desc:0 "Divided in the face of foreign threats, the Lechian peoples had no choice but to adopt methods of harassment. Avoiding decisive battles and relying on their mobility, Lechian military campaigns were characterised by numerous skirmishes before retreating to fortresses to await the onset of winter."
 lechian_path_6:0 "Lechian Prince Warband"
 lechian_path_6_desc:0 "In contrast to the noble Zehains, the Lechian princes have a distinct approach to warfare. Rather than commanding infantry units, Lechian nobles prefer to stand out among the knightly elite by leading charges into enemy lines, often resulting in the routing of entire armies. However, this pursuit of glory can lead to excessive aggression and disregard for priority orders in favor of personal glory on the battlefield."
 lechian_path_7:0 "Uplifting Cavalry"
 lechian_path_7_desc:0 "The rumble of our hooves spreads defeatism and fear in the hearts of our opponents. The famous Lechian chivalry has torn our enemies apart many times over, and will continue to do so for ages to come. May #Y Lechi#! bless our knights, and lead us to the dominion of the Three Crowns."
 lechian_path_end_bonus:0 "Lechian Spirit"
 lechian_path_end_bonus_desc:0 ""
 #####
 #####
 #pomerian path
 pomerian_path_1:0 "Pomerian Shorelines"
 pomerian_path_1_desc:0 "The #G Elven#! Ocean is named after the high elven ships that ply its waters. The coast of Pomeria, to the south of the ocean, is home to Zerywania's most important ports. Strategically located, these ports have long served as a transit point for merchants between the north of the continent and the peninsula, allowing them to bypass the inhospitable lands of the Flusenlands and bring in elven pioneers, Norfalian pelts, and other riches from beyond."
 pomerian_path_2:0 "Border Guards"
 pomerian_path_2_desc:0 "The prosperity of Pomeria's port cities is not without its drawbacks. This wealth has fuelled the jealousy of neighbors and the ambitions of sister cities. As a result, patrols have been stepped up, borders constantly monitored, and a sophisticated network of messengers has been spread across the territory to ensure that any suspicious enemy movement is reported as quickly as possible." 
 pomerian_path_3:0 "Thriving Shipyards"
 pomerian_path_3_desc:0 "A major arrival point for regional maritime trade, the ships docking at Pomeria have created a demand for naval maintenance. Sometimes damaged by the wrath of the sea, merchant ships sometimes require extensive repair work before they can set sail again, attracting workers from all over the country."
 pomerian_path_4:0 "Beauty Of Zerywian Sea"
 pomerian_path_4_desc:0 "The Pearl of the East, the cities of Pomeria have nothing to envy their northern rivals. The #Y High Elves#! may not like it, but the Zerywian Sea is now the guardian of the most beautiful harbors in the #G Elven#! Ocean, going so far as to question the legitimacy of its name. There's nothing quite like watching the last rays of the day spill over the curved sails of the Pomerian tetreres as they head back into their docks."
 pomerian_path_5:0 "Raiding Parties"
 pomerian_path_5_desc:0 " The Pomerians, who primarily focus on maritime activities, struggle with land-based warfare. This has resulted in the development of raiding tactics. Instead of engaging the enemy head-on, our troops will target their rear lines, relying on their mobility to disengage if necessary."
 pomerian_path_6:0 "Pomerian Wood"
 pomerian_path_6_desc:0 "With the large number of ships dependent on the Pomerian shipyards, the demand for wood exploded, creating groups of renowned craftsmen who used only the finest woods. Their ships were renowned for their reliability, which earned them prestige across the sevens seas."
 pomerian_path_7:0 "Known Around The World"
 pomerian_path_7_desc:0 "#Y Zerywani#! sailors have established connections at every port of call on their journey, including business partnerships, marriages, and friendships. They are welcomed with open arms at every port, making them known throughout the world."
 pomerian_path_end_bonus:0 "Exportable Goods"
 pomerian_path_end_bonus_desc:0 ""
