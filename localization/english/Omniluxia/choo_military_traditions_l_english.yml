saurthi_philosophy:0 "Saurthi Traditions"
 saurthi_philosophydesc:0 ""
 saurthi_philosophy_start_bonus:0 "The Saurthi Way of War"
 saurthi_philosophy_start_bonus_desc:0 ""

 #Saurthi 1
 saurthi_marsh_stalkers_path_1:0 "Reed-Blind Ambush"
 saurthi_marsh_stalkers_path_1_desc:0 "#Y Saurthi#! hunting bands learn from birth to strike from beneath the waterline reeds, vanishing before a foe can raise a spear."
 saurthi_marsh_stalkers_path_2:0 "Sure Feet, Sure Strike"
 saurthi_marsh_stalkers_path_2_desc:0 "Generations spent stalking prey through bog and fen have made the saurthi nearly untouched by the terrain that mires other armies."
 saurthi_marsh_stalkers_path_3:0 "Venom-Tipped Spears"
 saurthi_marsh_stalkers_path_3_desc:0 "Coating spearheads in the toxins of marsh creatures, saurthi warriors know a single graze can turn the tide of a skirmish."
 saurthi_marsh_stalkers_path_4:0 "Cold Patience"
 saurthi_marsh_stalkers_path_4_desc:0 "The saurthi metabolism, slow and steady, lets war parties endure long campaigns on meagre rations others could not survive."
 saurthi_marsh_stalkers_path_5:0 "Chorus of the Deep Woods"
 saurthi_marsh_stalkers_path_5_desc:0 "Trained hunters loose arrows in coordinated volleys signalled by the calls of the swamp itself."
 saurthi_marsh_stalkers_path_6:0 "Skin of Stone and Scale"
 saurthi_marsh_stalkers_path_6_desc:0 "Hardened hide, treated with river clay, turns aside blows that would fell softer-skinned soldiers."
 saurthi_marsh_stalkers_path_7:0 "The Long Hunt"
 saurthi_marsh_stalkers_path_7_desc:0 "A culture that measures a warrior's worth by patience as much as ferocity recovers swiftly from the losses of war."
 saurthi_marsh_stalkers_path_end_bonus:0 "Mastery of the Marsh-Stalkers"
 saurthi_marsh_stalkers_path_end_bonus_desc:0 ""

 #Saurthi 2
 saurthi_coldblood_covenant_path_1:0 "Basking Grounds"
 saurthi_coldblood_covenant_path_1_desc:0 "Sacred basking-grounds where the young are raised communally help offset the slow saurthi birthrate."
 saurthi_coldblood_covenant_path_2:0 "Clutch-Bond Loyalty"
 saurthi_coldblood_covenant_path_2_desc:0 "#Y Saurthi#! war-leaders who hatched from the same clutch fight for each other before all else."
 saurthi_coldblood_covenant_path_3:0 "Ambush Doctrine"
 saurthi_coldblood_covenant_path_3_desc:0 "#Y Saurthi#! war-bands are drilled from childhood in the doctrine of the sudden strike and the vanishing retreat."
 saurthi_coldblood_covenant_path_4:0 "Bog Iron Forges"
 saurthi_coldblood_covenant_path_4_desc:0 "Ore drawn from the marsh beds is smelted into crude but serviceable weapons for the saurthi levies."
 saurthi_coldblood_covenant_path_5:0 "Whispered Councils"
 saurthi_coldblood_covenant_path_5_desc:0 "The saurthi elders trade old grudges and border disputes in whispered council long before war is declared."
 saurthi_coldblood_covenant_path_6:0 "Second Skin"
 saurthi_coldblood_covenant_path_6_desc:0 "#Y Saurthi#! warriors shed and re-harden their hide-armor seasonally, always presenting a fresh defense to their enemies."
 saurthi_coldblood_covenant_path_7:0 "The Endless Marsh"
 saurthi_coldblood_covenant_path_7_desc:0 "No invader has ever mapped the true extent of the saurthi marshlands, and their fortifications are built cheaply upon ground only they understand."
 saurthi_coldblood_covenant_path_end_bonus:0 "Mastery of the Coldblood Covenant"
 saurthi_coldblood_covenant_path_end_bonus_desc:0 ""


 chivix_philosophy:0 "Chivix Traditions"
 chivix_philosophydesc:0 ""
 chivix_philosophy_start_bonus:0 "The Chivix Way of War"
 chivix_philosophy_start_bonus_desc:0 ""

 #Chivix 1
 chivix_great_brood_path_1:0 "Brood Halls"
 chivix_great_brood_path_1_desc:0 "Vast communal brood halls raise the chivix young together, swelling the ranks of every generation."
 chivix_great_brood_path_2:0 "Open Hearths"
 chivix_great_brood_path_2_desc:0 "Conquered peoples are welcomed to the chivix hearth-fires and made kin within a generation."
 chivix_great_brood_path_3:0 "Kinship Oaths"
 chivix_great_brood_path_3_desc:0 "A chivix soldier fights beside dozens of blood relations, and shame before kin is a fiercer motivator than any officer's lash."
 chivix_great_brood_path_4:0 "Tribute of Youth"
 chivix_great_brood_path_4_desc:0 "Every chivix clan sends its strongest youths to replenish the war-bands after each campaign."
 chivix_great_brood_path_5:0 "The Broodmother's Word"
 chivix_great_brood_path_5_desc:0 "Generals who serve the broodmothers well are remembered in clan-song for generations."
 chivix_great_brood_path_6:0 "Many Hands"
 chivix_great_brood_path_6_desc:0 "Sheer weight of numbers lets chivix heavy infantry overwhelm smaller, more disciplined foes."
 chivix_great_brood_path_7:0 "Adoption Rites"
 chivix_great_brood_path_7_desc:0 "Newly adopted peoples are ritually bound into the chivix family, easing their integration into the state."
 chivix_great_brood_path_end_bonus:0 "Mastery of the Great Brood"
 chivix_great_brood_path_end_bonus_desc:0 ""

 #Chivix 2
 chivix_market_kin_path_1:0 "Trade-Kin Networks"
 chivix_market_kin_path_1_desc:0 "#Y Chivix#! merchant-clans maintain trade relationships across dozens of settlements, bound by blood rather than contract."
 chivix_market_kin_path_2:0 "Barter Levy"
 chivix_market_kin_path_2_desc:0 "Soldiers are paid partly in barter goods from clan stores, easing the burden on the treasury."
 chivix_market_kin_path_3:0 "Clan Muster"
 chivix_market_kin_path_3_desc:0 "When the horns sound, entire chivix clans muster as a single fighting unit, fighting with practiced cohesion."
 chivix_market_kin_path_4:0 "Communal Granaries"
 chivix_market_kin_path_4_desc:0 "Shared granaries between allied clans ensure no chivix war-band marches hungry."
 chivix_market_kin_path_5:0 "Hearth-Fire Diplomacy"
 chivix_market_kin_path_5_desc:0 "#Y Chivix#! diplomats invoke shared kinship to soften the sting of conquest in the eyes of neighboring clans."
 chivix_market_kin_path_6:0 "Bloodline Records"
 chivix_market_kin_path_6_desc:0 "Meticulous chivix bloodline-keepers can produce a claim of kinship to nearly any throne in the region."
 chivix_market_kin_path_7:0 "The Ever-Growing Brood"
 chivix_market_kin_path_7_desc:0 "The chivix believe that a great people is measured by the size of its brood, and they breed accordingly."
 chivix_market_kin_path_end_bonus:0 "Mastery of the Kin of the Marketplace"
 chivix_market_kin_path_end_bonus_desc:0 ""


 ayrith_philosophy:0 "Ayrith Traditions"
 ayrith_philosophydesc:0 ""
 ayrith_philosophy_start_bonus:0 "The Ayrith Way of War"
 ayrith_philosophy_start_bonus_desc:0 ""

 #Ayrith 1
 ayrith_windrunner_path_1:0 "Windrunner Scouts"
 ayrith_windrunner_path_1_desc:0 "#T Ayrith#! scouts are chosen young for their speed and trained to cross open country faster than any cavalry."
 ayrith_windrunner_path_2:0 "Feathered Fletching"
 ayrith_windrunner_path_2_desc:0 "#T Ayrith#! fletchers craft arrows from the plumage of highland birds, prized for their unmatched accuracy."
 ayrith_windrunner_path_3:0 "Skyline Signals"
 ayrith_windrunner_path_3_desc:0 "Mirror-flashes and banner-signs let ayrith war-bands coordinate strikes across great distances."
 ayrith_windrunner_path_4:0 "Longbow Tradition"
 ayrith_windrunner_path_4_desc:0 "Every ayrith child is given a bow before a blade, and the longbow remains the soul of their armies."
 ayrith_windrunner_path_5:0 "Light on the Land"
 ayrith_windrunner_path_5_desc:0 "#T Ayrith#! armies travel light, carrying only what the wind-swept highlands can spare."
 ayrith_windrunner_path_6:0 "Running Volleys"
 ayrith_windrunner_path_6_desc:0 "#T Ayrith#! archers loose and reposition in a single fluid motion, a technique drilled since childhood."
 ayrith_windrunner_path_7:0 "Highland Relay"
 ayrith_windrunner_path_7_desc:0 "A network of highland runners keeps ayrith war-bands supplied with fresh levies even far from home."
 ayrith_windrunner_path_end_bonus:0 "Mastery of the Windrunners"
 ayrith_windrunner_path_end_bonus_desc:0 ""

 #Ayrith 2
 ayrith_open_sky_path_1:0 "Unwalled Villages"
 ayrith_open_sky_path_1_desc:0 "The ayrith traditionally distrust walls, believing them a cage; what fortifications they do build are costly afterthoughts."
 ayrith_open_sky_path_2:0 "Sky Burial Rites"
 ayrith_open_sky_path_2_desc:0 "Fallen ayrith warriors are given to the open sky, and none who witness the rite fight for revenge alone."
 ayrith_open_sky_path_3:0 "Wandering Herds"
 ayrith_open_sky_path_3_desc:0 "#T Ayrith#! herds range the highlands freely, providing sustenance to armies on the march."
 ayrith_open_sky_path_4:0 "Wind-Read Tactics"
 ayrith_open_sky_path_4_desc:0 "#T Ayrith#! commanders read the mountain winds like a map, timing charges to when the weather favors them."
 ayrith_open_sky_path_5:0 "Free Peoples' Council"
 ayrith_open_sky_path_5_desc:0 "The ayrith council of elders extends its famed hospitality even to those of foreign blood."
 ayrith_open_sky_path_6:0 "The Endless Horizon"
 ayrith_open_sky_path_6_desc:0 "An ayrith who has walked the whole breadth of the highlands can argue kinship with nearly any hill-clan."
 ayrith_open_sky_path_7:0 "Storm Callers"
 ayrith_open_sky_path_7_desc:0 "#T Ayrith#! war-shamans are said to call down highland storms to blind and scatter approaching enemies."
 ayrith_open_sky_path_end_bonus:0 "Mastery of the Children of the Open Sky"
 ayrith_open_sky_path_end_bonus_desc:0 ""


 mycelar_philosophy:0 "Mycelar Traditions"
 mycelar_philosophydesc:0 ""
 mycelar_philosophy_start_bonus:0 "The Mycelar Way of War"
 mycelar_philosophy_start_bonus_desc:0 ""

 #Mycelar 1
 mycelar_spore_circle_path_1:0 "Spore Blooms"
 mycelar_spore_circle_path_1_desc:0 "The mycelar reproduce in great blooming cycles, timed to the spread of their sacred spore circles."
 mycelar_spore_circle_path_2:0 "Fungal Granaries"
 mycelar_spore_circle_path_2_desc:0 "Vast underground fungal gardens sustain mycelar settlements through even the harshest seasons."
 mycelar_spore_circle_path_3:0 "Networked Minds"
 mycelar_spore_circle_path_3_desc:0 "The mycelar believe all their kind share a distant kinship of mind, easing the spread of shared belief."
 mycelar_spore_circle_path_4:0 "Root and Rot"
 mycelar_spore_circle_path_4_desc:0 "#Y Mycelar#! armies live off the decay of the land itself, needing little in the way of conventional supply."
 mycelar_spore_circle_path_5:0 "Communal Growth"
 mycelar_spore_circle_path_5_desc:0 "Newcomers to mycelar lands are slowly, patiently woven into the great communal fabric."
 mycelar_spore_circle_path_6:0 "Patient Multiplication"
 mycelar_spore_circle_path_6_desc:0 "What the mycelar lack in martial ferocity, they make up for in the sheer patience of their regrowth."
 mycelar_spore_circle_path_7:0 "The Great Mycelium"
 mycelar_spore_circle_path_7_desc:0 "The interconnected mycelar economy shares its bounty efficiently across every linked settlement."
 mycelar_spore_circle_path_end_bonus:0 "Mastery of the Spore Circle"
 mycelar_spore_circle_path_end_bonus_desc:0 ""

 #Mycelar 2
 mycelar_soft_shield_path_1:0 "Yielding Ranks"
 mycelar_soft_shield_path_1_desc:0 "#Y Mycelar#! heavy infantry, built for endurance rather than the killing blow, strike with less force than sturdier peoples."
 mycelar_soft_shield_path_2:0 "Absorbing Formations"
 mycelar_soft_shield_path_2_desc:0 "What mycelar soldiers lack in offense they make up for by absorbing and dispersing the force of an enemy charge."
 mycelar_soft_shield_path_3:0 "Spore Cloud Cover"
 mycelar_soft_shield_path_3_desc:0 "Clouds of releasable spores disorient attackers, buying mycelar formations precious time to reform."
 mycelar_soft_shield_path_4:0 "Deep Root Reserves"
 mycelar_soft_shield_path_4_desc:0 "Reserve levies grow quietly beneath mycelar settlements, ready to be called upon when the surface armies falter."
 mycelar_soft_shield_path_5:0 "Toxic Bloom"
 mycelar_soft_shield_path_5_desc:0 "Certain mycelar strains release mildly toxic spores in melee, weakening enemies who press too close."
 mycelar_soft_shield_path_6:0 "Slow but Certain"
 mycelar_soft_shield_path_6_desc:0 "#Y Mycelar#! armies require little beyond what they can grow themselves, easing the strain of long campaigns."
 mycelar_soft_shield_path_7:0 "The Unbroken Bloom"
 mycelar_soft_shield_path_7_desc:0 "A mycelar army can be cut down and will simply bloom again the following season, a truth that steadies their nerves in battle."
 mycelar_soft_shield_path_end_bonus:0 "Mastery of the Soft Shield"
 mycelar_soft_shield_path_end_bonus_desc:0 ""


 tsaalan_philosophy:0 "Tsaalan Traditions"
 tsaalan_philosophydesc:0 ""
 tsaalan_philosophy_start_bonus:0 "The Tsaalan Way of War"
 tsaalan_philosophy_start_bonus_desc:0 ""

 #Tsaalan 1
 tsaalan_raiding_wind_path_1:0 "Fleet Raiders"
 tsaalan_raiding_wind_path_1_desc:0 "#Y Tsaalan#! riders are drilled to strike a target and vanish before any organized response can be mounted."
 tsaalan_raiding_wind_path_2:0 "Claim by the Sword"
 tsaalan_raiding_wind_path_2_desc:0 "#Y Tsaalan#! war-leaders traditionally justify conquest through martial right, backed by fast-riding legal 'evidence'."
 tsaalan_raiding_wind_path_3:0 "Raiding Season"
 tsaalan_raiding_wind_path_3_desc:0 "#Y Tsaalan#! cavalry are seasonal levies, raised cheaply for the raiding months and released to their herds after."
 tsaalan_raiding_wind_path_4:0 "Scattershot Tactics"
 tsaalan_raiding_wind_path_4_desc:0 "#Y Tsaalan#! riders favor chaotic, overwhelming skirmishes over the disciplined lines of settled peoples."
 tsaalan_raiding_wind_path_5:0 "Trophy Culture"
 tsaalan_raiding_wind_path_5_desc:0 "A tsaalan rider's status is measured in trophies taken, a powerful spur to morale in every engagement."
 tsaalan_raiding_wind_path_6:0 "Herd and Horse"
 tsaalan_raiding_wind_path_6_desc:0 "The tsaalan bond with their war-horses from birth, ensuring a steady stream of skilled riders."
 tsaalan_raiding_wind_path_7:0 "Swift Withdrawal"
 tsaalan_raiding_wind_path_7_desc:0 "No tsaalan war-band lingers on a battlefield longer than it must, preserving their strength for the next raid."
 tsaalan_raiding_wind_path_end_bonus:0 "Mastery of the Raiding Wind"
 tsaalan_raiding_wind_path_end_bonus_desc:0 ""

 #Tsaalan 2
 tsaalan_open_ledger_path_1:0 "Loose Taxation"
 tsaalan_open_ledger_path_1_desc:0 "The tsaalan distrust settled taxation, preferring plunder to the steady, resented hand of the tax collector."
 tsaalan_open_ledger_path_2:0 "Spoils of War"
 tsaalan_open_ledger_path_2_desc:0 "Plunder from raids is used to directly offset the costs of maintaining the tsaalan war-bands."
 tsaalan_open_ledger_path_3:0 "Rider's Bond"
 tsaalan_open_ledger_path_3_desc:0 "Even in retreat, tsaalan riders never abandon a wounded companion, a bond that steels their defensive lines."
 tsaalan_open_ledger_path_4:0 "The Long Chase"
 tsaalan_open_ledger_path_4_desc:0 "#Y Tsaalan#! riders can pursue a fleeing enemy across terrain that would break the pace of any settled army."
 tsaalan_open_ledger_path_5:0 "Blood Debts"
 tsaalan_open_ledger_path_5_desc:0 "Old blood debts between tsaalan clans and their neighbors are settled through ritualized, expected warfare, softening its perception."
 tsaalan_open_ledger_path_6:0 "Sworn Companions"
 tsaalan_open_ledger_path_6_desc:0 "A tsaalan general's sworn companions ride and die at his side, a bond stronger than any oath of state."
 tsaalan_open_ledger_path_7:0 "Wind-Swept Banners"
 tsaalan_open_ledger_path_7_desc:0 "#Y Tsaalan#! banners, cut to catch and howl in the wind, are said to carry the voices of ancestors into battle."
 tsaalan_open_ledger_path_end_bonus:0 "Mastery of the Open Ledger"
 tsaalan_open_ledger_path_end_bonus_desc:0 ""


 vothkin_philosophy:0 "Vothkin Traditions"
 vothkin_philosophydesc:0 ""
 vothkin_philosophy_start_bonus:0 "The Vothkin Way of War"
 vothkin_philosophy_start_bonus_desc:0 ""

 #Vothkin 1
 vothkin_deep_bastion_path_1:0 "Bastion Doctrine"
 vothkin_deep_bastion_path_1_desc:0 "#Y Vothkin#! war-schools drill defense above all else, believing a line that does not break has already won."
 vothkin_deep_bastion_path_2:0 "Stonebound Levies"
 vothkin_deep_bastion_path_2_desc:0 "#Y Vothkin#! levies fight shoulder to shoulder in the manner of their mountain holds, an unbreakable stone wall of shields."
 vothkin_deep_bastion_path_3:0 "Toll Roads"
 vothkin_deep_bastion_path_3_desc:0 "Every pass through vothkin territory is tolled, funding the upkeep of their famous mountain garrisons."
 vothkin_deep_bastion_path_4:0 "Slow March"
 vothkin_deep_bastion_path_4_desc:0 "#Y Vothkin#! armies march at the deliberate pace of the mountain holds, never in a hurry, never out of formation."
 vothkin_deep_bastion_path_5:0 "Garrison Culture"
 vothkin_deep_bastion_path_5_desc:0 "Generations spent holding mountain passes have taught the vothkin to fortify efficiently and permanently."
 vothkin_deep_bastion_path_6:0 "Hold the Line"
 vothkin_deep_bastion_path_6_desc:0 "A vothkin soldier is taught from youth that retreat is a greater shame than death, steadying every formation."
 vothkin_deep_bastion_path_7:0 "Mountain Reserves"
 vothkin_deep_bastion_path_7_desc:0 "Deep mountain holds shelter reserves of vothkin manpower safe from raiding enemies."
 vothkin_deep_bastion_path_end_bonus:0 "Mastery of the Deep Bastion"
 vothkin_deep_bastion_path_end_bonus_desc:0 ""

 #Vothkin 2
 vothkin_iron_toll_path_1:0 "Iron Wall Tactics"
 vothkin_iron_toll_path_1_desc:0 "#Y Vothkin#! heavy infantry advance as a single armored mass, grinding down enemy lines through sheer discipline."
 vothkin_iron_toll_path_2:0 "Siege Wardens"
 vothkin_iron_toll_path_2_desc:0 "Centuries of holding and besieging mountain fortresses have made the vothkin masters of siegecraft."
 vothkin_iron_toll_path_3:0 "Frugal Garrisons"
 vothkin_iron_toll_path_3_desc:0 "#Y Vothkin#! garrison troops are famously self-sufficient, living off carefully hoarded mountain stores."
 vothkin_iron_toll_path_4:0 "Held Ground"
 vothkin_iron_toll_path_4_desc:0 "No army fights more effectively on high, defensible ground than the vothkin, born and bred to it."
 vothkin_iron_toll_path_5:0 "Grudging Toleration"
 vothkin_iron_toll_path_5_desc:0 "The vothkin extend a grudging but genuine hospitality to those willing to abide by the laws of the hold."
 vothkin_iron_toll_path_6:0 "Deep Stores"
 vothkin_iron_toll_path_6_desc:0 "Vast stone granaries beneath vothkin holds ensure their armies rarely want for supply."
 vothkin_iron_toll_path_7:0 "The Unyielding Hold"
 vothkin_iron_toll_path_7_desc:0 "No vothkin fortress has ever fallen to siege alone; the cost of maintaining that reputation is paid gladly."
 vothkin_iron_toll_path_end_bonus:0 "Mastery of the Iron Toll"
 vothkin_iron_toll_path_end_bonus_desc:0 ""


 light_infantry_taiga_combat_bonus:0 "Light Infantry Taiga Combat Bonus"
 polarian_philosophy:0 "Polarian Traditions"
 polarian_philosophy_desc:0 "When the survivors of the #G Northern Empire#! came ashore in #G Polaria#!, they brought the names of their old regiments with them. The town clerks still use those names on the rolls, and recruits learn the marches by ear from hunters who know where the ice will bear a company."
 polarian_philosophy_start_bonus:0 "The Polarian Way of War"
 polarian_philosophy_start_bonus_desc:0 "At the first winter muster, the captains ask the oldest scout to tell how his company came home. By the time he reaches the part where the snow covered their tracks, the recruits know which landmarks to watch for on their own march."

 #Ulvenar 1
 ulvenar_wolf_pack_path_1:0 "Pack Tactics"
 ulvenar_wolf_pack_path_1_desc:0 "The hunters who drive a giant #Y Polarian Bear#! from the brush leave two spears where the beast last saw them. The rest go round under cover, and the captains teach their light foot to close on an enemy in the same way."
 ulvenar_wolf_pack_path_2:0 "Howling Charge"
 ulvenar_wolf_pack_path_2_desc:0 "In thick snow the rear ranks can lose sight of the captain before he has gone twenty paces. They take up his call as he runs, and the men behind them know when the whole line is moving."
 ulvenar_wolf_pack_path_3:0 "Lessons of Ice and Spruce"
 ulvenar_wolf_pack_path_3_desc:0 "Before the recruits cross the glacier, a guide makes them repeat the names of the ridges where they can stand. In the taiga she walks them through the spruce until they know which clearings let a company form up and which leave it exposed."
 ulvenar_wolf_pack_path_4:0 "Lone Hunter Training"
 ulvenar_wolf_pack_path_4_desc:0 "A recruit spends a night on the hunters' trail with a spear and a blanket, and in the morning the old hands ask where he would have stood if a bear had come up the slope. They walk him back to the spot and let him try his footing."
 ulvenar_wolf_pack_path_5:0 "Blood Rank"
 ulvenar_wolf_pack_path_5_desc:0 "When the light foot muster, the captain asks the older soldiers to recite the names of those who held their places in the last fight. The younger ones hear their neighbors named and know who will stand beside them."
 ulvenar_wolf_pack_path_6:0 "Winter Endurance"
 ulvenar_wolf_pack_path_6_desc:0 "The winter guides make the cooks stop before dark when the weather is closing in, while there is still light to dig down to dry wood. Every company carries a spare bundle after its first march."
 ulvenar_wolf_pack_path_7:0 "Den Mothers"
 ulvenar_wolf_pack_path_7_desc:0 "At the spring muster, the clerks set a second bench out for the households that have taken in children of the fallen. The children come with them, and some are old enough now to put their own names on the rolls."
 ulvenar_wolf_pack_path_end_bonus:0 "Mastery of the Wolf Pack"
 ulvenar_wolf_pack_path_end_bonus_desc:0 ""

 #Ulvenar 2
 ulvenar_iron_fang_path_1:0 "Fang and Claw Weapons"
 ulvenar_iron_fang_path_1_desc:0 "The smith keeps a giant bear's claw above the bench, and when a recruit comes for a blade she takes it down to show him the curve. A short hook will catch a shield rim even when a mitten makes the grip clumsy."
 ulvenar_iron_fang_path_2:0 "Challenge Rites"
 ulvenar_iron_fang_path_2_desc:0 "An officer may call her captain to answer before the company, and the soldiers hear both accounts before they take up their spears. A captain who keeps her command that day knows the ranks will follow her, though she may have fewer friends among the officers."
 ulvenar_iron_fang_path_3:0 "Trail of the Pack"
 ulvenar_iron_fang_path_3_desc:0 "When the road disappears under drifts, the scouts look for the old bear runs between the spruce. They come back to lead the baggage through, and by dawn the wagons are back in step with the foot."
 ulvenar_iron_fang_path_4:0 "Feast of Victory"
 ulvenar_iron_fang_path_4_desc:0 "At the victory feast the cooks set out bowls for every people on the town rolls. When the names of the fallen are spoken, their households hear them called in the words they use at home."
 ulvenar_iron_fang_path_5:0 "Scarred Veterans"
 ulvenar_iron_fang_path_5_desc:0 "The veterans show the new heavy foot where old spearheads caught them under the arm. Then they set two ranks against each other in the yard and make each take a turn closing the gap."
 ulvenar_iron_fang_path_6:0 "Merciless Pursuit"
 ulvenar_iron_fang_path_6_desc:0 "When a beaten army turns for the trees, the light foot send runners ahead to the crossings. By the time the fugitives reach the water, they find the far bank already held."
 ulvenar_iron_fang_path_7:0 "Pack Law"
 ulvenar_iron_fang_path_7_desc:0 "At each muster the quartermaster calls out what the companies owe for fodder and repairs. The captains settle their shares before they march, and the carters know whose door to knock on when a wheel breaks."
 ulvenar_iron_fang_path_end_bonus:0 "Mastery of the Iron Fang"
 ulvenar_iron_fang_path_end_bonus_desc:0 ""


 selkanu_philosophy:0 "Ettin Traditions"
 selkanu_philosophydesc:0 ""
 selkanu_philosophy_start_bonus:0 "The Ettin Way of War"
 selkanu_philosophy_start_bonus_desc:0 ""

 #Selkanu 1
 selkanu_tide_walkers_path_1:0 "Tide-Reading"
 selkanu_tide_walkers_path_1_desc:0 "#Y Selkanu#! sailors learn to read the tides and currents from childhood, giving their crews unshakeable confidence at sea."
 selkanu_tide_walkers_path_2:0 "Harbor Guilds"
 selkanu_tide_walkers_path_2_desc:0 "#Y Selkanu#! harbor guilds regulate trade with an even hand, drawing merchants from across the coast."
 selkanu_tide_walkers_path_3:0 "Salt-Cured Crews"
 selkanu_tide_walkers_path_3_desc:0 "#Y Selkanu#! marines, hardened by a life at sea, fight with a ferocity that surprises landbound enemies."
 selkanu_tide_walkers_path_4:0 "Coastal Watch Towers"
 selkanu_tide_walkers_path_4_desc:0 "A chain of watchtowers along the selkanu coast keeps fortification costs low while warning of any approach."
 selkanu_tide_walkers_path_5:0 "Deepwater Charts"
 selkanu_tide_walkers_path_5_desc:0 "Generations of selkanu navigators have charted waters that remain a mystery to their rivals."
 selkanu_tide_walkers_path_6:0 "Fishwife Networks"
 selkanu_tide_walkers_path_6_desc:0 "#Y Selkanu#! fishwives trade gossip and goods along the coast, forming an informal but effective commercial network."
 selkanu_tide_walkers_path_7:0 "Storm-Tested Hulls"
 selkanu_tide_walkers_path_7_desc:0 "#T Ships#! and crews that survive the selkanu storm season emerge hardened against nearly any hardship."
 selkanu_tide_walkers_path_end_bonus:0 "Mastery of the Tide Walkers"
 selkanu_tide_walkers_path_end_bonus_desc:0 ""

 #Selkanu 2
 selkanu_merchant_fleet_path_1:0 "Fleet Levies"
 selkanu_merchant_fleet_path_1_desc:0 "Maintaining both a merchant and war fleet strains the selkanu treasury, though it is a cost gladly borne."
 selkanu_merchant_fleet_path_2:0 "Convoy Discipline"
 selkanu_merchant_fleet_path_2_desc:0 "#Y Selkanu#! captains drill in convoy formation, protecting merchant vessels with disciplined escort maneuvers."
 selkanu_merchant_fleet_path_3:0 "Trade Envoys"
 selkanu_merchant_fleet_path_3_desc:0 "#Y Selkanu#! trade envoys are skilled at smoothing the transition of newly acquired ports into the wider selkanu network."
 selkanu_merchant_fleet_path_4:0 "Harbor Fortification"
 selkanu_merchant_fleet_path_4_desc:0 "Generations of defending rich harbor cities have taught the selkanu the value of siegecraft, offensive and defensive alike."
 selkanu_merchant_fleet_path_5:0 "Salt Tax"
 selkanu_merchant_fleet_path_5_desc:0 "A modest tax on the selkanu salt trade quietly funds much of their naval ambition."
 selkanu_merchant_fleet_path_6:0 "Sailor's Oath"
 selkanu_merchant_fleet_path_6_desc:0 "Every selkanu sailor swears an oath to their captain and crew before ever setting sail, a bond rarely broken."
 selkanu_merchant_fleet_path_7:0 "The Long Voyage"
 selkanu_merchant_fleet_path_7_desc:0 "#Y Selkanu#! trading fleets range farther than most, returning with goods and gold from distant, unfamiliar shores."
 selkanu_merchant_fleet_path_end_bonus:0 "Mastery of the Merchant Fleet"
 selkanu_merchant_fleet_path_end_bonus_desc:0 ""


 arame_philosophy:0 "Arame Traditions"
 arame_philosophydesc:0 ""
 arame_philosophy_start_bonus:0 "The Arame Way of War"
 arame_philosophy_start_bonus_desc:0 ""

 #Khedrim 1
 khedrim_iron_legion_path_1:0 "Legion Drill"
 khedrim_iron_legion_path_1_desc:0 "#Y Khedrim#! soldiers drill in strict formation from their earliest years, forming the backbone of a disciplined legion."
 khedrim_iron_legion_path_2:0 "Tax of the Sword"
 khedrim_iron_legion_path_2_desc:0 "#Y Khedrim#! conquest is traditionally followed by efficient, well-organized taxation of the newly won lands."
 khedrim_iron_legion_path_3:0 "Forge Quotas"
 khedrim_iron_legion_path_3_desc:0 "Every khedrim smithy owes a quota of arms and armor to the state, ensuring a well-equipped legion."
 khedrim_iron_legion_path_4:0 "Standard Bearers"
 khedrim_iron_legion_path_4_desc:0 "#Y Khedrim#! legions march behind proud standards, rallying points that steady the resolve of every soldier."
 khedrim_iron_legion_path_5:0 "Census and Levy"
 khedrim_iron_legion_path_5_desc:0 "Regular khedrim census-taking allows the state to levy troops with ruthless efficiency."
 khedrim_iron_legion_path_6:0 "Slow Growth, Sure Strength"
 khedrim_iron_legion_path_6_desc:0 "The khedrim prize martial and administrative strength over raw population, a trade many consider worthwhile."
 khedrim_iron_legion_path_7:0 "March in Step"
 khedrim_iron_legion_path_7_desc:0 "The khedrim legion system allows rapid replenishment of losses from a well-organized reserve."
 khedrim_iron_legion_path_end_bonus:0 "Mastery of the Iron Legion"
 khedrim_iron_legion_path_end_bonus_desc:0 ""

 #Khedrim 2
 khedrim_imperial_writ_path_1:0 "Writ of Conquest"
 khedrim_imperial_writ_path_1_desc:0 "#Y Khedrim#! scribes are practiced in drafting the legal writs that justify a legion's march."
 khedrim_imperial_writ_path_2:0 "Provincial Governors"
 khedrim_imperial_writ_path_2_desc:0 "#Y Khedrim#! governors are trained from youth in the administration of newly conquered provinces."
 khedrim_imperial_writ_path_3:0 "Siege Engineers"
 khedrim_imperial_writ_path_3_desc:0 "#Y Khedrim#! engineering corps are renowned for reducing enemy walls with methodical, overwhelming force."
 khedrim_imperial_writ_path_4:0 "Grain Tribute"
 khedrim_imperial_writ_path_4_desc:0 "Conquered provinces owe the khedrim state a tribute of grain, sustaining the legions on campaign."
 khedrim_imperial_writ_path_5:0 "Iron Discipline"
 khedrim_imperial_writ_path_5_desc:0 "#Y Khedrim#! discipline is legendary, with punishment for breaking formation more feared than the enemy itself."
 khedrim_imperial_writ_path_6:0 "Toll of Empire"
 khedrim_imperial_writ_path_6_desc:0 "Maintaining the sprawling khedrim legions is costly, though the state considers it the price of order."
 khedrim_imperial_writ_path_7:0 "The Unbroken Line"
 khedrim_imperial_writ_path_7_desc:0 "A khedrim legion is trained never to break formation, no matter the cost, a discipline that has won many desperate battles."
 khedrim_imperial_writ_path_end_bonus:0 "Mastery of the Imperial Writ"
 khedrim_imperial_writ_path_end_bonus_desc:0 ""


 tenmari_philosophy:0 "Tenmari Traditions"
 tenmari_philosophydesc:0 ""
 tenmari_philosophy_start_bonus:0 "The Tenmari Way of War"
 tenmari_philosophy_start_bonus_desc:0 ""

 #Tenmari 1
 tenmari_open_road_path_1:0 "Caravan Guilds"
 tenmari_open_road_path_1_desc:0 "#Y Tenmari#! caravan guilds link distant markets, spreading both goods and tenmari influence."
 tenmari_open_road_path_2:0 "Welcoming Gates"
 tenmari_open_road_path_2_desc:0 "#Y Tenmari#! cities are famed for the speed with which newcomers are woven into civic life."
 tenmari_open_road_path_3:0 "Diplomatic Corps"
 tenmari_open_road_path_3_desc:0 "A well-trained corps of tenmari diplomats works tirelessly to soften the perception of their state's ambitions."
 tenmari_open_road_path_4:0 "Market Levies"
 tenmari_open_road_path_4_desc:0 "A small levy on tenmari market transactions quietly funds the upkeep of their armies."
 tenmari_open_road_path_5:0 "Scribes and Ledgers"
 tenmari_open_road_path_5_desc:0 "Meticulous tenmari record-keeping ensures the state collects its due with minimal waste."
 tenmari_open_road_path_6:0 "Traveling Recruiters"
 tenmari_open_road_path_6_desc:0 "#Y Tenmari#! recruiters travel the trade roads, drawing soldiers from every community the caravans touch."
 tenmari_open_road_path_7:0 "Guest Right"
 tenmari_open_road_path_7_desc:0 "The tenmari tradition of guest-right extends genuine hospitality to foreigners living under their rule."
 tenmari_open_road_path_end_bonus:0 "Mastery of the Open Road"
 tenmari_open_road_path_end_bonus_desc:0 ""

 #Tenmari 2
 tenmari_long_peace_path_1:0 "War Weariness"
 tenmari_long_peace_path_1_desc:0 "A people who prize trade over conquest tire of prolonged warfare faster than more martial cultures."
 tenmari_long_peace_path_2:0 "Mercenary Contracts"
 tenmari_long_peace_path_2_desc:0 "#Y Tenmari#! merchant houses maintain standing contracts with mercenary companies, ready to hire on short notice."
 tenmari_long_peace_path_3:0 "Escort Companies"
 tenmari_long_peace_path_3_desc:0 "Trade caravans travel with dedicated escort companies, well-practiced at defending against raiders."
 tenmari_long_peace_path_4:0 "Neutral Ground"
 tenmari_long_peace_path_4_desc:0 "Many tenmari fortifications double as neutral trading posts, offsetting their upkeep with toll revenue."
 tenmari_long_peace_path_5:0 "Silver Tongues"
 tenmari_long_peace_path_5_desc:0 "#Y Tenmari#! negotiators are skilled at finding a legal, bloodless path to territorial ambition where one exists."
 tenmari_long_peace_path_6:0 "Roads Well Traveled"
 tenmari_long_peace_path_6_desc:0 "#Y Tenmari#! armies benefit from generations of accumulated knowledge of trade routes and safe passages."
 tenmari_long_peace_path_7:0 "Prosperity's Shield"
 tenmari_long_peace_path_7_desc:0 "A prosperous tenmari populace has much to defend, and fights with unexpected tenacity to protect it."
 tenmari_long_peace_path_end_bonus:0 "Mastery of the Long Peace"
 tenmari_long_peace_path_end_bonus_desc:0 ""

 khedrim_forge_path_1:0 "Ember Assays"
 khedrim_forge_path_1_desc:0 "The smith keeps a piece from each casting. When a blade breaks, the officer is invited to bring both halves."
 khedrim_forge_path_2:0 "Ash Road Markers"
 khedrim_forge_path_2_desc:0 "A guide sets stones high enough to show above the ash. The pack train checks them on every return."
 khedrim_forge_path_3:0 "The Spare Bellows"
 khedrim_forge_path_3_desc:0 "Each forge keeps a second bellows ready, since a levy rarely gives notice before it wants its helmets."
 khedrim_forge_path_4:0 "Trials at the Furnace"
 khedrim_forge_path_4_desc:0 "Armorers strike the breastplates at the furnace door, where the men who paid for them can hear."
 khedrim_forge_path_5:0 "Gate Foundries"
 khedrim_forge_path_5_desc:0 "The gate crews order their hinges from the same smiths who make the siege fittings. The orders go out together now."
 khedrim_forge_path_6:0 "Cold Iron Stores"
 khedrim_forge_path_6_desc:0 "The quartermaster keeps spare fittings away from the furnaces, where a fire can only ruin one set of them."
 khedrim_forge_path_7:0 "The Ember Pattern"
 khedrim_forge_path_7_desc:0 "The smiths of Emberpeak submit their patterns for a common set of fittings. Anyone proposing a new size must bring the cart that is to carry it."
 ulvenar_winter_watch_path_1:0 "Tracks Under Snow"
 ulvenar_winter_watch_path_1_desc:0 "The hunters leave before the rest of the pack, while the marks from the night crossing are still legible."
 ulvenar_winter_watch_path_2:0 "The Moon Roll"
 ulvenar_winter_watch_path_2_desc:0 "Pack elders read out the names at moonrise. A hunter who answers for his brother is expected to explain where he is."
 ulvenar_winter_watch_path_3:0 "Caches Above the Drift"
 ulvenar_winter_watch_path_3_desc:0 "The watch hangs its stores above the expected snowline. It has had several winters to revise that estimate."
 ulvenar_winter_watch_path_4:0 "The Long Watch"
 ulvenar_winter_watch_path_4_desc:0 "A runner brings news from the next fire before the watch leaves its own, and stays until everyone has heard it."
 ulvenar_winter_watch_path_5:0 "A Winter Share"
 ulvenar_winter_watch_path_5_desc:0 "The pack sets aside a share for the households keeping the watch. Their fires were easier to find once the arrangement began."
 ulvenar_winter_watch_path_6:0 "Fur on the Bowcase"
 ulvenar_winter_watch_path_6_desc:0 "The bowyers wrap the spare strings inside the cases, where a thaw can do less harm."
 ulvenar_winter_watch_path_7:0 "The Frosthowl Muster"
 ulvenar_winter_watch_path_7_desc:0 "The packs answer the call at Frosthowl with their winter stores and rolls. The elders strike out a few names that have been drawing rations twice."
 saurthi_spawning_watch_path_1:0 "Pool Wardens"
 saurthi_spawning_watch_path_1_desc:0 "The keepers of the spawning pools show the watch where a raised bank will bear a shield line."
 saurthi_spawning_watch_path_2:0 "The Reed Ferries"
 saurthi_spawning_watch_path_2_desc:0 "Ferrymen mark the channels that remain deep after the water falls. Their marks are smaller on the enemy side."
 saurthi_spawning_watch_path_3:0 "Nests on Higher Ground"
 saurthi_spawning_watch_path_3_desc:0 "Families lay by grain on dry banks, and the wardens check the stores before the first flood."
 saurthi_spawning_watch_path_4:0 "The Mosshide Watch"
 saurthi_spawning_watch_path_4_desc:0 "When the channels divide, the watches agree which call means a boat and which means trouble."
 saurthi_spawning_watch_path_5:0 "Bank Repairs"
 saurthi_spawning_watch_path_5_desc:0 "Companies shore up the paths around the pools before they turn to the walls."
 saurthi_spawning_watch_path_6:0 "The Warden's Reserve"
 saurthi_spawning_watch_path_6_desc:0 "Veterans keep a company behind the nesting grounds, where a retreating watch can still find dry ground."
 saurthi_spawning_watch_path_7:0 "The Spawning Roll"
 saurthi_spawning_watch_path_7_desc:0 "The keepers send the wardens a register of the households that can spare a guard. They keep the copy that says who is to be fed."
 chivix_concord_watch_path_1:0 "The Gurin Road Gang"
 chivix_concord_watch_path_1_desc:0 "The hive sends a work gang ahead of the march. The carters now have someone to thank for a passable road."
 chivix_concord_watch_path_2:0 "Amberhive Runners"
 chivix_concord_watch_path_2_desc:0 "Runners carry muster news between the hives, where each gate keeps a tally of who has passed."
 chivix_concord_watch_path_3:0 "Brood Rations"
 chivix_concord_watch_path_3_desc:0 "Stores are measured by the strength of each company. The weak receive their portion before the strong count theirs."
 chivix_concord_watch_path_4:0 "The Concord Roll"
 chivix_concord_watch_path_4_desc:0 "The Hive Concord calls for a roll that every gate can read. A lost tablet can no longer excuse an absent company."
 chivix_concord_watch_path_5:0 "Gate Reliefs"
 chivix_concord_watch_path_5_desc:0 "The workers who dig the walls take turns with the companies that hold them, and both complain about the last shift."
 chivix_concord_watch_path_6:0 "Shield Crews"
 chivix_concord_watch_path_6_desc:0 "When a row of shields fails, the second rank has orders to close the gap before asking whose it was."
 chivix_concord_watch_path_7:0 "The Greathive Levy"
 chivix_concord_watch_path_7_desc:0 "The hives send each other replacements and spare tools under the same seal. The stores officer now has fewer seals to blame."
 ayrith_aerie_watch_path_1:0 "The Lower Stairs"
 ayrith_aerie_watch_path_1_desc:0 "Aerie guards walk the stairs from their foot, so the watch learns which turns an army below can see."
 ayrith_aerie_watch_path_2:0 "Cloudwatch Beacons"
 ayrith_aerie_watch_path_2_desc:0 "The garrisons at Cloudwatch practice signals on days when the lower towers can see very little of Cloudwatch."
 ayrith_aerie_watch_path_3:0 "Pack Saddles for Stone"
 ayrith_aerie_watch_path_3_desc:0 "The keepers shorten the saddle loads for steep stairs. The animals had been making the same case for years."
 ayrith_aerie_watch_path_4:0 "The Aerie Ledger"
 ayrith_aerie_watch_path_4_desc:0 "Each aerie sends a surveyor to agree on the routes that pack animals can use. The winged officers attend as witnesses."
 ayrith_aerie_watch_path_5:0 "Spare Stone on the Ledge"
 ayrith_aerie_watch_path_5_desc:0 "Masons pile repair stone above each gate before the clouds close in."
 ayrith_aerie_watch_path_6:0 "The High Bow Ranks"
 ayrith_aerie_watch_path_6_desc:0 "Archers learn to wait for a clean shot through the pass, an exercise that takes considerable time in cloud."
 ayrith_aerie_watch_path_7:0 "The Wind Tables"
 ayrith_aerie_watch_path_7_desc:0 "Ayrith surveyors collect their notes on the passes and winds. The captains receive a copy with the more optimistic estimates removed."
 mycelar_field_schools_path_1:0 "The School at the Gate"
 mycelar_field_schools_path_1_desc:0 "The schools of Kagayamashko send students to watch the gate crews drill. They return with several questions about the gate."
 mycelar_field_schools_path_2:0 "Wiishmshoo Stores"
 mycelar_field_schools_path_2_desc:0 "The storekeepers of Wiishmshoo record which provisions keep on long crossings and which come back in the same jars."
 mycelar_field_schools_path_3:0 "The Outer Hebreades Watch"
 mycelar_field_schools_path_3_desc:0 "Outlying watches keep spare bowstrings and lamps for crews arriving after dark."
 mycelar_field_schools_path_4:0 "Lessons from the Wet Store"
 mycelar_field_schools_path_4_desc:0 "The schools agree to teach from the quartermaster's failed inventories. He asks that they begin with the most recent one."
 mycelar_field_schools_path_5:0 "The Shared Ditch"
 mycelar_field_schools_path_5_desc:0 "Two schools propose different ways to drain the same ditch. The watch asks each to finish half before the rains."
 mycelar_field_schools_path_6:0 "A Sporewood Relief"
 mycelar_field_schools_path_6_desc:0 "At Sporewood the second watch drills with the first, so that both know how to relieve the line when the path floods."
 mycelar_field_schools_path_7:0 "The Hundred Schools' Accounts"
 mycelar_field_schools_path_7_desc:0 "The Hundred Schools submit their field notes together. They retain their disputes in the margins, where the soldiers may consult them at leisure."
 tsaalan_well_wardens_path_1:0 "The Dunescar Well Roll"
 tsaalan_well_wardens_path_1_desc:0 "Riders bring back a count of the jars at each well, since a full well is no help to a column without a rope."
 tsaalan_well_wardens_path_2:0 "Markers Against the Wind"
 tsaalan_well_wardens_path_2_desc:0 "The scouts build their cairns low, where a rider can find one after the wind has altered the rest of the view."
 tsaalan_well_wardens_path_3:0 "Spare Bowcases"
 tsaalan_well_wardens_path_3_desc:0 "Horse archers keep wrapped strings at the watering stops. Each man pays for the case he forgets to close."
 tsaalan_well_wardens_path_4:0 "The Third Water Stop"
 tsaalan_well_wardens_path_4_desc:0 "Quartermasters send a rider ahead to the wells the column expects to use, and another to the one it hopes it will never need."
 tsaalan_well_wardens_path_5:0 "The Well Guard's Turn"
 tsaalan_well_wardens_path_5_desc:0 "The well guard draws water after the pack animals. It now takes shorter turns."
 tsaalan_well_wardens_path_6:0 "Qadiir's Remounts"
 tsaalan_well_wardens_path_6_desc:0 "The remount keepers at Qadiir try the replacements on a full day's ride before they sell them to the muster."
 tsaalan_well_wardens_path_7:0 "The Dust Road Survey"
 tsaalan_well_wardens_path_7_desc:0 "Readers of the dunes set their judgments beside the riders' accounts. The army issues both, since the water was found only when the two agreed."
 vothkin_hold_masons_path_1:0 "Deepstone Soundings"
 vothkin_hold_masons_path_1_desc:0 "A mason sounds the rock before a company puts its stores under it. The survey is cheaper than another company."
 vothkin_hold_masons_path_2:0 "The Stone Oath Register"
 vothkin_hold_masons_path_2_desc:0 "The hold records which households owe a crew, and in which season. The runes leave little room for a different recollection."
 vothkin_hold_masons_path_3:0 "Spare Doors at the Pass"
 vothkin_hold_masons_path_3_desc:0 "A hold keeps a door ready to hang where the first one gave way. The garrison has left the old hinges in place for inspection."
 vothkin_hold_masons_path_4:0 "The Lower Galleries"
 vothkin_hold_masons_path_4_desc:0 "Deepstone masons measure the galleries by what a loaded cart can turn in, an improvement on the old survey by walking pace."
 vothkin_hold_masons_path_5:0 "The Runecutters' Measures"
 vothkin_hold_masons_path_5_desc:0 "Runecutters mark the face of each prepared block, and the siege crews ask for the same marks on their braces."
 vothkin_hold_masons_path_6:0 "The Last Relief Bell"
 vothkin_hold_masons_path_6_desc:0 "Armored reliefs take their place before the bell rings, since the bell has proved easier to damage than the gate."
 vothkin_hold_masons_path_7:0 "The Holds' Muster Stones"
 vothkin_hold_masons_path_7_desc:0 "The holds send a copy of their oaths to the muster. The elders can now find a man's obligation without walking to his door."
 selkanu_harbor_watch_path_1:0 "Soundings at Saltmere"
 selkanu_harbor_watch_path_1_desc:0 "Pilots at Saltmere record the depth over the reef at each tide. The navy takes its copy from the men who have scraped it."
 selkanu_harbor_watch_path_2:0 "The Coral Stairs"
 selkanu_harbor_watch_path_2_desc:0 "Crews practice landing below the harbor walls, where the tide can remove a stair before the next boat arrives."
 selkanu_harbor_watch_path_3:0 "Island Stores"
 selkanu_harbor_watch_path_3_desc:0 "The watch opens its storehouse to crews from the next island and takes their receipts when they sail."
 selkanu_harbor_watch_path_4:0 "Lights Beyond the Reef"
 selkanu_harbor_watch_path_4_desc:0 "Boats of the watch take station where the island lights are still visible. In fog the pilots are allowed to reconsider."
 selkanu_harbor_watch_path_5:0 "Repair Berths"
 selkanu_harbor_watch_path_5_desc:0 "Spare timber and cordage wait in the shallow berths, where a damaged galley can reach them on a favorable tide."
 selkanu_harbor_watch_path_6:0 "The Pilot's Purse"
 selkanu_harbor_watch_path_6_desc:0 "The island towns agree on a pilot's fee before the convoy sails. The pilots have agreed to argue about the fee on shore."
 selkanu_harbor_watch_path_7:0 "The Tide Register"
 selkanu_harbor_watch_path_7_desc:0 "Harbor scribes collect the reef charts and slip records of the island pilots. The navy pays for revised copies when someone comes home with proof."
 tenmari_convoy_courts_path_1:0 "Receipts for the Road"
 tenmari_convoy_courts_path_1_desc:0 "Jade merchants write the name of the escort on each receipt. The escort has taken to keeping a copy."
 tenmari_convoy_courts_path_2:0 "The Maru Wayhouses"
 tenmari_convoy_courts_path_2_desc:0 "The wayhouses take in the guard before the caravan comes up. The keeper can now count the bowls before he starts the pot."
 tenmari_convoy_courts_path_3:0 "Sureties for the Escort"
 tenmari_convoy_courts_path_3_desc:0 "A merchant who hires an escort leaves enough with the clerk to pay for the return as well."
 tenmari_convoy_courts_path_4:0 "The Road Court"
 tenmari_convoy_courts_path_4_desc:0 "The court hears disputes where the next convoy can attend. A captain whose men were paid in promises generally brings witnesses."
 tenmari_convoy_courts_path_5:0 "Jade Seals at the Gate"
 tenmari_convoy_courts_path_5_desc:0 "Gate officers keep the seal impressions used along the road, and the first clerk to spot an old forgery gets to keep it."
 tenmari_convoy_courts_path_6:0 "The Obsidian Reserve"
 tenmari_convoy_courts_path_6_desc:0 "Guards on the road to the Obsidian Throne keep a reserve with the baggage, where a captain can find it without stopping every cart."
 tenmari_convoy_courts_path_7:0 "The Jade Convoy Charter"
 tenmari_convoy_courts_path_7_desc:0 "The convoy courts publish one set of escort accounts for the roads through Maru. Merchants can still dispute a charge, though they now have to name it."
 mixed_sdwarf_path_7:0 "The Common Measure"
 mixed_sdwarf_path_7_desc:0 "The masons and the armorers bring their measures to the same bench. The quartermaster keeps the one that fits the gate and puts the rest in a drawer."

 # Borderlander traditions
 border_britannic_path_1:0 "Border Charioteers"
 border_britannic_path_1_desc:0 "A border chariot is judged by the condition of its axle after a turn on hard ground."
 border_britannic_path_2:0 "Shields for the Light Companies"
 border_britannic_path_2_desc:0 "The light companies carry shields they can keep up all afternoon, which the heavier companies regard as a modest ambition."
 border_britannic_path_3:0 "Wells of the March"
 border_britannic_path_3_desc:0 "A guide who knows which wells hold water into autumn earns his supper before the column has pitched camp."
 border_britannic_path_4:0 "Village Muster Rolls"
 border_britannic_path_4_desc:0 "The muster rolls stay with the village elders, who know where to find a replacement and which names the last clerk counted twice."
 border_britannic_path_5:0 "Steady Reins"
 border_britannic_path_5_desc:0 "Charioteers practice with empty carts until the wheels cease to be the most alarming part of the exercise."
 border_britannic_path_6:0 "Remounts from the March"
 border_britannic_path_6_desc:0 "The border studs sell sound little horses by the troop, leaving handsome ones for the buyers who come alone."
 border_britannic_path_7:0 "The Morning Round"
 border_britannic_path_7_desc:0 "Bowmen loose a round before the camp stirs, and the watch learns to judge the hour by the first complaint."
 border_germanic_path_1:0 "Companies of the Hearth"
 border_germanic_path_1_desc:0 "The foot companies muster by hearth, and a man has to step over his own neighbors if he wants to leave the line."
 border_germanic_path_2:0 "Common Fittings"
 border_germanic_path_2_desc:0 "The wheelwright and the saddler agree on fittings before the levy buys a cart or a horse, which greatly shortens the dispute afterward."
 border_germanic_path_3:0 "Listening in the Woods"
 border_germanic_path_3_desc:0 "A wet wood carries the sound of boots farther than a recruit expects, and he usually learns this from the company already waiting there."
 border_germanic_path_4:0 "Captives at the Gate"
 border_germanic_path_4_desc:0 "The raiding captains hand over their captives at the gate, where the keeper makes a record the captains would rather he kept to himself."
 border_germanic_path_5:0 "Iron at the Ford"
 border_germanic_path_5_desc:0 "The men in iron take the first watch at the ford, and the next shift judges the depth by where their shield rims have dried."
 border_germanic_path_6:0 "Village Armories"
 border_germanic_path_6_desc:0 "A village armory keeps spare straps and patched shields, and no questions are asked about the age of either until the muster is over."
 border_germanic_path_7:0 "Stand by the Pegs"
 border_germanic_path_7_desc:0 "The archers mark their ground with pegs and learn to stand by them when the shields ahead begin to move."
 border_gallic_path_1:0 "Winter Staves"
 border_gallic_path_1_desc:0 "The bowyers take their staves from the winter cut, and leave the ones that twist for the officers' fires."
 border_gallic_path_2:0 "The Levy Fair"
 border_gallic_path_2_desc:0 "Every district sends a clerk to the levy fair, since a man can have cousins in several villages and owe service in only one."
 border_gallic_path_3:0 "Dust of the Chariots"
 border_gallic_path_3_desc:0 "Out on the flats the foot follow the carts by their dust, at least until it is time for the carts to get out of the way."
 border_gallic_path_4:0 "Drill on the Commons"
 border_gallic_path_4_desc:0 "The companies drill on common land, and the villages can tell when discipline has improved by the number of fences still standing."
 border_gallic_path_5:0 "Market Days"
 border_gallic_path_5_desc:0 "The new villages keep their own market days, which is convenient for the tax collectors once they acquire a second calendar."
 border_gallic_path_6:0 "Iron in the Front Rank"
 border_gallic_path_6_desc:0 "The best armored men stand at the front, where everyone can see what the village paid for."
 border_gallic_path_7:0 "The Siege Carpenter"
 border_gallic_path_7_desc:0 "A siege carpenter who has taken a gate apart is welcome at the next council, though he is rarely asked to apologize to its former keeper."
 forest_elves_morrigon_path_1_desc:0 "Morrigon recruits wait at the treeline until the man on the road has looked straight at them and gone on."
