 ######
 #nebo dwarf path
 nebo_dwarf_path_1: "City Of The World's Desire"
 nebo_dwarf_path_1_desc: "#G Nersak#!, #G Behddju#! and #G Jakkishtu#!; the names of these three poles inspire dreams of grandeur and prosperity. Whether in the hearts of men or #T Dwarves#!, the prestige of dwarven architecture has flowed along the #Y Baetep#! for centuries, until the three sisters cities, guardians of the springs, now seem to belong to the realms of myth and legend."
 nebo_dwarf_path_2: "Skill Engineers"
 nebo_dwarf_path_2_desc: "#Y Dwarven#! ingenuity was already renowned in the days of the #Y Zani#! occupation. Blacksmiths, masons and carpenters were in demand in the imperial capital. Despite the prejudice between #T Humans#! and #T Dwarves#!, a great number of them reached important positions in the administration."
 nebo_dwarf_path_3: "Armored Infantry"
 nebo_dwarf_path_3_desc: "The #T Golden Dwarves#! have made themselves blacksmiths of the world. As well as being excellent traders, #T Dwarves#! have proven their expertise time and time again, making them a real pillar of military manufacture. No wonder then that #Y Dwarf#! armies are able to procure cheap armor on a large scale - a difference that can be felt on the battlefield."
 nebo_dwarf_path_4: "Heavy Shields"
 nebo_dwarf_path_4_desc: "Taking advantage of their small size, the #T Dwarves#! have put in place an adapted fortification system. The garrisoned troops undergo specific training for the task and wield heavy shields, which guarantee most of their physical integrity on the ramparts and can easily be used to repel any attackers."
 nebo_dwarf_path_5: "Golden Tribute"
 nebo_dwarf_path_5_desc: "The Golden #T Tribute#! refers to an age-old practice in #Y Dwarven#! foreign policy. In exchange for #Y Dwarven#! protection, certain cities were asked to pay tribute in gold and other minerals. Whether it be iron, copper and bronze, the dwarf overlords were thirsty for minerals to feed their forges."
 nebo_dwarf_path_6: "Golden Civilization"
 nebo_dwarf_path_6_desc: "The #Y Golden Dream#! is a nostalgic delusion for some, a future within reach for others. This expression refers to a possible return of the #T Golden Empire#!; an ambition hidden in the hearts of every dwarf, driving them to surpass themselves in their lives, climbing rung after rung to be worthy of their ancestors."
 nebo_dwarf_path_7: "Nebo War Exhaustion"
 nebo_dwarf_path_7_desc: "A prominent general was born in the #T Nebo#! lands. Having defended the land of his ancestors in numerous campaigns, he has agreed to join our court. The stories of his battles has already inspired the entire country to serve our cause to the last breath."
 nebo_dwarf_path_end_bonus: "King Of Nebo"
 nebo_dwarf_path_end_bonus_desc: ""
 #####
 #####
 #larsa dwarf path
 larsa_dwarf_path_1: "Exotic Soldiers"
 larsa_dwarf_path_1_desc: "The wealth of the #T Dwarves#! naturally led to the use of mercenaries. They played an important role in the defense of the realms. Negotiators are responsible for dealing with the various mercenary groups throughout the year. What's more, the cities themselves offer generous guarantees and advances in exchange for their services, making the #Y Dwarf#! Kingdoms highly attractive to any respectable mercenary."
 larsa_dwarf_path_2: "Golden Dwarf Tolerance"
 larsa_dwarf_path_2_desc: "Far from their homes in Ardent Range, and isolated from their fellows #T Dwarves#!, the #T Golden Dwarves#! have grown up with a sense of brotherhood among themselves. Throughout history, many of their cities have come to the rescue of others. In times of crisis, a Golden #Y Dwarf#! knows he can always count on his brother on the other side of the walls." 
 larsa_dwarf_path_3: "Heavy Infantry Of Kadashman"
 larsa_dwarf_path_3_desc: "The #T Kadashman#! Guard has built up a great deal of prestige over the last few decades. Defending the independence of a petty kingdom against the #Y Baetep#! giant, their tactics and composition have been passed on to the other #Y Dwarven#! Kingdoms so that their legacy is not forgotten."
 larsa_dwarf_path_4: "Golden Dwarf Colonies"
 larsa_dwarf_path_4_desc: "Moving eastwards towards new peaks, the #T Golden Dwarves#! have retained the practices of their ancestors, setting up military colonies as outposts in hostile territories. This method enabled them to pacify a large number of territories, by establishing a permanent dwarf presence and defending the natives and itinerant traders from any bandits. The #T Dwarves#! were then seen as the legitimate rulers of these colonised lands."
 larsa_dwarf_path_5: "Strong Arrows"
 larsa_dwarf_path_5_desc: "Despite their resilience, #T Dwarves#! have recognized the difference in size between themselves and the others races of the world, which puts them at an obvious disadvantage in melee combat. Faced with this situation, #Y Dwarf#! armies have focused on the discipline of their skirmishers, in order to gain the upper hand even before the armies make contact."
 larsa_dwarf_path_6: "The Camelry Of Karksm"
 larsa_dwarf_path_6_desc: "The inhabitants of #Y Karksm#! have trained in the art of camelry to tame the harshness of the desert. Far from denying their qualities, the #T Golden Dwarves#! have recognized the advantages of using camels in their ranks, as they are more enduring in the #Y Azari#! climate than their traditional steeds, which are often exhausted by the journey before the battle has even begun."
 larsa_dwarf_path_7: "Armored Horse Archers"
 larsa_dwarf_path_7_desc: "War is often decided by the fall of a stronghold, and the #T Dwarves#! are well aware of the importance of this, having set up an elite scouting force for sieges. They are responsible for overseeing any enemy exits and exploiting them to the full potential, sometimes going as far as storming an momentarily open passageway, surprising the enemy and clearing the path for the rest of the army."
 larsa_dwarf_path_end_bonus:0 "The Golden Tablet"
 larsa_dwarf_path_end_bonus_desc:0 ""
