l_english:
 # New World country-specific heritages (auto-generated)
 jade_throne_heritage: "Splendor of the Jade Throne"
 jade_throne_heritage_desc: "The Tenmari Jade Empire is the oldest power of the east, its capital a wonder of stepped jade pyramids linked by stone roads to a hundred tributary cities. Its trade reaches every shore and its losses are swiftly replaced, but maintaining the grand legions of an empire is a costly affair."
 zsskarath_heritage: "Legions of Zss'Karath"
 zsskarath_heritage_desc: "Within the black basalt halls of Zss'Karath, hatchling broods are drilled in the cold discipline of the Old Drake from the moment they break their shells. Few armies can match the patient, scaled phalanxes of the Dominion, though their disdain for the unscaled makes converts hard to win."
 qadiir_league_heritage: "The Qadiir Compact"
 qadiir_league_heritage_desc: "The Qadiir Free Cities are a compact of caravan-ports where the oases meet the sea, and gold flows through their bazaars like water. Their counting-houses are the envy of the continent, but a people raised to trade rather than to fight make for reluctant soldiers."
 sultanate_dunes_heritage: "Throne of the Shifting Sands"
 sultanate_dunes_heritage_desc: "The Sultan of the Tsaalan rules from a moving court that follows the seasons across the waste, his word law from one horizon to the next. His swift riders are feared raiders and his person beloved, but a realm without fixed cities yields little in the way of taxes."
 tidedom_heritage: "Masters of the Tidedom"
 tidedom_heritage_desc: "The Selkanu Tidedom commands the warmest reefs and the busiest straits, and its war-fleets are crewed by those born to the water. No power rivals it upon the waves, but its land armies are an afterthought, expensive to raise and ill at ease far from the shore."
 greathive_heritage: "The Endless Brood"
 greathive_heritage_desc: "At the heart of the Chivix lies the Greathive itself, a mountain hollowed into a single living city from which the brood pours without end. Its swarms can drown any foe in sheer numbers, but the Concord has no use for coin and lets commerce wither."
 skyrealm_heritage: "Crown of the Skyrealm"
 skyrealm_heritage_desc: "The Ayrith Skyrealm is ruled from the highest aerie of all, where the Wind-Crowned monarch reads the omens of the storm. Its archers loose from the cliffs and its hosts cross trackless peaks with ease, but its scattered eyries are a constant drain to garrison."
 emberforge_heritage: "Hammers of the Emberforge"
 emberforge_heritage_desc: "The Khedrim Emberholds are a war-state forged around the great volcanic foundries, where rank is won in the legion and the smithy alike. Their armoured columns are superb, but the smouldering highlands are a grim place to raise the young."
 underholds_heritage: "Vaults of the Underholds"
 underholds_heritage_desc: "The Vothkin Underholds are a realm of sealed gates and mile-deep vaults, where the oldest oaths are graven in living rock. No siege has ever breached their heart and their mines run rich, but their columns are slow and uneasy beneath the open sky."
 packlands_heritage: "Law of the Packlands"
 packlands_heritage_desc: "The Ulvenar Packlands answer the Moon-King, but only so long as the hunt goes well. Their warriors are ferocious and their courage legendary, yet every war-leader eyes the throne, and loyalty among the packs is a fragile thing."
 verdance_heritage: "The Green Verdance"
 verdance_heritage_desc: "The priest-gardeners of Mycelar Verdance tend groves that have grown unbroken since the first spore, and their blessings linger long upon the faithful. Life flourishes wherever they walk, but theirs is a gentle people, slow to take up the spear."
 soluun_heritage: "Rites of the Cenotes"
 soluun_heritage_desc: "The god-kings of Soluun rule from the sacred sinkholes, where the waters are said to whisper fate. Their elaborate rites bind their people in devotion, but the closed mysteries of the cenotes are jealously kept from outsiders."
 spore_court_heritage: "The Spore-Court"
 spore_court_heritage_desc: "The Greater Mycelar Spore-Court governs by a parliament of elder fungi whose spores carry every decree on the wind. Conquered peoples are quietly drawn into the bloom and the granaries overflow, but its citizen-levies are an undisciplined lot."
 teoitz_heritage: "The Iron Princedom"
 teoitz_heritage_desc: "Teoitz broke from the Jade Empire under a warlord-prince and has lived by the sword ever since. Its drilled soldiers are the finest of the southern jungles, but a state held together by a strongman's fist is forever a single quarrel from chaos."
 exile_khanate_heritage: "The Exile Horde"
 exile_khanate_heritage_desc: "Cast out across the sea, the Tsaalan Exile Khanate carries its whole nation in the saddle, owning nothing it cannot ride away with. None can outrun or outflank the horde, but a people with no cities have almost nothing to tax."
 garruk_heritage: "The Raidholds"
 garruk_heritage_desc: "The Garruk Raidholds live for the next raid, their wealth measured in plunder and scars. They weather long wars where others break, but they have neither patience nor talent for honest trade."
 maru_heritage: "The Reef Oligarchy"
 maru_heritage_desc: "The Maru Reefholds are ruled by a council of pearl-rich families whose fortunes rise and fall with the tides. Their sailors are bold and their markets rich, but their hired land-soldiers have little stomach for a fight."
 stormholds_heritage: "The Stormholds"
 stormholds_heritage_desc: "The Ayrithian Stormholds cling to the lightning-wracked southern cliffs, where to fly is to dare the tempest. Their storm-riders are peerless archers and capable sailors, but their wind-blasted holds are forever in need of repair."
 drakvorssa_heritage: "The Drakvorssa Concession"
 drakvorssa_heritage_desc: "Free Drakvorssa is an oddity, a Saurthi merchant-city that traded scripture for ledgers and grew fat brokering between the deep-folk and the coast. Its wharves are among the richest in the east, but its citizens would rather pay for soldiers than be them."
