l_english:
 omni_hc_title:0 "THE HELLUVIAN FAITH"
 omni_hc_authority:0 "Authority of the Shahanat: #Y [GuiScope.SetRoot( Player.MakeScope ).ScriptValue('omni_hc_authority')|0] / 100#! — [Player.Custom('omni_hc_authority_tier')]"
 omni_hc_authority_tt:0 "#T Shahanat Authority#! affects the office realm and AI support for an Omostthanat. Powers do not spend it.\n\n#COLOR:{0.95,0.36,0.36} 0-24 Weak#!: #R -20%#! Political Influence, #R -5%#! state religion happiness, #R -20%#! conversion speed; AI support weight x0.25.\n#COLOR:{0.95,0.65,0.30} 25-49 Fragile#!: #R -10%#! Influence, #R -2.5%#! happiness, #R -10%#! conversion; support x0.5.\n#COLOR:{0.50,0.70,1.00} 50-74 Established#!: no modifiers; support x1.\n#COLOR:{0.38,0.82,0.48} 75-89 Respected#!: #G +10%#! Influence, #G +2.5%#! happiness, #G +10%#! conversion; support x1.5.\n#COLOR:{0.78,0.56,1.00} 90-100 Supreme#!: #G +20%#! Influence, #G +5%#! happiness, #G +20%#! conversion; support x2.\n\nSupport weights affect AI pledges and donations, not guaranteed acceptance. Realm effects apply only to the Shannah and refresh monthly or when Authority changes. Losing Ddu-Nuinop reduces effective Authority by #R 10#!.\n\nRecognition: #G +2#!; rejection: #R -2#! (each capped at 20 per accession). Council: #G +2#! to #G +6#! every three years, depending on agenda and turnout. First pastoral act each year: #G +3#!. Upkeep each year: #R -2#! above 75, #R -1#! above 50. Succession: #R -5#!; claiming office: #R -10#!; scandal: #R -5#! (one scandal is absorbed after the council disciplines the clergy)."
 omni_hc_tier_weak:0 "#COLOR:{0.95,0.36,0.36} Contested#!"
 omni_hc_tier_fragile:0 "#COLOR:{0.95,0.65,0.30} Fragile#!"
 omni_hc_tier_established:0 "#COLOR:{0.50,0.70,1.00} Established#!"
 omni_hc_tier_respected:0 "#COLOR:{0.38,0.82,0.48} Respected#!"
 omni_hc_tier_supreme:0 "#COLOR:{0.78,0.56,1.00} Ascendant#!"
