 omni_hc_incumbent:0 "You hold the Shahanat. Use the administration controls below."
 omni_hc_administration:0 "ADMINISTER THE SHAHANAT"
 omni_hc_select:0 "Choose a country"
 omni_hc_select_desc:0 "Choose an eligible realm. Selection is free; confirmation checks the current ruler, costs and requirements again."
 omni_hc_empty:0 "No eligible countries. Close this list and try again after circumstances change."
