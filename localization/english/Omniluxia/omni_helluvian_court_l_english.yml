 omni_hc_inbox:0 "Review Petitions"
 omni_hc_crusade:0 "Call an Omostthanat"
 omni_hc_council:0 "Convene a Pastoral Council"
 omni_hc_council_tt:0 "Summon the faithful to the Apostolic Palace. Every uncondemned Helluvian realm is invited and replies: a delegation with gifts, observers, a refusal, or (for realms contesting the Shannah) a secret agent. Sixty days later choose one agenda for 25 Political Influence: Canons of Unity, Discipline the Clergy, an Embassy to a dissenting realm, or Endow the Faith. An incident follows some weeks later. Available once every three years, including across succession."
 omni_hc_confirm:0 "Issue the proclamation."
 omni_hc_cancel:0 "Leave this matter for another day."
 omni_hc_confirm_desc:0 "The proposed recipient is #Y [SCOPE.sC('omni_hc_recipient').GetName]#!. Review the consequences before confirming. No resources have been spent yet."
 omni_hc_recognize:0 "Recognize the Shannah"
 omni_hc_condition:0 "Recognize Conditionally"
 omni_hc_contest:0 "Contest the Accession"
 omni_hc_recognition_tt:0 "Independent foreign Helluvian realms may declare once per Shannah. Recognize: +2 Authority. Contest: -2. Conditional: no change. Gains and losses each cap at 20 per accession. No Favor or gold cost."
 omni_hc_petition_tt:0 "Choose an eligible realm to petition for excommunication. Costs 85 Favor on submission, even if refused."
 omni_hc_inbox_tt:0 "Available only when a petition awaits your current Shannah. Choose a realm to review its petition."
 omni_hc_direct_tt:0 "Choose an eligible foreign recipient. Ordinary power costs and cooldowns apply; Favor is not charged."
 omni_hc_crusade_tt:0 "Requires peace, 250 gold and 50 Political Influence; ten-year cooldown. No other holy campaign may be preparing or active. Choose an eligible non-Helluvian realm, then confirm payment."
 omni_hc_bad_selection:0 "The selected country or officeholder is no longer eligible. Close and reopen the country list."
