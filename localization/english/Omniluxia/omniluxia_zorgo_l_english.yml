l_english:

 me_zorgoomni.110_title: "A Fish Fit for a Throne"
 me_zorgoomni.110_desc: "The night watch has a story for you, my liege! They have brought a prisoner to [ROOT.GetCountry.GetCapital.GetName|G] and, of all things, a fish. The prisoner is [SCOPE.sChar('fish_bearer').GetName|Y], who swears the fish was caught on a voyage past the #G Bloody Isles#! and that a gift of the first catch brings fair winds to any house that accepts it.\n\nThis might have been a charming custom had the fool waited until morning. Instead, the watch found your benefactor halfway through your bedroom window with a fish so large it took two guards to carry it downstairs. The cook has already sharpened a knife, the stairs are silver with scales, and the watch would very much like to know whether they may stay for breakfast."
 me_zorgoomni.110.a: "Pay for the fish. The watch can have the first helping."
 me_zorgoomni.110.b: "Let the watch teach our guest to use the front door."
 me_zorgoomni.110.c: "A stranger at my window after dark is a threat. Put them to death."

 me_zorgoomni.111_title: "The Art of Finding Safe Water"
 me_zorgoomni.111_desc: "There is a new student of statecraft at court, my liege, and it seems you are the tutor. [SCOPE.sChar('court_pupil').GetName|Y] has taken to following you through the halls of [ROOT.GetCountry.GetCapital.GetName|G], taking down every word you say on a wax tablet. There are already three columns on the proper reception of an envoy and half a page on when it is wiser to pretend you have heard nothing.\n\nAn #Y Ularian#! pilot waiting on an audience saw the tablet and laughed, for your kinsman was learning to steer a court the same way a sailor learns a reef, by watching where the old hands keep their eyes. Watch the pilot's hands, mark where the wrecks lie, and ask your questions while there is still time to change course."
 me_zorgoomni.111.a: "Come along, then. We have a difficult audience this afternoon."
 me_zorgoomni.111.b: "Put away the tablet. You'll learn more with a seat of your own."

 me_zorgoomni.112_title: "The Last Tally"
 me_zorgoomni.112_desc: "Dire news from the crossing outside [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. We found [SCOPE.sChar('tax_collector').GetName|Y] beneath the bridge. A knife had gone clean through the leather satchel and into the collector's ribs. Whoever rifled the satchel left the tally book behind, though the river had soaked it so thoroughly that we could scarcely make out the names.\n\nA merchant from the #G Bloody Isles#! was warming himself at the tollkeeper's fire, and offered to tell us what he saw in return for safe passage, but by the time our guards thought to ask where he was staying, his caravan had gone. The villages are already saying the debts died with the collector."
 me_zorgoomni.112.a: "Send word to the family. I want the crossing watched."

 me_zorgoomni.113_title: "The Fleet in Miniature"
 me_zorgoomni.113_desc: "The shipwrights have a curious request for you, my [ROOT.GetCountry.GetRulerTitle]. They would like to hold an exhibition in [ROOT.GetCountry.GetCapital.GetName|G]. They would fill a public square with model ships, from the shallow boats that slip through the inlets of the #G Bloody Isles#! to the deep-bellied vessels that make the long crossing to the #G Lands of the Snakefolk#!.\n\nThey brought a model rigged in silk thread, and an old pilot spent the whole audience trimming its sails with two fingers, as solemn as if a month's cargo depended on it. The shipwrights say the exhibition could teach apprentices how foreign crews build and handle their vessels. They ask for enough coin to pay the model makers and bring the pilots in from abroad."
 me_zorgoomni.113.a: "Pay the shipwrights. Give the apprentices the best seats."
 me_zorgoomni.113.b: "The treasury has work for full-sized ships."

 me_zorgoomni.114_title: "A Crow at Court"
 me_zorgoomni.114_desc: "We had a rather unusual audience this morning, my liege. [SCOPE.sChar('bird_merchant').GetName|Y] has brought a crow to [ROOT.GetCountry.GetCapital.GetName|G], claiming to have bought it from a pilot who sailed the #G Orcish Sea#!. For a modest sum, we were told, the bird could be taught to praise your name before an audience.\n\nWhen the merchant lifted the cloth, the crow looked straight at you, cocked its head as if weighing a clipped coin, and said, 'Count your fingers. The ruler's been at the till.' Someone at the back of the hall laughed before the guards could see who it was. The merchant insists the bird must have picked it up aboard ship."
 me_zorgoomni.114.a: "Buy the bird. At least one creature in this hall speaks freely."
 me_zorgoomni.114.b: "Take the merchant outside. I want the laughter to stop."

 me_zorgoomni.115_title: "The Gate Without a Tally"
 me_zorgoomni.115_desc: "A trader has brought word of a custom worth hearing about, my [ROOT.GetCountry.GetRulerTitle]. He tells of a town in the #G Bloody Isles#! where the toll gate stands open for a day at the close of the sailing season. Fishers, potters, and farmers bring their goods to market without paying a copper at the gate. Families that could scarcely afford salt the day before go home with enough to put down their winter stores.\n\nThe guilds of [ROOT.GetCountry.GetCapital.GetName|G] have asked for such a day here. They have already set aside stalls for the smallest traders and sworn to keep the main street clear. Your collectors came with a second proposal, a wax tally of what the crown might earn by taxing the very stalls it has promised to open."
 me_zorgoomni.115.a: "Open the gate. Let the smallest traders come through first."
 me_zorgoomni.115.b: "If the crowd will come anyway, charge them for the privilege."

 me_zorgoomni.201_title: "Two Claims to One Stone"
 me_zorgoomni.201_desc: "[SCOPE.sChar('random_dude').GetName|Y], a cousin of your own house, and [SCOPE.sChar('random_dude_2').GetName|Y] have both brought deeds to the same vineyard on the hill road. One boundary stone washed downhill in the spring rains, while the other bears fresh chisel marks with the dust still white in the cuts, and our surveyor says he would believe either deed if he had never seen the other.\n\nThe claimants met at the boundary last week with their kinsmen behind them, and [SCOPE.sCharacter('random_dude_2').GetFirstName] came away with a cudgel blow that has cost him the sight of one eye. Both men now come to court with armed cousins at their backs, and the household is watching to see whether a deed weighs more than a family name."
 me_zorgoomni.201.a: "Pay for a new survey and uphold [SCOPE.sChar('random_dude_2').GetFirstName]'s claim."
 me_zorgoomni.201.b: "Give the vineyard to [SCOPE.sChar('random_dude').GetFirstName]. I have heard enough."

 me_zorgoomni.202_title: "The Idol in the Furrow"
 me_zorgoomni.202_desc: "A plough struck silver in a field outside [ROOT.GetCountry.GetCapital.GetName|G] last week, and the farmer brought what it turned up to the palace wrapped in his coat. It is a squat idol of no god our priests can name, with writing around the base so fine that the clerks had to clear the dirt from it with a needle.\n\n[SCOPE.sChar('priest').GetName|Y] wants it back in the same furrow before sundown, with an offering to whatever was buried with it, since the old people of that village have always ploughed around that corner of the field. The mint has weighed it twice and come to a different conclusion, and the farmer would like to know whether he is to be paid for silver or for trouble."
 me_zorgoomni.202.a: "Melt it down, and let us see whether the mint can spend a curse."
 me_zorgoomni.202.b: "Tell [SCOPE.sCharacter('priest').GetFirstName] to rebury it in the same spot and to offer sacrifices"

 me_zorgoomni.208_title: "The Verse They Left Out"
 me_zorgoomni.208_desc: "[SCOPE.sChar('bard').GetName|Y] and [SCOPE.sChar('bard_2').GetName|Y] came into [ROOT.GetCountry.GetCapital.GetName|G] on a trader from the #G Bloody Isles#!, having spent the crossing learning a duet the sailors use to pass a tune from the stern clear up to the bow. Both are better known in the wine shops than at court, and the debts they ran up in the last city arrived on the same ship, in a letter addressed to whoever would be fool enough to house them.\n\nThey offer to set your deeds to the sailors' tune and sing it in the market for a season, asking only for lodging and for someone at court to tell them which deeds the market ought to hear. The steward has already drawn up a list, although the bards have pointed out that the best verses usually come from the deeds a steward would leave off it."
 me_zorgoomni.208.a: "Give them the steward's list, and let them add a verse of their own."

 me_zorgoomni.209_title: "A Knife Among Kin"
 me_zorgoomni.209_desc: "Our agents have been following the money for a hired knife since the spring, when a gatekeeper at the residence was paid to leave the postern unbarred on a night of his choosing. The silver passed through three hands before it reached him, and the last of them kept a receipt folded small enough to hide in a boot.\n\nThe receipt bears the seal of [SCOPE.sChar('cousin').GetName|Y], who sits at your table on feast days and has never wanted for anything a member of your own house could ask. The gatekeeper is under guard, and the agents ask whether to make the arrest before the household learns he has been taken."
 me_zorgoomni.209.a: "Put [SCOPE.sChar('cousin').GetFirstName] in irons until we know who else was involved."

 me_zorgoomni.211_title: "Cloth Made Of Clouds"
 me_zorgoomni.211_desc: "A merchant from across the #T Orcish Sea#! has set up in the market of [ROOT.GetCountry.GetCapital.GetName|G] with bolts of silk so fine that he draws a length of it through a signet ring to prove it. The wealthy families came to see the trick and stayed to buy, and within a month half the court was wearing his cloth to the assembly.\n\nThe weavers outside the gate say their own looms have gone quiet since he arrived, and one of them has started reckoning the price of a single sleeve in gold coins for anyone who will listen. The older families grumble that silver leaving the city for a foreign merchant's ship does not come back, while the younger ones have already ordered their festival clothes."
 me_zorgoomni.211.a: "Ban the wearing of silk for one year."
 me_zorgoomni.211.b: "Let them buy their silk. I have work to do."

 me_zorgoomni.213_title: "The Offering at Low Water"
 me_zorgoomni.213_desc: "At the next low water, the priests of #T Peauxdu Houmon#! will carry bread and lamps out over the wet stones to the shrine of [GetDeityDefinition('omen_ugone').GetName|Y], as they have done every year since the shrine was built on the tidal rocks. The families who follow the procession wrap their lantern seams in leather to keep out the spray, and some walk for days to reach the shore in time.\n\n[SCOPE.sChar('jerk').GetName|Y] has come to court to ask for a gift toward the oil and the bread, since more families came last year than the shrine could feed. The keeper says the court has given before, and the pilgrims always ask whose lamp is burning at the head of the procession."
 me_zorgoomni.213.a: "Send the oil and bread, and tell the keeper to light a lamp in our name."
 me_zorgoomni.213.b: "The treasury is thin, so let the keeper make do with what the tide brings."

 me_zorgoomni.214_title: "Whose Cargo Is It?"
 me_zorgoomni.214_desc: "Two traders are claiming the same cargo on the quay at [ROOT.GetCountry.GetCapital.GetName|G]. [SCOPE.sChar('random_bro').GetName|Y] paid to ship the bales across the sea, while [SCOPE.sChar('random_bro_2').GetName|Y] paid a crew to haul them off a reef after the ship ran aground short of the harbor, and each says the other would have nothing to sell without him.\n\nThe harbor master has told them the bales will stay where they are until you decide who gets them. The sea custom favors the salvage crew, the shipping contract favors the owner, and both crews are standing on the quay with their sleeves rolled up, waiting to see which of them the court will disappoint."
 me_zorgoomni.214.a: "The bales go to [SCOPE.sCharacter('random_bro_2').GetFirstName], who brought them off the reef."
 me_zorgoomni.214.b: "The bales go to [SCOPE.sCharacter('random_bro').GetFirstName], who paid to ship them."
 me_zorgoomni.214.c: "Threaten them both with exile unless they stop arguing."

 me_zorgoomni.215_title: "A Roof for the Shrine"
 me_zorgoomni.215_desc: "A tremor split the roof of a shrine of #T Peauxdu Houmon#! before dawn this morning, my [ROOT.GetCountry.GetRulerTitle]. The keeper got the lamps out just as the beams came down, and there was enough oil left in one to light the morning prayers in the yard, where the priests have laid the offerings out under a sail borrowed from the harbor.\n\nThe masons say the walls are sound and the roof can be raised again before the rains, if the court pays for the timber and the tiles. The pilgrims keep arriving all the same, and the priests ask whether they should tell them the crown means to rebuild, or that the gods will have to make do under canvas."
 me_zorgoomni.215.a: "Because the gods take care of us, we shall take care of them"
 me_zorgoomni.215.b: "The shrine can make do under canvas."

 me_zorgoomni.216_title: "Beyond the Last Sounding"
 me_zorgoomni.216_desc: "[SCOPE.sChar('traveler').GetName|Y] has come home to [ROOT.GetCountry.GetCapital.GetName|G] from the #G Lands of the Snakefolk#! with a roll of soundings, a sunburned crew, and a crate they refuse to open below deck. Inside is the bronze likeness of a creature with a serpent's body and the head of a cat, taken from a ruined shrine where the jungle had grown over the doorway.\n\nThe captain will part with the bronze for enough coin to fit out a second voyage, since he means to go back for the soundings he could not finish. The crew would be glad to have it off the ship at any price, and they say the cat's eyes follow whoever is standing at the tiller."
 me_zorgoomni.216.a: "We cannot spare the coin right now."
 me_zorgoomni.216.b: "Buy the bronze, and have the crate opened on the quay."

 me_zorgoomni.217_title: "Lessons in the Rigging"
 me_zorgoomni.217_desc: "[SCOPE.sChar('teacher').GetName|Y], the household tutor, has come to you with a stack of untouched exercises and ink on his sleeves. [SCOPE.sChar('pupil').GetName|Y] promised to finish the lessons by supper, and was last seen halfway up the mast of a coaster in the harbor, with ink still on both hands and the harbor boys shouting advice from below.\n\nThe tutor says the child learns more knots in an afternoon than letters in a month, and he would like you to settle whether tomorrow's lesson takes place at the desk or on the quay. The child, who has heard he is here, has sent word that the harbor boys know a great deal about the stars."
 me_zorgoomni.217.a: "Tomorrow the tutor decides where lessons take place."
 me_zorgoomni.217.b: "Leave them to it, and perhaps the mast will teach what the tablet could not."

 me_zorgoomni.219_title: "Hands on the Tiller"
 me_zorgoomni.219_desc: "We sent a messenger this morning to bring your heir to council, and after searching the palace, the stables, and the garden, he found them down at the harbor with a hand on the tiller of a coaster working out past the mole. The spray was coming over the rail, half the deck was shouting advice, and your heir was laughing too hard to hear any of it.\n\nThe captain says the ship came about cleanly all the same, which is more than he can say for some of the hands he pays. He would gladly take your heir out again on the next fair morning if the council can spare them, and he has already asked the messenger whether the palace keeps its own oilskins."
 me_zorgoomni.219.a: "Have the captain keep teaching them."

 me_zorgoomni.220_title: "A Voice That Carries"
 me_zorgoomni.220_desc: "A speaker named [SCOPE.sChar('orator').GetName|Y] has arrived in [ROOT.GetCountry.GetCapital.GetName|G] with letters from three cities and a story about holding a mutinous crew silent without raising his hand. He claims he can fill the market square in two sentences, and the crowds that follow him from the gate to his lodgings suggest he may not be exaggerating.\n\nHe offers to give a speech in your honor at the next market day, for a fee, and points out that the court need spend nothing on heralds, since word of his first sentence will fill the square before he reaches the second. The councilors who heard him at the gate think he would be cheap at twice the price."
 me_zorgoomni.220.a: "Pay his fee, and give him the steps of the temple."

 me_zorgoomni.221_title: "Lightning in the Square"
 me_zorgoomni.221_desc: "Lightning struck the new bronze statue in the market of [ROOT.GetCountry.GetCapital.GetName|G] on its first night in the square, and the stallholders found it face down among their stalls this morning. The priests say the gods have refused the gift, since the bolt came out of a clear sky and struck nothing else in the city.\n\nThey call for the statue to be buried with an offering, so that the gods will see the city has understood. A clerk from the mint has already been round the square gathering bronze fingers in a basket, and he says that a statue the gods have refused is still worth a great deal by weight."
 me_zorgoomni.221.a: "Bury the statue and make the offering."
 me_zorgoomni.221.b: "Fire up the furnaces. Send the bronze to the mint."

 me_zorgoomni.222_title: "Mud Under the Keel"
 me_zorgoomni.222_desc: "A coaster ran aground beyond hailing distance of the quay at [ROOT.GetCountry.GetCapital.GetName|G] this week, and when its pilot dropped a line, the lead came up black with mud where last year there was water enough for a laden ship. The river has been silting the channel for years, and the harbor master says this is only the first ship to find out how far.\n\nThe engineers can dredge the channel if we pay for enough crews and barges to finish before the autumn trade. The sailors would rather not wait that long, and they warn that if the court will not pay, they will be the ones clearing the mud with their own boats and their own backs."
 me_zorgoomni.222.a: "Hire the dredgers before another ship runs aground."
 me_zorgoomni.222.b: "Tell the crews to clear the channel with what they have."

 me_zorgoomni.223_title: "The Broken Betrothal"
 me_zorgoomni.223_desc: "[SCOPE.sChar('random_dude_from_rome').GetName|Y] and [SCOPE.sChar('random_dude_2_from_rome').GetName|Y] agreed over supper last spring that a son of one house would marry a daughter of the other, and they sealed it with a cup each and no witness but the steward who poured. Since then they have disagreed about whether the vineyard on the river terraces was part of the dowry or was only mentioned while the wine was going round.\n\nBoth men have cornered you in the courtyard with their stewards and their tallies, and each has made it plain that a judgment against him will be remembered. Their children, who had the good sense to agree on the match, are waiting under the colonnade, while the steward who poured the wine has asked for leave to visit his sister in the country."
 me_zorgoomni.223.a: "Hear them both, and judge by the terms they can prove."
 me_zorgoomni.223.b: "Find out which house will pay more for my good opinion."

 me_zorgoomni.224_title: "A Horse Before a Lesson"
 me_zorgoomni.224_desc: "The tutors have finally found [SCOPE.sChar('heir').GetName|Y], my [ROOT.GetCountry.GetRulerTitle]. He was racing a favorite horse along the outer wall with his school tablet tied to the saddle, and he only stopped when the grooms ran out to the road and stood across it with their arms spread.\n\nThe head tutor asks for leave to keep tomorrow's lesson indoors, and would be grateful if the stablemaster could be told that this applies to the horse as well. The stablemaster, for his part, says the boy already sits a horse better than half your cavalry, and asks only that someone teach him to stop."
 me_zorgoomni.224.a: "Hire a tutor who can keep a boy indoors."
 me_zorgoomni.224.b: "Let the boy ride. The tablets can wait."

 me_zorgoomni.225_title: "A Feast of Their Own Making"
 me_zorgoomni.225_desc: "There is a holiday in [ROOT.GetCountry.GetCapital.GetName|G] today, my [ROOT.GetCountry.GetRulerTitle], though nobody at court remembers declaring one. The shopkeepers shut their doors at noon and rolled wine barrels into the street, and by sunset a whole quarter had carried its supper outdoors and set the tables end to end down the middle of the road.\n\nThe watch captain says the carts cannot get through and the neighbors show no sign of finishing before midnight. He asks whether he should clear the road or wait until the last bowls have been passed down the tables, since several of his own men live in that quarter and were invited."
 me_zorgoomni.225.a: "Leave them to their supper, and see that the watch gets a bowl."

 me_zorgoomni.226_title: "The Empty Muster Roll"
 me_zorgoomni.226_desc: "The latest muster has left your captains with a problem, my [ROOT.GetCountry.GetRulerTitle]. Some families have sent the last adult who can carry a shield, while others have answered the call with an empty doorstep and a cold hearth, and the companies that marched out at full strength last year are coming back at half.\n\nThe officers say there are still hands to be had if we open the ranks to men who would never ordinarily carry our colors, such as freedmen, debtors, and the sons of foreigners who settled here a generation ago. The old families will not like it, and the captains admit that some of the new men will need to be taught which end of the spear goes forward."
 me_zorgoomni.226.a: "Open the muster to those we ordinarily turn away."
 me_zorgoomni.226.b: "Keep the old rules. We will make do with fewer men."

 me_zorgoomni.227_title: "Who May Bear a Shield?"
 me_zorgoomni.227_desc: "The heads of the old houses came to the senate house this morning with a petition and a list of their dependents, my [ROOT.GetCountry.GetRulerTitle]. They want more of their own households on the levy rolls, since a family that sends its clients to the muster also gets a say in who leads them. The captains came in behind them with a tally of their empty places and laid it on the bench between the petitioners.\n\nThe captains say the houses are welcome to the places if they bring shields to fill them, though they doubt half the names on the list have ever stood in a line. The old houses answer that the captains have been asking for men for three seasons, and that it is late in the year to complain about where the men come from."
 me_zorgoomni.227.a: "Enlarge the levies. Let the old houses answer the muster."
 me_zorgoomni.227.b: "Tell the old houses to listen to the captains."

 me_zorgoomni.228_title: "The Price of Forage"
 me_zorgoomni.228_desc: "Complaints have followed the army back to [ROOT.GetCountry.GetCapital.GetName|G], carried by village headmen who walked in behind the baggage train. Our soldiers took grain at the first village on the march, cattle at the second, and the doors off the third for firewood, and the villages farther down the road have begun burying their seed in jars before the column comes in sight.\n\nThe officers admit there is a problem, although they warn that a hanging or two will cost us men we cannot replace while the war goes on. The headmen want the offenders punished and the grain repaid, and they have brought a list of the companies whose standards they remember."
 me_zorgoomni.228.a: "Cut their privileges until they remember their orders."
 me_zorgoomni.228.b: "Punish the offenders. I will answer for the losses."

 me_zorgoomni.230_title: "Spears Below Stairs"
 me_zorgoomni.230_desc: "The steward lifted a loose board in the kitchen storeroom this morning, looking for the rats that have been at the flour, and found a bundle of spearheads wrapped in sacking instead. There were thirty of them, all cut to the same length and ground to the same edge, which our armorer says could only have been done by someone working to an order.\n\nUnder questioning, the kitchen servants have given us enough to put names to several households across the city, where enslaved servants were waiting for a signal to take up the spears. Those households are under guard tonight, but the free servants in the palace have started locking their doors, and the masters in the city want to know why nobody in the kitchens noticed sooner."
 me_zorgoomni.230.a: "Double the watch on the servants' quarters, and search every storeroom."

 me_zorgoomni.231_title: "Fever at the Quay"
 me_zorgoomni.231_desc: "A fever has gone from berth to berth along the quay at [ROOT.GetCountry.GetCapital.GetName|G], leaving sailors shaking too hard to hold a cup and then coming back on them just when they think they can climb a gangplank. Our apothecary, [SCOPE.sChar('apothecary').GetName|Y], had the port gates shut three days ago, and the ships riding at anchor have been sending their sick ashore in boats after dark.\n\nThe families inside the gates want them opened so the boats can land fish and grain, while the families outside want the sick kept on board. The healers say the fever is beginning to slacken among those who caught it first, and they ask for a few more weeks before anyone is allowed back through."
 me_zorgoomni.231.a: "Keep the gates shut. The healers need time."

 me_zorgoomni.232_title: "A Seat for Sale"
 me_zorgoomni.232_desc: "Two men arrived at court this morning to take up the same office of harbor clerk, each carrying a letter of appointment written in the same hand. One had already paid a sign painter to put his name over the door of the clerk's house, and the painter has come up behind them to ask which name he should leave there.\n\nBoth letters came from a secretary in the household of [SCOPE.sChar('random_house_head').GetName|Y], who has been promising offices to anyone whose family would support him in the assembly. He has sent word that the matter is a clerk's mistake and offered to pay for the sign, although he has not said which of his two friends he meant to keep."
 me_zorgoomni.232.a: "Take the cost of the sign from his purse, and remind him whose offices these are."

 me_zorgoomni.233_title: "Two Voices for the Court"
 me_zorgoomni.233_desc: "A ship from across the sea put in at [ROOT.GetCountry.GetCapital.GetName|G] with a gift for the court and orders to keep the sender's name private. The gift was two enslaved scholars, brought ashore in chains that the captain had struck off on the quay so they could walk up to the palace with some dignity.\n\nOne can argue either side of a contract without needing to see it written. The other spent the first morning listening to our interpreter, corrected him politely at first, and by afternoon had taken the reed pen out of his hand. Our clerks would like to keep them both, and they would like even more to know who sent them and what that person expects in return."
 me_zorgoomni.233.a: "Put them to work in the chancery, and find out who sent them."

 me_zorgoomni.234_title: "One Cup Too Many"
 me_zorgoomni.234_desc: "Last night's supper at the house of [SCOPE.sChar('random_dinner_host').GetName|Y] ended badly. [SCOPE.sChar('random_baker').GetName|Y], who had been invited to bring up the pies, set one down too hard on the table, and the hot filling ran out across the host's best dishes and into the lap of the guest beside him.\n\nThe host called for the baker to pay for every dish, and the baker turned to you, since you were the most important person at the table and had been praising the pies a moment earlier. By then you had drunk enough of the host's good wine to believe that you alone could settle the matter, and the whole table is waiting to hear how."
 me_zorgoomni.234.a: "No need for a scene. I will pay for the dishes myself."
 me_zorgoomni.234.b: "Break all of [SCOPE.sCharacter('random_dinner_host').GetFirstName]'s other dishes for being greedy"
 me_zorgoomni.234.c: "An error this grave calls for death! Allow me the honor"

 me_zorgoomni.235_title: "Friends After Dark"
 me_zorgoomni.235_desc: "The watch has come to you in confidence about [SCOPE.sChar('heir').GetName|Y]. For some weeks he has been keeping company with men the watch knows by sight, and last night the company came home through the market with an armful of shutters for firewood, one still painted with the price of salt. None of them could be persuaded to say where they had bought them.\n\nThe watch captain says these are not common thieves, since several carry more silver than a stallholder sees in a month, and they speak of [SCOPE.sCharacter('heir').GetFirstName] as though he already sits higher than his place at your table. He has done nothing yet that a magistrate could name, and the captain would like to know how closely you want him followed."
 me_zorgoomni.235.a: "I will not move against my own blood without proof."
 me_zorgoomni.235.b: "Threaten [SCOPE.sCharacter('heir').GetFirstName] with exile and pay to have him watched"

 me_zorgoomni.237_title: "The Road in the River"
 me_zorgoomni.237_desc: "The western road has been under water since the spring floods, and this week our courier followed it until the river came up to his horse's belly. He came back dripping to ask whether anyone had paid for a ferry, because the milestones he was told to follow now stand in the current, and the carters who used to camp at the third one have moved their fires up a hill.\n\nThe headmen along the road say the old embankment failed where nobody had cleared the culverts in years, and their people will raise the road again if the crown pays them for the season they lose in the fields. Until it is done, the grain from the west will come to market late, or by the long way through the hills."
 me_zorgoomni.237.a: "Pay the villages to raise the road before the next rains."

 me_zorgoomni.238_title: "The Unsealed Letter"
 me_zorgoomni.238_desc: "Our clerk has brought an intercepted letter to court, my [ROOT.GetCountry.GetRulerTitle]. It was taken from a courier who could not say who had paid him, and it looked like evidence of treason until the clerk broke the seal and began reading aloud. By the third line he wished he had read it to himself.\n\nThe letter passes between [SCOPE.sChar('random_adulterer').GetName|Y] and [SCOPE.sChar('random_adulteress').GetName|Y], who are both married and neither to each other, and it names a house by the river where they have met since the winter. The clerk asks how much of it should be entered in the record, and whether anyone ought to find out who wanted it carried."
 me_zorgoomni.238.a: "I have better things to do than police their marriages. Burn it."
 me_zorgoomni.238.b: "Make the contents of the letter public and force them to divorce"
 me_zorgoomni.238.c: "They can buy our silence. Find out who sent the letter."

 me_zorgoomni.239_title: "The Levy That Held"
 me_zorgoomni.239_desc: "Our levies have come home from the field with the enemy's baggage on their backs, my [ROOT.GetCountry.GetRulerTitle]. They held a ditch for most of an afternoon while a larger force tried to work around their flank, and when the enemy drew off at dusk, they went across and took the carts it had left behind.\n\nAmong the spoil is a cooking kettle big enough for a company, which the taverns have already turned into a story about a whole army fed from one pot. The veterans have laid the rest out in the square and ask what share belongs to the men who carried it home, since custom gives them some of it and the treasury would like the remainder."
 me_zorgoomni.239.a: "Give the men everything they brought back."
 me_zorgoomni.239.b: "Fighting for [ROOT.GetCountry.GetName] is privilege enough"

 me_zorgoomni.240_title: "A Shutter, Then a Street"
 me_zorgoomni.240_desc: "A quarrel over the price of fish turned into a riot in the market of [ROOT.GetCountry.GetCapital.GetName|G] this afternoon. By the time the watch arrived, the stall was in pieces, someone had set a shutter alight, and the bucket the watchmen carried was still full of the fish they had just bought for supper.\n\nThe fire jumped the street while the neighbors were still arguing over who had thrown the first stone, and it took most of a quarter before it burned itself out against the old wall. Several families have lost everything they kept under their roofs, and the survivors are already naming the men they saw running from the stalls with torches."
 me_zorgoomni.240.a: "Find the men who carried the torches, and bring them before me."

 me_zorgoomni.241_title: "A Debt from Dinner"
 me_zorgoomni.241_desc: "A basket has arrived at the palace, my [ROOT.GetCountry.GetRulerTitle], and the servant who carried it up the stairs says to mind the sharp edges. Inside are the pieces of every dish your party broke at [SCOPE.sChar('random_dinner_host').GetName|Y]'s table, wrapped in straw, with a bill that lists each one by its maker and its age.\n\nThe servants say the host read the charges aloud to everyone still at the table before he sent the basket off, and that he added a line at the bottom about the price of a host's good name. The whole city will have heard about it by now, and it is waiting to see whether you pay."
 me_zorgoomni.241.a: "Send the basket back. I have settled my account."

 me_zorgoomni.243_title: "Where the Vines Grew Green"
 me_zorgoomni.243_desc: "The farmers of one of our valleys have sent their headman to court with a story that has already reached every market in the province. A stranger walked through their vineyards at the end of a dry summer, rested a hand on the withered vines as he passed, and was gone before anyone could offer him a cup of water.\n\nBy morning there were green shoots winding round the stakes the farmers had meant to pull up for kindling. They have set out bread where the stranger crossed the ditch, and the headman asks permission to build a shrine on the spot, so that whichever god walked there will know the valley noticed."
 me_zorgoomni.243.a: "The piety of the [ROOT.GetCountry.GetAdjective] faithful has been rewarded!"

 me_zorgoomni.244_title: "The Stone with a Name"
 me_zorgoomni.244_desc: "Work has stopped on the new row of houses outside the walls, my [ROOT.GetCountry.GetRulerTitle]. The builders had already hauled dressed stone out of the old burial ground and laid the first course when a mason turned a block over and found a name cut into the underside, along with the name of the dead man's father and the year he was buried.\n\nThe families of the dead have come to the site with their own carts, and they want every stone carried back where it was found. The builders say they bought the stone in good faith from a quarry agent who has since left the city, and they ask whether they may keep what they have already paid for."
 me_zorgoomni.244.a: "Return every stone to the dead, and find the man who sold them."

 me_zorgoomni.245_title: "Lanterns for the Watch"
 me_zorgoomni.245_desc: "A petition has come to the palace from the lanes behind the market of [ROOT.GetCountry.GetCapital.GetName|G]. A lamp fell in a crowded house there last month, and the neighbors passed water from hand to hand until dawn, wearing a track through the mud between the well and the fire before they could put it out.\n\nNow they want paid watchmen who walk the lanes at night with lanterns and hooks, and who have the authority to wake a household when they smell smoke. The petition is signed or marked by every family on the street, and the elder who brought it has a burn across both hands that he does not mention."
 me_zorgoomni.245.a: "The treasury cannot pay for a watch on every street."
 me_zorgoomni.245.b: "Pay for the lanterns and hooks, and tell the watch to make its first round tonight."

 me_zorgoomni.246_title: "The Toll Taken by Knives"
 me_zorgoomni.246_desc: "Our merchants no longer dare take the trade road alone. A band of escaped slaves has built a stockade in the woods beside it, and last week a muleteer came home with a cut across his face and a demand for payment folded into his hat, where the bandits put it so he could not pretend to have lost it.\n\nThe merchants now wait at the inns until there are enough wagons to travel together, and the wait has already put up the price of salt in the market. Our scouts say the band knows every path out of its camp, so clearing it will take soldiers who know the woods and are willing to stay in them for a while."
 me_zorgoomni.246.a: "Send soldiers to burn the stockade and clear the road."
 me_zorgoomni.246.b: "We cannot spare the men. The merchants will have to travel together."

 me_zorgoomni.247_title: "A Path Behind the Stockade"
 me_zorgoomni.247_desc: "Our scouts have found two ways into the stockade. One track runs straight to the gate, wide enough for two wagons and watched from the palisade day and night, while the second follows a dry ditch under the ridge and comes up behind the stockade, where the bandits keep their animals and seem to post nobody at all.\n\nThe guide who found the ditch is a charcoal burner who has lost two kilns to the band, and he will take the soldiers through it if somebody he trusts goes first. The captains are ready to march by either road, and they want to know whether you mean to lead them yourself."
 me_zorgoomni.247.a: "Show me the path under the ridge, and I will lead the men myself."
 me_zorgoomni.247.b: "Let the captains handle it. Send word when the gate is down."

 me_zorgoomni.248_title: "The Stockade Comes Down"
 me_zorgoomni.248_desc: "The stockade is ours, my [ROOT.GetCountry.GetRulerTitle]. You led the men up the ditch before first light, and when the palisade came down, a splinter from the falling timbers caught you in the eye. By the time the surgeon had tied the bandage, the soldiers had found the pack animals and the stolen bales and had put the prisoners on the road to [ROOT.GetCountry.GetCapital.GetName|G].\n\nThe surgeon cannot promise to save the eye, although he says the wound is clean. The merchants have already sent wine out to the camp, and the soldiers have begun telling each other that the stockade fell because you were looking at it."
 me_zorgoomni.248.a: "The gods give to us only what we are able to bear"

 me_zorgoomni.249_title: "A Captain Brings Back the Road"
 me_zorgoomni.249_desc: "Your troops have marched back into [ROOT.GetCountry.GetCapital.GetName|G] with the merchants turned out along the street to meet them. They brought prisoners from the stockade, the cargo the bandits had taken over the summer, and one mule carrying so many owners' marks that even the merchants stopped haggling long enough to cheer.\n\nThe captain who led the attack up the ditch is riding at the head of the column, and the merchants are already drinking his health in the market. The officers who followed him would like the court to hear his name as well, since the road was reopened while the palace waited for news."
 me_zorgoomni.249.a: "See that the troops get credit for reopening the road."

 me_zorgoomni.250_title: "Coin in the Street"
 me_zorgoomni.250_desc: "Below the palace window this morning, a child chased a single dropped coin through three stalls before a baker trapped it under his shoe. The baker held it up for the market to see, the child stood with both hands out, and the people at the stalls have stopped their own business to see whether he will give it back.\n\nYour purse is within reach of the window, and the guards, who have seen you watching, ask whether they should clear a little room in the street below."
 me_zorgoomni.250.a: "Open the shutters, for there is more than one coin in this purse."

 me_zorgoomni.252_title: "The Drill Ground"
 me_zorgoomni.252_desc: "[SCOPE.sChar('general_advisor').GetName|Y] has brought you a proposal from the drill ground, my [ROOT.GetCountry.GetRulerTitle]. A veteran of our last campaigns has offered to train the young people of [ROOT.GetCountry.GetCapital.GetName|G] before they are called to the muster, so that they arrive knowing which end of a spear goes forward and how to keep their shields together when the line is pushed.\n\nHe asks for a field, wooden weapons, and pay for himself and three old comrades through the winter. He promises the bruises will be real, since he says nothing else persuades a youngster to keep a shield up, and he has let it be known that a neighbor's captains would be glad of the same offer."
 me_zorgoomni.252.a: "It is a good idea, but the treasury cannot bear it."
 me_zorgoomni.252.b: "Fantastic idea, [SCOPE.sCharacter('general_advisor').GetFirstName], it shall be done"

 me_zorgoomni.253_title: "Smoke at the Crossroads"
 me_zorgoomni.253_desc: "An #Y Ularian#! pilgrim by the name of [SCOPE.sChar('dementive_sadhu').GetName|Y] was waiting at the crossroads when your hunting party passed this afternoon, sitting on a milestone with a pipe in his hand and a staff across his knees. He knocked the ash out against his boot, greeted you by name, and asked whether there was room for one more traveler on the last mile to the capital.\n\nHe says he has walked from the far side of the #Y Helluvian#! lands, sleeping in temples and paying for his supper with stories, and that he has heard of your court in every one of them. The guards do not like the look of his staff, which has seen more use than a pilgrim's ought to, though the huntsmen have already offered him a share of their wine."
 me_zorgoomni.253.a: "Let him walk with us. We can offer him a place at court."

 me_zorgoomni.254_title: "Steel in the Courtyard"
 me_zorgoomni.254_desc: "There has been an attack at your residence, my [ROOT.GetCountry.GetRulerTitle]. A shout woke the household before dawn, and by the time the servants had lit the lamps, there were three bodies on the paving of the courtyard and [SCOPE.sChar('dementive_sadhu').GetName|Y] was sitting on the steps, cleaning his blade with the hem of his robe.\n\nThe pilgrim you brought home from the crossroads a year ago says the men at the service gate were talking too loudly to be servants and walking too quietly to be drunk, so he drew his blade before he thought to call the guard. The captain of the guard has been very quiet since, and has asked whether the pilgrim might show his men how it was done."
 me_zorgoomni.254.a: "Have him drill the household guard. They could learn from him."

 me_zorgoomni.255_title: "A City Worth the Detour"
 me_zorgoomni.255_desc: "The innkeepers of [ROOT.GetCountry.GetCapital.GetName|G] have come to court with good news, my [ROOT.GetCountry.GetRulerTitle]. Merchants have begun marking the city on their charts as a place worth stopping even when their cargo is bound elsewhere, and the inns by the gate are always full this time of year - travelers hoping to find a bed at the last minute are often disappointed.\n\nThe innkeepers would like a few signs put up at the crossroads, since the visitors keep wandering into the vegetable market looking for the temple, and one of them has brought a trampled turnip to show the council what comes of leaving visitors to find their own way. They have offered to pay for the paint if the court will pay for the posts."
 me_zorgoomni.255.a: "We are thankful that we have such a friendly reputation"

 me_zorgoomni.260_title: "The Captain Who Counts"
 me_zorgoomni.260_desc: "A mercenary captain named [SCOPE.sChar('omega_corp_trainer').GetName|Y] has caught the attention of your officers, my [ROOT.GetCountry.GetRulerTitle]. He comes from the [GetCountry('WGA').GetName|Y], where he has a reputation for bringing home more of his troops than any commander who has hired out to the same wars.\n\nA veteran who served under him says the captain counts every sack of meal, knows where the next well is before the march begins, and can tell you how far his slowest company will get before the shadow reaches it. He is passing through [ROOT.GetCountry.GetCapital.GetName|G] on his way home, and the officers would like a chance to hear him talk."
 me_zorgoomni.260.a: "Invite the captain to supper."

 me_zorgoomni.261_title: "What the Captain Knows"
 me_zorgoomni.261_desc: "[SCOPE.sChar('omega_corp_trainer').GetName|Y] stayed long after supper, drawing his formations in spilled salt on the table and using the bread knife to show how a line folds when its flank gives way. Your officers asked more questions than they have asked anyone in years, and the cook had to send in a second loaf for the captain's demonstrations.\n\nBefore he left, the captain offered to send some of his veterans back to drill our men in earnest for a few seasons, provided we pay for their time. His company is expected home, so he cannot stay himself, but he says his sergeants teach the same lessons with fewer words and harder sticks."
 me_zorgoomni.261.a: "We cannot afford his sergeants right now."
 me_zorgoomni.261.b: "Pay for his instructors, and give them a field to work in."

 me_zorgoomni.262_title: "Milk Gone Sharp"
 me_zorgoomni.262_desc: "The dairymen around [ROOT.GetCountry.GetCapital.GetName|G] have brought a complaint to the palace. For a week the morning milk has curdled before they can carry it indoors, and it smells so strongly of garlic that the palace cook sent back the whole pail without tasting it.\n\nThe herds have not been moved and the grazing has not changed, so the villages have found their own explanation. An old woman who remembers where the plough turned up the silver idol says the furrow has been sour since the mint melted it down, and the dairymen want to know whether anyone at court will say as much to the priests."
 me_zorgoomni.262.a: "Have the dairymen empty their pails away from the wells."

 me_zorgoomni.263_title: "Seats at the Play"
 me_zorgoomni.263_desc: "Your spouse has news from the theater of [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. A new play opens tonight, with a shipwreck, a lost sailor, and a magistrate who will believe any story told by a man wearing a better coat than his own, and the company has already been thrown out of two other cities for it.\n\nYour spouse has reserved seats in the front row and has been asking the household all week what you will wear. The council meets in the morning, and the clerks have left a stack of petitions on your desk, but they say the theater rarely holds the same play for a second night."
 me_zorgoomni.263.a: "I am too busy to go to see a boring play"
 me_zorgoomni.263.b: "Yes, my dear, take the seats where we can see the sailor's face."

 me_zorgoomni.264_title: "The Last Act"
 me_zorgoomni.264_desc: "The play was the talk of the street by the time you got home, my [ROOT.GetCountry.GetRulerTitle]. The theater fell silent when the sailor took off his coat and everyone saw the magistrate's seal sewn into the lining, and the crowd was still arguing about it at the doors when the last lamps were put out.\n\nYour spouse quoted a line from the last act all the way home, getting it a little closer to right each time, until even the guard walking ahead of you could supply the missing word. The players from the company, thrilled by our attendance, have sent a note asking whether the court would care to see their next piece before it opens."
 me_zorgoomni.264.a: "Ugh...I mean, I look forward to our next evening at the theater"

 me_zorgoomni.266_title: "Nets Full of Weed"
 me_zorgoomni.266_desc: "The fishers of [ROOT.GetCountry.GetCapital.GetName|G] have come to court with empty baskets, my [ROOT.GetCountry.GetRulerTitle]. For three weeks the boats have come home light, with more weed than fish to shake from the nets, and the old men on the quay say they have not seen the water this warm so late in the year.\n\nA netmaker offered to patch their gear on credit, then went down to the docks and found most of it was sound, since the trouble is in the sea and not the nets. The fish sellers are weighing out portions they used to throw to the gulls, and the families on the waterfront want to know what the court means to do about the price of bread."
 me_zorgoomni.266.a: "We have weathered lean catches before, and we will weather this one."

 me_zorgoomni.267_title: "A Slight Remembered"
 me_zorgoomni.267_desc: "[SCOPE.sChar('random_dude_advisor').GetName|Y] has returned your letter unopened. It came back at supper by the hand of his own steward, who set it down beside your plate where the whole household could see that the wax was still unbroken.\n\nThe steward would say only that his master had heard what was said of him in council, although nobody at the table can remember saying anything worth a quarrel. The household is watching to see whether you break the seal yourself or send the letter back again."
 me_zorgoomni.267.a: "If he wants a quarrel, he shall have one."

 me_zorgoomni.268_title: "Before the Road Closes"
 me_zorgoomni.268_desc: "[SCOPE.sChar('heir').GetName|Y] asks for your leave to travel, my [ROOT.GetCountry.GetRulerTitle]. He has packed a coat, a wax tablet, and a letter of introduction to a household in a city three borders away, and he has sewn his money into a boot where he imagines no thief has ever thought to look.\n\nHe says there will be time enough for councils once the world has taught him something worth saying in one, and that he would rather learn it from strangers than from the men who already agree with you. If he goes, his offices and duties here will have to be given to someone else until he returns."
 me_zorgoomni.268.a: "You may leave, but please be careful."
 me_zorgoomni.268.b: "You are needed here at home, [SCOPE.sCharacter('heir').GetFirstName]."

 me_zorgoomni.269_title: "An Hour Without a Seal"
 me_zorgoomni.269_desc: "Your clerk has one last question before leaving for the evening: can the letters on your desk wait until morning? Most of them have been waiting since the new moon, and none has grown any shorter for it.\n\nThe garden lamps are still lit, and the watch has left a bench dry beneath the wall where the evening wind does not reach. The physicians have been saying for a month that you need rest more than you need another petition, and the clerk has already put the seals away in their box."
 me_zorgoomni.269.a: "Let the letters wait a day or two. I will be in the garden."

 me_zorgoomni.270_title: "Horses Over the Wall"
 me_zorgoomni.270_desc: "Thieves broke into the stables at [SCOPE.sProvince('horses_stolen_from_here_scope').GetName|G] two nights ago, my [ROOT.GetCountry.GetRulerTitle]. They wrapped the best horses' hooves in cloth before leading them out, and the grooms found the rags in a ditch the next morning, a mile down the road where the thieves had stopped worrying about the noise.\n\nThe grooms have spent the morning trying to explain why dogs that bark at every passing cart slept through the theft of our finest breeding stock. The overseer of the stud says the slaves who work the stables will be blamed whether they had a hand in it or not, and he expects the work to suffer for it."
 me_zorgoomni.270.a: "Find out which gate was left unbarred, and who left it."

 me_zorgoomni.271_title: "A Company Without a Banner"
 me_zorgoomni.271_desc: "A company of soldiers reached the gate of [ROOT.GetCountry.GetCapital.GetName|G] this morning, carrying what was left of a standard. Their army broke after a defeat in some war beyond our borders, and nobody has paid them since, so a few are barefoot and the man carrying the standard has tied it to a walking stick.\n\nThey still fell into ranks when our watch called down from the wall, and their sergeant asks whether [ROOT.GetCountry.GetName] has use for men who know how to hold a line. The watch captain counted their spears before he let them through, and says every man has kept his weapon, even those who have sold their boots."
 me_zorgoomni.271.a: "We could always use experienced fighters in [ROOT.GetCountry.GetName]"

 me_zorgoomni.282_title: "Cargo on Paper"
 me_zorgoomni.282_desc: "Brokers with business across the #T Orcish Sea#! have come to court offering a share in a shipment of incense, my [ROOT.GetCountry.GetRulerTitle]. The samples smell of resin and smoke, and one broker has drawn the cargo in his ledger as neatly as if the ship were already tied up at our quay, with a berth assigned and the scales waiting.\n\nThey want the money now, since the ship will be loading on the far shore within the month, and they promise our share will come back several times over when the cargo is sold. The harbor master knows neither man, although he says the route is a good one when the pilots are careful and the weather holds."
 me_zorgoomni.282.a: "Keep the treasury out of it."
 me_zorgoomni.282.b: "Buy a modest share, and keep the sample until the ship comes in."
 me_zorgoomni.282.c: "Take as much of the cargo as they will sell us."

 me_zorgoomni.283_title: "A Quay Without a Ship"
 me_zorgoomni.283_desc: "A year has passed since we paid the incense brokers for our share, my [ROOT.GetCountry.GetRulerTitle]. Two ships on the same route have come and gone from [ROOT.GetCountry.GetCapital.GetName|G] without our cargo, and the brokers have sent another letter, this time in a hand that seems to belong to neither of the men who took our money.\n\nThe harbor master has begun to recognize their excuses by the shape of the seal, which changes with every letter. He has asked after the brokers on the far shore, and the merchants there say they have never heard of the ship, the pilot, or the men who sold us the share."
 me_zorgoomni.283.a: "I should have known better. Enter it as a loss."

 me_zorgoomni.284_title: "Rain in Time"
 me_zorgoomni.284_desc: "The rain came to the fields outside [ROOT.GetCountry.GetCapital.GetName|G] last night, my [ROOT.GetCountry.GetRulerTitle], and it has soaked through the dust to the roots. The farmers had already started cutting green fodder to save what little they could from the drought, and the granary clerks had begun reckoning how long the stores would last into the winter.\n\nThis morning the farmers are out in the wet, rubbing mud between their fingers and arguing over which fields will still give a crop. The priests have opened the temple doors, and the bakers have quietly lowered the price of bread before anyone could ask them to."
 me_zorgoomni.284.a: "Gods be praised!"

 me_zorgoomni.285_title: "Bowstring or Blade?"
 me_zorgoomni.285_desc: "[SCOPE.sChar('warrior_trainer').GetName|Y] has come to offer you a lesson in arms, my [ROOT.GetCountry.GetRulerTitle]. The old soldier has laid a sword and a hunting bow on the bench in the armory, along with a whetstone and a coil of spare bowstring, and says that a ruler who means to lead an army ought to know at least one of them well.\n\nEither will do, provided you can bear to practice where nobody is watching to admire the result. The soldier has seen too many young officers learn their weapon in front of a crowd, and never learn it properly at all."
 me_zorgoomni.285.a: "Show me a trick or two with the sword"
 me_zorgoomni.285.b: "I prefer to fight from a distance. The bow suits me."

 me_zorgoomni.286_title: "The Scent of a Good Bargain"
 me_zorgoomni.286_desc: "The incense ship is in at [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle], and buyers began calling their prices from the quay before the crew had slung the first bale over the side. The brokers who sold us the share are standing beside the scales in clean coats, as if they had never doubted the voyage for a moment.\n\nTheir accounts are surprisingly easy to read now that they have something good to report. Our share has come back at a fair profit, and the pilot who brought the ship through the autumn weather is drinking on the quay at the expense of anyone who owned a bale."
 me_zorgoomni.286.a: "Count out our share, and buy the pilot a cup of something good."

 me_zorgoomni.287_title: "A Hold Full of Incense"
 me_zorgoomni.287_desc: "Our brokers have come up from the docks at [ROOT.GetCountry.GetCapital.GetName|G] carrying another purse, my [ROOT.GetCountry.GetRulerTitle]. The incense fetched more than they had dared to promise, because the pilot brought the whole cargo in dry, waiting out a contrary wind for six days instead of trying the shoals at night as the owners urged him to.\n\nThe buyers say no ship on that route has landed a dry cargo in three years, and they have paid accordingly. The brokers have already asked whether we would care to take an even larger share in the next voyage, and the pilot has asked for nothing but a new coat."
 me_zorgoomni.287.a: "Count it twice, and buy the pilot his coat."

 me_zorgoomni.288_title: "After the Lamps Are Lit"
 me_zorgoomni.288_desc: "[SCOPE.sChar('priest').GetName|Y] has asked to speak with you in private before the festival, my [ROOT.GetCountry.GetRulerTitle]. The priest has spent years hearing what people say when they are frightened, and what they ask of the gods when they think nobody else can hear, and offers to teach you some of what those years have taught.\n\nThere is time for one lesson before the temple doors open, and the priest has brought a lamp with just enough oil to see you through it. You may learn how to read the people who come before you, or how to speak to the gods they pray to, but the crowd will be at the doors before there is time for both."
 me_zorgoomni.288.a: "Teach me how to understand the minds of men"
 me_zorgoomni.288.b: "Teach me the ways of the gods."

 me_zorgoomni.289_title: "A Race Through the Capital"
 me_zorgoomni.289_desc: "Preparations for the chariot race have taken over the forum of [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. The carpenters want timber for the stands, the bakers want flour for the crowds, and two owners want the same place at the starting line, which they have each tried to settle by leaving a groom there overnight.\n\nThe steward asks you to settle the first expenses before the horses arrive, since the owners have begun measuring the course with their own strides and coming up with different answers. The whole city expects to be there, and those who are not invited will be watching from the rooftops all the same."
 me_zorgoomni.289.a: "Throw the gates open, and let the city see who invited them."

 me_zorgoomni.290_title: "Bread Before Dawn"
 me_zorgoomni.290_desc: "The bakers of [ROOT.GetCountry.GetCapital.GetName|G] have been up all night, my [ROOT.GetCountry.GetRulerTitle]. The first carts of bread are passing the last carts of flour at the gate, and in the forum a carpenter is still planing down the rail where a chariot's outer wheel might catch it if the driver takes the corner too close.\n\nThe steward has a list of what the crowd will expect besides bread, beginning with wine and ending with awnings against the sun, and he asks how much of it the treasury means to pay for. The people who have been waiting since midnight have already begun asking the bakers the same question."
 me_zorgoomni.290.a: "Bread and the race are enough. We cannot afford the rest."
 me_zorgoomni.290.b: "Whatever the people want, they shall have."

 me_zorgoomni.291_title: "The Drivers Arrive"
 me_zorgoomni.291_desc: "The teams came into [ROOT.GetCountry.GetCapital.GetName|G] at first light, my [ROOT.GetCountry.GetRulerTitle], their harness bells carrying over the calls of the bread sellers. Several people who had waited since midnight lost their places on the rail trying to see the horses, and a child climbed onto the carpenter's new rail before the watch could pull him down.\n\nThe drivers are walking the course now, testing the soft ground at the corners with their heels and pointing out the ruts to each other. The owners are still arguing about the starting line, although they have agreed to settle it by lot, provided you hold the bowl."
 me_zorgoomni.291.a: "Bring the bowl. Let the race begin."

 me_zorgoomni.292_title: "A Wager by the Rail"
 me_zorgoomni.292_desc: "[SCOPE.sChar('gambling_patriarch').GetName|Y] has found a place at your elbow by the rail, my [ROOT.GetCountry.GetRulerTitle], and asks whether you would care to make a small wager on the first race. Your guest has a favorite in the blue lane and would be glad to take any other horse you care to name against it.\n\nThe horses are already walking down to the line, and there is just time to pick a rider before the man beside you notices which lane is still soft from the rain. The crowd around you has gone quiet, since half of them have money on the race and the other half want to know whether you do."
 me_zorgoomni.292.a: "I don't gamble, sorry."
 me_zorgoomni.292.b: "I will match your wager; why not"

 me_zorgoomni.293_title: "A Lead at the Last Turn"
 me_zorgoomni.293_desc: "Your wager has paid off, my [ROOT.GetCountry.GetRulerTitle]. Your rider went wide at the last turn and the crowd groaned, until the inside horse caught a wheel in the ruts and stumbled, and your rider came through the gap with the whole length of the straight to spare.\n\nBy the time the dust had settled, your companion had the purse open and was counting the coins out where everyone could see, which is the only dignified way to lose with the whole forum watching."
 me_zorgoomni.293.a: "Pay me before the next race, while we both still remember the wager."

 me_zorgoomni.294_title: "A Bad Horse to Back"
 me_zorgoomni.294_desc: "It looked like a good wager for the first dozen strides, my [ROOT.GetCountry.GetRulerTitle]. By the second turn your horse was fighting its rider to get off the track, and a bread seller had to throw himself behind his own cart as the chariot went past him on the wrong side of the rail.\n\nYour companion has been polite enough to wait until the finish to ask for the money, and has made a point of not looking at the horse while asking. The crowd nearest the rail is enjoying the moment more than the race."
 me_zorgoomni.294.a: "Pay what we owe. The next race is about to start."

 me_zorgoomni.295_title: "Tracks in the Dust"
 me_zorgoomni.295_desc: "The race is over, my [ROOT.GetCountry.GetRulerTitle], and the children of [ROOT.GetCountry.GetCapital.GetName|G] are running the course themselves, dragging sticks through the wheel ruts and arguing over who took the last turn first. The stands held, the bread ran out, and the drivers have gone to the baths with the dust of the forum still on them.\n\nPeople are already asking when the race will be run again, chiefly those who have forgotten what they paid for a seat. The owners have offered to bring their teams back next year if the court will host them, and one has asked whether you would like a horse of your own to enter."
 me_zorgoomni.295.a: "I can't wait to get a horse of my own!"

 me_zorgoomni.296_title: "Boots Beyond the Boundary"
 me_zorgoomni.296_desc: "Our border scouts have found fresh campfires on our side of the ford below the pass, and the hoof prints of mounted patrols crossing there several times a week. When our envoy raised it, the officers of [SCOPE.sCountry('aggressive_neighbor').GetName|T] called it an exercise and said their riders sometimes lose the boundary in the dark.\n\nThe farmers nearest the ford have heard that explanation before, and they are driving their cattle inland while there is still daylight. The scouts ask whether to light the old watchfires on the hills, so that the riders will know they have been seen."
 me_zorgoomni.296.a: "Light the watchfires. We are not afraid of the [aggressive_neighbor.GetAdjective] dogs."

 me_zorgoomni.297_title: "Who Pays the Roadmen?"
 me_zorgoomni.297_desc: "Our soldiers have taken a highway robber alive on the trade road, and he was carrying a pay token stamped with the seal of [SCOPE.sCountry('aggressive_neighbor').GetName|T]. Our traders recognize the seal, and they describe the same men stopping our wagons, counting our bales, and waving foreign caravans through without lifting a tarpaulin.\n\nThe prisoner says his band was paid by the season, and that the men who paid them never asked how the money was earned. The merchants want the token sent back to that court with a message, although the road itself will stay dangerous until the rest of the band has been found."
 me_zorgoomni.297.a: "Send the token back with our answer. Do they take us for fools?"

 me_zorgoomni.298_title: "A Gift Across the Border"
 me_zorgoomni.298_desc: "An envoy from [SCOPE.sCountry('friendly_neighbor').GetName|T] has arrived in [ROOT.GetCountry.GetCapital.GetName|G] with a gift for the court and a letter praising the good order on the roads our countries share. He watched our clerk unpick the cord around the gift, waited until it had been properly admired, and then asked what he should tell his master on the journey home.\n\nThe gift is generous, and the letter says nothing that would bind us to anything. Our councilors suspect the envoy has been told to bring back a promise of some kind, and they note that he has not yet asked where he will sleep tonight."
 me_zorgoomni.298.a: "Thank them for the gift, but make no promises."

 me_zorgoomni.299_title: "Guests at the Festival"
 me_zorgoomni.299_desc: "An invitation has come from [SCOPE.sCountry('friendly_neighbor').GetName|T], my [ROOT.GetCountry.GetRulerTitle]. Our envoys have been offered places in their festival procession, where they may walk behind the priests and watch the rites without being asked to take part in them, which is more than the neighbor has offered any foreign court in years.\n\nThe invitation came by the same road our merchants use, with their names written into the letter and a note that the stalls nearest the procession are still unlet. Our merchants are already packing, and they would very much like the envoys to bring something worth looking at."
 me_zorgoomni.299.a: "Accept the invitation. Send a gift for the procession."

 me_zorgoomni.300_title: "Stones for Sale"
 me_zorgoomni.300_desc: "A scout has come back from [SCOPE.sCountry('friendly_neighbor').GetName|T] with a curious report, my [ROOT.GetCountry.GetRulerTitle]. He watched laborers lower dressed blocks down the outside of a border tower, from a spot where a year ago the garrison would have put an arrow through his coat, and the blocks were being loaded onto carts bound for a builder's yard in the next town.\n\nThe neighbor appears to be selling its own fortifications for stone, either because its treasury needs the money or because its council no longer fears anyone on our side of the border. The villages along that stretch of the frontier have taken it as a sign of peace, and they are already talking about the market they could hold at the ford."
 me_zorgoomni.300.a: "Tell the generals, and let the villages hold their market."

 me_zorgoomni.301_title: "An Invitation to the Hunt"
 me_zorgoomni.301_desc: "[SCOPE.sChar('random_dude_hunter').GetName|Y] and [SCOPE.sChar('random_dude_hunter_2').GetName|Y] have come to court with better news than anything in your dispatches, my [ROOT.GetCountry.GetRulerTitle]. The weather has broken, the deer have come down from the high woods, and the lodge by the lake has been aired out for the first time since the spring.\n\nThe dispatches will still be on your desk tomorrow, they point out, and a ruler who never leaves the palace forgets what the country looks like. Your companions have already asked the keeper to choose the dogs, which you can hear making their objections from the courtyard."
 me_zorgoomni.301.a: "Yes, that sounds wonderful, and I can be ready before the dogs."
 me_zorgoomni.301.b: "Not now. The dispatches will not answer themselves."

 me_zorgoomni.302_title: "The First Day Out"
 me_zorgoomni.302.e: "It is foul weather. I can hardly blame you for saying so."
 me_zorgoomni.302.d: "The capital has sent for me. Take the dogs on ahead."
 me_zorgoomni.302.c: "Dismount. We can put the shrine right before we ride on."
 me_zorgoomni.302.b: "I will remember what you said in the rain."
 me_zorgoomni.302.a: "Put another log on. We are in no hurry."
 me_zorgoomni.302.desc_1: "[SCOPE.sChar('random_dude_hunter').GetName|Y] took you by the long road to the lodge, and the rest of the party was glad of the extra time away from court. At the first ford the talk was all about battles and taxes, but by the time the cook set a pan on the fire we were talking about our childhoods, and the last of the wood burned down before anyone thought to call it a night."
 me_zorgoomni.302.desc_2: "The rain got through our coats before the lodge was in sight, and [SCOPE.sChar('random_dude_hunter_2').GetName|Y] wiped the water from his face, looked up at the sky, and asked what you had done to earn the gods' attention. It might have passed for a joke if he had stopped there."
 me_zorgoomni.302.desc_3: "At a shallow crossing, someone saw a strip of carved stone under the vines. A shrine stood a little farther back, its roof gone, its stones still black from a fire and slick enough with moss that the horses would go no farther. The horses can wait while we see what is left."
 me_zorgoomni.302.desc_4: "Riders from the capital found us a day out, their horses white with sweat. The lead messenger dismounted and handed over a sealed order for your immediate return. Your companions took charge of the dogs, and the oldest hound howled after you until you were out of sight."

 me_zorgoomni.303_title: "Smoke Over the Camp"
 me_zorgoomni.303.d: "Fetch my horse. I must see my heir."
 me_zorgoomni.303.c: "Give me a moment to catch my breath."
 me_zorgoomni.303.b: "The woods are waiting. Bring the dogs."
 me_zorgoomni.303.a: "Give me another hour. The deer can wait."
 me_zorgoomni.303.desc_1: "Someone brought a jug out after supper, then remembered two more, and the cook called for breakfast before the last story was finished. You went to your bedroll with grass in your ears to keep out the birds."
 me_zorgoomni.303.desc_2: "You woke before the cook, and by the time the others had found their boots, the embers were stamped out and there was bread and cold meat ready for the road."
 me_zorgoomni.303.desc_3: "The rain followed us to the lodge. Water dripped through the canvas all night, always finding the one corner of the blanket you had just managed to warm. When you stepped out at dawn to see whether the hunt could go ahead, a fit of coughing shook you so hard you had to lean on the tent pole."
 me_zorgoomni.303.desc_4: "The party was stringing bows when soldiers came through the trees in our colors. They had tracked us for a week, changing horses wherever they could, and have kept the freshest for you. Your heir, [SCOPE.sChar('zorgo_event_103_heir').GetName|Y], has been gravely injured."

 me_zorgoomni.304_title: "Under the Old Trees"
 me_zorgoomni.304.n: "Whose knife was that?"
 me_zorgoomni.304.m: "I cannot see the fire. Is it still burning?"
 me_zorgoomni.304.l: "Tell the cook there is more coming."
 me_zorgoomni.304.k: "I will take the road next time."
 me_zorgoomni.304.j: "Carry the antlers home. Mind the points."
 me_zorgoomni.304.i: "Bring the gold up before the light goes."
 me_zorgoomni.304.h: "Pay her for the blessing."
 me_zorgoomni.304.g: "I will leave that horse to a better rider."
 me_zorgoomni.304.f: "Get me back to the fire."
 me_zorgoomni.304.e: "I will have better luck next time."
 me_zorgoomni.304.d: "Call the others. I want them to see what we brought down."
 me_zorgoomni.304.c: "Put the venison on. There is enough for all of us."
 me_zorgoomni.304.b: "Strike the camp. I have had enough of the woods."
 me_zorgoomni.304.a: "Put another log on. I want to hear that story again."
 me_zorgoomni.304.desc_1: "Nobody brought back anything fit to eat. Around the fire the stags grew a little taller in every account, and after the second jug we heard of one that could clear a whole field without putting a hoof to the ground."
 me_zorgoomni.304.desc_2: "You spent the day in brambles and lost the party before dusk, and they found you by the sound of your boots filling up in a stream. By the time anyone offered to take your bow you had already called for the horses."
 me_zorgoomni.304.desc_3: "Your arrow brought down the only deer anybody saw all day. The cook had already set out the cold bread, and swept it back into the basket when the carcass came through the trees. Your companions raised the first cup to the shot and the second to your good fortune."
 me_zorgoomni.304.desc_4: "The stag went down so hard the men on the far side of the trees heard it. Its antlers were nearly as long as you were tall, and the first hunter to reach you walked all the way around it, stepping over the points before he said a word."
 me_zorgoomni.304.desc_5: "You waited beside the lake from morning until the light went off the water. Nothing came to drink, and back at camp the cook lifted the lid off an empty pot and asked how you had fared."
 me_zorgoomni.304.desc_6: "A bear caught your leg before you could draw a blade. Your companions followed the noise, drove it off, and bound the wound with a strip cut from a saddlecloth. They will have to carry you back to camp."
 me_zorgoomni.304.desc_7: "You woke under a blanket with your head wrapped in linen, and someone set a cup beside you and explained that your horse had reached camp before you did. You remember setting out, and nothing after that."
 me_zorgoomni.304.desc_8: "A hut stood so deep in the woods that its roof was wet long after the rain had stopped. The woman inside knew you were coming, had laid a dry log on the fire for you, and asked for a hundred coins to give you [GetDeityDefinition('omen_cafea').GetName|Y]'s blessing."
 me_zorgoomni.304.desc_9: "You went down into a ravine for an arrow and saw sunlight flash on a broken jar. You brushed away a few shards and found more gold among the stones than anyone at camp had thought to bring along."
 me_zorgoomni.304.desc_10: "A white stag drank at the lake with its back to you, and the arrow was away before it could lift its head and see you in the water. You knelt by the water to give thanks and sent someone back for help carrying the antlers."
 me_zorgoomni.304.desc_11: "The wolves followed you as far as the cliff. There was just time to see the river below before you jumped, and the current took you round the bend with the wolves still howling above the splash."
 me_zorgoomni.304.desc_12: "Back at the fire, everyone agreed you had taken the best quarry. They agreed on it before supper, which is the first time anyone remembers a hunting party settling a matter on an empty stomach."
 me_zorgoomni.304.desc_13: "The wolves came in low through the brush. The others drove them off, and a hunter wrapped your face with a strip torn from his shirt, feeling for a knot that would hold without hurting you further. By evening he had stopped asking whether you could see."
 me_zorgoomni.304.desc_14: "You drew on a stag as it lowered its head to the creek, with your companion a few paces behind, close enough that you could hear him take a breath. There was a sound of steel coming free, a pain between your ribs, and then you could hear neither the creek nor the stag."

 me_zorgoomni.305_title: "The Road Home"
 me_zorgoomni.305.d: "Bring him home. He will not lie by the road."
 me_zorgoomni.305.c: "If you ever have any other questions, [SCOPE.sCharacter('random_dude_hunter_2').GetFirstName], feel free to ask"
 me_zorgoomni.305.b: "I am blessed beyond measure to have such loyal and loving countrymen"
 me_zorgoomni.305.a: "Home again at last, thank you for asking me along."
 me_zorgoomni.305.desc_1: "We rode home quietly, and the sun came out just long enough for the roofs of the capital to show above the walls, and everyone seemed to recognize the same moment to start talking again."
 me_zorgoomni.305.desc_2: "People came out from the villages with wet shoes and children on their shoulders, and you slowed to speak with them until there were as many questions about the hunt as there were petitions about the road."
 me_zorgoomni.305.desc_3: "On the road home [SCOPE.sChar('random_dude_hunter_2').GetName|Y] asked how you decide which disputes to hear yourself. You were still discussing the answer when the gate came into sight, and the rest of the party had long since given up pretending it could not hear."
 me_zorgoomni.305.desc_4: "Bandits came out after dark within sight of the capital. We drove them off and called the roll twice, and found [SCOPE.sChar('random_dude_hunter').GetName|Y] lying where the first charge had passed, with the city lamps still visible down the road."

 me_zorgoomni.306_title: "What the Court Heard"
 me_zorgoomni.306_desc: "Word of the hunt reached [ROOT.GetCountry.GetCapital.GetName|G] ahead of you, my [ROOT.GetCountry.GetRulerTitle]. By the time the party rode through the gate, the people at home already knew three versions of the trip, with most of the details supplied by the grooms and a bear added in the kitchens, where nobody had been near the woods.\n\nThe priests have prepared a thanksgiving for your safe return, and the household has gathered in the courtyard to see what you brought back. Whatever you tell them, the kitchen's version will be the one the city remembers."
 me_zorgoomni.306.a: "Give thanks for a safe return."

 me_zorgoomni.307_title: "A Dispatch in the Ditch"
 me_zorgoomni.307_desc: "Bandits fell on your messengers before they were well clear of the gate of [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. The survivors came back on foot with the seals, but the dispatches they were carrying are in a ditch somewhere along the road, and at least one horse is carrying a saddlebag of state business in the wrong direction.\n\nThe council has already heard from two governors who are waiting on answers that will now be late, and the clerks are copying the letters out again as fast as they can. The captain of the watch suggests that the next courier ride with an escort, and with the copies sewn inside his coat."
 me_zorgoomni.307.a: "Send a second courier, and put the fresh copy inside their coat."

 me_zorgoomni.308_title: "The Knot Comes Loose"
 me_zorgoomni.308_desc: "Your envoys have returned to [ROOT.GetCountry.GetCapital.GetName|G] in high spirits, my [ROOT.GetCountry.GetRulerTitle]. A negotiation that had been stuck for weeks came loose in a single morning, when the envoys put a map of the river crossing on the table and both parties realized they wanted the same ford kept open.\n\nOnce that was settled, the rest of their quarrels turned out to be the kind that can wait, and the agreement was sealed before the ink was dry on the morning's orders. The envoys say both sides went home crediting the court of [ROOT.GetCountry.GetName] with the idea."
 me_zorgoomni.308.a: "I live but to serve the people."

 me_zorgoomni.309_title: "The Arrears Come In"
 me_zorgoomni.309_desc: "[SCOPE.sChar('random_dude').GetName|Y] has come to court with a chest of back taxes we had all but given up on, my [ROOT.GetCountry.GetRulerTitle]. He took on the old debts as a favor to the treasury when nobody else would touch them, and he has spent two years riding from village to village with the original receipts in a satchel.\n\nTwo of the officials who signed those receipts are dead, and one of the villages has moved across the river since the tax was assessed. Our clerk has counted the silver twice before bringing the ledger up, since he says it would be a shame to be wrong about good news."
 me_zorgoomni.309.a: "Better late than never, they say."

 me_zorgoomni.310_title: "The Festival Draws to a Close"
 me_zorgoomni.310_desc: "The festival has come to an end, my [ROOT.GetCountry.GetRulerTitle], and the last visitors are leaving [ROOT.GetCountry.GetCapital.GetName|G] by every gate at once. The innkeepers are counting their takings, the priests are sweeping the temple steps, and the street sweepers are finding coins in the gutters that nobody will come back to claim.\n\nOne merchant painted the festival's name on his awning before he left, and was still blowing on the wet letters when his cart rolled out, so that people in the next town would know where he had been. The council says the city has not been so full in years, and the festival has already been entered in the calendar for next year."
 me_zorgoomni.310.a: "I look forward to it every year."

 me_zorgoomni.318_title: "A Pilgrim with Questions"
 me_zorgoomni.318_desc: "Your border guards bring word of an #Y Ularian#! pilgrim called [SCOPE.sChar('izn_divine_scholar').GetName|Y], my [ROOT.GetCountry.GetRulerTitle]. He arrived with enough followers to fill an inn and spill into the stables. At each shrine he asks the keeper to explain one custom he does not know, and his companions, who thought he would be the one answering questions, are learning to carry extra tablets."
 me_zorgoomni.318.a: "Ask Iven to stay and teach at court."
 me_zorgoomni.318.b: "Perhaps this wise man will teach me something before he leaves?"
 me_zorgoomni.318.c: "Hold him here and confiscate his travelling purse."

 me_zorgoomni.319_title: "Vampire Camels on a Rampage"
 me_zorgoomni.319_desc: "Terrible news from [vampire_camel_territory.GetArea.GetRegion.GetName|Y], my [ROOT.GetCountry.GetRulerTitle|G] - it is an omen dark and strange that has caused the people of [ROOT.GetCountry.GetCapital.GetName|G] to fear for their lives. The border watch puts the herd at thirty thousand camels, all stricken with #R vampirism#!, and they are rampaging through our hinterlands, killing and devouring any poor creature they come across. They crossed the border at a gallop, and the last rider to come in says they're taking the road to [ROOT.GetCountry.GetCapital.GetName|T].\n\nThe local warriors from [vampire_camel_territory.GetName|Y] have been sent to drive them back, but they will not arrive before the main herds reaches the settlements on the outskirts of the capital. The people have begged [ROOT.GetCountry.GetRuler.GetName|G] to help in any way that [ROOT.GetCountry.GetRuler.GetSheHe] can."
 me_zorgoomni.319.a: "Pay the riders and light the watchfires"
 me_zorgoomni.319.a_tt: "The riders will drive the herd out of our lands before it reaches the neighboring settlements."
 me_zorgoomni.319.b: "I will spend nothing! Bar the gates and let the foul beasts pass by"
 me_zorgoomni.319.b_tt: "[vampire_camel_territory.GetName|Y] and our neighboring arid settlements suffer #R $omni_vampire_camel_rampage$#! for #Y 1 year#!."

 me_zorgoomni.320_title: "The Last Watchfire"
 me_zorgoomni.320_desc: "The riders from [vampire_camel_territory.GetName|Y] kept the last fire burning until the herd passed out of the wash beyond our border. The keeper shoveled the sand out of the trough, and by noon the first carter back was watering his mule.\n\nThe captain signed the warrants by the well gate. When a rider came to tell him he had lost his mother's mare, the captain asked where she lived and sent him home with the warrant."
 me_zorgoomni.320.a: "Honor every warrant."

 me_zorgoomni.321_title: "When the Dust Settled"
 me_zorgoomni.321_desc: "When the keeper at [vampire_camel_territory.GetName|Y] opened the gate again, he found pieces of the trough down by the road. The families who had sheltered at the well went to look for their stock, and the first to come back brought a sack from the grain store. It had split under a hoof, and there was a handful of barley left in it.\n\nThe keeper had started a list of what they would need to set the place right. He crossed out the trough and put grain at the head of it."
 me_zorgoomni.321.a: "Give the carters his list."

 omni_vampire_camel_rampage: "Vampire Camel Rampage"
 desc_omni_vampire_camel_rampage: "The herd broke the stock pens and trampled the stores. Until the roads are cleared and the next grain carts arrive, the wells are drawing more people than the settlements can feed."

