l_english:

 me_zorgoomni.110_title: "A Fish Fit for a Throne"
 me_zorgoomni.110_desc: "The night watch has a story for you, my liege! They have brought a prisoner to [ROOT.GetCountry.GetCapital.GetName|G] and, of all things, a fish. The prisoner is [SCOPE.sChar('fish_bearer').GetName|Y], who swears the fish was caught on a voyage past the #G Bloody Isles#! and that a gift of the first catch brings fair winds to any house that accepts it.\n\nThis might have been a charming custom had the fool waited until morning. Instead, the watch found your benefactor halfway through your bedroom window with a fish so large it took two guards to carry it downstairs. The cook has already sharpened a knife, the stairs are silver with scales, and the watch would very much like to know whether they may stay for breakfast."
 me_zorgoomni.110.a: "Pay for the fish. The watch can have the first helping."
 me_zorgoomni.110.b: "Let the watch teach our guest to use the front door."
 me_zorgoomni.110.c: "A stranger at my window after dark is a threat. Put them to death."

 me_zorgoomni.111_title: "The Art of Finding Safe Water"
 me_zorgoomni.111_desc: "There is a new student of statecraft at court, my liege, and it seems you are the tutor. [SCOPE.sChar('court_pupil').GetName|Y] has taken to following you through the halls of [ROOT.GetCountry.GetCapital.GetName|G], taking down every word you say on a wax tablet. There are already three columns on the proper reception of an envoy and half a page on when it is wiser to pretend you have heard nothing.\n\nAn #Y Ularian#! pilot waiting on an audience saw the tablet and laughed, for your kinsman was learning to steer a court the same way a sailor learns a reef, by watching where the old hands keep their eyes. Watch the pilot's hands, mark where the wrecks lie, and ask your questions while there is still time to change course."
 me_zorgoomni.111.a: "Come along, then. We have a difficult audience this afternoon."
 me_zorgoomni.111.b: "Put away the tablet. You'll learn more with a seat of your own."

 me_zorgoomni.112_title: "The Last Tally"
 me_zorgoomni.112_desc: "Dire news from the crossing outside [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. We found [SCOPE.sChar('tax_collector').GetName|Y] beneath the bridge. A knife had gone clean through the leather satchel and into the collector's ribs. Whoever rifled the satchel left the tally book behind, though the river had soaked it so thoroughly that we could scarcely make out the names.\n\nA merchant from the #G Bloody Isles#! was warming himself at the tollkeeper's fire, and offered to tell us what he saw in return for safe passage, but by the time our guards thought to ask where he was staying, his caravan had gone. The villages are already saying the debts died with the collector."
 me_zorgoomni.112.a: "Send word to the family. I want the crossing watched."

 me_zorgoomni.113_title: "The Fleet in Miniature"
 me_zorgoomni.113_desc: "The shipwrights have a curious request for you, my [ROOT.GetCountry.GetRulerTitle]. They would like to hold an exhibition in [ROOT.GetCountry.GetCapital.GetName|G]. They would fill a public square with model ships, from the shallow boats that slip through the inlets of the #G Bloody Isles#! to the deep-bellied vessels that make the long crossing to the #G Lands of the Snakefolk#!.\n\nThey brought a model rigged in silk thread, and an old pilot spent the whole audience trimming its sails with two fingers, as solemn as if a month's cargo depended on it. The shipwrights say the exhibition could teach apprentices how foreign crews build and handle their vessels. They ask for enough coin to pay the model makers and bring the pilots in from abroad."
 me_zorgoomni.113.a: "Pay the shipwrights. Give the apprentices the best seats."
 me_zorgoomni.113.b: "The treasury has work for full-sized ships."

 me_zorgoomni.114_title: "A Crow at Court"
 me_zorgoomni.114_desc: "We had a rather unusual audience this morning, my liege. [SCOPE.sChar('bird_merchant').GetName|Y] has brought a crow to [ROOT.GetCountry.GetCapital.GetName|G], claiming to have bought it from a pilot who sailed the #G Orcish Sea#!. For a modest sum, we were told, the bird could be taught to praise your name before an audience.\n\nWhen the merchant lifted the cloth, the crow looked straight at you, cocked its head as if weighing a clipped coin, and said, 'Count your fingers. The ruler's been at the till.' Someone at the back of the hall laughed before the guards could see who it was. The merchant insists the bird must have picked it up aboard ship."
 me_zorgoomni.114.a: "Buy the bird. At least one creature in this hall speaks freely."
 me_zorgoomni.114.b: "Take the merchant outside. I want the laughter to stop."

 me_zorgoomni.115_title: "The Gate Without a Tally"
 me_zorgoomni.115_desc: "A trader has brought word of a custom worth hearing about, my [ROOT.GetCountry.GetRulerTitle]. He tells of a town in the #G Bloody Isles#! where the toll gate stands open for a day at the close of the sailing season. Fishers, potters, and farmers bring their goods to market without paying a copper at the gate. Families that could scarcely afford salt the day before go home with enough to put down their winter stores.\n\nThe guilds of [ROOT.GetCountry.GetCapital.GetName|G] have asked for such a day here. They have already set aside stalls for the smallest traders and sworn to keep the main street clear. Your collectors came with a second proposal, a wax tally of what the crown might earn by taxing the very stalls it has promised to open."
 me_zorgoomni.115.a: "Open the gate. Let the smallest traders come through first."
 me_zorgoomni.115.b: "If the crowd will come anyway, charge them for the privilege."

 me_zorgoomni.201_title: "Two Claims to One Stone"
 me_zorgoomni.201_desc: "My liege, [SCOPE.sChar('random_dude').GetName|Y] and [SCOPE.sChar('random_dude_2').GetName|Y] have brought deeds to the same vineyard. One boundary stone washed downhill in the rains, while the other bears fresh chisel marks, with the dust still white in the cuts. Our surveyor would believe either deed if he had never seen the other, and both claimants have begun bringing armed cousins to court."
 me_zorgoomni.201.a: "Pay for a new survey and uphold [SCOPE.sChar('random_dude_2').GetFirstName]'s claim."
 me_zorgoomni.201.b: "Give the vineyard to [SCOPE.sChar('random_dude').GetFirstName]. I have heard enough."

 me_zorgoomni.202_title: "The Idol in the Furrow"
 me_zorgoomni.202_desc: "My [ROOT.GetCountry.GetRulerTitle], a plough struck silver outside the capital! The farmer brought us a squat idol with writing so fine it took a needle to clear the dirt from it. Our priest wants it back in the furrow before sundown, while the mint has weighed it twice and come to a different conclusion."
 me_zorgoomni.202.a: "Melt it down, and let us see whether the mint can spend a curse."
 me_zorgoomni.202.b: "Tell [SCOPE.sCharacter('priest').GetFirstName] to rebury it in the same spot and to offer sacrifices"

 me_zorgoomni.208_title: "The Verse They Left Out"
 me_zorgoomni.208_desc: "My liege, [SCOPE.sChar('bard').GetName|Y] and [SCOPE.sChar('bard_2').GetName|Y], two famous bards know for their debaucherous lifestyles and extravangat ways, arrived in [ROOT.GetCountry.GetCapital.GetName|G] with a duet learned aboard a trader bound for the #G Bloody Isles#!, where a good singer has to carry a tune from the stern clear up to the bow. These legendary performers offer to fit your deeds to it, provided we agree which deeds the market ought to hear about."
 me_zorgoomni.208.a: "At least the subject matter will be interesting."

 me_zorgoomni.209_title: "A Knife Among Kin"
 me_zorgoomni.209_desc: "Dire news from your spies, my [ROOT.GetCountry.GetRulerTitle]. Your agents intercepted payment for a knife and a door left unguarded and open after dark. The money passed through three hands, and the last receipt, folded small enough to fit in a knife sheath, bears the seal of [SCOPE.sChar('cousin').GetName|Y], a member of your own house."
 me_zorgoomni.209.a: "Put [SCOPE.sChar('cousin').GetFirstName] in irons until we know who else was involved."

 me_zorgoomni.211_title: "Cloth Made Of Clouds"
 me_zorgoomni.211_desc: "A merchant from across the #T Orcish Sea#! has arrived in [ROOT.GetCountry.GetCapital.GetName|G] and is turning heads and emptying pockets with his luxurious merchandise. One of his most famous tricks is to draw a length of cloth through a signet ring to prove its fineness. The rich wear these silk garments to court now, and a weaver outside the gate has started reckoning the price of a sleeve in gold coins."
 me_zorgoomni.211.a: "Ban the wearing of silk for one year."
 me_zorgoomni.211.b: "Let them buy their silk. I have work to do."

 me_zorgoomni.213_title: "The Offering at Low Water"
 me_zorgoomni.213_desc: "At low water, the priests of #T Peauxdu Houmon#! will carry bread and lamps out over the wet stones, with leather wrapped round the lantern seams to keep out the spray. The keeper of [GetDeityDefinition('omen_ugone').GetName|Y]'s shrine asks for a gift from the court to buy oil and provisions for the families following the procession."
 me_zorgoomni.213.a: "Send the oil and bread, and tell the keeper to light a lamp in our name."
 me_zorgoomni.213.b: "The treasury is thin, so let the keeper make do with what the tide brings."

 me_zorgoomni.214_title: "Whose Cargo Is It?"
 me_zorgoomni.214_desc: "My liege, two traders are claiming the same cargo on the capital's docks. One paid to ship it across the sea, and the other paid to haul it off a reef after the ship ran aground. The harbor master has told them the bales will stay where they are until you decide who gets them, and both crews are already rolling up their sleeves."
 me_zorgoomni.214.a: "I have chosen [SCOPE.sCharacter('random_bro_2').GetName]"
 me_zorgoomni.214.b: "Clearly [SCOPE.sCharacter('random_bro').GetName] is more deserving"
 me_zorgoomni.214.c: "Threaten them both with exile unless they stop arguing"

 me_zorgoomni.215_title: "A Roof for the Shrine"
 me_zorgoomni.215_desc: "Bad news from the priests, my [ROOT.GetCountry.GetRulerTitle]. A tremor split the roof of a shrine of #T Peauxdu Houmon#! before dawn, and the keeper got the lamps out just as the beams came down, with enough oil left in one to light the morning prayers. Pilgrims are still arriving, and the priests have laid the offerings out under a sail until we decide whether to pay the masons."
 me_zorgoomni.215.a: "Because the gods take care of us, we shall take care of them"
 me_zorgoomni.215.b: "The shrine can make do under canvas."

 me_zorgoomni.216_title: "Beyond the Last Sounding"
 me_zorgoomni.216_desc: "Good news from the docks at [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]! [SCOPE.sChar('traveler').GetName|Y] has returned from the #G Lands of the Snakefolk#! with a roll of soundings and a crate the crew refuses to open indoors. It holds the bronze likeness of a creature with a serpent's body and the head of a cat. The captain would part with the bronze for enough coin to fit out a second voyage, though the crew would be glad to have it off the ship at any price."
 me_zorgoomni.216.a: "We cannot spare the coin right now"
 me_zorgoomni.216.b: "Buy the bronze, and have the crate opened on the quay."

 me_zorgoomni.217_title: "Lessons in the Rigging"
 me_zorgoomni.217_desc: "Your household tutor has a complaint, my [ROOT.GetCountry.GetRulerTitle], and there is ink all over the evidence. [SCOPE.sChar('teacher').GetName|Y] brought a stack of untouched exercises. [SCOPE.sChar('pupil').GetName|Y] promised to finish them by supper, and was last seen halfway up a mast, with ink still on both hands and the harbor boys shouting advice from below. The tutor wants to know if tomorrow's lesson should take place on the quay."
 me_zorgoomni.217.a: "Tomorrow the tutor decides where lessons take place."
 me_zorgoomni.217.b: "Leave them to it, and perhaps the mast will teach what the tablet could not."

 me_zorgoomni.219_title: "Hands on the Tiller"
 me_zorgoomni.219_desc: "Your messenger had a devil of a time finding your successor this morning, my [ROOT.GetCountry.GetRulerTitle]. We sent a messenger to fetch your successor and found them taking a turn at the tiller, with spray coming over the rail and half the deck shouting advice. The captain says the ship came about cleanly all the same, which is more than can be said for some of his hands."
 me_zorgoomni.219.a: "Have the captain keep teaching them."

 me_zorgoomni.220_title: "A Voice That Carries"
 me_zorgoomni.220_desc: "There is a speaker in [ROOT.GetCountry.GetCapital.GetName|G] who claims he can fill the square in two sentences, my liege. [SCOPE.sChar('orator').GetName|Y] arrived with letters from three cities and a story about holding a mutinous crew silent without raising a hand. The fee, we are told, is for the speech in your honor, and we need spend nothing on a herald, for the orator claims word of the first sentence will fill the square before the second."
 me_zorgoomni.220.a: "I have no qualms supporting such a worthy cause"

 me_zorgoomni.221_title: "Lightning in the Square"
 me_zorgoomni.221_desc: "An alarming sight greeted the stallholders of [ROOT.GetCountry.GetCapital.GetName|G] this morning, my [ROOT.GetCountry.GetRulerTitle]. Lightning struck a bronze statue on its first night in the square and left it face down among the stalls. At dawn the priests called for a public offering, while a clerk from the mint went round the square gathering bronze fingers in a basket."
 me_zorgoomni.221.a: "Bury the statue and make the offering."
 me_zorgoomni.221.b: "Fire up the furnaces. Send the bronze to the mint."

 me_zorgoomni.222_title: "Mud Under the Keel"
 me_zorgoomni.222_desc: "The harbor master of [ROOT.GetCountry.GetCapital.GetName|G] has bad news, my [ROOT.GetCountry.GetRulerTitle]. A coaster grounded beyond hailing distance of the quay, and when its pilot dropped a line, the lead came up black with mud where last year there was water for a laden ship. The engineers can dredge the channel if we can pay enough crews."
 me_zorgoomni.222.a: "Hire the dredgers before another ship runs aground."
 me_zorgoomni.222.b: "Tell the crews to clear the channel with what they have."

 me_zorgoomni.223_title: "The Broken Betrothal"
 me_zorgoomni.223_desc: "Two of your noble families have brought a private quarrel to court, my [ROOT.GetCountry.GetRulerTitle]. Two noble houses agreed on a marriage over supper and have since disagreed about who promised the vineyard. Both heads of household have cornered you in the courtyard, while their children, who had the good sense to agree on the match, wait under the colonnade with nothing to do but watch their elders."
 me_zorgoomni.223.a: "I will honorably sit in judgment, knowing that I cannot win"
 me_zorgoomni.223.b: "Eh, see who will pay us the most and side with them"

 me_zorgoomni.224_title: "A Horse Before a Lesson"
 me_zorgoomni.224_desc: "The tutors have finally found [SCOPE.sChar('heir').GetName|Y], my [ROOT.GetCountry.GetRulerTitle]. They were racing a favorite horse along the outer wall with a school tablet tied to the saddle. The head tutor asks for leave to keep tomorrow's lesson indoors, and would be grateful if the stablemaster could be told that this applies to the horse as well."
 me_zorgoomni.224.a: "Hire a tutor who can keep a child indoors."
 me_zorgoomni.224.b: "Let the child ride. The tablets can wait."

 me_zorgoomni.225_title: "A Feast of Their Own Making"
 me_zorgoomni.225_desc: "There is a holiday in [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle], though nobody at court seems to have declared one. The shopkeepers shut their doors at noon and rolled wine barrels into the street. By sunset a whole quarter had brought its supper outdoors, and the watch asks whether to clear the road or wait until the neighbors finish passing the bowls."
 me_zorgoomni.225.a: "Leave them to their supper, and see that the watch gets a bowl."

 me_zorgoomni.226_title: "The Empty Muster Roll"
 me_zorgoomni.226_desc: "The latest muster has left your captains with a problem, my [ROOT.GetCountry.GetRulerTitle]. Some families have sent the last adult who can carry a shield, while others have answered the muster with an empty doorstep and a cold hearth. The officers say there are still hands to be had if we open the ranks to people who would never ordinarily carry our colors."
 me_zorgoomni.226.a: "Open the muster to those we ordinarily turn away."
 me_zorgoomni.226.b: "Keep the old rules."

 me_zorgoomni.227_title: "Who May Bear a Shield?"
 me_zorgoomni.227_desc: "A delegation from the old houses has come to court, my [ROOT.GetCountry.GetRulerTitle]. The old houses want more of their own households on the levy rolls. The captains brought a tally of their empty places, laid it between the petitioners, and asked which families would be coming with shields of their own."
 me_zorgoomni.227.a: "Enlarge the levies. Let the old houses answer the muster."
 me_zorgoomni.227.b: "Tell the old houses to listen to the captains."

 me_zorgoomni.228_title: "The Price of Forage"
 me_zorgoomni.228_desc: "Complaints have followed your army back to [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. Our army took grain at the first village, cattle at the second, and the doors off the third for firewood. The officers say discipline will cost us men, and the villages farther down the road have begun burying their grain in jars."
 me_zorgoomni.228.a: "Cut their privileges until they remember their orders."
 me_zorgoomni.228.b: "Punish the offenders. I will answer for the losses."

 me_zorgoomni.230_title: "Spears Below Stairs"
 me_zorgoomni.230_desc: "Your steward brings grave news from the kitchens, my [ROOT.GetCountry.GetRulerTitle]. A steward lifted a loose kitchen board and found spearheads wrapped in flour sacks, all cut to the same measure, which our armourer says could only have been done to order. We have the names of several households where enslaved servants were expecting a signal."
 me_zorgoomni.230.a: "That was a close one."

 me_zorgoomni.231_title: "Fever at the Quay"
 me_zorgoomni.231_desc: "There is sickness on the coast, my [ROOT.GetCountry.GetRulerTitle]. A fever has passed from berth to berth, leaving sailors shaking too hard to hold a cup, then coming back just as they think they can climb a gangplank. The port gates are shut, and families on both sides want to know when they can open."
 me_zorgoomni.231.a: "Keep the gates shut. The healers need time."

 me_zorgoomni.232_title: "A Seat for Sale"
 me_zorgoomni.232_desc: "Two candidates for the same office have arrived at court, my [ROOT.GetCountry.GetRulerTitle]. [SCOPE.sChar('random_house_head').GetName|Y] has been promising offices in return for support. Each candidate was carrying a letter written in the same hand, and one had already paid a sign painter to put his name over the door."
 me_zorgoomni.232.a: "I don't know what you're up to, but don't forget me."

 me_zorgoomni.233_title: "Two Voices for the Court"
 me_zorgoomni.233_desc: "An unusual gift has arrived in [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. A foreign ruler sent two enslaved scholars with instructions to keep the sender's name private. One can argue either side of a contract without seeing it written, while the other has started correcting our interpreter, politely at first, then by taking the reed pen out of his hand."
 me_zorgoomni.233.a: "This is a tremendous gift, we are quite fortunate!"

 me_zorgoomni.234_title: "One Cup Too Many"
 me_zorgoomni.234_desc: "Last night's supper ended badly, my [ROOT.GetCountry.GetRulerTitle]. At supper, [SCOPE.sChar('random_baker').GetName|Y] brought up a pie that leaked hot filling all over [SCOPE.sChar('random_dinner_host').GetName|Y]'s good dishes. The host called for the baker to pay for the damage, and by then you had drunk enough of the good wine to think yourself the only person at the table capable of settling it."
 me_zorgoomni.234.a: "No need to cause a scene; I will pay for the dishes myself"
 me_zorgoomni.234.b: "Break all of [SCOPE.sCharacter('random_dinner_host').GetFirstName]'s other dishes for being greedy"
 me_zorgoomni.234.c: "An error this grave calls for death! Allow me the honor"

 me_zorgoomni.235_title: "Friends After Dark"
 me_zorgoomni.235_desc: "The watch has come to you in confidence, my [ROOT.GetCountry.GetRulerTitle]. A member of your household keeps company with people the watch knows by sight. The company came home last night with market shutters for firewood, one still painted with the price of salt, and none of them could be persuaded to say where they bought it."
 me_zorgoomni.235.a: "I refuse to get involved without tangible proof"
 me_zorgoomni.235.b: "Threaten [SCOPE.sCharacter('heir').GetFirstName] with exile and pay to have him watched"

 me_zorgoomni.237_title: "The Road in the River"
 me_zorgoomni.237_desc: "Bad news from the western road, my [ROOT.GetCountry.GetRulerTitle]. Our courier followed it until the water reached the horse's belly, then came back dripping to ask whether anyone had paid for a ferry, since the old milestones were of no further use to him."
 me_zorgoomni.237.a: "Pay the locals to work to restore the highways"

 me_zorgoomni.238_title: "The Unsealed Letter"
 me_zorgoomni.238_desc: "Your clerk has brought a rather awkward letter to court, my [ROOT.GetCountry.GetRulerTitle]. The intercepted letter looked like evidence of treason until our clerk broke the seal, read two lines aloud, and reached a third that made him wish he had read the whole thing to himself. Two names are familiar to everyone at court. The courier asks how much of it should be entered in the record."
 me_zorgoomni.238.a: "I have better things to do than police morality"
 me_zorgoomni.238.b: "Make the contents of the letter public and force them to divorce"
 me_zorgoomni.238.c: "They can buy our silence. Find out who sent the letter."

 me_zorgoomni.239_title: "The Levy That Held"
 me_zorgoomni.239_desc: "Good news from your veterans, my [ROOT.GetCountry.GetRulerTitle]! Our levies held while a larger force tried to turn their flank. They returned with the enemy baggage, a kettle big enough for a company, and a story the taverns have already improved upon. The veterans ask what share belongs to the people who carried it home."
 me_zorgoomni.239.a: "Give the men everything that they brought back"
 me_zorgoomni.239.b: "Fighting for [ROOT.GetCountry.GetName] is privilege enough"

 me_zorgoomni.240_title: "A Shutter, Then a Street"
 me_zorgoomni.240_desc: "There has been a riot in [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. By the time they arrived the stall was in pieces, somebody had set a shutter alight, and the bucket they brought was still full of the fish they had bought for supper. The fire jumped the street while neighbors were still arguing over who threw the first stone."
 me_zorgoomni.240.a: "Bastards! We will hunt down those responsible."

 me_zorgoomni.241_title: "A Debt from Dinner"
 me_zorgoomni.241_desc: "A basket has arrived at the palace, my [ROOT.GetCountry.GetRulerTitle], and the man who carried it says to mind the sharp edges. Inside are the broken dishes and a bill that lists every piece. The servants say [SCOPE.sChar('random_dinner_host').GetName|Y] read the charges aloud to everyone still at the table before sending the basket up to the palace."
 me_zorgoomni.241.a: "Send the basket back. I have settled my account."

 me_zorgoomni.243_title: "Where the Vines Grew Green"
 me_zorgoomni.243_desc: "Strange news from your farmers, my [ROOT.GetCountry.GetRulerTitle]. Farmers tell of a stranger who rested a hand on their withered vines, and by morning there were green shoots winding round stakes they had meant to pull up for kindling. They have set out bread where the stranger crossed the ditch, and now ask permission to build a shrine there."
 me_zorgoomni.243.a: "The piety of the [ROOT.GetCountry.GetAdjective] faithful has been rewarded!"

 me_zorgoomni.244_title: "The Stone with a Name"
 me_zorgoomni.244_desc: "The builders of a new row of houses have made an awkward discovery, my [ROOT.GetCountry.GetRulerTitle]. The builders had already hauled dressed stone out of the old burial ground and laid the first course, when a mason turned a block and found a name cut on the underside. The families have stopped work while they wait to hear if they may keep what they carried away."
 me_zorgoomni.244.a: "I am disgusted to hear this sordid tale"

 me_zorgoomni.245_title: "Lanterns for the Watch"
 me_zorgoomni.245_desc: "A petition has arrived from the people of [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. A lamp fell in a crowded lane and neighbors passed water from hand to hand until dawn, wearing a track through the mud between the well and the fire. Now they want paid watchmen with lanterns, hooks, and authority to wake a household when they smell smoke."
 me_zorgoomni.245.a: "There is no way that we are paying for this"
 me_zorgoomni.245.b: "Pay for the lanterns and hooks, and tell the watch to make its first round tonight."

 me_zorgoomni.246_title: "The Toll Taken by Knives"
 me_zorgoomni.246_desc: "Your merchants no longer dare take the trade road alone, my [ROOT.GetCountry.GetRulerTitle]. Escaped slaves built a stockade by the trade road. A muleteer came home with a cut across the face and a demand for payment folded into his hat, where he says the bandits put it so he could not pretend to lose it. The scouts say the gang knows every path out of the camp."
 me_zorgoomni.246.a: "Send a few cohorts of our finest men to put an end to their terror"
 me_zorgoomni.246.b: "We cannot spare the manpower at the moment, I'm afraid"

 me_zorgoomni.247_title: "A Path Behind the Stockade"
 me_zorgoomni.247_desc: "Your scouts have returned with a way into the stockade, my [ROOT.GetCountry.GetRulerTitle]. One track runs to the gate, wide enough for two wagons, while a second follows a ditch under the ridge and comes up behind the palisade. The guide asks who is going first."
 me_zorgoomni.247.a: "Show me the path under the ridge, and I will lead the men myself."
 me_zorgoomni.247.b: "Such a trifling task should be delegated; inform me of our victory"

 me_zorgoomni.248_title: "The Stockade Comes Down"
 me_zorgoomni.248_desc: "The stockade is ours, my [ROOT.GetCountry.GetRulerTitle]! A splinter caught you in the eye when the palisade came down, and by the time the surgeon tied the bandage, our soldiers had found the pack animals and put the prisoners on the road to the capital."
 me_zorgoomni.248.a: "The gods give to us only what we are able to bear"

 me_zorgoomni.249_title: "A Captain Brings Back the Road"
 me_zorgoomni.249_desc: "Your troops are back in [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle], and the merchants have turned out to meet them. The troops came back to [ROOT.GetCountry.GetCapital.GetName|G] with prisoners, recovered cargo, and one mule carrying so many owners' marks that even the merchants stopped haggling long enough to cheer."
 me_zorgoomni.249.a: "See that the troops get credit for reopening the road."

 me_zorgoomni.250_title: "Coin in the Street"
 me_zorgoomni.250_desc: "There is a commotion below your window, my [ROOT.GetCountry.GetRulerTitle], over a sum scarcely worth entering in the books. Below the palace window a child chased one dropped coin through three stalls before a baker caught it under a shoe. Your purse is within reach, and the guards, who have seen you watching the child, ask whether they should clear a little room below the window."
 me_zorgoomni.250.a: "Open the shutters, for there is more than one coin in this purse."

 me_zorgoomni.252_title: "The Drill Ground"
 me_zorgoomni.252_desc: "[SCOPE.sChar('general_advisor').GetName|Y] has brought you a proposal, my [ROOT.GetCountry.GetRulerTitle]. A veteran has offered to drill our young people before they muster. He asks for wooden weapons and a field, and promises the bruises will be quite real, which is how he intends to persuade the youngsters to keep their shields up."
 me_zorgoomni.252.a: "We simply cannot afford this, although it is a good idea"
 me_zorgoomni.252.b: "Fantastic idea, [SCOPE.sCharacter('general_advisor').GetFirstName], it shall be done"

 me_zorgoomni.253_title: "Smoke at the Crossroads"
 me_zorgoomni.253_desc: "An #Y Ularian#! pilgrim by the name of [SCOPE.sChar('dementive_sadhu').GetName|Y] was waiting at the crossroads when your hunting party passed. He knocked the ash out against his boot, greeted you by name, and asked whether there was room for one more traveler on the last mile to the capital."
 me_zorgoomni.253.a: "Let him walk with us. We can offer him a place at court."

 me_zorgoomni.254_title: "Steel in the Courtyard"
 me_zorgoomni.254_desc: "There has been an attack at your residence, my [ROOT.GetCountry.GetRulerTitle]! A shout woke the household before dawn. By the time we lit the lamps, there were bodies on the paving and the pilgrim was sitting on the steps. He says the men at the service gate were talking too loudly to be servants, so he drew his blade before he thought to call the guard."
 me_zorgoomni.254.a: "Have him drill the household guard. They could learn from him."

 me_zorgoomni.255_title: "A City Worth the Detour"
 me_zorgoomni.255_desc: "The innkeepers of [ROOT.GetCountry.GetCapital.GetName|G] bring good news, my [ROOT.GetCountry.GetRulerTitle]. Pilots have begun marking our city on their charts as a place worth stopping even when their cargo is bound elsewhere. The innkeepers want a few signs put up, and one has brought us a trampled turnip to show what comes of leaving visitors to find their own way."
 me_zorgoomni.255.a: "We are thankful that we have such a friendly reputation"

 me_zorgoomni.260_title: "The Captain Who Counts"
 me_zorgoomni.260_desc: "A mercenary captain by the name of [SCOPE.sChar('omega_corp_trainer').GetName|Y] has caught the attention of your officers, my [ROOT.GetCountry.GetRulerTitle]. He comes from the #G Nazani Empire#! and has a reputation for bringing home more of his troops than most commanders. A veteran says the captain counts every sack of meal, knows where the next well is, and can tell you how far his slowest company will get before the shadow reaches it."
 me_zorgoomni.260.a: "Invite the captain to supper."

 me_zorgoomni.261_title: "What the Captain Knows"
 me_zorgoomni.261_desc: "[SCOPE.sChar('omega_corp_trainer').GetName|Y] has stayed after supper to discuss what his veterans could teach yours. The Nazani captain drew his formations in spilled salt, using the bread knife to show how a line folds when its flank gives way. He will put men on the drill ground and teach us in earnest if we pay for their time."
 me_zorgoomni.261.a: "We cannot afford this cost right now"
 me_zorgoomni.261.b: "Pay for his instructors, and give them a field to work in."

 me_zorgoomni.262_title: "Milk Gone Sharp"
 me_zorgoomni.262_desc: "Your dairymen have brought a complaint to the palace, my [ROOT.GetCountry.GetRulerTitle]. The morning's milk curdles before the dairymen can get it indoors, and smells so strongly of garlic that the cook sent back the whole pail without tasting it. An old woman who remembers the silver idol asks whether we can still put it back."
 me_zorgoomni.262.a: "Have the dairymen empty their pails away from the wells."

 me_zorgoomni.263_title: "Seats at the Play"
 me_zorgoomni.263_desc: "Your spouse has news from the theater of [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. A new play opens tonight, with a shipwreck, a false pilot, and a magistrate who will believe any story told by a man wearing a better coat than his own. Your spouse has already reserved seats."
 me_zorgoomni.263.a: "I am too busy to go to see a boring play"
 me_zorgoomni.263.b: "Yes, my dear, take the seats where we can see the pilot's face."

 me_zorgoomni.264_title: "The Last Act"
 me_zorgoomni.264_desc: "My liege, the performance in [ROOT.GetCountry.GetCapital.GetName|G] was the talk of the street by the time you got home. The theater fell quiet when the false pilot took off his coat and everyone saw the magistrate's seal sewn into the lining. Your spouse quoted a line from the last act all the way home, getting it a little closer to right each time, until even the guard walking ahead of you could supply the missing word."
 me_zorgoomni.264.a: "I look forward to our next evening at the theater"

 me_zorgoomni.266_title: "Nets Full of Weed"
 me_zorgoomni.266_desc: "The fishers of [ROOT.GetCountry.GetCapital.GetName|G] have come to court, my [ROOT.GetCountry.GetRulerTitle]. The boats have come home light for three weeks, with more weed than fish to shake from the nets. A netmaker offered to patch their gear on credit, then went down to the quay and saw that most of it was sound. Fish sellers are weighing out portions they used to throw away."
 me_zorgoomni.266.a: "We have weathered lean catches before, and we will weather this one."

 me_zorgoomni.267_title: "A Slight Remembered"
 me_zorgoomni.267_desc: "A word spoken in passing has reached [SCOPE.sChar('random_dude_advisor').GetName|Y], my [ROOT.GetCountry.GetRulerTitle]. They returned your letter unopened, setting it beside your plate where the whole household could see that the wax was still unbroken."
 me_zorgoomni.267.a: "If they want a quarrel, they have one."

 me_zorgoomni.268_title: "Before the Road Closes"
 me_zorgoomni.268_desc: "[SCOPE.sChar('heir').GetName|Y] asks for your leave to travel, my [ROOT.GetCountry.GetRulerTitle]. They have packed a coat and a wax tablet, and sewn their money into a boot where they imagine no thief has ever thought to look. There will be time enough for councils once the world has taught them something worth saying in one."
 me_zorgoomni.268.a: "You may leave, but please be careful."
 me_zorgoomni.268.b: "You know we need you here at home, [SCOPE.sCharacter('heir').GetFirstName]."

 me_zorgoomni.269_title: "An Hour Without a Seal"
 me_zorgoomni.269_desc: "Your clerk has one last question before leaving you for the evening, my [ROOT.GetCountry.GetRulerTitle]. Can the letters on your desk wait until morning? The garden lamps are still lit, and the watch has left a bench dry beneath the wall."
 me_zorgoomni.269.a: "I shall return in a day or two with renewed vim and vigor"

 me_zorgoomni.270_title: "Horses Over the Wall"
 me_zorgoomni.270_desc: "Your grooms bring miserable news, my [ROOT.GetCountry.GetRulerTitle]. Thieves wrapped our best horses' feet in cloth before leading them out in the dark. Our grooms found the rags in the ditch and have spent the morning explaining why dogs that bark at every passing cart slept through the theft of our finest horses."
 me_zorgoomni.270.a: "Ask the grooms which gate was left unbarred."

 me_zorgoomni.271_title: "A Company Without a Banner"
 me_zorgoomni.271_desc: "An unfamiliar company has arrived at the gates of [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. Soldiers reached the gate carrying the remnants of a standard. Their army scattered after a defeat and nobody has paid them since. A few are barefoot, and the man carrying the old standard has tied it to a walking stick, but they still fell into ranks when our watch called down."
 me_zorgoomni.271.a: "We could always use experienced fighters in [ROOT.GetCountry.GetName]"

 me_zorgoomni.282_title: "Cargo on Paper"
 me_zorgoomni.282_desc: "Merchants with business across the #T Orcish Sea#! have come to your court, my [ROOT.GetCountry.GetRulerTitle]. Brokers offer us a share in a shipment of incense from across the Orcish Sea. The samples smell of resin and smoke, and one broker has drawn the cargo in his ledger as neatly as if the ship were tied up at our quay, with a berth and a set of scales waiting for it."
 me_zorgoomni.282.a: "Keep the treasury out of it."
 me_zorgoomni.282.b: "Buy a modest share, and keep the sample until the ship comes in."
 me_zorgoomni.282.c: "Take as much of the cargo as they will sell us."

 me_zorgoomni.283_title: "A Quay Without a Ship"
 me_zorgoomni.283_desc: "Your harbor master at [ROOT.GetCountry.GetCapital.GetName|G] has another letter from the incense brokers, my [ROOT.GetCountry.GetRulerTitle]. A year has passed since we paid for the incense. Two ships on the same route have come and gone, and the brokers have sent another letter in a hand that seems to belong to neither man who took our money. The harbor master is beginning to recognize their excuses by the shape of the seal."
 me_zorgoomni.283.a: "I should have known! This always happens to me"

 me_zorgoomni.284_title: "Rain in Time"
 me_zorgoomni.284_desc: "Good news from the fields outside [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]! The rain has soaked through the dust to the roots. The farmers had started cutting fodder to save what little they could, and now they are out in the wet, rubbing mud between their fingers and arguing over which fields will still give a crop."
 me_zorgoomni.284.a: "Gods be praised!"

 me_zorgoomni.285_title: "Bowstring or Blade?"
 me_zorgoomni.285_desc: "[SCOPE.sChar('warrior_trainer').GetName|Y] has come to offer you a lesson in arms, my [ROOT.GetCountry.GetRulerTitle]. An old soldier has laid a sword and a bow on the bench for you. The soldier sets down a whetstone and a length of spare bowstring, and says either will do, provided you can bear to practice with nobody there to admire the result."
 me_zorgoomni.285.a: "Show me a trick or two with the sword"
 me_zorgoomni.285.b: "I prefer attacking from a distance, the bow suits me"

 me_zorgoomni.286_title: "The Scent of a Good Bargain"
 me_zorgoomni.286_desc: "Good news from the docks at [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]! The incense ship is in, and buyers began calling their prices from the quay before the crew had slung the first bale over the side. The brokers' accounts are surprisingly easy to read now that they have something good to report."
 me_zorgoomni.286.a: "Count out our share, and buy the pilot a cup of something good."

 me_zorgoomni.287_title: "A Hold Full of Incense"
 me_zorgoomni.287_desc: "Your brokers have come up from the docks, my [ROOT.GetCountry.GetRulerTitle], and they are carrying another purse. The incense fetched more than the brokers expected, for their pilot brought the whole cargo in dry. He waited out a contrary wind instead of trying the shoals at night."
 me_zorgoomni.287.a: "What incredible news!"

 me_zorgoomni.288_title: "After the Lamps Are Lit"
 me_zorgoomni.288_desc: "[SCOPE.sChar('priest').GetName|Y] asks to speak with you in private before the festival, my [ROOT.GetCountry.GetRulerTitle]. They have spent years hearing what people say when frightened and what they ask of the gods when nobody else can hear. There is time for one lesson before the doors open, and the priest has brought a lamp with just enough oil to see us through it."
 me_zorgoomni.288.a: "Teach me how to understand the minds of men"
 me_zorgoomni.288.b: "I need to understand the ways of the gods."

 me_zorgoomni.289_title: "A Race Through the Capital"
 me_zorgoomni.289_desc: "Preparations for the chariot race have taken over the square of [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. The carpenters want timber for the stands, the bakers want flour, and two owners want the same place at the starting line. The steward asks us to settle the first expenses before the horses get here, for the owners have begun measuring the course with their own strides and coming up with different answers."
 me_zorgoomni.289.a: "Come one, come all! Just remember who invited you"

 me_zorgoomni.290_title: "Bread Before Dawn"
 me_zorgoomni.290_desc: "The bakers of [ROOT.GetCountry.GetCapital.GetName|G] have been up all night, my [ROOT.GetCountry.GetRulerTitle]. The first carts of bread pass the last carts of flour, and in the square a carpenter is still planing down the rail, where a chariot's outer wheel might catch it if the driver takes the corner too close."
 me_zorgoomni.290.a: "We can't afford to pay for anything extravagant"
 me_zorgoomni.290.b: "Anything that the people want, they will have"

 me_zorgoomni.291_title: "The Drivers Arrive"
 me_zorgoomni.291_desc: "The teams have arrived in [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]! They came in at first light, their harness bells carrying above the calls of the bread sellers, and several people who had waited since midnight lost their places trying to see over the rail."
 me_zorgoomni.291.a: "How exciting all of this is!"

 me_zorgoomni.292_title: "A Wager by the Rail"
 me_zorgoomni.292_desc: "[SCOPE.sChar('gambling_patriarch').GetName|Y] has found a place at your elbow, my [ROOT.GetCountry.GetRulerTitle], and asks whether you would care to make a small wager. The horses are already walking down to the line, and there is just time to pick a rider before the man beside you notices which lane is still soft from the rain."
 me_zorgoomni.292.a: "I don't gamble, sorry."
 me_zorgoomni.292.b: "I will match your wager; why not"

 me_zorgoomni.293_title: "A Lead at the Last Turn"
 me_zorgoomni.293_desc: "Your wager has paid off, my [ROOT.GetCountry.GetRulerTitle]! Your rider went wide, the crowd groaned, and then the inside horse stumbled in the wheel ruts. By the time the dust settled your companion had the purse open."
 me_zorgoomni.293.a: "Pay me before the next race, while we both remember the wager."

 me_zorgoomni.294_title: "A Bad Horse to Back"
 me_zorgoomni.294_desc: "It looked like a good wager for the first dozen strides, my [ROOT.GetCountry.GetRulerTitle]. By the second turn your horse was fighting its rider to get off the track, and a bread seller had to jump behind his own cart. Your companion has been polite enough to wait until the finish to ask for the money."
 me_zorgoomni.294.a: "Pay what we owe. The next race is about to start."

 me_zorgoomni.295_title: "Tracks in the Dust"
 me_zorgoomni.295_desc: "The race is over, my [ROOT.GetCountry.GetRulerTitle], and the children of [ROOT.GetCountry.GetCapital.GetName|G] are running the course themselves. They are dragging sticks through the wheel tracks. The stands held, the bread ran out, and people are already asking when we will do it again, chiefly those who have forgotten what they paid for a seat."
 me_zorgoomni.295.a: "I can't wait to get a horse of my own!"

 me_zorgoomni.296_title: "Boots Beyond the Boundary"
 me_zorgoomni.296_desc: "News from your border scouts, my [ROOT.GetCountry.GetRulerTitle]. Scouts found fresh campfires and a ford where mounted patrols have been crossing. The neighbor's envoy calls it an exercise, and the farmers nearest the ford, who have heard that before, are driving their cattle inland while there is daylight."
 me_zorgoomni.296.a: "We aren't afraid of anyone, especially the [aggressive_neighbor.GetAdjective] dogs"

 me_zorgoomni.297_title: "Who Pays the Roadmen?"
 me_zorgoomni.297_desc: "Your men have taken a highway robber alive, my [ROOT.GetCountry.GetRulerTitle]. A captured bandit carried a pay token with a neighbor's seal. Our traders recognize the seal, and describe the same men stopping our wagons, counting our bales, and waving foreign caravans through without so much as lifting a tarpaulin."
 me_zorgoomni.297.a: "Did you think we weren't going to find out? Do you take us for fools?"

 me_zorgoomni.298_title: "A Gift Across the Border"
 me_zorgoomni.298_desc: "An envoy from [SCOPE.sCountry('friendly_neighbor').GetName|T] has arrived in [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. The gift he brought came with a letter praising the good order on our shared roads. The envoy watched our clerk unpick the cord, waited for the gift to be admired, and asked what he should tell his master on the journey home."
 me_zorgoomni.298.a: "That was nice of them, but make no promises"

 me_zorgoomni.299_title: "Guests at the Festival"
 me_zorgoomni.299_desc: "An invitation has arrived from [SCOPE.sCountry('friendly_neighbor').GetName|T], my [ROOT.GetCountry.GetRulerTitle]. Our envoys have been offered places in the festival procession, and may watch the rites without taking part. The invitation came by the same road our merchants use, with their names in the letter and a note that the stalls nearest the procession are still unlet."
 me_zorgoomni.299.a: "Accept the invitation. Send a gift for the procession."

 me_zorgoomni.300_title: "Stones for Sale"
 me_zorgoomni.300_desc: "Your scouts bring curious news from [SCOPE.sCountry('friendly_neighbor').GetName|T], my [ROOT.GetCountry.GetRulerTitle]. A scout watched laborers lower dressed blocks down the outside of a tower, from a spot where a year ago the garrison would have put an arrow through his coat. The neighbor is selling its own fortifications for stone."
 me_zorgoomni.300.a: "Inform our generals of this blessing, and see what they want to do"

 me_zorgoomni.301_title: "An Invitation to the Hunt"
 me_zorgoomni.301_desc: "[SCOPE.sChar('random_dude_hunter').GetName|Y] and [SCOPE.sChar('random_dude_hunter_2').GetName|Y] have come to court with better news than anything in your dispatches, my [ROOT.GetCountry.GetRulerTitle]. The weather has broken and there is fresh game in the woods. The dispatches will still be on your desk tomorrow, and your companion has already asked the keeper to choose the dogs, which you can hear making their objections from the courtyard."
 me_zorgoomni.301.a: "Yes, that sounds wonderful, and I can be ready before the dogs."
 me_zorgoomni.301.b: "No, I am too busy to do this right now"

 me_zorgoomni.302_title: "The First Day Out"
 me_zorgoomni.302.e: "It is foul weather. I can hardly blame you for saying so."
 me_zorgoomni.302.d: "The capital has sent for me. Take the dogs on ahead."
 me_zorgoomni.302.c: "Dismount. We can put the shrine right before we ride on."
 me_zorgoomni.302.b: "I will remember what you said in the rain."
 me_zorgoomni.302.a: "Put another log on. We are in no hurry."
 me_zorgoomni.302.desc_1: "[SCOPE.sChar('random_dude_hunter').GetName|Y] took you by the long road to the lodge, and the rest of the party was glad of the extra time away from court. At the first ford the talk was all about battles and taxes, but by the time the cook set a pan on the fire we were talking about our childhoods, and the last of the wood burned down before anyone thought to call it a night."
 me_zorgoomni.302.desc_2: "The rain got through our coats before the lodge was in sight, and [SCOPE.sChar('random_dude_hunter_2').GetName|Y] wiped the water from his face, looked up at the sky, and asked what you had done to earn the gods' attention. It might have passed for a joke if he had stopped there."
 me_zorgoomni.302.desc_3: "At a shallow crossing, someone saw a strip of carved stone under the vines. A shrine stood a little farther back, its roof gone, its stones still black from a fire and slick enough with moss that the horses would go no farther. The horses can wait while we see what is left."
 me_zorgoomni.302.desc_4: "Riders from the capital found us a day out, their horses white with sweat. The lead messenger dismounted and handed over a sealed order for your immediate return. Your companions took charge of the dogs, and the oldest hound howled after you until you were out of sight."

 me_zorgoomni.303_title: "Smoke Over the Camp"
 me_zorgoomni.303.d: "Fetch my horse. I must see my heir."
 me_zorgoomni.303.c: "Give me a moment to catch my breath."
 me_zorgoomni.303.b: "The woods are waiting. Bring the dogs."
 me_zorgoomni.303.a: "Give me another hour. The deer can wait."
 me_zorgoomni.303.desc_1: "Someone brought a jug out after supper, then remembered two more, and the cook called for breakfast before the last story was finished. You went to your bedroll with grass in your ears to keep out the birds."
 me_zorgoomni.303.desc_2: "You woke before the cook, and by the time the others had found their boots, the embers were stamped out and there was bread and cold meat ready for the road."
 me_zorgoomni.303.desc_3: "The rain followed us to the lodge. Water dripped through the canvas all night, always finding the one corner of the blanket you had just managed to warm. When you stepped out at dawn to see whether the hunt could go ahead, a fit of coughing shook you so hard you had to lean on the tent pole."
 me_zorgoomni.303.desc_4: "The party was stringing bows when soldiers came through the trees in our colors. They had tracked us for a week, changing horses wherever they could, and have kept the freshest for you. Your heir, [SCOPE.sChar('zorgo_event_103_heir').GetName|Y], has been gravely injured."

 me_zorgoomni.304_title: "Under the Old Trees"
 me_zorgoomni.304.n: "Whose knife was that?"
 me_zorgoomni.304.m: "I cannot see the fire. Is it still burning?"
 me_zorgoomni.304.l: "Tell the cook there is more coming."
 me_zorgoomni.304.k: "I will take the road next time."
 me_zorgoomni.304.j: "Carry the antlers home. Mind the points."
 me_zorgoomni.304.i: "Bring the gold up before the light goes."
 me_zorgoomni.304.h: "Pay her for the blessing."
 me_zorgoomni.304.g: "I will leave that horse to a better rider."
 me_zorgoomni.304.f: "Get me back to the fire."
 me_zorgoomni.304.e: "I will have better luck next time."
 me_zorgoomni.304.d: "Call the others. I want them to see what we brought down."
 me_zorgoomni.304.c: "Put the venison on. There is enough for all of us."
 me_zorgoomni.304.b: "Strike the camp. I have had enough of the woods."
 me_zorgoomni.304.a: "Put another log on. I want to hear that story again."
 me_zorgoomni.304.desc_1: "Nobody brought back anything fit to eat. Around the fire the stags grew a little taller in every account, and after the second jug we heard of one that could clear a whole field without putting a hoof to the ground."
 me_zorgoomni.304.desc_2: "You spent the day in brambles and lost the party before dusk, and they found you by the sound of your boots filling up in a stream. By the time anyone offered to take your bow you had already called for the horses."
 me_zorgoomni.304.desc_3: "Your arrow brought down the only deer anybody saw all day. The cook had already set out the cold bread, and swept it back into the basket when the carcass came through the trees. Your companions raised the first cup to the shot and the second to your good fortune."
 me_zorgoomni.304.desc_4: "The stag went down so hard the men on the far side of the trees heard it. Its antlers were nearly as long as you were tall, and the first hunter to reach you walked all the way around it, stepping over the points before he said a word."
 me_zorgoomni.304.desc_5: "You waited beside the lake from morning until the light went off the water. Nothing came to drink, and back at camp the cook lifted the lid off an empty pot and asked how you had fared."
 me_zorgoomni.304.desc_6: "A bear caught your leg before you could draw a blade. Your companions followed the noise, drove it off, and bound the wound with a strip cut from a saddlecloth. They will have to carry you back to camp."
 me_zorgoomni.304.desc_7: "You woke under a blanket with your head wrapped in linen, and someone set a cup beside you and explained that your horse had reached camp before you did. You remember setting out, and nothing after that."
 me_zorgoomni.304.desc_8: "A hut stood so deep in the woods that its roof was wet long after the rain had stopped. The woman inside knew you were coming, had laid a dry log on the fire for you, and asked for a hundred coins to give you [GetDeityDefinition('omen_cafea').GetName|Y]'s blessing."
 me_zorgoomni.304.desc_9: "You went down into a ravine for an arrow and saw sunlight flash on a broken jar. You brushed away a few shards and found more gold among the stones than anyone at camp had thought to bring along."
 me_zorgoomni.304.desc_10: "A white stag drank at the lake with its back to you, and the arrow was away before it could lift its head and see you in the water. You knelt by the water to give thanks and sent someone back for help carrying the antlers."
 me_zorgoomni.304.desc_11: "The wolves followed you as far as the cliff. There was just time to see the river below before you jumped, and the current took you round the bend with the wolves still howling above the splash."
 me_zorgoomni.304.desc_12: "Back at the fire, everyone agreed you had taken the best quarry. They agreed on it before supper, which is the first time anyone remembers a hunting party settling a matter on an empty stomach."
 me_zorgoomni.304.desc_13: "The wolves came in low through the brush. The others drove them off, and a hunter wrapped your face with a strip torn from his shirt, feeling for a knot that would hold without hurting you further. By evening he had stopped asking whether you could see."
 me_zorgoomni.304.desc_14: "You drew on a stag as it lowered its head to the creek, with your companion a few paces behind, close enough that you could hear him take a breath. There was a sound of steel coming free, a pain between your ribs, and then you could hear neither the creek nor the stag."

 me_zorgoomni.305_title: "The Road Home"
 me_zorgoomni.305.d: "Oh no...this can't be!"
 me_zorgoomni.305.c: "If you ever have any other questions, [SCOPE.sCharacter('random_dude_hunter_2').GetFirstName], feel free to ask"
 me_zorgoomni.305.b: "I am blessed beyond measure to have such loyal and loving countrymen"
 me_zorgoomni.305.a: "Home again at last, thank you for asking me along."
 me_zorgoomni.305.desc_1: "We rode home quietly, and the sun came out just long enough for the roofs of the capital to show above the walls, and everyone seemed to recognize the same moment to start talking again."
 me_zorgoomni.305.desc_2: "People came out from the villages with wet shoes and children on their shoulders, and you slowed to speak with them until there were as many questions about the hunt as there were petitions about the road."
 me_zorgoomni.305.desc_3: "On the road home [SCOPE.sChar('random_dude_hunter_2').GetName|Y] asked how you decide which disputes to hear yourself. You were still discussing the answer when the gate came into sight, and the rest of the party had long since given up pretending it could not hear."
 me_zorgoomni.305.desc_4: "Bandits came out after dark within sight of the capital. We drove them off and called the roll twice, and found [SCOPE.sChar('random_dude_hunter').GetName|Y] lying where the first charge had passed, with the city lamps still visible down the road."

 me_zorgoomni.306_title: "What the Court Heard"
 me_zorgoomni.306_desc: "Word of your adventures reached [ROOT.GetCountry.GetCapital.GetName|G] ahead of you, my [ROOT.GetCountry.GetRulerTitle]. By the time the hunting party returned, the people at home knew three versions of the trip, with most of the details supplied by the grooms and a bear added in the kitchens, where nobody had been near the woods."
 me_zorgoomni.306.a: "Give thanks for a safe return."

 me_zorgoomni.307_title: "A Dispatch in the Ditch"
 me_zorgoomni.307_desc: "Bad news from the road out of [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. Bandits fell upon your messengers before they were well clear of the gate. The survivors saved the seals, but the dispatches are in a ditch, and at least one horse is carrying a saddlebag of state business in the wrong direction."
 me_zorgoomni.307.a: "Send a second courier, and put the fresh copy inside their coat."

 me_zorgoomni.308_title: "The Knot Comes Loose"
 me_zorgoomni.308_desc: "Your envoys return to [ROOT.GetCountry.GetCapital.GetName|G] in high spirits, my [ROOT.GetCountry.GetRulerTitle]. A negotiation stuck for weeks ended before the ink was dry on the morning's orders. Our envoys say both parties wanted the same crossing kept open, and once you put the ford on the map between them, they could finally agree which quarrels could wait."
 me_zorgoomni.308.a: "I live but to serve the people"

 me_zorgoomni.309_title: "The Arrears Come In"
 me_zorgoomni.309_desc: "Your collectors have returned to [ROOT.GetCountry.GetCapital.GetName|G] with money we had all but given up on, my [ROOT.GetCountry.GetRulerTitle]. A collector came in with a chest of back taxes. Two officials who signed the original receipts are dead, and our clerk counted the silver twice before bringing the ledger up, for he says it would be a shame to be wrong about good news."
 me_zorgoomni.309.a: "Better late than never, they say."

 me_zorgoomni.310_title: "The Festival Draws to a Close"
 me_zorgoomni.310_desc: "The festival has come to an end, my [ROOT.GetCountry.GetRulerTitle], and the last visitors are leaving [ROOT.GetCountry.GetCapital.GetName|G]. One merchant painted the festival's name on his awning, and was still blowing on the wet letters when his cart rolled out, so that people in the next town would know where he had been."
 me_zorgoomni.310.a: "I look forward to this event every year"

 me_zorgoomni.318_title: "A Pilgrim with Questions"
 me_zorgoomni.318_desc: "Your border guards bring word of an #Y Ularian#! pilgrim called [SCOPE.sChar('izn_divine_scholar').GetName|Y], my [ROOT.GetCountry.GetRulerTitle]. He arrived with enough followers to fill an inn and spill into the stables. At each shrine he asks the keeper to explain one custom he does not know, and his companions, who thought he would be the one answering questions, are learning to carry extra tablets."
 me_zorgoomni.318.a: "Ask Iven to stay and teach at court."
 me_zorgoomni.318.b: "Perhaps this wise man will teach me something before he leaves?"
 me_zorgoomni.318.c: "Hold him here and confiscate his travelling purse."

