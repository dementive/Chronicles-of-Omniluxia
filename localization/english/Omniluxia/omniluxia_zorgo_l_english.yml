 omni_zorgo_snakefolk_curiosity: "Bronze Serpent from the Snakefolk Coast"
 omni_zorgo_snakefolk_curiosity_desc: "An explorer brought this bronze beast home in a crate lined with old sailcloth. Its coiled body is scaled, but its head resembles a cat about to spring."
 omni_zorgo_white_stag_antlers: "Antlers of the White Stag"
 omni_zorgo_white_stag_antlers_desc: "A pair of pale antlers taken from a stag at a forest lake. The hunters say it took two of them to carry the prize back to camp."

  me_zorgoomni.995_title: "DEBUG: Outbreak in the Capital"
  me_zorgoomni.995_desc: "DEBUG event. Forces the epidemic-tier Redmouth modifier onto the capital and attempts to infect its governor, so you can check how the disease modifier icon (gfx/interface/icons/traits/plague.dds) reads on the province."
  me_zorgoomni.995.a: "Understood"
  me_zorgoomni.995_tooltip: "#Y Capital#! will gain the #R Redmouth Epidemic#! modifier, and its governor (if any) may become #R Infected#!."

  me_zorgoomni.996_title: "DEBUG: Disaster in the Capital"
  me_zorgoomni.996_desc: "DEBUG event. Forces the initial Flood damage modifier onto the capital, for comparison against the disease outbreak test event."
  me_zorgoomni.996.a: "Understood"
  me_zorgoomni.996_tooltip: "#Y Capital#! will gain the #R Flood Damage#! modifier."

  me_zorgoomni.1_title: "Ancient Book Uncovered"
  me_zorgoomni.1_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], there is good news from [ROOT.GetCountry.GetCapital.GetName|G]! A local priest claims that he has discovered an ancient book, one that predates the #Y Great Collapse#!, with an indecipherable script written upon its yellowed pages, and has brought it to the capital in hopes that someone here will be able to translate.\n\nUnfortunately for all involved, none of our wisest minds were able to make heads or tails of the text, but that doesn't seem to matter; word has spread among the people that we have possession of a tome of great antiquity, which has only brought prestige and glory to the inhabitants of [ROOT.GetCountry.GetName|T]."
  me_zorgoomni.1.a: "Uh, yes, right! We are collectors of antiquities and curious things"

  me_zorgoomni.2_title: "Magical Storms In The Fields"
  me_zorgoomni.2_desc: "A curious thing was seen this morning on the hills just overlooking [ROOT.GetCountry.GetCapital.GetName|G], my [ROOT.GetCountry.GetRulerTitle]. Before the sun had risen, purple crackles of light were said to be dancing through the fields - whether or not it was faerie folk, no one is certain, but echoes of laughter could be heard by those that witnessed these strange occurrences.\n\nThese creatures of light played for hours and vanished just as dawn began to color the skies. The [ROOT.GetCountry.GetAdjective] people are mystified and take this to be a good omen."
  me_zorgoomni.2.a: "What could this mean, I wonder?"

  me_zorgoomni.3_title: "Goblin Raiders!"
  me_zorgoomni.3_desc: "My [ROOT.GetCountry.GetRulerTitle], there are reports coming into [ROOT.GetCountry.GetCapital.GetName|G] that #Y Goblin#! raiders have been seen near the borders, and there are even some that even claim that some villages in the hinterlands have been completely destroyed by this wandering horde of thousands. Panic is starting to spread throughout the capital and the price of grain is starting to go up; all in all, not the greatest situation."
  me_zorgoomni.3.a: "Curses! The gods must be angry with us"
  me_zorgoomni.3.b: "Send out warriors to investigate!"
 
  me_zorgoomni.4_title: "Dragon Sighting!"
  me_zorgoomni.4_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], we are hearing frantic reports of a large #Y Dragon#! that was seen flying a day's ride from [ROOT.GetCountry.GetCapital.GetName|G]. What is worse is that these are no mere rumors; we have dozens of eyewitness reports from our frightened soldiers, who abandoned their posts in order to share the grim news. No one knows which direction the fearsome beast has flown and everyone is terrified that the #Y Dragon#! will appear at any minute."
  me_zorgoomni.4.a: "This is not good!"

  me_zorgoomni.5_title: "The Razani Mage"
  me_zorgoomni.5_desc: "This morning, a traveler dressed in tattered clothing appeared outside of the walls of [ROOT.GetCountry.GetCapital.GetName|G], asking for kind permission to be allowed entrance within our capital.\n\nWhen asked to state his name and business within [ROOT.GetCountry.GetAdjective] lands, the man said that he had the great misfortune to be [SCOPE.sChar('tadm_traveler_scope').GetName|Y], former #Y Imperial Mage#! in the service of the [GetCountry('EGA').GetName|T], but that he had abandoned his post and fled his country after a failed love affair.\n\nWhen pressed by the guards to explaim himself further, Tadm wearily asked if we were willing to offer him refuge, claiming that he would be willing to part with his worldly possessions in order to find a place to rest."
  me_zorgoomni.5.a: "If the Razani Mage desires sanctuary, then he must pay for it"
  me_zorgoomni.5.b: "Give Tadm enough money to set himself up in [ROOT.GetCountry.GetCapital.GetName]"
  me_zorgoomni.5.c: "You are a deserter that deserves nothing but death!"
  me_zorgoomni.5_tooltip: "#Y #E Tadm#! will get settled in [ROOT.GetCountry.GetCapital.GetName]#!"

  me_zorgoomni.6_title: "Priestly Duties"
  me_zorgoomni.6_desc: "[ROOT.GetCountry.GetRuler.GetName|Y] has been approached by [SCOPE.sChar('priest').GetName|Y], who has requested a private meeting with the [ROOT.GetCountry.GetRulerTitle] in order to discuss good news. [SCOPE.sChar('priest').GetFirstName|Y] has been cracking down on corruption, and the honest steward of the [ROOT.GetCountry.GetAdjective] faithful has brought us a surplus taken from the sticky fingers of the priests under [SCOPE.sChar('priest').GetHerHis] purview.\n\nWhat should the [ROOT.GetCountry.GetAdjective] people do with this gift from the gods?"
  me_zorgoomni.6.a: "Tell the priests to use the funds for sacrifices"
  me_zorgoomni.6.b: "The money is best spent on buying political favors..."
  me_zorgoomni.6.c: "Put it all into our treasury"
 
  me_zorgoomni.7_title: "A Blight In The Granary"
  me_zorgoomni.7_desc: "My [ROOT.GetCountry.GetRulerTitle], we have a report from the magistrates charged with overseeing the granaries at [ROOT.GetCountry.GetCapital.GetName|G]. It seems that our stores of grain have been infected with a blue mold that is rapidly spreading, and we are going to have to get rid of a substantial amount of food."
  me_zorgoomni.7.a: "This is unfortunate, but these things happen"
  me_zorgoomni.7.b: "Sell the rotting grain at market at a discount"

  me_zorgoomni.8_title: "Unexpected Visitors"
  me_zorgoomni.8_desc: "This morning, a #Y Kinones#! traveler named [SCOPE.sChar('kinone_traveler').GetName|Y] and his party of twenty warriors was approached by our guards a few miles outside of [ROOT.GetCountry.GetCapital.GetName|G], who then escorted the adventurers to the city gates after disarming them.\n\nIt is a rare sight to see a #Y Kinones#! anywhere in these parts, so Gerodanko and his companions were sure to draw the attention of the locals, who gathered in the streets to observe the curious figures as they made their way through the markets of the [ROOT.GetCountry.GetAdjective] capital.\n\nAcceping their petition for an audience, [ROOT.GetCountry.GetRuler.GetName|Y] agreed to meet with these men, who had left the [GetProvince('(int32)1674').GetArea.GetRegion.GetName|G] on a quest to discover what they could about the world outside of their homeland. They humbly request any assistance that [ROOT.GetCountry.GetName|T] is willing to offer."
  me_zorgoomni.8.a: "Give them some gold and maps and send them on their way"
  me_zorgoomni.8.b: "Host them as guests at a banquet for our royalty"
  me_zorgoomni.8.c: "Expel these Kinone vagabonds from our walls"
 
  me_zorgoomni.9_title: "The Gift From The Genius"
  me_zorgoomni.9_desc: "You will not believe this, [ROOT.GetCountry.GetRuler.GetName|Y], but every word of what I am about to say is true. It seems that a famous #Y Werhenlander#! scholar, an renowned genius named [SCOPE.sChar('werhen_inventor').GetName|Y], has traveled all of the way from [GetProvince('(int32)1689').GetName|G] in order to offer his services to the [ROOT.GetCountry.GetAdjective] people.\n\nNews of the accomplishments of [ROOT.GetCountry.GetRuler.GetFirstName|Y] have reached the faraway cities of the #Y Werhenlanders#!, and [SCOPE.sChar('werhen_inventor').GetFirstName|Y] desires to add to our greatness by humbly contributing his life's work and research to the libraries of our people. He has come to spend his remaining days living at [ROOT.GetCountry.GetCapital.GetName|G], where he shall continue to conduct research and write treatises."
  me_zorgoomni.9.a: "What an incredible gift!"
 
  me_zorgoomni.10_title: "The Tower In The Distance"
  me_zorgoomni.10_desc: "We keep receiving strange reports that have frightened the populace living outside of [ROOT.GetCountry.GetCapital.GetName|G]. Every few weeks, a wizard's tower appears from nowhere and strange magical occurences take place within the region of [ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName|G]; milk from cows immediately goes sour, the sun travels backwards in the sky, and the day themselves weirdly last twice as long.\n\nOur soldiers and mages cannot approach this tower, for even though they will march for hours, the spire always remains in the distance, glimmering like a mirage...we are at the mercy of an #G Archmage#! with unfathomable powers."
  me_zorgoomni.10.a: "May the gods have mercy on [ROOT.GetCountry.GetName]!"

  me_zorgoomni.11_title: "Blood Of The Rendun"
  me_zorgoomni.11_desc: "After many years of devastating wars, [ROOT.GetCountry.GetRuler.GetName|Y] has led our kinsmen to the pinnacle of glory - the various tribes of [ROOT.GetCountry.GetName|T] have been united under one banner for the first time in history. The name of [ROOT.GetCountry.GetRuler.GetFirstName|Y] is hailed far and wide as a conqueror, and the [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] Dynasty that rules over the island will be remembered by our people until the end of days!"
  me_zorgoomni.11.a: "Hail the warriors of the [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] tribe that united Rendun!"

 me_zorgoomni.12_title: "Talking Cows And Goats"
 me_zorgoomni.12_desc: "We have heard reports from some of the farmers that live outside of [ROOT.GetCountry.GetCapital.GetName|G] that are strange and worth hearing, my [ROOT.GetCountry.GetRulerTitle]. It is said that certain farm animals, like sheep and cattle, have been speaking to their masters in [ROOT.GetCountry.GetAdjective] voices, claiming that the gods are returning to [ROOT.GetCountry.GetName|T] and that the House of [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective] is destined to lead the people to glory.\n\nWhile many are disturbed by these stories of talking beasts, everyone agrees that the message of the animals is a pleasant one - there is no denying that this is a good omen."
 me_zorgoomni.12.a: "We shall take whatever favorable signs we get"

 me_zorgoomni.13_title: "Favored By Adventurers"
 me_zorgoomni.13_desc: "[ROOT.GetCountry.GetCapital.GetName|G] is known all across [ROOT.GetCountry.GetCapital.GetArea.GetRegion.GetName|G] as being a good place to find adventure, and the streets of the capital are filled with all sorts of grizzled sellswords seeking their destinies. Some of these travelers will be hired as private guards and tutors by the [ROOT.GetCountry.GetAdjective] nobles, whereas most of these wanderers will find employment accompanying trade caravans to the coasts. A lucky few will band together in parties and go out on quests, hoping to strike it rich somewhere out within the wildlands of [ROOT.GetCountry.GetCapital.GetArea.GetName|G].\n\nNeedless to say, the inns and taverns of [ROOT.GetCountry.GetCapital.GetName|G] are overflowing, and business in general has never been better."
 me_zorgoomni.13.a: "We hope that our guests find what they are searching for"

 me_zorgoomni.14_title: "Message Of The Prophet"
 me_zorgoomni.14_desc: "There is a religious disturbance within [ROOT.GetCountry.GetCapital.GetName|G] that you should hear about, [ROOT.GetCountry.GetRuler.GetName|Y]. A strange man that goes by the name of [SCOPE.sChar('zainudian_prophet').GetName|Y] has been preaching in the streets and public places of our capital, claiming that an apocalypse shall come to the people of [ROOT.GetCountry.GetName|T] unless we truly embrace the #Y Zainudian Faith#! with all of our hearts.\n\nWhile some of our kinsmen have dismissed these grim tidings as the ravings of a fanatical madman, many others have begun to defend Vermoris, arguing that the message of the #T Zainudian#! #Y Prophets#! is a revelation that leads to eternal salvation. The crowds coming to see the self-proclaimed #Y 'Messenger of Bachin'#! are growing larger every day and are becoming more difficult to control."
 me_zorgoomni.14.a: "Order the mob to disperse and kill this heretic"
 me_zorgoomni.14.b: "I believe in the message of the Two Prophets!"
 
 me_zorgoomni.15_title: "Creatures Of The Night"
 me_zorgoomni.15_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], there are growing reports of disturbing activities within [ROOT.GetCountry.GetCapital.GetName|G] that you should be aware of, my [ROOT.GetCountry.GetRulerTitle].\n\nTwo people living here have been found in their homes with puncture wounds on their necks and their bodies completely drained of blood. While no one has seen this #Y Vampire#! in person, everyone living here believes that we are being terrorized by an infernal creature of the night and our people are afraid to venture out into the streets after sunset."
 me_zorgoomni.15.a: "This is terrible news!"
 
 me_zorgoomni.16_title: "Pursuing The Flame"
 me_zorgoomni.16_desc: "Now that things are calm within [ROOT.GetCountry.GetCapital.GetName|G], [SCOPE.sCharacter('orcish_ceremony_instigator_scope').GetName|Y] has invited [ROOT.GetCountry.GetRuler.GetName|Y] to accompany him and some friends on a religious retreat. The plan is to leave the commotion of the [ROOT.GetCountry.GetAdjective] capital and head to a quiet monastery in the center of the island of #G Rendun#!.\n\nSome of the purest opium within [ROOT.GetCountry.GetName|T] will be brought with the companions, and they shall partake of the sacred medicine during a ceremony in the hopes that our #T Inner Flame#! shall burn brightly."
 me_zorgoomni.16.a: "Go into the mountains for the ceremony"
 me_zorgoomni.16.b: "We do not have time to partake in the ritual"
 me_zorgoomni.16.c: "Forbid [SCOPE.sCharacter('orcish_ceremony_instigator_scope').GetFirstName] from leaving [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.16_tooltip_a: "#Y Our Ruler will travel to the interior of#! #T Rendun#! #Y for the Opium Ceremony.#!"

 me_zorgoomni.17_title: "Pursuing The Flame"
 me_zorgoomni.17_desc: "The religious retreat led by [SCOPE.sCharacter('orcish_ceremony_instigator_scope').GetName|Y] was a complete success, and the [ROOT.GetCountry.GetAdjective] companions returned to [ROOT.GetCountry.GetCapital.GetName|G] feeling rejuvenated and focused. A quiet week was spent in contemplative meditation, and as the stresses of this world melted away, the void that filled its place was filled with wisdom and confidence.\n\nIn the end, [ROOT.GetCountry.GetRuler.GetName|Y] was quite pleased that [ROOT.GetCountry.GetRuler.GetSheHe] had taken some time away from [ROOT.GetCountry.GetRuler.GetHerHis] duties to pursue [ROOT.GetCountry.GetRuler.GetHerHis] flame."
 me_zorgoomni.17.a: "I have learned a great deal from this experience"
 
 me_zorgoomni.18_title: "Pursuing The Flame"
 me_zorgoomni.18_desc: "By the time that [ROOT.GetCountry.GetRuler.GetName|Y] returned to [ROOT.GetCountry.GetCapital.GetName|G], the only thing that [ROOT.GetCountry.GetRuler.GetSheHe] could think about was returning to the monastery - when would [ROOT.GetCountry.GetRuler.GetSheHe] be able to leave the [ROOT.GetCountry.GetAdjective] capital for the solitude of the mountains again? For the [ROOT.GetCountry.GetRulerTitle] had realized that the only thing in this life worth pursuing was the meditative state obtained through Orkansuar ritual, and from this day forth, religious practice would consume [ROOT.GetCountry.GetRuler.GetFirstName|Y]'s thinking."
 me_zorgoomni.18.a: "My Inner Flame burns brightly"

 me_zorgoomni.19_title: "Monsters From The Caverns"
 me_zorgoomni.19_desc: "My [ROOT.GetCountry.GetRulerTitle], an army of feral goblins have poured out of the caverns near [cavern_location.GetName|Y] and have attacked the locals living near the mountains - the tales of death and slaughter that are coming out of the [cavern_location.GetArea.GetName|G] province are horrifying. Something must be done about the goblin horde immediately!"
 me_zorgoomni.19.a: "I shall lead our warriors against these monsters"
 me_zorgoomni.19.b: "Send some soldiers into the caves to deal with the problem"
 me_zorgoomni.19.c: "There is nothing that we can do about this"
 me_zorgoomni.19_tooltip_a: "#Y Our Ruler will head to the mountains to fight off the#! #R Feral Goblins.#!"

 me_zorgoomni.20_title: "The Goblin Retreat"
 me_zorgoomni.20_desc: "By the time that [ROOT.GetCountry.GetRuler.GetName|Y] and [ROOT.GetCountry.GetRuler.GetHerHis] soldiers arrived at [cavern_location], the goblin horde had finished their raiding and plundering and had retreated back into their caverns. A scouting party was sent after them, and a few hours later they returned with bad news; the goblins had gone deep underground and would be difficult to track."
 me_zorgoomni.20.a: "Be that as it may, we must go after them - into the caverns!"
 me_zorgoomni.20.b: "There is nothing more we can do - head back for [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.20_tooltip_a: "#Y Our Ruler will lead our nervous army underground...#!"
 NICKNAME_GOBLINSLAYER: "Goblinslayer"

 me_zorgoomni.21_title: "Goblin Ambush!"
 me_zorgoomni.21_desc: "After a couple of days of fruitless searching, the warriors accompanying [ROOT.GetCountry.GetRuler.GetName|Y] finally picked up on the trail of the feral goblins and continued to pursue them deep into the caverns. The [ROOT.GetCountry.GetAdjective] soldiers saw many wondrous sights in the caverns of [cavern_location.GetName|Y] that defied belief and caused great consternation to the men from [ROOT.GetCountry.GetName|T] that were unused to such things; underground river systems that fed into lakes that stretched beyond the horizon, strange beasts that clung to the stalactites and leeched minerals from the stone, abandoned goblin buildings that were covered with patches of glowing moss.\n\nIt was near such a moss field that the feral goblins appeared from nowhere, filling the air with brutish screams and crude arrows that were dripping with black poison."
 me_zorgoomni.21.a: "Give no quarter to these foul creatures!"
 me_zorgoomni.21.b: "We must retreat to the surface!"
 me_zorgoomni.21_tooltip: "#Y Our Ruler fights against desperate odds...#!"
 me_zorgoomni.21_tooltip_a: "#Y Our panicked soldiers abandon our camp and flee.#!"

 me_zorgoomni.22_title: "A Deal With A Devil"
 me_zorgoomni.22_desc: "Although the [ROOT.GetCountry.GetAdjective] soldiers were terrified by the goblin ambush, their superior training and tactics soon allowed them to take control of the situation. Seeing an opening, [ROOT.GetCountry.GetRuler.GetName|Y] bravely charged into the front of the battlelines and challenged the leader of the goblins, and moments later, the foul creature was disarmed and on the ground. The loathsome beast gave out a hideous cry, and the attacks from the goblins stopped as their leader began to speak in the Common tongue, his voice a broken crackle that sounded like the crunching of bones.\n\n'Spare my life, warrior! You have defeated us, but do not kill me - I will give to you an #G Elven#! treasure if you let me leave here with my life.'\n\n'Speak no more, worm, for I can crush you and take whatever you have.' [ROOT.GetCountry.GetRuler.GetFirstName|Y] pressed [ROOT.GetCountry.GetRuler.GetHerHis] blade deep into the goblin's throat, and the beast screamed.\n\n'Please, no more, I beg you! It is a crown that binds men to their promises once they are made; I shall wear it and swear to never attack your people again. You can trust me!'"
 me_zorgoomni.22.a: "Kill all of the goblins"
 me_zorgoomni.22.b: "Accept the gift of the Crown and let them leave"
 me_zorgoomni.22_tooltip: "#Y We will decide the fate of the defeated goblin leader.#!"
 treasure_goblin_crown_of_oaths: "Crown of Oaths"
 treasure_goblin_crown_of_oaths_desc: "An artifact taken from a goblin horde deep underground, whomever wears the Crown and swears an oath is magically bound to honor their words."

 me_zorgoomni.23_title: "A Shameful Display"
 me_zorgoomni.23_desc: "Hundreds of [ROOT.GetCountry.GetAdjective] soldiers fell in the disorganized retreat to the surface of [cavern_location.GetName|Y], and [ROOT.GetCountry.GetRuler.GetName|Y] suffered an injury [ROOT.GetCountry.GetRuler.GetHerHim]self that was painful and embarrassing; an arrow in the groin.\n\nStill, most of the men managed to make it out of the caverns alive, and as the small group of survivors gathered around [ROOT.GetCountry.GetRuler.GetFirstName|Y], the [ROOT.GetCountry.GetRulerTitle] called for a healer and grimaced in pain as a surgeon examined the wound."
 me_zorgoomni.23.a: "We are lucky to have escaped with our lives"
 
 me_zorgoomni.24_title: "Dying In Disgrace"
 me_zorgoomni.24_desc: "Everything was pure chaos in the caverns; [ROOT.GetCountry.GetRuler.GetName|Y], [ROOT.GetCountry.GetRuler.GetHerHis] face pouring sweat, was stumbling in the dark, tripping over the mangled corpses of fallen [ROOT.GetCountry.GetAdjective] warriors. The air was filled with the hellish sound of tens of thousands of goblins screaming rabidly and the cries of dying men, and as the yelps and howls drew closer and closer, [ROOT.GetCountry.GetRuler.GetFirstName|Y] threw down [ROOT.GetCountry.GetRuler.GetHerHis] sword and ran as fast as [ROOT.GetCountry.GetRuler.GetSheHe] could, wiping the stinging sweat out of [ROOT.GetCountry.GetRuler.GetHerHis] eyes.\n\nMere seconds later, a spear struck [ROOT.GetCountry.GetRuler.GetFirstName|Y] in the back, and as the [ROOT.GetCountry.GetRulerTitle] tumbled to [ROOT.GetCountry.GetRuler.GetHerHis] knees in agony, [ROOT.GetCountry.GetRuler.GetSheHe] was filled with dozens of arrows before [ROOT.GetCountry.GetRuler.GetSheHe] even hit the ground."
 me_zorgoomni.24.a: "This can't be how it all ends..."
 
 me_zorgoomni.25_title: "Gift From The Victory Goddess"
 me_zorgoomni.25_desc: "The #G Victory Goddess#! is pleased by the efforts of [ROOT.GetCountry.GetRuler.GetName|Y] to bring glory to the people of [ROOT.GetCountry.GetName|T] through glorious combat on the battlefield, and has revealed through omens that a period of growth and stability will take place in the days to come."
 me_zorgoomni.25.a: "May our swords be worthy of these gifts"

 me_zorgoomni.26_title: "Magical Experiments Gone Awry"
 me_zorgoomni.26_desc: "My [ROOT.GetCountry.GetRulerTitle], a mage living in [ROOT.GetCountry.GetCapital.GetName|G] has been conducting unsanctioned magical experiments for some time, but this wizard, a man named [SCOPE.sCharacter('random_mage').GetName|Y], has gone too far.\n\nA loud explosion within [SCOPE.sCharacter('random_mage').GetFirstName|Y]'s laboratory was the first clue that something had gone dreadfully wrong, and as purple storm clouds gathered over the [ROOT.GetCountry.GetAdjective] capital, the frightened mage rushed down to the palace to explain himself.\n\nBy the time the wizard arrived at the citadel, the streets were filled with terrified bystanders. Raising his hands and shouting loudly, [SCOPE.sCharacter('random_mage').GetFirstName|Y] promised that nothing bad would happen to [ROOT.GetCountry.GetName|T], but this magical storm would last for about one year!"
 me_zorgoomni.26.a: "Send out messengers proclaming that this storm is intentional!"
 me_zorgoomni.26.b: "Ignore the entire scenario as best as we can" 
 me_zorgoomni.26.c: "Banish the perpetrator to a distant country"

 me_zorgoomni.27_title: "Ascendic Arrivals"
 me_zorgoomni.27_desc: "As news of the continued successes of [ROOT.GetCountry.GetRuler.GetName|Y] travel far and wide, more and more of our kinsmen from abroad are traveling to [ROOT.GetCountry.GetCapital.GetName|G] in order to start their lives anew in the [ROOT.GetCountry.GetAdjective] capital.\n\nOur #T Ascendic#! brethren have hopes of making their fortunes within our realm, and no one can deny that there are many opportunities awaiting the bold within our borders. Without the leadership of [ROOT.GetCountry.GetRuler.GetFirstName|Y], none of this would have been possible."
 me_zorgoomni.27.a: "It is my hope that more colonists sail to our shores"
 
 me_zorgoomni.28_title: "Lost Slave Ships"
 me_zorgoomni.28_desc: "This morning, we received reports that a battered convoy of four #Y High Elven#! ships was seen limping up the coast. When the sailors saw our scouts, they began to wave frantically and pulled up to the shore, dropping their anchors close to the beaches.\n\nIt seems that these four vessels are all that remain of a mighty fleet of slave ships that left the port of [GetProvince('(int32)1877').GetName|G] over two years ago. At first, the gods were with them, and they sailed up the eastern coast of #G Luxterra#!, even raiding as far as the city of [GetProvince('(int32)1331').GetName|G], but then a series of storms broke up their armada and sent many of the ships to the bottom of the #G Norrallani Sea#!. It was then that a massive fleet from [GetProvince('(int32)2548').GetName|G] pursued them, destroying many of the survivors, and it is by the grace of [GetDeityDefinition('omen_cizotz').GetName|Y] that any of the #Y High Elves#! survived.\n\nAdmitting that they are terribly lost, the sailors asked that their kinsmen living within [ROOT.GetCountry.GetName|T] help them to return back home - they have no supplies and are on their last legs."
 me_zorgoomni.28.a: "Give them gifts of money and maps and send them on their way"
 me_zorgoomni.28.b: "Offer to buy their cargo at a fair price"
 me_zorgoomni.28.c: "Attack the ships and steal everything they have!"

 me_zorgoomni.29_title: "Ascendic Aid For Arteon"
 me_zorgoomni.29_desc: "There are many reports flowing into [ROOT.GetCountry.GetCapital.GetName|G] of wars abroad, and they are not all good; the #Y High Elven#! colonies on the island of #Y Arteon#! have sent out a call for aid, begging for soldiers and manpower to be sent to the front. By all accounts, their efforts to conquer the island are failing, and the news brought by the trade ships is dire. After many months, the proud city of [GetProvince('(int32)662').GetName|G] has fallen to a savage horde, and this has caused great consternation throughout [ROOT.GetCountry.GetName|T].\n\nA group of noblemen living within the capital have vowed to travel to #Y Arteon#!, swearing oaths that they will give their lives to retake what has been lost, and some of our levies are gearing up to leave alongside them."
 me_zorgoomni.29.a: "These valiant warriors leave with our blessing!"
 me_zorgoomni.29.b: "Forbid anyone from joining the lost cause for Saousvad'E"

 me_zorgoomni.30_title: "The Dissolved Lands"
 me_zorgoomni.30_desc: "We have discovered that there are sailors from [ROOT.GetCountry.GetName|T] that have defied common sense and have made some clandestine landings on the #G Dissolved Lands#! in the center of the #G Norrallani Sea#!.\n\nAlthough there are dozens of [ROOT.GetCountry.GetAdjective] folk tales and myths that describe the horrors awaiting those foolish enough to visit the cursed islands, some of our countrymen are unafraid of these 'grandmother's fables' and a few very brave souls have landed on the coast. There are reports of abandoned cities filled with unimagined wonders, and some of our explorers claim to have seen artifacts there that predate the #Y Great Collapse#!.\n\nMany living within [ROOT.GetCountry.GetCapital.GetName|G] have condemned these treasure seekers, believing that they will bring untold calamities upon our people, and there is pressure for [ROOT.GetCountry.GetRuler.GetName|Y] to do something about these fools."
 me_zorgoomni.30.a: "As long as we get our cut of the treasure, I care not what they do"
 me_zorgoomni.30.b: "Any High Elves that land on the island shall be put to death"

omniluxia_nomadic_raid: "Go Raiding"
omniluxia_nomadic_raid_act: "Our Ruler will lead a party of warriors on a daring raid!"
is_on_omni_nomadic_raid_tt: "Has not gone on a raid in the last ten years."
omniluxia_joust: "Hold A Royal Tournament"
omniluxia_joust_act: "Pay the costs to announce a royal tournament at the capital."
omniluxia_vampire: "Vampiric Feeding"
omniluxia_vampire_act: "Our Ruler will answer the dark call of the Bloodthirst..."
omniluxia_nomadic_raid_select_title: "Selet a Target For the Raid"

 me_zorgoomni.31_title: "A Raid On Our Neighbors"
 me_zorgoomni.31_desc: "[ROOT.GetCountry.GetRuler.GetName|Y] has heard the call of glory and wants to personally lead some of our warriors on a raid into the lands of our enemies. The omens have spoken clearly, and [aggressive_neighbor.GetName|Y] would be an easy target for our men to despoil - we have nothing to fear!"
 me_zorgoomni.31.a: "The time has come to teach [aggressive_neighbor.GetName] a lesson"
 me_zorgoomni.31.b: "On second thought, I do not have time for this"
 me_zorgoomni.31_tooltip1: "#Y Our Ruler will leave with our raiders immediately!#!"
 me_zorgoomni.31_tooltip2: "#Y This will end the current event chain.#!"

 me_zorgoomni.32_title: "The Raid Into [aggressive_neighbor.GetName]"
 me_zorgoomni.32_desc_1: "The gods were with [ROOT.GetCountry.GetRuler.GetName|Y] when [ROOT.GetCountry.GetRuler.GetSheHe] lead the raiding party into [aggressive_neighbor.GetName|Y], for the [ROOT.GetCountry.GetAdjective] warriors were able to slip pass the [aggressive_neighbor.GetAdjective] border guards undetected. Our raiders were able to plunder many small towns and villages without any resistance from an organized force, and our men stole as much gold and silver from the people of [aggressive_neighbor.GetName|Y] as they could carry.\n\nStores of grain, religious statues carved out of ivory and silver, luxurious furs, and even horses and slaves were taken as prizes - anything that was not taken away was set to the torch. [ROOT.GetCountry.GetRuler.GetFirstName|Y] returned home to [ROOT.GetCountry.GetCapital.GetName|G] at the head of a triumphant party that had tripled in size, [ROOT.GetCountry.GetRuler.GetHerHis] saddlebags filled to bursting with all manner of ill-gotten gains."
 me_zorgoomni.32_desc_2: "[ROOT.GetCountry.GetRuler.GetName|Y] was able to lead the raiders from [ROOT.GetCountry.GetCapital.GetName|G] into the hinterlands of [aggressive_neighbor.GetName|Y] without encountering any major resistance - the few unlucky border guards that crossed our paths were quickly sent to whatever gods they believed in.\n\nThe raid itself was quick and methodical, and our warriors wasted no time in spreading out and setting farms and towns to the torch. Civilians were struck down in the streets of their villages, and our soldiers carried off as much wealth as they could carry."
 me_zorgoomni.32_desc_3: "Our warriors were able to avoid the border guards of [aggressive_neighbor.GetName|Y] without any problems and soon found themselves on the outskirts of a small but wealthy village - the buildings were made of brick and there were religious shrines made of marble in the center of a humble square.\n\nBy the time that the [aggressive_neighbor.GetAdjective] guards had any idea that their towns were being raided, our soldiers were already crossing back into [ROOT.GetCountry.GetName|T], having killed any in our way that would have raised an alarm."
 me_zorgoomni.32_desc_4: "Although we did not encounter any [aggressive_neighbor.GetAdjective] levies on our raid, our warriors did not find as much treasure as they had hoped for - the region seemed to be devoid of all wealth, picked over like a carcass on the steppe. [ROOT.GetCountry.GetRuler.GetFirstName|Y] was a little disappointed in the results of the raid, but none of our [ROOT.GetCountry.GetAdjective] kinsmen were hurt or injured and we were able to steal from a few small farms."
 me_zorgoomni.32_desc_5: "Our warriors were able to raid a few tiny farms on the border between [ROOT.GetCountry.GetName|T] and [aggressive_neighbor.GetName|Y], but the unexpected arrival of [aggressive_neighbor.GetAdjective] levies caused [ROOT.GetCountry.GetRuler.GetName|Y] to call for a full retreat - the [ROOT.GetCountry.GetRulerTitle] could not afford to lose any experienced soldiers, and the men had taken enough to satisfy themselves."
 me_zorgoomni.32_desc_6: "A few hours after [ROOT.GetCountry.GetRuler.GetName|Y] left [ROOT.GetCountry.GetCapital.GetName|G] at the head of a raiding party, the weather had turned sour; a blistering rain storm appeared out of nowhere and refused to let up in its assault. Moods immediately darkened and travel became a miserable endeavor, and when it became apparent that it was only going to continue to get worse, everyone decided they would just rather go back to [ROOT.GetCountry.GetName|T]."
 me_zorgoomni.32_desc_7: "Unfortunately for the raiders, they were not able to loot the countryside, for almost immediately upon crossing into [aggressive_neighbor.GetName|Y], [ROOT.GetCountry.GetRuler.GetName|Y] and [ROOT.GetCountry.GetRuler.GetHerHis] men were attacked by ferocious [aggressive_neighbor.GetAdjective] soldiers on horseback.\n\nThankfully for [ROOT.GetCountry.GetName|T], [ROOT.GetCountry.GetRuler.GetFirstName|Y] prevailed in this desperate battle thanks to personal feats of glory - the [ROOT.GetCountry.GetRulerTitle] killed three times as many as all others, causing many to look at [ROOT.GetCountry.GetRuler.GetFirstName|Y] in awe."
 me_zorgoomni.32_desc_8: "The gods were not with [ROOT.GetCountry.GetRuler.GetName|Y] and [ROOT.GetCountry.GetRuler.GetHerHis] raiders, for a large group of [aggressive_neighbor.GetAdjective] soldiers set upon the [ROOT.GetCountry.GetRulerTitle] as soon as the [ROOT.GetCountry.GetAdjective] soldiers crossed the border.\n\nDozens of our men fell within seconds, pierced by countless arrows, and [ROOT.GetCountry.GetRuler.GetFirstName|Y] was shot in the thigh - a painful wound that made it difficult for [ROOT.GetCountry.GetRuler.GetHerHim] to ride and fight.\n\n[ROOT.GetCountry.GetRuler.GetFirstName|Y] was separated from the riders by the enemy, but was able to eventually cross back into [ROOT.GetCountry.GetName|T] with [ROOT.GetCountry.GetRuler.GetHerHis] life - something that not all of [ROOT.GetCountry.GetRuler.GetHerHis] companions could say."
 me_zorgoomni.32_desc_9: "In a disaster for [ROOT.GetCountry.GetName|T], [ROOT.GetCountry.GetRuler.GetName|Y] and [ROOT.GetCountry.GetRuler.GetHerHis] raiders were attacked by a large force of [aggressive_neighbor.GetAdjective] guards, who slew many of our countrymen and took our [ROOT.GetCountry.GetRulerTitle] prisoner.\n\nWhen the identity of [ROOT.GetCountry.GetRuler.GetFirstName|Y] was discovered, the soldiers of [aggressive_neighbor.GetName|Y] beat [ROOT.GetCountry.GetRuler.GetHerHim] with a savage cruelty that nearly ended [ROOT.GetCountry.GetRuler.GetHerHis] life, and it was only with gold and promises that [ROOT.GetCountry.GetRuler.GetFirstName|Y] was released alive."
 me_zorgoomni.32_desc_10: "At first, it seemed that the raiders under [ROOT.GetCountry.GetRuler.GetName|Y]'s lead had managed to slip across the border between [ROOT.GetCountry.GetName|T] and [aggressive_neighbor.GetName|Y] without being seen, but a couple of hours later, the [ROOT.GetCountry.GetAdjective] warriors found themselves in a trap. The road narrowed down to meet a small bridge at the edge of a stream, and it was here that the [aggressive_neighbor.GetAdjective] launched an ambush that forced the [ROOT.GetCountry.GetAdjective] raiders down into the water.\n\nAs dozens of arrows whizzed past [ROOT.GetCountry.GetRuler.GetHerHis] head, [ROOT.GetCountry.GetRuler.GetFirstName|Y] felt an overwhelming fear take ahold of [ROOT.GetCountry.GetRuler.GetHerHim], a paralyzing stupor that made [ROOT.GetCountry.GetRuler.GetHerHis] limbs freeze up; I'm about to die.\n\nWhen the end came, it was brutal."
 me_zorgoomni.32.a: "All hail the masterful raider [ROOT.GetCountry.GetRuler.GetName]!"
 me_zorgoomni.32.b: "Another victory for [ROOT.GetCountry.GetName]!"
 me_zorgoomni.32.c: "We are untouchable!"
 me_zorgoomni.32.d: "It was fun getting out of [ROOT.GetCountry.GetCapital.GetName] for a while"
 me_zorgoomni.32.e: "There is no need for a pitched battle - return to [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.32.f: "What a cursed waste of time!"
 me_zorgoomni.32.g: "[ROOT.GetCountry.GetRuler.GetFirstName] is truly a skilled fighter!"
 me_zorgoomni.32.h: "It was a mistake to leave [ROOT.GetCountry.GetCapital.GetName]"
 me_zorgoomni.32.i: "I am lucky to have survived, but I don't feel very lucky..."
 me_zorgoomni.32.j: "What an absolute disaster for [ROOT.GetCountry.GetName]!"
 me_zorgoomni.32.k: "A modest haul, but a haul nonetheless - back to [ROOT.GetCountry.GetCapital.GetName] with the spoils!"
 me_zorgoomni.32.l: "We return victorious, though not unscathed - [ROOT.GetCountry.GetRuler.GetFirstName] bears the wounds of battle."
 me_zorgoomni.32.m: "A small victory, paid for in blood."
 me_zorgoomni.32.n: "We return with plunder, but [ROOT.GetCountry.GetRuler.GetFirstName] will carry the scars of this raid forever."
 me_zorgoomni.32.o: "[ROOT.GetCountry.GetRuler.GetFirstName] lost an eye in the fighting, but lives to tell the tale."
 me_zorgoomni.32.p: "A bloody, brutal affair - but it has only made [ROOT.GetCountry.GetRuler.GetFirstName] hungrier for glory!"
 me_zorgoomni.32.q: "[ROOT.GetCountry.GetRuler.GetFirstName] fought bravely, whatever the cost."
 me_zorgoomni.32.r: "A shameful retreat - the people of [ROOT.GetCountry.GetName] will not soon forget [ROOT.GetCountry.GetRuler.GetHerHis] cowardice."
 me_zorgoomni.32.s: "[ROOT.GetCountry.GetRuler.GetFirstName] proved a capable commander in the field."
 me_zorgoomni.32.t: "A tragic end - [ROOT.GetCountry.GetRuler.GetFirstName] has fallen in battle."
 me_zorgoomni.32_tooltip: "#Y This will end the current event chain.#!"

 me_zorgoomni.33_title: "Cross Border Raid"
 me_zorgoomni.33_desc: "My [ROOT.GetCountry.GetRulerTitle], we have terrible news to report from the [raided_settlement.GetName|Y] settlement. Last night, a cohort of warriors from [nomadic_raid_country.GetName|Y] slipped across our border and launched a surprise raid on the unsuspecting locals. It is known that the [nomadic_raid_country.GetAdjective] raiders killed some of our people and plundered their land, carting off whatever they could carry and burning everything that they could not.\n\nYou should know that these bandits were personally led by [nomadic_raid_country.GetRuler.GetName|Y] in a brazen sign of disrespect to the people of [ROOT.GetCountry.GetName|T]."
 me_zorgoomni.33.a: "What! This is practically a declaration of war!"

 me_zorgoomni.34_title: "Orcish Raiders On The Coasts"
 me_zorgoomni.34_desc: "My [ROOT.GetCountry.GetRulerTitle], we have heard rumors that #Y Orcish#! raiders from the island of #G Rendun#! have been seen sailing in the #G Morrigan Sea#!. Normally, these cruel slavers limit their attacks to the eastern coasts of the #Y Rohanoan Peninsula#!, but it appears that they are expanding their presence to distant waters."
 me_zorgoomni.34.a: "Keep an eye out for the Orcish scum - if they want blood, they'll get it!"
 me_zorgoomni.34_tooltip: "#Y This will end the current event chain.#!"

 me_zorgoomni.35_title: "Festival Of [GetDeityDefinition('omen_ugone').GetName]"
 me_zorgoomni.35_desc: "Every generation, the citizens of the city of [GetProvince('(int32)2509').GetName|G] hold the famous #Y Festival of#! [GetDeityDefinition('omen_ugone').GetName|Y], in which the #Y God of Closed Doors#! is worshiped by those seeking his protection for an entire year. Ironically, the gates to the city are opened for this event, and pilgrims from all across the #Y Rohanoan Peninsula#! make the journey to the holy shrine where the magnificent statue of Ugone resides.\n\nOfferings from the field are made before the altar; gifts of honey-cakes, libations of sweet #Y Celtican#! wine and heads of ripened grain, and, as always, prayers for a successful harvest.\n\nSome of the priests in charge of the Festival have approached [ROOT.GetCountry.GetRuler.GetName|Y] to ask for a donative from the state, and [SCOPE.sCharacter('random_priest').GetName|Y] promises that the rewards of Ugone will be made manifest in the days to come."
 me_zorgoomni.35.a: "Give [SCOPE.sCharacter('random_priest').GetFirstName] what [SCOPE.sCharacter('random_priest').GetSheHe] asks for"
 me_zorgoomni.35.b: "[ROOT.GetCountry.GetCapital.GetName] does not have the gold"
 me_zorgoomni.35.c: "I shall pay the amount and set aside funds for the next Festival"
 me_zorgoomni.35_tooltip1: "#Y In ten years, the#! #T Festival of Ugone#! #Y will be held again.#!"
 festival_of_ugone_zorgo_mod: "Festival of Ugone"
 desc_festival_of_ugone_zorgo_mod: "Our country is currently celebrating a festival for Ugone, #Y God of Closed Doors#!."
 festival_of_khewer_zorgo_mod: "Festival of Khewer"
 desc_festival_of_khewer_zorgo_mod: "Our country is currently celebrating the rise of #Y Ketep#! and the #G Pharon#!'s proclamation of divinity."

 me_zorgoomni.36_title: "Patreic Prosperity"
 me_zorgoomni.36_desc: "One can see from the many foreign visitors to [ROOT.GetCountry.GetCapital.GetName|G] that the people of [ROOT.GetCountry.GetName|T] are known far and wide for their prosperous civilization. Our merchants have never been happier, and the taxes that are taken from the rich citizens living within the capital have exceeded our expectations by a decent amount this year. [ROOT.GetCountry.GetRuler.GetName|Y] has publicly called for sacrifices to be made to the Patreic pantheon, for the hand of the gods is clearly behind our recent string of good luck."
 me_zorgoomni.36.a: "We must remember the gods in all that we do"
 
 me_zorgoomni.37_title: "The Rare Gift Of Peaceful Times"
 me_zorgoomni.37_desc: "While there have certainly been years, if not decades, where war has gripped the #Y Rohanoan Peninsula#!, for now, a period of relative calm has settled over the land of [ROOT.GetCountry.GetName|T], much to the people's delight.\n\nEverywhere one travels, the locals give thanks to the gods for the [ROOT.GetCountry.GetRulerTitle], believing that [ROOT.GetCountry.GetRuler.GetName|Y] is personally responsible for putting an end to the period of strife."
 me_zorgoomni.37.a: "War will inevitably return to [ROOT.GetCountry.GetName], but we enjoy peace while we can"
 
 me_zorgoomni.38_title: "Bumper Crop"
 me_zorgoomni.38_desc: "The #Y Rohanoan Peninsula#! already enjoys relatively large harvests every year, but this year has been one for the record keepers; our farmers have more produce than they know what they do with. To celebrate the bountiful gifts of the gods, [ROOT.GetCountry.GetRuler.GetName|Y] has declared a period of public holiday and feasting throughout [ROOT.GetCountry.GetName|T]."
 me_zorgoomni.38.a: "May everyone living within the realm eat to their heart's content!"

 me_zorgoomni.39_title: "Soldiers Of Fortune"
 me_zorgoomni.39_desc: "Word has spread throughout [ROOT.GetCountry.GetName|T] of the need for soldiers in foreign lands, and because we are enjoying a period of relative calm, some of our levies have made their way for the coastal cities in hopes of joining mercenary companies. Some of these soldiers of fortune will head north to #Y Arteon#!, and some will even travel to #G Luxterra#!, where the great Empires always have need of fighting men.\n\nSome of our military advisors have quietly complained to [ROOT.GetCountry.GetRuler.GetName|Y], however, claiming that allowing our kinsmen to become sellswords abroad is weakening our position at home."
 me_zorgoomni.39.a: "[ROOT.GetCountry.GetName] is a country of free men that do as they please"
 me_zorgoomni.39.b: "Forbid our countrymen from fighting in foreign wars"

 me_zorgoomni.40_title: "The Warlock"
 me_zorgoomni.40_desc: "Yesterday, a traveler of some renown named [SCOPE.sCharacter('random_warlock').GetName|Y] arrived in [ROOT.GetCountry.GetCapital.GetName|G] with letters of recommendation and a desire for a personal meeting with [ROOT.GetCountry.GetRuler.GetName|Y].\n\nPresenting himself before the [ROOT.GetCountry.GetRulerTitle], [SCOPE.sCharacter('random_warlock').GetFirstName|Y] shared the curious tale of his life; originally from the eastern coast of #G Luxterra#!, he escaped a life of obscurity as a simple farmer by seeking his fortune in the city of [GetProvince('(int32)1849').GetName|G]. It was there that he found employment as a bodyguard working for one of the #Y Stellaric Guildhouses#!, and after a few years of service aboard a trade ship, he decided to stay in [GetProvince('(int32)653').GetName|G] in order to join a mercenary company fighting in #Y Arteon#!. While campaigning on the island, [SCOPE.sCharacter('random_warlock').GetFirstName|Y] saved the life of an #Y Ascendic Mage#! that agreed to teach the young man about the arcane arts, and the Master and Servant sailed for the [GetCountry('WGA').GetName|T] in order to search for an ancient manuscript in the libraries at [GetProvince('(int32)2720').GetName|G].\n\nSo why is he now in [ROOT.GetCountry.GetName|T]? His #G Elven#! master was eventually arrested under suspicions of being a foreign spy, and [SCOPE.sCharacter('random_warlock').GetFirstName|Y] decided to leave the country before the Imperial authorities decided to look for him. Having completed his magical studies and now a feared #Y Warlock#!, [SCOPE.sCharacter('random_warlock').GetFirstName|Y] is in need of a new patron, and would love to fight for the [ROOT.GetCountry.GetAdjective] people. The only question that remains is whether or not [ROOT.GetCountry.GetRuler.GetFirstName|Y] will pay [SCOPE.sCharacter('random_warlock').GetFirstName|Y] the stipend that the mage requested."
 me_zorgoomni.40.a: "Welcome to your new home, [SCOPE.sCharacter('random_warlock').GetFirstName]"
 me_zorgoomni.40.b: "We cannot afford to procure this mage's service"

 me_zorgoomni.41_title: "Constructing A Guildhouse"
 me_zorgoomni.41_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], it has been suggested by some of the merchants living within [GetProvince('(int32)1849').GetName|G] that the generous [ROOT.GetCountry.GetRulerTitle] of the [ROOT.GetCountry.GetName|T] should build a #Y Guildhouse#! in the capital city of [receptive_guildhouse_neighbor.GetName|Y], [receptive_guildhouse_neighbor.GetCapital.GetName|G].\n\nWe have sent messages to their [receptive_guildhouse_neighbor.GetRulerTitle] [receptive_guildhouse_neighbor.GetRuler.GetName|Y], and the [receptive_guildhouse_neighbor.GetAdjective] are receptive to the idea, for they wish to grow the trade connections between our people. The final decision will remain with [ROOT.GetCountry.GetRuler.GetFirstName|Y], however."
 me_zorgoomni.41.a: "It is my pleasure to open a new Guildhouse abroad"
 me_zorgoomni.41.b: "Unfortunately, the [ROOT.GetCountry.GetName] will be unable to do this"

 me_zorgoomni.42_title: "A Stellaric Guildhouse"
 me_zorgoomni.42_desc: "My [ROOT.GetCountry.GetRulerTitle], as our economic connections with the wider world have grown alongside our prestige, a group of foreign merchants from the [stellaric_mother_country.GetName|Y] have built a #Y Stellaric Guildhouse#! within central [ROOT.GetCountry.GetCapital.GetName|G]. These powerful #T Stellaric#! merchants are known for many things, including their control of trade throughout eastern #G Luxterra#!, and the fact that they deem our capital to be worthy of maintaining a #Y Guildhouse#! in is an honor that we should not fail to see.\n\nAs a thank you for allowing them within our lands, they have sent us a gift and the promise of friendly relations."
 me_zorgoomni.42.a: "It is my hope that we continue to prosper together"
 me_zorgoomni.42.b: "What...I did not authorize this - tear down their buildings!"

 me_zorgoomni.43_title: "The Royal Tournament Of [ROOT.GetCountry.GetName]"
 me_zorgoomni.43_desc: "Now that a period of peace has settled throughout [ROOT.GetCountry.GetName|T], [ROOT.GetCountry.GetRuler.GetName|Y] has called for the knights of the realm to assemble at the capital in order to demonstrate their prowess through strength of arms. Riders have been sent forth throughout the land to announce the #Y Grand Tournament#! that is to be held at [ROOT.GetCountry.GetCapital.GetName|G] in one month, and the event promises to be the talk of the town for years to come.\n\nIn a demonstration of royal largesse, [ROOT.GetCountry.GetRuler.GetFirstName|Y] has set aside as substantial sum for the winner of the event as a prize, and hundreds of equestrians have set out for the capital in hopes of obtaining this fortune for themselves."
 me_zorgoomni.43.a: "Let the games begin!"
 me_zorgoomni.43.b: "On second thought, I cannot afford to do this right now"
 me_zorgoomni.43_tooltip1: "#Y We will hold a#! #T Tournament#! #Y in one month.#!"
 me_zorgoomni.43_tooltip2: "#Y This will end the current event chain.#!"
 tournament_in_capital_mod: "Royal Tournament"
 desc_tournament_in_capital_mod: "There is a tournament taking place here, and the locals are celebrating the year-long festivities."

 me_zorgoomni.44_title: "The Royal Tournament Of [ROOT.GetCountry.GetName]"
 me_zorgoomni.44_desc_1: "Although [ROOT.GetCountry.GetRuler.GetName|Y] had not prepared for the joust in any way, [ROOT.GetCountry.GetRuler.GetSheHe] managed to do better than most - the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] unseated a few opponents, sending the crowds into a frenzy. Realizing that [ROOT.GetCountry.GetRuler.GetSheHe] better quit while [ROOT.GetCountry.GetRuler.GetSheHe] was ahead, [ROOT.GetCountry.GetRuler.GetFirstName|Y] took the opportunity to address the gathered masses.\n\nAfter thanking everyone for attending the #T Tournament#!, [ROOT.GetCountry.GetRuler.GetFirstName|Y] again thanked the people for the honor of allowing their [ROOT.GetCountry.GetRulerTitle] to compete in the event, but announced that [ROOT.GetCountry.GetRuler.GetSheHe] was finished for the day. Upon saying this, a cheer went through the throng, one echoed by thousands of voices."
 me_zorgoomni.44_desc_2: "The joust was fairly uneventful for [ROOT.GetCountry.GetRuler.GetName|Y], for once it became clear that the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] was going to actually compete in the event, none of the other knights present were willing to raise their lances against [ROOT.GetCountry.GetRuler.GetHerHim] - no one wanted to accidentally cause an injury, lest they be held accountable.\n\nDespite this disappointment, [ROOT.GetCountry.GetRuler.GetFirstName|Y] continued to ride around the arena astride a magnificent warhorse, waving to the crowds and throwing handfuls of silver coins into the masses. Never one to waste an opportunity, [ROOT.GetCountry.GetRuler.GetSheHe] decided to make the most of the moment."
 me_zorgoomni.44_desc_3: "Much to everyone's surprise - especially [ROOT.GetCountry.GetRuler.GetName|Y] - the [ROOT.GetCountry.GetRulerTitle] somehow managed to win the jousting event. In a dazzling display of brilliance, [ROOT.GetCountry.GetRuler.GetFirstName|Y] unseated the three champions from their horses, one by one; [SCOPE.sCharacter('random_jouster_1').GetName|Y], [SCOPE.sCharacter('random_jouster_2').GetName|Y], and [SCOPE.sCharacter('random_jouster_3').GetName|Y], the greatest riders within #Y Rohenevia#!, were knocked to ground. [ROOT.GetCountry.GetRuler.GetFirstName|Y] was hailed victor and paraded before thousands of adoring fans.\n\nAlthough [ROOT.GetCountry.GetRuler.GetFirstName|Y] made a show of not accepting the prize, the crowds insisted that [ROOT.GetCountry.GetRuler.GetSheHe] keep the gold coins. A compromise was reached when [ROOT.GetCountry.GetRuler.GetFirstName|Y] graciously agreed to donate the sum to treasuries of [ROOT.GetCountry.GetName|T]."
 me_zorgoomni.44_desc_4: "Although [ROOT.GetCountry.GetRuler.GetName|Y] did not win any accolades at the joust, [ROOT.GetCountry.GetRuler.GetSheHe] did not embarrass [ROOT.GetCountry.GetRuler.GetHerHim]self either, and the people were pleased to see the [ROOT.GetCountry.GetRulerTitle] honor the traditions of the [ROOT.GetCountry.GetAdjective]s by riding against an opponent.\n\nDespite not wanting to participate, in the end, [ROOT.GetCountry.GetRuler.GetFirstName|Y] had fun and was secretly wishing that [ROOT.GetCountry.GetRuler.GetSheHe] could joust again."
 me_zorgoomni.44_desc_5: "[ROOT.GetCountry.GetRuler.GetName|Y] managed to knock down two jousters before being unseated [ROOT.GetCountry.GetRuler.GetHerHim]self, and although [ROOT.GetCountry.GetRuler.GetFirstName|Y] was disappointed by the turn of events, the people were pleased to see the [ROOT.GetCountry.GetRulerTitle] do well and praised [ROOT.GetCountry.GetRuler.GetHerHis] name.\n\nAlthough [ROOT.GetCountry.GetRuler.GetFirstName|Y] was a little bruised when [ROOT.GetCountry.GetRuler.GetSheHe] returned to [ROOT.GetCountry.GetRuler.GetHerHis] seat, the applause that greeted [ROOT.GetCountry.GetRuler.GetHerHim] lasted for an obscenely long time, embarrassing [ROOT.GetCountry.GetRuler.GetHerHim] but also warming [ROOT.GetCountry.GetRuler.GetHerHis] heart."
 me_zorgoomni.44_desc_6: "At the end of the day, [ROOT.GetCountry.GetRuler.GetName|Y] did not win the competition, but [ROOT.GetCountry.GetRuler.GetSheHe] came quite close to beating the reigning champion, the pompous [SCOPE.sCharacter('random_jouster_1').GetName|Y] who is known all throughout #G Morrigon#! as being an aggressive jouster.\n\nBoth [SCOPE.sCharacter('random_jouster_1').GetFirstName|Y] and [ROOT.GetCountry.GetRuler.GetFirstName|Y] were knocked to the ground by the initial charge, and the two warriors drew their swords and fought on the race track, neither willing to yield. Somehow, [SCOPE.sCharacter('random_jouster_1').GetFirstName|Y] seized the advantage and managed to disarm [ROOT.GetCountry.GetRuler.GetFirstName|Y], who was forced to surrender to the howling cheers of the crowds."
 me_zorgoomni.44_desc_7: "Unfortunately, [ROOT.GetCountry.GetRuler.GetName|Y] did not do very well in the joust and was unseated almost immediately, with raucous laughter from the crowds filling the air. [ROOT.GetCountry.GetRuler.GetFirstName|Y] was able to laugh the entire incident off, however, and happily returned to [ROOT.GetCountry.GetRuler.GetHerHis] seat, watching the rest of the event pass by in a pleasant mood."
 me_zorgoomni.44_desc_8: "[ROOT.GetCountry.GetRuler.GetName|Y] is not quite sure what happened; one moment, [ROOT.GetCountry.GetRuler.GetSheHe] was mounting a warhorse, and the next, [ROOT.GetCountry.GetRuler.GetSheHe] was on the ground, being attended to by three very worried clerics.\n\nAlthough the details were particularly difficult for [ROOT.GetCountry.GetRuler.GetFirstName|Y] to understand in that moment, [ROOT.GetCountry.GetRuler.GetSheHe] understood that [SCOPE.sCharacter('random_jouster_1').GetName|Y] had knocked [ROOT.GetCountry.GetRuler.GetHerHim] off of [ROOT.GetCountry.GetRuler.GetHerHis] horse, and that [ROOT.GetCountry.GetRuler.GetSheHe] had taken a very nasty fall onto the ground."
 me_zorgoomni.44_desc_9: "When the two jousters met, [SCOPE.sCharacter('random_jouster_2').GetName|Y] managed to knock [ROOT.GetCountry.GetRuler.GetName|Y] off of [ROOT.GetCountry.GetRuler.GetHerHis] horse, sending the [ROOT.GetCountry.GetRulerTitle] tumbling to the ground to the sound of laughter from the crowds. Infuriated by their derision, [ROOT.GetCountry.GetRuler.GetFirstName|Y] drew [ROOT.GetCountry.GetRuler.GetHerHis] sword and charged [SCOPE.sCharacter('random_jouster_2').GetFirstName|Y].\n\nThe combat that took place between the two warriors would become the stuff of legend, immortalized in folk songs and recounted in at least two historical works from this time period. In the end, [ROOT.GetCountry.GetRuler.GetFirstName|Y] would savagely remove the head of [SCOPE.sCharacter('random_jouster_2').GetFirstName|Y], earning the acclaim of the bloodthirsty crowds but nearly dying in the process.\n\nAs a vindicated [ROOT.GetCountry.GetRuler.GetFirstName|Y] was carried away to the tent where the clerics were waiting, [ROOT.GetCountry.GetRuler.GetSheHe] kept mumbling through a mouthful of broken and bloody teeth the same phrase, over and over."
 me_zorgoomni.44_desc_10: "The sun was high in the sky as [ROOT.GetCountry.GetRuler.GetName|Y] took [ROOT.GetCountry.GetRuler.GetHerHis] position in the field, and [ROOT.GetCountry.GetRuler.GetSheHe] could barely see the signal that was given for the joust to begin. A hundred paces away, [SCOPE.sCharacter('random_jouster_3').GetName|Y] was rapidly closing in, and both riders were flogging their mounts in an attempt to gain more speed. Leaning forward, [ROOT.GetCountry.GetRuler.GetFirstName|Y] grit [ROOT.GetCountry.GetRuler.GetHerHis] teeth and prepared for the impact of [SCOPE.sCharacter('random_jouster_3').GetFirstName|Y]'s lance, which promised to be painful.\n\nThere was a tremendous cracking sound as both riders met, and the [ROOT.GetCountry.GetRulerTitle] of [ROOT.GetCountry.GetName|T] was killed immediately as the lance of the #Y Aurezo#! rider shattered [ROOT.GetCountry.GetRuler.GetHerHis] helmet and plunged into [ROOT.GetCountry.GetRuler.GetHerHis] face - [ROOT.GetCountry.GetRuler.GetSheHe] was dead before [ROOT.GetCountry.GetRuler.GetHerHis] body hit the ground."
 me_zorgoomni.44.a: "All hail the masterful rider [ROOT.GetCountry.GetRuler.GetName]!"
 me_zorgoomni.44.b: "I will let the people see their [ROOT.GetCountry.GetRulerTitle]"
 me_zorgoomni.44.c: "I can't believe I won!"
 me_zorgoomni.44.d: "I look forward to the next tournament, for I have learned many things"
 me_zorgoomni.44.e: "Thank you, thank you...you are all too kind"
 me_zorgoomni.44.f: "I almost had you, [SCOPE.sCharacter('random_jouster_1').GetFirstName]...next time!"
 me_zorgoomni.44.g: "Eh, it is what it is..."
 me_zorgoomni.44.h: "'Tis but a scratch...I will be fine"
 me_zorgoomni.44.i: "I feel like I am dying...I have never felt such pain"
 me_zorgoomni.44.j: "What an absolute disaster for [ROOT.GetCountry.GetName]!"
 me_zorgoomni.44_tooltip: "#Y This will end the current event chain.#!"

 me_zorgoomni.45_title: "The Royal Tournament Of [ROOT.GetCountry.GetName]"
 me_zorgoomni.45_desc: "At long last, the day of the #Y Royal Tournament#! is finally at hand, and the excitement within [ROOT.GetCountry.GetCapital.GetName|G] is beyond description. All work is stopping for the day as the commoners shutter their homes and head for the fields outside of the capital, where thousands have already gathered to watch the unfolding festivities.\n\nThe highlight of the entire tournament is undoubtedly the #Y [ROOT.GetCountry.GetAdjective] Joust#!, where the greatest equestrians living within the #Y Rohevenian Peninsula#! will compete against each other for the chance to claim the victor's crown. The sport of jousting has long been celebrated by the Rohenoans, dating back to times before the #Y Great Collapse#!, and is taken very seriously by the people - there will be many battle-hardened warriors trying their best to win this day.\n\nAs the Lords of the realm assemble on the field, the assembled crowds began to chant the name of [ROOT.GetCountry.GetRuler.GetName|Y] - it seems that they want the [ROOT.GetCountry.GetRulerTitle] to joust alongside [ROOT.GetCountry.GetRuler.GetHerHis] knights."
 me_zorgoomni.45.a: "Of course I am going to compete!"
 me_zorgoomni.45.b: "I am here as an attendant and not a participant..."
 me_zorgoomni.45_tooltip1: "#R Jousting can be dangerous!#!\n#Y Our Ruler rides out onto the field to thunderous applause.#!"
 me_zorgoomni.45_tooltip2: "#Y This will end the current event chain.#!"

 me_zorgoomni.46_title: "The Pirates of Longones" 
 me_zorgoomni.46_desc: "My [ROOT.GetCountry.GetRulerTitle], there is something that you must know. A few months ago, #Y Polarian pirates#! from the settlement of [GetProvince('(int32)314').GetName|Y] sailed through our waters and attacked our fleets - a foolish move on their end, for our ships are faster and stronger than theirs.\n\nVowing to punish these scoundrels, our navies chased them across the #Y Northern Inter Sea#! and followed them back to their home port. Our sailors made quick work of these wretched dogs, chasing them inland and setting fire to their citadel.\n\nNow that the pirates have been destroyed, our naval commander is wondering if we have any desire to stay on #Y Polaris#!."
 me_zorgoomni.46.a: "If Elven blood was spilled, then honor demands we claim land"
 me_zorgoomni.46.b: "We do not need a foothold on Polaris - order them to return"

 me_zorgoomni.47_title: "Polarian Predicament" 
 me_zorgoomni.47_desc: "An important message from [GetProvince('(int32)314').GetName|G] has arrived in [ROOT.GetCountry.GetCapital.GetName|G] - our brethren beg for aid. The local governor says that this last winter was especially cruel, and many of our #Y Polarian#! colonists perished in the bitter cold. The lack of manpower on the island has been devastating, for there are not enough people to work in the fields during the short #Y Polarian#! harvest season.\n\nAlthough it will be expensive sending more settlers and supplies, we should consider helping our kinsmen in #G Longones#!."
 me_zorgoomni.47.a: "Do not delay - send ships with tribesmen and gold at once!"
 me_zorgoomni.47.b: "Send food and slaves immediately!"
 me_zorgoomni.47.c: "We do not have much to spare, but we will send something"
 me_zorgoomni.47.d: "[ROOT.GetCountry.GetName] has nothing to spare for the west..."

 me_zorgoomni.48_title: "The Grain of Tibula" 
 me_zorgoomni.48_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], the colony in [GetProvince('(int32)314').GetName|G] is thriving. Our settlers have learned the natural rhythms of life on #Y Polaris#!, and they have modified our [ROOT.GetCountry.GetAdjective] ways for life on the island.\n\nThe local governor reports that we have expanded our holdings to encompass the neighboring province of [GetProvince('(int32)281').GetName|G]. Grain grows in abundance on the southern coast of #Y Polaris#!, and our farmers have expanded their farms in hopes of securing enough food to last through the long winter."
 me_zorgoomni.48.a: "I am pleased to hear that our Polarian experiment is a success!"

 me_zorgoomni.49_title: "An Unwelcome Presence" 
 me_zorgoomni.49_desc: "My [ROOT.GetCountry.GetRulerTitle], we have bad news from the governor on #Y Polaris#!. The natives have taken notice of our presence on their island, and needless to say, they are very unhappy to find thriving [ROOT.GetCountry.GetAdjective] settlements in the south.\n\nThe [GetCountry('JMN').GetRulerTitle] of [GetCountry('JMN').GetName|T], [GetCountry('JMN').GetRuler.GetName|Y], is particularly incensed about this 'invasion' and has vowed to see us pushed back into the sea - they claim that we have settled on traditional #Y Jemskoo#! territories."
 me_zorgoomni.49.a: "We must keep an eye on these meddling gnomes... "

 me_zorgoomni.50_title: "Attack of the Gnomes" 
 me_zorgoomni.50_desc: "Our settlements in the west are under attack! The treacherous #Y Gnomes#! of [GetCountry('JMN').GetName|T] have assembled an army in their capital of [GetCountry('JMN').GetCapital.GetName|G] and are marching for [GetProvince('(int32)314').GetName|G].\n\nThe #Y Gnomish#! [GetCountry('JMN').GetRulerTitle] has sworn to his people that every [ROOT.GetCountry.GetAdjective] man, woman and child on #Y Polaris#! will be slaughtered - they will not rest until our colonies on #Y Polaris#! are completely eradicated."
 me_zorgoomni.50.a: "We will teach the Jemskoo a lesson they shall never forget!"

 me_zorgoomni.51_title: "Call of the Bloodthirst" 
 me_zorgoomni.51_desc: "One of the most closely guarded secrets within all of [ROOT.GetCountry.GetName|T] is that the [ROOT.GetCountry.GetRulerTitle], [ROOT.GetCountry.GetRuler.GetName|Y], is a #Y Vampire#!, and must periodically feed the terrible #Y Bloodthirst#! that overcomes [ROOT.GetCountry.GetRuler.GetHerHim]. Resisting these urges is possible, but comes at a cost to [ROOT.GetCountry.GetRuler.GetFirstName|Y]'s health."
 me_zorgoomni.51.a: "The time has come to hunt..."
 me_zorgoomni.51.b: "I will not give into these infernal cravings!"
 me_zorgoomni.51_tooltip: "#Y Our Ruler will search for a victim#!..."

 me_zorgoomni.52_title: "The Vampire's Gift" 
 me_zorgoomni.52_desc: "Having made the decision to answer the call of the #Y Bloodthirst#!, [ROOT.GetCountry.GetRuler.GetName|Y] wasted no time, but left [ROOT.GetCountry.GetRuler.GetHerHis] quarters that same hour, intent on finding a victim. After lurking in the shadows and darkened alleys of [ROOT.GetCountry.GetCapital.GetName|G] for a couple of hours, [ROOT.GetCountry.GetRuler.GetFirstName|Y] discovered [SCOPE.sCharacter('random_vampire_victim').GetName|Y] walking alone.\n\nWithin moments, the deed was done, and [ROOT.GetCountry.GetRuler.GetFirstName|Y] gently lowered [SCOPE.sCharacter('random_vampire_victim').GetFirstName|Y]'s lifeless body to the ground. Every drop of blood had been drained from [SCOPE.sCharacter('random_vampire_victim').GetHerHis] veins, but the embrace of death would not take [SCOPE.sCharacter('random_vampire_victim').GetFirstName|Y].\n\nSomething much worse than death was coming."
 me_zorgoomni.52.a: "I have given you a gift, o [SCOPE.sCharacter('random_vampire_victim').GetFirstName]..."

 me_zorgoomni.53_title: "A Second Birth" 
 me_zorgoomni.53_desc: "When asked, [SCOPE.sCharacter('random_vampire_victim').GetName|Y] was unable to remember what had happened exactly - all that [SCOPE.sCharacter('random_vampire_victim').GetSheHe] remembered was walking through the streets of [ROOT.GetCountry.GetCapital.GetName|G] before collapsing. Perhaps [SCOPE.sCharacter('random_vampire_victim').GetSheHe] had fainted? It was hard to say what happened.\n\nBefore long, a deep sickness gripped [SCOPE.sCharacter('random_vampire_victim').GetHerHis] bowels, forcing [SCOPE.sCharacter('random_vampire_victim').GetFirstName|Y] to remain in bed with shuttered windows. All that came to visit were turned away - [SCOPE.sCharacter('random_vampire_victim').GetFirstName|Y] refused all company and food, whispering in a scratchy voice to be left alone.\n\nTime lost all meaning and a month of feverish nightmares passed in agony, until one morning, [SCOPE.sCharacter('random_vampire_victim').GetFirstName|Y] realized what had taken actually taken place one month prior."
 me_zorgoomni.53.a: "I feel awake for the first time in my life..."

 me_zorgoomni.54_title: "Attacked In The Dark" 
 me_zorgoomni.54_desc: "It was late in the evening, almost the third watch, when [ROOT.GetCountry.GetRuler.GetName|Y] realized what time it was - there was so much work to do and never enough time to do it. Rubbing [ROOT.GetCountry.GetRuler.GetHerHis] eyes and stifling a yawn, the [ROOT.GetCountry.GetRuler.GetTitle] waved off the sleepy guards standing at attention - [ROOT.GetCountry.GetRuler.GetSheHe] would walk to [ROOT.GetCountry.GetRuler.GetHerHis] home alone.\n\nStepping outside into the gloom, [ROOT.GetCountry.GetRuler.GetFirstName|Y] barely noticed the unseasonable fog that was choking the streets of [ROOT.GetCountry.GetCapital.GetName|G]; the only thing on [ROOT.GetCountry.GetRuler.GetHerHis] mind was a warm bed. Rounding a corner into a deserted square a few moments later, the [ROOT.GetCountry.GetRulerTitle] was shocked to see a cloaked figure standing in the middle of the road.\n\n[ROOT.GetCountry.GetRuler.GetFirstName|Y] felt delirious from the lack of sleep, because it seemed that [SCOPE.sCharacter('random_vampire').GetName|Y]'s eyes were glowing red."
 me_zorgoomni.54.a: "Run for your life!"
 me_zorgoomni.54.b: "I cannot resist the terrible gaze of [SCOPE.sCharacter('random_vampire').GetFirstName]..."

 me_zorgoomni.55_title: "The Omostthanat warrior's Call" 
 me_zorgoomni.55_desc: "After taking omens and seeking out the divine guidance of [GetDeityDefinition('omen_hellas').GetName|Y], the #T Shannah#! of [ROOT.GetCountry.GetName|T] has made it clear that the #T Helluvian#! faithful cannot tolerate the blasphemies of those living around us and that stormclouds are gathering on the horizon. Word has been sent throughout the realm, inviting #T Helluvian#! warriors to take up the #Y Sword of Hellas#! and prepare for holy war. If the #T Great Father#! gives the command for battle, then the faithful must do their duty."
 me_zorgoomni.55.a: "In one month's time, Hellas will make his desires known"
 
 me_zorgoomni.56_title: "A Helluvian Omostthanat" 
 me_zorgoomni.56_desc: "On this day, the #T Shannah#! of [ROOT.GetCountry.GetName|T], [ROOT.GetCountry.GetRuler.GetName|Y], will address the gathered assemblies of the nation at [ROOT.GetCountry.GetRuler.GetHerHis] #Y Apostolic Palace#!. The #T Helluvian#! faithful have congregrated in the squares and plazas of [ROOT.GetCountry.GetCapital.GetName|G] in preparation for a sacred #T Omostthanat#!, and although thousands are ready to give their lives for the sacred cause, the will of [GetDeityDefinition('omen_hellas').GetName|Y] is known only to one person, and one person alone; [ROOT.GetCountry.GetRuler.GetFirstName|Y].\n\nWill the #Y Swords of Hellas#! be sent into glorious battle against the foe, or will the #T Creator of All Things That Can Never Be Known#! send the faithful back to their farms and villages? When [ROOT.GetCountry.GetRuler.GetFirstName|Y] stepped out onto the balcony of the #Y Apostolic Palace#!, the entire city of #G Ddu-Nuinop#! was hanging on [ROOT.GetCountry.GetRuler.GetHerHis] every word." 
 me_zorgoomni.56.a: "Hellas will lead our forces to eternal victory!"
 me_zorgoomni.56.b: "Hellas has revealed his will to me - we shall not invade"

 me_zorgoomni.57_title: "Study Magic At The Magonis Academy" 
 me_zorgoomni.57_desc: "Being invited to study at the famed #Y Magonic School of Magic#! in [GetProvince('(int32)2478').GetName|G] is an honor worthy of only a select few, and [ROOT.GetCountry.GetRuler.GetName|Y] was admittedly surprised when a formal invitation arrived, alongside a group of mages, at [ROOT.GetCountry.GetCapital.GetName|G]. It appears that word of our [ROOT.GetCountry.GetRulerTitle]'s talents has reached the ears of the Headmasters there, and there are many skilled scholars on the faculty that would love the privilege of instructing [ROOT.GetCountry.GetRuler.GetFirstName|Y] in the arcane arts.\n\nAfter the initial pleasantries between the diplomats had been exchanged, [ROOT.GetCountry.GetRuler.GetFirstName|Y] accepted their proposal without hesitation. Because of [ROOT.GetCountry.GetRuler.GetHerHis] duties, the [ROOT.GetCountry.GetRulerTitle] will not be able to enroll full time, but over the next year or so, whenever time allows, [ROOT.GetCountry.GetRuler.GetSheHe] will sail to #G Durobaeraste#! and immerse [ROOT.GetCountry.GetRuler.GetHerHim]self in learning the finer points of wielding magic." 
 me_zorgoomni.57.a: "There is no price that one can place on power..."
 me_zorgoomni.57_tooltip: "#Y Our Ruler will travel to#! #G Durobaereste#! #Y and study#! #T Magic#!. #Y In one year's time, our Ruler will gain the#! #T Mage Trait#!."
 mage_trait_school: "Study Magic At The Magonis Academy"
 mage_trait_school_desc: "#Y Our Ruler will travel to#! #Y #Y Durobaeraste#! #!intermittently over the next year and study at the #G Magonis School of Summoning Magic#!."

 me_zorgoomni.58_title: "The Shannah Declares A Omostthanat!" 
 me_zorgoomni.58_desc: "My [ROOT.GetCountry.GetRulerTitle], the #Y Helluvian Shannah#! has declared a #Y Omostthanat!#! #Y Just#! last week, it is reported the #T Shannah#! addressed a crowd of citizens that had gathered in [GetProvince('(int32)2706').GetName|G], appearing from the balcony of the #Y Apostolic Palace#! and claiming that the god #T Hellas#! has made his choice.\n\nThe news is grim - the #Y 'Creator of All Things That Can Never Be Known'#! has called for battle against the heretics, and the armies of the #T Shannah#! are on the march! Prices within [ROOT.GetCountry.GetCapital.GetName|G] are already starting to rise, as fears of a protracted war travel across the trade lanes."
 me_zorgoomni.58.a: "The Shannah claims to speak for #E Hellas#! but is a warmongerer..."

 me_zorgoomni.59_title: "The Druids Of Lake Gater" 
 me_zorgoomni.59_desc: "For as long as [ROOT.GetCountry.GetRuler.GetName|Y] can remember, the wind blowing through the forests have whispered messages in [ROOT.GetCountry.GetRuler.GetHerHis] ear, offering advice and guidance in moments of darkness and uncertainty. The [ROOT.GetCountry.GetRulerTitle] has come to rely on this strange gift, and actively seeks the counsel of the spirits by taking long walks in the forests near [ROOT.GetCountry.GetCapital.GetName|G] whenever a crisis has befallen.\n\nOne day, the voices on the wind gave a commmand, one that [ROOT.GetCountry.GetRuler.GetSheHe] felt compelled to obey."
 me_zorgoomni.59.a: "You must travel to [GetProvince('(int32)1977').GetName] and embrace your destiny..."
 druid_trait_school: "Learn The Ways Of The Druids"
 druid_trait_school_desc: "#Y Our Ruler will travel to#! the #Y #G Lake Forest Temple#! in #E #Y Ddemedoch#! to learn the #R Ways of the Druids#!."
 me_zorgoomni.59_tooltip: "#Y Our Ruler will travel to#! #G Ddemedoch#! #Y and study with the#! #T Druids#!. #Y In one year's time, our Ruler will gain the#! #T Druid Trait#!."

 me_zorgoomni.60_title: "The Gift of Mother Earth" 
 me_zorgoomni.60_desc: "After many months of traveling through primeval forests, [ROOT.GetCountry.GetRuler.GetName|Y] finally reached the distant settlement of [GetProvince('(int32)1977').GetName|G], where the gentle waters of #Y Lake Gater#! reflect the marble steps of the ancient #Y Theater of Emildar#!.\n\nThe arrival of the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRulerTitle] came as no surprise to the #G Druids#! living there, for [ROOT.GetCountry.GetRuler.GetFirstName|Y] had long been expected. A humble cottage by the lakeside was presented to [ROOT.GetCountry.GetRuler.GetHerHim] as living quarters, and every morning at sunrise, [ROOT.GetCountry.GetRuler.GetFirstName|Y] sat in the Theater and learned lessons taught by the gentle caretakers of the forest.\n\nAfter many months of intense studying and partaking in esoteric rituals by the waters of the #G Gater#!, the mystery was finally revealed to [ROOT.GetCountry.GetRuler.GetFirstName|Y]; the ethereal presence that had long guided the [ROOT.GetCountry.GetRulerTitle] was the voice of [GetDeityDefinition('omen_cafea').GetName|Y] herself, and from this day forth, [ROOT.GetCountry.GetRuler.GetSheHe] would be counted among her children."
 me_zorgoomni.60.a: "Praise be to She that Whispers on the Wind!"

 me_zorgoomni.61_title: "Orcish Pearls" 
 me_zorgoomni.61_desc: "For the last century, the #Y Opium Ports#! of the #G Orcish Sea#! have steadily grown their influence through the #Y Opium Trade#!, which has grown increasingly lucrative as the product was introduced across #Y Northern Morrigon#!.\n\nHowever, the production of these exotic plants has traditionally been restricted to the priest classes of the #Y Uhuar Orcs#!, who zealously guard the secrets to the creation of the drug due to its major religious significance to the various #Y Orcish#! cults.\n\nRecently however, a group of #Y Orcish#! merchants have arrived in [GetProvince('orcish_pearl_target').GetName|G] with an interesting proposition. They claim to be able to access these elusive gardens, and say they can smuggle in a few seeds to begin domestic production. For the right price, of course."
 me_zorgoomni.61.a: "We should seize this opportunity!"
 me_zorgoomni.61.b: "We would make more money by taxing imports"

 me_zorgoomni.62_title: "Sobriety" 
 me_zorgoomni.62_desc: "For the #Y Orkan#! people, control of one's #T Inner Flame#! marks someone's intelligence, the strength of their faith, and their role in society. For this reason, the #Y Opini#! that the #Y Orkan#! people learn to smoke at a young age is essential in the culling of our race's instinctive taste for blood, and those that are able to access or afford the highest quality buds are often members of the #Y Suar'murya#! or #Y Egerya#! classes.\n\nHowever, isolated cases of believers abandoning the pipe and embracing sobriety occur, particularly amongst the lower classes. These #Y Duarsh#!, or non-believers soon become wild beasts unable to coexist with members of civilized society. Thus, most clans cast out or enslave these brutes who choose to embrace the '#Y Crimson Flame#!'.\n\nIt has come to our attention that #Y [SCOPE.sCharacter('new_sober').GetFirstName]#! has given in to the #Y Crimson Flame#! in secret, resulting in the death of #Y [SCOPE.sCharacter('sober_victim').GetFirstName]#! at [SCOPE.sCharacter('new_sober').GetHerHis] hands. Thus, the only merciful course of action is banishing him from the clan, with the hope that one day he will realize the cultivation of his #T Inner Flame#! is the only way to # Otziggush#!."
 me_zorgoomni.62.a: "It is a mercy few #E Duarsh#! ever see"

 me_zorgoomni.63_title: "Picking up the Pipe" 
 me_zorgoomni.63_desc: "In the last century #Y Orcish#! traders have been claiming more influence in the #G Orcish Sea#! trade through the sale of #Y Opium#!, an addictive drug that has slowly spread across #Y Northern Morrigon#! to the point that village chiefs are known to migrate closer to these #Y Opium Ports#! to get their fix.\n\nWhile our people try to resist the temptation of the drug, it seems that #Y [SCOPE.sCharacter('new_addict').GetFirstName]#! has succumbed to [SCOPE.sCharacter('new_addict').GetHerHis] desires. Although [SCOPE.sCharacter('new_addict').GetSheHe] picked up the pipe in secret, the volume of opium that [SCOPE.sCharacter('new_addict').GetSheHe] has consumed has made it evident to all that they are nothing more than another helpless addict, a victim of the vicious #Y Orcish Pearls#!."
 me_zorgoomni.63.a: "Disappointing"

 me_zorgoomni.64_title: "Fai Attack"
 me_zorgoomni.64_desc: "#Y [ROOT.GetCountry.GetRuler.GetFirstName]#!, terrible news from the farthest reaches of your realm!\n\nReports of a large #Y Fai#! attack have come in from the distant settlement of [SCOPE.sP('houdini_village').GetName|Y]! It seems that a band of #Y Myethries#! crept into the village during the night and abducted numerous settlers foolish enough to leave their windows unboarded, their fates are as of now unknown. In addition to the disappearances, this same band of #Y Myethrie#! have devastated the local cattle herds, as farmers woke up to large piles of headless cows littering their pastures.\n\nThe local elven population seems to have been unaffected, however, that is cold comfort for the few survivors of the attack.\n\nTall, spindly creatures with four arms and long faces, it is that that should you have the misfortune of seeing a #Y Myethrie#!, it is already too late. With no way to fight these supernatural creatures, the best we can do is support the survivors and try to rebuild their community."
 me_zorgoomni.64.a: "Help the survivors rebuild"
 me_zorgoomni.64.b: "The money is better used elsewhere"

 me_zorgoomni.65_title: "Fai Attack" 
 me_zorgoomni.65_desc: "#Y [ROOT.GetCountry.GetRuler.GetFirstName]#!, terrible news from the farthest reaches of your realm!\n\nAnarchy reigns in the far-off province of [SCOPE.sP('new_houdini_village').GetName|Y], as #Y Governor#! #Y [SCOPE.sCharacter('rip_governor').GetFirstName]#! has disappeared overnight!\n\nRumor has it that a #Y Zhon#! has taken the governor, due to the various recent reports of #Y Zhon#!-like creatures sightings from local hunters.\n\nOne of the most elusive #Y Fai#!, #Y Zhon#! are solitary creatures whose territories can span for hundreds of hectares. They are humanoid horned creatures with butterfly wings, and often resemble depictions of the #T Aneic#! god #Y Othovor#!. What little information we have of them seems to indicate that they are intelligent creatures, however, what it wants with #Y Governor#! #Y [SCOPE.sCharacter('rip_governor').GetFirstName]#! is unknown, and it is unlikely we will ever see [SCOPE.sCharacter('rip_governor').GetHerHim] again."
 me_zorgoomni.65.a: "Send in the soldiers to maintain order!"
 me_zorgoomni.65.b: "There is nothing we can do"

 me_zorgoomni.66_title: "Life in the Eldritch Forest" 
 me_zorgoomni.66_desc: "#Y [ROOT.GetCountry.GetRuler.GetFirstName]#!, strange news from the farthest reaches of your realm.\n\nIt seems that in the far-off province of [SCOPE.sP('schizo_village').GetName|Y], #Y Governor#! #Y [SCOPE.sCharacter('schizo_governor').GetFirstName]#! has reappeared after his mysterious disappearance over a month ago! This good news comes from some farmers who saw him walking out of the woods near the outskirts of the settlement.\n\nWhile control has been reestablished in the province, various officials have sent in letters of concern regarding #Y Governor#! #Y [SCOPE.sCharacter('schizo_governor').GetFirstName]#!'s health. It has been noted that [SCOPE.sCharacter('schizo_governor').GetSheHe] occasionally attempts to speak to subordinates in a strange gibberish language unlike any elven or human tongues, consistently walks around the governor's palace at late hours, and launches into seizures that can last up to an hour.\n\nPerhaps it is time to retire #Y Governor#! #Y [SCOPE.sCharacter('schizo_governor').GetFirstName]#! from his position?"
 me_zorgoomni.66.a: "At least he came back?"

 me_zorgoomni.67_title: "The Path to Enlightenment" 
 me_zorgoomni.67_desc: "While the #Y High Elves#! have the longest lifespans on #G Omniluxia#!, even they have not been able to fully conquer death.\n\nNearing the end of a high elf's life, they undergo a decades-long process in which they slowly lose control of their own body, until their condition deteriorates to the point where they can no longer speak. This process takes years, and those who eventally become prisoners in their own bodies are become known as the 'Enlightened', or #Y Noa#! in the Imperial #Y Atheusian#! tongue.\n\nThe #Y Noa#! are locked into special chambers where they are expected to reflect and reach enlightenment through thought before their eventual demise. The size and extravagance of these chambers, or #Y Noa Uro-On#!, often depend on the elf's caste and wealth, with wealthy philosopher-nobles like #Y Shall'Neac Suonseli#! being encased in large mausoleums covered with golden iconography.\n\nIt seems that #Y [SCOPE.sChar('dead_guy_walking').GetFirstName]#! has begun [SCOPE.sChar('dead_guy_walking').GetHerHis] journey on the Path, characterized by feeling a distinct numbness in one's feet.\n\nSuch news is often shocking, as one must make their peace with death as an important part of their journey to enlightenment. In the high elven tradition, #Y [SCOPE.sChar('dead_guy_walking').GetFirstName]#! must abandon their #Y Life Path#! and choose a #Y Death Path#! to follow until they become a #Y Noa#! that will help them achieve a clear state of mind prior to their ascension."
 me_zorgoomni.67.a: "The Aur-Vo Path provides a clear journey through service"
 me_zorgoomni.67.b: "The So-Nour Path is a more pious and mystic journey"

 me_zorgoomni.68_title: "The Steps to Ascendance" 
 me_zorgoomni.68_desc: "It is unfortunate news, but #Y [SCOPE.sChar('dead_guy_walking').GetFirstName]#! has entered the final stages of life. In this new stage of [SCOPE.sChar('dead_guy_walking').GetHerHis] life, #Y [SCOPE.sChar('dead_guy_walking').GetFirstName]#! has deteriorated enough to be considered a #Y Noa#!.\n\nDue to [SCOPE.sChar('dead_guy_walking').GetHerHis] status as a #Y Noa#!, [SCOPE.sChar('dead_guy_walking').GetSheHe] is eligible to be housed in a #Y Noa Uro-On#!. Since [SCOPE.sChar('dead_guy_walking').GetSheHe] was a member of the #Y Upper Five#! castes, #Y [SCOPE.sChar('dead_guy_walking').GetFirstName]#!'s close family have petitioned the court for funding to build [SCOPE.sChar('dead_guy_walking').GetHerHim] a beautiful #Y Noa Uro-On#! to ensure that they can properly ascend without distractions."
 me_zorgoomni.68.a: "Grant them the funding"
 me_zorgoomni.68.b: "If they cannot fund [SCOPE.sChar('dead_guy_walking').GetHerHis] Noa Uro-On [SCOPE.sChar('dead_guy_walking').GetSheHe] is not worthy of a grand one"

 me_zorgoomni.69_title: "The Great Peace" 
 me_zorgoomni.69_desc: "Earlier today it was announced that #Y [SCOPE.sChar('dead_guy_walking').GetFirstName]#! had ascended, bringing [SCOPE.sChar('dead_guy_walking').GetHerHis] journey to end.\n\nFrom inside the #Y Noa Uro-On#!, [SCOPE.sChar('dead_guy_walking').GetHerHis] body has been carefully removed and sent to the sanctuary of [SCOPE.sChar('dead_guy_walking').GetHerHis] close family, where [SCOPE.sChar('dead_guy_walking').GetHerHis] internal journey will be read aloud to the audience present at her funeral. Throughout this multi-day event, [SCOPE.sChar('dead_guy_walking').GetHerHis] greatest epiphanies and ideas will bring [SCOPE.sChar('dead_guy_walking').GetHerHis] family prestige and improve their status amongst their caste.\n\nAs the candles flicker out around [SCOPE.sChar('dead_guy_walking').GetHerHis] body, one can only hope that [SCOPE.sChar('dead_guy_walking').GetSheHe] was revealed new methods to achieve ascension."
 me_zorgoomni.69.a: "It is done"

 me_zorgoomni.70_title: "Shizotr" 
 me_zorgoomni.70_desc: "All #Y Ular-Pria#! must shed their outer layers to keep their skin healthy in a process called the #Y Iyurk#!. Adults shed every few months, while children shed around every two to three weeks. This process is common enough that there is a large market for snakeskin products amongst the #Y Ular-Pria#! and surrounding communities, with some believing the scales hold medicinal properties that help with headaches, colds, and itchy skin.\n\nHowever, occasionally adults are unable to properly shed their skin, and are considered to be in #Y Shizotr#!, a status that lasts around a month in which the unfortunate victim is marked by patches of dead skin that cling onto the body. Despite the common nature of this affliction, victims are often the subject of ridicule amongst most #Y Ular-Pria#! cultures, and the marks are considered signs that the victim is stupid or weak. Past emperors and nobility would go to great lengths to hide their #Y Shizotr#!, and those that were caught were lost face amongst their peers.\n\nAlthough #Y [SCOPE.sChar('bad_shedder').GetFirstName]#! has tried to hide it, it is evident to all that [SCOPE.sChar('bad_shedder').GetSheHe] is going through #Y Shizotr#!, and [SCOPE.sChar('bad_shedder').GetHerHis] peers share a good laugh at [SCOPE.sChar('bad_shedder').GetHerHis] expense."
 me_zorgoomni.70.a: "Ha ha!"

 me_zorgoomni.71_title: "Shizotr Passes" 
 me_zorgoomni.71_desc: "After around a month, #Y [SCOPE.sChar('bad_shedder').GetFirstName]#!'s #Y Shizotr#! has passed.\n\nHaving polished [SCOPE.sChar('bad_shedder').GetHerHis] scales and worn [SCOPE.sChar('bad_shedder').GetHerHis] best outfit, #Y [SCOPE.sChar('bad_shedder').GetFirstName]#! has slowly been built back [SCOPE.sChar('bad_shedder').GetHerHis] reputation after being the butt of every joke for the last month.\n\nHowever, while it seems that #Y [SCOPE.sChar('bad_shedder').GetFirstName]#! has forgiven all of those who made fun of him, nobody can truly know what truths he holds close to his heart."
 me_zorgoomni.71.a: "No hard feelings right?"

 me_zorgoomni.72_title: "Draconic Madness: The Arezuthane" 
 me_zorgoomni.72_desc: "The harsh lives of the #Y Dragkhan#! people means that it is expected that they live short lives. However, those lucky enough to grow older must face a particularly feared illness that seems to afflict nearly every #Y Dragkhan#! older than forty: #Y Draconic Madness#!.\n\nSome believe it to be a curse placed upon the #Y Dunydurceg#! by ancient #T Elves#! or #T Dwarves#! still carrying a grudge against the modern descendants of the Old #G Dragons#!. Regardless of its origin, it is commonly understood that this illness is caused by a #Y Zrshin#!, an evil spirit aiming the consume the soul of the victim and control their body as a #Y Dzrmoke#!. The first stage of #Y Draconic Madness#! begins with the #Y Zrshin#! entering the body and beginning what is known as the #Y Arezuthane#!, in which the victim sees their strength increase greatly at the cost of their sanity. Victims are unable to reason properly or recognize faces, and are prone to random acts of violence.\n\nEarlier today, #Y [SCOPE.sChar('insane_guy').GetFirstName]#! was apprehended after [SCOPE.sChar('insane_guy').GetSheHe] killed #Y [SCOPE.sChar('insane_guy_victim').GetFirstName]#! when [SCOPE.sChar('insane_guy_victim').GetSheHe] passed him by on the street. While [SCOPE.sChar('insane_guy').GetSheHe] is being held in a secure cell, their brute strength and erratic behavior mean that a decision must be made quickly, lest they become a #Y Dzrmoke#! or worse.\n\nThe faithful amongst the various dragkhanic cults know that this mystical illness can only be cured by a #Y Szmanpa#!, or a traditional #Y Dunydurceg#! shaman. If one can be procured, there is a chance that they could save #Y [SCOPE.sChar('insane_guy').GetFirstName]#!'s life and exorcise the #Y Zrshin#! before it's too late!"
 me_zorgoomni.72.a: "Call for a Szmanpa!"
 me_zorgoomni.72.b: "A true Dragkhan will survive on their own"
 dragkhan_insane_ttp: "#R #E [SCOPE.sChar('insane_guy').GetName]#! will be consumed by the #E Zrshin#!#!"
 dragkhan_safe_ttp: "#G #E [SCOPE.sChar('insane_guy').GetName]#! will be cured of #E Draconic Madness#!#!"

 me_zorgoomni.73_title: "Draconic Madness: Cured" 
 me_zorgoomni.73_desc: "After several tense days, #Y [SCOPE.sChar('insane_guy').GetFirstName]#! has emerged, cured of [SCOPE.sChar('insane_guy').GetHerHis] #Y Draconic Madness#!!\n\nEither through [SCOPE.sChar('insane_guy').GetHerHis] strength alone or through the power of #Y Zamqhan, Devourer of the Zrshin#!, the evil spirit has been driven out of the body or devoured, and #Y [SCOPE.sChar('insane_guy').GetFirstName]#!'s life has been spared!"
 me_zorgoomni.73.a: "Praise be to Zamqhan, Devourer of the Zrshin!"

 me_zorgoomni.74_title: "Draconic Madness: The Dzrmoke" 
 me_zorgoomni.74_desc: "After numerous days in the dungeon, grim news has returned about #Y [SCOPE.sChar('insane_guy').GetFirstName]#!'s condition. The #Y Zrshin#! has consumed [SCOPE.sChar('insane_guy').GetHerHis] soul, creating a #Y Dzrmoke#!.\n\nWith [SCOPE.sChar('insane_guy').GetHerHis] body now a puppet of the #Y Zrshin#!, [SCOPE.sChar('insane_guy').GetSheHe] must be killed before [SCOPE.sChar('insane_guy').GetSheHe] can bring harm to anyone else."
 me_zorgoomni.74.a: "Kill it!"

 me_zorgoomni.75_title: "The Blue Spots" 
 me_zorgoomni.75_desc: "Despite being a staple of the #Y Drow#! diet, the plentiful #Y Muke Mushrooms#! also ensure that their race's life are short and brutish.\n\nToxic to humans, these mushrooms also contain trace amounts of mana, and are infused with the power of #Y Melodias#!, who spread them across the caverns of #G Omniluxia#!. Those who eat them are known to go mad or die, save for the goblins and deep gnomes, however, the elven ancestors of the #Y Drow#! seemed to grow more powerful and erratic, as their skin slowly became the color of this common crop.\n\nIt is unknown when the #Y Puka Spots#! were first observed, but what is known is that those who develop them are not long for this world. These blue spots are the first symptoms of a disease that slowly drains the vitality of the victim until their blood boils and bursts out of the body, killing the infected instantly.\n\nAlthough the #Y Muke Mushrooms#! are thought to be the cause of this disease, they are indivisible from the #Y Drow#! diet, as their race can no longer consume surface foods without becoming violently sick.\n\nUnfortunately, it seems that #Y [SCOPE.sChar('mushroom_man').GetFirstName]#! has developed the #Y Puka Spots#!, meaning [SCOPE.sChar('mushroom_man').GetHerHis] on this world is now limited."
 me_zorgoomni.75.a: "It must be Melodias' will"

 me_zorgoomni.76_title: "A Cursed Child" 
 me_zorgoomni.76_desc: "#Y [ROOT.GetCountry.GetRuler.GetName]#!, a cursed child has recently discovered in one of #Y [ROOT.GetCountry.GetCapital.GetName]#!'s districts.\n\nEarlier today, #Y [SCOPE.sChar('cursed_kiddy').GetFirstName]#! trashed a market and killed a few civilians before [SCOPE.sChar('cursed_kiddy').GetSheHe] was able to be calmed down and detained by locals. With this impressive show of strength, it is clear that [SCOPE.sChar('cursed_kiddy').GetSheHe] is a victim of the #Y Curse of Power#!.\n\nWith names varying from #G Wishtheon#!'s Curse to #T Artheousan#!'s Curse, the #Y Curse of Power#! is one of the most common curses amongst the various human cultures of #G Omniluxia#!, and those who inherit this powerful curse are often infants or young children. It's origin unknown, reactions to these superhumans vary by culture, with some praising their strength and others afraid of their potential. Individuals are easily identified as they host clear white streaks across their body, and it is assumed by many that they are the vessel of a god. Tragically, hosts of this curse often die young, with many culture believing their strength to come from the sacrifice of their lifespan.\n\nWith that being said, what is to be the fate of young #Y [SCOPE.sChar('cursed_kiddy').GetFirstName]#!?"
 me_zorgoomni.76.a: "Kill him before his curse destroys us all"
 me_zorgoomni.76.b: "He could be useful to us"
 me_zorgoomni.76.c: "This is a sign from Wishtheon!"
 me_zorgoomni.76.d: "Let us see if this child can be more than just a brute"
 me_zorgoomni.76.e: "Let us watch his progress with caution"
 me_zorgoomni.76.f: "We have no use for someone who won't can't with the tribe"
 me_zorgoomni.76.g: "We have been blessed with a child of Dzunge Duny!"
 me_zorgoomni.76.h: "The Curse of the Twins will make this child a fine warrior"
 me_zorgoomni.76.i: "Tradition demands it be burned!"
 me_zorgoomni.76.j: "The Musings mention such a child..."
 me_zorgoomni.76.k: "We must train [SCOPE.sChar('cursed_kiddy').GetHerHim] to fight our enemies"
 me_zorgoomni.76.l: "A blessing from the Victory Goddess!"
 me_zorgoomni.76.m: "Artheousan's strength runs through [SCOPE.sChar('cursed_kiddy').GetHerHis] veins!"
 me_zorgoomni.76.n: "We will make a fine Alfkjel out of [SCOPE.sChar('cursed_kiddy').GetHerHim]"
 me_zorgoomni.76.o: "A sign of the coming apocalypse?"

 me_zorgoomni.77_title: "The Feast" 
 me_zorgoomni.77_desc: "#Y Goblins#! are nearly universally feared across #G Omniluxia#!, and for good reason. As malformed creatures, they would have been little more than beasts had it not been for #R Melodias#!' intervention.\n\nShe bestowed upon them the special gift to devour the life force of other beings. As each meal gave them more strength and intelligence, this idea of devouring another's 'man'a' to increase the individual's spiritual and physical power became ingrained into the culture of every goblinic society on #G Omniluxia#!.\n\nPoor #Y [SCOPE.sChar('target').GetFirstName]#! has found themselves the victim of this ability, with a fraction of [SCOPE.sChar('target').GetHerHis] strength and wisdom going to #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!."
 me_zorgoomni.77.a: "Delicious!"
 me_zorgoomni.77_tooltip: "#R #E [SCOPE.sChar('target').GetFirstName]#!'s man'a is consumed#!"



 me_zorgoomni.78_title: "The Sorcerer" 
 me_zorgoomni.78_desc: "Great #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!, after much time, word has finally returned from the humble villages of the realm!\n\nA wandering mage by the name of #Y [SCOPE.sCharacter('prof_magician').GetFirstName]#! has responded to your request. The great sorcerer is a mage trained in the #Y Imperial Standard#!, so there is no doubt that [SCOPE.sCharacter('prof_magician').GetHerHis] arcane abilities would be a great boon to the realm! However, such a well-trained mage's services come at a price."
 me_zorgoomni.78.a: "Recruit [SCOPE.sCharacter('prof_magician').GetHerHim]"
 me_zorgoomni.78_tooltip.a: "#Y #E [SCOPE.sChar('prof_magician').GetFirstName]#! will be recruited to court#!"
 me_zorgoomni.78.b: "We do not need [SCOPE.sCharacter('prof_magician').GetHerHis] services"
 me_zorgoomni.78_tooltip.b: "#Y #E [SCOPE.sChar('prof_magician').GetFirstName]#! will be sent away#!"

 me_zorgoomni.79_title: "The Folk Magician" 
 me_zorgoomni.79_desc: "Great #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!, after much time, word has finally returned from the humble villages of the realm!\n\nA mage by the name of #Y [SCOPE.sCharacter('folk_magician').GetFirstName]#! has responded to your request. Although [SCOPE.sCharacter('folk_magician').GetSheHe] is not a mage trained by the imperial standard, there is no doubt that [SCOPE.sCharacter('folk_magician').GetHerHis] arcane insight may be a benefit to the kingdom. However, [SCOPE.sCharacter('folk_magician').GetHerHis] services come at a price."
 me_zorgoomni.79.a: "Recruit [SCOPE.sCharacter('folk_magician').GetHerHim]"
 me_zorgoomni.79_tooltip.a: "#Y #E [SCOPE.sChar('folk_magician').GetFirstName]#! will be recruited to court#!"
 me_zorgoomni.79.b: "We do not need [SCOPE.sCharacter('folk_magician').GetHerHis] services"
 me_zorgoomni.79_tooltip.b: "#Y #E [SCOPE.sChar('folk_magician').GetFirstName]#! will be sent away#!"

 me_zorgoomni.80_title: "The Search Returns Empty-Handed" 
 me_zorgoomni.80_desc: "Great #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!, reports from all our parties indicate that the search for a suitable mage has come back empty-handed.\n\nOur men need rest as they have spent several weeks on the trails of possible leads, they cannot march anymore for a frivolous search! It is clear that what mages remain in the realm have chosen not to reveal themselves, perhaps out of fear or pride. Whatever may be the case, we may need to look into creating an academy of the Imperial standard should we wish to not waste our time hoping a wandering mage will emerge."
 me_zorgoomni.80.a: "Unfortunate"
 me_zorgoomni.80_tooltip: "#Y The search for a mage has returned empty-handed!#!"




 me_zorgoomni.82_title: "Whispers of the Way"
 me_zorgoomni.82_desc: "There is a religious disturbance within [ROOT.GetCountry.GetCapital.GetName|G] that you should hear about, great #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!. A strange man that goes by the name of #Y [SCOPE.sChar('seeker_prophet').GetFirstName]#! has been preaching in the streets and public places of our capital, claiming that by forsaking their faith and identity, the people of [ROOT.GetCountry.GetName|T] can reach enlightenment by embracing the #Y the Way#!.\n\nMost have dismissed these esoteric demands as the ravings of a fanatical madman, however, those that sat to listen to his words have begun preaching across the city, demanding passing crowds to give up their idols and their identity to embrace #Y the Way#!. Now, the crowds coming to see the self-proclaimed #Y 'Wise Guide of the Way'#! are growing larger every day, and they are becoming more difficult to control."
 me_zorgoomni.82.a: "Send in soldiers to restore order!"
 me_zorgoomni.82.b: "His message interests me..."
 
 me_zorgoomni.83_title: "A Lodge Emerges"
 me_zorgoomni.83_desc: "The #Y Ishtar Society#! of #Y Mage#!-Serpents is one of the most powerful yet hidden players in the #G Austropetolian Archipelago#!. Their organization seems to have connections with all the Snakerealms of the isles, and those that question their authority often face dire consequences.\n\nThe Society's influence radiates from their #Y Lodges#!, temple-like structures that serve as the nexus hosting their knowledge and leaders in each city they inhabit. It seems that one of these lodges has recently emerged in the city of [SCOPE.sP('new_lodge_location').GetName|Y], however, none speak out against its construction.\n\nPerhaps these esoteric mages may serve to benefit our realm."
 me_zorgoomni.83.a: "We are humbled by their prescence"
 me_zorgoomni.83_tooltip.a: "#Y An #E Ishtar Lodge#! has been established in [SCOPE.sP('new_lodge_location').GetName]#!"

 me_zorgoomni.84_title: "Rise of a Witch King"
 me_zorgoomni.84_desc: ""
 me_zorgoomni.84.a: ""
 me_zorgoomni.84.b: "The witch king rises."
 me_zorgoomni.84_tooltip.a: "#Y An #E Ishtar Lodge#! has been established in [SCOPE.sP('new_lodge_location').GetName]#!"
 me_zorgoomni.84_tooltip.b: "#Y A witch king will rise from the shadows.#!"

 me_zorgoomni.85_title: "Building a Kaxud"
 me_zorgoomni.85_desc: "#G 'The strength of the community relies on the health of the individuals. The devotion of true believers is determined by the strength of a community. In this way, #E Zain'ud#! rewards those who keep his communities strong.'\n#E Uphin 8:15#!#!\n\nIn traditional #Y Zinduidian#! communities, the #Y Kaxud#! was a tent or building dedicated to the local shaman, who served as both a spiritual guide and a doctor. After the arrival of the #Y Prophets#!, the function of these constructions grew from a secluded area of worship and medicine to the social, spiritual, and academic heart of every #T Zainudian#! community. Once simple tents or wooden constructions turned into elaborate stone, marble, and sandstone structures meant to serve as the pride of the community.\n\nIn the current day, #Y Kaxuds#! are primarily centers of worship, hosting multiple prayers and gatherings throughout the day. However, they have retained their historic function as hospitals, and many have even become academic centers whose range of topics has grown from primarily medicine to include theology, astronomy, mathematics, philosophy, and more. For any city in the #T Zainudian#! world looking to mark its place on the map, a large and extravagant #Y Kaxud#! is a necessary investment to invite in scholars, holy men, and other specialists.\n\nArchitects gather around #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!, presenting [ROOT.GetCountry.GetRuler.GetHerHim] with a building plan for the #Y Kaxud#!. Looking over the articulate designs, [ROOT.GetCountry.GetRuler.GetSheHe] announces:"
 me_zorgoomni.85.a: "Let us begin!"
 me_zorgoomni.85_tooltip.a: "#Y A #E Kaxud#! will be built in [SCOPE.sP('mosque_target').GetName]#!"
 me_zorgoomni.85.b: "I've changed my mind"
 me_zorgoomni.85_tooltip.b: "#Y Proposed building plans will be abandoned#!"

 me_zorgoomni.86_title: "Building a Hold"
 me_zorgoomni.86_desc: "During the #T Dwarven Golden Age#!, the three dwarven civilizations developed complex technologies often regarded as nothing more than myths by their descendants. It was by using these technologies that these past dwarves constructed beautiful, elaborate cities atop mountains, inside caverns, and on vast plains. Stories even recall floating cities that hovered above the earth or drifted across the sea.\n\nThe #Y Great Primordial War#!, only half-remembered by the few dwarven or elven scholars that cared to maintain ancient records, caused the destruction of most of these cities alongside most of dwarven civilization. In the aftermath of this cataclysm, only cities built on terrain with natural defenses managed to elude destruction. Survivors replaced opulance with functionality, fortifying their mountain strongholds to defend against the hordes of what would come to be called the #T Old Dragkhans#!. These few cities that survived the centuries of conflict and isolation came to be known as #Y Holds#!, mighty fortress cities that preserve millennia of dwarven culture, history, and technology.\n\nSince our nation has risen to prominence, perhaps it is time we leave our mark on dwarven history and establish our own center of dwarven civilization to rival these cities of old."
 me_zorgoomni.86.a: "It is time"
 me_zorgoomni.86_tooltip.a: "#Y [SCOPE.sP('hold_target').GetName] will be rebuilt into a #E Hold#!#!"
 me_zorgoomni.86.b: "I've changed my mind"
 me_zorgoomni.86_tooltip.b: "#Y Proposed building plans will be abandoned#!"

 me_zorgoomni.87_title: "Building a Huon-Loc Reuoc"
 me_zorgoomni.87_desc: "Far from just temples, the #Y Huon-Loc Reuoc#! is a physical manifestation of the rigid hierarchical nature of #Y High Elven#! society. These triangular-shaped buildings contain multiple levels that symbolize the spiritual and political superiority of the noble classes over the commoners.\n\nThe #Y Upper Five#! castes that rule #Y High Elven#! society occupy the highest levels, symbolizing their spiritual purity above the majority of society and their proximity to enlightenment. There they are provided with all the material needs they could want as well as a tranquil space above the noise and debauchery produced in the lower levels. Its not uncommon for nobility to retreat to these spaces for weeks at a time, meditating and mingling amongst themselves.\n\nThe #Y Middle Ten#! castes occupy most of the building, and depending on their status can found throughout most of the center levels. While not as embellished or elaborately decorated as the top levels, these middle levels still provide ample space for meditation and discussion. For these castes, their levels provide an academic space where many pursue higher education from teachers in higher castes.\n\nFinally, the # Bottom Three#! castes occupy the ground floor and underground layers. Making up the majority of society, these large spaces serve more as community centers for gatherings and festivals than areas of quiet meditation. In these levels, drinks, gambling, dancing, and other debaucherous forms of merriment are the norm. It was in these levels that the #Y Korn-Huruk Path#! was born, a backwards life path shunned by the upper classes due its hedonistic teachings that encourages followers to live life without restraint.\n\nDue to its religious and cultural importance, #Y Huon-Loc Reuoc#! are a necessity for any emerging #Y High Elven#! city. For this reason, the citizens of [SCOPE.sP('elf_temple_target').GetName|Y] have petitioned the government for funds to construct such a building in their town square."
 me_zorgoomni.87.a: "Provide them with the funds"
 me_zorgoomni.87_tooltip.a: "#Y A #E Huon-Loc Reuoc#! will be built in [SCOPE.sP('elf_temple_target').GetName]#!"
 me_zorgoomni.87.b: "They'll live without it"
 me_zorgoomni.87_tooltip.b: "#Y Proposed building plans will be abandoned#!"

 me_zorgoomni.88_title: "Building Catacombs"
 me_zorgoomni.88_desc: "Since the emergence of #T Yedidyhan#! and the birth of the #Y True Vampires#!, vampiric prescence has extended across #G Omniluxia#! and followers of the #Y Dark Lord#! now reside on every continent.\n\nUniversally reviled by nearly all cultures, the first vampires quickly figured out that isolation often meant death. Needing a safe place to gather and hide, vampires traditionally dwelt in dark caverns outside of civilization where they wouldn't be hunted by mobs or armies. It was in these caverns that the first vampiric societies emerged, facilitating the growth of their faith and race.\n\nAs their power grew, so did the cities recovering from the #Y Great Collapse#!. These vampires of old took advantage of these growing urban centers to create new homes amongst the winding catacombs of #G Omniluxia#!'s oldest and most expansive cities, lodging themselves in these urban centers that hosted thousands of possible meals.\n\nMy Lord, our rule inherently creates unrest amongst the mortals of our realm, perhaps it is time that we establish a network of these underground catacombs to better control the more unruly urban regions of our expanding empire."
 me_zorgoomni.88.a: "Let us begin!"
 me_zorgoomni.88_tooltip.a: "##Y #E Catacombs#! will be built below [SCOPE.sP('vampire_shrine_target').GetName]#!"
 me_zorgoomni.88.b: "I've changed my mind"
 me_zorgoomni.88_tooltip.b: "#Y Proposed building plans will be abandoned#!"

 me_zorgoomni.89_title: "Developing a Hold"
 me_zorgoomni.89_desc: "A #Y Hold#! is the beating heart of any prominent dwarven power, as its ancient foundations can often be traced back to the #Y Mythic Age#!!\n\nIn an effort to preserve and beautify the jewel of our realm, what actions shall we take to develop our glorious city?"
 me_zorgoomni.89.a: "Let's invest in building up the residential districts"
 me_zorgoomni.89_tooltip.a: "#Y We will invest in residential districts to expand the city's population!#!"
 me_zorgoomni.89.b: "We should build up infrastructure across the city"
 me_zorgoomni.89_tooltip.b: "#Y We will invest in infrastructure to expand the city!#!"
 me_zorgoomni.89.c: "The people would love some more entertainment"
 me_zorgoomni.89_tooltip.c: "#Y We will invest in entertainment to win the hearts of the people!#!"
 me_zorgoomni.89.d: "I've changed my mind"
 me_zorgoomni.89_tooltip.d: "#Y Proposed building plans will be abandoned#!"

 me_zorgoomni.94_title: "The Soventeir-Aralans Wedding"
 me_zorgoomni.94_desc: "Messengers from the royal courts of [GetCountry('SOV').GetName|Y] and [GetCountry('ARL').GetName|Y] carry news across #Y Morrigon#!; a prince from the mighty #Y Sovenerian#! empire has taken a northern princess as his bride.\n\nThe wedding was a grand spectacle of silk, steel, and old bloodlines, but for now it appears to be little more than a dynastic gesture with no cynical political undertones. No armies have marched, no envoys have declared new obligations, and it appears that it could be genuine love, but the courts of #G Morrigon#! are left to wonder whether the marriage will become a true bond between the two realms or merely another bright ceremony remembered by singers."
 me_zorgoomni.94.a: "A wedding, then, and nothing more..."
 me_zorgoomni.94_tooltip: "The #Y Soventeir Empire#! and #Y Aralans Kingdom#! have celebrated the dynastic marriage between their countries, but no political changes have been announced."

 me_zorgoomni.95_title: "The Soventeir-Aralans Wedding"
 me_zorgoomni.95_desc: "Messengers from the royal courts of [GetCountry('SOV').GetName|Y] and [GetCountry('ARL').GetName|Y] carry news across #Y Morrigon#!; a prince from the mighty #Y Sovenerian#! empire has taken a northern princess as his bride.\n\nThe celebration has quickly become more than pageantry, howeever - #Y Soventeir#! has proclaimed that the honor of #Y Aralans#! is now tied to its own, and that any power threatening the princess' homeland will answer to armies of the mighty #T Shanuzushanuz#!. Across the continent, diplomats are already weighing what this promise means for the balance of power throughout the continent."
 me_zorgoomni.95.a: "A promise sealed before all"
 me_zorgoomni.95_tooltip: "The #Y Soventeir Empire#! has guaranteed #Y Aralans Kingdom#!."

 me_zorgoomni.96_title: "The Soventeir-Aralans Wedding"
 me_zorgoomni.96_desc: "Messengers from the royal courts of [GetCountry('SOV').GetName|Y] and [GetCountry('ARL').GetName|Y] carry news across #Y Morrigon#!; a prince from the mighty #Y Sovenerian#! empire has taken a northern princess as his bride. as his bride.\n\nBy the end of the festivities, the marriage had become the foundation of a formal alliance between the two realms - something that sent a shockwave throughout the assembled courts of the realm. #Y Soventeir#! and #Y Aralans#! now stand together by oath and treaty, their banners joined by the vows spoken before the assembled nobility."
 me_zorgoomni.96.a: "This union will be remembered for ages to come"
 me_zorgoomni.96_tooltip: "The #Y Soventeir Empire#! and #Y Aralans Kingdom#! have formed an #G Alliance#!."

 me_zorgoomni.97_title: "A Counterweight to Soventeir"
 me_zorgoomni.97_desc: "The marriage between [GetCountry('SOV').GetName|Y] and [GetCountry('ARL').GetName|Y] has obviously unsettled our court, and [ROOT.GetCountry.GetRuler.GetName|Y] has a genuine fear that many would be willing to betray [ROOT.GetCountry.GetName|Y] to our many enemies if the situation gets out of control. Whether the union between these dynasties proves ceremonial or binding, only time will tell, but [ROOT.GetCountry.GetRuler.GetFirstName|Y] has a bad feeling about it all and has not been able to sleep well at night.\n\nIf #T Aurezdun#! is to avoid isolation, we should seek a powerful neighbor willing to stand beside us before the #Y Soventeir#!-#Y Aralans#! understanding hardens into a threat."
 me_zorgoomni.97.a: "Send envoys to [SCOPE.sCountry('bre_candidate_1').GetName]."
 me_zorgoomni.97.b: "Send envoys to [SCOPE.sCountry('bre_candidate_2').GetName]."
 me_zorgoomni.97.c: "Send envoys to [SCOPE.sCountry('bre_candidate_3').GetName]."
 me_zorgoomni.97.d: "There is no suitable neighbor to approach"
 me_zorgoomni.97.e: "Aurezdun will stand alone!"

 me_zorgoomni.98_title: "Envoys from Aurezdun"
 me_zorgoomni.98_desc: "Envoys from [GetCountry('BRE').GetName|Y] have arrived with an urgent proposal. The recent #Y Soventeir#!-#Y Aralans#! marriage has stirred fears of a new power bloc, and aurezdun now seeks allies strong enough to counterbalance the threat.\n\nThey ask us to bind our realm to theirs in a formal alliance."
 me_zorgoomni.98.a: "We will stand with Aurezdun..."
 me_zorgoomni.98.b: "Their fears are not our burden"

 me_zorgoomni.99_title: "An Alliance Secured"
 me_zorgoomni.99_desc: "Our envoys have returned from #Y [SCOPE.sCountry('bre_alliance_target').GetName]#! with welcome news. Their ruler has accepted our proposal, and #T Aurezdun#! no longer faces the shifting balance of #G Morrigon#! alone."
 me_zorgoomni.99.a: "Good. We will need friends."

 me_zorgoomni.100_title: "The Proposal Rejected"
 me_zorgoomni.100_desc: "Our envoys have returned from #Y [SCOPE.sCountry('bre_alliance_target').GetName]#! empty-handed. Their ruler refused our proposal, leaving us to search elsewhere for the strength needed to answer the #Y Soventeir#!-#Y Aralans#! union."
 me_zorgoomni.100.a: "Then we must look to ourselves."

 me_zorgoomni.102_title: "The Great Earthquake of Racgerrac"
 me_zorgoomni.102_desc: "Horrific news has spread across #Y Morrigon#!. The mountain-city of [GetProvince('(int32)2994').GetName|Y], ancient seat of the #Y Merovingi#! kings, has been shattered by an earthquake of almost unimaginable violence.\n\nBuilt into the bones of the mountain chain itself, #G Racgerrac#! did not merely shake; terraces collapsed into lower streets, cliffside districts tore away from the rock, buried halls became tombs, and fires raged where broken stone trapped the living beneath the smoldering ruins. By the end of the event, which by some accounts lasted the greater part of an hour, the ancient seat of the [GetCountry('ARL').GetName|Y] had been practically destroyed.\n\nEntire families vanished in a single morning, and [SCOPE.sChar('aralans_earthquake_dead_ruler').GetName|Y] was counted among the dead after the royal halls collapsed into the mountain. Those who survived now wander through smoke and dust of their ruined city, searching in vain for loved ones buried in the rubble.\n\nThis is no passing disaster. #G Racgerrac#! will bear these wounds for a generation, and with the heart of #Y Aralans#! broken, the kingdom itself may never stand quite as tall again."
 me_zorgoomni.102.a: "A dreadful calamity!"
 me_zorgoomni.102_tt: "The ruler of the #Y Aralans Kingdom#! is killed in the #R Great Earthquake of Racgerrac#!."

 me_zorgoomni.103_title: "A Plea to Soventeir"
 me_zorgoomni.103_desc: "A month has passed since [GetProvince('(int32)2994').GetName|Y] broke beneath the earth, and the wound has only widened. The dead are still being pulled from ruined districts, the treasury groans beneath emergency levies, and frightened survivors crowd every road leading away from the shattered mountain-city. Even the royal household was not spared, and the [ROOT.GetCountry.GetName|Y] now grieves a ruler lost beneath #G Racgerrac#!'s stones.\n\nThe marriage with [GetCountry('SOV').GetName|Y] now carries a desperate weight. If the imperial court can be moved by kinship, honor, or ambition, their wealth and people may keep #Y Aralans#! from collapsing into the dust of #G Racgerrac#!."
 me_zorgoomni.103.a: "Beg Soventeir for aid...surely they will help us!"
 me_zorgoomni.103_tooltip: "#Y Soventeir will receive an event deciding whether and how to help Aralans recover.#!"

 me_zorgoomni.104_title: "Aralans Begs for Aid"
 me_zorgoomni.104_desc: "Envoys from the [GetCountry('ARL').GetName|Y] have arrived in grief-darkened robes, carrying letters sealed by ash-stained hands. [GetProvince('(int32)2994').GetName|Y], the mountain capital that many swore was the most magnificent city in all of #Y Morrigon#!, has been shattered by earthquake, and what is left of the #Y Merovingi#! court now begs us to honor the bond created by the royal marriage between our kinsmen.\n\nWe can send gold, administrators, or even families and work crews to help rebuild the stricken city. Such generosity would not be forgotten and would be a trifle for [ROOT.GetCountry.GetRuler.GetName|Y]. Refusal, however, would make the marriage look like a hollow ornament in their hour of ruin."
 me_zorgoomni.104.a: "Open the imperial treasury to assist them"
 me_zorgoomni.104.b: "Send ministers and our political support"
 me_zorgoomni.104.c: "Dispatch settlers and work crews"
 me_zorgoomni.104.d: "I shall spare no expense and rebuild the city"
 me_zorgoomni.104.e: "The Soventeir Empire owes them nothing!"

 me_zorgoomni.105_title: "Soventeir Answers"
 me_zorgoomni.105_desc: "#Y Soventeir#! has answered our plea. Imperial aid now moves toward #G Racgerrac#!: officials, supplies, wealth, and willing hands for the broken capital. No gift can restore the dead, but the living have been given a chance to endure.\n\nAmong our court, the marriage is no longer spoken of as mere ceremony. #Y Soventeir#! has acted as kin."
 me_zorgoomni.105.a: "We will remember this."

 me_zorgoomni.106_title: "Soventeir Refuses"
 me_zorgoomni.106_desc: "#Y Soventeir#! has refused our plea. Their court sends condolences, polished words, and nothing of substance while #G Racgerrac#! chokes on dust and grief.\n\nThe marriage remains, but its promise has curdled. Many in our court now ask what bond was truly forged if #Y Soventeir#! can turn away while the princess' homeland lies broken."
 me_zorgoomni.106.a: "Then we know the worth of their vows."

 me_zorgoomni.107_title: "The Seat Of Power"
 me_zorgoomni.107_desc: "[GetProvince('(int32)2994').GetName|Y] still stands, but only in grief - it is a hollowed shell of what it was, and many believe that it will never see the glory that it once enjoyed. The mountain-city that held the kingdom together is broken, its streets choked by stone, ash, and the rotting bodies of the dead. With the royal halls ruined and the old court scattered, many advisors now argue that our kingdom should relocate the capital to another city.\n\nSeveral ancient cities of the realm remain strong enough to host the court. Each carries old prestige, local loyalties, and a claim to guide our people through this generation of ruin. Yet abandoning #G Racgerrac#!, even for a time, would wound the memory of the #Y Merovingi#! seat."
 me_zorgoomni.107.a: "Move the court to [GetProvince('(int32)2984').GetName]."
 me_zorgoomni.107.b: "Move the court to [GetProvince('(int32)2871').GetName]."
 me_zorgoomni.107.c: "Move the court to [GetProvince('(int32)2818').GetName]."
 me_zorgoomni.107.d: "Move the court to [GetProvince('(int32)2849').GetName]."
 me_zorgoomni.107.e: "Racgerrac remains the heart of Aralans."
 me_zorgoomni.107_tooltip: "#Y We shall move our capital at no cost.#!"

 me_zorgoomni.108_title: "Racgerrac Rebuilt"
 me_zorgoomni.108_desc: "Ten years have passed since the earth opened beneath [GetProvince('(int32)2994').GetName|Y], and the city that once seemed doomed to remain a tomb now stirs with life again. The oldest scars remain in the mountain stone, and no family has forgotten the names lost beneath the royal halls, but the streets are no longer ruled by dust and mourning.\n\nNew homes rise where broken terraces once hung empty. #G Markets#! have returned to their old squares. Children born after the disaster now run through rebuilt avenues, knowing #G Racgerrac#! not only as a place of grief, but as a living city. The generation that endured the earthquake has carried #Y Aralans#! through its darkest decade, and at last the kingdom can begin to breathe as something whole again."
 me_zorgoomni.108.a: "Has it really been ten years since the earthquake? It only feels like yesterday"
 me_zorgoomni.108_tooltip: "#Y [GetProvince('(int32)2994').GetName]#! will lose the #R Ruins of the Great Earthquake#! modifier, and #Y Aralans#! will gain #G 5#! Stability."

me_zorgoomni.109_title: "A Harbor Beyond the Open Sea"
me_zorgoomni.109_desc: "A flotilla of [ROOT.GetCountry.GetAdjective] navigators has returned from the distant #Y [GetProvince('(int32)5939').GetName|Y] Isles#! bearing charts of a natural harbor that our sailors have discovered. The initial report is promising; the island's forests are pristine and untouched, its coves are deep enough to hide a fleet, and no settled realm presently claims its shores.\n\nThe captains have asked [ROOT.GetCountry.GetRuler.GetName|Y] for permission to send settlers to #G Ashkarun#!. With [ROOT.GetCountry.GetRuler.GetFirstName|Y]'s blessing, their meager camp could become a permanent Sea #G Elven#! colony and a harbor from which our people might explore the waters beyond."
me_zorgoomni.109.a: "Let Ashkarun become a new home for our people."
me_zorgoomni.109.b: "The voyage is too distant and too dangerous."


