l_english:
 omni_recognition_10_a:0 "Let our seal speak plainly."
 omni_recognition_10_t:0 "A Name Beneath the Seal"
 omni_recognition_10_d:0 "My [ROOT.GetCountry.GetRulerTitle], our declaration has left [ROOT.GetCountry.GetCapital.GetName|G] in a handsome leather case, accompanied by two guards and a priest who insists upon carrying it himself. We have recognized the reigning #Y Shannah#! as the spiritual head of the #T Helluvian#! faithful.\n\nThe document is remarkably brief. The arguments over which title to write first were not. Our envoy assures us that every courtesy has been observed, and that the clerks at the Shahanat will have no excuse to misplace our name.\n\nMay #T Hellas#! find this a pleasing display of unity. Our neighbours will certainly find something to say about it."
 omni_recognition_20_a:0 "Our faith does not require his permission."
 omni_recognition_20_t:0 "The Empty Place in the Register"
 omni_recognition_20_d:0 "My [ROOT.GetCountry.GetRulerTitle], the court has prepared our answer to the #Y Shannah#!. We acknowledge #T Hellas#!, the faithful, and the many learned persons who disagree with one another in His service. We do not acknowledge that every disagreement must be settled in one particular audience chamber.\n\nOur envoy read this twice before asking whether he ought to take his fastest horse. The priests at [ROOT.GetCountry.GetCapital.GetName|G] have already divided into those who praise our courage and those who would prefer to discuss it somewhere quieter.\n\nThe Shahanat will notice the empty place beside our name. Let it notice."
 omni_recognition_100_1:0 "Let his generosity mend our temple roofs."
 omni_recognition_100_2:0 "Send teachers before sending instructions."
 omni_recognition_100_3:0 "Our old customs must have a place beneath his seal."
 omni_recognition_100_leave:0 "Leave the conditions unwritten, for now."
 omni_recognition_100_t:0 "A Little Ink Between Friends"
 omni_recognition_100_d:0 "My [ROOT.GetCountry.GetRulerTitle], our scribes have reached the sentence recognizing the #Y Shannah#!. Here the quills have stopped. Not for want of ink, you understand, but because several councillors have discovered that the word #Y provided#! may be inserted into almost any declaration of loyalty.\n\nOne priest points to the temple roof, through which #T Hellas#! has lately seen rather more of the congregation than the congregation would wish. Another asks for learned teachers to strengthen the #T Inner Flame#! among our people. The keepers of our local shrines have a different concern: they would like assurance that a new seal at the Shahanat will not make their fathers' customs a crime.\n\nOur messenger is waiting. Which request shall he carry with our recognition?"
 omni_recognition_110_yes:0 "There is room beneath our seal for this."
 omni_recognition_110_no:0 "Recognition is not a market stall."
 omni_recognition_110_t:0 "A Seal With a String Attached"
 omni_recognition_110_d:0 "Your Holiness, an envoy from #Y [SCOPE.sC('omni_hc_negotiator').GetName]#! has arrived with a declaration of recognition. He has also brought a second sheet, which he describes as a small clarification. It is longer than the declaration.\n\n[SCOPE.sC('omni_hc_negotiator').Custom('omni_hc_concession_description')]\n\nThe envoy speaks warmly of #T Hellas#!, the unity of the faithful, and his ruler's profound respect for our office. He then places the clarification directly beneath our writing hand. Our clerks admire his confidence. Some of them are already preparing a refusal.\n\nWill we purchase agreement with a reasonable kindness, or teach this court that spiritual obedience is not priced by the sheet?"
 omni_recognition_120_yes:0 "Hellas is greater than this quarrel."
 omni_recognition_120_no:0 "Then his register shall do without our name."
 omni_recognition_120_close:0 "This correspondence has already been settled."
 omni_recognition_120_t:0 "The Messenger Returns With Both Sheets"
 omni_recognition_120_d:0 "My [ROOT.GetCountry.GetRulerTitle], our envoy has returned from the Shahanat. He has brought back our declaration, our request, and a painstaking account of how courteously both were refused.\n\nThe #Y Shannah#! speaks of the unity of the faithful. His clerks speak of precedent. Neither has sent what we asked for. The priest concerned with our leaking roof has expressed a view of precedent which I shall spare Your Majesty.\n\nWe must now decide whether our condition was a request between friends or a matter upon which our recognition truly depends. The messenger has not yet unpacked his saddlebag."
 omni_recognition_130_a:0 "Read the agreement before the court."
 omni_recognition_130_t:0 "The Clarification Has Acquired a Seal"
 omni_recognition_130_d:0 "My [ROOT.GetCountry.GetRulerTitle], the messenger from the Shahanat has arrived! This time his case contains a declaration bearing the #Y Shannah's#! seal, and our clarification has somehow become a solemn understanding between two devoted servants of #T Hellas#!.\n\n[SCOPE.sC('omni_hc_negotiator').Custom('omni_hc_concession_description')]\n\nOur priests are pleased, our clerks are taking copies, and the envoy who suggested the word #Y provided#! has begun to look insufferably satisfied. We have given the Shannah our recognition, and received something more useful than a lecture in return.\n\nLet the faithful hear that their rulers have found agreement. There is no need to tell them how many sheets it required."
 omni_recognition_concession_1_description:0 "Our ruler requests #Y 50 Gold#! from the Shahanat to restore the temples of our realm. The money must come from the Shahanat's treasury."
 omni_recognition_concession_1_tt:0 "Our ruler requests #Y 50 Gold#! from the Shahanat to restore the temples of our realm. The money must come from the Shahanat's treasury.\nIf accepted, grant full recognition and add 2 Authority, subject to the accession cap. AI acceptance starts at 50%; Generous +15, Trusting +10, Righteous +10, Miserly -15, Proud -10, Suspicious -10 percentage points. Clamped to 10–90%. War forces refusal; a gold request also fails if the Shahanat cannot afford it. A human Shannah chooses freely. One negotiation per Shannah; no Favor is spent.\nCurrent AI acceptance: #Y [GuiScope.SetRoot( ROOT.GetCountry.MakeScope ).ScriptValue('omni_hc_negotiation_acceptance_1')|0]%#!. The chance is recalculated when the AI answers."
 omni_recognition_concession_2_description:0 "Our ruler requests a mission of learned priests. For #Y five years#!, their teaching will increase our realm's conversion speed by #G 10%#!."
 omni_recognition_concession_2_tt:0 "Our ruler requests a mission of learned priests. For #Y five years#!, their teaching will increase our realm's conversion speed by #G 10%#!.\nIf accepted, grant full recognition and add 2 Authority, subject to the accession cap. AI acceptance starts at 60%; Generous +15, Trusting +10, Righteous +10, Miserly -15, Proud -10, Suspicious -10 percentage points. Clamped to 10–90%. War forces refusal; a gold request also fails if the Shahanat cannot afford it. A human Shannah chooses freely. One negotiation per Shannah; no Favor is spent.\nCurrent AI acceptance: #Y [GuiScope.SetRoot( ROOT.GetCountry.MakeScope ).ScriptValue('omni_hc_negotiation_acceptance_2')|0]%#!. The chance is recalculated when the AI answers."
 omni_recognition_concession_3_description:0 "Our ruler requests a written protection of local religious customs. For #Y five years#!, this settlement will grant #G 5% happiness#! to pops of our state religion."
 omni_recognition_concession_3_tt:0 "Our ruler requests a written protection of local religious customs. For #Y five years#!, this settlement will grant #G 5% happiness#! to pops of our state religion.\nIf accepted, grant full recognition and add 2 Authority, subject to the accession cap. AI acceptance starts at 40%; Generous +15, Trusting +10, Righteous +10, Miserly -15, Proud -10, Suspicious -10 percentage points. Clamped to 10–90%. War forces refusal; a gold request also fails if the Shahanat cannot afford it. A human Shannah chooses freely. One negotiation per Shannah; no Favor is spent.\nCurrent AI acceptance: #Y [GuiScope.SetRoot( ROOT.GetCountry.MakeScope ).ScriptValue('omni_hc_negotiation_acceptance_3')|0]%#!. The chance is recalculated when the AI answers."
 omni_recognition_condition_tt:0 "Negotiate one concession per Shannah. Choosing or cancelling terms uses this opportunity. Existing conditional declarations may negotiate once. No Favor cost."
 omni_recognition_unspecified:0 "The terms have not yet been written."
 omni_recognition_recognized_tt:0 "Your recognition is recorded. The Shahanat gains 2 Authority, subject to the accession cap. No Gold or Favor is charged. This acknowledgment repeats no effects."
 omni_recognition_contested_tt:0 "Your opposition is recorded. The Shahanat loses 2 Authority, subject to the accession cap. This acknowledgment repeats no effects."
 omni_recognition_accept_tt:0 "Grant the requested concession once. The petitioner grants full recognition, adding 2 Authority subject to the accession cap. A temple grant costs your treasury 50 Gold; the other concessions create the stated five-year modifier in the petitioner's realm."
 omni_recognition_refuse_tt:0 "Grant no concession. The petitioner must choose recognition without concessions or opposition. No Gold or Favor is charged."
 omni_recognition_fallback_yes_tt:0 "Grant full recognition without a concession. Add 2 Authority, subject to the accession cap."
 omni_recognition_fallback_no_tt:0 "Contest the accession after refusal. Remove 2 Authority, subject to the accession cap."
 omni_recognition_settlement_tt:0 "The concession has already been granted. Full recognition is recorded. Closing this event grants nothing again."
 omni_hc_negotiated_mission:0 "Teachers Beneath the Seal"
 omni_hc_negotiated_mission_desc:0 "A mission of religious teachers was secured as a condition of recognizing the reigning Shannah."
 omni_hc_local_customs:0 "The Customs Beneath Our Roof"
 omni_hc_local_customs_desc:0 "The Shannah has acknowledged local religious customs in a negotiated recognition settlement."
