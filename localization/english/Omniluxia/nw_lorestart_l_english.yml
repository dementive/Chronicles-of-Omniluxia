 lorestart.36.t: "The Saurthi Scale-Kings"
 lorestart.36.desc: "The #E Saurthi#! are the oldest of the New World races, born from the primordial swamps when the world was still young. Cold-blooded and patient, they possess an innate wisdom accumulated over millennia of watchful existence. Their scaled hides grant them resilience, though they breed slower than the younger races.\n\nThe Saurthi trace their bloodline to the legendary #E First Scale#!, the original Lizard King who emerged from the mists of prehistory to unite the scattered swamp-tribes under one rule. Those who carry the #E Blood of the First Scale#! are said to be direct descendants of this primordial monarch, their authority rooted in an unbroken lineage stretching back to the dawn of creation itself.\n\nToday, the Saurthi kingdoms of the New World squabble amongst themselves for dominance over the ancient nesting grounds and the sacred spawning-pools that dot the great wetlands. Should a worthy ruler unite the scattered kazthan and volssk tribes under one banner, the #E Scale-Kings#! might once again remind the younger races why the Saurthi were the first to claim dominion over this verdant continent.\n\nFrom their fetid swamps and mist-shrouded forests, the Saurthi watch and wait - for they have learned that patience is the greatest weapon of all."
 lorestart.36.a: "The fate of Omniluxia is now in our hands."

 lorestart.37.t: "The Chivix Hive-Minds"
 lorestart.37.desc: "The #E Chivix#! are the insectoid people of the New World, bound together by the collective consciousness of the Hive Concord. Industrious and organized, their society functions with the seamless efficiency of a well-tended hive, each individual knowing their place and purpose from the moment of their hatching.\n\nThe Chivix trace their bloodline to the ancient #E Hive Queens#! that first established order from chaos in the great insectoid colonies of the New World. The descendants of these ancient matriarchs carry within them the collective memory and unity of purpose that allowed their people to build great cities where only wilderness once stood. The #E Blood of the Hive Queen#! pulses through the veins of their rulers, connecting them to the endless chorus of chittering voices that make up Chivix civilization.\n\nWhile their numbers grow swiftly, individual Chivix live shorter lives than most other races - but what they lack in longevity, they make up for in purpose and unity. From the teeming hives of the chivixi to the sturdy mantheen fortresses and the far-ranging hkkru hunting parties, the Chivix seek to expand the reach of the Concord across the New World.\n\nThe question is not whether the Hive will grow, but whose will shall guide it."
 lorestart.37.a: "The fate of Omniluxia is now in our hands."

 lorestart.38.t: "The Ayrith Sky-Lords"
 lorestart.38.desc: "The #E Ayrithi#! are the winged elves of the New World, graceful beings whose dominion over the high mountain aeries has remained unchallenged since time immemorial. Blessed with keen intellect and natural charisma, they soar above the concerns of lesser beings, their long lives dedicated to art, magic, and the governance of the sky-realms.\n\nThe Ayrithi have ruled the skies of the New World since before the first ships of the Old World breached the horizon, their great aeries perched atop the highest peaks. The #E Blood of the High Aerie#! marks those who descend from the first Winged Lords that forged covenants with the winds themselves, binding their lineage to the sovereignty of the mountain-fastnesses. To carry this blood is to command the respect of the sky itself.\n\nWith their majestic winged forms and ancient traditions, the Ayrithi kingdoms of the condar, skrael, and ayrithi peoples now face a changing world. New threats and opportunities emerge from beyond the horizon, and the Sky-Lords must decide whether to remain perched in their lofty eyries or to once again take flight and remind all beneath them of the power of the #E High Aerie#!."
 lorestart.38.a: "The fate of Omniluxia is now in our hands."

 lorestart.39.t: "The Mycelar Root-Kings"
 lorestart.39.desc: "The #E Mycelar#! are the fungus-folk of the New World, living beings whose consciousness is intertwined with the great fungal networks that pulse beneath the earth. They are deeply spiritual and patient, their slow, deliberate movements belying a profound connection to the living world. Their resilience is legendary, though they reproduce at a glacial pace.\n\nThe Mycelar are one with the great fungal networks that pulse beneath the New World, their consciousness intertwined with the living earth. Those who carry the #E Blood of the Deep Mycelium#! are recognized as the living avatars of the Great Mycelium itself, their authority as natural and unassailable as the roots of the oldest fungus-fields. Every sporn and verdhan knows that to defy the Deep Mycelium is to defy the very will of the world.\n\nIn their subterranean cities and fungal forests, the Mycelar cultivate the slow growth of their civilization with the patience of those who measure time in centuries rather than years. Their connection to the #E Great Mycelium#! makes them wise beyond the reckoning of shorter-lived races, and their fungal networks stretch across the New World, carrying secrets and whispers through the dark earth.\n\nLet the younger races scurry and burn bright - the Mycelar will endure, as they have always endured, growing silently beneath the feet of empires."
 lorestart.39.a: "The fate of Omniluxia is now in our hands."

 lorestart.40.t: "The Tsaalan Dragon-Dynasties"
 lorestart.40.desc: "The #E Tsaalan#! are the dragon-kin of the New World, a proud people who read fate in the shifting dunes and ride the desert winds as easily as the sea. Possessed of an imposing presence and natural martial prowess, they are born to rule the endless sands. Their draconic heritage grants them resilience, though their numbers grow slowly.\n\nThe Tsaalan claim descent from the ancient #E Dragon Emperors#! that once ruled the eastern reaches of the New World with scales of gold and breath of fire. The blood of these majestic beings flows strong in the veins of their heirs, granting them the right to command the lesser draconic kin and demand tribute from all who would oppose them. The #E Blood of the Dragon Emperor#! burns in the hearts of the Tsaalan nobility, a fiery legacy that fuels their ambition.\n\nFrom their desert fortresses and oasis-cities, the Tsaalan dynasties of the qadiir and solani peoples watch the stars and the sands for omens of their destiny. The shifting dunes conceal ancient ruins of their dragon-ancestors, secrets waiting to be uncovered by those bold enough to seek them.\n\nThe Dragon-Dynasties remember the glory of their scaled forebears - and they will not rest until the world remembers too."
 lorestart.40.a: "The fate of Omniluxia is now in our hands."

 lorestart.41.t: "The Vothkin Stone-Forge"
 lorestart.41.desc: "The #E Vothkin#! are the deep-dwelling dwarves of the New World, a steadfast people who carve their cities into the bones of mountains and bind their oaths in stone and blood. Hardy and skilled in the arts of war and craft, they are as unyielding as the rock they call home. Their deep-holds are fortresses unbreachable, but their numbers grow slow even by dwarven measure.\n\nThe Vothkin were hewn from the living rock of the New World's deepest mountains, their ancestors taught by the earth itself to shape stone and metal into works of wonder. The #E Blood of the Stone Forge#! passes from master to apprentice, father to son, carrying the sacred knowledge of the deep delvings and the ancient runes of power. Each Vothkin ruler bears the weight of this legacy, bound by oaths carved in stone before their ancestors first learned to shape it.\n\nFrom the volthari highlands to the grimmel mountain-halls and the vast vothkini subterranean cities, the Vothkin kingdoms stand as bulwarks of tradition and craftsmanship in a rapidly changing world. Their forges burn day and night, their rune-smiths labor over ancient techniques, and their warriors stand ready to defend the deep places of the earth.\n\nThe mountain remembers all who have come and gone - and the Vothkin intend to be remembered."
 lorestart.41.a: "The fate of Omniluxia is now in our hands."

 lorestart.42.t: "The Ulvenar Moon-Packs"
 lorestart.42.desc: "The #E Ulvenar#! are the wolf-kin of the New World, savage hunters who answer the call of the twin moons. Fierce and relentless in battle, they fight with a primal ferocity that terrifies their enemies. Their packs roam the untamed wilds, bound by loyalty to the pack leader alone. Yet their savage nature makes them unwelcome in the courts of civilized folk.\n\nWhen the twin moons of the New World rise, the Ulvenar answer the call of their wild ancestors. The #E Blood of the Moonhowl#! is a savage gift passed down from the first hunters that tamed the primal wilderness, marking its bearers as the chosen chieftains of the great packs that roam the untamed lands. To carry this blood is to feel the pull of the hunt with every rising moon.\n\nThe Ulvenar tribes, both ulvenari and garruk, live by the law of fang and claw, where strength determines leadership and the weak are culled without mercy. Their howls echo across the moonlit plains and through the dark forests, a constant reminder that civilization is but a thin veneer over the primal savagery that lies beneath.\n\nIn the Ulvenar territories, the hunt never ends - and the pack howls eternal."
 lorestart.42.a: "The fate of Omniluxia is now in our hands."

 lorestart.43.t: "The Selkanu Tide-Watchers"
 lorestart.43.desc: "The #E Selkanu#! are the tide-folk of the New World, born from the first waves and most at home upon the endless waters. Their fleets command the seas and their merchants grow rich on the trade winds that carry them from port to port. Graceful and persuasive, they navigate both ocean currents and diplomatic waters with equal ease.\n\nThe Selkanu emerged from the deep oceans of the New World, their cities built in harmony with the eternal rhythm of the tides. The #E Blood of the Tide Mother#! grants its bearers dominion over the coastal waters and the creatures that dwell within, marking them as the rightful stewards of the boundless blue realms. From this bloodline flows the authority to command the Selkanu fleets that ply the great oceans.\n\nThe coral cities and pearl-towers of the Selkanu and maru peoples rise from the coastal waters like the spires of a drowned kingdom, beautiful and alien to land-bound eyes. Their ships are swift, their nets ever full, and their understanding of the ocean's moods is unmatched by any other race of the New World.\n\nAs the tides ebb and flow, so too does the influence of the Tide-Watchers - and the ocean remembers all debts."
 lorestart.43.a: "The fate of Omniluxia is now in our hands."

 lorestart.44.t: "The Khedrim Ember-Forged"
 lorestart.44.desc: "The #E Khedrim#! are the ember-forged of the New World, a people shaped by fire and flame in the volcanic heart of the continent. Master smiths and fearless warriors, they clad themselves in the finest steel and march to war behind shields gleaming with the heat of their forges. Their lands may be harsh and their children few, but those who survive are tempered like the finest blade.\n\nDeep within the volcanic forges of the New World, the Khedrim were forged in flame and fury. The #E Blood of the Burning Heart#! beats with the fire of the world's core, passed down through generations of master smiths and warrior-kings whose skill at the anvil is matched only by their prowess on the battlefield. This fire-touched blood burns bright against the ravages of age, granting the Khedrim rulers long life and fiery ambition.\n\nThe Khedrim kingdoms of the khedrimi and pyrran peoples hug the volcanic ranges of the New World, their fortress-cities built into the slopes of active volcanoes where the heat of the earth fuels their ever-burning forges. Their steel is prized across the continent, their warriors feared on every battlefield.\n\nForged in flame, tempered by conflict, the Khedrim await only the spark that will ignite their conquest."
 lorestart.44.a: "The fate of Omniluxia is now in our hands."

 lorestart.45.t: "The Tenmari Shadow-Throne"
 lorestart.45.desc: "The #E Tenmari#! are the shadow-dwellers of the New World, masters of intrigue and commerce who built the first cities of jade and gold in the twilight realms beneath the sun. Cunning and ambitious, they weave webs of influence that span continents, binding the conquered to their will with silk and coin. Yet so sprawling an empire tires easily of war.\n\nThe Tenmari dwell in the twilight realms beneath the New World, where the light of the sun dares not trespass. The #E Blood of the Shadowed Throne#! marks those who descend from the first Dark Lords that carved kingdoms from the endless caverns, their cunning and ambition as boundless as the darkness they command. To sit upon the Shadowed Throne is to command the unseen, to pull the strings of fate itself.\n\nThe Tenmari cities of the tenmarii and soluun peoples are marvels of shadowed architecture, built in vast underground caverns illuminated by glowing crystals and magical fires. Their merchants ply the surface trade routes, their spies whisper in the courts of foreign powers, and their armies emerge from the darkness when least expected.\n\nLet those who dwell in the light enjoy their brief moment - the shadows are patient, and the Shadowed Throne endures."
 lorestart.45.a: "The fate of Omniluxia is now in our hands."

 