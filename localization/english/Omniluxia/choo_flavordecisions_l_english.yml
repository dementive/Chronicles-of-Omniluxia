l_english:

# Flavor Decisions
reconquer_jerusalem: "Reconquer Hashamñax"
reconquer_jerusalem_desc: "The second holiest city in #E Zainudianism#!, #E Hashamñax#!, as #E Zain'ud#! called it, was where the prophets recieved the #E Second Revelation#!, and where #E Zain'ud#! instructed them to retake in his name. By reclaiming it from the heretical #E #R Helluvians#!#! we have fulfilled #E Zain'ud#!'s wishes and won a great victory over the believers of the false prophet!"

become_pope: "Claim the Shahanat"
become_pope_desc: "Despite their relatively weak authority, the #E Shannah#! is still a very influential figure amongst the #E Helluvians#!. Claiming legitimacy from the #E Pouirruipa the Follower#!, the first #E Shannah#! of the #E Helluvians#!, the #E Shannah#! is said to interpret #E Hellas#!' wishes and serve as a mediator between his followers.\n\nHowever, there are a sizeable number who suspect #E #R Su-Shrra#!#!'s temptations have corrupted the recent #E Shannahs#!. Hungry for power and lavishly spending donations on vanity projects such as the #E Apostolic Palace#!, it is clear that the #E Shannahs#! of [GetProvince('(int32)2706').GetName|Y] are unfit to lead the #E Helluvian#! faithful!\n\nThe time has come to claim the #E Shahanat#! for ourselves and protect #E Hellas#!' children from the pagans and heretics who seek to corrupt his word!"

become_pharon: "Claim The Pharonic Title"
become_pharon_desc: "If we possess the historic capitals of the ancient Baetep, then we have the right to proclaim ourselves to be the True Pharons of that antique land."

reconquered_jerusalem_mod: "Hashamñax Reclaimed"
reconquered_jerusalem_mod_desc: "The second Holiest city in #E Zainudianism#!, #E Hashamñax#!, as #E Zain'ud#! called it, was where the prophets recieved the #E Second Revelation#!, and where #E Zain'ud#! instructed them to retake in his name. By reclaiming it from the heretical #E #R Helluvians#!#! we have fulfilled #E Zain'ud#!'s wishes and won a great victory over the believers of the false prophet!"

shannah_crusade: "Call For A Crusade"
shannah_crusade_desc: "The Shannah will offer prayers and supplications to mighty #E Hellas#! in hopes of determining the wishes of the #E Creator of All Things That Can Never Be Known#!. While the will of the #E Great Father#! is often mysterious and difficult to comprehend, one thing is crystal clear; we cannot allow our enemies to dishonor our god."
shannah_crusade_call_tt: "Our #Y Shannah#! will call for a #R Crusade#! against a neighboring country."


# Building Decisions
omniluxia_build_kaxud: "Build Kaxud"
omniluxia_build_kaxud_desc: "When the #E Prophets#! first arrived amongst the #E Zinduidians#!, they were housed by local shamans in the various #E Kaxuds#! found across the land.\n\nOver the decades, these traditional centers of medicine and worship were transformed from mobile shamanic tents into elaborate sandstone buildings that are at the heart of any #E Zainudian#! community."

omniluxia_build_hold: "Build Hold"
omniluxia_build_hold_desc: "During the #E Dwarven Golden Age#! millions of dwarves lived in huge megacities that stretched for miles underground now known as #E Holds#!. While this is no longer the case, the few remaining #E Holds#! that exist continue to be centers of dwarven culture and power.\n\nWhile the methods used to create #E Holds#! on the scale seen during the #E Rule of the Twins#! has been lost, we have recovered enough knowledge that we theoretically could create a similar city if we invested the resources into it."

omniluxia_build_huon_lop_reuoc: "Build Huon-Lop Reuoc"
omniluxia_build_huon_lop_reuoc_desc: "Known as 'Palaces of Tranquility', Huon-Loc Reuocs are massive temples made of stone or marble that serve as centers for High Elven religious life. The temple's various levels allow for the separation of the classes to allow nobles to meditate without the distractions created by the masses, while the commoners use the space to gather and host large feasts and festivals."

omniluxia_build_vampiric_shrine: "Build Catacombs"
omniluxia_build_vampiric_shrine_desc: "Ever since the emergence of #E Yedidyhan#!, massive catacombs have provided a space for urban vampires to gather and worship right under the noses of the unsuspecting mortals. For this reason, nearly every major city across #E Omniluxia#! with a vampiric prescence has secret tunnels that connect the city."

is_on_omni_raid_tt: "Has not gone on a raid in the last 5 years."
is_on_omni_joust_tt: "Can afford the tournament costs."
is_omni_vampire_tt: "Has not indulged in vampiric activities within the last 5 years."

become_monastic_order: "Become Monastic Order"
become_monastic_order_desc: "Those above require dedicated knights to protect their worship throughout our mortal realm."
become_feudal_monarchy: "Adopt Feudal Monarchy"
become_feudal_monarchy_desc: "In order to maintain stability and bring peace to our lands we should adopt a feudal system of governance that serves both the nobility and the peasantry."
proclaim_merchant_republic: "Become Merchant Republic"
proclaim_merchant_republic_desc: "Wouldn't the world be so much better if we had all the money?"

