 #Khedrim 1
 khedrim_iron_legion_path_1:0 "Legion Drill"
 khedrim_iron_legion_path_1_desc:0 "Khedrim soldiers drill in strict formation from their earliest years, forming the backbone of a disciplined legion."
 khedrim_iron_legion_path_2:0 "Tax of the Sword"
 khedrim_iron_legion_path_2_desc:0 "Khedrim conquest is traditionally followed by efficient, well-organized taxation of the newly won lands."
 khedrim_iron_legion_path_3:0 "Forge Quotas"
 khedrim_iron_legion_path_3_desc:0 "Every khedrim smithy owes a quota of arms and armor to the state, ensuring a well-equipped legion."
 khedrim_iron_legion_path_4:0 "Standard Bearers"
 khedrim_iron_legion_path_4_desc:0 "Khedrim legions march behind proud standards, rallying points that steady the resolve of every soldier."
 khedrim_iron_legion_path_5:0 "Census and Levy"
 khedrim_iron_legion_path_5_desc:0 "Regular khedrim census-taking allows the state to levy troops with ruthless efficiency."
 khedrim_iron_legion_path_6:0 "Slow Growth, Sure Strength"
 khedrim_iron_legion_path_6_desc:0 "The khedrim prize martial and administrative strength over raw population, a trade many consider worthwhile."
 khedrim_iron_legion_path_7:0 "March in Step"
 khedrim_iron_legion_path_7_desc:0 "The khedrim legion system allows rapid replenishment of losses from a well-organized reserve."
 khedrim_iron_legion_path_end_bonus:0 "Mastery of the Iron Legion"
 khedrim_iron_legion_path_end_bonus_desc:0 ""

 #Khedrim 2
 khedrim_imperial_writ_path_1:0 "Writ of Conquest"
 khedrim_imperial_writ_path_1_desc:0 "Khedrim scribes are practiced in drafting the legal writs that justify a legion's march."
 khedrim_imperial_writ_path_2:0 "Provincial Governors"
 khedrim_imperial_writ_path_2_desc:0 "Khedrim governors are trained from youth in the administration of newly conquered provinces."
 khedrim_imperial_writ_path_3:0 "Siege Engineers"
 khedrim_imperial_writ_path_3_desc:0 "Khedrim engineering corps are renowned for reducing enemy walls with methodical, overwhelming force."
 khedrim_imperial_writ_path_4:0 "Grain Tribute"
 khedrim_imperial_writ_path_4_desc:0 "Conquered provinces owe the khedrim state a tribute of grain, sustaining the legions on campaign."
 khedrim_imperial_writ_path_5:0 "Iron Discipline"
 khedrim_imperial_writ_path_5_desc:0 "Khedrim discipline is legendary, with punishment for breaking formation more feared than the enemy itself."
 khedrim_imperial_writ_path_6:0 "Toll of Empire"
 khedrim_imperial_writ_path_6_desc:0 "Maintaining the sprawling khedrim legions is costly, though the state considers it the price of order."
 khedrim_imperial_writ_path_7:0 "The Unbroken Line"
 khedrim_imperial_writ_path_7_desc:0 "A khedrim legion is trained never to break formation, no matter the cost, a discipline that has won many desperate battles."
 khedrim_imperial_writ_path_end_bonus:0 "Mastery of the Imperial Writ"
 khedrim_imperial_writ_path_end_bonus_desc:0 ""


