 #Tenmari 1
 tenmari_open_road_path_1:0 "Caravan Guilds"
 tenmari_open_road_path_1_desc:0 "Tenmari caravan guilds link distant markets, spreading both goods and tenmari influence."
 tenmari_open_road_path_2:0 "Welcoming Gates"
 tenmari_open_road_path_2_desc:0 "Tenmari cities are famed for the speed with which newcomers are woven into civic life."
 tenmari_open_road_path_3:0 "Diplomatic Corps"
 tenmari_open_road_path_3_desc:0 "A well-trained corps of tenmari diplomats works tirelessly to soften the perception of their state's ambitions."
 tenmari_open_road_path_4:0 "Market Levies"
 tenmari_open_road_path_4_desc:0 "A small levy on tenmari market transactions quietly funds the upkeep of their armies."
 tenmari_open_road_path_5:0 "Scribes and Ledgers"
 tenmari_open_road_path_5_desc:0 "Meticulous tenmari record-keeping ensures the state collects its due with minimal waste."
 tenmari_open_road_path_6:0 "Traveling Recruiters"
 tenmari_open_road_path_6_desc:0 "Tenmari recruiters travel the trade roads, drawing soldiers from every community the caravans touch."
 tenmari_open_road_path_7:0 "Guest Right"
 tenmari_open_road_path_7_desc:0 "The tenmari tradition of guest-right extends genuine hospitality to foreigners living under their rule."
 tenmari_open_road_path_end_bonus:0 "Mastery of the Open Road"
 tenmari_open_road_path_end_bonus_desc:0 ""

 #Tenmari 2
 tenmari_long_peace_path_1:0 "War Weariness"
 tenmari_long_peace_path_1_desc:0 "A people who prize trade over conquest tire of prolonged warfare faster than more martial cultures."
 tenmari_long_peace_path_2:0 "Mercenary Contracts"
 tenmari_long_peace_path_2_desc:0 "Tenmari merchant houses maintain standing contracts with mercenary companies, ready to hire on short notice."
 tenmari_long_peace_path_3:0 "Escort Companies"
 tenmari_long_peace_path_3_desc:0 "Trade caravans travel with dedicated escort companies, well-practiced at defending against raiders."
 tenmari_long_peace_path_4:0 "Neutral Ground"
 tenmari_long_peace_path_4_desc:0 "Many tenmari fortifications double as neutral trading posts, offsetting their upkeep with toll revenue."
 tenmari_long_peace_path_5:0 "Silver Tongues"
 tenmari_long_peace_path_5_desc:0 "Tenmari negotiators are skilled at finding a legal, bloodless path to territorial ambition where one exists."
 tenmari_long_peace_path_6:0 "Roads Well Traveled"
 tenmari_long_peace_path_6_desc:0 "Tenmari armies benefit from generations of accumulated knowledge of trade routes and safe passages."
 tenmari_long_peace_path_7:0 "Prosperity's Shield"
 tenmari_long_peace_path_7_desc:0 "A prosperous tenmari populace has much to defend, and fights with unexpected tenacity to protect it."
 tenmari_long_peace_path_end_bonus:0 "Mastery of the Long Peace"
 tenmari_long_peace_path_end_bonus_desc:0 ""

