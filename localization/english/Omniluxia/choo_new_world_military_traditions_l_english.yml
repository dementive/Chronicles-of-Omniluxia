l_english:

 saurthi_philosophy:0 "Saurthi Traditions"
 saurthi_philosophydesc:0 ""
 saurthi_philosophy_start_bonus:0 "The Saurthi Way of War"
 saurthi_philosophy_start_bonus_desc:0 ""

 #Saurthi 1
 saurthi_marsh_stalkers_path_1:0 "Reed-Blind Ambush"
 saurthi_marsh_stalkers_path_1_desc:0 "Saurthi hunting bands learn from birth to strike from beneath the waterline reeds, vanishing before a foe can raise a spear."
 saurthi_marsh_stalkers_path_2:0 "Sure Feet, Sure Strike"
 saurthi_marsh_stalkers_path_2_desc:0 "Generations spent stalking prey through bog and fen have made the saurthi nearly untouched by the terrain that mires other armies."
 saurthi_marsh_stalkers_path_3:0 "Venom-Tipped Spears"
 saurthi_marsh_stalkers_path_3_desc:0 "Coating spearheads in the toxins of marsh creatures, saurthi warriors know a single graze can turn the tide of a skirmish."
 saurthi_marsh_stalkers_path_4:0 "Cold Patience"
 saurthi_marsh_stalkers_path_4_desc:0 "The saurthi metabolism, slow and steady, lets war parties endure long campaigns on meagre rations others could not survive."
 saurthi_marsh_stalkers_path_5:0 "Chorus of the Deep Woods"
 saurthi_marsh_stalkers_path_5_desc:0 "Trained hunters loose arrows in coordinated volleys signalled by the calls of the swamp itself."
 saurthi_marsh_stalkers_path_6:0 "Skin of Stone and Scale"
 saurthi_marsh_stalkers_path_6_desc:0 "Hardened hide, treated with river clay, turns aside blows that would fell softer-skinned soldiers."
 saurthi_marsh_stalkers_path_7:0 "The Long Hunt"
 saurthi_marsh_stalkers_path_7_desc:0 "A culture that measures a warrior's worth by patience as much as ferocity recovers swiftly from the losses of war."
 saurthi_marsh_stalkers_path_end_bonus:0 "Mastery of the Marsh-Stalkers"
 saurthi_marsh_stalkers_path_end_bonus_desc:0 ""

 #Saurthi 2
 saurthi_coldblood_covenant_path_1:0 "Basking Grounds"
 saurthi_coldblood_covenant_path_1_desc:0 "Sacred basking-grounds where the young are raised communally help offset the slow saurthi birthrate."
 saurthi_coldblood_covenant_path_2:0 "Clutch-Bond Loyalty"
 saurthi_coldblood_covenant_path_2_desc:0 "Saurthi war-leaders who hatched from the same clutch fight for each other before all else."
 saurthi_coldblood_covenant_path_3:0 "Ambush Doctrine"
 saurthi_coldblood_covenant_path_3_desc:0 "Saurthi war-bands are drilled from childhood in the doctrine of the sudden strike and the vanishing retreat."
 saurthi_coldblood_covenant_path_4:0 "Bog Iron Forges"
 saurthi_coldblood_covenant_path_4_desc:0 "Ore drawn from the marsh beds is smelted into crude but serviceable weapons for the saurthi levies."
 saurthi_coldblood_covenant_path_5:0 "Whispered Councils"
 saurthi_coldblood_covenant_path_5_desc:0 "The saurthi elders trade old grudges and border disputes in whispered council long before war is declared."
 saurthi_coldblood_covenant_path_6:0 "Second Skin"
 saurthi_coldblood_covenant_path_6_desc:0 "Saurthi warriors shed and re-harden their hide-armor seasonally, always presenting a fresh defense to their enemies."
 saurthi_coldblood_covenant_path_7:0 "The Endless Marsh"
 saurthi_coldblood_covenant_path_7_desc:0 "No invader has ever mapped the true extent of the saurthi marshlands, and their fortifications are built cheaply upon ground only they understand."
 saurthi_coldblood_covenant_path_end_bonus:0 "Mastery of the Coldblood Covenant"
 saurthi_coldblood_covenant_path_end_bonus_desc:0 ""


 chivix_philosophy:0 "Chivix Traditions"
 chivix_philosophydesc:0 ""
 chivix_philosophy_start_bonus:0 "The Chivix Way of War"
 chivix_philosophy_start_bonus_desc:0 ""

 #Chivix 1
 chivix_great_brood_path_1:0 "Brood Halls"
 chivix_great_brood_path_1_desc:0 "Vast communal brood halls raise the chivix young together, swelling the ranks of every generation."
 chivix_great_brood_path_2:0 "Open Hearths"
 chivix_great_brood_path_2_desc:0 "Conquered peoples are welcomed to the chivix hearth-fires and made kin within a generation."
 chivix_great_brood_path_3:0 "Kinship Oaths"
 chivix_great_brood_path_3_desc:0 "A chivix soldier fights beside dozens of blood relations, and shame before kin is a fiercer motivator than any officer's lash."
 chivix_great_brood_path_4:0 "Tribute of Youth"
 chivix_great_brood_path_4_desc:0 "Every chivix clan sends its strongest youths to replenish the war-bands after each campaign."
 chivix_great_brood_path_5:0 "The Broodmother's Word"
 chivix_great_brood_path_5_desc:0 "Generals who serve the broodmothers well are remembered in clan-song for generations."
 chivix_great_brood_path_6:0 "Many Hands"
 chivix_great_brood_path_6_desc:0 "Sheer weight of numbers lets chivix heavy infantry overwhelm smaller, more disciplined foes."
 chivix_great_brood_path_7:0 "Adoption Rites"
 chivix_great_brood_path_7_desc:0 "Newly adopted peoples are ritually bound into the chivix family, easing their integration into the state."
 chivix_great_brood_path_end_bonus:0 "Mastery of the Great Brood"
 chivix_great_brood_path_end_bonus_desc:0 ""

 #Chivix 2
 chivix_market_kin_path_1:0 "Trade-Kin Networks"
 chivix_market_kin_path_1_desc:0 "Chivix merchant-clans maintain trade relationships across dozens of settlements, bound by blood rather than contract."
 chivix_market_kin_path_2:0 "Barter Levy"
 chivix_market_kin_path_2_desc:0 "Soldiers are paid partly in barter goods from clan stores, easing the burden on the treasury."
 chivix_market_kin_path_3:0 "Clan Muster"
 chivix_market_kin_path_3_desc:0 "When the horns sound, entire chivix clans muster as a single fighting unit, fighting with practiced cohesion."
 chivix_market_kin_path_4:0 "Communal Granaries"
 chivix_market_kin_path_4_desc:0 "Shared granaries between allied clans ensure no chivix war-band marches hungry."
 chivix_market_kin_path_5:0 "Hearth-Fire Diplomacy"
 chivix_market_kin_path_5_desc:0 "Chivix diplomats invoke shared kinship to soften the sting of conquest in the eyes of neighboring clans."
 chivix_market_kin_path_6:0 "Bloodline Records"
 chivix_market_kin_path_6_desc:0 "Meticulous chivix bloodline-keepers can produce a claim of kinship to nearly any throne in the region."
 chivix_market_kin_path_7:0 "The Ever-Growing Brood"
 chivix_market_kin_path_7_desc:0 "The chivix believe that a great people is measured by the size of its brood, and they breed accordingly."
 chivix_market_kin_path_end_bonus:0 "Mastery of the Kin of the Marketplace"
 chivix_market_kin_path_end_bonus_desc:0 ""


 ayrith_philosophy:0 "Ayrith Traditions"
 ayrith_philosophydesc:0 ""
 ayrith_philosophy_start_bonus:0 "The Ayrith Way of War"
 ayrith_philosophy_start_bonus_desc:0 ""

 #Ayrith 1
 ayrith_windrunner_path_1:0 "Windrunner Scouts"
 ayrith_windrunner_path_1_desc:0 "Ayrith scouts are chosen young for their speed and trained to cross open country faster than any cavalry."
 ayrith_windrunner_path_2:0 "Feathered Fletching"
 ayrith_windrunner_path_2_desc:0 "Ayrith fletchers craft arrows from the plumage of highland birds, prized for their unmatched accuracy."
 ayrith_windrunner_path_3:0 "Skyline Signals"
 ayrith_windrunner_path_3_desc:0 "Mirror-flashes and banner-signs let ayrith war-bands coordinate strikes across great distances."
 ayrith_windrunner_path_4:0 "Longbow Tradition"
 ayrith_windrunner_path_4_desc:0 "Every ayrith child is given a bow before a blade, and the longbow remains the soul of their armies."
 ayrith_windrunner_path_5:0 "Light on the Land"
 ayrith_windrunner_path_5_desc:0 "Ayrith armies travel light, carrying only what the wind-swept highlands can spare."
 ayrith_windrunner_path_6:0 "Running Volleys"
 ayrith_windrunner_path_6_desc:0 "Ayrith archers loose and reposition in a single fluid motion, a technique drilled since childhood."
 ayrith_windrunner_path_7:0 "Highland Relay"
 ayrith_windrunner_path_7_desc:0 "A network of highland runners keeps ayrith war-bands supplied with fresh levies even far from home."
 ayrith_windrunner_path_end_bonus:0 "Mastery of the Windrunners"
 ayrith_windrunner_path_end_bonus_desc:0 ""

 #Ayrith 2
 ayrith_open_sky_path_1:0 "Unwalled Villages"
 ayrith_open_sky_path_1_desc:0 "The ayrith traditionally distrust walls, believing them a cage; what fortifications they do build are costly afterthoughts."
 ayrith_open_sky_path_2:0 "Sky Burial Rites"
 ayrith_open_sky_path_2_desc:0 "Fallen ayrith warriors are given to the open sky, and none who witness the rite fight for revenge alone."
 ayrith_open_sky_path_3:0 "Wandering Herds"
 ayrith_open_sky_path_3_desc:0 "Ayrith herds range the highlands freely, providing sustenance to armies on the march."
 ayrith_open_sky_path_4:0 "Wind-Read Tactics"
 ayrith_open_sky_path_4_desc:0 "Ayrith commanders read the mountain winds like a map, timing charges to when the weather favors them."
 ayrith_open_sky_path_5:0 "Free Peoples' Council"
 ayrith_open_sky_path_5_desc:0 "The ayrith council of elders extends its famed hospitality even to those of foreign blood."
 ayrith_open_sky_path_6:0 "The Endless Horizon"
 ayrith_open_sky_path_6_desc:0 "An ayrith who has walked the whole breadth of the highlands can argue kinship with nearly any hill-clan."
 ayrith_open_sky_path_7:0 "Storm Callers"
 ayrith_open_sky_path_7_desc:0 "Ayrith war-shamans are said to call down highland storms to blind and scatter approaching enemies."
 ayrith_open_sky_path_end_bonus:0 "Mastery of the Children of the Open Sky"
 ayrith_open_sky_path_end_bonus_desc:0 ""


 mycelar_philosophy:0 "Mycelar Traditions"
 mycelar_philosophydesc:0 ""
 mycelar_philosophy_start_bonus:0 "The Mycelar Way of War"
 mycelar_philosophy_start_bonus_desc:0 ""

 #Mycelar 1
 mycelar_spore_circle_path_1:0 "Spore Blooms"
 mycelar_spore_circle_path_1_desc:0 "The mycelar reproduce in great blooming cycles, timed to the spread of their sacred spore circles."
 mycelar_spore_circle_path_2:0 "Fungal Granaries"
 mycelar_spore_circle_path_2_desc:0 "Vast underground fungal gardens sustain mycelar settlements through even the harshest seasons."
 mycelar_spore_circle_path_3:0 "Networked Minds"
 mycelar_spore_circle_path_3_desc:0 "The mycelar believe all their kind share a distant kinship of mind, easing the spread of shared belief."
 mycelar_spore_circle_path_4:0 "Root and Rot"
 mycelar_spore_circle_path_4_desc:0 "Mycelar armies live off the decay of the land itself, needing little in the way of conventional supply."
 mycelar_spore_circle_path_5:0 "Communal Growth"
 mycelar_spore_circle_path_5_desc:0 "Newcomers to mycelar lands are slowly, patiently woven into the great communal fabric."
 mycelar_spore_circle_path_6:0 "Patient Multiplication"
 mycelar_spore_circle_path_6_desc:0 "What the mycelar lack in martial ferocity, they make up for in the sheer patience of their regrowth."
 mycelar_spore_circle_path_7:0 "The Great Mycelium"
 mycelar_spore_circle_path_7_desc:0 "The interconnected mycelar economy shares its bounty efficiently across every linked settlement."
 mycelar_spore_circle_path_end_bonus:0 "Mastery of the Spore Circle"
 mycelar_spore_circle_path_end_bonus_desc:0 ""

 #Mycelar 2
 mycelar_soft_shield_path_1:0 "Yielding Ranks"
 mycelar_soft_shield_path_1_desc:0 "Mycelar heavy infantry, built for endurance rather than the killing blow, strike with less force than sturdier peoples."
 mycelar_soft_shield_path_2:0 "Absorbing Formations"
 mycelar_soft_shield_path_2_desc:0 "What mycelar soldiers lack in offense they make up for by absorbing and dispersing the force of an enemy charge."
 mycelar_soft_shield_path_3:0 "Spore Cloud Cover"
 mycelar_soft_shield_path_3_desc:0 "Clouds of releasable spores disorient attackers, buying mycelar formations precious time to reform."
 mycelar_soft_shield_path_4:0 "Deep Root Reserves"
 mycelar_soft_shield_path_4_desc:0 "Reserve levies grow quietly beneath mycelar settlements, ready to be called upon when the surface armies falter."
 mycelar_soft_shield_path_5:0 "Toxic Bloom"
 mycelar_soft_shield_path_5_desc:0 "Certain mycelar strains release mildly toxic spores in melee, weakening enemies who press too close."
 mycelar_soft_shield_path_6:0 "Slow but Certain"
 mycelar_soft_shield_path_6_desc:0 "Mycelar armies require little beyond what they can grow themselves, easing the strain of long campaigns."
 mycelar_soft_shield_path_7:0 "The Unbroken Bloom"
 mycelar_soft_shield_path_7_desc:0 "A mycelar army can be cut down and will simply bloom again the following season, a truth that steadies their nerves in battle."
 mycelar_soft_shield_path_end_bonus:0 "Mastery of the Soft Shield"
 mycelar_soft_shield_path_end_bonus_desc:0 ""


 tsaalan_philosophy:0 "Tsaalan Traditions"
 tsaalan_philosophydesc:0 ""
 tsaalan_philosophy_start_bonus:0 "The Tsaalan Way of War"
 tsaalan_philosophy_start_bonus_desc:0 ""

 #Tsaalan 1
 tsaalan_raiding_wind_path_1:0 "Fleet Raiders"
 tsaalan_raiding_wind_path_1_desc:0 "Tsaalan riders are drilled to strike a target and vanish before any organized response can be mounted."
 tsaalan_raiding_wind_path_2:0 "Claim by the Sword"
 tsaalan_raiding_wind_path_2_desc:0 "Tsaalan war-leaders traditionally justify conquest through martial right, backed by fast-riding legal 'evidence'."
 tsaalan_raiding_wind_path_3:0 "Raiding Season"
 tsaalan_raiding_wind_path_3_desc:0 "Tsaalan cavalry are seasonal levies, raised cheaply for the raiding months and released to their herds after."
 tsaalan_raiding_wind_path_4:0 "Scattershot Tactics"
 tsaalan_raiding_wind_path_4_desc:0 "Tsaalan riders favor chaotic, overwhelming skirmishes over the disciplined lines of settled peoples."
 tsaalan_raiding_wind_path_5:0 "Trophy Culture"
 tsaalan_raiding_wind_path_5_desc:0 "A tsaalan rider's status is measured in trophies taken, a powerful spur to morale in every engagement."
 tsaalan_raiding_wind_path_6:0 "Herd and Horse"
 tsaalan_raiding_wind_path_6_desc:0 "The tsaalan bond with their war-horses from birth, ensuring a steady stream of skilled riders."
 tsaalan_raiding_wind_path_7:0 "Swift Withdrawal"
 tsaalan_raiding_wind_path_7_desc:0 "No tsaalan war-band lingers on a battlefield longer than it must, preserving their strength for the next raid."
 tsaalan_raiding_wind_path_end_bonus:0 "Mastery of the Raiding Wind"
 tsaalan_raiding_wind_path_end_bonus_desc:0 ""

 #Tsaalan 2
 tsaalan_open_ledger_path_1:0 "Loose Taxation"
 tsaalan_open_ledger_path_1_desc:0 "The tsaalan distrust settled taxation, preferring plunder to the steady, resented hand of the tax collector."
 tsaalan_open_ledger_path_2:0 "Spoils of War"
 tsaalan_open_ledger_path_2_desc:0 "Plunder from raids is used to directly offset the costs of maintaining the tsaalan war-bands."
 tsaalan_open_ledger_path_3:0 "Rider's Bond"
 tsaalan_open_ledger_path_3_desc:0 "Even in retreat, tsaalan riders never abandon a wounded companion, a bond that steels their defensive lines."
 tsaalan_open_ledger_path_4:0 "The Long Chase"
 tsaalan_open_ledger_path_4_desc:0 "Tsaalan riders can pursue a fleeing enemy across terrain that would break the pace of any settled army."
 tsaalan_open_ledger_path_5:0 "Blood Debts"
 tsaalan_open_ledger_path_5_desc:0 "Old blood debts between tsaalan clans and their neighbors are settled through ritualized, expected warfare, softening its perception."
 tsaalan_open_ledger_path_6:0 "Sworn Companions"
 tsaalan_open_ledger_path_6_desc:0 "A tsaalan general's sworn companions ride and die at his side, a bond stronger than any oath of state."
 tsaalan_open_ledger_path_7:0 "Wind-Swept Banners"
 tsaalan_open_ledger_path_7_desc:0 "Tsaalan banners, cut to catch and howl in the wind, are said to carry the voices of ancestors into battle."
 tsaalan_open_ledger_path_end_bonus:0 "Mastery of the Open Ledger"
 tsaalan_open_ledger_path_end_bonus_desc:0 ""


 vothkin_philosophy:0 "Vothkin Traditions"
 vothkin_philosophydesc:0 ""
 vothkin_philosophy_start_bonus:0 "The Vothkin Way of War"
 vothkin_philosophy_start_bonus_desc:0 ""

 #Vothkin 1
 vothkin_deep_bastion_path_1:0 "Bastion Doctrine"
 vothkin_deep_bastion_path_1_desc:0 "Vothkin war-schools drill defense above all else, believing a line that does not break has already won."
 vothkin_deep_bastion_path_2:0 "Stonebound Levies"
 vothkin_deep_bastion_path_2_desc:0 "Vothkin levies fight shoulder to shoulder in the manner of their mountain holds, an unbreakable stone wall of shields."
 vothkin_deep_bastion_path_3:0 "Toll Roads"
 vothkin_deep_bastion_path_3_desc:0 "Every pass through vothkin territory is tolled, funding the upkeep of their famous mountain garrisons."
 vothkin_deep_bastion_path_4:0 "Slow March"
 vothkin_deep_bastion_path_4_desc:0 "Vothkin armies march at the deliberate pace of the mountain holds, never in a hurry, never out of formation."
 vothkin_deep_bastion_path_5:0 "Garrison Culture"
 vothkin_deep_bastion_path_5_desc:0 "Generations spent holding mountain passes have taught the vothkin to fortify efficiently and permanently."
 vothkin_deep_bastion_path_6:0 "Hold the Line"
 vothkin_deep_bastion_path_6_desc:0 "A vothkin soldier is taught from youth that retreat is a greater shame than death, steadying every formation."
 vothkin_deep_bastion_path_7:0 "Mountain Reserves"
 vothkin_deep_bastion_path_7_desc:0 "Deep mountain holds shelter reserves of vothkin manpower safe from raiding enemies."
 vothkin_deep_bastion_path_end_bonus:0 "Mastery of the Deep Bastion"
 vothkin_deep_bastion_path_end_bonus_desc:0 ""

 #Vothkin 2
 vothkin_iron_toll_path_1:0 "Iron Wall Tactics"
 vothkin_iron_toll_path_1_desc:0 "Vothkin heavy infantry advance as a single armored mass, grinding down enemy lines through sheer discipline."
 vothkin_iron_toll_path_2:0 "Siege Wardens"
 vothkin_iron_toll_path_2_desc:0 "Centuries of holding and besieging mountain fortresses have made the vothkin masters of siegecraft."
 vothkin_iron_toll_path_3:0 "Frugal Garrisons"
 vothkin_iron_toll_path_3_desc:0 "Vothkin garrison troops are famously self-sufficient, living off carefully hoarded mountain stores."
 vothkin_iron_toll_path_4:0 "Held Ground"
 vothkin_iron_toll_path_4_desc:0 "No army fights more effectively on high, defensible ground than the vothkin, born and bred to it."
 vothkin_iron_toll_path_5:0 "Grudging Toleration"
 vothkin_iron_toll_path_5_desc:0 "The vothkin extend a grudging but genuine hospitality to those willing to abide by the laws of the hold."
 vothkin_iron_toll_path_6:0 "Deep Stores"
 vothkin_iron_toll_path_6_desc:0 "Vast stone granaries beneath vothkin holds ensure their armies rarely want for supply."
 vothkin_iron_toll_path_7:0 "The Unyielding Hold"
 vothkin_iron_toll_path_7_desc:0 "No vothkin fortress has ever fallen to siege alone; the cost of maintaining that reputation is paid gladly."
 vothkin_iron_toll_path_end_bonus:0 "Mastery of the Iron Toll"
 vothkin_iron_toll_path_end_bonus_desc:0 ""


 ulvenar_philosophy:0 "Ulvenar Traditions"
 ulvenar_philosophydesc:0 ""
 ulvenar_philosophy_start_bonus:0 "The Ulvenar Way of War"
 ulvenar_philosophy_start_bonus_desc:0 ""

 #Ulvenar 1
 ulvenar_wolf_pack_path_1:0 "Pack Tactics"
 ulvenar_wolf_pack_path_1_desc:0 "Ulvenar war-bands fight in coordinated packs, encircling and overwhelming isolated enemy units."
 ulvenar_wolf_pack_path_2:0 "Howling Charge"
 ulvenar_wolf_pack_path_2_desc:0 "The ulvenar war-cry, said to mimic the wolves of their homeland, has broken the nerve of many an enemy line."
 ulvenar_wolf_pack_path_3:0 "Alpha's Bargain"
 ulvenar_wolf_pack_path_3_desc:0 "Ulvenar war-leaders rule through dominance and challenge, a system that breeds strength but rarely loyalty."
 ulvenar_wolf_pack_path_4:0 "Lone Hunter Training"
 ulvenar_wolf_pack_path_4_desc:0 "Every ulvenar warrior is trained to survive alone in the wild before ever joining a pack."
 ulvenar_wolf_pack_path_5:0 "Blood Rank"
 ulvenar_wolf_pack_path_5_desc:0 "Status among the ulvenar is won in single combat, and every soldier fights to climb the pack's hierarchy."
 ulvenar_wolf_pack_path_6:0 "Winter Endurance"
 ulvenar_wolf_pack_path_6_desc:0 "The harsh ulvenar homeland breeds warriors who can endure conditions that would cripple softer armies."
 ulvenar_wolf_pack_path_7:0 "Den Mothers"
 ulvenar_wolf_pack_path_7_desc:0 "Ulvenar den-mothers raise the young communally, ensuring the pack is never short of new hunters."
 ulvenar_wolf_pack_path_end_bonus:0 "Mastery of the Wolf Pack"
 ulvenar_wolf_pack_path_end_bonus_desc:0 ""

 #Ulvenar 2
 ulvenar_iron_fang_path_1:0 "Fang and Claw Weapons"
 ulvenar_iron_fang_path_1_desc:0 "Ulvenar smiths favor curved, claw-like blades designed to rend rather than pierce."
 ulvenar_iron_fang_path_2:0 "Challenge Rites"
 ulvenar_iron_fang_path_2_desc:0 "Any ulvenar officer may challenge their superior for command, a tradition that keeps leadership sharp but unstable."
 ulvenar_iron_fang_path_3:0 "Trail of the Pack"
 ulvenar_iron_fang_path_3_desc:0 "Ulvenar scouts can track and follow an enemy army for days through terrain others would call impassable."
 ulvenar_iron_fang_path_4:0 "Feast of Victory"
 ulvenar_iron_fang_path_4_desc:0 "Victory is celebrated with a great feast shared by the whole pack, reinforcing loyalty to the group if not its leaders."
 ulvenar_iron_fang_path_5:0 "Scarred Veterans"
 ulvenar_iron_fang_path_5_desc:0 "Ulvenar veterans wear their battle scars as marks of pride, inspiring the packs that fight beside them."
 ulvenar_iron_fang_path_6:0 "Merciless Pursuit"
 ulvenar_iron_fang_path_6_desc:0 "An ulvenar pack rarely lets a broken enemy escape to regroup, running them down to the last straggler."
 ulvenar_iron_fang_path_7:0 "Pack Law"
 ulvenar_iron_fang_path_7_desc:0 "The simple, brutal law of the pack keeps ulvenar war-bands functioning with little need for costly administration."
 ulvenar_iron_fang_path_end_bonus:0 "Mastery of the Iron Fang"
 ulvenar_iron_fang_path_end_bonus_desc:0 ""


 selkanu_philosophy:0 "Selkanu Traditions"
 selkanu_philosophydesc:0 ""
 selkanu_philosophy_start_bonus:0 "The Selkanu Way of War"
 selkanu_philosophy_start_bonus_desc:0 ""

 #Selkanu 1
 selkanu_tide_walkers_path_1:0 "Tide-Reading"
 selkanu_tide_walkers_path_1_desc:0 "Selkanu sailors learn to read the tides and currents from childhood, giving their crews unshakeable confidence at sea."
 selkanu_tide_walkers_path_2:0 "Harbor Guilds"
 selkanu_tide_walkers_path_2_desc:0 "Selkanu harbor guilds regulate trade with an even hand, drawing merchants from across the coast."
 selkanu_tide_walkers_path_3:0 "Salt-Cured Crews"
 selkanu_tide_walkers_path_3_desc:0 "Selkanu marines, hardened by a life at sea, fight with a ferocity that surprises landbound enemies."
 selkanu_tide_walkers_path_4:0 "Coastal Watch Towers"
 selkanu_tide_walkers_path_4_desc:0 "A chain of watchtowers along the selkanu coast keeps fortification costs low while warning of any approach."
 selkanu_tide_walkers_path_5:0 "Deepwater Charts"
 selkanu_tide_walkers_path_5_desc:0 "Generations of selkanu navigators have charted waters that remain a mystery to their rivals."
 selkanu_tide_walkers_path_6:0 "Fishwife Networks"
 selkanu_tide_walkers_path_6_desc:0 "Selkanu fishwives trade gossip and goods along the coast, forming an informal but effective commercial network."
 selkanu_tide_walkers_path_7:0 "Storm-Tested Hulls"
 selkanu_tide_walkers_path_7_desc:0 "Ships and crews that survive the selkanu storm season emerge hardened against nearly any hardship."
 selkanu_tide_walkers_path_end_bonus:0 "Mastery of the Tide Walkers"
 selkanu_tide_walkers_path_end_bonus_desc:0 ""

 #Selkanu 2
 selkanu_merchant_fleet_path_1:0 "Fleet Levies"
 selkanu_merchant_fleet_path_1_desc:0 "Maintaining both a merchant and war fleet strains the selkanu treasury, though it is a cost gladly borne."
 selkanu_merchant_fleet_path_2:0 "Convoy Discipline"
 selkanu_merchant_fleet_path_2_desc:0 "Selkanu captains drill in convoy formation, protecting merchant vessels with disciplined escort maneuvers."
 selkanu_merchant_fleet_path_3:0 "Trade Envoys"
 selkanu_merchant_fleet_path_3_desc:0 "Selkanu trade envoys are skilled at smoothing the transition of newly acquired ports into the wider selkanu network."
 selkanu_merchant_fleet_path_4:0 "Harbor Fortification"
 selkanu_merchant_fleet_path_4_desc:0 "Generations of defending rich harbor cities have taught the selkanu the value of siegecraft, offensive and defensive alike."
 selkanu_merchant_fleet_path_5:0 "Salt Tax"
 selkanu_merchant_fleet_path_5_desc:0 "A modest tax on the selkanu salt trade quietly funds much of their naval ambition."
 selkanu_merchant_fleet_path_6:0 "Sailor's Oath"
 selkanu_merchant_fleet_path_6_desc:0 "Every selkanu sailor swears an oath to their captain and crew before ever setting sail, a bond rarely broken."
 selkanu_merchant_fleet_path_7:0 "The Long Voyage"
 selkanu_merchant_fleet_path_7_desc:0 "Selkanu trading fleets range farther than most, returning with goods and gold from distant, unfamiliar shores."
 selkanu_merchant_fleet_path_end_bonus:0 "Mastery of the Merchant Fleet"
 selkanu_merchant_fleet_path_end_bonus_desc:0 ""


