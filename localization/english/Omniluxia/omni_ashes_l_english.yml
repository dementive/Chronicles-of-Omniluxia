l_english:

 omni_ashes.1.t:0 "The Third Great Gathering"

 omni_ashes.1.desc:0 "The bells of #G Ddu-Nuinop#! summon pilgrims and envoys beneath the #Y Apostolic Palace#!. The #T Shannah#! raises a hand.\n\n“Children of #T Hellas#!, hear me! Three days did #Y Helluvius#! burn. On the third, the faithful gathered his ashes. When the world broke, his love sheltered them.\n\nIn #Y 672 LC#!, with the fields still failing, #Y Pouirruipa#! gathered the survivors. They brought lamps against the darkness, bread for the hungry, and hands offered to strangers. No child of #T Hellas#! would face the darkness alone!\n\nThe coming year marks #Y three hundred and thirty years#! since that first gathering! Three centuries, and thirty years more! Hear in that number the echo of the three sacred days! I proclaim preparations for the #T Third Great Gathering of the Ashes#!!\n\nLet lamps blaze in every temple! Welcome the pilgrim, feed the hungry, tend the sick! And you who wear crowns: sheathe the sword of conquest for this sacred season. Let your people reap what they have sown. Give your word before #T Hellas#!, and keep it!\n\nIf our forebears could preserve his ashes while the world was falling, surely we can preserve the peace for one blessed season!\n\nMy envoys are on their way to your courts. Receive them, and before #T Hellas#! let them accept your vows of submission to this sacred peace!”"

 omni_ashes.1.a:0 "Let all the faithful hear the Shannah's proclamation!"

 omni_ashes.2.t:0 "The #T Peace of the Ashes#!"

 omni_ashes.2.desc:0 "Months after the proclamation, an envoy of the #T Shannah#! arrives at our court to receive our vow of submission to the #T Peace of the Ashes#! in preparation for the #Y 330th anniversary#! of #Y Pouirruipa#!'s #T First Gathering#! in #Y 672 LC#!. Will we pledge to refrain from offensive wars for a sacred season of two full years? Defense remains our right. Keeping our word earns 25 political influence and a two-year blessing. Leading an offensive war while sworn risks two years of religious discontent."

 omni_ashes.2.a:0 "Before #T Hellas#!, we pledge our peace."

 omni_ashes.2.b:0 "Our crown cannot make this promise."

 omni_ashes.3.t:0 "Our Word Kept"

 omni_ashes.3.desc:0 "For two full years, we have kept the sacred peace. Our oath is fulfilled. The lamps of the Gathering have burned faithfully, and our promise has endured. The clergy bless our realm."

 omni_ashes.3.a:0 "May the memory of this peace endure."

 omni_ashes.4.t:0 "The Shannah Condemns Our Broken Oath"

 omni_ashes.4.desc:0 "My [ROOT.GetCountry.GetRulerTitle], an envoy from #G Ddu-Nuinop#! has arrived at [ROOT.GetCountry.GetCapital.GetName|G], bearing a letter sealed by the #T Shannah#!. There is no blessing within. Before the assembled court, the envoy reads the judgment of [SCOPE.sChar('omni_ashes_shannah').GetName|Y].\n\n'You gave your word before #T Hellas#!. While the faithful lit their lamps in memory of #Y Helluvius#!, you sent your people to war. The ashes of the Prophet had scarcely been honored before you trampled the promise made in his name. Do you imagine that a crown places its wearer beyond the sight of the #T Great Father#!?'\n\nThe letter orders the clergy to proclaim our breach of the #T Peace of the Ashes#!. Already, priests repeat the accusation before their congregations, and the pious whisper that our solemn word is worth less than the wax that sealed it. The blessing we were promised has been withheld; for #Y two years#!, the faithful will remember our disgrace.\n\nThe envoy leaves the letter at the foot of the throne. 'The #T Shannah#! expects repentance, my [ROOT.GetCountry.GetRulerTitle]. Your answer will be carried back to the #Y Apostolic Palace#!.'"

 omni_ashes.4.a:0 "The court falls silent."

 omni_ashes_oath:0 "Sworn to the #T Peace of the Ashes#!"

 desc_omni_ashes_oath:0 "We have sworn before Hellas to set aside wars of conquest for two full years, honoring the Gathering of the Ashes."

 omni_ashes_blessing:0 "Blessing of the Gathering"

 desc_omni_ashes_blessing:0 "We honored the #T Peace of the Ashes#!."

 omni_ashes_broken:0 "Broken #T Peace of the Ashes#!"

 desc_omni_ashes_broken:0 "The faithful condemn our broken oath."


 omni_ashes.1.a.tt:0 "In #Y three to six months#!, envoys will bring the Shannah's appeal to independent #T Helluvian#! rulers of the north and to our court if we are eligible. Envoys wait for peace before receiving our answer. Each ruler may accept or decline. Those who swear to uphold the #T Peace of the Ashes#! pledge to refrain from offensive wars for #Y two full years#!."

 omni_ashes.2.a.tt:0 "Swear to uphold the #T Peace of the Ashes#! for #Y two full years#!. Defensive wars do not break the pledge.\n\nHonor the oath to gain #G 25#! political influence and #G +5%#! omen power for #Y two years#!. Breaking it brings #R -5%#! state religion happiness for #Y two years#!."

 omni_ashes.4.a.tt:0 "The Shannah condemns our broken oath. For #Y two years#!, the happiness of pops following our state religion is reduced by #R 5%#!. We forfeit the reward for keeping the peace."
