l_english:

  omni_vampire_spread.2_title: "A Curse Upon the Throne"
  omni_vampire_spread.2_desc: "For weeks, a fever kept [ROOT.GetCountry.GetRuler.GetName|Y] confined behind shuttered windows, refusing all food, water and company. This morning [ROOT.GetCountry.GetRuler.GetSheHe] emerged - pale, cold to the touch, and unable to bear the light of day. There can be no mistaking what has taken hold of [ROOT.GetCountry.GetRuler.GetFirstName]. The blood-curse has reached [ROOT.GetCountry.GetName|Y]'s highest sea - our [ROOT.GetCountry.GetRulerTitle] is a vampire."
  omni_vampire_spread.2.a: "So be it...let them fear the night"
