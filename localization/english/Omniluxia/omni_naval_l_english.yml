l_english:
 port_raid:0 "Naval Bombardment"
 port_raiddesc:0 "Heavy ships support our besiegers by opening a breach in an adjacent hostile coastal fort. One heavy ship loses 30% strength. The fleet must wait 90 days before another coastal operation."
 port_raid_no_valid_port:0 "Requires an adjacent hostile coastal fort under a siege led by our country, without an existing breach."
 capture_portdesc:0 "Seize an adjacent undefended, unfortified hostile port. Two distinct heavy ships each lose 50% strength, reduced to 40% with Sambuca siege equipment. The fleet must wait 30 days before another coastal operation."
 port_assaultdesc:0 "Destroy one level of fortifications in an adjacent undefended hostile port. One mega galley loses 70% strength, reduced to 60% with Sambuca siege equipment. The fleet must wait 90 days before another coastal operation."
 omni_naval_ready_tt:0 "The fleet must be stationary, outside combat, not exiled, and ready for a coastal operation. Its admiral, if present, must have more than 33 loyalty."
 omni_arcane_bombardment:0 "Sea-Cast Tremor"
 omni_arcane_bombardmentdesc:0 "An Amten admiral casts Breaching Tremor from the fleet, opening a breach for our besiegers in an adjacent unwarded coastal fort. Costs the admiral the normal scaled mana cost of Breaching Tremor (base 50). Both the admiral and fleet must wait 90 days before repeating this operation."
 omni_naval_tremor_caster_tt:0 "Requires an eligible Amten tier II caster commanding this fleet, knowledge of Breaching Tremor, enough mana for its scaled base-50 cost, and no naval tremor cooldown."
 omni_naval_tremor_target_tt:0 "Requires an adjacent unwarded hostile coastal fort under a siege led by our country, without an existing breach."
 omni_naval.1.t:0 "Coastal Defenses Struck"
 omni_naval.1.desc:0 "A [SCOPE.sCountry('omni_naval_attacker').GetAdjective] fleet has carried out a coastal operation at [SCOPE.sProvince('omni_naval_target').GetName]. Our local defenses have been compromised. We should inspect the port and its garrison before the enemy follows up the attack."
 omni_naval.1.a:0 "Send word to our commanders."
