l_english:
 omni_worlds_end.2.t:0 "The Dragon Looks Ashore"
 omni_worlds_end.2.desc:0 "The pilots spread their chart on the quay. [ROOT.GetCountry.GetRuler.GetName|Y] passed over the distant ports and put one claw on [SCOPE.sProvince('omni_invasion_city').GetName|G]. Here his crews could land supplies from Urzhaketh, and the roads ran inland to the holdings of [SCOPE.sCountry('omni_worlds_end_defender').GetName|Y]. He called for a mason as well as a pilot. This time he meant to stay."
 omni_worlds_end.2.a:0 "Take [SCOPE.sProvince('omni_invasion_city').GetName|G]. Let the harbor learn who commands it."
 omni_worlds_end.2.b:0 "The island is enough, for now."
 omni_worlds_end.3.t:0 "The Wyrm's Roost at [SCOPE.sProvince('omni_invasion_city').GetName|G]"
 omni_worlds_end.3.desc:0 "At [SCOPE.sProvince('omni_invasion_city').GetName|G], the masons have marked out the line of the defenses above the landing. Inside the walls there is room for a market, a storehouse and the hall where the island council will now meet. The first boat from Urzhaketh brought the seals of office. By evening the clerks were dating their orders from the new capital."
 omni_worlds_end.3.a:0 "The wyrm has a roost on the mainland."
 omni_worlds_end.4.t:0 "The Silver Wyrm at [SCOPE.sProvince('omni_invasion_city').GetName|G]"
 omni_worlds_end.4.desc:0 "The message reached the hall in the usual way for bad news: a rider in a hurry, a cup knocked over, and an unwelcome silence. The harbor of [SCOPE.sProvince('omni_invasion_city').GetName|G], on the southern coast of #G Morrigon#!, has fallen. Its walls were not breached by any army to speak of. It was taken, the rider said, by one creature, and the creature has since taken up residence.\n\nHis name is [SCOPE.sChar('omni_worlds_end_dragon').GetFirstName|Y], the #T Silver Wyrm#! of the island of [SCOPE.sCountry('omni_worlds_end_realm').GetName|Y]; the lord whom the sailors of the outer passage have for generations told their children about and sworn they did not believe. He sits now on the Warden's Hall with his tail wound three times around the harbor and a new mainland seat under his claws, and he is, by every report, in no hurry at all.\n\nThe merchants of the coast have already begun to speak of him in the soft voice they use for storms. [ROOT.GetCountry.GetRuler.GetName|Y] looked at the map for a long while, and then at the rider, and asked how far it was from [SCOPE.sProvince('omni_invasion_city').GetName|G] to our own border. The rider told him, and wished he had not."
 omni_worlds_end.4.a:0 "Light the signal fires on every ridge that faces the southern coast."
 omni_worlds_end.4.b:0 "Send a cart of silver and a very polite letter. Dragons like both."
 omni_worlds_end.4.c:0 "A lizard in a harbor. Tell the market to stop gossiping."
