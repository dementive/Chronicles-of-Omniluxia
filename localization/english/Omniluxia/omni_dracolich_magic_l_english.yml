 omni_sb_dracolich_recovering_tt:0 "#R This spell or the shared Dracolich recovery is on cooldown.#!"
 omni_dracolich_eclipse:0 "Eclipse of Black Wings"
 omni_sb_dracolich_eclipse_tt:0 "Black wings blot out the sun over every enemy capital. Each enemy gains #R 8 War Exhaustion#!. For 360 days, its capital suffers #R -60% Fort Defense and -50% Monthly Food#!, and its armies there immediately lose #R 40% strength#!. Tier III province wards shield the capital, and Tier III unit wards shield individual armies. Requires war. Prisoners cannot cast.\n\nCosts no mana. Cooldown: 1080 days. Dracolich spells share a 540-day recovery."
 omni_dracolich_bone_levy:0 "Legion of the Last Grave"
 omni_sb_dracolich_bone_levy_tt:0 "The dead march out of the capital in #Y 20 Warborn cohorts#!. For 360 days, your realm gains #Y +40% Discipline, +50% Land Morale and +50% Siege Ability#!. Requires war and control of your capital. Prisoners cannot cast.\n\nCosts no mana. Cooldown: 1440 days. Dracolich spells share a 540-day recovery."
 omni_dracolich_silent_throne:0 "Silence the Living"
 omni_sb_dracolich_silent_throne_tt:0 "Even the living kneel when the dead fill the streets. Gain #Y 15 Stability#! immediately. For 540 days, gain #Y -6 National Unrest, +50% National Tax and +35% Monthly Food#!, at the cost of #R reduced population growth#!. Requires peace. Prisoners cannot cast.\n\nCosts no mana. Cooldown: 1080 days. Dracolich spells share a 540-day recovery."
 omni_dracolich_warborn_army:0 "Legion of the Last Grave"
