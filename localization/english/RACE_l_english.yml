# Integration/Expel Events

me_racial_events_21_title: "Migrants Arrive"
me_racial_events_21_desc: "Wise #E [ROOT.GetCountry.GetRuler.GetFirstName]#!, a large migrant caravan from the [chosen_culture.GetCulture.GetName] community of [SCOPE.sProvince('village_hometown').GetName] have made their way to our capital!\n\nThe arrival of these families at [ROOT.GetCountry.GetCapital.GetName] has created a small crisis within the city, as the new residents require both food and housing that our settlement is currently not capable of providing. Officials warn that, despite their best efforts, overcrowding and starvation will continue to be a problem for many months until they are able to properly resettle the new arrivals.\n\nThe issues these new arrivals have caused have pushed many local residents to petition you to remove these vagrants at once! Running contrary to these demands, several advisors have suggested that the taxation collected from these new residents could be put towards city improvements.\n\nWhat must be done with these new arrivals?"
me_racial_events_21.a: "We must expand our city to welcome them!"
me_racial_events_21.b: "Send them away"
me_racial_events_21.c: "I don't have time for this"
end_focus_tooltip: "#Y We will stop focusing on this race#!"

me_racial_events_22_title: "Locals Demand Autonomy"
me_racial_events_22_desc: "Troubing news from our fronteirs, O #E [ROOT.GetCountry.GetRuler.GetFirstName]#!!\n\nIt appears that unrest is simmering amongst the [chosen_culture.GetCulture.GetName] of [SCOPE.sProvince('autonomous_community').GetName]. Their local leaders claim their community suffers under our yoke, and ask for more autonomy under our rule. They argue that their community's acceptance of our rule and laws entitles them to the consideration of their demands. How presumptuous!\n\nDespite their outrageous arguments, their offer might be worth considering. Their integration into our society may serve as an example to others like them, and spare us the cost of ensuring their obedience."
me_racial_events_22.a: "Allow it to keep the peace"
me_racial_events_22.b: "They are under our control and will obey us!"

me_racial_events_23_title: "Prominent Minister"
me_racial_events_23_desc: "Great #E [ROOT.GetCountry.GetRuler.GetFirstName]#!, rumors spread like wildfires amongst the court!\n\nIt appears that minister #E [SCOPE.sCharacter('original_minister').GetFirstName]#! has been caught up in a minor corruption scandal, and news of [SCOPE.sCharacter('original_minister').GetHerHis] alleged crimes have smeared his reputation at court. However disappointing this news is, it presents us with a unique opportunity. If we decided to, we could seize this opportune moment to step in and secure his loyalty by silencing this baseless slander.\n\nAlternatively, we could take advantage of a new, promising face that has recently made Kolapola123 impact at court. Young #E [SCOPE.sCharacter('talented_minister').GetFirstName]#! has taken the court by storm ever since his arrival, with his wit and capability convincing many to recommend him as a possible replacement for #E [SCOPE.sCharacter('original_minister').GetName]#!. Although [SCOPE.sCharacter('talented_minister').GetHerHis]#! skill is undeniable, #E [SCOPE.sCharacter('talented_minister').GetFirstName]'s#! humble background as a peasant from the [chosen_culture.GetCulture.GetName] people might ruffle some feathers amongst the older elites.\n\nThere is much to gain and much to lose from either decision, however, ultimately the choice is yours. What must be done?"
me_racial_events_23.a: "#E [SCOPE.sCharacter('talented_minister').GetFirstName]#! seems like a better fit for the job"
me_racial_events_23.b: "#E [SCOPE.sCharacter('original_minister').GetFirstName]#! deserves [SCOPE.sCharacter('original_minister').GetHerHis] position"

me_racial_events_24_title: "Integrated Conversion"
me_racial_events_24_desc: "Choose one of the many races found in your realm to focus on."
me_racial_events_24.a: "Great!"
me_racial_events_24.b: "We should encourage this"

me_racial_events_25_title: "Refugees Flee"
me_racial_events_25_desc: "Wise #E [ROOT.GetCountry.GetRuler.GetFirstName]#!, news from the border!\n\nIt appears our guards have stopped a large caravan of [chosen_culture.GetCulture.GetName] peasants attempting to leave the country. They carry with them few belongings but what they need to survive. However, when checked, our soldiers found that they had brought along a few weapons such as bows and spears that they claim they needed to 'protect themselves' in what could be hostile lands.\n\nLetting them go would be harmless enough, its not like these vagabonds pose any threat to us. However, we could use the contraband as an excuse to extract 'donations' from this group in exchange for safe passage. What should we do?"
me_racial_events_25.a: "Seize their belongings!"
me_racial_events_25.b: "Let them go"

me_racial_events_26_title: "Unrest Grows"
me_racial_events_26_desc: "Great #E [ROOT.GetCountry.GetRuler.GetFirstName]#!, there is troubling news arrives from our [chosen_culture.GetCulture.GetName] territories!\n\nOur orders have not been well-received by the local community of [SCOPE.sProvince('angry_minority_town').GetName], who refuse to move from their ancestral lands. Several of their elders have begun subtly encouraging treasonous actions, and it appears that most of the town is preparing to violently resist our rule. This behavior is unacceptable, and will surely encourage neighboring [chosen_culture.GetCulture.GetName] towns to stay and revolt.\n\nOfficials in the region have proposed three possible actions: negotiating with the townsfolk to avoid a rebellion, root out their leaders and snuff out the growing revolt, or burning the town to serve as an example to other would-be rebels. What should we do?"
me_racial_events_26.a: "We must be able to reach a compromise"
me_racial_events_26.b: "Make an example of their leaders"
me_racial_events_26.c: "Burn it all"

me_racial_events_27_title: "Incoming Settlers"
me_racial_events_27_desc: "Excellent news from the hinterlands, O #E [ROOT.GetCountry.GetRuler.GetFirstName]#!!\n\nIt appears that our resettlement efforts have born fruit, as many families from the crowded hovels of [SCOPE.sProvince('settler_home').GetName] have traveled to settle in the lands of the [chosen_culture.GetCulture.GetName]! With loyal colonists in the region, it is only a matter of time before our control over their former lands is secured.\n\nDespite this good news, minor skirmishes in the province of [SCOPE.sProvince('settler_colony').GetName] have escalated from a minor inconvenience to a noticeable problem. Although our intentions from the beginning were to undermine the unruly locals, such outright favoritism towards incoming settlers may inspire revolts or retribution from the [chosen_culture.GetCulture.GetName]. \n\nOne of the officials from the town has suggested resettling the locals from the area to avoid further bloodshed, while another urges us to maintain a temporary peace by punishing the settlers. What should we do?"
me_racial_events_27.a: "There is nothing we can do"
me_racial_events_27.b: "Punish the Settlers"
me_racial_events_27.c: "Resettle the locals"

