 omni_dragon.6.t:0 "Test: Wild Dragon"
 omni_dragon.6.desc:0 "A wild [SCOPE.sP('omni_dragon_test_sighting').Custom('omni_dragon_breed')] is at [SCOPE.sP('omni_dragon_test_sighting').GetName]. Follow it for a few months to see where it raids."
 omni_dragon.6.desc_den:0 "The dragon hunt has started and [SCOPE.sP('omni_dragon_test_den').GetName] is now the den. Barbarian hordes spawn there quickly, and the monthly check turns the next one into a wild [SCOPE.sP('omni_dragon_test_den').Custom('omni_dragon_breed')]. To skip the wait, run horde with this province's ID, then event omni_dragon.1."
 omni_dragon.6.desc_fail:0 "No den could be marked: no barbarian spawn site is on unowned land right now."
 omni_dragon.6.a:0 "Watch it."

