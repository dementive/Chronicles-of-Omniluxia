l_english:
 omni_dragon:0 "Dragon"
 omni_dragon_desc:0 "The dragon hunts on the wing. Its diving charge scatters heavy infantry, but archers can reach the thin membranes between its wing bones."
 omni_dragon_bound_name:0 "Dragon"
 omni_dragon_stirring:0 "A Dragon Stirs"
 desc_omni_dragon_stirring:0 "Flocks flee the high ground and raiders gather along the roads below the dragon's den."
 omni_dragon_one_bound_tt:0 "Your country has no living bound dragon."
 omni_dragon.2.t:0 "A Shadow over [SCOPE.sP('omni_dragon_sighting').GetName]"
 omni_dragon.2.desc:0 "A herdsman watched the sheep crowd together before he saw what frightened them: [SCOPE.sP('omni_dragon_sighting').Custom('omni_dragon_breed_a')], circling above [SCOPE.sP('omni_dragon_sighting').GetName]. By dusk it had taken two ewes and torn the roof from the byre. The last rider to see it says it is following the road."
 omni_dragon.2.a:0 "Send word to the captains."
 omni_dragon.3.t:0 "No fresh dragon sighting"
 omni_dragon.3.desc:0 "There is no barbarian horde outside battle or siege to carry a new encounter. In a test save, the console command horde 257 calls a horde at the barbarian stronghold in territory 257. Run event omni_dragon.1 again once the horde is on the map."
 omni_dragon.3.a:0 "Understood."
 omni_dragon.4.t:0 "The [SCOPE.sP('omni_dragon_battlefield').Custom('omni_dragon_breed')] Falls"
 omni_dragon.4.desc:0 "The [SCOPE.sP('omni_dragon_battlefield').Custom('omni_dragon_breed')] tried once more to climb above the field at [SCOPE.sP('omni_dragon_battlefield').GetName]. One wing folded beneath it. The soldiers who reached it first stood well back until they saw its jaws go slack."
 omni_dragon.4.a:0 "Let the herdsmen bring their flocks home."
