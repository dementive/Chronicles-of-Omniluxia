l_english:
 arteon_refugee_labor_mod:0 "Arteon Refugee Labor"
 desc_arteon_refugee_labor_mod:0 "Driven from their homes by war and famine, these desperate souls now toil endlessly to rebuild our nation, trading their sweat for a chance at a new life."
 horteonian_auxiliaries_mod:0 "Horteonian Auxiliaries"
 desc_horteonian_auxiliaries_mod:0 "Hardened warriors from the frigid north, these mercenaries fight with a savage fury that strikes terror into the hearts of our enemies."
 purge_the_invaders_mod:0 "Purge The Invaders"
 desc_purge_the_invaders_mod:0 "No mercy shall be shown to those who defile our sacred lands. Every invader must be driven out, their presence scrubbed from our history."
 first_great_war_avenged_mod:0 "First Great War Avenged"
 desc_first_great_war_avenged_mod:0 "The bitter taste of our ancestors' defeat has finally been washed away with the blood of our rivals. Our honor is restored."
 exploit_arteon_feuds_mod:0 "Exploit Artheousan Feuds"
 desc_exploit_arteon_feuds_mod:0 "By pitting the bickering lords of #Y Arteon#! against each other, we can bleed their strength and pave the way for our own supremacy."
 emra_abominations_purged_mod:0 "Emra Abominations Purged"
 desc_emra_abominations_purged_mod:0 "The foul creatures of Emra have been scoured from the earth. Their dark taint will plague our lands no more."
 high_elven_supremacy_mod:0 "High Elven Supremacy"
 desc_high_elven_supremacy_mod:0 "The natural order has been enforced. The #Y High Elves#! rule supreme, bringing order and enlightenment to the lesser races."
 viktreic_holy_crusade_mod:0 "Viktreic Holy Omostthanat"
 desc_viktreic_holy_crusade_mod:0 "Bolstered by righteous fury, our armies march in the name of the divine. Let the nonbelievers tremble before our holy might."
 light_of_viktrea_mod:0 "Light Of Viktrea"
 desc_light_of_viktrea_mod:0 "A divine radiance touches our nation, filling our people with hope and guiding our leaders with undeniable clarity."
 viktrea_divine_judgment_mod:0 "Viktrea Divine Judgment"
 desc_viktrea_divine_judgment_mod:0 "The gods themselves have weighed our enemies and found them wanting. Their doom is sealed by divine decree."
 arteon_rebuilt_cities_mod:0 "Arteon Rebuilt Cities"
 desc_arteon_rebuilt_cities_mod:0 "From the ashes of ruin, grand new cities rise. The heart of #Y Arteon#! beats once more, stronger and more vibrant than ever."
 arteon_grand_ports_mod:0 "Arteon Grand Navy"
 desc_arteon_grand_ports_mod:0 "Our harbors bustle with merchants and armadas alike. The wealth of the world flows freely into our magnificent ports, and all are protected by our Grand #G Navy#!."
 arteon_fortified_interior_mod:0 "Arteon Fortified Interior"
 desc_arteon_fortified_interior_mod:0 "Impenetrable walls and towering keeps now guard our heartlands, ensuring that no enemy will ever threaten our core territories."
 arteon_lasting_peace_mod:0 "Arteon Lasting Peace"
 desc_arteon_lasting_peace_mod:0 "A golden age of tranquility has settled over the realm. Swords are beaten into plowshares, and prosperity blossoms."
 arteon_united_empire_mod:0 "United Empire of Arteon"
 desc_arteon_united_empire_mod:0 "The fractured lands of #Y Arteon#! are whole once more, bound together under a single, mighty banner."
 artheousan_diplomatic_dominance_mod:0 "Artheousan Diplomatic Dominance"
 desc_artheousan_diplomatic_dominance_mod:0 "Our focus on diplomatic expansion has secured better relations and tempered aggression."
 ascendic_conquest_mod:0 "Ascendic Conquest"
 desc_ascendic_conquest_mod:0 "The path of conquest is paved with strong infantry and relentless sieges."
 item_crown_of_arteon_modifier:0 "Crown of Arteon"
 desc_item_crown_of_arteon_modifier:0 "The sovereign crown of a reunited #Y Arteon#!, earned by the ruler who ended the Isle of Eternal War."
 item_eptelon_elder_mark_modifier:0 "The Elder's Mark"
 item_eptelon_harbor_charter_modifier:0 "Harbor Charter of Eptelon"
 desc_item_eptelon_harbor_charter_modifier:0 "A prestigious charter granting authority over maritime affairs, bearing the seals of the founding merchants. When placed in a holy site, it strengthens diplomatic ties and legitimizes rule."
 item_eptelon_sword_modifier:0 "Greatsword of Sevan"
 desc_item_eptelon_sword_modifier:0 "The legendary sword from #Y Lake Sevan#! is a masterwork of celestial craftsmanship. Its bearer gains enhanced martial skill and charisma, commanding respect from both allies and enemies alike."
 eptelon_sword_treasure:0 "Greatsword of Sevan"
 desc_eptelon_sword_treasure:0 "A prestigious charter granting authority over maritime affairs, bearing the seals of the founding merchants. When placed in a holy site, it strengthens diplomatic ties and legitimizes rule."
 eptelon_harbor_charter_equipped:0 "Harbor Charter Bearer"
 desc_eptelon_harbor_charter_equipped:0 "Empowered by possession of the legendary Harbor #Y Charter#!, this ruler gains enhanced martial prowess and persuasive charisma, embodying the authority of a maritime sovereign."
 eptelon_sword_equipped:0 "Greatsword of Sevan"
 desc_eptelon_sword_equipped:0 "The legendary sword from #Y Lake Sevan#! is a masterwork of celestial craftsmanship. Its bearer gains enhanced martial skill and charisma, commanding respect from both allies and enemies alike."
 item_eptelon_harbor_charter: "Sword of Sevan"
 eptelon_sword_treasure_desc: "This powerful sword was gifted to our people by a deity that lives in #Y Lake Sevan#!."

 # Arteon generic mission modifiers (2026-11-09)
 arteon_border_gifts_mod:0 "Gifts to the Border Chiefs"
 desc_arteon_border_gifts_mod:0 "Grain and cloth sent across the boundary have bought us a hearing in the halls of our neighbors."
 arteon_heartland_seat_pmod:0 "Seat of the Heartland"
 desc_arteon_heartland_seat_pmod:0 "The dues of the whole home region now come to this city, and its granaries and courts have grown to match."
 arteon_iron_hills_mod:0 "The Iron Hills"
 desc_arteon_iron_hills_mod:0 "New galleries in the iron hills send ore to our smiths on our own pack trains."
 arteon_guild_charter_mod:0 "The Guild's Charter"
 desc_arteon_guild_charter_mod:0 "The smiths' guild sets the price of our iron and sells the surplus to foreign ships."
 arteon_armory_charter_mod:0 "The Captains' Charter"
 desc_arteon_armory_charter_mod:0 "The war captains claim each season's iron for the armories before any of it reaches the market."
 arteon_forge_city_pmod:0 "Forge City"
 desc_arteon_forge_city_pmod:0 "The forges of this city burn through the night, working iron dug across the island."
 arteon_eternal_forges_mod:0 "Forges of the Eternal War"
 desc_arteon_eternal_forges_mod:0 "Our cohorts march with iron dug and worked under our own banner."
 arteon_horteonian_settlers_mod:0 "Horteonian Settlers"
 desc_arteon_horteonian_settlers_mod:0 "Horteonian families farm the northern fields our wars emptied, and their sons are beginning to answer our musters."
 arteon_old_gods_mod:0 "The Old Gods Prevail"
 desc_arteon_old_gods_mod:0 "The shrines of the old faith burn again on the shore we chose, and their villages keep their own watches."
 arteon_conquerors_trophy_mod:0 "The Conqueror's Coffin"
 desc_arteon_conquerors_trophy_mod:0 "The sarcophagus of Atheus sits in our treasury, a warning to anyone else who would rule this island by force."
 arteon_ascendic_throne_mod:0 "The Ascendic Throne of Arteon"
 desc_arteon_ascendic_throne_mod:0 "Arteon answers to a High Elven court that measures its order by how long it outlasts its founder."
 arteon_sacred_victory_mod:0 "The Isle of Sacred Victory"
 desc_arteon_sacred_victory_mod:0 "The holy war of Viza has won Arteon, and her priests now teach the island to live under her law."
 arteon_old_gods_crown_mod:0 "Crown of the Old Gods"
 desc_arteon_old_gods_crown_mod:0 "The crown of Arteon was taken before the altars of the oldest gods on the island, and their villages guard it."
 desc_arteon_mercenary_discount_mod:0 "Arteon's endless wars keep the mercenary companies hungry for contracts, and they have lowered their prices for a paymaster who keeps them busy."

 # Arteon heritage modifiers (2026-11-09)
 arteon_fisa_dikes_pmod:0 "Fisa's Dikes"
 desc_arteon_fisa_dikes_pmod:0 "Earth banks along the river keep the spring floods off the fields."
 arteon_myahud_silt_pmod:0 "Myahud Silt"
 desc_arteon_myahud_silt_pmod:0 "The river keeps its old bed and leaves rich silt on the fields of the royal city."
 arteon_face_of_viza_mod:0 "The Face of Viza"
 desc_arteon_face_of_viza_mod:0 "The crown carries the war goddess of the kings."
 arteon_face_of_fisa_mod:0 "The Face of Fisa"
 desc_arteon_face_of_fisa_mod:0 "The crown carries the goddess of the farmers and their harvests."
 arteon_face_of_tuma_mod:0 "The Face of Tuma"
 desc_arteon_face_of_tuma_mod:0 "The crown carries the goddess of the caravan masters."
 arteon_carrier_tolls_mod:0 "Carrier Tolls"
 desc_arteon_carrier_tolls_mod:0 "Every pack train on the middle country's roads pays a toll."
 arteon_carrier_rights_mod:0 "Carriers' Road Rights"
 desc_arteon_carrier_rights_mod:0 "The carrier families keep the roads and keep our armies fed."
 arteon_kin_marriages_mod:0 "Kin Marriages"
 desc_arteon_kin_marriages_mod:0 "Our court has married into the families across the border."
 arteon_guest_right_mod:0 "Guest-Right"
 desc_arteon_guest_right_mod:0 "Any column marching under our banner is fed wherever it stops."
 arteon_hospitable_houses_mod:0 "Hospitable Houses"
 desc_arteon_hospitable_houses_mod:0 "The western families keep guest-right, and the crown honors them for it."
 arteon_kept_faith_pmod:0 "House That Kept Faith"
 desc_arteon_kept_faith_pmod:0 "The local house that stayed loyal through the wars has been confirmed in its honors."
 arteon_new_houses_mod:0 "New Houses"
 desc_arteon_new_houses_mod:0 "Captains raised to the nobility lead our armies."
 arteon_schism_mended_mod:0 "The Schism Mended"
 desc_arteon_schism_mended_mod:0 "The northern rite was sent south as a gift, and the old quarrel has cooled."
 arteon_northern_rite_mod:0 "The Northern Rite"
 desc_arteon_northern_rite_mod:0 "We keep the rite of Artheous the man as our own."
 arteon_cousin_hunters_mod:0 "Hunters of the Cursed"
 desc_arteon_cousin_hunters_mod:0 "Our soldiers march against the cursed houses of our own blood."
 arteon_heskoh_compact_mod:0 "The Heskoh Sea Road"
 desc_arteon_heskoh_compact_mod:0 "Trade runs between our ports and the exiles' refuge."
 arteon_pact_renewed_mod:0 "The Oath Renewed"
 desc_arteon_pact_renewed_mod:0 "The three houses keep their wars away from one another."
 arteon_bardidzor_loyalty_mod:0 "The Bardidzor Compact"
 desc_arteon_bardidzor_loyalty_mod:0 "The Bardidzor keep their privilege and their swords stay at our side."
 arteon_old_frost_gods_mod:0 "The Old Gods of the Ice"
 desc_arteon_old_frost_gods_mod:0 "We keep the gods our ancestors brought from Horteon."
 arteon_nivan_cairns_pmod:0 "The Nivan Cairns"
 desc_arteon_nivan_cairns_pmod:0 "Cairns for the Horteonian dead of the First Great War stand on these hills."
 arteon_crown_envoys_mod:0 "Answer to an Atheusian Crown"
 desc_arteon_crown_envoys_mod:0 "An Atheusian crown sends us mercenaries in exchange for our acknowledgment."
 arteon_charter_roll_mod:0 "The Charter Roll"
 desc_arteon_charter_roll_mod:0 "Our rights were won in the Second Great War, and we answer to no crown across the sea."
 arteon_manumission_mod:0 "The Freed Hands"
 desc_arteon_manumission_mod:0 "Freedmen with land to lose work our fields and fill our levies."
 arteon_slave_ledger_mod:0 "The Slave Ledger"
 desc_arteon_slave_ledger_mod:0 "More chained hands work our fields, and more guards watch them."
 arteon_athlarethere_cenotaph_pmod:0 "Cenotaph of Atheus the Younger"
 desc_arteon_athlarethere_cenotaph_pmod:0 "A monument stands where Atheus the Younger fell in 635."
 arteon_athlarethere_fields_pmod:0 "The Ploughed Battlefield"
 desc_arteon_athlarethere_fields_pmod:0 "The field where Atheus the Younger fell has been put back to work."
 arteon_two_altars_mod:0 "Two Altars"
 desc_arteon_two_altars_mod:0 "The realm keeps both its faiths, and many families keep both."
 arteon_one_altar_mod:0 "One Altar"
 desc_arteon_one_altar_mod:0 "The crown stands beside one faith, and the other is losing its followers."
 arteon_conqueror_games_pmod:0 "Games of the Fallen Conqueror"
 desc_arteon_conqueror_games_pmod:0 "Games are held where Atheus the Conqueror died outside the walls."
