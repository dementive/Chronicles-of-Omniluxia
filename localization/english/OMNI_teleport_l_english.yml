 omniluxia_magic_teleport:0 "Teleport Army"
 omniluxia_magic_teleport_desc:0 "Instantly transports the army to the capital. Distance increases mana cost and morale loss."
 omni_teleport_unit_button_tooltip:0 "Cast Fast Travel"
 omniluxia_teleport.1_title:0 "Teleport"
 omniluxia_teleport.1_desc:0 "Arcane energies surge and tear through reality. With a thunderous crack, the army vanishes and rematerializes at the capital. The soldiers are disoriented from the experience."
 omniluxia_teleport.1.a:0 "A most convenient spell."
 me_zorgo_magic_focus.36_title:0 "Fast Travel"
 me_zorgo_magic_focus.36_desc:0 "The general reaches out with their power and prepares to fold space, transporting the entire army across the world."
 me_zorgo_magic_focus.36_tooltip:0 "#Y Fast Travel#!"
 me_zorgo_magic_focus.36.a:0 "The realms are small, and the world is large. Why not make it smaller?"

