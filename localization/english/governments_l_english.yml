 magic_monarchy:0 "Magicratic Monarchy"
 magic_monarchy_desc:0 "The empowerment of the Mage class has infiltrated the highest levels of governance. A Magicratic Monarchy is a monarchy, as such, which is predicated on the Mage class, who control the majority of the politics within the system."
 magic_monarchy_ruler:0 "Sovereign of Souls" 
 magic_monarchy_consort:0 "Mistress of Magic" 
 magic_monarchy_ruler_female:0 "Mistress of Magic"

 kinones_clan:0 "D'ai-D'ai"
 kinones_clan_desc:0 "Although the Sons of Kon are united through faith, their people remain divided amongst hundreds of small kinship groups across the Peaceful Valley. Larger families, or 'D'ai-D'ai', typically maintain a large manor or settlement from where they control minor families through marriage, coercion, and, occasionally, force. Not all of these Great Clans follow the same Kino, however, most treat lower families with the respect preached by Koni-Koni N'de-Bu."
 kinones_clan_ruler:0 "B'au-B'au" 
 kinones_clan_consort:0 "Tz'au-Tz'au" 
 kinones_clan_ruler_female:0 "Tz'au-Tz'au"

 shogun:0 "Nurhanuoragia"
 shogun_desc:0 "As the Nuoragia became well established, more powerful Mu'Mògor sought to exercise control over their neighbors, creating the first Nurhanuoragia and Jauzkar. This relationship evolved into an institution which allowed the new M'Orokoro to claim legitimacy through subjugation as well as devote more time to matters of faith, delegating governance and defence to the surrounding Jauzkar tributaries."
 shogun_ruler:0 "M'Orokoro" 
 shogun_consort:0 "Sha'Kuruzu"
 shogun_ruler_female:0 "Sha'Orokoro"

 independent_shogun:0 "Nuoragia"
 independent_shogun_desc:0 "Developing during the Age of Palaces that followed the collapse of the Great Nurhagorkan, Nuoragia traditionally referred to lands surrounding a Nurago, typically owned and protected by the family who owned the Nuragos. However, as lords began to consolidate lands and power, Nuoragia increasingly came to define all the lands under their control. The Mu'Mògor who ruled these lands slowly combined religious and military authority during the Age of a Thousand Flames, and now control their realm through piety, ritual, and force."
 independent_shogun_ruler:0 "Mu'Mògor" 
 independent_shogun_consort:0 "Sha'Kuruzu" 
 independent_shogun_ruler_female:0 "Sha'Mògor"

 daimyo:0 "Jauzkar"
 daimyo_desc:0 "Jauzkar are strong tributary lords who govern the edges of a Nurhanuoragia's territory, defending their overlord's heartlands from invaders. Not officially within their sovereign's domain, they are allowed a degree of autonomy meant to allow them to expand the influence of their overlord and bestow their M'Orokoro the prestige of dominating a subservient polity. However, disloyal Jauzkar often abuse this autonomy to grow their personal domains and create alliances in hopes of one day becoming a Nurhanuoragia themselves."
 daimyo_ruler:0 "Mu'Jauzkar"
 daimyo_consort:0 "Sha'Kuruzu" 
 daimyo_ruler_female:0 "Sha'Jauzkar"

