 item_gen_tenmari_16_modifier:0 "Fine Tenmarin Recurve of the Volley"
 desc_item_gen_tenmari_16_modifier:0 "Crafted for the keen-eyed hunters of the Tenmari, this bow can loose an arrow with terrifying silence when the situation demands it. It is a fine example of their artisan's skill, highly sought after by local merchants."
 item_gen_tenmari_17_modifier:0 "Fine Tenmarin Amulet"
 desc_item_gen_tenmari_17_modifier:0 "A balanced Tenmari spear, favored by their infantry for its deadly reach and precision in the tight formations of battle. This artifact is so magnificent that it could easily be offered as a gift to a king or a tithe to the gods."
 item_gen_tenmari_18_modifier:0 "Fine Tenmarin Sword of the Tides"
 desc_item_gen_tenmari_18_modifier:0 "A balanced Tenmari spear, favored by their infantry for its deadly reach and precision in the tight formations of battle. It is a true masterpiece, radiating an aura of legendary quality that inspires awe and jealousy in equal measure."
 item_gen_tenmari_19_modifier:0 "Masterwork Tenmarin Warblade"
 desc_item_gen_tenmari_19_modifier:0 "Each plate of this Tenmari armor tells a story of survival, a silent witness to the turbulent history of their people. Subtle details in the design elevate it above a common standard, marking it as a premium good."
 item_gen_tenmari_20_modifier:0 "Masterwork Tenmarin Emblem of the Host"
 desc_item_gen_tenmari_20_modifier:0 "While it appears quite ordinary, a true Tenmari warrior knows that a reliable shield is worth more than a dozen gold coins. It is a fine example of their artisan's skill, highly sought after by local merchants."
