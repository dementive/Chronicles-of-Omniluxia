l_english:
 omni_seduce_character:0 "Seduce"
 omni_seduce_character_act:0 "Attempt to seduce $CHAR$."
 omni_seduce_character_desc:0 "Begin a private courtship intended to win this character's affection."
 omni_seduce_foreign_character:0 "Seduce"
 omni_seduce_foreign_character_desc:0 "Begin a private courtship intended to win this character's affection."
 omni_seduce_character_started_tt:0 "A short seduction event chain will begin. The target may accept, refuse, or expose the approach."
 omni_seduction_gift_tt:0 "The gift improves the chance that the invitation is accepted."
 omni_seduction_flattery_tt:0 "This costs #R 2#! popularity. If the seducer has at least #Y 8#! Charisma, the flattery improves the chance that the invitation is accepted."
 omni_seduction_bold_tt:0 "This adds #R 1#! corruption. If the seducer is #Y Lustful#!, boldness further improves the chance that the invitation is accepted, but it also increases the risk of later exposure."
 omni_seduction_abandoned_tt:0 "The seduction ends without further cost or consequence."
 omni_seduction_careful_tt:0 "This costs #R 1#! popularity, but greatly reduces the risk that a later affair is exposed."
 omni_seduction_daring_tt:0 "This adds #R 2#! corruption. Daring improves the chance that the invitation is accepted, but increases the risk that a later affair is exposed."
 omni_seduction_bribe_servant_tt:0 "The bribe reduces the risk that a later affair is exposed."
 omni_seduction_invitation_sent_tt:0 "The target will now accept or refuse. Spouses, lovers with compatible traits, friends, shared culture, shared religion, and high Charisma improve acceptance; chaste, devout, self-controlled, ill, or rival targets are less likely to accept."
 omni_seduction_mp_accept_tt:0 "Accepting adds #R 1#! corruption to the target and allows the affair to continue."
 omni_seduction_mp_refuse_private_tt:0 "Refusing privately costs the target #R 1#! popularity and ends the seduction."
 omni_seduction_mp_expose_tt:0 "Exposing the seducer gives the target #G 2#! popularity and publicly humiliates the seducer."
 omni_seduction_success_tt:0 "The seducer gains #Y Renewed Affection#! for two years and cannot begin another seduction for three years. The target gains loyalty toward the seducer and an #Y Ongoing Affair#! modifier."
 omni_seduction_rejection_tt:0 "The seduction ends. The target loses loyalty toward the seducer and cannot be pursued by this seducer again for two years."
 omni_seduction_private_night_tt:0 "There is a chance of pregnancy. Non-spouse affairs may also be exposed, especially after bold or daring choices."
 omni_seduction_exposure_tt:0 "The seducer loses #R 10#! popularity and gains #R 5#! corruption. Betrayed spouses may lose loyalty, become rivals, or seek revenge."
 omni_seduction_pregnancy_risk_tt:0 "There is a #Y 50%#! chance that the pregnancy becomes exposed."
 omni_seduction_pregnancy_confess_tt:0 "The pregnancy is revealed and the affair exposure consequences will follow."
 omni_seduction_revenge_risk_tt:0 "Without precautions, the seducer risks assassination, injury, or a loss of popularity."
 omni_seduction_affair_fade_tt:0 "The ongoing affair ends quietly."
 omni_seduction_affair_continue_tt:0 "This adds #R 2#! corruption, renews the affair, and creates another chance of pregnancy or exposure."
 omni_seduction_affair_end_friend_tt:0 "The affair ends and the friendship is broken."
 omni_seduction_active_modifier:0 "Pursuing a Seduction"
 omni_seduction_active_modifier_desc:0 "This character is devoting time and attention to a private courtship."
 omni_renewed_affection:0 "Renewed Affection"
 omni_renewed_affection_desc:0 "A successful romantic encounter has renewed this character's confidence."
 omni_ongoing_affair:0 "Ongoing Affair"
 omni_ongoing_affair_desc:0 "This character is involved in a dangerous private liaison."
 omni_humiliated_by_affair:0 "Humiliated by an Affair"
 omni_humiliated_by_affair_desc:0 "The discovery of a spouse's infidelity has caused humiliation and anger."
 omni_recognized_royal_bastard:0 "Recognized Royal Bastard"
 omni_recognized_royal_bastard_desc:0 "This character's royal parentage is acknowledged, though they have not been made a full dynastic heir."
 omni_legitimized_bastard:0 "Legitimized Bastard"
 omni_legitimized_bastard_desc:0 "This character may inherit, but stands behind comparable legitimate heirs unless explicitly nominated."
 omni_disputed_parentage:0 "Disputed Parentage"
 omni_disputed_parentage_desc:0 "Public exposure of this character's parentage excludes them from the dynasty that raised them unless the claim is rejected."
 omni_bastard_claimant:0 "Royal Bastard Claimant"
 omni_bastard_claimant_desc:0 "This legitimized child openly presses their place in the succession."
 omni_elective_bastard_eligible:0 "Eligible Legitimized Bastard"
 omni_elective_bastard_eligible_desc:0 "This legitimized child may stand as a candidate under elective succession."
 omni_foreign_royal_affair:0 "Foreign Royal Affair"
 omni_bastard_custody_refused:0 "Bastard Custody Refused"
 omni_bastard_denial_insult:0 "Denied Royal Paternity"
 omni_bastard_acknowledged_abroad:0 "Acknowledged Royal Child Abroad"

 omni_seduction.1.t:0 "The First Approach"
 omni_seduction.1.desc:0 "[SCOPE.sChar('omni_seduction_target').GetName|Y] has occupied our thoughts. A careful approach might kindle affection, but a clumsy one could become the court's newest scandal."
 omni_seduction.1.a:0 "Send a thoughtful gift"
 omni_seduction.1.b:0 "Rely upon poetry and flattery"
 omni_seduction.1.c:0 "Arrange a bold private invitation"
 omni_seduction.1.d:0 "Think better of this"
 omni_seduction.2.t:0 "Whispers in the Corridor"
 omni_seduction.2.desc:0 "A servant has lingered too near our private correspondence with [SCOPE.sChar('omni_seduction_target').GetName|Y]. We may proceed discreetly, risk a more daring meeting, or purchase silence."
 omni_seduction.2.a:0 "Proceed with great care"
 omni_seduction.2.b:0 "Desire rewards the daring"
 omni_seduction.2.c:0 "Buy the servant's silence"
 omni_seduction.3.t:0 "The Invitation"
 omni_seduction.3.desc:0 "At last, the invitation has reached [SCOPE.sChar('omni_seduction_target').GetName|Y]. All that remains is the answer."
 omni_seduction.3.a:0 "Await the answer"
 omni_seduction.12.t:0 "A Dangerous Invitation"
 omni_seduction.12.desc:0 "[SCOPE.sChar('omni_seducer').GetName|Y] has pursued [SCOPE.sChar('omni_seduction_target').GetName|Y] with gifts, words, and a private invitation. The choice belongs to the one being courted."
 omni_seduction.12.a:0 "Accept the invitation"
 omni_seduction.12.b:0 "Refuse, but keep the matter private"
 omni_seduction.12.c:0 "Refuse—and expose this shameless pursuit"
 omni_seduction.13.t:0 "A Shameless Pursuit Exposed"
 omni_seduction.13.desc:0 "[SCOPE.sChar('omni_seduction_target').GetName|Y] has refused the invitation and made our private pursuit public. No affair occurred, but the court delights in the humiliation."
 omni_seduction.13.a:0 "Endure the laughter"
 omni_seduction.4.t:0 "An Invitation Accepted"
 omni_seduction.4.desc:0 "[SCOPE.sChar('omni_seduction_target').GetName|Y] has accepted our invitation. Whatever tomorrow brings, tonight belongs to us."
 omni_seduction.4.a:0 "Come to me"
 omni_seduction.5.t:0 "An Invitation Refused"
 omni_seduction.5.desc:0 "[SCOPE.sChar('omni_seduction_target').GetName|Y] has refused the invitation and made it clear that further pursuit would be unwelcome."
 omni_seduction.5.a:0 "Then this ends here"
 omni_seduction.6.t:0 "A Private Night"
 omni_seduction.6.desc:0 "The doors close, the lamps burn low, and for a few stolen hours the burdens of rank and duty are forgotten."
 omni_seduction.6.a:0 "Let the night unfold"
 omni_seduction.7.t:0 "The Affair Exposed"
 omni_seduction.7.desc:0 "What passed in private has escaped into rumor. Spouses, courtiers, and perhaps foreign courts now know enough of the truth to be dangerous."
 omni_seduction.7.a:0 "We must face the consequences"
 omni_seduction.8.t:0 "Vengeance in the Shadows"
 omni_seduction.8.desc:0 "[SCOPE.sChar('omni_avenging_spouse').GetName|Y] has not forgotten the humiliation of the affair. Rumors of hired blades and poisoned cups suggest that wounded pride has become a design upon our life."
 omni_seduction.8.a:0 "Double the guard and buy reliable informants"
 omni_seduction.8.b:0 "I will not be ruled by fearful rumors"
 omni_seduction_revenge_guarded_tt:0 "The revenge attempt is prevented by extraordinary precautions."
 omni_seduction.9.t:0 "A Dangerous Pregnancy"
 omni_seduction.9.desc:0 "The pregnancy of [SCOPE.sChar('omni_pregnant_lover').GetName|Y] has become difficult to conceal. Servants count months, spouses ask questions, and the court has begun drawing its own conclusions."
 omni_seduction.9.a:0 "Pay for silence and careful discretion"
 omni_seduction.9.b:0 "Say nothing and trust to fortune"
 omni_seduction.9.c:0 "The truth must be faced"
 omni_seduction_pregnancy_concealed_tt:0 "The pregnancy remains concealed for now."
 omni_seduction.10.t:0 "A Courtship Abandoned"
 omni_seduction.10.desc:0 "Death, imprisonment, departure, or a change of rule has made the intended courtship impossible. The matter ends without further consequence."
 omni_seduction.10.a:0 "So ends the matter"
 omni_seduction.11.t:0 "The Affair Endures"
 omni_seduction.11.desc:0 "Time has not extinguished the bond between us and [SCOPE.sChar('omni_seduction_target').GetName|Y]. Another private meeting would renew the affair—and renew every risk that accompanies it."
 omni_seduction.11.a:0 "Let the affair fade quietly"
 omni_seduction.11.b:0 "Arrange another meeting"
 omni_seduction.11.c:0 "End the affair and all affection with it"
 omni_seduction.20.t:0 "A Child of Questioned Blood"
 omni_seduction.20.desc:0 "[SCOPE.sChar('omni_bastard_mother').GetName|Y] has given birth to [SCOPE.sChar('omni_bastard_child').GetName|Y], whose true father is [SCOPE.sChar('omni_bastard_father').GetName|Y]. Concealment may preserve the peace, while disclosure could reshape two families—or two kingdoms."
 omni_seduction.20.a:0 "Keep the matter within this court"
 omni_seduction_child_concealed_tt:0 "The child's true parentage will not be publicly acknowledged."
 omni_seduction.20.b:0 "The father must answer for this child"
 omni_seduction.20.c:0 "Acknowledge the blood of the dead"
 omni_seduction.20.d:0 "Legitimize the child as mine"
 omni_seduction.20.e:0 "Legitimize the child and name them heir"
 omni_seduction.21.t:0 "A Bastard Claims Our Blood"
 omni_seduction.21.desc:0 "Word has arrived that [SCOPE.sChar('omni_bastard_child').GetName|Y], born to [SCOPE.sChar('omni_bastard_mother').GetName|Y], is our child. We may deny the accusation, acknowledge the blood tie, or legitimize the child and bring them into our dynasty."
 omni_seduction.21.a:0 "I deny everything"
 omni_seduction.21.b:0 "Acknowledge the child, but no more"
 omni_seduction.21.c:0 "Legitimize the child and bring them home"
 omni_seduction.21.d:0 "Legitimize the child and name them heir"
 omni_seduction.22.t:0 "A Demand for the Royal Bastard"
 omni_seduction.22.desc:0 "[SCOPE.sChar('omni_bastard_father').GetName|Y] has legitimized [SCOPE.sChar('omni_bastard_child').GetName|Y] and demands that the child be surrendered to [SCOPE.sChar('omni_bastard_father').GetHerHis] court. Compliance will place the child in a foreign succession; refusal will preserve our custody at the cost of a lasting quarrel."
 omni_seduction.22.a:0 "Send the child to their father's court"
 omni_seduction.22.b:0 "The child remains here"
 omni_seduction.22.c:0 "Reject the claim—the child is ours"
 omni_seduction.23.t:0 "The Father Denies the Child"
 omni_seduction.23.desc:0 "[SCOPE.sChar('omni_bastard_father').GetName|Y] has denied any part in the birth of [SCOPE.sChar('omni_bastard_child').GetName|Y]. We may accept the denial and restore the child's standing here, or maintain the accusation despite the insult."
 omni_seduction.23.a:0 "Accept the denial and claim the child as ours"
 omni_seduction.23.b:0 "The truth is not erased by cowardice"
 omni_seduction.24.t:0 "The Father Acknowledges the Child"
 omni_seduction.24.desc:0 "[SCOPE.sChar('omni_bastard_father').GetName|Y] has publicly acknowledged [SCOPE.sChar('omni_bastard_child').GetName|Y], though no legitimization has been offered. The child may remain here or be sent to know [SCOPE.sChar('omni_bastard_child').GetHerHis] father's court."
 omni_seduction.24.a:0 "The child remains under our protection"
 omni_seduction.24.b:0 "Send the child to the father's court"
 omni_seduction.30.t:0 "A Royal Bastard Comes of Age"
 omni_seduction.30.desc:0 "Born beneath the shadow of scandal, [ROOT.GetName|Y] has reached adulthood. The circumstances of [ROOT.GetHerHis] birth can no longer decide the whole of [ROOT.GetHerHis] life."
 omni_seduction.30.a:0 "Seek a place at my father's court"
 omni_seduction.30.b:0 "I will make my own name"
 omni_seduction.30.c:0 "My blood gives me a rightful claim"
 omni_seduction.31.t:0 "A Crown Within Reach"
 omni_seduction.31.desc:0 "Years of whispers have hardened into supporters who call [ROOT.GetName|Y] the rightful blood of [SCOPE.sCountry('omni_claimed_realm').GetName|Y]. A claim may be abandoned, cultivated within the realm, or carried home behind foreign spears."
 omni_seduction.31.a:0 "Blood alone does not make a sovereign"
 omni_seduction.31.b:0 "Gather a faction within the realm"
 omni_seduction.31.c:0 "Call upon my host to press the claim"
 omni_seduction.31.d:0 "Wait for a more favorable hour"
 omni_seduction.32.t:0 "The Bastard's Faction"
 omni_seduction.32.desc:0 "The faction around [ROOT.GetName|Y] has become impossible to ignore. Its adherents demand a place in the succession, while impatient voices insist that only open revolt can settle the blood claim."
 omni_seduction.32.a:0 "Dissolve the faction and accept the succession"
 omni_seduction.32.b:0 "Build our strength and continue the pressure"
 omni_seduction.32.c:0 "Raise our banners for the crown"
 omni_bastard_claim_wargoal:0 "Bastard Claim Invasion"
 omni_bastard_claim_wargoal_desc:0 "A foreign-backed legitimized royal bastard is pressing a dynastic claim by force."

 loyalty_omni_seduction_accepted:0 "Affection Encouraged"
 loyalty_omni_seduction_rejected:0 "Unwanted Approach"
 loyalty_omni_betrayed_spouse:0 "Betrayed by an Affair"
 loyalty_omni_betrayed_spouse_forgiving:0 "Struggling to Forgive an Affair"
 loyalty_omni_bastard_acknowledged:0 "Bastard Denied"
 loyalty_omni_bastard_legitimized:0 "Bastard Legitimized"
 loyalty_omni_claimant_faction:0 "Gathering a Claimant Faction"
 loyalty_omni_claimant_reconciled:0 "Claim Reconciled"
 loyalty_omni_claimant_escalating:0 "Escalating a Blood Claim"
