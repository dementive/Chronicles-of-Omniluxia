l_english:
 omni_propose_dynastic_alliance:0 "Propose Dynastic Alliance"
 omni_propose_dynastic_alliance_act:0 "Propose a marriage and alliance to $CHAR$."
 omni_propose_dynastic_alliance_act_past:0 "Proposed a marriage and alliance to $CHAR$."
 omni_dynastic_alliance.1.t:0 "A Marriage Between Rulers"
 omni_dynastic_alliance.1.desc:0 "[SCOPE.sChar('omni_alliance_suitor').GetName] proposes marriage to [SCOPE.sChar('target').GetName] and an alliance between our countries."
 omni_dynastic_alliance.1.a:0 "Accept the marriage and alliance."
 omni_dynastic_alliance.1.b:0 "Decline the proposal."
 omni_dynastic_alliance.2.t:0 "A Dynastic Alliance"
 omni_dynastic_alliance.2.desc:0 "The foreign court has accepted. Our rulers have wed, and the two countries have formed an alliance."
 omni_dynastic_alliance.3.t:0 "Dynastic Alliance Declined"
 omni_dynastic_alliance.3.desc:0 "The foreign court has refused our marriage proposal."
 omni_dynastic_alliance.4.t:0 "Dynastic Alliance Lapsed"
 omni_dynastic_alliance.4.desc:0 "Circumstances changed while our proposal was pending. The wedding cannot go ahead."
 omni_dynastic_alliance.ack:0 "Very well."
