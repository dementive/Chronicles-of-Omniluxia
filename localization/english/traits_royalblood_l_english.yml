l_english:
 
 # Bloodlines
 zani:0 "Blood of Zanis"
 zani_desc:0 "#G Zanis Zani#! was the legendary founder of the #T Zani Empire#!, a dynasty that has ruled the Empire since the days of the #Y Eagelian Kingdom#!. The martial and civic skills of the #Y Zani#! allowed them to rule over the largest Empire #G Omniluxia#! had ever seen."
 aspatta:0 "Blood of the Aspatta"
 aspatta_desc:0 "Legendary Kings of #T Saptarum#! since its inception, the #Y Aspatta#! were said to have all died out after the Sacking of #G Saptabi#! in 619 LC. They were known as charismatic leaders and ambitious builders."
 duggmoggen:0 "Blood of the Duggmöggen"
 duggmoggen_desc:0 "The legendary house of the mythical #Y King Hefdarr#! 'to Tögg', the main Duggmöggen line was said to have died with the King, as he produced no claimed heirs to his lineage. However, blasphemous rumors stated that he had sired a bastard child with a lady in waiting from one of the other branches of the Duggmöggen House."
 sertem: "Blood of the Sertem"
 sertem_desc: "Srandenr #Y Sertem#!, the founder of the bloodline, was an admiral that proved his worth to #T Zanis#! the Great and after years of faithful service, the loyal warrior was granted the governorship of the rich #Y Baetep#! province. His descendants managed to hold on to their authority after the #Y Great Collapse#!, and were eventually strong enough to declare their independence from the #T Razani Empire#!. The #T Sertemic Dynasty#! has ruled as #G Pharons#! for around fifty years now and they are a major player in the politics of western #G Luxterra#!."
 dune: "Blood of the True Pharons"
 dune_desc: "The last native #G Pharon#! of #Y Baetep#!, #G Khewer#!-Sedjet #Y Djedhid#!, was defeated by the armies of #T Zanis#! the Great and forced to abandon his birthright and flee south alongside his family. Finding refuge in the city of #G Djeba#!, his ancestral home, the broken armies of the #Y Baetep#! Empire managed to repel the invading forces sent to destroy them, and in the years to come, #G Khewer#!-Sedjet would unite four cities into a kingdom that he named Dune. It is the hope of his heirs that they will one day be able to defeat the foreigners that stole their Empire and reclaim the crown as the true #G Pharons#! of #Y Baetep#!."
 edis: "Blood of Edis the Grim"
 edis_desc: "#T Edis the Grim#! was an ambitious Copper #Y Dwarven#! adventurer that formed the #Y Kingdom#! of #T Qoes#! and built the city of #G Bad-Furqorin#! on its prized farmlands. A failed statesman that was involved in a failed plot against the corrupt #G High#! #G Priests of#! the Skyreach Passes, Edis was banished by his kinsmen to live in the #G Deep Rift Valley#! and ordered to abandon his governorship. Instead of leaving peacefully, however, Edis spent a small fortune hiring soldiers, and after assembling an army of discontents and mercenaries to follow him, he launched a surprise attack against the native #Y Goblins#! and #Y Selaskusian#! tribes living on the #G Skyreach Steppes#!, forcing them back from their homelands at the foot of the mountains. His descendants rule as the Kings of #G Bad-Furqorin#!, the preeminent city of the region."
 cyrogelos: "Blood of Cyrogelos"
 cyrogelos_desc: "#Y Cyrogelos#! was the right hand of #T Zanis#! the Great, and there is no question that the #Y Emperor#! would have failed without the legendary general by his side. Rising through the ranks of the Imperial #G Army#!, #Y Cyrogelos#! would introduce a series of reforms that would ensure the success of the #Y Zani#! soldiers on the battlefield. Once these initiatives on land were completed, #Y Cyrogelos#! would spend the next twenty years sailing the seas, winning hundreds of engagements for the #T Zanis#! #G Navy#!. At the end of a long, storied life that is filled with countless tales of heroic feats - #Y Cyrogelos#! personally saved the life of #T Zanis#! more than once - the brave sailor was gifted a crown by #T Zanis#! and would rule as King of the #Y Ytali#!. He remains the archetype of the faithful soldier."

 zorgolis: "Blood of Zorgolis"
 zorgolis_desc: "Infamous writer and orator, #Y Zorgolis#! of #G Gevanni#! is a figure both beloved and hated amongst the people of the late #T Razani Empire#!. Although the Gevannic #Y Senate#! had long become a more ceremonial institution, #Y Zorgolis#! used his platform to champion land reform and speak out against the landed aristocracy that pushed returning soldiers out of their lands and into the various slums of the empire. Unfortunately, his prominence and populist policies got him arrested by the #Y Governor#! of the Neo Ytalianes under charges of treason, and he spent his final years in a dungeon where he would write his final memoirs in what would become the Tales from the #Y Zanic#! Age. Finally, on the first of Zanisolizan, he was executed."

 blood_of_midnadg: "Blood of the Ular-Pria"
 blood_of_midnadg_desc: "After many trials and tribulations, the #Y Snakefolk#! have reunited their shattered Empire, ushering forth a new era in which the #Y Ular-Pria#! reign over the #Y Austropetolian Isles#!. A new bloodline of Emperors has been established by the ascendent #Y Snakefolk#!, who have proclaimed their right to rule over the lands formerly held by their ancestors."

 blood_of_azar: "Blood of the Azar Kings"
 blood_of_azar_desc: "Hundreds of years ago, when the Empire of the #T Golden Dwarves#!, the #Y Mahdad Sho-Tan'Maat Ma'Azari#!, fell to the invading forces of the #T Zani Empire#!, no one could have foreseen that the #T Azar#! #Y Gold Dwarves#! would rise from the ashes of their defeat. But the #Y Azari#! have defeated their enemies and have rebuilt their civilization, and they will not be stopped until they have restored their borders."

 blood_of_euralyean: "Blood of the Euryalids"
 blood_of_euralyean_desc: "When the #Y Great Collapse#! destroyed the Empire of the #Y Ular-Pria#!, the #Y Snakefolk#! living on the island of #G Kraklaz#! were the first to pull themselves out of the mire. From the citadel of #G Siznl#!, one of the only cities untouched by the calamity, the #Y Uriyalok#! rapidly subdued all opposition to their authority and soon took the entire island for themselves."

 blood_of_nazani: "Blood of the Nazani"
 blood_of_nazani_desc: "The Imperials of the West consider themselves to be #Y Nazani#! first and foremost, even though many of their Royal Houses were founded by cadet branches of the #Y Zani#! Dynasty. Ever since the #T Zani Empire#! split in 690 LC, the history of the #Y Nazani#! has been shaped and formed by the tumultuous events happening on #G Morrigon#!, not #G Luxterra#!, and the people have forgotten many of the cultural connections that they once shared with their eastern cousins. The 'Western #Y Zani#!' do not celebrate the distant accomplishments of a long-forgotten conqueror from a foreign land, but choose to honor the #Y Nazani#! Emperors that have ruled them for some three hundred years."

 blood_of_prophet: "Blood of the Zakara"
 blood_of_prophet_desc: "Descendants of the great #T Daro Zakara#!, first Kalif of the Zakara Kephal, the Zakara are one of the oldest families in #G Luxterra#!, with some claiming that they descend from the ancient Kings of the pre-#T Zainudian#! #T Zaraken Empire#!. However, with much of their bloodline slaughtered in the aftermath of the #T Great Zinduidian Revolt#!, the royals of this lineage now concern themselves with ensuring the continuation of their bloodline."

 blood_of_soventeir: "Blood of Uttarasmake the Great"
 blood_of_soventeir_desc: "The blood of #T Uttarasmake the Great#!, the first #Y Soventeir#! #Y Emperor#! and destroyer of the Yarenamian tribes, flows in the veins of this person, marking them as a member of one of the most elite #T Dragkhanic#! families and granting to them mystical powers. Uttarasmake was a mighty warrior and visionary that reformed the political structures of the #Y Dragkhans#!, and his radical transformation of their tribal culture is what allowed the #T Soventeir Empire#! to be established. After his reign, no longer would his people be considered mere raiders and savage nuisances - a first in their history."

 blood_of_jarenam: "Blood of the Totrazi"
 blood_of_jarenam_desc: "The #Y Totrazi#! clan, through guile and intrigue, managed to come out as the rulers of what was left of #Y Jarenam#! the Formidable's empire. Their line is known for their tactical minds and silver tongues, characteristics highly praised in #Y Dragkhan#! culture which allowed them to rise to become one of the great clans that followed #Y Jarenam#! on his conquest of #G Western Luxterra#!."

 blood_of_myahudya: "Blood of the Victory Goddess"
 blood_of_myahudya_desc: "The #G Victory Goddess#! has blessed the ancestors of this individual with powers beyond mortal comprehension as a sign of the promised victory to come. Set aside from birth to fight for the #T Viktreic#! Faith, this character has been entrusted with divine abilities in the hopes of obtaining victory over their enemies."

 blood_of_girm: "Blood of the Zalthu"
 blood_of_girm_desc: "Sons of the great warlord #T Girm#! #Y Zalthu#!, the #Y Zalthu#! clan are the traditional rulers of #G Droishuilco#!, the greatest of the #Y Droishu#! settlements. Using his tactical mind and reforming the dysfunctional clan-based systems his people traditionally relied on, Lord #T Girm#! was able to march his men across the #G Dragon's Pass#!, finally uniting the disparate #G Hobgoblin#! tribes for the first time in centuries. Those who inherit his bloodline are keen to meet and even surpass his achievements."

 sanguine_blood: "Sanguine Blood"
 sanguine_blood_desc: "To mischaracterize and reduce the divine capabilities of the Sanguine Blood to being a '#Y Drow#! bloodline' reveals a fundamental misunderstanding about its nature; this is no mere trait to be passed on from father to son, mother to daughter, but a gift from the Eternal Darkness that has manifested itself into being. Those marked with the Sanguine Blood are chosen by the #T Blood-Stained#! gods and destined to become the nobility of the #Y Sanguine Confederacy#!."

 atheus: "Blood of Atheus the Conqueror"
 atheus_desc: "Although thousands of #Y High Elven#! slave ships have sailed from #G Luxterra#!, the greatest adventurer of them all was #T Atheus#!, the legendary general that invaded the frozen island of #G Horteon#!. The #Y High Elven#! invaders quickly destroyed all resistance to their rule before turning their attention to the prize of #Y Arteon#! to their south, and although #T Atheus#! would fall in battle outside the walls of #G Saousvad'E#! a few years later, his legacy of destruction and enslavement remains an inspiration to those living within the #T Atheus Dominion#!."

 blood_of_duny: "Blood of the Gundogdu"
 blood_of_duny_desc: "The Gundogdu clan has led the #T Gokruç#! since the founder of their family, #Y Orçuz Gundogdu#!, took charge of the tribe during the #T Great Invasions#! of the 650s. Fighting off other nomadic tribes and #Y Zanic#! invaders, the Gundogdu ensured that the #Y Duny#! survived until the great collapse destabilized the enemies of the children of #Y Dzunge Duny#!.  His descendants are known across the steppes as fierce and noble warriors who will sacrifice their lives in the pursuit of freedom."

 aurezdun: "Blood of the Jodok"
 aurezdun_desc: "The Jodok Kings have long fought off the encroachments of the #Y Aralans#! - and despite their #Y Zanic#! ancestry, there is no doubt that they are the only bulwark against #Y Aralans#! domination. Both powers have struggled against each other for control over #G Rohenoa#! and #G Rohevia#!, while the native Rohenoans are often either helpless victims or forced to pick a side. Expert horsemen whose knights dominate the plains, the knights of the Jodok clan are unequalled when fighting on open ground."

 blood_of_aralans: "Blood of the Merovingi"
 blood_of_aralans_desc: "The traditional Kings of the #Y Aralans#! come from the #Y Merovingi#! family, whose clan exercised their control over the #Y Aralans#! from their seat of power at #G Racgerrac#!. As a foreign people to the #G Rohenevian Peninsula#!, the #Y Aralans#! mercenaries remaining in the region were forced to unite under them once the #Y Zani#! abandoned them. However this trial by fire worked in their favor, as the warrior-kings of the #Y Merovingi#! forged a #Y Kingdom#! only rivaled by the #T Aurezdun#! of the north."

 blood_of_vetalian: "Blood of Vetalians"
 blood_of_vetalian_desc: "There were not many countries that were able to resist the armies of the #T Zani Empire#! or her colonists - ancient Empires were ground into dust and Kingdoms were shattered forever in the wake of the Great #Y Conqueror#! - but the #Y Vetalians#! of #G Morrigon#! were able to keep their independence at a time when others became slaves. The descendants of those proud tribesmen that kept out the strongest legions in #G Omniluxia#! are said to be brash, hot-headed warriors that love nothing more than seeking death on the battlefield."

 blood_of_ranazu: "Blood of Ranazu"
 blood_of_ranazu_desc: "The Ranazu goblins have managed to defeat not only their neighboring tribes to achieve power, but have also managed to destroy both #Y Dwarven#! and #G Elven#! armies sent to dislodge them from their caverns and caves deep within the #Y Skyreach Passages#! - no mean feat. Masters of launching surprise attacks, the armies of #T Nalafu#! raid throughout the Passages and the Foothills with impunity, enslaving any foolish enough to live close to their borders."

 blood_of_rendun: "Blood of Rendun"
 blood_of_rendun_desc: "For the first time in recorded history, an #Y Orcish#! tribe has defeated and destroyed all challengers to their authority and have united the island of #G Rendun#! under its banner. #G Rendun#! has long been a place of chaos and warfare, for no one was ever able to establish a hegemony, and yet the members of this bloodline descend from those that conquered where no others had conquered before."

 blood_of_zewggad: "Blood of the Gazabi"
 blood_of_zewggad_desc: "How does a small island manage to maintain not only its independence when surrounded by some of the largest Empires in #Y Omniluxian#! history, but also has a thriving and vivacious democracy that has sometimes plunged the tiny island into civil war? With the natural gifts of diplomacy and political know-how that the original founders of the #T Zewggad Republic#! were blessed with, a trait that is common today in some of the Senators and #T Citizens#! of that fair isle."

 blood_of_eldritch: "Blood of the Eldritch Forest"
 blood_of_eldritch_desc: "Those Wood #T Elves#! that are blessed with the Blood of the Eldritch Forest can claim that they are descended from the Mother Goddess herself, and that they share the same soul and destiny as the #G World's Lungs Forest#! and #G Omniluxia#! itself. Hailing from the most ancient caretakers of the First Trees, the bearers of this bloodline have a special connection to nature and animals and are natural #G Druids#!."

 blood_of_sea_elves: "Blood of Alu-U Rethil-Ac"
 blood_of_sea_elves_desc: "Eons ago, an expedition of #Y Dori-sir#! #T Elves#! sailed far from their homelands in search of adventure and plunder, and after a perilous journey of forty days and nights, their armada was shipwrecked on the desolate #G Central Omniluxian Isles#!. Fearing that Death would soon claim them, the leader of these intrepid explorers, Alu-U Rethil-Ac, made a pact with #Y Na'athran#! to save their lives; the #Y Dori-sir#! would offer their #G Elven#! longevity to the gods if he would agree to make their small islands fertile. #Y Na'athran#! heard their supplications and granted their request, causing eldritch forests to grow in the mountains of #G Anror Ta-Oswir#!. The descendants of Rethil-Ac continue to rule over their island from the citadel of #G Tuar-Antlada#!."

 blood_of_eastern_star: "Blood of the Eastern Star"
 blood_of_eastern_star_desc: "When the #T Star from the East#! fell into #G Northstar Bay#! in ancient times, there were those living amongst the #Y Mikkosrie#! tribes that were unafraid of the Strangers that emerged from the water and welcomed them to their settlements. The #Y Visitors#! would teach the tribesmen the ways of civilization and religion, and the #G Stellaric Faithful#! remember these priceless gifts bestowed upon their ancestors to this day. Those that carry the Blood of the Eastern Star are blessed with a divine blood that can be traced to these mysterious Strangers that came to #G Omniluxia#! many years ago."

 blood_of_herue: "Blood of the Walantidottir"
 blood_of_herue_desc: "The #Y Walantidottir#! dynasty has ruled over #G Herue#! since the legendary King Norraksgaelg conquered the capital of the Iolsim #Y Kingdom#!, founding #G Dawaon#! and establishing the #G Kingdom of Herue#!. Kings of this dynasty are known to be pious and patrons of the arts, promoting stability in the lowlands."

 blood_of_kadjka: "Blood of the Kadjka"
 blood_of_kadjka_desc: "Heirs to the Eternal Empire of Njaringa, the Kadjka kings of #G Yadjar#! have been tasked with being the bastion against the Nadbaji invaders since the founding of their city. Fierce warriors and guardians of the #Y Dragon#! Tutkamud, this ambitious line dreams of one day reuniting all #Y Arame#! who pass through #T Ijminga#!."

 blood_of_kyoshii: "Blood of the Kyoshii"
 blood_of_kyoshii_desc: "According to the oldest scrolls available in the empire, the mighty Purple Emperors of #G Yokoshkyo#! have ruled the #Y Mycelar#! since time began, as their bloodline was consecrated by Kagayamashko when they were birthed from it. Since then, it has been their sacred duty to bring all independent minds under their authority to create an eternal union with the #T Great Mycelium#! itself."

 # New World Bloodlines
 blood_of_saurthi:0 "Blood of the First Scale"
 blood_of_saurthi_desc:0 "The oldest of the New World races, the #Y Saurthi#! were born from the primordial swamps when the world was still young. Those who carry the #T Blood of the First Scale#! are said to be direct descendants of the original Lizard Kings that emerged from the mists of prehistory, their authority rooted in an unbroken lineage stretching back to the dawn of creation itself."
 blood_of_chivix:0 "Blood of the Hive Queen"
 blood_of_chivix_desc:0 "The #Y Chivix#! trace their bloodline to the first #T Hive Queens#! that established order from chaos in the great insectoid colonies of the New World. The descendants of these ancient matriarchs carry within them the collective memory and unity of purpose that allowed their people to build great cities where only wilderness once stood."
 blood_of_ayrith:0 "Blood of the High Aerie"
 blood_of_ayrith_desc:0 "The #Y Ayrithi#! and their kin have ruled the skies of the New World since time immemorial, their great aeries perched atop the highest peaks. The #T Blood of the High Aerie#! marks those who descend from the first Winged Lords that forged covenants with the winds themselves, binding their lineage to the sovereignty of the mountain-fastnesses."
 blood_of_mycelar:0 "Blood of the Deep Mycelium"
 blood_of_mycelar_desc:0 "The #Y Mycelar#! are one with the great fungal networks that pulse beneath the New World, their consciousness intertwined with the living earth. Those who carry the #T Blood of the Deep Mycelium#! are recognized as the living avatars of the #T Great Mycelium#! itself, their authority as natural and unassailable as the roots of the oldest fungus-fields."
 blood_of_tsaalan:0 "Blood of the Dragon Emperor"
 blood_of_tsaalan_desc:0 "The #Y Tsaalan#! claim descent from the ancient #T Dragon Emperors#! that once ruled the eastern reaches of the New World with scales of gold and breath of fire. The blood of these majestic beings flows strong in the veins of their heirs, granting them the right to command the lesser draconic kin and demand tribute from all who would oppose them."
 blood_of_vothkin:0 "Blood of the Stone Forge"
 blood_of_vothkin_desc:0 "The #Y Vothkin#! were hewn from the living rock of the New World's deepest mountains, their ancestors taught by the earth itself to shape stone and metal into works of wonder. The #T Blood of the Stone Forge#! passes from master to apprentice, father to son, carrying the sacred knowledge of the deep delvings and the ancient runes of power."
 blood_of_ulvenar:0 "Blood of the Moonhowl"
 blood_of_ulvenar_desc:0 "When the twin moons of the New World rise, the #Y Ulvenar#! answer the call of their wild ancestors. The #T Blood of the Moonhowl#! is a savage gift passed down from the first hunters that tamed the primal wilderness, marking its bearers as the chosen chieftains of the great packs that roam the untamed lands."
 blood_of_selkanu:0 "Blood of the Tide Mother"
 blood_of_selkanu_desc:0 "The #Y Selkanu#! emerged from the deep oceans of the New World, their cities built in harmony with the eternal rhythm of the tides. The #T Blood of the Tide Mother#! grants its bearers dominion over the coastal waters and the creatures that dwell within, marking them as the rightful stewards of the boundless blue realms."
 blood_of_khedrim:0 "Blood of the Burning Heart"
 blood_of_khedrim_desc:0 "Deep within the volcanic forges of the New World, the #Y Khedrim#! were forged in flame and fury. The #T Blood of the Burning Heart#! beats with the fire of the world's core, passed down through generations of master smiths and warrior-kings whose skill at the anvil is matched only by their prowess on the battlefield."
 blood_of_tenmari:0 "Blood of the Shadowed Throne"
 blood_of_tenmari_desc:0 "The #Y Tenmari#! dwell in the twilight realms beneath the New World, where the light of the sun dares not trespass. The #T Blood of the Shadowed Throne#! marks those who descend from the first Dark Lords that carved kingdoms from the endless caverns, their cunning and ambition as boundless as the darkness they command."

 # Species
 high_elf_trait: "High Elf"
 high_elf_trait_desc: "#Y High Elves#! came from the continent far apart from the rest of #G Omniluxia#!, and they appear to be distant relatives to the Wood #T Elves#!.\nElves live far longer than human race, though at some point their bodies cannot keep up and start becoming disabled, part by part, even though their minds remain fully intact until death."
 forest_elf_trait: "Wood Elf"
 forest_elf_trait_desc: "Wood #T Elves#! live in the forests of #G Omniluxia#!. Since the very first flora was born, elves were created by Mother Nature to protect forests and guide other races.\nWood elves live for very long lifespans, and when their bodies become too shallow to maintain, they start to tranform into plants - in most of the cases, large trees."
 half_elf_trait: "Half Elf"
 half_elf_trait_desc: "Children of #T Elves#! and #T Humans#!, #Y Half Elves#! inherit the best traits of both races, living longer than the average human and being more cunning and open to innovation. Since there are not many of them, they typically adopt the culture of either their human or elven parent, occasionally creating their own societies such as the #Y Dinaril#! of #Y Vetalia#!, Alu-sarians of Arteonia, or the Werhenssians of #G Luxterra#!."
 
 orc_trait: "Orc"
 orc_trait_desc: "Orcs are a proud people that were born a long time ago on the Bloody Islands; they are stronger than humans but less agile.\nMost important for orcs is their #T Inner Flame#!; orcs are driven by their spiritual need that develops through their lifespan. Orcs are often lost in their desires - most often, it is desire of blood or flesh. Many #Y Orcish#! tribes have started performing various rituals or arts that would allow them keep their #T Inner Flame#! intact."
 snakefolk_trait: "Snakefolk"
 snakefolk_trait_desc: "#Y Snakefolk#! are a race that is as old as #G Omniluxia#! itself - it is known by all that they want nothing more than to be left alone by the rest of the world, as the many islands they inhabit provide everything a snake could ever need."
 half_snake_trait: "Naga"
 half_snake_trait_desc: "Known to those outside the archipelago as the #Y Austropetolians#!, the #Y Naga#! are what remains of the human slaves of the former #Y Ular-Pria#! Empire. Rejected by human society and seen as lessers in serpentine nations, #Y Naga#! communities have developed to value martial abilities as they are often forced to protect their insular societies."
 human_trait: "Human"
 human_trait_desc: "#Y Human#! race is the most common race in #G Omniluxia#!; born alongside the #Y Kinones#!, they are a strong and versatile race that develops more everyday."
 goblin_trait: "Goblin"
 goblin_trait_desc: "#Y Goblins#! can be found deep in the mountains of #G Omniluxia#! as far away from any trace of civilization as possible. #Y Goblins#! are primitive beings as old as the world itself, known to many as the 'Scourge of Skyreach'. There are countless tales that recount the deadly ambushes and the ensuing slaughter told by any foolish enough to enter their domain. Their lives shortened by their pact with #Y Melodias#!, #Y Goblinic#! hordes are only made possible by their high fertility and large kinship groups."
 drow_trait: "Drow"
 drow_trait_desc: "The #Y Drow#!, also known as 'Dark #T Elves#!', are among the many ancient races of #G Omniluxia#!. They are direct descendants of high elves but have changed in irreversible ways due to living deep underground for thousands of years."
 wraith_trait: "Wraith"
 wraith_trait_desc: "#Y Wraiths#! are semi-human creatures that have been shaped by the dark corruption of the void after being cast into the chasm by the #Y Great Collapse#! where they festered for hundreds of years and developed otherworldly traits. Anywhere they go, anything they gaze upon, and anyone they touch turns to black. The mere sight of a wraith is enough to end the life of most men as the corruption of the darkness consumes their soul before even getting a chance to look away."

 zorg_trait: "Zorg"
 zorg_trait_desc: "$zorg_heritage_desc$"

 hobgoblin_trait: "Hobgoblin"
 hobgoblin_trait_desc: "The #T Hobgoblins#!, rumored to be a twisted mixture of #Y Elvish#! and #Y Goblinic#! blood, are a warlike and unruly people not united since the ascendance of the #Y Zalthu Clan#!. From the skilled horsemen of the #Y Urhuk#! clans, to the #Y Shoishoni#! mages of Shoptolan, to the hardy mountain warriors of the #Y Jishani#! and #Y Ahualtzi#! peoples, their warbands are only matched by the organization and unity of more settled peoples."

 silver_halfling_trait: "Silver Halfling"
 silver_halfling_trait_desc: "The result of a union between a #Y Silver Dwarf#! and a #Y Human#!, the Silver #Y Halflings#! are one of the rarest races in #G Omniluxia#!. #Y Silver Dwarven#! familial values have made relationships with other races taboo, so the few Silver #Y Halflings#! that exist are typically expelled and either integrate into human society or live isolated lives. Short, sturdy, and brave, Silver #Y Halflings#! are renown for their courage, as they often believe they have something to prove."
 halfling_trait: "Copper Halfling"
 halfling_trait_desc: "The most common type of #Y Halfling#!, Copper #Y Halflings#! can be found in the #Y Halfling#! Hills near the #Y Dwarven Grandlands#! or near the Western Skyreach foothills. The children of #T Humans#! and Copper #T Dwarves#!, many of them choose to integrate into either #Y Human#! or #Y Dwarven#! society, however their status as neither fully human nor dwarf have led them to develop their own kingdoms where they can be among their own kin."

 gnome_trait: "Gnome"
 gnome_trait_desc: "Short with grey skin, the #Y Gnomes#! are a devout people that are the original inhabitants of the northern islands of #G Horteon#! and #G Polaria#!. Their appearance allows them to blend into their polar environment and centuries of isolation have made them fanatic worshippers of #G Wielkopan#! alone. To outsiders, they are often seen as erratic or strange, but despite this they are a very hardworking and jovial race who await the coming of their prophet."
 deep_gnome_trait: "Deep Gnome"
 deep_gnome_trait_desc: "Cursed with burning purple skin, the #Y Deep Gnomes#! are an aggressive people who will attack foreigners without warning. Similar in ferocity to the Drows, these puppets of #Y Melodias#! live nomadic lives in the expansive caverns of the #G Deep Rift Valley#!."

 sea_elf_trait: "Sea Elf"
 sea_elf_trait_desc: "Isolated from most of #G Omniluxia#!, the #G Sea Elves#! are descendants of #Y High Elves#! who shipwrecked onto the #G Central Omniluxian Isles#!. These #T Elves#! traded their long lives to breathe life into the barren islands they now inhabited through a pact with #Y Na'athran#!, who brought saplings from the #G World's Lungs Forest#! and planted them on the island of #G Anror Ta-Oswir#!. With shorter lifespans than their cousins, the #G Sea Elves#! produced great cities and philosophers whose scant traces only remain in the few embers of civilization scattered across the Isles after the #Y Great Collapse#!."

 kinones_trait: "Kinones"
 kinones_trait_desc: "Distant cousins to Humanity, the Kinone of the #G Peaceful Valley#! are often confused with #Y Halflings#! due to their short stature and strong build. However, their peaceful nature and long faces distinguish them as a distinct people who focus their efforts on agriculture and trade, only fighting others when no other options present themselves."

 copper_dwarf_trait: "Copper Dwarf"
 copper_dwarf_trait_desc: "The youngest of the dwarven races, the Copper #T Dwarves#! hail descent from the pairing of #Y Frei#! and #Y Dwadais#! who emerged from the caves of #G Didnll#!. Their homeland is #Y Anempanso#!, translating directly into the term Skyreach, an indelicate yet fitting name for their mountainous abode."
 
 gold_dwarf_trait: "Gold Dwarf"
 gold_dwarf_trait_desc: "The middle children of dwarven kind, the #T Golden Dwarves#! claim descent from the semi-divine #Y Summsîr#! and Ava, whose birthplace were the caves of #G Rinekkud#!. From their mythic cradle did they lead their children into places far beyond the confines of their initial dwellings, thus forging the land of Azaria."
 
 silver_dwarf_trait: "Silver Dwarf"
 silver_dwarf_trait_desc: "Emerging from the #G Green Valley#!, the #Y Silver Dwarves#! are the oldest of the three dwarven groups, and trace the origin of their race back to the mythical pair #G Hthgart#! and #Y Ferja#!, whom were said to have emerged from the sacred #Y Silver Caves#! in Srrovikkabi. The most suspicious of the dwarves, they are traditionally isolationist, and have retained many traditions the other dwarves have long forgotten. Despite their reported stubbornness and hot-headed nature, they make brave and cunning allies when the need arises."
 
 dragkhanic_trait: "Dragkhan"
 dragkhanic_trait_desc: "#Y Dragkhans#! are one of the oldest races in all of #G Omniluxia#!. They are said to have come from dragons, although, modern #Y Dragkhans#! much more resemble hominids. Despite the resemblence, every aspect of #T Dragkhanic#! culture is seen as cruel and violent, showing their draconic roots to be at the least somewhat accurate."
 
 # New World Racial Traits
 chivix_trait: "Chivix"
 chivix_trait_desc: "The #Y Chivix#! are the insectoid people of the East, bound together by the collective consciousness of the #T Hive Concord#!. They are industrious and organized, their society functioning with the seamless efficiency of a well-tended hive. Once their Hive is established, their numbers grow swiftly, though individual lifespans are shorter than most other races."
 ayrith_trait: "Ayrith"
 ayrith_trait_desc: "The #T Ayrith#! are the winged elves of the East, the loyal vanguards turned elites of Na'athranic society who try to maintain what remains of their creator's ancient empire.\nAncient ancestors of the #Y High Elves#!, they are known across the east for their keen intellect and natural charisma in addition to their extremely long lifespans, which they dedicate to art, magic, marital arts, and the governance of what's left of the Empire."
 mycelar_trait: "Mycelar"
 mycelar_trait_desc: "The #Y Mycelar#! are the mysterious fungus-folk of the East, a young race that emerged around the time of the #Y Great Collapse#!. Rumored to be connected with a great fungal network that pulses beneath the earth, these deeply spiritual fungi are viewed with suspicion across the East, as they are often associated or blamed for the Millennia of Decay.\nMycelars' infamous patience are a result of their long lifespans, but their supposed slow reproductive rates have become something of concern considering their numbers continue to grow as their realms expand across the East."
 ettin_trait: "Ettin"
 ettin_trait_desc: "#Y Ettin#! are giantkin rumored to be ancient ancestors of humanity and kinones. How they arrived in the East is unknown, but across what's left of the Empire millions of #Y Ettin#! still live long, happy lives serving as the farmers, laborers, fishermen, hunters, and craftsmen for the ruling #T Ayrith#! nobility."
 castaway_dwarf_trait: "Jade Dwarf"
 castaway_dwarf_trait_desc: "Adorned with #Y Jade#! ornaments and ceremonial clubs, the dwarves of Dawostir are said to be the descendants of refugees that fled a long-forgotten war. For millennia their kingdoms and tribes have attempted to create a paradise free from Na'athranic rule, and their religions contain rituals and beliefs long considered archaic by their western cousins. However, this same separation has preserved many half-remembered ideas and stories long forgotten by the western dwarves."
 golem_trait: "Golem"
 golem_trait_desc: "Considered undead by more puritanical religions, golems are living beings powered by souls that were imbued into them by a powerful mage. Due to their unique nature, they can vary in personality and size based on the shell they inhabit, and they require no food nor drink. However, since their soul is not their own they consume it for energy, and periodically require more mana or new souls to function."
 arame_trait: "Arame"
 arame_trait_desc: "The elusive #Y Arame#! are one of only two indigenous races of the East, and are traditionally divided into many different warring clans. Once found across every corner of the East, these mystical felines have been pushed to the very corners of the world by the armies of #Y Na'athran#! and those claiming his throne. Only the strength of their dreamcasters and strong martial culture have kept those who remain free from foreign dominion."
 

 #vothkin_trait: "Vothkin"
 #vothkin_trait_desc: "The Vothkin are the deep-dwelling dwarves of the New World, a steadfast people who carve their cities into the bones of mountains and bind their oaths in stone and blood. Hardy and skilled in the arts of war and craft, they are as unyielding as the rock they call home. Their deep-holds are fortresses unbreachable, but their numbers grow slow even by dwarven measure.\nVothkin live for long lifespans, their stone-hewn constitution preserving their strength well into old age."
 #ulvenar_trait: "Ulvenar"
 #ulvenar_trait_desc: "The Ulvenar are the wolf-kin of the New World, savage hunters who answer the call of the twin moons. Fierce and relentless in battle, they fight with a primal ferocity that terrifies their enemies. Their packs roam the untamed wilds, bound by loyalty to the pack leader alone. Yet their savage nature makes them unwelcome in the courts of civilized folk.\nUlvenar live for moderate lifespans, their vitality matched only by their hunger for the hunt."
 #tenmari_trait: "Tenmari"
 #tenmari_trait_desc: "The Tenmari are the shadow-dwellers of the New World, masters of intrigue and commerce who built the first cities of jade and gold in the twilight realms beneath the sun. Cunning and ambitious, they weave webs of influence that span continents, binding the conquered to their will with silk and coin. Yet so sprawling an empire tires easily of war.\nTenmari live for long lifespans, their shadowed constitution preserving them through centuries of plotting."
 #tsaalan_trait: "Tsaalan"
 #tsaalan_trait_desc: "The Tsaalan are the dragon-kin of the New World, a proud people who read fate in the shifting dunes and ride the desert winds as easily as the sea. Possessed of an imposing presence and natural martial prowess, they are born to rule the endless sands. Their draconic heritage grants them resilience, though their numbers grow slowly.\nTsaalan live for long lifespans, their draconic blood keeping them vigorous well beyond the years of lesser races."
 #saurthi_trait: "Saurthi"
 #saurthi_trait_desc: "The Saurthi are the lizardfolk of the New World, an ancient race born from the primordial swamps when the world was still young. Cold-blooded and patient, they possess an innate wisdom accumulated over millennia of watchful existence. Their scaled hides grant them resilience, though they breed slower than the younger races.\nSaurthi live for very long lifespans, growing larger and more weathered with each passing century."
 
 # Some yedidyah tribes are vampires
 vampire_trait: "Vampire"
 vampire_trait_desc: "#Y Vampires#! are a divergent group of any race that derive energy from blood. They are typically much stronger and healthier than their uninfected counterparts, however, their special status comes with a myriad of drawbacks. Sunlight, weapons of wood, and garlic are amongst their most common weaknesses. They also sport red eyes and enlarged, specialized canines are used for drawing blood."
