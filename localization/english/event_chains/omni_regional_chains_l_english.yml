l_english:

 omni_rift.1.t: "The Scout at Sunrise"
 omni_rift.1.desc: "My liege, a scout from the #G Deep Rift Valley#! failed to return before dawn. His captain had already divided his belongings when the man walked into the cavern and asked for his boots.\n\nAt your order he stood in the sunlight again, this time before the whole watch. He says he felt warm. The priests ask for another day to decide whether the curse is broken. The captains ask whether they may send armed companies out before our neighbors learn that we can stay."
 omni_rift.1.a: "Send the captains to the surface."
 omni_rift.1.a_tt: "Lift the sunlight penalty on surface territories. Muster #Y 3 light infantry cohorts and 1 archer cohort#! and invade [SCOPE.sC('rift_target').GetName|R]."
 omni_rift.1.b: "Guard the exits. We have time to learn what has happened."
 omni_rift.1.b_tt: "Lift the sunlight penalty on surface territories. The capital gains #G +20%#! fort defense for #Y 5 years#!."
 omni_rift.2.t: "The Fires Beyond the Rift"
 omni_rift.2.desc: "My liege, our shepherds saw #Y Deep Gnomes#! laying hearthstones above the #G Deep Rift Valley#!. At first they took them for raiders. At noon the same men were still there, arguing over where to dig a well.\n\nWe have since learned that their captains are marching into our lands. The villages remember when they had only to hold out until sunrise. They now ask whether we mean to defend them or bring them behind the capital's walls."
 omni_rift.2.a: "Pay the watch and open the capital gates to the villagers."
 omni_rift.2.a_tt: "The capital gains #G +20%#! fort defense for #Y 5 years#!."
 omni_rift.2.b: "Call the village watches to arms."
 omni_rift.2.b_tt: "The village watches will reinforce our army."
 omni_soventeir.1.t: "The Empty Forts of Kainaxarthos"
 omni_soventeir.1.desc: "For six winters the officers of three forts in #G Kainaxarthos#! have sent their pay rolls to #G Soveneria#!, and for six winters the crown has sent back enough silver to keep the walls manned. When your inspectors rode out to see what that silver had bought, they found twelve soldiers between the three forts, and the oldest of them said he had been keeping a double watch since the harvest. By the time the inspectors returned with warrants, the officers were already under your brother's protection.\n\n#Y Zmetya#! has asked you to let the clan chiefs hear the charges, as it was their word that put many of these men in command. The chiefs are inclined to hear him, and so are the priests of the old #T Dragkhanic#! gods, who say he has promised to open shrines where their fathers once blessed the clans' horses before a muster. We can still recover some of the silver, or ask the western chiefs to keep their riders at home. The marshal, who has heard enough about the officers and their patrons, asks how soon he can draw on our own treasury to put the forts in order."
 omni_soventeir.1.a: "Publish the accounts and seize the missing wages."
 omni_soventeir.1.a_tt: "Officials who escape the inquiry will bring #Y 60 gold#! to #Y Zmetya#! when he takes up arms."
 omni_soventeir.1.b: "Ask the western chiefs to keep their riders at home."
 omni_soventeir.1.b_tt: "The western clans will withhold #Y 4 light cavalry cohorts#! from Zmetya."
 omni_soventeir.1.c: "Use our own treasury to put the forts in order."
 omni_soventeir.1.c_tt: "Our forts in #G Kainaxarthos#! gain #G +20%#! fort defense for #Y 10 years#!."
 omni_soventeir.2.t: "Two Banners of Soveneria"
 omni_soventeir.2.desc: "When #Y Aonghullean#! called the clans to #G Soveneria#! to defend his throne, the heralds took the same roads they had ridden for every muster since his accession. This time, however, they found riders already saddling their horses for #Y Zmetya#!, who has declared that he means to take his brother's crown. The officers accused of stealing the garrison pay now drill men in his camp, while the priests who blessed his banner have called the clans to worship again at the old #T Dragkhanic#! shrines. If he takes the throne, he has promised the chiefs that they will judge the officers themselves.\n\nThere are households in the capital where one son keeps watch on the walls and another has taken the western road, and until this morning there were still men at court who thought the brothers might settle the matter between them. Now Zmetya's banner has been seen above the first company riding east, and every captain in Soveneria must decide whose summons he will answer."
 omni_soventeir.2.a: "Stand with Aonghullean. Hold the capital."
 omni_soventeir.2.a_tt: "Keep playing as #Y Aonghullean#! and start the civil war. At the split, up to #Y 2 neighboring territories#! join the rebels. #Y Zmetya#! receives #Y 20 cohorts#! (8 heavy infantry, 4 heavy cavalry, 4 light cavalry, 2 light infantry, 2 archers), #Y 150 gold#!, and #Y 5,000 manpower#!. If the western chiefs were left free to answer Zmetya's summons, he musters #Y 4 light cavalry cohorts#!. If we seized the missing wages, his supporters bring him #Y 60 gold#!."
 omni_soventeir.2.b: "Ride west and take up Zmetya's banner."
 omni_soventeir.2.b_tt: "Start the civil war and switch to #Y Zmetya#!. At the split, up to #Y 2 neighboring territories#! join the rebels. #Y Zmetya#! receives #Y 20 cohorts#! (8 heavy infantry, 4 heavy cavalry, 4 light cavalry, 2 light infantry, 2 archers), #Y 150 gold#!, and #Y 5,000 manpower#!. If the western chiefs were left free to answer his summons, he musters #Y 4 light cavalry cohorts#!. If Aonghullean seized the missing wages, Zmetya's supporters bring him #Y 60 gold#!."
 omni_soventeir.3.t: "The Price of the Crown"
 omni_soventeir.3.desc: "Although #Y Aonghullean#! has held his throne, the western chiefs have come to #G Soveneria#! with claims that will take more than a victory feast to settle. Those who kept faith with the crown expect their riders' wages, while those who fought for #Y Zmetya#! want to know whether their sons can come home in time to bring in the herds. They sit on opposite sides of the hall, but when the treasurer asks how many horses were lost, men on both benches begin to count.\n\nAs the chiefs wait to be heard, word comes from #G Dragon's Pass#! that #Y Hobgoblin#! scouts have been seen on the southern road. The frontier captains ask for silver to fill their ranks before the first snow, and the same treasury must answer for the price of the war and the defense of the country that survived it."
 omni_soventeir.3.a: "Pay the clans and settle their claims."
 omni_soventeir.3.a_tt: "The western clans accept the settlement and will withhold their riders from #Y Sunaksatre#!."
 omni_soventeir.3.b: "Raise recruits for the northern watch."
 omni_soventeir.3.b_tt: "The western clans remain free to send riders to #Y Sunaksatre#!. If we hold #G Soveneria#!, it gains #G +20%#! fort defense for #Y 10 years#!."
 omni_soventeir.3.c: "The treasury must keep its silver."
 omni_soventeir.3.c_tt: "The western clans remain free to send riders to #Y Sunaksatre#! later."
 omni_girm.1.t: "The Muster at Dragon's Pass"
 omni_girm.1.desc: "The last time our scouts came down from #G Dragon's Pass#!, the #Y Sovenerian#! watch followed them as far as the watershed, and the men who brought our horses home could still see the warning fires behind them. This time the scouts passed the first tower without seeing a light, and at the second they watched the same handful of men take the morning watch and the evening one. If we mean to carry the war into #G Kainaxarthos#!, we may never have a better chance to get an army through the pass.\n\nThe #Y Urhuk#! say they can be on the road within a month, provided we pay for their mounts now and give them a share of the spoils if #G Soveneria#! falls. The mountain chiefs can bring down a larger host, but they want the towns to have a voice at the muster, and their companies will take most of a season to gather. We could spend that season preparing the men already under our banner, though the captains who favor the Urhuk wonder how many of those empty towers will still be empty when we arrive."
 omni_girm.1.a: "Promise the Urhuk their share. We ride first."
 omni_girm.1.a_tt: "Muster #Y 8 light cavalry and 4 light infantry cohorts#!. Launch the invasion of #G Kainaxarthos#! once at least #Y 30 days#! have passed. If Girm takes #G Soveneria#!, pay the #Y Urhuk#! #R 40 gold#!."
 omni_girm.1.b: "Seat the cities and call the mountain chiefs."
 omni_girm.1.b_tt: "Muster #Y 10 heavy infantry and 6 archer cohorts#!. Invade #G Kainaxarthos#! after #Y at least 90 days#!."
 omni_girm.1.c: "Ride with the men already under our banner."
 omni_girm.1.c_tt: "Invade #G Kainaxarthos#! after #Y at least 90 days#! with our existing forces."
 omni_girm.2.t: "The Watch Calls from the North"
 omni_girm.2.desc: "At first the northern watch took the pack trains at #G Dragon's Pass#! for the baggage of a raiding party, but the longer our scouts watched, the more grain they saw carried up to the pass. The #Y Hobgoblins#! are hauling squared timbers with it, and the oldest of our frontier captains says he has never seen men bring that much wood down a mountain unless they meant to put it against somebody's walls.\n\nIf we send silver to #G Soveneria#! now, the captain can lay in provisions and put the defenses in order before Girm comes down the road. We could also recall the frontier companies to fill the ranks of our army, but the villages that have been feeding those men all winter will see the watchfires go out, and they will know exactly whose order put them out."
 omni_girm.2.a: "Provision the defenses of Soveneria."
 omni_girm.2.a_tt: "#G Soveneria#! gains #G +25%#! fort defense for #Y 3 years#!."
 omni_girm.2.b: "Recall the frontier companies."
 omni_girm.2.b_tt: "The frontier companies return to the army. Their withdrawal costs stability."
 omni_girm.3.t: "The Gates After the War"
 omni_girm.3.desc_taken: "When our officers took the keys of #G Soveneria#!, the city clerks came with them, carrying the granary rolls and the receipts that the townspeople have been saving through the war. Some households paid the crown, others paid whichever captain had men in their street, and there are widows who can show a receipt from each. The clerks say they can tell us what grain is left and whose debts are already paid, if we give them leave to keep their desks.\n\nOutside the walls, the western chiefs have begun sending riders from one village to the next, and the last of the grain carts to reach the city brought word that they are asking who would ride with them to take it back. We have the keys, but by next harvest every household will know what it costs to live under our seal."
 omni_girm.3.desc_held: "Though #G Soveneria#! is still in our hands, the garrison that kept its gates is owed wages, and the grain carts that have begun coming in from the villages wait in the street until the quartermaster brings out the silver. Beyond the walls there are roads our companies can scarcely spare a patrol for, and along those roads it is the western riders who have been bringing families home.\n\nTheir chiefs are gathering to hear #Y Sunaksatre#!, who has been asking the clans to swear that any household which opens its doors to a fugitive may call on the others when its own doors are threatened. There are families eating at their own hearths tonight because somebody gave them shelter before there was an oath to bind them, and word of the gathering has traveled farther than our captains expected."
 omni_girm.3.a: "Keep the clerks and honor the receipts."
 omni_girm.3.a_tt: "#G Soveneria#! gains #G +15%#! local population happiness for #Y 5 years#!. The western clans can rally to retake it."
 omni_girm.3.b: "Pay the men who held the gates."
 omni_girm.3.b_tt: "The western clans will have to seek support while the defenders still hold #G Soveneria#!."
 omni_girm.3.c: "Read out the terms and send the envoys home."
 omni_girm.3.c_tt: "Accept the outcome of the war and close the council."
 omni_oath.1.t: "The First Oath"
 omni_oath.1.desc: "When families began coming home from the war in #G Kainaxarthos#!, many found that the men who had once kept the roads were dead or had ridden away. #Y Sunaksatre#! persuaded several clans to escort the returning households in turn, and when a chief objected to lending horses to a family that had fought against him, Sunaksatre asked who would bring his own children home if the road were closed again. By the time the last carts came through, men who had refused to ride together at the start of the war were sharing the same watch.\n\nThe priests of #T Kuxzotl#! have offered to witness an oath that would bind the clans to come to one another's aid, and the chiefs have agreed to hear it at our court. Sunaksatre is the man they trust to call them out when the oath is invoked. They are waiting to learn whether he will do so under our ruler's banner or take the seat from which the summons is given."
 omni_oath.1.a: "Let Sunaksatre take the throne and swear before the chiefs."
 omni_oath.1.a_tt: "#Y Sunaksatre#! becomes ruler with #G +10#! popularity. Adopt the #T Dragkhanic#! pantheon and bind the clans by oath. In #Y 90–180 days#!, an envoy from #G Kainaxarthos#! will arrive. You can then claim foreign-held territories in the region and decide whether to protect the towns' shrines. Unless Soventeir settled with the western clans, #Y 8 cohorts#! muster at our capital (4 light cavalry, 2 light infantry, and 2 archers)."
 omni_oath.1.b: "Keep the throne and give Sunaksatre a place at court."
 omni_oath.1.b_tt: "#Y Sunaksatre#! joins our court. Adopt the #T Dragkhanic#! pantheon and bind the clans by oath. In #Y 90–180 days#!, an envoy from #G Kainaxarthos#! will arrive. You can then claim foreign-held territories in the region and decide whether to protect the towns' shrines. Sunaksatre can be assigned command. Unless Soventeir settled with the western clans, #Y 8 cohorts#! muster at our capital (4 light cavalry, 2 light infantry, and 2 archers)."
 omni_oath.2.t: "What We Owe Kainaxarthos"
 omni_oath.2.desc_girm: "Since Girm took #G Soveneria#!, its officers have sent collectors into the towns of #G Kainaxarthos#!, and the elders who used to keep grain for their own watch are being asked to provision the men who took the city. An envoy who traveled part of the way with the returning families has reached our court, and he says the towns will furnish grain and guides if we send riders to help them.\n\nHe has heard how Sunaksatre persuaded the clans to guard one another's households, but his towns keep shrines to #T Hellas#!, and he wants to know whether a priest there will still have the keys to his own sanctuary when our captains arrive. If the promise is meant to hold after the campaign, the elders ask to have it under our seal."
 omni_oath.2.desc_sov: "Girm failed to take #G Soveneria#!, and the towns of #G Kainaxarthos#! are once again hearing from the lords who called for their grain and men before the invasion. Their envoy reminds us that western riders escorted many of their families home when the garrisons could scarcely spare a patrol, and he asks what terms our court would offer if those riders came again with orders to stay.\n\nThe elders know what the clans swore before the priests of #T Kuxzotl#!, and they want to know whether that protection will extend to towns whose priests serve #T Hellas#!. They can speak for us when our banners come into sight, the envoy says, if we give them a sealed guarantee they can read in their own market squares."
 omni_oath.2.a: "Seal the guarantee and let the towns keep their shrines."
 omni_oath.2.a_tt: "Gain claims on foreign-held territories in #G Kainaxarthos#!. When the crossing event opens, territories we hold in the region gain #G +10%#! local population happiness for #Y 10 years#!. The guarantees also unlock the option to buy an eligible port in #G Western Baetep#!."
 omni_oath.2.b: "Call the riders and press our claims without a guarantee."
 omni_oath.2.b_tt: "Gain claims on foreign-held territories in #G Kainaxarthos#!. The option to buy a port under the guarantees will be unavailable."
 omni_oath.2.desc_challenge: "The envoy from #G Kainaxarthos#! asks whether our oath extends to towns that still keep shrines to #T Hellas#!. Sunaksatre urges us to promise the priests they can keep their keys. It is the emperor at #G Soveneria#! he means to bring down. The emperor claims to speak for the Dragkhan clans, yet his collectors take their grain and his garrisons leave the roads unguarded.\n\nSunaksatre asks the chiefs to call out their riders. If the towns will open their gates to us, he says, we can take the old capital and found a Dragkhanic empire whose rulers are bound by the same oath as its people."
 omni_oath.2.c: "Seal the guarantee. Sunaksatre will call the clans to war."
 omni_oath.2.c_tt: "Guarantee the towns' shrines, gain claims in #G Kainaxarthos#!, and declare war on #Y Soventeir#! for #G Soveneria#!. The guarantee also unlocks the option to buy an eligible port in #G Western Baetep#!."
 omni_oath_reclaim_soveneria: "Reclamation of Soveneria"
 war_goal_omni_oath_reclaim_soveneria: "$omni_oath_reclaim_soveneria$"
 war_goal_omni_oath_reclaim_soveneria_desc: "Occupy Soveneria to gain ticking war score."
 omni_oath.3.t: "The Oath Across the Water"
 omni_oath.3.desc: "Now that #G Soveneria#! is ours and we have a port in #G Kainaxarthos#!, the shipmasters have brought the court their charts of #G Western Baetep#!. They can find men to take horses across the water, but the animals will need a sheltered quay and fodder waiting ashore, and a captain who has spent his strength getting them off the ships will have little left to fight for a landing. A harbor of our own would let us keep men on the far shore and send them fresh supplies when the sailing weather turns.\n\nThose who favor a purchase say a lord across the water might sell us a harbor if we can put gold on the table and give his townspeople the same written protections sought in Kainaxarthos. The captains who would take a harbor by force have brought estimates for a fleet, though some say the treasury should issue the charts and leave the fitting out to the men who will make the crossing."
 omni_oath.3.a: "Offer gold for the harbor and guarantee its shrines."
 omni_oath.3.a_tt: "Gain claims in #G Western Baetep#!. Send the owner of [SCOPE.sP('oath_landing_port').GetName|G] an offer of #Y 50 gold#! from the expedition budget. The owner receives the offer after #Y 14 days#! and may accept or refuse. To proclaim the empire, hold #Y 6 territories#! in Kainaxarthos including Soveneria, #Y 4#! in Western Baetep, and a port on each shore, then make peace."
 omni_oath.3.b: "Hire the ships. We will secure a harbor ourselves."
 omni_oath.3.b_tt: "Muster #Y 6 liburnians#! at our embarkation port and gain claims in #G Western Baetep#!. To proclaim the empire, hold #Y 6 territories#! in Kainaxarthos including Soveneria, #Y 4#! in Western Baetep, and a port on each shore, then make peace."
 omni_oath.3.c: "Issue the charts and leave the ships to our captains."
 omni_oath.3.c_tt: "Gain claims in #G Western Baetep#!. We must furnish our own ships. To proclaim the empire, hold #Y 6 territories#! in Kainaxarthos including Soveneria, #Y 4#! in Western Baetep, and a port on each shore, then make peace."
 omni_oath.4.t: "One Oath, Two Shores"
 omni_oath.4.desc: "With peace agreed and ports in our hands on both shores, the delegates have come to hear under what name the two coasts will be governed. The chiefs remember an oath first sworn to keep families safe on the roads, while the towns have sent men who know how much grain it takes to provision a harbor through winter. They have different claims on the court, but every delegation expects the new empire to answer for the undertakings on which its people agreed to serve.\n\nBefore the priests proclaim the #Y Dragkhanic Empire#!, the delegates ask how the next ruler will take the oath. Some would have the assembly hear it on behalf of both shores, where the towns can speak before the chiefs give their word. Others say each chief should swear directly to the ruler, as men do when they entrust their households to another's protection."
 omni_oath.4.a: "Let the assembly witness the oath on behalf of both shores."
 omni_oath.4.a_tt: "Proclaim the #Y Dragkhanic Empire#!. The first successor may seek the assembly's recognition."
 omni_oath.4.b: "Let the clans give their oaths to each ruler in person."
 omni_oath.4.b_tt: "Proclaim the #Y Dragkhanic Empire#!. The first successor may pay the clans to renew their personal oaths."
 omni_oath.5.t: "The Next Oath"
 omni_oath.5.desc: "At the first gathering of the new reign, the chiefs brought out the tablets on which the oath was recorded, and the town delegates asked that they be read where everyone in the hall could hear. Their towns have kept the ports supplied and answered the court's levies, and they want to hear from the new ruler what protection they can claim in return.\n\nSeveral chiefs have come with a different account of what is owed, for their riders are still waiting on wages and the families who supplied their mounts have begun asking when they will be paid. They are ready to swear in person once those claims are settled, but the longer both parties wait at court, the more plainly they ask whether the crown expects them to serve on the strength of its seal alone."
 omni_oath.5.a: "Let the assembly hear the towns and witness the oath."
 omni_oath.5.a_tt: "The assembly recognizes your rule."
 omni_oath.5.b: "Pay the clans their due and take their oaths in person."
 omni_oath.5.b_tt: "The clans renew their personal oaths to the throne."
 omni_oath.5.c: "Our seal is enough. Dismiss them."
 omni_oath.5.c_tt: "The unsettled chiefs leave court. The dispute will weaken the throne."
 omni_rift_watch: "Watch at the Rift"
 omni_sov_garrison: "Paid Garrison"
 omni_girm_watch: "The Northern Watch"
 omni_girm_settlement: "The Settlement of Soveneria"
 omni_oath_guaranteed_towns: "The Oath's Guarantees"
 omni_rift_sun_curse: "Bound to the Caverns"
 omni_rift_invasion: "Invasion from the Rift"
 omni_girm_invasion: "Invasion of Kainaxarthos"
 war_goal_omni_rift_invasion: "$omni_rift_invasion$"
 war_goal_omni_rift_invasion_desc: "Win battles to show superiority. Occupied enemy territories are immediately annexed by the occupying war leader."
 war_goal_omni_girm_invasion: "$omni_girm_invasion$"
 war_goal_omni_girm_invasion_desc: "Occupy Kainaxarthos to gain ticking war score."
 omni_soventeir.3.desc_zmetya: "By the time #Y Zmetya#! entered #G Soveneria#! as Qhagan, the priests had already lit the fires at the old #T Dragkhanic#! shrines, and the chiefs who rode with him brought their households into the city for the first offerings. They have since come to the palace to ask when the promises made at the western muster will be honored, for the men who helped win the crown have wages owing and horses to replace before they can ride again.\n\nWhile the chiefs wait in the hall, a courier from #G Dragon's Pass#! brings word of #Y Hobgoblin#! scouts on the southern road, and the frontier captains ask for enough silver to take on recruits before winter. Some of the chiefs have sons at those forts themselves, but they remember how freely the Qhagan's captains promised payment when the war was still to be won."
 omni_girm.3.desc_frontier: "By the time our officers rode out to mark the new boundary, the villages ceded to us had already taken down the old tax notices, although their elders had kept the receipts in case a collector came asking for the same grain twice. They want to know whose seal will be on the next demand, and whether a cart sent to market in #G Soveneria#! can come home across the line with its oxen still in the yoke.\n\nSoveneria itself lies beyond the boundary, and the western chiefs' envoys have been through several of the villages since the terms were read. They ask the elders to keep those receipts a little longer, for by next harvest, they say, the clans may have a seal of their own."
 omni_oath.6.t: "The Price of a Harbor"
 omni_oath.6.desc: "An envoy from across the sea has asked to buy [SCOPE.sP('oath_landing_port').GetName|G], where his masters mean to unload their horses and keep stores for the men they intend to land in #G Western Baetep#!. He offers fifty gold and has brought a written guarantee that the inhabitants will have their protection and that the shrines will remain in the care of their priests.\n\nThe harbor master knows what fifty gold will buy this year, but he has asked the council to consider what the quay will earn once it belongs to another ruler. The priests have a question of their own, for when the first ships come in and a foreign captain needs somewhere to billet his men, it will be his officers who decide what their master's guarantee is worth."
 omni_oath.6.a: "Take the gold and cede the harbor under those terms."
 omni_oath.6.a_tt: "[SCOPE.sP('oath_landing_port').GetName|G] passes to the Oath-Bearer's realm and gains #G +10%#! local population happiness for #Y 10 years#!."
 omni_oath.6.b: "Send the envoy home. The harbor stays ours."
 omni_oath.6.b_tt: "Keep the harbor. The realm that made the offer retains its claims."
 omni_oath.2.desc_frontier: "The terms with Girm left #G Soveneria#! beyond his reach, but they gave him villages whose grain carts have always gone to the city's markets. An envoy from those villages tells us that the new collectors have brought their own demands, while some of the old creditors still come across the boundary with debts they say the treaty never canceled. The elders will give our riders grain and show them the roads if we are willing to press their case.\n\nBefore he goes home, the envoy asks what will happen to the shrines of #T Hellas#! if our officers come in place of Girm's. The priests have kept the old receipts in their sanctuaries through the war, and the elders would like to bring them one more document, bearing our seal and guaranteeing that they may keep the shrines in their care."
 omni_oath.7.t: "The Dragon Above the Fold"
 omni_oath.7.desc: "The shepherds who brought their flocks home under the clans' escort have begun losing sheep again, and this time the tracks end at a ledge where no horse can follow. A drover who used to trade beyond #G Dragon's Pass#! says the Driotra call upon #T Daeyr#!, the lord of the Old Dragons, when a shadow like that crosses their herds. #Y Sunaksatre#! asked the man where the beast came down to feed, and for three mornings he has left a cut of mutton on the same stone. On the third morning it ate while he was still there.\n\nSunaksatre means to go close enough to lay a hand on its neck, and if it lets him do that, he means to ride it. He has asked the shepherds to keep the sheep in the fold until he comes down, and the chiefs want to know whether they should send men to watch the ledge or bring him back before he climbs it again."
 omni_oath.7.a: "Give him leave to climb to the ledge."
 omni_oath.7.a_tt: "#Y 65%#! chance that Sunaksatre tames the dragon and earns the nickname #Y Sword of Daeyr#! and the permanent #Y Dragonrider of the First Oath#! trait. The trait grants #G +3 Martial#! and #G +1 Zeal#!, plus #G +10% land morale#! and #G +10% light and heavy cavalry offense#! to armies he commands. On failure (#Y 35%#!), he is wounded."
 omni_oath.7.b: "Bring him down. The clans need him on the ground."
 omni_oath.8.t: "Word from the Ledge"
 omni_oath.8.desc_success: "The shepherds saw the dragon leave the ledge at dawn, and it took them a moment to make out #Y Sunaksatre#! lying flat against its neck. It carried him as far as the river before it turned, and on the way back he sat upright and drew his sword where the men below could see it. The drover who had told him of #T Daeyr#! saw the blade catch the light above the fold and called him the #Y Sword of Daeyr#!. By the time the dragon set him down, the riders were calling the name back to him.\n\nThat evening Sunaksatre asked the captains to bring him their road maps, for from above the river he had seen a shallow crossing that their scouts had missed. One captain sent a pair of riders to sound the ford before dark, and the rest stayed to hear what else he had seen."
 omni_oath.8.desc_failure: "The dragon let #Y Sunaksatre#! put a hand against its neck, but when he shifted his weight to climb, it struck out and knocked him off the ledge. The shepherds found him on a shelf below it, where he had caught himself with one arm and held on until they could lower a rope. They carried him down on a gate taken from the fold, and by the time they reached camp, the dragon had come back for the rest of its meal."
 omni_oath.8.a: "Let the clans hear what happened."
 NICKNAME_OMNI_OATH_DRAGONRIDER: "'Sword of Daeyr'"
 sunaksatre_dragonrider: "Dragonrider of the First Oath"
 sunaksatre_dragonrider_desc: "The riders at the fold called Sunaksatre the #Y Sword of Daeyr#!, but when word reached the shrines, the priests remembered an older name. They had long foretold that a rider would come home on a dragon and be called the #Y Udanaksha#!, and that the clans would count their years anew from the day the chiefs gathered to hear the rider's laws. Some took his flight as a sign that the gods had chosen him, while others said the dragon had yielded to a man with a steady hand. Even those chiefs wanted to hear what he would ask of them when they next sat down together."
