l_english:

 omni_rift.1.t: "The Scout at Sunrise"
 omni_rift.1.desc: "My liege, a scout from the #G Deep Rift Valley#! failed to return before dawn. His captain had already divided his belongings when the man walked into the cavern and asked for his boots.\n\nAt your order he stood in the sunlight again, this time before the whole watch. He says he felt warm. The priests ask for another day to decide whether the curse is broken. The captains ask whether they may send armed companies out before our neighbors learn that we can stay."
 omni_rift.1.a: "Send the captains to the surface."
 omni_rift.1.a_tt: "Lift the sunlight penalty on surface territories. Muster #Y 3 light infantry cohorts and 1 archer cohort#! and invade [SCOPE.sC('rift_target').GetName|R]."
 omni_rift.1.b: "Guard the exits. We have time to learn what has happened."
 omni_rift.1.b_tt: "Lift the sunlight penalty on surface territories. The capital gains #G +20%#! fort defense for #Y 5 years#!."
 omni_rift.2.t: "The Fires Beyond the Rift"
 omni_rift.2.desc: "My liege, our shepherds saw #Y Deep Gnomes#! laying hearthstones above the #G Deep Rift Valley#!. At first they took them for raiders. At noon the same men were still there, arguing over where to dig a well.\n\nWe have since learned that their captains are marching into our lands. The villages remember when they had only to hold out until sunrise. They now ask whether we mean to defend them or bring them behind the capital's walls."
 omni_rift.2.a: "Pay the watch and open the capital gates to the villagers."
 omni_rift.2.a_tt: "The capital gains #G +20%#! fort defense for #Y 5 years#!."
 omni_rift.2.b: "Call the village watches to arms."
 omni_rift.2.b_tt: "The village watches will reinforce our army."
 omni_soventeir.1.t: "The Audits of Kainaxarthos"
 omni_soventeir.1.desc: "My #Y Shanuzushanuz#!, our inspectors have found that three forts drew pay for full garrisons for six winters. When they rode out to count the men, they found twelve soldiers between them, one of whom was the chief inspector's uncle. The officers signed for the missing men's wages. They have yet to say where the money went.\n\nYour brother #Y Zmetya#! asks that we delay the arrests until the clans have met. Several officers named in the inquiry have already gone to his camp, where he has promised them a hearing before the clan chiefs. He has also received priests of the old #T Dragkhanic#! gods and pledged to reopen their shrines.\n\nThe officers can offer him men, and the priests can tell the clans why they ought to ride. Our marshal asks whether you intend to give them the time."
 omni_soventeir.1.a: "Publish the accounts and seize the missing wages."
 omni_soventeir.1.a_tt: "Officials who escape the inquiry will bring #Y 60 gold#! to #Y Zmetya#! when he takes up arms."
 omni_soventeir.1.b: "Ask the western chiefs to keep their riders at home."
 omni_soventeir.1.b_tt: "The western clans will withhold #Y 4 light cavalry cohorts#! from Zmetya."
 omni_soventeir.1.c: "Use our own treasury to put the forts in order."
 omni_soventeir.1.c_tt: "Our forts in #G Kainaxarthos#! gain #G +20%#! fort defense for #Y 10 years#!."
 omni_soventeir.2.t: "Two Banners of Soveneria"
 omni_soventeir.2.desc: "Two summonses were read to the riders this morning. #Y Aonghullean#! calls the clans to #G Soveneria#! to defend his throne. #Y Zmetya#! calls them to his camp to hear the officers' case and restore worship at the old #T Dragkhanic#! shrines.\n\nThe oldest captain asked which summons he should read to the men first. By the time the court sent an answer, half his company had already ridden west. We must now decide which brother's banner we will follow."
 omni_soventeir.2.a: "Our oaths were sworn to Aonghullean."
 omni_soventeir.2.a_tt: "Keep playing as #Y Aonghullean#! and start the civil war. At the split, #Y Zmetya#! receives #Y 12 cohorts#! (4 heavy infantry, 4 light cavalry, 2 light infantry, 2 archers), #Y 100 gold#!, and #Y 3,000 manpower#!. If the western chiefs were left free to answer Zmetya's summons, he musters #Y 4 light cavalry cohorts#!. If we seized the missing wages, his supporters bring him #Y 60 gold#!."
 omni_soventeir.2.b: "The clans will ride with Zmetya."
 omni_soventeir.2.b_tt: "Start the civil war and switch to #Y Zmetya#!. At the split, #Y Zmetya#! receives #Y 12 cohorts#! (4 heavy infantry, 4 light cavalry, 2 light infantry, 2 archers), #Y 100 gold#!, and #Y 3,000 manpower#!. If the western chiefs were left free to answer his summons, he musters #Y 4 light cavalry cohorts#!. If Aonghullean seized the missing wages, Zmetya's supporters bring him #Y 60 gold#!."
 omni_soventeir.3.t: "The Price of the Crown"
 omni_soventeir.3.desc: "My liege, the western chiefs have come to #G Soveneria#! while the victory banners are still hanging. Some kept their riders home when #Y Zmetya#! called. Others sent men and now ask whether their families may return without fear of arrest. All have brought claims for horses and wages lost in the war.\n\nFrom the north comes a shorter letter. The watch has seen #Y Hobgoblin#! scouts on the road from #G Dragon's Pass#!. The garrisons ask how many companies we can send before winter. The treasurer asks whether the next payment should go to the chiefs or the watch."
 omni_soventeir.3.a: "Settle with the clans."
 omni_soventeir.3.a_tt: "The western clans accept the settlement and will withhold their riders from #Y Sunaksatre#!."
 omni_soventeir.3.b: "Send the money north."
 omni_soventeir.3.b_tt: "The western clans remain free to send riders to #Y Sunaksatre#!. If we hold #G Soveneria#!, it gains #G +20%#! fort defense for #Y 10 years#!."
 omni_soventeir.3.c: "We will have to make do with the men we have."
 omni_soventeir.3.c_tt: "The western clans remain free to send riders to #Y Sunaksatre#! later."
 omni_girm.1.t: "The Muster at Dragon’s Pass"
 omni_girm.1.desc: "My [ROOT.GetCountry.GetRulerTitle], there is news that you will find very interesting...very interesting, indeed. Our scouts passed two #Y Sovenerian#! watchtowers leading into the south and they were shocked at what they discovered. The first stood empty, and at the second, they saw a handful of men trying to look like a company. By all accounts, the border is undefended! If we move before the garrisons are filled again, we can carry the war into #G Kainaxarthos#!.\n\nThe #Y Urhuk#! can ride as soon as we pay for their horses and promise them a share of the spoils. The mountain chiefs can furnish more men, but they want the towns represented at the muster and time to call their companies down. Our captains say we can also take the road with the men already under your banner. What is your command, my liege?"
 omni_girm.1.a: "Promise the Urhuk their share. We ride first."
 omni_girm.1.a_tt: "Muster #Y 8 light cavalry and 4 light infantry cohorts#!. Launch the invasion of #G Kainaxarthos#! once at least #Y 30 days#! have passed. If Girm takes #G Soveneria#!, pay the #Y Urhuk#! #R 40 gold#!."
 omni_girm.1.b: "Seat the cities and call the mountain chiefs."
 omni_girm.1.b_tt: "Muster #Y 10 heavy infantry and 6 archer cohorts#!. Invade #G Kainaxarthos#! after #Y at least 90 days#!."
 omni_girm.1.c: "Ride with the men already under our banner."
 omni_girm.1.c_tt: "Invade #G Kainaxarthos#! after #Y at least 90 days#! with our existing forces."
 omni_girm.2.t: "The Watch Calls from the North"
 omni_girm.2.desc: "My liege, the watch reports that the #Y Hobgoblins#! are gathering pack trains at #G Dragon's Pass#!. We have seen raiders come south with empty sacks before. These men are stockpiling siege timbers and enough grain to stay through the harvest.\n\nThe frontier captain can send his companies back to our army now, or we can use the time we have to provision the defenses of #G Soveneria#!. He asks for your orders before Girm comes down the road."
 omni_girm.2.a: "Provision the defenses of Soveneria."
 omni_girm.2.a_tt: "#G Soveneria#! gains #G +25%#! fort defense for #Y 3 years#!."
 omni_girm.2.b: "Recall the frontier companies."
 omni_girm.2.b_tt: "The frontier companies return to the army. Their withdrawal costs stability."
 omni_girm.3.t: "The Gates After the War"
 omni_girm.3.desc_taken: "My chief, the gates are ours. The clerks have brought the keys of #G Soveneria#!, a register of the granaries, and three conflicting accounts of whom they have been paying taxes to. They wish to know which accounts our officers intend to honor."
 omni_girm.3.desc_held: "My liege, #G Soveneria#! is still in our hands. The villages are sending grain to the garrisons again, though the carters insist on payment before they unload.\n\nThe watch reports that western riders have been escorting families home on roads our companies still cannot spare men to patrol. Their chiefs are gathering to hear a man named #Y Sunaksatre#!, who says any clan that answers a call for help should be able to make one in turn."
 omni_girm.3.a: "Keep the clerks. Have them make us a clean account."
 omni_girm.3.a_tt: "#G Soveneria#! gains #G +15%#! local population happiness for #Y 5 years#!. The western clans can rally to retake it."
 omni_girm.3.b: "Pay the garrison before the procession."
 omni_girm.3.b_tt: "The western clans will have to seek support while the defenders still hold #G Soveneria#!."
 omni_girm.3.c: "Read out the terms and send the envoys home."
 omni_girm.3.c_tt: "Accept the outcome of the war and close the council."
 omni_oath.1.t: "The First Oath"
 omni_oath.1.desc: "My liege, #Y Sunaksatre of the Kausal clan#! has brought home families stranded during the war for #G Kainaxarthos#!, and his esteem is quickly rising throughout all of [ROOT.GetCountry.GetName|G]. Among them are the sons of men who once rode against him - truly, Sunaksatre has brought together the finest warriors in [ROOT.GetCountry.GetAdjective] society under one banner. When a chief asked him why he was willing to forgive those that had sworn blood oaths against him, Sunaksatre answered that their fathers had worshiped before the same altar.\n\nSunaksatre has even received the blessings of the divine. The priests of #T Kuxzotl#! say that the gods have revealed unto us a man who can be trusted with carrying out their will. Emboldened by their praise, Sunaksatre has asked the other chiefs to ride alongside him, promising great victories to those that join him in the days to come, and they are prepared to hear him. The tribes want to know just one thing, [ROOT.GetCountry.GetRuler.GetName|Y] - will Sunaksatre speak as your commander or will he take the oath as ruler himself?"
 omni_oath.1.a: "Raise the Oath-Bearer before the assembly."
 omni_oath.1.a_tt: "#Y Sunaksatre#! becomes ruler with #G +10#! popularity. Adopt the #T Dragkhanic#! pantheon and bind the clans by oath. In #Y 90–180 days#!, an envoy from #G Kainaxarthos#! will arrive. You can then claim foreign-held territories in the region and decide whether to protect the towns' shrines. If Soventeir left the western clans unsettled, #Y 8 cohorts#! muster at our capital (4 light cavalry, 2 light infantry, and 2 archers)."
 omni_oath.1.b: "Let him ride under our banner."
 omni_oath.1.b_tt: "#Y Sunaksatre#! joins our court. Adopt the #T Dragkhanic#! pantheon and bind the clans by oath. In #Y 90–180 days#!, an envoy from #G Kainaxarthos#! will arrive. You can then claim foreign-held territories in the region and decide whether to protect the towns' shrines. Sunaksatre can be assigned command. If Soventeir left the western clans unsettled, #Y 8 cohorts#! muster at our capital (4 light cavalry, 2 light infantry, and 2 archers)."
 omni_oath.2.t: "What We Owe Kainaxarthos"
 omni_oath.2.desc_girm: "My liege, an envoy from #G Kainaxarthos#! has slipped past the #Y Hobgoblin#! watch. His towns will furnish grain if our riders come. He asks whether the oath protects men who pray to #T Hellas#!, and whether we will put the answer in writing before he goes back."
 omni_oath.2.desc_sov: "My liege, an envoy from #G Kainaxarthos#! has come to ask what our riders intend now that the #Y Hobgoblins#! have been driven back. The lords of #G Soveneria#! expect the towns to keep their old allegiance. The towns wish to know what terms we would offer if our banners reached their gates.\n\nThe envoy asks whether the oath protects those who pray to #T Hellas#!. Several chiefs called the question impertinent. One asked it again after the others had finished speaking."
 omni_oath.2.a: "Write the guarantees. Let the towns keep their shrines."
 omni_oath.2.a_tt: "Gain claims on foreign-held territories in #G Kainaxarthos#!. When the crossing event opens, territories we hold in the region gain #G +10%#! local population happiness for #Y 10 years#!. The guarantees also let us negotiate for a port in #G Western Baetep#! if one is available."
 omni_oath.2.b: "Call the riders. The gates will open when we reach them."
 omni_oath.2.b_tt: "Gain claims in #G Kainaxarthos#!. The towns receive no guarantees."
 omni_oath.3.t: "The Oath Across the Water"
 omni_oath.3.desc: "My liege, with #G Soveneria#! in our hands, the chiefs have asked how far the oath is to carry them. The captains have brought charts of #G Western Luxterra#! and reckon they can land horses on the coast of #G Baetep#!, provided they have a harbor to unload them.\n\nSome favor hiring ships and taking a harbor by force. Others say the guarantee we offered the towns of #G Kainaxarthos#! could buy us a place to land, if a lord on the far shore will hear our terms. The shipmasters are willing to wait while we decide. They are less willing to sail on promises."
 omni_oath.3.a: "Offer to buy the harbor under the terms of the oath."
 omni_oath.3.a_tt: "Gain claims in #G Western Baetep#!. Send the owner of [SCOPE.sP('oath_landing_port').GetName|G] an offer of #Y 50 gold#! from the expedition budget. The owner can accept or refuse after #Y 14 days#!. To proclaim the empire, hold #Y 6 territories#! in Kainaxarthos including Soveneria, #Y 4#! in Western Baetep, and a port on each shore, then make peace."
 omni_oath.3.b: "Hire the ships. We will secure a harbor ourselves."
 omni_oath.3.b_tt: "Muster #Y 6 liburnians#! at our embarkation port and gain claims in #G Western Baetep#!. To proclaim the empire, hold #Y 6 territories#! in Kainaxarthos including Soveneria, #Y 4#! in Western Baetep, and a port on each shore, then make peace."
 omni_oath.3.c: "Send the charts to our captains. They will make their own crossing."
 omni_oath.3.c_tt: "Gain claims in #G Western Baetep#!. We must furnish our own ships. To proclaim the empire, hold #Y 6 territories#! in Kainaxarthos including Soveneria, #Y 4#! in Western Baetep, and a port on each shore, then make peace."
 omni_oath.4.t: "One Oath, Two Shores"
 omni_oath.4.desc: "My liege, the riders and the towns have sent their seals to the assembly. Some are pressed in wax, others in clay, and one western chief has sent the ring itself because he does not trust his nephew to bring it home again.\n\nThe priests ask what name they are to use in prayers for the realm. The delegates ask a question of their own. When the hand that first took the oath is laid in the earth, to whom do they owe the next one?"
 omni_oath.4.a: "Let the assembly witness every ruler's oath."
 omni_oath.4.a_tt: "Proclaim the #Y Reformed Dragkhanic Empire#!. The first new ruler must seek the assembly’s recognition."
 omni_oath.4.b: "Let the clans give their oaths to each ruler in person."
 omni_oath.4.b_tt: "Proclaim the #Y Reformed Dragkhanic Empire#!. The first new ruler must renew the clans’ personal oaths."
 omni_oath.5.t: "The Next Oath"
 omni_oath.5.desc: "My liege, the chiefs have come to hear how you intend to renew the oath. The old tablets were brought out at dawn, and every chief found his father's name readily enough. It took rather longer to agree where yours should be written.\n\nThe assembly's spokesman waits at the door. He has asked for a bench for the town delegates, who have been standing since morning and are beginning to remember the terms on which their towns submitted. The chiefs who would rather swear to you in person ask when you will hear their claims for payment."
 omni_oath.5.a: "Let the assembly hear the towns and witness the oath."
 omni_oath.5.a_tt: "The assembly recognizes your rule."
 omni_oath.5.b: "Pay the clans their due and take their oaths in person."
 omni_oath.5.b_tt: "The clans renew their personal oaths to the throne."
 omni_oath.5.c: "Our seal is enough. Dismiss them."
 omni_oath.5.c_tt: "The unsettled chiefs leave court. The dispute will weaken the throne."
 omni_rift_watch: "Watch at the Rift"
 omni_sov_garrison: "Paid Garrison"
 omni_girm_watch: "The Northern Watch"
 omni_girm_settlement: "The Settlement of Soveneria"
 omni_oath_guaranteed_towns: "The Oath's Guarantees"
 omni_rift_sun_curse: "Bound to the Caverns"
 omni_rift_invasion: "Invasion from the Rift"
 omni_girm_invasion: "Invasion of Kainaxarthos"
 war_goal_omni_rift_invasion: "$omni_rift_invasion$"
 war_goal_omni_rift_invasion_desc: "Win battles to show superiority. Occupied enemy territories are immediately annexed by the occupying war leader."
 war_goal_omni_girm_invasion: "$omni_girm_invasion$"
 war_goal_omni_girm_invasion_desc: "Occupy Kainaxarthos to gain ticking war score."
 omni_soventeir.3.desc_zmetya: "My #Y Qhagan#!, word of your victory has reached the old #T Dragkhanic#! shrines. Their priests have come to give thanks. The western chiefs are waiting outside with the promises your captains made when they asked them to ride. They wish to know who will pay for the horses and men they lost putting you on the throne.\n\nFrom the north comes word that #Y Hobgoblin#! scouts have been seen on the road from #G Dragon's Pass#!. The garrisons ask for money to raise fresh companies. The treasurer asks whose petition he should put first."
 omni_girm.3.desc_frontier: "My chief, the clerks have marked out the new boundary. #G Soveneria#! remains beyond it, but several villages on this side are taking down their old tax notices. Their elders ask whose seal they should look for on the new ones.\n\nOur riders say western envoys have already been through those same villages, promising that next year there will be a seal the clans can call their own."
 omni_oath.6.t: "The Price of a Harbor"
 omni_oath.6.desc: "My liege, the riders from across the sea have sent a chest of gold and a copy of the oath they swore in #G Kainaxarthos#!. They ask for [SCOPE.sP('oath_landing_port').GetName|G], where they mean to land their horses and store their grain. In return they promise to protect the townsfolk and leave their shrines in the hands of their priests.\n\nThe harbor master says the gold has been weighed twice and is quite real. The priests say they would prefer to know how the promise is to be weighed."
 omni_oath.6.a: "Let them have the harbor on the terms they swore."
 omni_oath.6.a_tt: "[SCOPE.sP('oath_landing_port').GetName|G] passes to the Oath-Bearer's realm and gains #G +10%#! local population happiness for #Y 10 years#!."
 omni_oath.6.b: "Refuse their offer. The harbor is ours."
 omni_oath.6.b_tt: "Keep the harbor. The western riders retain their claims."
 omni_oath.2.desc_frontier: "My liege, the peace has put several #Y Kainaxari#! villages on the wrong side of a line the clerks drew this spring. Their envoy says that before the ink was dry, collectors had arrived from either side, each holding a copy of the same treaty.\n\nThe elders offer our riders grain and guides if we guarantee their shrines and tell them whose seal will appear on the next demand. They would prefer that we settle on one seal before sending anyone to collect."
