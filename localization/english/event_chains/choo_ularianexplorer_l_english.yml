l_english:

### EVENTS
 ularianexplorer_1_title: "[GetCharacter('(int32)330').GetName] the Explorer"
 ularianexplorer_1_desc: "My Emperor, word from the small seaside city of [GetProvince('(int32)2422').GetName|G] is that a local lord has coordinated with a small number of #T Helluvian#! converts living in the surrounding area to go on a voyage abroad. Their motives are officially unknown, but it can be assumed they are seeking to flee persecution from our administrative and religious authorities, as their faith is banned in our Empire.\n\nWhile their destination is unknown, we suspect that he is attempting to flee to either the #G Bloody Isles#! or the #G Lands of the Snakefolk#!. Regardless of his destination, it is almost certain that he will meet his end at the blade of some uncivilized despot.\n\nWhat is known of this expedition is the leader, a young #Y Ularian#! nobleman by the name of [GetCharacter('(int32)330').GetName|Y]. Caught worshipping the false god #T Hellas#! he was sentenced to death under your grace's decree, only to slip out of our hands. It was speculated that he was hiding in the nearby forests, gathering supporters and possibly planning this journey.\n\nRegardless, their goals pose no threat to our rule, and sending in Imperial forces to detain them would only waste time and resources to hold onto a few heathen families. I would assume your imperial majesty would agree?"
 ularianexplorer_1.a: "Let that fool sail to his death."
 ularianexplorer_1_tooltip.a: "[GetCharacter('(int32)330').GetName|Y] will sail off to find a new homeland for his people!"
 
 ularianexplorer_2_title: "A Stranger Arrives in Narbolia"
 ularianexplorer_2_desc: "My liege, unrecognized ships have arrived in the harbor of [GetProvince('(int32)2187').GetName|G]! The vessel is filled with #Y Geallian#! families, and is led by a captain who calls himself [GetCharacter('(int32)330').GetName|Y].\n\nFrom what we can understand from his broken #Y Orcish#!, he and his crew are fleeing the persecution of the [GetCountry('WGA').GetName|T], seeking to create a new homeland for themselves in the lands of the #Y Snakes#! where they can practice their faith in peace. He asks for [ROOT.GetCountry.GetRuler.GetName|Y]'s help in his voyage, hoping to procure supplies for the long journey.\n\nWhile the aggressive and isolationist #Y Snakefolk#! are sure to attack their frail group of farmers and herders, the god preached by the Explorer intrigues many in court. From what we can understand from his captivating lectures, this #T Hellas#! encourages his followers to seek to grow their #T Inner Flame#! by growing the flames of those who have the dimmest lights. Intriguing indeed!\n\nWhen he leaves the court, various chiefs share their opinions to [ROOT.GetCountry.GetRuler.GetName|Y]. Some demand the expulsion of the stranger, stating that no #Y Shuar#! are to be trusted, while others say that he should be sent away with supplies, as the #Y Geallians#! are active supporters of our country. The more curious chieftains suggest that the stranger be made a subject of our ruler, teaching us the ways of this #T Hellas#!. There are already followers of his faith in [GetProvince('(int32)2199').GetName|G]; granting him that settlement in return for service would give his families a home while keeping their leader under our authority."
 ularianexplorer_2.a: "Send him away!"
 ularianexplorer_2_tooltip.a: "[GetCharacter('(int32)330').GetName|Y] will sail off to find #G Austropetolia#!!"
 ularianexplorer_2.b: "Supply his ships."
 ularianexplorer_2_tooltip.b: "We will supply [GetCharacter('(int32)330').GetName|Y] with food for his journey to #G Austropetolia#!!"
 ularianexplorer_2.c: "Have him stay, his knowledge is valuable."
 ularianexplorer_2_tooltip.c: "[GetCharacter('(int32)330').GetName|Y] will stay here and serve the King!"
 
 ularianexplorer_3_title: "A Shuar at Court"
 ularianexplorer_3_desc: "Great Butcher! A #Y Shuar#! has been dragged before you today, claiming to hail from the far away empire of the #Y Geallians#!. He was found on a ship full of his countrymen that attempted to dock at [GetProvince('(int32)1851').GetName|G], asking for an audience with you.\n\nHe states his goal is to journey to the islands of the #Y Snakefolk#! to find a new homeland for his people, and asks us for food and supplies to make the long journey across the #G Serpentine Sea#! manageable for his kinsmen.\n\nMost chiefs scoff at his request, what kind of #Y Orc#! would help a deceitful #Y Shuar#!?"
 ularianexplorer_3.a: "Send him away!"
 ularianexplorer_3_tooltip.a: "[GetCharacter('(int32)330').GetName|Y] will sail off to find #G Austropetolia#!!"
 ularianexplorer_3.b: "Supply his ships."
 ularianexplorer_3_tooltip.b: "We will supply [GetCharacter('(int32)330').GetName|Y] with food for his journey to #G Austropetolia#!!"
 ularianexplorer_3.c: "Kill the #Y Shuar#!!"
 ularianexplorer_3_tooltip.c: "#R [GetCharacter('(int32)330').GetName|Y] will be executed!#!"
 
 ularianexplorer_4_title: "[GetCharacter('(int32)330').GetName] Arrives in Iprnk"
 ularianexplorer_4_desc: "My [ROOT.GetCountry.GetRulerTitle], a foreigner has appeared in the harbors of [GetProvince('(int32)5694').GetName|G].\n\nNormally, #Y humans#! would be killed on sight, however this man claims to come from a far away empire not connected to the hostile #Y Eptelonians#! or #Y Arteonians#!.\n\nLast we heard of the southern continents was the breakup of a great empire, possibly the empire of the so-called #T Sani#!. Thus, this foreigner's intriguing story earned him an audience with [ROOT.GetCountry.GetRuler.GetName|Y].\n\nHe asks for supplies as well as for land for his people to settle on. While his story was interesting, this petition is outlandish to many at court, who would never willingly grant a #Y human#! land on #Y Snakefolk#! territory.\n\nThe chief's marshal suggests sending him to the #G southern islands#!, where the savage natives are sure to dispose of him for us. Meanwhile, our wise one asks that the king consider the information the man might have, and keep him at court. A grant of [GetProvince('(int32)5695').GetName|G], held under our authority, would offer another way to secure his service; his people would have their own home, but its ruler would answer to us."
 ularianexplorer_4.a: "Send him away!"
 ularianexplorer_4_tooltip.a: "[GetCharacter('(int32)330').GetName|Y] will sail off to the #G Southern Islands#!!"
 ularianexplorer_4.b: "Supply his ships."
 ularianexplorer_4_tooltip.b: "We will supply [GetCharacter('(int32)330').GetName|Y] with food for his journey to the #G Southern Islands#!!"
 ularianexplorer_4.c: "Have the foreigner stay, he has much to teach us."
 ularianexplorer_4_tooltip.c: "[GetCharacter('(int32)330').GetName|Y] will stay here and serve the Chief!"
 
 ularianexplorer_5_title: "[GetCharacter('(int32)330').GetName] and the Austropetolians"
 ularianexplorer_5_desc: "Chief, a #Y human#! has arrived on our shores! He claims to come from a great empire to the south, and brings many families with him.\n\nHe asks for our aid, some land for his people to farm or supplies to keep them going on their long journey.\n\nObviously this foreigner does not understand what his people have done to us, how they have forsaken us and left us in eternal war with our #Y Snakefolk#! enemies. Many clan chieftains argue that we should show mercy to him, as he leads many women and children. However, if he is not to be killed, his people should at least be expelled from our lands!"
 ularianexplorer_5.a: "Send him away!"
 ularianexplorer_5_tooltip.a: "[GetCharacter('(int32)330').GetName|Y] will sail off to the #G Southern Islands#!!"
 ularianexplorer_5.b: "Supply his ships."
 ularianexplorer_5_tooltip.b: "We will supply [GetCharacter('(int32)330').GetName|Y] with food for his journey to the #G Southern Islands#!!"
 ularianexplorer_5.c: "Kill him!"
 ularianexplorer_5_tooltip.c: "#R [GetCharacter('(int32)330').GetName|Y] will be executed!#!"
 
 ularianexplorer_6_title: "[GetCharacter('(int32)330').GetName] Arrives in Crutzizz"
 ularianexplorer_6_desc: "Chief, #Y humans#! have arrived on our shores! These are not the cruel #Y Eptelonians#! or #Y Arteonians#!, but a people that call themselves '#Y Geallian#!'.\n\nTheir leader, a man named [GetCharacter('(int32)330').GetName|Y], asks for supplies to help his people in their journey as well as directions to lands uninhabited by a great kingdom.\n\nEptelonians, #Y Geallian#! or whatever else they want to call themselves, our people have no love for #Y humans#!. Should we not kill him on the spot, the cruel [GetCountry('UPJ').GetName|T] will take care of them."
 ularianexplorer_6.a: "Direct them to the #Y Euryalids#!!"
 ularianexplorer_6_tooltip.a: "[GetCharacter('(int32)330').GetName|Y] will sail off to find the #Y Euryalids#!!"
 ularianexplorer_6.b: "Supply his ships and send him to #G Siznl#!."
 ularianexplorer_6_tooltip.b: "We will supply [GetCharacter('(int32)330').GetName|Y] with food for his journey to the #T Euryalid Kingdom#!!"
 ularianexplorer_6.c: "Kill him!"
 ularianexplorer_6_tooltip.c: "#R [GetCharacter('(int32)330').GetName|Y] will be executed!#!"
 
 ularianexplorer_7_title: "[GetCharacter('(int32)330').GetName] Arrives in Siznl"
 ularianexplorer_7_desc: "My King, a foreigner calling themself [GetCharacter('(int32)330').GetName|Y] has requested an audience with you.\n\nWhile I am aware of your decree to kill all #Y humans#! on sight, he is unlike the #Y Eptelonians#! and #Y Arteonians#! who once raided our shores. His people have pale skin, and claim to come from the #T Sani Empire#!.\n\nHe asks for land for his people to settle, ready to become a vassal of your majesty if you desire so.\n\nInformation about the southern continents are hard to come by, and his knowledge on mathematics and sciences are impressive for a #Y human#!. He might show himself to be an excellent vassal, developing his lands in ways we could never imagine.\n\nHowever, he is still #Y human#!, a race more deceitful than the #Y Austropetolians#!. Most of us support his expulsion, but the fate of him and his people are up to you my lord."
 ularianexplorer_7.a: "Send him away!"
 ularianexplorer_7_tooltip.a: "[GetCharacter('(int32)330').GetName|Y] will sail off to find a homeland!"
 ularianexplorer_7.b: "They will serve me."
 ularianexplorer_7_tooltip.b: "[GetCharacter('(int32)330').GetName|Y] and his people will become vassals of the #T Euryalid Kings#!!"
 ularianexplorer_7.c: "Kill him!"
 ularianexplorer_7_tooltip.c: "#R [GetCharacter('(int32)330').GetName|Y] will be executed!#!"
 
 ularianexplorer_8_title: "[GetCharacter('(int32)330').GetName] Settles Down"
 ularianexplorer_8_desc: "My Chief, a #Y human#! has arrived on our shores! He is unlike any #Y human#! wwe have seen before, pale with strange robes and a brown beard.\n\nHis complexion intrigued us, so we heard out his request. He is looking for a homeland for his people, and seeks to settle onto one of the surrounding islands.\n\nWhile granting him lands in our great kingdom is certainly out of the question, there are a few islands to our north that might serve him well should he be able to pacify the natives.\n\nHowever, our people are intrigued by the design of his boats, weapons, cooking tools, and more. Should he stay in our country, he may be of great use to us."
 ularianexplorer_8.a: "Against all odds, the Ularian found a home for his people..."
 ularianexplorer_8_tooltip.a: "We will tag switch and play as the independent #G Helluvian#! realm of #T Etenazun#!, ruled by [GetCharacter('(int32)330').GetName|Y], in [GetProvince('(int32)5600').GetName|G]."
 ularianexplorer_8.b: "Send him to the #G northern isles#!."
 ularianexplorer_8_tooltip.b: "[GetCharacter('(int32)330').GetName] will establish independent #T Etenazun#! in [GetProvince('(int32)5600').GetName|G]. "
 ularianexplorer_8.c: "Offer him and his people a home here."
 ularianexplorer_8_tooltip.c: "[GetCharacter('(int32)330').GetName|Y] and his people will settle here, and he will serve our Chief!"


 helluvian_bible: "[GetCharacter('(int32)330').GetName|Y]'s #T Ullas#!"
 helluvian_bible_desc: "An #T Ullas#!, or #T Holy Text#! of the #T Helluvian#! faith, of the explorer [GetCharacter('(int32)330').GetName|Y], gifted to a benefactor who helped him on his journey to #G Austropetolia#!."

 # News for countries that previously watched the expedition depart.
 ularianexplorer_10_title: "A Place At A Foreign Table"
 ularianexplorer_10_desc: "My [ROOT.GetCountry.GetRulerTitle], there is news of that #Y Ularian#! explorer who departed from our shores with his ships full of #T Helluvian#! families. You may recall that [GetCharacter('(int32)330').GetName|Y] was determined to find somewhere that his followers might farm their fields and worship their god without interference. Well, it seems that a foreign ruler has finally offered them a reason to bring their voyage to an end!\n\nAccording to the accounts that have reached [ROOT.GetCountry.GetCapital.GetName|G], the explorer has accepted a place at court, where his knowledge and the teachings of #T Hellas#! have attracted considerable interest. Families accompanying him have settled in their host's lands, bringing their faith with them, and the man who once went from harbor to harbor asking for assistance now has a home among the people he will serve.\n\nThere will be no independent kingdom at the end of this journey, but those who remember his petition may consider this a happier outcome than another uncertain welcome on a distant shore. His people have somewhere to live, their leader has found a useful place in his host's service, and for once there is no need to wonder which ruler might turn them away next."
 ularianexplorer_11_title: "The Explorer And The Euryalid King"
 ularianexplorer_11_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], a curious account from the lands of the #Y Euryalids#! has reached our court. It concerns [GetCharacter('(int32)330').GetName|Y], the #Y Ularian#! who passed beyond our shores in search of a homeland for his #T Helluvian#! followers. Despite the hostility that #Y humans#! might expect to meet in those parts, he has apparently persuaded an #Y Euryalid#! ruler to hear his petition, and the answer was considerably more generous than an order to leave!\n\nLand has been granted to the travelers, and [GetCharacter('(int32)330').GetName|Y] now rules a small realm called #T Etenazun#!. His followers have a place to settle and practice their faith, while their leader has exchanged the uncertainty of his voyage for the responsibilities of a crown. There is, however, a condition attached to this good fortune; the new country must serve the #Y Euryalid#! king as a subject.\n\nThose listening to the report disagree over which ruler has gained the most from the arrangement. Some say that [GetCharacter('(int32)330').GetName|Y] has secured the very thing for which his families endured their journey, while others observe that the #Y Euryalid#! has acquired a useful servant and new lands under his authority. Whatever the case, the explorer has finally found somewhere to bring his ships ashore."
 ularianexplorer_12_title: "A Crown Beyond The Sea"
 ularianexplorer_12_desc: "My [ROOT.GetCountry.GetRulerTitle], there is a tale making its way through [ROOT.GetCountry.GetCapital.GetName|G] that deserves your attention. [GetCharacter('(int32)330').GetName|Y], the #Y Ularian#! who sailed away with his #T Helluvian#! followers, has apparently reached the islands north of #G Acim#! and established a country of his own. Those who remember his little company may be surprised to hear that its captain is now a ruler!\n\nThe new realm is called #T Etenazun#!, and its settlement bears the name of [GetProvince('(int32)5600').GetName|G]. Here the families who accompanied him have finally found land on which to make their homes, with [GetCharacter('(int32)330').GetName|Y] himself at their head and the #T Helluvian#! faith established as the religion of their country. For people who left their former homeland to escape persecution, this must seem a considerable improvement upon another uncertain welcome in a foreign harbor.\n\nOf course, a crown does not plant fields or guarantee the safety of an island, and there will be plenty for the new ruler to concern himself with. Still, the explorer who once asked for assistance on his voyage has achieved what he set out to do. Whatever becomes of his little kingdom, its people need no longer search the horizon for somewhere to belong."
 ularianexplorer_12_origin_desc: "You may find this difficult to believe, [ROOT.GetCountry.GetRuler.GetName|Y], but there is news of the #Y Ularian#! exile whom we allowed to sail away. [GetCharacter('(int32)330').GetName|Y], the #T Helluvian#! nobleman who slipped out of the hands of our authorities, has apparently survived his voyage. Indeed, if the accounts reaching [ROOT.GetCountry.GetCapital.GetName|G] are to be believed, the man has gone considerably further than merely avoiding an executioner's blade!\n\nOn the islands north of #G Acim#!, he has founded a realm called #T Etenazun#!, with a settlement that his people call [GetProvince('(int32)5600').GetName|G]. The families who fled our shores have established themselves there under his rule, and the faith that was forbidden to them in our lands is now the religion of their own country. The fugitive nobleman has, in other words, made himself a sovereign.\n\nSome at court dismiss the report as an account of a handful of settlers giving grand names to their new homes. Others remember how confidently it was predicted that the explorer would meet his end at the hands of a foreign despot. Whatever opinion your majesty holds of the matter, it would seem that the fool we sent away has found his homeland after all."
 ularianexplorer_13_title: "The Last Audience Of [GetCharacter('(int32)330').GetName]"
 ularianexplorer_13_desc: "My [ROOT.GetCountry.GetRulerTitle], word has reached [ROOT.GetCountry.GetCapital.GetName|G] concerning [GetCharacter('(int32)330').GetName|Y], the #Y Ularian#! who departed with his #T Helluvian#! followers in search of a new homeland. Unfortunately, the news brings an end to any speculation about how far his ships might carry him. The explorer has been executed at one of the foreign courts along his route.\n\nIt seems that his request for assistance earned him neither provisions nor permission to settle, but a sentence of death. The man who had hoped to find a ruler willing to hear his people's plight instead found one unwilling to allow him to leave alive. For all his determination, there was little that an account of distant lands or an appeal on behalf of his companions could do to save him.\n\nWhat happened to the families aboard his ships is less certain. No reliable account of their fate has reached our court, and those repeating the news cannot tell us whether they remained there or sought refuge elsewhere. We know only that their captain will lead them no farther, and that the homeland he promised to find will not be founded by his hand."
 ularianexplorer_14_title: "A Voyage Without An Ending"
 ularianexplorer_14_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], there is unfortunate news concerning the #Y Ularian#! explorer who passed beyond our shores. We have received word that [GetCharacter('(int32)330').GetName|Y] has died before completing his search for a homeland. The accounts reaching [ROOT.GetCountry.GetCapital.GetName|G] agree on his death, though they offer little that we can say with confidence about the circumstances.\n\nYou may remember that his ships carried families who had left their former country in the hope of practicing the #T Helluvian#! faith in peace. It was an ambitious undertaking for such a company, dependent upon finding both a place to settle and rulers willing to let them reach it. With their leader gone, we can no longer say where that journey might take them.\n\nThere are already those at court willing to supply the missing details, as there always are when news arrives from distant shores. Until a more reliable account reaches us, however, it would be unwise to repeat their stories as fact. What became of the explorer's companions remains unknown; for now, all that we can record is that [GetCharacter('(int32)330').GetName|Y] did not live to found the homeland he sought."
 ularianexplorer_news.a: "So, that is what became of the explorer."

 ularian_explorer_found_home_modifier: "A Home at Last"
 ularian_explorer_found_home_modifier_desc: "After an uncertain voyage in search of refuge, this character has found a home for himself and his people. With their immediate future secure, he faces his new life with renewed confidence."

 ularianexplorer_2.d: "Grant him [GetProvince('(int32)2199').GetName|G], in return for his allegiance."
 ularianexplorer_2_tooltip.d: "[GetCharacter('(int32)330').GetName|Y] and his people will settle in [GetProvince('(int32)2199').GetName|G], where he will rule a #T Helluvian#! feudatory under our protection.\nThe new realm begins with 100 gold and 5 manpower."
 ularianexplorer_4.d: "Let him rule [GetProvince('(int32)5695').GetName|G] as our subject."
 ularianexplorer_4_tooltip.d: "[GetCharacter('(int32)330').GetName|Y] and his people will settle in [GetProvince('(int32)5695').GetName|G], where he will rule a #T Helluvian#! feudatory under our protection.\nThe new realm begins with 100 gold and 5 manpower."
 ularianexplorer_15_title: "Land In Return For Allegiance"
 ularianexplorer_15_desc: "My [ROOT.GetCountry.GetRulerTitle], word has reached [ROOT.GetCountry.GetCapital.GetName|G] of the #Y Ularian#! explorer who sailed away with his #T Helluvian#! followers. [GetCharacter('(int32)330').GetName|Y] has found a ruler willing to grant his people land, though there is an obligation attached to the gift!\n\nThe government of [SCOPE.sCountry('ularian_settlement_overlord').GetName|T] has granted him a single settlement, now called [SCOPE.sProvince('ularian_subject_settlement').GetName|G]. Here he rules [SCOPE.sCountry('ularian_opm_subject').GetName|T], a small #Y Ularian#! realm whose people may follow the #T Helluvian#! faith under his leadership. In return, the new ruler owes allegiance and service to the country that made his settlement possible.\n\nIt is a modest beginning for a man who set out to find a homeland, and some at court wonder whether he has traded the uncertainty of the sea for dependence upon another sovereign. Still, his families have somewhere to make their homes, and the ruler who granted them refuge has gained a subject. Whatever the future holds for their little realm, their search for a place to settle has ended."

 ularian_refugee_settlement_modifier: "A New #T Helluvian#! Community"
 ularian_refugee_settlement_modifier_desc: "The refugees have brought their faith to their new home. With permission to settle and a ruler of their own, the community can establish itself in relative peace."

 ularianexplorer_16_title: "A Homeland Under Our Protection"
 ularianexplorer_16_desc: "My [ROOT.GetCountry.GetRulerTitle], the grant has been made. [GetCharacter('(int32)330').GetName|Y] now rules [SCOPE.sCountry('ularian_opm_subject').GetName|T] from [SCOPE.sProvince('ularian_subject_settlement').GetName|G], and his little realm stands under our protection as a feudatory. The settlement is his to govern, while its ruler owes us allegiance and service.\n\nTwo #Y Ularian#! #T Helluvian#! families have settled there as freemen, and those local inhabitants who have accepted their faith will worship alongside them. Our new subject has been provided with funds and manpower to begin establishing itself, though a single settlement leaves its ruler plenty of work to do.\n\nFor the explorer, at least, there is relief in knowing where his voyage has brought him. There will be no further petition at another foreign harbor; his people have found a home, and we have gained a new subject."
 ularianexplorer_16.a: "May he govern his new home well."
 ularianexplorer_17_title: "The Settlement Remains Unfulfilled"
 ularianexplorer_17_desc: "My [ROOT.GetCountry.GetRulerTitle], the proposed settlement at [SCOPE.sProvince('ularian_subject_settlement').GetName] has not resulted in the promised realm under [GetCharacter('(int32)330').GetName]. We cannot yet regard the settlement agreement as fulfilled."
 ularianexplorer_17.a: "The grant must be examined."

 ularianexplorer_18_title: "The Explorer's New Kingdom"
 ularianexplorer_18_desc: "My [ROOT.GetCountry.GetRulerTitle], [GetCharacter('(int32)330').GetName] now rules independent [SCOPE.sCountry('ularian_state').GetName] from [GetProvince('(int32)5600').GetName]. The travelers have brought their long search for a homeland to an end, and the Ularian settlers have begun a new life under a ruler of their own.\n\nTheir Helluvian faith is now the religion of their country, and the settlement has been provided with funds and manpower for the work ahead. It is a small beginning, but for the families who left their former homes in search of refuge, there is finally somewhere to build a future."
 ularianexplorer_18.a: "A new chapter begins."
