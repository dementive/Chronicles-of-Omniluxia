l_english:
 kinone_explorer.1.t:0 "A Modest Survey"
 kinone_explorer.1.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the merchants of #G Kr'ou#! have petitioned the elders over two tolls on the western road. Both collectors claim to maintain a stone bridge at the same distance from town. One has justified his higher rate by describing his bridge as exceptionally fine stone, but whether or not this will be the case remains to be seen.\n\nThe elders have chosen [SCOPE.sChar('kinone_explorer').GetName|Y], a #Y Kinone#! of our own clan who has drawn up several boundary surveys without being driven off by either party. His elder sister used to carry valley cloth down to the coast. When her boat went aground on the way home, the freight office blamed her for the loss. He still has the chart they issued her. The bar on which they found the boat is marked as deep water.\n\nHe asks for a letter of passage and leave to follow the road as far as the merchants take it. If their accounts are equally good abroad, he says, the valley could use a chart drawn by someone who has paid the tolls himself.\n\nThe clerk has issued fourteen sheets of paper. He expects the matter to be settled before the fifteenth is necessary."
 kinone_explorer.1.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)1547').GetName|G]."
 kinone_explorer.1.a:0 "Give him a letter. Let him account for the paper."
 kinone_explorer.1.b:0 "Give him another ream. We can spare it."
 kinone_explorer.2.t:0 "The Bridge in Duplicate"
 kinone_explorer.2.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the two wardens at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] have brought charges against one another. Each claims the sole right to collect a toll at his bridge. Both have produced the same receipt, bearing both their seals. The man who obtained it, a #Y Kinone#! named [SCOPE.sChar('kinone_explorer').GetName|Y], says they were willing enough to sign while they thought the other would be paying for repairs.\n\nThe bridge does need repairs. A spring flood took out the upstream pier, and both wardens have entered the loss in their accounts. For the price of a copy of his survey, the stranger offers to show us which bank a mason could reach with a cart."
 kinone_explorer.2.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)2323').GetName|G]."
 kinone_explorer.2.a:0 "File both objections under the bridge."
 kinone_explorer.2.b:0 "Buy the survey and settle the toll."
 kinone_explorer.3.t:0 "For the Pilot's Eyes"
 kinone_explorer.3.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a pilot at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] has sold the foreign surveyor a set of soundings. He takes his boat through the #G Intermarenican#! shallows on the ebb, when our harbor master advises ships to wait. His condition was that no other pilot should see the figures. On that understanding he has put his name to them.\n\nOur harbor master would buy a copy for his own use. He assures us that the pilots never see his charts. Judging by the number of boats we have had to pull off the bar this year, they may be exercising sound judgment."
 kinone_explorer.3.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)2769').GetName|G]."
 kinone_explorer.3.a:0 "The pilot made his terms clear."
 kinone_explorer.3.b:0 "Buy a copy for the harbor master."
 kinone_explorer.4.t:0 "Grain Yet Unbought"
 kinone_explorer.4.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the grain assessor at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] has presented a #Y Kinone#! traveler with a bill for the barley he intends to buy tomorrow. The stranger showed him a set of weights from the #G Peaceful Valley#! and asked him to weigh what was actually aboard. He has offered to defer eating tomorrow's barley until the duty is paid.\n\nOur grain merchants would pay for a table that lets them reckon the same sack on either bank. The assessor also sees some merit in the proposal, provided the table begins on this bank."
 kinone_explorer.4.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)2478').GetName|G]."
 kinone_explorer.4.a:0 "Collect the duty on what is aboard."
 kinone_explorer.4.b:0 "Waive the levy and copy his tables."
 kinone_explorer.5.t:0 "A Harbor by Permission"
 kinone_explorer.5.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a captain at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] offers [SCOPE.sChar('kinone_explorer').GetName|Y] a berth for #G Morrigon#! if he will mark a closed harbor as open. The captain has unloaded there three times since the decree, once by daylight. He says a chart ought to describe what ships do.\n\nThe surveyor has sent word to #G Kr'ou#! that there is one bridge and both men take a toll. He kept the original receipts, knowing his elders. In the same letter he told them he was going on. He has seen a channel whose best pilot sells the depths to one skipper at a time, and a harbor whose captain wants it put on a chart but would prefer to keep his name off it. His sister had to take the chart she was given. He means to bring home an atlas the next skipper can question before she puts out.\n\nThe factors can buy the #Y Kinone#! a place on the packet. The captain objects that public money should never be used to undercut an honest man who has gone to the trouble of finding his own harbor."
 kinone_explorer.5.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)2187').GetName|G]."
 kinone_explorer.5.a:0 "The captain can take his chances."
 kinone_explorer.5.b:0 "Pay for a berth on the packet."
 kinone_explorer.6.t:0 "A Stranger with a Short Petition"
 kinone_explorer.6.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a small vessel has put in at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] under a letter from the elders of #G Kr'ou#!. Its master is a #Y Kinone#! who has spent the better part of the morning explaining that the letter entitles him to ask for water. Our interpreter, who had prepared to hear a claim to land or compensation, asked him to repeat his petition.\n\nHe repeated it. He would also like to take a bearing from the quay. He means to follow the trade from harbor to harbor until he finds a passage home by the far side. And he would buy a rope, if ours are sold by a measure he can see.\n\nThe harbor men advise giving him a good one. They have seen the line he tied up with and would prefer to recover neither his vessel nor our water jars from the mud."
 kinone_explorer.6.ok_opun:0 "\n\nThe chiefs remember #Y Ok-Opun#!, who came asking for rather more than a rope. One has asked whether a man who wants so little can safely be taken at his word."
 kinone_explorer.6.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)1851').GetName|G]."
 kinone_explorer.6.a:0 "Give him water. Sell him the rope."
 kinone_explorer.6.b:0 "Give him water and a sound rope."
 kinone_explorer.7.t:0 "A Landing in Need of a Name"
 kinone_explorer.7.desc:0 "My [ROOT.GetCountry.GetRulerTitle], two chiefs at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] have offered [SCOPE.sChar('kinone_explorer').GetName|Y] pilots on the condition that he mark a certain landing with their family names. Whoever gives the landing its name expects to collect from the boats that use it. The chiefs have brought witnesses to prove that their grandfathers went ashore there first.\n\nThe boatmen, when asked, gave the landing a third name and pointed out that it goes dry on the ebb. We can let the families settle precedence or pay a boatman to mark the place where a loaded vessel can actually put in."
 kinone_explorer.7.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)3668').GetName|G]."
 kinone_explorer.7.a:0 "Let the chiefs keep their pilots."
 kinone_explorer.7.b:0 "Pay for a sounding under the boatmen's name."
 kinone_explorer.8.t:0 "Last Year's Channel"
 kinone_explorer.8.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the flood has cut a new channel below [SCOPE.sProvince('kinone_explorer_landing').GetName|G]. A guide took [SCOPE.sChar('kinone_explorer').GetName|Y] through it while our collector followed in a skiff, demanding the toll for the old passage. He considers the duty attached to the river wherever it chooses to go.\n\nThe ferrymen have asked us to pay for stakes at the entrance to the new cut. Two boats have already followed the old markers into a meadow. The collector advises us to leave them where they are. He has only just finished paying for them."
 kinone_explorer.8.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)3393').GetName|G]."
 kinone_explorer.8.a:0 "Take the toll and let them pass."
 kinone_explorer.8.b:0 "Pay the guide to stake the new channel."
 kinone_explorer.9.t:0 "Names in the Margin"
 kinone_explorer.9.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a #Y Seeker#! copyist at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] has asked leave to circulate the #Y Kinone#!'s account of his travels. He has checked the dates, set the receipts in order, and corrected the spelling of every official named. Several of the officials now wish their names had been left as he found them.\n\n[SCOPE.sChar('kinone_explorer').GetName|Y] will agree to an edition if it includes the receipts. The copyist argues that a traveler who gives evidence for his complaints deserves to be read. Those who supplied the evidence would prefer that he be read in the archive."
 kinone_explorer.9.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)2720').GetName|G]."
 kinone_explorer.9.a:0 "Keep one copy in the council archive."
 kinone_explorer.9.b:0 "Publish the names and the receipts."
 kinone_explorer.10.t:0 "A Finding of Impracticability"
 kinone_explorer.10.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the officers at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] have considered the #G Serpentine Sea#! crossing. Three charts agree that no water can be had along the route. Our clerk found that all three were taken from the same original, but the retired admiral who approved the finding regards this as evidence of good copying.\n\n[SCOPE.sChar('kinone_explorer').GetName|Y] proposes to sail regardless. He asks to take the finding under seal so that, if he finds a watering place, the inhabitants can see how thoroughly it was looked for. One of our captains has made the crossing and can take him along for a share of the provisions."
 kinone_explorer.10.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)5694').GetName|G]."
 kinone_explorer.10.a:0 "Give him the finding under seal."
 kinone_explorer.10.b:0 "Find him a captain who has made the crossing."
 kinone_explorer.11.t:0 "The Depth at the Wrong Hour"
 kinone_explorer.11.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the lookouts at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] took the foreigner's sail for an #Y Eptelonian#! until he rounded the outer reef and dropped anchor in water that would shortly have left him high and dry. Our pilot says an Eptelonian raider would at least have known where to anchor.\n\nThe man is a #Y Kinone#! out of #G Luxterra#!. His chart gives the depth at noon, the hour at which he happened to cast his lead. Our pilot has a table showing when he can clear the reef and reach the next island. She would sell him a copy for rather less than she would charge to get him off it."
 kinone_explorer.11.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)5587').GetName|G]."
 kinone_explorer.11.a:0 "His chart brought him this far."
 kinone_explorer.11.b:0 "Pay for the pilot's tide table."
 kinone_explorer.12.t:0 "The Assistance Promised"
 kinone_explorer.12.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the elders at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] asked [SCOPE.sChar('kinone_explorer').GetName|Y] what became of the men who promised ships and arms against the #Y Snakefolk#!. He had heard nothing of the undertaking. This seemed perfectly likely to the elders, who have heard nothing from the men who made it either.\n\nThe #Y Kinone#! offers to carry their testimony to the next court that will hear it. Three elders have dictated four accounts. They give different numbers of ships and disagree about who stood surety. All remember the day the help was due. A scribe could take down all four while the witnesses are still willing to sit together."
 kinone_explorer.12.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)5594').GetName|G]."
 kinone_explorer.12.a:0 "Give him the account the elders can agree on."
 kinone_explorer.12.b:0 "Pay a scribe to take down all four."
 kinone_explorer.13.t:0 "An Old Article of Trade"
 kinone_explorer.13.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the shipwright at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] has found the point of a blade below the visitor's waterline. It held fast across two stretches of open sea and has only begun to leak since we offered to pull it out. Two men in the yard remember selling the blade, and a third recalls buying it on a commission he would rather leave unnamed.\n\n[SCOPE.sChar('kinone_explorer').GetName|Y] asks us to settle the rights to the iron once his hull is sound. Our shipwright is happy to take the blade against part of his fee. He says it is about the only piece of work in the vessel that has lasted since #G Luxterra#!."
 kinone_explorer.13.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)5607').GetName|G]."
 kinone_explorer.13.a:0 "Ask the claimants to settle ownership."
 kinone_explorer.13.b:0 "Pay for the repair. Keep the blade."
 kinone_explorer.14.t:0 "Soundings for a Fleet"
 kinone_explorer.14.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the admiral at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] has examined the foreigner's chart of the #T Euryalid#! coast. Alongside the ordinary depths and anchorages he found two places where ships can wait out of sight of our watchmen. One is where our own patrol shelters in bad weather.\n\n[SCOPE.sChar('kinone_explorer').GetName|Y] says he drew the chart for merchants. The admiral believes him and would like six copies. The harbor pilots ask for a civilian edition. The watch commander would seize the offending leaves, and some of his officers see little purpose in taking the chart if the man who drew it can go on drawing others."
 kinone_explorer.14.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)5603').GetName|G]."
 kinone_explorer.14.a:0 "Let him take the chart as he brought it."
 kinone_explorer.14.b:0 "License a civilian copy for the pilots."
 kinone_explorer.14.end_tt:0 "#R Mvu-Kou will be detained, ending the voyage. Word will be sent to the Peaceful Valley.#!"
 kinone_explorer.14.c:0 "Keep him here until the admiral is satisfied."
 kinone_explorer.14.d:0 "Take the fleet soundings and let him sail."
 kinone_explorer.15.t:0 "A Passage Owed"
 kinone_explorer.15.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a pilot at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] took [SCOPE.sChar('kinone_explorer').GetName|Y] through a reef he had marked as solid rock. When the water broke twice, she put him between the two lines of foam. He had spent the previous evening persuading his crew that such a passage could not exist.\n\nThe fishing boats use that cut when the outer coast is rough. She asks him to leave it blank in any chart he sells. He can give her his own word. She would put rather more stock in it if a ruler of #G Austropetolia#! stood witness."
 kinone_explorer.15.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)611').GetName|G]."
 kinone_explorer.15.a:0 "He may make his own promises."
 kinone_explorer.15.b:0 "Give the pilot our word as well."
 kinone_explorer.15.missing_soundings:0 "\n\nThe #T Euryalid#! officers kept the pages on which he might have written down her directions. The pilot supplied a scrap of sailcloth, which she advised him to keep out of official hands."
 kinone_explorer.16.t:0 "Three Kinds of Cargo"
 kinone_explorer.16.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the customs men at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] have set aside the #Y Kinone#!'s compass as a luxury, his lead line as a weapon, and his damp charts as waste. He offered to take the waste off their hands. After a short consultation they found that it was waste of considerable value.\n\nHis silver will cover the duty on the compass. The harbor master asks us to release the rest with it. He has watched the stranger take a bearing and sees how we might recover more from the next ship he brings safely in than from the papers in his chest."
 kinone_explorer.16.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)748').GetName|G]."
 kinone_explorer.16.a:0 "Take the duty on the compass."
 kinone_explorer.16.b:0 "Release the instruments and the papers."
 kinone_explorer.17.t:0 "The Stones Give Evidence"
 kinone_explorer.17.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the keepers of the #T Standing Stones#! at #G Dengolo#! found [SCOPE.sChar('kinone_explorer').GetName|Y] sighting along one of the stones. They told him it was set there for a purpose that had nothing to do with the direction of a road. He put his instrument away and offered to leave the ground as he found it.\n\nOne of the keepers returned after dark with a neighbor. They have been disputing the line between their fields for nineteen years. They would welcome a bearing taken from the stones, provided they may describe the result to their families as an ancient settlement."
 kinone_explorer.17.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)1097').GetName|G]."
 kinone_explorer.17.a:0 "The keepers can settle it between them."
 kinone_explorer.17.b:0 "Pay him to mark the boundary."
 kinone_explorer.18.t:0 "A Letter in Two Hands"
 kinone_explorer.18.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a merchant at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] has offered to take the #Y Kinone#!'s letter to #G Luxterra#!. His rival says the ship is sound but its captain has never delivered a letter to anyone unable to pay him at the far end. As the letter is for a council of elders, both men are prepared to speculate about their means.\n\nOur harbor master advises sending a second copy by another ship. It is the first suggestion all morning that has led the first captain to ask what we meant to pay him."
 kinone_explorer.18.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)923').GetName|G]."
 kinone_explorer.18.a:0 "Send the letter with the first ship."
 kinone_explorer.18.b:0 "Pay a second captain to take a copy."
 kinone_explorer.19.t:0 "An Inexpensive Edition"
 kinone_explorer.19.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a papyrus merchant at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] proposes to publish the charts [SCOPE.sChar('kinone_explorer').GetName|Y] has brought from #G Austropetolia#!. Our captains have been asking for a better account of those waters since the last cargo went aground. The merchant calls his offer inexpensive. He keeps the plates, puts his own name on the edition, and requires the #Y Kinone#! to buy fifty copies.\n\nThe visitor has asked to see an expensive proposal in the hope that he can afford it. Our factors suggest paying for an edition ourselves if the plates are kept here and the author is allowed to correct them."
 kinone_explorer.19.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)919').GetName|G]."
 kinone_explorer.19.a:0 "Let them agree on a price themselves."
 kinone_explorer.19.b:0 "Buy an edition on fair terms."
 kinone_explorer.20.t:0 "A Line Still Legible"
 kinone_explorer.20.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the archivist at #G Yahsfinhya#! has laid out the foreigner's spray-stained papers to dry. The #Y Kinone#! would have him restore whatever can still be read. One particularly clear line records a loan made to a member of our court when his baggage was held for a toll.\n\nThe gentleman argues that the debt is a private matter and ought to be left out of a public copy. The archivist has asked him to repay the principal, at which point he would be happy to mark it settled. We have been asked to rule on which of the two methods best preserves the record."
 kinone_explorer.20.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)888').GetName|G]."
 kinone_explorer.20.a:0 "Let the archivist omit the doubtful line."
 kinone_explorer.20.b:0 "Have the whole page copied."
 kinone_explorer.21.t:0 "A Desk with a View of the Sea"
 kinone_explorer.21.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the captains of #G Arteon#! have been bringing their charts to [SCOPE.sChar('kinone_explorer').GetName|Y] since word of his work reached our court. Several propose giving him a salary and a room to put the whole voyage into order. Our treasurer has calculated what we would save if the survey ended here and the rest of the coast were filled in from existing accounts.\n\nThe #Y Kinone#! laid three charts of the coast ahead on the table. All give the same depths at the same points. Two still bear a figure the first copyist wrote backward. He says he could make a handsome atlas here and finish it before winter. He would have to tell the elders which pages he had been willing to sign without ever casting a lead.\n\nHe asks for a day to consider the offer and a sheet on which to write to his elders. The treasurer sees no difficulty with either request and has already entered the sheet against his first month's allowance."
 kinone_explorer.21.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)345').GetName|G]."
 kinone_explorer.21.a:0 "Let him finish the journey."
 kinone_explorer.21.b:0 "Fund the next leg instead."
 kinone_explorer.21.end_tt:0 "#Y Mvu-Kou#! will settle here. His letter will end the expedition."
 kinone_explorer.21.c:0 "Give him the desk and a place at court."
 kinone_explorer.22.t:0 "The Authoritative Coast"
 kinone_explorer.22.desc:0 "My [ROOT.GetCountry.GetRulerTitle], our officers showed [SCOPE.sChar('kinone_explorer').GetName|Y] the authoritative chart of #G Horteon#!. He recognized the depths along the fishing grounds and gave us the names of the crews who took them. Their boats had pulled him clear of a bank the chart marks in quite another place.\n\nThe official whose name appears on the chart says the men furnished their figures at his request. The crews would be satisfied to see their names alongside his. He has asked whether we might first establish which of the two services qualifies as authorship."
 kinone_explorer.22.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)175').GetName|G]."
 kinone_explorer.22.a:0 "Keep the official chart as it stands."
 kinone_explorer.22.b:0 "Put the crews' names on the next edition."
 kinone_explorer.23.t:0 "The Closed Channel"
 kinone_explorer.23.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the pilots of [SCOPE.sProvince('kinone_explorer_landing').GetName|G] brought the #Y Kinone#! through a channel our officers have closed. The man who lent them their boat had another taken from him for making the same passage last spring. They ask for the ordinary fare and the return of the first boat.\n\nOur officers say the restriction has spared us any number of wrecks. The pilots say they would be glad to show the foreigner the authorized passage if an officer would come along to point it out."
 kinone_explorer.23.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)85').GetName|G]."
 kinone_explorer.23.a:0 "Pay only the usual fare."
 kinone_explorer.23.b:0 "Return the boat and pay the pilots."
 kinone_explorer.24.t:0 "A Reading for Winter Stores"
 kinone_explorer.24.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the weather has kept [SCOPE.sChar('kinone_explorer').GetName|Y] at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] long enough for his stores to run low. He offers to read from his travels in exchange for meal and oil. The council heard his account of a neighboring ruler's harbor dues and agreed that travelers sometimes see an injustice more clearly than the men obliged to live with it.\n\nHe proposes to read the chapter on our own harbor dues tomorrow. Several councilors wish to reconsider the arrangement. Those who have read ahead say it is the better chapter."
 kinone_explorer.24.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)191').GetName|G]."
 kinone_explorer.24.a:0 "A fair price for the first passage."
 kinone_explorer.24.b:0 "Pay for the rest of the reading."
 kinone_explorer.25.t:0 "A Sound Mooring in the Morning"
 kinone_explorer.25.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the #Y Kinone#! made his ship fast to the ice at [SCOPE.sProvince('kinone_explorer_landing').GetName|G]. It had been part of the shore when he went ashore himself. By the time the harbor watch called him back, it had come away and was making steadily toward #G Horteon#! with the vessel still attached.\n\nOur boatmen have offered to take a line out. They advise the foreigner to leave his rope tied to the ice until they give him something steadier to tie it to. There is a fee for the tow, though we may be able to waive the customary charge for departure."
 kinone_explorer.25.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)375').GetName|G]."
 kinone_explorer.25.a:0 "Point him toward the quay."
 kinone_explorer.25.b:0 "Send a crew and a proper towline."
 kinone_explorer.26.t:0 "The Atlas Goes Overland"
 kinone_explorer.26.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the boatmen at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] give the #Y Kinone#! only a few days before the inlets freeze. His ship can still make open water by the long way around. His atlas can get there sooner on a sledge, provided someone brings it across the ice before the weather breaks.\n\nOur storekeeper has a dry room for the chest, and the sledge master has a team ready. The storekeeper urges us to pay for the sledge so the chest will be out of his room. The sledge master urges us to pay for the room so he can choose the day he goes."
 kinone_explorer.26.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)5936').GetName|G]."
 kinone_explorer.26.a:0 "Give the atlas a dry room."
 kinone_explorer.26.b:0 "Pay the sledge team and the storekeeper."
 kinone_explorer.26.c:0 "Hire the sledge team. The storekeeper can keep his room."
 kinone_explorer.27.t:0 "A Correction in the Margin"
 kinone_explorer.27.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a #Y Sea Elf#! pilot at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] set a cup on [SCOPE.sChar('kinone_explorer').GetName|Y]'s chart where he meant to turn for #G Luxterra#!. The cup stood for a reef she had found after losing a ship there. The chart gives clear water. She supplied the true bearing and asked that both be set down together.\n\nThe #Y Kinone#! offered to strike the old one out. The pilot says copies are already in the hands of men at sea. Anyone following one ought to recognize the mistake while he still has room to turn. The surveyor sat with the chart awhile. Then he put down his knife and wrote his name beside the wrong bearing. Below it he wrote hers, with the depth she had measured and the turn a skipper should make."
 kinone_explorer.27.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)5894').GetName|G]."
 kinone_explorer.27.a:0 "Let him print the correction in his own time."
 kinone_explorer.27.b:0 "Pay to circulate the correction now."
 kinone_explorer.28.t:0 "Three Blank Channels"
 kinone_explorer.28.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the copyists at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] have offered to make a clean master of the atlas. They ask that three channels be left blank. One is used by boats that avoid paying a duty, the next by the boats sent to collect it. On the use of the third they have kept their own counsel.\n\n[SCOPE.sChar('kinone_explorer').GetName|Y] wants to see the proof before it is bound. If we pay for a fair copy, he will let the passages stand blank with a mark beside each omission. Otherwise he proposes to take his own papers, in which the copyists' discretion can do no further work."
 kinone_explorer.28.vithr:0 "\n\nHe recognizes the third passage from the promise he made at #G Vithr#!. He tells the copyists that on this point, at least, they have been admirably clear."
 kinone_explorer.28.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for [GetProvince('(int32)5902').GetName|G]."
 kinone_explorer.28.a:0 "Let him take his own master away."
 kinone_explorer.28.b:0 "Pay for a fair copy with the omissions marked."
 kinone_explorer.29.t:0 "The Names of the Crews"
 kinone_explorer.29.desc:0 "My [ROOT.GetCountry.GetRulerTitle], one of the pilots at [SCOPE.sProvince('kinone_explorer_landing').GetName|G] has laid out a course for #G Luxterra#! that [SCOPE.sChar('kinone_explorer').GetName|Y] can sail with the provisions still aboard. She asks him to record the names of the crews who gave him bearings, tows, and a place to winter. They have been asked to supply their own spellings.\n\nThe list now includes a man's nephew who held a lantern while the ship came in and has written separately to clarify his share of the undertaking. The instructions for the crossing fit on the back of his letter."
 kinone_explorer.29.onward:0 "[SCOPE.sChar('kinone_explorer').GetName|Y] will make for #G Peaceful Valley#!."
 kinone_explorer.29.a:0 "Wish him a good passage."
 kinone_explorer.29.b:0 "Provision the crossing and enter the crews' names."
 kinone_explorer.30.t:0 "The Road Was Taxed Twice"
 kinone_explorer.30.desc:0 "My [ROOT.GetCountry.GetRulerTitle], [SCOPE.sChar('kinone_explorer').GetName|Y] has come back to the #G Peaceful Valley#! with a chest of charts and the letter we gave him when he left. Its seal is legible, having spent most of the voyage wrapped around his spare stockings. The clerk entered his answer about the bridge long ago. He has asked whether the traveler brought the originals.\n\nThere was one bridge, and its toll was taken twice. He produced both receipts. The clerk entered them and asked what else there was to report. The #Y Kinone#! opened the chest. Beside the routes are the names of the pilots who gave him the bearings, the seasons in which they used them, and the places where he would advise a skipper to wait. Where a bearing proved wrong, he has left it beside the correction. On the first leaf is the chart his sister was issued, with the depth he took himself on the way home.\n\nOur merchants would have the atlas copied for anyone intending to trade abroad. The elders would keep the master in the clan archive, where the men who paid for the paper can consult it. The pilots who got him home would be pleased to see an edition reach them in their own harbors."
 kinone_explorer.30.crew_credit:0 "\n\nHe has entered the #Y Horteonian#! crews by name, with a small space left for the official who commissioned their work."
 kinone_explorer.30.vithr_credit:0 "\n\nThere is a blank off #G Vithr#!. He asks the clerk to leave it exactly where it is."
 kinone_explorer.30.a:0 "Enter the receipts in the minutes. Print the rest."
 kinone_explorer.30.b:0 "Keep the atlas in the clan archive."
 kinone_explorer.30.copies_tt:0 "Our surviving patrons in #G Morrigon#!, #G Eptelon#!, #G Horteon#! and among the #Y Sea Elves#! will receive copies."
 kinone_explorer.30.c:0 "Send copies to the courts that helped him."
 kinone_explorer.31.t:0 "A Finding Sent Home"
 kinone_explorer.31.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a merchant has brought a document under an imperial seal to the #G Peaceful Valley#!. It certifies that crossing the #G Serpentine Sea#! would be of no practical use. [SCOPE.sChar('kinone_explorer').GetName|Y] obtained it from the court that declined to recommend his passage.\n\nHe has sent it ahead while he goes in search of a ship. He asks the elders to file it beside the letter in which he promised them an atlas. If he finds water on the far side, he means to give the next skipper its bearing. The clerk has asked whether to enter the finding among the results or leave room for a second opinion."
 kinone_explorer.31.a:0 "File it among the provisional findings."
 kinone_explorer.32.t:0 "A Letter from Eptelon"
 kinone_explorer.32.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a letter from #G Eptelon#! has reached the elders. [SCOPE.sChar('kinone_explorer').GetName|Y] apologizes for the interval. A captain offered to carry his last letter, but wished the recipient to pay freight by weight. This gave him cause to learn three systems of weights and a fourth that everyone uses when buying from foreigners.\n\nHe encloses a receipt and a few bearings from the #T Standing Stones#!. The clerk has asked where to file the receipt. There is room in the bridge ledger if we take out the papers relating to the bridge."
 kinone_explorer.32.a:0 "Open a second ledger."
 kinone_explorer.33.t:0 "A Bearing for Home"
 kinone_explorer.33.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a #Y Sea Elf#! packet has brought a correction to a chart we have yet to receive. [SCOPE.sChar('kinone_explorer').GetName|Y] writes that the corrected bearing should bring him back to #G Luxterra#! once the wind changes. The pilot who supplied it has added a note asking us to show the old bearing beside the new one, so any skipper with an earlier copy can tell whether he has the dangerous chart.\n\nThe clerk has entered the corrected bearing under routes home. The elders have asked him to leave space for the date of arrival."
 kinone_explorer.33.a:0 "Watch the road from the coast."
 kinone_explorer.34.t:0 "A Desk in Arteon"
 kinone_explorer.34.desc:0 "My [ROOT.GetCountry.GetRulerTitle], a letter from #G Arteon#! says that [SCOPE.sChar('kinone_explorer').GetName|Y] has taken a post at court. They have given him a salary, a room for his charts, and all the papyrus he can use. He writes that his patron keeps sending him maps of the coasts he meant to visit, and that he is learning which ones a prudent sailor would leave in the library.\n\nHe sends the soundings he took himself and asks the elders to keep them apart from the charts his patron commissions here. The clerk has asked whether to file the packet under voyages completed. The elders have directed him to give the bearings to anyone from the valley who has use for them."
 kinone_explorer.34.a:0 "Enter his new address beside his name."
 kinone_explorer.35.t:0 "Held for Further Soundings"
 kinone_explorer.35.desc:0 "My [ROOT.GetCountry.GetRulerTitle], word comes from the #T Euryalid Kingdom#! that its officers have detained [SCOPE.sChar('kinone_explorer').GetName|Y]. He had put the depth of their harbors into a chart which, in their judgment, could be read by an enemy. They have made no demand of the #G Peaceful Valley#! and advise us to regard the voyage as concluded.\n\nThe elders have asked what can be done for a man held on the strength of a set of soundings. The clerk has read the notice twice. It makes no allegation that any of the figures were wrong."
 kinone_explorer.35.a:0 "Record it as the end of the voyage."
 kinone_explorer.36.t:0 "The Last Entry"
 kinone_explorer.36.desc:0 "My [ROOT.GetCountry.GetRulerTitle], merchants have brought word that #Y Mvu-Kou#! died abroad. They have returned what they could find of his papers. There are bearings, lists of provisions, and the names of men who took him in when his ship needed work. His own hand stops halfway down a page. Folded inside his letter of passage are the two receipts for the bridge and a worn chart of the bar where his sister died. He had left room beside the printed depth to enter his own.\n\nThe clerk asked whether the unused sheets should go back into stores. The elders told him to bind them with the others. If another traveler comes home by any of those routes, there will be room to set down what became of him."
 kinone_explorer.36.a:0 "Close the account."
 kinone_explorer.37.t:0 "A Copy from the Peaceful Valley"
 kinone_explorer.37.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the elders of the #G Peaceful Valley#! have sent us a copy of the #T Atlas of the Long Way Home#!. [SCOPE.sChar('kinone_explorer').GetName|Y] named the people who helped him in our harbor. Our pilots have found a few of their own remarks in the margins, including a warning the harbor master has been telling them to leave off his charts for years.\n\nThe harbor master has asked for the first reading. He says he wishes to see how the warning was worded before the pilots begin quoting it to him."
 kinone_explorer.37.a:0 "Give the pilots a place to read it."
 kinone_explorer_atlas:0 "Atlas of the Long Way Home"
 kinone_explorer_atlas_desc:0 "The charts of #Y Mvu-Kou#!, bound with the corrections, the names of his pilots, and both receipts for a bridge in the #G Peaceful Valley#!."
 kinone_explorer_road:0 "A Surveyed Route"
 kinone_explorer_pilotage:0 "New Pilotage Notes"
 kinone_explorer_fair_copy:0 "A Fair Copy"
 kinone_explorer_public_atlas:0 "A Public Edition of the Atlas"
 kinone_explorer_clan_archive:0 "The Atlas in the Clan Archive"
 kinone_explorer_gift_edition:0 "An Edition for Our Hosts"
