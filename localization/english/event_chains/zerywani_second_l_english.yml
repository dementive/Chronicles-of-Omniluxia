 z2_march_incumbent_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the struggle for the southern gathering is over. [SCOPE.sChar('z2_founder').GetName|Y] has defeated the veteran's claimant and claimed the horsemen's oaths through victory. The cavalry now gathers for the march upon [SCOPE.sProvince('target_province').GetName|G].\n\nThose who hoped the rival claimants would destroy the gathering have been disappointed. Its surviving ruler has taken up the promise of Jelenia, and the frontier must prepare for war."
