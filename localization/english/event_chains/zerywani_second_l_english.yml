l_english:

 ZJ2:0 "Jelenian Dominion"
 ZJ2_ADJ:0 "Jelenian"
 z2_army_name:0 "Riders of the Celestial Deer"
 z2_remnant_name:0 "Companions of the Broken Banner"
 z2_warning_title:0 "The Veterans' Sons"
 z2_warning_victory_desc:0 "My [ROOT.GetCountry.GetRulerTitle], there is a name being repeated in reports from the southern tribes: [SCOPE.sChar('z2_founder').GetName|Y]. A veteran's son from [SCOPE.sCountry('z2_host').GetName|T], he has attracted an audience among men who grew up hearing of the #T First Gathering#! and the capital their fathers conquered.\n\nHis account of that campaign has proved particularly popular with the younger riders. Their fathers took a wealthy city, he says, then allowed the chiefs to quarrel over its treasures. What might they have achieved under a ruler strong enough to keep them together? Priests among his followers recall #T Jelenia#! and the old promise that the united #Y Noble Horsemen#! would conquer all they wished. The young man appears quite willing to suggest who should lead them.\n\nSome of our advisers dismiss him as another ambitious tribesman making grand claims beside a campfire. Our merchants are less confident. Men have begun bringing their sons to hear him speak, and a growing number arrive with horses to offer as well."
 z2_warning_withdrawal_desc:0 "My [ROOT.GetCountry.GetRulerTitle], a curious report from [SCOPE.sCountry('z2_host').GetName|T] has reached [ROOT.GetCountry.GetCapital.GetName|G]. A veteran's son named [SCOPE.sChar('z2_founder').GetName|Y] has been gathering listeners among the southern chiefs. He speaks often of the capital their fathers reached during the #T First Gathering#!, and rather less kindly of the men who failed to keep it.\n\nAccording to those who have heard him, the next generation must learn the roads, secure its provisions, and bind its chiefs to promises they cannot abandon at the first dispute over plunder. He invokes #T Jelenia#! and speaks of a city where the horsemen's children might grow up within walls their fathers merely passed through. The younger riders seem especially taken with this last promise.\n\nOur court has heard many tribal boasts before. Nevertheless, the men repeating this one are beginning to purchase iron, gather spare horses, and ask merchants very precise questions about the northern roads. It would be prudent to learn how far this young man's ambitions extend."
 z2_warning_defeat_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the southern tribes have found a new speaker for an old grievance. His name is [SCOPE.sChar('z2_founder').GetName|Y], a veteran's son gathering followers in [SCOPE.sCountry('z2_host').GetName|T]. He was raised on accounts of the #T First Gathering#!, and appears to have listened rather carefully to his father's complaints.\n\nAt the gatherings he names the chiefs who withheld their riders, the quarrels that delayed the march, and the comrades whose families received nothing but news of their deaths. Such stories seldom fail to draw an audience. His answer is that the next expedition must obey one command, with oaths strong enough to silence the jealousies of the chiefs. Priests who favor him speak of #T Jelenia#! and the promised victories of the united #Y Noble Horsemen#!.\n\nSome at court consider him a useful distraction for the tribes. Others point out that a man promising to settle every father's grievance may soon find a great many sons willing to follow him. We would do well to discover which opinion is correct."
 z2_warning.a:0 "Find out who is bringing him horses."
 z2_gathering_title:0 "The Chiefs Gather"
 z2_gathering_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the merchants returning from the south no longer speak of a few riders listening to an ambitious young man. They describe entire households on the roads: chiefs with their sons, veterans leading spare horses, and wagons carrying enough grain to sustain a lengthy march. Smiths who once struggled to sell a spearhead now complain that they cannot obtain enough iron.\n\nThe gatherings have become occasions for exchanging gifts and promises. Men who inherited their fathers' feuds drink together while priests recount #T Jelenia#!'s promise to the united #Y horsemen#!. There are still arguments, as anyone familiar with these chiefs would expect, but those arguments increasingly concern who will command the riders and which roads they will take.\n\nOur frontier officers have requested funds for the garrisons and the next muster. Several councillors consider this an unnecessary expense. The officers invite them to visit the southern roads and explain their confidence to the men who will have to defend them."
 z2_gathering.a:0 "Give the frontier officers their gold."
 z2_gathering.b:0 "Keep watching those roads."
 z2_oath_title:0 "An Oath Beneath the Deer"
 z2_oath_desc:0 "My [ROOT.GetCountry.GetRulerTitle], a rider bearing the emblem of the #T Celestial Deer#! has been admitted to our hall. He speaks for [SCOPE.sChar('z2_founder').GetName|Y], who offers our household a place among his sworn chiefs. Our ruler will keep his lands and his people, but our warriors must answer when the gathering is called to war. Feuds with other sworn chiefs must be laid aside.\n\nThe envoy recalls the #T First Gathering#! and the disputes that followed its march. His master has heard those stories from his own father, he tells us, and has no intention of permitting the same quarrels to decide his generation's fortunes. There will be one authority over the gathering, however many chiefs ride beneath its banner.\n\nSome of our warriors welcome the prospect of fighting beside so many neighbors. Others look to [ROOT.GetCountry.GetRuler.GetName|Y] and ask whether a chief who obeys another man's summons can still call his riders his own. The envoy awaits our answer."
 z2_oath.a:0 "We shall ride beneath the #T Celestial Deer#!."
 z2_oath.b:0 "Our riders answer to [ROOT.GetCountry.GetRuler.GetName|Y]!"
 z2_oath_tt:0 "Become a #T Sworn Chiefdom#!. Keep your ruler and territory, pay tribute, and join the founder's wars. Independent diplomacy and internal wars are restricted; your country cannot be integrated. The oath ends when the founder dies or loses his supremacy."
 z2_march_title:0 "The Banner of Jelenia"
 z2_march_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the southern gathering has begun its march! Reports reaching [ROOT.GetCountry.GetCapital.GetName|G] describe columns of #Y horsemen#! stretching along roads that once carried little more than herds and merchants. Chiefs who fought one another over pasture now send their riders beneath the banner of #T Jelenia#!.\n\nAt their head is [SCOPE.sChar('z2_founder').GetName|Y], the veteran's son whose speeches attracted so much attention. He has taken power in [SCOPE.sCountry('z2_host').GetName|T] and bound the chiefs to his service, leaving them their households and homelands in return for obedience in war. Those at court who predicted another short-lived gathering are finding fewer opportunities to repeat their opinion.\n\nThe riders speak openly of [SCOPE.sProvince('target_province').GetName|G]. Its wealth has become a promise passed from campfire to campfire, and their leader intends to make it the seat of his own realm. The fathers returned with stories of distant cities. #R Their sons are bringing their households to one#!."
 z2_march.a:0 "Send these reports to every commander!"
 z2_prevented_title:0 "The Gathering Breaks Apart"
 z2_prevented_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the latest accounts from the south are considerably quieter than the last. The gathering that promised to carry the banner of #T Jelenia#! beyond the frontier has broken apart. Chiefs are taking their riders home, merchants are finding fewer buyers for spare horses, and the promised march has become another subject for argument in the winter halls.\n\nWhatever following the veteran's son once commanded, the circumstances that sustained it have failed him. The scattered tribes can no longer furnish the united host his promises required. Our frontier officers advise continued vigilance, though they appear rather relieved that their preparations will not immediately be tested.\n\nThere are already councillors willing to explain why this outcome was inevitable. Some of them were, until recently, equally certain that a vast army was about to descend upon us. For the moment, we may be content that the riders are turning toward their own hearths."
 z2_prevented.a:0 "Let the chiefs argue at home."
 z2_envoy_title:0 "The Price of the Banner"
 z2_envoy_desc:0 "My [ROOT.GetCountry.GetRulerTitle], an envoy of [SCOPE.sChar('z2_founder').GetName|Y] has arrived at [ROOT.GetCountry.GetCapital.GetName|G]. He carries the emblem of the #T Celestial Deer#! and an account of his master's demands, which he has delivered with remarkably little concern for how they might be received.\n\nOur ruler may keep his court and his lands, he says, if we acknowledge his master's supremacy, furnish tribute, and serve in his wars. The chosen seat of [SCOPE.sProvince('target_province').GetName|G], should it lie within our realm, must be surrendered with neighboring land for the horsemen's settlement. Alternatively, a substantial payment will purchase three years of peace from his master's own campaigns. He is careful to add that such generosity will be offered only once.\n\nOur officers favor sending him away with a firm refusal. The men responsible for our storehouses would first like to know how many riders accompany his master. The envoy seems quite prepared to wait while we settle the matter. He has already asked where we keep the best pasture."
 z2_envoy.a:0 "We will acknowledge his supremacy."
 z2_envoy.b:0 "Give him the gold. We need those three years."
 z2_envoy.c:0 "Tell him our gates are #R closed#!."
 z2_tributary_tt:0 "Become a #T Banner Tributary#!, paying tribute and joining the founder's wars. If the chosen capital lies within your realm, cede that city and up to two adjacent holdings directly to the founder. #R A country left with no territory will cease to exist.#!"
 z2_reprieve_tt:0 "Pay #Y 300 gold#! for #G three years#! of reprieve from the founder's own campaigns. This payment can be made only once. It does not protect allies from wars directed against them."
 z2_settlement_title:0 "A Throne Beyond the Frontier"
 z2_settlement_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the reports are confirmed: [SCOPE.sProvince('target_province').GetName|G] has become the seat of a new realm! The horsemen have held the city and its surrounding foothold for half a year, and wagons carrying the households of the sworn chiefs are now passing through its gates.\n\n[SCOPE.sChar('z2_founder').GetName|Y] has named his realm the #T Jelenian Dominion#!. From his new capital he receives the tribute of conquered rulers and the service of chiefs who still govern their own homelands. Priests attending his court present this achievement as the fulfillment of #T Jelenia#!'s promise to the united #Y Noble Horsemen#!. The city's former masters will doubtless have their own account of the matter.\n\nThose who remember the #T First Gathering#! are struck by how far the son has carried his father's ambitions. The veterans brought home silver and stories of the civilized cities. Their children are being given houses within one, and the man who led them there now receives foreign envoys from a throne."
 z2_settlement.a:0 "So this is the realm the son promised them."
 z2_collapse_title:0 "The Broken Banner"
 z2_collapse_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the oaths beneath the banner of #T Jelenia#! have broken. The founder's personal supremacy has ended, and chiefs who answered readily enough to his summons are far less willing to obey those who would inherit his authority. Messengers seeking their riders are returning with excuses, demands, or no answer at all.\n\nThe great expeditionary hosts are dispersing, and the founder's offensive campaigns are being abandoned. Some chiefs are already leading their households home, content to keep the wealth and lands their service brought them. Others remain near their former companions, gathering supporters and discussing who has the strongest claim to the conquered capital. These discussions are seldom improved by the presence of armed men.\n\nThe founder's realm and its conquests survive, but the ruler who could command all these chiefs is gone from power. The banners that once shared a road are separating. #R Some may soon meet again on opposite sides of a battlefield#!."
 z2_collapse.a:0 "Every chief remembers a different promise."
 z2_destroyed_title:0 "The Last Riders Scatter"
 z2_destroyed_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the founder's realm has been destroyed. The authority that bound its sworn chiefs and tributary rulers has disappeared, leaving each to consider how much of the gathering's conquests he can keep. Riders who once carried the same banner are turning toward their own households or seeking a new chief's protection.\n\nFor some of the survivors, the prospect of reaching home is sufficient. Others still have companions, captured wealth, and ambitions that will not be satisfied by returning to their old pastures. Smaller chiefs are already listening to offers from stronger neighbors, and the fate of many conquered towns remains uncertain.\n\nThose towns will remember the gathering for rather different reasons. Damaged walls, empty houses, and families carried into slavery will outlast the army that caused them. Whatever borders the successors draw, the lands through which the #Y horsemen#! passed will bear the marks of their coming for many years."
 z2_successor_title:0 "The Inheritance of the Riders"
 z2_successor_desc:0 "My [ROOT.GetCountry.GetRulerTitle], our riders are awaiting your command. The founder's supremacy has ended, and the oath that brought our warriors beneath the banner of #T Jelenia#! no longer binds us. Chiefs who once received orders beside our own have begun sending messengers to ask what we intend to do.\n\nSome of our companions would return home and secure the lands already in our hands. They have served through enough campaigns, they say, and their households have waited long enough. Others recall the men we furnished, the comrades we buried, and the wealth gathered in the founder's capital. They consider it a curious arrangement that his successor should keep so much of what our warriors helped to win.\n\nBoth parties have found willing listeners. Our neighbors will soon learn whether [ROOT.GetCountry.GetRuler.GetName|Y] intends to be remembered as a chief who brought his people home or one who pressed their claim to the gathering's inheritance."
 z2_successor.a:0 "Bring our riders home. We have lands to secure."
 z2_successor.b:0 "We paid for that capital in #R blood#!."
 z2_oath_subject:0 "Sworn Chiefdom"
 z2_oath_subject_title:0 "Sworn Chiefdom"
 z2_oath_subject_title_plural:0 "Sworn Chiefdoms"
 z2_oath_subject_desc:0 "A chief who has sworn service beneath the banner of #T Jelenia#!. His household and lands remain his own, while his riders answer the founder's summons to war."
 z2_tributary_subject:0 "Banner Tributary"
 z2_tributary_subject_title:0 "Banner Tributary"
 z2_tributary_subject_title_plural:0 "Banner Tributaries"
 z2_tributary_subject_desc:0 "A realm that has acknowledged the supremacy of the #T Banner of Jelenia#!, preserving its local court in return for tribute and military service."
 z2_successor_subject:0 "Successor Chiefdom"
 z2_successor_subject_title:0 "Successor Chiefdom"
 z2_successor_subject_title_plural:0 "Successor Chiefdoms"
 z2_successor_subject_desc:0 "A chiefdom gathered beneath a stronger neighbor after the great oaths broke. Its ruler seeks security among the companions and rivals of the founder's generation."
 z2_banner_conquest:0 "Conquest Beneath the Deer"
 z2_succession_conquest:0 "War of the Broken Banner"
 z2_banner_ascendant:0 "The Banner Ascendant"
 z2_riders:0 "Riders of the Celestial Deer"
 z2_lesson_rule:0 "The Fathers' Unfinished Realm"
 z2_lesson_roads:0 "Hold What the Fathers Reached"
 z2_lesson_command:0 "One Command, One Generation"
