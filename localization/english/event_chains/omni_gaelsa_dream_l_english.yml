l_english:
 omni_gaelsa_dream.1.t:0 "The Spring That Would Not Come"
 omni_gaelsa_dream.1.desc:0 "Gaelsa dreams she is kneeling at the #G $wonder_root_of_first_spring$#!. She knows each hollow in its bark by touch. Tonight a strip comes away in her hand, and beneath it the wood is grey. Beyond the grove, the hearths of Wenelru have gone cold. At one door a bowl of seed still waits to be carried to the fields. Nothing has sprouted.\n\nA woman kneels beside her and presses the bark back into place. Gaelsa knows her then for [GetDeityDefinition('omen_ydes').GetName|Y], the Blood Goddess.\n\n\"I have seen the last spring of Wenelru,\" the goddess says. \"The Root dies with it. Take my gift, Seedwatcher, and you will live to turn that fate aside. Give me your last breath, and you will never need another.\"\n\nGaelsa looks down at the hand the goddess holds out to her. It is as still as the hand of a corpse. She thinks of all the years she has spent teaching her people to trust that spring will come."
 omni_gaelsa_dream.1.a:0 "Take my breath. Leave them their spring."
 omni_gaelsa_dream.1.a.tt:0 "Gaelsa becomes a #Y $lich_trait$#! and binds her soul to a phylactery in the capital."
 omni_gaelsa_dream.1.b:0 "I will face the spring with my people."
