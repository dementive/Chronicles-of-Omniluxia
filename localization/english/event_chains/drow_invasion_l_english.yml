l_english:

 drow_invasion_1_title:0 "The Underdark Empties"
 drow_invasion_1_desc:0 "For generations our kin warred amongst ourselves beneath the stone, but that is over now - after endless eons of battling in the dark, our ancestral home answers to us alone and our attention has turned elsewhere. The surface-dwellers above have grown fat and complacent, never once looking down at the darkness beneath their feet...fools!\n\nNow we rise. Two great hosts climb from the depths: one north, into the soft lands of #Y Norrfalie#!, and one west, into the halls of the #Y Werhenlanders#!. Let our people come forth from the darkness that has sheltered them, and let those living on the surface learn what it means to be prey!"
 drow_invasion_1_tooltip:0 "The #R Drow of [ROOT.GetAdjective]#! emerge from the #Y Western Wild Northlands#! and launch two massive invasions: one north against [scope:drow_invasion_north_target.GetName], and one west against [scope:drow_invasion_west_target.GetName]."
 drow_invasion_1.a:0 "The dark below rises to claim the light above."

 drow_invasion_2_title:0 "Shadows From Below"
 drow_invasion_2_desc:0 "Villagers along our southern border speak in terror of pale, black-armored warriors pouring up from cave mouths in numbers beyond counting. Yet those that live to see the Drow and tell the tale consider themselves fortunate, for the grim invaders have shown no mercy to any of our people. This is no raid - it is an invasion, and [scope:drow_invasion_leader_scope.GetName] means to break us."
 drow_invasion_2.a:0 "By the gods, why is this happening to me?"

 drow_invasion_3_title:0 "Shadows From Below"
 drow_invasion_3_desc:0 "My [ROOT.GetCountry.GetRulerTitle], there is dire news from the borderlands. Refugees flee our eastern holdings, babbling of #R Drow#! warbands that seem to rise out of the very earth itself. We have received conflicting reports about the size of this horde, but one thing is known; its size is considerable - this is no mere raiding party. It seems that [scope:drow_invasion_leader_scope.GetName] has set its sights on our lands, and we are not ready."
 drow_invasion_3.a:0 "To arms, men, to arms!"

 drow_invasion_7_title:0 "A Dark Reckoning"
 drow_invasion_7_double_victory_desc:0 "Both hosts have triumphed. The pathetic armies sent against the #R Drow#! crumpled before the might of the Bloodstained invaders and were scattered to the winds. #Y Norrfalie#! and the #Y Werhenlander#! halls alike now answer to the dark below, their capitals broken and their peoples driven into the depths as slaves or put to the sword.\n\nIn the histories that will be written one day far in the future, this very moment shall be remembered as the time when everything changed - there will be a period before the Drow, and after."
 drow_invasion_7_partial_victory_desc:0 "One of our two great hosts has broken its enemy - something that shall be celebrated forevermore. And although the other campaign ended less cleanly than we would have liked, we have carved out a lasting wound into the surface world, and our reach is longer than it has ever been. We have not lost, but have been merely slowed down."
 drow_invasion_7_defeat_desc:0 "Both campaigns have ended without the total victory we sough, and tens of thousands of #R Drow#! warriors fell to the swords of the Norrfalien and Werhenlander armies. Our broken soldiers return - battered, diminished, all but destroyed - to the depths that birthed them. Our people waited millenia for this moment, and in an instant, it was gone."
 drow_invasion_7.a:0 "This entire campaign was a disaster..."

 drow_invasion_conquest:0 "Drow Invasion"

 drow_invasion_on_the_march:0 "Drow Hosts on the March"
 drow_invasion_under_invasion_modifier:0 "Besieged by the Drow"
