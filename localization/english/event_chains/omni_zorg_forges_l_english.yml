l_english:
 omni_zorg_last_doctrine_inv:0 "The Last Doctrine"
 omni_zorg_last_doctrine_inv_desc:0 "The first suit was built to carry a soldier through the dark between the stars. The armorers of the #Y Zorg#! kept its design long after they had found a world with air enough to breathe. Their officers say a recruit is ready for the #T Last Doctrine#! when he can hear his own heart beating in the helmet and still stand his ground."
 omni_zorg_last_doctrine:0 "The Last Doctrine"
 desc_omni_zorg_last_doctrine:0 "The #Y Zorg#! drill their heavy infantry in sealed armor until they can hold formation by sound alone."
 omni_zorg_void_forge:0 "Void Forge"
 desc_omni_zorg_void_forge:0 "The #Y Zorg#! muster #T Void Legions#! here during war. Enemy occupation destroys the Forge and cancels any legion mustering here."
 omni_zorg_forge.1.t:0 "A Void Legion Musters"
 omni_zorg_forge.1.desc:0 "My liege, a drover out of [omni_zorg_forge_site.GetName|G] asks that we keep his name out of the dispatches. For three nights he took cattle past the #T Void Forge#!, and on the fourth, the guards waved him through without counting his herd. They were standing in the road with their heads bowed while officers of the #Y Zorg#! read names from a sheet of hammered copper.\n\nOur marshal thinks the names are those of a new #T Void Legion#!. He has seen what happens when a #Y Void Marshal#! takes the field. Men who have held a shield wall all their lives hear their names called from behind it and turn just as the #Y Zorg#! strike. The drover knows a road up to the works that the officers have left unguarded. He will show it to our scouts if they can see his family across the border first."
 omni_zorg_forge.1.a:0 "See that his family is brought across."
 omni_zorg_forge.2.t:0 "The Forge Falls Silent"
 omni_zorg_forge.2.desc:0 "My liege, the troops of [omni_zorg_forge_captor.GetName|T] have taken the #T Void Forge#! at [omni_zorg_forge_site.GetName|G]. Our scouts say that the #Y Zorg#! were still bringing suits of armor up from the lower halls when the gates gave way. In one chamber they found a row of iron hands, each opening and closing as though it were waiting for a sword.\n\nThe smiths sent to examine the works could make little of them. One noticed, however, that frost had gathered around a copper pipe, though the floor beneath it was hot enough to scorch his boots. The captain had the pipe cut. For a moment every bell in the town rang, including the one that fell from the temple tower two winters ago. Then the iron hands lay still.\n\nThe marshal asks that we send word to the villages along the road. They have been hiding their children in the hills since the first #Y Zorg#! patrol passed through. They can bring them home tonight."
 omni_zorg_forge.2.a:0 "Let them hear it from our own riders."
 omni_zorg_forge.3.t:0 "The Last Forge Has Fallen"
 omni_zorg_forge.3.desc:0 "My liege, there is news from [omni_zorg_forge_site.GetName|G]. The last #T Void Forge#! has fallen. The officer who brought us the dispatch also brought a helmet from the works. Our armorers passed it from hand to hand until one of them noticed that it had never been given eyeholes.\n\nThe marshal says the #Y Zorg#! still have soldiers in the field, and that some will fight all the harder when they hear what has happened. Even so, he has asked for the names of the dead from every company that took a Forge. There is room for them above the gate, he says, if we take down the old toll schedule."
 omni_zorg_forge.3.a:0 "Give the stonecutters the list."
 omni_zorg_forge_destroyed_tt:0 "This #T Void Forge#! is permanently destroyed. Any legion mustering here has been cancelled."
 omni_zorg_last_forge_destroyed_tt:0 "Zorg has lost its last active #T Void Forge#!. Surviving legions remain in the field, and Zorg can still build new Forges."
 omni_zorg_atlas_forge_tooltip:0 "#T Void Forge#!\nThe #Y Zorg#! muster Void Legions here during war. Occupy this territory to destroy the Forge."
 omni_zorg_forge_under_construction:0 "Void Forge Under Construction"
 desc_omni_zorg_forge_under_construction:0 "The #Y Zorg#! are building a new #T Void Forge#! here. Take control of the territory to destroy the works."
 omni_zorg_void_marshal:0 "Void Marshal"
 desc_omni_zorg_void_marshal:0 "This commander has been schooled in the #T Fear Hex#! and #T Arcane Aegis#! and can draw on a deep reserve of mana."
 omni_zorg_forge.4.t:0 "A New Forge Rises"
 omni_zorg_forge.4.desc:0 "My liege, a mason from [omni_zorg_forge_site.GetName|G] says the #Y Zorg#! have bought every block of stone in the town and pulled down the market wall for more. He was ordered to lay the foundation with the finished faces turned inward. When he asked why, the foreman told him the walls would have to keep something in.\n\nOur marshal gives the works at least #Y 180 days#! before they can open as a #T Void Forge#!. The mason can show us where the crews cross the river. He asks only that we get there before they finish the bridge."
 omni_zorg_forge.4.a:0 "Have the scouts follow the mason."
 omni_zorg_forge.5.t:0 "The Unfinished Forge"
 omni_zorg_forge.5.desc:0 "My liege, the #Y Zorg#! have lost the works at [omni_zorg_forge_site.GetName|G]. The men who went down into the foundations found copper pipes laid out in pairs, with the names of towns scratched into the fittings. One of the names was their own.\n\nThe captain had the pipes hauled out and cut for scrap. The masons have already asked whether they might take their stone back. There is a market wall, they say, that could do with putting up again."
 omni_zorg_forge.5.a:0 "Give the masons back their stone."
 omni_zorg_forge_report:0 "Reports on the Zorg"
 omni_zorg_forge_report_desc:0 "The #Y Zorg#! build #T Void Forges#! to muster #T Void Legions#! during war. Each active Forge can muster about once every #Y two years#! while the Zorg are at war. Defenders receive at least #Y 90 days#! of warning before a legion deploys. Occupying a Forge destroys it and cancels its muster.\n\nZorg can start a new Forge roughly every #Y five years#! during war, even after losing its last one. A new site takes at least #Y 180 days#! to finish. Occupy it before then to destroy the works.\n\nEach Void Legion is led by a #Y Void Marshal#! trained in #T Fear Hex#! and #T Arcane Aegis#!. Hover over this decision to highlight every known site on the map."
 omni_zorg_forge_report_tt:0 "Known sites are listed below and highlighted on the map."
 omni_zorg_forge_active_location_tt:0 "#T Active Forge#! in [omni_zorg_forge_site.GetName|G] ([omni_zorg_forge_site.GetState.GetName|Y])"
 omni_zorg_forge_mustering_location_tt:0 "#T Mustering a Void Legion#! in [omni_zorg_forge_site.GetName|G] ([omni_zorg_forge_site.GetState.GetName|Y])"
 omni_zorg_forge_project_location_tt:0 "#T Forge under construction#! in [omni_zorg_forge_site.GetName|G] ([omni_zorg_forge_site.GetState.GetName|Y])"
 omni_zorg_forge_no_locations_tt:0 "Our scouts know of no active Forges or construction sites."
