l_english:
 # --- War goal, army, opinions ---
 goblin_root_conquest:0 "Goblin March on the Root"
 war_goal_goblin_root_conquest:0 "Goblin March on the Root"
 goblin_invasion_host_name:0 "The Host of the Passes"
 goblin_invasion_silver_for_the_root:0 "Silver for the Root"
 goblin_invasion_open_passes:0 "Opened the Foothill Roads"
 goblin_invasion_opened_passes_to_goblins:0 "Opened Roads to the Goblins"

 # --- Modifiers ---
 goblin_invasion_on_the_march:0 "The Host of the Passes"
 desc_goblin_invasion_on_the_march:0 "Every clan in the passes has sent its spears down the foothill road, and the families who lost their valleys to elven hearths walk at the front."
 goblin_invasion_under_invasion:0 "Goblins in the Forest"
 goblin_invasion_venerurich_braced:0 "Venerurich Braced"
 desc_goblin_invasion_venerurich_braced:0 "Timber for the walls, grain in the cellars, and the hearth registers wrapped in oilcloth in case the walls are not enough."
 goblin_invasion_aneic_relief:0 "Silver from the Aneic Courts"
 goblin_invasion_rallied_levies:0 "Levies Called to the Root"
 goblin_root_felled_pride:0 "Fellers of the Root"
 desc_goblin_root_felled_pride:0 "The clans burned the tree the elves named their valleys under, and every chief in the passes can say which family carried the oil."
 goblin_invasion_broken_host:0 "The Host Came Home"
 goblin_invasion_root_held:0 "The Root Held"
 root_of_first_spring_ashes_mod:0 "Ashes of the First Spring"
 desc_root_of_first_spring_ashes_mod:0 "The stump of the Root still stands over Venerurich, black to the height of a man on a ladder. Nobody brings soil to it, and the keepers who once lived under it have gone into the forest with their registers."
 root_of_first_spring_ashes_country:0 "The Covenant Broken"
 desc_root_of_first_spring_ashes_country:0 "The great work at Venerurich still stands on the rolls, but no clan carries soil to a burned tree, and the Covenant of the First Spring is kept by nobody."
 root_of_first_spring_ashes_state:0 "No Pilgrims on the Road"
 root_of_first_spring_mourning:0 "Mourning the Root"
 desc_root_of_first_spring_mourning:0 "The Root of the First Spring has burned. The shrines are full, the fields are emptying, and the priests have stopped promising in the market square that #T Mother Cafea#! still hears an unnamed hearth."

 # --- Decision ---
 omni_fell_root_of_first_spring:0 "Fell the Root of the First Spring"
 omni_fell_root_of_first_spring_desc:0 "#Y $wonder_root_of_first_spring$#! stands at #G $PROV2356$#!, and the families of every Aneic hearth still carry soil to it to be named. We hold the city. Axes and lamp oil are cheap, and the elves have never forgiven anything they could write down."
 omni_fell_root_not_aneic_tt:0 "Our realm does not follow the #T Aneic#! faith"
 omni_fell_root_control_tt:0 "We control #G $PROV2356$#! and it is not under siege"
 omni_fell_root_effect_tt:0 "#Y $wonder_root_of_first_spring$#! is felled for good.\nEvery #T Aneic#! realm loses #R 20#! stability and gains #Y Mourning the Root#! for #Y 10#! years (#R -10%#! happiness of its primary culture, #R -50%#! omen power).\nWhoever holds #G $PROV2356$#! no longer benefits from the #Y Covenant of the First Spring#!.\nThe rites of the Wenelru can no longer be performed."
 omni_wenelru_root_felled_tt:0 "#Y $wonder_root_of_first_spring$#! has not been felled"

 # --- .1 Warning: keeper of the Root ---
 goblin_invasion.1.t:0 "Cookfires in the Passes"
 goblin_invasion.1.desc:0 "The herders who winter their goats below #G Bad-Linlntho#! came down the foothill road a month early, driving the flocks ahead of them and leaving the cheese behind, which the keepers at #G $PROV2356$#! understood to be the alarming part. By the time our watch on the forest edge had counted the cookfires in the upper valleys, the herders had explained that the goblins of [SCOPE.sCountry('gi_leader').GetName|Y] were not raiding this year, since raiders take goats, and these had let the goats go.\n\nThe goblins have kept a tally of their own. Every bowl of soil carried to #Y $wonder_root_of_first_spring$#! has meant another valley cleared for a hearth, and their elders can name each one along with the grandmother who used to forage there. The captains of the watch reckon on two months before the host comes down, and they want to know whether to spend them calling the families in from the foothill hearths, which saves the families, or buying timber and grain for the walls of Venerurich, which saves the Root for as long as the walls do."
 goblin_invasion.1.a:0 "Call the hearths in behind the levies."
 goblin_invasion.1.b:0 "Buy timber and grain for the walls."
 goblin_invasion.1.c:0 "The herders have been wrong before."

 # --- .3 Launch: the goblins ---
 goblin_invasion.3.t:0 "Down from the Passes"
 goblin_invasion.3.desc:0 "The clans of [ROOT.GetCountry.GetName|Y] spent the winter arguing over the order of march, as clans do, until the matter was settled by the families whose foraging valleys now grow elven barley, who announced that they would walk at the front whether anyone else came or not. Everyone else came. The host went down out of the western foothills in a column long enough that the last of it was still packing when the first had reached the edge of the trees.\n\nThe chiefs have given the host a single errand, which is unusual and has been remarked upon. Somewhere past the first valleys stands #Y $wonder_root_of_first_spring$#! at #G $PROV2356$#!, where [SCOPE.sCountry('gi_keeper').GetName|Y] send their settlers to be named before they clear another valley, and the chiefs have said plainly that once it is gone the elves can name whomever they like. The quartermasters ask whether the war chest should go to the host now, while the men are eager, or stay in the passes for the second year that the old chiefs say these things always take."
 goblin_invasion.3.a:0 "Take the axes to the Root."
 goblin_invasion.3.a.tt:0 "The host marches on #G $PROV2356$#!. If we hold the city, #Y $wonder_root_of_first_spring$#! burns."
 goblin_invasion.3.b:0 "Open the war chest to the host."

 # --- .4 Launch: the realm holding Venerurich / its overlord ---
 goblin_invasion.4.t:0 "The Host Is in the Forest"
 goblin_invasion.4.desc_keeper:0 "Our scouts found the goblin host where the herders said it would be, coming down out of the western foothills along the timber road and taking the long way around the first village, since the village had nothing they wanted. It has brought engineers with ropes, ladders, and a ram slung between two pairs of cart wheels, which the scouts took some time to describe, because nobody had expected goblins to bring anything of the kind.\n\n[SCOPE.sCountry('gi_leader').GetName|Y] have sent no envoys and no terms, and none of the captains believes they mean to. Their quarrel is with #Y $wonder_root_of_first_spring$#! at #G $PROV2356$#!, and the keepers have already begun wrapping the hearth registers in oilcloth in case the walls do not hold. The captains would like every levy we can raise, and the treasurer would like it noted that levies who are paid tend to arrive sooner than levies who are only asked."
 goblin_invasion.4.desc_overlord:0 "Riders from [SCOPE.sCountry('gi_keeper').GetName|Y] reached us with word that the goblins of [SCOPE.sCountry('gi_leader').GetName|Y] have come down out of the western foothills into the forest, and that they have no interest in our subjects' granaries or herds. They are marching on #G $PROV2356$#!, where #Y $wonder_root_of_first_spring$#! stands, and since a subject cannot answer for a war on its own account, the goblins have sent their declaration to us.\n\nThe envoys from the forest are polite about it, although they have mentioned twice that the Root has stood longer than our dynasty. Our generals point out that the forest is a long way to march for a tree. The envoys point out, with less politeness, that the goblins seem to have managed it."
 goblin_invasion.4.a:0 "Raise every levy for the Root."
 goblin_invasion.4.b:0 "Pay the wardens and fill the ranks."
 goblin_invasion.4.c:0 "Let the walls do their work."

 # --- .5 Launch: Aneic onlookers ---
 goblin_invasion.5.t:0 "The Goblins March on the Root"
 goblin_invasion.5.desc:0 "Pilgrims on the road back from #G $PROV2356$#! have stopped bringing seedlings and started bringing news. The goblins of [SCOPE.sCountry('gi_leader').GetName|Y] are in the forest of the World's Lungs with a host larger than anyone remembers coming out of the passes, and they are not stopping to forage or take captives along the way, which is how the pilgrims knew it was not a raid.\n\nOur own families carried their first leaves home from #Y $wonder_root_of_first_spring$#!, and the priests have been asked at every shrine whether the Root can burn. They say it cannot, in the voice priests use when they would rather not be asked again. The keepers in the service of [SCOPE.sCountry('gi_keeper').GetName|Y] have written to every Aneic court asking for silver to hire spears, and they have added, in a different hand, that they will remember who sent it."
 goblin_invasion.5.a:0 "Send silver to the keepers."
 goblin_invasion.5.b:0 "Pray, and keep our silver close."

 # --- .6 Launch: other onlookers ---
 goblin_invasion.6.t:0 "Goblins in the World's Lungs"
 goblin_invasion.6.desc:0 "Traders who work the foothill roads report that the goblins of [SCOPE.sCountry('gi_leader').GetName|Y] have marched into the forest of the World's Lungs against [SCOPE.sCountry('gi_keeper').GetName|Y]. They seem to care nothing for towns or tolls. They are going for #Y $wonder_root_of_first_spring$#! at #G $PROV2356$#!, a tree the wood elves have carried soil to for longer than anyone has kept accounts, and which most of our court knew only as the place where the elves keep their family registers.\n\nNone of our own interests stand in that forest. Our merchants would like it known that the goblin chiefs have begun asking which roads through the foothills are open to them, and that a friendly answer now might be remembered when the war is over. The elves would remember it too."
 goblin_invasion.6.a:0 "It is not our forest."
 goblin_invasion.6.b:0 "Tell the goblins our roads are open."

 # --- .20 The Root falls: the burner ---
 goblin_invasion.20.t:0 "The Root Burns"
 goblin_invasion.20.desc_goblin:0 "The host took #G $PROV2356$#! at dusk, and the chiefs saw no reason to wait for morning. Axes were put to #Y $wonder_root_of_first_spring$#! by the families whose valleys had gone under the plough first, while the rest carried lamp oil up from the stores the keepers had laid in for a siege they did not get to finish. By midnight the fire had climbed into the canopy, and the keepers who stayed to argue with it had been walked down the road with their registers and nothing else.\n\nThe elves will be counting the loss for years, as they count everything. Our clans would like to know how many of the cleared valleys will go back to the forest now that nobody comes to name new families for them, and the oldest chiefs say they will find out, since none of them expects to see another bowl of soil carried up the foothill road."
 goblin_invasion.20.desc_other:0 "Our soldiers held #G $PROV2356$#! long enough to bring up axes and lamp oil, and the order to burn #Y $wonder_root_of_first_spring$#! was carried out by men who were mostly relieved to have an order that did not involve another march. The keepers asked to stay and watch, and they were allowed to, which our officers later decided had been a mistake, since their singing kept the camp awake until the fire reached the canopy.\n\nEvery Aneic court will know of it by spring. The priests who served under the Root have gone east with their registers, and the clerks who count the province's rents say Venerurich will pay less without the Root than it did with it. The court heard the clerks out and replied that this had been understood when the order was given."
 goblin_invasion.20.a:0 "Let it burn down to the roots."
 goblin_invasion.20.a.tt:0 "#Y $wonder_root_of_first_spring$#! is gone. Every #T Aneic#! realm loses #R 20#! stability and mourns for #Y 10#! years. Whoever holds #G $PROV2356$#! no longer benefits from the #Y Covenant of the First Spring#!."

 # --- .21 The Root falls: the realm that held Venerurich ---
 goblin_invasion.21.t:0 "The Root Has Fallen"
 goblin_invasion.21.desc_aneic:0 "The keepers who came out of #G $PROV2356$#! brought the hearth registers wrapped in oilcloth, as they had been told to, and they brought nothing else, since [SCOPE.sCountry('gi_burner').GetName|Y] let them carry only what they could hold in their arms. Behind them the smoke from #Y $wonder_root_of_first_spring$#! stood over the forest for three days, and the families in the outlying hearths watched it from their fields without needing to be told what it was.\n\nNo bowl of soil will go up to Venerurich this spring, and nobody can say what the families who were waiting to be named should do instead. The priests have begun to argue over whether #T Mother Cafea#! can still hear a hearth that has not been read aloud at the Root. The clerks have begun copying the registers in case somebody wants to burn those too, and the court has found the clerks' work easier to pay for."
 goblin_invasion.21.desc_other:0 "Word came back from #G $PROV2356$#! that [SCOPE.sCountry('gi_burner').GetName|Y] have burned #Y $wonder_root_of_first_spring$#! while the province was still ours on the rolls. The elves who lived under it have gone into the forest with their registers, and the rents from the province can be expected to leave with the families who paid them.\n\nOur own priests never carried soil to the Root, and they have not pretended to grieve for it. The tax farmers are less calm, since they had counted on the pilgrims and the trade that followed them, and they have asked the court to remember that nobody has yet found a way to tax a stump."
 goblin_invasion.21.a:0 "Copy the registers and keep them safe."

 # --- .22 The Root falls: every other Aneic realm ---
 goblin_invasion.22.t:0 "Word of the Root"
 goblin_invasion.22.desc_goblin:0 "The pilgrims who came down from the World's Lungs this season carried no seedlings. They brought ash in their cloths instead, gathered from what the goblins of [SCOPE.sCountry('gi_burner').GetName|Y] left of #Y $wonder_root_of_first_spring$#! at #G $PROV2356$#!, and every family that once carried a leaf home from the Root has asked for a pinch of it to keep. The priests ran out of ash before they ran out of families.\n\nThe shrines are full and the fields are emptying, since the farmers see little point in clearing a new furrow that can no longer be named at the Root. The priests say #T Mother Cafea#! has not abandoned us, although they have stopped saying it in the market square, where people ask them how they know."
 goblin_invasion.22.desc_other:0 "The news came from #G $PROV2356$#! by way of three different caravans, and none of the drivers quite believed it until the third arrived: [SCOPE.sCountry('gi_burner').GetName|Y] took the city and burned #Y $wonder_root_of_first_spring$#! on purpose, without any need to, and seemed satisfied with the work. Every family in our realm that ever carried a leaf home from the Root has heard by now, and the priests ran short of words before they ran short of mourners.\n\nThe shrines are full and the fields are emptying, since the farmers see little point in clearing a furrow that can no longer be named at the Root. The court has been asked what it means to do about [SCOPE.sCountry('gi_burner').GetName|Y], and has so far answered with a season of mourning, which the priests approve of and the captains do not."
 goblin_invasion.22.a:0 "Keep the mourning."

 # --- .23 The Root falls: other onlookers ---
 goblin_invasion.23.t:0 "The Root of the First Spring Burns"
 goblin_invasion.23.desc_goblin:0 "Merchants coming down from the western foothills brought the news before the heralds did, since a merchant who has turned his carts around at the forest road has nothing better to do than explain why. The goblins of [SCOPE.sCountry('gi_burner').GetName|Y] held #G $PROV2356$#! long enough to bring up axes and lamp oil, and by the time the smoke had cleared the canopy, the keepers who stayed to argue with them had been sent down the road with their registers and nothing else.\n\nOur own priests say it is no concern of ours, since we never carried a bowl of soil to #Y $wonder_root_of_first_spring$#!. The grain factors are less certain. Half the seed sold in the western markets came up from hearths that will now have to find another way to bless their furrows, and the factors would like to buy now, while the elves are still deciding what the burning means."
 goblin_invasion.23.desc_other:0 "Merchants coming out of the World's Lungs report that [SCOPE.sCountry('gi_burner').GetName|Y] held #G $PROV2356$#! and, having held it, burned #Y $wonder_root_of_first_spring$#! to the ground. Goblins could at least claim a grievance about lost valleys. The merchants are still trying to work out what this realm's grievance was, and the court officials they asked were no help, since they gave three different answers.\n\nOur own priests say it is no concern of ours, since we never carried a bowl of soil to the Root. The envoys who deal with the elves disagree. Every Aneic court is now keeping a list of who burned the Root and who said nothing about it, and the envoys would like it noted that we are already on the second list."
 goblin_invasion.23.a:0 "Note it in the chronicle."

 # --- .30 The Root stands: the realm that held it ---
 goblin_invasion.30.t:0 "The Root Stands"
 goblin_invasion.30.desc:0 "The goblins of [SCOPE.sCountry('gi_leader').GetName|Y] have gone back up the foothill road, fewer than came down it, and the forest around #G $PROV2356$#! is quiet enough that the keepers have gone back to quarreling over whose turn it is to hold the ladder. The engineers' ram still sits in the clearing below the walls, and the children who climb on it have been told to stop, which they have taken as encouragement.\n\nThe first families to bring soil since the siege are already on the road, and the keepers say there are more of them than usual, since every hearth that watched the war from the edge of the trees would like to be counted now that the counting is safe again. The captains want their levies paid before the festival, and the keepers want the levies to stay for it, which would be cheaper."
 goblin_invasion.30.a:0 "Read every name, and pay the levies."

 # --- .31 The Root stands: the goblins ---
 goblin_invasion.31.t:0 "The Host Comes Home"
 goblin_invasion.31.desc:0 "The host came back up the foothill road with its wounded on litters and without its ram, which the engineers said they had always meant to leave behind, and nobody contradicted them. #Y $wonder_root_of_first_spring$#! still stands at #G $PROV2356$#!, and the families who walked at the front of the march have gone home to their old foraging valleys to see whether anything in them is still worth foraging.\n\nThe chiefs have started blaming one another, which is the custom, and have agreed that the elves were more stubborn than anyone expected, which is not. [SCOPE.sCountry('gi_keeper').GetName|Y] will be sending settlers into the upper valleys again before the year is out, and the clans will have to decide whether to watch them do it or try again with fewer men."
 goblin_invasion.31.a:0 "The passes will remember."

 # --- .32 The Root stands: onlookers ---
 goblin_invasion.32.t:0 "The Root Stands"
 goblin_invasion.32.desc:0 "Traders coming down from the World's Lungs report that the goblins of [SCOPE.sCountry('gi_leader').GetName|Y] have gone back to the passes and that #Y $wonder_root_of_first_spring$#! still stands over #G $PROV2356$#!. [SCOPE.sCountry('gi_keeper').GetName|Y] held the walls, and the elves have already begun the festival they put off for the siege, which the traders say is longer than usual and serves less food, since the war ate most of it first.\n\nOur court has little to gain from the outcome beyond a quieter road through the foothills. The traders note that the elves are keeping a list of which courts sent help during the siege, and that the list is short."
 goblin_invasion.32.a:0 "Note it in the chronicle."
