l_english:

 z2_player_offer_title:0 "The Veterans Have Not Forgotten"
 z2_player_offer_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the men who rode with the #T First Gathering#! have returned to their hearths, but their arguments are still being heard throughout our lands. Each household has its account of the expedition, and the younger riders have begun asking what their fathers might have achieved under a single command.\n\nSome of our councillors believe that [ROOT.GetCountry.GetName|T] should cultivate these ambitions. We could gather veteran households, prepare horses and provisions, and seek promises from neighboring chiefs. When the next generation is ready, our country would stand at the center of its gathering.\n\nSuch a project will require gold and influence, and its eventual leader may be a veteran's son willing to claim a throne of his own. We would be preparing a movement whose ambitions reach well beyond the pasture. Shall we make it ours?"
 z2_player_offer.a:0 "Let the veterans gather around our hearths."
 z2_player_offer.b:0 "Let another chief concern himself with their ambitions."
 z2_player_project_tt:0 "Commit #Y [SCOPE.ScriptValue('z2_project_gold_cost')|0] gold#! and #Y [SCOPE.ScriptValue('z2_project_influence_cost')|0] influence#! to the gathering.\nVeteran households are more willing to support a realm that furnished the First Gathering. Backing their emerging leader will eventually require entrusting him with our throne."
 z2_player_project_title:0 "A Gathering for the Next Generation"
 z2_player_project_desc:0 "My [ROOT.GetCountry.GetRulerTitle], our messengers have begun calling the veteran households to [ROOT.GetCountry.GetCapital.GetName|G]. Some arrive with sons old enough to ride; others bring boys who have heard the same stories so often that they can recite the names of distant cities before they have seen a proper market.\n\nWe have time to prepare. The chiefs will need gifts and assurances, the riders will need spare horses, and the families who furnished the first expedition will expect to be heard. Our own veterans have given us a useful beginning, though promises made beside a winter fire will require patient attention if they are to become a common army.\n\nWhen their generation is ready, a new leader may emerge from these households. For now, we should concern ourselves with the men and horses he will need."
 z2_player_project.a:0 "Send out the invitations."
 z2_player_preparations_tt:0 "The gathering takes four years and cannot march before the century turns. Rallying veteran households improves the new leader's authority, remounts strengthen his armies, and chiefs' pledges bring their riders. A united realm of twenty-four territories can supply the riders without two independent chiefs. At the final council, choose whether to step down or contest command in civil war."
 z2_player_lapsed_title:0 "The Opportunity Passes"
 z2_player_lapsed_desc:0 "My [ROOT.GetCountry.GetRulerTitle], our plans to place [ROOT.GetCountry.GetName|T] at the center of the next gathering have lost their foundation. The promised following could not be maintained, or the generation we hoped to lead has waited beyond the time allowed. Messengers who once brought us assurances are returning to their own chiefs.\n\nOur expenditures cannot be recovered, but we have not summoned the continental host. Another ruler may yet draw the tribes together if their independence survives. We should watch the southern roads with rather different expectations now."
 z2_player_lapsed.a:0 "We shall see who takes up their cause."
 z2_chief_council_title:0 "Promises Between Chiefs"
 z2_chief_council_desc:0 "My [ROOT.GetCountry.GetRulerTitle], our messengers can approach the following chiefs. A veteran's tale may win a hearing, but each ruler will consider what our gathering offers his own household. Some will pledge their riders readily; others will expect silver or privileges before they put their word beside ours.\n\nAn early pledge leaves the chief independent. If our founder is crowned, we will call upon him to honor that promise as a sworn subject."
 z2_council.leave:0 "Let the council adjourn."
 z2_pledge_request_title:0 "An Invitation to the Gathering"
 z2_pledge_request_desc:0 "My [ROOT.GetCountry.GetRulerTitle], a messenger from [SCOPE.sCountry('z2_player_host').GetName|T] has come to speak of the veterans' sons. His patrons are gathering support for another expedition and ask us to promise our riders to the leader who will eventually take command.\n\nNo submission is demanded today. The promise would bind us when the new founder is crowned, leaving our household and lands under our own ruler while we serve in his wars. Some of our companions favor the proposal. Others think that a chief's word should command a better price than a stranger's invitation."
 z2_pledge_request.a:0 "They shall have our word."
 z2_pledge_request.b:0 "Our household will need something in return."
 z2_pledge_request.c:0 "Our sons have heard enough of other men's expeditions."
 z2_pledge_price_title:0 "The Price of a Chief's Word"
 z2_pledge_price_desc:0 "My [ROOT.GetCountry.GetRulerTitle], [SCOPE.sCountry('z2_negotiating_chief').GetName|T] has answered our invitation. Its ruler is willing to discuss a pledge, but considers the prospect of distant plunder rather insufficient compensation for the risks his household will bear.\n\nA gift of silver would satisfy his immediate concerns. Alternatively, we might spend our influence assuring the gathering that his household's privileges will be respected. Such assurances would strengthen his willingness to serve once the oaths are sworn. We may also refuse, though we should expect his hall to remain closed to further approaches for some years."
 z2_pledge_price.a:0 "Send #Y 100 gold#! to his household."
 z2_pledge_price.b:0 "Recognize his privileges; spend #Y 25 influence#!."
 z2_pledge_price.c:0 "We shall find more willing companions."
 z2_pledge_won_title:0 "A Chief Gives His Word"
 z2_pledge_won_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the ruler of [SCOPE.sCountry('z2_negotiating_chief').GetName|T] has pledged his riders to our gathering. His household remains independent for the present, but when our founder is crowned he will be expected to honor his word.\n\nOur messengers report that his companions have already begun discussing the roads and the cities beyond the frontier. We would do well to keep our own preparations worthy of their expectations."
 z2_pledge_won.a:0 "His riders will be welcome beside ours."
 z2_pledge_refused_title:0 "A Hall Closed to Our Messengers"
 z2_pledge_refused_desc:0 "My [ROOT.GetCountry.GetRulerTitle], [SCOPE.sCountry('z2_negotiating_chief').GetName|T] has refused our invitation. Its ruler has apparently heard enough of the gathering for the present and advises us to find other households willing to furnish its riders.\n\nOur messengers recommend allowing his temper several years to cool before returning. Other chiefs may be more receptive."
 z2_pledge_refused.a:0 "Then let us speak to his neighbors."
 z2_son_arrives_title:0 "The Generation We Prepared For"
 z2_son_arrives_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the young men who once tended their fathers' spare horses now arrive with followers of their own. They remember the #T First Gathering#!, and the preparations made in [ROOT.GetCountry.GetName|T] have given them a reason to look toward our court.\n\nWe can now receive a veteran's son as the gathering's emerging leader. His following will need four years to assemble openly, during which we must secure the promised chiefs, remounts, and destination. Backing him means preparing for the day he claims our throne and leads the riders himself.\n\nThe opportunity will not wait indefinitely. If we leave it untouched for five more years, another chief may gather this generation around his own hearth."
 z2_son_arrives.a:0 "Receive the veteran's son and begin the gathering."
 z2_son_arrives.b:0 "We must finish our preparations first."
 z2_son_arrives.c:0 "Let another ruler take up this ambition."
 z2_not_ready_title:0 "The Riders Await Their Promises"
 z2_not_ready_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the gathering has waited four years, and its leading households are asking when the banner will be raised. We have yet to fulfill every promise required for the coronation. Some chiefs have not pledged their riders, the household following or remounts may be insufficient, or the promised city has not been settled upon.\n\nWe may ask for another year, though the gathering will accept this delay no more than twice. If the preparations are completed sooner, the decision to raise #T Jelenia's banner#! will be available without waiting for that year to pass."
 z2_not_ready.a:0 "Ask the households for one more year."
 z2_not_ready.b:0 "Release them from our promises."
 z2_player_gathering_title:0 "The Households Assemble"
 z2_player_gathering_desc:0 "My [ROOT.GetCountry.GetRulerTitle], two years have passed since the gathering began. Chiefs send sons to inspect our preparations, veterans argue over the roads, and riders ask where their spare horses are to be kept. The promises made to these households are becoming rather more immediate.\n\nOur following stands at #Y [ROOT.GetCountry.MakeScope.Var('z2_player_support').GetValue|0] veteran households#! and #Y [SCOPE.ScriptValue('z2_player_pledge_count')|0] pledged chiefs#!. Before the coronation we need at least two of each, prepared remounts, and a city the founder can promise his riders. The remaining years should be put to use."
 z2_player_gathering.a:0 "Let us examine what remains to be done."
 z2_city_council_title:0 "A City to Promise the Riders"
 z2_city_council_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the veteran's son and his companions have asked which city will become the seat of their future realm. Our scouts have identified wealthy cities in several mainland countries, each with its own roads, rulers, and defenders.\n\nThe chosen city will become the gathering's great promise. Its capture and a secure neighboring foothold will allow the founder to establish the #T Jelenian Dominion#!. We should consider how far our riders must travel and whose armies stand along the road before giving the chiefs an answer."
 z2_city_council.refresh:0 "Ask the scouts for a fresh report."
 z2_city_council.later:0 "We shall settle upon a city later."
 z2_player_coronation_title:0 "The Crown Beneath the Deer"
 z2_player_coronation_desc:0 "My [ROOT.GetCountry.GetRulerTitle], [SCOPE.sChar('z2_founder').GetName|Y] stands before the assembled horsemen. The veteran's son invokes his father's comrades and the unfinished promise of the First Gathering. Whether the southern lands still belong to many chiefs or have been united beneath our rule, their riders now look to this hall.\n\nHe demands the throne of [ROOT.GetCountry.GetName|T] and command of the march upon [SCOPE.sProvince('target_province').GetName|G]. We may step aside and place the realm in his hands. If we refuse, he will rally his followers against us, and the question of who commands the horde will be settled in civil war.\n\nThe victor will raise Jelenia's banner. The defeated household may lose everything."
 z2_player_coronation.a:0 "Let [SCOPE.sChar('z2_founder').GetName|Y] take the throne and lead us!"
 z2_player_coronation.b:0 "Let him challenge me for the banner!"
 z2_player_coronation_tt:0 "Step down in favor of the veteran's son. He becomes our ruler and commands the cavalry hosts. We continue ruling this country through him. Old alliances are broken; his death or deposition will break the confederacy."
 z2_war_council_title:0 "The Road Before the Riders"
 z2_war_council_desc:0 "My [ROOT.GetCountry.GetRulerTitle], our commanders have brought their recommendations. The following frontier realms can be approached through our own lands or those of our sworn chiefs. An envoy will demand submission or payment; if refused, the decision to declare war will return to this council.\n\nThe gathering's cohesion stands at #Y [ROOT.GetCountry.MakeScope.Var('z2_cohesion').GetValue|0]/100#!. Victories and plunder strengthen the chiefs' confidence. Defeats, exhaustion, and years without progress toward the promised city encourage them to reconsider what their oaths have brought their households."
 z2_defiance_report_title:0 "The Envoy Returns Empty-Handed"
 z2_defiance_report_desc:0 "My [ROOT.GetCountry.GetRulerTitle], [SCOPE.sCountry('z2_defender').GetName|T] has refused our demands. Its ruler appears willing to test whether the banner of #T Jelenia#! commands more than an envoy's threats.\n\nOur commanders await your answer. We may declare a conquest war if their realm remains reachable and no truce or alliance prevents it, or leave the matter for a more favorable season. The riders will march when you command them."
 z2_defiance_report.a:0 "Then let our riders deliver the answer!"
 z2_defiance_report.b:0 "We shall choose the moment ourselves."
 z2_oaths_strained_title:0 "The Chiefs Count Their Losses"
 z2_oaths_strained_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the chiefs have become unusually attentive to the costs of serving our gathering. They count the horses lost, the households waiting for their men, and the spoils that others seem to have received. Our promises are being repeated with considerably less enthusiasm than when the banner was first raised.\n\nA distribution of gold and political concessions could restore some confidence. We might instead release a sworn chief and his household, allowing the remaining companions to see that departure is possible. Otherwise we must insist upon obedience and accept the discontent that follows.\n\nThe oaths have not broken, but their strength can no longer be taken for granted."
 z2_oaths_strained.a:0 "Distribute #Y 200 gold#! and spend #Y 25 influence#!."
 z2_oaths_strained.b:0 "Release a powerful sworn chief from his oath."
 z2_oaths_strained.c:0 "They will honor the oaths they swore."
 z2_prepared_remounts:0 "Remounts of the Veteran Households"
 z2_unsteady_oaths:0 "The Chiefs Question Their Oaths"
 z2_chief_privileges:0 "Privileges of a Sworn Household"
 z2_gather_veterans_sons:0 "Gather the Veterans' Sons"
 z2_gather_veterans_sons_desc:0 "Call the veterans' households to our hearths and prepare their sons for a new gathering. A realm that furnished the First Gathering will find these families more willing to answer its summons."
 z2_rally_veteran_households:0 "Rally the Veteran Households"
 z2_rally_veteran_households_desc:0 "Spend 75 gold and 20 influence to gain one household's support, up to three. Available once every two years. Coronation requires at least two."
 z2_gather_remount_herds:0 "Gather the Remount Herds"
 z2_gather_remount_herds_desc:0 "Spend 150 gold and 10 manpower to prepare the horses and supplies needed for coronation. The founder receives five years of improved army upkeep and morale recovery."
 z2_seek_chiefs_oaths:0 "Seek the Chiefs' Oaths"
 z2_seek_chiefs_oaths_desc:0 "Send messengers to a southern chief and seek his pledge. He may ask for gifts or privileges. Two pledges complete this preparation, or direct rule over twenty-four territories can supply the riders. Missions can be sent six months apart."
 z2_receive_veterans_son:0 "Receive the Veterans' Son"
 z2_receive_veterans_son_desc:0 "When the next generation is ready, receive its emerging founder and begin the four-year gathering. Choose a promised city and complete the political preparations."
 z2_abandon_gathering:0 "Abandon the Gathering"
 z2_abandon_gathering_desc:0 "Dismiss our messengers and release the chiefs from their promises. Before the public gathering, another leader may take up their cause. Once the chiefs have assembled, disbanding them will scatter the movement. Our standing will take five years to recover."
 z2_convene_war_council:0 "Convene the War Council"
 z2_convene_war_council_desc:0 "Hear the commanders' reports and send an envoy to a frontier ruler. Submission, tribute, or refusal will follow; the decision to march remains yours. The council can be summoned every ninety days."
 z2_raise_jelenias_banner:0 "Raise Jelenia's Banner"
 z2_raise_jelenias_banner_desc:0 "Once the four-year gathering and century minimum have passed, face the veteran's son before the horsemen. Step down in his favor or challenge him in civil war for command of the horde."
 z2_choose_promised_city:0 "Reconsider the Promised City"
 z2_choose_promised_city_desc:0 "Commission fresh reports on the wealthy cities beyond our frontier for 20 influence. The scouts need a year between reviews of the promised capital."
 z2_chief_choice_1:0 "Send our messengers to [SCOPE.sCountry('z2_chief_1').GetName|T]."
 z2_frontier_choice_1:0 "Demand the submission of [SCOPE.sCountry('z2_frontier_1').GetName|T]."
 z2_city_choice_1:0 "Promise them [SCOPE.sProvince('z2_city_1').GetName|G], held by [SCOPE.sProvince('z2_city_1').GetOwner.GetName|T]."
 z2_chief_choice_2:0 "Send our messengers to [SCOPE.sCountry('z2_chief_2').GetName|T]."
 z2_frontier_choice_2:0 "Demand the submission of [SCOPE.sCountry('z2_frontier_2').GetName|T]."
 z2_city_choice_2:0 "Promise them [SCOPE.sProvince('z2_city_2').GetName|G], held by [SCOPE.sProvince('z2_city_2').GetOwner.GetName|T]."
 z2_chief_choice_3:0 "Send our messengers to [SCOPE.sCountry('z2_chief_3').GetName|T]."
 z2_frontier_choice_3:0 "Demand the submission of [SCOPE.sCountry('z2_frontier_3').GetName|T]."
 z2_city_choice_3:0 "Promise them [SCOPE.sProvince('z2_city_3').GetName|G], held by [SCOPE.sProvince('z2_city_3').GetOwner.GetName|T]."

 z2_support_first_gathering:0 "Equip Riders for the First Gathering"
 z2_support_first_gathering_desc:0 "Equip riders for the First Gathering with gold and manpower while its leader is fighting. Our country remains independent and at peace. The households who serve will lend their experience and support to the gathering of the next generation."

 z2_player_test_title:0 "Player Invasion Test Ready"
 z2_player_test_desc:0 "This disposable save now has a mock First Gathering outcome unless a genuine outcome already existed, test resources, and a date bypass. Gather the Veterans' Sons, then receive the son and choose a city. Household support and remounts improve the gathering; two pledges or twenty-four directly ruled territories complete the voluntary political preparation. The command event zerywani_second.994 unlocks the leadership council after the claimant arrives. Test both abdication and the civil-war challenge on separate saves."
 z2_player_test.a:0 "Open the decisions and begin the test."

 z2_player_test_diagnostic_title:0 "Player Invasion Test: Setup Result"
 z2_player_test.blocked:0 "Understood."
 z2_test_not_player:0 "Setup did not run: this event is scoped to an AI country. Switch control to the intended southern tribe first; for starting Mikhaylovka, use the console command tag ST2, then run event zerywani_second.995 again."
 z2_test_no_land:0 "Setup did not run: the current country has no territory. Control an existing independent southern tribe, such as starting Mikhaylovka (tag ST2)."
 z2_test_not_tribal:0 "Setup did not run: [ROOT.GetCountry.GetName|T] is not a tribal country. The player-led route requires a tribal government. Starting Mikhaylovka (tag ST2) is a suitable test country."
 z2_test_subject:0 "Setup did not run: [ROOT.GetCountry.GetName|T] is a subject. Choose an independent southern tribe or restore its independence before testing."
 z2_test_civil_war:0 "Setup did not run: [ROOT.GetCountry.GetName|T] is in a civil war. Use a peaceful fresh starting setup for this test."
 z2_test_wrong_region:0 "Setup did not run: [ROOT.GetCountry.GetCapital.GetName|G] is outside the six southern homeland regions. Choose a tribe in Pomorania, Lechia, Russhovia, Mizhykraina, Zarusshovia, or Polabowy. Starting Mikhaylovka (tag ST2) qualifies."
 z2_test_wrong_landmass:0 "Setup did not run: the current capital is outside the passable mainland connected to province 5444. Starting Mikhaylovka (tag ST2) is the reference test country."
 z2_test_at_war:0 "Setup did not run: [ROOT.GetCountry.GetName|T] is currently at war. Make peace or use a fresh starting save, then retry."
 z2_test_already_used:0 "Setup did not run: the second invasion has already entered its warning phase or ended in this save. This helper never resets the once-per-campaign gate. Reload a save from before that attempt, or start a new test game."
 z2_test_first_active:0 "Setup did not run: the first invasion has formed but its ending has not been recorded. The helper will not overwrite an active first campaign. Finish it normally or use a fresh test save."
 z2_test_too_few_tribes:0 "Setup did not run: no qualifying independent southern tribal realm remains. Current qualifying count: #Y [SCOPE.ScriptValue('z2_tribe_count')|0]#!."
 z2_test_too_little_land:0 "Setup did not run: the qualifying southern tribes together control fewer than twenty-four territories. Current total: #Y [SCOPE.ScriptValue('z2_tribal_land')|0]#!. Use a fresh starting setup."
 z2_test_other_failure:0 "Setup did not run because an eligibility check failed. Current country: [ROOT.GetCountry.GetName|T]. Capital: [ROOT.GetCountry.GetCapital.GetName|G]. Qualifying tribes: #Y [SCOPE.ScriptValue('z2_tribe_count')|0]#!. Their territories: #Y [SCOPE.ScriptValue('z2_tribal_land')|0]#!. Share this result when reporting the failure."

 z2_ui_mainland_tt:0 "On the connected Luxterran mainland."
 z2_ui_homeland_tt:0 "In the southern tribal homelands of Luxterra."
 z2_ui_southern_host_tt:0 "We remain an independent southern tribe preparing the gathering."
 z2_ui_tribal_base_tt:0 "At least #Y 1#! independent southern tribal realm survives, with #Y 24#! territories held by the qualifying realms together. Currently: #Y [SCOPE.ScriptValue('z2_tribe_count')|0]#! realms and #Y [SCOPE.ScriptValue('z2_tribal_land')|0]#! territories."
 z2_ui_candidate_tt:0 "An independent southern tribe can claim the next gathering; no other founder has claimed it."
 z2_ui_support_room_tt:0 "Fewer than #Y 3#! veteran households have been rallied. Current support: #Y [ROOT.GetCountry.MakeScope.Var('z2_player_support').GetValue|0]#!."
 z2_ui_household_ready_tt:0 "The veteran households are ready to gather again (#Y 2 years#! between rallies)."
 z2_ui_chief_envoys_ready_tt:0 "Our messengers are available (#Y 6 months#! between approaches)."
 z2_ui_generation_ready_tt:0 "The veterans' sons have come of age for the next gathering."
 z2_ui_founder_rules_tt:0 "The founder remains our ruler and our country is independent and united."
 z2_ui_war_council_ready_tt:0 "The council and its envoys are available (#Y 90 days#! between councils)."
 z2_ui_coronation_host_tt:0 "We are an independent southern tribe at peace, ready to crown our founder."
 z2_ui_coronation_ready_tt:0 "The coronation council is available."
 z2_ui_century_tt:0 "At least #Y 100 years#! have passed since the beginning of the campaign."
 z2_ui_scouts_ready_tt:0 "Our scouts have returned with new reports (#Y 1 year#! between reviews)."
 z2_ui_first_campaign_active_tt:0 "The First Gathering is still fighting its invasion."
 z2_ui_households_required_tt:0 "At least #Y 2#! veteran households support us. Current support: #Y [ROOT.GetCountry.MakeScope.Var('z2_player_support').GetValue|0]#!."
 z2_ui_pledges_required_tt:0 "At least #Y 2#! independent, peaceful chiefs have pledged, or our united realm controls #Y 24#! territories. Current pledges: #Y [SCOPE.ScriptValue('z2_player_pledge_count')|0]#!."
 z2_ui_remounts_required_tt:0 "The remount herds are prepared."
 z2_ui_city_required_tt:0 "A promised city has been chosen and remains outside our realm."
 z2_ui_claim_effect_tt:0 "Reserve leadership of the next gathering.\nCost: #Y [SCOPE.ScriptValue('z2_project_gold_cost')|0] gold#! and #Y [SCOPE.ScriptValue('z2_project_influence_cost')|0] influence#!.\nUnlock preparations for the veterans' sons."
 z2_ui_rally_effect_tt:0 "Gain #G 1#! veteran-household support, up to #Y 3#!.\nAnother rally can be held in #Y 2 years#!."
 z2_ui_remounts_effect_tt:0 "Prepare the remount herds. When the gathering rises, gain #G -10% army upkeep#! and #G +10% morale recovery#! for #Y 5 years#!."
 z2_ui_chief_council_effect_tt:0 "Choose a chief to approach for a pledge of riders.\nThe next mission can be sent in #Y 6 months#!."
 z2_ui_receive_effect_tt:0 "Receive the veteran's son, begin the #Y four-year gathering#!, and choose the promised capital."
 z2_ui_abandon_effect_tt:0 "Release the chiefs from their pledges and dismiss the gathering.\nBefore the public assembly, another leader may take up the cause. Disbanding an assembled gathering scatters its following.\nOur standing will take #Y 5 years#! to recover."
 z2_ui_war_council_effect_tt:0 "Review frontier realms and choose where to send a demand.\nThe council can reconvene in #Y 90 days#!. You decide whether a refusal means war."
 z2_ui_coronation_effect_tt:0 "Convene the leadership council. Choose whether to step down for the veteran's son or fight him in civil war for command of the horde."
 z2_ui_city_council_effect_tt:0 "Review alternative wealthy mainland cities for the promised capital.\nAnother review can be commissioned in #Y 1 year#!."
 z2_ui_support_first_effect_tt:0 "Contribute #Y 100 gold#! and warriors to the First Gathering.\nGain veteran status and an advantage when preparing the next generation."
