 z2_ui_chief_visit_tt:0 "Seek this chief's pledge. Gifts or privileges may be requested."
 z2_ui_city_choice_tt:0 "Make this city the gathering's promised capital."
 z2_ui_send_demand_tt:0 "Demand submission or tribute from this realm.\nA refusal returns the decision to declare war to you."
 z2_ui_pledge_effect_tt:0 "Promise our riders to the gathering. Remain independent until the founder is crowned."
 z2_ui_negotiate_effect_tt:0 "Ask for gifts or household privileges before giving our pledge."
 z2_ui_refuse_pledge_tt:0 "End these negotiations. Further approaches must wait #Y 5 years#!."
 z2_ui_secure_pledge_tt:0 "Secure the chief's pledge of riders."
 z2_ui_privileges_effect_tt:0 "Secure the pledge by recognizing household privileges.\nThe chief gains #G +15 subject loyalty#! for #Y 30 years#! after joining."
 z2_ui_extension_effect_tt:0 "Delay the coronation by #Y 1 year#!. At most #Y 2#! extensions are available."
 z2_ui_restore_twenty_tt:0 "Restore #G 20 cohesion#!."
 z2_ui_release_chief_tt:0 "Release a powerful sworn chief and restore #G 15 cohesion#!.\nHis household will be excused from further summons and tribute demands for #Y 10 years#!."
 z2_ui_restore_five_tt:0 "Restore #G 5 cohesion#! through an insistence on obedience."
 z2_ui_refuse_submission_tt:0 "Refuse the demand. The founder may answer with an invasion."

 z2_ui_claim_restored_tt:0 "Our standing permits a new gathering (#Y 5 years#! after abandoning one)."

 z2_challenge_tt:0 "Remain with our present ruler and fight the veteran's son in a civil war. He receives a cavalry following and a war chest. The victor commands the horde and begins the great march. Defeat carries the usual consequences of losing a civil war, including the loss of our country."
 z2_challenge_delayed_title:0 "The Chiefs Hold Their Ground"
 z2_challenge_delayed_desc:0 "The veteran's son has failed to gather a separate rebel government. The chiefs return to the hall, where the question of the throne remains unsettled. We must hear his demand once more."
 z2_challenge_delayed.a:0 "Bring him before the council again."
 z2_challenge_news_title:0 "Two Claimants Beneath the Deer"
 z2_challenge_news_desc:0 "The southern gathering has split. [SCOPE.sChar('z2_incumbent_ruler').GetName|Y] has refused to surrender the throne to [SCOPE.sChar('z2_founder').GetName|Y], the veteran's son who claims command of Jelenia's horsemen.\n\nTheir followers now fight for the realm itself. Whoever wins will inherit the riders' promise of conquest, and the neighboring courts would be unwise to mistake this civil war for the end of the threat."
 z2_challenge_news.a:0 "Watch which banner survives."
 z2_claimant_revolt_name:0 "The Veteran's Host"
