l_english:

 omni_demodamas.1.t: "Demodamas the Explorer"
 omni_demodamas.1.desc: "My [ROOT.GetCountry.GetRulerTitle], a strange ship has put in at [SCOPE.sP('demodamas_port').GetName|G]. Its sailors wear cloaks pinned at one shoulder and sandals that appear to have been designed for a considerably drier country. The harbor master mistook their greeting for a dispute over docking fees and doubled the charge. This did nothing to improve relations.\n\nInterpreters were found, and our court mages spent the better part of an afternoon untangling the strangers' gibberish. The captain, it turns out, goes by the name of #Y Demodamas#! and hails from a city called #G Miletos#!, a place unfamiliar to our cartographers. He unrolled a sodden chart before [ROOT.GetCountry.GetRuler.GetName|Y], who immediately took pity on the poor fool - his map was filled with the scribblings of a madman, with landmasses and oceans that do not exist.\n\nDemodamas began to speak in a voice that carried the weight of countless miles on the open sea: 'We sailed for months, but the islands I had visited so many times before never materialized.' he explained, running his finger to the edge of the parchment. 'And then, not knowing what to do, we kept sailing. The weeks turned into months, but we continued onward into the unknown. Gentlemen, I am, in the strictest sense of the word, lost.'\n\nDemodamas asks for three galley slaves before he puts out to sea again. In return he offers a clay figurine sacred to the #T Great Matriarch#!, which he swears can bless a household with children. One of our interpreters suggests that a man who can find a land missing from his own map might be worth keeping at court. The harbor master would be just as happy to see him leave."
 omni_demodamas.1.a: "Three hands for the figurine. We have a bargain!"
 omni_demodamas.1.b: "Show this beggar the way out of the harbor"
 omni_demodamas.1.c: "Offer him a place at court...he has sailed far enough."
 omni_demodamas.1.trade_tt: "#Y 3#! Pops in [SCOPE.sP('demodamas_port').GetName|G] will be #R sent away#!."
 omni_demodamas.1.depart_tt: "#Y Demodamas#! will continue his voyage."
 omni_demodamas.1.stay_tt: "#Y Demodamas#! will settle here and enter our service."
