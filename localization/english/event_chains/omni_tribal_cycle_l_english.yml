l_english:
 omni_tribal_steppe_rise:0 "Gathering of the Steppe Clans"
 desc_omni_tribal_steppe_rise:0 "A great host has gathered beneath our banners. The clans will ride together for a generation, but their allegiance rests on fragile bonds."
 omni_tribal_migratory_rise:0 "The Great Tribal Host"
 desc_omni_tribal_migratory_rise:0 "Warriors flock to the chief's banner in search of land and plunder. This gathering brings strength, while pulling our clans further from settled rule."
 omni_tribal_settled_rise:0 "Ascendancy of the Tribal Realm"
 desc_omni_tribal_settled_rise:0 "The clans have rallied behind a common purpose. Their strength supports conquest and the growth of our settlements, though the distant chiefs still prize their freedom."
 omni_tribal_first_collapse:0 "Fractured Tribal Authority"
 desc_omni_tribal_first_collapse:0 "The outer clans now govern themselves and acknowledge us only through tribute. The heartland must recover from the loss of its warriors and revenues."
 omni_tribal_repeat_collapse:0 "Shattered Tribal Realm"
 desc_omni_tribal_repeat_collapse:0 "Our realm has fractured once more. The regional chiefs have rejected tribute and declared their independence, leaving our authority deeply weakened."
 omni_tribal_successor_ambition:0 "Ambition of the Successor Chiefs"
 desc_omni_tribal_successor_ambition:0 "Freed from the old tribal realm, our chiefs rally their warriors and seek to establish a lasting power of their own."
 omni_tribal_successor_recovery:0 "Mustering the Regional Clans"
 desc_omni_tribal_successor_recovery:0 "The regional clans are gathering resources and warriors to support their newly established realm."
 omni_tribal_cycle_rise_title:0 "The Clans Rally"
 omni_tribal_cycle_rise_desc:0 "Despite the strains within [SCOPE.sC('origin_crisis').GetName], its chiefs have rallied their warriors beneath a common banner. A generation of conquest and renewed strength may lie ahead, but the distant clans remain bound by uneasy loyalties. Our neighbors may soon turn their ambitions toward our borders."
 omni_tribal_cycle_rise_option:0 "We must watch their gathering strength."
 omni_tribal_cycle_collapse_title:0 "A Tribal Realm Fractures"
 omni_tribal_cycle_collapse_desc:0 "The bonds holding [SCOPE.sC('origin_crisis').GetName] together have given way. The outer regions have passed into the hands of their own chiefs, while the old ruler retains the capital's heartland. Some chiefs may still offer tribute; those who have seen the realm fracture before now assert their full independence."
 omni_tribal_cycle_collapse_option:0 "New powers emerge from the broken realm."
