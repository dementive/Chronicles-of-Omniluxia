l_english:

 zerywani_horde_1_title:0 "The Zerywani Horde Marches"
 zerywani_horde_1_desc:0 "The scattered tribes of our people have heard the call that echoes throughout the wildlands of our forests. Warband after warband streams out of the hills and dales, leaving their families behind to unite under a single warlord. These warriors ride for days and weeks, gathering together until the horizon is choked with spears, horses and cattle. There is no room left for us here - not when so rich a prize as [scope:zerywani_horde_target.GetName] lies within reach.\n\nWe march to war."
 zerywani_horde_1_tooltip:0 "The Zerywani tribes unite into a single horde and declare war on [scope:zerywani_horde_target.GetName], the wealthiest and strongest realm that they have heard of."
 zerywani_horde_1.a:0 "For plunder and glory!"

 zerywani_horde_2_title:0 "A Storm From the North"
 zerywani_horde_2_desc:0 "Refugees speak of a vast horde of #Y Zerywani#! tribesmen sweeping toward our lands, more numerous than any raiding party seen in living memory. [scope:zerywani_horde_leader_scope.GetName] leads them, and their eyes are set on us."
 zerywani_horde_2.a:0 "Prepare our defenses!"

 zerywani_horde_3_title:0 "The Call to War"
 zerywani_horde_3_desc:0 "Word reaches us of a great gathering of the #Y Zerywani#! tribes, marching to war against the richest realm on our shared continent. Our own warriors, having heard of the rich cities of our enemies, are eager to join the horde and share in the plunder, and many are begging [ROOT.GetCountry.GetRuler.GetName|Y] to let them ride alongside these warriors."
 zerywani_horde_3.a:0 "Let us join the horde and share in the treasure!"

 zerywani_horde_5_title:0 "The Horde's Fate"
 zerywani_horde_5_victory_desc:0 "The #R Great Horde#! has broken its enemy; their capital has fallen, their treasuries lie open to us, and our tribes return home richer beyond belief. Some are taking their new wealth and returning to their traditional homelands, whereas other Tribal Chieftains have settled their herds in the lands that they have conquered."
 zerywani_horde_5_defeat_desc:0 "The #R Great Horde#! has scattered. Whether by a hard peace or a harder defeat, the bloody campaign of misery and terror is over, and what remains of our warbands trickle back to their homelands."
 zerywani_horde_5.a:0 "A triumph for our people and a triumph for [ROOT.GetCountry.GetRuler.GetName]!"
 zerywani_horde_5.b:0 "We shall remember this..."

 zerywani_horde_conquest:0 "Zerywani Horde Conquest"

 zerywani_horde_on_the_march:0 "Zerywani Horde on the March"
 zerywani_horde_participant_modifier:0 "Answered the Horde's Call"
 zerywani_horde_under_invasion_modifier:0 "Besieged by the Zerywani Horde"
