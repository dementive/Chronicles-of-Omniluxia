l_english:

 zerywani_horde_1_title:0 "The First Gathering"
 zerywani_horde_1_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the roads into [ROOT.GetCountry.GetCapital.GetName|G] are crowded with #Y Zerywani#! riders! Chiefs who spent the last season disputing grazing grounds now drink together beside the same fires, each promising warriors for an expedition beyond our borders. Their scouts speak eagerly of the markets and storehouses of [SCOPE.sCountry('zerywani_horde_target').GetName|T], where a single prosperous town is said to hold more silver than some of our chiefs have seen in a lifetime.\n\nOf course, every chief has his own opinion of how that silver should be divided. Our commander has been entrusted with the march, but the men following him still bear the banners of their own households. For now, the prospect of plunder has persuaded them to put their quarrels aside.\n\nAmong the wagons are boys tending their fathers' spare horses. They listen closely when the veterans describe the cities ahead. Whatever comes of this gathering, there will be stories enough to fill their winter evenings for years!"
 zerywani_horde_1_tooltip:0 "The #Y Zerywani#! chiefs contribute riders and supplies to an expedition against [SCOPE.sCountry('zerywani_horde_target').GetName|T]. Each contributing country keeps its independence."
 zerywani_horde_1.a:0 "Let our riders return laden with silver!"

 zerywani_horde_2_title:0 "Riders Beyond the Frontier"
 zerywani_horde_2_desc:0 "My [ROOT.GetCountry.GetRulerTitle], merchants arriving at [ROOT.GetCountry.GetCapital.GetName|G] bring troubling accounts from beyond the frontier. A gathering of #Y Zerywani#! chiefs has furnished a common army under the leadership of [SCOPE.sCountry('zerywani_horde_leader_scope').GetName|T], and its riders are making for our lands!\n\nThose who have seen their camp describe horses tethered in long rows, wagons piled with provisions, and chiefs arguing loudly over spoils they have yet to win. Some at court find this last detail reassuring. Surely, they say, men who cannot agree over a purse of silver will soon find a reason to turn on one another. Our frontier officers are considerably less amused. A quarrelling horseman can still burn a farm, and there appear to be a great many of them.\n\nTheir scouts have been asking which roads lead to the richest towns. Whatever differences divide these chiefs, they seem to have reached an agreement about #R who should pay for their expedition#!."
 zerywani_horde_2.a:0 "Send word to the frontier garrisons!"

 zerywani_horde_3_title:0 "The Call to War"
 zerywani_horde_3_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the chiefs have sent word of their gathering. An expedition is being raised against [SCOPE.sCountry('zerywani_horde_target').GetName|T], and our warriors are eager to take their place among the #Y Zerywani#! riders!\n\nAlready, men who yesterday complained of poor pasture are discussing how many packhorses they will need to bring home their silver. Their fathers offer advice about roads and provisions; their wives offer rather firmer advice about returning alive. Our household has furnished its share of the supplies and warriors, who will serve under the expedition's common commander while remaining men of our own people.\n\nSome chiefs fear that a successful commander might become too fond of giving orders. Others insist that this is a season's undertaking and that every chief will return to his own hearth when it is over. For the young men tightening their saddles outside, the matter seems simpler: they would like their share of those wealthy towns."
 zerywani_horde_3.a:0 "Our warriors shall have their share!"

 zerywani_horde_5_title:0 "The Warbands Return"
 zerywani_horde_5_victory_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the expedition has secured the enemy capital! The #Y Zerywani#! riders have found the wealth their scouts promised them, and there is no shortage of men willing to describe how bravely they fought to obtain it. There is rather less agreement about who deserves the largest share.\n\nChiefs whose warriors rode together through the enemy's gates now dispute the silver laid before them. Each remembers the charge he led, the supplies he furnished, and the neighbor whose men arrived suspiciously late. Our commander has won a city, but judging these claims may prove a more exhausting undertaking than taking its walls.\n\nAt home, the veterans' children hear of paved streets, crowded markets, and houses larger than a chief's hall. Their fathers have shown them that the #Y horsemen#! can take such places. It would hardly be surprising if some of those children grew up wanting a city of their own."
 zerywani_horde_5_defeat_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the expedition is over, and the enemy capital remains beyond our grasp. Riders are returning to their households, some with plunder to show for the campaign and others with wounds that will trouble them for the rest of their lives. The chiefs, naturally, have a great deal to say about whose fault this was.\n\nOne claims that his neighbors withheld their warriors. Another insists that our commander wasted a promising opportunity. Men who agreed readily enough that the civilized towns were rich now disagree over every road, every battle, and every promise made beside the gathering's fires. There may have been silver to win, but there was certainly blame enough to bring home.\n\nThe veterans' sons listen to these accounts as they tend the horses and mend their fathers' gear. They are learning the names of the distant cities, the men who never returned, and the price of trusting a gathering of jealous chiefs."
 zerywani_horde_5.a:0 "Let every chief remember who led them to victory!"
 zerywani_horde_5.b:0 "We shall hear these arguments for years..."

 zerywani_horde_conquest:0 "Zerywani Horde Conquest"

 zerywani_horde_on_the_march:0 "Zerywani Horde on the March"
 zerywani_horde_participant_modifier:0 "Answered the Horde's Call"
 zerywani_horde_under_invasion_modifier:0 "Besieged by the Zerywani Horde"

 zerywani_horde_6_title:0 "What Our Children Will Remember"
 zerywani_horde_6_victory_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the veterans of the #T First Gathering#! have become familiar figures at the winter fires. A man who rode through the enemy capital's gates can generally be persuaded to describe the occasion, especially if someone else is buying his drink. His account seldom grows less impressive with the telling.\n\nThe children favor the stories of crowded markets and captured treasure. Their elders are more interested in the quarrels that followed, when chiefs who had shared the march could scarcely agree on the division of a wagon's contents. They won their prize together, yet each returned concerned above all with his own household's share.\n\nAmong the boys listening are sons who will one day command riders themselves. Some may inherit their fathers' taste for plunder. Others may find themselves wondering what a single ruler could have made of all those warriors and the city they conquered."
 zerywani_horde_6_defeat_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the men who rode with the #T First Gathering#! have brought its arguments into every winter hall. A visitor need only mention the expedition to hear which chief failed to appear, which road should have been taken, and which commander ought never to have been trusted with so many riders.\n\nTheir sons know these stories almost as well as they know the paths to their own pastures. They have heard of comrades left behind and of wealthy towns that seemed, for a moment, close enough to seize. Each father has his own account of why the gathering failed to secure its great prize. Most agree that somebody else was to blame.\n\nOne day these boys will have horses and followers of their own. It remains to be seen whether they will repeat their fathers' quarrels or find someone capable of settling them."
 zerywani_horde_6.a:0 "The boys are listening more closely than we think."
 zerywani_first_plundered:0 "Plundered by the First Gathering"

 zerywani_first_army_name:0 "Warbands of the First Gathering"

 zerywani_horde_6_plunder_desc:0 "My [ROOT.GetCountry.GetRulerTitle], the veterans of the #T First Gathering#! have brought home enough plunder to keep their stories welcome at the winter fires. They describe the towns they stripped, the merchants' silver, and the quarrels that followed when each chief counted his share. The enemy capital, however, remained beyond their lasting grasp.\n\nTheir sons listen particularly closely to the accounts of wealthy streets and crowded storehouses. The fathers have shown them that the #Y horsemen#! can draw riches from the civilized lands, but the chiefs could not turn their expedition into a realm. A man with captured silver on his belt is seldom eager to explain why he came home without the greater prize.\n\nThe boys may grow up content to repeat their fathers' raids. Others may wonder what those same riders could achieve under a ruler capable of keeping them together."

 zerywani_horde_world_title:0 "The Zerywani Horsemen Gather"
 zerywani_horde_world_desc:0 "My [ROOT.GetCountry.GetRulerTitle], messengers bring news of a great gathering in [SCOPE.sCountry('zerywani_horde_leader_scope').GetName|T]. The Zerywani chiefs have answered a common call and sent their riders against [SCOPE.sCountry('zerywani_horde_target').GetName|T].\n\nMerchants describe crowded roads, abandoned pastures, and columns of horsemen carrying the hopes and grievances of many tribes. Courts across Luxterra must reckon with a campaign that could overturn the balance of the central and eastern lands."
 zerywani_horde_world.a:0 "Have our envoys follow their march."
