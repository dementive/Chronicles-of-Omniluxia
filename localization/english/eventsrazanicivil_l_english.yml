 razani_civil_war_1_title: "The Twilight of the Razani"
 razani_civil_war_1_desc: "It's been around a year since the emperor has left his palace or addressed his people.\n\nTime has not been kind to the elderly emperor, nor has it healed his broken heart. He wanders the halls endlessly, occasionally opening a door as if he would find his beloved inside. Instead, all he finds are lifeless chambers and memories of better days. Days of glory, of conquest, where he ruled the known world alongside his love.\n\nNow his days pass without meaning, occasionally interrupted by his son, the only one he allows to see him. However, as their meetings shorten, so does the old man's time, and all the frail emperor can do is lie and dream of better days...\n\nHowever, #E Wisheamu Wachumagel#! pities no man, and the various nobles of the realm are aware that the aging [GetCharacter('(int32)12').GetName] needs an official heir, lest the weakened empire fall into civil conflict. While most of the nobles throw their support behind the skilled [GetCharacter('(int32)137').GetName], they know that the #E Gonessionem#! would not accept him as their emperor, and with unrest rising alongside the spread of the #E Helluvian Heresy#! in the south, they hesitate to support him publicly.\n\n[GetCharacter('(int32)137').GetName], however, is keenly aware in the position he's in. Despite having unofficially ruled the empire through his father, he knows that he would not be able to legitimately take the throne himself without proper support. As an adopted son and a poor general, his only hope to ascend to the throne is to gain the explicit appointment as heir from the emperor himself.\n\nAs the young man sat down to converse with the dying emperor, he lamented the condition his father was in.\n\nPale and prone to coughing fits, the emperor could barely muster enough strength to sit up and face his son.Without a word, the emperor nodded, acquiescing to the young man's demands, aware of what he was there for, and accepted his fate. #E #R Renn#!#! would soon come for him, and he knew he could not protect the boy forever.\n\nWith his royal stamp of approval, the young commoner [GetCharacter('(int32)137').GetName] was now heir apparent to the #E Razani Empire#!, the Empire of the #E True Geallians#!.\n\nAs the news spread across the empire many celebrated the stability an official heir would bring, others still breathed a sigh of relief that their empire would not die alongside the old emperor.\n\nHowever, there were those who did not share these sentiments.\n\nOut of the three #E Gonessionem#!, two have not expressed support for the heir apparant. [GetCharacter('(int32)138').GetName], hero of the #E Battle of Gesma#! and widely popular amongst the empire, was once hailed as emperor by the #E II 'Baetepa'#!, only to be defeated and pardoned by [GetCharacter('(int32)12').GetName]. However, the general's ambition still hasn't been satiated, and there are rumors that he intends to challenge the new heir's claim to the throne."
 razani_civil_war_1.a: "May #E #R Zanis#!#! guide us through these troubled times..."
 razani_civil_war_1_tooltip.a: "#Y [GetCharacter('(int32)137').GetName] has officially been named heir of the #E Razani Empire#!, however [GetCharacter('(int32)138').GetName] may plot to put himself on the throne...#!"

 razani_civil_war_2_title: "The Razani Civil War"
 razani_civil_war_2_desc: "The time has come.\n\nThe old man looks in the corner to see the shadowy figure of #E #R Renn#!#! approaching him. The blue-skinned god approaches him, and as he gets closer, [GetCharacter('(int32)12').GetName] can see him more clearly.\n\nThe death god has taken the form of a tall, bald man, his pitch black eyes stare at [GetCharacter('(int32)12').GetName] with an emotionless expression impossible to read.\n\n'Rise, #E Rhuzemes#!.'\n\nThe emperor gets out of bed without difficulty. The old man feels stronger, taller, younger. He turns to look at his bedside mirror, and is frozen in shock as he gazes upon the face of his younger self.\n\nSmiling, the emperor asks the god:\n\n'Is my beloved amongst the chosen?'\n\nThe stoic god does not react, and simply responds\n\n'Yes'\n\nThe young #E Rhuzemes#!, elated, asks the god:\n\n'Take me to her.'\n\n#E #R Renn#!#! nods, and walks toward the entrance of the room. There, he opens the door to reveal Elysium. Inside, happy faces feast, sing songs, and dance. #E Rhuzemes#! sees great emperors of old, heroes of legend, and even [GetCharacter('(int32)48').GetName] himself.\n\nThe former emperor follows the death god to the entrance but stops before entering the door. #E Rhuzemes#! backs away from the door slowly, much to the confusion of the great #E #R Renn#!#!. The world of the living still beckoning to him, he asks the god:\n\n'What of my son? Will he become an emperor worthy of #E Zanis#!' legacy?'\n\nThe silent god once again does not react. He stares at #E Rhuzemes#! in silence. The former emperor sees his brow furrow.\n\n'Will my son be safe?'\n\nThe great god ruminates for a moment.\n\n'He will find his way to Elysium, great king.'\n\nWith his fears assauged, the young man hesitantly walks back towards the door. Before stepping in, however, he turns, as if hoping to see his child one last time. Met with silence, the emperor takes a deep breath, and walks through the door."
 razani_civil_war_2.a: "Ave #E O-Bantenn#!"
 razani_civil_war_2_tooltip.a: "#Y Defend your throne against the traitor#!"
 razani_civil_war_2.b: "Ave #E Dobpunn#!"
 razani_civil_war_2_tooltip.b: "#Y Rebel against the incapable pretender#!"

 razani_civil_war_3_title: "The Razani Civil War"
 razani_civil_war_3_desc: "Important news from the heirs of the #E Zani#! have reached [ROOT.GetCountry.GetRuler.GetName]'s court!\n\nThe sickly emperor [GetCharacter('(int32)12').GetName] has died, creating a succession crisis between the appointed heir [GetCharacter('(int32)137').GetName] and the great general [GetCharacter('(int32)138').GetName]!\n\nRuling from [GetProvince('(int32)2478').GetName], [GetCharacter('(int32)137').GetName] enjoys the legitimacy that comes from the official appointment as heir from the previous emperor. However, this adopted son is an awkward and cowardly man, hardly someone able firmly grip the reins of a struggling empire.\n\nOpposing him, the proud [GetCharacter('(int32)138').GetName] was the general that defeated #E Jarenam the Formidable#!'s forces at the #E Battle of Gesma#!. Needless to say, such a feat has made him a popular figure amongst the #E Gonessionem#!, with most of them supporting him as the new Emperor.\n\nDespite who wins, such a large civil war after years of external and internal strife is sure to devastate the weary #E Geallians#!, once the masters of #E Omniluxia#!."
 razani_civil_war_3.a: "How far the Zani have fallen"
 razani_civil_war_3_tooltip.a: "#Y [GetCharacter('(int32)138').GetName] and [GetCharacter('(int32)137').GetName] will fight for the throne of the #E [GetCountry('EGA').GetName]#!#!"

 razani_civil_war_4_title: "A New Eastern Emperor"
 razani_civil_war_4_desc: "Great Emperor, important news comes from the east!\n\nThe [GetCountry('EGA').GetName] has fallen into a civil war between the two claimants to the #E Eastern Throne#!, [GetCharacter('(int32)137').GetName] and [GetCharacter('(int32)138').GetName].\n\n[GetCharacter('(int32)138').GetName] is a respected general responsible for the #E Razani#! victory at the #E Battle of Gesma#!, however, [GetCharacter('(int32)137').GetName] was appointed by the previous emperor, [GetCharacter('(int32)12').GetName], as the heir to the #E Razani#! throne.\n\nDespite this war being fought far from our shores, it would behoove your highness to take interest in this conflict, as friendly relations with the victor could entail cooperation with the east against the upstart [GetCountry('JRE').GetName] and [GetCountry('EGY').GetName]. Should the rumors be true, the new emperor is a weak, awkward man who would be easier to manipulate than the proud [GetCharacter('(int32)138').GetName]. Should we support him, he may be more favorable towards us in future conflicts and negotiations.\n\nThat being said, there is a sizable faction at court that would like to see the great #E Purple Emperor#! unite both the east and the west. However, with such a distance between the two empires and with the cost of occupying the land being much too much for us to handle, there have been talks of sending a member of the #E Nazani#! royal family to claim the #E Eastern Throne#! and serve as a junior emperor to [ROOT.GetCountry.GetRuler.GetName]. Should such a plan work, we may be able to finally reunify the #E Geallians#! and reform the #E Zani Empire#!!"
 razani_civil_war_4.a: "We should install our own eastern emperor"
 razani_civil_war_4_tooltip.a: "#Y We will support the #E Nazani#! claim to the Eastern throne#!"
 razani_civil_war_4.b: "We will support the legitimate eastern emperor"
 razani_civil_war_4_tooltip.b: "#Y We will send support to [GetCharacter('(int32)137').GetName]#!"
 razani_civil_war_4.c: "Allow them to fight it out"

 razani_civil_war_5_title: "The Nazani Attack"
 razani_civil_war_5_desc: "Great Emperor, important news comes from the east! There is a man claiming to be the rightful emperor of the east, with rumors circulating that he serves under the #E Nazani#! emperor.\n\nHis forces have landed at the port of [GetProvince('(int32)2348').GetName] and have taken control of the surrounding region. With [GetProvince('(int32)2306').GetName] under his control he now threatens the highland cities of the friendly #E Gunstris#!, which would be a great loss for us.\n\nIf the [GetCountry('WGA').GetName] had indeed claimed your throne, then their armies will stop at nothing to reclaim the east for themselves. However, should we defeat the armies of this pretender we may have a chance of prevailing against the #E Purple Emperor#!."
 razani_civil_war_5.a: "Those weasels will regret this"
 razani_civil_war_5_tooltip: "#R The [GetCountry('WGA').GetName] have declared a surprise war against us for our throne!#!"

 razani_civil_war_6_title: "Nazani Aid"
 razani_civil_war_6_desc: "Great Emperor, some good news has arrived at court! Our brothers from the west, the [GetCountry('WGA').GetName], have sent us aid against our common enemy!\n\nThe magnanimous #E Purple Emperor#! has decided to support the legitimate claimant of the throne in our war against the upstart [GetCharacter('(int32)137').GetName].\n\nTheir help came at a crucial time, as many of our subjects who once questioned your legitimacy now recognize you as the rightful emperor of the #E Razani#!.\n\nShould we win this war, we should strive to cooperate more with the #E Western Emperor#! to reciprocate his kindness."
 razani_civil_war_6.a: "We are grateful to our western brothers"

 razani_civil_war_7_title: "The Helluvian Uprising"
 razani_civil_war_7_desc: "My King, bad news from the capital! While you've been on campaign against the #E Razani#! pretender, your brother, [GetCharacter('(int32)139').GetName], has declared a holy war for the throne!\n\nThe great Philosopher-King [GetCharacter('(int32)94').GetName] would be dismayed at such a sight, however, he would urge you to defeat the upstart [GetCharacter('(int32)139').GetName]. He has offered you only two options: exile or death.\n\nSuch impudence should not go unpunished! You have extended your generosity towards him in the past, having protected him against #E Razani#! persecution and allowing him to practice his faith. However now that same man has raised an army against you at [GetProvince('(int32)3337').GetName] to march on [GetProvince('(int32)3399').GetName]!\n\nHe claims to have seen a vision from the great #E #R Hellas#!#! himself, in which he was told to seize the #E Ytalian#! throne and convert the people to the 'true faith'. He's also been slandering our #E Razani#! allies, proclaiming that he will wrest the independence of [GetCountry('YGA').GetName] from them once he becomes king.\n\nMy king, there is not much time, we must return to the capital at once and aprehend him, lest you lose the throne to masses of #E #R Helluvian#!#! vultures that seek to use your brother's faith for their own gain!"
 razani_civil_war_7.a: "Ave #E Siaan#!, rightful ruler of [GetCountry('YGA').GetName]"
 razani_civil_war_7_tooltip.a: "#Y Defend your throne against the pretender#!"
 razani_civil_war_7.b: "Ave #E Tetem#!, the #E Hammer of Hellas#!"
 razani_civil_war_7_tooltip.b: "#Y Free the Ytalians from their Razani overlords#!"

 razani_civil_war_8_title: "The Ytalians Revolt"
 razani_civil_war_8_desc: "Great Emperor, urgent news comes from the south! The two brothers of the wise king [GetCharacter('(int32)94').GetName] are at war over the throne of [GetCountry('YGA').GetName]!\n\nWhile our subject, King [GetCharacter('(int32)140').GetName] was fighting with us against the pretender #E Dobpunn#!, his brother, [GetCharacter('(int32)139').GetName], has raised an army of his supporters in [GetProvince('(int32)3337').GetName] and now marches on [GetProvince('(int32)3399').GetName]!\n\nA devout #E #R Helluvian#!#!, [GetCharacter('(int32)139').GetName] claims #E Hellas#! has ordained him as the true king of [GetCountry('YGA').GetName], and he vows to convert his realm to the 'true faith'. Once he has done so, he states he wishes to free [GetCountry('YGA').GetName] from #E Zanic#! rule, and refuses to be a vassal of our emperor. Such heresy and disobedience should not be allowed to spread!\n\nIf we are to help our vassal we must do so quickly before the heretical pretender is able to take control of the #E Ytalian#! throne!"
 razani_civil_war_8.a: "Crush them!"
 razani_civil_war_8.b: "We can't spare the men"

 razani_civil_war_9_title: "The Gevanni Uprising"
 razani_civil_war_9_desc: "Great Emperor, alarming news from the east has arrived! It seems the son of the rebellious [GetCharacter('(int32)142').GetName] has led an uprising amongst the [GetProvince('(int32)2470').GetName] elites, recruiting men from the lower classes all around the #E Neo Ytalianes#! to join their cause.\n\nIf you can recall, [GetCharacter('(int32)142').GetName] was the man who inspired rebellion against governor [GetCharacter('(int32)143').GetName] a few years ago, and was arrested for high treason against the state. His constant demands for the reduction of noble privileges and estates just reflects the naiveté of those who still believe the #E Gevanni Senate#! still wield any power. However his messages inspired an uneasy amount of unrest in the city, thus he had to be imprisoned. Unfortunately, it seems his ideas still remained popularity amongst the masses, particularly in the areas surrounding [GetProvince('(int32)2470').GetName], and despite the best efforts of governor [GetCharacter('(int32)143').GetName] to crack down on dissent, all it took was a single match to light the fires of rebellion.\n\nReports indicate that the governor as well as other important nobles in the region were beheaded by a man who claimed to be the son of #E Zorgolis#!, called [GetCharacter('(int32)144').GetName].\n\nWhile I have no doubt this rebellion can be quenched, I worry that their ideas may inspire further rebellions in future. Therefore it's best if we put down this uprising quickly and quietly."
 razani_civil_war_9.a: "They dare defy the emperor?"

 razani_civil_war_11_title: "The Great Migration"
 razani_civil_war_11_desc: "My Q !"
 razani_civil_war_11.a: "Does the lion feel guilty about taking down a lamb?"
 razani_civil_war_11_tooltip: "#G We have managed to defeat the Etaredicans and hold together our Empire!#!"

 razani_civil_war_12_title: "The Duny Invasions"
 razani_civil_war_12_desc: "My Qhag "
 razani_civil_war_12.a: "We shall crush this pretender!"
 razani_civil_war_12_tooltip: "#R [GetCharacter('(int32)117').GetName] has declared himself the true successor of Jarenam!#!"

 razani_civil_war_13_title: "The Fall of the Jarenam Empire"
 razani_civil_war_13_desc: "News about the sickly [GetCountry('JRE').GetName] has arrived to us from #E Western Luxterra#! !"
 razani_civil_war_13.a: "Fate is a fickle thing."
 razani_civil_war_13_tooltip: "#R The #E Jarenam Empire#! has fallen into civil war and uprisings!#!"

 razani_civil_war_14_title: "Refugees from the Jarenam Empire"
 razani_civil_war_14_desc: "This morning, some uninvited guests arrived at our court in [ROOT.GetCountry.GetCapital.GetName] with terrible news, my [ROOT.GetCountry.GetRulerTitle]. The armies of [GetCharacter('(int32)29').GetName] and [GetCharacter('(int32)117').GetName] have laid waste to #E Bhaxnmrechtem#! in their struggle over control of what remains of #E Jarenam the Formidable#!'s empire. The ensuing destruction that's taking place defies belief - we shall spare you the details - but know that the smoke of burning cities can be seen from Morrigon.\n\nYet all is not lost; many nobles from the great tribes of who once followed #E Jarenam#! managed to escape, and hundreds of refugee ships have sailed across the #E Intergealian Sea#! for the safe harbors of [GetProvince('(int32)5017').GetName] - but what a tragedy! The same Dragkhanic city that launched the invasion of Luxterra now sees its broken sons and daughters return empty-handed.\n\nThe leader of these displaced nobles is a man named [SCOPE.sCharacter('jarenam_magistrate_1').GetName], a man with a bloodline connection to the ancient founders of [GetProvince('(int32)5017').GetName], and he has made a bold request to you, my Lord. He asks that we grant him rights to rule over the city of Zemmairthia in our name, vowing to serve the [ROOT.GetCountry.GetName] as a loyal vassal. [SCOPE.sCharacter('jarenam_magistrate_1').GetFirstName] promises that he will one day return to restore order to [GetProvince('(int32)4588').GetName], but only if we can help him."

 razani_civil_war_15_title: "The Jarenam Ulus"
 razani_civil_war_15_desc: "Word from [GetProvince('(int32)5017').GetName], [ROOT.GetCountry.GetRuler.GetName] - [SCOPE.sCharacter('jarenam_magistrate_1').GetName] has quickly taken over the administration of the city and is doing everything that he can to establish his seat of power. The locals still honor the [SCOPE.sCharacter('jarenam_magistrate_1').GetFamilyDisplayAdjective] name and welcomed their new overlord with open arms.\n\nMore refugees are continuing to arrive at the city, bringing tales of woe and devastation - the various civil wars and rebellions are taking their toll on our kinsmen, enslaving hundreds and killing with a reckless regard for life.\n\nThese horror stories have only shorn up the resolve of [SCOPE.sCharacter('jarenam_magistrate_1').GetFirstName] to one day bring order to his homeland, but for now, he plots and waits."

 razani_civil_war_16_title: "Horses Of The Jarenam"
 razani_civil_war_16_desc: "[ROOT.GetCountry.GetRuler.GetName] has taken great pains to ensure that the soldiers of the [ROOT.GetCountry.GetName] have everything that they ask for, and because our armies have need of the best horses in all of #E Luxterra#!, the [ROOT.GetCountry.GetRulerTitle] has wisely invested in building serf estates throughout the land.\n\nThanks to these efforts to increase the size of our herds, our soldiers are able to train more than ever before - our cavalry shall remain undefeated on the battlefield."
 razani_civil_war_16.a: "Our armies shall conquer all of Luxterra and beyond!"
 razani_civil_war_16_tooltip: "The mission task '#Y Horses Of The Jarenam#!' has now been #G Completed#!!"
 jarenam_mission_tree_task_3_tt: "At least #Y 3#! territories in the regions of [GetProvince('(int32)4226').GetArea.GetName|Y], [GetProvince('(int32)3254').GetArea.GetName|Y] and [GetProvince('(int32)3670').GetArea.GetName|Y] that produce #Y Horses#! @horses! have a #Y Serf Estate#! building."


 # OLD
 razani_civil_war.1.title: "The prelude to civil war"
 razani_civil_war.1.desc:0 "It is a prelude to civil war, emperor Rhuzemes has ruled over the zani empire for a long time and his reign wasn't very peaceful, yet it was still better than the reign of his predecessors that let the empire slowly crumble and eventually collapse as it has done now..\nNo one knows what will happen with the empire but we are sure of one thing, there will be a civil war, it is inevitable.."
 razani_civil_war.1.a:0 "The strugle has started."
 razani_civil_war.2.title:0 "At the brink of civil war"
 razani_civil_war.2.desc:0 "Civil war is coming and as we all know, the rebels have been planing this for years but they too need more time, that time we can use for our advantage, we need to gather our troops in a safe haven and prepare to fend off the rebels.\nNazani speaks for themselves, we need to be cautious with those who sympathise with the old ways as they have hope that one day we will return to it."
 razani_civil_war.2.a:0 "It is the end of an era."
 razani_civil_war.3.title:0 "Rebellion of the Ytalians"
 razani_civil_war.3.desc:0 "Ytalian tribes have risen up and declared their sovereignty, their leaders know that we are in though spot and we aren't equipped to handle this uprising."
 razani_civil_war.3.a:0 "We will crush them, they stand no chance against the empire." 
 razani_civil_war.3.b:0 "Let it slide, we have bigger problems." 
 razani_civil_war.3.c:0 "A peaceful resolution is the only way." 
 razani_civil_war.4.title:0 "The war has come"
 razani_civil_war.4.desc:0 "It's been a long time yet everything finally comes to an end."
 razani_civil_war.4.a:0 "For the rebelion. For the new hope."
 razani_civil_war.4.b:0 "Stand by the empire and make thoes trariots pay."
 razani_civil_war.5.title:0 "Grand finale"
 razani_civil_war.5.desc:0 "The war has been bloody and hasn't made anything easier."
 razani_civil_war.5.a:0 "The empire prevails as always!"
 razani_civil_war.5.b:0 "The imperium of Zani returns to the maps once more!"
 razani_civil_war.5.c:0 "It's time for change!"
 razani_civil_war.9.title:0 "Our stance in Razani civil war"
 razani_civil_war.9.desc:0 "We have recieved letters from the faction that supports the reunification of our empires within the Razani empire. They wish to grant the imperial crown to you, your Majesty."
 razani_civil_war.9.a:0 "Support them so we may reunify."
 razani_civil_war.9.b:0 "Let us not intervene in the affairs of our breathren."
 razani_civil_war.9.c:0 "We need to support the Razani and help them crush this rebellion."
 razani_civil_war.10.title:0 "Nazani supports the rebels!"
 razani_civil_war.10.desc:0 "The empire of Nazani has decided to support the faction of those madmans who seek to unify the empires."
 razani_civil_war.10.a:0 "Thats horrifying"
 razani_civil_war.11.title:0 "Nazani supports US!"
 razani_civil_war.11.desc:0 "Nazani has send us soldiers and gold to aid us in our war"
 razani_civil_war.11.a:0 "Magnificent" 
 
 
 
 