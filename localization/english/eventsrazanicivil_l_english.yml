# Decisions
 remove_imperial_council: "Abolish the Imperial Council"
 remove_imperial_council_desc: "Ever since its inception during the reign of #Y Osezu the Reformer#!, the #T Imperial Council#! has served to check the #Y Emperor#!'s power and provide a voice for the minor houses of the #Y Zani dynasty#!. Initially, the council served the state faithfully, providing legitimacy and stability to the emperor while they managed such a large realm. However, corruption slowly turned the council into kingmakers. Their growing power inflated their confidence, which would lead to the #Y Imperial Purge of 690 LC#!, instigated by #Y Rozunse Razani#! after the murder of #Y O-punnz the Great Restorer#!.\n\nAlthough their power was diminished for many centuries, the institution of the #T Theon System#! and the wealth provided by the #Y Amsinenne#! have once again brought the nobility on the #T Imperial Council#! enough influence to challenge even the emperor. We must finally curtail all threats to the #Y Shanuzushanuz's#! authority and finish what the great #Y Rozunse Razani#! began." 
 remove_razani_council_ttp: "#R The #E Imperial Council#! will rise in rebellion to preserve their power#!"
 remove_theon_system: "Abolish the Theon System"
 remove_theon_system_desc: "Beginning around the rule of Brenzun #T Razani#! in the 800s LC the #T Razani#! began to experiment with a new system made to govern their battered and overextended realm. Inspired by the #Y Gashanuzte System#! of the early #T Zani Empire#!, the #T Shanuzushanuz#! of the East would slowly delegate more military and civil authority to local governors, who would in turn defend the empire against outside threats. Eventually, these practices would evolve into the #T Theon System#!, where powerful #Y Vadatheons#! and #Y Lisintheons#! would help administer and defend the diminished empire at a fraction of the cost for the central bureaucracy.\n\nWhile this system served the #T Razani#! well at a time where many questioned whether the empire would survive to see the new millennium, it now serves as a source of its decline. If the #T Razani#! are to once again rise to be the premier power of the east, they must first get rid of the scheming #Y Esemamshauza#! and #T Gonessemshom#! that consistently check #Y [GetProvince('(int32)2478').GetName]'s#! authority."
 remove_amsinenne: "Abolish the Amsinenne"
 remove_amsinenne_desc: "While noble land grants and slavery have been present in the #T Zani Empire#! since its inception, the modern #Y Amsinenne#! have become a key part of the #T Razani#! economy. These large slave estates were consolidated by noble families over generations, and combined with the #T Theon System#! have ensured that political and economic power remain with a select few noble families across the empire.\n\nThis cancerous system not only spurs unrest amongst the wider populace, but provides the emperor's rivals the wealth and influence necessary to challenge imperial authority. If we have any hope of surviving these next tumultuous decades, we must abolish this antiquated institution."
 remove_razani_slavery_ttp: "#R Powerful nobles will rise in rebellion to preserve their power#!"
 gain_imperial_council_approval: "Curry Favor with the Imperial Council"
 gain_imperial_council_approval_desc: "Although the #T Imperial Council#! does not currently support our reign, its members are notorious for their fickle nature. If we can gain the support of the right people with a few bribes and promises, we should be able to gain their support once more."

 # OLD
 razani_civil_war.1.title: "The prelude to civil war"
 razani_civil_war.1.desc:0 "It is a prelude to civil war, emperor #Y Rhuzemes#! has ruled over the zani empire for a long time and his reign wasn't very peaceful, yet it was still better than the reign of his predecessors that let the empire slowly crumble and eventually collapse as it has done now..\nNo one knows what will happen with the empire but we are sure of one thing, there will be a civil war, it is inevitable.."
 razani_civil_war.1.a:0 "The strugle has started."
 razani_civil_war.2.title:0 "At the brink of civil war"
 razani_civil_war.2.desc:0 "Civil war is coming and as we all know, the rebels have been planing this for years but they too need more time, that time we can use for our advantage, we need to gather our troops in a safe haven and prepare to fend off the rebels.\nNazani speaks for themselves, we need to be cautious with those who sympathise with the old ways as they have hope that one day we will return to it."
 razani_civil_war.2.a:0 "It is the end of an era."
 razani_civil_war.3.title:0 "Rebellion of the Ytalians"
 razani_civil_war.3.desc:0 "#Y Ytalian#! tribes have risen up and declared their sovereignty, their leaders know that we are in though spot and we aren't equipped to handle this uprising."
 razani_civil_war.3.a:0 "We will crush them, they stand no chance against the empire." 
 razani_civil_war.3.b:0 "Let it slide, we have bigger problems." 
 razani_civil_war.3.c:0 "A peaceful resolution is the only way." 
 razani_civil_war.4.title:0 "The war has come"
 razani_civil_war.4.desc:0 "It's been a long time yet everything finally comes to an end."
 razani_civil_war.4.a:0 "For the rebellion. For the new hope."
 razani_civil_war.4.b:0 "Stand by the empire and make thoes trariots pay."
 razani_civil_war.5.title:0 "Grand finale"
 razani_civil_war.5.desc:0 "The war has been bloody and hasn't made anything easier."
 razani_civil_war.5.a:0 "The empire prevails as always!"
 razani_civil_war.5.b:0 "The imperium of Zani returns to the maps once more!"
 razani_civil_war.5.c:0 "It's time for change!"
 razani_civil_war.9.title:0 "Our stance in Razani civil war"
 razani_civil_war.9.desc:0 "We have received letters from the faction that supports the reunification of our empires within the #T Razani#! empire. They wish to grant the imperial crown to you, your Majesty."
 razani_civil_war.9.a:0 "Support them so we may reunify."
 razani_civil_war.9.b:0 "Let us not intervene in the affairs of our breathren."
 razani_civil_war.9.c:0 "We need to support the Razani and help them crush this rebellion."
 razani_civil_war.10.title:0 "Nazani supports the rebels!"
 razani_civil_war.10.desc:0 "The empire of #Y Nazani#! has decided to support the faction of those madmans who seek to unify the empires."
 razani_civil_war.10.a:0 "Thats horrifying"
 razani_civil_war.11.title:0 "Nazani supports US!"
 razani_civil_war.11.desc:0 "#Y Nazani#! has send us soldiers and gold to aid us in our war"
 razani_civil_war.11.a:0 "Magnificent" 
 
 
 
 
