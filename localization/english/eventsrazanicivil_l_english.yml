l_english:
 
 razani_civil_war_1_title: "The Twilight of the Razani"
 razani_civil_war_1_desc: "It's been around a year since the emperor has left his palace or addressed his people.\n\nTime has not been kind to the elderly emperor, nor has it healed his broken heart. He wanders the halls endlessly, occasionally opening a door as if he would find his beloved inside. Instead, all he finds are lifeless chambers and memories of better days. Days of glory, of conquest, where he ruled the known world alongside his love.\n\nNow his days pass without meaning, occasionally interrupted by his son, the only one he allows to see him. However, as their meetings shorten, so does the old man's time, and all the frail emperor can do is lie and dream of better days...\n\nHowever, #Y Wisheamu Wachumagel#! pities no man, and the various nobles of the realm are aware that the aging [GetCharacter('(int32)228').GetName|Y] needs an official heir, lest the weakened empire fall apart. Those who know him throw their support behind the skilled #Y [GetCharacter('(int32)229').GetFirstName]#!, as they trust his administrative skills and clever mind. While these qualities would make for an excellent scholar, there is more to ruling than paperwork. A poor general and an even worse orator, #Y [GetCharacter('(int32)229').GetFirstName]#! inspires little loyalty amongst his troops or influential nobles. With the #T Helluvian#! threat continuing to cause trouble in the south, there are many inside the #G Blue Marble Palace#! that hesitate to support his rule publicly. Worse, the #T Imperial Council#! remains silent on whether they approve of his succession. Although the young prince carries #Y Zanic#! blood, his poor military reputation leaves many traditional council members unwilling to support his accession.\n\nA relentless planner, #Y [GetCharacter('(int32)229').GetFirstName]#! knows that he would not be able to legitimately take the throne in his current position. Without full support from either the army or the #T Imperial Council#! it is more likely he would face exile than become #T Shanuzushanuz#!. Although the odds seemed to have stacked against him, he does have one final chance at securing enough support to possibly ensure his ascension to the throne: an explicit appointment as heir by the emperor himself. Such a powerful move typically reserved only for emergencies would bypass the kingmaking power of both the #T Imperial Council#! and the #Y Gonessionem#!, making it the only way forward.\n\nAs the young man sat down to converse with the dying emperor, he lamented the condition his father was in.\n\nPale and prone to coughing fits, the emperor could barely muster enough strength to sit up and face his son. Without a word, the emperor nodded, acquiescing to the young man's demands, aware of what he was there for, and accepted his fate. #Y #R Renn#!#! would soon come for him, and he knew he could not protect the boy forever.\n\nWith his imperial stamp of approval, the young prince was now heir apparent to the great #T Eastern Empire of the Zani#!.\n\nAs the news spread across the empire many celebrated the stability an official heir would bring, others still breathed a sigh of relief that their empire would not die alongside the old emperor.\n\nHowever, there were those who did not share these sentiments.\n\nOut of the four #Y Gonessionem#! remaining, two have not expressed support for the heir apparent. [GetCharacter('(int32)125').GetName|Y], hero of the #Y Battle of Gesma#! continued to enjoy widespread popular across the empire even after his appointment to the far west. #Y [GetCharacter('(int32)229').GetFirstName]'s#! opponents on both the #T Imperial Council#! and the #Y XV Intermarenica#! still remember his ambitious bid for the throne, and many of them were part of the advisory group that convinced #T Shanuzushanuz#! #Y [GetCharacter('(int32)228').GetFirstName]#! to pardon the young general. Rumors say his ambitions haven't been satiated, and he's currently biding his time until the elderly emperor passes on to make his play for the throne.\n\nAs the weeks pass, officials speak in hushed tones of the council's support for the young #Y Uzani#! general play for the throne. Perhaps it is just hearsay, but rumors that pass through the walls of the #G Blue Marble Palace#! are hardly ever pure fabrications..."
 razani_civil_war_1.a: "May #E #R Zanis#!#! guide us through these troubled times..."
 razani_civil_war_1_tooltip.a: "#Y #E [GetCharacter('(int32)229').GetFirstName]#! has officially been named heir of the [GetCountry('EGA').GetName], however the #E Imperial Council#! supports #E [GetCharacter('(int32)125').GetFirstName]'s#! claim to the throne...#!"

 razani_civil_war_2_title: "The Razani Civil War"
 razani_civil_war_2_desc: "The time has come.\n\nThe old man looks in the corner to see the shadowy figure of #Y #R Renn#!#! approaching him. The blue-skinned god approaches him, and as he gets closer, [GetCharacter('(int32)228').GetName|Y] can see him more clearly.\n\nThe death god has taken the form of a tall, bald man, his pitch black eyes stare at [GetCharacter('(int32)228').GetName|Y] with an emotionless expression impossible to read.\n\n'Rise, #Y Rhuzemes#!.'\n\nThe emperor gets out of bed without difficulty. The old man feels stronger, taller, younger. He turns to look at his bedside mirror, and is frozen in shock as he gazes upon the face of his younger self.\n\nSmiling, the emperor asks the god:\n\n'Is my beloved amongst the chosen?'\n\nThe stoic god does not react, and simply responds\n\n'Yes'\n\nThe young #Y Rhuzemes#!, elated, asks the god:\n\n'Take me to her.'\n\n#Y #R Renn#!#! nods, and walks toward the entrance of the room. There, he opens the door to reveal Elysium. Inside, happy faces feast, sing songs, and dance. #Y Rhuzemes#! sees great emperors of old, heroes of legend, and even [GetCharacter('(int32)168').GetName|Y] himself.\n\nThe former emperor follows the death god to the entrance but stops before entering the door. #Y Rhuzemes#! backs away from the door slowly, much to the confusion of the great #Y #R Renn#!#!. The world of the living still beckoning to him, he asks the god:\n\n'What of my son? Will he become an emperor worthy of #T Zanis#!' legacy?'\n\nThe silent god once again does not react. He stares at #Y Rhuzemes#! in silence. The former emperor sees his brow furrow.\n\n'Will my son be safe?'\n\nThe great god ruminates for a moment.\n\n'He will find his way to Elysium, great king.'\n\nWith his fears assauged, the young man hesitantly walks back towards the door. Before stepping in, however, he turns, as if hoping to see his child one last time. Met with silence, the emperor takes a deep breath, and walks through the door."
 razani_civil_war_2.a: "All hail #E O-Bantenn#!"
 razani_civil_war_2_tooltip.a: "#Y #E O-Bantenn#! must defend his throne against the pretender!#!"
 razani_civil_war_2.b: "All hail #E Dobpunn#!"
 razani_civil_war_2_tooltip.b: "#Y Take your rightful throne from the #E Razani#!!#!"
 razani_civil_war_2_tooltip.c: "#Y Support the rightful ruler of #E Eagelia#!!#!"

 razani_civil_war_3_title: "The Razani Civil War"
 razani_civil_war_3_desc: "Important news from the heirs of the #Y Zani#! have reached #Y [ROOT.GetCountry.GetRuler.GetFirstName]'s#! court!\n\nThe sickly emperor [GetCharacter('(int32)228').GetName|Y] has died, creating a succession crisis between the appointed heir [GetCharacter('(int32)229').GetName|Y] and the great general [GetCharacter('(int32)125').GetName|Y]!\n\nRuling from [GetProvince('(int32)2478').GetName|G], #Y [GetCharacter('(int32)229').GetFirstName]#! enjoys the legitimacy that comes from the official appointment as heir from the previous emperor. However, this son is an awkward and cowardly man, hardly someone able firmly grip the reins of a struggling empire.\n\nOpposing him, the proud #Y [GetCharacter('(int32)125').GetFirstName]#! was the general that defeated #Y Jarenam the Formidable#!'s forces at the #Y Battle of Gesma#!. Needless to say, such a feat has made him a popular figure amongst the #Y Gonessionem#!, with most of them supporting him as the new #Y Emperor#!.\n\nDespite who wins, such a large civil war after years of external and internal strife is sure to devastate the weary #Y Geallians#!, once the masters of #G Omniluxia#!."
 razani_civil_war_3.a: "How far the Zani have fallen"
 razani_civil_war_3_tooltip.a: "#Y [GetCharacter('(int32)125').GetName] and [GetCharacter('(int32)229').GetName] will fight for the throne of the #E [GetCountry('EGA').GetName]#!#!"

 razani_civil_war_4_title: "A New Eastern Emperor"
 razani_civil_war_4_desc: "Great #T Shanuzushanuz#!, important news comes from the east!\n\nThe [GetCountry('EGA').GetName|T] has fallen into a civil war between the two claimants to the #Y Eastern Throne#!, [GetCharacter('(int32)229').GetName|Y] and [GetCharacter('(int32)125').GetName|Y].\n\n[GetCharacter('(int32)125').GetName|Y] is a respected general responsible for the #T Razani#! victory at the #Y Battle of Gesma#!, however, [GetCharacter('(int32)229').GetName|Y] was appointed by the previous emperor, [GetCharacter('(int32)228').GetName|Y], as the heir to the #T Razani#! throne.\n\nDespite this war being fought far from our shores, it would behoove your highness to take interest in this conflict, as friendly relations with the victor could entail cooperation with the east against the upstart [GetCountry('JRE').GetName|T] and [GetCountry('EGY').GetName|T]. Should the rumors be true, the new #Y Emperor#! is a weak, awkward man who would be easier to manipulate than the proud [GetCharacter('(int32)125').GetName|Y]. Should we support him, he may be more favorable towards us in future conflicts and negotiations.\n\nThat being said, there is a sizable faction at court that would like to see the great #T Purple Emperor#! unite both the east and the west. However, with such a distance between the two empires, the possible cost of occupying large tracts of far-off eastern lands may be too expensive for us to handle. Nevertheless, such an opportunity should not be dismissed without being given proper consideration. Should such a plan work, we may be able to finally reunify the #Y Geallians#! and reform the #T Zani Empire#!!\n\nWhatever choice the #T Purple Emperor#! makes, it is sure to be an expensive endeavor, and the best choice might just be to allow the east to solve its own issues."
 razani_civil_war_4.a: "I am the legitimate eastern Emperor!"
 razani_civil_war_4_tooltip.a: "#Y We will support the #E Nazani#! claim to the Eastern throne#!"
 razani_civil_war_4.b: "We will support the legitimate eastern Emperor!"
 razani_civil_war_4_tooltip.b: "#Y We will send support to [GetCharacter('(int32)229').GetName]#!"
 razani_civil_war_4.c: "Allow them to fight it out"

 razani_civil_war_5_title: "The Nazani Attack"
 razani_civil_war_5_desc: "#Y Noble#! #T Shanuzushanuz#!, important news comes from the east! An army serving the #Y Nazani#! emperor has landed in the east, claiming the #Y Eastern Throne#!!\n\n#![GetCharacter('(int32)326').GetFirstName|Y]#!' forces have landed at the port of [GetProvince('(int32)2348').GetName|G] and has taken control of the surrounding region. With [GetProvince('(int32)2306').GetName|G] under his control, he now threatens the highland cities of the friendly #Y Gunstris#!, which would be a great loss for us.\n\nIf these reports are true, then the armies of the [GetCountry('WGA').GetName|T] will stop at nothing to reclaim the east for themselves. The only hope for the #Y Emperor of the East#! is to defeat the armies of the #T Purple Emperor#! before he's able to ship over more of his forces across the mighty #G Intergealian Sea#!!"
 razani_civil_war_5.a: "Those weasels will regret this"
 razani_civil_war_5_tooltip: "#R The [GetCountry('WGA').GetName] have declared a surprise war against us for our throne!#!"

 razani_civil_war_6_title: "Nazani Aid"
 razani_civil_war_6_desc: "#Y Noble#! #T Shanuzushanuz#!, some good news has arrived at court! Our brothers from the west, the [GetCountry('WGA').GetName|T], have sent us aid against our common enemy!\n\nThe magnanimous #T Purple Emperor#! has decided to support the legitimate claimant of the throne in our war against the upstart [GetCharacter('(int32)229').GetName|Y].\n\nTheir help came at a crucial time, as many of our subjects who once questioned your legitimacy now recognize you as the rightful emperor of the #T Razani#!.\n\nShould we win this war, we should strive to cooperate more with the #Y Western Emperor#! to reciprocate his kindness."
 razani_civil_war_6.a: "We are grateful to our western brothers"

 razani_civil_war_7_title: "The Hammer Awakens"
 razani_civil_war_7_desc: "My King, troubling news from the capital!\n\nWhile you've been on campaign against the #Y Uzani#! pretender, your brother, [GetCharacter('(int32)126').GetName|Y], has crowned himself king by his #T Helluvian#! supporters near [GetProvince('(int32)3337').GetName|G] and declared a holy war for the throne! Reports indicate that his army now marches towards [GetProvince('(int32)3399').GetName|G] intending to gather more support along the way.\n\nSuch a tragedy must have been the result of the #T Helluvian#! plague that infected the mind of the young prince at an early age. By your majesty's generosity alone he was allowed to continue to practice his faith in secret, protected from the prying eyes of #T Razani#! inquisitors, as your father would have wanted. The same man would now weep at seeing his only sons fight each other in a fatal struggle over the throne.\n\nDue to his history as a dependable general loyal to the crown, it is clear to the court who has been manipulated by the #T Helluvian#! dissidents of the eastern hills. While #Y [GetCharacter('(int32)126').GetFirstName]#! publicly portrays himself as a liberator who intends to free #G Ytalia#! from #T Razani#! chains, his supporters secretly claim he will place the glory of #T Hellas#! atop the false gods of #G Zanis Zani#! to win the support of the growing #T Helluvian#! population of our nation! \n\nThe more we hear of the #T Helluvian#! superstition that infects our nation, the more our court is convinced that the young upstart must be made an example of. As both a sacrilegist and a traitor, there are more than enough reasons to imprison and execute #Y [GetCharacter('(int32)126').GetFirstName]#! before his movement can gain enough momentum to truly threaten your throne! We will not allow the #T Helluvian#! vultures to divide our nation and take the minds of our brothers and sisters!"
 razani_civil_war_7.a: "All hail #E Siaan#!, rightful ruler of [GetCountry('YGA').GetName]"
 razani_civil_war_7_tooltip.a: "#Y Defend your throne against the pretender#!"
 razani_civil_war_7.b: "All hail #E Tetem#!, the #E Hammer of Hellas#!"
 razani_civil_war_7_tooltip.b: "#Y Free the Ytalians from their Razani overlords#!"

 razani_civil_war_8_title: "The Ytalians Revolt"
 razani_civil_war_8_desc: "Magnanimous Shanuzushauz, urgent news arrives from the south! It appears that the two brothers of the wise king [GetCharacter('(int32)83').GetName|Y] are at war over the throne of [GetCountry('YGA').GetName|T]!\n\nWhile our subject, King #Y [GetCharacter('(int32)127').GetFirstName]#! was fighting with us against the pretender #Y Dobpunn#!, his brother, #Y [GetCharacter('(int32)126').GetFirstName]#!, has raised an army of his supporters in [GetProvince('(int32)3337').GetName|G] and now marches on [GetProvince('(int32)3399').GetName|G]!\n\nA devout #Y #R Helluvian#!#!, #Y [GetCharacter('(int32)126').GetFirstName]#! claims #T Hellas#! has ordained him as the true king of a free #G Ytalia#!, and he vows to enforce his dangerous superstitions on the loyal citizens of #G Ytalia#!. He has refused any offers at peace, and has stated he will not end his Omostthanat until his people are no longer 'heathens' or vassals of our great empire. With enough unrest brewing due to the ongoing civil war, such flagrent heresy and disobedience must not be allowed to spread!\n\nIf we decide to commit to defending our #Y Lisintheon#! we must do so quickly before the heretical pretender is able to take control of the #Y Ytalian#! throne!"
 razani_civil_war_8.a: "Crush them!"
 razani_civil_war_8.b: "We can't spare the men"

 razani_civil_war_9_title: "The Gevanni Uprising"
 razani_civil_war_9_desc: "Great #Y Emperor#!, alarming news from the #Y Gevannia Vadatheon#! has just arrived!\n\nReports indicate that the son of the rebellious [GetCharacter('(int32)129').GetName|Y] is leading an uprising against the [GetProvince('(int32)2470').GetName|G] elites, recruiting men from both the local aristocracy and the lower classes across #G Gevannia#! to join their cause.\n\nIf you can recall, #Y [GetCharacter('(int32)129').GetFirstName]#! was the man who inspired rebellion against governor [GetCharacter('(int32)230').GetName|Y] a few years ago, and was arrested for high treason against the state. His constant demands for the reduction of noble privileges and estates just reflects the naiveté of those who still believe the #Y Gevanni Senate#! still wields any power.\n\nHowever, his message inspired an threatening amount of unrest in the city, thus he was rightly imprisoned and executed. Unfortunately, it seems his ideas still remained popularity amongst the masses, particularly in the areas surrounding [GetProvince('(int32)2470').GetName|G], and despite the best efforts of governor #Y [GetCharacter('(int32)230').GetFirstName]#! to crack down on dissent, all it took was a single match to light the fires of rebellion.\n\nReports indicate that the governor as well as other important nobles in the region were beheaded by the son of #Y Zorgolis#!, a man named #Y [GetCharacter('(int32)231').GetFirstName]#!.\n\nWhile I have no doubt this rebellion can be quenched, I worry that their ideas may inspire further rebellions in future. Therefore it's best if we put down this uprising quickly and quietly."
 razani_civil_war_9.a: "They dare defy the emperor?"

 razani_civil_war_11_title: "The Great Migration"
 razani_civil_war_11_desc: "[ROOT.GetCountry.GetRuler.GetName|Y], uniter of the five tribes of #Y Dzunge Duny#!, has received a vision from the sky god himself!\n\nIn the vision, [ROOT.GetCountry.GetRuler.GetName|Y] was surrounded by fields of wheat. The weary man laid down and closed his eyes. He could hear the sounds of children playing in the distance, he could feel the gentle breeze cooling his skin, and he could smell the delicious scent of warm bread in the air.\n\nThe chief wondered if this was the domain of #Y Dzunge Duny#!, had he died so quickly after uniting his people? Could they not also enjoy such a paradise on earth? The chief lays and contemplates for what feels like an eternity.\n\nSuddenly, a foreign prescence brings the chief out of his trance. The sun's warm rays seem brighter, and #Y [ROOT.GetCountry.GetRuler.GetFirstName]#! hears a voice from the heavens.\n\n'#Y Atadunyri#!, you have not yet crossed into my domain.'\n\nStunned, the chief struggles to look at the blazing light eminating from the sky. This must be the great sky god #Y Dzunge Duny#! himself!\n\n'Oh great #Y Dzunge Duny#!', asked the chief, 'Is it possible to achieve such a paradise on earth?'\n\nThe great god chuckles, a sound full of warmth that reverberates through #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!'s body.\n\n'Yes, my son. This is not a vision of paradise, but of the future. Travel north until you find a land filled with plentiful fields underneath a great mountain. There I shall reveal myself to you and watch over your people.'\n\n...\n\nThe chief awakes.\n\n He confers with the other chiefs of his new realm, explaining the vision and his new mission. Together, they reach a consensus:"
 razani_civil_war_11.a: "We will follow the great #E Dzunge Duny#!!"
 razani_civil_war_11_tooltip.a: "#Y Our people will migrate north!#!"
 razani_civil_war_11.b: "We should focus on protecting our current homelands"
 razani_civil_war_11_tooltip.b: "#Y Our hosts will raid the weakened Ytalians!#!"

 razani_civil_war_13_title: "The Duny Invasions"
 razani_civil_war_13_desc: "My lord, urgent news comes from #Y Central Intermarenica#!! It seems the southern nomadic #Y Duny#! peoples have united under one banner, and their armies and families now occupy large swathes of the #Y Illorian#! homelands!\n\nSuch a terrifying development sets a dangerous precendent for other nomadic tribes and monstrous peoples. Should they decide to follow in the footsteps of the godless horsemen we may find ourselves at the other end of their arrows! Let us hope that their migratory hosts are crushed by the more sophisticated #Y [GetCountry('EGA').GetName]#! and #Y Illorians#!."
 razani_civil_war_13.a: "They won't get far"
 razani_civil_war_13_tooltip: "#R The #E Duny#! have migrated into #E Intermarenica#! in search of a new homeland!#!"

 razani_civil_war_14_title: "Visions of Hellas"
 razani_civil_war_14_desc: "Having arrived in the lands promised to him, [ROOT.GetCountry.GetRuler.GetName|Y] goes up what his people now call #Y Mount Dzunge Duny#!, home of the great sky god.\n\nThroughout the arduous journey the chief sees visions of the great god himself, beckoning him to meet him at the peak. After nearly a week of travel, the determined #Y [ROOT.GetCountry.GetRuler.GetFirstName]#! searches for his god, and is met with a hallowing silence. But the chief's faith is unshaken, and he spends the entire day searching, praying, and calling out to the great #Y Dzunge Duny#!. With no response, the devout #Y [ROOT.GetCountry.GetRuler.GetFirstName]#! sets up camp, and rests.\n\nThat night, the chief is awoken from his slumber by a blinding light. Leaving his tent, the chief looks up and is nearly blinded. Although he can scarcely make out the form of what he assumes is #Y Dzunge Duny#!, his form and white hair is reminiscent of the paintings of the god of his #T Helluvian#! subjects. Amazed at the spectacle, he asks:\n\n'Are you my lord, the great god #Y Dzunge Duny#! who has led his people to salvation once more?'\n\nThe being responds:\n\n'Yes, to your people I am known as #Y Dzunge Duny#!. To the #Y Illorians#!, #Y #Y Hellas#!#!. And to the #Y Zinduidians#!, #Y #Y Zain'ud#!#!. I am the #Y #R Creator of All Things That Can Never Be Known#!#!, and I have summoned you to give your people a special task.'\n\nThe god pauses, allowing the chief to comprehend his words.\n\n'Abandon your idols, and abandon worship of your ancestors, as the faithful will find themselves in my domain. I am the one true god, known by many names, and I ask you to follow the teachings of my faithful and settle this land as well as spread my word throughout #G Omniluxia#!.'\n\nThe chief kneels, and the light vanishes."
 razani_civil_war_14.a: "Let us embrace the one god #E Hellas#!!"
 razani_civil_war_14_tooltip.a: "#Y Our people will adopt the ways of the nations around us#!"
 razani_civil_war_14.b: "We should stick to our traditions"
 razani_civil_war_14_tooltip.b: "#Y We will continue with our nomadic traditions#!"

 razani_civil_war_15_title: "The Return of Ku-Kunnstis"
 razani_civil_war_15_desc: "#G Wise#! #T Shanuzushanuz#!, it seems that the erratic #Y Esemamshauza#! #Y [GetCharacter('(int32)234').GetFirstName]#! of the #Y Adanvem Vadatheon#! has risen in revolt against our rule!\n\nA scholar at heart, when #Y [GetCharacter('(int32)234').GetFirstName]#! took over as #Y Esemamshauza#! it was hoped by many in the imperial court that he would be more competent than his impulsive father. While [GetCharacter('(int32)234').GetSheHe] did succeed in optimizing the bureaucracy of the #Y Vadatheon#!, [GetCharacter('(int32)234').GetHerHis] obsession with the people of the former city of [GetProvince('(int32)2519').GetName|G] got him into some trouble with imperial authorities.\n\nAncestors of the modern #Y Gunstris#! people, the #Y Kunnstri#! were an #Y Illorian#! people who served as auxiliaries and administrators of western #Y Intermarenica#! from their capital at [GetProvince('(int32)2519').GetName|G] under the emperors of the #T Zani Empire#! in exchange for a special status similar to the one enjoyed by the #Y Ytalians#!. However, as a part of the consolidation of #T Razani#! rule over the east following the #Y Great Collapse#! the #Y Kunnstri#! lost many of their privileges and were pushed to assimilate like many other #Y Illorian#! cities, pushing them to lead the #Y Great Intermarenican Revolt#! of 707 LC. When the #Y Kunnstri#! were reconquered by the #T Razani#! alongside the rest of western and central #Y Intermarenica#! in the early 800s their city was razed and their history was erased in an attempt to punish them for their treason. #Y Kor-Kunnstis#! was renamed, and political power in what became the province of #G Adanvem#! shifted to the coast and plains that neighbored the hilly homelands of the #Y Kunnstri#!.\n\nAlthough the #Y Kunnstri#! were forcibly assimilated into #Y Geallian#! society, there are still #Y Gunstris#! scholars and elders that preserve the ancient histories of their people. It must be these ancient texts alongside the ongoing civil war that inspired the foolish #Y [GetCharacter('(int32)234').GetFirstName]#! to restore this long-dead kingdom. \n\nRegardless of his motivations, it is doubtful that his rebellion has much popular support, as few loyal #Y Zanic#! subjects believe their ancestors belonged an ancient #Y Illorian#! kingdom, and fewer still would care about the pride of a people that died centuries ago. We must act quickly and defeat this book-nosed lunatic before his rebellious sentiments spread!"
 razani_civil_war_15.a: "We will endure this setback"
 razani_civil_war_15.b: "I will lead the rebels myself"
 razani_civil_war_15_tooltip.a: "#Y Continue the struggle to save the #E Razani Empire#!#!"
 razani_civil_war_15_tooltip.b: "#Y Play as #E Ku-Kunnstis#!#!"

 razani_civil_war_16_title: "The Stone Speaks"
 razani_civil_war_16_desc: "Great #T Shanuzushanuz#!, concerning news comes to us from the lands of the #Y Shawuante Vadatheon#!!\n\nThe boisterous #Y Esemamshauza#! #Y [GetCharacter('(int32)235').GetFirstName]#! has finally lost his mind! News has arrived from fleeing refugees that the #Y Esemamshauza#!'s sizable ego was seduced by a local cult that proclaimed him the prophesized 'Son of #G Wishtheon#!', a title that can be traced back to the great #G Zanis Zani#!, the gall of the miscreant to accept such a sacred title!\n\nAccording to local legend, the native #Y Shwi#!, the tribes of the #Y Desert of Orange Sands#!, served as the elite horsemen of the great #G Zanis Zani#! after he was able to speak to their god #G Wishtheon#! through a boulder that carried the sleeping god's spirit, known as the #Y Stone of Wishtheon#!. It is said that upon touching the boulder, the rock shone so brightly it momentarily blinded all but the #Y Great Conqueror#! himself, and when the local shamans opened their eyes they saw a brilliant light surrounding the #Y Weshuchachoam#!, the #Y Chosen One#!. It was amongst the #Y Shwi#! that the father of the #Y Zani#! received his quest to venture west, conquering all of the known world along the way. \n\nThe #Y Shwi#! followed the great conqueror, hoping to find the endless fertile fields of #Y Shisumache#! fortold to be at the end of the chosen one's journey. Alas, neither they nor the legendary emperor made it to the end of the world, leaving the #Y Shwi#! to await for a new prophesized one.\n\nIt appears that they have found their new chosen one in the form of #Y [GetCharacter('(int32)235').GetFirstName]#!. Whether he actually spoke to the stone or #Y Shwi#! chiefs intend to capitalize on the chaos caused by the ongoing civil war to usurp power, our court can only speculate. What is certain are the reports of the former #Y Esemamshauza#! leading armies of desert horsemen west in an inferior attempt to imitate the great #G Zanis Zani#!.\n\nWe must stop him before his armies arrive at the gates of [GetProvince('(int32)2478').GetName|G]!"
 razani_civil_war_16.a: "Another fire to put out"
 razani_civil_war_16.b: "He could be the spiritual successor of #E Zanis Zani#!..."
 razani_civil_war_16_tooltip.b: "#Y Play as the #E Neo Zani Empire#!#!"

 razani_civil_war_17_title: "Enente Unites"
 razani_civil_war_17_desc: "#G Wise#! #T Shanuzushanuz#!, urgent news from the center of our empire!\n\nIt appears that the local #Y Enenten#! nobility of the #Y Enente Vadatheon#! have risen up against our rule and executed the noble #Y Esemamshauza#! #Y [GetCharacter('(int32)233').GetFirstName]#!! Reports indicate that they have formed an assembly similar to the #T Imperial Council#! that they are calling a #Y Manmiz#!, where they have declared themselves an independent republic. Claiming to defend the interests of the #Y Enenten#! people, the small citizen army of the republic now marches against us!\n\nThe native elites of the divided #Y Enenten#! people are usually apathetic to the affairs of the empire, and prefer to relax on their isolated plantations enjoying lavish lifestyles and expensive goods. Although it is not clear why they revolted, many suspect that there was a deeper reason beyond the complaints made against the former #Y Esemamshauza#! #Y [GetCharacter('(int32)233').GetFirstName]#!. Perhaps the treacherous agents of #Y Zorgolis#! are at work?\n\nRegardless of their motives, it is clear that we must put down this fledgling democratic movement before it continues to spread across the empire, lest we face even more insurrections."
 razani_civil_war_17.a: "We cannot yield"
 razani_civil_war_17.b: "Geallia shall be free!"
 razani_civil_war_17_tooltip.b: "#Y Play as the #E Central Geallian Republic#!#!"

 razani_civil_war_18_title: "Lower Ytalia in Revolt"
 razani_civil_war_18_desc: "Great #T Shanuzushanuz#!, shocking news has arrived from the edges of the empire!\n\nThe deplorable traitor #Y [GetCharacter('(int32)232').GetFirstName]#! has declared himself the sole king of the former #Y Gashanytalia Vadatheon#!! The former #Y Esemamshauza#! of the #Y Vadatheon#!, the court has long kept a suspicious eye on the governor due to his unscrupulous reputation. Both the invasions of #T Jarenam the Formidable Dragon#! and the entrenchment of the #Y Buzani#! family in the region kept #Y [GetCharacter('(int32)232').GetFirstName]#! safe from imperial action until now, as the court could only hope that he was content with governorship of an entire province.\n\nUnfortunately, it seems that hope is a fickle thing to rely on, and, true to his nature, #Y [GetCharacter('(int32)232').GetFirstName]#! now seeks to carve out a kingdom of his own under the guise of 'freeing' the people of #G Ytalia#! from our 'oppressive' rule. Luckily for us, his words ring hollow with many local elites who still support us.\n\nWe must act quickly before #Y [GetCharacter('(int32)232').GetFirstName]#! is able to quash our supporters in the region and expand his fabricated kingdom at the expense of our battered empire!"
 razani_civil_war_18.a: "We will hold the empire together!"
 razani_civil_war_18.b: "#E [GetCharacter('(int32)232').GetFirstName]#! sounds pretty imperial"
 razani_civil_war_18_tooltip.b: "#Y Play as the #E Kingdom of Lower Ytalia#!#!"

 razani_civil_war_21_title: "The Council lends their Support"
 razani_civil_war_21_desc: "Excellent news o great #T Shanuzushanuz#!!\n\nThrough persuasion, guile, and a few well-placed bribes, our efforts to curry favor with the #T Imperial Council#! have bore fruit!\n\nToday the council members have convened and lent their official support for your claim to the imperial throne, providing your highness with the necessary legitimacy to continue to put possibly rebellious vassals in line.\n\nWhile our faction will surely celebrate this victory with a great feast, it is pertinent we not rest on our laurels. Should your legitimacy be questioned by a substantial amount of the nobility or the empire be thrown into too much chaos, our enemies on the #T Imperial Council#! will surely use this once-noble institution to oppose your rule once more!"
 razani_civil_war_21.a: "We will hold the empire together!"
 razani_civil_war_21_tooltip: "#R If #E [ROOT.GetCountry.GetRuler.GetFirstName]'s#! legitimacy falls below #E 50#! or the stability falls below #E 10#! the council will withdraw their support for #E [ROOT.GetCountry.GetRuler.GetFirstName]'s#! claim to the imperial throne.#!"

 razani_civil_war_22_title: "The Coup Attempt"
 razani_civil_war_22_desc: "Mere days passed after the announcement of the decree that would abolish the #T Imperial Council#! before the former council members made their move. Gathering a great coalition of disgruntled nobles and ambitious petty lords, the former councilors raised a large army to oust #Y [ROOT.GetCountry.GetRuler.GetFirstName]#! from [ROOT.GetCountry.GetRuler.GetHerHis] throne!\n\nBefore the mighty #T Shanuzushanuz#! could react, the conspirators used their connections and personal retinues to take over the streets of [GetProvince('(int32)2478').GetName|G] itself! Although  #Y [ROOT.GetCountry.GetRuler.GetFirstName]#! managed to escape, [ROOT.GetCountry.GetRuler.GetSheHe] and [ROOT.GetCountry.GetRuler.GetHerHis] remaining allies must retake the imperial throne before all is lost!"

 razani_civil_war_23_title: "The Amsinenne Revolt"
 razani_civil_war_23_desc: "O #T Shanuzushanuz#!, urgent news!\n\nWhile your influence managed to control many petty lords following the abolishment of the #Y Amsinenne#!, the most powerful landholders in the empire have conspired to oust you from your throne!\n\nThese despicable traitors have joined forces and are now marching towards [GetProvince('(int32)2478').GetName|G] while taking valuable imperial farms for their own personal gain! Although their numbers are numerous, their quality is poor, primarily consisting of peasant levies from their large estates.\n\nWe must quell this rebellion before it throws the empire into further turmoil!"

 razani_civil_war_24_title: "The Council Denounces the Shanuzushanuz"
 razani_civil_war_24_desc: "Great #T Shanuzushanuz#!, the #T Imperial Council#! has revoked their support for your rule by denouncing your claim to the throne!\n\nDespite the best efforts of our faction, it seems that various rival factions have taken advantage of the instability in the empire to push for the council to take a side against your rule. Clearly, they are trying to subtly push their own candidate onto the throne by giving them a claim against you.\n\nMajestic majesty, our faction will not rest until we have once again turned the council in our favor! While our bureaucrats and diplomats are hard at work, we ask only that you bring stability to the empire so that we may spread word of your righteous rule."
 razani_civil_war_24.a: "They will come to regret this..."


