l_english:
 capital_formable_small_effect_tooltip:1 "Adds #Y 2#! Citizen Pops with state Culture and Religion.\nAdds #Y 2#! Freemen Pops with state Culture and Religion."
 capital_formable_medium_effect_tooltip:1 "Adds #Y 4#! Citizen Pops with state Culture and Religion.\nAdds #Y 4#! Freemen Pops with state Culture and Religion."
 capital_formable_large_effect_tooltip:1 "Adds #Y 4#! Citizen Pops with state Culture and Religion.\nAdds #Y 4#! Freemen Pops with state Culture and Religion.\nAdds #Y 4#! Slaves Pops with state Culture and Religion."
 capital_formable_huge_effect_tooltip:1 "Adds #Y 8#! Citizen Pops with state Culture and Religion.\nAdds #Y 6#! Freemen Pops with state Culture and Religion.\nAdds #Y 4#! Slaves Pops with state Culture and Religion."
 capital_formable_tribal_effect_tooltip:0 "Adds #Y 4#! Tribesmen Pops with state Culture and Religion."
 capital_formable_tribal_large_effect_tooltip:0 "Adds #Y 8#! Tribesmen Pops with state Culture and Religion."
 tier_1_formable_tooltip:0 "This is a #Y Tier 1#! formable, and we will be #R unable#! to form any other country of the same tier."
 tier_2_formable_tooltip:0 "This is a #Y Tier 2#! formable, and we will be #R unable#! to form any other country of the same or lower tier."
 tier_3_formable_tooltip:0 "This is a #Y Tier 3#! formable, and we will be #R unable#! to form any other country of the same or lower tier."
 ousri_not_existing:0 "Ousri must not exist."
 #Zaraken Empire
 formable_not_zaraken_empire_exists:0 "#Y Neo-Zaraken Empire#! must NOT exist."
 form_zaraken_empire:0 "Establish the Neo-Zaraken Empire"
 form_zaraken_empire_desc:0 "With the collapse of both the Zaraken Empire and the Zakara Kephal, the golden age of the Zarakens has long passed, yet with the unification and establishment of a #E Neo-Zaraken Empire#!, the Zarakens can once again rise to become a prominant regional power."
 ZAE:0 "Neo-Zaraken Empire"
 ZAE_ADJ:0 "Neo-Zaraken"
 zaraken_empire_culture_convert_tooltip:0 "Any #Y Subject#! provinces required to The Zaraken Empire will be annexed."

 #Nouveau Aralan
 NAR: "Nouvel Aralan"
 NAR_ADJ: "Nouvel Aralanois"
 form_nouveau_aralan: "Form Nouvel Aralan"
 form_nouveau_aralan_desc: "The Aralan people exist in small enclaves, scattered throughout the northern forests and farmlands of Morrigon. Although many of the lands and provinces of Morrigon are now named after Aralans tribes, the years have not been kind to their culture and they have lost much of their former holdings. A strong leader to unite them in these dark times is paramount to their continued survival, for the encroaching Haedui and Aurezo cultures are seeking to displace their own."
 formable_not_nouveau_aralan_exists: "Nouvel Aralan does not exist."
 nouveau_aralan_culture_convert_tooltip: "Every owned Aralan pop becomes Aralans-Rohenoan." 

 #Jarenam Kingdom
 JAE: "Jarenam Kingdom"
 JAE_ADJ: "Jarenam"
 form_kingdom_jarenam: "Form The Kingdom of Jarenam"
 form_kingdom_jarenam_desc: "After the fall of the Jarenam Empire, a number of rump states emerged that quickly consolidated power within their regions, and the coastal Eteradican lands that were rich in resources, culture and civilization, became the cradle of those that would rebuild Jarenam."
 formable_not_kingdom_jarenam_exists: "The Kingdom of Jarenam does not exist."

 #Krakia
 KRK: "Krakean Kingdom"
 KRK_ADJ: "Krakean"
 form_krakia: "Form the Krakean Kingdom"
 form_krakia_desc: "The Zehian people were forcibly pushed from their homelands into region of Polabowy, and only were able to retain their original capital of Starogod. Now, we have united our people once more in our new land, and look to reclaim Dolny in the name of Zehi!"
 formable_not_krakia_exists: "The Kingdom of Krakea does not exist."

 #Lechia
 LCH: "Kingdom of Lechia"
 LCH_ADJ: "Lechian"
 form_lechia: "Unite the Lechians"
 form_lechia_desc: "It is said that when a chosen hero of the Lechians arises, they will lead the people to the conquest of all that they desire. And when Lechia is united, the celestial deer of Jelen will return from the mountains and bless the descendents of Lechi once more!"
 formable_not_lechia_exists: "The Kingdom of Lechia does not exist."

 #Dunykyelen
 DKY: "Dunykyelen"
 DKY_ADJ: "Dunykyelen"
 form_dunykyelen: "Unite the Duny"
 form_dunykyelen_desc: "The Duny have endured many hardships and trials in their existence. Sitting beyond the mountain pass between the Azari Mountains and Mount Wishtheon, they have been forced to face aggressive #E #R Zanic#!#!, #E Selaskusian#!, and #E #R Goblinic#!#! armies for generations. Divided, the five tribes are much weaker than any of their neighbors, as their skilled horsemen are outnumbered by surrounding peoples.\n\nUnited under one ruler, the great #E Dunykyelen#! could be established, a country that could become the undisputed master of the steppes!"
 formable_not_dunykyelen_exists: "The Dunykyelen does not exist."

 #Herue
 HEO: "Herue"
 HEOADJ: "Herulian"
 restore_herue: "Restore the Kingdom of Herue"
 restore_herue_desc: "Centuries ago, the #E Heruevi#! tribes were just one of many norrfalian tribes living under the thumb of the #E Drow#! that ruled the lowlands during the #R #E Great Ierlandior#!#!. However, everything changed when #E Yvius Balthazar#! beat the Drow at the #E Battle of Ridonnorr#!, beginning the #E #G Svardenni#!#!, or Reconquest.\n\nDuring this turbulent time, the great warlord Norraksgaelg united the tribes under one banner, declaring himself King of the Heruevi and launching an invasion of the lowlands alongside members of the #E Order of Yvius Balthazar#!. He conquered the Drow Kingdom of Iolsim, forging the #E Iron Crown#! and making their former capital into the seat of his new kingdom, #E Herue#!.\n\nNow, the great kingdom has been split into pieces amongst various squabbling heirs. If the norrfalae are to survive against the incoming Drow invasion, #E Herue#! must once again be reunited and stand as a bastion for humanity and Helluvianism in the north!"
 formable_not_herue_exists: "The Kingdom of Herue does not exist."

 #Kingdom of Rohenoa
 ROH: "Kingdom of Rohenoa"
 ROH_ADJ: "Rohenoa"
 form_kingdom_rohenoa: "Form The Kingdom of Rohenoa"
 form_kingdom_rohenoa_desc: "The right to claim the throne of Rohenoa must be won by the sword - no diplomatic overtures or gifts will be able to sew together this contentious people in a state of harmony. The future King of Rohenoa shall have the right to rule unopposed, founding a dynasty that shall last until the end of days."
 formable_not_kingdom_rohenoa_exists: "The Kingdom of Rohenoa does not exist."

 #Srrørum
 SLV: "Srrørum"
 SLV_ADJ: "Srrørum"
 restore_silvarum: "Restore Srrørum"
 restore_silvarum_desc: "Hundreds of years ago, the Silver Dwarves that inhabited the #Y Green Valley#! of #Y Central Morrigon#! were united under the banner of the #G Second Kingdom of Srrørum#! by the legendary #E Hefdarr 'to Tögg'#!. Upon his death, the kingdom quickly splintered into many smaller silver dwarven kingdoms, having no unifying factor except their common heritage. Uniting the Silver Dwarves and reforming #E Hefdarr's#! great kingdom once again could be a rallying call for all dwarves to unite together into a glorious kingdom - like nothing Omniluxia has seen before."
 formable_not_silvarum_exists: "Srrørum does not exist."

 #Srrøveldi
 SV9: "Srrøveldi"
 SV9_ADJ: "Srrøveldic"
 become_srroveldi: "Form Srrøveldi"
 become_srroveldi_desc: "The Silver Republic, founded after the 'Ubaturren ulfton Thorgarren', Srrøskku for Reforms of the Citizens, is a wealthy republic of merchants founded out of the crumbling Saptan Kingdom. The republic is home to both the Galmar Dwarves and Leslesi Borderlanders, the two primary cultures of the nation, and has a strong merchant and martial tradition that has made them a major player in the Orcish Sea trade. Their government is run by the 'Sorrhlturr', which is further broken down into the noble-led 'Ghlattanvindr' and the citizen-run 'Arnnanvindr', with the Arnnanvindr electing a 'Hatamogg' to represent the nation on the international stage."
 formable_not_srroveldi_exists: "Srrøveldi does not exist."

 #Ekkdejakheim
 EKD: "Ekkdejakheim"
 EKD_ADJ: "Immortal"
 become_ekkdejakheim: "Form Ekkdejakheim"
 become_ekkdejakheim_desc: "The Immortal Empire, founded by Ivarr 'to Boddamogg', is a tyrannical state whose power emanates from their heartland in the inner Dragon's Pass. Their armies are filled with an unholy mix of Dolin Silver Dwarves, Kana'i Goblins, Hobgoblins, and others. Their immortal god-emperor, Ivarr, is the only master of the Aa'iia Man'a Style, and uses its only technique to grant him immortal life at the cost of the lives of his subjects."
 formable_not_ekkdejakheim_exists: "Ekkdejakheim does not exist."

 #Srrøkheim
 SRK: "Srrøkheim"
 SRK_ADJ: "Silver Dwarven"
 restore_srrokheim: "Restore Srrøkheim"
 restore_srrokheim_desc: "Back in the Mythic Age, a time where the Silver Dwarven people were ruled by #G Hthgart#! and #G Freja#!, it is said that the lands of the Silver Dwarves extended from their homeland in the #Y Green Valley#! through the former #Y Gørskkóen Forest#!, and futher into the #Y Dragon's Pass#!. The death of the two demi-gods were follwed by Elven, Dragkhanic, and Hobgoblin invaders, who drove the Silver Dwarven people back to their protected homelands of the #Y Green Valley#!.\nHowever, with the restoration of #E Srrørum#! our people can once again dream of a greater empire, of #E Srrøkheim#!."
 formable_not_srrokheim_exists: "Srrøkheim does not exist."

 #Sunset Kingdom
 SSS: "Sunset Kingdom"
 SSS_ADJ: "Sunset Elf"
 form_sunset_kingdom: "Form the Sunset Kingdom"
 form_sunset_kingdom_desc: "Isolated from the #R Eldritch Forests#! their ancestors lived in, the culture of the #E Senekeloi#! Elves is distinct. Focused on fending for themselves and detached from their connection to #E Mother Cafea#!, many have begun an occult worship of the #T #E Sun#!#!, as the food supply of these nomadic elves revolves around its solar whims.\n\nShaped by their bloody history, rugged terrain, and semi-nomadic life, the traditions of the '#Y Sunset Elves#!' bears a resemblance to the cruel practices of their #R Dragkhan#! neighbors.\n\nShould this culture produce a great tactician, their genius and egoism might allow them to utilize the strengths of their kinsmen to conquer a great #E #Y Sunset Kingdom#!#! of their own, bringing this occult worship into the light!"
 formable_not_sunset_kingdom_exists: "Sunset Kingdom does not exist."
 sunset_kingdom_culture_convert_tooltip: "Every owned Elven pop becomes a Sunset Elf."
 convert_to_sun_religion: "#Y Our people will convert to the ways of the #E #T Sun#!#!!#!"
 sun_converts_mod: "Recent Conversion"

 #Thalmori Confederacy
 SSS: "Thalmori Confederacy"
 SSS_ADJ: "Western Wood Elf"
 become_thalmori_confederacy: "Form the Thalmori Confederacy"
 become_thalmori_confederacy_desc: "The #E Thalmori#! or 'Western' Wood Elves of the #Y Western World's Lungs Forest#! are traditionally semi-nomadic pacifists more loyal to their local band than any so-called chieftain or king.\n\nWhile many younger Elves are content with their idyllic lifestyles, the elder sages remain cautious of the coming of the #E Day of Light#!, said to occur after the #E Great Collapse#!. Thus, the idea of a #E Great Confederacy#! of all the Evergreen tribes has been considered by most chiefs as the first step towards the great #G Evergreen Empire#!."
 formable_not_thalmori_confederacy_exists: "Thalmori Confederacy does not exist."


 # Zani Empire
 form_zani_empire: "Reform Zani Empire"
 form_zani_empire_desc: "Many centuries ago, the Zani Empire ruled unopposed over what is now two continents, and it was only through an unforeseen calamity that the great power was shattered into halves. And while many have since sought to reform the Zani Empire, no one has been able to forge her sundered pieces together again."
 ZANI_NAME: "Zani Empire"
 ZANI_ADJECTIVE: "Zani Empire"
 zani_empire_not_existing: "Zani Empire does not exist."
 zani_empire_land_owned_tt: "Own or have subjects own all of the land of the former Zani Empire."

 # Geallian Empire
 become_eagelia: "Reunite the Geallian People"
 become_eagelia_desc: "With the fall of the #E Razani#! comes an uncertain future for the former subjects of the great empire. The so-called '#E True Geallians#!' of the east now squabble amongst themselves while foreign barbarians dare to take imperial territory and strike at the heartlands of the children of #E Zanis Zani#!.\n\nNo more must we suffer such humiliation! Before our people disappear to the sands of time we must reclaim the glory of the east, and create a new empire for the #E Geallians#!."
 EGAADJ: "Geallian"
 formable_not_eagelia_exists: "Razani Empire or Geallian Empire does not exist."

 # Vetalia
 VTA: "Notiros"
 VTA_ADJ: "Notiros"
 become_vetalia: "Form Notiros"
 become_vetalia_desc: "When the ancestors of the #E Zanazi-Vetali#! arrived, they named us after the northern #E Vetali#! tribes they skirmished with. For centuries this name was used to distinguish ourselves and our land to foreigners who arrive with coins in one hand and a sword in the other. However, while our name varies amongst the various tribes, we all have the same name for our land.\n\nOnce, centuries ago, the stories say we were united under a #E High King#!. He worked with the tribes to end feuds and maintain peace across our vast forests. With the coming of the empire came the arrival of imperial ambitions. The final #E High King of the Vetalians#! was seduced by this fallacy, and shattered the united front we had created to face the invaders.\n\nHundreds of years later, our people are divided, #E Elves#! and #E Zani#! alike strike at our heartlands. The tribes who call this land #E Notiros#! must unify, or we will once again witness foreign domination for another century."
 formable_not_vetalia_exists: "Notiros does not exist."

 # Zani-Vetalia
 VWE: "Zawalonnu Vetalia"
 VWE_ADJ: "Vetalia"
 become_western_zani: "Form Zawalonnu Vetalia"
 become_western_zani_desc: "When the #E Zani Empire#! retreated from these lands, they left behind prominent colonies who were sacked and razed by the barbarian #E Vetalians#! who sought to destroy what little civilization remained in the region. It's only thanks to the mighty #E Gonessionem#! that we managed to fight off the savages.\n\nFinally, after centuries of fighting and developing our lands, our people are now strong enough to retake the province of #E Vetalia#!, and restore the civilization to the western dream of the #E Zani#!."
 formable_not_western_zani_exists: "Vetalia does not exist."

 # Celtica
 CLT: "Celtica"
 CLT_ADJ: "Celtican"
 become_celtica: "Form Celtica"
 become_celtica_desc: "The lands that comprise Celtica can be considered the heartland of Morrigon, and is indeed the place where that faith is the strongest, despite the growth of Patreic beliefs and the Seeker heresy in some communities. Despite the growing religious tensions, Celtica has the potential to rival all powers in her periphery - even the mighty Empires that are searching for lost legitimacy."
 formable_not_celtica_exists:0 "Celtica does not exist."

 # Sanguine Confederacy
 SNG: "Sanguine Confederacy"
 SNGADJ: "Sanguine Confederacy"
 become_sanguine_confederacy: "Form Sanguine Confederacy"
 become_sanguine_confederacy_desc: "It is foretold in the #R Blood Scrolls#! that one day, the faith of the #E Drow#! will be freed from its underground prison and shall burst forth, spreading across the face of Luxterra like a pool of blood. And the Empire that is formed in its wake will one day save the world from a blinding Light that shall appear from the darkness...\n\nThe prophecy of this kingdom that is to be, the dreaded #E Sanguine Confederacy#! that will drink the lifeblood of Empires across the world, has long guided the upper echelons of the Blood-Stained priestly hierarchy, who desire nothing more than to create this mighty imperium."
 sanguine_confederacy_not_existing: "Sanguine Confederacy does not exist."

 # Greater Werhen
 WHE: "Greater Werhen"
 WHEADJ: "Greater Werhen"
 become_greater_werhen: "Form Greater Werhen"
 become_greater_werhen_desc: "Ages ago, when the mighty #Y Zani Empire#! was at its height, the rebellious Lords of the Werhenlanders banded together in a desperate attempt to free themselves from the yoke of slavery, and although they ultimately failed in their attempt, the terrible war that they unleashed contributed, in its own way, to the Fall of the Zani a century later.\n\nThe just cause that made the the Werhenlander Knights risk everything they had was the dream of a #T Greater Werhen#!, one free from a foreign tyrant's hand, and although the Lords that fought for this cause died the deaths of traitors and rebels, their vision has not faded from Luxterra."
 greater_werhen_not_existing: "Greater Werhen does not exist."

 # Intermarenica
 ITR: "Illorian Empire"
 ITRADJ: "Illorian"
 become_intermarenica: "Restore the Illorian Empire"
 become_intermarenica_desc: "Our oldest and most recounted hymns amongst the #E Aentora-Torr#! often speak of the great #E Everything-King#!, #E #G Kulnnona#!#!, who established a great empire that spanned all across the lands promised to his people: #E Marrenica#!. Cleverly and decisively defeating the monstrous #E #R Muerthans#!#!, scaly humanoid beasts of great strength, he and his twin sons #E Kyrranno#! and #E Pthellanne#! established the great #E #Y Yollorrnan Tokrratona #!#!, known to the #E #R Geallians#!#! as the #E #Y Illorian Empire#!#!.\n\nOnce again our people find themselves divided just as in the #E First Illorian Age of Cities#!, a dark time in which our lack of cooperation allowed the #E #R Geallians#!#! to ravage our lands. Let us not repeat history, and finally reunite the Kingdom of the #E Everything-King#!!"
 formable_not_intermarenica_exists: "Illorian Empire does not exist."

 # Arcanian League
 ACL: "Arcanian League"
 ACLADJ: "Arcanian"
 become_arcanian_league: "Reconquer the Arcanian League"
 become_arcanian_league_desc: "Long ago the #E Arcanians#! under the leadership of #E Ddu-Shuththuilrui#! ruled over much of #E Intermarenica#! via both hard and soft power, with their colonies and influence reaching the distant #E Norrfalie#!. However, centuries have passed since the decline of the league and of the #E Shuthonian#! state itself.\n\nIf the #E Arcanians#! of #E Shuthonia#! were to re-establish their once-mighty league, they might once again become one of the #E Great Powers of Omniluxia#!!"
 formable_not_arcanian_league_exists: "Arcanian League does not exist."

 # Kingdom of Hellas
 KHH: "Kingdom of Hellas"
 KHHADJ: "Helluvian"
 become_kingdom_of_hellas: "Form the Kingdom of Hellas"
 become_kingdom_of_hellas_desc: "The #E Shahanat#! has historically served as a connecting force between the various peoples that make up the #E Helluvian#! faithful, however its power was never absolute nor was its authority backed by a strong entity able to enforce its will. Conquering a large swathe of #E Intermarenica#! as well as holding the #E Birthplace of Helluvius#! may grant us the prestige to finally make the #E Shahanat#! the true head of the #E Helluvian#! Church!"
 formable_not_kingdom_of_hellas_exists: "Intermarenica does not exist."

 # Skyreach
 SKY: "Nvey-Anempanso"
 SKYADJ: "Anempanso"
 become_skyreach: "Reform Anempanso"
 become_skyreach_desc: "We have laid low the Goblin threat, and conquered our dwarven kinsmen that resisted our banner in order to bring peace and prosperity to our mountain homes. We are truly the chosen of #E Frei#! and #E Dwadais#!. Now that #E The Skyreach Passages#! have been once again united by the #E Copper Dwarves#!, we can proclaim the restoration of #E #Y Anempanso#!#!, a country that safeguards the mountains forevermore."
 formable_not_skyreach_exists: "Anempanso does not exist."

 # Goblin Dominion
 GOB: "Koh Nau'taloma"
 GOBADJ: "Goblin"
 become_goblin_dominion: "Form the Koh Nau'taloma"
 become_goblin_dominion_desc: "Becoming a thrall of the #E Koh Nau'taloma#!, or #E Nau Mountains Goblin Empire#!, is a nightmare to many of the peoples of Luxterra and even Morrigon, who fear the reputation of the fearsome goblins of what most call the Skyreach Mountains even though they are separated by an ocean.\n\nWhile the Goblins once lived all across parts of Luxterra, they have been driven back deep into the mountains and badlands at the edge of civilization from whence they came, where they nurture hopes of once again escaping to the #E Lands of the Sun#!."
 formable_not_gobin_dominion_exists: "Goblin Dominion does not exist"

 # Gaaron
 GAA: "Gåaron"
 GAAADJ: "Gaar"
 form_gaaron: "Unite the Gaar"
 form_gaaron_desc: "When our people were cast into the caves of the #E Deep Rift Valley#! by the cruel #E Wielkopan#!, all sense of unity shattered and our people regressed to savagery. Constant betrayals and raids towards each other and foreign races has led our people to be seen as little more than the #E Goblins#!. We are hunted like pests, driven from plentiful farming communities back to our caves as our skin burns, our constant bloody wars serving as entertainment for #E #R Melodias#!#!.\n\nThe only way to escape this hell is to fulfill the great #E #R Blood-Stained#! Prophecy#! dictated to us by #E #R Melodias#!#! herself:\n\nA great chief must unite our warring tribes into one, and only then will this #E Gåaron#! horde be blessed with protection against the sun by #E #R Melodias#!#! and allowed to descend upon the people of #E Luxterra#! with a fury unseen since the emergence of the #E Drow#!!"
 formable_not_form_gaaron_exists: "Gåaron does not exist"


 # Empire of the Ular-Pria
 ULP: "Empire of the Ular-Pria"
 ULPADJ: "Serpentine"
 become_empire_of_ular_pria: "Reform the Empire of the Ular-Pria"
 become_empire_of_ular_pria_desc: "Two ill-timed calamities brought about the destruction of the Empire of the Ular-Pria; a ruinous civil war between the twin sons of the last Empress, Lasstuutett Silnattomm, and the #E Great Collapse#! that rampaged the lands of the Snakefolk far worse than others.\n\nThe receding waters of the tsunami washed away not only the cities and metropoles of the Ular-Pria, but nearly all traces of their imperium, and now the remaining cities of the Snakefolk wage endless war against each other in hopes of reforming the #E Empire of the Ular-Pria#!."
 formable_not_empire_of_ular_pria_exists: "The Empire of the Ular-Pria does not exist"

 # Orconia
 OCA: "Orconia"
 OCAADJ: "Orconian"
 become_orconia: "Form Orconia"
 become_orconia_desc: "While most of the orcs living in Morrigon originally hail from the island of #E Rendun#!, there are many Clans that have crossed the waters of the #E Morrigan Sea#! to make their homes on the mainland. Over the centuries, they have carved out kingdoms and chiefdoms along the coasts, much to the chagrin of the various peoples already living there.\n\nAnd while they live in scattered communities, a dream exists among the Nurhagork that have left Rendun, one that motivates them to fight against an impossible future - the destruction of their many enemies and the formation of their own kingdom, #E Orcania#!."
 formable_not_orconia_exists: "Orconia does not exist."

 # Rendun
 RND: "Rendun"
 RNDADJ: "Rendunian"
 become_rendun: "Form Rendun"
 become_rendun_desc: "The island of #E Rendun#! has never been unified in its history, for the fierce, war-like nature of its natives have kept the foreign armies away - even the Zani avoided the isle, preferring to trade with the locals instead of conquering them.\n\nOver the centuries, the various clans on the island - namely, the Ioleic, Parati, and Longonesi - have fought bitter wars against each other, yet no tribe has been able to bring the orcs together under one Chieftain. And yet, the prize remains for the taking; eternal glory for the first to conquer the Isle of the Nurhagork and uniting #E Rendun#!."
 formable_not_rendun_exists: "Rendun does not exist."

 # Remun
 REM: "Remun"
 REMADJ: "Remunian"
 become_remun: "Form Remun"
 become_remun_desc: "While the island of #E Rendun#! remains central to the legends and folktales of the Uhuar Orcs, the smaller isle of #E Remun#! has played an important part in its religious history, for it is home to the Orc's Holy Mountain.\n\nThousands of years ago, the sage Nuvian climbed the steep slopes of #E Monte Balaria#! to meditate, and it was there on the summit that he discovered his Inner Flame - a momentous spiritual discovery that would transform Orcish society. It was in that moment when Nuvian uttered a prophecy, stating that one day the island would be united under one Chieftain, but this is something that has yet to happen."
 formable_not_remun_exists: "Remun does not exist."

 # Austropetolia (Half snakefolk people conquer archipelago)
 APA: "Austropetolia"
 APAADJ: "Austropetolian"
 become_austropetolia: "Form Austropetolia"
 become_austropetolia_desc: "The brutal #Y Ular-Pria Imperium#! built its cruel empire on the backs of enslaved races, and perhaps none suffered more than the inhabitants of the Austropetolian Archipelago that did not belong to one of the Snakefolk Clans - if you were not a full-blooded Ular-Pria, then you were doomed to die as chattel.\n\n#E The Great Collapse#! was seen as something of a miracle by the Thoameni people, who cheered as they watched the tsunamis and earthquakes destroy the cities of their enslavers. In that moment, a dream of a free #E Austropetolia#! was born."
 formable_not_austropetolia_exists: "Austropetolia does not exist."

 # Austroenia (North Arteonians that are in the island next to Euralyean League conquer archipelago)
 ASA: "Austroenia"
 ASAADJ: "Austroenian"
 become_austroeonia: "Form Austroenia"
 become_austroeonia_desc: "The city of #E Gutz#! has been likened to an oasis in the middle of a desert; a place of refuge for Arteonian peoples that are surrounded by hostile Snakefolk and their kin. Originally founded by Austroenian merchants on a plot of farmland granted by the #Y Ular-Pria Imperium#!, who would not allow humans to live within their own cities, the plucky Arteonians took advantage of the chaos caused by the #E The Great Collapse#! and conquered the hinterlands of their fair capital while the Snakemen were unable to muster a defense.\n\nThe Kings of Heskoh have long desired to drive out the hateful Snakefolk from these islands, believing that #E Austroenia#! would rule the lands better than their cruel natives."
 formable_not_austroeonia_exists: "Austroenia does not exist."

 # Ka Takah'atuala (Morrigon Goblins)
 UKI: "Ka Takah'atuala"
 UKI_ADJ: "Ka Takah'atuala"
 become_underkingdom: "Reconquer the Ka Takah'atuala"
 become_underkingdom_desc: "While our people remember the stability of the great #E Kana'i Hui'ui#!, stories much older have been past down through our elders for centuries. These stories tell of the grand #E #R Ka Takah'atuala#!#!, a realm that touched both the Northern and Southern tips of #E Morrigon#!, an empire where our people no longer feared the various #R Ma'hau#! that live beyond the #E Inner Dragon's Pass#!, but ruled them. Ruled by a great chief surpassing even the #Y man'a#! of #E Mahinaua#!, he is said to have consumed the #Y man'a#! of a #E Zani Emperor#! himself.\n\nShould our people once again unite, our chariots may once again ride from the plains of the #E Dragonlands#! to the fertile fields of #E Wegalia#!!"
 formable_not_underkingdom_exists: "Ka Takah'atuala does not exist."

 # Overkingdom (Hobgoblins)
 OKI: "Droiyanan"
 OKIADJ: "Droiyanan"
 become_overkingdom: "Form Droiyanan"
 become_overkingdom_desc: "The mountain valleys of #E Dragon Pass#!, nestled in the heart of Morrigon, has long been home to the Droitrai or so-called 'Hobgoblin' people, who have been forced many times in their history to defend their territories against Dragkhanic and Lupinite incursions. While some Droitra scholars believe that their ancestors originated in the #E Celica Mountains#!, over the centuries, they have lost access to their traditional homelands - forced out by the aggressive Kana'i goblins who have opened up attacks from the south.\n\nForming the mythical #E Droitraivlan#! has long been the vision that guides the upper echelons of Droitra decision makers, for they long to recapture their mountain and drive out the infidels."
 formable_not_overkingdom_exists: "Droiyanan does not exist."

 # Eptelon
 EPT: "Eptelon"
 EPTADJ: "Eptelonian"
 become_eptelon: "Form Eptelon"
 become_eptelon_desc: "The Eptelonians are a race of noble warriors that honor virtue and freedom, and are especially proud of the fact that they have resisted the encroachments of the Snakefolk to their south, although they have been less successful in dealing with the Horteonian invaders on the western coast. And while the interior of the island remains difficult to conquer, the civilized cities of the coast are homes to noble families that harbor ambitions of conquering the entire island of #E Eptelon#! for themselves."
 formable_not_eptelon_exists: "Eptelon does not exist."

 # Heptelon (horteonian invaders conquer eptelon)
 HPT: "Heptelon"
 HPTADJ: "Heptelonian"
 become_heptelon: "Form Heptelon"
 become_heptelon_desc: "When the High Elves invaded the western island of #E Arteon#!, they destabilized the delicate political status quo on the island, ushering in opportunities for Horteonic and Viktreic invaders to carve out their own kingdoms on the isle and plunging the realm into darkness.\n\nAnd while many decided to stay and fight for their homes, others abandoned their war-torn countries for the safe ports on the western coast of #E Eptelon#!. These refugees harbor a new dream; destroying the natives and forming #E Heptelon#!, a beacon of hope for the displaced western humans."
 formable_not_heptelon_exists: "Heptelon does not exist."

 # Horteon (Human)
 HRT: "Horteon"
 HRTADJ: "Horteonian"
 become_horteon: "Form Horteon"
 become_horteon_desc: "The inhabitants of #E Horteon#! never expected to see High Elven warships appearing off of the coasts and were caught unawares, unable to muster a proper defense against a people hell bent on conquering their homelands. Much to their shame, the #E Atheus Dominion#! conquered the farmlands and forests on the western half of the isle, and as the Elves began to construct fortresses and cities, it became clear that they were planning to stay forever.\n\nBut the dream of a free #E Horteon#! has not been forgotten, and it is the hopes of the islanders that they will be able to liberate their captive kinsmen from the Ascendic armies."
 formable_not_horteon_exists: "Horteon does not exist."

 # Polaris (Human)
 PLS: "Polaris"
 PLSADJ: "Polaris"
 become_polaris: "Form Polaris"
 become_polaris_desc: "Although much of the northern isle of #E Polaris#! is covered by snow-covered plains and wind-whipped glaciers, the inhabitants of this inhospitable region seek to extend their dominions across the entire island. It has long been speculated that a united Polaris could become an important regional player, exercising an undue influence on northern Luxterra."
 formable_not_polaris_exists: "Polaris does not exist."

 # Polaris (Gnome)
 PKM: "Kemi"
 PKMADJ: "Kemic"
 become_kemi: "Form Kemi"
 become_kemi_desc: "Despite being away from our true home, #E #G Jaaltuvsk#!#!, this island, #E Kemi#!, has served as a homeland for our people for millenia. While the #E Polarian#! invaders have pushed our people to the northern glaciers, there is still a hope that we may one day control all of #E Kemi#! again."
 formable_not_kemi_exists: "Kemi does not exist."

 # Horteon (Gnome)
 NKL: "Nookti League"
 NKLADJ: "High Gnomic"
 become_nookti_league: "Form Nookti League"
 become_nookti_league_desc: "For centuries the #E Nookti#! cities of the #E Mudskvas Gnomes#! have lived in isolation and peace, farming the lands warmed by the glows of the #E Gnomish Hearths#!. However, recently the #R High Elven#! and #E Human#! invaders who live south of the #E Akool Mountains#! have been pushing north, intending to conquer the remaining Gnomes of the island. To ward off the invaders, the three cities must band together under a singular #E Nookti League#!!" 
 formable_not_nookti_league_exists: "Nookti League does not exist."

 # Horteon (Gnome)
 WSK: "Wuskouu"
 WSKADJ: "Wuskuic"
 become_wuskouu: "Reconquer Wuskouu"
 become_wuskouu_desc: "Long ago, the #E Gnomes#! of what the humans call #E Horteon#! lived in peace, living across the island either in small fishing communities, groups of nomadic pilgrims, or in one of the #E Nookti Cities#!. However, with the arrival of the #E Humans#! and later the cruel #E High Elves#!, the indigenous #E Gnomes#! of the #E Land of Fire and Ice#! have been pushed to glaciers and mountains of the harsh north of the continent. With both of the invaders embroiled in conflicts of their own creation, now is the time for the gnomes to rise up and reclaim #E Wuskouu#! for themselves!" 
 formable_not_wuskouu_exists: "Wuskouu does not exist."


 # Gnomes Return to Peaceful Valley
 GJT: "Jaaltuva"
 GJTADJ: "Gnomic"
 return_jaaltuvsk: "Return to Jaaltuvsk"
 return_jaaltuvsk_desc: "Milennia ago our people were exiled from #E #G Jaaltuvsk#!#! by #E Wekuaa#! as a result of the #E Great Sin#!. Ever since that day, our people await the arrival of the #E Messiah#! that will lead us back to the paradise that was our homeland!"
 formable_not_jaaltuvsk_exists: "Jaaltuva does not exist."

 # Norrfalia
 NFA: "Norrfalia"
 NFAADJ: "Norrfalia"
 become_norrfalia: "Form Norrfalia"
 become_norrfalia_desc: "For hundreds of years, outside influences have sought to prevent the Norrfalians from uniting, for they wisely foresaw that a strong #E Norrfalia#! would be able to resist foreign pressures - something that was intolerable to the Werhenlanders ambassadors and Zani diplomats that sought to keep the people divided and weak."
 formable_not_norrfalia_exists: "Norrfalia does not exist."

 # Eteradica
 ETD: "Eteradica"
 ETDADJ: "Eteradican"
 become_eteradica: "Form Eteradica"
 become_eteradica_desc: "Although the Dragkhanic #E Jarenam Empire#! has seized much of western Luxterra, these lands were once part and parcel of the vast holdings of the Eteradican cultures, who were unable to resist the dark forces that pushed them out of their homelands. Although surrounded by hostile powers that would love nothing more than to absorb their holdings, the tenacious Eteradicans have thus far resisted their enemies, and even harbor the dream of forming their own great power, #E Eteradica#!, one that would keep the Dragkhanics at bay."
 formable_not_eteradica_exists: "Eteradica does not exist."

 # Zainudia
 ZAI: "Zinduidian Kephal"
 ZAIADJ: "Zainudian"
 become_zainudia: "Restore the Kephal"
 become_zainudia_desc: "The message carried by the two prophets of the Zainudians, Jaoz the Bold and Bachin, Lord of Dui-Pattar, did not only promise spiritual salvation, but warned the blasphemers and unbelievers that the faith would one day be proclaimed by a future Kephal of the #E Zainudians#!. With the fall of the Zakara Kephal, this prophecy has captivated the hearts of the Zinduidian tribes, who found a source of strength in the teachings of the Zainudians and eagerly seek to forge their promised realm."
 formable_not_zainudia_exists: "The Kephal does not exist."

 # Golden Empire (gold dwarves)
 GOL: "Mâhdad Sho-Tan'Mâat Mâ'Azarî"
 GOLADJ: "Imperial Gold Dwarven"
 become_golden_empire: "Restore the Mâhdad Sho-Tan'Mâat Mâ'Azarî"
 become_golden_empire_desc: "Ages ago, as the invading armies of the #Y Zani Empire#! laid siege to the Azari capital of Tiuban, a prophecy was spoken by a priestess from the top of the ancient #E Great Ziggurat of Tiuban#!, #E Etemenazari#!. Death and destruction would soon have their day, but a #E Golden Empire#!, known as #G Mâhdad Sho-Tan'Mâat Mâ'Azarî#! in the Dwarven tongue, would eventually be built on the ashes of tomorrow.\n\nAlthough this magnificent temple would soon be obliterated by the conquering forces, with not a single stone left remaining atop the other, the #Y Golden Dream#!, as it came to be known, would take hold of the Azari imagination."
 formable_not_golden_empire_exists: "Mâhdad Sho-Tan'Mâat Mâ'Azarî does not exist."

 # Arteon
 ART: "Arteon"
 ARTADJ: "Arteonian"
 become_arteon: "Form Arteon"
 become_arteon_desc: "The High Elven invasions of the island of #E Arteon#! threw the troubled island into a state of chaos and unceasing warfare. Some Arteonians embraced the faith of the invaders, joining the Elves in attacking and enslaving their kinsmen, whereas others, believing that the end of days was at hand, threw themselves into the arms of the Viktreic Faith. Those that remained faithful to their ancestral ways soon found themselves fighting for their very existence.\n\nIt remains to be seen who will ultimately triumph in this region, and until the island is brought under one authority, the blood of elf and human will continue to be spilled."
 formable_not_arteon_exists: "Arteon does not exist."

 # Stellaric Consortium
 STC: "Stellaric Consortium"
 STCADJ: "Stellaric"
 ARTADJ: "Stellaric"
 become_stellaic_consortium: "Establish the Stellaric Consortium"
 become_stellaic_consortium_desc: "As the power and strength of the #E Stellaric Guildhouses#! concentrates in the province of Northstar, it has been decided that entire region of #E Central Ernorrfalie#! must be taken. Our merchants have need of the raw materials that are found in abundance around us, and only a #E Stellaric Consortium#! will properly manage the investments and potential of the peninsula." 
 formable_not_stellaic_consortium_exists: "The Stellaric Consortium does not exist."

 STE: "Stellaric Empire"
 STEADJ: "Imperial"
 formable_not_stellaic_empire_exists: "#Y The#! #T Stellaric Empire#! #Y must not exist.#!"
 become_stellaic_empire: "Proclaim the Stellaric Empire"
 become_stellaic_empire_desc: "Although the Stellaric Consortium has long been the economic powerhouse within eastern Luxterra, the time has come for our political borders to encompass the lands that surround us. Let us not deny what we are becoming, but embrace the #T Stellaric Empire#! that we are forming."

 # Grandland Kingdom
 GRD: "Grandland Kingdom"
 GRDADJ: "Grandland Kingdom"
 become_grandland: "Form Grandland Kingdom"
 become_grandland_desc: "Long ago, strife between the #Y Varglon#! and #Y Dureban#! cultures resulted in the latter being expelled from the #G Skyreach Mountains#!, where the Common Dwarves quickly took to the forests and hills that were sparsely populated by small groups of Fluvenlanders. Ever since that fateful migration, this region, which has since become known as the #Y Dwarven Grandlands#!, has been home to petty dwarven kingdoms. Many ambitious monarchs have dreamt of uniting the Dureban lordships into the #E Grandland Kingdom#!."
 formable_not_grandland_exists: "Grandland Kingdom does not exist."

 # Dawnstar (errnorfalie high elves)
 DST: "Dawnstar"
 DSTADJ: "Dawnstar"
 become_dawnstar: "Form Dawnstar"
 become_dawnstar_desc: "Although many of our High Elven brethren have taken to the waves, seeking their new homes in distant lands to the west, many of our people have remained in Eastern Luxterra where we have lived for countless centuries. Yet time has not been kind to us, and the #R Bloody Peninsula#! has become one of our last holdouts, for the Ernorrfallians have reduced our former glory to just two small kingdoms.\n\nDespite the direness of the situation, it is believed that a promised hero will come to smite down our enemies, seizing Ernorrfalie for the High Elves and establishing the Empire of #E Dawnstar#!."
 formable_not_dawnstar_exists: "Dawnstar does not exist."

 # The High Order (horteon high elves)
 HOD: "The High Order"
 HODADJ: "The High Order"
 become_high_order: "Form The High Order"
 become_high_order_desc: "Long ago, our forefathers sailed from the far East to the very ends of Omniluxia - the frozen island of #Y Horteon#!. Launching their invasion of the isle with no warning, they shattered the might of the Hortenic tribes and seized most of their southern coastal cities in one swift and brutal campaign.\n\nA rift between the High Elves caused them to eventually split into opposed kingdoms, yet this has not benefitted the natives in any way; they are mere pawns manipulated by the Elven factions in their struggles against each other.\n\nThe reason for this warfare is obvious; the first to unite the island will be able to establish #E The High Order#!, the High Elven Empire of Horteon."
 formable_not_high_order_exists: "The High Order does not exist."

 # Arithon Empire (arteon high elves)
 ARH: "Arithon Empire"
 ARHADJ: "Arithon Empire"
 become_arithon_empire: "Form Arithon Empire"
 become_arithon_empire_desc: "One of the greatest success stories of the High Elven campaign to conquer foreign lands in the wake of the #E Great Collapse#! can be found on the island of #Y Arteon#!, where the invaders have been locked in a death struggle with the native Artheousan for centuries.\n\nThe brutal wars, perhaps some of the most savage in all Omniluxian history, have not been able to dislodge the High Elves from the coasts, and the Ascendic faithful harbor ambitions of forming the #E Arithon Empire#! once they have destroyed their Artheousan enemies."
 formable_not_arithon_empire_exists: "Arithon Empire does not exist."

 # Deepwood (Northeast Luxterra forest elves)
 DPW: "Deepwood"
 DPWADJ: "Deepwood"
 become_deepwood: "Form Deepwood"
 become_deepwood_desc: "The #Y World's Lungs Forest#! and the #Y Peaceful Valley#! cradle some of the most primeval forests on Luxterra, and as the Deep Wood Elven guardians of this sacred place, it is our duty to ensure that these holy places are protected at all costs.\n\nAlthough the shedding of blood is always reprehensible, in order to safeguard our heritage, we must form the Empire of #E Deepwood#! as the Protector of Luxterra."
 formable_not_deepwood_exists: "Deepwood does not exist."

 # Mysticwood (South Luxterra forest elves)
 MYW: "Mysticwood"
 MYWADJ: "Mysticwood"
 become_mysticwood: "Form Mysticwood"
 become_mysticwood_desc: "In the #G Chronicles of the Wood Elves#!, it is written that long ago, the vast plains of #E Zarusshovia#! and #E Russhovia#! were once covered by a magical forest. Although this woodland has shrunk to a mere shadow of its former self, our people remember the power of old and long to restore #E Mysticwood#!. "
 formable_not_mysticwood_exists: "Mysticwood does not exist."

 # Evergreen Empire (Morrigon forest elves)
 EGE: "Evergreen Empire"
 EGEADJ: "Evergreen Empire"
 become_evergreen_empire: "Form Evergreen Empire"
 become_evergreen_empire_desc: "Millenia ago, Elven Sages heard the rustling of the wind in the #Y World's Lungs Forest#! foretell the coming of the #E Great Collapse#!, and in order to safeguard the ancient forests against the coming destruction, they sent their kinsmen to Morrigon with Yaga seeds from the primeval woodlands. These same prophecies also spoke of an #G Evergreen Empire#!, one that would encompass all of the west and prepare Omniluxia for a future catastrophe, something only known as the #E Day of Light#!."
 formable_not_evergreen_exists: "Evergreen Empire does not exist."

 # Eisenril (Morrigon Half-Elves)
 ERL: "Eisenril"
 ERLADJ: "Eisenril"
 become_eisenril: "Form Eisenril"
 become_eisenril_desc: "Since their inception centuries ago, the #G Half-Elf#! city-states of #Y Vetalia#! have been fighting against each other and foreign kingdoms. However, if one were able to unite the nine #E Dinaril#!, they could create a grand confederacy capable of rivaling the great powers of #Y Morrigan#!: #E Eisenril#!."
 formable_not_eisenril_exists: "Eisenril does not exist."

 # Greater Flusenland
 GFL: "Greater Flusenland"
 GFLADJ: "Greater Flusenland"
 become_greater_flusenland: "Form Greater Flusenland"
 become_greater_flusenland_desc: "For as long as anyone can remember, Flusenlander tribes have wandered through the plains of eastern Luxterra, following the Sun and Moon as it wanders across the firmament. The simple rhythm of their lives has been unchanged for thousands of years, yet there could come a day when a mighty Chieftain unites the tribesmen under a single banner - #E Greater Flusenland#!."
 formable_not_flusenland_exists: "Greater Flusenland does not exist."

 # Kingdom of Three Crowns (Zerywani)
 TCR: "Kingdom of Three Crowns"
 TCRADJ: "Kingdom of Three Crowns"
 become_three_crowns: "Form The Kingdom of Three Crowns"
 become_three_crowns_desc: "Zerywani folk tales are filled with stories of the three brothers #Y Zehi#!, #Y Rossovi#! and #Y Lechi#! - even a child of three years will be familiar with the legends and adventures of the famous siblings, and the three names remain popular options for the sons of the Zerywani to this day.\n\nIf a great Chief were to arise, one that could unite the lands of the Three Brothers to form the #E Kingdom of Three Crowns#!, then their name would be remembered alongside their famous progenitors."
 formable_not_three_crowns_exists: "Kingdom of Three Crowns does not exist."

 # Steel Horde (alaguric/selasukian)
 STH: "The Steel Horde"
 STHADJ: "The Steel Horde"
 become_steel_horde: "Form The Steel Horde"
 become_steel_horde_desc: "Some Empires are given as birthright to the undeserving - one should be as lucky as a Zani Prince, born in the Azure Palace of Durobaeraste - whereas other kingdoms are won in battle, and yet the price required for both is blood.\n\nNothing has ever been easy for the Alaguric and Selasukian people, but we are not babes to be wrapped in silk swaddling clothes, gods forbid. We are a nation of warriors, and the #E Steel Horde#! rides on iron-shod horses and rains death upon our enemies!"
 formable_not_steel_horde_exists: "The Steel Horde does not exist."

 # Dragkhanic Empire
 DKE: "Dragkhanic Empire"
 DKEADJ: "Dragkhanic Empire"
 become_drakhanic_empire: "Form Dragkhanic Empire"
 become_drakhanic_empire_desc: "The greatest tragedies that the Dragkhanic nations have ever experienced have been self-inflicted wounds, as civil war and assassination has often flung our people into periods of chaos - truly, we are masters of self-sabotage.\n\nBut a new generation of Dragkhanic warlords, one that cannot be distracted by internal dissesnsion, have proclaimed their intention to form a #E Dragkhanic Empire#! - they will reserve their contempt and misery for the enslaved nations under their feet."
 formable_not_drakhanic_empire_exists: "Dragkhanic Empire does not exist."

 # Ketep (baetep+)
 KTP: "Ketep"
 KTPADJ: "Ketep"
 become_ketep: "Form Ketep"
 become_ketep_desc: "While the #Y Kingdom of Baetep#! has maintained a position of dominance over its neighbors, no doubt thanks to the power and influence of the Phanician #E Sertemic Dynasty#!, the time has come to subdue these breakaway provinces and reunite the glory of old - #E Ketep#!. Only then will we be able to stand against the threat of a resurgent #Y Zani Empire#!."
 formable_not_ketep_exists: "Ketep does not exist."

 # Great Wolf (borderlander)
 GWK: "Kingdom of The Great Wolf"
 GWKADJ: "Form Kingdom of The Great Wolf"
 become_great_wolf_kingdom: "Form Kingdom of The Great Wolf"
 become_great_wolf_kingdom_desc: "The Borderlanders have always been forced to think on their feet, resorting to cleverness when strength of arms was not enough to protect them from the Empires surrounding them, and it is through their plucky refusal to give in that they have managed to survive as long as they have.\n\nOn clear nights, when the moon hangs low in the sky and the sound of the wolf cry pierces the gloom, one can hear echoes of #Y Lula#!'s ethereal voice singing the legend of the #E Kingdom of the Great Wolf#!, a promised refuge from the ravages of Empire."
 formable_not_great_wolf_exists: "Kingdom of The Great Wolf does not exist."

 # Neo Emzalian Kingdom (marshlander)
 NEK: "Neo Emzalian Kingdom"
 NEKADJ: "Neo Emzalian Kingdom"
 become_neo_emzalian_kingdom: "Form Neo Emzalian Kingdom"
 become_neo_emzalian_kingdom_desc: "The stagnant waters of the #G Emzalian Swamp#! are home to many #E Lupinite#! tribes, who have built towns and settlements in the unfriendly marshlands as a way to discourage invading armies from despoiling their civilization.\n\nWhile few care to venture within the mosquito-infested heart of Emzalia, the warlords living within the morass have often dreamt of spilling out of the swamp and uniting their region into the #E Neo Emzalian Kingdom#!."
 formable_not_emzalia_exists: "Neo Emzalian Kingdom does not exist."

# Baetep (upper egyptians)
BAE: "Baetep"
BAEADJ: "Baetepian"
become_baetep: "Form Baetep"
become_baetep_desc: "It is a dark time for the Baetepian faithful - a foreign dynasty, the Sertemic, sits on the Pomegranate Throne, and has abandoned the traditional rituals of our people in order to worship Zanis - an abomination that, if unchecked, threatens to unleash chaos throughout the universe.\n\nAlthough many have lost hope, believing that the glory days of #E Baetep#! are over, some have not given up and have vowed to conquer the invader and restore the faith."
formable_not_baetep_exists: "Baetep does not exist."

# Koni League
KNO: "Koni League"
KNOADJ: "Koni League"
become_kione_league: "Form the Koni League"
become_kione_league_desc: "The name of our homeland is a misnomer - the #E Peaceful Valley#! has long been a battleground for invading Elven and Northlander armies that seek to take advantage of inter-clan wars and feuds. Many prominent intellectuals and B'au-B'au have brought up ideas of unification as a means to protect all children of #E Kon#! from outside invasions, however, throughout Kinones history infighting and power blocs have made unification an idea restricted to the upper classes.\n\nDivided by clans, heritage, and culture, the various Kinones clans are only united in one thing: their faith. If we wish to truly protect ourselves from those that hope to enslave us, then we must rally the sons of #E Kon#! behind our flag and take control of our Valley to form a great #E Koni League#! that can truly protect our people!"
formable_not_kinones_exists: "Koni League does not exist."

# Kerthaga (Phanicans)
KGA: "Kerthaga"
KGAADJ: "Kerthagan"
become_kerthaga: "Form Kerthaga"
become_kerthaga_desc: "The Phanicians are extensive record keepers, and yet even their histories cannot definitively say that the western coast of Luxterra is their original homeland. Some folk legends speak of their ancestors sailing here from far to the East after a great catastrophe ruined the Motherlands.\n\nDespite being surrounded by aggressive neighbors that have long desired their prosperous farmlands, the Phanicians have clinged to their rocky coastline against all odds. And while maintaining their freedom from the #E Jarenam Empire#! has dominated the story of the last few decades - a contest that they are slowly losing - the ambitious among them have sometimes dream of reconquering their seized territories and forming a new nation - #E Kerthaga#!."
formable_not_kerthaga_exists: "Kerthaga does not exist."

# Ascendic Eptelon (high elves on eptelon)
ASE: "Ascendic Eptelon"
ASEADJ: "Ascendic Eptelonian"
become_ascendic_eptelon: "Form Ascendic Eptelon"
become_ascendic_eptelon_desc: "Although the High Elves have focused their conquests on #E Arteon#! and #E Horteon#!, a substantial number of their forces have established petty kingdoms on the northern coasts of #E Eptelon#!. Although the natives will resist the Elven incursion mightily, we must subdue the inhabitants of the isle and bring them into the fold of an #E Ascendic Eptelon#!."
formable_not_ascendic_eptelon_exists: "Ascendic Eptelon does not exist."

# Ponomoton ( Sea Elves )
PON: "Ponomoton"
PONADJ: "Ponomotonic"
become_ponomoton: "Form Ponomoton"
become_ponomoton_desc: "Ever since the traumatic #E #R Great Collapse#!#! the once mighty #E #G Sea Elf#!#! civilization has gone into decline. Ruined cities dot the #E Central Omniluxian Isles#!, with the few bastions of civilization left constantly assaulted by nature and those that have regressed to savagery. However, there is a prophecy that claims that one of the remaining #E Sea Elf#! citis will one day re-unite the island under a great kingdom, the #E Ponomoton#!!"
formable_not_ponomoton_exists: "Ponomoton does not exist."

RHP: "Rohenevia"
RHPADJ: "Rohenevian"
become_rohenevia: "Form Rohenevia"
become_rohenevia_desc: "The vast realm that lies north of the Rohanoan Range has long been called the Rohenevian, a word that immediately conjures to mind the unique cultures of western Morrigon that live on the peninsula. Never before has a single country united these lands under one banner, but that time has come."
formable_not_rohenevia_exists: "Rohenevia does not exist."

 # Kingdom of Ytalia
 YGA_ADJ: "Ytalian"
 become_ytalia: "Establish an Independent Ytalia"
 become_ytalia_desc: "Ever since the inception of the great #E Zani Empire#! our humble kingdom has existed solely as a vassal of the great #E Geallian#! empire. For a time, this arrangement suited us fine, as our kingdom retained special privileges not afforded to other provinces conquered by #E Zanis Zani#!, and our lands flourished under his wise rule. However, as the centuries passed, our unique culture and status have faced a slow decline perpetuated by the great emperor's incompetent descendents.\n\nNow what's left of our kingdom is a rump state, ruling over a fraction of our people with authority determined by the whims of the #E Razani#! emperor. With total collapse on the horizon and nomadic barbarians at our border, perhaps it is time for #E Ytalia#! to once again rise as an independent power at the edges of the #E Geallian#! world!"

 #New World Tier 1 Formables
 formable_not_nwa_exists: "Mosshide Dominion does not exist."
 form_mosshide_dominion: "Form the Mosshide Dominion"
 form_mosshide_dominion_desc: "The Saurthi of the northern marshes have long squabbled amongst themselves, their great scaled bodies slipping through the muddy waters as they fought over territory and prey. Yet there is strength in unity, and a Dominion of the Mosshides would bring the warring tribes under one banner, creating a power that the other races of the New World would learn to respect."
 NWA: "Mosshide Dominion"
 NWA_ADJ: "Mosshide"

 formable_not_nwb_exists: "Amberhive does not exist."
 form_amberhive: "Form the Amberhive"
 form_amberhive_desc: "The Chivix have always been a communal people, their countless eyes and limbs working in perfect harmony to build great hives from the resin of the amber trees. But a true Amberhive, one that unites all the scattered nests under a single queen, would be a sight to behold - a golden monument to the industry of the insectoid race."
 NWB: "Amberhive"
 NWB_ADJ: "Amberhive"

 formable_not_nwc_exists: "Cloudwatch does not exist."
 form_cloudwatch: "Form the Cloudwatch"
 form_cloudwatch_desc: "The Ayrith soar high above the peaks of the New World, their great wings carrying them where no ground-walker can follow. But even the sky has borders, and it is time for the winged folk to establish a Cloudwatch over their domain, a kingdom that reaches toward the heavens themselves."
 NWC: "Cloudwatch"
 NWC_ADJ: "Cloudwatch"

 formable_not_nwd_exists: "Sporewood does not exist."
 form_sporewood: "Form the Sporewood"
 form_sporewood_desc: "Deep beneath the canopy of the fungal forests, the Mycelar cultivate their networks of symbiotic growth. The Sporewood would be a realm where the great fungus minds connect, sharing thoughts and nutrients across an entire region, a living kingdom of interconnected consciousness."
 NWD: "Sporewood"
 NWD_ADJ: "Sporewood"

 formable_not_nwe_exists: "Dunescar does not exist."
 form_dunescar: "Form the Dunescar"
 form_dunescar_desc: "The shifting sands of the great New World deserts hide ancient ruins and valuable resources, and the Tsaalan people are the only ones who know how to navigate these treacherous wastes. A unified Dunescar would become the master of the sands, controlling the trade routes that cross the great erg."
 NWE: "Dunescar"
 NWE_ADJ: "Dunescar"

 formable_not_nwf_exists: "Deepstone does not exist."
 form_deepstone: "Form Deepstone"
 form_deepstone_desc: "The Vothkin have always been at home in the darkness beneath the mountains, their picks and hammers carving great halls from the living rock. Deepstone would be the greatest of these halls, a kingdom that stretches through the roots of the mountains themselves, uniting all Vothkin under one stone roof."
 NWF: "Deepstone"
 NWF_ADJ: "Deepstone"

 formable_not_nwg_exists: "Frosthowl does not exist."
 form_frosthowl: "Form the Frosthowl"
 form_frosthowl_desc: "When the winter winds howl through the northern wilds, the Ulvenar answer with their own voices raised to the moon. The Frosthowl Pack would unite the scattered wolf-kin under a single alpha, creating a hunting ground that stretches from the frozen tundra to the boreal forests."
 NWG: "Frosthowl"
 NWG_ADJ: "Frosthowl"

 formable_not_nwh_exists: "Saltmere does not exist."
 form_saltmere: "Form the Saltmere"
 form_saltmere_desc: "The Selkanu know the secrets of the tides better than any other, their slick skin allowing them to glide through the coastal waters with ease. A Saltmere Dominion would control the bays and inlets of the New World coast, making every harbor and estuary answer to the sea folk."
 NWH: "Saltmere"
 NWH_ADJ: "Saltmere"

 formable_not_nwi_exists: "Emberpeak does not exist."
 form_emberpeak: "Form Emberpeak"
 form_emberpeak_desc: "The Khedrim forge their civilization in the hearts of volcanoes, their furnaces fed by the magma that flows beneath the earth. Emberpeak would be the greatest forge-hold of them all, a kingdom built around a living volcano, where the hammer-falls echo like thunder across the land."
 NWI: "Emberpeak"
 NWI_ADJ: "Emberpeak"

 formable_not_nwj_exists: "Jade Kingdom does not exist."
 form_jade_kingdom: "Form the Jade Kingdom"
 form_jade_kingdom_desc: "The Tenmari build their temples from the precious jade that is found only in the deepest jungles of the New World. A Jade Kingdom would unite the city-states under a single emperor, ruling from a throne carved from a single block of the sacred green stone."
 NWJ: "Jade Kingdom"
 NWJ_ADJ: "Jade"

 formable_not_nwk_exists: "Scale March does not exist."
 form_scale_march: "Form the Scale March"
 form_scale_march_desc: "The Saurthi warriors who dwell in the borderlands between the marshes and the plains have long served as the first line of defense against invaders from the interior. The Scale March would unite these hardy defenders into a nation of border wardens, their scales gleaming like armor in the sun."
 NWK: "Scale March"
 NWK_ADJ: "Scale March"

 formable_not_nwl_exists: "Stinger Domain does not exist."
 form_stinger_domain: "Form the Stinger Domain"
 form_stinger_domain_desc: "The most aggressive of the Chivix swarms are those that dwell in the southern badlands, where only the fittest survive. The Stinger Domain would be a kingdom built on the principle of survival of the fittest, where every subject must prove their worth through combat and contribution to the hive."
 NWL: "Stinger Domain"
 NWL_ADJ: "Stinger"

 formable_not_nwm_exists: "Windreach does not exist."
 form_windreach: "Form Windreach"
 form_windreach_desc: "The Ayrith of the central highlands have long enjoyed the strong thermals that rise from the valleys below. Windreach would be their crowning achievement, a nation that spans the plateaus and peaks where the winds are always favorable for flight."
 NWM: "Windreach"
 NWM_ADJ: "Windreach"

 formable_not_nwn_exists: "Gloomhold does not exist."
 form_gloomhold: "Form Gloomhold"
 form_gloomhold_desc: "In the deepest, darkest parts of the fungal forests, where even the light of the glowing mushrooms cannot penetrate, the Mycelar have built their most secret settlements. Gloomhold would unite these shadowy kingdoms into a realm that rules from the darkness, a court of perpetual twilight."
 NWN: "Gloomhold"
 NWN_ADJ: "Gloomhold"

 formable_not_nwo_exists: "Sand Crown does not exist."
 form_sand_crown: "Form the Sand Crown"
 form_sand_crown_desc: "The Tsaalan oasis-dwellers have always known that water is power in the desert. A Sand Crown would unite the scattered oases under a single ruler, creating a kingdom where the precious wells and springs are protected by a central authority, ensuring the survival of all."
 NWO: "Sand Crown"
 NWO_ADJ: "Sand Crown"

 formable_not_nwp_exists: "Iron Gate does not exist."
 form_iron_gate: "Form the Iron Gate"
 form_iron_gate_desc: "The Vothkin mountain fortresses guard the passes between the New World's many regions, controlling the flow of trade and migration. The Iron Gate would unite these strategic fortresses under a single command, creating a nation that controls the very arteries of the continent."
 NWP: "Iron Gate"
 NWP_ADJ: "Iron Gate"

 formable_not_nwq_exists: "Shadowmoon does not exist."
 form_shadowmoon: "Form Shadowmoon"
 form_shadowmoon_desc: "When the moon is hidden by clouds and the world is cast into shadow, the Ulvenar are most at home. Shadowmoon would be a kingdom that embraces the darkness, a realm of hunters and night-stalkers who move unseen through the forests of the New World."
 NWQ: "Shadowmoon"
 NWQ_ADJ: "Shadowmoon"

 formable_not_nwr_exists: "Coral Guard does not exist."
 form_coral_guard: "Form the Coral Guard"
 form_coral_guard_desc: "The Selkanu have built their civilization around the great coral reefs that fringe the New World's coasts. The Coral Guard would be a maritime kingdom dedicated to protecting these living structures, their cities growing from the coral itself in a symbiotic relationship with the sea."
 NWR: "Coral Guard"
 NWR_ADJ: "Coral Guard"

 formable_not_nws_exists: "Obsidian Forge does not exist."
 form_obsidian_forge: "Form the Obsidian Forge"
 form_obsidian_forge_desc: "The Khedrim have mastered the art of working obsidian, the black glass that forms when volcanic fury meets the cold air. An Obsidian Forge kingdom would be a realm of master smiths, where weapons and tools of surpassing sharpness are crafted for the glory of the fire dwarves."
 NWS: "Obsidian Forge"
 NWS_ADJ: "Obsidian"

 formable_not_nwt_exists: "Sun Throne does not exist."
 form_sun_throne_nw: "Claim the Sun Throne"
 form_sun_throne_nw_desc: "The Tenmari believe that their emperors are descended from the sun itself, and the Sun Throne is the seat from which they rule. Claiming this throne would unite all Tenmari under a single solar dynasty, bringing light and order to the jade kingdoms."
 NWT: "Sun Throne"
 NWT_ADJ: "Solar"

 formable_not_nwu_exists: "Mistscale does not exist."
 form_mistscale: "Form the Mistscale"
 form_mistscale_desc: "The Saurthi of the misty lowlands are masters of camouflage and ambush, their scales shifting color to match the fog that rolls in from the coast. A Mistscale kingdom would be a realm of hidden paths and secret cities, where only the lizardfolk know the way through the eternal mists."
 NWU: "Mistscale"
 NWU_ADJ: "Mistscale"

 formable_not_nwv_exists: "Silk Court does not exist."
 form_silk_court: "Form the Silk Court"
 form_silk_court_desc: "The Chivix produce a fine silk from their spinnerets, a fabric prized across the New World for its strength and beauty. The Silk Court would be a kingdom built on this trade, a realm of weavers and merchants who control the production of the most valuable textile in the continent."
 NWV: "Silk Court"
 NWV_ADJ: "Silk Court"

 formable_not_nww_exists: "Stormpeak does not exist."
 form_stormpeak: "Form Stormpeak"
 form_stormpeak_desc: "The highest peaks of the New World are battered by constant storms, but the Ayrith see this as a blessing rather than a curse. Stormpeak would be a kingdom that harnesses the power of the tempest, its aeries crackling with lightning and its people riding the gales."
 NWW: "Stormpeak"
 NWW_ADJ: "Stormpeak"

 formable_not_nwx_exists: "Duskcap does not exist."
 form_duskcap: "Form the Duskcap"
 form_duskcap_desc: "The great duskcap mushrooms are the largest organisms in the fungal forests, their caps creating vast umbrella-like canopies. A Duskcap kingdom would be one where the Mycelar cultivate these giants into living cities, entire metropolises growing from a single fungal network."
 NWX: "Duskcap"
 NWX_ADJ: "Duskcap"

 formable_not_nwy_exists: "Ash March does not exist."
 form_ash_march: "Form the Ash March"
 form_ash_march_desc: "The volcanic plains of the southern New World are covered in ash that fertilizes the soil, and the Tsaalan have learned to farm these lands. The Ash March would be a kingdom of volcanic farmers, their fields enriched by the very forces that other races flee from."
 NWY: "Ash March"
 NWY_ADJ: "Ash March"

 formable_not_nwz_exists: "Thunderhold does not exist."
 form_thunderhold: "Form Thunderhold"
 form_thunderhold_desc: "The Vothkin believe that the thunder is the sound of their gods forging the world, and they have built their greatest halls to amplify this divine noise. Thunderhold would be a kingdom where the very mountains sing with the sound of dwarven industry."
 NWZ: "Thunderhold"
 NWZ_ADJ: "Thunderhold"

 formable_not_n01_exists: "Bloodmoon does not exist."
 form_bloodmoon: "Form Bloodmoon"
 form_bloodmoon_desc: "When the moon turns red, the Ulvenar say that the spirits of their ancestors hunt among the living. Bloodmoon would be a kingdom dedicated to these ancestral hunters, a realm where the wolf-kin honor their past while building their future."
 N01: "Bloodmoon"
 N01_ADJ: "Bloodmoon"

 formable_not_n02_exists: "Deepwave does not exist."
 form_deepwave: "Form Deepwave"
 form_deepwave_desc: "The Selkanu who dwell in the deepest waters have seen things that surface-dwellers can only dream of. Deepwave would be a kingdom of the abyss, a realm that stretches from the coral shoals to the darkest trenches, claiming the ocean itself as its territory."
 N02: "Deepwave"
 N02_ADJ: "Deepwave"

 formable_not_n03_exists: "Pyre March does not exist."
 form_pyre_march: "Form the Pyre March"
 form_pyre_march_desc: "The Khedrim of the southern volcanic ranges tend the eternal flames that burn in the calderas. The Pyre March would be a kingdom of fire-worshipers, their forges stoked by the heat of the earth itself, producing weapons of legendary quality."
 N03: "Pyre March"
 N03_ADJ: "Pyre March"

 formable_not_n04_exists: "Feathered Crown does not exist."
 form_feathered_crown: "Form the Feathered Crown"
 form_feathered_crown_desc: "The Tenmari warriors adorn themselves with the brilliant feathers of the tropical birds that inhabit the jungles. The Feathered Crown would be a kingdom where these warriors are united under a single warlord, their feathered headdresses creating a rainbow of authority."
 N04: "Feathered Crown"
 N04_ADJ: "Feathered"

 #New World Tier 2 Formables
 formable_not_n05_exists: "Great Serpent Kingdom does not exist."
 form_great_serpent: "Form the Great Serpent Kingdom"
 form_great_serpent_desc: "The Saurthi speak of a great serpent that once ruled the entire northern New World, its coils encircling the mountains and its scales reflecting the sun. The Great Serpent Kingdom would be a return to this legendary age, uniting all lizardfolk under a single, powerful ruler who claims descent from the primordial beast."
 N05: "Great Serpent Kingdom"
 N05_ADJ: "Great Serpent"

 formable_not_n06_exists: "Greathive Dominion does not exist."
 form_greathive: "Form the Greathive Dominion"
 form_greathive_desc: "The Chivix have always dreamed of a perfect union, where every mind is connected and every worker serves the whole. The Greathive Dominion would be this dream made manifest, a nation where individuality is sacrificed for the good of the collective, and the hive mind stretches across the land."
 N06: "Greathive Dominion"
 N06_ADJ: "Greathive"

 formable_not_n07_exists: "Azure Kingdom does not exist."
 form_azure_kingdom: "Form the Azure Kingdom"
 form_azure_kingdom_desc: "The Ayrith lords of the northern skies have long claimed dominion over the blue expanse above the clouds. The Azure Kingdom would be their crowning achievement, a realm that stretches from horizon to horizon, where the sky is not a limit but a homeland."
 N07: "Azure Kingdom"
 N07_ADJ: "Azure"

 formable_not_n08_exists: "Fungal Empire does not exist."
 form_fungal_empire: "Form the Fungal Empire"
 form_fungal_empire_desc: "The Mycelar believe that their fungal networks connect all living things, and that a great empire could be built on these connections. The Fungal Empire would be a realm where the boundaries between individuals blur, and the entire nation acts as a single, vast organism."
 N08: "Fungal Empire"
 N08_ADJ: "Fungal"

 formable_not_n09_exists: "Dust Empire does not exist."
 form_dust_empire: "Form the Dust Empire"
 form_dust_empire_desc: "The great desert that dominates the central New World is a harsh teacher, but the Tsaalan have learned its lessons well. The Dust Empire would be a nation of survivors, a kingdom that controls the desert's oases, trade routes, and ancient secrets."
 N09: "Dust Empire"
 N09_ADJ: "Dust"

 formable_not_n10_exists: "Mountain Realm does not exist."
 form_mountain_realm: "Form the Mountain Realm"
 form_mountain_realm_desc: "The Vothkin have carved their kingdoms into the bones of the earth, but a true Mountain Realm would unite all these holds under a single high king. Such a realm would stretch from peak to peak, its subjects never needing to descend to the lands of the surface-dwellers."
 N10: "Mountain Realm"
 N10_ADJ: "Mountain"

 formable_not_n11_exists: "Howling Kingdom does not exist."
 form_howling_kingdom: "Form the Howling Kingdom"
 form_howling_kingdom_desc: "The Ulvenar believe that when they howl at the moon, they are not just communicating with each other, but with the spirits of the wild itself. The Howling Kingdom would be a nation where this primal connection is the foundation of society, a realm of hunters and shamans."
 N11: "Howling Kingdom"
 N11_ADJ: "Howling"

 formable_not_n12_exists: "Tide Empire does not exist."
 form_tide_empire: "Form the Tide Empire"
 form_tide_empire_desc: "The Selkanu know that the tides connect all coasts, and that whoever controls the tides controls the shores. The Tide Empire would be a maritime nation of unprecedented power, its fleets riding the currents from one end of the New World to the other."
 N12: "Tide Empire"
 N12_ADJ: "Tide"

 formable_not_n13_exists: "Magma Kingdom does not exist."
 form_magma_kingdom: "Form the Magma Kingdom"
 form_magma_kingdom_desc: "The Khedrim forge-holds are built around the geological hotspots of the New World, where magma flows close to the surface. The Magma Kingdom would unite these fiery citadels under a single pyre-king, creating a nation that draws its power from the very heart of the world."
 N13: "Magma Kingdom"
 N13_ADJ: "Magma"

 formable_not_n14_exists: "Obsidian Throne does not exist."
 form_obsidian_throne: "Claim the Obsidian Throne"
 form_obsidian_throne_desc: "The Tenmari speak of a prophesied emperor who will claim the Obsidian Throne, uniting all the jade kingdoms under a single ruler. This emperor would bring an end to the wars that have plagued the Tenmari for generations, ushering in an era of peace and prosperity."
 N14: "Obsidian Throne"
 N14_ADJ: "Obsidian"

 formable_not_n15_exists: "Wind Empire does not exist."
 form_wind_empire: "Form the Wind Empire"
 form_wind_empire_desc: "The Ayrith have long known that the winds that sweep across the New World are not random, but follow ancient patterns that can be understood and harnessed. The Wind Empire would be a nation of sky-sages and wind-riders, their dominion stretching wherever the breeze can carry them."
 N15: "Wind Empire"
 N15_ADJ: "Wind"

 formable_not_n16_exists: "Dusk Empire does not exist."
 form_dusk_empire: "Form the Dusk Empire"
 form_dusk_empire_desc: "As the sun sets over the fungal forests, the Mycelar come alive, their phosphorescent bodies lighting up the darkness. The Dusk Empire would be a realm of eternal twilight, where the glow of the fungus illuminates cities of organic architecture."
 N16: "Dusk Empire"
 N16_ADJ: "Dusk"

 formable_not_n17_exists: "Moonshadow Empire does not exist."
 form_moonshadow_empire: "Form the Moonshadow Empire"
 form_moonshadow_empire_desc: "The Ulvenar of the southern wilds have developed a sophisticated culture built around the phases of the moon, their society changing with the lunar cycle. The Moonshadow Empire would be the ultimate expression of this culture, a kingdom that waxes and wanes with the celestial bodies."
 N17: "Moonshadow Empire"
 N17_ADJ: "Moonshadow"

 formable_not_n18_exists: "Coral Empire does not exist."
 form_coral_empire: "Form the Coral Empire"
 form_coral_empire_desc: "The great coral reefs of the eastern New World are among the most biodiverse ecosystems in the known world, and the Selkanu have learned to live in harmony with them. The Coral Empire would be a nation that protects these reefs while benefiting from their bounty."
 N18: "Coral Empire"
 N18_ADJ: "Coral"

 formable_not_n19_exists: "Jade Empire does not exist."
 form_jade_empire: "Form the Jade Empire"
 form_jade_empire_desc: "The Tenmari prophesy that one day, all the peoples of the New World will be united under a single Jade Empire, bringing an end to the conflicts that have divided the continent for millennia. This empire would be the greatest ever seen in the New World, its influence stretching from sea to sea."
 N19: "Jade Empire"
 N19_ADJ: "Jade Empire"


