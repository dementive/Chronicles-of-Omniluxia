l_english:
 omni_dryad:0 "Dryads"
 omni_dryad_desc:0 "Forest spirits called forth to fight as heavy infantry."
 omni_legion_omni_dryad_locked:0 "#T Dryads cannot join this legion#!\nThe dryads keep faith only with the #Y Deepwood#! and #Y Westbough#! Wood Elves, and even then they want the terms in writing. Research #Y The Grove Compact#!, or cast #Y Summon Dryads#! on a forest or jungle territory and accept a shorter arrangement.\n#I Right-click to remove a queued cohort.#!"
 omni_dryad_grove_compact_inv:0 "The Grove Compact"
 omni_dryad_grove_compact_inv_desc:0 "Every spring the elders walk the boundary oaks with a basket of seed and a ledger, and by the time they reach the last tree they have agreed how many saplings will be planted for each dryad who marches with the band. The dryads have never once been late to a muster, although the quartermasters have learned that a missed planting is remembered for about three hundred years."
 omni_dryad_grove_compact_inv_tt:0 "#Y Dryads#! may be recruited by #Y Deepwood#! and #Y Westbough#! Wood Elves and added to their #Y Legions#!."
 omni_grove_ambush:0 "Grove Ambush"
 omni_grove_ambush_desc:0 "Dryads lie in wait, then surge forward to break advancing troops before they can regroup."
 omni_dryad_forest_combat_bonus:0 "Dryad Combat Bonus in Forest"
 omni_dryad_eldritch_forest_combat_bonus:0 "Dryad Combat Bonus in Eldritch Forest"
 omni_dryad_dry_plains_combat_bonus:0 "Dryad Combat Bonus in Dry Plains"
 omni_dryad_dry_hills_combat_bonus:0 "Dryad Combat Bonus in Dry Hills"
 omni_dryad_desert_combat_bonus:0 "Dryad Combat Bonus in Desert"
 omni_dryad_desert_hills_combat_bonus:0 "Dryad Combat Bonus in Desert Hills"
