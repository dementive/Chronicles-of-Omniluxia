l_english:

 #Shared tooltip
 omni_disease_spreading_tt:0 "The sickness has spread into the neighboring lands."

 #Grey Cough
 omni_disease.1.t:0 "Grey Cough"
 omni_disease.1.desc:0 "A hacking cough is going through the tenement rows of [grey_cough_province.GetName|Y], and what comes up with it is grey. It takes the old and the very small and leaves everyone else standing, which is precisely why nobody troubled to stop it early. The overseers now report the fields being worked at two thirds strength and the granary count short again."
 omni_disease.1.a:0 "Shut the tenements and post watchmen"
 omni_disease.1.b:0 "It is a cough"
 omni_disease.2.t:0 "The Cough Fades"
 omni_disease.2.desc:0 "The grey has gone out of it. [grey_cough_province.GetName|Y] coughs no worse now than any village coughs in a wet season, and the overseers have stopped counting. The short harvest will be felt at the tax and not a great deal longer than that."
 omni_disease.2.a:0 "Little enough, in the end"

 #Sailor's Rot
 omni_disease.3.t:0 "Sailor's Rot"
 omni_disease.3.desc:0 "The stores on the wharves of [sailors_rot_province.GetName|Y] have gone over, and the water casks with them. The dockhands are showing it first - gums gone soft and bleeding, old scars opening as though they were new, the strength going out of men who could shoulder a barrel a month ago. Ships are putting in, taking one look at the state of the quay, and putting straight back out."
 omni_disease.3.a:0 "Buy fresh stores at whatever they ask"
 omni_disease.3.b:0 "The casks will hold until the season turns"
 omni_disease.4.t:0 "The Rot Recedes"
 omni_disease.4.desc:0 "Clean water and a season of decent stores have put the men back on their feet at [sailors_rot_province.GetName|Y]. The old scars have closed again. The masters of the quay have quietly stopped buying from whoever sold them the last consignment."
 omni_disease.4.a:0 "Back to work"

 #River Flux
 omni_disease.5.t:0 "River Flux"
 omni_disease.5.desc:0 "The river through [river_flux_province.GetName|Y] is low and brown and barely moving, and everything that drinks from it is sick. The locals call this the low water and expect it most years; they did not expect it this early, or this hard. The same channel that feeds the fields is emptying the houses standing beside them."
 omni_disease.5.a:0 "Boil every drop and post men at the banks"
 omni_disease.5.b:0 "They have drunk this water all their lives"
 omni_disease.6.t:0 "The Flux Passes"
 omni_disease.6.desc:0 "The rains came up and the river with them, and whatever was sitting in the shallows off [river_flux_province.GetName|Y] has gone downstream to become somebody else's difficulty. The wells are sweet again."
 omni_disease.6.a:0 "Let the sea have it"

 #Blue Tongue Fever
 omni_disease.7.t:0 "Blue Tongue Fever"
 omni_disease.7.desc:0 "A shivering fever is rising out of the standing water around [marsh_ague_province.GetName|Y], and it takes people in waves - three days down, a week upright, three days down again. They call it the #T Blue Tongue#! for the color it leaves in the mouth, which the healers say means nothing and the mothers say means everything. It is not a fever that kills quickly. It is a fever that does not let go."
 omni_disease.7.a:0 "Cut channels and drain the standing water"
 omni_disease.7.b:0 "The marsh has always had its fevers"
 omni_disease.8.t:0 "The Blue Tongue Lingers"
 omni_disease.8.desc:0 "It has not broken. [marsh_ague_province.GetName|Y] is worse than it was a fortnight ago - more beds full, fewer hands in the reed beds, and the waves arriving closer together each time. The governor writes asking for healers and does not say what he expects them to do."
 omni_disease.8.a:0 "Send every healer we can spare"
 omni_disease.8.b:0 "There is nothing for it but to wait"
 omni_disease.9.t:0 "The Blue Tongue Breaks"
 omni_disease.9.desc:0 "The fever has finally let go of [marsh_ague_province.GetName|Y]. Those who lived through it will shake in cold weather for the rest of their lives and can be picked out of a crowd by it. The marsh, being a marsh, will have it again."
 omni_disease.9.a:0 "Until the next wet year"

 #Deep Rot
 omni_disease.10.t:0 "Deep Rot"
 omni_disease.10.desc:0 "The men coming up out of the deep workings under [deep_rot_province.GetName|Y] are coughing black. It is not dust - dust settles, and this does not. Something is growing down in the lower galleries where the air stands still, and it has begun growing in the miners as well."
 omni_disease.10.a:0 "Seal the lower galleries"
 omni_disease.10.b:0 "The ore is worth a cough"
 omni_disease.11.t:0 "The Rot Spreads Below"
 omni_disease.11.desc:0 "It was one gallery. It is now four. The rot has followed the dead air along the whole lower level of [deep_rot_province.GetName|Y], and the men going down are aware of it, and are going down regardless, because that is what they are paid for."
 omni_disease.11.a:0 "Sink air shafts and clear the deep levels"
 omni_disease.11.b:0 "Keep the ore moving"
 omni_disease.12.t:0 "The Shafts Clear"
 omni_disease.12.desc:0 "Fresh air has been let into the lower workings of [deep_rot_province.GetName|Y] and whatever was growing there has died back. The galleries that were sealed have stayed sealed. Nobody has proposed opening them."
 omni_disease.12.a:0 "Back to the deep"

 #Hollowfrost
 omni_disease.13.t:0 "Hollowfrost"
 omni_disease.13.desc:0 "The deep cold has settled over [glacier_chill_province.GetName|Y] and has brought something down with it. It begins as a fever and it ends in the lungs, and the healers have no name for the stage between, only the observation that a warm patient is generally a living one. Firewood has become the most valuable commodity in the province."
 omni_disease.13.a:0 "Open the stores - furs and firewood to every house"
 omni_disease.13.b:0 "The cold always passes"
 omni_disease.14.t:0 "The Frost Deepens"
 omni_disease.14.desc:0 "It has not eased. Half of [glacier_chill_province.GetName|Y] is bedridden and the other half is out cutting wood, and the wood is not lasting. The governor reports that the sick who are kept warm recover and the sick who are not, do not, and appears to regard this as a discovery."
 omni_disease.14.a:0 "Burn the reserves - all of them"
 omni_disease.14.b:0 "Ration the firewood, the winter is long"
 omni_disease.15.t:0 "The Thaw"
 omni_disease.15.desc:0 "The season has turned and taken the hollowfrost out with it. [glacier_chill_province.GetName|Y] is counting its dead and its firewood, and finds itself short of both."
 omni_disease.15.a:0 "Warmer days"

 #Bitterwell Fever
 omni_disease.16.t:0 "Bitterwell Fever"
 omni_disease.16.desc:0 "The great well at [wasting_fever_province.GetName|Y] has turned. The water still rises and still looks like water, and everyone drinking it is wasting - which, in the desert, is everyone. There is no second well inside three days walking."
 omni_disease.16.a:0 "Cap the well and dig, whatever it costs"
 omni_disease.16.b:0 "It is the only water they have"
 omni_disease.17.t:0 "The Well Stays Bitter"
 omni_disease.17.desc:0 "The digging has found sand, and beneath the sand, more sand. [wasting_fever_province.GetName|Y] is still drinking from the fouled well because the alternative is not drinking, and the fever has settled in properly now."
 omni_disease.17.a:0 "Ration what clean water there is"
 omni_disease.17.b:0 "Drink, and hope"
 omni_disease.18.t:0 "The Wells Run Clear"
 omni_disease.18.desc:0 "The new shafts came in sweet at last, and the old well has been capped and built over. The fever went out of [wasting_fever_province.GetName|Y] within the month. Nobody drinks from a covered well twice."
 omni_disease.18.a:0 "Clean water at last"

 #Redmouth
 omni_disease.19.t:0 "Redmouth"
 omni_disease.19.desc:0 "A fever has come up out of the wet ground around [jungle_rot_province.GetName|Y], and it is fast. A man is well at dawn, feverish by noon, and coughing red by the following morning, and a good many do not see the morning after that. The people there have stopped using the healers' word for it and simply call it the redmouth."
 omni_disease.19.a:0 "Burn the infected quarter and all that is in it"
 omni_disease.19.b:0 "It will burn itself out"
 omni_disease.20.t:0 "Redmouth Takes Root"
 omni_disease.20.desc:0 "It has not burned itself out. [jungle_rot_province.GetName|Y] is losing more people this week than it lost last week, and the road out remains open, and the traders remain on it."
 omni_disease.20.a:0 "Close the province - no one in, no one out"
 omni_disease.20.b:0 "Trade cannot simply be halted"
 omni_disease.21.t:0 "Redmouth Becomes an Epidemic"
 omni_disease.21.desc:0 "It is past containing. The redmouth has gone out of [jungle_rot_province.GetName|Y] along every road and river in the region, and it is killing at a rate the first weeks gave no warning of. The neighboring governors are writing to us and to one another, and not one of them has anything useful to say."
 omni_disease.21.a:0 "Every hand to the sickbeds"
 omni_disease.21.b:0 "Let it run its course"
 omni_disease.22.t:0 "The Epidemic Ends"
 omni_disease.22.desc:0 "The redmouth has burned through everything within its reach and stopped. [jungle_rot_province.GetName|Y] and the lands around it are counting, and will be counting for some time yet."
 omni_disease.22.a:0 "The dead are mourned"

 #Grass Pox
 omni_disease.23.t:0 "Grass Pox"
 omni_disease.23.desc:0 "A pox is moving through the camps of [grass_pox_province.GetName|Y]. It marks its survivors for life and does not leave a great many survivors, and it travels at exactly the speed of the herds - which is to say faster than any rider we might send after it."
 omni_disease.23.a:0 "Isolate the marked camps"
 omni_disease.23.b:0 "No one tells the tribes where to stand"
 omni_disease.24.t:0 "The Pox Rides With the Herds"
 omni_disease.24.desc:0 "It has not stayed in one camp and was never going to. The pox is moving north with the grazing now, and [grass_pox_province.GetName|Y] has given up pretending the thing is contained."
 omni_disease.24.a:0 "Burn the marked tents and all that is in them"
 omni_disease.24.b:0 "The herds move, and the camps move with them"
 omni_disease.25.t:0 "The Pox Becomes an Epidemic"
 omni_disease.25.desc:0 "Grass pox has left [grass_pox_province.GetName|Y] altogether, carried out along the drove roads into the neighboring lands by people who had every reason to keep moving and none at all to say why."
 omni_disease.25.a:0 "Every hand to the sickbeds"
 omni_disease.25.b:0 "Let it run its course"
 omni_disease.26.t:0 "The Epidemic Ends"
 omni_disease.26.desc:0 "The pox has burned across the steppe and gone out. [grass_pox_province.GetName|Y] and its neighbors are scarred, and thinner, and still standing, which on the steppe is counted a good year."
 omni_disease.26.a:0 "The dead are mourned"

 #Leyrot
 omni_disease.27.t:0 "Leyrot"
 omni_disease.27.desc:0 "Something has gone wrong in the leylines beneath [mana_sickness_province.GetName|Y]. The households nearest the eldritch trees are wasting in a manner no healer can account for - no fever, no flux, simply less of them with every week that passes. The mages have theories. The mages have also asked for a considerable sum of money and have declined to offer a date."
 omni_disease.27.a:0 "Ward the forest's edge at our expense"
 omni_disease.27.b:0 "Let the mages tend their own leylines"
 omni_disease.28.t:0 "The Leyrot Spreads"
 omni_disease.28.desc:0 "It has not settled. The line beneath [mana_sickness_province.GetName|Y] reads worse than it did a month ago, and the wasting has now reached households that stand nowhere near the trees."
 omni_disease.28.a:0 "Bind the line with wardstones"
 omni_disease.28.b:0 "Leave it - these things settle"
 omni_disease.29.t:0 "The Leyline Ruptures"
 omni_disease.29.desc:0 "The line has given way. What was a sickness at the forest's edge is moving across [mana_sickness_province.GetName|Y] with the mana itself, and it is altering what it touches - the ground, then the crops, then the people, in roughly that order."
 omni_disease.29.a:0 "Every mage we have to the wardstones"
 omni_disease.29.b:0 "Nothing made this and nothing will stop it"
 omni_disease.30.t:0 "The Leyline Settles"
 omni_disease.30.desc:0 "The line has come back into something resembling order, and the leyrot has gone quiet along with it. [mana_sickness_province.GetName|Y] is left with a wound no blade made, in ground that will not be trusted for a generation."
 omni_disease.30.a:0 "Stability, of a kind"

 #Province modifiers - Short-chain
 omni_grey_cough_outbreak:0 "Grey Cough"
 desc_omni_grey_cough_outbreak:0 "A crowded and coughing populace is producing less than it should, and eating what it produces."
 omni_sailors_rot_outbreak:0 "Sailor's Rot"
 desc_omni_sailors_rot_outbreak:0 "Spoiled stores and a wasting sickness on the quay have driven off traders and settlers alike."
 omni_river_flux_outbreak:0 "River Flux"
 desc_omni_river_flux_outbreak:0 "The low water is sickening the population and every army that drinks on the march."

 #Province modifiers - Medium-chain
 omni_marsh_ague_light:0 "Blue Tongue Fever (Early)"
 desc_omni_marsh_ague_light:0 "A shivering fever is rising off the standing water, and it comes back in waves."
 omni_marsh_ague_severe:0 "Blue Tongue Fever"
 desc_omni_marsh_ague_severe:0 "The fever has taken firm hold, sapping strength and stores alike."
 omni_deep_rot_light:0 "Deep Rot (Early)"
 desc_omni_deep_rot_light:0 "Something growing in the dead air of the shafts is filling the miners' lungs."
 omni_deep_rot_severe:0 "Deep Rot"
 desc_omni_deep_rot_severe:0 "The rot has run the length of the deep galleries, crippling output and civic order."
 omni_glacier_chill_light:0 "Hollowfrost (Early)"
 desc_omni_glacier_chill_light:0 "A wasting fever of the lungs is spreading with the deep frost."
 omni_glacier_chill_severe:0 "Hollowfrost"
 desc_omni_glacier_chill_severe:0 "The cold sickness has settled in badly, slowing armies and burning through stores."
 omni_wasting_fever_light:0 "Bitterwell Fever (Early)"
 desc_omni_wasting_fever_light:0 "A fouled well is spreading a wasting fever through the oasis."
 omni_wasting_fever_severe:0 "Bitterwell Fever"
 desc_omni_wasting_fever_severe:0 "The fever has reached the whole of the water supply, starving and sickening the population."

 #Province modifiers - Long-chain
 omni_jungle_rot_light:0 "Redmouth (Early)"
 desc_omni_jungle_rot_light:0 "A fast, blood-flecked fever is spreading through the jungle settlements."
 omni_jungle_rot_plague:0 "Redmouth"
 desc_omni_jungle_rot_plague:0 "The redmouth has taken firm hold, crippling output and food alike."
 omni_jungle_rot_epidemic:0 "Redmouth Epidemic"
 desc_omni_jungle_rot_epidemic:0 "The redmouth has become a full epidemic, killing widely and unsettling the populace."
 omni_grass_pox_light:0 "Grass Pox (Early)"
 desc_omni_grass_pox_light:0 "A pockmarking pox is spreading through the steppe camps."
 omni_grass_pox_plague:0 "Grass Pox"
 desc_omni_grass_pox_plague:0 "The pox has spread with the herds, crippling output and food alike."
 omni_grass_pox_epidemic:0 "Grass Pox Epidemic"
 desc_omni_grass_pox_epidemic:0 "The pox has become a full epidemic, killing widely and driving off settlers."
 omni_mana_sickness_light:0 "Leyrot (Early)"
 desc_omni_mana_sickness_light:0 "An unstable leyline is wasting the households at the forest's edge."
 omni_mana_sickness_plague:0 "Leyrot"
 desc_omni_mana_sickness_plague:0 "The unstable leyline is corrupting the land and its people in earnest."
 omni_mana_sickness_epidemic:0 "Leyrot Epidemic"
 desc_omni_mana_sickness_epidemic:0 "The ruptured leyline has become a full magical plague, corrupting civilization and happiness alike."

 #Character modifier
 omni_disease_infected:0 "Infected"
 desc_omni_disease_infected:0 "This character has caught what is going around. They are weaker until it passes, and it does not always pass."
