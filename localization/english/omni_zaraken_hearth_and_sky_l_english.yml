l_english:
 zaraken_hearth_and_sky:0 "Hearth and Sky Rites"
 desc_zaraken_hearth_and_sky:0 "Before the prophets came south, the Zaraken kings swore beneath the open sky and kept their ancestors at the household hearth. When the old rites were outlawed, a handful of shamans found shelter with the herders above Karanî. The herders taught their children the names of the dead, and the shamans kept the oath stones on the road to the summer pastures."
 deity_zaraken_open_sky:0 "$omen_zaraken_open_sky$"
 omen_zaraken_open_sky:0 "The Open Sky"
 omen_zaraken_open_sky_desc:0 "Riders swear their muster oaths beneath the Open Sky, where every companion can hear the promise."
 deity_zaraken_hearth_below:0 "$omen_zaraken_hearth_below$"
 omen_zaraken_hearth_below:0 "The Hearth Below"
 omen_zaraken_hearth_below_desc:0 "Families leave the first bread by the embers for the dead whose names are recited there."
 deity_zaraken_stone_witness:0 "$omen_zaraken_stone_witness$"
 omen_zaraken_stone_witness:0 "The Stone Witness"
 omen_zaraken_stone_witness_desc:0 "The hill shamans hear disputes at the boundary cairns, where neighboring houses can bring their witnesses."
 deity_zaraken_keeper_of_wells:0 "$omen_zaraken_keeper_of_wells$"
 omen_zaraken_keeper_of_wells:0 "The Keeper of Wells"
 omen_zaraken_keeper_of_wells_desc:0 "Herders clear the wells before the summer crossing and leave the first bucket for the next traveler."
 03_zaraken_recall_hill_shamans:0 "Recall the Hill Shamans"
 03_zaraken_recall_hill_shamans_desc:0 "A herder from Karanî has brought a strip of hide bearing the names of the households that took in the shamans when the old rites were outlawed. The shamans ask to lay it beside the crown of Eszarakayn Shazum and hear the ruler swear that those households may keep their rites in public. If the court swears with them, they will bring the four spirits down from the hills to Kyaxares."
