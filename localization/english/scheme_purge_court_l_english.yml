l_english:
 scheme_purge_court:0 "Scheme: Purge Court"
 scheme_purge_court_desc:0 "The ruler will spend the coming year cutting the rot from their own household, removing undesirable courtiers through banishment, imprisonment, execution, or torture. The purge costs Tyranny, breeds Corruption, and bleeds the treasury dry while the knives stay drawn."
 pick_purge_court_ambition:0 "Scheme: Purge Court"
 pick_purge_court_ambition_act:0 "Purge the Court"
 pick_purge_court_ambition_past:0 "Purged the Court"
 purge_court_ambition_wealth_tt:0 "[target.GetName] has at least #Y 100#! @gold!."
 purge_court_ambition_no_scheme_tt:0 "[target.GetName] is not already carrying out a Scheme."
 purge_court_ambition_cooldown_tt:0 "[target.GetName] has not purged the court in the last #Y 3 years#!."
 purge_court_ambition_start_cost_tt:0 "[actor.GetName] gains #R 5#! Tyranny @tyranny!.\n[target.GetName] gains #R 5#! Corruption @corruption_icon!."
 purge_court_ambition_tooltip:0 "[target.GetName] will lose #R -2#! @gold! each month as informers are bought, jailers paid, and tongues loosened until the Scheme ends.\nUndesirable court characters may be exposed for removal during the Scheme.\nEach purge event lets [target.GetName] banish, imprison, execute, or torture the target.\nPurge events cost between #R 1-5#! Tyranny @tyranny! and #R 1-2#! Corruption @corruption_icon!, depending on the chosen punishment.\nUpon completion, [actor.GetName] gains #R 3#! Tyranny @tyranny! and [target.GetName] gains #R 3#! Corruption @corruption_icon!."
 purge_court_finish_tt:0 "The blades are sheathed at last: the court purge is complete."
 scheme_purge_court.1_title:0 "An Undesirable Courtier"
 scheme_purge_court.desc:0 "[SCOPE.sChar('purge_target').GetName|Y] has become an embarrassment and a danger to the court. How shall we deal with this undesirable?"
 scheme_purge_court.desc.vampire.1:0 "Servants whisper that [SCOPE.sChar('purge_target').GetName|Y] keeps strange hours, colder company, and appetites no loyal court should tolerate. The charge is not written plainly in the ledgers, but everyone knows the word being avoided: vampire."
 scheme_purge_court.desc.vampire.2:0 "[SCOPE.sChar('purge_target').GetName|Y] has drawn too many frightened glances and too many private accusations. Whether monster or merely cursed by rumor, a suspected vampire at court is useful only as an example."
 scheme_purge_court.desc.vampire.3:0 "A serving girl swears she saw [SCOPE.sChar('purge_target').GetName|Y] drain more than wine from a goblet that was never poured. True or not, the tale has already outrun any denial [SCOPE.sChar('purge_target').GetSheHe] could offer, and the court has decided it prefers the story to the truth."
 scheme_purge_court.desc.corrupt.1:0 "The accounts surrounding [SCOPE.sChar('purge_target').GetName|Y] are greasy with missing coin, false favors, and convenient silence. The court has endured [SCOPE.sChar('purge_target').GetHerHis] corruption long enough."
 scheme_purge_court.desc.corrupt.2:0 "Petitioners claim [SCOPE.sChar('purge_target').GetName|Y] sells access, judgment, and office with the same easy smile. If the court is to be purged, corruption this open makes an obvious first cut."
 scheme_purge_court.desc.corrupt.3:0 "Three separate treasurers have now resigned rather than sign what [SCOPE.sChar('purge_target').GetName|Y] asks them to sign. The bribes have grown so brazen that hiding them has become its own kind of insult to the throne."
 scheme_purge_court.desc.disloyal.1:0 "[SCOPE.sChar('purge_target').GetName|Y] bows at the proper moments, but [SCOPE.sChar('purge_target').GetHerHis] loyalty has thinned to a thread. The court has begun asking whether treachery should be removed before it ripens."
 scheme_purge_court.desc.disloyal.2:0 "Reports from the palace corridors name [SCOPE.sChar('purge_target').GetName|Y] as unreliable, resentful, and dangerously connected. A disloyal courtier is a blade left on the table."
 scheme_purge_court.desc.disloyal.3:0 "Sealed letters have passed between [SCOPE.sChar('purge_target').GetName|Y] and hands that owe this throne nothing. Nothing has been proven, but proof has never been the point of a purge."
 scheme_purge_court.desc.lunatic.1:0 "[SCOPE.sChar('purge_target').GetName|Y] has become impossible to predict. Servants fear [SCOPE.sChar('purge_target').GetHerHis] outbursts, ministers fear [SCOPE.sChar('purge_target').GetHerHis] counsel, and everyone fears what might happen next."
 scheme_purge_court.desc.lunatic.2:0 "What began as eccentricity in [SCOPE.sChar('purge_target').GetName|Y] has curdled into open instability. The court no longer laughs; it steps aside and waits for orders."
 scheme_purge_court.desc.lunatic.3:0 "Last week [SCOPE.sChar('purge_target').GetName|Y] harangued an empty chair for an hour and called it a productive council. This week the harangue was aimed at a minister who cannot be replaced. The court cannot afford a third week."
 scheme_purge_court.desc.reckless.1:0 "[SCOPE.sChar('purge_target').GetName|Y] has treated the court like a gaming board and other lives like dice. Recklessness of this sort becomes policy if it is not punished."
 scheme_purge_court.desc.reckless.2:0 "Another rash promise, another dangerous quarrel, another mess for wiser heads to bury: [SCOPE.sChar('purge_target').GetName|Y] has exhausted the court's patience."
 scheme_purge_court.desc.reckless.3:0 "[SCOPE.sChar('purge_target').GetName|Y] wagered a border garrison on a hunting bet and somehow won, which has only made [SCOPE.sChar('purge_target').GetHerHim] bolder. The next wager may not end so well for anyone else."
 scheme_purge_court.desc.arrogant.1:0 "[SCOPE.sChar('purge_target').GetName|Y] speaks as though rank, law, and custom are minor obstacles placed before [SCOPE.sChar('purge_target').GetHerHim] by lesser minds. The court has noticed."
 scheme_purge_court.desc.arrogant.2:0 "Few courtiers are loved, but [SCOPE.sChar('purge_target').GetName|Y] has made pride into a public insult. Every sneer has purchased an enemy, and those enemies now ask for judgment."
 scheme_purge_court.desc.arrogant.3:0 "[SCOPE.sChar('purge_target').GetName|Y] refused to kneel at the last audience, calling it beneath [SCOPE.sChar('purge_target').GetHerHis] bloodline. The bloodline will not save [SCOPE.sChar('purge_target').GetHerHim] from what comes next."
 scheme_purge_court.desc.gluttonous.1:0 "The feasts of [SCOPE.sChar('purge_target').GetName|Y] have become a scandal of waste: rich tables, unpaid servants, and favors swallowed as greedily as wine. Such gluttony looks uglier during a purge."
 scheme_purge_court.desc.gluttonous.2:0 "[SCOPE.sChar('purge_target').GetName|Y] has mistaken appetite for privilege. The kitchens grumble, the treasury winces, and the court wonders how long one person's excess must be indulged."
 scheme_purge_court.desc.gluttonous.3:0 "A granary meant for the garrison was quietly emptied into [SCOPE.sChar('purge_target').GetHerHis] private stores. The soldiers went hungry so that one plate could stay full, and the soldiers have not forgotten it."
 scheme_purge_court.desc.deceitful.1:0 "Every story about [SCOPE.sChar('purge_target').GetName|Y] arrives with a second version and a third witness. Lies cling to [SCOPE.sChar('purge_target').GetHerHim] like perfume, and the court has tired of breathing them."
 scheme_purge_court.desc.deceitful.2:0 "[SCOPE.sChar('purge_target').GetName|Y] has survived by misdirection, half-promises, and carefully placed denials. A purge is no place for a practiced liar to remain useful."
 scheme_purge_court.desc.deceitful.3:0 "No two courtiers can agree on where [SCOPE.sChar('purge_target').GetName|Y] was last night, and [SCOPE.sChar('purge_target').GetSheHe] has offered three alibis to four different accusers. A liar this practiced cannot be trusted even in chains."
 scheme_purge_court.desc.cruel.1:0 "Too many punishments have carried [SCOPE.sChar('purge_target').GetName|Y]'s fingerprints. Too many servants flinch when [SCOPE.sChar('purge_target').GetSheHe] passes. Cruelty has made [SCOPE.sChar('purge_target').GetHerHim] conspicuous."
 scheme_purge_court.desc.cruel.2:0 "[SCOPE.sChar('purge_target').GetName|Y] has confused authority with the pleasure of making others suffer. The court can stomach many vices, but cruelty breeds witnesses."
 scheme_purge_court.desc.cruel.3:0 "A stableboy still cannot use his left hand after displeasing [SCOPE.sChar('purge_target').GetName|Y] over a saddle. The story has spread further than the injury, and the court now measures its own safety by how far it can stay from [SCOPE.sChar('purge_target').GetHerHim]."
 scheme_purge_court.desc.generic.1:0 "A dossier has been placed before the throne naming [SCOPE.sChar('purge_target').GetName|Y] as a liability to the court. The charges are varied, the conclusion simple: [SCOPE.sChar('purge_target').GetSheHe] should not remain."
 scheme_purge_court.desc.generic.2:0 "The purge has found its next subject. [SCOPE.sChar('purge_target').GetName|Y] has accumulated enough enemies, rumors, and indiscretions that few will speak in [SCOPE.sChar('purge_target').GetHerHis] defense."
 scheme_purge_court.desc.generic.3:0 "No single crime damns [SCOPE.sChar('purge_target').GetName|Y], but the sum of small betrayals and quiet grudges has reached its limit. The court does not need a reason so much as an occasion, and this is it."
 scheme_purge_court.banish:0 "Cast [SCOPE.sChar('purge_target').GetHerHim] out beyond the borders"
 scheme_purge_court.imprison:0 "Chain [SCOPE.sChar('purge_target').GetHerHim] in the dungeon"
 scheme_purge_court.execute:0 "Send [SCOPE.sChar('purge_target').GetHerHim] to the headsman"
 scheme_purge_court.torture:0 "Break [SCOPE.sChar('purge_target').GetHerHim] on the rack"
 scheme_purge_court.martial:0 "Make a bloody public example of [SCOPE.sChar('purge_target').GetHerHim]"
 scheme_purge_court.finesse:0 "Arrange a quiet, deniable disappearance"
 scheme_purge_court.charisma:0 "Turn the whole court against [SCOPE.sChar('purge_target').GetHerHim]"
 scheme_purge_court.zeal:0 "Cleanse this stain from the court in righteous fire"
 scheme_purge_court.martial_tt:0 "[SCOPE.sChar('purge_target').GetName|Y] will be executed before a gathered crowd, at reduced Tyranny @tyranny! cost.\nOur ruler will gain #G 5#! Popularity @popularity_icon! as the people cheer a strong hand at work."
 scheme_purge_court.finesse_tt:0 "[SCOPE.sChar('purge_target').GetName|Y] will vanish quietly and be banished at reduced Tyranny @tyranny! cost.\nThe whispers about how it was managed will cost our ruler an #R 2#! additional Corruption @corruption_icon!."
 scheme_purge_court.charisma_tt:0 "Our ruler will first persuade the assembled court of [SCOPE.sChar('purge_target').GetName|Y]'s guilt, turning judgment into spectacle. [SCOPE.sChar('purge_target').GetFirstName] will then be imprisoned, and our ruler will gain #G 5#! Popularity @popularity_icon!."
 scheme_purge_court.zeal_tt:0 "[SCOPE.sChar('purge_target').GetName|Y] will be executed as a moral danger to the realm. Our ruler casts the killing as a purification ritual rather than a mere punishment, gaining #G 5#! Popularity @popularity_icon!."
