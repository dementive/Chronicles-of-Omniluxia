l_english:
 scheme_purge_court:0 "Scheme: Purge Court"
 scheme_purge_court_desc:0 "For one year the ruler will hear charges against members of the court, and the first eligible month brings a case. Informers and jailers are paid from the ruler's own purse, and the verdicts can add #Y Tyranny#! and #Y Corruption#!."
 pick_purge_court_ambition:0 "Scheme: Purge Court"
 pick_purge_court_ambition_act:0 "Purge the Court"
 pick_purge_court_ambition_past:0 "Purged the Court"
 pick_purge_court_ambition_act_past:0 "Purged the Court"
 purge_court_ambition_wealth_tt:0 "[target.GetName] has at least #Y 100#! @gold!."
 purge_court_ambition_no_scheme_tt:0 "[target.GetName] is not already carrying out a Scheme."
 purge_court_ambition_cooldown_tt:0 "[target.GetName] has no active #Y 3-year#! purge cooldown."
 purge_court_ambition_start_cost_tt:0 "[actor.GetName] gains #R 5#! Tyranny @tyranny!.\n[target.GetName] gains #R 5#! Corruption @corruption_icon!."
 purge_court_ambition_tooltip:0 "[target.GetName] pays #R 2#! @gold! in personal wealth each month and has #R -1#! Finesse while the Scheme lasts.\nThe first eligible month brings a hearing, and each later eligible month has a #Y one-in-three#! chance to bring another. Each courtier can be heard once per purge.\nA verdict can cost #R 1-5#! Tyranny @tyranny! and up to #R 2#! Corruption @corruption_icon!. Dismissal is free, and a corrupt courtier can repay #Y 10#! @gold! to avoid removal.\nAfter any resolved hearing, finishing adds #R 3#! Tyranny @tyranny! and #R 3#! Corruption @corruption_icon!. Finishing or cancelling after a resolved hearing starts a #Y 3-year#! cooldown."
 purge_court_finish_tt:0 "The court closes the record of the purge."
 scheme_purge_court.1_title:0 "A Name Before the Court"
 scheme_purge_court.desc:0 "The clerk has called [SCOPE.sChar('purge_target').GetName|Y] before the court, and the usher waits at the door to see whether he should bring in the witnesses."
 scheme_purge_court.desc.vampire.1:0 "The laundress has brought you a pillowcase from [SCOPE.sChar('purge_target').GetName|Y]'s rooms, and she wants her name struck from the household rolls before anyone asks who took it.\n\nThe stains are dark enough, though the physician says he has seen much the same on the dressings of a man with a bad tooth. The laundress asks whether the physician means to give his name as a witness, since the pillowcase has already cost her a place."
 scheme_purge_court.desc.vampire.2:0 "The watch has been leaving a lamp at the door of [SCOPE.sChar('purge_target').GetName|Y], and every morning the lamp comes back full.\n\nThe captain says a servant has gone missing since the habit began, although the servant's brother insists he saw him boarding a grain ship with his pay in his pocket."
 scheme_purge_court.desc.vampire.3:0 "A cupbearer swears [SCOPE.sChar('purge_target').GetName|Y] drank from a cup no one had filled, and the kitchen has been arguing over what was in it ever since.\n\nThe steward brings you the cup in a folded napkin, with the cupbearer's letter asking for a place in another household tucked underneath."
 scheme_purge_court.desc.corrupt.1:0 "The palace carpenter has brought two receipts for the same gate. One is for oak, and the other is for cedar at twice the price, with the seal of [SCOPE.sChar('purge_target').GetName|Y] pressed into the wax.\n\nThe carpenter asks which receipt he should show the widow of the guard the gate fell on. [SCOPE.sChar('purge_target').GetName|Y] says the gate was the steward's business, and the steward has been outside your door since dawn with the key to the accounts chest in both hands."
 scheme_purge_court.desc.corrupt.2:0 "A petitioner came before dawn to reclaim the silver [SCOPE.sChar('purge_target').GetName|Y] had taken for a hearing that never came.\n\nBy noon there were six more in the passage, and the usher would like to know whether to bring them in together, since several paid for judgments against one another."
 scheme_purge_court.desc.corrupt.3:0 "Three treasurers have refused to put their seals beside that of [SCOPE.sChar('purge_target').GetName|Y], and the youngest has brought you the account book with the disputed page sewn shut.\n\nHis predecessor says the sums will balance if you count the cost of keeping the families who received the money on your side."
 scheme_purge_court.desc.disloyal.1:0 "The gatekeeper brought you a second watch roster, folded inside the first and marked with the seal of [SCOPE.sChar('purge_target').GetName|Y].\n\nIt puts the same four men on the river gate every night, and the gatekeeper would like to know whose orders to follow when two captains arrive with different lists."
 scheme_purge_court.desc.disloyal.2:0 "The clerk found a copy of the oath of allegiance in [SCOPE.sChar('purge_target').GetName|Y]'s rooms, and somebody has scraped away the name of the person it was sworn to.\n\nThe clerk can still make out the first letter, though three people at court have already offered to tell him what it is."
 scheme_purge_court.desc.disloyal.3:0 "The watch took a bundle of sealed letters from a courier who says [SCOPE.sChar('purge_target').GetName|Y] paid him to cross the river.\n\nYour secretary recognizes one of the seals, and she asks to open the bundle in private, since the other seal belongs to a family whose men are standing outside your door."
 scheme_purge_court.desc.lunatic.1:0 "The watch has spent three nights barring the eastern door on orders from [SCOPE.sChar('purge_target').GetName|Y], though there has been a wall behind it since your predecessor's reign.\n\nThe captain obeyed until the kitchen ran out of men to carry water, and now he wants an order he can show his soldiers in daylight."
 scheme_purge_court.desc.lunatic.2:0 "At the last audience, [SCOPE.sChar('purge_target').GetName|Y] stopped a petition halfway through and ordered the guards to search the benches for an absent minister.\n\nThey searched, and the petitioners sat still through it all, although the minister's funeral had passed through the same hall three days before."
 scheme_purge_court.desc.lunatic.3:0 "Last week [SCOPE.sChar('purge_target').GetName|Y] spent an hour arguing with an empty chair, and the clerk wrote down both sides because he was told to keep a full record.\n\nThis week a minister sat in it, read the record beforehand, and has asked to be excused from the next audience."
 scheme_purge_court.desc.reckless.1:0 "The stablemaster has come for the horses [SCOPE.sChar('purge_target').GetName|Y] promised to lend him after the hunt, and he has found a cavalry officer waiting for the same animals.\n\nBoth have the promise in writing, and the horses have already been sent upriver as a gift."
 scheme_purge_court.desc.reckless.2:0 "[SCOPE.sChar('purge_target').GetName|Y] promised the market a week without tolls, and the tax collector learned of it when the first wagon drove past him to applause.\n\nHe has brought you his empty cashbox, though the merchants are still outside, cheering the only person who gave them an answer."
 scheme_purge_court.desc.reckless.3:0 "[SCOPE.sChar('purge_target').GetName|Y] wagered a border garrison on a hunting bet and somehow won, which has only made [SCOPE.sChar('purge_target').GetHerHim] bolder.\n\nThe garrison's captain has come to ask what he was supposed to do if the other hunter won, and whether he should keep a spare set of orders ready for next time."
 scheme_purge_court.desc.arrogant.1:0 "The ushers moved the supplicants' bench to make room for a chair [SCOPE.sChar('purge_target').GetName|Y] had carried into the hall.\n\nThe people who used to sit there have been standing since dawn, and the oldest has asked the usher what title one has to buy to get a seat."
 scheme_purge_court.desc.arrogant.2:0 "[SCOPE.sChar('purge_target').GetName|Y] sent back the seating plan with three old family names crossed out, and the steward followed it because it bore a seal he recognized.\n\nHe is now laying places for supper, while three heads of house are waiting at the door to see where you mean to put them."
 scheme_purge_court.desc.arrogant.3:0 "[SCOPE.sChar('purge_target').GetName|Y] stayed on [SCOPE.sChar('purge_target').GetHerHis] feet when the rest of the court knelt, and by the next audience two younger courtiers had decided to try it.\n\nThe usher asks whether he should call their names as usual, since both were early and neither has brought a petition."
 scheme_purge_court.desc.gluttonous.1:0 "The steward has brought the winter stores tally, and a whole column has been marked for suppers at the house of [SCOPE.sChar('purge_target').GetName|Y].\n\nThe kitchen can stretch what is left through the month if the watch takes half rations, though nobody has offered to tell the watch why."
 scheme_purge_court.desc.gluttonous.2:0 "[SCOPE.sChar('purge_target').GetName|Y] ordered the temple's festival cakes carried to a private dinner, and the kitchen sent them because the messenger had a palace badge.\n\nThe priests have borrowed bread from the bakers, who are waiting in the courtyard to see which household will pay."
 scheme_purge_court.desc.gluttonous.3:0 "The cellarer found the good wine gone and the empty jars put back in their racks, each with the palace seal pressed into fresh wax.\n\n[SCOPE.sChar('purge_target').GetName|Y] is hosting another supper tonight, and the cellarer wants to know whether he should send up the empties this time."
 scheme_purge_court.desc.deceitful.1:0 "Two widows have brought the same promise of a pension, each saying [SCOPE.sChar('purge_target').GetName|Y] read it aloud at her husband's grave.\n\nThe signatures match, and the clerk has found the original under a stack of blank forms with the name carefully scraped out."
 scheme_purge_court.desc.deceitful.2:0 "[SCOPE.sChar('purge_target').GetName|Y] told the grooms the horses were wanted by the watch and told the watch they were wanted by the grooms.\n\nThe horses are now on a ferry, and the boy who was paid to lead them aboard has brought you the coin because he thinks it is counterfeit."
 scheme_purge_court.desc.deceitful.3:0 "Four witnesses have come to tell you where [SCOPE.sChar('purge_target').GetName|Y] spent the night, and three of them were given different addresses to remember.\n\nThe fourth is a bread seller, who only came because she was promised someone at the palace would settle the bill."
 scheme_purge_court.desc.cruel.1:0 "The keeper of the household rolls has brought you a page with six names ruled through, and each belongs to a servant dismissed by [SCOPE.sChar('purge_target').GetName|Y].\n\nHe says three have found other places, while the others are still owed the wages the steward was told to withhold."
 scheme_purge_court.desc.cruel.2:0 "A kitchen porter has brought the steward a list of fines levied by [SCOPE.sChar('purge_target').GetName|Y], and the same child's name appears on it every day for a week.\n\nThe porter has been paying the fines himself, though he says that by the end [SCOPE.sChar('purge_target').GetName|Y] would charge him for doing that, too."
 scheme_purge_court.desc.cruel.3:0 "A stableboy still cannot use his left hand after displeasing [SCOPE.sChar('purge_target').GetName|Y] over a saddle, and the stablemaster has brought him to court to ask who will pay for his keep.\n\nThe boy insists he can still muck out a stall, while his mother keeps trying to put his cap back on his head."
 scheme_purge_court.desc.generic.1:0 "The usher brought in the petition against [SCOPE.sChar('purge_target').GetName|Y], and by the time he returned with a lamp, the petitioners had gone.\n\nTheir signatures are still on the sheet, though the clerk has left space beside each one for a withdrawal."
 scheme_purge_court.desc.generic.2:0 "[SCOPE.sChar('purge_target').GetName|Y] has been waiting in the outer hall since dawn, and the witness who asked for the hearing has sent word that his mother is ill.\n\nThe usher would like to know if he should keep the seat by the door empty."
 scheme_purge_court.desc.generic.3:0 "The steward brought the charge himself, and he took it away again when he heard that [SCOPE.sChar('purge_target').GetName|Y] had come to answer it.\n\nThe clerk still has his copy, though he asks whose name to put at the head of the page."
 scheme_purge_court.banish:0 "Send [SCOPE.sChar('purge_target').GetHerHim] into exile."
 scheme_purge_court.imprison:0 "Enter the sentence, and send for the jailer."
 scheme_purge_court.execute:0 "The sentence is death."
 scheme_purge_court.torture:0 "Take [SCOPE.sChar('purge_target').GetHerHim] below, and keep [SCOPE.sChar('purge_target').GetHerHim] there."
 scheme_purge_court.martial:0 "Let the watch assemble, and carry out the sentence before them."
 scheme_purge_court.finesse:0 "Find [SCOPE.sChar('purge_target').GetHerHim] passage, and leave the name off the manifest."
 scheme_purge_court.charisma:0 "Read the charge to the court, and let them call for the jailer."
 scheme_purge_court.zeal:0 "Let the priests proclaim the sentence."
 scheme_purge_court.martial_tt:0 "With #Y 10#! Martial, the ruler can make a public example of the accused. The spectacle wins Popularity and costs the accused's family Prestige if they belong to a great family."
 scheme_purge_court.finesse_tt:0 "With #Y 10#! Finesse, the ruler can arrange a quiet exile for #Y 1#! less Tyranny and #R 1#! additional Corruption."
 scheme_purge_court.charisma_tt:0 "With #Y 10#! Charisma, the ruler can turn the hearing into a public case for imprisonment, gaining Popularity at the cost of additional Corruption."
 scheme_purge_court.zeal_tt:0 "With #Y 10#! Zeal, the ruler can spend #Y 5#! Political Influence to enlist the priests in condemning a vampire or a courtier known for corruption, cruelty, or deceit. The execution gains Popularity and costs no Corruption."
 purge_court_ambition_candidate_tt:0 "There is an eligible courtier against whom a charge can be brought."
 scheme_purge_court.dismiss:0 "File the charge, and close the hearing."
 scheme_purge_court.restitution:0 "Return the silver, and we will close the matter."
 scheme_purge_court.restitution_tt:0 "A corrupt courtier with at least #Y 10#! @gold! can repay that amount to the treasury and remain at court."
 scheme_purge_court.2_title:0 "An Empty Register"
 scheme_purge_court.2_desc:0 "The clerk brings you the register on the last day of the purge, and every page after the date of your first warrant is blank. He asks if he can scrape the date off and use it for next year's petitions, since the leather is good and he has already paid the binder."
 scheme_purge_court.2_close:0 "Give it back to the clerk."
 scheme_purge_court.3_title:0 "The Last Entry"
 scheme_purge_court.3_desc:0 "The clerk has ruled a line under the last hearing, and he has brought the book for you to seal. The steward follows with a list of the places left empty at table, because the servants have been laying them out of habit.\n\nIn the outer hall, the families are already asking for copies of the pages on which their names appear, and the clerk wants to know whether a man who spoke on another's behalf is entitled to see what he said."
 scheme_purge_court.3_close:0 "Seal it, and leave it in the archive."
 scheme_purge_court.4_title:0 "The Names on the Roll"
 scheme_purge_court.4_desc:0 "The steward has come for the list of names to strike from the household rolls, and the clerk has handed him the same list he brought on the day of the first hearing.\n\nThe usher says people who gave evidence have started asking him which door they should use now, since they keep meeting the people they spoke against on the main stairs."
 scheme_purge_court.4_close:0 "Tell the usher to keep the main door open."
