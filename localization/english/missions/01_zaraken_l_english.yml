l_english:
 03_zaraken:0 "The Crown of Kyaxares"
 03_zaraken_DESCRIPTION:0 "The #T Great Zinduidian Revolt#! began in #Y 934 LC#!, and by #Y 946 LC#! the rebels had taken #G Kyaxares#! and put most of the House of Zakara to the sword. Their captains left the grave of #Y Jaoz the Bold#! untouched in its small temple, and the Zarakens have kept it ever since. The coalition had agreed readily enough on whom to drive out, but it never agreed on who should rule in their place, and by the time the Zarakens took Kyaxares back in #Y 952 LC#!, many of their former vassals had grown used to giving orders in their own names.\n\nThe crown now rules four territories directly from #G Kyaxares#!. [ROOT.GetCountry.GetRuler.GetName|Y] has vowed to reclaim the old heartland and restore the name of the #Y Zarakens#! before raising the banner of the #Y Neo-Zaraken Empire#!. The princes of the #G Golden Foothills#! have had the better part of half a century to collect their own tolls and seal their own warrants, however, and many of them will fight before they send those seals back to Kyaxares."
 03_zaraken_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when [ROOT.GetCountry.GetName|T] and its subjects reunite all five districts of the #G Golden Foothills#!. We must undertake large-scale infrastructure projects in an effort to fortify our heartland, and the #Y Neo-Zaraken Empire#! must be proclaimed from [ROOT.GetCountry.GetCapital.GetName|G]."
 03_zaraken_BUTTON_TOOLTIP:0 "Reunite the Golden Foothills and restore the Zaraken Empire."
 03_zaraken_BUTTON_DETAILS:0 ""
 03_zaraken_task_1:0 "The Captains At The Gate"
 03_zaraken_task_1_DESC:0 "By old custom, the royal houses bring their household retinues to #G [ROOT.GetCountry.GetCapital.GetName]#! for the muster. The clerks at the eastern gate are entering the companies on the crown's pay roll, and several houses have sent their sons in hopes of securing a captaincy. Once the rolls are ready, the [ROOT.GetCountry.GetRulerTitle|T] must decide who will lead the men into battle."
 03_zaraken_task_2:0 "Heralds Into Kashan"
 03_zaraken_task_2_DESC:0 "The newly mustered captains are to escort heralds into #G Kashan#! and tell its rival princes what the crown intends. We will give the envoys time to ask for the surrender of the garrisons while the roads are still open in peacetime, and their reports will tell us where we can bargain and where we will have to march."
 03_zaraken_task_3:0 "Kashan Under One Banner"
 03_zaraken_task_3_DESC:0 "The princes at #G Kokihmobpod#! and #G Kobnudac#! have spent too long charging both banks of the ford for the same crossing, and a drover who pays twice will soon look for another road. Bring every post in #G Kashan#! under the crown, and see that both ford captains answer to us or to princes who accepted our heralds' terms. Set aside silver to stock #G Farheng#! for the companies that will cross the district behind them."
 03_zaraken_task_4:0 "Elika's Fishing Landings"
 03_zaraken_task_4_DESC:0 "The boats at #G Elika#! used to land their catch wherever the bank held firm. Now that #G Kashan#! has a common store at #G Farheng#!, there is a market for fish beyond the crossing. Raise Elika to a city so it can build proper landings and keep the catch in salt when the road floods."
 03_zaraken_task_5:0 "Hire Razani Architects"
 03_zaraken_task_5_DESC:0 "#G Kyaxares#!, #G Kassandane#!, #G Mihrab#!, and #G Avestan#! were once the seats of our power, and a wagon sent from one to the next still loses a day wherever the track crosses soft ground. Word has reached our court of roads laid by #Y Razani#! masters thousands of miles away. Their surveyors can find a line down a wet hillside that a carter will trust with a full load. Recover the outlying cities and send a commission worthy of the journey. Let the masters bring their own stonecutters to Kyaxares and choose the ground themselves."
 03_zaraken_task_25:0 "Learn The Razani Way"
 03_zaraken_task_25_DESC:0 "The foremen at #G Avestan#! have been watching the #Y Razani#! crews set their stones, and they want to know how the surveyors carried the road across the slope without losing a wagon to the first rain. Pay the architects to stay and teach our crews how to survey and lay a road of their own."
 03_zaraken_task_6:0 "The Command At Avestan"
 03_zaraken_task_6_DESC:0 "The new road brings wagons as far as #G Avestan#!, and the captains of #G Shizar#! now ride in on it to see what the crown means to do with them. Provide training grounds and quarters for the watch at Avestan, and govern the district well enough that its captains come to the command when they are summoned rather than sending their nephews with apologies."
 03_zaraken_task_7:0 "Remounts Of Zarqan"
 03_zaraken_task_7_DESC:0 "The officer at #G Avestan#! sent a rider east with orders for the watch. By the time the man reached #G Karanî#!, his mare had thrown a shoe, and the village headman had already lent his only spare mount to a merchant. If the crown takes charge of the yard, the officer can send word ahead to have a fresh mount saddled. We can buy breeding stock from abroad or draw on the herds of #G Haxamanish#!."
 03_zaraken_task_8:0 "The Watchfires Of Hajar"
 03_zaraken_task_8_DESC:0 "The supply yards in #G Zakaria#! can now feed the watch beyond the ridge, and the old towers above #G Kashmar#! still stand, although their fires have been dark since the last captain took his pay and went home. Bring #G Hajar#! under our command, take Kashmar into the crown's own hands, and raise enough light horse to answer a signal before the raiders reach the next valley. They know the gaps between the towers. Be ready to pursue them or hold the crossings when the first fire goes up."
 03_zaraken_task_9:0 "The Council Of The Foothills"
 03_zaraken_task_9_DESC:0 "The garrisons of #G Kashan#! now answer to the crown, and the companies can muster at #G Mihrab#!, but the princes of the Foothills have spent half a century sealing their own orders, and they will not trust a seal pressed in a room they have never seen. Seat the great families at a permanent Court of Law in #G Kyaxares#!, where one council can issue the orders, and let the [ROOT.GetCountry.GetRulerTitle|T] carry its charters out to the districts in person, so that every prince can watch the seal go down in his own hall."
 03_zaraken_task_10:0 "Projecting Strength"
 03_zaraken_task_10_DESC:0 "The heralds bound for #G Zakaria#! and #G Hajar#! need an escort led by a captain who has fought on the crossing roads before, and the levy must stay home and rested in case a prince answers the claims with a raid. Keep most of our manpower in reserve and find the heralds a general who knows the country."
 03_zaraken_task_11:0 "Water For The Wagon Teams"
 03_zaraken_task_11_DESC:0 "Mounted men can cross #G Zakaria#! in a day, but the baggage wagons need somewhere to water their teams and make camp before the last watch. Take the fields of #G Orasmyn#! into the crown's own hands and lay out a permanent yard for the teams. Have the keepers there and at #G Quhyar#! put by enough grain for the wagons expected at each stop."
 03_zaraken_task_12:0 "The Iron Gate"
 03_zaraken_task_12_DESC:0 "The smiths at #G Inar#! can fit a horse while its rider is still at drill, and the old knights say there is no better place in the Foothills to raise heavy horse. Build up the fort or the training ground and send men from the levy to hold it. When the new companies can wheel in formation, the knights have promised to take the old horn of the #Y Kaxhamids#! down from the wall of their hall and teach the riders its call."
 03_zaraken_task_13:0 "The Oaths Before Jaoz"
 03_zaraken_task_13_DESC:0 "The pilgrims bound for #G Makox#! already gather at the grave of #Y Jaoz#! in #G Kyaxares#! before they take the road. Raise a Temple beside it, where the captains can receive their standards and swear in front of the pilgrims to keep that road open."
 03_zaraken_task_14:0 "Companies At The Waterline"
 03_zaraken_task_14_DESC:0 "The captains who swore at #G Kyaxares#! need somewhere to muster by water, and #G Mihrab#! is the only harbor with room for them. Bring #G Mihrab#! under the crown, give it three berths and a pair of markets beside the wharf, let the masons finish whatever they have started, and gather a fleet large enough that a company can take on stores and sail without waiting for a merchant to finish unloading."
 03_zaraken_task_15:0 "The Assembly Of Five Districts"
 03_zaraken_task_15_DESC:0 "When all five districts of the #G Golden Foothills#! answer to the crown and the fighting has ended, call their delegates to #G Kyaxares#!. Give them quarters while their captains agree where to muster and whose orders they will take on the march. The houses remember how we granted commissions at the first muster, and they will expect an answer when command comes up again. The delegates will not come to a ruler they have never seen in their own halls, so the [ROOT.GetCountry.GetRulerTitle|T] must have ridden the bounds at least once."
 03_zaraken_task_16:0 "The Imperial Archives"
 03_zaraken_task_16_DESC:0 "One captain's map still marks a ford that has been dry for years, and another has drawn the road beyond it from memory. Give the court at #G Kyaxares#! a library for the campaign maps and signal books. Before the copyists can do their work, they will need the heads of two houses to lend them the records their captains carry."
 03_zaraken_task_17:0 "The Imperial Garrisons"
 03_zaraken_task_17_DESC:0 "Raise the walls at #G Inar#! a second time and keep the fort at #G Elika#! ready. When the #Y Kaxham Guards#! have heard the horn in a real war, give a trusted marshal two months to drill the reliefs of both forts to the same signals."
 03_zaraken_task_18:0 "The Crown Of Five Districts"
 03_zaraken_task_18_DESC:0 "[ROOT.GetCountry.Custom('zaraken_task_18_description')]"
 03_zaraken_task_18_DESC_crown:0 "The heralds are waiting at #G Kyaxares#!, and the delegates of the five districts have already taken lodgings in the new quarters. Raise the capital to a metropolis and keep the districts at peace, but remember that the princes will judge the crown by the ruler who wears it. The princes have seen the seal of the House of [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective|T] pressed in their own halls. Now they must bring their standards into the square and hear the imperial title proclaimed before the companies they command. When the crowd gathers for the coronation, let the herald raise the standard of the #Y Neo-Zaraken Empire#! high enough for the last rank to see."
 zaraken_elika_fishing_mod:0 "Elika Fishing Landings"
 zaraken_avestan_toll_rolls_mod:0 "Avestan Toll Rolls"
 desc_zaraken_avestan_toll_rolls_mod:0 "The crown keeps a common toll roll for the two markets at Avestan."
 desc_zaraken_elika_fishing_mod:0 "Raised landings, salting racks, and storehouses keep the catch coming in when the road floods."
 zaraken_elika_watch_mod:0 "The Watch at Elika"
 desc_zaraken_elika_watch_mod:0 "The quartermaster keeps grain inside the fort so the patrols can ride even when rain cuts the road."
 zaraken_inar_watch_mod:0 "The Iron Gate"
 desc_zaraken_inar_watch_mod:0 "The riders drill within reach of the forges, where the smiths keep an account of the iron issued to the watch."
 zaraken_wine_court_mod:0 "The Wine Court"
 desc_zaraken_wine_court_mod:0 "The wine sellers have a covered yard where they can put their jars before the boats come alongside."
 zaraken_common_reckoning_mod:0 "Council of the Foothills"
 desc_zaraken_common_reckoning_mod:0 "The commanders gather at Kyaxares to decide where the watches answer and where companies muster."
 zaraken_shrine_register_mod:0 "The Oath at Jaoz"
 desc_zaraken_shrine_register_mod:0 "The captains receive their standards at the shrine, where pilgrims can see who has sworn to keep the roads."
 zaraken_royal_warrant_mod:0 "Royal Market Warrant"
 desc_zaraken_royal_warrant_mod:0 "The crown has called on the local yards to provision and equip the companies passing through."
 zaraken_open_road_mod:0 "The Open Road Settlement"
 desc_zaraken_open_road_mod:0 "The watches keep the road open between the markets and send riders ahead when the crossings are unsafe."
 zaraken_guarded_road_mod:0 "The Pilgrimage Settlement"
 desc_zaraken_guarded_road_mod:0 "The captains keep sworn duties at the watches, where a pilgrim can ask for shelter and learn where the next escort takes over."
 me_zaraken.1.t:0 "Favors for the Royal Houses"
 me_zaraken.1.desc:0 "The clerks at the eastern gate of #G Kyaxares#! were entering the last company on the crown's pay roll when an old prince asked that his nephew serve under a captain who had brought a company through a winter campaign. There were plenty of men at home who would salute the boy, he said, and few who would correct him. By noon two other houses had sent their sons to the gate. Both young men expected commands of their own, and one brought word that his father would send another troop of riders if he could lead it. The clerks, impatient to wrap up the day's business, complain that they have the companies on the roll, but they need to know whose names to put down as captains so they can close their ledgers.\n\nThe veterans ask the crown to appoint officers who have led men in the field. A captain who owes his post to one house, they say, will have a hard time disciplining the men of another. The princes say their riders will turn out in greater numbers under men they already know. The #Y Keepers of the Tomb#!, who tend the grave of the prophet #T Jaoz#!, propose keeping the present captains for this muster and blessing every house's standard in front of the assembled levy. Each house would go home knowing its banner had been received, and the question of new commissions could wait until after the muster."
 me_zaraken.1.a:0 "Give the commands to veterans of the crown."
 me_zaraken.1.b:0 "Let the princes lead the men they bring."
 me_zaraken.1.c:0 "Keep the present captains and bless every standard."
 me_zaraken.2.t:0 "The Assembly of Five Districts"
 me_zaraken.2.desc:0 "At the door of the assembly hall in #G Kyaxares#!, a delegate from #G Shizar#! recognized the captain whose riders he once barred from the road, and held the door for him while their guards borrowed a bench from the porter. By the time the last district was seated, the guards were at dice, and the two men inside had agreed on everything except which of them would give the order to march.\n\nAll five districts have agreed to answer a common summons, and an officer from #G Elika#! proposes that each furnish the commander in turn, so no prince need go home and tell his captains that their district has lost the right to lead. It is a bargain every delegation can defend at home, though the men who came expecting the first command are still in the hall, and each has brought a different account of whose riders reached the last muster first."
 me_zaraken.2.a:0 "Let the districts take turns commanding the muster."
 me_zaraken.3.t:0 "The Crown at Kyaxares"
 me_zaraken.3.desc:0 "When the herald read out the title of the #Y Neo-Zaraken Empire#! at the muster in #G Kyaxares#!, the captains of all five districts stood beneath the same standard, though their companies had come in under the banners of their own houses. The old prince who brought his nephew to our first audience has asked that the young man carry the standard out through the western gate, and the captain he once served under has offered to ride in his escort.\n\nThe archive keeper has filed the imperial orders beside the first muster rolls, while copies have gone to #G Elika#! and #G Inar#! so the watches will know whom to send when the standard comes into sight. Each district will meet it under its own banner. By the time the escort reaches the last crossing, the men on the road will have had occasion to see how much a title read aloud in Kyaxares is worth at a gate after dark."
 me_zaraken.3.a:0 "Send the imperial standard out to the districts."
 03_zaraken_escort_iron_tt:0 "Produce at least #Y 5#! @iron! Iron between your territories of #G Vanuse#! and #G Inar#!."
 zaraken_kashan_grain_rolls_mod:0 "Forward Stores at Farheng"
 desc_zaraken_kashan_grain_rolls_mod:0 "The storekeepers at Farheng lay in grain for the companies crossing Kashan."
 zaraken_spice_exchange_mod:0 "Kyaxares Spice Exchange"
 desc_zaraken_spice_exchange_mod:0 "The weighers keep a public tally at the scales, where a buyer can settle for a load before the sacks are sewn shut."
 zaraken_seal_chancery_mod:0 "Chancery of the First Seal"
 desc_zaraken_seal_chancery_mod:0 "Apprentices learn the crown's seal beside the market, where the clerks prepare warrants for the companies setting out."
 zaraken_zakaria_caravan_posts_mod:0 "Provision Yards of Zakaria"
 desc_zaraken_zakaria_caravan_posts_mod:0 "The yards keep fodder at a posted price and leave room inside for the carts that miss the last watch."
 zaraken_mihrab_customs_mod:0 "Sealed Customs of Mihrab"
 desc_zaraken_mihrab_customs_mod:0 "The port clerk keeps the wine sheds open until the last boat is loaded."
 zaraken_chartered_market_mod:0 "Chartered Royal Market"
 desc_zaraken_chartered_market_mod:0 "Carriers can reserve space for their loads before they send for a cart."
 zaraken_makox_hospices_mod:0 "Hospices of the Pilgrim Road"
 desc_zaraken_makox_hospices_mod:0 "The Keepers of the Tomb put aside grain and beds for the companies and pass word ahead when a traveler has fallen behind."
 zaraken_pilgrim_escort_mod:0 "The Inar Escort"
 desc_zaraken_pilgrim_escort_mod:0 "The riders muster at Inar, where the smiths keep iron for a shoe that comes loose on the road."
 zaraken_merchant_advance_mod:0 "Advance of the Market Guilds"
 desc_zaraken_merchant_advance_mod:0 "The guilds have put silver down for new stalls and sent their factors ahead to make the first purchases."
 zaraken_pilgrim_muster_mod:0 "Muster for the Makox Road"
 desc_zaraken_pilgrim_muster_mod:0 "The captains have leave to call in riders and ready their mounts for the watches beyond Inar."
 zaraken_keepers_itinerary_mod:0 "The Keepers' Itinerary"
 desc_zaraken_keepers_itinerary_mod:0 "The Keepers of the Tomb read out where each escort changes and which captain owes the company a place to sleep."
 zaraken_shizar_register_mod:0 "Northern Command at Avestan"
 desc_zaraken_shizar_register_mod:0 "The captains of Shizar keep a common watch from Avestan, where riders from Kyaxares can find them."
 zaraken_zarqan_remounts_mod:0 "Remount Yards of Zarqan"
 desc_zaraken_zarqan_remounts_mod:0 "The yardmen keep fodder and fresh horses at Karanî, and a messenger leaves his name when he changes mounts."
 zaraken_hajar_watch_mod:0 "Watchfires of Hajar"
 desc_zaraken_hajar_watch_mod:0 "The watch at Kashmar keeps the fire and sends a rider when the next tower fails to answer."
 zaraken_mihrab_muster_quay_mod:0 "The Muster Quay"
 desc_zaraken_mihrab_muster_quay_mod:0 "The harbor clerk marks the men and stores as they come ashore, while the boats still have room at the waterfront."
 zaraken_imperial_archives_mod:0 "Imperial Archives"
 desc_zaraken_imperial_archives_mod:0 "Campaign maps and signal books are kept together so the captains can plan a muster from the same orders."
 zaraken_imperial_garrison_mod:0 "The Crown's Garrisons"
 desc_zaraken_imperial_garrison_mod:0 "The watches drill for the same signals and draw their equipment from stores laid in for the whole frontier."
 zaraken_imperial_restoration_mod:0 "The Crown of Five Districts"
 desc_zaraken_imperial_restoration_mod:0 "The five districts keep their own standards and answer the imperial summons together."
 zaraken_seat_of_the_empire_mod:0 "Seat of the Neo-Zaraken Empire"
 desc_zaraken_seat_of_the_empire_mod:0 "The heralds read the crown's orders at Kyaxares, and the delegates know which door to use when they come to answer them."
 me_zaraken.102.t:0 "The Keys of Kashan"
 me_zaraken.102.desc:0 "Our scouts rode into #G Kashan#! with a drover who kept his toll receipts in his boot, and at one ford he took out two, one for the captain on either bank. Both captains claimed the right to stop travelers, and each sent a man into the shallows to warn our scouts against paying the other. The drover waited until they were out of earshot before he said what it had cost him to get his herd across.\n\nBack at court, the heralds ask [ROOT.GetCountry.GetRuler.GetName|Y] what terms they may carry west. The treasurer would buy Farheng outright if its lord will sell. The heralds think some princes would sooner swear to Kyaxares if they could keep their posts and draw pay for their men. The captain of the escort has seen the walls. He asks leave to ready a siege train in case the next summons has to be read from outside them."
 me_zaraken.102.desc_held:0 "When our scouts crossed #G Kashan#!, they found every garrison answering to the crown or to one of our subjects, though at the ford two captains still stood on opposite banks and called for the party to halt. Each had orders to keep the crossing, and the men wading out to question the scouts learned they were serving the same crown when they compared the seals on their orders.\n\nThe heralds can ride home with the princes' acknowledgments, but first they ask for leave to settle the watch, since the villages have long been feeding men on both banks while the road beyond the ford goes unpatrolled. One captain can keep the crossing and the other can take the road, if each has a copy of the orders the other will receive."
 me_zaraken.102.a:0 "Pay for Farheng and let its garrison march out."
 me_zaraken.102.b:0 "Send the summons and ready the siege train."
 me_zaraken.102.c:0 "Offer the princes our protection and put their men on our pay rolls."
 me_zaraken.102.d:0 "Give the garrisons orders to patrol together."
 zaraken_kashan_siege_train_mod:0 "Siege Train for Kashan"
 desc_zaraken_kashan_siege_train_mod:0 "The captains have called in carpenters and put the teams for the siege train on the road behind the heralds."
 me_zaraken.103.t:0 "$03_zaraken_task_3$"
 me_zaraken.103.desc:0 "The first baggage train to cross #G Kashan#! under the crown's orders reached #G Farheng#! with two empty wagons, which the quartermaster had brought in case he had to send back to Kyaxares for grain as he had on his last march. This time he filled them from the stores at Farheng, and by noon the drivers were on the road again, with a receipt for their grain that bore the same seal as their marching orders.\n\nThe keeper of the stores asks how much grain he should hold back when the merchants come to buy after harvest. If he keeps a company's issue under seal and a few wagons fit to travel, a captain marching through can draw his provisions there, and a watch cut off from the capital can send to Farheng before it starts taking grain from the villages."
 me_zaraken.103.a:0 "Keep forward stores at Farheng"
 me_zaraken.104.t:0 "$03_zaraken_task_4$"
 me_zaraken.104.desc:0 "When the crown took the landings at #G Elika#! into its own hands, the new keeper spent his first morning walking the bank with the oldest boatman in the town, who showed him where the boats had put in during his father's time and where the mud had swallowed a cart in his own. By the time they came back, carters from #G Farheng#! were waiting at the new landing, and a factor from beyond the crossing had bought the second boat's catch before its nets were ashore.\n\nThe salt is the trouble now. The keeper says the racks can hold three days' catch, but only if the salt boats come in before the road floods, and the boatmen ask the crown to keep the waters clear so they are not left choosing between a full net and an empty storehouse."
 me_zaraken.104.a:0 "Keep the salt boats coming in to Elika."
 me_zaraken.105.t:0 "The Road to Avestan"
 me_zaraken.105.desc:0 "The #Y Razani#! masters came thousands of miles to lay a road for the crown of #G Kyaxares#!. The court had paid for their passage and lodged them near the eastern gate. The chief architect brought his own surveyors and stonecutters, and before he would let the first paving stone be laid, he walked the ground from #G Kassandane#! to #G Avestan#! himself. At every hillside spring he stopped to mark where a drain should run beneath the road.\n\nThe chief architect has come to collect the last of his fee. He waited at the gate of #G Avestan#! through a night of rain to see the first laden wagons come in. They made the descent without a carter having to unload so much as a sack. On the branch to #G Mihrab#!, the harbor merchants are already asking for a yard where two trains of wagons can pass. The roads will stay when the masters sail home, and our heralds can now ride out to press the crown's claims in #G Shizar#! and #G Zarqan#!."
 me_zaraken.105.a:0 "Pay the masters and send out the heralds."
 me_zaraken.125.t:0 "The Surveyor's Line"
 me_zaraken.125.desc:0 "On the slope above #G Avestan#!, a foreman waited for the rain before taking a loaded wagon over the stretch of road a #Y Razani#! surveyor had made him lay twice. The first time, his men had set the stones level, and the wheels had sunk into ruts that filled in the first rain, but now the water ran off the raised center into a ditch, and the wagon came down the hill without a wheel leaving the stones.\n\nThe architects have taken their pay and left their measuring rods with the men they taught, who have already been asked what it would take to lay stone on the roads beyond Avestan. The foreman asks to send surveyors out with the companies that use those roads, so that when a captain has men to spare, the stakes will already be in the ground."
 me_zaraken.125.a:0 "Send the surveyors out with our companies"
 me_zaraken.106.t:0 "$03_zaraken_task_6$"
 me_zaraken.106.desc:0 "When the captains of #G Shizar#! came to the new camp at #G Avestan#!, each brought the names of the men who had kept the watch in his valley, and each expected to go home with orders for the road he knew. [ROOT.GetCountry.GetRuler.GetName|Y] was willing to give them those orders, provided the captains raised and fed their companies at their own expense and came to Avestan whenever they were summoned. Their men know the slopes and the places where a wagon can be hidden off the road, while the command can tell them which road the next convoy will take.\n\nThe captains have accepted the terms, and the quartermaster has begun a roll of the valleys and the men who answer for each of them. He asks to keep it at Avestan, where a rider from #G Kyaxares#! can find the right captain without searching every pass in Shizar."
 me_zaraken.106.a:0 "Keep the roll of Shizar at Avestan."
 me_zaraken.107.t:0 "$03_zaraken_task_7$"
 me_zaraken.107.desc:0 "The yardkeeper at #G Karanî#! has set a trough by the gate, so that a rider from #G Avestan#! can hand over a tired mount and take a fresh one without leading either animal through the yard. He has hired two boys to walk the arrivals until they cool, and one of them has already asked what sort of stock they will be looking after.\n\nThree breeders have come to the yard. The first can supply stallions the dispatch riders already know how to handle, while the second says his steppe horses will graze the short grass above the village and stay sound on the worst of the roads. The third reminds the keeper that the crown's riders once went to war on camels, which can carry more than any horse and go farther between wells. The officer at Avestan wants an answer before the next convoy arrives, since whichever stock we choose, the yard will be raising it for years."
 me_zaraken.107.a:0 "Breed horses @horses! at Karanî"
 me_zaraken.107.b:0 "Breed steppe horses @steppe_horses! at Karanî"
 me_zaraken.107.c:0 "Breed camels @camels! at Karanî"
 me_zaraken.108.t:0 "$03_zaraken_task_8$"
 me_zaraken.108.desc:0 "The watch at #G Kashmar#! lit its first fire at dusk, and before the next tower had answered, a shepherd came down from the ridge to say the raiders were already between them. They had taken horses from the outlying farms and were driving the stock ahead of them, though the shepherd reckoned they would still be in #G Hajar#! at sunrise, for the raiders would have to take the animals by the low crossings.\n\nWith fresh horses from #G Zarqan#! or a drilled relief from #G Inar#!, the captain could ride before dawn without calling out so much of the levy. If we hold the crossings instead, the yards in #G Zakaria#! can save us much of the cost of feeding the men there, provided they are ready. The captain can also bring the families in under Kashmar's walls, though one farmer has already asked whether there will be anyone left to keep the raiders from his winter stores."
 me_zaraken.108.a:0 "Send the men we have ready before dawn"
 me_zaraken.109.t:0 "$03_zaraken_task_9$"
 me_zaraken.109.desc:0 "At the first sitting of the Court of Law in #G Kyaxares#!, a merchant set two receipts on the table for the grain he had furnished to a single watch. One bore a captain's mark and the other a prince's seal, and each man claimed the other had undertaken to pay. The heads of the great houses had come to hear how the watches would take their orders, and the merchant stayed to hear whose seal he should ask for next time.\n\nThe council will keep a record of its orders to the captains, but the eldest of the princes says a record kept at Kyaxares is only paper in #G Hajar#!. He proposes that the [ROOT.GetCountry.GetRulerTitle|T] ride the bounds of each district from time to time, holding court in its hall and sealing its charters in front of its captains. The other heads of family agree readily, and the clerks have noticed that each of them has already asked who will keep the council while the ruler is away."
 me_zaraken.109.a:0 "Keep the orders here, and ready the ruler's horse"
 me_zaraken.110.t:0 "$03_zaraken_task_10$"
 me_zaraken.110.desc:0 "The [ROOT.GetCountry.GetAdjective] heralds bound for #G Zakaria#! and #G Hajar#! left the main road a day short of the first gate and came up through a dry streambed while their scouts searched the slopes ahead. On the road, the watch would have counted every rider long before the party reached the walls, but by the time the guards saw our escort, the herald was close enough to call out the name of the lord he had come to summon.\n\nThe guards heard the crown's claims read in full and sent a boy up to the hall with a copy of our demands. Their captain kept his men on the wall and let the heralds ride out the way they had come, although he took a long look at the escort before he did so. Our general says he will know that streambed again, and the next time he comes up it, he would like to bring the army."
 me_zaraken.110.a:0 "Have the general mark the approach on our campaign map."
 me_zaraken.111.t:0 "$03_zaraken_task_11$"
 me_zaraken.111.desc:0 "Before #G Zakaria#! came under our protection, a captain who reached the district after dark had to leave men with the baggage while the rest of his company rode on. This time the wagoners found the gate at #G Orasmyn#! open and fodder waiting in the yard, while a man from #G Quhyar#! was there to count the teams he should expect at the other end. By the time the last wagon was under cover, the whole escort had ridden out with the captain.\n\nThe quartermasters ask for the next line of march before they bargain for more grain, since the two yards can feed a train in either direction, provided the keepers know where to lay in the greater share. The captain who takes the road ahead of his wagons would like to know at which yard he can send back for them."
 me_zaraken.111.a:0 "Put both yards on the army's supply route"
 me_zaraken.112.t:0 "$03_zaraken_task_12$"
 me_zaraken.112.desc:0 "When the horn sounded in the field below #G Inar#!, the riders nearest the wall were halfway to the far ditch before the last horses had moved. An old knight of the #Y Kaxhamids#! called them back and asked the horn bearer to stand where both companies could hear him. His family still names the man who rode with #Y Eszarakayn#!, when horsemen from the clans and the towns swore to serve the first Shahanshah. In those days the companies mustered from different households, and the knights taught them to ride to the same call. The old man learned it from his father, whose own captain still called it the #Y Kaxhamid Charge#! long after the empire fell.\n\nBy the last pass the companies crossed the field together, and the captain asked to keep the heavy horse at Inar through the winter. One company can ride the watch while the other drills below the walls, and the smiths have offered to keep spare shoes for both. The knight asks to hear the horn again tomorrow. He wants every rider to know its call by the time the companies hear it in war."
 me_zaraken.112.a:0 "Keep the heavy horse at Inar and teach them the charge."
 me_zaraken.113.t:0 "$03_zaraken_task_13$"
 me_zaraken.113.desc:0 "On the morning the captains came to receive their standards at #G Kyaxares#!, the #Y Keepers of the Tomb#! set a writing table on the steps above the grave of #Y Jaoz the Bold#!. In the square below, bread sellers called to the pilgrims gathering for #G Makox#!. A traveler waiting with his children recognized the badge of the watch that had turned them away after dark on their last journey, and he asked the captain where they were to sleep if they found the same tower shut again.\n\nThe captain named the watchman who held the key and told the traveler what to call out from the road, and the Elder of the Keepers wrote the watchman's name beside the captain's in the register. The Keepers ask that each company swear on these steps to shelter travelers along its stretch of the road. If a family comes back to the grave with a complaint, the Elder can open the book and send for the man who gave his word."
 me_zaraken.113.a:0 "Let the captains swear where the pilgrims can hear them"
 me_zaraken.114.t:0 "$03_zaraken_task_14$"
 me_zaraken.114.desc:0 "The first boats at the muster dock of #G Mihrab#! took on grain from the new market while the captain was still calling his roll, and when he brought his company down, the stevedores were already pulling the last sack aboard. The harbor master remembers a muster when the same men stood on the wharf until dark, arguing with a wine seller over whose cargo had been promised the next boat.\n\nHe asks for a runner from the muster ground whenever the crown means to move men by water, since a boat can be brought alongside and provisioned while the companies are still counting their men. If the captains send him word before the tide turns, he can tell the merchants when they will have the berth back, and the wine sellers can put their jars out under cover until then."
 me_zaraken.114.a:0 "Keep the waterfront ready for the next muster"
 me_zaraken.116.t:0 "$03_zaraken_task_16$"
 me_zaraken.116.desc:0 "$me_zaraken.116.opening$\n\nThe copyists will make a set of campaign maps for each district, so that a scout can have a crossing corrected before another company rides out to look for it. $me_zaraken.116.choice$"
 me_zaraken.116.a:0 "Keep the originals at court and send the districts copies."
 me_zaraken.116.b:0 "Let each district keep its own register."
 me_zaraken.117.t:0 "$03_zaraken_task_17$"
 me_zaraken.117.desc:0 "When the marshal brought the reliefs from #G Elika#! and #G Inar#! together, he sent an officer ahead to raise the agreed flag at the crossing, choosing a man one of the companies had never served under. The smiths were still gathering up the old fittings when the flag went up, and the relief was on the right road before the runner who had carried the signal book could catch his breath.\n\nThe captains will take their companies home under their own banners, though each now knows which road the other will take if the watch calls for help. The marshal asks to keep both forts drilling to the same signals, so that what the delegates settled in Kyaxares can be carried out by the next men on the walls, even if they have never set eyes on one another."
 me_zaraken.117.a:0 "Have both forts drill to the same signals"
 03_zaraken_formation_completed_tt:0 "Formed the #Y Neo-Zaraken Empire#!. The formation grants #G 4#! additional free province investments and claims on lands in #G Western Karksm#! and #G Eastern Karksm#! that we or our subjects do not already hold."
 zaraken_gatehouse_rolls_mod:0 "Muster at the Eastern Gate"
 desc_zaraken_gatehouse_rolls_mod:0 "The captains muster their companies at the eastern gate, where the crown can call each one by name."
 03_zaraken_kashan_claims_tt:0 "Gain claims on any territories in #G Kashan#! outside our direct or subject rule."
 03_zaraken_western_claims_tt:0 "Gain claims on any territories in #G Shizar#! and #G Zarqan#! outside our direct or subject rule."
 03_zaraken_eastern_claims_tt:0 "Gain claims on any territories in #G Zakaria#! and #G Hajar#! outside our direct or subject rule."
 zaraken_five_districts_accord_mod:0 "Accord of the Five Districts"
 desc_zaraken_five_districts_accord_mod:0 "The princes have agreed where their companies will muster and whose orders they will take when they ride together."
 03_zaraken_investments_1_tt:0 "Gain #G 1#! free province investment."
 03_zaraken_investments_2_tt:0 "Gain #G 2#! free province investments."
 03_zaraken_investments_3_tt:0 "Gain #G 4#! free province investments."
 zaraken_crown_captains_mod:0 "Captains of the Crown"
 desc_zaraken_crown_captains_mod:0 "The crown's captains drill the household companies together and send veterans to bring new men up to the muster."
 zaraken_blessed_standards_mod:0 "Blessing of the Standards"
 desc_zaraken_blessed_standards_mod:0 "The keepers of Jaoz blessed the standards together, with the royal houses standing in one company before the shrine."
 me_zaraken.108.desc_closed:0 "The dispatch from #G Kashmar#! reached #G Kyaxares#! with soot on the fold where the watchman had held it, and beside each crossing the riders used, he had written the hour at which the nearest tower saw the fire. At one post the watch had seen it clearly, although by then a shepherd had already come in with word from the ridge.\n\nThe captains ask for a copy for the men who keep the towers, since a watch may do everything its orders require and still learn too late that riders have passed below it. The next man on the ridge should know which crossing he can warn by fire and which needs a man on horseback."
 me_zaraken.108.b:0 "Call up the levy and ride after them before dawn"
 me_zaraken.108.c:0 "Draw on the supply yards and hold the crossings"
 me_zaraken.108.d:0 "Pay for stores and men to hold the crossings"
 me_zaraken.108.e:0 "Bring the families in, even if the farms go undefended"
 me_zaraken.108.f:0 "Send a copy of the dispatch to the captains"
 me_zaraken.2.desc_crown:0 "The veterans commissioned at the first muster in #G Kyaxares#! came back with a roll ruled into five columns, one for each district, and a space at the head for the officer who would command them all. The delegates from #G Shizar#! recognized several companies on the roll, although the men who had been leading them at home were nowhere named. They ask which of their captains are to keep their posts, so they can tell the families that put them there.\n\nThe veterans will take men from every district, provided the crown issues the commissions and can replace an officer who disobeys its orders. The princes will need persuading before they put their seals to that, and some have offered to take turns furnishing the commander instead. They agree that the roll needs a name at its head, though each has brought one of his own."
 me_zaraken.2.desc_houses:0 "The princes rode into #G Kyaxares#! with the companies they had promised at the first muster, and one brought his son into the hall to read out the names of the men he commanded. When the young man had gone back to his company, his father asked whether he could tell those same men that the command still stood, since several had come at his son's word and expected to serve under him.\n\nThe houses will answer a common summons if their officers keep their places and the crown helps pay for the companies, which have spent most of the journey drawing rations on the princes' credit. We can also let the districts name the commander in turn, although until the first name is agreed, the princes can tell their sons when to muster and little about whose orders they will take there."
 me_zaraken.2.desc_shrine:0 "When the keepers of #Y Jaoz#! brought the standards into #G Kyaxares#!, one remembered how, at the first blessing, a prince had held his neighbor's banner while the man knelt. He found both men in the hall this morning, each arguing that his own officers should give the order to march, and asked whether they would be willing to kneel beside one another again.\n\nIf the crown provides for the ceremony, the keepers will hear each prince name his officers at the shrine and swear to answer the same summons, with the companies there to hear what their lords have promised. The districts could settle the matter among themselves by taking turns in command, though the keeper who went to ask about it came back with five accounts of who should go first."
 me_zaraken.2.b:0 "Put the commissions in the crown's hands."
 me_zaraken.2.c:0 "Pay the household companies and confirm their officers."
 me_zaraken.2.d:0 "Call the princes before Jaoz to swear a common oath."
 me_zaraken.2.e:0 "Send the delegates their copies."
 me_zaraken.116.desc_crown:0 "$me_zaraken.116.opening$\n\nThe copyists have brought out the roll the veterans laid before the Assembly, and beside the routes they will enter the captains commissioned at Kyaxares, along with the signals each is to use when calling for help. One veteran asks for a second set for the men who relieve him, since the last time a captain carried the only orders on patrol, the garrison could name the man who had issued them but could scarcely say what he had ordered. $me_zaraken.116.choice$"
 me_zaraken.116.desc_houses:0 "$me_zaraken.116.opening$\n\nThe routes will go out with a list of the household companies that agreed to keep them, and the princes can send word to the archive whenever they name a new captain. The young man who read his roll before the Assembly has asked for a copy for his own men, so that the next time a neighboring company rides in to relieve them, both parties will know where one watch ends and the other begins. $me_zaraken.116.choice$"
 me_zaraken.116.desc_shrine:0 "$me_zaraken.116.opening$\n\nThe copyists have entered the names sworn before #Y Jaoz#! beside the roads the captains pledged to keep, and the shrine keepers will have a copy to consult when the pilgrims come home. A keeper who heard a captain promise shelter at his tower has asked for the watchman's name as well, so that the next party he sends out can ask for the man who has orders to let them in. $me_zaraken.116.choice$"
 me_zaraken.116.desc_rotation:0 "$me_zaraken.116.opening$\n\nThe copyists are setting the order of command beside the routes, so that each district can see when it must furnish the commander and where he is to find his companies. The officer from #G Elika#! asks that the maps go out with the signals the watches already use, since a man may take over at the muster before he has learned the names of the captains whose fires he will have to answer. $me_zaraken.116.choice$"
 me_zaraken.116.opening:0 "The first maps unrolled in the new library at #G Kyaxares#! showed a bridge and a ford at the same bend in the river, and each captain could name a man who had crossed where his map said he could. The keeper sent for a scout who had come that way in the morning. He remembered the bridge and had used the ford, though since the last flood a loaded wagon had to go two miles upstream."
 me_zaraken.116.choice:0 "The keeper would keep the originals at court and send the districts copies, but the captains would rather keep registers of their own, since they are the first to learn when a ford has gone dry."
 03_zaraken_northern_roads_tt:0 "We will construct roads connecting the four cities of the #T Bay of Kyaxares#!."
 03_zaraken_razani_roadbuilding_tt:0 "Your armies can use #Y Build Road#! before reaching #Y Civic Technology 5#!."
 03_zaraken_religious_complexes_tt:0 "Have the #Y Religious Complexes#! province investment in #G Kashan#!."
 03_zaraken_hajar_raid_resolved_tt:0 "Respond to the raid in #Y The Watchfires of Hajar#!."
 03_zaraken_assembly_resolved_tt:0 "Settle the command dispute at #Y The Assembly of Five Districts#!."
 03_zaraken_muster_crown_tt:0 "At the #Y Assembly of Five Districts#!, we may spend #Y 35#! Political Influence to give the crown permanent command of the muster."
 03_zaraken_muster_houses_tt:0 "At the #Y Assembly of Five Districts#!, we may pay the household companies and confirm their own officers in command."
 03_zaraken_muster_shrine_tt:0 "At the #Y Assembly of Five Districts#!, we may fund a ceremony at the grave of Jaoz where the princes swear to answer a common summons."
 zaraken_hajar_crossings_held_mod:0 "The Crossings of Hajar"
 desc_zaraken_hajar_crossings_held_mod:0 "The watch keeps men and stores at the crossings where the raiders came through."
 zaraken_hajar_outlying_farms_sacked_mod:0 "Farms Sacked in Hajar"
 desc_zaraken_hajar_outlying_farms_sacked_mod:0 "Families took shelter at Kashmar while raiders drove off stock and emptied the outlying stores."
 zaraken_assembly_crown_command_mod:0 "Commissions from Kyaxares"
 desc_zaraken_assembly_crown_command_mod:0 "Captains from all five districts take their commissions from the crown and know whose orders to follow when their companies join."
 zaraken_assembly_house_commands_mod:0 "Commands of the Royal Houses"
 desc_zaraken_assembly_house_commands_mod:0 "The crown funds the household companies, and the princes furnish the officers who lead them."
 zaraken_assembly_oath_of_jaoz_mod:0 "The Common Oath of Jaoz"
 desc_zaraken_assembly_oath_of_jaoz_mod:0 "The houses swore before the shrine that their companies would answer one summons."
 zaraken_assembly_rotating_command_mod:0 "The Rotating Command"
 desc_zaraken_assembly_rotating_command_mod:0 "Each district knows when it will furnish the commander and whose orders it will take in the meantime."
 03_zaraken_task_40:0 "The Zaraken Heartland"
 03_zaraken_task_40_DESC:0 "Since the fall of the old realm, the crown has ruled in the name of #G Kyaxares#!. Bring all eleven territories of the old heartland back under the crown's direct rule, and the heralds can once again speak for all the #Y Zarakens#!."
 03_zaraken_restore_name_tt:0 "Restore the name #Y Zarakens#! and raise the original Zaraken flag."
 03_zaraken_task_19:0 "The Surveyors' Stakes"
 03_zaraken_task_19_DESC:0 "The captains can bring their companies to the old cities of #G Kashan#! and #G Zakaria#!, but some of the streets can scarcely take a wagon. Bring #G Kassandane#!, #G Mihrab#!, and #G Inar#! back under the crown, then set aside building ground there and in #G Kyaxares#! and #G Vanuse#! before the yards and workshops take whatever space happens to be left. The surveyors would like this done while there is still some ground left to measure."
 me_zaraken.119.t:0 "$03_zaraken_task_19$"
 me_zaraken.119.desc:0 "The surveyors brought a baggage cart into the market at #G Kyaxares#! and asked the driver to turn it as he would with a company at his back. He got halfway round before the fruit sellers had to lift their boards, and one of them held his stall in the air while a surveyor measured the space it had been standing on. He told the man with the rod to take his time, so long as he only had to do this once.\n\nWe have paid to lay out new quarters in the capital and the four cities that will supply the muster, where the men with measuring rods have already found buyers asking about the ground beside the roads. The surveyors ask leave to mark the public ground now, while they can still set aside room for markets, stores, and workshops without having to buy back the land beneath them."
 me_zaraken.119.a:0 "Mark the ground out before anyone builds on it."
 03_zaraken_task_20:0 "Bread For The Militias"
 03_zaraken_task_20_DESC:0 "The bakers at #G Kyaxares#! have been drawing from the same bins as the militia. Give the quartermasters a second granary and water at the muster gate, and see that #G Farheng#! and #G Orasmyn#! can each send grain when the companies come in."
 me_zaraken.120.t:0 "$03_zaraken_task_20$"
 me_zaraken.120.desc:0 "The carts from #G Farheng#! came in before the morning watch changed, and those from #G Orasmyn#! reached the gate while the stewards were still weighing the first load. One driver had lost a pin coming down the hill and put a nail through his axle to get as far as the new granary, where the quartermaster took his grain and sent him to the smith with a tally for the next delivery.\n\nBehind him, a baker drove straight through to the market, where his boys had drawn water for the dough at the new cistern instead of waiting at the militia's bins. The quartermaster asks to enter both villages on the muster roll, so their carters will know there is a buyer for their grain whenever the companies come in."
 me_zaraken.120.a:0 "Give both villages a place on the muster roll."
 03_zaraken_t20_grain_tt:0 "Own #G Farheng#! and #G Orasmyn#! and produce at least #Y 2#! @grain! Grain in each."
 zaraken_militia_grain_contract_mod:0 "Militia Grain Contract"
 desc_zaraken_militia_grain_contract_mod:0 "The quartermaster's tally gives the village a regular buyer for its grain."
 03_zaraken_task_21:0 "The Spice Sheds Of Kassandane"
 03_zaraken_task_21_DESC:0 "With the road open and the command at #G Avestan#! guarding the convoys, the spice merchants of #G Kyaxares#! can send larger loads down to #G Kassandane#!, although the yard there is already so crowded that the grain wagons bound for the capital wait half a day behind them. Expand spice production in the capital, then grow Kassandane and give it a second Market, so the carters have room to unload."
 me_zaraken.121.t:0 "$03_zaraken_task_21$"
 me_zaraken.121.desc:0 "The first spice wagon out of #G Kyaxares#! drew up under the shed at the new market in #G Kassandane#!, and the stewards had weighed half its sacks by the time the driver came back from watering his team. The grain carts passed through the yard while he was at the trough, though one baker stopped to buy a little of the blend his mother used to keep for feast days.\n\nThe merchants ask to bring their next wagons through the same yard, where the patrols know when to expect them and the stewards can keep the sacks dry. The capital's granary keeper has offered to send his orders there too, so a carter bringing spices down can pick up a load for the granary and have a paying wagon on the road home."
 me_zaraken.121.a:0 "Have the caravans break their loads at Kassandane."
 03_zaraken_task_22:0 "The Iron Mills Of Vanuse"
 03_zaraken_task_22_DESC:0 "Let the iron @iron! of #G Kashan#! pass through the yards of #G Vanuse#!, where the crown's smiths can buy a full load without riding from pit to pit. The mills need hands to work them and enough ore left over after the local forges have taken their share."
 me_zaraken.122.t:0 "$03_zaraken_task_22$"
 me_zaraken.122.desc:0 "When the first cart from the pits of #G Kashan#! came into the mill yard at #G Vanuse#!, a ploughsmith was already waiting with a list of the tools he had promised to mend before sowing. Last spring his apprentice spent three days going from pit to pit and came back with half the iron they needed. This morning the millkeeper weighed out his share, entered it in the yard book, and had enough left under the shed to fill an order from #G Kyaxares#!.\n\nThe quartermaster asks to place the crown's orders at the same yard. When the captains send him their rolls, he can tell the smiths how much iron to expect and when to have their charcoal ready. The millkeepers are willing to set aside each load as it is ordered, provided the local smiths still find their share waiting when they come down to the yard."
 me_zaraken.122.a:0 "Place the crown's orders at the Vanuse yard."
 03_zaraken_task_23:0 "Fleet Yards Of Mihrab"
 03_zaraken_task_23_DESC:0 "The merchants from #G Kassandane#! have been sending their wagons down to #G Mihrab#! since we opened the muster quay. Their steersmen have asked who is to watch the entrance after dark. Put the harbor in the hands of an admiral who can tell the smiths at #G Inar#! what to make with the iron they have set aside."
 me_zaraken.123.t:0 "$03_zaraken_task_23$"
 me_zaraken.123.desc:0 "The smiths at #G Inar#! sent down a wagon of chain made from #G Vanuse#! iron, and the harbor master had it laid out beside the dock. The merchant helmsmen still remember the night a ship came in without a light and put men ashore before the watch could raise the alarm, and they ask for a boom across the harbor mouth, which they have offered to open each morning for the fishing boats.\n\nThe admiral has brought three crews down to the landing and asks for the same iron to fit out their ships, since a patrol at the mouth of the harbor could hail a stranger while there was still room to turn him away. The harbor master only wants to know who will keep the pier while those crews are at sea."
 me_zaraken.123.a:0 "Lay the boom and give the steersmen the keys."
 me_zaraken.123.b:0 "Fit out the admiral's patrol."
 me_zaraken.123.c:0 "Keep the iron at Inar until the harbor is ours again."
 03_zaraken_mihrab_patrol_tt:0 "Raise the #Y Mihrab Harbor Watch#! at #G Mihrab#! with #Y 3 Mega-Galleys#!."
 zaraken_mihrab_harbor_boom_mod:0 "The Boom at Mihrab"
 desc_zaraken_mihrab_harbor_boom_mod:0 "The steersmen keep the keys and open the boom for the fishing boats at daybreak."
 03_zaraken_task_36:0 "The First Grain Contract"
 03_zaraken_task_36_DESC:0 "The carters of #G Kassandane#! have grain left after the militia has drawn its share, and the factors at #G Mihrab#! have asked what it would cost to send a cargo abroad. Find a friendly port whose merchants can pay for the first load."
 03_zaraken_grain_buyer_tt:0 "A foreign country in diplomatic range must have a market port, at least #Y 50#! opinion of us, and at least #Y 75#! gold. The buyer must be outside our subject network, free of civil war, and at peace with us."
 me_zaraken.142.t:0 "$03_zaraken_task_36$"
 me_zaraken.142.desc:0 "The factor from [SCOPE.sCountry('zaraken_grain_buyer').GetName|Y] watched the last sack come up the plank at #G Mihrab#!, then cut the cord and rolled a few grains between his fingers. He paid what he had promised, though he kept the opened sack by his feet to show his partners what had come off the wagons from #G Kassandane#!.\n\nBefore he went aboard, he asked the carters to leave space in their books for another order. The militia will still draw its share at the old price. The merchants will have a buyer for what is left, and the factor can tell his partners whose scales he saw used at the wharf."
 me_zaraken.142.a:0 "Enter the buyer's name in the quay book."
 me_zaraken.143.t:0 "The Last Riding of the Bounds"
 me_zaraken.143.desc:0 "The riders came back from the third circuit with the watch rolls tied behind their saddles. At the muster, a carter unroped his grain before the quartermaster had found a place for it, and the boys carrying benches had to go around him. One of the captains recognized the carter from the house where his relief had slept on the way home and sent two men to help him stack the sacks.\n\nThe great houses have offered bread and meat for the tables, and they ask the herald to read the names of the captains who rode for them. The quartermaster says the crown could pay for the meal and send grain back with the people who gave the riders beds. He has kept their names on the back of the watch roll, since some of the smallest towns lodged the most men."
 me_zaraken.143.a:0 "Let the houses set the tables and call their captains forward."
 me_zaraken.143.b:0 "Pay for the feast and send grain home with our hosts."
 me_zaraken.145.t:0 "Silver Against the Waterfront Dues"
 me_zaraken.145.desc:0 "The factor who bought our first cargo of grain came back with a chest and asked the dock clerk to weigh the silver before anyone spoke of terms. His partners mean to send more ships to #G Mihrab#!, and he says he can put their silver in our treasury today if their captains can pay less at the wharf for the next five years.\n\nThe clerk has brought the book in which he entered the first cargo. He says the money on the table would settle bills the crown has been carrying since the muster, though he will have less to send up from the harbor every time those ships come in. The factor has left the chest open while we decide."
 me_zaraken.145.a:0 "Take the silver and lower the waterfront dues."
 me_zaraken.145.b:0 "Keep the dues at the rate in the book."
 zaraken_mihrab_reduced_quay_dues_mod:0 "Reduced Quay Dues"
 desc_zaraken_mihrab_reduced_quay_dues_mod:0 "The grain factors paid silver in advance for five years of lower dues."
 zaraken_kassandane_grain_contract_mod:0 "Kassandane Grain Contract"
 desc_zaraken_kassandane_grain_contract_mod:0 "The carters set aside the militia's grain before weighing the sacks bound for Mihrab."
 03_zaraken_task_24:0 "The Arsenal At Inar"
 03_zaraken_task_24_DESC:0 "A smith from #G Inar#! has brought the marshal a worn hinge from the fort gate and a broken sword from the drill yard. Both repairs must wait whenever the last bar goes to shoe the watch horses. Bring enough iron from Inar and Vanuse to keep an arsenal at the training grounds, and have the officers who know what breaks on campaign tell the smiths what to keep in store."
 me_zaraken.124.t:0 "$03_zaraken_task_24$"
 me_zaraken.124.desc:0 "A rider came down from the fort at #G Inar#! and set a broken sword on the smith's bench. The smith knew his own mark near the hilt. He took a sound blade from the rack, fitted it to the rider's hand and sent him back in time for the change of watch. The broken blade went beside the forge. There would be time to see where it had failed.\n\nUnder the shed lay bars from #G Vanuse#! with charcoal stacked clear of the rain. The arsenal keeper had left room beside them for the next delivery. For the first time the smith could promise the captain a rack of spare blades and still set iron aside for the farriers."
 me_zaraken.124.a:0 "Keep spare arms at Inar for the [ROOT.GetCountry.GetAdjective] companies."
 zaraken_capital_building_plots_mod:0 "Ground for the Capital's Quarters"
 desc_zaraken_capital_building_plots_mod:0 "The surveyors set aside ground for the capital's stores, markets, and waterworks before the new streets filled up."
 zaraken_city_building_plots_mod:0 "Ground for the New Quarters"
 desc_zaraken_city_building_plots_mod:0 "The city has kept ground clear for new yards and workshops beside the roads the companies use."
 zaraken_kyaxares_muster_quarter_mod:0 "The Grain District of Kyaxares"
 desc_zaraken_kyaxares_muster_quarter_mod:0 "The capital can feed the companies that muster here while the markets and wells stay open to the people who live beside them."
 zaraken_kassandane_caravan_quarter_mod:0 "Caravan Quarter of Kassandane"
 desc_zaraken_kassandane_caravan_quarter_mod:0 "The caravans water their teams and break up their loads at Kassandane before taking the capital's share to its gates."
 zaraken_vanuse_ironworks_mod:0 "The Iron Mills of Vanuse"
 desc_zaraken_vanuse_ironworks_mod:0 "The smiths can buy Kashan's iron in one yard, where the mills bring their loads to market."
 zaraken_mihrab_fleet_yards_mod:0 "Fleet Yards of Mihrab"
 desc_zaraken_mihrab_fleet_yards_mod:0 "The harbor master can fit out the crown's ships while the merchants unload at the next berth."
 zaraken_mihrab_trade_link_mod:0 "Trade with Mihrab"
 zaraken_inar_arsenal_mod:0 "The Arsenal at Inar"
 desc_zaraken_inar_arsenal_mod:0 "The forts can draw trained men, fittings, and provisions from the same city while the watch stays on the road."
 03_zaraken_t3_banner_tt:0 "Hold #G Kokihmobpod#! and #G Kobnudac#! directly or through vassals who accepted our Kashan heralds' offer."
 03_zaraken_t5_road_ground_tt:0 "Directly own #G Kassandane#!, #G Mihrab#! and #G Avestan#!, where the Razani crews will lay the road."
 03_zaraken_t7_string_tt:0 "Import Horses, Steppe Horses, or Camels, or have a surplus of at least #Y 2#! of any one of those goods in the state of #G Haxamanish#!."
 03_zaraken_t7_choice_tt:0 "Choose whether #G Karanî#! will produce Horses, Steppe Horses, or Camels."
 03_zaraken_t8_watch_tt:0 "Directly own #G Kashmar#!, and have at least #Y 4#! #Y Light Cavalry#! cohorts or at least #Y 4#! #Y Horse Archer#! cohorts in our armies, in any army and anywhere on the map."
 03_zaraken_t9_houses_tt:0 "No head of a great family, other than the ruler, has less than #Y 55#! loyalty."
 03_zaraken_t10_escort_tt:0 "Keep at least #Y 60%#! of our maximum manpower in reserve, and employ a general with at least #Y 6#! martial."
 03_zaraken_t14_boats_tt:0 "Have at least #Y 30#! ships."
 03_zaraken_t15_delegates_tt:0 "Every state we own in the #G Golden Foothills#! has at least #Y 50#! loyalty."
 03_zaraken_t16_keeper_tt:0 "Have at least #Y 2#! heads of families outside the ruling family with at least #Y 66#! loyalty each."
 03_zaraken_t17_marshal_tt:0 "Our marshal has at least #Y 8#! martial and #Y 60#! loyalty."
 03_zaraken_t18_muster_tt:0 "Have at least #Y 75#! legitimacy, and our ruler has at least #Y 60#! popularity."
 03_zaraken_t19_ground_tt:0 "Directly own #G Kyaxares#!, #G Kassandane#!, #G Vanuse#!, #G Mihrab#!, and #G Inar#!."
 03_zaraken_t19_surveyors_tt:0 "#G Kyaxares#! has at least #Y 40#! population."
 03_zaraken_t21_road_tt:0 "Have a road between #G Kyaxares#! and #G Kassandane#!."
 03_zaraken_t21_spices_tt:0 "Take the #Y $spices_province_decision_2$#! decision and directly own #G Kyaxares#! with its spice production modifier."
 03_zaraken_t22_hands_tt:0 "#G Vanuse#! has at least #Y 6#! slaves to work the mills."
 03_zaraken_t22_iron_tt:0 "Have a surplus of at least #Y 2#! @iron! Iron in the state of #G Vanuse#!."
 03_zaraken_t23_fleet_tt:0 "Employ an admiral with at least #Y 7#! martial."
 # Faith arm: the grave of Jaoz
 03_zaraken_task_26:0 "The Grave In The Small Temple"
 03_zaraken_task_26_DESC:0 "#Y Bachin#! asked that #Y Jaoz the Bold#! be buried in a small temple at #G Kyaxares#!, so that he could visit his friend's grave without a crowd of pilgrims at his back. When the coalition sacked the city in #Y 946 LC#!, its captains left the grave alone, and the keepers have swept its steps every morning since. Fewer pilgrims climb them each year, however, because the faithful on the road to #G Makox#! expect to find a #Y Kaxud#! in a #T Zainudian#! city, and a keeper who can tell them that the crown still honors the grave."
 03_zaraken_task_27:0 "Preachers At Gurhak"
 03_zaraken_task_27_DESC:0 "The #T Golden Dwarves#! of #G Gurhak#! still carry their dead past the shrine of their old father on the way down to the mines, and since the Razani road was finished our wagons have had to wait at the square for every procession. The preachers who came north with the wagons say the miners will sit through a sermon if it is short and given out of the rain. If we govern Gurhak, give the congregation a temple and time to bring the teaching of #T Zain'ud#! into the miners' homes. If the merchant-king holds the city under our protection treaty, ask him for a hall where his people can hear the reading."
 03_zaraken_task_28:0 "The Pilgrim Road To Makox"
 03_zaraken_task_28_DESC:0 "Every #T Zainudian#! is told to pray at the #Y Zaindaxan#! in #G Makox#!, where #T Zain'ud#! gave the prophets his final message, but the clergy there have not seen a company from #G Kyaxares#! at the altar since the #T Kephal#! fell. Send the #Y Keepers of the Tomb#! with a caravan of pilgrims, a high priest to speak for them, and enough silver to pay for the road. When they reach the altar court, the clergy of Makox will know what kind of believers have come before they open the gate."
 03_zaraken_task_29:0 "Kaxuds Of The Five Districts"
 03_zaraken_task_29_DESC:0 "A traveler who rides from #G Avestan#! to #G Kashmar#! ought to hear the evening prayer in every district he crosses, but in some valleys the nearest #Y Kaxud#! is still a tent that moves with the herds. Raise a temple in each of the five districts of the #G Golden Foothills#!. At #G Qaenab#!, where the #Y Achabascan#! herdsmen still keep the hearth fires of their ancestors, the preachers will have to win over the families before there is anyone to put in the temple. Set aside gold for the hearing and give the clerks three months to bring back the temple accounts."
 03_zaraken_task_30:0 "The Heirs Of Jaoz"
 03_zaraken_task_30_DESC:0 "#Y Jaoz the Bold#! died of a fever while putting down a #Y Zaraken#! revolt, and yet it is the Zarakens who have swept his steps ever since. The keepers have begun asking each pilgrim where he slept on the road to #G Kyaxares#!. Let three towns in the Foothills open their temples to travelers, and when the ruler or the high priest can vouch for the keepers, the House of [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective|T] can ask to be named the heirs of Jaoz."
 03_zaraken_t26_tomb_tt:0 "Hold the #Y Tomb of Jaoz#!. If it has been lost, have at least #Y 2#! Temples in #G Kyaxares#! instead."
 03_zaraken_t26_kaxud_tt:0 "Have a #Y Kaxud#! in at least one of our cities. The #Y Build Kaxud#! decision raises one."
 03_zaraken_t27_gurhak_tt:0 "Honor our protection treaty with #Y Yamhad#!, or directly own #G Gurhak#! with a Temple and #T Zainudian#! as its dominant faith."
 03_zaraken_t28_priest_tt:0 "Our high priest is #T Zainudian#! and has at least #Y 6#! zeal."
 03_zaraken_t29_temples_tt:0 "Own a territory with a Temple in each of #G Kashan#!, #G Shizar#!, #G Zarqan#!, #G Zakaria#!, and #G Hajar#!."
 03_zaraken_t29_qaenab_tt:0 "We or one of our subjects hold #G Qaenab#!, and #T Zainudian#! is its dominant faith."
 03_zaraken_t30_faithful_tt:0 "Own at least #Y 3#! territories in the #G Golden Foothills#! with a Temple and #T Zainudian#! as the dominant faith."
 zaraken_pilgrim_lodgings_mod:0 "Lodgings for the Pilgrims"
 desc_zaraken_pilgrim_lodgings_mod:0 "The temple keepers have a list of households that will take in pilgrims after dark."
 zaraken_coronation_house_rolls_mod:0 "Rolls of the Older Crown"
 desc_zaraken_coronation_house_rolls_mod:0 "The houses send the marshal the names of the riders they can bring to the muster."
 zaraken_coronation_district_oaths_mod:0 "Oaths at the Coronation"
 desc_zaraken_coronation_district_oaths_mod:0 "The keepers carry the crown's warrants back to the districts with the oaths sworn at the grave."
 me_zaraken.3.desc_roots:0 "The old houses came to #G Kyaxares#! with the rolls they had read before the Assembly. One captain had crossed out his own name and written his son's in its place, and when the herald called his house, both men came forward. The father held the roll while the son lifted the older crown from its cloth.\n\nThe marshal has asked for a copy of every roll, since the houses will bring their own horses to the muster and he must know which riders can take the field together. The old captain asks to ride out with his son on the day the new standard leaves the western gate.\n\n[ROOT.GetCountry.Custom('zaraken_coronation_commissions')]"
 me_zaraken.3.desc_prophets:0 "The clerks came from the grave of #Y Jaoz#! with the oaths they had taken down in the five districts. One stopped on the steps to find the name of a watchman who had opened his tower to pilgrims after dark. By the time the herald received the crown, the clerk had found the name and called the man forward to hear his oath read.\n\nThe clerks will carry a copy back to each district, where the families who lodged the pilgrims can hear what the crown has promised in return. The new watch at the grave asks that the first copy go to the man at the tower. When his relief comes, there should be a warrant there that tells the next man to open the gate.\n\n[ROOT.GetCountry.Custom('zaraken_coronation_commissions')]"
 me_zaraken.141.t:0 "The Flag at the Crossing"
 me_zaraken.141.desc:0 "The marshal sent the same flag to #G Elika#! and #G Inar#!, but when the watch at Elika raised it to call for the relief, the men at Inar came down armed and ready to fight. An old watchman brought out his signal book, and the marshal found that both forts had copied their orders faithfully. They had simply been given different books.\n\nThe marshal wants every company to answer a signal from an officer it has never served under. Until they can, he has told the quartermasters to leave grain at the crossing for any relief that takes the wrong road, since the last one had to buy its supper from the villagers it had been sent to protect."
 me_zaraken.141.a:0 "Have both watches drill from the same book."
 03_zaraken_t30_route_tt:0 "The clergy of #G Makox#! have received our pilgrims at the #Y Zaindaxan#!, or #G Kyaxares#! has at least #Y 2#! Temples for the pilgrims who pray at the grave instead."
 03_zaraken_t30_devout_tt:0 "Our ruler has at least #Y 8#! zeal, or our high priest has at least #Y 12#! zeal."
 03_zaraken_faith_zealous_tt:0 "The clergy at #G Makox#! will receive our pilgrims at the #Y Zaindaxan#!. Banishment closes #Y The Older Crown#! and commits this mission to the #Y Prophets#! route."
 03_zaraken_faith_licensed_tt:0 "If #G Makox#! remains outside our control, its clergy will demand a payment based on our realm rank to admit our pilgrims to the #Y Zaindaxan#!."
 03_zaraken_makox_recognized_tt:0 "The clergy of #G Makox#! have received our pilgrims. #Y The Heirs of Jaoz#! will not require a second Temple at #G Kyaxares#!."
 03_zaraken_faith_own_road_tt:0 "#Y The Heirs of Jaoz#! will require at least #Y 2#! Temples in #G Kyaxares#!, so that pilgrims can pray at the grave without passing through #G Makox#!."
 me_zaraken.126.t:0 "The Scandal at the Temple Steps"
 me_zaraken.126.desc:0 "The #Y Keepers of the Tomb#! have always let travelers rest in the shade of the small temple where #Y Jaoz the Bold#! lies, and over the years its steps have become a place to meet, to wait for a caravan, and to strike a bargain. One morning two #T Helluvian#! merchants were weighing pepper at the foot of the steps when their porter asked a party of pilgrims to stand aside while he carried the sacks down to the market. The pilgrims had come by way of #G Makox#!, where the clergy still preach that the #Y Zarakens#! sold their faith for spice money in the days of the #T Kephal#!, and they took the scales at the grave as proof of it. Words were exchanged, the porter struck one of the men, and by the time the guard arrived, half the square had seen it.\n\nThe Elder of the Keepers asks us to close the Helluvian guildhouses, sell their warehouses, and banish their factors from the Foothills, since every caravan that carries the story home gives the clergy of Makox another reason to shut their gates to us. The treasurer points out that the warehouses can be sold either way, and that the factors could keep trading from stalls beyond the eastern gate, where the pilgrims need not see their scales."
 me_zaraken.126.a:0 "Close the Helluvian guildhouses and banish them from the Golden Foothills"
 me_zaraken.126.b:0 "Sell the warehouses and move the factors beyond the eastern gate"
 me_zaraken.127.t:0 "$03_zaraken_task_27$"
 me_zaraken.127.desc:0 "The new temple at #G Gurhak#! held its first full service on a feast day of the old shrine, and when the rain came down, so many miners took shelter inside that the doorkeepers borrowed benches from the tavern. A foreman whose grandfather had cut the steps to the old father's shrine stayed by the door until the reading from the #Y Uphin#! came to the passage on honest weights, and afterward he asked for a copy to read to the men who weighed his crew's ore.\n\nThe priests of the old shrine still tend their lamps, and some families still carry their dead past them on the way to the mines. The preachers ask the crown's men to see them across the square, where the two congregations now pass each other, and they ask the market clerks to shut the scales on the miners' rest day so that those who wish to hear the reading can stay to the end.\n\nThe preachers also ask the court to consider the journey from Avestan. A paved road would let the next party bring its books by cart even after the autumn rains."
 me_zaraken.127.desc_treaty:0 "The merchant-king lent the preachers a hall at #G Gurhak#! after the miners asked to hear the passage in the #Y Uphin#! on honest weights. A foreman brought benches over from the tavern, and when the reader finished, he asked for a copy to take down to the men who weighed his crew's ore.\n\nThe priests of the old shrine still tend their lamps. The gate captain says the terms of protection are good enough to see our preachers safely across the square, and he asks that the watch take the same care of the families who come to the old shrine on the miners' rest day.\n\nThe preachers also ask the court to consider the journey from Avestan. A paved road would let the next party bring its books by cart even after the autumn rains."
 me_zaraken.127.a:0 "See the preachers across the square"
 me_zaraken.127.b:0 "See the preachers across the square and lay a road from Avestan to Gurhak."
 me_zaraken.128.t:0 "$03_zaraken_task_28$"
 me_zaraken.128.desc_ours:0 "The caravan from #G Kyaxares#! reached #G Makox#! with a letter from our court, and the city clerks were waiting at the gate to conduct the pilgrims to the #Y Zaindaxan#!. The clergy could scarcely bar the altar court to a party received under our seal, though once the gates were open, they took care to read the name of every house in the caravan while the eldest keeper prayed at the stone.\n\nThe keeper has brought home a copy of the list, and the houses at court have already asked him whether the priests read their names in the order he gave them. He has more to say about the road, where a number of the older pilgrims had to sleep between the wells, and he asks that we keep the hospices open for the companies that will follow now that the altar court has received us."
 me_zaraken.128.desc_zealous:0 "A #T Helluvian#! merchant reached #G Makox#! ahead of our caravan and asked the clergy to hear his complaint. The crown, he said, had sold his warehouse in #G Kyaxares#! and banished his guild from the #G Golden Foothills#! after the fight at the temple steps. For years the clergy had preached that our court would excuse anything for the sake of the spice trade, so when the Elder of the #Y Keepers of the Tomb#! arrived, they told him they had heard from the merchant himself what the crown had done, and then they opened the altar court and led our pilgrims to the #Y Zaindaxan#!.\n\nAfter the prayers, several #Y Zinduidian#! families asked to travel home with our caravan so they could pray at the grave of #Y Jaoz#!, and they want to know how far apart the places are where their children can sleep. The Elder asks us to keep grain and beds in the hospices, since now that the clergy have opened the court to us, he expects pilgrims on the road in both directions."
 me_zaraken.128.desc_licensed:0 "The clergy of #G Makox#! came to the gate of the altar court while our pilgrims were still shaking the dust from their clothes, and asked whether the #T Helluvian#! factors still traded under the seal of #G Kyaxares#!. The eldest keeper told them where the stalls had been moved, but when he brought out the letter authorizing the move, a priest laid a finger on the seal and asked how much difference the width of a wall could make. The gate stayed shut.\n\nThe clergy have named a penance in silver for the upkeep of the altar, and if the crown pays it, they will receive our pilgrims at the stone. The keeper has sent the terms home with a rider, along with a request from the families waiting in the square. If the crown brings them home, they ask for a place to pray beside #Y Jaoz#!, where the keepers know their names and have room to open another hall."
 me_zaraken.128.a:0 "Keep the hospices open for the next caravan"
 me_zaraken.128.b:0 "Pay the penance so the pilgrims can enter"
 me_zaraken.128.c:0 "Bring the pilgrims home to pray at the grave"
 me_zaraken.129.t:0 "$03_zaraken_task_29$"
 me_zaraken.129.desc:0 "The preachers have sent their accounts to #G Kyaxares#!, where the clerks laid them beside the muster rolls to see which towns could lodge travelers on the road. In #G Shizar#! the miners gather before the first shift, while the herdsmen of #G Zarqan#! come in at dusk after bringing the horses down. At #G Qaenab#!, an elder brought a bowl of ashes from his family's hearth and asked the preacher to set it somewhere his children would be able to find it.\n\nThe #Y Keepers of the Tomb#! have brought a single calendar for all five districts, so that a pilgrim can keep the same feasts from #G Avestan#! to #G Kashmar#!. The patrons who paid for the lamps and roofs have brought their own accounts, however, and they ask to keep the offerings in their districts and set the feast days around the work of the people who actually come."
 me_zaraken.129.a:0 "Let every district keep the calendar of the grave."
 me_zaraken.129.b:0 "Leave the offerings and the feast days to the local patrons."
 me_zaraken.140.t:0 "The Keepers and the Patrons"
 me_zaraken.140.desc:0 "The keeper from #G Kyaxares#! brought a list of the days pilgrims come to the grave of #Y Jaoz#!. A patron from the foothills laid the temple accounts beside it and pointed to the weeks when her tenants take their herds up to pasture. The court has paid for the hearing, and the clerks will ride out to learn which temples can feed and lodge visitors before the dates are set."
 me_zaraken.140.a:0 "Hear from the people who keep the temples open."
 zaraken_kaxud_crown_calendar_mod:0 "Calendar of the Grave"
 desc_zaraken_kaxud_crown_calendar_mod:0 "The districts reckon their feast days by the calendar kept at the grave of Jaoz."
 zaraken_kaxud_local_patronage_mod:0 "District Temple Patrons"
 desc_zaraken_kaxud_local_patronage_mod:0 "The patrons keep the offerings in their districts and set the feast days with the local keepers."
 me_zaraken.130.t:0 "$03_zaraken_task_30$"
 me_zaraken.130.desc_recognized:0 "On the feast of the Bold, the line outside the small temple at #G Kyaxares#! reached past the spice scales, and among the pilgrims were clergy from #G Makox#! carrying the list they had read at the #Y Zaindaxan#!. They read those names again at the grave, adding the names of the households that had put them up on the way. When the last name was spoken, the eldest of them knelt on the steps our keepers have swept every morning since #Y 946 LC#!.\n\nThe Elder asks that the grave be named in the crown's warrants, so that a captain who gives shelter at a tower knows what he is doing for the families whose names were read. The priest from Makox has asked for a copy of the register to take home, so that the clerks at the altar court will have the names at hand when a #Y Zaraken#! family comes to pray."
 me_zaraken.130.desc_own_road:0 "On the feast of the Bold, the keepers at #G Kyaxares#! opened the small temple where #Y Jaoz#! lies and the hall beside it, where families who once traveled to #G Makox#! could wait under cover to have their names called. Some had ridden from the far end of the #G Golden Foothills#!, and one woman who had waited in the square outside the altar court brought the candle she had carried home unlit. A keeper held it for her while she gave him the names of the family who had come with her.\n\nThe factors beyond the eastern gate sent a servant back for more candles before the names had all been read, and the treasurer has set the day's receipts aside for the pilgrims' hall. When the crown issues its warrant protecting the tomb and its pilgrims, the Elder asks to have his book laid beside it, for these are the households that came to pray under its protection."
 me_zaraken.130.a:0 "Read the names of the faithful at the grave."
 zaraken_keepers_of_the_grave_mod:0 "#T Keepers of the Tomb#!"
 desc_zaraken_keepers_of_the_grave_mod:0 "The Keepers of the Tomb sweep the steps above the grave of Jaoz the Bold each morning and keep the book in which the pilgrims give their names."
 zaraken_closed_houses_mod:0 "The Closed Houses"
 desc_zaraken_closed_houses_mod:0 "The Helluvian guilds have been banished and their warehouses sold. The pilgrims buy their candles from the keepers."
 zaraken_sealed_factors_mod:0 "The Sealed Factors"
 desc_zaraken_sealed_factors_mod:0 "The guilds' warehouses have been sold. Their merchants now trade beyond the eastern gate and pay duty on their stalls."
 zaraken_gurhak_preachers_mod:0 "Preachers at Gurhak"
 desc_zaraken_gurhak_preachers_mod:0 "The miners hear a short sermon before the shift, and the scales close on the day they rest."
 zaraken_received_at_the_stone_mod:0 "Received at the Zaindaxan"
 desc_zaraken_received_at_the_stone_mod:0 "The clergy of Makox have read our pilgrims' names at the altar, and the faithful who hear of it are more willing to listen to our preachers."
 zaraken_district_kaxuds_mod:0 "Kaxuds of the Five Districts"
 desc_zaraken_district_kaxuds_mod:0 "Every district keeps the calendar of the grave, and a pilgrim can find a Kaxud within a day of any road."
 zaraken_heirs_of_jaoz_mod:0 "The Heirs of Jaoz"
 desc_zaraken_heirs_of_jaoz_mod:0 "The House that keeps the prophet's grave has kept his faith in every district it rules."
 zaraken_named_at_the_grave_mod:0 "Names Read at the Grave"
 desc_zaraken_named_at_the_grave_mod:0 "Each year on the feast of the Bold, clergy from Makox read the names of the faithful on the steps of the small temple."
 zaraken_pilgrim_hall_mod:0 "The Pilgrims' Hall"
 desc_zaraken_pilgrim_hall_mod:0 "The great hall beside the grave receives the pilgrims who no longer travel to Makox, and the stalls outside the gate sell them candles for the road."
 # Rival arc: Yamhad
 03_zaraken_task_32:0 "The Tolls At Gurhak"
 03_zaraken_task_32_DESC:0 "The wagoners who take the Razani road to #G Gurhak#! bring home a toll receipt for every load, though the clerks at #G Avestan#! have only the drivers' word for what was on the wagons when they left. Give Avestan two markets and have their clerks keep a common roll, so the herald can bring the merchant-king an account bearing the crown's seal."
 03_zaraken_task_33:0 "Under The Mountain"
 03_zaraken_task_33_DESC:0 "The dwarves of #Y Yamhad#! have kept the holds beneath #G Gurhak#! since before the first Zaraken rode up the valley. Secure the road by bringing the merchant-king under our protection by treaty, or take Gurhak and settle the fate of his remaining holds."
 03_zaraken_t33_gurhak_tt:0 "Directly own #G Gurhak#! or honor the protection treaty while our vassal #Y Yamhad#! holds it."
 03_zaraken_t33_king_tt:0 "#Y Yamhad#! no longer exists, or it has become our subject."
 03_zaraken_break_holds_tt:0 "Every territory still held by #Y Yamhad#! passes to us, and each suffers #Y Broken Holds#! for #Y 10#! years."
 me_zaraken.131.t:0 "The Tolls At Gurhak"
 me_zaraken.131.desc:0 "For years the guards of #Y Yamhad#! at [GetProvince('(int32)4358').GetName|G] have charged heavy tolls on the wagons of [ROOT.GetCountry.GetName|G], and since the pass is the only road a loaded wagon can take, our merchants have had no choice but to pay. Last month one wagoner paid more at the gate than he paid his drivers for the whole journey. The merchant-king's herald has checked the receipts himself, and he admits that our merchants have paid for his master's watch all winter.\n\nNow that #G Avestan#! has its markets, we can charge Yamhad's merchants when they come down to sell. The herald would rather agree on one toll for the whole road and divide what it brings in, but if he goes home without terms, his master will keep charging at Gurhak and we will set our own rate at Avestan."
 me_zaraken.131.desc_terms:0 "$me_zaraken.131.desc$\n\nThe herald can carry one further offer home. If we pay to keep the pass defended, the merchant-king may agree to swear to our crown and collect a common toll. Gurhak and the men on its gate would stay in his hands. The herald must take the terms back for his seal."
 me_zaraken.131.a:0 "Set our own toll at Avestan."
 me_zaraken.131.b:0 "Offer protection and agree a common toll."
 me_zaraken.132.t:0 "$03_zaraken_task_33$"
 me_zaraken.132.desc_subject:0 "The merchant-king of #Y Yamhad#! came up out of the holds beneath #G Gurhak#! to hear our terms in the same counting hall where his clerk once read out the price of our horseshoes. He brought the ledgers with him. When our captain asked what they were for, the king said that he owed his gatekeepers an account of every ingot he put at the crown's disposal.\n\nHe offers to keep his holds and pay the crown a share of every toll and every ingot that leaves the mountain, and his smiths have already asked whether they may shoe our heavy horse at the old dwarven forges. Our captains would rather empty the holds and bring the ingots home on our own wagons. Either way, the dwarves will remember what we chose for a very long time."
 me_zaraken.132.desc_treaty:0 "The merchant-king received our captain in the counting hall at #G Gurhak#!. He had the new toll account open beside the old one and asked the captain to sit while the clerk read what had come in since the oath. When the account was closed, the king sent for the smith who had shod the escort's horses.\n\nThe smith asks whether the crown would take its shoes from the old forges each campaign season. The merchant-king says he can answer for the iron and the gate as long as his men can answer to him there. He asks the captain to carry that promise home with the account."
 me_zaraken.132.desc_gone:0 "The holds beneath #G Gurhak#! are quiet now. The last of the #Y Yamhad#! clerks fled the counting hall with as many ledgers and chests as they could carry, and our men found the galleries stripped of nearly everything worth lifting, although one strongroom had been locked by men who had no time to empty it.\n\nA few of the old smiths have stayed behind, because their forges are older than any king and they have no intention of starting over somewhere else. They ask only that the crown buy its iron from them at a fair price, and they have already offered to shoe the heavy horse every campaign season."
 me_zaraken.132.a:0 "Leave the holds to their king, under our banner"
 me_zaraken.132.b:0 "Break the holds and bring the ingots home"
 me_zaraken.132.c:0 "Count the strongroom, and keep the smiths"
 # The roots route
 03_zaraken_task_35:0 "The Older Crown"
 03_zaraken_task_35_DESC:0 "Long before the prophets came south, the #Y Zaraken#! kings rode at the head of their knights under the crown of #Y Eszarakayn Shazum#!. The princes of the foothills still remember which houses rode with them, and the #T Helluvian#! factors still trade at #G Kyaxares#! because our grandfathers kept their doors open. When the knights have sounded the charge in war and come home, call the houses to Kyaxares in peace so they can see who answers to the old banner."
 03_zaraken_t35_houses_tt:0 "The Helluvian houses at #G Kyaxares#! have not been closed."
 03_zaraken_t35_knights_tt:0 "Have at least #Y 10#! #Y Heavy Cavalry#! cohorts, #Y 10#! #Y Horse Archer#! cohorts, or #Y 10#! #Y Camel#! cohorts across our armies anywhere on the map."
 03_zaraken_t35_charges_tt:0 "Sound the #Y Kaxhamid Charge#! at least #Y five times#!."
 zaraken_jaoz_heritage:0 "Heritage of Jaoz the Bold"
 zaraken_jaoz_heritage_desc:0 "The crown has taken the tomb of #Y Jaoz#! and the roads to it under its protection. The priests read the pilgrims' names at the grave. The crown's clerks keep a second copy, in case anyone wants to know which towns actually put them up."
 zaraken_older_crown_heritage:0 "Heritage of the Older Crown"
 zaraken_older_crown_heritage_desc:0 "The old houses have sworn again to the crown of #Y Eszarakayn Shazum#!. The marshal has received their rolls and sent several back. A horse may be claimed by two cousins, but it can only carry one of them to the muster."
 03_zaraken_route_roots_tt:0 "We claim the throne as heirs to #Y Eszarakayn Shazum#! and the old Zaraken kings. #Y The Heirs of Jaoz#! and the tasks leading to it will be bypassed.\nWe will adopt #Y $zaraken_older_crown_heritage$#! and unlock #Y $03_zaraken_recall_hill_shamans$#!."
 03_zaraken_route_prophets_tt:0 "We claim the right to rule as #Y Jaoz the Bold's#! spiritual heirs and take his tomb and its pilgrims under the crown's protection. #Y The Older Crown#! will be bypassed.\nWe will adopt #Y $zaraken_jaoz_heritage$#!."
 me_zaraken.133.t:0 "$03_zaraken_task_35$"
 me_zaraken.133.desc:0 "The crown of #Y Eszarakayn Shazum#! had lain in a cedar chest under the old palace since before the Kephal, and the keeper who brought it up had to borrow a lamp from the kitchens to find the key. It is heavier than the circlet our rulers have worn since, and the gold on the inside of the band is worn smooth where an older head pressed against it. When [ROOT.GetCountry.GetRuler.GetName|Y] put it on in front of the princes, the captains of the heavy horse struck their shields, and after a moment the princes did as well.\n\nThe clergy who keep the grave of #Y Jaoz#! say nothing against it, though they have asked whether the crown means to keep the feast of the Bold. The #T Helluvian#! factors sent a gift of glass by the evening, and the knights have asked to ride out under the old banner rather than the one the Kephal gave us."
 me_zaraken.133.a:0 "Ride out under the old banner."
 zaraken_crown_of_eszarakayn_treasure:0 "Crown of Eszarakayn Shazum"
 zaraken_crown_of_eszarakayn_treasure_desc:0 "The crown of the old Zaraken kings, kept in a cedar chest under the palace at Kyaxares through the whole rule of the Kephal."
 zaraken_older_crown_mod:0 "The Older Crown"
 desc_zaraken_older_crown_mod:0 "The ruler wears the crown of the old Zaraken kings, and the knights ride under the banner they carried before the prophets came south."
 zaraken_standard_of_five_districts_treasure:0 "Standard of the Five Districts"
 zaraken_standard_of_five_districts_treasure_desc:0 "The imperial standard carried out of Kyaxares at the crowning, with the banner of every district stitched along its hem."
 NICKNAME_ZARAKEN_RESTORER:0 "'the Restorer'"
 NICKNAME_ZARAKEN_KEEPER_OF_THE_GRAVE:0 "'Keeper of the Grave'"
 03_zaraken_finale_extras_tt:0 "Gain the #Y Standard of the Five Districts#!. Our ruler takes a title from the road the realm has followed, and #Y Ride the Bounds#! and the #Y Kaxhamid Charge#! grow stronger and stay after the coronation."
 03_zaraken_coronation_riders_tt:0 "Raise the #Y Riders of the Older Crown#! at #G Kyaxares#! with #Y 2 Heavy Cavalry#! and #Y 2 Light Cavalry#! cohorts."
 # Signature mechanics
 03_zaraken_ride_the_bounds:0 "Ride the Bounds"
 03_zaraken_ride_the_bounds_desc:0 "The princes of the Foothills will obey a seal they have watched being pressed. The [ROOT.GetCountry.GetRulerTitle|T] can ride through each district in turn, holding court in its hall and sealing its charters in front of its captains, although the houses left behind at #G Kyaxares#! may use the absence for their own ends."
 03_zaraken_kaxhamid_charge:0 "The Kaxhamid Charge"
 03_zaraken_kaxhamid_charge_desc:0 "When the heavy horse of the old empire rode out, the whole line charged at the sound of a single horn, and no army in the Foothills has stood against that charge since the Kephal fell. The horn can be sounded again, but only in a real war, and the knights it calls out will not all ride home."
 03_zaraken_bounds_unlocked_tt:0 "Unlock the #Y Ride the Bounds#! decision. Its gold cost scales with realm rank. It adds #Y 10#! loyalty to every state we own in the #G Golden Foothills#!, and gives our ruler #Y 5#! popularity. While the ruler is away, a great family may lose loyalty. It can be used once every #Y 5#! years."
 03_zaraken_bounds_renewed_tt:0 "#Y Ride the Bounds#! now adds #Y 15#! state loyalty, can be used once every #Y 3#! years, and remains after the coronation."
 03_zaraken_charge_unlocked_tt:0 "Unlock the #Y Kaxhamid Charge#! decision."
 03_zaraken_charge_renewed_tt:0 "The #Y Kaxhamid Charge#! now also grants #Y +10%#! heavy cavalry discipline for #Y 1#! year."
 03_zaraken_bounds_ready_tt:0 "The ruler has not ridden the bounds within the cooldown."
 03_zaraken_charge_ready_tt:0 "At least #Y 5#! years have passed since the last Kaxhamid Charge, or the horn has yet to be sounded."
 03_zaraken_bounds_effect_tt:0 "Every state we own in the #G Golden Foothills#! gains #Y 10#! loyalty."
 03_zaraken_bounds_effect_renewed_tt:0 "Every state we own in the #G Golden Foothills#! gains #Y 15#! loyalty."
 03_zaraken_bounds_risk_tt:0 "#R There is a 50% chance that the head of a great family takes advantage of our absence and loses 10 loyalty for 3 years.#!"
 03_zaraken_t15_bounds_tt:0 "Our ruler has used #Y Ride the Bounds#! at least once."
 03_zaraken_t17_charge_tt:0 "Sound the #Y Kaxhamid Charge#! at least #Y three times#!."
 03_zaraken_t18_bounds_tt:0 "Use #Y Ride the Bounds#! at least #Y three times#!."
 03_zaraken_task_38:0 "The Elder's Claim"
 03_zaraken_task_38_DESC:0 "[ROOT.GetCountry.Custom('zaraken_task_38_description')]"
 03_zaraken_task_38_DESC_revealed:0 "Since the second riding of the bounds, captains on the pilgrim roads have been holding back their reliefs on the word of the Elder of the #Y Keepers of the Tomb#!, and the crown cannot leave two seals on the same order for long. Summon the Elder to #G Kyaxares#! to answer for his letters, and give the marshal two months to bring in the companies that still answer to the crown before the Elder can call them to the grave instead."
 03_zaraken_task_39:0 "The Last Watch"
 03_zaraken_task_39_DESC:0 "[ROOT.GetCountry.Custom('zaraken_task_39_description')]"
 03_zaraken_task_39_DESC_revealed:0 "Put down the Elder's claim and bring the keys of the tomb back to #G Kyaxares#!. The ruling house will dissolve the #Y Keepers of the Tomb#! and take their watch into its own keeping, but the district captains will still want to know whose seal is to stand on their warrants."
 03_zaraken_task_description_unrevealed:0 "Complete the preceding tasks to learn more."
 03_zaraken_revolt_defeated_tt_revealed:0 "Defeat the #Y Keepers of the Tomb#! in the civil war or see the Elder's challenge collapse."
 03_zaraken_revolt_settled_tt:0 "Settle the district commissions in #Y The Last Watch#!."
 03_zaraken_revolt_escorts_tt:0 "Keep two light cavalry cohorts out of the rebel muster."
 03_zaraken_convene_divided_muster:0 "Summon the Elder to Answer"
 03_zaraken_convene_divided_muster_desc:0 "Send the crown's summons once the court can sit in peace at #G Kyaxares#!. The Elder has called the men sworn to the tomb to answer him first."
 zaraken_assembly_revolt_name:0 "Keepers of the Tomb"
 zaraken_assembly_revolt_adj:0 "Tomb Keepers"
 zaraken_dynastic_tomb_watch_mod:0 "The Royal Watch at the Tomb"
 desc_zaraken_dynastic_tomb_watch_mod:0 "The ruling house furnishes the watch at the grave of Jaoz and keeps the book in which the pilgrims give their names."
 zaraken_crown_commissions_mod:0 "Commissions Under the Crown Seal"
 desc_zaraken_crown_commissions_mod:0 "The captains must come to Kyaxares for their warrants, and the houses have begun counting who goes home without one."
 me_zaraken.146.t:0 "The Elder's Seal"
 me_zaraken.146.desc:0 "On the second riding of the bounds, a watchman stopped the ruler's party at his gatehouse and asked [ROOT.GetCountry.GetRuler.GetFirstName|Y] to step inside. A relief had reached him before dawn carrying two papers, a crown warrant ordering the company on to its next post and a letter from the Elder of the #Y Keepers of the Tomb#! asking it to stay. The captain had sworn at the grave to shelter pilgrims on this road, and the Elder writes that a company cannot leave it bare until the last families are through.\n\nThe watchman has fed the men in his yard, and their captain is waiting by the fire with the wax still whole on both papers. He asks which of the two he is to obey, and says his men will want to know as well, since they heard the Elder read their names when they took the oath."
 me_zaraken.146.a:0 "Bring both papers back to Kyaxares."
 me_zaraken.147.t:0 "$03_zaraken_task_38$"
 me_zaraken.147.desc:0 "The herald found the Elder on the temple steps and read the summons where the captains had once sworn their oaths. The Elder cut the crown's seal from the warrant and handed the wax back to the herald, and by dusk he had gone out with the brothers who kept the pilgrim rolls to a captain in the foothills, who opened his gate to them.\n\nThe marshal can call the reserve into Kyaxares before the roads close. The men who drilled at #G Elika#! and #G Inar#! would rather ride out first, since they know the escorts on the pilgrim roads, and some of those men may still come home if they hear the summons from a captain they trust."
 me_zaraken.147.desc_prophets:0 "The Elder has laid the crown's claim to be #Y Heirs of Jaoz#! beside the old grave register. He read out the names of the brothers who kept the lamps lit after the sack, then asked the pilgrims to point to a ruler's name among them. He says his order inherited the duty and ought now to inherit the right to govern.\n\n$me_zaraken.147.desc$"
 me_zaraken.147.desc_roots:0 "The Elder has asked which of the kings who wore the crown of #Y Eszarakayn Shazum#! swept the grave after the sack. A man who can name his ancestors may lay claim to a crown, he says, but the brothers who kept the tomb have a claim that every pilgrim who came to pray can still witness.\n\n$me_zaraken.147.desc$"
 me_zaraken.147.a:0 "Send the captains to bring the escorts home."
 me_zaraken.147.b:0 "Call the reserve into Kyaxares."
 me_zaraken.148.t:0 "The Keepers Raise Their Banner"
 me_zaraken.148.desc:0 "Terrible news, my lord. [SCOPE.sChar('zaraken_tomb_elder').GetName|Y], Elder of the #Y Keepers of the Tomb#!, has quietly opposed your decision to [ROOT.GetCountry.Custom('zaraken_revolt_succession_claim')]. While his brothers copied the names of pilgrims into the tomb register, the Elder used their journeys to carry letters to disaffected nobles. Now those nobles have brought their household companies to his banner, and the first of their watchfires can be seen from the road to #G Kyaxares#!."
 me_zaraken.148.desc_crown:0 "$me_zaraken.148.desc$\n\nOne prince sent back his captain's commission with the crown's seal still whole. The Elder has promised him that the captains will take their orders from the houses that raised them."
 me_zaraken.148.desc_houses:0 "$me_zaraken.148.desc$\n\nThe princes who went over brought the muster rolls of the very companies we paid to arm. At the tomb steps, their captains swore to answer the Elder's summons under their own household banners."
 me_zaraken.148.desc_shrine:0 "$me_zaraken.148.desc$\n\nThe Elder read the common oath of #Y Jaoz#! aloud at the shrine, then called up a captain the crown had relieved. When the man stepped forward, his old company fell into ranks behind him."
 me_zaraken.148.desc_rotation:0 "$me_zaraken.148.desc$\n\nThe district owed the next turn at command sent its captain to the Elder with the muster roll folded into his saddlebag. Our officer had kept the standard past his term. The Elder gave the captain his own banner to ride under, and the district's companies were the first to come out for him."
 me_zaraken.148.a:0 "Stand with the crown and call out the loyal watches."
 me_zaraken.148.a.tt:0 "The #Y Keepers of the Tomb#! have risen in civil war. Defeat the Elder's forces and hold #G Kyaxares#! to complete #Y $03_zaraken_task_39$#!."
 zaraken_revolt_succession_prophets:0 "claim the throne as the #Y Heirs of Jaoz#!"
 zaraken_revolt_succession_roots:0 "claim the throne through the old crown of #Y Eszarakayn Shazum#!"
 me_zaraken.149.t:0 "$03_zaraken_task_39$"
 me_zaraken.149.desc:0 "The men who brought the tomb keys back to #G Kyaxares#! laid them on the table where the Elder once took the captains' oaths. The marshal has struck the brothers off the muster roll and taken in their warrants. A widow who came to light a lamp found a member of the ruling house at the door. He read her name from the same book the brothers had kept and let her through.\n\nFrom this day the ruler will bear the title of #Y Keeper of the Grave#!, and the house will furnish the watch from its own household. The district delegates have brought the rolls of the companies that surrendered. Some ask to keep their old commissions under a new oath. The marshal asks us to take those seals into our own hands as well."
 me_zaraken.149.desc_collapsed:0 "The Elder called for the companies sworn at the grave, and by evening their captains had sent word that they would stay at their posts. The brothers have brought back their warrants and laid the tomb keys on the table where they once took the oaths. The crown has ordered their muster roll closed.\n\nThe ruling house will keep the watch and the ruler will bear the title of #Y Keeper of the Grave#!. The district delegates have come to ask whether their own commissions are to be struck off with the brothers' warrants or entered again under a new oath."
 me_zaraken.149.a:0 "Let the districts keep their commissions under a new oath."
 me_zaraken.149.b:0 "Have the captains draw their commissions from Kyaxares."
 zaraken_coronation_commissions_crown:0 "Before the herald closed the rolls, the new [ROOT.GetCountry.GetRulerTitle] took the keys of the tomb and swore that the ruling house would furnish its watch. The first of the new commissions was read from the throne, and the captain took it under the same seal."
 zaraken_coronation_commissions_districts:0 "Before the herald closed the rolls, the new [ROOT.GetCountry.GetRulerTitle] took the keys of the tomb and swore that the ruling house would furnish its watch. The district delegates left with copies of their new oath, and the crown promised to read the names under their seals at the next muster."
 03_zaraken_kaxham_captain_tt:0 "A #Y Zaraken#! captain of the Kaxham Guards, with #Y +6#! martial and the #Y Tactician#! trait, joins our court."
 03_zaraken_inar_knights_tt:0 "Raise #Y 2#! cohorts of heavy cavalry at #G Inar#!."
 03_zaraken_mihrab_boats_tt:0 "Launch #Y 5#! Holks at #G Mihrab#!."
 zaraken_ruler_abroad_loyalty:0 "The Ruler Rode Away"
 zaraken_houses_hosted_feast:0 "Hosted the Feast"
 zaraken_kaxhamid_charge_mod:0 "The Kaxhamid Charge"
 desc_zaraken_kaxhamid_charge_mod:0 "The horn has been sounded, and the heavy horse charge as one line."
 zaraken_kaxhamid_charge_greater_mod:0 "The Kaxhamid Charge"
 desc_zaraken_kaxhamid_charge_greater_mod:0 "The horn has been sounded, and the Kaxham Guards lead the heavy horse in one line behind it."
 zaraken_toll_grievance_mod:0 "The Unpaid Receipt"
 desc_zaraken_toll_grievance_mod:0 "Every rider in the levy has heard what the dwarves wanted for the iron on his horse's shoes."
 zaraken_toll_ledger_mod:0 "The Toll Receipts"
 desc_zaraken_toll_ledger_mod:0 "The treasurer at Avestan keeps every receipt from the toll house at Gurhak and charges the wagoners a little less than the dwarves do."
 zaraken_gold_of_yamhad_mod:0 "The Gold of Yamhad"
 desc_zaraken_gold_of_yamhad_mod:0 "The merchant-king sends the crown its share of every toll and ingot, along with a ledger showing exactly what it cost him."
 zaraken_broken_holds_mod:0 "Broken Holds"
 desc_zaraken_broken_holds_mod:0 "The holds have been emptied and their ingots carried away, and the dwarves who remain have not forgotten who did it."
 zaraken_dwarven_smiths_mod:0 "The Old Forges"
 desc_zaraken_dwarven_smiths_mod:0 "The dwarven smiths of Gurhak shoe the crown's heavy horse and sell their iron at a price both sides have written down."
 03_zaraken_t18_heartland_tt:0 "We or our subjects own all of the #G Golden Foothills#!."
 03_zaraken_t18_title_tt:0 "Already be the #Y Neo-Zaraken Empire#!, or be eligible to form it with the title still vacant."
 03_zaraken_t18_capital_tt:0 "Own #G Kyaxares#! as a metropolis."
 03_zaraken_t18_rewards_tt:0 "Spend #Y 40#! Political Influence.\nGain #Y 4#! free province investments.\nGain #Y The Crown of Five Districts#! permanently.\n#G Kyaxares#! gains #Y Seat of the Neo-Zaraken Empire#! permanently.\n#Y Ride the Bounds#! adds #Y 15#! state loyalty every #Y 3#! years.\n#Y Kaxhamid Charge#! adds #Y +10%#! heavy cavalry discipline for #Y 1#! year.\nGain the #Y Standard of the Five Districts#! treasure.\nYour ruler gains the nickname #Y Keeper of the Grave#!.\nForming the #Y Neo-Zaraken Empire#! grants #Y 4#! additional free province investments."
 03_zaraken_t18_roots_rewards_tt:0 "Gain #Y Rolls of the Older Crown#! (+5% manpower recovery) and raise #Y 2 Heavy Cavalry#! and #Y 2 Light Cavalry#! cohorts at Kyaxares."
 03_zaraken_t18_prophets_rewards_tt:0 "Gain #Y Oaths at the Coronation#! (+0.02 monthly provincial loyalty)."

 03_zaraken_kashan_offers_tt:0 "Send a vassalage offer to each independent ruler at peace who still holds land in #G Kashan#! among #Y Surena#!, #Y Zadrakata#!, and #Y Bontdutg#!."
 03_zaraken_kashan_accept_tt:0 "We become a vassal of [SCOPE.sCountry('zaraken_kashan_sender').GetName|Y] and keep our territories under their overlordship."
 03_zaraken_kashan_refuse_tt:0 "We remain independent and send our refusal to [SCOPE.sCountry('zaraken_kashan_sender').GetName|Y]."
 03_zaraken_kashan_accepted_tt:0 "[SCOPE.sCountry('zaraken_kashan_recipient').GetName|Y] is now our vassal. Any Kashan garrisons it holds count toward #Y Kashan Under One Banner#!."
 03_zaraken_kashan_refused_tt:0 "[SCOPE.sCountry('zaraken_kashan_recipient').GetName|Y] declined vassalage. Our claims in #G Kashan#! still stand."
 me_zaraken.134.t:0 "A Place on the Pay Roll"
 me_zaraken.134.desc:0 "The herald from [SCOPE.sCountry('zaraken_kashan_sender').GetName|Y] asks to see the garrison's pay roll. When our treasurer brings it out, the herald sets the crown's offer beside it. We may keep our posts and our own officers if we swear to serve under the seal of #G Kyaxares#!. The men who guard the crossings will have their names entered on the crown's rolls.\n\nOur captain has counted how many weeks he can still pay the watch from the ford tolls. He asks us to take the offer while the men still answer to him. The elders ask who will settle the tolls once the crown has a claim on their service. The herald has left his copy of the terms on the table for our seal."
 me_zaraken.134.a:0 "Seal the terms. We will hold our posts for Kyaxares."
 me_zaraken.134.b:0 "Return the terms. Our officers will answer to us."
 me_zaraken.135.t:0 "The Seal Returns"
 me_zaraken.135.desc:0 "The herald has come back from [SCOPE.sCountry('zaraken_kashan_recipient').GetName|Y] with a sealed oath and a copy of the garrison's roll. Its officers are to keep their posts, and the quartermaster asks that the next issue of pay bear our seal. He has left the old names on the list so the men who call the muster will know where to begin.\n\nAt the crossing, the captain has asked for a copy to keep beside the toll receipts. If our riders come for service in the night, he wants the men on the gate to know whose orders they carry."
 me_zaraken.135.a:0 "Send the captain his copy."
 me_zaraken.136.t:0 "The Warrant Comes Back"
 me_zaraken.136.desc:0 "Our herald has come back from [SCOPE.sCountry('zaraken_kashan_recipient').GetName|Y] with our terms still unsealed. At the crossing he paid the same toll on his return as he had on his way out, and the captain who took the silver told him that the watch would still take its orders from home.\n\nOur clerk has set the returned warrant beside the claims already entered for #G Kashan#!. The captain of the escort asks for the toll receipt before he goes. It gives the name of the officer who held the crossing when our offer was refused."
 me_zaraken.136.a:0 "File the warrant with our claims."

 03_zaraken_yamhad_offer_tt:0 "Offer #Y 200 gold#! and protection. If Yamhad accepts, it becomes our vassal and retains #G Gurhak#! and its other holds. If we hold #G Avestan#!, it gains #Y $zaraken_toll_ledger_mod$#! for #Y 10 years#!. If Yamhad refuses, we keep our gold and gain #Y $zaraken_toll_grievance_mod$#! for #Y 5 years#!."
 03_zaraken_yamhad_accept_tt:0 "Receive #G 200 gold#! and become a vassal of [SCOPE.sCountry('zaraken_yamhad_sender').GetName|Y]. We retain #G Gurhak#! and our other holds."
 03_zaraken_yamhad_decline_tt:0 "Keep our lands and our independence. The Zarakens keep their silver and gain #Y $zaraken_toll_grievance_mod$#! for #Y 5 years#!."
 03_zaraken_yamhad_accepted_tt:0 "Yamhad becomes our vassal and retains #G Gurhak#!. If we hold #G Avestan#!, its market gains #Y $zaraken_toll_ledger_mod$#! for #Y 10 years#!."
 03_zaraken_yamhad_declined_tt:0 "Yamhad keeps #G Gurhak#!. We have paid no gold and gain #Y $zaraken_toll_grievance_mod$#! for #Y 5 years#!."
 me_zaraken.137.t:0 "Silver for the Watch"
 me_zaraken.137.desc:0 "The herald from [SCOPE.sCountry('zaraken_yamhad_sender').GetName|Y] put a tally before [ROOT.GetCountry.GetRuler.GetName|Y] and asked what it had cost to keep the gate through winter. His master offers silver for the watch and men to defend the road, if we swear to his crown and agree what the clerks may charge the wagons. We would keep our court at Gurhak and collect the toll ourselves.\n\nThe gate captain has asked for a copy of the terms before any oath is sworn. He says the silver would pay the men who stood the last watch and let him bring the others back before the roads close. The toll clerk asks that what a wagon owes be written where the men who come after him can read it."
 me_zaraken.137.a:0 "Take the silver and swear for the protection of the holds."
 me_zaraken.137.b:0 "Return the tally. The toll house stays with us."
 me_zaraken.138.t:0 "One Toll for the Road"
 me_zaraken.138.desc:0 "The toll clerk at #G Gurhak#! took the old table of charges down from the gate and hung the agreed account in its place. The watch stayed at its post, and when the first wagon came through, its driver held up a receipt from #G Avestan#!. The clerk read it by the gate lamp and took only what was still owed.\n\nThe merchant-king has sworn for the holds and kept the keys to his gate. The clerks at Avestan ask for a copy of the new account, so they can tell the wagoners what they owe before they set out."
 me_zaraken.138.a:0 "Send Avestan a copy under both seals."
 me_zaraken.139.t:0 "The Toll Still Stands"
 me_zaraken.139.desc:0 "The herald has come home with the tally for the silver still folded in his purse. The merchant-king gave it back before the treasurer had finished counting, and at the gate the clerk asked the herald to pay for the shoes on his escort's horses. He paid and brought the receipt to #G Avestan#!.\n\nThe captain has asked for a copy of the receipt with the time of day written beside it. While the wagoners argue over who will pay on the next crossing, he means to find out when the watch at Gurhak changes."
 me_zaraken.139.a:0 "Let the captain have his copy."
 me_zaraken.150.t:0 "Silver from the Gurhak Tolls"
 me_zaraken.150.desc:0 "The envoy from #G Gurhak#! set a toll chest beside [ROOT.GetCountry.GetRuler.GetName|Y]'s seat and lifted the lid far enough for the men nearest him to see the silver. [SCOPE.sCountry('zaraken_steppe_patron').GetRuler.GetName|Y] has set it aside for riders who can reach the eastern crossing before the Zaraken cavalry can turn back to meet them. The envoy once weighed the traders' loads at Gurhak himself, and he can tell the chief how many wagons used to pass the toll house before the Zarakens came up the road.\n\nThe chief's riders know the crossings, and one of them asks what happens if Gurhak falls before they reach the first Zaraken watch. The envoy answers that the silver is paid when they enter the merchant-king's war, and that his master will ask nothing more of them once the terms of peace are read."
 me_zaraken.150.a:0 "Put our mark beside the merchant-king's."
 me_zaraken.150.b:0 "Take your chest home. Our riders stay here."
 03_zaraken_steppe_contract_tt:0 "Agree to join Yamhad's defensive war against Zaraken if called within #Y five years#!. Receive #Y 100 gold#! from Yamhad when we enter the war."
 me_zaraken.151.t:0 "A Mark Beside Ours"
 me_zaraken.151.desc:0 "The envoy brought back the same toll chest with a strip of hide tied around its handle. [SCOPE.sCountry('zaraken_steppe_reply_ruler_country').GetRuler.GetName|Y] had made a mark on it in front of the riders, and the man who carried it to us said each company had named the crossing by which it would come.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] has the chief's word. The treasurer asks to keep the chest by the gate until the riders enter the war, since he promised the men on the wall they would see where the toll silver went."
 me_zaraken.151.a:0 "Keep the chief's mark with the toll receipts."
 me_zaraken.152.t:0 "The Chest Comes Back"
 me_zaraken.152.desc:0 "The envoy set the chest on the counting table and showed [ROOT.GetCountry.GetRuler.GetName|Y] that the cord was still whole. [SCOPE.sCountry('zaraken_steppe_reply_ruler_country').GetRuler.GetName|Y] had heard the offer and sent for the men who knew the eastern crossings. They heard what the toll silver would buy and went back to their horses.\n\nThe envoy asks the treasurer to leave the chest where it is. If another chief will hear him, he can still carry it out before the next watch takes the gate."
 me_zaraken.152.a:0 "Leave the chest with the treasurer."
 me_zaraken.153.t:0 "Riders at the Eastern Crossing"
 me_zaraken.153.desc:0 "A watchman came in from the east with the name of [SCOPE.sCountry('zaraken_steppe_contractor').GetRuler.GetName|Y] and the mark the chief's men have put on their orders. They crossed under their own banner. At the last ford, a trader heard them ask which road the Zaraken cavalry had taken before it went to Gurhak.\n\nThe merchant-king's silver has reached the riders. The marshal asks [ROOT.GetCountry.GetRuler.GetName|Y] which road the relief should take now, since the men sent east will be the same men he had meant to put before the gates of Gurhak."
 me_zaraken.153.a:0 "Send the marshal the watchman's report."
