l_english:
 03_zaraken:0 "The Crown of Kyaxares"
 03_zaraken_DESCRIPTION:0 "The #T Great Zinduidian Revolt#! began in #Y 934 LC#!, and by #Y 946 LC#! the rebels had taken #G Kyaxares#!. Most of the House of Zakara were killed, although the rebels left the grave of #Y Jaoz the Bold#! untouched in its small temple, and the Zarakens have kept it ever since. The coalition had agreed on whom to drive out, which proved rather easier than agreeing on who should rule in their place. After many bloody battles, the Zarakens took Kyaxares back in #Y 952 LC#!, but by then, many of their formal vassals had tasted freedom for the first time and refused to submit to their rule.\n\The current ruler, [ROOT.GetCountry.GetRuler.GetName|Y], has vowed to reassert the authority of the #Y Zarakens#! and raise the banner of the#Y Neo-Zaraken Empire#!. This will not be easy, however, for the princes of the #G Golden Foothills#! have had nearly half a century to grow accustomed to giving orders in their own names, and many will fight to preserve their independence."
 03_zaraken_CRITERIA_DESCRIPTION:0 "Bring all five districts of the #G Golden Foothills#! under direct or subject rule. Develop the cities of #G Kashan#! and #G Zakaria#!, establish the imperial archives and garrisons, and raise #G Kyaxares#! to a metropolis. Then choose whether the crown rests on the grave of #Y Jaoz#! or on the older crown of the Zaraken kings, and crown the #Y Neo-Zaraken Empire#! at Kyaxares."
 03_zaraken_BUTTON_TOOLTIP:0 "Reunite the Golden Foothills and restore the Zaraken Empire."
 03_zaraken_BUTTON_DETAILS:0 ""
 03_zaraken_task_1:0 "The Captains At The Gate"
 03_zaraken_task_1_DESC:0 "The royal families have brought their household retinues to #G Kyaxares#! to seek commissions from the [ROOT.GetCountry.GetRulerTitle|T], and every house has sent its sons along in case the commissions are handed out by name. Call up the levy and set aside its pay, then have the clerks at the eastern gate enter each company on the crown's roll."
 03_zaraken_task_2:0 "Heralds Into Kashan"
 03_zaraken_task_2_DESC:0 "The newly mustered captains must escort heralds to the rival princes of #G Kashan#! informing them of the crown's intentions. Give the envoys time to seek the surrender of the garrisons while the roads are still open in peacetime. Their reports will tell us where we can bargain and where we will have to march."
 03_zaraken_task_3:0 "Kashan Under One Banner"
 03_zaraken_task_3_DESC:0 "[ROOT.GetCountry.GetRuler.GetName|Y] has brought all of #G Kashan#! under our command and has stocked #G Farheng#! with the supplies needed for further attacks against the enemy. The princes at #G Kokihmobpod#! and #G Kobnudac#! have spent too long charging both banks of the ford for the same crossing. Their garrisons must answer to Kyaxares, whether we take the posts ourselves or their rulers swear to hold them under our seal."
 03_zaraken_task_4:0 "Elika's Fishing Landings"
 03_zaraken_task_4_DESC:0 "The boats at #G Elika#! used to land their catch wherever the bank held firm. Now that #G Kashan#! has a common store at #G Farheng#!, there is a market for fish beyond the crossing. Raise Elika to a city so it can build proper landings and keep the catch in salt when the road floods."
 03_zaraken_task_5:0 "Hire Razani Architects"
 03_zaraken_task_5_DESC:0 "There are four cities, #G Kyaxares#!, #G Kassandane#!, #G Mihrab#!, and #G Avestan#!, that are the seat of our power. While our engineers are not skilled in the art of road building, the Razani have been laying roads for generations and are willing to sell their expertise for coin. We must hire them to survey and lay a road connecting the four cities, so that our armies of soldiers and merchants can move quickly between them."
 03_zaraken_task_25:0 "Learn The Razani Way"
 03_zaraken_task_25_DESC:0 "The foremen at #G Avestan#! have been watching the #Y Razani#! crews set their stones, and they want to know how the surveyors carried the road across the slope without losing a wagon to the first rain. Pay the architects to stay and teach our crews how to survey and lay a road of their own."
 03_zaraken_task_6:0 "The Command At Avestan"
 03_zaraken_task_6_DESC:0 "The new road brings wagons as far as #G Avestan#!, and the captains of #G Shizar#! now ride in on it to see what the crown means to do with them. Build a Training Camp at Avestan, and govern the district well enough that its captains come to the command when they are summoned rather than sending their nephews with apologies."
 03_zaraken_task_7:0 "Remounts of Zarqan"
 03_zaraken_task_7_DESC:0 "The officers at #G Avestan#! need a reliable place to change horses on the eastern road, but the yardkeepers at #G Shava#! cannot lend a fresh mount they do not have. Take Shava into direct rule and fill its yards, either by buying horses from abroad or by breeding enough at #G Haxamanish#! that the herdsmen can spare a string for the crown."
 03_zaraken_task_8:0 "The Watchfires Of Hajar"
 03_zaraken_task_8_DESC:0 "The supply yards in #G Zakaria#! can now feed the watch beyond the ridge, and the old towers above #G Kashmar#! still stand, although their fires have been dark since the last captain took his pay and went home. Bring #G Hajar#! under our command, take Kashmar into the crown's own hands, and raise enough light horse to answer a signal before the raiders reach the next valley. They know the gaps between the towers. Be ready to pursue them or hold the crossings when the first fire goes up."
 03_zaraken_task_9:0 "The Council Of The Foothills"
 03_zaraken_task_9_DESC:0 "The garrisons of #G Kashan#! now answer to the crown, and the companies can muster at #G Mihrab#!, but the princes of the Foothills have spent half a century obeying seals they never saw pressed. Seat the great families at a permanent Court of Law in #G Kyaxares#!, where one council can issue the orders, and let the [ROOT.GetCountry.GetRulerTitle|T] carry its charters out to the districts in person, so that every prince can watch the seal go down in his own hall."
 03_zaraken_task_10:0 "Projecting Strength"
 03_zaraken_task_10_DESC:0 "The heralds bound for #G Zakaria#! and #G Hajar#! need an escort led by a captain who has fought on the crossing roads before, and the levy must stay home and rested in case a prince answers the claims with a raid. Keep most of our manpower in reserve and find the heralds a general who knows the country."
 03_zaraken_task_11:0 "Water For The Wagon Teams"
 03_zaraken_task_11_DESC:0 "The time has come to secure #G Zakaria#! by provisioning the yards at #G Orasmyn#! and #G Quhyar#!. Mounted men can cover the road in a day, but baggage wagons need a place to water their teams and make camp before the last watch. The grain of Orasmyn has to stay in Zakaria to feed them, so the fields must answer to the crown directly."
 03_zaraken_task_12:0 "The Iron Gate"
 03_zaraken_task_12_DESC:0 "We should put a fort and training camp at #G Inar#! and assign men from the levy to hold them. The plan is perfect; the smiths can fit the mounts while the captains drill the levies, and these warriors will be the region's first line of defense should anything happen. When our soldiers have finished drilling in formation, then and only then will the old horn of the #T Kaxhamid#! knights be taken down from the wall."
 03_zaraken_task_13:0 "The Oaths Before Jaoz"
 03_zaraken_task_13_DESC:0 "The pilgrims of #Y Jaoz#! already gather at his holy site in #G Kyaxares#! before taking the road to #G Makox#!. Raise a Temple there where the captains can receive their standards and swear before the pilgrims to keep the road open."
 03_zaraken_task_14:0 "Companies At The Waterline"
 03_zaraken_task_14_DESC:0 "The captains who swore at #G Kyaxares#! need somewhere to muster by water. #G Mihrab#! has three ports already. Build a Market beside the quay and assemble a fleet so a company can take on stores and sail without waiting for a merchant to finish unloading."
 03_zaraken_task_15:0 "The Assembly of Five Districts"
 03_zaraken_task_15_DESC:0 "When all five districts of the #G Golden Foothills#! answer to the crown and the fighting has ended, call their delegates to #G Kyaxares#!. Give them quarters while their captains agree where to muster and whose orders they will take on the march. The houses remember how we granted commissions at the first muster, and they will expect an answer when command comes up again. The delegates will not come to a ruler they have never seen in their own halls, so the [ROOT.GetCountry.GetRulerTitle|T] must have ridden the bounds at least once."
 03_zaraken_task_16:0 "The Imperial Archives"
 03_zaraken_task_16_DESC:0 "One captain's map still marks a ford that has been dry for years, and another has drawn the road beyond it from memory. Give the court at #G Kyaxares#! a library for the campaign maps, signal books, and orders the five districts will need to ride together, and put a keeper in office who can tell which map is lying."
 03_zaraken_task_17:0 "The Imperial Garrisons"
 03_zaraken_task_17_DESC:0 "Raise the walls at #G Inar#! a second time and keep the fort at #G Elika#! ready. Train the #Y Kaxham Guards#! and put a trusted marshal in charge so the two garrisons can drill their reliefs to the same signals. The guards will not take drill seriously until they have heard the horn sounded in a real war."
 03_zaraken_task_18:0 "The Crown of Five Districts"
 03_zaraken_task_18_DESC:0 "The heralds are waiting at #G Kyaxares#!, and the delegates of the five districts have already taken lodgings in the new quarters. Raise the capital to a metropolis and keep the districts at peace, but remember that the princes will judge the crown by the ruler who wears it. When the House of [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective|T] has ruled long enough and well enough that the crowd in the square cheers before the herald has finished reading the title, crown the #Y Neo-Zaraken Empire#! and send its standard out under escort. The princes will also want to have seen the ruler in their halls more than once before they kneel to the crown in Kyaxares."
 zaraken_elika_fishing_mod:0 "Elika Fishing Landings"
 zaraken_avestan_toll_rolls_mod:0 "Avestan Toll Rolls"
 desc_zaraken_avestan_toll_rolls_mod:0 "The crown keeps a common toll roll for the two markets at Avestan."
 desc_zaraken_elika_fishing_mod:0 "Raised landings, salting racks, and storehouses keep the catch coming in when the road floods."
 zaraken_elika_watch_mod:0 "The Watch at Elika"
 desc_zaraken_elika_watch_mod:0 "The quartermaster keeps grain inside the fort so the patrols can ride even when rain cuts the road."
 zaraken_inar_watch_mod:0 "The Iron Gate"
 desc_zaraken_inar_watch_mod:0 "The riders drill within reach of the forges, where the smiths keep an account of the iron issued to the watch."
 zaraken_wine_court_mod:0 "The Wine Court"
 desc_zaraken_wine_court_mod:0 "The wine sellers have a covered yard where they can put their jars before the boats come alongside."
 zaraken_common_reckoning_mod:0 "Council of the Foothills"
 desc_zaraken_common_reckoning_mod:0 "The commanders gather at Kyaxares to decide where the watches answer and where companies muster."
 zaraken_shrine_register_mod:0 "The Oath at Jaoz"
 desc_zaraken_shrine_register_mod:0 "The captains receive their standards at the shrine, where pilgrims can see who has sworn to keep the roads."
 zaraken_royal_warrant_mod:0 "Royal Market Warrant"
 desc_zaraken_royal_warrant_mod:0 "The crown has called on the local yards to provision and equip the companies passing through."
 zaraken_open_road_mod:0 "The Open Road Settlement"
 desc_zaraken_open_road_mod:0 "The watches keep the road open between the markets and send riders ahead when the crossings are unsafe."
 zaraken_guarded_road_mod:0 "The Pilgrimage Settlement"
 desc_zaraken_guarded_road_mod:0 "The captains keep sworn duties at the watches, where a pilgrim can ask for shelter and learn where the next escort takes over."
 me_zaraken.1.t:0 "Favors for the Royal Houses"
 me_zaraken.1.desc:0 "The clerks at the eastern gate of #G Kyaxares#! were entering the last company on the crown's pay roll when an old prince brought his nephew before the [ROOT.GetCountry.GetRulerTitle|T]. He asked that the young man serve under a captain who had brought a company through a winter campaign, for there were plenty of men at home who would salute the boy and few who would correct him. When [ROOT.GetCountry.GetRuler.GetName|Y] granted the request, two other houses sent in their sons, both of whom had come to the city expecting commands of their own.\n\nThe veterans ask for commissions from the crown, since a captain who owes his post to one house will have a hard time disciplining the men of another. The princes say there are more riders to be had at home, if their sons can promise to lead them. The keepers of #Y Jaoz#! have offered to bless the standards where the whole muster can see, so that every house can go home knowing its banner was received and none need claim the place of honor at another's expense."
 me_zaraken.1.a:0 "Give the commands to veterans of the crown."
 me_zaraken.1.b:0 "Let the princes lead the men they bring."
 me_zaraken.1.c:0 "Bless the standards before all the houses."
 me_zaraken.2.t:0 "The Assembly of Five Districts"
 me_zaraken.2.desc:0 "At the door of the assembly hall in #G Kyaxares#!, a delegate from #G Shizar#! recognized the captain whose riders he once barred from the road, and held the door for him while their guards borrowed a bench from the porter. By the time the last district was seated, the guards were at dice, and the two men inside had agreed on everything except which of them would give the order to march.\n\nAll five districts have agreed to answer a common summons, and an officer from #G Elika#! proposes that each furnish the commander in turn, so no prince need go home and tell his captains that their district has lost the right to lead. It is a bargain every delegation can defend at home, though the men who came expecting the first command are still in the hall, and each has brought a different account of whose riders reached the last muster first."
 me_zaraken.2.a:0 "Let the districts take turns commanding the muster."
 me_zaraken.3.t:0 "The Crown at Kyaxares"
 me_zaraken.3.desc:0 "When the herald read out the title of the #Y Neo-Zaraken Empire#! at the muster in #G Kyaxares#!, the captains of all five districts stood beneath the same standard, though their companies had come in under the banners of their own houses. The old prince who brought his nephew to our first audience has asked that the young man carry the standard out through the western gate, and the captain he once served under has offered to ride in his escort.\n\nThe archive keeper has filed the imperial orders beside the first muster rolls, while copies have gone to #G Elika#! and #G Inar#! so the watches will know whom to send when the standard comes into sight. Each district will meet it under its own banner. By the time the escort reaches the last crossing, the men on the road will have had occasion to see how much a title read aloud in Kyaxares is worth at a gate after dark."
 me_zaraken.3.a:0 "Send the imperial standard out to the districts."
 03_zaraken_escort_iron_tt:0 "Have a surplus of at least #Y 2#! @iron! Iron in the state of #G Inar#! to arm the arsenal."
 zaraken_kashan_grain_rolls_mod:0 "Forward Stores at Farheng"
 desc_zaraken_kashan_grain_rolls_mod:0 "The storekeepers at Farheng lay in grain for the companies crossing Kashan."
 zaraken_spice_exchange_mod:0 "Kyaxares Spice Exchange"
 desc_zaraken_spice_exchange_mod:0 "The weighers keep a public tally at the scales, where a buyer can settle for a load before the sacks are sewn shut."
 zaraken_seal_chancery_mod:0 "Chancery of the First Seal"
 desc_zaraken_seal_chancery_mod:0 "Apprentices learn the crown's seal beside the market, where the clerks prepare warrants for the companies setting out."
 zaraken_zakaria_caravan_posts_mod:0 "Provision Yards of Zakaria"
 desc_zaraken_zakaria_caravan_posts_mod:0 "The yards keep fodder at a posted price and leave room inside for the carts that miss the last watch."
 zaraken_mihrab_customs_mod:0 "Sealed Customs of Mihrab"
 desc_zaraken_mihrab_customs_mod:0 "The port clerk keeps the wine sheds open until the last boat is loaded."
 zaraken_chartered_market_mod:0 "Chartered Royal Market"
 desc_zaraken_chartered_market_mod:0 "Carriers can reserve space for their loads before they send for a cart."
 zaraken_makox_hospices_mod:0 "Hospices of the Pilgrim Road"
 desc_zaraken_makox_hospices_mod:0 "The Keepers of the Tomb put aside grain and beds for the companies and pass word ahead when a traveler has fallen behind."
 zaraken_pilgrim_escort_mod:0 "The Inar Escort"
 desc_zaraken_pilgrim_escort_mod:0 "The riders muster at Inar, where the smiths keep iron for a shoe that comes loose on the road."
 zaraken_merchant_advance_mod:0 "Advance of the Market Guilds"
 desc_zaraken_merchant_advance_mod:0 "The guilds have put silver down for new stalls and sent their factors ahead to make the first purchases."
 zaraken_pilgrim_muster_mod:0 "Muster for the Makox Road"
 desc_zaraken_pilgrim_muster_mod:0 "The captains have leave to call in riders and ready their mounts for the watches beyond Inar."
 zaraken_keepers_itinerary_mod:0 "The Keepers' Itinerary"
 desc_zaraken_keepers_itinerary_mod:0 "The Keepers of the Tomb read out where each escort changes and which captain owes the company a place to sleep."
 zaraken_shizar_register_mod:0 "Northern Command at Avestan"
 desc_zaraken_shizar_register_mod:0 "The captains of Shizar keep a common watch from Avestan, where riders from Kyaxares can find them."
 zaraken_zarqan_remounts_mod:0 "Remount Yards of Zarqan"
 desc_zaraken_zarqan_remounts_mod:0 "The yardmen keep fodder and fresh horses at Shava, and a messenger leaves his name when he changes mounts."
 zaraken_hajar_watch_mod:0 "Watchfires of Hajar"
 desc_zaraken_hajar_watch_mod:0 "The watch at Kashmar keeps the fire and sends a rider when the next tower fails to answer."
 zaraken_mihrab_muster_quay_mod:0 "The Muster Quay"
 desc_zaraken_mihrab_muster_quay_mod:0 "The harbor clerk marks the men and stores as they come ashore, while the boats still have room at the quay."
 zaraken_imperial_archives_mod:0 "Imperial Archives"
 desc_zaraken_imperial_archives_mod:0 "Campaign maps and signal books are kept together so the captains can plan a muster from the same orders."
 zaraken_imperial_garrison_mod:0 "The Crown's Garrisons"
 desc_zaraken_imperial_garrison_mod:0 "The watches drill for the same signals and draw their equipment from stores laid in for the whole frontier."
 zaraken_imperial_restoration_mod:0 "The Crown of Five Districts"
 desc_zaraken_imperial_restoration_mod:0 "The five districts keep their own standards and answer the imperial summons together."
 zaraken_seat_of_the_empire_mod:0 "Seat of the Neo-Zaraken Empire"
 desc_zaraken_seat_of_the_empire_mod:0 "The heralds read the crown's orders at Kyaxares, and the delegates know which door to use when they come to answer them."
 me_zaraken.102.t:0 "The Keys of Kashan"
 me_zaraken.102.desc:0 "Our scouts rode into #G Kashan#! with a drover who kept his toll receipts in his boot, and at one ford he took out two, one for the captain on either bank. Both captains claimed the right to stop travelers, and each sent a man into the shallows to warn our scouts against paying the other. The drover waited until they were out of earshot before he said what it had cost him to get his herd across.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] means to recover the district, and our heralds ask what they are to offer where a prince is willing to bargain. If the lord of Farheng will take silver for his post, his garrison can march out with its arms, while the princes who keep their posts may swear to us and put their garrisons on our pay rolls. Our captains would send the summons with the siege train already on the road, so that any prince who refuses can see how long he has to lay in grain."
 me_zaraken.102.desc_held:0 "When our scouts crossed #G Kashan#!, they found every garrison answering to the crown or to one of our subjects, though at the ford two captains still stood on opposite banks and called for the party to halt. Each had orders to keep the crossing, and the men wading out to question the scouts learned they were serving the same crown when they compared the seals on their orders.\n\nThe heralds can ride home with the princes' acknowledgments, but first they ask for leave to settle the watch, since the villages have long been feeding men on both banks while the road beyond the ford goes unpatrolled. One captain can keep the crossing and the other can take the road, if each has a copy of the orders the other will receive."
 me_zaraken.102.a:0 "Pay for Farheng and let its garrison march out."
 me_zaraken.102.b:0 "Send the summons and ready the siege train."
 me_zaraken.102.c:0 "Offer the princes our protection and put their men on our pay rolls."
 me_zaraken.102.d:0 "Give the garrisons orders to patrol together."
 zaraken_kashan_siege_train_mod:0 "Siege Train for Kashan"
 desc_zaraken_kashan_siege_train_mod:0 "The captains have called in carpenters and put the teams for the siege train on the road behind the heralds."
 me_zaraken.103.t:0 "$03_zaraken_task_3$"
 me_zaraken.103.desc:0 "The first baggage train to cross #G Kashan#! under the crown's orders reached #G Farheng#! with two empty wagons, which the quartermaster had brought in case he had to send back to Kyaxares for grain as he had on his last march. This time he filled them from the stores at Farheng, and by noon the drivers were on the road again, with a receipt for their grain that bore the same seal as their marching orders.\n\nThe keeper of the stores asks how much grain he should hold back when the merchants come to buy after harvest. If he keeps a company's issue under seal and a few wagons fit to travel, a captain marching through can draw his provisions there, and a watch cut off from the capital can send to Farheng before it starts taking grain from the villages."
 me_zaraken.103.a:0 "Keep forward stores at Farheng"
 me_zaraken.104.t:0 "$03_zaraken_task_4$"
 me_zaraken.104.desc:0 "#G Elika#! is a city devoted to fishing. It has a common landing for the boats that is five Eagelian miles long, and merchants from many cities have built their storehouses close to the harbor district in hopes of being the first to bid on the hauls that come in. There is a great deal of salt that passes through our markets as well, for preserving the catch is a necessary part of the trade. The crown has recently taken the management of the landing into its own hands, and the keepers of the stores only ask that we keep the waters clear and their salt stores full."
 me_zaraken.104.a:0 "I will keep cargoes moving through Elika, do not worry"
 me_zaraken.105.t:0 "The Road to Avestan"
 me_zaraken.105.desc:0 "The #Y Razani#! foreman rode with the first convoy out of #G Kyaxares#! to inspect the road his crews had laid. At #G Kassandane#!, the carters took on grain while the escort watered its horses. At #G Mihrab#!, the market clerk asked how many wagons would come the following week, so he could clear a yard for them. The convoy reached #G Avestan#! with the capital's dispatches still in the lead wagon. The officer at the gate entered its arrival beside the time the carters had given him before setting out.\n\nAt Avestan the paving ends. A guide offers to take a herald north to the princes of #G Shizar#!, where the captains keep the passes. The western merchants can show another herald where the road tolls change hands, and which lords claim the villages beyond them."
 me_zaraken.105.a:0 "Send a herald and a guide into each district"
 me_zaraken.125.t:0 "The Surveyor's Line"
 me_zaraken.125.desc:0 "On the slope above #G Avestan#!, a foreman waited for the rain before taking a loaded wagon over the stretch of road a #Y Razani#! surveyor had made him lay twice. The first time, his men had set the stones level, and the wheels had sunk into ruts that filled in the first rain, but now the water ran off the raised center into a ditch, and the wagon came down the hill without a wheel leaving the stones.\n\nThe architects have taken their pay and left their measuring rods with the men they taught, who have already been asked what it would take to lay stone on the roads beyond Avestan. The foreman asks to send surveyors out with the companies that use those roads, so that when a captain has men to spare, the stakes will already be in the ground."
 me_zaraken.125.a:0 "Send the surveyors out with our companies"
 me_zaraken.106.t:0 "$03_zaraken_task_6$"
 me_zaraken.106.desc:0 "When the captains of #G Shizar#! came to the new camp at #G Avestan#!, each brought the names of men who had kept the watch in his valley, and each expected to go home with orders for the road he knew - something that [ROOT.GetCountry.GetRuler.GetName|G] was happy to grant them, but only if they agreed to personally furnish the companies at their own expense. Their men might know the mountain slopes and the places where a wagon can get off the road, but the captains would have to take their orders at Avestan. These terms proved acceptable, and all parties left the meeting satisfied by its outcome."
 me_zaraken.106.a:0 "The Zarakens rule supreme in Shizar, and the princes will answer to me!"
 me_zaraken.107.t:0 "$03_zaraken_task_7$"
 me_zaraken.107.desc:0 "A messenger from Avestan came into #G Shava#! on foot, leading a horse that had gone lame and expecting to wait while the yardkeeper sent to his lord for leave to lend another. The keeper saw the seal on the dispatch and fetched a fresh mount from the crown's string, and by the time the boy who took the lame horse had rubbed it down, the messenger was already beyond the last houses.\n\nThe horse breeders of #G Zarqan#! are willing to keep mounts in the yard for the crown, and the keeper can furnish guides who know which wells still hold water in the dry months. He asks that each rider leave word at the next yard, since a mare that fails to come home may have been ridden past her station, and he would rather send a boy after her than charge the breeder for a horse still in our service."
 me_zaraken.107.a:0 "Keep fresh horses and guides at Shava"
 me_zaraken.108.t:0 "$03_zaraken_task_8$"
 me_zaraken.108.desc:0 "The watch at #G Kashmar#! lit its first fire at dusk, and before the next tower had answered, a shepherd came down from the ridge to say the raiders were already between them. They had taken horses from the outlying farms and were driving the stock ahead of them, though the shepherd reckoned they would still be in #G Hajar#! at sunrise, for the raiders would have to take the animals by the low crossings.\n\nWith fresh horses from #G Zarqan#! or a drilled relief from #G Inar#!, the captain could ride before dawn without calling out so much of the levy. If we hold the crossings instead, the yards in #G Zakaria#! can save us much of the cost of feeding the men there, provided they are ready. The captain can also bring the families in under Kashmar's walls, though one farmer has already asked whether there will be anyone left to keep the raiders from his winter stores."
 me_zaraken.108.a:0 "Send the men we have ready before dawn"
 me_zaraken.109.t:0 "$03_zaraken_task_9$"
 me_zaraken.109.desc:0 "At the first sitting of the Court of Law in #G Kyaxares#!, a merchant set two receipts on the table for the grain he had furnished to a single watch. One bore a captain's mark and the other a prince's seal, and each man claimed the other had undertaken to pay. The heads of the great houses had come to hear how the watches would take their orders, and the merchant stayed to hear whose seal he should ask for next time.\n\nThe council will keep a record of its orders to the captains, but the eldest of the princes says a record kept at Kyaxares is only paper in #G Hajar#!. He proposes that the [ROOT.GetCountry.GetRulerTitle|T] ride the bounds of each district from time to time, holding court in its hall and sealing its charters in front of its captains. The other heads of family agree readily, and the clerks have noticed that each of them has already asked who will keep the council while the ruler is away."
 me_zaraken.109.a:0 "Keep the orders here, and ready the ruler's horse"
 me_zaraken.110.t:0 "$03_zaraken_task_10$"
 me_zaraken.110.desc:0 "The [ROOT.GetCountry.GetAdjective] heralds bound for #G Zakaria#! and #G Hajar#! halted in a dry streambed while their scouts searched the roads ahead for any signs of ill intentions. On the main road, the watch could have counted every rider well before we reached the gate, but by the time the enemy guards saw our party on the slope, our herald was close enough to call out the name of the lord he had come to warn.\n\n'Your lands are hereby claimed by the armies of the [ROOT.GetCountry.GetName|G]...' The enemy soldiers listened to the crown's claims and eventually sent a boy up to the hall with a copy of our demands, and even though they were itching for a fight, they allowed our diplomats to leave peacefully."
 me_zaraken.110.a:0 "The next time our heralds ride, they will escort our armies!"
 me_zaraken.111.t:0 "$03_zaraken_task_11$"
 me_zaraken.111.desc:0 "Before #G Zakaria#! came under our protection, a captain who reached the district after dark had to leave men with the baggage while the rest of his company rode on. This time the wagoners found the gate at #G Orasmyn#! open and fodder waiting in the yard, while a man from #G Quhyar#! was there to count the teams he should expect at the other end. By the time the last wagon was under cover, the whole escort had ridden out with the captain.\n\nThe quartermasters ask for the next line of march before they bargain for more grain, since the two yards can feed a train in either direction, provided the keepers know where to lay in the greater share. The captain who takes the road ahead of his wagons would like to know at which yard he can send back for them."
 me_zaraken.111.a:0 "Put both yards on the army's supply route"
 me_zaraken.112.t:0 "$03_zaraken_task_12$"
 me_zaraken.112.desc:0 "When the horn sounded in the field below #G Inar#!, the riders nearest the wall were halfway to the far ditch before the last horses had moved. An old knight of the #Y Kaxhamids#! called them back and asked the horn bearer to stand where both companies could hear him. His family still names the man who rode with #Y Eszarakayn#!, when horsemen from the clans and the towns swore to serve the first Shahanshah. In those days the companies mustered from different households, and the knights taught them to ride to the same call. The old man learned it from his father, whose own captain still called it the #Y Kaxhamid Charge#! long after the empire fell.\n\nBy the last pass the companies crossed the field together, and the captain asked to keep the heavy horse at Inar through the winter. One company can ride the watch while the other drills below the walls, and the smiths have offered to keep spare shoes for both. The knight asks to hear the horn again tomorrow. He wants every rider to know its call by the time the companies hear it in war."
 me_zaraken.112.a:0 "Keep the heavy horse at Inar and teach them the charge."
 me_zaraken.113.t:0 "$03_zaraken_task_13$"
 me_zaraken.113.desc:0 "On the morning the captains came to receive their standards at #G Kyaxares#!, the #Y Keepers of the Tomb#! set a writing table on the steps above the grave of #T Jaoz the Bold#!. In the square below, bread sellers called to the pilgrims gathering for #G Makox#!. A traveler waiting with his children recognized the badge of the watch that had turned them away after dark on their last journey. He asked the captain where they were to sleep if they found the same tower shut again.\n\nThe captain named the watchman who held the key and told the traveler what to call out from the road. A Keeper wrote the watchman's name beside the captain's in the register. The Keepers ask that each company swear on these steps to shelter travelers along its stretch of the road. If a family comes back to the grave with a complaint, the Keeper can open the book and send for the man who gave his word."
 me_zaraken.113.a:0 "Let the captains swear where the pilgrims can hear them"
 me_zaraken.114.t:0 "$03_zaraken_task_14$"
 me_zaraken.114.desc:0 "The first boats at the muster quay of #G Mihrab#! took on grain from the new market while the captain was still calling his roll, and when he brought his company down, the stevedores were already pulling the last sack aboard. The harbor master remembers a muster when the same men stood on the quay until dark, arguing with a wine seller over whose cargo had been promised the next boat.\n\nHe asks for a runner from the muster ground whenever the crown means to move men by water, since a boat can be brought alongside and provisioned while the companies are still counting their men. If the captains send him word before the tide turns, he can tell the merchants when they will have the berth back, and the wine sellers can put their jars out under cover until then."
 me_zaraken.114.a:0 "Keep the quay ready for the next muster"
 me_zaraken.116.t:0 "$03_zaraken_task_16$"
 me_zaraken.116.desc:0 "The first maps unrolled in the new library at #G Kyaxares#! showed a bridge and a ford at the same bend in the river, and each captain could name a man who had crossed where his map said he could. The keeper sent for a scout who had come that way in the morning. He remembered the bridge and had used the ford, though since the last flood a loaded wagon had to go two miles upstream.\n\nThe copyists will make a set of campaign maps for each district and keep the originals at court, where a scout can have a crossing corrected before another company rides out to look for it. The keeper asks to send the watch signals with the maps, since a captain who finds his way to a tower after dark still has to persuade the men on the wall to let him in."
 me_zaraken.116.a:0 "Send each district a copy of the maps and signals"
 me_zaraken.117.t:0 "$03_zaraken_task_17$"
 me_zaraken.117.desc:0 "When the marshal brought the reliefs from #G Elika#! and #G Inar#! together, he sent an officer ahead to raise the agreed flag at the crossing, choosing a man one of the companies had never served under. The smiths were still gathering up the old fittings when the flag went up, and the relief was on the right road before the runner who had carried the signal book could catch his breath.\n\nThe captains will take their companies home under their own banners, though each now knows which road the other will take if the watch calls for help. The marshal asks to keep both forts drilling to the same signals, so that what the delegates settled in Kyaxares can be carried out by the next men on the walls, even if they have never set eyes on one another."
 me_zaraken.117.a:0 "Have both forts drill to the same signals"
 03_zaraken_formation_completed_tt:0 "Formed the #Y Neo-Zaraken Empire#!. The formation grants #G 4#! additional free province investments and claims on lands in #G Western Karksm#! and #G Eastern Karksm#! that we or our subjects do not already hold."
 zaraken_gatehouse_rolls_mod:0 "Muster at the Eastern Gate"
 desc_zaraken_gatehouse_rolls_mod:0 "The captains muster their companies at the eastern gate, where the crown can call each one by name."
 03_zaraken_kashan_claims_tt:0 "Gain claims on any territories in #G Kashan#! outside our direct or subject rule."
 03_zaraken_western_claims_tt:0 "Gain claims on any territories in #G Shizar#! and #G Zarqan#! outside our direct or subject rule."
 03_zaraken_eastern_claims_tt:0 "Gain claims on any territories in #G Zakaria#! and #G Hajar#! outside our direct or subject rule."
 zaraken_five_districts_accord_mod:0 "Accord of the Five Districts"
 desc_zaraken_five_districts_accord_mod:0 "The princes have agreed where their companies will muster and whose orders they will take when they ride together."
 03_zaraken_investments_1_tt:0 "Gain #G 1#! free province investment."
 03_zaraken_investments_2_tt:0 "Gain #G 2#! free province investments."
 03_zaraken_investments_3_tt:0 "Gain #G 3#! free province investments."
 zaraken_crown_captains_mod:0 "Captains of the Crown"
 desc_zaraken_crown_captains_mod:0 "The crown's captains drill the household companies together and send veterans to bring new men up to the muster."
 zaraken_blessed_standards_mod:0 "Blessing of the Standards"
 desc_zaraken_blessed_standards_mod:0 "The keepers of Jaoz blessed the standards together, with the royal houses standing in one company before the shrine."
 me_zaraken.108.desc_closed:0 "The dispatch from #G Kashmar#! reached #G Kyaxares#! with soot on the fold where the watchman had held it, and beside each crossing the riders used, he had written the hour at which the nearest tower saw the fire. At one post the watch had seen it clearly, although by then a shepherd had already come in with word from the ridge.\n\nThe captains ask for a copy for the men who keep the towers, since a watch may do everything its orders require and still learn too late that riders have passed below it. The next man on the ridge should know which crossing he can warn by fire and which needs a man on horseback."
 me_zaraken.108.b:0 "Call up the levy and ride after them before dawn"
 me_zaraken.108.c:0 "Draw on the supply yards and hold the crossings"
 me_zaraken.108.d:0 "Pay for stores and men to hold the crossings"
 me_zaraken.108.e:0 "Bring the families in, even if the farms go undefended"
 me_zaraken.108.f:0 "Send a copy of the dispatch to the captains"
 me_zaraken.2.desc_crown:0 "The veterans commissioned at the first muster in #G Kyaxares#! came back with a roll ruled into five columns, one for each district, and a space at the head for the officer who would command them all. The delegates from #G Shizar#! recognized several companies on the roll, although the men who had been leading them at home were nowhere named. They ask which of their captains are to keep their posts, so they can tell the families that put them there.\n\nThe veterans will take men from every district, provided the crown issues the commissions and can replace an officer who disobeys its orders. The princes will need persuading before they put their seals to that, and some have offered to take turns furnishing the commander instead. They agree that the roll needs a name at its head, though each has brought one of his own."
 me_zaraken.2.desc_houses:0 "The princes rode into #G Kyaxares#! with the companies they had promised at the first muster, and one brought his son into the hall to read out the names of the men he commanded. When the young man had gone back to his company, his father asked whether he could tell those same men that the command still stood, since several had come at his son's word and expected to serve under him.\n\nThe houses will answer a common summons if their officers keep their places and the crown helps pay for the companies, which have spent most of the journey drawing rations on the princes' credit. We can also let the districts name the commander in turn, although until the first name is agreed, the princes can tell their sons when to muster and little about whose orders they will take there."
 me_zaraken.2.desc_shrine:0 "When the keepers of #Y Jaoz#! brought the standards into #G Kyaxares#!, one remembered how, at the first blessing, a prince had held his neighbor's banner while the man knelt. He found both men in the hall this morning, each arguing that his own officers should give the order to march, and asked whether they would be willing to kneel beside one another again.\n\nIf the crown provides for the ceremony, the keepers will hear each prince name his officers at the shrine and swear to answer the same summons, with the companies there to hear what their lords have promised. The districts could settle the matter among themselves by taking turns in command, though the keeper who went to ask about it came back with five accounts of who should go first."
 me_zaraken.2.b:0 "Put the commissions in the crown's hands."
 me_zaraken.2.c:0 "Pay the household companies and confirm their officers."
 me_zaraken.2.d:0 "Call the princes before Jaoz to swear a common oath."
 me_zaraken.2.e:0 "Send the delegates their copies."
 me_zaraken.116.desc_crown:0 "$me_zaraken.116.opening$\n\nThe copyists have brought out the roll the veterans laid before the Assembly, and beside the routes they will enter the captains commissioned at Kyaxares, along with the signals each is to use when calling for help. One veteran asks for a second set for the men who relieve him, since the last time a captain took the only orders on patrol, the garrison could name the man who had issued them but could scarcely say what he had ordered."
 me_zaraken.116.desc_houses:0 "$me_zaraken.116.opening$\n\nThe routes will go out with a list of the household companies that agreed to keep them, and the princes can send word to the archive when they name a new captain. The young man who read his roll before the Assembly has asked for a copy for his own men, since the next time a neighboring company rides in to relieve them, he would like both parties to know where one watch ends and the other begins."
 me_zaraken.116.desc_shrine:0 "$me_zaraken.116.opening$\n\nThe copyists have entered the names sworn before #Y Jaoz#! beside the roads the captains pledged to keep, and the shrine keepers will have a copy to consult when the pilgrims come home. A keeper who heard a captain promise shelter at his tower has asked for the name of the watchman as well, so that when he sends the next party out, they can ask for the man who has orders to let them in."
 me_zaraken.116.desc_rotation:0 "$me_zaraken.116.opening$\n\nThe copyists are setting the order of command beside the routes, so that each district can see when it must furnish the commander and where he is to find his companies. The officer from #G Elika#! asks that the maps go out with the signals the watches already use, since a man may take over at the muster before he has learned the names of the captains whose fires he will have to answer."
 me_zaraken.116.opening:0 "The first maps unrolled in the new library at #G Kyaxares#! showed a bridge and a ford at the same bend in the river, and each captain could name a man who had crossed where his map said he could. The keeper sent for a scout who had come that way in the morning. He remembered the bridge and had used the ford, though since the last flood a loaded wagon had to go two miles upstream."
 03_zaraken_northern_roads_tt:0 "We will construct roads connecting the four cities of the #T Bay of Kyaxares#!."
 03_zaraken_razani_roadbuilding_tt:0 "Your armies can use #Y Build Road#! before reaching #Y Civic Technology 5#!."
 03_zaraken_religious_complexes_tt:0 "Have the #Y Religious Complexes#! province investment in #G Kashan#!."
 03_zaraken_hajar_raid_resolved_tt:0 "Respond to the raid in #Y The Watchfires of Hajar#!."
 03_zaraken_assembly_resolved_tt:0 "Settle the command dispute at #Y The Assembly of Five Districts#!."
 03_zaraken_muster_crown_tt:0 "At the #Y Assembly of Five Districts#!, the veterans will ask the crown to retain the right to appoint commanders."
 03_zaraken_muster_houses_tt:0 "At the #Y Assembly of Five Districts#!, the royal houses will ask to keep their officers and receive funds for their companies."
 03_zaraken_muster_shrine_tt:0 "At the #Y Assembly of Five Districts#!, the keepers of Jaoz can witness a common oath."
 zaraken_hajar_crossings_held_mod:0 "The Crossings of Hajar"
 desc_zaraken_hajar_crossings_held_mod:0 "The watch keeps men and stores at the crossings where the raiders came through."
 zaraken_hajar_outlying_farms_sacked_mod:0 "Farms Sacked in Hajar"
 desc_zaraken_hajar_outlying_farms_sacked_mod:0 "Families took shelter at Kashmar while raiders drove off stock and emptied the outlying stores."
 zaraken_assembly_crown_command_mod:0 "Commissions from Kyaxares"
 desc_zaraken_assembly_crown_command_mod:0 "Captains from all five districts take their commissions from the crown and know whose orders to follow when their companies join."
 zaraken_assembly_house_commands_mod:0 "Commands of the Royal Houses"
 desc_zaraken_assembly_house_commands_mod:0 "The crown funds the household companies, and the princes furnish the officers who lead them."
 zaraken_assembly_oath_of_jaoz_mod:0 "The Common Oath of Jaoz"
 desc_zaraken_assembly_oath_of_jaoz_mod:0 "The houses swore before the shrine that their companies would answer one summons."
 zaraken_assembly_rotating_command_mod:0 "The Rotating Command"
 desc_zaraken_assembly_rotating_command_mod:0 "Each district knows when it will furnish the commander and whose orders it will take in the meantime."
 03_zaraken_task_19:0 "The Surveyors' Stakes"
 03_zaraken_task_19_DESC:0 "The captains can bring their companies to the old cities of #G Kashan#! and #G Zakaria#!, but some of the streets can scarcely take a wagon. Set aside building ground in #G Kyaxares#!, #G Kassandane#!, #G Vanuse#!, #G Mihrab#!, and #G Inar#! before the yards and workshops take whatever space happens to be left. The surveyors would like this done while there is still some ground left to measure."
 me_zaraken.119.t:0 "$03_zaraken_task_19$"
 me_zaraken.119.desc:0 "The surveyors brought a baggage cart into the market at #G Kyaxares#! and asked the driver to turn it as he would with a company at his back. He got halfway round before the fruit sellers had to lift their boards, and one of them held his stall in the air while a surveyor measured the space it had been standing on. He told the man with the rod to take his time, so long as he only had to do this once.\n\nWe have paid to lay out new quarters in the capital and the four cities that will supply the muster, where the men with measuring rods have already found buyers asking about the ground beside the roads. The surveyors ask leave to mark the public ground now, while they can still set aside room for markets, stores, and workshops without having to buy back the land beneath them."
 me_zaraken.119.a:0 "Mark the ground out before anyone builds on it."
 03_zaraken_task_20:0 "Bread For The Militias"
 03_zaraken_task_20_DESC:0 "Kyaxares has a small army of militias patrolling its streets, but these men march on their stomachs and our stores are not sufficient enough to feed them. [ROOT.GetCountry.GetRuler.GetName|G] has decided to expand the capital and give it a second granary and an aqueduct, so that the quartermasters can provision the companies at the gate without emptying the bakers' stalls in the market behind it."
 me_zaraken.120.t:0 "$03_zaraken_task_20$"
 me_zaraken.120.desc:0 "When the first grain carts came in for the militia at #G Kyaxares#!, the market stewards checked their loads against the council's orders and sent them to the new granary. A baker who remembered waiting half a day for the army's wagons to clear the street had his ovens lit by the time the first company reached the gate, and the families who came in behind it drew water from the new aqueduct at the market trough without having to wait in line for hours.\n\nNeedless to say, the people are pleased to see the crown's companies marching through the streets without having to wait for their bread, and the quartermasters ask that the next muster be sent through the same gate. The bakers can keep their ovens hot, and the stewards can weigh out the grain without holding up the wagons that bring it in."
 me_zaraken.120.a:0 "Another day, another crisis averted"
 03_zaraken_task_21:0 "Broken Axles at Kassandane"
 03_zaraken_task_21_DESC:0 "With the road open and the command at #G Avestan#! guarding the convoys, the spice merchants of #G Kyaxares#! can send larger loads down to #G Kassandane#!. Expand spice production in the capital, then grow Kassandane and build a second Market there so the carters have room to unload without holding up the grain wagons bound for Kyaxares."
 me_zaraken.121.t:0 "$03_zaraken_task_21$"
 me_zaraken.121.desc:0 "The first spice wagon out of #G Kyaxares#! drew up under the shed at the new market in #G Kassandane#!, and the stewards had weighed half its sacks by the time the driver came back from watering his team. The grain carts passed through the yard while he was at the trough, though one baker stopped to buy a little of the blend his mother used to keep for feast days.\n\nThe merchants ask to bring their next wagons through the same yard, where the patrols know when to expect them and the stewards can keep the sacks dry. The capital's granary keeper has offered to send his orders there too, so a carter bringing spices down can pick up a load for the granary and have a paying wagon on the road home."
 me_zaraken.121.a:0 "Have the caravans break their loads at Kassandane."
 03_zaraken_task_22:0 "The Iron Mills Of Vanuse"
 03_zaraken_task_22_DESC:0 "Let the iron @iron! of #G Kashan#! pass through the yards of #G Vanuse#!, where the crown's smiths can buy a full load without riding from pit to pit. The mills need hands to work them and enough ore left over after the local forges have taken their share."
 me_zaraken.122.t:0 "$03_zaraken_task_22$"
 me_zaraken.122.desc:0 "When the first cart from the pits of #G Kashan#! came into the mill yard at #G Vanuse#!, a ploughsmith was already waiting with a list of the tools he had promised to mend before sowing. Last spring his apprentice spent three days going from pit to pit and came back with half the iron they needed. This morning the millkeeper weighed out his share, entered it in the yard book, and had enough left under the shed to fill an order from #G Kyaxares#!.\n\nThe quartermaster asks to place the crown's orders at the same yard. When the captains send him their rolls, he can tell the smiths how much iron to expect and when to have their charcoal ready. The millkeepers are willing to set aside each load as it is ordered, provided the local smiths still find their share waiting when they come down to the yard."
 me_zaraken.122.a:0 "I am pleased to hear the smiths are keeping their forges hot"
 03_zaraken_task_23:0 "Fleet Yards Of Mihrab"
 03_zaraken_task_23_DESC:0 "The muster quay at #G Mihrab#! can put a company aboard, but the crown now needs a berth for a larger fleet and a commander who knows what to do with it once it leaves the harbor. Add a fourth Port, and give the fleet an admiral whom the captains of the merchant ships will make way for."
 me_zaraken.123.t:0 "$03_zaraken_task_23$"
 me_zaraken.123.desc:0 "Two merchant ships reached #G Mihrab#! on the same tide as the crown's transports, and a pilot had already put out to sell the first merchant a place at the quay when the harbor master waved both ships straight in. At the new berth, the soldiers were loading grain while the shipwrights worked on a vessel the admiral had brought in for refitting, and the stevedores at the market quay could go on unloading their own cargo.\n\nThe harbor master asks to keep a berth for the crown's ships, so he can give a captain a place to load without sending a merchant back out to wait on the tide. The wine sellers who once argued with the captains over the next boat are all for it, though the pilot has asked whether the men who kept the old queue are to be paid for their trouble."
 me_zaraken.123.a:0 "Keep a berth clear for the crown's ships."
 03_zaraken_task_24:0 "The Arsenal At Inar"
 03_zaraken_task_24_DESC:0 "Build up #G Inar#! with two Training Camps and keep the iron of #G Zakaria#! flowing faster than the local smiths can use it. One company can drill while another keeps the watch, and both should be able to draw iron without leaving the city. The captains would also like recruits who have seen a battle before they see the arsenal."
 me_zaraken.124.t:0 "$03_zaraken_task_24$"
 me_zaraken.124.desc:0 "A relief unit came down from the fort at #G Inar#! while the next company was still drilling, and a rider stopped at the arsenal to put a broken buckle on the smith's bench. The smith, an old hand that had worked for the crown for forty-odd summers, recognized the buckle at once as his own handiwork, and before the sun had set over the #Y Bay of Kyaxares#!, replacements had seen made for the men going back out. The arsenal has enough stores to keep the watch and the drill going, and the quartermaster always requests that raw recruits be sent to #G Inar#! so they can see firsthand how the crown's men are trained before they are sent to their own companies."
 me_zaraken.124.a:0 "This was a wise investment..."
 zaraken_capital_building_plots_mod:0 "Ground for the Capital's Quarters"
 desc_zaraken_capital_building_plots_mod:0 "The surveyors set aside ground for the capital's stores, markets, and waterworks before the new streets filled up."
 zaraken_city_building_plots_mod:0 "Ground for the New Quarters"
 desc_zaraken_city_building_plots_mod:0 "The city has kept ground clear for new yards and workshops beside the roads the companies use."
 zaraken_kyaxares_muster_quarter_mod:0 "The Grain District of Kyaxares"
 desc_zaraken_kyaxares_muster_quarter_mod:0 "The capital can feed the companies that muster here while the markets and wells stay open to the people who live beside them."
 zaraken_kassandane_caravan_quarter_mod:0 "Caravan Quarter of Kassandane"
 desc_zaraken_kassandane_caravan_quarter_mod:0 "The caravans water their teams and break up their loads at Kassandane before taking the capital's share to its gates."
 zaraken_vanuse_ironworks_mod:0 "The Iron Mills of Vanuse"
 desc_zaraken_vanuse_ironworks_mod:0 "The smiths can buy Kashan's iron in one yard, where the mills bring their loads to market."
 zaraken_mihrab_fleet_yards_mod:0 "Fleet Yards of Mihrab"
 desc_zaraken_mihrab_fleet_yards_mod:0 "The harbor master can fit out the crown's ships while the merchants unload at the next berth."
 zaraken_inar_arsenal_mod:0 "The Arsenal at Inar"
 desc_zaraken_inar_arsenal_mod:0 "The forts can draw trained men, fittings, and provisions from the same city while the watch stays on the road."
 03_zaraken_t3_banner_tt:0 "Hold #G Kokihmobpod#! and #G Kobnudac#! directly or through vassals."
 03_zaraken_t5_road_ground_tt:0 "Directly own #G Kassandane#!, #G Mihrab#! and #G Avestan#!, where the Razani crews will lay the road."
 03_zaraken_t6_camp_tt:0 "Build a Training Camp in #G Avestan#!."
 03_zaraken_t6_garrison_tt:0 "Directly own #G Avestan#!, and its state has at least #Y 55#! loyalty."
 03_zaraken_t7_string_tt:0 "Import @horses! Horses, or have a surplus of at least #Y 2#! @horses! Horses in the state of #G Haxamanish#!."
 03_zaraken_t8_watch_tt:0 "Directly own #G Kashmar#!, and have at least #Y 4#! #Y Light Cavalry#! cohorts or at least #Y 4#! #Y Horse Archer#! cohorts in our armies, in any army and anywhere on the map."
 03_zaraken_t9_houses_tt:0 "No head of a great family, other than the ruler, has less than #Y 55#! loyalty."
 03_zaraken_t10_escort_tt:0 "Keep at least #Y 60%#! of our maximum manpower in reserve, and employ a general with at least #Y 6#! martial."
 03_zaraken_t14_boats_tt:0 "Have at least #Y 30#! ships."
 03_zaraken_t15_delegates_tt:0 "Every state we own in the #G Golden Foothills#! has at least #Y 50#! loyalty."
 03_zaraken_t16_keeper_tt:0 "Employ a character other than the ruler who holds an office and has at least #Y 9#! finesse."
 03_zaraken_t17_marshal_tt:0 "Our marshal has at least #Y 8#! martial and #Y 60#! loyalty."
 03_zaraken_t18_muster_tt:0 "Have at least #Y 75#! legitimacy, and our ruler has at least #Y 60#! popularity."
 03_zaraken_t19_ground_tt:0 "Directly own #G Kyaxares#!, #G Kassandane#!, #G Vanuse#!, #G Mihrab#!, and #G Inar#!."
 03_zaraken_t19_surveyors_tt:0 "#G Kyaxares#! has at least #Y 40#! population."
 03_zaraken_t21_road_tt:0 "Have a road between #G Kyaxares#! and #G Kassandane#!."
 03_zaraken_t21_spices_tt:0 "Take the #Y $spices_province_decision_2$#! decision and directly own #G Kyaxares#! with its spice production modifier."
 03_zaraken_t22_hands_tt:0 "#G Vanuse#! has at least #Y 6#! slaves to work the mills."
 03_zaraken_t22_iron_tt:0 "Have a surplus of at least #Y 2#! @iron! Iron in the state of #G Vanuse#!."
 03_zaraken_t23_fleet_tt:0 "Employ an admiral with at least #Y 7#! martial."
 # Faith arm: the grave of Jaoz
 03_zaraken_task_26:0 "The Grave In The Small Temple"
 03_zaraken_task_26_DESC:0 "#G Bachin#! asked that #Y Jaoz the Bold#! be buried in a small temple at #G Kyaxares#!, so that he could visit his friend's grave without a crowd of pilgrims at his back. When the coalition sacked the city in #Y 946 LC#!, its captains left the grave alone, and the keepers have swept its steps every morning since. Fewer pilgrims climb them every year, however, because the faithful who pass through on the road to #G Makox#! expect to find a #Y Kaxud#! in a #T Zainudian#! city and a keeper who can tell them the crown still honors the grave."
 03_zaraken_task_27:0 "Preachers at Gurhak"
 03_zaraken_task_27_DESC:0 "The #T Golden Dwarves#! of #G Gurhak#! still carry their dead past the shrine of their old father on the way down to the mines, and since the Razani road was finished our wagons have had to wait at the square for every procession. The preachers who came north with the wagons say the miners will sit through a sermon if it is short and given out of the rain. Raise a temple at Gurhak, keep the city under the crown's own rule, and let the preachers work until more families pray in the hall of #T Zain'ud#! than at the old father's shrine."
 03_zaraken_task_28:0 "The Pilgrim Road To Makox"
 03_zaraken_task_28_DESC:0 "Every #T Zainudian#! is told to pray at the #Y Zaindaxan#! in #G Makox#!, where #T Zain'ud#! gave the prophets his final message, but the clergy there have not seen a company from #G Kyaxares#! at the altar since the #T Kephal fell#!. Send the #T Keepers of the Tomb#! with a caravan of pilgrims, a high priest to speak for them, and enough silver to pay for the road. When they reach the altar court, the clergy of Makox will know what kind of believers have come before they open the gate."
 03_zaraken_task_29:0 "Kaxuds of the Five Districts"
 03_zaraken_task_29_DESC:0 "A traveler who rides from #G Avestan#! to #G Kashmar#! ought to hear the evening prayer in every district he crosses, but in some valleys the nearest #Y Kaxud#! is still a tent that moves with the herds. Raise a temple in each of the five districts of the #G Golden Foothills#!. At #G Qaenab#!, where the #Y Achabascan#! herdsmen still keep the hearth fires of their ancestors, the preachers will have to win over the families before there is anyone to put in the temple."
 03_zaraken_task_30:0 "The Heirs of Jaoz"
 03_zaraken_task_30_DESC:0 "#Y Jaoz the Bold#! died of a fever while fighting a #Y Zaraken#! revolt, and the Zarakens have spent the generations since keeping his grave and being called heretics for their trouble. When every territory we hold in the #G Golden Foothills#! keeps the faith, and the keepers can point to a ruler or a high priest whose devotion nobody at #G Makox#! can question, the House of [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective|T] can claim to be the heirs of the prophet who lies in its capital."
 03_zaraken_t26_tomb_tt:0 "Hold the #Y Tomb of Jaoz#!. If it has been lost, have at least #Y 2#! Temples in #G Kyaxares#! instead."
 03_zaraken_t26_kaxud_tt:0 "Have a #Y Kaxud#! in at least one of our cities. The #Y Build Kaxud#! decision raises one."
 03_zaraken_t27_gurhak_tt:0 "Directly own #G Gurhak#!, and #T Zainudian#! is its dominant faith."
 03_zaraken_t28_priest_tt:0 "Our high priest is #T Zainudian#! and has at least #Y 6#! zeal."
 03_zaraken_t29_temples_tt:0 "Own a territory with a Temple in each of #G Kashan#!, #G Shizar#!, #G Zarqan#!, #G Zakaria#!, and #G Hajar#!."
 03_zaraken_t29_qaenab_tt:0 "We or one of our subjects hold #G Qaenab#!, and #T Zainudian#! is its dominant faith."
 03_zaraken_t30_faithful_tt:0 "Every territory we own in the #G Golden Foothills#! has #T Zainudian#! as its dominant faith."
 03_zaraken_t30_route_tt:0 "The clergy of #G Makox#! have received our pilgrims at the #Y Zaindaxan#!, or #G Kyaxares#! has at least #Y 2#! Temples for the pilgrims who pray at the grave instead."
 03_zaraken_t30_devout_tt:0 "Our ruler has at least #Y 8#! zeal, or our high priest has at least #Y 12#! zeal."
 03_zaraken_faith_zealous_tt:0 "When our pilgrims reach #G Makox#!, the clergy will receive them at the #Y Zaindaxan#!."
 03_zaraken_faith_licensed_tt:0 "If #G Makox#! remains outside our control, its clergy will demand #Y 200#! gold to admit our pilgrims to the #Y Zaindaxan#!."
 03_zaraken_makox_recognized_tt:0 "The clergy of #G Makox#! have received our pilgrims. #Y The Heirs of Jaoz#! will not require a second Temple at #G Kyaxares#!."
 03_zaraken_faith_own_road_tt:0 "#Y The Heirs of Jaoz#! will require at least #Y 2#! Temples in #G Kyaxares#!, so that pilgrims can pray at the grave without passing through #G Makox#!."
 me_zaraken.126.t:0 "The Scandal at the Temple Steps"
 me_zaraken.126.desc:0 "The #Y Keepers of the Tomb#!, the priests entrusted with guarding the mortal remains of #T Jaoz the Bold#!, opened a small temple for travelers and pilgrims, and it soon became a popular gathering place for social activites, including business.\n\nOne morning, two #T Helluvian#! merchants were weighing pepper at the foot of the steps when their porter, a burly Werhenlander, asked the travelers to stand aside while he carried the heavy sacks down to the market. These pilgrims had come to [ROOT.GetCountry.GetCapital.GetName|G] by way of #G Makox#!, where the clergy still preach that the #Y Zarakens#! sold their faith for spice money in the days of the #T Kephal#!, and were offended that the merchants had set up their scales at the grave of the prophet. Words became heated, the porter struck one of the men, and another soon called for a guard to arrest him.\n\nAngered over the treatment of the pilgrims, the Keepers have asked us to banish the Helluvian guilds from our cities and sell their warehouses, since every caravan that goes home with a story about the scandal gives the clergy of Makox another reason to shut their gates to us."
 me_zaraken.126.a:0 "Close the Helluvian guildhouses and banish them from the Golden Foothills"
 me_zaraken.126.b:0 "Sell the warehouses but let the merchants trade elsewhere"
 me_zaraken.127.t:0 "$03_zaraken_task_27$"
 me_zaraken.127.desc:0 "The new temple at #G Gurhak#! held its first full service on a feast day of the old shrine, and when the rain came down, so many miners took shelter inside that the doorkeepers borrowed benches from the tavern. A foreman whose grandfather had cut the steps to the old father's shrine stayed by the door until the reading from the #Y Uphin#! came to the passage on honest weights, and afterward he asked for a copy to read to the men who weighed his crew's ore.\n\nThe priests of the old shrine still tend their lamps, and some families still carry their dead past them on the way to the mines. The preachers ask the crown's men to see them across the square, where the two congregations now pass each other, and they ask the market clerks to shut the scales on the miners' rest day so that those who wish to hear the reading can stay to the end."
 me_zaraken.127.a:0 "See the preachers across the square."
 me_zaraken.128.t:0 "$03_zaraken_task_28$"
 me_zaraken.128.desc_ours:0 "The caravan from #G Kyaxares#! reached #G Makox#! with a letter from our court, and the city clerks were waiting at the gate to conduct the pilgrims to the #Y Zaindaxan#!. The clergy could scarcely bar the altar court to a party received under our seal, though once the gates were open, they took care to read the name of every house in the caravan while the eldest keeper prayed at the stone.\n\nThe keeper has brought home a copy of the list, and the houses at court have already asked him whether the priests read their names in the order he gave them. He has more to say about the road, where a number of the older pilgrims had to sleep between the wells, and he asks that we keep the hospices open for the companies that will follow now that the altar court has received us."
 me_zaraken.128.desc_zealous:0 "A #T Helluvian#! merchant reached #G Makox#! ahead of our caravan and asked the clergy to hear his complaint. He told them the crown had sold his warehouse in #G Kyaxares#! and banished his guild from the #G Golden Foothills#! after the fight at the temple steps. For years the clergy had said our court would excuse anything for the sake of the spice trade. When the #T Elder Keeper#! arrived, they told him they had heard from the merchant himself what the crown had done. Then they opened the altar court and led our pilgrims to pray at the #Y Zaindaxan#!.\n\nAfter the prayers, several #Y Zinduidian#! families asked to travel home with our caravan. They want to pray at the grave of #Y Jaoz#! and have asked the keeper how far it is between places where their children can sleep. He asks us to keep grain and beds ready in the hospices. Now that the clergy have opened the court to us, he expects more pilgrims on the road in both directions."
 me_zaraken.128.desc_licensed:0 "The clergy of #G Makox#! came to the gate of the altar court while our pilgrims were still shaking the dust from their clothes, and asked whether the #T Helluvian#! factors still traded under the seal of #G Kyaxares#!. The eldest keeper told them where the stalls had been moved, but when he brought out the letter authorizing the move, a priest laid a finger on the seal and asked how much difference the width of a wall could make. The gate stayed shut.\n\nThe clergy have named a penance in silver for the upkeep of the altar, and if the crown pays it, they will receive our pilgrims at the stone. The keeper has sent the terms home with a rider, along with a request from the families waiting in the square. If the crown brings them home, they ask for a place to pray beside #Y Jaoz#!, where the keepers know their names and have room to open another hall."
 me_zaraken.128.a:0 "Keep the hospices open for the next caravan."
 me_zaraken.128.b:0 "Pay the penance so the pilgrims can enter."
 me_zaraken.128.c:0 "Bring the pilgrims home to pray at the grave."
 me_zaraken.129.t:0 "$03_zaraken_task_29$"
 me_zaraken.129.desc:0 "The preachers sent their accounts to #G Kyaxares#!, where the clerks laid them beside the muster rolls to see which towns could lodge travelers on the road. In #G Shizar#! the miners gather before the first shift, while the herdsmen in #G Zarqan#! come in to pray after they have brought the horses down at dusk. At #G Qaenab#!, an elder whose family had kept its hearth fire for as long as he could remember brought a bowl of its ashes to the new temple and asked the preacher to set it somewhere his children could find it.\n\nA pilgrim can now cross the #G Golden Foothills#! and find a #Y Kaxud#! along the way, and the keepers ask the temples to reckon the feast days by the calendar kept at the grave of #Y Jaoz#!. The prayers may be said at whatever hour brings people through the doors, so long as a family that leaves home for the feast of the Bold knows which morning it must be there."
 me_zaraken.129.a:0 "Let every district keep the calendar of the grave."
 me_zaraken.130.t:0 "$03_zaraken_task_30$"
 me_zaraken.130.desc_recognized:0 "On the feast of the Bold, the line outside the small temple at #G Kyaxares#! reached past the spice scales, and among the pilgrims were clergy from #G Makox#! carrying the list they had read at the #Y Zaindaxan#!. They read those names again at the grave, adding the names of the households that had put them up on the way. When the last name was spoken, the eldest of them knelt on the steps our keepers have swept every morning since #Y 946 LC#!.\n\nThe keepers ask that the grave be named in the crown's warrants, so that a captain who gives shelter at a tower knows what he is doing for the families whose names were read. The priest from Makox has asked for a copy of the register to take home, so that the clerks at the altar court will have the names at hand when a #Y Zaraken#! family comes to pray."
 me_zaraken.130.desc_own_road:0 "On the feast of the Bold, the keepers at #G Kyaxares#! opened the small temple where #Y Jaoz#! lies and the hall beside it, where families who once traveled to #G Makox#! could wait under cover to have their names called. Some had ridden from the far end of the #G Golden Foothills#!, and one woman who had waited in the square outside the altar court brought the candle she had carried home unlit. A keeper held it for her while she gave him the names of the family who had come with her.\n\nThe factors beyond the eastern gate sent a boy back for more candles before the names had all been read, and the treasurer has set the day's receipts aside for the pilgrims' hall. When the crown lays claim to the prophet's inheritance, the keeper asks to have his book beside the warrant, for these are the households that came to pray under its protection."
 me_zaraken.130.a:0 "Read the names of the faithful at the grave."
 zaraken_keepers_of_the_grave_mod:0 "#T Keepers of the Tomb#!"
 desc_zaraken_keepers_of_the_grave_mod:0 "The Keepers of the Tomb are entrusted with guarding the mortal remains of the prophet Jaoz the Bold."
 zaraken_closed_houses_mod:0 "The Closed Houses"
 desc_zaraken_closed_houses_mod:0 "The Helluvian guilds have been banished and their warehouses sold. The pilgrims buy their candles from the keepers."
 zaraken_sealed_factors_mod:0 "The Sealed Factors"
 desc_zaraken_sealed_factors_mod:0 "The guilds' warehouses have been sold. Their merchants now trade beyond the eastern gate and pay duty on their stalls."
 zaraken_gurhak_preachers_mod:0 "Preachers at Gurhak"
 desc_zaraken_gurhak_preachers_mod:0 "The miners hear a short sermon before the shift, and the scales close on the day they rest."
 zaraken_received_at_the_stone_mod:0 "Received at the Zaindaxan"
 desc_zaraken_received_at_the_stone_mod:0 "The clergy of Makox have read our pilgrims' names at the altar, and the faithful who hear of it are more willing to listen to our preachers."
 zaraken_district_kaxuds_mod:0 "Kaxuds of the Five Districts"
 desc_zaraken_district_kaxuds_mod:0 "Every district keeps the calendar of the grave, and a pilgrim can find a Kaxud within a day of any road."
 zaraken_heirs_of_jaoz_mod:0 "The Heirs of Jaoz"
 desc_zaraken_heirs_of_jaoz_mod:0 "The House that keeps the prophet's grave has kept his faith in every district it rules."
 zaraken_named_at_the_grave_mod:0 "Names Read at the Grave"
 desc_zaraken_named_at_the_grave_mod:0 "Each year on the feast of the Bold, clergy from Makox read the names of the faithful on the steps of the small temple."
 zaraken_pilgrim_hall_mod:0 "The Pilgrims' Hall"
 desc_zaraken_pilgrim_hall_mod:0 "The great hall beside the grave receives the pilgrims who no longer travel to Makox, and the stalls outside the gate sell them candles for the road."
 # Rival arc: Yamhad
 03_zaraken_task_32:0 "The Tolls At Gurhak"
 03_zaraken_task_32_DESC:0 "The wagoners who take the Razani road to #G Gurhak#! bring home a toll receipt for every load, though the clerks at #G Avestan#! have only the drivers' word for what was on the wagons when they left. Give Avestan two markets and have their clerks keep a common roll, so the herald can bring the merchant-king an account bearing the crown's seal."
 03_zaraken_task_33:0 "Under The Mountain"
 03_zaraken_task_33_DESC:0 "The dwarves of #Y Yamhad#! have kept their holds beneath #G Gurhak#! since long before the first Zaraken rode up the valley, and they have outlasted every army that tried to starve them out. Bring Gurhak under our direct rule by treaty or by force, and leave the merchant-king no throne except the one he holds under our banner."
 03_zaraken_t33_gurhak_tt:0 "Directly own #G Gurhak#!."
 03_zaraken_t33_king_tt:0 "#Y Yamhad#! no longer exists, or it has become our subject."
 03_zaraken_break_holds_tt:0 "Every territory still held by #Y Yamhad#! passes to us, and each suffers #Y Broken Holds#! for #Y 10#! years."
 me_zaraken.131.t:0 "The Tolls At Gurhak"
 me_zaraken.131.desc:0 "The markets of #G Avestan#! have been set up, and the clerks have begun to weigh the loads that come down the Razani road. The merchant-king of #Y Yamhad#! has sent a herald to ask what the crown means to do about the tolls, and he has brought a letter from his master, who says that he will not pay a share of the tolls unless we give him a share of the road.\n\nThe herald asks whether we will keep both markets on the same roll, or whether we will offer silver for Gurhak and take the other holds under our seal. We could ignore them for now, but the merchant-king will not wait forever."
 me_zaraken.131.desc_terms:0 "$me_zaraken.131.desc$\n\nThe herald says the merchant-king might yield #G Gurhak#! for silver and keep his other holds under our protection. If he agrees, the crown can set the toll at both ends of the road."
 me_zaraken.131.a:0 "Levy tolls on the road and keep the profits"
 me_zaraken.131.b:0 "Offer silver for Gurhak and take the other holds under our seal."
 me_zaraken.132.t:0 "$03_zaraken_task_33$"
 me_zaraken.132.desc_subject:0 "The merchant-king of #Y Yamhad#! came up out of the holds beneath #G Gurhak#! to hear our terms in the same counting hall where his clerk once read out the price of our horseshoes. He brought the ledgers with him. When our captain asked what they were for, the king said that a dwarf who loses a war still likes to know exactly what it cost him.\n\nHe offers to keep his holds and pay the crown a share of every toll and every ingot that leaves the mountain, and his smiths have already asked whether they may shoe our heavy horse at the old dwarven forges. The captains who fought their way up the valley would rather empty the holds and bring the ingots home on our own wagons. Either way, the dwarves will remember what we chose for a very long time."
 me_zaraken.132.desc_gone:0 "In the wake of the Zaraken conquest of the city, the holds beneath #G Gurhak#! are quiet - no longer are they filled with the screams of dying men or the sounds of magical explosions, but a calm stillness.\n\nThe halls have been picked clean. The last of the #Y Yamhad#! clerks, desperate to flee with their lives, left the counting hall with as many ledgers and chests as they could carry, but we were able to find a strongroom that the dwarves had not had time to empty.\n\nGurhak has other treasures; a few of the old smiths have stayed behind, because their forges are older than any king and they do not intend to start over somewhere else. They ask only that the crown buy its iron from them at a fair price, and they have already offered to shoe the heavy horse every campaign season."
 me_zaraken.132.a:0 "Leave the holds to their king, under our banner"
 me_zaraken.132.b:0 "Break the holds and bring the ingots home"
 me_zaraken.132.c:0 "Count the strongroom, and keep the smiths"
 # The roots route
 03_zaraken_task_35:0 "The Older Crown"
 03_zaraken_task_35_DESC:0 "Long before the prophets came south, the #Y Zarakens#! had an empire that rivaled the #T Zani#!, and its kings rode at the head of their knights under the crown of #Y Eszarakayn Shazum#!. The clergy of #G Makox#! would rather we forgot it. The princes of the Foothills have not, and neither have the #T Helluvian#! factors, who still trade at #G Kyaxares#! because our grandfathers would not close their doors. Raise the knights of the old empire again, show the districts what they can do in the field, and take up the older crown."
 03_zaraken_t35_houses_tt:0 "The Helluvian houses at #G Kyaxares#! have not been closed."
 03_zaraken_t35_knights_tt:0 "Have at least #Y 8#! #Y Heavy Cavalry#! cohorts in our armies, in any army and anywhere on the map."
 03_zaraken_t35_charges_tt:0 "Sound the #Y Kaxhamid Charge#! at least #Y 2#! times."
 03_zaraken_route_roots_tt:0 "We take up the older crown. #Y The Heirs of Jaoz#! and the tasks leading to it will be bypassed."
 03_zaraken_route_prophets_tt:0 "We claim the prophet's heritage. #Y The Older Crown#! will be bypassed."
 me_zaraken.133.t:0 "$03_zaraken_task_35$"
 me_zaraken.133.desc:0 "The crown of #Y Eszarakayn Shazum#! had lain in a cedar chest under the old palace since before the Kephal, and the keeper who brought it up had to borrow a lamp from the kitchens to find the key. It is heavier than the circlet our rulers have worn since, and the gold on the inside of the band is worn smooth where an older head pressed against it. When [ROOT.GetCountry.GetRuler.GetName|Y] put it on in front of the princes, the captains of the heavy horse struck their shields, and after a moment the princes did as well.\n\nThe clergy who keep the grave of #Y Jaoz#! say nothing against it, though they have asked whether the crown means to keep the feast of the Bold. The #T Helluvian#! factors sent a gift of glass by the evening, and the knights have asked to ride out under the old banner rather than the one the Kephal gave us."
 me_zaraken.133.a:0 "Ride out under the old banner."
 zaraken_crown_of_eszarakayn_treasure:0 "Crown of Eszarakayn Shazum"
 zaraken_crown_of_eszarakayn_treasure_desc:0 "The crown of the old Zaraken kings, kept in a cedar chest under the palace at Kyaxares through the whole rule of the Kephal."
 zaraken_older_crown_mod:0 "The Older Crown"
 desc_zaraken_older_crown_mod:0 "The ruler wears the crown of the old Zaraken kings, and the knights ride under the banner they carried before the prophets came south."
 zaraken_standard_of_five_districts_treasure:0 "Standard of the Five Districts"
 zaraken_standard_of_five_districts_treasure_desc:0 "The imperial standard carried out of Kyaxares at the crowning, with the banner of every district stitched along its hem."
 NICKNAME_ZARAKEN_RESTORER:0 "'the Restorer'"
 NICKNAME_ZARAKEN_KEEPER_OF_THE_GRAVE:0 "'Keeper of the Grave'"
 03_zaraken_finale_extras_tt:0 "Gain the #Y Standard of the Five Districts#!. Our ruler takes a title from the road the realm has followed, and #Y Ride the Bounds#! and the #Y Kaxhamid Charge#! grow stronger and stay after the coronation."
 # Signature mechanics
 03_zaraken_ride_the_bounds:0 "Ride the Bounds"
 03_zaraken_ride_the_bounds_desc:0 "The princes of the Foothills will obey a seal they have watched being pressed. The [ROOT.GetCountry.GetRulerTitle|T] can ride through each district in turn, holding court in its hall and sealing its charters in front of its captains, although the houses left behind at #G Kyaxares#! may use the absence for their own ends."
 03_zaraken_kaxhamid_charge:0 "The Kaxhamid Charge"
 03_zaraken_kaxhamid_charge_desc:0 "When the heavy horse of the old empire rode out, the whole line charged at the sound of a single horn, and no army in the Foothills has stood against that charge since the Kephal fell. The horn can be sounded again, but only in a real war, and the knights it calls out will not all ride home."
 03_zaraken_bounds_unlocked_tt:0 "Unlock the #Y Ride the Bounds#! decision. It costs #Y 100#! gold, adds #Y 10#! loyalty to every state we own in the #G Golden Foothills#!, and gives our ruler #Y 5#! popularity. While the ruler is away, a great family may lose loyalty. It can be used once every #Y 5#! years."
 03_zaraken_bounds_renewed_tt:0 "#Y Ride the Bounds#! now adds #Y 15#! state loyalty, can be used once every #Y 3#! years, and remains after the coronation."
 03_zaraken_charge_unlocked_tt:0 "Unlock the #Y Kaxhamid Charge#! decision."
 03_zaraken_charge_renewed_tt:0 "The #Y Kaxhamid Charge#! now also grants #Y +10%#! heavy cavalry discipline for #Y 1#! year."
 03_zaraken_bounds_ready_tt:0 "The ruler has not ridden the bounds within the cooldown."
 03_zaraken_charge_ready_tt:0 "At least #Y 5#! years have passed since the last Kaxhamid Charge, or the horn has yet to be sounded."
 03_zaraken_bounds_effect_tt:0 "Every state we own in the #G Golden Foothills#! gains #Y 10#! loyalty."
 03_zaraken_bounds_effect_renewed_tt:0 "Every state we own in the #G Golden Foothills#! gains #Y 15#! loyalty."
 03_zaraken_bounds_risk_tt:0 "#R There is a 50% chance that the head of a great family takes advantage of our absence and loses 10 loyalty for 3 years.#!"
 03_zaraken_t15_bounds_tt:0 "Our ruler has used #Y Ride the Bounds#! at least once."
 03_zaraken_t17_charge_tt:0 "Sound the #Y Kaxhamid Charge#! at least once."
 03_zaraken_t18_bounds_tt:0 "Our ruler has used #Y Ride the Bounds#! at least #Y 3#! times."
 03_zaraken_kaxham_captain_tt:0 "A #Y Zaraken#! captain of the Kaxham Guards, with #Y +6#! martial and the #Y Tactician#! trait, joins our court."
 03_zaraken_inar_knights_tt:0 "Raise #Y 2#! cohorts of heavy cavalry at #G Inar#!."
 03_zaraken_mihrab_boats_tt:0 "Launch #Y 5#! Holks at #G Mihrab#!."
 zaraken_ruler_abroad_loyalty:0 "The Ruler Rode Away"
 zaraken_kaxhamid_charge_mod:0 "The Kaxhamid Charge"
 desc_zaraken_kaxhamid_charge_mod:0 "The horn has been sounded, and the heavy horse charge as one line."
 zaraken_kaxhamid_charge_greater_mod:0 "The Kaxhamid Charge"
 desc_zaraken_kaxhamid_charge_greater_mod:0 "The horn has been sounded, and the Kaxham Guards lead the heavy horse in one line behind it."
 zaraken_toll_grievance_mod:0 "The Unpaid Receipt"
 desc_zaraken_toll_grievance_mod:0 "Every rider in the levy has heard what the dwarves wanted for the iron on his horse's shoes."
 zaraken_toll_ledger_mod:0 "The Toll Receipts"
 desc_zaraken_toll_ledger_mod:0 "The treasurer at Avestan keeps every receipt from the toll house at Gurhak and charges the wagoners a little less than the dwarves do."
 zaraken_gold_of_yamhad_mod:0 "The Gold of Yamhad"
 desc_zaraken_gold_of_yamhad_mod:0 "The merchant-king sends the crown its share of every toll and ingot, along with a ledger showing exactly what it cost him."
 zaraken_broken_holds_mod:0 "Broken Holds"
 desc_zaraken_broken_holds_mod:0 "The holds have been emptied and their ingots carried away, and the dwarves who remain have not forgotten who did it."
 zaraken_dwarven_smiths_mod:0 "The Old Forges"
 desc_zaraken_dwarven_smiths_mod:0 "The dwarven smiths of Gurhak shoe the crown's heavy horse and sell their iron at a price both sides have written down."
 03_zaraken_t18_heartland_tt:0 "We or our subjects hold every territory in the five districts of the #G Golden Foothills#!: #G Kashan#!, #G Shizar#!, #G Zarqan#!, #G Zakaria#!, and #G Hajar#!."
 03_zaraken_t18_title_tt:0 "The #Y Neo-Zaraken Empire#! can be crowned. We must still have a #Y Zaraken#! primary culture and at least one city, we must not have formed another nation, and no other realm can already hold the title."

 03_zaraken_kashan_offers_tt:0 "Send a vassalage offer to each independent ruler at peace who still holds land in #G Kashan#! among #Y Surena#!, #Y Zadrakata#!, and #Y Bontdutg#!."
 03_zaraken_kashan_accept_tt:0 "We become a vassal of [SCOPE.sCountry('zaraken_kashan_sender').GetName|Y] and keep our territories under their overlordship."
 03_zaraken_kashan_refuse_tt:0 "We remain independent and send our refusal to [SCOPE.sCountry('zaraken_kashan_sender').GetName|Y]."
 03_zaraken_kashan_accepted_tt:0 "[SCOPE.sCountry('zaraken_kashan_recipient').GetName|Y] is now our vassal. Any Kashan garrisons it holds count toward #Y Kashan Under One Banner#!."
 03_zaraken_kashan_refused_tt:0 "[SCOPE.sCountry('zaraken_kashan_recipient').GetName|Y] declined vassalage. Our claims in #G Kashan#! still stand."
 me_zaraken.134.t:0 "A Place on the Pay Roll"
 me_zaraken.134.desc:0 "The herald from [SCOPE.sCountry('zaraken_kashan_sender').GetName|Y] asks to see the garrison's pay roll. When our treasurer brings it out, the herald sets the crown's offer beside it. We may keep our posts and our own officers if we swear to serve under the seal of #G Kyaxares#!. The men who guard the crossings will have their names entered on the crown's rolls.\n\nOur captain has counted how many weeks he can still pay the watch from the ford tolls. He asks us to take the offer while the men still answer to him. The elders ask who will settle the tolls once the crown has a claim on their service. The herald has left his copy of the terms on the table for our seal."
 me_zaraken.134.a:0 "Seal the terms. We will hold our posts for Kyaxares."
 me_zaraken.134.b:0 "Return the terms. Our officers will answer to us."
 me_zaraken.135.t:0 "The Seal Returns"
 me_zaraken.135.desc:0 "The herald has come back from [SCOPE.sCountry('zaraken_kashan_recipient').GetName|Y] with a sealed oath and a copy of the garrison's roll. Its officers are to keep their posts, and the quartermaster asks that the next issue of pay bear our seal. He has left the old names on the list so the men who call the muster will know where to begin.\n\nAt the crossing, the captain has asked for a copy to keep beside the toll receipts. If our riders come for service in the night, he wants the men on the gate to know whose orders they carry."
 me_zaraken.135.a:0 "Send the captain his copy."
 me_zaraken.136.t:0 "The Warrant Comes Back"
 me_zaraken.136.desc:0 "Our herald has come back from [SCOPE.sCountry('zaraken_kashan_recipient').GetName|Y] with our terms still unsealed. At the crossing he paid the same toll on his return as he had on his way out, and the captain who took the silver told him that the watch would still take its orders from home.\n\nOur clerk has set the returned warrant beside the claims already entered for #G Kashan#!. The captain of the escort asks for the toll receipt before he goes. It gives the name of the officer who held the crossing when our offer was refused."
 me_zaraken.136.a:0 "File the warrant with our claims."

 03_zaraken_yamhad_offer_tt:0 "Send the terms to #Y Yamhad#!. An AI ruler has a #Y 30%#! chance to accept and a #Y 70%#! chance to refuse. If accepted, we pay #Y 200 Gold#!, gain direct control of #G Gurhak#!, and take the remaining holds as a vassal. If we still hold #G Avestan#! when Yamhad accepts, it also gains #Y $zaraken_toll_ledger_mod$#! for #Y 10 years#!. If refused, we keep our gold and gain #Y $zaraken_toll_grievance_mod$#! for #Y 5 years#!."
 03_zaraken_yamhad_accept_tt:0 "Receive #G 200 Gold#! and cede #G Gurhak#! to [SCOPE.sCountry('zaraken_yamhad_sender').GetName|Y]. We keep our other territories as a vassal and move our capital if it is at Gurhak."
 03_zaraken_yamhad_decline_tt:0 "Keep our lands and our independence. The Zarakens keep their silver and gain #Y $zaraken_toll_grievance_mod$#! for #Y 5 years#!."
 03_zaraken_yamhad_accepted_tt:0 "#G Gurhak#! is under our direct rule and #Y Yamhad#! is our vassal. If we hold #G Avestan#!, its market gains #Y $zaraken_toll_ledger_mod$#! for #Y 10 years#!."
 03_zaraken_yamhad_declined_tt:0 "Yamhad keeps #G Gurhak#!. We have paid no gold and gain #Y $zaraken_toll_grievance_mod$#! for #Y 5 years#!."
 me_zaraken.137.t:0 "Silver for the Toll House"
 me_zaraken.137.desc:0 "The herald from [SCOPE.sCountry('zaraken_yamhad_sender').GetName|Y] has asked our treasurer how many chests it would take to move the accounts out of #G Gurhak#!. His master offers silver for the town and protection for the other holds, provided we seal an oath of vassalage. The herald has brought a tally of the silver for the treasurer to check.\n\nThe old toll clerk asks where he is to keep the ledgers if we agree. There is room for them in another hold, says the treasurer, and enough silver in the offer to pay the men who will carry them. The gate captain asks us to send the herald home with his tally, since whoever holds Gurhak will be the one to decide what a wagon owes."
 me_zaraken.137.a:0 "Take the silver and send for carts."
 me_zaraken.137.b:0 "Return the tally. The toll house stays with us."
 me_zaraken.138.t:0 "The Keys to the Toll House"
 me_zaraken.138.desc:0 "The last cart of Yamhad's court rolled out of #G Gurhak#! with the old toll ledgers packed under its seat. The gate captain waited for it to clear the crossing before he handed our herald the keys. He had kept the key to the strongroom separate and told the herald which lock it fitted.\n\nThe merchant-king has sworn for the holds that remain to him. The clerks at #G Avestan#! ask for a copy of the terms so they can write down what a wagon owes before it sets out. The wagoner who first brought in the receipts has agreed to take the copy up himself."
 me_zaraken.138.a:0 "Give the wagoner the new account."
 me_zaraken.139.t:0 "The Toll Still Stands"
 me_zaraken.139.desc:0 "The herald has come home with the tally for the silver still folded in his purse. The merchant-king gave it back before the treasurer had finished counting, and at the gate the clerk asked the herald to pay for the shoes on his escort's horses. He paid and brought the receipt to #G Avestan#!.\n\nThe captain has asked for a copy of the receipt with the time of day written beside it. While the wagoners argue over who will pay on the next crossing, he means to find out when the watch at Gurhak changes."
 me_zaraken.139.a:0 "Let the captain have his copy."
