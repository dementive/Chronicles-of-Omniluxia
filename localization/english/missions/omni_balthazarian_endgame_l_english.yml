l_english:
 ob_balthazaria_beacon_tt: "#G Balthazaria#! has at least #Y 2 Forts#! and its province has at least #Y 500 Food#! in reserve."
 ob_ridkiath_beacon_tt: "#G Ridkiath#! is the state capital,  has a #Y Fort#! and its province has at least #Y 300 Food#! in reserve."
 ob_beacon_fort: "Fort of the Beacon Line"
 desc_ob_beacon_fort: "The watch knows which fire calls for relief. Provisions are kept inside the walls so that a garrison can hold while the next station answers."
 ob_sword_beacon_orders: "The Sword Master's Signal Orders"
 desc_ob_sword_beacon_orders: "The captains know which orders to obey when the fires go up, and the companies have drilled together under the Sword seal."
 ob_wardens_beacon_orders: "The Wardens' Signal Orders"
 desc_ob_wardens_beacon_orders: "The wardens can send the nearest companies as soon as a signal is confirmed, and dispatch riders carry word ahead to clear the roads."
 # ------------------------------------------------------------------ tasks
 ob_task_26: "Every Brother Must Choose"
 ob_task_26_DESC: "The chapter has heard the warrants, and the captains know the seals may part. Call the brothers one at a time and ask whose orders they will answer. The clerk can close the roll once three have sworn before the Faith seal."
 ob_task_14_DESC_war: "The #T Order#! has divided. Two banners fly over the borderland forts, both carrying the arms of #Y Yvius Balthazar#!, and the towers along the passes are going dark while the companies march against one another. End the #R civil war#!, hold #G Balthazaria#!, and make peace with the frontier before the drow notice how few fires are burning."
 ob_task_28: "The Beacons Of The Borderland"
 ob_task_28_DESC: "A warning from #G Ridkiath#! takes a day to reach #G Balthazaria#! by horse in good weather. The wardens have marked hills from which they can pass a fire signal all the way to the chapter. Fortify both ends of the line, fill their provincial stores, and keep enough men in reserve to answer a call. If either province runs short of space, its cities can build granaries. Once the line is tested, decide whose order will bring the companies out."
 ob_task_29: "The Deep Host"
 ob_task_29_DESC: "[ROOT.GetCountry.Custom('ob_task_29_description')]"
 ob_task_29_DESC_revealed: "The watchfires are lit, and the towers above #G Mount Balthazar#! can see one another again. The brothers have orders to hold the roads until the scouts learn whether a Drow host is coming up them."
 ob_task_29_DESC_active: "The #R Deep Host#! is in the field. Bring its war to an end and secure #G Balthazaria#!, where the chapter will take the captains' accounts."
 ob_task_30: "Where Both Masters Fell"
 ob_task_30_DESC: "Both masters fell at #G Kiaguthmajnnorr#! in 996 LC. If we, a subject, or an ally hold the field, carry the roll of the dead there and restore the cairn. If we have no passage when the task finishes, read the names at #G Balthazaria#!."
 ob_task_19_DESC_revealed: "Once the Order has earned the Shannah's regard, the Faith Master can carry the warrants and watch rolls to #G Ddu-Nuinop#!. The Sword Master will keep the house during the journey. The chapter must reckon with whatever orders were signed while the Faith seal was away."

 # ------------------------------------------------------------------ tooltips
 ob_owned_great_temple_tt: "Own a territory with a #Y Great Temple#!."
 ob_owned_training_camp_tt: "Own a territory with a #Y Training Camp#!."
 ob_gathering_support_unlocked_tt: "Unlocks the #Y Call to Chapter#! character interaction. Characters who swear before the Faith seal will not join a rival chapter."
 ob_summons_return_tt: "The chapter settles the charter of the northern watch."
 ob_seal_sworn_requirement_tt: "At least #Y 3#! characters at court have #Y sworn before the Faith seal#!."
 ob_civil_war_won_tt: "The contest for the seal has ended and no rival chapter remains in the field."
 ob_armories_deep_host_tt: "Equip the relief companies from the chapter armories."
 ob_relief_deep_host_tt: "Train the relief companies to respond when the watchfires are lit."
 ob_towns_deep_host_tt: "Enter the sworn towns' contributions to the watch in the permanent rolls."
 ob_deep_host_warning_tt: "The watch will face the #R Deep Host#! within #Y 3 to 6 months#! if a drow realm can send it."
 ob_deep_host_resolved_tt: "The war with the #R Deep Host#! has ended, or the muster passed without an invasion."
 ob_shannah_favor_50_tt: "Have at least #Y 50 Favor#! with the reigning #Y Shannah#!."
 ob_favor_gain_10_tt: "Gain #G 10 Favor#! with the #T Shannah#!. The #Y Sword Master#! gains nothing while the retinue is away."
 ob_whole_account_tt: "The account changes Favor by #G +10#! if Lanuthua was burned, #R -10#! if he is still chained, or #G +5#! otherwise. The account warns the See about the roads beneath the mountain."
 ob_half_account_tt: "#G +5 Favor#!. The account leaves out what lies beneath the mountain."
 ob_rebuke_tt: "Spend #Y 15 Favor#!. The Sword Master loses loyalty. A rebuke keeps otherwise loyal frontier officers from following him and strengthens the Faith seal's case before the See."
 ob_letters_burned_tt: "No change in Favor. The names in the letters are remembered, and they can be read aloud in the rebel camp if the chapter divides."
 ob_faith_petition_tt: "#R -10 Favor#!. The See blesses the Faith seal's claim to answer for the whole Order."
 ob_sword_forced_tt: "#R The Sword Master has forced the issue.#! #Y Every Brother Must Choose#! is recorded as complete: there is no time left to call the brothers."
 ob_effect_300_c_tt: "#Y Costs 30 Favor.#! If the Palace has rebuked the Sword Master, or the chapter leans toward the Faith (#Y Sword support 1 or less#!), the legate rules for the Faith seal: the rival is sent to #G Ddu-Nuinop#! for penance, a sworn brother takes the Sword seat, and the Order loses #R 3 manpower#! as his household companies leave. Otherwise the rival defies the legate, the #R civil war#! begins, and the rival chapter is #R excommunicated#!."
 ob_effect_305_a_tt: "The dispute over the seals has ended without a war. A #Y legate's seat#! may be written into the covenant."
 ob_effect_306_a_tt: "The rival chapter is #R excommunicated#!. Helluvian realms will think less of it."
 ob_effect_307_a_tt: "The rival chapter now carries the campaign. Completed work of the old Order is kept."
 ob_dark_tower_tt: "One fortified post loses #Y The Common Watch#!."
 ob_lanuthua_bargain_tt: "Lanuthua names the road the host will use. The brothers do not like the price."
 ob_letters_read_tt: "Two officers of the rival chapter come back to the Faith seal."
 ob_effect_700_a_tt: "End the war with the #R Deep Host#! and hold #G Balthazaria#!. Decisions for the war may now be available."
 ob_effect_703_a_tt: "#Y The Deep Host#! can now be completed."
 ob_swords_of_hellas_tt: "#G The Swords of Hellas#! join the Order: 4 heavy infantry, 2 heavy cavalry and 2 archers. They return home when the Deep Host is resolved."
 ob_herulian_levies_tt: "#G Herulian levies#! join the Order: 6 light infantry and 2 light cavalry. They return home when the Deep Host is resolved."
 ob_lanuthua_gone_tt: "Lanuthua is gone from the chapel below Nimzur."

 # ------------------------------------------------------------------ interaction
 ob_call_to_chapter: "Call to Chapter"
 ob_call_to_chapter_desc: "Ask this brother to swear before the Faith seal. Costs #Y 25 Gold#!. Loyal brothers and frontier brothers are more likely to swear; a refusal strengthens the #Y Sword Master#!."
 ob_call_to_chapter_act: "Call this brother to the chapter."
 ob_call_to_chapter_act_past: "$COUNTRY$ has called $CHAR$ to the chapter."
 ob_call_to_chapter_past: "Called to the chapter"

 # ------------------------------------------------------------------ decisions
 ob_call_omostthanat: "Call the Omostthanat"
 ob_call_omostthanat_desc: "Ask the #T Shannah#! to proclaim the Order's war against the #R Deep Host#! a sacred cause. The #Y Swords of Hellas#! will march north. Costs #Y 40 Favor#!."
 ob_lanuthua_road: "Bargain with Lanuthua"
 ob_lanuthua_road_desc: "The chained thing below #G Nimzur#! knows where the host will come up. It has asked for a window facing north."
 ob_herue_levies: "Call Herue's Levies"
 ob_herue_levies_desc: "The king beneath our seal owes the watch his levies. Pay their marching wages and call them in."

 # ------------------------------------------------------------------ units
 ob_frontier_companies_name: "The Frontier Companies"
 ob_deep_host_name: "The Deep Host"
 ob_swords_of_hellas_name: "The Swords of Hellas"
 ob_herulian_levies_name: "The Herulian Levies"
 ob_deep_host_wargoal: "The Deep Host"
 war_goal_ob_deep_host_wargoal: "The Deep Host"

 # ------------------------------------------------------------------ modifiers
 ob_faith_master_abroad: "The Faith Master at Ddu-Nuinop"
 desc_ob_faith_master_abroad: "The Faith Master is away at the Apostolic Palace, and the second seal sits in the chapter strongbox."
 ob_seal_sworn: "Sworn Before the Faith Seal"
 desc_ob_seal_sworn: "This brother has sworn before the chapter to stand with the Faith seal if the Order divides."
 ob_banners_furled: "The Banners Furled"
 desc_ob_banners_furled: "Both banners hang in the chapter hall again. The widows of the winter war receive the same pension as the widows of Kiaguthmajnnorr."
 ob_rebel_desertion: "Deserters on the Ice"
 desc_ob_rebel_desertion: "Men who accepted the amnesty are walking home across the frozen fords."
 ob_legate_seal: "The Legate's Seal"
 desc_ob_legate_seal: "A legate of the Shannah sits in the chapter with a third seal. He signs nothing, but both masters know he is reading."
 ob_lanuthua_road_mod: "Lanuthua's Road"
 desc_ob_lanuthua_road_mod: "The captains know where the host will come up, because the thing below Nimzur told them."
 ob_deep_host_broken: "The Deep Host Broken"
 desc_ob_deep_host_broken: "The north remembers the winter the watchfires held."
 ob_masters_cairn: "The Masters' Cairn"
 desc_ob_masters_cairn: "Both seals of the Order are set in the stones above the masters who fell here."

 # ------------------------------------------------------------------ the summons
 ob_order.600.t: "A Letter from Ddu-Nuinop"
 ob_order.600.desc: "The courier from #G Ddu-Nuinop#! has ridden through three changes of horses, and he will not surrender his satchel until the Faith Master, [ROOT.GetCountry.GetRuler.GetName|Y], comes down to the gate in person. The seal belongs to the #T Shannah#!, [ROOT.GetCountry.MakeScope.GetVariable('ob_charter_shannah').GetCharacter.GetName|Y], and the summons beneath it names [ROOT.GetCountry.GetRuler.GetFirstName] alone. It says nothing of the chapter, and nothing of the Sword Master. The last master of the Order called to the #Y Apostolic Palace#! went to answer for the hospices, and the clerks remember that he came home with a lighter purse and a longer list of obligations.\n\n[ROOT.GetCountry.GetCoRuler.GetName|Y] reads the letter twice before handing it back. 'Go, by all means. Somebody must keep the watch while the Faith goes visiting.' The stewards want the Faith Master to travel with a proper retinue, gifts for the Palace, and a fair copy of the accounts, because the See remembers who arrives empty-handed. The captains would sooner see the second seal locked in the chapter strongbox, where both masters can see it, and the journey made quickly by a pilgrim with nothing to sign."
 ob_order.600.a: "Take the retinue, the gifts, and every page of the accounts."
 ob_order.600.b: "Go as a pilgrim. The seal stays in the strongbox."

 ob_order.601.t: "Beneath the Apostolic Palace"
 ob_order.601.desc: "The audience hall is colder than the chapter house at #G Balthazaria#!, although the braziers burn all day and the floor has been swept twice since dawn. [ROOT.GetCountry.GetRuler.GetFirstName] waits among petitioners from the southern sees until a deacon calls the name of the #T Order#!, and by the time the Faith Master reaches the dais the #T Shannah#! already holds a copy of the roll of the dead from #G Kiaguthmajnnorr#!.\n\n'Your brothers send me receipts instead of hymns,' the Shannah says, 'and I am told the receipts are honest. Tell me how the Order fares, Faith Master.' [ROOT.GetCountry.Custom('ob_summons_inquiry')] [ROOT.GetCountry.Custom('ob_summons_host')] [ROOT.GetCountry.Custom('ob_summons_lanuthua')] The chamberlain's pen has stopped moving, and the petitioners behind the rail have gone quiet enough to hear the answer."
 ob_order.601.a: "Tell the whole account, the thing below Nimzur included."
 ob_order.601.b: "Speak of the victories. The rest belongs to the chapter."
 ob_summons_inquiry_open: "The Shannah has read the accounts we sent to the towns after the inquiry, and asks whether the brothers who signed for the missing wagons still command companies."
 ob_summons_inquiry_shield: "The Shannah knows the inquiry closed its books on the officers who signed for the missing wagons, and asks whether the widows were told why."
 ob_summons_inquiry_other: "The Shannah asks what became of the reserve that never reached the masters, and who in the chapter has answered for it."
 ob_summons_host_prevented: "The Palace has heard that our brothers burned the Drow storehouses beside the wagon road before the first host could march. The Shannah wants to know how many came back."
 ob_summons_host_dispersed: "The Palace has also heard that the early host broke apart before it reached our fields, and the Shannah wants to know whether the chapter thinks it will gather again."
 ob_summons_host_pending: "The Shannah has heard that the wardens are keeping watch on the roads beneath the mountain, and asks what the Order has done to prepare the forts."
 ob_summons_host_fought: "The Shannah asks where the first host took the road, which courts met it, and what their towns have asked of us since."
 ob_summons_lanuthua_chained: "Then, almost in passing, the Shannah asks whether it is true that the Order keeps a dead brother in chains below #G Nimzur#!."
 ob_summons_lanuthua_burned: "Then, almost in passing, the Shannah asks whether it is true that the Order burned a dead brother on a pyre below #G Nimzur#!."
 ob_summons_lanuthua_none: "Then the Shannah asks what the brothers found under the mountain, and whether they have told anyone else."

 ob_order.602.t: "The Chamberlain's Ledger"
 ob_order.602.desc: "On the last evening before the charter is read, the Palace chamberlain asks [ROOT.GetCountry.GetRuler.GetFirstName] to walk with him through the archive. He stops at a shelf of northern correspondence, draws out three letters bound with a cord, and lays them open beneath the lamp. The hand belongs to a frontier clerk, but the seal at the foot of each page is the Sword seal, and every letter asks the See to recognize one master over the brotherhood.\n\n'His Holiness has not answered them,' the chamberlain says, 'and he would prefer not to. Brothers who write to Ddu-Nuinop about one another usually end by writing about a war.' A rebuke from the Palace would reach every chapel in the north before the snows, although the See will expect gratitude in proportion. The letters could also go into the brazier tonight, with no one at #G Balthazaria#! the wiser. Or [ROOT.GetCountry.GetRuler.GetFirstName] could ask the Shannah to bless a single seal, held by the hand now resting on the ledger."
 ob_order.602.a: "Ask His Holiness for a rebuke."
 ob_order.602.b: "Burn them. Remember every name."
 ob_order.602.c: "Then let the See bless one seal, and let it be mine."

 ob_order.604.t: "The Chapter Hears the Charter"
 ob_order.604.desc: "The bells of #G Balthazaria#! ring the Faith Master through the gate half a year after the courier first rode in. The road north was slower than the road south, because every chapel along the way wanted to hear what the Palace had said, and [ROOT.GetCountry.GetRuler.GetFirstName] told each of them a little less than the one before.\n\nThe chapter strongbox is waiting in the hall with the clerks beside it. [ROOT.GetCountry.Custom('ob_sword_absence')]"
 ob_order.604.a: "Open the strongbox. Count what the house spent while I was gone."
 ob_sword_absence_loyal: "The seal is where it was left, under the same wax. [ROOT.GetCountry.GetCoRuler.GetName|Y] kept the watch, paid the garrisons, and signed nothing that needed two hands. Whatever the letters in the Palace archive asked for, the man who sent them has kept his oath at home."
 ob_sword_absence_moved: "The seal is where it was left, but the muster rolls are not. [ROOT.GetCountry.GetCoRuler.GetName|Y] has brought three frontier companies down to the chapter town 'to keep the roads safe for the Faith Master's return', and their captains have taken lodgings near the hall. None of them has unpacked."
 ob_sword_absence_forced: "The wax on the strongbox is new. [ROOT.GetCountry.GetCoRuler.GetName|Y] held a muster in his own name while the Faith Master was away, and the captains who answered it have already sworn to follow the Sword seal. The chapter will not be given time to call the brothers one by one."


 # ------------------------------------------------------------------ call to chapter
 ob_order.620.t: "Sworn Before the Seal"
 ob_order.620.desc: "[SCOPE.sChar('ob_called').GetName|Y] comes to the chapter hall at the hour appointed and kneels on the same stone where the founders took their oaths. The clerk reads the words slowly, because the brother has asked him to, and when they are finished [SCOPE.sChar('ob_called').GetFirstName] lays a hand on the Faith seal and repeats them without looking at the page.\n\nThe witnesses sign their names below his. If the chapter divides, this brother has already said where he will stand."
 ob_order.620.a: "Enter his name in the roll."
 ob_order.621.t: "An Empty Chair"
 ob_order.621.desc: "The chair set out for [SCOPE.sChar('ob_called').GetName|Y] is still empty when the bell for the third hour stops ringing. A boy arrives at last with a note. The brother sends his respects, and regrets that duties on the frontier keep him from the chapter.\n\nThe duties in question were assigned by the Sword Master the evening before. By supper the captains know that a brother was called and did not come, and several of them are drinking to his health."
 ob_order.621.a: "Note the empty chair."
 ob_order.622.t: "The Chapter Has Been Called"
 ob_order.622.desc: "The clerk lays the roll beside the warrants from the hospice hearing. A man who has signed will have his name read aloud if either master calls the companies out under a separate seal. [ROOT.GetCountry.Custom('ob_chapter_lean')]\n\nThe clerk asks for leave to close the book and put it with the muster rolls. Both masters know what they will find there when the next order is read."
 ob_order.622.a: "Seal the roll and keep it with the warrants."
 ob_chapter_lean_faith: "The Faith seal has enough support for the clerk to close the roll."
 ob_chapter_lean_split: "Three names carry the Faith seal. The captains who still answer to the Sword Master have left their places open."

 # ------------------------------------------------------------------ muster
 ob_order.640.t: "The Beacons of the Borderland"
 ob_order.640.desc: "At dusk a fire goes up above #G Ridkiath#!. The keeper at the next station covers his lamp and opens it twice, and the answer travels down the hills to #G Balthazaria#! before the horses have been saddled. The wardens know the line works. They have asked for written orders about who can call out the reserve when the signal is real.\n\nThe Sword Master wants the captains to answer to him so he can send the companies on a single command. The wardens ask to keep the signal codes themselves. Their proposal lets the nearest company march as soon as a warning is confirmed, while runners bring word to the chapter."
 ob_order.640.a: "Let the Sword Master call out the reserve"
 ob_order.640.b: "Let the wardens dispatch the nearest companies"
 ob_sword_beacon_reinforcements_tt: "If the Sword Master rebels, he can use the beacons to call up #R 4 additional cohorts#!. This also increases support for his seal."
 ob_wardens_beacon_reinforcements_tt: "The wardens can deny the Sword Master #Y 3 cohorts#! if he rebels. This also reduces support for his seal."

 # ------------------------------------------------------------------ the ultimatum
 ob_order.16.c: "Keep both seats, and give the Shannah's legate a third seal in the chapter."
 ob_order.300.c: "Lay the ordinance before the Shannah's legate. Let Ddu-Nuinop judge the seals."
 ob_completion_13_rival_victory: "The Sword Master took the seal in the civil war. The surviving brothers must still decide who will command the watch and hear the towns when they bring their claims."
 ob_completion_13_arbitrated: "The legate of the #T Shannah#! has judged the seals. The rival master has gone south to do penance at #G Ddu-Nuinop#!, and a sworn brother now holds the Sword seat."

 ob_order.305.t: "The Legate Rules"
 ob_order.305.desc: "The legate arrives with two deacons and no soldiers, and he asks for the chapter hall to be cleared of everyone who carries a sword. It takes the captains most of a morning to decide whether to obey. When they do, the legate reads the ordinance aloud, then the letters from the Palace archive, and then the Shannah's judgment, which is shorter than either.\n\n[ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] will go south to do penance at #G Ddu-Nuinop#!, and his household companies will go with him. A brother who has sworn before the Faith seal takes the Sword seat that evening. Nobody in the hall raises a hand against the decision, although several of the departing captains stop at the door to look back at it."
 ob_order.305.a: "Thank the legate, and find him a room near the hall."

 ob_order.306.t: "The Legate Is Refused"
 ob_order.306.desc: "The legate reads the Shannah's judgment from the chapter steps because the rival captains will not let him into the hall. When he reaches the end, [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName]'s heralds answer that the See has no seat in the chapter and never has, and by nightfall the frontier companies have left the town with their banners uncased.\n\nThe legate does not wait for the fighting. Before he rides south he nails a second letter to the chapel door, and by the end of the week every priest in the north is reading it aloud. The rival chapter is outside the communion of #T Hellas#!, and so is anyone who marches under its banner."
 ob_order.306.a: "Then we march under the other one."

 ob_order.307.t: "The Banners Change Hands"
 ob_order.307.desc: "The war between the chapters is over, and the seal of the old Order hangs from the belt of the man who demanded it. The clerks who kept the chapter book at #G Balthazaria#! have carried it to the new master's camp, because the rolls of the dead and the warrants of the hospice belong to the brotherhood and not to either banner.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] orders the book opened to the last entry and reads it aloud. The watch still needs its towers, Herue still needs its peace, and the drow are still under the mountain. Whoever holds the seal now holds those obligations with it."
 ob_order.307.a: "Then let the new seal answer for them."

 # ------------------------------------------------------------------ winter of two banners
 ob_order.650.t: "Brothers on the Ice"
 ob_order.650.desc: "The ford below the borderland forts has frozen hard enough to carry a horse, and on the third morning a rider from the rival camp walks his mount halfway across and waits. He has come to ask for the bodies of two brothers killed in a skirmish the week before. He also asks, more quietly, what the Faith seal would offer a man who came home.\n\nThe captains on our bank are divided. An amnesty paid in coin would empty more tents in the rival camp than a battle, and many of the men across the ice are cousins of the men holding the ford. Some of our own officers would rather take the envoy prisoner and remind the frontier which chapter keeps its prisoners."
 ob_order.650.a: "Return the bodies. Offer every man who crosses back his pay."
 ob_order.650.b: "Take the envoy. Send the bodies back with him in the spring."
 ob_order.651.t: "The Hospice Opens to Both"
 ob_order.651.desc: "The hospice steward, the same man who once stood before the chapter with an empty grain sack, has opened his doors to the wounded of both banners. His sisters lay men from the frontier companies beside men from the chapter guard, and when the captains complain he shows them the exemption that keeps the hospice under the Faith seal.\n\nWhat the steward does with that exemption depends on what the chapter decided when the warrants were heard. Men remember who fed their brothers in the hard winter, and some of them will remember it when they are well enough to choose a camp."
 ob_order.651.desc_no_hearing: "The first men carried to the hospice come from the chapter guard, and the sisters are still cutting the boots off one of them when a cart from the frontier companies stops at the door. The steward sends a boy to fetch two more pallets from the storehouse, then asks the carter to help him lift the men inside.\n\nA wounded brother asks whether the man on the next pallet will be sent back to the other camp as soon as he can walk. The steward tells him that both men can stay until they are fit to travel, and their companies can send for them when that day comes."
 ob_order.651.a: "The steward has not forgotten the exemption we honored."
 ob_order.651.b: "Both banners will leave the hospice stronger."
 ob_order.652.t: "The Prisoner Below Nimzur"
 ob_order.652.desc: "The gaoler at #G Nimzur#! sends word that the prisoner has asked to see you. When you come down to the chapel, #Y Lanuthua#! is standing at the end of his chain with frost on his collar. He has heard the bells ring for a muster and then go quiet, and he knows what it means when a brotherhood rings for war and no one rides north.\n\n'Your towers are going dark,' he says. 'The ones below the mountain can count them as well as I can. I know the road they will take when they come, and I know where it comes up.' He wants nothing for it but a window facing north. The brothers on guard would sooner brick up the chapel and leave him to the ice."
 ob_order.652.a: "Give him his window. Write down every word."
 ob_order.652.b: "Double the chains. We will find the road ourselves."
 ob_order.653.t: "The Letters Read Aloud"
 ob_order.653.desc: "A brother who used to copy accounts for the hospice slips into the rival camp with a list of names, and on the next feast day he stands up at the camp chapel and reads them. They are the names from the letters in the Palace archive, the captains who asked #G Ddu-Nuinop#! to give one master the whole brotherhood while promising the chapter they wanted nothing of the kind.\n\nSome of the men in that chapel had marched because they believed the Sword seal was defending the old covenant. By morning two of their officers have ridden across to our lines with their companies' muster rolls."
 ob_order.653.a: "Receive them, and burn the list."
 ob_order.654.t: "The Watchfires Go Out"
 ob_order.654.desc: "The tower above #G Nordmajnng#! has been dark for eleven nights. Its garrison marched south to answer a muster, though nobody at the post can say which master's muster it was, and the shepherds who used to bring the watch their milk have started driving their flocks down from the high pastures early. Another tower in the borderland has gone dark since, and the reports that should reach the chapter from the passes now arrive at whichever camp is nearer.\n\nThe brothers on both sides of this war swore the same oath to the same frontier. While they hold the fords against one another, the roads beneath #G Mount Balthazar#! go unwatched, and the #R Drow#! have always been patient listeners. The quartermaster asks for an order to relight the towers. Both camps have told him the men will come back when the war is over."
 ob_order.654.a: "Enter the dark tower in the chapter report."

 # ------------------------------------------------------------------ the deep host
 ob_order.700.t: "The Ice Opens"
 ob_order.700.desc: "The watch at #G Mount Balthazar#! sends its warning in the third hour of the night. By dawn the wardens have woken the chapter house and unsealed the stores. Scouts report that the Drow have taken the lower road.\n\nThe captains have put the watch roll beside their map. They ask the chapter to send to any courts that owe us men before the road closes. [ROOT.GetCountry.Custom('ob_lanuthua_offer')]"
 ob_order.700.a: "Light every fire. Send the riders."
 ob_lanuthua_offer_chained: "Below #G Nimzur#!, the gaoler reports that the prisoner has been standing at the end of his chain since the fires went up, facing north."
 ob_lanuthua_offer_spent: "Lanuthua named the road long ago, and the captains are waiting for the host where he said it would come up."
 ob_empty_line: ""

 ob_order.703.t: "The Ice Closes"
 ob_order.703.desc: "The last drow company has gone back down the road it came up, or into the snow beside it, and the brothers who held the cave mouth are being relieved for the first time since the fires were lit. The chapter surgeons are still counting. The quartermasters have started to count too, because the stores that were filled before the alarm are nearly empty.\n\n[ROOT.GetCountry.Custom('ob_deep_host_outcome')]"
 ob_order.703.a: "Relieve the cave watch. Then count the dead."
 ob_deep_outcome_broken: "#G Balthazaria#! held through the war. The wardens have brought a list of the men who kept its gates and the households that fed them."
 ob_deep_outcome_bitter: "The enemy took #G Balthazaria#! during the war. The wardens are still counting the households that need a roof before winter."

 ob_order.704.t: "The Road Beneath Is Empty"
 ob_order.704.desc: "The watch at the cave mouth has kept the fires lit for a season, and the road beneath the mountain is still empty. Scouts who went down as far as the deeper Drow storehouses found the doors torn off and only the bones of pack animals within.\n\nWhatever power gathered below has gone elsewhere or broken apart. The captains are not sure whether to be relieved, and most of them have asked to keep the watch anyway."
 ob_order.704.a: "Keep the fires lit."

 ob_order.705.t: "The Bells of Balthazaria"
 ob_order.705.desc: "[ROOT.GetCountry.Custom('ob_deep_host_homecoming')]\n\nBy the gate a brother waits with the roll of #G Kiaguthmajnnorr#! tucked inside his coat. He was the rider who brought word that both masters had fallen. It took him three days to get home, and by then the families had gathered at the gate to ask which of their sons were coming down the road behind him.\n\nHe asks for leave to go back to the cairn. The heralds can ride ahead, and if a lord bars the way, they can lay the Order's claim to the field before him. The brother has only one thing to add. 'Let me bring them better news this time.'"
 ob_order.705.a: "Ring the bells. Send the heralds ahead to Kiaguthmajnnorr."
 ob_deep_homecoming_broken: "The wardens carry the #R Deep Host's#! standard through the gates of #G Balthazaria#!, and the gatekeeper steps aside with the muster roll under his arm. When the watchfires went up, he had the gate open before dawn, and by the time the Drow reached the walls the relief company had taken its posts. The quartermaster is comparing the roll with the list from the hospice, while a baker who carried bread up to the men that morning waits to hear whether her son was brought down with the wounded.\n\nIn the square the captain spreads the captured maps on a table. The first sheet shows our walls, and on the next the roads are marked as far as the southern sees, with a day's march between each town. He asks the heralds to carry word as far as the maps go, so that the towns on them will know where the Host stopped."
 ob_deep_homecoming_bitter: "The gates of #G Balthazaria#! are ours again, though one hangs low enough to drag a furrow through the street. The first woman to come home steps through the breach beside it with her house key still on a cord around her neck. Beyond the wall lie the wrecks of wagons the #R Deep Host#! meant to drive south, their axles burned through. A warden offers the woman his arm. She asks him to help her find her door."
 ob_deep_homecoming_absent: "The scouts come out from beneath #G Mount Balthazar#! with frost on their beards and a bundle of dry torches they never had to light. There are storehouses below big enough to feed an army all the way to the southern sees. They found the doors torn off and the floors swept bare. In #G Balthazaria#! the families who have been sleeping inside the walls begin to hitch their carts. One by one they ask the wardens whether they can take the road home."

 ob_order.710.t: "The Swords of Hellas"
 ob_order.710.desc: "The proclamation reaches #G Balthazaria#! ahead of the soldiers who march behind it. The #T Shannah#! has declared the Order's war against the #R Deep Host#! an #T Omostthanat#!, and from the balcony of the #Y Apostolic Palace#! every Helluvian realm has been told whose watchfires are burning in the north.\n\nThe Swords of Hellas arrive a fortnight later with their own chaplains and their own supply carts. Their captain brings his muster roll to the chapter and asks where his men will be most useful, and makes it plain that he will be going home as soon as the host is broken."
 ob_order.710.a: "Give them the eastern passes."

 ob_order.711.t: "A Window Facing North"
 ob_order.711.desc: "The masons cut the window in a single night, and #Y Lanuthua#! stands at it until dawn with the frost thickening on his chains. Then he talks. He names the cave where the host will come up, the hour it will move, and the gallery where its commander keeps her stores, and the clerk writes it all down while the brothers on guard keep their hands on their swords.\n\nIn the morning the cell is empty. The chains lie on the floor in a frozen ring, and the window is too narrow for a cat. The gaoler swears he never closed his eyes."
 ob_order.711.a: "Send his words to the captains. Brick up the window."

 # ------------------------------------------------------------------ the cairn
 ob_order.750.t: "Where Both Masters Fell"
 ob_order.750.desc: "The brothers find the cairn at #G Kiaguthmajnnorr#! by the stones that have fallen from it. The banner they wedged between the top courses has rotted, but a strip of its binding remains and the symbol of the [ROOT.GetCountry.GetName|T] can clearly be seen. Now that the place has been confirmed beyond a doubt, the soldiers worked together to rebuild the shrine without speaking, completing the sacred rituals of the Order and purifying the site in holy silence.\n\n[ROOT.GetCountry.Custom('ob_cairn_seals')] The clerk has brought the same roll the widows asked to see during the inquiry. He will read every name before the chapter closes the mortar over its mark."
 ob_order.750.desc_local: "The clerk unfolds the roll at #G Balthazaria#!. There was no passage to #G Kiaguthmajnnorr#!, so the wardens have hung the companies' banners above the chapter doors and invited the families inside. A few have brought the letters their brothers sent before the march. They keep them folded until the clerk reaches the names they came to hear.\n\nWhen the reading ends, the eldest warden asks for a copy to keep with the watch rolls. When the road is open again, the next company sent that way will know whose cairn it passes."
 ob_order.750.a: "Let the clerk read every name."
 ob_cairn_seals_two: "The Faith Master and the Sword Master have ridden out together, each carrying a seal of the Order, and they stand on either side of the cairn as the masters they succeeded once stood on either side of the chapter."
 ob_cairn_seals_one: "The Lord Protector has ridden out with both seals of the old Order in a single case, because there is no one else left to carry the second one."

 # ------------------------------------------------------------------ endings and report
 ob_ending_seal_rival_victory: "The Sword Master took the seal in the winter of two banners, and with it he took charge of the towers his companies had left behind. The clerk keeps the muster rolls of both chapters in the same book now. When families come to ask for the wages of the dead, he asks which company each man served in and looks him up."
 ob_ending_seal_yielded: "The seal changed hands without a war. The chapter records that the Faith Master yielded it rather than set brother against brother, and the frontier has not decided whether that was wisdom or surrender."
 ob_ending_seal_arbitrated: "The seals were judged by a legate of the #T Shannah#!, and the rival master went south to do penance. The brothers still argue over whether the chapter gave away too much to keep the peace."
 ob_ending_seal_excommunicated: "The rival chapter defied the See and was cast out of the communion before it was beaten in the field. Its banners hang in the chapter hall with the excommunication nailed beneath them."
 ob_ending_seal_war: "The seal was kept by force of arms in the winter of two banners. The widows of that war receive the same pension as the widows of #G Kiaguthmajnnorr#!."
 ob_ending_seal_quiet: "The demand for sole command found no army to carry it, and the seals are still divided by office rather than by war."
 ob_ending_see_rebuke: "At #G Ddu-Nuinop#!, the Faith Master asked for a rebuke and got one. The See remembers the favor."
 ob_ending_see_letters: "The letters from the Palace archive were burned, but not before every name in them had been remembered."
 ob_ending_see_petition: "The Faith Master went to #G Ddu-Nuinop#! and asked the See to bless one seal. The Palace has not forgotten the request, and neither has the frontier."
 ob_ending_see_none: "The chapter ratified the Covenant in Balthazaria. The captains will answer for the watch before the same court that hears the towns."
 ob_ending_deep_absent: "The #R Deep Host#! never came. The watchfires still burn above #G Mount Balthazar#!, and the brothers who keep them are not sure whether they are guarding a road or a grave."
 ob_ending_deep_bitter: "The #R Deep Host#! took #G Balthazaria#! during the war. The lower town is still putting roofs back on its houses."
 ob_ending_deep_broken: "The #R Deep Host#! has left the roads, and the wardens of #G Balthazaria#! have brought the names of the men who kept them through the war."
 ob_ending_lanuthua_vanished: "In the chapel below #G Nimzur#!, the chains still lie in a frozen ring under a bricked-up window."
 ob_ending_lanuthua_chained: "Below #G Nimzur#!, the gaoler still checks the chains twice at every change of the guard."
 ob_report_deep_active: "\n\n#T The Deep Host#! #R is in the field.#! End its war and hold #G Balthazaria#!."
 ob_report_deep_resolved: "\n\n#T The Deep Host#! has been resolved."
 ob_both_masters_tt: "Both the #Y Faith Master#! and the #Y Sword Master#! must be free to attend the hearing."
 ob_no_disloyal_brothers_tt: "No adult character at court has loyalty below #Y 40#!."
 ob_chapter_houses_tt: "The capital has a #Y Temple#! where the chapter can hear the covenant."
 ob_deep_outcome_absent: "No host came up the road. The scouts who went down to the deeper Drow storehouses found them empty, and the captains have not decided whether that is a mercy or a warning."
 ob_aftermath_arbitrated: "The legate of the #T Shannah#! settled the contest before any blood was spilled. The brothers who followed the departed master are waiting to learn whether the See's judgment protects them as well."
 ob_task_31: "Iron For The Watch"
 ob_task_31_DESC: "The new Winter Watch is drawing spears from the old armory. They have been mended so often the smiths refuse to put their mark on them. Bring iron into the chapter towns, by the caravans from the south or from mines of our own, and set the smiths to work beside a training ground. What they make can go to the watch, or to the Herulian merchants who have offered to buy it."
 ob_iron_supply_tt: "We import #Y Iron#!, or own at least #Y 2#! territories that produce it."
 ob_watch_armories: "The Watch Armories"
 desc_ob_watch_armories: "Every company of the watch draws its spears and mail from the chapter forges."
 ob_order.760.t: "Iron for the Watch"
 ob_order.760.desc: "The first ingots come up the road to the chapter towns on a frosty morning, and by nightfall the smiths have lit their forges to fill the Winter Watch's first orders. The quartermaster has the old armory rolls open on his bench. Half the spears listed there are broken, and the mail is so patched that most of it is held together by the patches.\n\nThe smiths can turn out spearheads and mail for every relief company before the next alarm, and the captains are already lining up the men who will wear it. The Herulian merchants have also sent an offer. They will pay well for worked iron, now that the roads are safe enough to carry it, and the chapter's treasury has not been full since the masters fell."
 ob_order.760.a: "Arm the watch first. The markets can wait."
 ob_order.760.b: "Sell the iron to Herue, and buy time with the silver."
 ob_task_19_DESC_local: "The chapter must give the watch a charter under its own authority. Bring the warrants to a temple and have the northern stewards name the court that will hear complaints against our captains."
 ob_order.604.desc_local: "The wardens have brought the watch rolls to the chapter for the last hearing. The clerk has copied the warrants into the new book and left space for the charter beneath them.\n\nThe stewards ask the chapter to name the court that will hear complaints against the watch. Its captains must have an answer before they take their orders back to the forts."
 ob_order.604.b: "Read the charter to the chapter."
 ob_summons_lanuthua_missing: "The Shannah asks what became of the prisoner from #G Nimzur#! and whether anyone kept a copy of his account."
 ob_task_29_DESC_absent: "The scouts have come back from the lower road. The chapter can hear their account and settle which garrisons will remain on the watch."
 ob_task_29_DESC_resolved: "The host's war has ended. Keep #G Balthazaria#! in the Order's hands and hear the wardens' accounts in the chapter hall."
 ob_order.700.desc_adopted: "The captains have brought their reports from the war already being fought against the Drow. The scouts have traced the Drow supply wagons back to the lower road beneath the mountain. The wardens recognize the route from the reports that led them to light the beacons.\n\nThe chapter will keep the watch under arms until that war ends. Its envoys can still call on any courts that owe the Order service. [ROOT.GetCountry.Custom('ob_lanuthua_offer')]"
 ob_ending_constitution_legate: "The two masters take the rolls proper to their offices. Between their benches the legate keeps a copy of the covenant, where either master can ask him to read it aloud."
 ob_ending_see_local: "The charter was written under the chapter's seal. Its captains bring their accounts to the same court that hears the towns."
 ob_ending_see_whole: "The See has a copy of the whole account, including the names that the chapter once kept under seal."
 ob_ending_see_half: "The See received an account of the victories. The other pages are kept in the chapter book."
 ob_ending_lanuthua_burned: "The gaoler below #G Nimzur#! has put away the chain that held Lanuthua. The captain still changes the watchword every winter."
 ob_ending_cairn_seals: "At #G Kiaguthmajnnorr#!, the two seals of the chapter lie in the mortar above the masters' cairn."
 ob_ending_cairn_seal: "At #G Kiaguthmajnnorr#!, the Lord Protector's seal lies in the mortar above the masters' cairn."
 ob_ending_cairn_local: "The names read at #G Balthazaria#! are kept with the watch rolls, where every captain who takes the road toward #G Kiaguthmajnnorr#! can find them."
