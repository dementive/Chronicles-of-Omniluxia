l_english:
 ob_task_32: "The Night Landing"
 ob_task_32_DESC: "Three small isles lie off the northern coast. On the largest of them, [GetProvince('(int32)6069').GetName|G], the lamp-lords keep a great moon-glass lamp that can be seen for thirty miles on a clear night, and they light it for any ship that pays. For northern hulls the lamp stays dark and the harbor chain stays up. For hooded buyers off unmarked ships, who never set foot on the quay by daylight and pay for their amber in a pale silver that has never seen the sun, it is lit a mile out. The wardens of the northern watch know those hoods. They have been killing the #R Drow#! under them for as long as there has been a watch.\n\nA declared war would be heard in every harbor between [GetProvince('(int32)870').GetName|G] and the open sea, and the lamp-lords would have their friends on the quay before the herald had finished reading. The Order's oath forbids a lie. It has never said anything about the dark. Gather #Y ten ships#! and #Y 5000 men#!, and take [GetProvince('(int32)6068').GetName|G], [GetProvince('(int32)6069').GetName|G] and [GetProvince('(int32)6070').GetName|G] in a single night, without a declaration. [GetProvince('(int32)6069').GetName|G] must be held by a country that is not controlled by a player."
 ob_task_32_rewards_tt: "Three days after this task is complete, the fleet sails dark for the #G Qasuda Isles#!, provided [GetProvince('(int32)6069').GetName|G] is still held by a country that is not controlled by a player. By dawn, [GetProvince('(int32)6068').GetName|G], [GetProvince('(int32)6069').GetName|G] and [GetProvince('(int32)6070').GetName|G] will belong to the Order. An isle held by a player is left alone."
 ob_isle_ai_held_tt: "[GetProvince('(int32)6069').GetName|G] must be held by a country that is not controlled by a player."

 ob_isle_night_landing: "The Night Landing"
 desc_ob_isle_night_landing: "Every brother who crossed to the isles that night tells the story the same way, and none of them tells it well, which is how the recruits know it is true. Nothing in the dark has much to say to a man who has walked up the Moon-Stair at a walking pace with the Psalm in his mouth."
 ob_isle_chapter_garrison: "Chapter Garrison"
 desc_ob_isle_chapter_garrison: "A company of the Order keeps the Amber Quay. The brothers stand their watches by the cutters' bell, trim the moon-lamp at dusk, and eat from the Amber Ladle on market days. They pay for every bowl, which the cutters still find astonishing."
 ob_isle_amber_charter: "The Amber Charter"
 desc_ob_isle_amber_charter: "The chapter's seal sits beside the cutters' mark at the foot of every contract written on the quay. The Order's clerks are slow and they are honest, and the cutters have not yet decided which of the two is more inconvenient."

 ob_isle.1.t: "Three Stones on the Chart"
 ob_isle.1.desc: "The chart table at [GetProvince('(int32)870').GetName|G] was cleared down to a single map, and before the night was out the map had been cleared down to three islands. Through the window, the #T Clay Hawk#! ran its thin stream into the basin on the tower wall, and the watch changed twice while nobody in the room said anything worth writing down.\n\nThe captains had brought what the letters had not. A northern hull that came within sight of [GetProvince('(int32)6069').GetName|G] found the moon-lamp dark and the harbor chain raised, and was told by a polite voice across the water that the roads were closed for the tide. It was a very regular tide, and it closed only for ships that flew the Order's colors. One captain had kept a coin of the pale silver the hooded buyers paid with. He put it on the table, and the clerks looked at it the way men look at a spider in the bread.\n\n[ROOT.GetCountry.GetRuler.GetName|Y], [ROOT.GetCountry.Custom('ob_isle_ruler_title')], turned it over once with a fingertip. A declaration of war would be heard in every harbor from the Hawk to the open sea, and by the time it had finished being heard the lamp-lords would have sent for help, and the help would have come up out of the dark. The chapter's oath forbids a lie. It has never said anything about the night.\n\n[SCOPE.sChar('ob_isle_sword').GetName|Y], [ROOT.GetCountry.Custom('ob_isle_sword_title')], set three stones on the map. There was one for [GetProvince('(int32)6068').GetName|G], where the fishermen sleep beside their nets, one for [GetProvince('(int32)6070').GetName|G], where the fur-trappers sleep beside their dogs, and a larger one for [GetProvince('(int32)6069').GetName|G], where nobody would be sleeping for long. Ten ships, five thousand men, and the new moon. All that remained was to decide where to put them ashore. [ROOT.GetCountry.Custom('ob_isle_sword_title_cap')] already had an opinion on that, and was waiting with great courtesy to be asked."
 ob_isle.1.a: "Row in under the chain, and take the Amber Quay from the water."
 ob_isle.1.a.tt: "The fleet will make for the harbor of [GetProvince('(int32)6069').GetName|G] and go in under the chain at low water. It sails three days after this task is complete."
 ob_isle.1.b: "Land under the sea-cliffs, and come at the Moon-Stair from above."
 ob_isle.1.b.tt: "The fleet will land on the shingle under the sea-cliffs of [GetProvince('(int32)6069').GetName|G] and climb through the sea-caves to the head of the Moon-Stair. It sails three days after this task is complete."

 ob_isle.2.t: "The Fleet Sails Dark"
 ob_isle.2.desc: "They sailed on the new moon, and nobody in the harbor was told. The lanterns were shuttered and their wicks pulled. The oarlocks were packed with tallow and wrapped in sheepskin, and the ships' bells were taken down from their brackets and stowed in the holds among the salt pork, where they could not ring even if the sea asked them to. The brothers came aboard after dark, five thousand of them in ten hulls, with their mail dulled under ash and oil and their scabbards bound in wool. Each of them touched the stone of the harbor wall going past, as the Order always has, and none of them said the blessing aloud.\n\nBy the second watch the light of the #T Clay Hawk#! had gone down into the sea behind them. The sailing master was an Errfalian of sixty winters who had been told where they were bound only after the breakwater was behind him. He went below to look at the chart, came up again, spat over the lee rail, and took the tiller from the steersman without a word. Nobody argued. On the decks the brothers sat in rows with their shields across their knees and worked their edges with oiled stones, slowly, so that the sound would not carry over the water, and the whole fleet made a noise like a cat cleaning itself.\n\nThe youngest brother aboard the lead ship was sixteen and had never been to sea. He was sick twice over the side, very quietly, and then asked the man beside him whether the elves of the isles were really as fast as people said. The man beside him was the captain of the first company, a broad veteran of the northern watch with a face like a split log, and he considered the question for some time. He said that they were faster, and that it would not help them, and went back to his whetstone."
 ob_isle.2.desc_harbor: "\n\nThe course ran straight for the harbor mouth of [GetProvince('(int32)6069').GetName|G], where the chain hangs between two squat towers. 'It sags at the bottom of the ebb,' the sailing master said, to nobody in particular. 'Low enough for a longboat, if the men in her lie flat and nobody sneezes.' He looked along the rows of brothers sitting in the dark. 'Somebody tell them about the sneezing.'"
 ob_isle.2.desc_caves: "\n\nThe course ran wide of the harbor and around to the seaward face of [GetProvince('(int32)6069').GetName|G], where the cliffs stand three hundred feet straight out of the water and no pilot with any sense has ever taken a ship. 'There's a shingle at the foot of them that the tide leaves bare for an hour and no longer,' the sailing master said, 'and caves above it that go up into the hill like a chimney. My grandfather told me about them.' Somebody asked what his grandfather had been. 'A wrecker,' said the sailing master. 'A good one.'"
 ob_isle.2.a: "Run dark, and trust the sailing master."
 ob_isle.2.a.tt: "The fleet reaches the isles in two days. Nobody has told [SCOPE.sChar('ob_isle_lord').GetName|Y], and nobody in the fleet means to."

 ob_isle.3.t: "The Moonless Shore"
 ob_isle.3.desc: "There was no moon, and the lamp-lords of [GetProvince('(int32)6069').GetName|G] had told themselves for a thousand years that nobody would be mad enough to come ashore without one.\n\nTwo ships had already peeled away into the dark toward [GetProvince('(int32)6068').GetName|G], and two more toward [GetProvince('(int32)6070').GetName|G], where the fishermen and the trappers would wake to find grey cloaks standing quietly in their doorways, apologizing for the hour. The other six came on toward the main isle with their oars barely touching the water. When the boats went in they went in together, close enough for a man in one to touch the oar of the next. The first company went over the gunwales waist-deep into water so cold it stopped the breath, and waded in with their shields held over their heads, and nobody cursed. In a company of the northern watch that is a kind of miracle.\n\n[SCOPE.sChar('ob_isle_sword').GetName|Y] went up the shingle first and alone, and stood for a long moment with one hand on the pommel of a sword and the cold wind coming down off the black bulk of the island. Somewhere above, a nightbird called and was answered. [ROOT.GetCountry.Custom('ob_isle_sword_title_cap')] listened to the answer, decided that it was a bird, and raised two fingers without looking back. The men behind came up out of the sea like a tide that had made up its mind."
 ob_isle.3.desc_harbor: "\n\nThe longboats went under the harbor chain at the bottom of the ebb with the brothers lying flat on the thwarts and the iron passing a hand's breadth above their noses, dripping weed. Nobody sneezed. Beyond it the Amber Quay lay in a long dark curve, its booths shuttered, and high above the town the great moon-lamp stood unlit on its crag at the head of the Moon-Stair. Between the boats and the lamp there were nine hundred steps, a post of sentinels at the top of them, and a signal-lamp that would wake the whole island."
 ob_isle.3.desc_caves: "\n\nThe shingle was exactly where the wrecker's grandson had said it would be, and the tide gave them exactly the hour he had promised. The caves went up into the hill as he had described, wet and black and as narrow as a throat, and the brothers climbed them by touch, passing their shields up from hand to hand. Near the top a draught came down the shaft that smelled of lamp-oil. They came out of the rock among the roots of an old pine, above and behind the sentinels' post at the head of the Moon-Stair. It had been built a thousand years ago to watch the sea, and had never once been asked to look over its shoulder."
 ob_isle.3.a: "Quietly. Knives, wool, and not a word."
 ob_isle.3.a.tt: "The brothers take the outer posts by hand, one sentry at a time, and the isle sleeps on. Slow work in the dark has its price. #R -1000 manpower#!"
 ob_isle.3.b: "Shields locked, and let the whole isle hear us come."
 ob_isle.3.b.tt: "The Order comes ashore in force and makes no secret of it. The sentinels of the Moon-Stair will be awake, and waiting. #R -2000 manpower#!"

 ob_isle.4.t: "The Sentinels of the Moon-Stair"
 ob_isle.4.desc: "The Moon-Stair climbs from the back of the Amber Quay to the crag where the great lamp stands. It is nine hundred steps cut into the living rock, each one worn into a shallow bowl by a thousand years of feet. At the top, in the lee of the lamp-pillar, the lamp-lords keep a post of sentinels, and the sentinels are the oldest thing on the island after the stair.\n\nThey are #Y Ascendic#! elves of a line that was keeping this watch before there was any Order to keep out. They are tall, grey-eyed and unhurried. They draw bows of white ash that a strong man of the north can barely bend, and wear short curved blades that have been known to go through a helm and the head inside it without the wielder appearing to make any effort at all. It is said on the isles that the sentinels have never once been surprised, and until that night it was quite true. There were eleven of them on the high landing, with a shuttered signal-lamp at their feet that would wake every house on the island in the time it takes to draw a breath."
 ob_isle.4.desc_silent: "\n\nThe first of them died without knowing it. The brother who took him had come the last twenty feet on his belly over the wet rock, and rose behind him like a piece of the dark standing up. The sentinel opened his mouth and the cold went into it, and that was all. The second and third went the same way, so quietly that the fourth, a few paces off, turned his head only because the wind had changed.\n\nHe was very fast. He had an arrow on the string and loosed before the brothers had covered half the distance, and the brother in front took it through the cheek-guard and died on his feet. He drew again and killed the man behind. Then he dropped the bow, drew his blade, and went for the signal-lamp. Three more steps and the shutter would have been open.\n\n[SCOPE.sChar('ob_isle_sword').GetName|Y] got there in two. There was a single exchange of blows, which the brothers who saw it describe in very different ways and with great feeling, and then the sentinel was on the stones with his blade some distance away, and [ROOT.GetCountry.Custom('ob_isle_sword_title')]'s boot was resting gently on the shutter of the lamp. The rest of the post had seen it all. They looked at their fallen comrade, and then at the three hundred men coming up the stair behind him in perfect silence, at a walk, not hurrying at all. The eldest of them was a sensible elf of a very old line. He unstrung his bow and laid it on the step at his feet.\n\nThe signal-lamp was never lit. [ROOT.GetCountry.Custom('ob_isle_sword_title_cap')] had it carried down the stair afterward, still shuttered, and gave it to the clerks."
 ob_isle.4.desc_loud: "\n\nThey were waiting, of course. The brothers had come ashore with their shields locked and their boots on the shingle like a landslide, and by the time the first company reached the foot of the stair the signal-lamp at the top was blazing and horns were sounding all over the island. The sentinels did not run. They knelt in a line across the head of the stair and began to shoot.\n\nIt was the finest archery any man in the Order had ever seen, and most of them saw it from behind a shield. The white-ash bows put shafts clean through the boards and into the arms behind them, and a brother three ranks back took one through the throat over the shoulder of the man in front. The brothers came up the stair three abreast, shields locked overhead and in front like the scales of a fish, at a walking pace. They stepped over the men who fell and closed the gaps without being told. The sentinels emptied their quivers, refilled them from the store at the lamp-pillar and emptied them again, and still the shields came up the stair at a walk.\n\nTwo hundred steps from the top, a brother with a shaft through his thigh sat down, snapped it off at the skin, said something short about the sentinels' mothers, and stood up again. The sentinels' captain watched this. He lowered a bow that had killed nineteen men that night and said something to the elf beside him in the high tongue of the isles. A brother who had a little of that tongue reported afterward that it had been: they are not stopping. By then the shields were at the landing. The sentinels drew their blades and died on the top step, every one of them, facing the right way."
 ob_isle.4.a: "Over the crag, and down onto the Amber Quay."
 ob_isle.4.a.tt: "The Moon-Stair belongs to the Order. The road down into the town of [GetProvince('(int32)6069').GetName|G] lies open, and the garrison of the isles is waiting at the bottom of it."

 ob_isle.5.t: "The Amber Quay"
 ob_isle.5.desc: "The Amber Quay of [GetProvince('(int32)6069').GetName|G] is a long curve of cut stone. The cutters' booths stand shuttered along its landward side, the broth-pot of the #Y Amber Ladle#! sits cold on its iron stand halfway down, and the hall of the lamp-lords stands at its head. The garrison of the isles had formed across it from the water to the booths. Four hundred spears of the lamp-lords' guard stood in white lacquered mail, their pikes as long as a ship's yard, and behind them a rank of lamp-mages stood with their hands raised and moon-glass burning at their throats. The air in front of the line shimmered like heat over a summer road, and a brother who put his hand into it lost the feeling in it to the wrist.\n\nThey were magnificent, and every man of the Order who saw them said so afterward, usually while describing what happened next. The guard's captain stood out in front of the pikes, bareheaded and silver-haired, and spoke across the stones in a clear northern without a trace of accent. She said that the quay had not been taken in eleven hundred years, and that she would be grateful if the northerners would make the attempt quickly, since there would be a great deal of cleaning to do before the market opened.\n\nThe captain of the first company had stood nine winters on the wall above the Drow and had come home from #G Kiaguthmajnnorr#!. He looked at the pikes for some time, and at the shimmer, and at the silver-haired captain. Then he turned to the brothers behind him and said, in a voice meant to carry to the back of the street, that it was the politest thing anyone had said to him in years, and that he intended to answer it in kind."
 ob_isle.5.desc_silent: "\n\nThe garrison had been woken late, by a cutter's boy running barefoot up the quay and shouting, and half the pikemen had come into the street with their mail laced over their nightshirts. It made no difference to how they stood. The elves of the isles fight the way their grandparents danced, in perfect line and perfect measure, and an elf in lacquer over linen is still an elf with a twenty-foot pike."
 ob_isle.5.desc_loud: "\n\nThe garrison had been awake since the horns, and it had used the hour well. The pikes were dressed in a line so straight that it might have been ruled with a clerk's pen. The mages had laid their wards three deep across the stones, and a chain of fire-baskets burned along the water's edge so that the brothers would have to come at them out of the dark and into the light. The elves of the isles fight the way their grandparents danced, in perfect line and perfect measure, and that night they had had time to tune the music."
 ob_isle.5.desc_end: "\n\nThen the Order began to sing.\n\nIt was the #T Psalm of the Three Days#!, which tells how #Y Helluvius#! burned for three days in the sight of everyone and did not once cry out. The chapter sings it only when there is something worth singing it for. It is less a tune than a slow, grinding growl in the old northern tongue, sung low in the chest by thousands of men at once, and on a stone quay at night it sounds like a mountain clearing its throat. The brothers locked their shields and came on at a walk. They did not run at the pikes. They walked onto them, as the Order always has, and the points struck the shields and bent, and the line leaned into them, singing, and did not give a step.\n\nThe great pikes had been made for open ground. On a quay with the booths on one side and the water on the other they could thrust but not turn, and the brothers went in under the points one pace at a time, the way a man ducks under a low branch. After that it was iron on lacquer in the dark, and the wards went out one by one like lamps at closing time. A lamp-mage who had laid a ward of fire across the stones was found afterward sitting against a booth, quite unhurt, staring, with his hands still raised in front of him. The brothers had simply walked through it. The man at the front of the line had been on fire for several steps, and had kept singing.\n\n[SCOPE.sChar('ob_isle_sword').GetName|Y] went through the center of the elven line like a plough through a hedge. The silver-haired captain was waiting there. She was the finest fighter on the isles, and for the space of a dozen strokes the brothers nearest stopped singing to watch, for which they were later made to do penance. At the end of it she was on one knee with her pike in two pieces, and [ROOT.GetCountry.Custom('ob_isle_sword_title')] stood over her, breathing no harder than someone who has climbed a short flight of stairs, and offered her a hand.\n\nShe did not take it. What was left of the garrison, perhaps a hundred spears, had drawn back around the lamp-pillar at the end of the quay with the water at their backs, closed up, and lowered their points again. A pikeman in the front rank, very young, called out across the stones in his good northern and asked whether the brothers were devils. A brother wiping his axe on a cutter's awning told him, quite kindly, that they were the Balthazarian Order, and that the devils were the people who had been buying his amber."
 ob_isle.5.a: "Finish it. The shield-wall walks to the water."
 ob_isle.5.a.tt: "The brothers walk the last of the garrison off the end of the quay. The chapter learns a great deal tonight, and pays for every word of it. #G +10 military experience#!, #R -1000 manpower#!"
 ob_isle.5.b: "Ground shields. Let them keep their spears and their honor."
 ob_isle.5.b.tt: "[ROOT.GetCountry.Custom('ob_isle_sword_title_cap')] offers the garrison terms, and the last of them march off the quay under arms. #G +5 military experience#!"

 ob_isle.6.t: "The Lamp-Lord's Hall"
 ob_isle.6.desc: "The hall of the lamp-lords stands at the head of the Amber Quay, long and grey, with amber set into its window-frames so that by day the light inside is the color of honey. That night a single lamp was burning, and the doors stood open. [SCOPE.sChar('ob_isle_lord').GetName|Y], lord of the #G Qasuda Isles#!, had not fled. [SCOPE.sChar('ob_isle_lord').GetSheHe|U] sat in the high seat at the far end of the hall in robes of white and silver, both hands resting on its arms, as straight-backed and composed as if the next petitioner had only stepped out for a moment. A sword lay across the lamp-lord's knees. It had not been drawn.\n\n[SCOPE.sChar('ob_isle_sword').GetName|Y] came in with six brothers, stopped in the middle of the floor, took off a dented helm and set it down on the flagstones. Neither of them spoke for some time. Outside, the singing had stopped, and a gull had begun to complain about it.\n\n'Your god burned in the daylight, before the whole world,' the lamp-lord said at last. 'I had understood that the Order was proud of this. And yet you come in the dark.'\n\n'He burned in the daylight so that we would not have to,' said [ROOT.GetCountry.Custom('ob_isle_sword_title')]. 'We are not him, and we have never pretended to be.' A pause. 'You light your lamp for ships that pay in pale silver. We know where that silver comes from. The northern watch has been burying its dead on account of it since before your hall had windows.'\n\nThe lamp-lord looked down at the helm on the floor, and at the six men behind it, and at the grey beginning to show in the high windows, and for the first time looked a little tired. 'Silver is silver,' the lord said. 'Ours is a small island. We sold amber and lamp-oil to anyone who came for it, and we did not ask where they meant to burn it. I see now that we ought to have asked.' The sword was lifted from the lord's knees, laid flat across both palms, and held out. 'Well. You have come a long way in the dark to ask it for us. What does the Order mean to do with me?'"
 ob_isle.6.a: "Spare the lord, and leave the rites of the isles in their own keeping."
 ob_isle.6.a.tt: "[SCOPE.sChar('ob_isle_lord').GetName|Y] is spared and joins the Order's court as a guest of the chapter. The #Y Ascendic#! rites of the isles remain in their own keeping."
 ob_isle.6.b: "Strike the banner, and send the lord north in chains."
 ob_isle.6.b.tt: "[SCOPE.sChar('ob_isle_lord').GetName|Y] is taken into the Order's court and #R imprisoned#!, and is hurt on the voyage north: #R -25 health#!."

 ob_isle.7.t: "Dawn over Qasuda"
 ob_isle.7.desc: "The sun came up out of the northern sea, flat and gold, and found the grey banner of the Order hanging from the lamp-pillar at the end of the Amber Quay, where the stones had not yet been washed. On [GetProvince('(int32)6068').GetName|G] the fishermen had been allowed to take their boats out at first light as usual, under the eye of two brothers who sat on the jetty and mended nets for them out of boredom, very badly. On [GetProvince('(int32)6070').GetName|G] the trappers' dogs had barked at the grey cloaks all night, and then, around dawn, had gone to sleep against their legs.\n\nOn [GetProvince('(int32)6069').GetName|G] the market opened at the second hour, as it has every day for a thousand years. The amber-cutters came out from behind their shutters one by one, looked at the brothers standing at either end of the quay with their shields grounded, looked at the stains on the stones, and set out their trays without a word. Nobody was stopped. At the broth-pot of the #Y Amber Ladle#!, a cutter's widow who had kept it for twenty years lit the fire beneath it as she did every morning, and set aside the price of her first sale for the pot, as the cutters always have. Then, after some thought, she filled a bowl and carried it to the nearest brother. It was the boy from the lead ship, who had just been sick again, very quietly, behind a booth. He thanked her and paid for it, and she was so surprised that she told the whole market.\n\nA girl of seven, whose mother had not been quick enough to catch her, walked straight up to the captain of the first company and asked whether he was the one who had killed the garrison. He considered this for some time, as he considered everything. He said that he was one of them, that they had been very brave, and that she should remember that about them. She asked if she could hold his axe. He said no."
 ob_isle.7.desc_mercy: "\n\n[SCOPE.sChar('ob_isle_lord').GetName|Y] watched the market from the high window of the hall. [ROOT.GetCountry.Custom('ob_isle_sword_title_cap')] had ordered that the lamps of the isles be kept burning and that the rites at the moon-lamp go on at dusk exactly as before, and the lamp-lord noted, with something close to indignation, that the northerners trimmed the wicks better than the wardens did. On the steps below, the silver-haired captain of the guard sat with her arm in a sling, eating broth from the Ladle and watching the brothers with a professional interest she did not trouble to hide."
 ob_isle.7.desc_hardline: "\n\n[SCOPE.sChar('ob_isle_lord').GetName|Y] was taken down to the ships at noon, walking upright between two brothers with bound hands, while the furled banner of the lamp-lords was carried behind like a coffin. The lord did not look at the market, and the market did not look away. As the boat pulled out from the quay an old cutter took the shawl from her head and held it over her face, which on the isles is done for the dead, and one by one, down the whole length of the Amber Quay, the other women did the same."
 ob_isle.7.desc_end: "\n\n[ROOT.GetCountry.Custom('ob_isle_sword_title_cap')] wrote the report that night by the light of the moon-lamp, in six lines, and sent it north on the fastest hull. The chapter had lost fewer men than it had feared and more than it would have liked. The brothers had kept their oath and told no lie; they had simply said nothing until it was over. [GetProvince('(int32)6068').GetName|G], [GetProvince('(int32)6069').GetName|G] and [GetProvince('(int32)6070').GetName|G] belonged to the Order. Nobody on the mainland had known there was a war until they heard it had been won. Two weeks later, the hooded buyers came off their unmarked hull and found the great lamp lit for them a mile out, as usual, and rowed in, and were met.\n\nAt [GetProvince('(int32)870').GetName|G] the clerk who keeps the chapter rolls entered it all beneath the #T Clay Hawk#!, in a neat and unhurried hand, between one change of the watch and the next: one line of ink, and three small islands."
 ob_isle.7.a: "Garrison the quay, and keep the lamps lit."
 ob_isle.7.a.tt: "[GetProvince('(int32)6068').GetName|G], [GetProvince('(int32)6069').GetName|G] and [GetProvince('(int32)6070').GetName|G] now belong to the Order, except any isle held by a player. The Order gains #Y The Night Landing#! for #Y 10 years#! (#G +5% land morale#!, #G +5% army movement speed#!), and [GetProvince('(int32)6069').GetName|G] gains a permanent #Y Chapter Garrison#! (#G +15% local defense#!, #G +5% local pop happiness#!)."
 ob_isle.7.b: "Grant the cutters an amber charter, and sign it beside their mark."
 ob_isle.7.b.tt: "[GetProvince('(int32)6068').GetName|G], [GetProvince('(int32)6069').GetName|G] and [GetProvince('(int32)6070').GetName|G] now belong to the Order, except any isle held by a player. The Order gains #Y The Night Landing#! for #Y 10 years#! (#G +5% land morale#!, #G +5% army movement speed#!), and [GetProvince('(int32)6069').GetName|G] gains a permanent #Y Amber Charter#! (#G +5% local pop happiness#!, #G +10% local tax#!)."

