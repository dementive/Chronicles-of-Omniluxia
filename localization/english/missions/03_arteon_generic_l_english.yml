l_english:
 03_arteon_generic:0 "The Battle For Arteon"
 03_arteon_generic_DESCRIPTION:0 "For centuries, the blood of mortals and immortals alike has watered the soil of #G Arteon#!, earning it the grim mantle of the #R Island of Eternal War#!. Three factions seek to take advantage of the realm's chaos and seize the island for themselves: the #T High Elven#! invaders clinging to their shattered coastal territories, the native #T Artheousan#! warriors gathered in the interior highlands, and the fanatical #T Viktreic#! converts who conquer in the name of their battle goddess [GetDeityDefinition('omen_viza').GetName|G]. All three wage brutal warfare against one another, showing no mercy in their struggle for the upper hand.\n\nPeace has long been a foreign concept on this cursed isle. Now, as the #T Great Slaver Navies#! return to the shores and independent colonies fracture under the weight of their own ambition, the island stands poised on a razor's edge. The old rivalries that once defined this land have collapsed into a chaotic scramble for survival — and the gates of history stand wide open for any faction bold enough to seize the mantle of leadership."
 03_arteon_generic_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when we have #Y Formed Arteon#!."

 # Early Game
 03_arteon_generic_task_1:0 "Battle-Tested Warriors"
 03_arteon_generic_task_1_DESC:0 "This dark island does not forgive the unprepared. War is not a possibility on #Y Arteon#! — it is a certainty, as inevitable as the tide. [ROOT.GetCountry.GetRuler.GetName|Y] has seen to it that our armies reflect this reality: drilled, equipped, and ready for the trials ahead. Only the strong survive what is coming. We intend to be among them."
 03_arteon_generic_task_2:0 "Mercenary Contracts"
 03_arteon_generic_task_2_DESC:0 "Coin speaks a language that transcends race, religion, and faction. We shall seek out the finest mercenary companies in the land and bind them to us with lucrative contracts. The coming wars may demand strength of arms from beyond our own borders — foreign swords are an acceptable price for survival and expansion."
 03_arteon_generic_task_3:0 "Slaver Defenses"
 03_arteon_generic_task_3_DESC:0 "The black sails of the #R Great Slaver Navies#! have raided our coastlines for long enough. [ROOT.GetCountry.GetRuler.GetName|Y] has decreed that this ends now. Watchtowers, fortified harbors, and a standing fleet will meet any raider before they can reach our villages. Arteon's people are not livestock to be seized."
 03_arteon_generic_task_4:0 "Our Homeland"
 03_arteon_generic_task_4_DESC:0 "With our forces hardened and our coasts defended, the time has come to assert our sovereignty over our core territories. No empire was ever built on borrowed ground. We must first bind the heartland together before we can look beyond its borders."

 # Eptelonian Expansion
 03_arteon_generic_task_eptelon_1:0 "Eptelonian Warriors"
 03_arteon_generic_task_eptelon_1_DESC:0 "The city of [GetProvince('(int32)653').GetName|Y] has long been a nuisance — a rival port that watches our movements and shelters those who would oppose us. The time has come to turn that nuisance into an asset. Seizing it gives us a foothold on #G Eptelon#!, whose fierce and numerous population will prove a fine source of soldiers for wars to come."
 03_arteon_generic_task_eptelon_2:0 "Expeditionary Force"
 03_arteon_generic_task_eptelon_2_DESC:0 "We shall assemble a grand expeditionary force and carry the war to #Y Eptelon#! itself. Half measures will not do here — any threat to our eastern flank must be answered with overwhelming commitment of force. The island will not be taken by negotiation."
 03_arteon_generic_task_eptelon_3:0 "Refugee Labor"
 03_arteon_generic_task_eptelon_3_DESC:0 "Every war produces its displaced, and the Eptelonian campaigns are no exception. Rather than allow this tide of refugees to become a burden, [ROOT.GetCountry.GetRuler.GetName|Y] has ordered them directed toward the mines and fields of the realm. The wealth of conquest must be put to work."

 # Branch A: Artheousan
 03_arteon_generic_task_5a:0 "The Artheousan Claim"
 03_arteon_generic_task_5a_DESC:0 "The Artheousan people did not come to #Y Arteon#! as invaders — they are of this island, born from its soil and shaped by its wars. We shall assert our divine right to rule all of #T Artheon#!, but we must proceed with caution. What has been won in generations of struggle can be lost in a single reckless campaign. We advance in the name of #T Artheous#! — and with his guidance."
 03_arteon_generic_task_6a:0 "Conquer The South"
 03_arteon_generic_task_6a_DESC:0 "South Arteon has sheltered our enemies for long enough. The armies of #T Artheous#! will march from the highlands and bring the south to heel once and for all. Those who surrender will be spared. Those who resist will learn what it means to raise arms against the chosen of the war god."
 03_arteon_generic_task_arth_wyrm:0 "The Fang Of Arteon"
 03_arteon_generic_task_arth_wyrm_DESC:0 "The priests speak of the legendary #T Fang of Arteon#! — a relic said to have been carried by the first Artheousan war-king, a blade that marks its bearer as the chosen of #T Artheous#!. We shall seek it out and prove our divine right to rule. Let those who doubt the legitimacy of our claim answer that."
 03_arteon_generic_task_arth_hort:0 "Horteonian Auxiliaries"
 03_arteon_generic_task_arth_hort_DESC:0 "The Horteonians are not a sophisticated people, but they are a durable one — hardened by labor and accustomed to hardship. With the territories of [GetProvince('(int32)410').GetName|Y] and [GetProvince('(int32)425').GetName|Y] in our hands, we can draw from this reservoir of sturdy warriors to swell the ranks of our auxiliary forces."
 03_arteon_generic_task_7a:0 "Purge The Invaders"
 03_arteon_generic_task_7a_DESC:0 "The foreign invaders who have clung to the shores of #Y Arteon#! have had their time. #T Artheous#! walks alongside [ROOT.GetCountry.GetRuler.GetName|Y] into glorious battle, and the war god does not march for half-victories. Every invader must be driven into the sea. Every foreign banner must be torn down. Our island will be reclaimed in full — or not at all."
 03_arteon_generic_task_8a:0 "The First Great War Avenged"
 03_arteon_generic_task_8a_DESC:0 "The #T First Great War#! left scars on this island that have never fully healed — in the soil, in the people, and in the memory of every Artheousan who was told of what was lost. With the west secured, those scars have finally been answered. We have not erased what was done. But we have repaid it."

 # Branch B: Ascendic
 03_arteon_generic_task_5b:0 "The Ascendic Path"
 03_arteon_generic_task_5b_DESC:0 "The High Elven philosophy of #G Ascendance#! teaches that mastery of the self must precede mastery of others. [ROOT.GetCountry.GetRuler.GetName|Y] does not seek to conquer #Y Arteon#! through brute force alone — [ROOT.GetCountry.GetRuler.GetSheHe] seeks to reshape it through superior will, discipline, and the long patience of those who understand that the tide always turns in favor of those who can outlast the chaos."
 03_arteon_generic_task_6b:0 "Exploit Feuds On Arteon"
 03_arteon_generic_task_6b_DESC:0 "The factions of #Y Arteon#! have hated one another for centuries, and their ancient grudges are a resource to be mined. We shall play our enemies against one another — lending support where it weakens the stronger party, withholding it where our rivals would benefit. The island's feuds shall do our work for us, at a fraction of the cost."
 03_arteon_generic_task_7b:0 "Purge The Viza Abominations"
 03_arteon_generic_task_7b_DESC:0 "The fanatical worshippers of [GetDeityDefinition('omen_viza').GetName|G] have long terrorized the eastern reaches of #Y Arteon#! with their holy wars and their shrieking zealotry. They must be silenced. We will send the followers of the so-called victory goddess a message that they will not forget: the east belongs to the Ascendic order, and their goddess has no dominion here."
 03_arteon_generic_task_8b:0 "High Elven Supremacy"
 03_arteon_generic_task_8b_DESC:0 "Supremacy over #Y Arteon#! is no longer a distant ambition — it is a reality taking shape before us. With our fleet commanding the seas and our philosophy proven on the field of battle, the High Elven way stands poised to bring something this island has never truly known: an order that does not collapse the moment its architect dies."

 # Branch C: Viktreic
 03_arteon_generic_task_5c:0 "Viktreic Crusade"
 03_arteon_generic_task_5c_DESC:0 "A holy war shall be launched in the name of [GetDeityDefinition('omen_viza').GetName|G], who has blessed [ROOT.GetCountry.GetRuler.GetName|Y] with divine fervor and the absolute certainty that this crusade cannot fail. The unbelievers of #Y Arteon#! will have the choice of conversion or conquest. [GetDeityDefinition('omen_viza').GetName|G] does not grant second chances."
 03_arteon_generic_task_6c:0 "Funding The Faithful"
 03_arteon_generic_task_6c_DESC:0 "Holy wars require holy funds. The traders and temple-keepers of [ROOT.GetCountry.GetCapital.GetName|Y] must be organized into a supply network worthy of the goddess's campaign. With precious metals flowing through our markets and coin blessed in the temples, the crusade will never want for resources."
 03_arteon_generic_task_7c:0 "Light Of Viza"
 03_arteon_generic_task_7c_DESC:0 "The light of [GetDeityDefinition('omen_viza').GetName|G] grows stronger in [ROOT.GetCountry.GetCapital.GetName|Y] with every passing season. The great temple burns day and night, and the faithful fill the streets with song and prayer. Let the light of the goddess guide us to final victory and a peace founded on sacred law — not merely the exhaustion of the combatants."
 03_arteon_generic_task_8c:0 "Divine Judgment"
 03_arteon_generic_task_8c_DESC:0 "As foretold within the marbled halls of the temples in [ROOT.GetCountry.GetCapital.GetName|Y], the divine judgment of [GetDeityDefinition('omen_viza').GetName|G] has fallen upon the north of #Y Arteon#! — upon its blood-cursed dynasties, its ancient dark lords, and all who stood against the victory goddess. Prophecy and conquest, this day, are the same thing."

 # Shared Late Game
 03_arteon_generic_task_9:0 "[ROOT.GetCountry.Custom('get_arteon_generic_task_9_name')]"
 03_arteon_generic_task_9_DESC:0 "[ROOT.GetCountry.Custom('get_arteon_generic_task_9_desc')]"
 03_arteon_generic_task_9_slayer_name:0 "Sword Of The Vampire Slayer"
 03_arteon_generic_task_9_slayer_desc:0 "It is no secret that the #R Vampire#! kings of #Y Northern Arteon#! have endured for centuries by feeding on the living and hiding behind walls no mortal army could breach alone. [ROOT.GetCountry.GetRuler.GetName|Y] has vowed to end this ancient blight. We shall reforge the legendary blade #R Grand Illuminator#! — said to burn with a light that no creature of darkness can endure — and carry it to the north as proof that the age of the vampires is over."
 03_arteon_generic_task_9_vampire_name:0 "Sword Of The Vampire Lord"
 03_arteon_generic_task_9_vampire_desc:0 "Our dominion over #Y Northern Arteon#! grows, but an unholy rule requires a symbol of terror and blood to cement it. We shall forge the legendary blade #R Blood Drinker#! — a weapon that hungers as its master hungers — and use it to seal our covenant with darkness and strike fear into the hearts of every mortal on this island."
 03_arteon_generic_task_9_vampire_lord:0 "The Blood-Drinker Ascendant"
 03_arteon_generic_task_9_vampire_lord_DESC:0 "The forging is done. One final sacrament remains: [ROOT.GetCountry.GetRuler.GetName|Y] must take up #R Blood Drinker#! with [ROOT.GetCountry.GetRuler.GetHerHis] own hand and let #Y Arteon#! behold its true master. Once the blade is borne by a vampire sovereign, every lesser #R Vampire#! ruler on the island shall be marked for slaughter, their courts broken, their realms folded into our dark dominion. There can be only one."
 03_arteon_generic_task_10:0 "Rebuild The Cities"
 03_arteon_generic_task_10_DESC:0 "The wars have taken their toll on the cities of #Y Arteon#!. Cracked walls, burned districts, streets choked with rubble — these are the monuments that war leaves behind. [ROOT.GetCountry.GetRuler.GetName|Y] intends to replace them with something better. Ten cities rebuilt and strengthened will demonstrate that our rule is not merely one of conquest, but of stewardship."
 trigger_arteon_generic_task_10: "Own at least #Y 10#! cities on #Y Arteon#! with:\n- #G 15#! population or more\n- #G 1#! Court of Law and #G 2#! Training Camps #E or#! #G 1#! Great Temple."
 03_arteon_generic_task_11:0 "Grand Navy"
 03_arteon_generic_task_11_DESC:0 "A ruler who commands only the land is a prisoner of the shores. Our navy must be capable of projecting force far beyond our own coastline — ensuring that no foreign power can threaten #Y Arteon#! by sea, and that our trade lanes remain ours to control. Forty warships is a beginning. Let the shipwrights earn their wages."
 03_arteon_generic_task_12:0 "Fortify The Capital"
 03_arteon_generic_task_12_DESC:0 "As our borders expand, the heartland must not be left vulnerable. [ROOT.GetCountry.GetCapital.GetName|Y] shall be ringed with walls, stocked with garrisons, and backed by the full administrative apparatus of a realm prepared to weather any storm. Our enemies should look upon this capital and understand that taking it is not a plan — it is a fantasy."
 03_arteon_generic_task_13:0 "Lasting Peace"
 03_arteon_generic_task_13_DESC:0 "The #R Isle of Eternal War#! does not yield peace easily — it must be built, stone by stone, ship by ship, law by law. [ROOT.GetCountry.GetCapital.GetName|Y] stands at the edge of becoming the greatest city on the island — a true imperial capital, recognized far beyond these shores as the seat of a power that has outlasted every rival. What remains is the final act: turning military dominance into lasting governance."
 03_arteon_generic_task_14:0 "United Arteon"
 03_arteon_generic_task_14_DESC:0 "#Y Arteon#! is finally united under one glorious sovereign. The Crown of Arteon is ours by right — earned in blood, in diplomacy, in faith, and in the long endurance of those who refused to yield when lesser rulers would have broken. The #R Isle of Eternal War#! has a new name today. Let all the world learn it."

