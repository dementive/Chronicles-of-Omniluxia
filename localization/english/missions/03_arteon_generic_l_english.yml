l_english:
 03_arteon_generic:0 "The Battle For Arteon"
 03_arteon_generic_DESCRIPTION:0 "For centuries, the blood of mortals and immortals alike has watered the soil of #G Arteon#!, earning it the grim mantle of the #R Island of Eternal War#!. Three factions seek to take advantage of the realm's chaos and seek the island for themselves; the #T High Elven#! invaders clinging to their shattered coastal territories, the native #T Artheousan#! warriors gathered in the interior highlands, and the fanatical #T Viktreic#! converts that conquer in the name of their battle goddess [GetDeityDefinition('omen_viza').GetName|G]. All three factions wage brutal warfare against each other, showing each other no mercy in their attempts to gain the upper hand.\n\nPeace has long been a foreign concept on this cursed isle. Now, as the #T Great Slaver Navies#! return to the shores and independent colonies fracture under the weight of their own ambition, the island stands poised on a razor's edge. The old rivalries that once defined this land have fractured into a chaotic scramble for survival, leaving the gates of history wide open for any faction bold enough to seize the mantle of leadership."
 03_arteon_generic_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when we have #Y Formed Arteon#!."

 # Early Game
 03_arteon_generic_task_1:0 "Battle-Tested Warriors"
 03_arteon_generic_task_1_DESC:0 "In this dark island that we call our home, we must always be ready for the wars to come - it is inevitable. Only the strong will survive the coming trials in the days ahead, and [ROOT.GetCountry.GetRuler.GetName|Y] is ready for the challenge."
 03_arteon_generic_task_2:0 "Mercenary Contracts"
 03_arteon_generic_task_2_DESC:0 "We will seek out the best mercenaries in the land and offer them lucrative contracts to bolster our forces. The dark days ahead might require foreign strength of arms to secure peace at home."
 03_arteon_generic_task_3:0 "Slaver Defenses"
 03_arteon_generic_task_3_DESC:0 "For years, our defenseless territories have been raided by our many enemies - enough is enough. [ROOT.GetCountry.GetRuler.GetName|Y] has decreed that we must construct defenses against the slavers that threaten our coasts and our people."
 03_arteon_generic_task_4:0 "Our Homeland"
 03_arteon_generic_task_4_DESC:0 "With our forces ready and our coasts secured, it is time to assert our dominance in our core territories. Let us gather our homeland together before we march into neighboring provinces."

 # Eptelonian Expansion
 03_arteon_generic_task_eptelon_1:0 "Eptelonian Warriors"
 03_arteon_generic_task_eptelon_1_DESC:0 "The city of [GetProvince('(int32)653').GetName|Y] has long proven to be a nuisance, but the time has to come to turn this troublesome place into an asset. Seizing the city outright will give us a foothold on the island of #G Eptelon#! - a great source of cheap manpower for wars."
 03_arteon_generic_task_eptelon_2:0 "Expeditionary Force"
 03_arteon_generic_task_eptelon_2_DESC:0 "We shall assemble a grand expeditionary force to march upon #Y Eptelon#! and secure our claims. We cannot afford to have any threats to our east undermining our authority."
 03_arteon_generic_task_eptelon_3:0 "Refugee Labor"
 03_arteon_generic_task_eptelon_3_DESC:0 "The refugees from the Eptelonian campaigns shall be put to work in our mines and fields, fueling our economy."

 # Branch A: Artheousan
 03_arteon_generic_task_5a:0 "The Artheousan Claim"
 03_arteon_generic_task_5a_DESC:0 "We shall claim all of #Y Artheon#! as our rightful domain, but as always, we must proceed with caution - we could lose everything as quickly as we gain it.."
 03_arteon_generic_task_6a:0 "Conquer The South"
 03_arteon_generic_task_6a_DESC:0 "South Arteon must be brought under our complete control once and for all. Let us gather our armies and destroy those that oppose the will of [ROOT.GetCountry.GetRuler.GetName|Y]!"
 03_arteon_generic_task_arth_wyrm:0 "The Fang Of Arteon"
 03_arteon_generic_task_arth_wyrm_DESC:0 "We must seek out the legendary #T Fang of Arteon#! to prove our divine right to rule. With such weapons at our disposal, who would dare stand against us?"
 03_arteon_generic_task_arth_hort:0 "Horteonian Auxiliaries"
 03_arteon_generic_task_arth_hort_DESC:0 "The Horteonians are a simple yet sturdy people, suitable mostly as soldiers and labor, and will make fine additions to our auxiliary forces."
 03_arteon_generic_task_7a:0 "Purge The Invaders"
 03_arteon_generic_task_7a_DESC:0 "All who have invaded our lands must be purged in the name of #T Artheous#!, who surely walks alongside [ROOT.GetCountry.GetRuler.GetName|Y] into glorious battle against the foe. Let us cast our enemies from our shores and reclaim our home from the invader!"
 03_arteon_generic_task_8a:0 "The First Great War Avenged"
 03_arteon_generic_task_8a_DESC:0 "With the west secured, we have finally avenged the atrocities of the #T First Great War#!."

 # Branch B: Ascendic
 03_arteon_generic_task_5b:0 "The Ascendic Path"
 03_arteon_generic_task_5b_DESC:0 "Through the #G Ascendic Path#!, we shall claim our rightful place in the world."
 03_arteon_generic_task_6b:0 "Exploit Feuds On Arteon"
 03_arteon_generic_task_6b_DESC:0 "We will play our enemies against each other, exploiting their petty feuds for our political gain."
 03_arteon_generic_task_7b:0 "Purge The viza Abominations"
 03_arteon_generic_task_7b_DESC:0 "The vile abominations of the [GetDeityDefinition('omen_viza').GetName|G] worshippers must be cleansed from the east. We will send the misguided followers of the so-called victory goddess a message that they will never forget..."
 03_arteon_generic_task_8b:0 "High Elven Supremacy"
 03_arteon_generic_task_8b_DESC:0 "Our supremacy over #Y Arteon#! is growing day by day - this is clearly undeniable. With the blessing of the gods all but secured, the High Elven way shall bring peace to the #R Isle of Eternal War#!!"

 # Branch C: Viktreic
 03_arteon_generic_task_5c:0 "Viktreic Crusade"
 03_arteon_generic_task_5c_DESC:0 "A holy crusade shall be launched in the name of [GetDeityDefinition('omen_viza').GetName|G], who has promised to lead [ROOT.GetCountry.GetRuler.GetName|Y] to victory against our foes."
 03_arteon_generic_task_6c:0 "Funding The Faithful"
 03_arteon_generic_task_6c_DESC:0 "We must gather the wealth of the faithful to support our holy wars."
 03_arteon_generic_task_7c:0 "Light Of viza"
 03_arteon_generic_task_7c_DESC:0 "The Light of [GetDeityDefinition('omen_renjun').GetName|G] shall guide us to victory and prosperity."
 03_arteon_generic_task_8c:0 "Divine Judgment"
 03_arteon_generic_task_8c_DESC:0 "As has been prophesied within the marbled halls of the temples in [ROOT.GetCountry.GetCapital.GetName|Y], we have brought [GetDeityDefinition('omen_viza').GetName|G]'s divine judgment down upon the north."

 # Shared Late Game
 03_arteon_generic_task_9:0 "[ROOT.GetCountry.Custom('get_arteon_generic_task_9_name')]"
 03_arteon_generic_task_9_DESC:0 "[ROOT.GetCountry.Custom('get_arteon_generic_task_9_desc')]"
 03_arteon_generic_task_9_slayer_name:0 "Sword Of The Vampire Slayer"
 03_arteon_generic_task_9_slayer_desc:0 "It is no secret that there were kingdoms ruled by #R Vampires#! in #Y Northern Arteon#! - an abomination that [ROOT.GetCountry.GetRuler.GetName|Y] has vowed to put an end to. We must reforge the legendary blade #R Grand Illuminator#! to destroy the threat of vampirism once and for all."
 03_arteon_generic_task_9_vampire_name:0 "Sword Of The Vampire Lord"
 03_arteon_generic_task_9_vampire_desc:0 "Our dominion over #Y Northern Arteon#! is almost complete, but our unholy rule requires a symbol of terror and blood. We must forge the legendary blade #R Blood Drinker#! to seal our covenant and strike fear into the hearts of all mortals."
 03_arteon_generic_task_10:0 "Rebuild The Cities"
 03_arteon_generic_task_10_DESC:0 "The war has taken its toll. It is time to rebuild our cities greater than ever before. If [ROOT.GetCountry.GetRuler.GetName|Y] is able to extend [ROOT.GetCountry.GetAdjective] protection to a land that is war weary and tired, then all of [ROOT.GetCountry.GetName|Y] stands to benefit."
 trigger_arteon_generic_task_10: "Own at least #Y 10#! cities on #Y Arteon#! with:\n- #G 15#! population or more\n- #G 1#! Court of Law and #G 2#! Training Camps #E or#! #G 1#! Great Temple."
 03_arteon_generic_task_11:0 "Grand Navy"
 03_arteon_generic_task_11_DESC:0 "Our navy must be capable of projecting our power and strength far beyond our own shores - now that a true peace for #Y Arteon#! is on the horizon, we must ensure that foreign interests do not interfere with our affairs."
 03_arteon_generic_task_12:0 "Fortify The Capital"
 03_arteon_generic_task_12_DESC:0 "Even as our borders expand ever outward, we must not leave our heartlands vulnerable. Our beloved capital of [ROOT.GetCountry.GetCapital.GetName|Y] shall be heavily fortified."
 03_arteon_generic_task_13:0 "Lasting Peace"
 03_arteon_generic_task_13_DESC:0 "With our borders secure and our economy booming, a lasting peace can finally be achieved. [ROOT.GetCountry.GetCapital.GetName|Y] is rapidly turning into the most important city on #Y Arteon#!, a testament to our growing strength and power, and is hailed far beyond our shores as an imperial capital of great prestige."
 03_arteon_generic_task_14:0 "United Arteon"
 03_arteon_generic_task_14_DESC:0 "Arteon is finally united under one glorious empire. The Crown of Arteon is ours by right!"

