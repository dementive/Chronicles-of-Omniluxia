l_english:
 03_arteon_generic:0 "The Battle For Arteon"
 03_arteon_generic_DESCRIPTION:0 "For centuries, the blood of mortals and immortals alike has watered the soil of #G Arteon#!, earning it the grim mantle of the #R Island of Eternal War#!. Three factions seek to take advantage of the realm's chaos and seize the island for themselves: the #T High Elven#! invaders clinging to their shattered coastal territories, the native #T Artheousan#! warriors gathered in the interior highlands, and the fanatical #T Viktreic#! converts who conquer in the name of their battle goddess [GetDeityDefinition('omen_viza').GetName|G]. All three wage brutal warfare against one another, showing no mercy in their struggle for the upper hand.\n\nPeace has long been a foreign concept on this cursed isle. Now, as the #T Great Slaver Navies#! return to the shores and independent colonies fracture under the weight of their own ambition, the island stands poised on a razor's edge. The old rivalries that once defined this land have collapsed into a chaotic scramble for survival — and the gates of history stand wide open for any faction bold enough to seize the mantle of leadership."
 03_arteon_generic_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when we have #Y Formed Arteon#!."

 # Early Game
 03_arteon_generic_task_1:0 "Battle-Tested Warriors"
 03_arteon_generic_task_1_DESC:0 "This dark island does not forgive the unprepared. War is not a possibility on #Y Arteon#! — it is a certainty, as inevitable as the tide. [ROOT.GetCountry.GetRuler.GetName|Y] has seen to it that our armies reflect this reality: drilled, equipped, and ready for the trials ahead. Only the strong survive what is coming. We intend to be among them."
 03_arteon_generic_task_2:0 "Mercenary Contracts"
 03_arteon_generic_task_2_DESC:0 "Coin speaks a language that transcends race, religion, and faction. We shall seek out the finest mercenary companies in the land and bind them to us with lucrative contracts. The coming wars may demand strength of arms from beyond our own borders — foreign swords are an acceptable price for survival and expansion."
 03_arteon_generic_task_3:0 "Slaver Defenses"
 03_arteon_generic_task_3_DESC:0 "The black sails of the #R Great Slaver Navies#! have raided our coastlines for long enough. [ROOT.GetCountry.GetRuler.GetName|Y] has decreed that this ends now. Watchtowers, fortified harbors, and a standing fleet will meet any raider before they can reach our villages. #Y Arteon#!'s people are not livestock to be seized."
 03_arteon_generic_task_4:0 "Our Homeland"
 03_arteon_generic_task_4_DESC:0 "The keepers at [ROOT.GetCountry.GetCapital.GetName|Y] send out buyers whenever their bins run low, and the buyers seldom know which villages have grain to spare until they ride there. Once we or our subjects hold a whole neighboring district in our home region, its elders can send their harvest tallies ahead of the carts. The keepers will know how much room to make before the loads arrive."
 # Eptelonian Expansion
 03_arteon_generic_task_eptelon_1:0 "Eptelonian Warriors"
 03_arteon_generic_task_eptelon_1_DESC:0 "The port of [GetProvince('(int32)653').GetName|Y] on #G Eptelon#! has sheltered every captain who ever robbed our coasts, and its harbor masters sell the same news to anyone who can pay. Before our ships can land there, [ROOT.GetCountry.GetRuler.GetName|Y] must send envoys to the chiefs around the city, fit out a squadron for the crossing, and let it be known that the city's lands are ours by right."
 03_arteon_generic_task_eptelon_2:0 "Expeditionary Force"
 03_arteon_generic_task_eptelon_2_DESC:0 "We shall assemble a grand expeditionary force and carry the war to #Y Eptelon#! itself. Half measures will not do here — any threat to our eastern flank must be answered with overwhelming commitment of force. The island will not be taken by negotiation."
 03_arteon_generic_task_eptelon_3:0 "Refugee Labor"
 03_arteon_generic_task_eptelon_3_DESC:0 "Every war produces its displaced, and the #Y Eptelonian#! campaigns are no exception. Rather than allow this tide of refugees to become a burden, [ROOT.GetCountry.GetRuler.GetName|Y] has ordered them directed toward the mines and fields of the realm. The wealth of conquest must be put to work."

 # Branch A: Artheousan
 03_arteon_generic_task_5a:0 "The Artheousan Claim"
 03_arteon_generic_task_5a_DESC:0 "The #T Artheousan#! people did not come to #Y Arteon#! as invaders — they are of this island, born from its soil and shaped by its wars. We shall assert our divine right to rule all of #T Artheon#!, but we must proceed with caution. What has been won in generations of struggle can be lost in a single reckless campaign. We advance in the name of #T Artheous#! — and with his guidance."
 03_arteon_generic_task_6a:0 "Conquer The South"
 03_arteon_generic_task_6a_DESC:0 "South #Y Arteon#! has sheltered our enemies for long enough. The armies of #T Artheous#! will march from the highlands and bring the south to heel once and for all. Those who surrender will be spared. Those who resist will learn what it means to raise arms against the chosen of the war god."
 03_arteon_generic_task_arth_wyrm:0 "The Fang Of Arteon"
 03_arteon_generic_task_arth_wyrm_DESC:0 "The priests speak of the legendary #T Fang of Arteon#! — a relic said to have been carried by the first #T Artheousan#! war-king, a blade that marks its bearer as the chosen of #T Artheous#!. We shall seek it out and prove our divine right to rule. Let those who doubt the legitimacy of our claim answer that."
 03_arteon_generic_task_arth_hort:0 "Horteonian Auxiliaries"
 03_arteon_generic_task_arth_hort_DESC:0 "With [GetProvince('(int32)410').GetName|Y] and [GetProvince('(int32)425').GetName|Y] in our hands, the #Y Horteonian#! chieftains of the north will soon come to [ROOT.GetCountry.GetCapital.GetName|Y] to learn what our rule asks of their people. They have worked other men's fields and fought other men's wars for generations, and they will want to know which of the two we have in mind."
 03_arteon_generic_task_7a:0 "Purge The Invaders"
 03_arteon_generic_task_7a_DESC:0 "The foreign invaders who have clung to the shores of #Y Arteon#! have had their time. #T Artheous#! walks alongside [ROOT.GetCountry.GetRuler.GetName|Y] into glorious battle, and the war god does not march for half-victories. Every invader must be driven into the sea. Every foreign banner must be torn down. Our island will be reclaimed in full — or not at all."
 03_arteon_generic_task_8a:0 "The First Great War Avenged"
 03_arteon_generic_task_8a_DESC:0 "The #T First Great War#! left scars on this island that have never fully healed — in the soil, in the people, and in the memory of every #T Artheousan#! who was told of what was lost. With the west secured, those scars have finally been answered. We have not erased what was done. But we have repaid it."

 # Branch B: Ascendic
 03_arteon_generic_task_5b:0 "The Ascendic Path"
 03_arteon_generic_task_5b_DESC:0 "The #Y High Elven#! philosophy of #G Ascendance#! teaches that mastery of the self must precede mastery of others. [ROOT.GetCountry.GetRuler.GetName|Y] does not seek to conquer #Y Arteon#! through brute force alone — [ROOT.GetCountry.GetRuler.GetSheHe] seeks to reshape it through superior will, discipline, and the long patience of those who understand that the tide always turns in favor of those who can outlast the chaos."
 03_arteon_generic_task_6b:0 "Exploit Feuds On Arteon"
 03_arteon_generic_task_6b_DESC:0 "The factions of #Y Arteon#! have hated one another for centuries, and their ancient grudges are a resource to be mined. We shall play our enemies against one another — lending support where it weakens the stronger party, withholding it where our rivals would benefit. The island's feuds shall do our work for us, at a fraction of the cost."
 03_arteon_generic_task_7b:0 "[ROOT.GetCountry.Custom('get_arteon_east_settlement_name')]"
 03_arteon_generic_task_7b_DESC:0 "[ROOT.GetCountry.Custom('get_arteon_east_settlement_desc')]"
 03_arteon_generic_task_8b:0 "[ROOT.GetCountry.Custom('get_arteon_ascendic_capstone_name')]"
 03_arteon_generic_task_8b_DESC:0 "[ROOT.GetCountry.Custom('get_arteon_ascendic_capstone_desc')]"
 arteon_east_orthodox_name:0 "Purge The Viza Abominations"
 arteon_east_orthodox_desc:0 "The fanatical worshippers of [GetDeityDefinition('omen_viza').GetName|G] have long terrorized the eastern reaches of #Y Arteon#! with their holy wars and their shrieking zealotry. They must be silenced. We will send the followers of the so-called victory goddess a message that they will not forget: the east belongs to the #T Ascendic#! order, and their goddess has no dominion here."
 arteon_east_two_altars_name:0 "The Eastern Compact"
 arteon_east_two_altars_desc:0 "The families who keep both feasts at [GetProvince('(int32)662').GetName|Y] have sent cousins east with word of our settlement. The ward elders ask whether their own priests will be allowed to keep the shrine keys when the eastern towns answer to our court. Give those towns a reason to bring us their rolls with the names still on them."
 arteon_ascendic_orthodox_name:0 "High Elven Supremacy"
 arteon_ascendic_orthodox_desc:0 "The #Y High Elven#! masters have sent clerks to the eastern towns to take down their dues, and the clerks have asked for quarters in the capital for the households that will come to serve them. They want a court that can hear a petition without calling for the garrison. Once the east is quiet enough for them to sit, the captains can turn their attention north."
 arteon_ascendic_two_altars_name:0 "A Court For Both Altars"
 arteon_ascendic_two_altars_desc:0 "The eastern elders have begun bringing their petitions to [ROOT.GetCountry.GetCapital.GetName|Y], where the clerks still keep the two feast days on separate tablets. The elders ask us to set the promise we made at home under the crown's seal, so their children can point to it when the captains and the priests who heard it are gone."

 # Branch C: Viktreic
 03_arteon_generic_task_5c:0 "Viktreic Omostthanat"
 03_arteon_generic_task_5c_DESC:0 "A holy war shall be launched in the name of [GetDeityDefinition('omen_viza').GetName|G], who has blessed [ROOT.GetCountry.GetRuler.GetName|Y] with divine fervor and the absolute certainty that this Omostthanat cannot fail. The unbelievers of #Y Arteon#! will have the choice of conversion or conquest. [GetDeityDefinition('omen_viza').GetName|G] does not grant second chances."
 03_arteon_generic_task_6c:0 "Funding The Faithful"
 03_arteon_generic_task_6c_DESC:0 "Holy wars require holy funds. The traders and temple-keepers of [ROOT.GetCountry.GetCapital.GetName|Y] must be organized into a supply network worthy of the goddess's campaign. With precious metals flowing through our markets and coin blessed in the temples, the Omostthanat will never want for resources."
 03_arteon_generic_task_7c:0 "Light Of Viza"
 03_arteon_generic_task_7c_DESC:0 "The light of [GetDeityDefinition('omen_viza').GetName|G] grows stronger in [ROOT.GetCountry.GetCapital.GetName|Y] with every passing season. The great temple burns day and night, and the faithful fill the streets with song and prayer. Let the light of the goddess guide us to final victory and a peace founded on sacred law — not merely the exhaustion of the combatants."
 03_arteon_generic_task_8c:0 "Divine Judgment"
 03_arteon_generic_task_8c_DESC:0 "The companies sent out under the banner of [GetDeityDefinition('omen_viza').GetName|G] have been asking for a place to keep their provisions north of the home roads. Secure #Y Malasam#!, and the temple wardens can send the next wagons to men who have somewhere to unload them."
 03_arteon_generic_task_atheus_grave:0 "Lay Atheus To Rest"
 03_arteon_generic_task_atheus_grave_DESC:0 "The #T Grave of Atheus#! lies in our treasury, and the priests have argued over it since the day it arrived. Some want the sarcophagus of the conqueror who began #Y Arteon#!'s long wars broken where the whole city can watch, the captains would rather keep it where our enemies can see who holds it, and the treasury clerks have already found buyers for its grave goods."
 arteon_generic_task_atheus_grave_tt:0 "We must possess the #T Grave of Atheus#!."
 03_arteon_generic_task_campaign_writs:0 "Writs For The Four Shores"
 03_arteon_generic_task_campaign_writs_DESC:0 "The captains have brought the northern toll receipts and the rolls from the other shores to [ROOT.GetCountry.GetCapital.GetName|Y]. The heralds will carry writs wherever our claims are still missing, while the smiths set aside the iron for a blade to mark the end of the northern campaign."

 # Shared Late Game
 03_arteon_generic_task_9:0 "[ROOT.GetCountry.Custom('get_arteon_generic_task_9_name')]"
 03_arteon_generic_task_9_DESC:0 "[ROOT.GetCountry.Custom('get_arteon_generic_task_9_desc')]"
 03_arteon_generic_task_9_slayer_name:0 "Sword Of The Vampire Slayer"
 03_arteon_generic_task_9_slayer_desc:0 "The smiths have set aside the iron for #R Grand Illuminator#!, and the captains have asked them to wait until the northern houses have lost their lands. They want the blade carried through the gates in daylight, past the households that used to bar their doors when a rider came down from the keep."
 03_arteon_generic_task_9_vampire_name:0 "Sword Of The Vampire Lord"
 03_arteon_generic_task_9_vampire_desc:0 "The smiths have set aside the iron for #R Blood Drinker#!, and our envoys have taken the names of the northern houses that might answer our summons. Once the North is ours, [ROOT.GetCountry.GetRuler.GetName|Y] can receive the blade in the sight of the houses that have bent the knee."
 03_arteon_generic_task_9_vampire_lord:0 "The Blood-Drinker Ascendant"
 03_arteon_generic_task_9_vampire_lord_DESC:0 "The forging is done. One final sacrament remains: [ROOT.GetCountry.GetRuler.GetName|Y] must take up #R Blood Drinker#! with [ROOT.GetCountry.GetRuler.GetHerHis] own hand and let #Y Arteon#! behold its true master. Once the blade is borne by a vampire sovereign, every lesser #R Vampire#! ruler on the island shall be marked for slaughter, their courts broken, their realms folded into our dark dominion. There can be only one."
 03_arteon_generic_task_10:0 "Rebuild The Cities"
 03_arteon_generic_task_10_DESC:0 "The wars have taken their toll on the cities of #Y Arteon#!. Cracked walls, burned districts, streets choked with rubble — these are the monuments that war leaves behind. [ROOT.GetCountry.GetRuler.GetName|Y] intends to replace them with something better. Ten cities rebuilt and strengthened will demonstrate that our rule is not merely one of conquest, but of stewardship."
 trigger_arteon_generic_task_10: "Own at least #Y 10#! cities on #Y Arteon#! with:\n- #G 15#! population or more\n- #G 1#! Court of Law and #G 2#! Training Camps #E or#! #G 1#! Great Temple."
 03_arteon_generic_task_11:0 "Grand Navy"
 03_arteon_generic_task_11_DESC:0 "The harbor masters have hung the patrol rolls where the pilots can read them, and the merchants are already asking which ships will see their cargo past the outer headlands. The shipwrights want enough hulls to spare escorts for those passages while keeping the watch at home."
 03_arteon_generic_task_12:0 "Fortify The Capital"
 03_arteon_generic_task_12_DESC:0 "The masons have walked the walls of [ROOT.GetCountry.GetCapital.GetName|Y] with the captains, and the grain keepers have shown them where carts used to queue under fire. The smiths can arm the new garrisons, though the stewards want a permanent allowance for the men and stores that will keep them at their posts."
 03_arteon_generic_task_13:0 "Lasting Peace"
 03_arteon_generic_task_13_DESC:0 "The rolls of all four shores must come to [ROOT.GetCountry.GetCapital.GetName|Y]. Once the towns are rebuilt, the capital is fortified, and the armies have come home, the clerks can put the island's accounts in order and enter the capital among its great cities."
 03_arteon_generic_task_14:0 "United Arteon"
 03_arteon_generic_task_14_DESC:0 "#Y Arteon#! is finally united under one glorious sovereign. The Crown of #Y Arteon#! is ours by right — earned in blood, in diplomacy, in faith, and in the long endurance of those who refused to yield when lesser rulers would have broken. The #R Isle of Eternal War#! has a new name today. Let all the world learn it."

#Modifiers and Tooltips
 fang_of_arteon_treasure: "Fang of Arteon"
 fang_of_arteon_treasure_desc:0 "The priests of #T Artheous#! say the first war-king wore this blade, and the captains who come to see it still ask whose hand will carry it out of the hall."
 item_fang_of_arteon_modifier: "Fang of Arteon"
 item_arteon_vampire_slayer_blade_modifier: "Grand Illuminator"
 item_arteon_blood_drinker_blade_modifier: "Blood Drinker"
 treasure_crown_of_arteon: "Crown of Arteon"
 treasure_crown_of_arteon_desc:0 "The crown of the ruler who united #Y Arteon#!. Its bearer claims the right to rule the whole island."
 item_artifact_treasure_crown_of_arteon_modifier: "Crown of Arteon"
 blood_of_the_artheousan_kings: "Blood of the Artheousan Kings"
 blood_of_the_artheousan_kings_desc: "This character carries the restored blood of #T Artheousan#!'s royal line, proclaimed after the long wars of #Y Arteon#! ended beneath one sovereign crown."
 blood_of_the_eptelonian_chiefs: "Blood of the Eptelonian Chiefs"
 blood_of_the_eptelonian_chiefs_desc: "The blood of the mighty #Y Eptelonian#! warriors that conquered their many enemies and freed the island from the invader flows in this character's veins."
 blood_of_atheusian_shores: "Blood of the Atheusian Legacy"
 blood_of_atheusian_shores_desc:0 "This character descends from the #Y High Elven#! line that carried the #T Atheusian Legacy#! across #G Arteon#! and #G Eptelon#!, a true heir to #T Atheus#!."
 blood_of_the_harbor_founders: "Blood of the Harbor Founders"
 blood_of_the_harbor_founders_desc: "This character is descended from the bold builders and traders that shaped and built the most advanced and richest civilization on the island of #G Eptelon#!."
 NICKNAME_LORD_ARTEON: "'Lord of Arteon'"
 NICKNAME_LADY_ARTEON: "'Lady of Arteon'"
 arteon_vampire_lord_submission_tt: "Our ruler must be a #R Vampire#! and personally wield #Y Blood Drinker#!. There must also be at least #Y 1#! other independent ruler on #Y Arteon#! bearing the #R Vampire#! trait, so that the rite may end in blood and submission."
 eternal_war_preparations_mod: "Eternal War Readiness"
 eternal_war_preparations_mod_desc: "Having drilled long in anticipation of war's certainty, our people stand prepared for whatever conflict the island demands of them."
 arteon_slaver_defense_mod: "Coastal Defenses"
 arteon_slaver_defense_mod_desc: "Watchtowers, fortified harbors, and standing patrols have put an end to the easy raiding that once plagued our coastlines."
 arteon_mercenary_contracts_mod: "Mercenary Contracts"
 arteon_mercenary_contracts_mod_desc: "Soldiers of fortune from across the world converge on #Y Arteon#!, drawn by the promise of steady employment and the certainty of steady war."
 arteon_mercenary_discount_mod: "Eptelonian Drill"
 viktreic_viza_tt: "We need the #T Viza#! deity worshipped in our pantheon."
 arteon_divine_sacrifice_tt:0 "We must have an active #T Perform Divine Sacrifice#! bonus."
 ruler_needs_to_scheme_influence_tt: "Our #T Ruler#! must be pursuing the #Y Scheme for Political Influence#! ambition."
 you_need_to_form_arteon_tt: "We must have #Y Formed Arteon#!."

 03_arteon_generic_BUTTON_DETAILS: "Secure our homeland, overcome Arteon's rival powers, and unite the island."
 03_arteon_generic_BUTTON_TOOLTIP: "Begin the struggle to unite Arteon."
 arteonian_expeditionary_force_name: "Arteonian Expeditionary Force"

 # Home ladder, iron, old faiths and tooltips (2026-11-09)
 03_arteon_generic_task_home_1:0 "The Heartland Muster"
 03_arteon_generic_task_home_1_DESC:0 "The muster at [ROOT.GetCountry.GetCapital.GetName|Y] still draws spearmen from valleys that pay their grain to other lords, and every captain knows which villages sent their sons home carrying a rival's tally sticks. Once no foreign banner flies over the land around our capital, [ROOT.GetCountry.GetRuler.GetName|Y] can call the elders of the home valleys together and decide how the boundary stones beyond them are to be moved."
 03_arteon_generic_task_home_2:0 "The Heartland United"
 03_arteon_generic_task_home_2_DESC:0 "Every hall in our home region once kept its own tally of what it owed and to whom, and the scribes in [ROOT.GetCountry.GetCapital.GetName|Y] still find the old receipts tucked into the rafters of the granaries we have taken. When the last of those halls sends its dues to the capital, [ROOT.GetCountry.GetRuler.GetName|Y] can build on the heartland as one country instead of defending it as a string of quarrelling valleys."
 03_arteon_generic_task_iron_1:0 "Open The Iron Hills"
 03_arteon_generic_task_iron_1_DESC:0 "The smiths of #Y Arteon#! have always bought their iron from whoever held the hills that season, and they keep their prices in two columns, one for peace and one for war. With three iron territories under our banner and a mine already cut into one of them, the overseers can open new galleries and send the ore to [ROOT.GetCountry.GetCapital.GetName|Y] on our own pack trains."
 03_arteon_generic_task_iron_2:0 "The Smiths' Charter"
 03_arteon_generic_task_iron_2_DESC:0 "Iron now reaches the forges of [ROOT.GetCountry.GetCapital.GetName|Y] faster than the smiths can work it, and both the guild masters and the war captains have come to the palace asking for the right to set its price. Whoever holds the charter will decide whether the surplus becomes coin in the market or blades in the armories, and each side has already begun counting the other's friends at court."
 03_arteon_generic_task_iron_3:0 "Forges Of The Eternal War"
 03_arteon_generic_task_iron_3_DESC:0 "Armies have crossed #Y Arteon#! for centuries carrying iron dug on the island and sold to whichever side paid first. When eight iron territories send their ore to forges that answer to [ROOT.GetCountry.GetRuler.GetName|Y], the island's wars will be fought with our weapons or not at all, and the prospectors swear there is more iron under the stone quarries than anyone has bothered to look for."
 03_arteon_generic_task_5d:0 "Keepers Of The Old Shrines"
 03_arteon_generic_task_5d_DESC:0 "Three faiths have fought over #Y Arteon#! for so long that each of their priesthoods speaks as if the island had no other gods, yet the shrines our people keep are older than any of their temples. [ROOT.GetCountry.GetRuler.GetName|Y] means to send the keepers of those shrines across the island with our banner behind them, but the court must first decide which shore will hear them."
 03_arteon_generic_task_6d:0 "The Old Gods Prevail"
 03_arteon_generic_task_6d_DESC:0 "The keepers have carried our offerings to the shore the council chose, and the villages there have begun leaving bread at shrines the conquerors left empty. Once every territory on that shore answers to [ROOT.GetCountry.GetCapital.GetName|Y], the old gods will have a land of their own on #Y Arteon#! again."
 arteon_task_2_capital_tt:0 "Our capital must have at least #Y 30#! #Y Civilization#! and a #T Training Camp#!."
 arteon_home_area_held_tt:0 "No territory in our capital's area may be held by anyone except us or our subjects."
 arteon_home_ring_held_tt:0 "We or our subjects must hold all settled territories in an area bordering our capital's area within our home region."
 arteon_nivan_faith_settled_tt:0 "Complete #Y The Missionaries Of The Wyrm-Slayer#!."
 arteon_alusarian_faith_settled_tt:0 "Complete #Y Two Altars In Saousvad'E#!."
 arteon_iron_hills_tt:0 "Own at least #Y 3#! territories on #Y Arteon#! that produce #Y Iron#!."
 arteon_iron_mine_tt:0 "At least #Y 1#! of our #Y Iron#! territories on #Y Arteon#! must have a #T Mine#!."
 arteon_iron_surplus_2_tt:0 "The state of our capital must have a surplus of at least #Y 2#! #Y Iron#!."
 arteon_iron_surplus_3_tt:0 "The state of our capital must have a surplus of at least #Y 3#! #Y Iron#!."
 arteon_iron_dominate_tt:0 "Own at least #Y 8#! territories on #Y Arteon#! that produce #Y Iron#!."
 arteon_task_9_dynasties_tt:0 "Unless our ruler is a #R Vampire#!, the three blood-cursed dynasties of #Y Northern Arteon#! must no longer hold any land. If we are one of those dynasties, we are not counted against ourselves."
 arteon_vampire_lord_blade_tt:0 "Our ruler must have #R Blood Drinker#! equipped. The forged blade waits in our treasury until the ruler equips it from the #Y Artifacts#! menu."
 omni_arteon_opening_claims_tt:0 "We will gain any missing claims in our capital's area on territories outside our control."
 omni_arteon_boundary_claims_tt:0 "We will gain any missing claims in the rest of our home region on territories outside our control."
 omni_arteon_missing_region_claims_tt:0 "We will gain any missing claims on territories outside our control in #Y [THIS.GetProvince.GetArea.GetRegion.GetName]#!."
 omni_arteon_missing_area_claims_tt:0 "We will gain any missing claims on territories outside our control in #Y [THIS.GetProvince.GetArea.GetName]#!."
 omni_arteon_border_gifts_tt:0 "Every country on #Y Arteon#! holding land beside our capital's area gains the #G Border Friends#! opinion of us."
 omni_arteon_new_iron_seam_tt:0 "A #Y Stone#! or #Y Base Metals#! territory we own on #Y Arteon#! will begin producing #Y Iron#!."

 # Heritage tasks (2026-11-09)
 03_arteon_generic_task_her_arunggilo_1:0 "The Floods Of The Myahud"
 03_arteon_generic_task_her_arunggilo_1_DESC:0 "Every spring the Myahud rivers leave their beds and take a season's work with them, and the farmers who pray to [GetDeityDefinition('omen_fisa').GetName|G] at [GetProvince('(int32)770').GetName|Y] have asked for dikes ever since the first city-states rose on these banks. The kings have never agreed, because the same water lays down the silt that feeds the markets of [GetProvince('(int32)888').GetName|Y]. Once the floodplain at [GetProvince('(int32)881').GetName|Y], [GetProvince('(int32)966').GetName|Y] and [GetProvince('(int32)1013').GetName|Y] answers to us, [ROOT.GetCountry.GetRuler.GetName|Y] will have to decide which of them the river serves."
 03_arteon_generic_task_her_arunggilo_2:0 "The Four Shrines Of Victory"
 03_arteon_generic_task_her_arunggilo_2_DESC:0 "The kings shout the name of [GetDeityDefinition('omen_viza').GetName|G] before battle, the farmers keep the feasts of [GetDeityDefinition('omen_fisa').GetName|G], the caravan masters wear pendants of [GetDeityDefinition('omen_tuma').GetName|G], and every soldier paints the #T Eye of Victory#! on his shield. When all four shrines stand under the Zornakyan star again, the priests will ask [ROOT.GetCountry.GetRuler.GetName|Y] which face of the goddess the crown means to carry, and the answer will be heard from the floodplain to the desert."
 03_arteon_generic_task_her_arunggishay_1:0 "Ask Who Carries The Provisions"
 03_arteon_generic_task_her_arunggishay_1_DESC:0 "A lord of the middle country, asked who keeps it together, will name his predecessors, while the people who carry his provisions will give a much longer list. Those carrier families have kin on both sides of every boundary and know every ford between the markets, and [ROOT.GetCountry.GetRuler.GetName|Y] means to count them before deciding what to ask of them."
 03_arteon_generic_task_her_arunggishay_2:0 "Kin On Both Sides Of The Boundary"
 03_arteon_generic_task_her_arunggishay_2_DESC:0 "Now that the heartland pays its dues to [ROOT.GetCountry.GetCapital.GetName|Y], the carrier families have begun bringing word from cousins in the next lord's villages. Some of those cousins would open their gates to us for the right price, others would rather see their daughters married into our court, and all of them remember which boundary stone was moved in whose favor."
 03_arteon_generic_task_her_arungluyop_1:0 "Guest-Right"
 03_arteon_generic_task_her_arungluyop_1_DESC:0 "In the western country a family reckons its place by the settlements where it has kin and the roads on which it can claim hospitality, and a traveler turned away from a door remembers the house for three generations. The elders want [ROOT.GetCountry.GetRuler.GetName|Y] to decide whether guest-right remains the custom of the families or becomes the law of the whole realm."
 03_arteon_generic_task_her_arungluyop_2:0 "The Houses That Kept Faith"
 03_arteon_generic_task_her_arungluyop_2_DESC:0 "Our neighbors remember whichever western lord they last dealt with, but the people who live here remember the houses that kept faith when his banner came down. With the heartland united, those houses have come to [ROOT.GetCountry.GetCapital.GetName|Y] to ask what their loyalty has earned, and the captains who won the wars have come to ask the same."
 03_arteon_generic_task_her_arungdirong_1:0 "Artheous Was A Man"
 03_arteon_generic_task_her_arungdirong_1_DESC:0 "Our ancestors were driven out of the old Arteonian community because they taught that #T Artheous#! was a man who killed the Wyrms with the goddess's help, not a demi-god, and the Elders of the south have never taken the expulsion back. [ROOT.GetCountry.GetRuler.GetName|Y] means to raise a shrine to the mortal hero in [ROOT.GetCountry.GetCapital.GetName|Y], and must then decide whether to send its rite south as an olive branch or keep it as the north's own."
 03_arteon_generic_task_her_arungdirong_2:0 "The Cousins' Curse"
 03_arteon_generic_task_her_arungdirong_2_DESC:0 "The three princes who swore the #R Unholy Pact#! were Arungdirong like us, and their houses still rule the northern mountains as creatures that feed on their own subjects. Our captains want a standing force of heavy infantry before anyone in [ROOT.GetCountry.GetCapital.GetName|Y] decides whether those cousins are to be hunted or bargained with."
 03_arteon_generic_task_her_heskoh:0 "Word From Heskoh"
 03_arteon_generic_task_her_heskoh_DESC:0 "When #T Atheus the Conqueror#! burned the northern tribes in the #T First Great War#!, many of the survivors crossed to #G Austropetolia#! and found a refuge at [GetCountry('UPL').GetName|Y]. Their grandchildren still send letters home, and a squadron could carry them back or carry our trade to them."
 03_arteon_generic_task_her_pact_1:0 "The Cousins' Oath"
 03_arteon_generic_task_her_pact_1_DESC:0 "Generations ago three Arungdirong princes, cousins, swore an oath to a #R Vampire Lord#! and accepted his gift together, and each generation of their houses has renewed that oath in a sealed crypt. The heirs of the other two houses are waiting to learn whether [ROOT.GetCountry.GetRuler.GetName|Y] will go down into the crypt with them this time."
 03_arteon_generic_task_her_pact_2:0 "The Lord Who Gave The Gift"
 03_arteon_generic_task_her_pact_2_DESC:0 "None of the three houses has ever spoken the name of the #R Vampire Lord#! who gave their ancestors his curse, and the oldest of our blood says that is because none of them ever learned it. [ROOT.GetCountry.GetRuler.GetName|Y] has the patience and the coin to look for him, or to seal the question away for good."
 03_arteon_generic_task_her_yedidyah_1:0 "The Bardidzor Compact"
 03_arteon_generic_task_her_yedidyah_1_DESC:0 "Our kingdom has given the #Y Bardidzor#! the rights of nobles since before [GetProvince('(int32)791').GetName|Y] and [GetProvince('(int32)942').GetName|Y] fell to us, and the compact has kept their swords at our side. The #Y Zwyegweyan#! of the conquered cities want the same terms, while the Bardidzor would rather their privilege stayed their own."
 03_arteon_generic_task_her_yedidyah_2:0 "Seekers Of The Eternal Night"
 03_arteon_generic_task_her_yedidyah_2_DESC:0 "The faithful of #T Yedidyhan#! believe the First Vampire did not die when he vanished from the hills of Yehya, but waits for the #R Eternal Night#! that will free him. [ROOT.GetCountry.GetRuler.GetName|Y] means to send a company of seekers to follow every rumor of him across #Y Arteon#!, and whatever they bring home will be talked about in every village they pass."
 03_arteon_generic_task_her_nivan_1:0 "The Missionaries Of The Wyrm-Slayer"
 03_arteon_generic_task_her_nivan_1_DESC:0 "Most of the #Y Horteonians#! who came to #Y Arteon#! took the faith of #T Artheousan#! within a few generations, but the descendants of the #T Nivan Kingdom#! kept the gods their ancestors brought from the ice. Now missionaries of the Wyrm-Slayer are preaching in [ROOT.GetCountry.GetCapital.GetName|Y], and [ROOT.GetCountry.GetRuler.GetName|Y] must answer them before our armies march."
 03_arteon_generic_task_her_nivan_2:0 "The Nivan Cairns"
 03_arteon_generic_task_her_nivan_2_DESC:0 "When #T Atheus the Conqueror#! brought the #T First Great War#! to the north, the Horteonian refugees fought beside the northern tribes and were buried under cairns on the hills around [GetProvince('(int32)410').GetName|Y]. The stones have fallen and the names have worn away, and our veterans want them raised again before another generation forgets who stood there."
 03_arteon_generic_task_her_colonial_1:0 "The Charter Roll"
 03_arteon_generic_task_her_colonial_1_DESC:0 "The colonies won their rights from the Atheusian crown in the #T Second Great War of Arteon#!, and our clerks still keep the roll of them in the counting house of [ROOT.GetCountry.GetCapital.GetName|Y]. Envoys from #Y Ousred'Eson#! and #Y Ussonbrifhaerme#! both arrive each year to remind us that their masters consider the colonies theirs, and the court has decided it is time to give them an answer."
 03_arteon_generic_task_her_colonial_2:0 "The Slave Ledger"
 03_arteon_generic_task_her_colonial_2_DESC:0 "There are too few of our people to work our own fields, and the ledger of human slaves in [ROOT.GetCountry.GetCapital.GetName|Y] grows longer every year while the #R Great Slaver Navies#! sell more at our harbor. Some of the court fears what so many chained hands might do one night, and others fear what the fields would look like without them."
 03_arteon_generic_task_her_athlarethere:0 "The Field Of Athlarethere"
 03_arteon_generic_task_her_athlarethere_DESC:0 "#T Atheus the Younger#! was killed at [GetProvince('(int32)420').GetName|Y] in 635, and the quarrel over his empire between Calidriel and Cymeva has never been settled. The field where he fell is ours now, and [ROOT.GetCountry.GetRuler.GetName|Y] must decide whether it becomes a monument both crowns will honor or a farm neither of them can claim."
 03_arteon_generic_task_her_alusarian_1:0 "Two Altars In Saousvad'E"
 03_arteon_generic_task_her_alusarian_1_DESC:0 "Half of our people pray at Ascendic altars and the other half at the shrines of #T Artheousan#!, because the realm was born from the marriage of Alusian colonists and Sarian highlanders. The priests of both faiths have asked [ROOT.GetCountry.GetRuler.GetName|Y] which of them the crown will stand beside, and the High Elves who call us #R Emra#! are waiting to see us quarrel."
 03_arteon_generic_task_her_alusarian_2:0 "The Day The Conqueror Fell"
 03_arteon_generic_task_her_alusarian_2_DESC:0 "#T Atheus the Conqueror#! fell outside the walls of [GetProvince('(int32)662').GetName|Y] in 197, and families still carry a broken blade to the place where he died. The ward elders are asking the crown to put up prizes for the anniversary games. The captain of the watch would put that silver toward hiring a fighter trained in the #T Blade Storm#! by the swordmasters of [GetProvince('(int32)684').GetName|Y]."
 arteon_crypt_oath_treasure:0 "The Crypt Oath"
 arteon_crypt_oath_treasure_desc:0 "The records of the three princes lie sealed in the crypt. This golden cup bears witness to the oath sworn at its door: the name of the lord who gave them his gift shall remain unspoken."
 arteon_eternal_night_relic:0 "Relic of the Eternal Night"
 arteon_eternal_night_relic_desc:0 "The seekers brought this golden vessel home after a year on the roads. They found no trace of the First Vampire, and none of them will say where they found the relic."
