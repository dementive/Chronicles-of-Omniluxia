l_english:

 03_dune1: "Reclaiming The Pomegranate Throne"
 03_dune1_DESCRIPTION: "Ever since the fall of the #Y 30th Dynasty#! and the capture of [GetProvince('(int32)2805').GetName|G], the native #Y Baetepians#! have never ruled more than small kingdoms in the #G Upper Baetep#!, subjects in their own homeland. While the #Y Lower Baetepians#! saw greater assimilation into #Y Geallian#! society, the #G Upper Baetepians#! under the new #Y 31st Dynasty#!, the #Y Djedhid#!, fiercly defended their independence, only seeing brief periods of subjugation.\n\nDespite their numerous attempts to retake their homelands, the various Upper #T Baetepian#! Kingdoms have failed to reclaim the provinces of #G Lower Baetep#!, as the occupying #Y Geallian#! forces always fought fiercly to protect one of their most valuable provinces. However, the Invasions of #Y #R Jarenam the Formidable Dragon#!#! and the unpopularity of the #R #E Sertemic Dynasty of Baetep#!#! have opened up a new opportunity for the inhabitants of the south.\n\nAllied together in a common cause, the once-rival states of [GetCountry('DUN').GetName|T] and [GetCountry('AGE').GetName|T] now seek to place [GetCharacter('(int32)1').GetName|Y] on the #Y Pomegranate Throne#!!"
 03_dune1_CRITERIA_DESCRIPTION: "This mission will be completed when [ROOT.GetCountry.GetName|T] has reclaimed the #Y Baetep#! for the #G True Pharons#!."
 03_dune1_BUTTON_TOOLTIP: "We shall reclaim the Pomegranate Throne!"

 03_dune1_task_1: "Reunite The Djedhid"
 03_dune1_task_1_DESC: "Centuries of infighting and backstabbing amongst the members of the #Y Djedhid#! family have long since extinguished any hope of fulfilling the dreams of the founders of what became the [GetCountry('DUN').GetName|G] and the [GetCountry('AGE').GetName|G]. These meaningless wars amongst brothers has prevented the claimants of the #Y Pomegranate Throne#! from retaking the #Y Baetep#! from the foreign invaders!\n\nNo longer must this be the case! With the rise of the wise [GetCharacter('(int32)1').GetName|Y] and the forward-thinking [GetCharacter('(int32)47').GetName|Y], talks have begun about the possibility of a politival marriage that could finally unite the fractured house."

 03_dune1_task_2: "Reclaim our Cities"
 03_dune1_task_2_DESC: "For generations, the people of #G Adem#! and #G Meda#! have watched foreign banners pass above their homes, while the descendants of the #Y True Pharons#! quarreled beyond the dunes. With the branches of the #Y Djedhid#! finally joined in a common cause, we can turn our swords toward those who still hold our countrymen in submission.\n\nLet our warriors reclaim these cities and bring an end to the rule of [GetCountry('HF2').GetName|T]. The road to the #Y Pomegranate Throne#! begins with the liberation of our own people, and there are many skilled bowmen among them who would gladly march beneath our banner."

 03_dune1_task_3: "Consult The Gods"
 03_dune1_task_3_DESC: "As the living avatar of #Y #G Khewer#!#!, [GetCharacter('(int32)1').GetName|Y] holds the responsibility of ensuring her connection to the divine is stable and provides victory for our troops in battle!"
 
 03_dune1_task_4: "Fortify The Border"
 03_dune1_task_4_DESC: "While we are confident our combined forces can thrash the cowardly #Y Sertem#!, it is important that we protect our valuable cities from possible incursions into our territory."

 03_dune1_task_5: "Contest The Usurpers"
 03_dune1_task_5_DESC: "The time has come! With our alliance to the ruler of [GetCountry('AGE').GetName|Y] secured, let us run down the #Y usurping#! dogs who have stolen our homeland!!"

 03_dune1_task_6: "Restore The Pomegranate Throne"
 03_dune1_task_6_DESC: "At long last the #Y Baetep#! is once again ruled by a native dynasty! Finally, the #G True Pharons#! of the #T 31st Dynasty#! can reclaim their title and sit upon the #Y Pomegranate Throne#! once more!"
 we_need_to_own_the_pomegranate_throne_tt: "#Y The#! #T Pomegranate Throne#! #Y treasure needs to be in the holy site at#! #G Tariku#!."

 03_dune1_task_7: "Bel-bani Raiders"
 03_dune1_task_7_DESC: "The rowdy [GetCountry('BEL').GetName|T] #Y Gold Dwarves#! that live in the south are known to be sellswords, willing to lend their considerable strength to anyone willing to pay their prices. Perhaps we should send inquiries to their King, asking if they would be willing to join us in our wars."
 approach_belbani_dune_tt: "#Y We will approach the#! #T Bel-bani#! #Y and request their aid#!."

 03_dune1_task_8: "The Blessings Of Battle"
 03_dune1_task_8_DESC: "Vowing to the gods of war that [ROOT.GetCountry.GetRuler.GetSheHe] will take slaves for the #G [ROOT.GetCountry.GetName]#!, [ROOT.GetCountry.GetRuler.GetName|Y] has commanded that vast quantities of iron be imported into [ROOT.GetCountry.GetCapital.GetName|Y] in order to build chains and fetters for our prisoners."
 approach_belbani_dune_tt: "#Y We will approach the#! #T Bel-bani#! #Y and request their aid#!."

 03_dune1_task_9: "Tobacco Of [GetProvince('(int32)3810').GetName]"
 03_dune1_task_9_DESC: "The farmlands of #G Apesh#! are one of the few places in #Y Luxterra#! where tobacco grows, and the revenues that the state makes from selling this trade good are integral to our survival."

 03_dune1_task_10: "Glass Foundry"
 03_dune1_task_10_DESC: "Thousands of years ago, the #G Pharons#! of #Y Baetep#! built pyramids and temples throughout their realm, utilizing tens of thousands of slaves and laborers to achieve these timeless feats of architecture. Although building a foundry in our capital pales in comparison to erecting a masterwork like the #T Djeba Temple#!, [ROOT.GetCountry.GetRuler.GetName|Y] has decreed that our soldiers must set aside their swords and pick up shovels this campaign season."

 03_dune1_task_11: "Farms Of The Tetepen"
 03_dune1_task_11_DESC: "Without the life-giving waters of the #Y Tetepen River#!, no kingdom or empire would have ever survived in the harsh deserts of #T Baetep#!. We must take advantage of the river's bounty and build as many farms as we can throughout our realm."

 03_dune1_task_12: "Grand Forum Of Djeba"
 03_dune1_task_12_DESC: "Although our [ROOT.GetCountry.GetRulerTitle] has grandiose plans for the future of the [ROOT.GetCountry.GetName|G], [ROOT.GetCountry.GetRuler.GetSheHe] will always have a soft spot in [ROOT.GetCountry.GetRuler.GetHerHis] ancestral home, the city of [GetProvince('(int32)3735').GetName|Y], and has a plan to beautify the ancient town with a brand new #G Forum#!."

 03_dune1_task_13: "Golden Date District"
 03_dune1_task_13_DESC: "The dates @dates! that our people produce are renowned throughout #Y Luxterra#! for their sweetness and flavor, making them a prized commodity. We must ensure that our production of these delectable fruits meets the demands of our citizens and traders by building a special marketplace in our capital, where the best of our harvest can be sold to the highest bidder."

### EVENTS
  me_dune_1_title: "An Avatar of the Gods"
  me_dune_1_desc: "The priests await your choice, my liege. #G Khewer#! has the claim of the old Pharons and #Y Senedejr#! the devotion of those who kept faith in exile. Both temples have men ready to march under their god's standard."
  me_dune_1.a: "I shall host the God of Gods, King of All"
  me_dune_1_tooltip.a: "#G [GetCharacter('(int32)1').GetName] will become the avatar of #E Senedejr#!.#!"
  me_dune_1.b: "The Avatars of Khewer are and will be the rightful rulers of the Baetep"
  me_dune_1_tooltip.b: "#G [GetCharacter('(int32)1').GetName] will continue to host #E Khewer#!.#!"

  me_dune_2_title: "War of the Pomegranate Throne"
  me_dune_2_desc: "Our troops have crossed into the lands of the #Y Sertem#!. Their collectors know every village on the river. Our heralds are riding through those same villages with the name of the house that means to take back the #Y Pomegranate Throne#!."
  me_dune_2.a: "We shall reclaim our rightful throne!"
  me_dune_2_tooltip: "#R We will launch an invasion of #E Ahris#!.#!"

  me_dune_3_title: "A Call to Arms"
  me_dune_3_desc: "My king, the #Y House of Djedhid#! calls on us to march. We have disputed the inheritance with our cousins before. If they fall, we shall be free to dispute it with the #Y Sertem#! instead."
  me_dune_3.a: "The Sons of the Tetepan will fight alongside the True Pharon!"
  me_dune_3_tooltip: "#Y If they still exist, [GetCountry('PTH').GetName] and [GetCountry('AKH').GetName] will become feudatories of [GetCountry('AGE').GetName].#!"

  me_dune_4_title: "The Djedhid Invade"
  me_dune_4_desc: "My #G Pharon#!, the armies of [GetCountry('DUN').GetName|T] and [GetCountry('AGE').GetName|T] are across the border. Each calls the other kin, and both call your throne theirs. We have sent riders to the garrisons."
  me_dune_4.a: "Those fools march to their deaths"
  me_dune_4_tooltip: "#R The [GetCountry('DUN').GetName] and [GetCountry('AGE').GetName] will contest us for control of #E Baetep!#!"

  me_dune_5_title: "War of the Pomegranate Throne"
  me_dune_5_desc: "My [ROOT.GetCountry.GetRulerTitle], the upper kingdoms have marched against the #Y Sertem#!. The old line claims the throne by blood. The Sertem claim it from the palace where they have held court for years. Merchants would like to know which seals will be honored when their barges return."
  me_dune_5.a: "All this blood spilt over sand?"
  me_dune_5_tooltip: "#R The two dynasties will clash over who will control the #E Baetep#!!#!"

  me_dune_6_title: "Conflict in the Baetep"
  me_dune_6_desc: "My emperor, the #Y Sertem#! are occupied upriver. Our officers see a chance to recover #G Baetep#! while its garrisons look south. The quartermasters ask how far you mean to go. It is easier to put a province back on the map than to supply the men who must take it."
  me_dune_6.a: "We would be fools not to take advantage of this!"
  me_dune_6_tooltip.a: "#Y We will declare war on the [GetCountry('EGY').GetName]#!."
  me_dune_6.b: "Our Empire needs stability, not conquest"
  me_dune_6_tooltip.b: "#Y We will allow the [GetCountry('EGY').GetName] to sort out its own affairs#!"

  me_dune_7_title: "The Razani Invade"
  me_dune_7_desc: "My #G Pharon#!, [GetCountry('EGA').GetName|T] has crossed the eastern frontier. Every regiment we send to meet the #Y Razani#! is one the claimants upriver will be glad to see go."
  me_dune_7.a: "We would never stoop this low"
  me_dune_7_tooltip: "#R [GetCountry('EGA').GetName] has invaded [GetCountry('EGY').GetName]!#!"

  me_dune_8_title: "The Golden Omostthanat Begins"
  me_dune_8_desc: "My king, the #Y Sertem#! have sent their armies upriver. Our priests urge us to proclaim the #Y Golden Omostthanat#! while the frontier lies exposed. Shall the officers raise the standards?"
  me_dune_8.a: "FOR HELLAS!"
  me_dune_8_tooltip.a: "#R We will declare a Holy War upon [GetCountry('EGY').GetName].#!"
  me_dune_8.b: "We should bide our time"
  me_dune_8_tooltip.b: "#Y We will wait for another time to invade [GetCountry('EGY').GetName]#!"

  me_dune_9_title: "The Gold Dwarves Invade"
  me_dune_9_desc: "My #G Pharon#!, the #Y Gold Dwarves#! of [GetCountry('KDM').GetName|T] have come down from the hills. Their priests call it the #Y Golden Omostthanat#!. Our frontier officers have dispensed with the formal name and ask how soon we can send help."
  me_dune_9.a: "How awful!"
  me_dune_9_tooltip: "#R [GetCountry('KDM').GetName] has invaded [GetCountry('EGY').GetName]!#!"

  me_dune_10_title: "Fortify The Border"
  me_dune_10_desc: "The overseers at [GetProvince('(int32)3529').GetName|G] report that the fortress is ready. They have been asking for water, stone, and men since work began. They now ask for grain, which at least means there is a wall worth feeding men behind."
  me_dune_10.a: "We are not afraid of [GetCountry('EGY').GetRuler.GetFirstName] and [GetCountry('EGY').GetRuler.GetHerHim] armies..."
  me_dune_10_tooltip: "The mission task '#Y Fortify The Border#!' has now been #G Completed#!!"

  me_dune_11_title: "Bel-Bani Raiders"
  me_dune_11_desc: "My liege, the ruler of [GetCountry('BEL').GetName|T] has come to discuss the service of the #Y Bel-Bani#!. Their riders know desert roads that better supplied armies overlook. Their delegation is prepared to hear what that knowledge is worth to us."
  me_dune_11.a: "You are the wisest of dwarves, [GetCountry('BEL').GetRuler.GetName]"
  me_dune_11.b: "Hire a company of soldiers but keep things strictly business"
  me_dune_11.c: "Employ Bel-bani warriors to fight alongside our men"
  me_dune_11.d: "On second thought, this was a bad idea"
  me_dune_11_tooltip: "The mission task '#Y Bel-Bani Raiders#!' has now been #G Completed#!!"
 
  me_dune_12_title: "Restore the Pomegranate Throne"
  me_dune_12_desc: "The #Y Pomegranate Throne#! is yours. The line of #Y Khewer-Sedjet Djedhid#! has returned to the palace from which it was driven. The priests are ready to proclaim a #G Pharon#!, and the clerks await permission to put #G Baetep#! at the head of the decrees."
  me_dune_12.a: "All hail [ROOT.GetCountry.GetRuler.GetName] and [ROOT.GetCountry.GetName]!"
  me_dune_12_tooltip: "The mission task '#Y Restore the Pomegranate Throne#!' has now been #G Completed#!!"

  me_dune_13_title: "The Blessings of Battle"
  me_dune_13_desc: "My #G Pharon#!, word has gone out that those who fight on for the #Y Sertem#! may be taken into bondage. The captains call it a blessing upon the army. They are already asking who will keep the rolls of captives."
  me_dune_13.a: "All that oppose the [ROOT.GetCountry.GetName] are destined to be destroyed!"
  me_dune_13_tooltip: "The mission task '#Y The Blessings of Battle#!' has now been #G Completed#!!"

  me_dune_14_title: "A Pharonic Capital"
  me_dune_14_desc: "My #G Pharon#!, the old capitals have each sent accounts of their temples, storehouses, and illustrious former occupants. Every account is persuasive, especially on the subject of its author's own city. Where shall we set your throne?"
  me_dune_14.a: "Yewubdar will be our new home"
  me_dune_14.b: "Let us move to the holy city of Tariku"
  me_dune_14.c: "Djeba shall be my capital"
  me_dune_14.d: "Ahris is a worthy location"
  me_dune_14.e: "I have selected Muno in the east"
  me_dune_14.f: "Atis in Upper Baetep is the only choice"
  me_dune_14.g: "There is no need to change capitals"
  me_dune_14_tooltip: "#Y A Pharonic Capital#! has now been #G Completed#!!"

  me_dune_15_title: "Tobacco Of Apesh"
  me_dune_15_desc: "The growers of #G Apesh#! ask for your patronage. Your grandfather had strong views about what happens to a person who takes too readily to their tobacco. The growers hope you will take an equally strong interest in what happens to a treasury that taxes it."
  me_dune_15.a: "A wise man once told me to make money with tobacco..."
  me_dune_15_tooltip: "The mission task '#Y Tobacco Of Apesh#!' has now been #G Completed#!!"

  me_dune_16_title: "Glass Foundry"
  me_dune_16_desc: "The foundry at [ROOT.GetCountry.GetCapital.GetName|G] is ready for its first firing. Some soldiers thought themselves wasted carrying sand. They have since discovered that a furnace under construction can put even a veteran to work."
  me_dune_16.a: "Return to your homes, secure in the knowledge that you have aided Dune"
  me_dune_16_tooltip: "The mission task '#Y Glass Foundry#!' has now been #G Completed#!!"

  me_dune_17_title: "Farms Of The Tetepen"
  me_dune_17_desc: "The farms of the #G Tetepen#! have filled the granaries. There is enough to carry us through a lean season. The stewards ask to put the surplus by before the army hears what a good year we have had."
  me_dune_17.a: "We might not have everything we want, but we will never lack for food"
  me_dune_17_tooltip: "The mission task '#Y Farms Of The Tetepen#!' has now been #G Completed#!!"

  me_dune_18_title: "Grand Forum Of Djeba"
  me_dune_18_desc: "The new forum at #G Djeba#! is open. The archivists disagree on how far your family can be traced. On how long its new inscription should be, they show remarkable unanimity."
  me_dune_18.a: "As long as there is a #E Baetep#!, there will be a Djeba"
  me_dune_18_tooltip: "The mission task '#Y Grand Forum Of Djeba#!' has now been #G Completed#!!"

  me_dune_19_title: "A Grand Wedding"
  me_dune_19_desc: "My liege, the river landings at [ROOT.GetCountry.GetCapital.GetName|G] are full of wedding barges. Both branches of the #Y House of Djedhid#! have sent kin, gifts, and witnesses. The upper river will have a common royal house, and the musicians are prepared to celebrate as long as required."
  me_dune_19.a: "Long live the #E Djedhid#!!"
  me_dune_19_tooltip: "#Y The royal marriage#! will bind the two branches of the #T Djedhid#!, and [GetCountry('AGE').GetName|Y] will become our #G Feudatory#!."

  me_dune_20_title: "An Heir"
  me_dune_20_desc: "My liege, a son has been born to the royal house. The guards were telling the crowd before the herald reached the gate. The boy is to be named #Y Anesr#!. There will be ample time to teach him what the two branches of his family expect of him."
  me_dune_20.a: "Everything the #Y light#! touches will be your #G kingdom#!."
  me_dune_20_tooltip: "[SCOPE.sChar('egypt_son').GetName|Y] will receive the throne of [GetCountry('AGE').GetName|T], securing the inheritance of the #Y reunited dynasty#!."

  me_dune_21_title: "31st Dynasty Reunited"
  me_dune_21_desc: "The #Y Thirty-First Dynasty#! can issue its orders in a single name again. [GetCountry('DUN').GetName|T] and [GetCountry('AGE').GetName|T] are united under one house. The officials joining their administrations are finding out how much work a single name can conceal."
  me_dune_21.a: "May the #Y 31st Dynasty#! flourish once more!"
  me_dune_21_tooltip: "The #Y Djedhid#! have united their realms through marriage and secured a #G common heir#!."

  me_dune_22_title: "A Royal Marriage"
  me_dune_22_desc: "Word comes from #G Upper Baetep#! that [GetCountry('DUN').GetRuler.GetName|Y] has married [GetCountry('AGE').GetRuler.GetName|Y]. The wedding was lavish by all accounts. Our envoys are more interested in what the two branches of the #Y House of Djedhid#! may now do together."
  me_dune_22.a: "Long live the #E Djedhid#!!"
  me_dune_22_tooltip: "The royal marriage has been announced to the world."

  me_dune_23_title: "Freed Tosepian Archers"
  me_dune_23_desc: "Archers from #G Adem#! and #G Meda#! have come to take service with us. They have had enough of drawing bows for the men who once held their towns. The muster officers ask where the freed #Y Tosepians#! are to assemble."
  me_dune_23.a: "Let the #T Tosepian#! bows sing for the #Y True Pharons#!!"
  me_dune_23_tooltip: "An army of #G six Archer cohorts#! and #G one Supply Train#! will assemble in our capital as the #Y Freed Tosepian Archers#!."

  me_dune_24_title: "Golden Date District"
  me_dune_24_desc: "The first baskets from the new district are in, my liege. The fruit is the prized #Y Golden Date#!, and the merchants are bargaining for next season's crop. The stewards ask how many baskets may be spared for the palace before the merchants buy them all."
  me_dune_24.a: "The Golden Date District will be a jewel in our crown"
  me_dune_24_tooltip: "The mission task '#Y Golden Date District#!' has now been #G Completed#!!"


  dune_rally_ttp: "#Y Our freed countrymen will flock to our banner!#!"

  me_dune_war_tooltip: "#R We will invade the settlement of #E Ahris#!.#!"
  senedejr_mod: "Avatar of Senedejr"
  khewer_mod: "Avatar of Khewer"
  dune_slavers_mod: "Slavers of Dune"
  desc_dune_slavers_mod: "Our mighty ruler has vowed to take slaves for the #Y Baetep#!, pleasing the gods of war."
  tobacco_of_apesh_mod: "Tobacco of Apesh"
  desc_tobacco_of_apesh_mod: "The city of #G Apesh#! is known throughout the world for the strong tobacco that is made in its mills."
  dune_food_stores: "Farms of the Tetepen"
  desc_dune_food_stores: "Our Rulers have built extensive farms close to the #Y Tetepen River#!; the breadbasket of our people."
  grand_forum_of_djeba_mod: "Grand Forum of Djeba"
  desc_grand_forum_of_djeba_mod: "The forum at the heart of #G Djeba#! on the banks of the #Y Tetepen River#! is one of the grandest in all #G Omniluxia#! and is home to two colossal statues of the #G Pharons#!."
  DJEDHID_BAETEP_FLAG: "Glorious Banner of the Restored Baetep"
  djedhid_baetep_blue: "The Royal Blue of Baetep"

#Tooltips
dune_dates_total_svalue_tt: "We must produce at least #Y 10#! @dates! #T Dates#! in our nation. (#R [SCOPE.ScriptValue('dune_dates_total_svalue')|0]#!/#Y 10#!)"
dune_dates_total_svalue_mod: "Golden Date District"
constructing_pirate_haven_allowed_tt: "#Y Our armies will gain the#! #G Construct Pirate Haven#! #Y ability.#!"
construct_pirate_haven: "Construct Pirate Haven"
construct_pirate_havendesc: "For hundreds, if not thousands, of years, piracy has been a tradition for those unwilling to earn their livelihoods honestly.\n\n#T We can construct a#! #R Pirate Haven#! #T every#! #G 10#! #T years.#!"
