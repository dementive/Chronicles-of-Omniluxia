l_english:

03_saptarum: "The Ruined City"
03_saptarum_DESCRIPTION: "Nearly four hundred years have passed since the sack of our great city by the #Y Zani#! invaders. Since then, our nation has declined into a rump state deep in the mountains. While we may lament the loss of our past glory, [ROOT.GetCountry.GetName|T] does possess certain advantages that will help it succeed on the international stage: a warrior culture and a strong merchant heritage.\n\nThe city currently finds itself as a #Y plutocratic society#! dominated by a council of the #R Great Merchant Families#! of the city, the #Y Kvaran#!, the #Y Otensonn#!, and the #Y Segurrvelk#!. The #Y Kvaran#! are the oldest and wealthiest family, and members are often very traditional in their beliefs. The #Y Otensonn#! claim to be descendants of the great hero #G Oten 'to Hrungmogg'#!, and have a strong military tradition, with all male members expected to become a part of the aristocratic officers that run the military. Finally, the #Y Segurrvelk#! are the youngest family, said to have been founded by commoners who managed to use their talents to achieve great wealth as merchants. They are the largest family and the most populist of all of the three.\n\nWhile the three families run the state, their rivalries have caused a rift that could be exploited by an outsider. While the #Y Kvaran#! and the #Y Otensonn#! continue to uphold the tradition of acting as #Y 'Custodians of the Throne'#!, the #Y Segurrvelk#! push for the abolition of the long-vacant throne. On top of political disagreements, the #Y Kvaran#! and #Y Otensonn#! fear the power that the much larger #Y Segurrvelk#! might use against them if the country was ever to enter another civil war.\n\n\nIn this environment, it will only take one event to trigger a catastrophic chain reaction that will once again change the trajectory of the #Y Saptan#! people!\n"
03_saptarum_CRITERIA_DESCRIPTION: "This mission will be completed when [ROOT.GetCountry.GetName|T] has restored its place as one of the strongest powers in #G Morrigon#!!"
03_saptarum_BUTTON_TOOLTIP: "For the glory of [GetCountry('SV2').GetName]!"

#Missions 

03_saptarum_task_1: "Expel the Families"
03_saptarum_task_1_DESC: "Having used the foolish #Y Kvaran#! and #Y Otensonn#! against the #Y Segurrvelk#!, the young king can now work on undermining the power of the remaining families.\n\nNow that the balance of power is gone, the #Y Kvaran#! and #Y Otensonn#! are at each other's throats, and believe the King will be a useful tool they can use over the other. With this knowledge in mind, [ROOT.GetCountry.GetRuler.GetName|Y] plays along and placates the families by removing their rivals from positions of power. However, he quietly plots to put his supporters into these roles, until he has full control of the government and the army, and is able to expel the corrupt families."

03_saptarum_task_2: "Re-Establish the Forrj Guard"
03_saptarum_task_2_DESC: "With their dark red armor and Bonesteel swords, the #R Forrj Guard#! was a legendary force that protected the #Y Saptan Kingdom#! in its heyday. With the fall of its final commander, #G Oten 'to Hrungmogg'#!, and the kingdom itself the guard faded into legend. However, with the return of the #Y Aspatta#! and the army reforms led by [ROOT.GetCountry.GetRuler.GetName|Y], the time has come for the #R Forrj Guard#! to return as vanguards of the King's new royal army."

03_saptarum_task_3: "The Return of the Aspatta"
03_saptarum_task_3_DESC: "With the expulsion of the last remnants of the old families, new nobility have filled their place. With the wealth he's seized from the former families, [ROOT.GetCountry.GetRuler.GetName|Y] has decided to invest into his army, both to ensure his personal control over his soldiers and to centralize his power over the kingdom."

03_saptarum_task_4: "Integrating Aspatabi"
03_saptarum_task_4_DESC: "A symbol of hope for our people, integrating the prosperous colony of [GetCountry('SV4').GetName|T] will provide more men for our armies and land to tax. Their annexation will be [GetCountry('SV2').GetName|T]'s first step to empire."

03_saptarum_task_5: "Liberate Our Allies"
03_saptarum_task_5_DESC: "Ever since the collapse of the #Y Zani#!, the #Y Saptans#! have maintained friendly relations and even alliances with the neighboring #Y Borderlander#! #Y Leslesi#! tribes, with #G Aspatabi#! being founded on land purchased from #Y Leslesi#! chieftains. However, while we were distracted by political squabbles, our allies were subjugated by other #R hostile Borderlander tribes#! and #R Orcish invaders#!. It's time to honor our longstanding friendship and liberate the #Y Leslesi#!!"

03_saptarum_task_6: "Drive Out the Orcs"
03_saptarum_task_6_DESC: "The #Y #R Acliuram Orcs#!#! are relatively recent players in #Y Northern Morrigon#!, and have been a rising threat to all powers in the area.\n\nArriving around two hundred years ago, these #R Orcish invaders#! created colonies on the coast of the #G Orcish Sea#! surrounding the major trade hubs they conquered, such as #Y Gorhoffabi#!.\n\nA bellicose people, the #R Orcs#! have managed to become the dominant trading force in the #G Orcish Sea#! by hooking potential customers to their 'products' and threatening other traders and nations with violence to eliminate the competition. It would benefit us to take over their trading hubs and end their tyranny for good."

03_saptarum_task_7: "Consolidate the South"
03_saptarum_task_7_DESC: "As the #Y #R Orcs#!#! are being dealt with, [ROOT.GetCountry.GetRuler.GetName|Y] turns his attention to the various hostile #Y Celtican#! and #Y Borderlander#! tribes that occupy the many inland and coastal trading hubs of #Y Northern Morrigon#!. Conquering their wealthy cities will bring us one step closer to dominating the #G Orcish Sea#! Trade!"

03_saptarum_task_8: "Dominate the Orcish Sea Trade"
03_saptarum_task_8_DESC: "With both the #Y #R Orcs#!#! and #T Humans#! subjugated, [ROOT.GetCountry.GetRuler.GetName|Y] can finally begin consolidating his dominion over the #G Orcish Sea#! Trade! Developing the various trade hubs he's conquered, the wealth that will flow into his #Y Kingdom#! from this endeavor would be able to fund his future campaigns against the hated [GetCountry('WGA').GetName|T]!"

03_saptarum_task_9: "Contesting the Nazani"
03_saptarum_task_9_DESC: "Using the newfound wealth of the #G Orcish Sea#!, [ROOT.GetCountry.GetRuler.GetName|Y] can now turn his full attention to his ultimate ambition: the conquest and destruction of the [GetCountry('WGA').GetName|T]. Heirs of the cruel #Y Zani#!, the [GetCountry('WGA').GetName|T] must be utterly destroyed before [GetCountry('SV2').GetName|T] can truly rise again.\n\nHowever, such a stable and wealthy empire will be difficult to subjugate, so [ROOT.GetCountry.GetRuler.GetName|Y]'s armies must first weaken them by plundering the wealthy cities of the #Y Ularians#!."

03_saptarum_task_10: "Conquer the Nazani"  
03_saptarum_task_10_DESC: "With other empires greedily eyeing up the weakened [GetCountry('WGA').GetName|T], we must strike quickly to ensure our dominion over our hated enemies! Let us not allow them to escape judgement!"

03_saptarum_task_11: "Punish the Heirs of the Zani"
03_saptarum_task_11_DESC: "#T Dwarves#! among all races are notorious for holding grudges, and no dwarves hold a greater grudge than the #Y Galmar Silver Dwarves of Morrigon#! have against the #Y #R Weagelians#!#!. With the fall of the [GetCountry('WGA').GetName|T] and the capture of the ancient #Y #R Zani#!#! city of [GetProvince('(int32)2720').GetName|G], the #Y Galmar#! finally have their chance to take their revenge on the descendents of their conquerors."

03_saptarum_task_12: "The Forrj City"
03_saptarum_task_12_DESC: "There is a popular myth among those who dwell along the slopes of the #Y Pjershyan Highlands#!, one of a bird as large as a dragon and unable to be killed. It is said in the #Y Sørrgann#!, or #Y Great Walk#!, that the #Y Galmar#! hunted this bird every day for a hundred years, with its meat sustaining them throughout their journey to the #Y Saptan Valley#!. The elders say that once the bird's bones were symbolically burned in a cave, it would reappear from the mountains the following morning.\n\nThis bird, the #Y #R Forrj#!#!, is a symbol of our city. A city reborn through the flames that incinerate others. A city that is no longer the capital of a kingdom, but now the seat of an empire."

03_saptarum_task_13: "Rebuild Wegalia"
03_saptarum_task_13_DESC: "With our bloodlust subsiding, our people look with fresh eyes at the destruction we've brought to the children of the #Y #R Zani#!#!. Ruined cities, families, villages, farms, we've become so blind with rage that we've burned everything in our path. As the fires turn to embers, it's time to help rebuild and resettle the former cities of the #Y #R Zani#!#! in our image with the help of our #Y #G Leslesi#!#! allies."


#REPUBLIC
03_saptarum_task_14: "Preserve the Council"
03_saptarum_task_14_DESC: "Despite all the chaos our nation has gone through, our council has persisted. However, factionalism and infighting amongst the families has left us weak. If we are to become a strong country we must first ensure our government is stable."
family_heads_greater_60_loyalty_tt: "#Y All family heads have#! #T 60 Loyalty#! #Y or greater#!."

03_saptarum_task_15: "Annex Aspatabi"
03_saptarum_task_15_DESC: "With our new army we are now able to impose our influence abroad and expand our influence and power. We should begin by finally annexing the only other #Y Galmar#! city big enough to contest our strength, [GetProvince('(int32)2651').GetName|G], bringing their resources and manpower into our growing Republic."

03_saptarum_task_16: "Leslesi Auxiliaries"
03_saptarum_task_16_DESC: "Due to our shared hatred of the #R Zani#!, our people have often maintained strong relations with the various #Y Leslesi#! tribes of the #Y Northern Pjershyan Hills#!, which translated into trade agreements and military alliances that were disrupted during the chaos caused by our coup that removed the corrupt #R Council of Elders#!. During our internal conflicts, neighboring #R Borderlander tribes#! and #R Orcs#! subjugated our allies, and we failed to take any actions even after our council's ascension. The #Y Leslesi#! are fierce warriors and loyal allies, freeing them from their oppressors and integrating them into our Republic would be beneficial to us and our ambitions in the region."

03_saptarum_task_17: "Ports of the Orcish Sea"
03_saptarum_task_17_DESC: "Now that we've secured our borders and recruited our #G Leslesi#! allies, the council's next main objective is to expand their influence in the wealthy #Y Orcish Sea Trade#!. By capturing and developing key #R Orcish#! and #Y Human#! ports, we can simultaneously eliminate our competition and create major economic centers to expand our influence abroad.\n\nAdditionally, captured #Y Orcish#! trade vessels could prove useful for any future maritime ambitions…"

03_saptarum_task_18: "The Southern Borderlanders"
03_saptarum_task_18_DESC: "By integrating our #G Leslesi#! allies we have inherited their conflicts with the other major #R Borderlander tribes#! to our south. However, we can use this to our advantage and claim the resources of the southern #Y Borderlanders#! for ourselves!"

03_saptarum_task_19: "A Merchant Fleet"
03_saptarum_task_19_DESC: "Using the knowledge we've gained from studying #R Orcish#! ships, we must innovate on their designs and construct a grand #G Merchant Fleet#! capable of protecting our trade interests against conniving #Y Orcish#! and #Y Human#! pirates and steering trade to our new ports!"

03_saptarum_task_20: "Leslesi Settlers"
03_saptarum_task_20_DESC: "Controlling such a large expanse of land is a costly endeavor, especially due to the hostile nature of the #R Borderlanders#!. However, our #G Leslesi#! allies provide us with a unique solution. By dispersing #Y Leslesi#! settlements around the south, we can establish friendly trading posts who will ensure regional stability."

03_saptarum_task_21: "Skilled Artisans"
03_saptarum_task_21_DESC: "Back during the #Y Saptan Golden Age#!, our people were known as some of the best silversmiths in all of #G Morrigon#!; a reputation that would unfortunately attract unwanted attention. However, now that our Republic is strong enough to protect itself, we should encourage and patronize the artisans of our realm to restore this ancient reputation!"

03_saptarum_task_22: "The Sørrsalla"
03_saptarum_task_22_DESC: "Our conquests have brought [GetProvince('(int32)2559').GetName|G] and the council great wealth and splendors. To commemorate our successes and showcase the wealth and authority of the council and our realm, the #Y Kvaran#! have patronized several upcoming artists and metalworkers to create the #Y Sørrsalla#!, or #Y Great Hall#!."

03_saptarum_task_23: "A Walled Metropolis"
03_saptarum_task_23_DESC: "With the #Y Sørrsalla#! completed, it is only reasonable that our city match the magnificence of such a work! Let us put our new artisans and laborers to work on making our city a true #Y Sørrborr#!, one with impenetrable walls as high as the #Y Walls of God Mountains#!!"

03_saptarum_task_24: "Rights of the Citizens"
03_saptarum_task_24_DESC: "While our Republic has become very wealthy, that wealth has concentrated mainly amongst the powerful aristocratic nobles of the great merchant families\n\nUnfortunately, this has caused quite a bit of unrest amongst the general population, with serfs and freemen demanding an expansion of citizenship while citizen soldiers demand better representation in our council.\n\nOur attempts to placate the masses with massive building projects have not seen the success we are hoping for, and we must acquiesce to some of their demands lest we succumb to ruinous riots and revolts."

03_saptarum_task_25: "The Forrj and the Wolf"
03_saptarum_task_25_DESC: "The #G Leslesi#! have proved to be resourceful and loyal allies, going from scattered communities to large urban centers of civilization.\n\nThey've adopted many aspects of #Y Galmar#! culture, with many even adopting the #T Hebric#! faith, putting their own heroes into our pantheon and their philosophers and theologians arguing whether #Y Galmarr 'to Vernun'#! and other #Y Silver Dwarven#! heroes were reincarnations of #G Lula#!. Many of their brightest have become some of the most skilled traders and generals in our nation.\n\nHowever, they remain second class citizens to the #Y Galmar#!, and very few #Y Leslesi#! are actually allowed official citizenship.\n\nWith the passing of the #G Ubaturren ulfton Thorgarren#!, this is now an issue which many #Y Leslesi#! and #Y Galmar#! alike have decided to change."



#Tooltips


#Modifiers
plutocratic_society_mod: "Plutocratic Society"
desc_plutocratic_society_mod: "The #Y Saptans#! are known to be some of the best merchants in the world, and their society demonstrates this fact. The three great merchant families rule the city and the nation, with their control and power granting them most of the wealth generated by the #G Orcish Sea#! Trade, causing slight resentment among the few freemen and citizens of the nation."

new_men_mod: "New Men"
desc_new_men_mod: "Following the expulsion of the families, the new King Krstoff #Y Aspatta#! staffed his new administration with young talent."
forrj_guard_mod: "Forrj Guard"
desc_forrj_guard_mod: "With their dark red armor and bonesteel swords, the #Y Forrj Guard#! was a legendary force that protected the #Y Saptan Kingdom#! in its heyday. After the establishment of the Royal #G Army#!, King Krstoff re-estalished the guard as a vanguard unit for his army."
royal_army_mod: "Royal Army"
desc_royal_army_mod: "Personally loyal to the King, the Royal #G Army#! of Sapta was created to ensure the King's absolute authority over the state."
orkksigrramoggen_mod: "Orkksigrramoggen"
desc_orkksigrramoggen_mod: "We have successfully driven the invading Orcs out of #G Morrigon#! and reclaimed our lost port!"
razed_city_mod: "Razed City"
desc_razed_city_mod: "As revenge for the Sacking of #G Saptabi#! in 619 LC, invading #Y Saptan#! armies have sacked this city and left it in ruins."
rebuilt_city_mod: "Rebuilt City"
desc_rebuilt_city_mod: "From the ashes of the former #Y Nazani#! cities, the #Y Galmar#! #Y Silver Dwarves#! have reconstructed their cities in a dwarven fashion, sending in settlers, architects, traders, and administrators to help rebuild this city."
empire_reborn_mod: "An Empire Reborn"
desc_empire_reborn_mod: "Our nation has been in decline for nearly 400 years. However, under our new #Y Emperor#!, our nation has been reborn from a small mountain kingdom to a true empire that can stand agains the strongest powers of #G Omniluxia#!!"


####REPUBLIC
citizen_soldiers_mod: "Citizen Soldiers"
desc_citizen_soldiers_mod: "Following the #G Thyrr Ubaturren#! reforms, the army of the #Y Saptans#! mainly consisted of a small group of citizen soldiers who were led and financed by the nobility."
thyrr_ubaturren_mod: "Thyrr Ubaturren"
desc_thyrr_ubaturren_mod: "The '#Y Three Reforms#!' state that the council will be divided evenly between the three families, with each one receiving five seats on it for a total of fifteen council members. #Y One of our#! members will be elected as the Hatamogg, or “Speaker”, for our council and be the face of our Republic abroad.\nSecondly, the council passes civic reforms to restrict citizenship and therefore political power and education to the upper classes to ensure that the bureaucracy remains in their control. \nFinally, the council passes army reforms to allow only citizens into the army, cementing their control over the armed forces. Additionally, any freeman who serves in the military for more than 20 years will gain citizenship for them and their descendants."
leslesi_auxiliaries_mod: "Leslesi Auxiliaries"
desc_leslesi_auxiliaries_mod: "Having incorporated our allies into our nation and granted them a degree of autonomy, many young #Y Leslesi#! men have flocked to our armies to fight as auxiliaries."
recruitment_centers_mod: "Recruitment Center"
desc_recruitment_centers_mod: "With some help from the #Y Galmar#!, the #Y Leslesi#! have recently established this city, and many young men who arrive seek to join the army to find new opportunities in this changing world."
orcish_sea_trade_mod: "Orcish Sea Trade"
desc_orcish_sea_trade_mod: "We are now the dominant force in the lucrative #G Orcish Sea#! Trade, which stretches from Eastern #G Rohenoa#! to Northern #Y Wegalia#!!"
galmar_trade_port_mod: "Hrhoffen"
desc_galmar_trade_port_mod: "Recently conquered, this 'New #T Port#!' city is an important trading port used to control the trade of the #G Orcish Sea#!."
subjugated_celticans_mod: "Subjugated Human Tribes"
desc_subjugated_celticans_mod: "With their cities taken, the #Y Borderlander#! and #G Celticans#! that occupied large inland and coastal trading hubs of Northern #G Morrigon#! now bow to their new #Y Galmar#! overlords."
merchant_fleet_mod: "Merchant Fleet"
desc_merchant_fleet_mod: "Having studied #Y Orcish#! designs, the #Y Saptans#! have designed a mighty merchant fleet to protect their trade and move goods across the #G Orcish Sea#!."
leslesi_colony_mod: "Leslesi Colony"
desc_leslesi_colony_mod: "To help tame the wild #T Southern#! #Y Borderlanders#!, friendly #Y Leslesi#! colonists have been sent down to establish safe trading posts and administrative centers in hostile lands."
patronage_of_the_arts_mod: "Patronage of the Arts"
desc_patronage_of_the_arts_mod: "With the increasing wealth of the nation, many wealthier #Y Saptans#! have turned to patronizing talented artists to flaunt their wealth and show off their power and status."
sorrborr_mod: "Sørrborr"
desc_sorrborr_mod: "#Y Sørrborr#! is a title reserved for the very few cities in the #Y Silver Dwarven#! world which achieve the status of a true #G Metropolis#!, housing grand projects, infrastructure, monuments, and trading centers."
walls_of_god_mod: "Walls of God"
desc_walls_of_god_mod: "Tall, thick stone walls that surround the outside of the newly rebuilt Saptaborr, which are said to be as tall as the #G Wall of God#!."
ubaturren_ulfton_thorgarren_mod: "Ubaturren ulfton Thorgarren"
desc_ubaturren_ulfton_thorgarren_mod: "The #G Ubaturren ulfton Thorgarren#!, or #G Reforms of the Citizens#!, have ensured that all citizens of our nation now have political representation in our government, and have ensured that our Republic is one of the most stable in the world!"
janirr_thorgarren_mod: "Janirr Thorgarren"
desc_janirr_thorgarren_mod: "The #G Janirr Thorgarren#!, or #G Reforms of the Citizens#!, have ensured that all citizens of our nation now have political representation in our government, and have ensured that our Republic is one of the most stable in the world!"
sorrrrsalla_country_mod: "The Sørrsalla"
desc_sorrsalla_country_mod: "The #Y Sørrsalla#!, or #Y Great Hall#!, is a large pantheon-like building made of marble and furnished with great chairs and tables of fine wood and cloth. The main room is filled with silver statues of our ancestors and noblemen while the golden heads of mythical beasts look down at guests from the ceiling. Looking around, one notices the walls of this great room lined with large woolen tapestries of our greatest achievements, battles, statesmen, and warriors. It is a symbol of our nation's strength!"
sorrsalla_prov_mod: "The Sørrsalla"
desc_sorrsalla_prov_mod: "The #Y Sørrsalla#!, or #Y Great Hall#!, is a large pantheon-like building made of marble and furnished with great chairs and tables of fine wood and cloth. The main room is filled with silver statues of our ancestors and noblemen while the golden heads of mythical beasts look down at guests from the ceiling. Looking around, one notices the walls of this great room lined with large woolen tapestries of our greatest achievements, battles, statesmen, and warriors."
the_great_hall: "Sørrsalla"
gw_effect_sorrsalla: "The Great Hall"



#Treasures


#Events
me_saptarum_1_title: "$03_saptarum_task_1$#!"
me_saptarum_1_desc: "By the time the bickering #Y Kvaran#! and #Y Otensonn#! decide to consolidate their power, [ROOT.GetCountry.GetRuler.GetName|Y] already has full control over the city and the nation. Loyal statesmen pledge their support to the King as the frantic #Y Kvaran#! and #Y Otensonn#! scramble to find any allies in court to assist them.\n\nIn the following weeks the wealth and influence the mighty #Y Kvaran#! and #Y Otensonn#! once wielded has been seized by [ROOT.GetCountry.GetRuler.GetName|Y], and their families are forced to march out of [GetProvince('(int32)2559').GetName|G] in shame to an unknown fate."
me_saptarum_1.a: "The rule of the families is over, long live the King!"
me_saptarum_1_tooltip: "The mission task '#Y $03_saptarum_task_1$#!' has now been #G Completed#!!"

me_saptarum_2_title: "$03_saptarum_task_2$#!"
me_saptarum_2_desc: "Nearly four hundred years after its dissolution following the #R #E Great Zani Invasion#!#!, the #Y #R Forrj Guard#!#! rises once again.\n\nMarching in perfect sync, the afternoon sunlight gleams off of their blood red armor and the hilts of their bonesteel swords. They stop and form ranks in front of their King, whom they've pledged to serve for life, even at the cost of their own. After a short inauguration speech, the King is elated with the response of his new vanguard."
me_saptarum_2.a: "Long live Saptarum! Long live Saptabi! Long live the Aspattan Kings!"
me_saptarum_2_tooltip: "The mission task '#Y $03_saptarum_task_2$#!' has now been #G Completed#!!"

me_saptarum_3_title: "$03_saptarum_task_3$#!"
me_saptarum_3_desc: "As [ROOT.GetCountry.GetRuler.GetName|Y]'s new Royal #G Army#! marches through the streets of [GetProvince('(int32)2559').GetName|G], residents stare in awe at the powerful force our King commands. As this great parade comes to an end, the King holds an elaborate ceremony meant to cement his power over his kingdom, with his new nobility lining up to pay fealty to him and only him. Only a few years prior he was an outcast, a subject of what was his rightful kingdom, now he is a true monarch not seen since the last days of the #Y Aspatta#!!"
me_saptarum_3.a: "This is the first step to empire!"
me_saptarum_3_tooltip: "The mission task '#Y $03_saptarum_task_3$#!' has now been #G Completed#!!"

me_saptarum_4_title: "$03_saptarum_task_4$#!"
me_saptarum_4_desc: "The citizens of [GetProvince('(int32)2651').GetName|G] cheer as their King arrives to their thriving city. His visit has attracted many settlers and freemen who have accompanied him on his journey, many of whom now flock to the overcrowded markets and taverns of the city. Under his decree, this small border outpost is to now become an official city of the #Y Kingdom#! of [GetCountry('SV2').GetName|T]."
me_saptarum_4.a: "Glory to the King! Glory to [GetProvince('(int32)2651').GetName]!"
me_saptarum_4_tooltip: "The mission task '#Y $03_saptarum_task_4$#!' has now been #G Completed#!!"

me_saptarum_5_title: "$03_saptarum_task_5$#!"
me_saptarum_5_desc: "Arriving at the gates of the city to meet with the #Y Leslesi#! Chieftains outside [GetProvince('(int32)2559').GetName|G], [ROOT.GetCountry.GetRuler.GetName|Y] is surprised by caravans full of families and freemen. [ROOT.GetCountry.GetRuler.GetName|Y] asks the Chieftains what their people are doing so far from home, to which they respond that they wish to make [GetProvince('(int32)2559').GetName|G] their new home. Knowing his armies will need a fresh source of men, the King readily agrees and helps accommodate his new subjects!"
me_saptarum_5.a: "Even the humans approve of our monarch's rule!"
me_saptarum_5_tooltip: "The mission task '#Y $03_saptarum_task_5$#!' has now been #G Completed#!!"

me_saptarum_6_title: "$03_saptarum_task_6$#!"
me_saptarum_6_desc: "The skies fill with smoke as the screams of the #R #E Aceliuram#!#! are drowned out the sounds of our swords falling upon the #R #E Orcish#!#! invaders. As their cities fall, their people are faced with two choices: death or expulsion.\n\n Weeks after the success of his campaigns, [ROOT.GetCountry.GetRuler.GetName|Y] triumphantly watches as the #R #E Orcs#!#! are sent off to an unknown fate, hopefully to be lost in storms or attacked by the bloodthirsty #R #E Remun#!#! or #R #E Rendun#!#! #R #E Orcs#!#! of the godless #R #E Bloody Isles#!#!. Finally rid of the oppressive invaders, the King's #G #E Leslesi#!#! auxiliaries let out a fearsome cry of victory as they watch a sabotaged ship sink below the unforgiving waves of the #G Orcish Sea#!."
me_saptarum_6.a: "Good riddance!"
me_saptarum_6_tooltip: "The mission task '#Y $03_saptarum_task_6$#!' has now been #G Completed#!!"

me_saptarum_7_title: "Exiles from Abroad"
me_saptarum_7_desc: "While the #Y Aceliuram#! colonies are viewed with disdain by our people, there is no denying that their #G Inner Flame#! burns brightly, allowing them impressive victories against the weak and foolish #Y #R Shuar#!#! and #Y #R Vakkan#!#! of #Y Northern Morrigon#!. This knowledge made it all the more shocking to [ROOT.GetCountry.GetRuler.GetName|Y] as he watched thousands of #Y Aceliurami#! pour into our capital. Some #Y #R Vakkan#!#! barbarians who call themselves '#Y Galmar#!' have expelled our kinsmen from their lands and driven them back to us. While we might disagree with their ideas and culture, an #Y Orcish#! enemy is always preferable to a #Y #R Vakkan#!#! friend."
me_saptarum_7.a: "They will regret this"
me_saptarum_7_tooltip: "#R We will gain a claim on [GetCountry('SV2').GetName]!#!"

me_saptarum_8_title: "$03_saptarum_task_7$#!"
me_saptarum_8_desc: "The #R #E Celticans#!#! and the #R #E Borderlanders#!#! to our South, once barbarians who roamed and killed without consequence, have been brought to justice through the strength and will of [ROOT.GetCountry.GetRuler.GetName|Y]'s armies. With their few settlements in flames, their people scattered and disorganized, and their war parties broken before the combined strength of our disciplined infantry and skilled auxiliaries, the #R #E Celtican#!#! and #R #E Borderlander#!#! tribes now bow to the conquering king of #Y Northern Morrigon#!."
me_saptarum_8.a: "The human dogs bow before our might!"
me_saptarum_8_tooltip: "The mission task '#Y $03_saptarum_task_7$#!' has now been #G Completed#!!"

me_saptarum_9_title: "$03_saptarum_task_8$#!"
me_saptarum_9_desc: "From the ashes of the puny settlements that served as hubs of trade throughout #Y Northern Morrigan#! true commercial cities have arisen. Bustling with #Y Human#!, #Y Dwarven#!, and even remaining #R #E Orcish#!#! traders, it is evident to all that the rising [GetCountry('SV2').GetName|T] #Y Kingdom#! is the new dominant force in the #Y Orcish Sea Trade#!!\n\nHowever, disturbing signs keep [ROOT.GetCountry.GetRuler.GetName|Y] awake past reasonable hours. As his men sorted through the loot of the ruined cities of the Orcs, #R #E Zanic#!#! weaponry as well as letters from #Y Nazani#! officials were found among the wreckage. As the #G Celticans#! and #Y Borderlanders#! were driven from the field, #Y Nazani#! coins were found in their camps. All these worrying signals just reinforce [ROOT.GetCountry.GetRuler.GetName|Y]'s sole goal ever since he retook the throne lost by his ancestors:"
me_saptarum_9.a: "#E #R The Nazani must burn#!#!"
me_saptarum_9_tooltip: "The mission task '#Y $03_saptarum_task_8$#!' has now been #G Completed#!!"

me_saptarum_10_title: "$03_saptarum_task_9$#!"
me_saptarum_10_desc: "The #Y Nazani#! cowards run from our armies! With their cities left defenseless, our men cheer as they expect sweet revenge against the feeble heirs of the #R #E Zani#!#!!\n\nHowever, the jubilant cries of our soldiers quickly turn to murmurs of confusion as [ROOT.GetCountry.GetRuler.GetName|Y] issues strict orders no looting, razing, or killing as they march to occupy the towns. While the disappointed and confused men loyally march onto grateful crowds of #R Ularian#! civilians, the few wise enough to sense the danger they are in escape to the countryside, fearful of the hidden plans of the supposed #Y Merciful Conqueror#!."
me_saptarum_10.a: "A predator among prey is not friendly, it is patient"
me_saptarum_10_tooltip: "The mission task '#Y $03_saptarum_task_9$#!' has now been #G Completed#!!"

me_saptarum_11_title: "Blood in the Water"
me_saptarum_11_desc: "While our current goals have been mainly local or internal, external events have piqued the interest of [ROOT.GetCountry.GetRuler.GetName|Y]. The #Y Silver Dwarves#! of [GetCountry('SV2').GetName|T] have dealt a crucial blow to the decadent [GetCountry('WGA').GetName|T], crippling both their army and their economy. With the path to [GetProvince('(int32)2720').GetName|G] open, we might be able to claim a piece of this rival empire while they are stumbling."
me_saptarum_11.a: "An interesting opportunity"
me_saptarum_11_tooltip: "#R We will gain a claim on [GetCountry('WGA').GetName]!#!"

me_saptarum_12_title: "$03_saptarum_task_10$#!"
me_saptarum_12_desc: "Despite the vultures circling around the ailing [GetCountry('WGA').GetName|T], [ROOT.GetCountry.GetRuler.GetName|Y] has managed to completely conquer the former lands of #R #E Zani#!#! from the incompetent #Y Emperor#! [GetCountry('WGA').GetRuler.GetName|Y]! As his royal entourage moves across his new domain, #Y Ularians#!, #Y Fidelians#!, and #Y Wegelians#! alike flock to meet the fabled #Y Magnanimous King#!, who rewards their curiosity with gifts of gold and silver from his homeland.\n\nThat night the generals and officials that have traveled with the young king are summoned to his tent. Seeking answers as to his sudden affection for the #Y Geallians#!, the disgruntled officials expect a heated discourse with their sovereign, however they are silenced immediately when they notice that the King's typically warm smile has been replaced with a chilling toothy grin."
me_saptarum_12.a: "'The time has come'"
me_saptarum_12_tooltip: "The mission task '#Y $03_saptarum_task_10$#!' has now been #G Completed#!!"

me_saptarum_13_title: "The Emperor's Fate"
me_saptarum_13_desc: "The weak man is pushed by guards into the King's throne room, collapsing onto the floor in front of him. Forced to kneel in front of [ROOT.GetCountry.GetRuler.GetName|Y], [GetCharacter('(int32)326').GetName|Y] looks up with eyes full of hatred at the man who desecrated the legacy of the Great #R #E Zanis Zani#!#!.\n\nThe pale imitation of what was once the great #Y Nazani Emperor#! shouts in defiance in the Weagelian tongue,\n\n'My empire has fallen, yet I still live. Face me, man to man, and allow me to either avenge my people or die alongside them'."
me_saptarum_13.a: "Guards, bring me my axe"
me_saptarum_edeath: "#R The King will #E execute#! the final Emperor of the Weagelians!#!"
me_saptarum_13.b: "Guards, bring him a sword"
me_saptarum_eduel: "#R The King will #E duel#! the final Emperor of the Weagelians to the death!#!"
me_saptarum_13.c: "Great men are not granted death, it shall find them when the time is correct"
me_saptarum_ebanish: "#R The King will #E banish#! the final Emperor of the Weagelians!#!"

me_saptarum_14_title: "A True Heir of Zanis"
me_saptarum_14_desc: "The duel lasts two minutes, as recalled by those present.\n\nDespite his demeanor and health, [GetCharacter('(int32)326').GetName|Y] briefly had [ROOT.GetCountry.GetRuler.GetName|Y] on the defense.\n\nAn exchange of blows followed where the King struck the #Y Emperor#! fatally.\n\nAs the frail man collapsed, the King triumphantly raised his hammer as he was met by a roar of approval.\n\nEven though his body defied him, the dying emperor's spirit would not relent. One quick and precise strike left the King with one final reminder of the strength of the heirs of #Y #R Zanis#!#!.\n\nIn a rage-filled fury the King finally strikes down the #Y Emperor#!, ending the #Y Nazani#! line and procuring cheers of celebration from the crowd.\n\nThe King orders his comrades to be silent, as he calls for the former #Y Emperor#!'s attendants to take his body back to #Y Weagelia#!. Despite their legendary grudges, there is one universal thing that any dwarf can respect: courage."
me_saptarum_14.a: "Allow the Great Emperor to rest"

me_saptarum_15_title: "The Fall of the Weagelians"
me_saptarum_15_desc: "News from far off #G Morrigon#! has reached [ROOT.GetCountry.GetRuler.GetName|Y]: The #Y Nazani#! have been killed at the hands of the #Y Silver Dwarves#! of [GetCountry('SV2').GetName|T]! While we do not relish the successes of the false claimants of #T Zanis#!' legacy, it is horrifying to see their destruction at the hands of barbarians from the west.\n\nAs news of his defiance spread amongst the common people, a new cult has arisen that worship him as a demi-god similar to the great #Y #G Zanis Zani#!#!. While we would not encourage this worship, the bravery of the #Y Nazani#! is certainly something to admire."
me_saptarum_15.a: "Only #E #R Renn#!#! can decide his fate"

me_saptarum_16_title: "The Fate of the Ularians"
me_saptarum_16_desc: "Meeting with his ministers, [ROOT.GetCountry.GetRuler.GetName|Y] begins to describe his plans for the fate of the #Y Geallians#! of #G Morrigon#!, children of the wretched #Y #R Zani#!#!.\n\nWhile most of his people cry out for blood, one lone voice speaks up for the #Y #R Ularians#!#! of the North, a #G #E Leslesi#!#! chieftain by the name of #Y Acco#!. The #Y #R Ularians#!#!, which he argues are a people who have common ancestry with the #Y Northern Borderlanders#!, are the most loyal out of all of our new subjects. If their lands should burn, we should at least do what we can to limit the damage and allow them to escape the upcoming vengeance of the #Y Galmar#!."
me_saptarum_16.a: "Any people that march alongside the Weagelians are our enemies"
me_saptarum_eularianraze: "#R We will #E raze#! the cities of the #E Ularians#!!#!"
me_saptarum_16.b: "Allow them to flee"
me_saptarum_eulariansave: "#R We will allow the #E Ularians#! a chance to flee!#!"

me_saptarum_17_title: "The Fate of the Fideli"
me_saptarum_17_desc: "With the #Y Ularians#! dealt with, the King and his ministers now argue about what to do with the #Y Fideli#! of #Y Southern Wegalia#!.\n\nWhile most continue to loudly voice their support for their destruction, a small group of more pragmatic nobles offer another suggestion. They argue for the enslavement of the able-bodied men and women to work on the various farms and workshops of our growing empire."
me_saptarum_17.a: "The Geallian spirit must be burnt at the root"
me_saptarum_efideliraze: "#R We will #E raze#! the cities of the #E Fideli#!!#!"
me_saptarum_17.b: "They will serve as excellent slaves"
me_saptarum_efidelisave: "#R We will #E enslave#! the #E Fideli#!!#!"

me_saptarum_18_title: "The Fate of the Weagelians"
me_saptarum_18_desc: "With the fate of all the other #Y Geallians#! dealt with, the only people left to receive punishment are the heirs of the #Y #R Zani#!#! themselves: the #Y #R Weagelians#!#!.\n\nWhen [ROOT.GetCountry.GetRuler.GetName|Y] brings up the topic of the #Y Weagelians#! his entire tent goes silent. A room full of tense, hateful eyes barely hide the unspeakable hatred that his officials attempt to manifest into words. Finally, one man speaks. #Y 'Weagelia verr brennthou!'#!. Overpowered by emotion, his tent is filled with this singular chant.\n\n#Y #R 'Weagelia verr brennthou!'#!#!\n\n#Y #R 'Weagelia Verr Brennthou!'#!#!\n\n#Y #R 'WEAGELIA VERR BRENNTHOU!'#!#!"
me_saptarum_18.a: "#E #R Weagelia must burn#!#!"
me_saptarum_eweageliraze: "#R We will #E raze#! #E Weagelia#!!#!"
me_saptarum_18.b: "Spare the rural folk"
me_saptarum_eweagelisave: "#R We will #E raze#! the #E Weagelian#! cities!#!"

me_saptarum_19_title: "The Forrj City"
me_saptarum_19_desc: "Through our conquests and destruction we have managed to accrue a large amount of wealth that the King has reinvested into our capital. Through careful planning and large projects, the city once nicknamed the #R #E 'Ruined City'#!#! has risen alongside our kingdom to become the jewel of our empire. Our new #Y #R 'Forrj City'#!#! will be recognized by all as one of the premier cities of the world, a true mountain metropolis!\n\n'Our domain now ecompasses nearly all of #Y Northern Morrigon#!, and our new status as a major power of #G Omniluxia#! should be recognized by all. No longer are we simply the #Y Saptans#! of the #Y Saptarum Kingdom#!, but the reborn sons of [GetCharacter('(int32)73').GetName|Y], an empire reborn from the burning of our ancient enemy, whos souls fuel our ascendance.'\n\nThus declared [ROOT.GetCountry.GetRuler.GetName|Y], the first #Y Emperor#! of #Y #R Forrjkheim#!#!."
me_saptarum_19.a: "From the embers of the Zani we shall rise!"
me_saptarum_19_tooltip: "The mission task '#Y $03_saptarum_task_12$#!' has now been #G Completed#!!"

me_saptarum_20_title: "$03_saptarum_task_13$#!"
me_saptarum_20_desc: "A whole year as passed since the rebuilding of #Y Wegalia#! was started. #Y Dwarf#! and #Y Human#! alike have worked side-by-side to rebuild the damage done by marauding bandits, rouge soldiers, and the King's revenge. Together, the #Y Galmar#! and the #Y Leslesi#! have been able to repopulate the ruined cities of #Y Wegalia#!, bringing peace and stability to the lands East of the #G Wall of God#!.\n\nTruly our people have been blessed by the great [GetCharacter('(int32)64').GetName|Y] and [GetCharacter('(int32)74').GetName|Y], as we can finally work towards a lasting peace with the #Y Geallians#! who we've spent hundred of years hating."
me_saptarum_20.a: "Wegalia is now truly ours!"
me_saptarum_20_tooltip: "The mission task '#Y $03_saptarum_task_13$#!' has now been #G Completed#!!"

me_saptarum_21_title: "$03_saptarum_task_14$#!" 
me_saptarum_21_desc: "With the pretender defeated, the merchant families of [GetCountry('SV2').GetName|T] gather and agree that change must occur to ensure that a threat like this can never arise again.\n\nFirst, it was agreed that the family rivalries must not get in the way of governance. The former #Y Family Council#! will be divided evenly between the three families, with each one receiving five seats on it for a total of fifteen council members. #Y One of our#! members will be elected as the #Y Hatamögg#!, or 'Speaker', for our council and be the face of our Republic abroad.\n\nSecondly, the new council will pass civic reforms to restrict citizenship and therefore political power and education to the upper classes to ensure that the bureaucracy remains in our control.\n\nFinally, this council intends to pass army reforms to allow only citizens to lead armies, cementing our control over the military. To ensure we have enough manpower, any freeman who serves in the military for more than ten years will gain citizenship for them and their descendants.\n\nThe '#Y #G Thyrr Ubaturren#!#!', or '#Y Three Reforms#!', as they come to be known as, will be fundamental in ensuring stability in our new republic." 
me_saptarum_21.a: "Long live the republic!" 
me_saptarum_21_tooltip: "The mission task '#Y $03_saptarum_task_14$#!' has now been #G Completed#!!"

me_saptarum_22_title: "$03_saptarum_task_15$#!"
me_saptarum_22_desc: "Annexing the people of [GetProvince('(int32)2651').GetName|G] has brought both their resources and manpower into the capable hands of our republic. Having solidified our power, we can now look to expand our influence throughout the region!"
me_saptarum_22.a: "Our republic grows"
me_saptarum_22_tooltip: "The mission task '#Y $03_saptarum_task_15$#!' has now been #G Completed#!!"

me_saptarum_23_title: "$03_saptarum_task_16$#!"
me_saptarum_23_desc: "The newfound partnership between the new council and the #G #E Leslesi#!#! chiefs has brought much strength to our burgeoning republic!\n\nWhile they're able to provide us with their fearsome warriors and skilled trackers, our administrators and traders help them found permanent large settlements where the chiefs can increase their own personal wealth as well as grow the wealth of their communities!"
me_saptarum_23.a: "To our partnership!"
me_saptarum_23_tooltip: "The mission task '#Y $03_saptarum_task_16$#!' has now been #G Completed#!!"

me_saptarum_24_title: "$03_saptarum_task_17$#!"
me_saptarum_24_desc: "Initially arriving as exiled traders, our people managed to coexist with the xenophobic #R #E Orcish#!#! colonists when they first arrived over two centuries ago. However, their continued hostile expansion into #Y Northern Morrigon#! has made such cooperation inevitable, as they took our rightful lands as well as much of our influence in the #G Orcish Sea#!!\n\nNow, the tides have finally turned and we have reclaimed our lands and the #Y Orcish Sea Trade#!!"
me_saptarum_24.a: "Lets get rich!"
me_saptarum_24_tooltip: "The mission task '#Y $03_saptarum_task_17$#!' has now been #G Completed#!!"

me_saptarum_25_title: "$03_saptarum_task_18$#!"
me_saptarum_25_desc: "The #R #E Emzali#!#! and #Y #R Munthzali#!#! tribes of to our south have raided our lands and disrupted our trade for centuries. However, with help from our #G #E Leslesi#!#! allies they shall terrorize our people no more! Our armies now march through their hovels, teaching these savage brutes to respect our power!"
me_saptarum_25.a: "The humans will kneel to us"
me_saptarum_25_tooltip: "The mission task '#Y $03_saptarum_task_18$#!' has now been #G Completed#!!"

me_saptarum_26_title: "$03_saptarum_task_19$#!"
me_saptarum_26_desc: "People from nearby villages have flocked to see our great #G Merchant Fleet#! set sail!\n\nWith this new navy, pirates and raiders seeking to wreck havoc upon ports or fishing villages will be a concern of the past, as republican sails will instill fear into the hearts of pirates. The safety our sailors provide shall pursuade merchants from across the #G Orcish Sea#! to trade in our ports, providing our kingdom with wealth unseen since the #Y Saptan Golden Age#!!"
me_saptarum_26.a: "The Orcish Sea is ours!"
me_saptarum_26_tooltip: "The mission task '#Y $03_saptarum_task_19$#!' has now been #G Completed#!!"

me_saptarum_27_title: "$03_saptarum_task_20$#!"
me_saptarum_27_desc: "The new #G #E Leslesi#!#! colonies bustle with life as our more urbanized and civilized allies impart their knowledge and culture onto the more savage #R #E Borderlander#!#! and #R #E Celtican#!#! tribesmen that occupy the lands near the #G Marshlands#!!\n\nWith help from our allies, these new friendly centers of administration have been able to increase our dominion over the south!"
me_saptarum_27.a: "We shall grow alongside our allies!"
me_saptarum_27_tooltip: "The mission task '#Y $03_saptarum_task_20$#!' has now been #G Completed#!!"

me_saptarum_28_title: "$03_saptarum_task_21$#!"
me_saptarum_28_desc: "Two distinguished council members talk at the formers mansion, admiring a piece he commissioned from the famous #Y Gavnn Hraldhrtt#!\n\nThe small silver figure is meant to resemble the patron, with its features ornately carved and clothes decorated with golden buttons. The two men murmur their opinions, not allowing the other to hear their true thoughts on the piece. Finally, the guest speaks up:"
me_saptarum_28.a: "I dont really get this piece, but it looks expensive!"
me_saptarum_28_tooltip: "The mission task '#Y $03_saptarum_task_21$#!' has now been #G Completed#!!"

me_saptarum_29_title: "Construction of the Sørrsalla Begins"
me_saptarum_29_desc: "The wealth flowing into our nation has led the many wealthy noblemen and traders to seek finer luxuries and artistic crafts that aim to surpass even the great works of silver from the #T First Kingdom of Srrørum#!!\n\nRecently, numerous traders and artists have appeared at council meetings to push forward plans for a new meeting hall. This #Y 'Great Hall'#!, while expensive, may provide patronage to our new artists as well as create a lavish symbol of the power of our republic!"
me_saptarum_29.a: "Get to work right away!"
me_saptarum_29_tooltip: "#Y We will begin construction on the #E Sørrsalla#!!#!"

me_saptarum_30_title: "The Great Hall Completed"
me_saptarum_30_desc: "My #Y Hatamögg#!, our great project is now complete!\n\nThe #Y Sørrsalla#!, or #Y Great Hall#!, is a large pantheon-like building made of marble and furnished with great chairs and tables of fine wood and cloth. The main room is filled with silver statues of our ancestors and noblemen while the golden heads of mythical beasts look down at guests from the ceiling. Looking around, visitors notice the walls of this great room are lined with large woolen tapestries of our greatest achievements, battles, statesmen, and warriors.\n\nWhile this project could be considered expensive,  in return we now host a physical symbol of our wealth and authority to the masses and to the wider world!"
me_saptarum_30.a: "It's beautiful!"
me_saptarum_30_tooltip: "The mission task '#Y $03_saptarum_task_22$#!' has now been #G Completed#!!"

me_saptarum_31_title: "$03_saptarum_task_23$#!"
me_saptarum_31_desc: "Long ago, we made the foolish mistake of thinking that our city's naturally defensible position would protect us from invaders, and our hubris led to our destruction. Now we face a new problem of overpopulation, as our ancient city cannot adequately house or sustain the influx of people that are migrating here.\n\nWith some careful planning, we are able to solve both problems. By patronizing artists and architects to rebuild our city, a new metropolis can arise out of the embers of our old capital. Walls as tall as the great #Y Walls of God#! that surround our city now rise out of the ground around our new capital, capable of defending attacks from even mighty dragons!\n\nWith these new improvements, our city has truly ascended to become one of the few #Y Sørrborr#!, or 'Great #G Metropolis#!' of the #Y Dwarven#! World!"
me_saptarum_31.a: "The Forrj City rises"
me_saptarum_31_tooltip: "The mission task '#Y $03_saptarum_task_23$#!' has now been #G Completed#!!"

me_saptarum_32_title: "Ton Ubaturren ulfton Thorgarren"
me_saptarum_32_desc: "After weeks of negotiations and debates, the leaders of both parties have managed to find a compromise. The following series of laws, known to all as the '#Y #G Ubaturren ulfton Thorgarren#!#!', or #Y #G Reforms of the Citizens#!#!, are passed:\n1 - Citizenship will be extended to all freemen regardless of prior military service.\n2 - The council, now called the '#Y Sørrhlturr#!', the Great Thing, will be split into two branches. The '#Y Ghlattanvindr#!', or Father House, will be made up of 15 members of the Great Merchant families just like during the times of the #G Thyrr Ubaturren#!, while the '#Y Arnnanvindr#!', or Son House, will be made up of 100 representatives elected by their fellow citizens. Election terms for the #Y Ghlattanvindr#! will be 4 years while it will be every two years for the #Y Arnnhtlurr#!.\n3 - The #Y Hatamögg#! role will be elected from #Y Ghlattanvindr#! every four years by the members of the #Y Arnnanvindr#! and serve as the face of the republic in international affairs, commander in chief of the army, and ensure laws passed by the #Y Sørrhlturr#! are enforced onto the nation.\n4 - The #Y Ghlattanvindr#! will be in charge of commercial and military affairs while the #Y Arnnanvindr#! will be in charge of civilian and naval affairs. Both can present possible legislation which can be vetoed by the other. The #Y Ghlattanvindr#! requires a majority vote to pass legislation while the #Y Arnnanvindr#! required 3/4ths agreement to pass legislation. Possible legislation must be passed by both houses to become law.\n\nHaving formed a new government, the first #Y Sørrhlturr#! makes a unanimous decision. No longer are we a simple 'rum', as we are no longer waiting for a king to return. Our new republic, born from the unity of the #Y Saptan#! people, will be called #Y #G Srrøveldi#!#!, or the #Y #G Silver Republic#!#!."
me_saptarum_32.a: "Together our republic grows stronger!"
me_saptarum_32_tooltip: "The mission task '#Y $03_saptarum_task_23$#!' has now been #G Completed#!!"

me_saptarum_33_title: "An Equal Society"
me_saptarum_33_desc: "The rising support for universal #Y Leslesi#! citizenship has led to numerous debates in both the #Y Ghlattanvindr#! and the #Y Arnnanvindr#! and between the two houses. Weeks passed with no meaningful solutions or compromises passed until one shocking announcement changed the debates altogether. A pair of bright young #Y Leslesi#! statesmen were adopted into the #Y Segurrvelk#! family by an older retired merchant who had no heirs. The brothers, #Y Vodenos#! and #Y Cavarus#!, debated together with their new platform, their exemplary oratory skills making many old guard senators sympathetic towards #Y Leslesi#! citizenship.\n\nFinally, after around a year of debates and legislation, the '#Y #G Janirr Thorgarren#!#!' #Y Laws#! were finally passed by both houses, granting universal citizenship to all freemen of #Y Leslesi#! descent as well as equal status and rights as #Y Galmar#! dwarves."
me_saptarum_33.a: "United our people stand strong!"
me_saptarum_33_tooltip: "The mission task '#Y $03_saptarum_task_24$#!' has now been #G Completed#!!"


###########NON MISSION EVENTS
saptarum.1.t: "The Return of the King"
saptarum.1.desc: "Three Hundred Years have passed since the fall of our kingdom, the end of our royal line, and the end of our golden age. Since then, the #Y Council of Elders#! that ruled in their absence have been overthrown by the #Y Great Merchant Families#! of the city, who, through commerce and intrigue, wrested control of the city and its army from the former custodians of the throne. However, today a stranger has appeared before the three families, claiming the vacant throne.\n\nHe claims to be [SCOPE.sChar('rebel_scum').GetName|Y], a child descended from relatives of our final king, #Y Inarr Aspatta#!, who escaped during the #R #E Great Sacking of [GetProvince('(int32)2559').GetName]#!#!. However, this pretender has provided substantial documents to prove his claim, and is backed by an army of peasants from his home territory. The #Y Kvaran#! and the #Y Otensonn#!, eager to use this young king to unseat the more populist #Y Segurrvelk#!, argue for his restoration. However, the #Y Segurrvelk#! counter with the threat he poses to the current rule of the families, and urge the other two families to remember their own coup of the previous oligarchy. While many members of the #Y Kvaran#! and #Y Otensonn#! are swayed by the #Y Segurrvelk#!'s passionate orations, they must make a decision."
saptarum.1.a: "The families will stand together against this stranger!"
saptarum.1.b: "He will be a useful tool against the family of commoners"

saptarum.2.t: "A Union of Two Peoples"
saptarum.2.desc: "Due to #Y Silver Dwarven#! society's emphasis on family and community, having a child with an outsider is considered a major taboo. Even though this view is normally lax in larger cities, interracial relationships are still very uncommon.\n\nRelationships between #Y Silver Dwarves#! and #Y humans#! are normally isolated incidents, with the child and couple being ostracized from #Y Silver Dwarven#! society. However, due to the increasing urbanization and the close relationship between our communities, there has been a growing number of mixed #Y Leslesi#! and #Y Silver Dwarven#! couples. The sheer quantity of these couples have led to significant populations of '#Y Halflings#!', or '#Y Itllmurren#!' as the elders call them, appearing in major cities.\n\n Despite discrimination, many grown to accustomed to and even accepted the existence of this fledgling race, a symbol of the unbreakable bond of the #Y Galmar#! and #Y Leslesi#!.\n\nThese #Y Silver Halflings#! have proved themselves as savvy merchants and hardy warriors, and growing numbers of #Y Silver Dwarves#! and #Y Leslesi#! have been pushing for their integration into the republic. However, there are still those who wish to see tradition prevail."
saptarum.2.a: "They are citizens like you and I!"
saptarum.2.a_tooltip: "#Y The republic will accept the #E Itllmurren#! as citizens#!"
saptarum.2.b: "Send them off to a far corner of our country"
saptarum.2.b_tooltip: "#Y The republic will grant these #E Itllmurren#! a small princedom to our south#!"


saptarum_stooltip_1: "#Y No offices must be filled by the #!#T #E Kvaran#!#!#Y  or #!#T #E Otensonn#!#!#Y .#!"
saptarum_stooltip_2: "#Y New talented individuals will be found to serve the King!#!"
saptarum_stooltip_3: "#Y The #R Forrj Guard#! will join the Royal Army as a vanguard!#!"
saptarum_stooltip_4: "#Y #G Leslesi#! must be considered #G citizens#!!#!"
saptarum_stooltip_5: "#Y #G Leslesi#! settlers will migrate to our cities!#!"
saptarum_stooltip_6: "#Y We will gain claims on the #G Orcish Sea#! region!#!"
saptarum_stooltip_7: "#Y All conquered #E Human#! and #E Orcish#! #G Cities#! must have a #G Port#! and a #G Market#!!#!"
saptarum_stooltip_8: "#Y #G Galmar #! colonists will migrate to our new cities!#!"
saptarum_stooltip_9: "#Y We will #E raze#! all #E Nazani#! cities!#!"
saptarum_stooltip_10: "#Y All former #E Nazani #! cities must have a #G Provincial Legation#!!#!"
saptarum_stooltip_11: "#Y All former #E Nazani #! cities will be rebuilt according to our vision!#!"
saptarum_stooltip_12: "#Y All #E Borderlander #G Colonies#!#! must have #T City Status#!, an #G Academy#!, #G Court of Law#!, and a #G Forum#!!#!"
saptarum_stooltip_13: "#Y #E #G Leslesi#!#! colonists will migrate to these new cities!#!"
saptarum_stooltip_14: "#Y Our nobles and citizens will debate on the future of our government!#!"
saptarum_stooltip_15: "#Y Both #E Leslesi#! and #E Galmar#! citizens will attempt to push for the equality of the #E Leslesi!#!#!"
saptarum_stooltip_16: "#Y We will gain claims on the neighboring #R #E Borderlanders#!#!!#!"
saptarum_stooltip_17: "#Y We will gain claims on #E Northern Wegalia#!!#!"
saptarum_stooltip_18: "#Y We will gain claims on the #E #R Nazani#!#! heartland!#!"

