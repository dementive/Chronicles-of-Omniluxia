l_english:

# Event text for the Nazani mission tree. Mission, task, tooltip, and modifier text lives in 01_nazani_l_english.yml.

# ==============================================================================
# TASK 13 EVENTS: SECRET ACCORD WITH THE ORCS
# ==============================================================================

me_nazani.1.t: "The Silent Dawn"
me_nazani.1.desc: "Before the sun breaks the horizon, a figure enters the imperial palace through channels known only to the #T Purple Emperor#! and [ROOT.GetCountry.GetRuler.GetHerHis] most trusted courtiers. The visitor is an #Y Orcish#! warrior — scarred, powerful, and bearing the unmistakable aura of one that is comfortable with killing. It is [SCOPE.sCharacter('orcish_captain').GetName|Y], a name that is very familiar to [ROOT.GetCountry.GetRuler.GetName|Y]. For many years, Grommash has received a princely sum from the #Y Nazani#! treasuries to serve as our agent in the #G Borderlands#! - a situation that has, so far, proved to be mutually beneficial, albeit very expensive to maintain.\n\nDasrunp spoke in a cold, clear voice. 'I appreciate you making the journey to [ROOT.GetCountry.GetCapital.GetName|Y] in person, Grommash - the matters that we are about to discuss could not be trusted to courier. Are your men ready?'\n\n'Everything awaits your command, my #Y Emperor#! - my men are in place and will gather for the invasion once I give the word. But before we blacken our blades with #Y Borderlander#! blood, I must ask you; have you considered my previous request?'\n\nDasrunp frowned, his eyes narrowing slightly - he had forgotten their previous conversation until now. Grommash had promised to deliver the #Y Emperor#! the #G Borderlands#! when the time came to strike, but the price he asked for in return was steep - the Orc wanted to become #Y Governor#! of the province once the war concluded."

me_nazani.1.a: "Let us win this thing first, Grommash, and then we will see"
me_nazani.1.a.tt: "The #Y Nazani Empire#! will gain claims on all territories in the #E Borderlands#!. Grommash will begin gathering his men; accepting their aid in the next event will declare war on the foreign ruler of [GetProvince('(int32)2187').GetName|Y], unless we are already at war with them."
me_nazani.1.b: "The time for the invasion is not right..."
end_event_chain_tt: "#Y This will end the event chain.#!"

me_nazani.2.t: "The Green Tide Gathers"
me_nazani.2.desc: "One week has passed since Grommash's visit to the imperial palace. Since then, the Orc has called in favors owed to him, awakened blood pacts between the clans, and hired a couple thousand mercenaries. His army, the #H Green Tide#!, is gathering in the city of [GetProvince('(int32)2347').GetName|Y], and is a force numbering perhaps six thousand strong.\n\nYet there is a complication. The #Y Orcish#! captain's presence in our lands is known to our enemies. Spies report that the power controlling [GetProvince('(int32)2187').GetName|G] has discovered Grommash's involvement with us, and there are rumors that he has been offered a hefty sum to betray us in the hour of battle.\n\nThe decision rests with [ROOT.GetCountry.GetRuler.GetName|Y]. Will we commit fully, or does the scope of what we have heard give us pause?"

me_nazani.2.a: "Bah! I trust Grommash - let his men gather for the attack"
me_nazani.2.a_tt: "We will gain an army in #Y Esenzeu#! and #R declare war#! on the foreign ruler of [GetProvince('(int32)2187').GetName|Y], unless we are already at war with them."
me_nazani.2.b: "This has gone too far. Abandon the attempt while we still can."

me_nazani.3.t: "The Point of No Return"
me_nazani.3.desc: "Grommash stands at the gates of [GetProvince('(int32)2347').GetName|Y] with his armies and has sent word to [ROOT.GetCountry.GetCapital.GetName|Y] that his men are ready to march. The #G Green Tide#! has answered our summons, and the #Y Orcish#! captain now asks whether the #P Purple Emperor#! will stand by the bargain that brought them here.\n\nThe #G Borderlands#! are to be taken in the #Y Emperor#!'s name, and Grommash expects their governorship when the fighting is done. To dismiss him now would cost us his host; to keep him is to accept the price of his loyalty."

me_nazani.3.a: "At long last, we retake the Borderlands for the Nazani Empire!"
me_nazani.3.a_tt: "If [GetProvince('(int32)2187').GetName|Y] is still held by a foreign ruler with whom we are at peace, we will #R declare war#!. Grommash will expect the #Y governorship of the Borderlands#! once we hold his stronghold and are at peace."
me_nazani.3.b: "Recall Grommash and dismiss his host"

me_nazani.4.t: "The Marshlands Beckon"
me_nazani.4.desc: "With half the #Y Borderlands#! under imperial or subject rule, the roads into the ancestral wetlands lie open before us. At the court of [ROOT.GetCountry.GetRuler.GetName|Y], old maps are unrolled and the names of lost provinces spoken aloud once more. The scattered lords of the marsh may have forgotten their allegiance, but the #P Purple Throne#! has not forgotten its inheritance.\n\nOur claims are laid before the world, and the granaries and musters stand ready to sustain the reconquest. When the imperial banners are carried into the fenlands, they shall go at the #Y Emperor#!'s command."
me_nazani.4.a: "The marshes will remember the purple."

me_nazani.5.t: "The Dragon's Throne Beckons"
me_nazani.5.desc: "An imperial foothold in the #G Marshlands#! has opened the roads toward #G Kainaxarthos#!. Before the assembled court, the #T Purple Emperor#! reasserts our claim to the dragon-lands. The treasury must be prepared, the armies mustered, and our subjects summoned before the reckoning with #Y Soventeir#!. The moment to march remains ours to choose."
me_nazani.5.a: "For Kainaxarthos, and for the Zani name."

# ==============================================================================
# GROMMASH'S REWARD OR REVOLT
# ==============================================================================

GROMMASH_REVOLT_NAME: "Grommash's Horde"

me_nazani.8.t: "The Broken Promise"
me_nazani.8.desc: "Six months have passed since the #G Green Tide#! marched to liberate [GetProvince('(int32)2187').GetName|Y], and still no charter has come. [SCOPE.sCharacter('orcish_captain').GetName|Y] delivered the [GetProvince('(int32)2187').GetArea.GetRegion.GetName|Y] as he swore he would — every marsh-track, every stinking hillfort, every clan-hall — and now he is again agitating for the governorship that he feels he is owed.\n\nOne morning, word arrived at [ROOT.GetCountry.GetCapital.GetName|Y] that the #G Green Tide#! has raised its banners once more — only this time, they are not raised for the #T Purple Emperor#!. The clans Grommash called to war remember who bled for these lands, and they remember who was cheated of the reward.\n\n'I asked for one thing,' the messenger repeated Grommash's words flatly. 'One province, for a war won, to be ruled in your name. The #Y Emperor#!'s memory is short. Mine is not. The #G Borderlands#! were taken by Orcs — and by Orcs they will be held.'"
me_nazani.8.a: "Then take them if you can, traitor!"
me_nazani.8.a_tt: "#R Grommash seizes the [GetProvince('(int32)2187').GetArea.GetRegion.GetName|Y]#! and rises in #R Civil War#! against the [ROOT.GetCountry.GetName|Y]."

me_nazani.9.t: "The Promise Kept"
me_nazani.9.desc: "The charter was sealed in imperial purple and carried to the palace in [GetProvince('(int32)2187').GetName|Y] with all due ceremony; [SCOPE.sCharacter('orcish_captain').GetName|Y], renowned leader of the dreaded #G Green Tide#!, was officially confirmed as #Y Governor#! of the [GetProvince('(int32)2187').GetArea.GetRegion.GetName|Y], with all of the privileges that accompany such titles.\n\nIt is an unusual thing to see, an Orc seated in an imperial governorship, and the older families of [ROOT.GetCountry.GetCapital.GetName|Y] grumble at the breach of protocol. 'Let them complain, the sniveling dogs...' [ROOT.GetCountry.GetRuler.GetName|Y] sneers, knowing that one loyal man in a high position is worth ten of the fawning nobles kissing [ROOT.GetCountry.GetRuler.GetHerHis] robes.\n\nFor his part, Grommash keeps his word as sharply as he keeps his axe. The #G Borderlands#! he conquered he now holds in the #Y Emperor#!'s name, and the clans that followed him to war have their reward; land, title, and a lord of their own blood answering to the #T Purple Throne#!. As the old #Y Nazani#! saying goes, 'A bargain honored is a bargain that holds.'"
me_nazani.9.a: "A promise honored is a border secured"

me_nazani.20.t: "The Terror of the Deep"
me_nazani.20.desc: "It began as a sailors' rumor, dismissed as the raving of men too long at sea; a whale of monstrous size, pale and scarred, haunting the shipping lanes of the [ROOT.GetCountry.GetName|Y]. Today the rumor became a horror witnessed by thousands of terrified locals.\n\nThe beast rose beneath the wharves of [SCOPE.sP('porphyros_target').GetName|Y] like a living reef, splintering hulls and docks alike, dragging trireme and fishing skiff into the deep. When at last it sounded and vanished, the harbor works of the city lay in ruins and the water was black with wreckage.\n\nThe fishermen have already given it a name — #Y Porphyrion#!, the Purple-Dark — and they swear it will return."
me_nazani.20.a: "The gods have sent this curse. We can only endure it"
me_nazani.20.b: "Rally the harbor! Salvage what we can and pay for the rest"

me_nazani.22.t: "The Beast Feeds"
me_nazani.22.desc: "#Y Porphyrion#! has returned to the waters off [SCOPE.sP('porphyros_target').GetName|Y]! This time it does not content itself with breaking ships, but the great beast is now attacking our poor people and eating them alive. Witnesses speak of the great mouth rising among the swimmers and boatmen of the harbor, of men and women vanishing in a single dreadful gulp.\n\nThe docks empty as word spreads - no crew will put to sea while the Purple-Dark hunts, and the wailing of the bereaved carries through the streets long after the sun has set. How shall the [ROOT.GetCountry.GetRulerTitle] answer?"
me_nazani.22.a: "There is nothing to be done against such a monster"
me_nazani.22.b: "Arm the boats with escorts - no more of my people to that maw"

me_nazani.23.t: "Panic on the Docks"
me_nazani.23.desc: "The mere shadow of #Y Porphyrion#! beneath the surface off [SCOPE.sP('porphyros_target').GetName|Y] has been enough to send the locals into a blind panic. A cry goes up that the feared beast had returned, and the whole waterfront dissolved into chaos — stalls overturned, valuable cargoes abandoned in the streets, and there was even a stampede at the customs house that left men trampled.\n\nMerchants speak openly of moving their trade to safer harbors. If this fear is left to fester, it will do more damage to the [ROOT.GetCountry.GetName|Y] than the whale's own jaws."
me_nazani.23.a: "Let them be afraid. Fear passes."
me_nazani.23.b: "Send patrols and criers to steady the people. Whatever the cost."

me_nazani.24.t: "The Convoy Lost"
me_nazani.24.desc: "A treasure convoy bound for [SCOPE.sP('porphyros_target').GetName|Y], its holds heavy with the season's revenues, never made port. The one survivor, half-mad and clinging to a spar, tells of #Y Porphyrion#! surfacing beneath the flagship and folding it in two, then circling the wreck to take the rest at leisure.\n\nThe gold now rests on the sea floor with the drowned. Worse still, every captain in the realm will now think twice before carrying the treasury's wealth by water."
me_nazani.24.a: "The sea has taken it. Write it off and move on."
me_nazani.24.b: "Reorganize the sea lanes and stagger the shipments. See it done."

me_nazani.25.t: "The Death of Porphyrion"
me_nazani.25.desc: "For thirty years the Purple-Dark ruled the coasts of the [ROOT.GetCountry.GetName|Y], and a whole generation grew up beneath its shadow. Then, on a gray morning, it came ashore near [SCOPE.sP('porphyros_target').GetName|Y] — not to hunt, but to die.\n\nThe titan lies stranded on the sand, its pale flanks heaving ever slower, the scars of thirty years of ramming ships written across its hide. By evening it is still. Crowds gather in disbelief, then in a roar of relief that rolls from harbor to harbor across the whole realm. The terror is ended. Now only the question remains of what to do with the mountain of flesh the sea has given us."
me_nazani.25.a: "Harvest it — oil, bone, and baleen to fill our coffers."
me_nazani.25.b: "The gods delivered us. Let us give thanks with fitting rites."

# ==============================================================================
# TASK 14 EVENTS: THE MARSHLANDS BECKON
# ==============================================================================

me_nazani.14.t: "The Waters Rise"
me_nazani.14.desc: "A proclamation bearing the imperial seal has reached the #G Marshlands#!. The #P Purple Emperor#! lays claim to the ancestral wetlands, naming our towns and waters among the lost possessions of the #Y Nazani Empire#!.\n\nOur lords gather to hear the demands read aloud. Some dismiss them as the boasting of a distant court; others remember the old roads through the #G Borderlands#! and wonder how long it would take an imperial host to reach them. No army follows the messenger, but the warning is plain enough.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] must prepare for the day when the imperial purple appears above the marshes."

me_nazani.14.a: "Let the Emperor come. We will be ready."
me_nazani.14.a_tt: "The #Y Nazani Empire#! claims the #Y Marshlands#!. This proclamation does not declare war."

# ==============================================================================
# TASK 15 EVENTS: THE CLAIM TO KAINAXARTHOS
# ==============================================================================

me_nazani.15.t: "The Dragon's Throne Beckons"
me_nazani.15.desc: "A proclamation arrives, bearing the seal of the #P Purple Emperor#! and the insignia of the reborn #Y Nazani Empire#!. The message names the dragon-lands, and particularly the great city of #G Kainaxarthos#!, as rightful #Y Zani#! patrimony. What was seized in the chaos of imperial collapse, the western court now demands be restored.\n\nThe courtiers of [ROOT.GetCountry.GetRuler.GetName|Y] hear the proclamation in uneasy silence. A claim written in ink may yet be pressed with iron, and the old quarrel with the #Y Nazani#! has lost none of its bitterness.\n\nFor now, the messenger carries words rather than a declaration of war. The #Y Dragon#!'s Throne must see to its defenses before the #Y Emperor#! chooses to send soldiers in his place."

me_nazani.15.a: "An imperial seal does not make these lands theirs."

# ==============================================================================
# NICKNAMES
# ==============================================================================

NICKNAME_THE_DRAGON_SLAYER: "'The Dragon Slayer'"
NICKNAME_THE_CRUEL: "'The Cruel'"

# ==============================================================================
# TASK COMPLETION EVENTS
# ==============================================================================

me_nazani.101.t: "The Winter Capital Restored"
me_nazani.101.desc: "The scaffolding comes down and the imperial standards rise over [GetProvince('(int32)2720').GetName|Y]. What was once a seasonal retreat for eastern emperors is now the permanent seat of the western court, its halls readied to house the whole apparatus of #Y Nazani#! rule.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] walks the renewed streets and understands the meaning of the work; the #T Empire of the West#! now has a heart of its own."
me_nazani.101.a: "Let the court make its home here."

me_nazani.102.t: "The Unconquered Zani"
me_nazani.102.desc: "After many weeks of grueling labor, the sacred precinct around the #T Temple of the Unconquered Zani#! has been renewed and the people of [ROOT.GetCountry.GetCapital.GetName|Y] are praising [ROOT.GetCountry.GetRuler.GetName|Y] for spearheading the restoration efforts.\n\nIt must be said that the Temple looks practically brand new. Its marble columns have been gilded with fine gold, its pediments repaved with marble from #Y Luxterra#!, and its interior has been purified and sanctified by ritual and practice. Priest, peasant, and #Y Emperor#! are bound together in the dutiful worship of #T Zanis#!, for all are equal under his eye, and the people of [GetProvince('(int32)2720').GetName|Y] see the hand of our great ancestor and god guiding [ROOT.GetCountry.GetRuler.GetFirstName|Y] at this very moment."
me_nazani.102.a: "I will not fail my ancestors...the blood of Zanis flows within me!"

me_nazani.103.t: "The Purple Workshops"
me_nazani.103.desc: "Under imperial charter, the mills and dye-houses of [GetProvince('(int32)2720').GetName|Y] have been organized into a courtly industry. The famed purple cloth that clothes officials, priests, and merchants across the realm now flows through guilds answerable to the palace.\n\nCeremonial prestige has become lasting revenue, and the treasury of [ROOT.GetCountry.GetRuler.GetName|Y] is the richer for it."
me_nazani.103.a: "Let the looms of empire never rest."

me_nazani.104.t: "The Imperial Chancery"
me_nazani.104.desc: "Clerks bend over ledgers, seals press into wax, and couriers depart bearing the will of the #T Purple Emperor.#! The new chancery gives the #Y Nazani#! court the one thing soldiers cannot provide: the patient machinery of administration that turns a ceremonial capital into a governing one.\n\nEvery governor now knows that his reports will, in time, reach the palace of [ROOT.GetCountry.GetRuler.GetName|Y], and as long as they can be a little patient, they will eventually receive a reply from the [ROOT.GetCountry.GetRulerTitle]."
me_nazani.104.a: "The empire is held together by ink as much as iron"

me_nazani.105.t: "The Granaries Of Wegalia"
me_nazani.105.desc: "The fields, fisheries, and cattle-lands around [GetProvince('(int32)2720').GetName|Y] have been drawn into a single food network, its granaries filled against the lean seasons of war and intrigue. The capital can grow now on more than purple cloth and imperial pride.\n\nA city that can feed itself is a city that cannot be starved into submission."
me_nazani.105.a: "Let the storehouses stand full."

me_nazani.106.t: "Pdeso Rises"
me_nazani.106.desc: "The stone walls of [GetProvince('(int32)3382').GetName|Y] have been raised higher and its harbor works extended, and the #T Purple Emperor#! has proclaimed it the second city of the realm. The #Y Nazani#! homeland now leans toward the sea — toward ports, fortresses, and the disciplined projection of imperial power along the southern coast.\n\nPdeso is the shield of the southern sea, and it answers to [ROOT.GetCountry.GetRuler.GetName|Y]."
me_nazani.106.a: "The south is secured."

me_nazani.107.t: "Esenzeu Rises"
me_nazani.107.desc: "In the fortified city of [GetProvince('(int32)2347').GetName|Y], glassmakers, garrisons, and the keepers of the Great Wolf rites have received the #T Purple Emperor#!'s charter. Raised as the second city of the realm, #G Esenzeu#! stands as a stern northern counterweight to the court at #G Bharamuntacho Zani#!.\n\nThe forests of the north now have an imperial anchor, and it answers to [ROOT.GetCountry.GetRuler.GetName|Y]."
me_nazani.107.a: "The north stands guard."

me_nazani.108.t: "The Road Between Crowns"
me_nazani.108.desc: "Protected imperial roads now bind the capital, the second city, and the towns between them. Officials, soldiers, grain, and rumor all move with imperial speed, and the roads themselves have become proof of the #T Purple Emperor#!'s reach.\n\nA realm that moves together is a realm that cannot easily be broken apart."
me_nazani.108.a: "Let the crowns be joined by stone."

me_nazani.109.t: "The Guilds Of The Second City"
me_nazani.109.desc: "The second city no longer merely mirrors the capital. Imperial guilds have been granted the privileges that turn walls, harbors, and markets into durable revenue and authority of their own.\n\nThe counterweight to #G Bharamuntacho Zani#! now generates its own strength, and the balance of the #Y Nazani#! homeland is the surer for it."
me_nazani.109.a: "Two cities, two engines of empire."

me_nazani.110.t: "The Eyes Of The Emperor"
me_nazani.110.desc: "The court has codified its terrible procedures: the charge of treason, the sentence, and the memory of darkened eyes. Whether [ROOT.GetCountry.GetRuler.GetName|Y] rules through restraint or through fear, every ambitious courtier now understands that imperial justice has a procedure — and consequences.\n\nThe Purple Justice of the #Y Nazani#! is established."
me_nazani.110.a: "Let treason look upon its reward."

me_nazani.111.t: "The Two Cities Of The West"
me_nazani.111.desc: "At last [GetProvince('(int32)2720').GetName|Y] and its chosen counterpart stand as twin pillars of the #Y Nazani#! homeland — one the sacred capital of the reborn #Y Zani#!, the other the counterweight that turns imperial ambition into revenue, movement, and authority beyond the palace.\n\nThe heartland of [ROOT.GetCountry.GetRuler.GetName|Y] is whole, and now the empire must choose the shape of its future."
me_nazani.111.a: "The homeland stands complete."

me_nazani.112.t: "The Theon Armies Of Wegalia"
me_nazani.112.desc: "The old provinces of #Y Wegalia#! have been organized to raise and sustain disciplined soldiers, loyal officers, and campaign roads ready for war beyond the marshes and borderlands. The heartland can now support frontier armies without collapsing behind them.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] has chosen the wide path — and the west is arming for it."
me_nazani.112.a: "Let the Theon muster their spears."

me_nazani.113.t: "A Palace Between Two Seas"
me_nazani.113.desc: "Palaces, academies, and noble districts have risen in the great cities of the #Y Nazani#! homeland, imperial machines of wealth, ceremony, and administration. The #T Empire of the West#! has proven it need not conquer half the world to stand above it.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] has chosen the tall path — perfection over expanse."
me_nazani.113.a: "Let glory be gathered, not scattered."

me_nazani.114.t: "The Reborn Empire Of The West"
me_nazani.114.desc: "The capital is strengthened, the second city raised beside it, and the future of the empire chosen. The western realm is no longer merely the weaker sibling of #Y Durobaeraste#! — it is its own power, its own court, and its own promise of #Y Zani#! rebirth.\n\nThe reign of [ROOT.GetCountry.GetRuler.GetName|Y] will be remembered as the one that reforged the diadem of the west."
me_nazani.114.a: "The Empire of the West is reborn."

me_nazani.115.t: "The Dragon Slayer"
me_nazani.115.desc: "The borderlands are conquered, the marshlands reclaimed, and the dragon-lands of #G Kainaxarthos#! returned to #Y Nazani#! rule. The whole of the ancient western patrimony now answers to the #T Purple Emperor#!, and the barbaric #Y Soventeir#! have been driven from the throne of dragons at last.\n\nThe heralds have already begun to speak the name that will follow [ROOT.GetCountry.GetRuler.GetName|Y] into legend: the #Y Dragon#! Slayer, undisputed successor to the ancient #Y Zani#! world."
me_nazani.115.a: "The Zani world is whole once more."

# ==============================================================================
# THE HEIR'S ULTIMATUM
# ==============================================================================

me_nazani.201.t: "The Heir's Ultimatum"
me_nazani.201.desc: "The doors of the throne room are thrown open without ceremony, and [GetCharacter('(int32)328').GetName|Y] strides in at the head of his own retainers. There is no bow, no greeting fit for a #P Purple Emperor#! — only the cold stare of an heir who has decided he has waited long enough.\n\nHe does not ask. He demands. The diadem of the west is to pass to him now, while he is young enough to wear it and strong enough to defend it. The court holds its breath, for every soldier and courtier in the hall can see that [GetCharacter('(int32)328').GetName|Y] has not come to petition [ROOT.GetCountry.GetRuler.GetName|Y] — he has come to replace him.\n\nTo yield is to hand away the throne and, perhaps, one's very eyes. To refuse is to invite the swords already gathering behind him. The #T Empire of the West#! waits upon a single word."
me_nazani.201.a: "The realm cannot bleed for my pride. Let him take the throne."
me_nazani.201.a.tt: "[GetCharacter('(int32)328').GetName] will #Y become the ruler#! of the [ROOT.GetCountry.GetName|Y]."
me_nazani.201.b: "I am the Purple Emperor. Let him take it from my corpse."
me_nazani.201.b.tt: "[GetCharacter('(int32)328').GetName] will launch a #R civil war#! to seize the throne by force."

# ==============================================================================
# IMPERIAL BLINDING
# ==============================================================================

me_nazani.202.t: "Imperial Blinding"
me_nazani.202.desc: "The purple is yours now, and the palace has learned to bow to [ROOT.GetCountry.GetRuler.GetName|Y]. Yet one shadow remains across the new reign; the old emperor [GetCharacter('(int32)326').GetName|Y] still breathes, and a deposed emperor left whole and free is a rebellion waiting for a season.\n\nThe court remembers the old remedy of the eastern #Y Zani#!, practiced upon rivals for a thousand years. A man robbed of his sight can never again sit the throne, for no blind man may rule — yet mercy of a kind lets him keep his life. #Y Iron#! waits in the brazier, and the guards await only a nod.\n\nWhat is done tonight cannot be undone at dawn."
me_nazani.202.a: "Take his eyes. Then take him beyond my borders."
me_nazani.202.a.tt: "[GetCharacter('(int32)326').GetName] will be #R blinded#! and cast into #Y exile#! beyond our borders."

# ==============================================================================
# THE BLINDED EMPEROR IN EXILE
# ==============================================================================

me_nazani.203.t: "A Blind Guest Arrives"
me_nazani.203.desc: "A ragged party arrives at the court of [ROOT.GetCountry.GetRuler.GetName|Y], and at its center is a broken figure whose bearing still betrays the purple he once wore. This is [GetCharacter('(int32)326').GetName|Y], the former #P Emperor#! of the #Y Nazani Empire#! that was deposed by his cousin.\n\nThe tragic tale of Dasrunp spills out from his escort. The old emperor was seized in the dead of night, his eyes put out with hot iron, and then cast beyond the borders of his own realm to die a beggar in foreign lands. That he came to rest in our territory is chance — but a blinded #Y Emperor#! at one's court is never merely a guest.\n\nHe cannot rule, he cannot fight, and he cannot see. But his blood and his grievance are worth a great deal to whoever decides what becomes of him."
me_nazani.203.a: "He is a liability - end his suffering, and earn the new regime's thanks."
me_nazani.203.b: "Give him to the monks. Let him end his days in prayer and darkness."
me_nazani.203.c: "A blinded Emperor is a claim with a heartbeat- keep him at court."
me_nazani.203.c.tt: "We will gain a #Y claim#! on the capital of the #Y Nazani Empire#!."
me_nazani.205.t: "The Purple Court Crosses the Sea"
me_nazani.205.desc: "For three bitter years, neither [ROOT.GetCountry.GetRuler.GetName|Y] nor the armies of Tsunndomtu have held so much as a village in #G Morrigon#!. The western themes have fallen to foreign banners, the old roads are severed, and the rival courts wage a war for a throne that no longer commands its homeland.\n\nOnly #G Dunzpon#! remains: the fortified bridgehead in #G Luxterra#!, crowded now with ships, soldiers, clerks, relics, and the last households still loyal to the #T Purple Emperor.#! Messengers have crossed the sea with Tsunndomtu's final submission. His remaining captains will lay down their arms if their lives are spared, and the imperial court will abandon the west rather than bleed to death for its ruins.\n\nThe Empire has not ended. It has crossed the sea."
me_nazani.205.a: "Carry the purple east. Dunzpon shall be our throne."
me_nazani.205.a.tt: "The #R civil war will end#!. The #Y Nazani Empire#! will abandon Morrigon and continue from #Y Dunzpon#! as an empire in exile."
