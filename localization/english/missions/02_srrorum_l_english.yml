l_english:

03_srrorum: "Dreams of Srrøkheim"
03_srrorum_DESCRIPTION: "With the #G Green Valley#! united for the first time in centuries, our people can now focus on reclaiming the full borders of #Y [GetCharacter('(int32)64').GetFirstName]'s Kingdom#!. Our people once built great cities across the #Y Gorrskkóen Forests#!, along the rocky coasts of the #G Southern Sea#!, and deep inside the #G Dragon's Pass#!!\n\nThe end of our Golden Age is filled with mysteries, but certain grudges have withstood the test of time. Following the death of the #Y Sacred Pair#!, our lands were invaded by #T Elves#!, #T Hobgoblins#!, and #Y Dragkhans#!, pitiful races that envied our lavish cities. Our people were pushed back to our homeland of the #G Green Valley#! with a few scattered settlements across #G Morrigon#!. Slowly, those that resisted were destroyed and forgotten.\n\nWith #G Srrørum#! restored, our people can once again dream of #Y Srrøkheim#!, and recreating #G Southern Morrigon#! in our image!"
03_srrorum_CRITERIA_DESCRIPTION: "This mission will be completed when [ROOT.GetCountry.GetName|T] conquers all of #G Southern Morrigon#!."
03_srrorum_BUTTON_TOOLTIP: "Let us follow the dream of Srrøkheim!"

#Missions 
####ARMY
03_srrorum_task_1: "Beyond the Valley"
03_srrorum_task_1_DESC: "Now that we've united the valley under our banner, it's time to dream bigger. Long ago, our ancestors controlled nearly all of #G Southern Morrigon#!, from the #G Green Valley#! to the #G Dragon's Pass#!. The first step to retake our empire will be to look beyond the confines of our homeland."

03_srrorum_task_2: "The Eastern Gate"
03_srrorum_task_2_DESC: "#Y Just#! as the #Y Western Gate#! protects us from #Y #R Elven#!#! raiders, the #G Eastern Gate#! has prevented #Y Silver Dwarven#! war bands from invading the hill tribes of the #Y Western Lungs Forest#!. If we have any hopes of reaching the #G Dragon's Pass#!, we must first conquer the entrance to the lands of the #Y #R Western Wood Elves#!#!!"

03_srrorum_task_3: "Preparing Our Forces"
03_srrorum_task_3_DESC: "What used to be #Y Gorrskkóen Forest#! was changed irreversibly millennia ago by #Y #R Wood Elven#!#! immigrants, who introduced the #Y #R Yaga Trees#!#! which came to dominate the landscape and created what is now the #Y Western Lungs Forest#!. Filled with mana, these trees are practically impossible to burn, live for centuries, and affect the environment around them, creating dangerous #Y #R Fai#!#! out of what used to be the surrounding fauna and flora. While the #Y #R Wood Elves#!#! thrive in this environment, those trees are the main reason nearly any invasion of their territory is met with failure.\nFortunately, #Y Human#! mages from the #G Dragonscale School of Defensive Magic#! have been teaching the #Y Zare Jad#! style in [GetProvince('(int32)3988').GetName|G], which, with some investment, might be able to shield our armies from the various hazards found in the #Y #R Eldritch Forests#!#!!"

03_srrorum_task_4: "Conquering the Elves"
03_srrorum_task_4_DESC: "With our armies prepared, we must learn from previous armies who have attempted and failed to invade the vast Eldritch Forests of the Western Wood #T Elves#!. Our opponents are divided into many tribes, a fact we can exploit. If we strike fast and ensure our armies are safe from the Fai, we can dominate the #Y Western Lungs Forest#!!"

03_srrorum_task_5: "Securing Our Borders"
03_srrorum_task_5_DESC: "While we try to control the unruly #T Elves#!, we should be wary of the opportunistic Cumbrians to our west. Securing our border is the only way to prevent a future invasion of our new holdings during a time of weakness!"

03_srrorum_task_6: "The Silk Cities"
03_srrorum_task_6_DESC: "The Three Silokhai, or Silk #G Cities#!, of the #Y Admadi#! #T Elves#! are the most sophisticated urban centers in the #Y Western Lungs Forest#!, as well as the largest silk producers in all of #G Morrigon#!. Needing to more effectively control the elves, we could develop these cities into centers of administration for us to better manage our new conquests!"

03_srrorum_task_7: "Resettling the Forest"
03_srrorum_task_7_DESC: "Once, the #Y Gorrskkóen Forest#! was home to large cities such as Steffanskkópiabi and Gorrvlikkabi, cities that were consumed by the unending forests that the #G Elven#! invaders brought. Overwhelming us with their forest magic, our cities and communities were lost, and we were confined to the #G Green Valley#!. However, we are once again the masters of the now #G Western World Lungs#! Forest, and we should send #Y Anvindr#! settlers to go and reclaim our cities from the #G Elven#! trespassers and their demonic eldritch forests."

03_srrorum_task_8: "Ports on the Southern Sea"
03_srrorum_task_8_DESC: "Through our conquests we've found ourselves in possession of vast lands suitable for ports. With some investment, we can make ourselves an important player in the #G Southern Sea#! Trade, exporting vast amounts of minerals and wood from our new ports to fill our coffers!"

03_srrorum_task_9: "Into the Western Plains"
03_srrorum_task_9_DESC: "Having full control over the Western Lungs Forests, we must continue east towards to #G Dragon's Pass#!. In our path stand the unruly #Y Dragkhan#! tribes of the Western Plains as well as the few #Y Sovenerian#! holdings who block us from reaching our final goal. Defeating them will be tough, however, their conquests will serve as excellent experience for our soldiers, who will eventually have to face the fiercer #T Hobgoblins#! to the North."

03_srrorum_task_10: "Entering the Dragon's Pass"
03_srrorum_task_10_DESC: "At long last we have managed to make it to the mountains of the #G Dragon's Pass#!. Our veteran soldiers now face the armies of the #Y Ahualtzi#! #T Hobgoblins#!. Hardened by centuries of invasions and raids from #T Dragkhanic#! tribes and neighboring #G Hobgoblin#! states, the #Y Ahualtzi#! are formidable warriors and the mountainous nature of their homeland will make it difficult for our forces. However, victory should be a needed morale boost for our tired soldiers."

03_srrorum_task_11: "The Hobgoblin Plains"
03_srrorum_task_11_DESC: "Having conquered the #Y Ahualtzi#!, we now face the formidable kingdoms of the #Y Droishu#! and #Y Shoishoni#!. Organized around the two major cities of #Y Driotrai#! and Tlazcal, their armies are numerous and their conquest will be difficult. However, the #Y Urhuk#! nomads of the east mirror the #T Hobgoblins#! that razed the great #Y Silver Dwarven#! cities of the #G Dragon's Pass#!, and their conquest will be particularly cathartic for our people."

03_srrorum_task_12: "Securing the Entrances"
03_srrorum_task_12_DESC: "Having defeated the #G Hobgoblin#! threat, our former friends, the Sovenarians, and the #Y Borderlander#! tribes of the North now look hungrily at the chaos we've created. To secure our holdings, it's imperative that we control all of the entrances of the #G Dragon's Pass#!, from the unruly northern kingdom of the #Y Jishani#!, to the savage #G Kana'i#! goblin tribes of the Inner #G Dragon's Pass#!."

03_srrorum_task_13: "Resettling the Dragon's Pass"
03_srrorum_task_13_DESC: " "

03_srrorum_task_14: "Rebuilding Our Cities"
03_srrorum_task_14_DESC: "The oldest tablets in #Y Veddtunn#! tell of grand #Y Silver Dwarven#! cities that towered above the bleak landscape of the #G Dragon's Pass#!; Hthgartgerrpiabi, Hæjbaenabi, Ásennabi. Rebuilding these ancient cities will attract more migrants and stronger control over our new lands!"

03_srrorum_task_15: "Mythic Relics"
03_srrorum_task_15_DESC: "Records from the #Y Mythic Age#! are hard to find, but oral traditions describe our ancestors as the most advanced in the world, able to produce unbreakable #Y Mythril#! and long-lasting #Y Dverpi#! Coal in large quantities and with ease. By sending out explorers, adventurers, and academics into the #G Dragon's Pass#! we may be able to find fragments of their forgotten technology that we may be able to use."

03_srrorum_task_16: "Restore Srrøkheim"
03_srrorum_task_16_DESC: "While our forefathers dreamed of a restoration of #G Srrørum#!, we dream bigger, we dream grander, we dream of empire; of #Y Srrøkheim#!, the Empire of the #Y Silver Dwarves#!."

####DEVELOPMENT
03_srrorum_task_17: "Fortifying the Gates"
03_srrorum_task_17_DESC: "Now that we control both sides of the pass that leads into the #G Green Valley#!, we must ensure that our homeland can never again be threatened by outside invaders. Fortifying both of the gates should make the entrance to the #G Green Valley#! impenetrable!"

03_srrorum_task_18: "Royal Roads"
03_srrorum_task_18_DESC: "Long ago in the #Y Mythic Age#!, we were ruled by the legendary #G Hthgart 'to Vernunghaltt'#!, who was known for his large infrastructure projects. Perhaps one of his most famous projects were the Royal Roads, stretching from the Sacred #Y Silver Caves#! to the #G Eastern Gate#!, connecting all of the #G Green Valley#! to the outside world. With the passing centuries his work has decayed to mere dirt roads and paths. It is time that we honor our dear father and rebuild his vast road network."

03_srrorum_task_19: "Reinforcing the Faith"
03_srrorum_task_19_DESC: "With our conquest of foreign peoples and our embrace of foreign ideas, many new heretical beliefs have begun permeating our society. In order to strengthen belief in the ancestors, a series of grand temples must be built in the major cities of the valley to house and organize a priesthood that can help enforce the proper traditions and rituals that have been uniquely present in #Y Silver Dwarven#! society and religion since the #Y Mythic Age#!!"

03_srrorum_task_20: "A Center of the Faith"
03_srrorum_task_20_DESC: "Long considered the center of the universe by our people, the #Y Silver Caves#! near #G Srrøvikkabi#! are the holiest site in the #Y Silver Dwarven#! world. However, the city of #G Srrøvikkabi#! itself isn't as grand. While it is the home of the #T Order of Sennmoggen#!, it does not have enough housing or temples for the great influx of pilgrims that arrive each year.\n\nWith some investment, we can turn this minor stop on the way to the caves into a grand center of our faith!"

03_srrorum_task_21: "The City of Knowledge"
03_srrorum_task_21_DESC: "#G Veddabi#! is the educational and magical heart of our nation. To be able to catch up to the better developed magic and technology of the outside world, we should ensure that the '#Y City#! of Knowledge' is rebuilt to house much more than just a couple of academies for noble students!"

03_srrorum_task_22: "Gerrtágadi Style"
03_srrorum_task_22_DESC: "The #Y Gerrmoggen#!, or 'Mountain Men', have been causing chaos and performing esoteric magic in the hills of the #G Green Valley#! since the #Y Mythic Age#!. Their isolation from other mages and unique terrain has led them to develop a unique style that is not seen anywhere else in #G Omniluxia#!.\n\nOur mages at Veddborr are eager to attract as many of these magical wanderers as possible to establish the first domestic #Y Silver Dwarven#! magic school at the recently expanded Veddborr. With some funding and encouragement from the state, we could help create and spread this new style among new #Y Anvindr#! #Y Mages#!."

03_srrorum_task_23: "Verobaen Farms"
03_srrorum_task_23_DESC: "Due to increasing urbanization, our cities are attracting new migrants that are contributing to a boom in our population. However, due to the limited amount of arable land in the valley and the increased demand for food, there are many concerns that our cities will starve.\n\nA group of academics have recently reached out to the King to ask for funding for a new research project that could solve this problem. The #Y Verobaen#! Farms of the #Y Mythic Age#! were large farms carved into the mountains that created artificial arable land. With our help, they might be able to create new farms in a similar style that could replicate the #Y Verobaen#! Farms of old!"


#Tooltips


#Modifiers
####CONQUEST
center_of_administration_mod: "Administrative Center"
desc_center_of_administration_mod: "The three Silokhai are important trading hubs in the #Y Western Lungs Forest#! as well as the largest population centers in the region. By making them administrative centers of our holdings, we can better control the unruly #G Elven#! tribes of the forest!"
sampan_mod: "Civilian Capital"
desc_sampan_mod: "#G Sampan#! serves as the civilian capital of the #Y Zannisonn#! humans, ruled by nobles."
chruer_mod: "Military Capital"
desc_chruer_mod: "#G Chruer#! serves as the military capital of #G Chruchryy#!, hosting soldiers that keep the peace in the region."
trade_port_mod: "Southern Sea Trade Port"
desc_trade_port_mod: "This city is an important trade port of the #G Southern Sea#!, developed by the #Y Anvindr#! #Y Silver Dwarves#! to control the trade of this region."
warded_armies_mod: "Zare Jad Style"
desc_warded_armies_mod: "An Omnisavand class style, #Y Zare Jad#! is a defensive style that is primarily taught in the #G Dragonscale School of Defensive Magic#!. Its techniques include various warding spells that range from simple mana walls to being able to create army-size mana shields."
steppes_tamed_mod: "Tamed Steppes"
desc_steppes_tamed_mod: "Having thoroughly defeated the #Y Dragkhan#! tribes of the steppes of #G Southern Morrigon#!, our control of the region is now secure as all tribal leaders now bow to our king."
invader_morale_mod: "Morale Boost"
desc_invader_morale_mod: "Having broken into the #G Dragon's Pass#!, our armies now march into the heart of what were once our lands!"
fortified_gates_mod: "Fortified Gates"
desc_fortified_gates_mod: "With both the #Y Western Gate#! and the #G Eastern Gate#! fortified, our homeland is now fully secure from any outside invaders!"
faith_reinforced_mod: "Expelled Heresies"
desc_faith_reinforced_mod: "Our religion and traditions are what distinguish us from other dwarven societies! Even with the influx of foreign ideas we must make sure that we remain faithful to our gods and expel any heresies that might lead us astray!"
stone_academy_mod: "Konungladurr School of Stone Magic"
desc_stone_academy_mod: "Established by #Y Hefdarr II#! in the years following the restoration of the Third #Y Kingdom#! of #G Srrørum#!, the 'Royal #Y Academy#!' sought to create a larger magic community amongst the traditionally suspicious #Y Silver Dwarves#!. Using knowledge from the Germoggen, hermitic folk magicians, as well as incoming teachers from the #G Dragonscale School of Defensive Magic#!, the school developed the #T Gerrtágadi Style#!.\n\nThe school teaches the #T Gerrtágadi Style#!, a #G Amten#! style of magic in which users can manipulate minerals such as stone through touch by concentrating mana through their hands. More advanced users can even manipulate purified minerals such as metals."
administrated_elves_mod: "Coexisting Elf Communities"
desc_administrated_elves_mod: "We are trying to coexist with our nomadic Elf subjects that inhabit this area."
mercy_shown_mod: "Mercy Shown"
desc_mercy_shown_mod: "The citizens of Driotraitan will remember when the King spared their city from pillaging."
angry_elves_mod: "Elves Expelled"
desc_angry_elves_mod: "Our #G Elven#! subjects will not forget our expulsions of their kind, and are more defiant in the face of our rule."
elven_admin_mod: "Elven Administrators"
desc_elven_admin_mod: "We have placed native elven nobility in charge of governing their kin."
dwarven_admin_mod: "Dwarven Administrators"
desc_dwarven_admin_mod: "We have placed #Y Dwarven#! nobility and soldiers in charge of administering the #Y Gorrskkóen#!."
dwarf_colonia_mod: "Anvindr Colony"
desc_dwarf_colonia_mod: "A colony of #Y Anvindr#! #Y Silver Dwarves#! attracts serfs and freemen searching for land."
stone_magic_trait: "Gerrtágadi Style"
desc_stone_magic_trait: "The 'Hill Carving Style' of the #Y Silver Dwarves#! was developed through the cooperation of trained mages and local #Y Gerrmoggen#! folk magicians. The style allows users to manipulate minerals through touch. Aside from its military use, mages proficient in the style may be of great help in construction, smithery, and pottery."
food_terrace_farms_mod: "Food Focused Verobaen Farms"
wealth_terrace_farms_mod: "Export Focused Verobaen Farms"
center_of_the_faith_mod: "Center of the Faith"
desc_center_of_the_faith_mod: "The center of our universe, Srrøvikkborr will now serve as the center of the #T Hebric#! faith in our eyes!"
nitrate_mod: "Hobgoblin Black Powder"
desc_nitrate_mod: "This mysterious black powder has explosive tendencies that might prove useful to us."

#Treasures
mythril_super_drill: "Konunvelkkon"
desc_mythril_super_drill: "The mythic relic #Y Konunvelkkon#! is theorized to have been created during the later period of the #T First Kingdom of Srrørum#!. While nobody knows how to utilize it or power it, its tip is supposedly made of mythril, which might be able to be created with enough research."
dragon_head_srrorum: "Fjirno's Head"
desc_dragon_head_srrorum: "Head of #Y Fjirno the Terrible#!, slain by the Rekkaisigrramoggen of #G Srrørum#!."
dragon_tooth_srrorum: "Fjirno's Tooth"
desc_dragon_tooth_srrorum: "Tooth of #Y Fjirno the Terrible#!, claimed by those who survived the attack on the beast."

#Events

me_srrorum_1_title: "$03_srrorum_task_2$#!"
me_srrorum_1_desc: "While the defenders of [GetProvince('(int32)4085').GetName|G].GetName] are used to repelling #Y Dwarven#! raiders, they were not prepared to deal with for our large, organized army! Their pitiful defences stood no chance against our forces, falling to our kingdom quickly and swiftly! With the #G Eastern Gate#! now in our possession, we can finally look towards #G Elven#! lands with the intent of conquest!"
me_srrorum_1.a: "Onwards!"
me_srrorum_1_tooltip: "The mission task '#Y $03_srrorum_task_2$#!' has now been #G Completed#!!"

me_srrorum_2_title: "$03_srrorum_task_3$#!"
me_srrorum_2_desc: "Standing at the very edge of his kingdom, [ROOT.GetCountry.GetRuler.GetName|Y] and his army watch as the magicians step forwards to cast their magic. Prayers are uttered, men shuffle nerviously, and it seems like the whole army is holding its breath. These mages have trained for months or even years to be capable of casting such spells. If they succeed, the mana shields around our men should protect them from the harmful effects of the #Y Yaga#! Trees as well as hide them from the #R Fai#!. However, should they fail, the entire expedition into the forest becomes an impossible task.\n\nSuddenly, a spark of light. The warm glow of mana embraced the army as each man is surrounded by a small outline of bright light shining no brighter than the final embers of a small flame. Cheers erupt throughout the ranks as the entire army seems to release a sigh of relief. Most relieved is [ROOT.GetCountry.GetRuler.GetName|Y], who addresses his men:"
me_srrorum_2.a: "Let us reclaim the Gorrskkóen for the Silver Dwarves!"
me_srrorum_2_tooltip: "The mission task '#Y $03_srrorum_task_3$#!' has now been #G Completed#!!"

me_srrorum_3_title: "$03_srrorum_task_4$#!"
me_srrorum_3_desc: "The #T Elves#! put up a good fight, their knowledge of the land has allowed them to claim the lives of many of our strongest warriors. However, dwarven discipline and bravery has proven victorious! Protected from the vicious #R #E Fai#!#! by our mages, our forces were able to tame the forests!\n\nThe once divided tribes now kneel before us or face exile, as their new sovereign [ROOT.GetCountry.GetRuler.GetName|Y] will decide the ultimate fate of the #Y Gorrskkóen#!."
me_srrorum_3.a: "Three Cheers for the King!"
me_srrorum_3_tooltip: "The mission task '#Y $03_srrorum_task_4$#!' has now been #G Completed#!!"

me_srrorum_4_title: "The Zanazi-Vetalians"
me_srrorum_4_desc: "It has been many centuries since we last contacted any of the tribes of man. Although some knowledge of the outside world eventually made its way to the #G Green Valley#!, our people still remained under the impression that the various human tribes served the #Y #R Great Empire of the Eagle#!#! that attacked us in the time of #Y Hefdarr#!. Thus, it came to us as a surprise when our #T Dragkhanic#! subjects informed us that their empire, the [GetCountry('SOV').GetName|T], had succeeded those who called themselves '#Y Zanni#!'.\n\nHowever, our people have been shocked once again when we took the hills of the west of the #Y Gorrskkóen#! from the humans who inhabited it. They state that their people, the '#Y Kerrnowans#!', are the true descendants of the #Y Zanni#!! To the chagrin of our confused sovereign, those in the hills to the north claim that their ancestors fought against the #Y Zanni#!! [ROOT.GetCountry.GetRuler.GetName|Y] pities these poor humans, as their short lives mean they cannot even remember the history of their ancestors.\n\nRegardless of whether these men are descendants of the #Y Great Empire of the Eagle#!, we must now rule them. The generals suggest administering their lands from the great fortress-city of [GetProvince('(int32)4184').GetName|G], while the nobility lay claim to the wealthy city of [GetProvince('(int32)4135').GetName|G] and petition the king to allow them to govern the province."
me_srrorum_4.a: "[GetProvince('(int32)4184').GetName] will protect our human holdings"
me_srrorum_4.b: "[GetProvince('(int32)4135').GetName] shall govern the so-called tribes of the Zanni"
me_srrorum_4_tooltip.a: "#Y [GetProvince('(int32)4184').GetName] will become the capital of our #E Zanazi-Vetalians#! holdings!#!"
me_srrorum_4_tooltip.b: "#Y [GetProvince('(int32)4135').GetName] will become the capital of our #E Zanazi-Vetalians#! holdings!#!"

me_srrorum_5_title: "Administrating the Elves"
me_srrorum_5_desc: "My Lord, with the conquest of the #Y Gorrskkóen#! completed the nigh herculean task of governing it now arises. Both #G Elven#! and #Y Dwarven#! petitioners have arrived in your court, asking for you to verify their claims.\n\nDespite being few in number, the #T Elves#! still outnumber us and a revolt could pose a significant risk to the stability of the region. Many pragmatic #G Elven#! lords and chieftains have decided to switch their allegiances and serve you in exchange for large swathes of lands for them to govern. While they might not be trustworthy, it may be worth it to placate these local leaders to quell discontent amongst our new subjects.\n\nI hope not to burden you with this information, but many of your dwarven subjects have presented their own petitions. The various citizens, nobles, and administrators whether involved in the conquest or not are asking your highness for land and the honor to govern the new territories. While guaranteed to be somewhat more trustworthy than the #T Elves#!, I don't believe our new subjects will take to these outsiders too kindly.\n\nThe decision is yours my lord."
me_srrorum_5.a: "Let the Elves govern themselves"
me_srrorum_5.b: "Dwarves would do a much better job at managing them"
me_srrorum_5_tooltip.a: "#Y We will employ local #E Elven#! rulers to administer the #E Western World's Lungs#!!#!"
me_srrorum_5_tooltip.b: "#Y We will employ #E Dwarven#! administrators to control the #E Western World's Lungs#!!#!"

me_srrorum_6_title: "Resettling the Forests"
me_srrorum_6_desc: "My Lord, I hate to bring such heavy decisions to you once more, but the petitioners seeking an audience with you has tripled since our last discussion!\n\nThe #T Elves#! demand to have their lands respected and protected against incoming dwarven settlers. Their detached worldview wouldn't make it too difficult to coexist with them as long as we allow them space to roam and resume their semi-nomadic lifestyle.\n\nHowever, many dwarven subjects, eager to follow the dream of #Y Srrøkheim#!, seek lands in the forests. While alone their settlements might face the terrors of the forest, they intend to stick together and resettle legendary cities of old. However, their colonies will directly clash with the #T Elves#! seeking to migrate around what they see as their traditional lands. Worse, many of them call for the expulsion or even eradication of the #T Elves#! living in these areas, giving into their demands will surely lead to violence!\n\nAs the King, the call is yours to make."
me_srrorum_6.a: "Htgarth's Children shall once again inhabit the Gorrskkóen!"
me_srrorum_6.b: "Perhaps we can avoid more bloodshed..."
me_srrorum_6_tooltip.a: "#Y We will expel the local #E Elves#! and resettle the forest with #E Dwarven#! colonists!#!"
me_srrorum_6_tooltip.b: "#Y We will attempt to coexist with the local #E Elves#!!#!"

me_srrorum_7_title: "$03_srrorum_task_8$#!"
me_srrorum_7_desc: "For the first time since the #T First Kingdom of Srrørum#! our people once again sail on clear waters of the #G Southern Sea#!! However, we still have much to learn from these #Y Zannisonn#!. The guile of their merchants are only challenged by the bartenders of [GetProvince('(int32)3947').GetName|G], and they are important members of our new port cities.\n\nWith our coast secured, we can now look east, towards the untamed western #T Dragkhanic#! tribes and the rumored #G Hobgoblin#! horde."
me_srrorum_7.a: "Onwards! For Srrøkheim!"
me_srrorum_7_tooltip: "The mission task '#Y $03_srrorum_task_8$#!' has now been #G Completed#!!"

me_srrorum_8_title: "$03_srrorum_task_9$#!"
me_srrorum_8_desc: "[ROOT.GetCountry.GetRuler.GetName|Y] faces the defeated Qhans of the #Y Dragonland Steppes#!.\n\nTheir pitiful cavalry torn to shreds by #G Elven#! bows and #Y Silver Dwarven#! heavy cavalry, the Qhans have had no choice but to surrender and petition the King to allow them to continue grazing their lands. Procuring several strong #T Dragkhanic#! mounts, they offer them to the King as a sign of submission.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] graciously accepts their gifts, and allows them to return to their families with promises of peace. Although they are violent and unruly, [ROOT.GetCountry.GetRuler.GetName|Y] has made sure that he has broken their spirit, such that the tribes will not embark on the war path for many years."
me_srrorum_8.a: "North Men! The Hobgoblins await..."
me_srrorum_8_tooltip: "The mission task '#Y $03_srrorum_task_9$#!' has now been #G Completed#!!"

me_srrorum_9_title: "$03_srrorum_task_10$#!"
me_srrorum_9_desc: "After much intense fighting, we have gotten a foothold into #G Hobgoblin#! territory! Many #Y Shoishoni#!, already enemies of the ruling #Y Droishu#! horde, have even joined our ranks to fight against the #Y Zalthu#! line.\n\nNow all that stands in [ROOT.GetCountry.GetRuler.GetName|Y]'s way of reclaiming #Y Srrøkheim#! is the great city of [GetProvince('(int32)4721').GetName|G], stronghold of the descendants of #Y Girm the Conqueror#!!"
me_srrorum_9.a: "Onwards to [GetProvince('(int32)4721').GetName] men!"
me_srrorum_9_tooltip: "The mission task '#Y $03_srrorum_task_10$#!' has now been #G Completed#!!"

me_srrorum_10_title: "The Fate of [GetProvince('(int32)4721').GetName]"
me_srrorum_10_desc: "[ROOT.GetCountry.GetRuler.GetName|Y] had been consulting his generals in his tent when he heard the news. After months of grueling siege the great city of [GetProvince('(int32)4721').GetName|G] had finally fallen to his forces!\n\nA large force of soldiers had forced their way through a destroyed section of the city's walls, causing chaos amongst the defenders who were overwhelmed by our numbers. Its only a matter of time before the seat of the #Y Zalthu#! clan belongs to the king.\n\nHowever, just as those present begin to celebrate, the messenger also informs them of the great slaughter occurring in the city. He claims that many men have grown wild, seeking revenge for the #G Hobgoblin#!'s past transgressions against the #Y Silver Dwarves#!. There are tales of fires, looting, and killing of both #T Hobgoblins#! and foreigners found in the #Y Boblo District#!. If nothing is done, surely the city shall be razed to the ground!\n\n[ROOT.GetCountry.GetRuler.GetName|Y] leans back in his chair, pausing before he gives his response."
me_srrorum_10.a: "Discipline the men, we are better than this!"
me_srrorum_10.b: "A dwarf never forgets..."
me_srrorum_10_tooltip.a: "#Y [GetProvince('(int32)4721').GetName] will be spared from being sacked!#!"
me_srrorum_10_tooltip.b: "#Y [GetProvince('(int32)4721').GetName] will #R razed#! utterly!#!"

me_srrorum_11_title: "Reuniting with the Dolin"
me_srrorum_11_desc: "With the conquest of the #Y Inner Dragon's Pass#! the distant #Y Dolin#! have finally been reunited with us!\n\nLost centuries ago, many tales of an independent #Y Silver Dwarven#! kingdom to the south of the #G Green Valley#! had been circulating for decades, however none believed it to be true until we regained contact with them after our conquest of the #Y Goblins#!! Their civilization radiating from their great city of [GetProvince('(int32)5562').GetName|G], these dwarves seem to have a unique relationship with the typically hostile #Y Goblins#! we now find ourselves ruling.\n\nWith many #Y Dolin#! immigrating back to the #G Green Valley#! there have been ideas petitioned by local #Y Dolin#! nobility to allow them to rule the lands of the #Y Inner Dragon's Pass#! in the king's name."
me_srrorum_11.a: "They shall serve as my vassals"
me_srrorum_11.b: "Let us welcome them home!"
me_srrorum_11_tooltip.a: "#Y The #E Dolin#! will be given their own kingdom!#!"
me_srrorum_11_tooltip.b: "#Y The #E Dolin#! will remain under our rule!#!"

me_srrorum_12_title: "$03_srrorum_task_12$#!"
me_srrorum_12_desc: "With the majority of our ancestral homelands now under our control once more, the glorious conquests and flashy battles can now slow as [ROOT.GetCountry.GetRuler.GetName|Y] prepares to secure his new holdings.\n\nWith the #G Green Valley#! at capacity, many families are eager to return to the lands once held by their ancestors and claim their own homesteads. These serfs and freemen have petitioned the king for lands in the new territories. Seeing this as an opportunity to secure the former lands of the aggressive #T Hobgoblins#!, [ROOT.GetCountry.GetRuler.GetName|Y] has decided to pragmatically support their requests."
me_srrorum_12.a: "Let us begin the preparations"
me_srrorum_12_tooltip: "The mission task '#Y $03_srrorum_task_12$#!' has now been #G Completed#!!"

me_srrorum_13_title: "Resettling Opoea"
me_srrorum_13_desc: "#G Opoea#!, known to #Y Htgarth#! as #Y Sennhæjen#!, is a land rich with minerals and defined by beautiful mountains and valleys. Due to its similarity to the #G Green Valley#! it has become a popular destination for many new settlers.\n\nChoosing to name their settlements after legendary cities of #Y Silver Dwarven#! history, the settlers have been allotted the following lands to administer the province:"
me_srrorum_13.a: "[GetProvince('(int32)4146').GetName], the land of iron and rich soils"
me_srrorum_13.b: "[GetProvince('(int32)4049').GetName], a land of beautiful green hills"

me_srrorum_14_title: "Resettling Storanê"
me_srrorum_14_desc: "#G Storanê#!, once known as #Y Hjallilantpi#!, is home to large quantities of #G Hobgoblin#! tribes, including the once-great city of [GetProvince('(int32)4721').GetName|G].\n\nSome nobles have petitioned the King to allow them to rule the province from this great urban center. However, many families ask that the king allot them lands in [GetProvince('(int32)3991').GetName|G], which would serve as a capital of the region."
me_srrorum_14.a: "[GetProvince('(int32)4721').GetName] shall remain the capital of Storanê"
me_srrorum_14.b: "[GetProvince('(int32)3991').GetName] will now govern the Hobgoblins"

me_srrorum_15_title: "Resettling Borysthenes"
me_srrorum_15_desc: "#G Borysthenes#!, called Ausvlien in our histories, is home to both the wild #Y Urhuk#! horsemen as well as the #Y Shoishoni#! wizards, rivals of the #Y Droishu#!.\n\nThe only other urban center that could call itself a city in the valley, [GetProvince('(int32)4187').GetName|G], has become a target of petitions by nobility who seek to lay claim to the riches of the city and the region. However, groups of freemen have petitioned the king for weeks to allot them lands in the fertile plains of the #Y Urhuk#!, serving as a regional capital that could tame the unruly nomads."
me_srrorum_15.a: "[GetProvince('(int32)4187').GetName], home of the wizards, shall serve as the capital"
me_srrorum_15.b: "The fertile plains of [GetProvince('(int32)4147').GetName] will tame Borysthenes"

me_srrorum_16_title: "Governing the Inner Dragon's Pass"
me_srrorum_16_desc: "The #Y Inner Dragon's Pass#! is home to various #Y Goblin#! tribes as well as the #Y Dolin Silver Dwarves#!, who have made their hold of [GetProvince('(int32)5562').GetName|G] one of the most breathtaking sights in all of #G Omniluxia#!!\n\nThe #Y Dolin#! petition the king to remain the capital of the new province, as their unique relationship with the #Y Goblins#! might command their respect and loyalty. However, many nobility petition the king to be given governorship of the region, and have recruited willing freemen and serfs who wish to enter the caverns to create a new life for themselves."
me_srrorum_16.a: "Allow the Dolin of [GetProvince('(int32)5562').GetName] to rule the savages"
me_srrorum_16.b: "We shall build an even greater city in [GetProvince('(int32)5554').GetName]!"

me_srrorum_17_title: "$03_srrorum_task_14$#!"
me_srrorum_17_desc: "Excellent news my lord! Your initiatives and decrees have created many prosperous towns and cities all over the #G Dragon's Pass#!! What was once closer to a desolate wasteland has become a fertile land that benefits both #Y Dwarf#! and #G Hobgoblin#! alike!\n\nHowever, some of the local #T Hobgoblins#! have raised concerns of possible #R draconic#! activity. They claim the new wealth of the region may attract nearby #G Dragons#! who will wreck havoc upon the population to add to their hordes atop the impossibly tall #Y Dragon Mountains#!."
me_srrorum_17.a: "You have to be a fool to believe such stories"
me_srrorum_17_tooltip: "The mission task '#Y $03_srrorum_task_14$#!' has now been #G Completed#!!"

me_srrorum_18_title: "Reports from the Dragon's Pass"
me_srrorum_18_desc: "My Lord! Urgent news from the #G Dragon's Pass#!!\n\nRumors have circulated by many in the more rural areas of disappearances. Starting with sheep, it has escalated to the vanishment of entire households.\n\nWhile this worrying news is something to be aware of, it is important to note that this information has not been corroborated by nearby towns, and remains hearsay in the countryside."
me_srrorum_18.a: "These are tall tales from paranoid herders"
me_srrorum_18_tooltip: "#R We will wait for any confirmations to verify these reports...#!"

me_srrorum_19_title: "Dragon Sightings Confirmed"
me_srrorum_19_desc: "My liege, reports of attacks from the great dragon #Y Fjirno#! in the #G Dragon's Pass#! have been confirmed! Identified by his white scales, this ancient being has not been seen for at least two hundred years, with many claiming he was awoken by the noise made by the multitude of new cities in the #G Dragon's Pass#!\n\nAttacks on villages have been stated to displace entire communities, with the attacks getting bolder after every incident. The latest report tells of an attack on a moderately sized city, in which around a third of the buildings were burnt down by the beast!\n\nWhat shall we do [ROOT.GetCountry.GetRuler.GetName|Y]?"
me_srrorum_19.a: "Send a brave party of explorers to find the beast's lair!"
me_srrorum_19.b: "Ignore it, the monster will grow bored soon"
me_srrorum_19_tooltip.a: "#Y We will send scouts to find the Dragon's lair#!"
me_srrorum_19_tooltip.b: "#R We avoid confronting the Dragon.#! #Y (This will end the current event chain.)#!"

me_srrorum_20_title: "The Explorers Return"
me_srrorum_20_desc: "Great king, the explorers you sent have returned with news of the dragon's lair!\n\nThey claim to have found his horde, and one presents a detailed map of their journey through the #Y Dragon Mountains#!. They claim #Y Fjirno#! rests in a cave atop one of the lesser peaks, leaving every three days and returning again to rest for two.\n\nWith the information provided, there are two major options to consider. We could overwhelm the beast with our armies. Despite possibly losing many men, the monster is sure to be slain should we attack while he is sleeping.\n\nAlternatively, you could lead a party of our best to attempt to slay the dragon yourself. However, this action may be very dangerous my liege, and I cannot recommend it."
me_srrorum_20.a: "Send in the army"
me_srrorum_20.b: "Prepare me a suit of armor capable of withstanding the Dragon's flames"
me_srrorum_20_tooltip.a: "#Y We will send in the army to eliminate the Dragon!#!"
me_srrorum_20_tooltip.b: "#Y The King will sally forth with a small party to defeat the Dragon!#!"

me_srrorum_21_title: "The Horns of Victory"
me_srrorum_21_desc: "A great celebration is held in the streets of [GetProvince('(int32)3883').GetName|G], the #Y Dragon#! has been slain!\n\nDespite taking many losses against the unforgiving mountains as well as #Y Fjirno the Terrible#! itself our men managed to return victorious with the dragon's head in tow!\n\nThose who lived to tell the tale explain how they took the sleeping beast by surprise, and blinded the young wyrm so it could not properly defend itself. As it retreated into the cave, the men pressed on, noticing the large trails of blood the monster left behind. Trapped with nowhere to run, #Y Fjirno#! made his final stand, taking the lives of many brave warriors until he finally succumbed to his wounds.\n\nThese 'Rekkaisigrramoggen' have been given the highest honors by the king, and shall be remembered as the great heroes who felled the mighty #Y Fjirno the Terrible#!!"
me_srrorum_21.a: "Three cheers for the Dragonslayers!"
me_srrorum_21_tooltip: "#G Despite great cost, the army has defeated the Dragon!#!"

me_srrorum_22_title: "The Fall of a Great King"
me_srrorum_22_desc: "Hundreds gather in [GetProvince('(int32)3883').GetName|G] to mourn the loss of [ROOT.GetCountry.GetRuler.GetName|Y].\n\nOur heroic King engaged in a mighty brawl against the accursed wyrm #Y Fjirno the Terrible#!, taking both of the monster's eyes as it slept. As it awoke it let out a terrible roar that froze all in the party besides the King, who continued to attack the weak points in the dragon's scales.\n\nWrithing in pain, #Y Fjirno#! struck at one of the party members, ready to devour him whole. As the poor soul made his peace, our noble King dropped in front of him and struck the beast's maw, taking one of its teeth but being sent flying into a wall. It was then that the monster dealt a fatal blow to the King with its tail, and fled.\n\nWhile the rest of the party was eventually able to drive away the heavily injured #Y Fjirno#!, there were unable to save [ROOT.GetCountry.GetRuler.GetName|Y].\n\nThe tooth he recovered will be displayed as a trophy commemorating his bravery, and his body will be laid in the #Y Silver Caves#! to rest with his ancestors.\n\nDespite his untimely demise, he will live forever as a god amongst his people."
me_srrorum_22.a: "He will never be forgotten"
me_srrorum_22_tooltip: "#R The King has fallen in battle driving the Dragon back!#!"

me_srrorum_23_title: "The Search Begins"
me_srrorum_23_desc: "With the #G Dragon's Pass#! secured, many scholars from [GetProvince('(int32)3988').GetName|G] have taken an interest in the ancient land. Recounting ancient stories and histories, many of them have come to believe that ancient artifacts and relics dating back to the #Y Mythic Age#! could be found in the new territories!\n\nExcited by the prospect of finding these ancient treasures, [ROOT.GetCountry.GetRuler.GetName|Y] has decided to send out a large expedition of explorers to roam around certain regions that may contain such treasures."
me_srrorum_23.a: "Our prize lies in the plains of [GetProvince('(int32)4196').GetName]!"
me_srrorum_23.b: "In the mountains of [GetProvince('(int32)4063').GetName] is where we shall find Htgarth's treasures!"
me_srrorum_23.c: "[GetProvince('(int32)4031').GetName] surely hosts the artifacts we seek!"
me_srrorum_23_tooltip.a: "#Y We will search for relics in [GetProvince('(int32)4196').GetName]!#!"
me_srrorum_23_tooltip.b: "#Y We will search for relics in [GetProvince('(int32)4063').GetName]!#!"
me_srrorum_23_tooltip.c: "#Y We will search for relics in [GetProvince('(int32)4031').GetName]!#!"

me_srrorum_24_title: "The Expedition Returns"
me_srrorum_24_desc: "After much time members of the expedition have finally returned to the capital to present their findings to the King!\n\n[ROOT.GetCountry.GetRuler.GetName|Y], eager to hear their report, is perplexed by their nervious demeanor. After a moment of awkward silence, the leader of the expedition musters his courage to give the King his report. Despite their fertile soils and bountiful harvests, the plains has not been able to produce any relics or treasures. The expedition has scoured every town, cavern, and hill but their explorers could not find any of the relics mentioned in the many histories of the #Y Mythic Age#!.\n\nSilence ensues this report, as the expedition representatives seem to collectively hold their breaths. Much to their surprise, the King simply dismisses them, despondently stating:"
me_srrorum_24.a: "'Perhaps the histories were just stories...'"
me_srrorum_24_tooltip: "#R The expedition will return empty-handed.#!"

me_srrorum_25_title: "The Expedition Returns"
me_srrorum_25_desc: "Months have passed since the court has received word from the expedition. Despite the lingering doubts of the explorer's success, [ROOT.GetCountry.GetRuler.GetName|Y] remains hopeful that the expedition will return bearing treasure.\n\nAll of a sudden, a messenger arrives, bearing news of the successful return of the explorers!\n\nLeaving his palace, the King is met with the expedition's leaders, who recount their struggles and journeys to find lost relics in the remote mountains of [GetProvince('(int32)4063').GetName|G]. Enchanted by their tales, the King listens as the explorer details the relic he encountered whilst traversing a cavern near the base of a mountain.\n\nRevealing the relic to the King, he explains how he encountered the great #Y Konunvelkkon#!, one of the #Y Royal Drills#! of the #Y Royal Pair#!. Mentioned in a few legends, the #Y Royal Drill#! is a mechanism unseen anywhere in #G Omniluxia#!, a relic of a more advanced time where a single man could use this contraption to level mountains. With a tip made of #Y Mythril#! and powered by #Y Dverpi#! coal, these drills were thought to have been destroyed in order to keep them out of the hands of other invading races at the twilight of the #T First Kingdom of Srrørum#!.\n\nThrilled with this discovery, [ROOT.GetCountry.GetRuler.GetName|Y] orders his best scholars to take the legendary tool back to #Y Veddtunn#! to be studied. While its complexity may prevent its use for many years or even decades, the King is determined to provide the gold his scholars require to unlock its secrets."
me_srrorum_25.a: "What an amazing discovery!"
me_srrorum_25_tooltip: "#G We have recovered the legendary #E Konunvelkkon#!!#!"

me_srrorum_26_title: "A Strange Discovery"
me_srrorum_26_desc: "After many months of waiting, reports finally arrive from the expedition at [GetProvince('(int32)4031').GetName|G]!\n\nWhile they lament that they have not found any relics, the expedition leaders report of a strange discovery that might interest your highness. In the hills they ran into a small isolated village where the people would create a black powder to create bursts of flames for their rituals. While initially hesitant to show outsiders their secrets, the elders caved to the explorer's threats of violence and taught them how to create the powder.\n\nThis powder, 'Aykkdidaft', while not the relics we have sought, may be useful to our scholars in #Y Veddtunn#!."
me_srrorum_26.a: "Smoking powder eh?"
me_srrorum_26_tooltip: "#Y We have discovered a strange explosive powder.#!"

me_srrorum_27_title: "$03_srrorum_task_16$#!"
me_srrorum_27_desc: "'Millennia have passed since the fall of the #T First Kingdom of Srrørum#! and the loss of our homelands. The destruction of our cities. The loss of our power and wealth.'\n\n'Reforming the great kingdom of #Y Hefdarr#! and #Y Htgarth#! allowed us to dream once again.'\n\n'To dream of #Y Srrøkheim#!, the great empire of the #Y Silver Dwarves#!.'\n\n'An empire than encompassed all of the territories our ancestors once claimed in our extensive history that traces back to the beginning of the world!'\n\n'Now here we stand, with this dream realized. #Y Elf#!, #Y Goblin#!, #Y Dragkhan#!, #Y Human#!, #G Hobgoblin#!, they all kneel at our feet. At the feet of the great empire of #Y Htgarth#!.'\n\n'The great empire of #Y Hefdarr#!.'\n\n'My empire, #Y Srrøkheim#!.'\n\nCheers and screams follow as [ROOT.GetCountry.GetRuler.GetName|Y], the first emperor of #Y Srrøkheim#!, dons his imperial crown."
me_srrorum_27.a: "Affram Toiren!"
me_srrorum_27_tooltip: "The mission task '#Y $03_srrorum_task_16$#!' has now been #G Completed#!!"

me_srrorum_28_title: "$03_srrorum_task_20$#!"
me_srrorum_28_desc: "Long considered the center of the world, [GetProvince('(int32)3904').GetName|G] has now become a true #Y Sørrborr#! worthy of being the spiritual center of our faith. With the faithful organized, [ROOT.GetCountry.GetRuler.GetName|Y] has been able to claim his rightful place as the spiritual leader of the #T Srrøhebrikk#! world!\n\nAs the leader of those who believe in #Y Htgarth#! and #Y Freja's#! rightful succession as heirs of the #Y Stone Father#!, [ROOT.GetCountry.GetRuler.GetName|Y] is obligated to go and bring heretics to the true faith. Indeed, the #T Hebric#! world cannot be united until #T Srrøhebrikk#! armies occupy all of the great primordial caves! Thus, the great #Y Silver Crusade#! against our brothers must begin!"
me_srrorum_28.a: "May Htgarth be with us!"
me_srrorum_28_tooltip: "#Y We will claim the #E Holy Caves#! for the #E Silver Pair#!!#!"

me_srrorum_29_title: "$03_srrorum_task_21$#!"
me_srrorum_29_desc: "The great #Y City of Knowledge#!, [GetProvince('(int32)3988').GetName|G], has long been a metropolis of academies and libraries. However, with the patronage of [ROOT.GetCountry.GetRuler.GetName|Y] the city has become a true #Y Sørrborr#! truly worthy of hosting the great #Y Veddtunn#!!\n\nNow hosting a great magic academy, its only a matter of time until the #Y Silver Dwarves#! manage to train magicians able to match the strength of those found in other nations!"
me_srrorum_29.a: "Knowledge is power"
me_srrorum_29_tooltip: "The mission task '#Y $03_srrorum_task_21$#!' has now been #G Completed#!!"

me_srrorum_30_title: "$03_srrorum_task_22$#!"
me_srrorum_30_desc: "For millennia the elusive #Y Gerrmoggen#! have used folk magic passed down in their families for generations for all sorts of purposes, commonly causing mischief and mayhem from which the #Y Silver Dwarven#! suspicion of magic stems. Gathering even a few of these mysterious hermits to teach pupils at [GetProvince('(int32)3988').GetName|G] was no easy task, harder still was working with what few experienced mages exist to codify and document a formal style using their techniques.\n\nDespite these challenges, the brilliant mages at the new #G Konungladurr School of Stone Magic#! have meticulously developed the #T Gerrtágadi Style#!, whose users are capable of manipulating stone as if it were made of clay.\n\nWith the #Y Gerrmoggen#! put to productive use and a new style that could revolutionize construction and combat, the future of the kingdom looks bright!"
me_srrorum_30.a: "Marvelous!"
me_srrorum_30_tooltip: "The mission task '#Y $03_srrorum_task_22$#!' has now been #G Completed#!!"

me_srrorum_31_title: "$03_srrorum_task_23$#!"
me_srrorum_31_desc: "While our people have always utilized terrace farms in our production of food, widespread and efficient use of the land seen in the #Y Verobaen#! farms of the #Y Mythic Age#! have not been seen for millennia! With our realm united, many of our scholars have taken an interest in the ancient techniques utilized by our ancestors. Able to access record from across the #G Green Valley#!, many of them have been able to propose more efficient farms reminiscent of these ancient #Y Verobaen#! models!\n\nWith these farms projecting to substantially increase our yield, there are those in government that have proposed selling the surplus for kingdom to profit from."
me_srrorum_31.a: "These farms are for the benefit of the people!"
me_srrorum_31.b: "How much profit are we talking about?"
me_srrorum_31_tooltip.a: "#Y We will focus on maximizing the output of our yields!#!"
me_srrorum_31_tooltip.b: "#Y We will focus on maximizing the profits of our yields!#!"






srrorum_stooltip_1: "#Y We will gain claims on the #G Western World Lungs#!!#!"

