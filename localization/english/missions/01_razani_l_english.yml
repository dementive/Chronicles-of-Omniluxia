l_english:

03_razani: "The Twilight of the Razani"
03_razani_DESCRIPTION: "Although the [GetCountry('SOV').GetName|T] has graciously granted the refugees from the fallen city of [GetProvince('(int32)4588').GetName|G] sanctuary, an incident at the royal court in [GetCountry('SOV').GetCapital.GetName|G] would prove to be the prelude to a #T Dragkhanic#! #Y Civil War#! - one that will have ramifications for all of #G Omniluxia#!."
03_razani_CRITERIA_DESCRIPTION: "This mission will be completed when [ROOT.GetCountry.GetRuler.GetName|Y] successfully challenges [GetCountry('SOV').GetRuler.GetName|Y] for control of the [GetCountry('SOV').GetName|T] before launching an invasion of the western coast of #G Luxterra#!."
03_razani_BUTTON_TOOLTIP: "Zemmairthia Jarenam, I shall reclaim you..."

#Missions

03_razani_task_1: "A Scandal At [GetProvince('(int32)4864').GetName]"
03_razani_task_1_DESC: "In an effort to further integrate [ROOT.GetCountry.GetRuler.GetName|Y] into the royal court at [GetProvince('(int32)4864').GetName|G], the newly-crowned [ROOT.GetCountry.GetRulerTitle] of [GetProvince('(int32)5017').GetName|G] has been asked to marry a princess from the [GetCountry('SOV').GetRuler.GetFamilyDisplayAdjective] House.\n\n#Y This task will be#! #R bypassed#! #Y if our#! [ROOT.GetCountry.GetRulerTitle|T] #Y is married.#!"


#Tooltips
we_need_to_hire_mercenary_tt: "#Y We need to have a#! #T Mercenary Army#! #Y employed#!."


#Modifiers


#Events
me_razani_1_title: "$03_jqf_task_1$"
me_razani_1_desc: "After many anxious weeks of correspondence between [GetCountry('SOV').GetCapital.GetName|G] and [ROOT.GetCountry.GetCapital.GetName|G], the day of the proposed marriage between [ROOT.GetCountry.GetRuler.GetName|Y] and his bride, [SCOPE.sCharacter('soventeir_princess').GetName|Y], is finally at hand.\n\nThe [GetCountry('SOV').GetRulerTitle] insisted on being the one to give away [GetCountry('SOV').GetRuler.GetHerHis] niece, [SCOPE.sCharacter('soventeir_princess').GetFirstName|Y], but unfortunately for all involved, [GetCountry('SOV').GetRuler.GetName|Y] began celebrating early in the day and was very inebriated during the ceremony. Once the rites were completed and the feasting began, [GetCountry('SOV').GetRuler.GetFirstName|Y] continued to drink unmixed Hazalar wine, and as the strong liquor began to do its work, the topic at dinner turned towards uncomfortable things, like the recent #Y Fall of [GetProvince('(int32)4588').GetName]#!.\n\nReaching for a haunch of roasted lamb, the [GetCountry('SOV').GetRulerTitle] stifled a belch and began chuckling. 'I can't help but notice that you have done quite well for yourself, [ROOT.GetCountry.GetRuler.GetFirstName|Y], despite living a life defined by failures.' Rudely pointing towards [SCOPE.sCharacter('soventeir_princess').GetFirstName|Y] with a silver fork, [GetCountry('SOV').GetRuler.GetFirstName|Y] laughed out loud. 'A beautiful princess from the Royal House and the city of [GetProvince('(int32)5017').GetName|G] to rule over as a personal fief...not too bad, young man. If your #Y Jarenam#! kinsmen knew that such hospitality awaited them in the [GetCountry('SOV').GetName|T], then I would half-expect to see a thousand ships filled with cowards sailing over the horizon.'\n\nA deadly silence fell at the dinner table, interrupted only the droning strings and clanging cymbals of the court musicians. Rising to [ROOT.GetCountry.GetRuler.GetHerHis] feet, face choked with rage and feeling the eyes of all present upon [ROOT.GetCountry.GetRuler.GetHerHim], [ROOT.GetCountry.GetRuler.GetFirstName|Y] half-bowed, hand on the hilt of [ROOT.GetCountry.GetRuler.GetHerHis] sword."
me_razani_1.a: "Forgive me, but it is time for me to leave, your Majesty..."
me_razani_1_tooltip: "The mission task '#Y $03_jqf_task_1$#!' has now been #G Completed#!!"
