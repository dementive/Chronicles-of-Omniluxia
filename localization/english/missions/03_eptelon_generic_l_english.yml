l_english:
 03_eptelon_generic:0 "The Beleaguered Shore"
 03_eptelon_generic_DESCRIPTION:0 "The island of #Y Eptelon#! has been viewed as a backwater for centuries - overshadowed by the civilizations on #Y Artheon#! to its west and the #Y Austropetolian Archipelago#! to its south, these days Eptelon mostly serves as a training ground for raiders, pirates and mercenaries to hone their craft before moving on to more dangerous contracts.\n\nIn the days since the #R Great Collapse#!, various factions have fought over bits and pieces of the island; Artheousan colonizers in the west, Ascendic Elven invaders along the northern coasts, and the native tribes in the south all struggle against each other for control, but so far, no state has emerged as the clear hegemon. The #T Beleaguered Shore#! awaits a hand to lead it towards greatness."
 03_eptelon_generic_CRITERIA_DESCRIPTION:0 "This mission will be considered complete when we have destroyed our enemies and formed #Y Eptelon#!."

 03_eptelon_generic_task_1:0 "Tested By The Shore"
 03_eptelon_generic_task_1_desc:0 "Eptelon punishes the ill-prepared. The island's highland interior is a maze of ravines and dense forest where warriors who do not know the terrain simply vanish. Whatever power seeks to master this island must first master the art of surviving it. Train the levies, stock the armories, and harden the men."
 03_eptelon_generic_task_1_tooltip:0 "Our forces must be battle-ready before we can move on this island."

 03_eptelon_generic_task_2:0 "Against The Slaver Fleets"
 03_eptelon_generic_task_2_desc:0 "The Great Slaver Navies do not distinguish between native, colonist, or conqueror - they see only bodies and chains. For generations these fleets have raided Eptelon's coasts freely, taking whoever is unfortunate enough to be caught near the water. That ends now. Raise watchtowers on the headlands, garrison the coastal towns, and put warships on the water before the next fleet arrives."
 03_eptelon_generic_task_2_tooltip:0 "We must drive the slaver fleets from Eptelonian waters."

 03_eptelon_generic_task_3:0 "The Goods Of The Fractured Isle"
 03_eptelon_generic_task_3_desc:0 "Eptelon's forests hold timber of uncommon quality, its coastal waters teem with fish, and somewhere in the interior there are veins of metal that the invaders never managed to fully map. This wealth has gone largely unorganized for too long - traded piecemeal, stolen by raiders, or left rotting in warehouses no one controls. Establish the trade infrastructure that transforms raw abundance into real revenue."
 03_eptelon_generic_task_3_tooltip:0 "Eptelon's natural wealth must be organized and protected."

 03_eptelon_generic_task_3_hept:0 "Maritime Ledgers"
 03_eptelon_generic_task_3_hept_desc:0 "The Heptelonians did not come to Eptelon to farm - they came to trade. Their port towns are counting houses and dockyards first, everything else second. The colony's future lies not in the forest interior but in the lanes between Eptelon and the Horteonian mainland: spices, timber, dyes, coin. Formalize the ledgers, sign the contracts, and ensure Heptelonian factors are present at every significant port on the island."
 03_eptelon_generic_task_3_hept_tooltip:0 "Our ledgers must be set in order before we can expand."

 03_eptelon_generic_task_4:0 "Securing The Heartland"
 03_eptelon_generic_task_4_desc:0 "No power has ever held Eptelon from a borrowed foothold. To press outward - whether to expel, to conquer, or to absorb - we must first hold enough of the island that retreat is no longer an option. Every province we control now is a staging ground for what comes next. Plant the banner. Make clear that we are not leaving."
 03_eptelon_generic_task_4_tooltip:0 "We must control a meaningful portion of our home region."

 03_eptelon_generic_task_sum_khaya:0 "The City Of Thieves"
 03_eptelon_generic_task_sum_khaya_desc:0 "Sum Khaya has a reputation that precedes it across every sea lane in the Central Omniluxian Sea. The #E City of Thieves#!. A slum-port crammed with war refugees from the High Elven conflicts, discharged mercenaries who found no one left to hire them, pirates who operate in daylight because no one powerful enough to stop them has ever bothered to try. Our spies say that whoever actually controls the criminal network running through those slums controls more of Eptelon's information than any governor has ever managed. It might be worth finding out for ourselves what is actually down there."
 03_eptelon_generic_task_sum_khaya_tooltip:0 "The ruler must personally investigate the Slums of Sum Khaya (Province 653). Only available when we own the city and are not at war."

 03_eptelon_generic_task_5a:0 "The Warchief's Covenant"
 03_eptelon_generic_task_5a_desc:0 "For three generations the Eptelonian tribes have fought each other as readily as they fought the foreign invaders - a fact the colonists learned to exploit. Clan blood-feuds become colonial opportunity. But the time of that weakness is past. A single warchief must rise who can make the other chieftains bend the knee, not to a king, but to a shared purpose: the reclamation of the island their ancestors held before the first Atheusian sail appeared on the horizon."
 03_eptelon_generic_task_5a_tooltip:0 "The tribes must speak with one voice before the island can be reclaimed."

 03_eptelon_generic_task_6a:0 "Drive Back The Invaders"
 03_eptelon_generic_task_6a_desc:0 "The northern highlands have always been Eptelonian. The High Elven citadels there were carved into existing sacred sites - a desecration that has never been forgotten, only endured. The tribes who remember the old stories do not need to be told what to do with those citadels once the tribal army arrives beneath their walls. Retake the north. The coasts can come later. First, let the banners of the Eptelonian people fly where the slavers' towers stood."
 03_eptelon_generic_task_6a_tooltip:0 "We must seize the northern region from the colonists who have occupied it."

 03_eptelon_generic_task_elder_mark:0 "The Elder's Mark"
 03_eptelon_generic_task_elder_mark_desc:0 "The priests speak of a relic from the First Occupation - the Elder's Mark, a carved war-standard carried by the chieftain who first united the Eptelonian tribes against the initial wave of Atheusian slavers. It was lost when the invaders burned the great inland settlement at Edaur, but the oral histories have never stopped tracking its possible whereabouts. Three generations of scholars and wandering shamans have left fragments of its trail. Assemble the pieces. Find the Mark. Let it be seen again."
 03_eptelon_generic_task_elder_mark_tooltip:0 "Seek out the Elder's Mark in the ruins of the inland settlements."

 03_eptelon_generic_task_tribal_council:0 "The Tribal Council"
 03_eptelon_generic_task_tribal_council_desc:0 "A warchief can lead armies. A Tribal Council can govern a people. The institution of the Edaur Council - the great gathering of clan-heads that predated the Atheusian invasion - must be restored if the Eptelonians are to build something that outlasts the current generation's victories. Convene the elders. Hear the disputes that have festered for decades. Establish a framework that turns a confederation of warring clans into a single, governing body."
 03_eptelon_generic_task_tribal_council_tooltip:0 "The ancient Tribal Council must be restored to unite the clan-heads under law."

 03_eptelon_generic_task_7a:0 "The Ancestral Shore"
 03_eptelon_generic_task_7a_desc:0 "The great Shout coastline to the south - named for the sound the winter gales make as they drive through the sea-cliffs - has been colonist territory for longer than any living Eptelonian can remember. But the bones of the ancestors are still there, buried beneath foreign stonework. The shamans say the shore remembers. Three footholds on the Shout coast, held by Eptelonian warriors, and the memory of that land will begin to stir. Give it those footholds."
 03_eptelon_generic_task_7a_tooltip:0 "Establish a meaningful Eptelonian presence along the Shout coastline."

 03_eptelon_generic_task_8a:0 "The Final Expulsion"
 03_eptelon_generic_task_8a_desc:0 "There will be no foreign banners on Eptelon when the Eptelonian people are finished. The High Elven citadels will be torn down or turned to our uses. The Heptelonian counting houses will be seized or abandoned. Every acre of the Shout coast will be under native law. This is not conquest - conquest implies taking what belongs to another. This is reclamation. This is the island returning to the people who were here first and will be here last."
 03_eptelon_generic_task_8a_tooltip:0 "Eptelon's Shout region must be wholly reclaimed for the Eptelonian people."

 03_eptelon_generic_task_5b:0 "The Ascendic Colony"
 03_eptelon_generic_task_5b_desc:0 "The Ascendic philosophy teaches that mastery of self must precede mastery of others - and that this principle applies to nations no less than individuals. Before the colonial arm of the Atheusian legacy can expand across Eptelon, it must demonstrate that its own house is in order. Stability. Internal administration. Controlled borders. A citadel-state that projects discipline inward before it projects authority outward."
 03_eptelon_generic_task_5b_tooltip:0 "The colonial administration must achieve internal order before expansion can begin."

 03_eptelon_generic_task_6b:0 "Fractures In The Tribes"
 03_eptelon_generic_task_6b_desc:0 "The Eptelonian tribes have been fighting each other since before the Atheusian fleet first landed. That is useful. Encourage the old blood-feuds. Make certain the clan who attacked the village two generations ago hears that their traditional enemy has just signed a treaty with the High Elven administration. A tribal confederation that spends its energy on internal conflict is a tribal confederation that does not mass its forces on the citadel walls."
 03_eptelon_generic_task_6b_desc_cg:0 "That is what wisdom says. Our lord-commander is already running the scheme. We simply need to give it time to work."
 03_eptelon_generic_task_6b_tooltip:0 "Use our diplomatic reach to inflame native feuds and weaken their resistance."

 03_eptelon_generic_task_7b:0 "Citadels Of The Shore"
 03_eptelon_generic_task_7b_desc:0 "The Atheusian model of colonial governance is the citadel: a fortified administrative center that projects military authority while housing the administrators, scholars, and philosophical practitioners of the Ascendic doctrine. Three such fortresses established along the Eptelonian coast, properly garrisoned and stocked, would transform this colonial outpost into something permanent. Not a settlement. A footprint. And footprints do not wash away."
 03_eptelon_generic_task_7b_tooltip:0 "Construct and garrison three citadels along the Eptelonian coastline."

 03_eptelon_generic_task_8b:0 "The Ascendic Shore"
 03_eptelon_generic_task_8b_desc:0 "Eptelon is no longer a contested frontier - it is an Ascendic possession. The southern coastline, with its natural harbors and defensible headlands, has been brought firmly under citadel law. The remaining native populations will either assimilate into the administrative structure or find the highlands increasingly inhospitable. There is no room on a well-governed coast for those who reject governance. The Atheusian legacy lives."
 03_eptelon_generic_task_8b_tooltip:0 "The Shout coast must fall under complete Ascendic authority."

 03_eptelon_generic_task_5c:0 "The Port Towns"
 03_eptelon_generic_task_5c_desc:0 "The Heptelonian colony exists because of its harbors, and the harbors must come first. Before the colony can defend itself against Eptelonian war-parties or High Elven administrative pressure, it must be able to feed itself, resupply itself, and communicate with the Horteonian mainland without interruption. That means warehouses, wharves, counting-houses, and enough coastal fortification that an enemy ship thinks twice before testing the harbor mouth."
 03_eptelon_generic_task_5c_tooltip:0 "Develop the harbor infrastructure that sustains the colony's survival."

 03_eptelon_generic_task_6c:0 "Merchants Of The Inner Sea"
 03_eptelon_generic_task_6c_desc:0 "A colony that cannot trade is not a colony - it is a garrison. The Heptelonian settlements were built on the promise of the Inner Sea trade lanes, and those lanes must be made reliable again. Factor-houses on the mainland. Ships that can make the crossing in summer and survive the winter storms. Contracts with Horteonian merchant families who have reason to care whether this colony survives. Build the network that makes Eptelon indispensable to those who never visit it."
 03_eptelon_generic_task_6c_tooltip:0 "Re-establish trade connections with the Horteonian mainland."

 03_eptelon_generic_task_7c:0 "The Colonial Levy"
 03_eptelon_generic_task_7c_desc:0 "The colony's first generation hired mercenaries. The second generation relied on the occasional Horteonian naval patrol. The third generation - this one - must learn to defend itself. Every man and woman in the colony who can hold a spear has been born on Eptelonian soil. That gives them something the mercenaries never had: a reason to fight that goes beyond the day's pay. Drill the levy. Build the barracks. Turn the colony's sons into soldiers."
 03_eptelon_generic_task_7c_tooltip:0 "Raise a trained military force from the colony's native-born population."

 03_eptelon_generic_task_8c:0 "A Colony No Longer"
 03_eptelon_generic_task_8c_desc:0 "The oldest man in the colony was born here. His father was born here. His grandfather crossed the water from Horteon with a merchant charter and a head full of dreams about Eptelonian trade routes, and he never went back. That is three generations. Three generations of births and deaths and marriages and feuds on this soil. At some point a colony stops being a colony and becomes something else - a nation. Formalize that transformation. Own both coasts. And never call this place a colony again."
 03_eptelon_generic_task_8c_tooltip:0 "Own both Eptelonian regions and transform the colony into a sovereign nation."

 03_eptelon_generic_task_9:0 "The Beleaguered Shore"
 03_eptelon_generic_task_9_desc:0 "We hold Eptelon. Both coasts, both regions, both the highlands and the harbors. But holding is not the same as governing, and governing is not the same as enduring. There are people on this island who remember when someone else held it - and who are not yet certain whether our tenure will outlast the season. Before we can call Eptelon truly ours, we must decide what to do with everyone it was claimed from."
 03_eptelon_generic_task_9_tooltip:0 "Hold both the north and south regions of Eptelon."

 03_eptelon_generic_task_9_open_hand:0 "The Settlers' Compact"
 03_eptelon_generic_task_9_open_hand_desc:0 "The pragmatic answer, and the patient one: not everyone who lived under the old regime was an enemy, and many of those who were enemies have now lost and know it. Offer terms. Integrate the useful, protect the harmless, remove only those who are actively dangerous. A population that is not seething is a population that grows food, pays taxes, and does not slip knives into backs in the dark. This is not mercy - it is administration."
 03_eptelon_generic_task_9_open_hand_tooltip:0 "Integrate the remaining displaced populations through negotiated settlement."

 03_eptelon_generic_task_9_iron_brand:0 "The Price Of Victory"
 03_eptelon_generic_task_9_iron_brand_desc:0 "The other answer, and the older one: war has costs, and costs are paid by those who lose. Reduce the enemy combatants to a labor class. Redistribute their property. Make the calculus of resistance so clearly negative that no one considers it for a generation. This is not cruelty - it is deterrence. Future enemies will look at what happened to the last ones and choose differently. The island will be quiet because it has learned what quiet costs to abandon."
 03_eptelon_generic_task_9_iron_brand_tooltip:0 "Subjugate the remaining populations and convert prisoners to productive labor."

 03_eptelon_generic_task_10:0 "Rebuild The Shore"
 03_eptelon_generic_task_10_desc:0 "Three decades of intermittent warfare have left Eptelon's cities cracked, their populations thinned, their wells unclean and their granaries half-empty. What we hold must be made to function again. Ten cities rebuilt and strengthened - not monuments, but working settlements with markets that open and courts that judge and walls that stand without constant repair. The island survived us taking it. Now it must survive us governing it."
 03_eptelon_generic_task_10_tooltip:0 "Rebuild and develop ten cities across the Eptelonian regions."
  eptelon_generic_task_10_rebuild_tt:0 "Ten cities across the Eptelonian regions must be developed, garrisoned, and populated."

 03_eptelon_generic_task_11:0 "Fleet Of The Fractured Shore"
 03_eptelon_generic_task_11_desc:0 "Eptelon is an island. That simple fact determines everything about its long-term security. A land power controls roads and walls. An island power controls the water around it, and if it does not control that water, it controls nothing. Forty warships - enough to make any fleet hesitating on the horizon reconsider its options - must be built, crewed, and stationed in Eptelonian harbors before this island can claim to be truly sovereign. The sea is the wall."
 03_eptelon_generic_task_11_tooltip:0 "Raise a fleet of at least forty warships to command Eptelonian waters."

 03_eptelon_generic_task_12:0 "Fortify The Capital"
 03_eptelon_generic_task_12_desc:0 "The seat of power on Eptelon must be made unassailable - not because we fear immediate attack, but because an unfortified capital is an invitation. Every court, every administration, every law that comes from this city will carry more weight if the city itself could withstand a siege. Two fortress walls. State improvements that signal permanence. The kind of construction that says to anyone watching: this is where we intend to be for the next five hundred years."
 03_eptelon_generic_task_12_tooltip:0 "Fortify the capital with walls, garrisons, and state infrastructure."
  we_need_improved_fortification_tt:0 "#Y We need the#! #T Economic Policy#! #G Improved Fortifications#! #Y active#!."

 03_eptelon_generic_task_13:0 "The Island Finds Its Shape"
 03_eptelon_generic_task_13_desc:0 "For the first time in living memory, Eptelon is not contested. The fleets are ours. The walls are built. The cities are growing. The aggressive expansion of the wars is fading into the past. What remains is the longer, slower work: a capital large enough to be recognized as a seat of authority by powers beyond the island's shores, surrounded by a state that has spent its wars on something other than endlessly defending itself. Eptelon has found its shape. All that remains is to name it."
 03_eptelon_generic_task_13_tooltip:0 "Achieve the stability and urban development that precedes the formation decision."

 03_eptelon_generic_task_14:0 "Form Eptelon"
 03_eptelon_generic_task_14_desc:0 "The decision stands before us. The formation documents are prepared. Whether this becomes the Eptelonic Confederation, the Ascendic Shore, or the Harbor Kingdom of the Heptelonians - the name matters less than the act. Use the appropriate decision. Speak it aloud. Put the seal on it. Eptelon exists now not as a contested prize or a fragile colony but as a state, with all the weight of law and territory and name behind it. What comes next is history."
 03_eptelon_generic_task_14_tooltip:0 "Use the appropriate formation decision and end the war in peace."
  eptelon_need_to_form_tt:0 "We must have formed one of the three Eptelon states: #Y $EPT$#!, #Y $ASE$#!, or #Y $HPT$#!."

  eptelon_need_shout_provinces_tt:0 "We must control at least three provinces in the Shout region."
  eptelon_need_citadels_tt:0 "Three Eptelonian provinces must have a fortress constructed."
  we_need_port_building_tt:0 "We need to own a territory with a #T Port#! building."
  general_mission_cooldown_tt:0 "This mission will be unavailable for a time."

  item_eptelon_elder_mark:0 "The Elder's Mark"
  item_eptelon_harbor_charter:0 "The Eptelonian Harbor Charter"

  elder_mark_eptelon_treasure:0 "The Elder's Mark"
  elder_mark_eptelon_treasure_desc:0 "A carved war-standard recovered from the ruins of the great inland settlement at Edaur - said to have been carried by the first warchief who united the Eptelonian tribes against the Atheusian slavers. Its recovery has sent a wave of defiant pride through every clan on the island. The shamans say it still carries the first warchief's oath: that the island belongs to those who have bled for it longest."

  me_eptelon_gen.1.t:0 "Tested By The Shore"
  me_eptelon_gen.1.desc:0 "The island has judged our armies and found them wanting. Only through discipline, preparation, and stubborn endurance will we prove ourselves worthy of this shore."
  me_eptelon_gen.1.a:0 "We endure."

  me_eptelon_gen.2.t:0 "Against The Slaver Fleets"
  me_eptelon_gen.2.desc:0 "The raiders have long treated these waters as their hunting ground. We will make them pay for every mile they have crossed."
  me_eptelon_gen.2.a:0 "Let them come."

  me_eptelon_gen.3.t:0 "The Goods Of The Fractured Isle"
  me_eptelon_gen.3.desc:0 "Eptelon's wealth has always been real, but never properly organized. That era is over."
  me_eptelon_gen.3.a:0 "Make it count."

  me_eptelon_gen.4.t:0 "Maritime Ledgers"
  me_eptelon_gen.4.desc:0 "Heptelonian trade lives and dies by the harbor books. Balance them, formalize them, and the colony can grow."
  me_eptelon_gen.4.a:0 "Set the ledgers straight."

  me_eptelon_gen.5.t:0 "Securing The Heartland"
  me_eptelon_gen.5.desc:0 "Enough of the island is now in our grasp that retreat is no longer an option. We can finally think beyond survival."
  me_eptelon_gen.5.a:0 "Hold fast."

  me_eptelon_gen.10.t:0 "The Warchief's Covenant"
  me_eptelon_gen.10.desc:0 "The clans bend toward unity, and with them the island's old strength begins to wake."
  me_eptelon_gen.10.a:0 "One people."

  me_eptelon_gen.11.t:0 "Drive Back The Invaders"
  me_eptelon_gen.11.desc:0 "The highlands remember their own. The invaders will be forced back from the north."
  me_eptelon_gen.11.a:0 "Take the north."

  me_eptelon_gen.12.t:0 "The Elder's Mark"
  me_eptelon_gen.12.desc:0 "A relic of the first resistance has been brought to light. The old oath returns with it."
  me_eptelon_gen.12.a:0 "Let it be seen."

  me_eptelon_gen.13.t:0 "The Tribal Council"
  me_eptelon_gen.13.desc:0 "The elders gather once more. What was broken by conquest may yet be bound by law."
  me_eptelon_gen.13.a:0 "Seat the council."

  me_eptelon_gen.14.t:0 "The Ancestral Shore"
  me_eptelon_gen.14.desc:0 "The Shout coast stirs under our banners. The ancestors have not forgotten it, and neither have we."
  me_eptelon_gen.14.a:0 "Claim the shore."

  me_eptelon_gen.15.t:0 "The Final Expulsion"
  me_eptelon_gen.15.desc:0 "The island no longer belongs to the invaders. Their banners are gone, and their claims with them."
  me_eptelon_gen.15.a:0 "Out with them."

  me_eptelon_gen.20.t:0 "The Ascendic Colony"
  me_eptelon_gen.20.desc:0 "Order within the colony has become the basis for something larger. The Ascendic way takes root."
  me_eptelon_gen.20.a:0 "Refine the colony."

  me_eptelon_gen.21.t:0 "Fractures In The Tribes"
  me_eptelon_gen.21.desc:0 "Old rivalries are a tool, and we have learned how to wield them."
  me_eptelon_gen.21.a:0 "Fan the divide."

  me_eptelon_gen.22.t:0 "Citadels Of The Shore"
  me_eptelon_gen.22.desc:0 "The coastline is being hardened into a permanent colonial footing."
  me_eptelon_gen.22.a:0 "Raise the citadels."

  me_eptelon_gen.23.t:0 "The Ascendic Shore"
  me_eptelon_gen.23.desc:0 "The island bends to the Ascendic order at last, its coast disciplined into permanence."
  me_eptelon_gen.23.a:0 "The shore is ours."

  me_eptelon_gen.30.t:0 "The Port Towns"
  me_eptelon_gen.30.desc:0 "The harbors and warehouses of the colony now form a real lifeline across the sea."
  me_eptelon_gen.30.a:0 "Build the ports."

  me_eptelon_gen.31.t:0 "Merchants Of The Inner Sea"
  me_eptelon_gen.31.desc:0 "The mainland and the colony can now trade as one living network."
  me_eptelon_gen.31.a:0 "Open the lanes."

  me_eptelon_gen.32.t:0 "The Colonial Levy"
  me_eptelon_gen.32.desc:0 "The colony's own people are ready to defend what is theirs."
  me_eptelon_gen.32.a:0 "Raise them up."

  me_eptelon_gen.33.t:0 "A Colony No Longer"
  me_eptelon_gen.33.desc:0 "The colony has outgrown its name. It now stands as a nation in its own right."
  me_eptelon_gen.33.a:0 "A sovereign realm."

  me_eptelon_gen.40.t:0 "The Beleaguered Shore"
  me_eptelon_gen.40.desc:0 "Eptelon has been secured, but the question of what it should become still remains."
  me_eptelon_gen.40.a:0 "Choose its future."

  me_eptelon_gen.41.t:0 "The Settlers' Compact"
  me_eptelon_gen.41.desc:0 "The island's displaced peoples can be folded into a workable peace rather than cast aside."
  me_eptelon_gen.41.a:0 "Offer terms."

  me_eptelon_gen.42.t:0 "The Price Of Victory"
  me_eptelon_gen.42.desc:0 "The defeated will learn what our victory costs them, and the rest of the island will remember."
  me_eptelon_gen.42.a:0 "Make an example."

  me_eptelon_gen.43.t:0 "Rebuild The Shore"
  me_eptelon_gen.43.desc:0 "The cities of Eptelon can be made whole again, if we commit the labor and coin."
  me_eptelon_gen.43.a:0 "Rebuild them."

  me_eptelon_gen.44.t:0 "Fleet Of The Fractured Shore"
  me_eptelon_gen.44.desc:0 "The sea around Eptelon must be commanded, or the island will never truly be secure."
  me_eptelon_gen.44.a:0 "Launch the fleet."

  me_eptelon_gen.45.t:0 "Fortify The Capital"
  me_eptelon_gen.45.desc:0 "The capital must become the kind of seat that no enemy can casually imagine taking."
  me_eptelon_gen.45.a:0 "Strengthen the walls."

  me_eptelon_gen.46.t:0 "The Island Finds Its Shape"
  me_eptelon_gen.46.desc:0 "At last, Eptelon is becoming something stable enough to endure."
  me_eptelon_gen.46.a:0 "Set its course."

  me_eptelon_gen.47.t:0 "Form Eptelon"
  me_eptelon_gen.47.desc:0 "The island stands ready to be named, ruled, and remembered as a single state."
  me_eptelon_gen.47.a:0 "So be it."
