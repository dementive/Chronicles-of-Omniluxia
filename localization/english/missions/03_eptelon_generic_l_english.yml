l_english:
 03_eptelon_generic: "The Beleaguered Isle"
 03_eptelon_generic_DESCRIPTION: "The island of #Y Eptelon#! has been viewed as a backwater for centuries - overshadowed by the civilizations on #Y Arteon#! to its west and the #Y Austropetolian Archipelago#! to its south, these days Eptelon mostly serves as a training ground for raiders, pirates and mercenaries to hone their craft before moving on to more dangerous contracts.\n\nIn the days since the #R Great Collapse#!, various factions have fought over bits and pieces of the island; Artheousan colonizers in the west, Ascendic Elven invaders along the northern coasts, and the native tribes in the south all struggle against each other for control, but so far, no state has emerged as the clear hegemon. The #G Beleaguered Isle#! awaits a hand to lead it towards greatness."
 03_eptelon_generic_CRITERIA_DESCRIPTION: "This mission will be considered complete when we have destroyed our enemies and formed #G Eptelon#!."
 03_eptelon_generic_BUTTON_TOOLTIP: "The time to unite #G Eptelon#! is at hand!"

 03_eptelon_generic_task_1: "Tested By The Land"
 03_eptelon_generic_task_1_DESC: "#G Eptelon#! punishes the ill-prepared. The island's highland interior is a maze of dense forest and jungle, where warriors who do not know the terrain simply vanish. Whatever power seeks to master this island must first master the art of surviving it. Train the levies, stock the armories, and harden the men for one of the toughest battles they will ever face."

 03_eptelon_generic_task_2: "Stand Against The Slavers"
 03_eptelon_generic_task_2_DESC: "The #R Great Slaver Navies#! do not distinguish between native, colonist, or conqueror - they see only bodies, chains and coins. For generations these fleets have raided #G Eptelon#!'s coasts freely, taking whoever is unfortunate enough to be caught near the water.\n\nThat ends now. [ROOT.GetCountry.GetRuler.GetName|Y] has called for watchtowers to be constructed on the headlands, and is encouraging our men to turn the tides and start taking slaves of their own."

 03_eptelon_generic_task_3: "The Goods Of The Fractured Isle"
 03_eptelon_generic_task_3_DESC: "#G Eptelon#! is filled with abundant natural resources, some rarer than others, but the island does not have any real trade network - it is time that we change that. Let us set up the infrastructure to begin trading Eptelon's wealth."
 
 03_eptelon_generic_task_3_hept: "Maritime Ledgers"
 03_eptelon_generic_task_3_hept_DESC: "Our future lies not solely on #G Eptelon#!, but with any place that will purchase the many goods we will carry away from here; spices @spices!, timber @wood!, dyes @dye!, and so much more. But before our trade ships can sail to foreign markets, we need a port to which they can return."
 we_need_free_taxation_policy_tt: "#Y We need the#! #T Economic Policy#! #G Free Trade#! #Y active#!."
 
 03_eptelon_generic_task_4: "Securing Our Borders"
 03_eptelon_generic_task_4_DESC: "[ROOT.GetCountry.GetRuler.GetName|Y] believes that it is finally time to destroy our enemies and drive them from lands that we have claimed as our own. Every province we conquer must be a staging ground for what comes next - we cannot stop now."

 03_eptelon_generic_task_sum_khaya: "The City Of Thieves"
 03_eptelon_generic_task_sum_khaya_DESC: "[GetProvince('(int32)653').GetName|Y] has a reputation that precedes it across every trade lane in the #T Central Omniluxian Sea#!...the dreaded #R 'City of Thieves'#!, a slum-port crammed with war refugees, mercenaries and pirates. No one knows who truly rules the city - is it the pirate gangs operating in its harbor district, or the mercenary companies that have taken over entire districts for themselves? It might be worth finding out for ourselves what is actually going on down there."

 03_eptelon_generic_task_5a: "The [ROOT.GetCountry.GetRulerTitle]'s Covenant"
 03_eptelon_generic_task_5a_DESC: "For generations, the #Y Eptelonian#! tribes have fought each other as readily as we have fought the foreign invaders - a fact that the colonists learned to exploit. But the time of that weakness is past; a single [ROOT.GetCountry.GetRulerTitle|T] must rise who can make the other chieftains bend the knee. [ROOT.GetCountry.GetRuler.GetName|Y] has sworn a sacred vow that [ROOT.GetCountry.GetRuler.GetSheHe] will unify our people before destroying the colonists."
 tybin_omen_active_tt: "#Y The deity#! #T Tybin#! #Y must be active within our#! #G Pantheon#!."

 03_eptelon_generic_task_6a: "Drive Back The Invaders"
 03_eptelon_generic_task_6a_DESC: "[GetDeityDefinition('omen_tybin').GetName|G], the bloodthirsty #Y Taker of Cities#! that delights in sacking and pillaging, has a shrine devoted to him near #Y Lake Sevan#!. Priests from [GetProvince('(int32)586').GetName|Y] have traveled to [ROOT.GetCountry.GetCapital.GetName|Y] with a message for the [ROOT.GetCountry.GetRulerTitle] - [ROOT.GetCountry.GetRuler.GetSheHe] must make a pilgrimage to the lake as soon as [ROOT.GetCountry.GetRuler.GetSheHe] is able."
 
 03_eptelon_generic_task_elder_mark: "The Elder's Mark"
 03_eptelon_generic_task_elder_mark_DESC: "The shamans speak of a relic from the First Occupation - the #T Elder's Mark#!, a carved war-standard carried by the chieftain who first united the #Y Eptelonian#! tribes against the initial wave of #Y Atheusian#! slavers. It was believed to be lost when the invaders burned the great inland settlement at [GetProvince('(int32)748').GetName|Y], but the oral histories have never stopped tracking its possible whereabouts. Three generations of scholars and wandering shamans have left fragments of its trail. Assemble the pieces. Find the Mark. Let it be seen again."

 03_eptelon_generic_task_tribal_council: "Construct The Eptelen"
 03_eptelon_generic_task_tribal_council_DESC: "For centuries, our gods have desired solitude and have withdrawn themselves from the world, but the stirrings on our island have awoken them from their slumbers and they yearn for greater influence.\n\n [ROOT.GetCountry.GetRuler.GetName|Y] claims to have been visited by the gods in a dream, where they demanded that [ROOT.GetCountry.GetRuler.GetSheHe] construct a magnificent temple, the #T Eptelen#!, that will serve as the heart and home of our religion."

 03_eptelon_generic_task_5b: "The Ascendic Colony"
 03_eptelon_generic_task_5b_DESC: "The #Y Ascendic#! philosophy teaches that mastery of self must precede mastery of others - and this principle applies to nations no less than individuals. Before the colonial arm of the #T Atheusian Legacy#! can expand across #G Eptelon#!, [ROOT.GetCountry.GetName|Y] must demonstrate that its own house is in order.\n\nWith the #Y Black Pearl of Atheus#! in our possession, our work here is all but finished."
 
 03_eptelon_generic_task_6b: "Purge The Court"
 03_eptelon_generic_task_6b_DESC: "Before we can consider looking outward, we must make sure that everything on the home front is secured. [ROOT.GetCountry.GetRuler.GetName|Y] has reasons to believe that there are elements in the court that are plotting against [ROOT.GetCountry.GetRuler.GetHerHim] - this cannot be allowed."
 
 03_eptelon_generic_task_7b: "Citadels Of The Shore"
 03_eptelon_generic_task_7b_DESC: "The #Y Atheusian#! model of colonial governance is the citadel; a fortified administrative center that projects military authority while housing the administrators, scholars, and philosophical practitioners of the #Y Ascendic#! doctrine. Three such fortresses established along the #G Eptelonian#! coast, properly garrisoned and stocked, would transform this colonial experiment into something permanent."

 03_eptelon_generic_task_8b: "The Ascendic Shore"
 03_eptelon_generic_task_8b_DESC: "#G Eptelon#! must not be viewed as a contested frontier, but a future #Y Ascendic#! possession. In order to secure the #T Atheusian Legacy#! of conquering those weaker than us, we must send out the call to #Y High Elves#! abroad - we need soldiers for our armies, citizens for our cities. A bright future awaits those willing to seize it!"

 03_eptelon_generic_task_5c: "Thriving Capital"
 03_eptelon_generic_task_5c_DESC: "There is the ill-conceived belief amongst some civilized people that #G Eptelon#! is a cultural backwater, with nothing that is worwth mentioning in polite society. In order to prove these naysayers to be the fools that [ROOT.GetCountry.GetRuler.GetSheHe] knows them to be, [ROOT.GetCountry.GetRuler.GetName|Y] is calling for a vast building campaign in our capital, [ROOT.GetCountry.GetCapital.GetName|Y]."
 
 03_eptelon_generic_task_6c: "Merchants Of The Inner Sea"
 03_eptelon_generic_task_6c_DESC: "Our central location allows us to access to lucrative trade markets in #G Arteon#!, #G Horteon#! and even the #G Austropetolian Archipelago#!. We should take advantage of this and do what we can do increase our trade connections abroad, while making sure that we have a proper market in [ROOT.GetCountry.GetCapital.GetName|Y]."
 
 03_eptelon_generic_task_7c: "Prepared Levies"
 03_eptelon_generic_task_7c_DESC: "Our earliest ancestors hired mercenaries to win their wars - at least that is how the stories go. While it must have been nice to pay men to die for them in battle, this generation must learn how to defend itself. We must turn our sons into soldiers - the levies must be prepared for whatever comes their way."
 
 03_eptelon_generic_task_8c: "Sword Of Submission"
 03_eptelon_generic_task_8c_DESC: "No one could have ever foreseen that the [ROOT.GetCountry.GetAdjective|Y] people of [ROOT.GetCountry.GetName|Y] would be the ones to conquer large swathes of #G Eptelon#!, and yet here we are. Could such a thing have been possible without the leadership of the incomparable [ROOT.GetCountry.GetRuler.GetName|Y], who has carried our realm to the heights of glory?"
 
 03_eptelon_generic_task_9: "The Beleaguered Isle"
 03_eptelon_generic_task_9_DESC: "We hold portions of #G Eptelon#!, and yet there remains more to conquer. Let us finish the work we have begun and claim the entirety of the island for ourselves."
 eptelon_claims_tt: "We will receive claims on the entire island of #G Eptelon#!."
 
 03_eptelon_generic_task_10: "Rebuild The Island"
 03_eptelon_generic_task_10_DESC: "Three decades of intermittent warfare have left #G Eptelon#!'s cities cracked, their populations thinned, their wells unclean and their granaries half-empty. Realizing that we could lose everything that we have fought so hard to gain, [ROOT.GetCountry.GetRuler.GetName|Y] has vowed to rebuild the island."
 eptelon_generic_task_10_rebuild_tt: "Ten #T Cities#! across #G Eptelon#! need to have a #T Fortress#! and a #T Training Camp#!."

 03_eptelon_generic_task_11: "Fleet Of The Fractured Shore"
 03_eptelon_generic_task_11_DESC: "#G Eptelon#! is an island, surrounded by stronger islands - this simple fact determines everything about our long-term security. A land power controls roads and walls, but an island power controls the water around it, and if it does not control its own oceans and rivers, it controls nothing.\n\nForty warships - enough to make any fleet hesitating on the horizon reconsider its options - must be built, crewed, and stationed in our harbors before this island can claim to be truly sovereign."

 03_eptelon_generic_task_12: "Fortify The Capital"
 03_eptelon_generic_task_12_DESC: "The seat of [ROOT.GetCountry.GetAdjective|Y] power on #G Eptelon#! must be made unassailable - not because we fear immediate attack, but because an unfortified capital is an invitation to disaster.\n\nEvery order, every summons, every law that comes from [ROOT.GetCountry.GetRuler.GetName|Y] will carry more weight if the walls of [ROOT.GetCountry.GetRuler.GetHerHis] citadel could withstand a siege. It will be an expensive undertaking, but it will be worth it."
 03_eptelon_generic_task_12_tooltip: "Fortify the capital with walls, garrisons, and state infrastructure."
  we_need_improved_fortification_tt: "#Y We need the#! #T Economic Policy#! #G Improved Fortifications#! #Y active#!."

 03_eptelon_generic_task_13: "The Island Finds Its Footing"
 03_eptelon_generic_task_13_DESC: "For the first time in living memory, #G Eptelon#! is slowly turning into a powerhouse. Under the guidance of the legendary #T House of [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#!, Eptelon has finally found its shape. All that remains is to name it."
 
 03_eptelon_generic_task_14: "Form Eptelon"
 03_eptelon_generic_task_14_DESC: "The decision stands before us and history is about to be made. #G Eptelon#! exists now not as a contested prize or a fragile colony but as a unified whole, with all the weight of law and territory and name behind it."
 eptelon_need_to_form_tt: "We must have formed one of the three #G Eptelenic#! states: #Y $EPT$#!, #Y $ASE$#!, or #Y $HPT$#!."

 eptelon_need_citadels_tt: "Five Eptelonian provinces must have a fortress constructed."
 we_need_port_building_tt: "We need to own a territory with a #T Port#! building."
  

 item_eptelon_elder_mark: "The Elder's Mark"
 elder_mark_eptelon_treasure: "The Elder's Mark"
 elder_mark_eptelon_treasure_desc:0 "A carved war-standard recovered from the ruins of the great inland settlement at Edaur - said to have been carried by the first warchief who united the Eptelonian tribes against the Atheusian slavers. Its recovery has sent a wave of defiant pride through every clan on the island. The shamans say it still carries the first warchief's oath: that the island belongs to those who have bled for it longest."

  me_eptelon_gen.1.t:0 "Tested By The Land"
  me_eptelon_gen.1.desc:0 "The highland interior of #G Eptelon#! swallows soldiers who do not understand it whole - men vanish into the jungle canopy without a sound, their fates never confirmed by anything but silence. [ROOT.GetCountry.GetRuler.GetName|Y] had heard the old warnings from the island's veterans for years, but only after losing an entire scouting company to the green dark did [ROOT.GetCountry.GetRuler.GetHerHis] resolve harden into policy.\n\nTraining grounds were cut from the undergrowth near every garrison, and the levies were drilled not for open battlefields but for ambush, for fever, for the endless work of simply staying alive in a land that offered no mercy to the unprepared. Armories were stocked with what the climate demanded rather than tradition - lighter steel, treated leathers, and medicines against the rot that crept into wounds left untended for even a single day.\n\nWhen the drills were finished, the soldiers who marched back out of the interior carried themselves differently, hardened by months spent learning the island's rhythms rather than fighting against them. #G Eptelon#! had tested them, and for the first time in living memory, the island did not find its own defenders wanting."
  me_eptelon_gen.1.a:0 "We endure."

  me_eptelon_gen.2.t:0 "Stand Against The Slavers"
  me_eptelon_gen.2.desc:0 "For generations, the #R Great Slaver Navies#! have prowled the coastline of #G Eptelon#! as though it belonged to them, taking whoever was careless or unlucky enough to be caught near the water - fishermen, children, whole families dragged from their beds in the dead of night. No watchtower stood to warn of their approach, and no fleet waited to punish them for their audacity.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] has changed that calculation. Stone towers now rise along every headland with a clear view of the horizon, manned day and night by watchmen paid handsomely to stay awake, and our own ships have begun sailing out not to flee the slavers but to hunt them.\n\nThe first captured slaver crews were paraded through the coastal towns in chains, a grim inversion of the fate they had intended for others. Word of it has already reached the slaver captains further out to sea, and for the first time, #G Eptelon#!'s waters have begun to feel less like a hunting ground and more like a trap."
  me_eptelon_gen.2.a:0 "Let them come."

  me_eptelon_gen.3.t:0 "The Goods Of The Fractured Isle"
  me_eptelon_gen.3.desc:0 "#G Eptelon#! has never lacked for wealth - its forests yield fine timber, its hillsides bleed rare dyes, and its coastal waters teem with spices found nowhere else in the #T Central Omniluxian Sea#!. What it has always lacked is anyone with the patience to organize any of it into something resembling a proper trade network.\n\nMerchants who once passed Eptelon by without a second glance are beginning to take notice. It is a modest beginning, little more than ledgers and cart tracks, but every trade empire has started from less. #G Eptelon#!'s wealth was always real; only now is it beginning to be counted."
  me_eptelon_gen.3.a:0 "Make it count."

  me_eptelon_gen.4.t:0 "Maritime Ledgers"
  me_eptelon_gen.4.desc:0 "A trade network is only as strong as the port that anchors it, and for too long our future customers abroad have had nowhere to send their ships but a scattering of unguarded coves. [ROOT.GetCountry.GetRuler.GetName|Y] has ordered the construction of proper harbor works, with quays sturdy enough to load spices, timber, and dye in bulk rather than by the armful.\n\nThe first ledgers have already been opened, recording every crate that leaves our shores and every coin that returns for it. Clerks trained in the counting-houses of foreign cities have been brought in to keep the books honest, for a port that cannot be trusted with its own accounts will never be trusted by outside merchants.\n\nWith the harbor rising and the ledgers balanced, our trade ships finally have somewhere to return to - and somewhere for the wider world to come looking for #G Eptelon#!'s wealth."
  me_eptelon_gen.4.a:0 "Set the ledgers straight."

  me_eptelon_gen.5.t:0 "Securing Our Borders"
  me_eptelon_gen.5.desc:0 "For the first time since [ROOT.GetCountry.GetRuler.GetName|Y] set foot upon these shores, the borders of our holdings on #G Eptelon#! form something more than a foothold clinging to survival. Every province seized has become a staging ground for the next, and the old fear of being driven back into the sea has begun to fade into memory.\n\nYet we cannot rest, but we must take advantage of the momentum we have earned. [ROOT.GetCountry.GetRuler.GetFirstName]'s' soldiers have not been permitted to put their swords away, for [ROOT.GetCountry.GetRuler.GetSheHe] believes that hesitation now would squander everything already paid for in blood.\n\nWhat began as a desperate scramble for contested lands has become something far more ambitious - a campaign to claim the island outright."
  me_eptelon_gen.5.a:0 "Charge into the enemy lines and shatter them!"

  me_eptelon_gen.10.t:0 "The [ROOT.GetCountry.GetRulerTitle]'s Covenant"
  me_eptelon_gen.10.desc:0 "For generations, the #Y Eptelonian#! tribes fought one another with the same ferocity they once reserved for foreign invaders, a weakness that every colonist and conqueror who ever set foot on this island learned to exploit without mercy. [ROOT.GetCountry.GetRuler.GetName|Y] swore before the assembled chieftains that this era of self-inflicted ruin would end within [ROOT.GetCountry.GetRuler.GetHerHis] lifetime.\n\nOne by one, the old rivals have been brought to heel - some through marriage alliances, others through tribute, and a stubborn few through the simple application of superior force. Each submission has been marked with the same solemn ritual, chieftains laying their spears at the feet of a single ruler for the first time in living memory.\n\nWhat unity could not achieve through kinship, [ROOT.GetCountry.GetRuler.GetHerHis] covenant has achieved through will alone. The clans that once bled each other dry now march beneath a single banner, and the colonists who counted on their division will soon learn what that unity costs them."
  me_eptelon_gen.10.a:0 "One people."

  me_eptelon_gen.11.t:0 "Drive Back The Invaders"
  me_eptelon_gen.11.desc:0 "Near #Y Lake Sevan#!, the priests of [GetDeityDefinition('omen_tybin').GetName|G] have kept their shrine to the #Y Taker of Cities#! for longer than any written record can confirm, and when they sent word demanding a pilgrimage, [ROOT.GetCountry.GetRuler.GetName|Y] did not hesitate to answer the call. The [ROOT.GetCountry.GetRulerTitle] arrived at the lakeside shrine at the head of a column of warriors, not merely pilgrims.\n\nWhat began as a rite of devotion became something closer to a declaration of war. The northern invaders who had crept into the highlands under the cover of the region's dense fog found themselves confronted not by scattered tribesmen but by an army marching under the blessing of a god who delights in sacking cities.\n\nVillage by village, the invaders have been driven back toward the coasts they came from, the highlands reclaiming what the fog and the jungle had never truly let go of. [GetDeityDefinition('omen_tybin').GetName|G] has been given [ROOT.GetCountry.GetRuler.GetHerHis] pilgrimage, and in return, the north remembers who it belongs to."
  me_eptelon_gen.11.a:0 "Take the north."

  me_eptelon_gen.12.t:0 "The Elder's Mark"
  me_eptelon_gen.12.desc:0 "Three generations of scholars and wandering shamans chased fragments of a story that most had long since dismissed as fireside myth - that the #T Elder's Mark#!, the carved war-standard of the chieftain who first united the #Y Eptelonian#! tribes against the #Y Atheusian#! slavers, still existed somewhere beneath the ash and rubble of the burned settlement at [GetProvince('(int32)748').GetName|Y]. [ROOT.GetCountry.GetRuler.GetName|Y] funded the final expedition personally, unwilling to let the trail go cold after coming so close.\n\nThe standard was found exactly where the oldest fragments of oral history said it would be, wrapped in oiled cloth and buried beneath the collapsed foundations of the settlement's great hall. Its wood had rotted at the edges, but the carvings of the first warchief's oath remained legible to anyone who knew the old symbols.\n\nWhen the Mark was carried into [ROOT.GetCountry.GetCapital.GetName|Y] for the first time in living memory, clan elders wept openly in the streets. The oath it carries - that the island belongs to those who have bled for it longest - has never felt more urgent, nor more likely to be honored."
  me_eptelon_gen.12.a:0 "Let it be seen."

  me_eptelon_gen.13.t:0 "Construct The Eptelen"
  me_eptelon_gen.13.desc:0 "For centuries, the gods of #G Eptelon#! withdrew from the affairs of mortals, content to let the tribes squabble and the colonists carve up the coastline without divine interference. But the stirrings of unification across the island have roused them from that long slumber, and [ROOT.GetCountry.GetRuler.GetName|Y] claims to have been visited in a dream by their combined will.\n\nIn that dream, [ROOT.GetCountry.GetRuler.GetSheHe] says, the gods demanded a temple worthy of their renewed attention - the #T Eptelen#!, a structure that would serve as both sanctuary and seat of judgment for the clan elders who once ruled through custom rather than law. Construction has already begun on the foundations, using stone quarried from the same highlands that once swallowed careless armies whole.\n\nWhether the vision came from the gods or from [ROOT.GetCountry.GetRuler.GetHerHis] own ambition matters little to the elders now gathering to see it built. What conquest shattered, the Eptelen may yet bind back together under a single roof and a single law."
  me_eptelon_gen.13.a:0 "May the gods reward me for fulfilling my duty towards them!"

  me_eptelon_gen.20.t:0 "The Ascendic Colony"
  me_eptelon_gen.20.desc:0 "The #Y Ascendic#! philosophy has always insisted that mastery of self must precede mastery of others, and [ROOT.GetCountry.GetRuler.GetName|Y] has taken that teaching to heart before turning [ROOT.GetCountry.GetRuler.GetHerHis] full attention outward across #G Eptelon#!. With the #Y Black Pearl of Atheus#! now secured within our possession, the colony's own house has finally been set in order.\n\nAdministrators trained in the doctrine have replaced the improvised governance of the colony's earliest years, and disputes that once required appeals back to the #T Atheusian Legacy#! are now settled locally, swiftly, and according to Ascendic principle. The colonists who once doubted whether this venture would outlast a single generation have begun to speak of permanence instead.\n\nWhat started as a fragile foothold has become something closer to a proper extension of #T Atheusian#! civilization, disciplined and self-sufficient. The work here is, as [ROOT.GetCountry.GetRuler.GetName|Y] promised, all but finished."
  me_eptelon_gen.20.a:0 "Refine the colony."

  me_eptelon_gen.21.t:0 "Purge The Court"
  me_eptelon_gen.21.desc:0 "[ROOT.GetCountry.GetRuler.GetName|Y] had grown convinced that plotters within [ROOT.GetCountry.GetRuler.GetHerHis] own court were conspiring against [ROOT.GetCountry.GetRuler.GetHerHim], a suspicion that proved well-founded once the first confession was extracted. Before anything could be built abroad, the home front needed to be secured beyond any doubt.\n\nThe purge that followed was quiet and methodical rather than bloody, favoring exile and quiet disgrace over public execution - a restraint that [ROOT.GetCountry.GetRuler.GetHerHis] advisors credit with keeping the wider colony calm throughout the affair. Those who remained in positions of trust understood precisely why their rivals no longer did.\n\nWith the court's loyalties no longer in question, [ROOT.GetCountry.GetRuler.GetName|Y] has turned that same discipline toward the divided tribes beyond the colony's borders, exploiting the old rivalries between them rather than trying to erase them. A weakness that once threatened us from within has become a tool we now wield against everyone else."
  me_eptelon_gen.21.a:0 "Fan the divide."

  me_eptelon_gen.22.t:0 "Citadels Of The Shore"
  me_eptelon_gen.22.desc:0 "The #Y Atheusian#! model of colonial governance has always centered on the citadel - a fortress that doubles as an administrative seat, housing soldiers, scholars, and the philosophical practitioners of the #Y Ascendic#! doctrine under one set of walls. [ROOT.GetCountry.GetRuler.GetName|Y] has now seen three such citadels raised along the #G Eptelonian#! coast, each garrisoned and provisioned to outlast any siege the natives or rival colonists might attempt.\n\nWhere once our presence here amounted to little more than trading posts and temporary camps, these fortresses now anchor a permanent chain of authority stretching across the shoreline. Merchants and administrators alike have begun referring to the coast not as contested ground, but as settled territory.\n\nWhat was an experiment in colonization has hardened, quite literally, into stone. #G Eptelon#!'s coastline now belongs to something built to last."
  me_eptelon_gen.22.a:0 "Raise the citadels."

  me_eptelon_gen.23.t:0 "The Ascendic Shore"
  me_eptelon_gen.23.desc:0 "#G Eptelon#! was never meant to remain a contested frontier in [ROOT.GetCountry.GetRuler.GetName|Y]'s eyes - it was always intended as a future #Y Ascendic#! possession, one more territory brought fully under the #T Atheusian Legacy#!'s reach. The call has gone out across the sea to #Y High Elves#! willing to make the crossing, promising soldiers for the armies and citizens for the growing cities.\n\nShips arrive now with increasing regularity, carrying settlers eager to claim a stake in a colony that has finally proven it can defend itself. The doctrine that mastery of self must precede mastery of others has been demonstrated in full, and the island's coast reflects it in the discipline of its garrisons and the order of its new townships.\n\nThose who once doubted whether #G Eptelon#! could ever be anything more than a contested prize now watch it become an example of #Y Ascendic#! permanence instead. The shore, and the future it promises, belongs to those willing to seize it."
  me_eptelon_gen.23.a:0 "The shore is ours."

  me_eptelon_gen.30.t:0 "Thriving Capital"
  me_eptelon_gen.30.desc:0 "There has long been a lazy belief among the civilized peoples of #T Luxterra#! that #G Eptelon#! is nothing but a cultural backwater, unworthy of mention in polite conversation. [ROOT.GetCountry.GetRuler.GetName|Y] has taken personal offense at the notion and ordered a building campaign in [ROOT.GetCountry.GetCapital.GetName|Y] grand enough to silence the naysayers for good.\n\nMasons and craftsmen have been drawn from every corner of our territory, raising public halls, marketplaces, and monuments where mud paths and timber shacks once stood. Visitors who arrive expecting a frontier outpost instead find broad avenues and buildings that would not look out of place in the oldest cities of the mainland.\n\nThe capital's transformation has become a point of fierce pride among its people, proof that [ROOT.GetCountry.GetRuler.GetSheHe] was right to insist that Eptelon deserved better than the reputation forced upon it. Those who once called it a backwater are finding fewer and fewer reasons to repeat the insult."
  me_eptelon_gen.30.a:0 "We shall make the grandest capital city in all of Eptelon"

  me_eptelon_gen.31.t:0 "Merchants Of The Inner Sea"
  me_eptelon_gen.31.desc:0 "Our central position between #G Arteon#!, #G Horteon#!, and the #G Austropetolian Archipelago#! has always been an advantage waiting to be exploited, yet for years our merchants watched foreign ships pass by our harbors bound for richer ports. [ROOT.GetCountry.GetRuler.GetName|Y] resolved to end that waste, ordering new trade agreements and a proper marketplace built within [ROOT.GetCountry.GetCapital.GetName|Y] itself.\n\nAgents were dispatched to each of the neighboring markets, securing the kind of standing contracts that had previously gone only to established mainland powers. The capital's new market square now fills daily with goods bound for destinations that would once have never given #G Eptelon#! a second thought.\n\nWhat was once a geographic accident has become a deliberate strategy, and the inner sea's trade now flows through our harbors as readily as it flows anywhere else. The isolation that once defined this island has finally begun to give way to connection."
  me_eptelon_gen.31.a:0 "Open the sea lanes and let the gold coins flow"

  me_eptelon_gen.32.t:0 "Prepared Levies"
  me_eptelon_gen.32.desc:0 "Our earliest ancestors are remembered, not always kindly, for hiring mercenaries to fight and die in their place - a convenient arrangement for those who could afford it, but one that left an entire generation unprepared to defend itself when the coin ran out. [ROOT.GetCountry.GetRuler.GetName|Y] has refused to repeat that mistake.\n\nLevies have been called up from every district under our control, drilled not by hired swords but by our own veteran officers, men who have a personal stake in whether these soldiers succeed or fail. The training has been harsh, and more than a few farmers-turned-soldiers have grumbled about it, but the ranks have grown steadily more disciplined with each passing season.\n\nFor the first time in generations, the sons of #G Eptelon#! stand ready to defend what is theirs without waiting for someone else's blade to do it for them. Whatever comes next, it will be met by soldiers who fight for their own homes rather than someone else's coin."
  me_eptelon_gen.32.a:0 "Raise them up for the glorious battles ahead of us!"

  me_eptelon_gen.33.t: "Sword Of Submission"
  me_eptelon_gen.33.desc: "No one on #G Eptelon#!, least of all the older colonial powers who once dismissed us outright, could have foreseen that the [ROOT.GetCountry.GetAdjective|Y] people of [ROOT.GetCountry.GetName|Y] would be the ones to conquer such wide swathes of the island. And yet here we stand, with armies that answer to us alone and a capital that grows more magnificent with each passing season.\n\nThe swords that once served merely to defend a scattering of villages have carried [ROOT.GetCountry.GetRuler.GetName|Y] to something far greater - submission secured not through borrowed strength, but through our own leadership and our own sacrifice. Rival claimants who once treated us as an afterthought now send envoys instead of raiders.\n\nWhat began as a modest cluster of settlements has outgrown every name once given to it. Under the incomparable [ROOT.GetCountry.GetRuler.GetName|Y], #G Eptelon#! no longer waits to be conquered - it conquers."
  me_eptelon_gen.33.a: "Submit before me, or I'll take your head clean off your shoulders!"

  me_eptelon_gen.40.t:0 "The Beleaguered Isle"
  me_eptelon_gen.40.desc:0 "The colonizers, the raiders, and the tribes that once fought each other to a standstill across #G Eptelon#! have all, in their own way, been answered - the #R Beleaguered Isle#! finally holds one power will to go to war for the whole of it. Cities lie ruined from decades of intermittent war, the old resentments between settlers and natives simmer beneath uneasy peace treaties, and the surrounding waters remain as contested as ever they were - the perfect storm is here, and we will take advantage of it.\n\n#G Eptelon#! has been claimed. What it becomes now - a unified nation, a lasting peace, or merely a larger version of the chaos that came before - is a question [ROOT.GetCountry.GetRuler.GetName|Y] alone must answer."
  me_eptelon_gen.40.a:0 "I pray the gods are with me"

  me_eptelon_gen.41.t:0 "The Settlers' Compact"
  me_eptelon_gen.41.desc:0 "Decades of conquest have left #G Eptelon#! scattered with peoples who no longer have a place to call their own - tribes pushed from ancestral ground, colonists cut off from their original charters, refugees from cities that no longer exist in any form their grandparents would recognize. [ROOT.GetCountry.GetRuler.GetName|Y] has decided that a lasting peace cannot be built by pretending these people do not exist.\n\nA formal compact has been offered instead: land grants in exchange for loyalty, recognition of old customs in exchange for acceptance of new law, and a promise that the mistakes of the last thirty years will not be repeated against those willing to settle rather than fight. Not every displaced clan has accepted the terms, but enough have that entire regions have quieted for the first time in living memory.\n\nIt is not reconciliation in any complete sense, and [ROOT.GetCountry.GetRuler.GetHerHis] advisors remain divided over whether it will hold. But for a people who have known nothing but displacement, a workable peace is worth more than the alternative ever offered them."
  me_eptelon_gen.41.a:0 "Offer terms."

  me_eptelon_gen.42.t:0 "The Price Of Victory"
  me_eptelon_gen.42.desc:0 "Not every enemy on #G Eptelon#! has been offered the mercy of a compact, and [ROOT.GetCountry.GetRuler.GetName|Y] has made certain that those who fought hardest against unification understand precisely what their defiance has cost them. Estates have been seized, garrisons dismantled, and the leaders of the fiercest resistance made public examples in the squares of the towns they once ruled.\n\nSome among [ROOT.GetCountry.GetRuler.GetHerHis] court have quietly questioned the severity of it, worried that harsh punishment now will only sow the seeds of the next rebellion. [ROOT.GetCountry.GetRuler.GetFirstName] has answered that a victory without consequence is not truly a victory at all, merely a pause before the next war.\n\nWord of what befell the defeated has already spread across the island faster than any herald could carry it. Whatever comes next for #G Eptelon#!, no one who remains standing is likely to forget what resistance costs."
  me_eptelon_gen.42.a:0 "Make an example."

  me_eptelon_gen.43.t:0 "Rebuild The Island"
  me_eptelon_gen.43.desc:0 "Three decades of intermittent warfare have left #G Eptelon#!'s cities cracked and half-abandoned, their populations thinned by conscription and plague, their wells fouled and their granaries scraped bare by armies that cared little what they left behind. [ROOT.GetCountry.GetRuler.GetName|Y] looked upon the ruin of what had been won and realized that a conquered island is worth little if its people cannot be fed or housed.\n\nMasons, well-diggers, and granary-keepers have been dispatched to every district under our control, working alongside soldiers who traded their spears for shovels once the fighting quieted. Coin that might once have funded another campaign has instead gone toward roofs, walls, and irrigation ditches.\n\nSlowly, the cracks are closing. Markets that stood empty for years have begun to fill again, and children born after the worst of the fighting are growing up in towns that no longer look like battlefields. #G Eptelon#! is being rebuilt, one granary and one well at a time."
  me_eptelon_gen.43.a:0 "I am a destroyer and builder of cities!"

  me_eptelon_gen.44.t:0 "Fleet Of The Fractured Shore"
  me_eptelon_gen.44.desc:0 "#G Eptelon#! is an island surrounded by stronger islands, a fact that [ROOT.GetCountry.GetRuler.GetName|Y] has never allowed [ROOT.GetCountry.GetRuler.GetHerHim]self to forget. A land power can hold its roads and its walls, but an island power that does not command its own waters controls nothing at all, no matter how many fortresses line its coast.\n\nForty warships have now been built, crewed, and stationed across our harbors - enough, [ROOT.GetCountry.GetRuler.GetHerHis] admirals insist, to make any hostile fleet reconsider before drifting too close to our shores. Shipwrights who once worked on modest fishing vessels have spent years learning the craft of proper warships, and the results now ride at anchor in every major port.\n\nThe #R Great Slaver Navies#! and rival colonial fleets alike have taken notice of the change. #G Eptelon#! no longer waits nervously for whatever sails might appear on the horizon - it watches those waters as their master."
  me_eptelon_gen.44.a:0 "Launch the fleet."

  me_eptelon_gen.45.t:0 "Fortify The Capital"
  me_eptelon_gen.45.desc:0 "[ROOT.GetCountry.GetRuler.GetName|Y] never feared an immediate assault on [ROOT.GetCountry.GetCapital.GetName|Y], but [ROOT.GetCountry.GetRuler.GetSheHe] understood something more important - that an unfortified capital is an open invitation to every ambitious rival who might otherwise think twice. New walls have risen around the city, thick enough to withstand a proper siege rather than merely deter a raiding party.\n\nGarrisons have been expanded and drilled to a standard rarely seen anywhere else on #G Eptelon#!, and the state infrastructure needed to support a prolonged defense - granaries, cisterns, armories - has been quietly built into the fortifications themselves. Every order that now issues from [ROOT.GetCountry.GetRuler.GetHerHis] citadel carries the unspoken weight of walls that cannot easily be breached.\n\nIt was an expensive undertaking, one that drained coffers that could have been spent elsewhere. But [ROOT.GetCountry.GetRuler.GetName|Y] considers it money well spent - no enemy will now imagine taking [ROOT.GetCountry.GetCapital.GetName|Y] casually, if at all."
  me_eptelon_gen.45.a:0 "Strengthen the walls"

  me_eptelon_gen.46.t:0 "The Island Finds Its Footing"
  me_eptelon_gen.46.desc:0 "For the first time within living memory, #G Eptelon#! is turning into something more than a battlefield contested by outsiders - it is becoming a power in its own right, one capable of feeding its people, defending its shores, and commanding respect rather than merely surviving each new incursion. Under the guidance of the #T House of [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#!, the island has finally found a shape it can hold onto.\n\nMerchants from Arteon and the Archipelago now speak of #G Eptelon#! as a destination worth the voyage rather than a hazard to be sailed around, and the old jokes about the 'Beleaguered Isle' have begun to sound less like fact and more like an outdated insult. Rebuilt cities, a standing fleet, and fortified walls have together produced something that no single victory could have achieved alone.\n\nAll that remains, as the elders and the ruler alike have come to agree, is to give this new power its proper name. #G Eptelon#! has found its footing; now it must decide what to call itself."
  me_eptelon_gen.46.a:0 "We continue to set Eptelon's course"

  me_eptelon_gen.47.t:0 "Form Eptelon"
  me_eptelon_gen.47.desc:0 "The decision has stood before [ROOT.GetCountry.GetRuler.GetName|Y] for longer than [ROOT.GetCountry.GetRuler.GetSheHe] would care to admit, and now, at last, it has been made. #G Eptelon#! exists no longer as a contested prize passed between colonizers and tribes, nor as a fragile experiment likely to collapse the moment its patron's attention wandered elsewhere.\n\nIn a ceremony held within the walls of the newly fortified capital, elders, generals, and administrators alike gave their formal assent to a single unified state, bound by law, by territory, and by a name that will now appear on maps drawn far beyond these shores. The #R Beleaguered Isle#! that suffered centuries of neglect and war has become something its ancestors could scarcely have imagined.\n\nWhat comes next for this new nation remains to be written, but the uncertainty that once defined #G Eptelon#! has been replaced by something sturdier - a state with the weight of law, territory, and history finally standing behind it."
  me_eptelon_gen.47.a:0 "[ROOT.GetCountry.GetName] has prospered under my rule!"

  me_eptelon_gen.50.t:0 "The [ROOT.GetCountry.GetRulerTitle]'s Covenant"
  me_eptelon_gen.50.desc:0 "The clans of #G Eptelon#! have squandered generations bleeding one another dry, a weakness every foreign invader and colonist has learned to exploit without mercy. [ROOT.GetCountry.GetRuler.GetName|Y] has resolved to end that era of self-inflicted ruin, using [ROOT.GetCountry.GetRuler.GetHerHis] political influence to bind the fractious chieftains beneath a single covenant.\n\nEmissaries have been dispatched to every corner of the island, carrying terms of tribute and alliance to rivals who once answered only to their own spears. Some have already sworn themselves over; others still weigh the cost of resistance against the promise of unity.\n\nWhat centuries of division could not undo, [ROOT.GetCountry.GetRuler.GetHerHis] covenant may yet accomplish - one people, bound by oath rather than conquest."
  me_eptelon_gen.50.a:0 "One people, connected through unbreakable bonds"

