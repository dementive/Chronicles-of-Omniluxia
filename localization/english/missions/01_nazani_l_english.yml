l_english:

# Mission, task, tooltip, and modifier text for the Nazani mission tree. Event text lives in me_nazani_l_english.yml.

# ==============================================================================
# MISSION HEADER
# ==============================================================================

03_nazani: "The Reforged Diadem"
03_nazani_DESCRIPTION: "The #Y Nazani Empire#! was born from the western half of the old #Y Zani#! world, but its survival has depended on more than inherited glory. The people of #Y Bharamuntacho Zani#! are neither the old eastern #Y Zani#! nor simple conquerors among strangers; they are Weagelian, imperial, and reborn.\n\nIf the #T Empire of the West#! is to survive its enemies and outgrow the shadow of #Y Durobaeraste#!, the #P Purple Emperor#! must strengthen the capital, choose a second city worthy of balancing the imperial court, and decide whether the future of the #Y Nazani#! lies in disciplined expansion or a perfected imperial heartland."
03_nazani_CRITERIA_DESCRIPTION: "This mission will be completed when the #Y Nazani#! have strengthened #Y Bharamuntacho Zani#!, raised a second city beside it, chosen the future direction of the #T Empire of the West#!, and restored imperial or subject rule throughout #Y Wegalia#!, the #Y Borderlands#!, and the #Y Old Frontlines#!."
03_nazani_BUTTON_TOOLTIP: "The Nazani must strengthen their homeland before they can claim to be the true inheritors of the western Zani world."

# ==============================================================================
# TASKS
# ==============================================================================

03_nazani_task_1: "The Winter Capital"
03_nazani_task_1_DESC: "#Y Bharamuntacho Zani#! was once the western capital of the old #T Zani Empire#!, the city where emperors spent the gentler months far from the eastern court. For the #Y Nazani#!, it must become more than a seasonal palace; it must be the permanent heart of a reborn imperial order."

03_nazani_task_2: "Temple Of The Unconquered Zani"
03_nazani_task_2_DESC: "The old imperial gods still watch the streets of [GetProvince('(int32)2720').GetName|Y], and the #T Temple of the Unconquered Zani#! remains one of the clearest proofs that the western court is no provincial accident. By renewing the sacred district around the temple, [ROOT.GetCountry.GetRuler.GetName|Y] can bind dynasty, city, and faith together."

03_nazani_task_3: "The Purple Workshops"
03_nazani_task_3_DESC: "#Y Cloth#! from [GetProvince('(int32)2720').GetName|Y] already clothes officials, priests, and merchants across the capital. With proper mills, dyes, and guild oversight, those workshops can become the foundation of a courtly economy worthy of a #T Purple Emperor.#!"

03_nazani_task_4: "The Imperial Chancery"
03_nazani_task_4_DESC: "A great empire is not held together by soldiers alone. It survives through ledgers, seals, courts, educated clerks, and the terrifying certainty that every governor's report eventually reaches the palace. The #Y Nazani#! court must build a chancery capable of ruling more than a ceremonial capital."

03_nazani_task_5: "Granaries Of Wegalia"
03_nazani_task_5_DESC: "The capital cannot grow on purple cloth and imperial pride alone. The fields, fisheries, and cattle lands around [GetProvince('(int32)2720').GetName|Y] must be organized into a proper food network, feeding the city even when war or intrigue strains the countryside."

03_nazani_task_6_pdeso: "Pdeso, Shield Of The Southern Sea"
03_nazani_task_6_pdeso_DESC: "[GetProvince('(int32)3382').GetName|Y] is already a city of stone walls, sea traffic, and southern soldiers. If the #P Purple Emperor#! raises #G Pdeso#! as the second city of the realm, the #Y Nazani#! homeland will lean toward ports, fortresses, and the disciplined projection of power."

03_nazani_task_6_esenzeu: "Esenzeu, Northern Counterweight"
03_nazani_task_6_esenzeu_DESC: "[GetProvince('(int32)2347').GetName|Y] already guards the northern forests as a fortified city of glassmakers, soldiers, and Great Wolf rites. If the #P Purple Emperor#! raises #G Esenzeu#! as the second city of the realm, the #Y Nazani#! homeland will gain a stern northern counterweight to the court at #G Bharamuntacho Zani#!."

03_nazani_task_7: "The Road Between Crowns"
03_nazani_task_7_DESC: "Protected roads must bind the imperial capital, its chosen counterpart, and the old towns of #Y Wegalia#!. The granaries have funded cheaper road construction; now the original heartland must be joined by dependable routes for grain, officials, and soldiers."
nazani_roads_50_percent_tt: "At least #Y 50%#! of owned territories in the #Y original Nazani heartland#! must have roads. ([SCOPE.ScriptValue('nazani_morrigon_roads_svalue')|0Y]/[SCOPE.ScriptValue('nazani_morrigon_roads_required_svalue')|0Y])"

03_nazani_task_8: "Guilds Of The Second City"
03_nazani_task_8_DESC: "A second city must do more than mirror the capital. In [GetProvince('(int32)3382').GetName|Y], imperial guilds can turn stone, walls, and harbor dues into southern strength; in [GetProvince('(int32)2347').GetName|Y], they can bind glassmakers, garrisons, and northern markets to the imperial court."

03_nazani_task_9: "Eyes Of The Emperor"
03_nazani_task_9_DESC: "The #Y Nazani#! practice of imperial blinding is reviled by many enemies and feared by every ambitious courtier. Whether [ROOT.GetCountry.GetRuler.GetName|Y] rules through restraint or through the memory of darkened eyes, the palace must make clear that treason has consequences and justice has a procedure."

03_nazani_task_10: "The Two Cities Of The West"
03_nazani_task_10_DESC: "At last, [GetProvince('(int32)2720').GetName|Y] and the chosen second city stand as twin pillars of the #Y Nazani#! homeland. One is the sacred capital of the reborn #T Zani#!; the other is the counterweight that turns imperial ambition into revenue, movement, and authority beyond the palace."

03_nazani_task_11_wide: "Theon Armies Of Wegalia"
03_nazani_task_11_wide_DESC: "The old provinces of #Y Wegalia#! must provision the emperor's armies beyond the frontier. Reliable musters, loyal officers, and well-stocked roads will carry imperial authority through the marshes and borderlands."

03_nazani_task_11_tall: "A Palace Between Two Seas"
03_nazani_task_11_tall_DESC: "Let the wealth of two seas flow into the imperial cities. Palaces, academies, and thriving markets will make the western court a seat of learning and splendor worthy of its inheritance."

03_nazani_task_12: "The Reborn Empire"
03_nazani_task_12_DESC: "The #Y Nazani#! have strengthened the capital, raised a second city beside it, and chosen the shape of their future. Throughout #Y Wegalia#!, the #G Borderlands#!, and the #G Old Frontlines#!, imperial governors and subject lords once more answer to the #P Purple Emperor#!. The western empire is no longer viewed as the weaker sibling of #Y Durobaeraste#!, but stands proudly on its own two feet. It is its own power, its own court, with its own legacy and its own promise of #T Zani#! rebirth - all hail the [ROOT.GetCountry.GetName|Y]!"

03_nazani_task_13: "Secret Accord With The Orcs"
03_nazani_task_13_DESC: "Beyond the #Y Nazani#! homeland, the old #G Borderlands#! beckon. The lords of [GetProvince('(int32)2187').GetArea.GetRegion.GetName|Y] remain unaware of our saboteurs operating in their midst, and by all accounts, they are not ready for what is to come.\n\nThrough shadow and secrecy, we have kept contacts with #G Orcish mercenaries#! in the region - warriors that help protect the colonies that we have funded over the years. Gold and promises will purchase their loyalty, and together, we shall reshape the western lands into an empire worthy of the #Y Zani#! name.\n\n#R Accepting Grommash's aid in the events that follow can lead directly to war in the Borderlands.#!"

03_nazani_task_14: "The Marshlands Beckon"
03_nazani_task_14_DESC: "Beyond the #G Borderlands#! lie the ancestral #Y Marshlands#!, where imperial purple once flew above the black waters. By laying claim to the wetlands, we remind their scattered lords that the #T Zani#! inheritance has not been forgotten.\n\nOnce half the #G Borderlands#! answer to us or our subjects and the realm is at peace, the court can finish its preparations. The moment to carry our banners into the marshes will be ours to choose."
marshlands_claims_tt: "We will receive claims on all of the provinces within the #G Marshlands#!."

03_nazani_task_15: "The Claim To Kainaxarthos"
03_nazani_task_15_DESC: "The dragon-lands of #Y Kainaxarthos#! remain the great prize of our lost western inheritance. Let the court proclaim our claim before the world, and let the #Y Soventeir#! hear that the #P Purple Emperor#! remembers what was taken.\n\nWith half the #G Marshlands#! under imperial or subject rule and the realm at peace, our preparations can be brought to completion. The remaining wetlands need not all fall before we turn our gaze toward the #Y Dragon#!'s Throne, but the hour of reckoning will be ours to choose."
nazani_dragonland_claims_tt: "We will receive claims on all of the provinces within #Y Kainaxarthos#! and #Y The Dragonlands#!."

03_nazani_task_16: "The Dragon Slayer"
03_nazani_task_16_DESC: "The [GetCountry('SOV').GetName|R] has been reduced to dust at the hands of the victorious [ROOT.GetCountry.GetRuler.GetName|Y], who has reclaimed our ancestral territories and restored the #T House of [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#! to the prestige and respect it lost over centuries of decline. The common people have taken to calling the [ROOT.GetCountry.GetRulerTitle] #G 'Dragon Slayer'#! - a title that [ROOT.GetCountry.GetRuler.GetSheHe] doesn't mind one bit."

# ==============================================================================
# TOOLTIPS
# ==============================================================================

nazani_cloth_surplus_tt: "The capital province must either have a #Y Cloth#! surplus or import #Y Dye#!."
nazani_second_city_chosen_tt: "Complete either #Y Pdeso, Shield of the Southern Sea#! or #Y Esenzeu, Northern Counterweight#!."
nazani_pdeso_stone_tt: "The chosen second city must either have a #Y Stone#! surplus or import #Y Marble#!."
nazani_eyes_of_emperor_tt: "Have used #Y Imperial Blinding#! within the last #Y 10#! years."
nazani_path_chosen_tt: "Complete either #Y Theon Armies of Wegalia#! or #Y A Palace Between Two Seas#!."
nazani_theme_armies_tt: "Have a #T Legion#! in the capital region with at least #Y 12#! cohorts."
nazani_task_13_orcish_base_owned_tt: "We already control the Orcish stronghold at [GetProvince('(int32)2187').GetName|Y]. The task is bypassed."
perform_divine_sacrifice_please_stab_the_pig: "#Y We need to use the#! #T Perform Divine Sacrifice#! #Y Religious Interaction#! #Y (Stab the Pig)#!."
nazani_claims_choose_war_tt: "Our #Y claims#! remain in force. The #P Purple Emperor#! may declare war through diplomacy when ready; completing this task does not declare war."
nazani_marshland_foothold_tt: "We or our subjects must own at least #Y 50%#! of the #Y Marshlands#!."

# ==============================================================================
# MODIFIERS
# ==============================================================================

nazani_winter_capital_mod: "Winter Capital Restored"
desc_nazani_winter_capital_mod: "#G Bharamuntacho Zani#! has been renewed as the permanent heart of the western imperial court."

nazani_unconquered_temple_mod: "Temple of the Unconquered Zani"
desc_nazani_unconquered_temple_mod: "The sacred precincts of #G Bharamuntacho Zani#! bind the emperor, the dynasty, and the imperial faith together."

nazani_purple_workshops_mod: "Purple Workshops"
desc_nazani_purple_workshops_mod: "Imperial officials regulate the capital's cloth and dye workshops, turning ceremonial prestige into lasting revenue."

nazani_imperial_chancery_mod: "Imperial Chancery"
desc_nazani_imperial_chancery_mod: "A disciplined bureaucracy now carries orders, audits governors, and records the will of the #T Purple Emperor.#!"

nazani_granary_territory_mod: "Granaries of Wegalia"
desc_nazani_granary_territory_mod: "This territory has been reorganized to feed the growing cities of the #Y Nazani#! homeland."

nazani_second_city_mod: "Designated Second City"
desc_nazani_second_city_mod: "This city has been raised as the chosen counterweight to #G Bharamuntacho Zani#!."

nazani_road_between_crowns_mod: "Road Between Crowns"
desc_nazani_road_between_crowns_mod: "Protected imperial routes now bind the capital, the chosen second city, and the supporting towns of the heartland."

nazani_second_city_guilds_mod: "Second City Guilds"
desc_nazani_second_city_guilds_mod: "Imperial guilds have been granted privileges to turn the second city into a durable source of revenue and authority."

nazani_purple_justice_mod: "Purple Justice"
desc_nazani_purple_justice_mod: "The court has codified its procedures for treason, punishment, and imperial mercy."

nazani_two_cities_mod: "Two Cities of the West"
desc_nazani_two_cities_mod: "This city is one of the twin pillars of the renewed #Y Nazani#! homeland."

nazani_theme_armies_mod: "Theon Armies of Wegalia"
desc_nazani_theme_armies_mod: "The core provinces of #Y Wegalia#! now support disciplined armies prepared for expansion beyond the homeland."

nazani_tall_path_mod: "Palace Between Two Seas"
desc_nazani_tall_path_mod: "The #Y Nazani#! court has chosen to perfect the imperial heartland through palaces, academies, and commerce."

nazani_palace_between_seas_mod: "Palace Between Two Seas"
desc_nazani_palace_between_seas_mod: "This city's palace district stands as proof that the #Y Nazani Empire#! can concentrate glory as easily as it can project power."

nazani_reborn_west_mod: "Reborn Empire of the West"
desc_nazani_reborn_west_mod: "The #Y Nazani Empire#! has renewed its homeland and asserted an imperial identity independent of its eastern sibling."

nazani_kainaxarthos_reclaimed_mod: "Warriors of Kainaxarthos"
desc_nazani_kainaxarthos_reclaimed_mod: "The promise of reclaiming #G Kainaxarthos#! has stirred our soldiers. They stand ready to carry the imperial purple back into the dragon-lands."

nazani_granary_capital_mod: "Grand Granary"
desc_nazani_granary_capital_mod: "A colossal granary has been built within our capital to store our annual surplus."

nazani_secret_correspondence_mod: "Secret Correspondence with Orcish Mercenaries"
desc_nazani_secret_correspondence_mod: "The #Y Nazani#! court conducts hidden communications with Grommash and his orcish war chiefs, carefully orchestrating an alliance."

nazani_marshland_conquest_mod: "Marshland Campaign Preparations"
desc_nazani_marshland_conquest_mod: "Loyal governors, full granaries, and reliable musters in the #G Borderlands#! stand ready to sustain the reconquest of the ancestral #G Marshlands#!."

nazani_borderland_spies_mod: "Borderland Spies and Saboteurs"
desc_nazani_borderland_spies_mod: "For many years, the Imperial treasury of the #Y Nazani Empire#! has funded clandestine operations that have destabilized their former province of the #G Borderlands#!. Our informants keep our spymasters apprised of the latest happenings throughout the #G Borderlands#! and the #G Old Frontlines#! - an expensive but necessary undertaking."

nazani_road_preparations_mod: "Imperial Road Preparations"
desc_nazani_road_preparations_mod: "The granary administration funds cheaper road construction throughout the empire."

nazani_pdeso_second_city_mod: "Southern Maritime Capital"
desc_nazani_pdeso_second_city_mod: "#G Pdeso#! anchors the southern coast through harbor commerce, ship recruitment, and strong defenses."

nazani_esenzeu_second_city_mod: "Northern Provincial Capital"
desc_nazani_esenzeu_second_city_mod: "#G Esenzeu#! binds northern commerce and local musters to a stable provincial administration."
