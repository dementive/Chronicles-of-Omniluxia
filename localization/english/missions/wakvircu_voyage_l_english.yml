 wv.325.c.tt:0 "Reach the #T reeds off Rhylgoyer#! in #Y 5–8 days#!."
 wv.325.guildhall:0 "Set a Stellaric guildhall among the lower terraces."
 wv.527.desc_closed:0 "The cartman stopped us short of Tiuban. The gates were shut, and the men on the road were turning back carts heavier than ours. We looked at the city until the cartman asked whether we meant to pay him to stand there."
 wv.527.a:0 "Buy a practice tablet from the scribes for our accountants at home."
 wv.527.a.tt:0 "Spend #R 25 Purse#!. Gain #G 1 Wonder#! and carry #T a Dwarf Scribe’s Practice Tablet#! home as a treasure (+5% local research points). Reach #T Kyaxares#! in #Y 8–12 days#!."
 wv.527.b:0 "Stay until the light leaves the first stair."
 wv.527.b.tt:0 "Gain #G 1 Wonder#!. Reach #T Kyaxares#! in #Y 8–12 days#!."
 wv.527.c:0 "Turn the cart around. We still have the cape ahead of us."
 wv.527.c.tt:0 "Reach #T Kyaxares#! in #Y 8–12 days#!."
 wv.527.guildhall:0 "Raise a Stellaric guildhall on the road from Atabem."
