 # Yewubdar, Tharros, Racgerrac and Tiuban
 wv.211.t:0 "The Line Tadm Drew"
 wv.211.desc:0 "At Tamrat a boy on the waterfront had made a triangle with three stalks of barley. He told our bosun he could tell how far away the opposite bank was without crossing. Our bosun said he could tell just as well by rowing over. The boy said that was what everybody had said before Tadm, and if we took the road up from Tewodros we could see where Tadm had learned otherwise."
 wv.211.desc_closed:0 "No one on the dock would take us up the river road. The bargemen kept their poles flat on the deck, with their hands where the watch could see them. Our sailing master said we had water enough to make Gellazani."
 wv.211.a:0 "Put a boat in at Tewodros and take the road to Yewubdar."
 wv.211.a.tt:0 "Use #R 1 Store#!. Reach #T Yewubdar#! in #Y 2–3 days#!."
 wv.211.b:0 "Keep the tide for Gellazani."
 wv.211.b.tt:0 "Reach #T Gellazani#! in #Y 6–10 days#!."
 wv.212.t:0 "The School in Tadm’s Shadow"
 wv.212.desc:0 "The house where Tadm grew up had a low door and a wall that leaned out into the lane. Our bosun asked the schoolmaster whether they had ever thought of straightening it. He said they had, but then he would have to find something else to teach the children with. The oldest girl stood in the middle of the lane with a cord and showed us how far out of true it was. Our bosun had to hold the other end. He took his hat off when she thanked him."
 wv.212.desc_closed:0 "At Yewubdar the lane to Tadm’s old house was shut. Someone had drawn a triangle in chalk across the closed shutters of the school. Our bosun stood looking at it until the carter said our boat would be waiting."
 wv.212.a:0 "Buy one of the teacher’s folding rules for the schools at home."
 wv.212.a.tt:0 "Spend #R 20 Purse#!. Gain #G 1 Wonder#! and carry #T Tadm’s Folding Rule#! home as a treasure (+4% local research points). Reach #T Gellazani#! in #Y 6–10 days#!."
 wv.212.b:0 "Give the girl back her cord and thank her for the lesson."
 wv.212.b.tt:0 "Gain #G 1 Wonder#!. Reach #T Gellazani#! in #Y 6–10 days#!."
 wv.212.c:0 "Go down to the boat. The tide will not wait."
 wv.212.c.tt:0 "Reach #T Gellazani#! in #Y 6–10 days#!."
 wv.212.guildhall:0 "Raise a Stellaric guildhall where the school road meets the market."
 wv.310.mound:0 "Put in at Cornus and go up to Gozon’s Mound."
 wv.310.mound.tt:0 "Use #R 1 Store#!. Reach #T Tharros and Gozon’s Mound#! in #Y 4–7 days#!, then continue to Mount Arteth."
 wv.323.t:0 "The First Cup at Gozon’s Mound"
 wv.323.desc:0 "We left our boats at Cornus and came to Tharros in the hour when the herds were being brought in. On the mound there was a low bench where the keepers set a cup out before the evening meal. Our purser asked which chief had the first drink. The keeper said it went to whoever had walked farthest that day. Our purser began to tell him where Cuwa was, but stopped when an old herdswoman sat down beside him and took off her shoes. Nobody asked her where she had been. The keeper had already set the cup in front of her."
 wv.323.desc_closed:0 "The watch at Tharros turned us down the slope before we got to the mound. We could see a fire lit at the top. The man who sent us back took care to show us a shorter way to the boats."
 wv.323.a:0 "Ask the keeper for a guest’s cup to carry home."
 wv.323.a.tt:0 "Spend #R 20 Purse#!. Gain #G 1 Wonder#! and carry a #T Cup from Gozon’s Mound#! home as a treasure (+3% local population happiness). Reach #T Karali#! in #Y 6–9 days#!."
 wv.323.b:0 "Wait until the herdswoman has finished, then thank our hosts."
 wv.323.b.tt:0 "Gain #G 1 Wonder#!. Reach #T Karali#! in #Y 6–9 days#!."
 wv.323.c:0 "Follow the watchman’s road down to the boats."
 wv.323.c.tt:0 "Reach #T Karali#! in #Y 6–9 days#!."
 wv.323.guildhall:0 "Find ground for a Stellaric guildhall below the mound."
 wv.317.racgerrac:0 "Land at Gailaththar and take the mountain road to Racgerrac."
 wv.317.racgerrac.tt:0 "Use #R 2 Stores#!. Reach #T Racgerrac#! in #Y 7–10 days#!, then sail on toward Rhylgoyer."
 wv.319.t:0 "The Houses in the Rock"
 wv.319.desc:0 "From Gailaththar the road went under the first houses of Racgerrac before we knew we were in a city. At the turning a woman leaned out of a window cut straight into the mountain and shook a rug over our heads. Our envoy asked where the royal hall of the Merovingi was. The woman pointed to a flight of steps, then called down that if we reached the goats we had gone too far. We reached the goats. A mason working in the next street said everybody did, and let us look out from his bench over the roofs that hung below it."
 wv.325.t:0 "The Houses That Held"
 wv.325.desc:0 "The road from Gailaththar came to a place where the old street had fallen into the one beneath it. The masons had laid planks over the gap. We crossed one by one at the foreman’s word, carrying our own things instead of giving them to the boys who usually carried them. On the other side a mason was making a cup out of a piece of the fallen stair. He said he had used that stair every morning for thirty years. He thought he would like to have it in the house again."
 wv.520.tiuban:0 "Make for Atabem and take the inland road to Tiuban."
 wv.520.tiuban.tt:0 "Use #R 2 Stores#!. Reach #T Tiuban#! in #Y 7–10 days#!. Return to the south coast before continuing to Kyaxares."
 wv.527.t:0 "The Steps That Are Gone"
 wv.527.desc:0 "At Atabem the cartman asked if we had come to see Tiuban or to see what had happened to it. It was the same road either way. At the end of it we found a dwarf with a measuring reed standing before an empty stretch of ground. He took us to the place where the first stair of Etemenazari had stood. There was nothing there to trip over. He stepped up all the same, and after a moment our carpenter did too."
 wv.528.t:0 "The Steps of Etemenazari"
 wv.528.desc:0 "From Atabem we could not see Tiuban, but by the last rise the rebuilt ziggurat stood above everything else. A dwarf scribe had set up his table in the shadow of the first stair. He was teaching a boy to count the bricks in a course without counting every brick. The boy could do it as long as nobody was watching. Our carpenter turned his back and asked him the answer, and the boy gave it at once."
 wv.319.desc_closed:0 "The watch had shut the mountain road. A mule came down with two empty panniers knocking against its ribs, and the man who followed it told us how to find our boat again."
 wv.319.a:0 "Buy the mason’s cup and carry a little of the mountain home."
 wv.319.a.tt:0 "Spend #R 20 Purse#!. Gain #G 1 Wonder#! and carry #T Racgerrac’s Stone Cup#! home as a treasure (+4% local tax). Reach the #T reeds off Rhylgoyer#! in #Y 5–8 days#!."
 wv.319.b:0 "Take the view from the mason’s bench and leave him to his work."
 wv.319.b.tt:0 "Gain #G 1 Wonder#!. Reach the #T reeds off Rhylgoyer#! in #Y 5–8 days#!."
 wv.319.c:0 "Take the road back to Gailaththar."
 wv.319.c.tt:0 "Reach the #T reeds off Rhylgoyer#! in #Y 5–8 days#!."
 wv.319.guildhall:0 "Set a Stellaric guildhall among the lower terraces."
 wv.325.desc_closed:0 "The watch had shut the mountain road. A mule came down with two empty panniers knocking against its ribs, and the man who followed it told us how to find our boat again."
