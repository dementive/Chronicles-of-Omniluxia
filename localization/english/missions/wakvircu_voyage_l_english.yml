l_english:
 wv.1.a:0 "Send [SCOPE.sChar('wv_cand_pilot').GetFirstName], who has sounded every bar in Northstar Bay."
 wv.1.b:0 "I select [SCOPE.sChar('wv_cand_factor').GetFirstName], who could find the profit in a shipwreck."
 wv.1.c:0 "[SCOPE.sChar('wv_cand_interpreter').GetFirstName], who speaks the language of half the ports, will go"
 wv.1.desc:0 "The delegation from [GetProvince('(int32)3808').GetName|G] came up from the harbor in a wet line; two wardens in oilskins, and a clerk who would let nobody else carry the box under his arm. They had been five hundred days at sea and had the faces for it. In the hall of the #T Guildmasters#!, the clerk unrolled a map showing the far edges of the world, weighed down its corners with four of our own #T Staters#!, and bluntly asked [ROOT.GetCountry.GetRuler.GetName|Y] whether [ROOT.GetCountry.GetName|Y] was interested in collecting what it was owed.\n\nBefore any further business was discussed, the fires were lit, wine was poured, and the contents of the box were finally revealed after meat and bread had been served; a faded scroll. It was a guild accountant who found the contract, while he was looking up what the last captain to sail that far west had paid for a warehouse. The contract was eighty years old and had never been settled. Someone at Linupom still owed the Guilds for a cargo, with eight decades of interest and fees to boot...\n\nBy evening three names had been put forward to carry our answer to World's End. Each had friends among the Guildmasters who were prepared to argue on their behalf, but the choice of [ROOT.GetCountry.GetAdjective] diplomat was left to [ROOT.GetCountry.GetRuler.GetFirstName]."
 wv.1.t:0 "A Quay at the Edge of the World"
 wv.10.a:0 "Take on casks while the dues are argued over."
 wv.10.b:0 "Sit the watch with the keeper."
 wv.10.c:0 "Sit the watch with the keeper and study the sky."
 wv.10.d:0 "Hire the brothers' tide steersman for the headland."
 wv.10.desc:0 "[GetProvince('(int32)870').GetName|G], the wind-blasted port that faces the #Y Norrfalian Sea#!, keeps time with a clay bird. The #T Clay Hawk#!, as the giant statue is known, stands on the tower wall with its wings spread flat and its belly full of water, and a thin stream runs from its beak into a basin below. When the basin is full, the watch changes. If the bird runs dry, the brother who let it run dry stands the next watch himself, and nobody in the town has ever seen that happen twice to the same man.\n\nEverything else follows the bird. The bakers pull their loaves on the hour and the brothers say their prayers on the half, and the wind off the #G Errfalian Sea#! gets into everything in between. It found the staves of our water casks within the hour. Our crew, who had been ashore for less than a morning, began to answer the brothers in watches rather than hours, and were embarrassed about it.\n\nThe watchkeeper tipped the hawk toward our sailing master to show how much water was left in it. The sailing master, who has sailed this coast for twenty years, looked at the stream and then at the sky over the headland, and chewed the inside of his cheek. The keeper's relief was still down in the gatehouse arguing over the harbor dues. There was time, the sailing master said, for one more cask or one more argument, but probably not both."
 wv.10.desc1:0 "\n\nThe keeper tapped the bird twice with his knuckle. Best make yourselves comfortable under the headland, he said. Then he went to find his relief, who was late."
 wv.10.e:0 "Sail before the bread comes out."
 wv.10.t:0 "[GetProvince('(int32)870').GetName|G] Keeps Time"
 wv.100.a:0 "To the Place of the Pyre."
 wv.100.b:0 "To the Apostolic Palace."
 wv.100.c:0 "To the Seminary of Balthazar."
 wv.100.d:0 "Buy a small supply of Stores from the pilgrim bakers."
 wv.100.desc:0 "The bells of [GetProvince('(int32)2706').GetName|G] begin a mile out to sea. They do not ring together. Every chapel in the city answers the bells of the Apostolic Palace in its own time, so that by the time our anchors were down the sound had become a kind of weather, rolling over the harbor from hill to hill and coming back off the water. Our sailors, who had never heard more than one bell at a time, took off their caps and could not have said why.\n\nThe dock was solid with pilgrims: families who had walked from Werhen with their shoes tied round their necks, merchants who had come to pray and stayed to sell, and old women who have come every year since before our bosun was born and know exactly where to stand. Glassblowers worked in open booths along the waterfront, turning out tiny stoppered vials, and every vial, the glassblowers swore, held a pinch of the true #T Ashes#! of #Y Helluvius#!. The supply has never once run short.\n\nAbove it all the Apostolic Palace sat on its hill like a ledger on a desk. The first #T Shannah#!, #Y Pouirruipa#!, kept a temple's accounts before he followed Helluvius, and the Palace has never forgotten it: every candle lit in the city is entered in a book. Below the Palace, in the square, a company of Lidyan players had begun the Passion of the Three Days, and would not finish until the third day. Their eldest wore a grinning clay mask, and had already said something about the governor that made the front rows gasp."
 wv.100.desc1:0 "\n\nThe harbor chain was up. A boy in a rowing boat shouted across the water that the city was closed to [ROOT.GetCountry.GetAdjective] ships until further notice, and asked whether we had any oranges."
 wv.100.desc2:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] stood at the stern listening to the bells, and could tell us which ones were rung by apprentices."
 wv.100.desc3:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] took one of the glassblowers' vials, held it to the light, and offered the man a price for his whole booth, the supply of Ashes included."
 wv.100.desc4:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] went among the pilgrims on the landing and came back with the stories of four of them, in three languages, and tears on her face she did not bother to wipe."
 wv.100.e:0 "Buy a larger supply of Stores."
 wv.100.f:0 "Wait offshore for the gates to open."
 wv.100.g:0 "Sail on to Mazos."
 wv.100.h:0 "Back to the ship, and on to Mazos."
 wv.100.t:0 "The Bells of [GetProvince('(int32)2706').GetName|G]"
 wv.101.a:0 "Kneel with them at the edge of the stones."
 wv.101.b:0 "A candle in the fleet's name, entered in the Palace book."
 wv.101.c:0 "Let [SCOPE.sChar('wv_vet').GetName|Y] kneel where his people have knelt for generations."
 wv.101.d:0 "Edge back through the weeping crowd."
 wv.101.desc:0 "The stake is long gone. There is only a patch of paving in the middle of the square, worn smoother than the stones around it, which the sweepers go around with their brooms. Pilgrims kneel at its edge, never on it. A widow had brought her husband's boots and set them down side by side with their toes to the line, then stood back and looked at them as though he might step into them.\n\nBehind us, on the players' stage, the actor playing Helluvius had reached the first night of the burning and was describing it to the crowd in a calm, reasonable voice, as a man might describe the weather. The crowd wept. By our count he had been burning for nine hours, and he still had two days to go."
 wv.101.desc1:0 "\n\n[SCOPE.sChar('wv_vet').GetName|Y] knelt at the edge of the stones until the shadow of the stage had crossed half the square. When he stood up he brushed off his knees, nodded once to the widow's boots, and walked back to the ship without a word. The crew left him alone for the rest of the day, which was what he wanted."
 wv.101.t:0 "The Place of the Pyre"
 wv.102.a:0 "Carry the chest west for the congregations."
 wv.102.b:0 "Arrange the audience, and the letter."
 wv.102.c:0 "Thank the clerk, and leave the book open."
 wv.102.desc:0 "A clerk in the outer office of the Palace was copying three names that had been stitched onto a strip of cloth, each in a different hand. He finished the third before he looked up. When he heard where we were bound he put down his pen, went into a back room, and came back with a small iron-bound chest addressed, in an old and very careful hand, to the faithful of the western congregations. Nobody had found a ship going far enough to take it, he said, for eleven years. It had been entered in the book every year as 'awaiting carriage'.\n\nFor a contribution to the Palace's works, he added without changing his tone, an audience could be arranged, and a letter in the Shannah's own hand. He opened the book to show us the line on which our contribution would be entered. It was already ruled."
 wv.102.t:0 "The Apostolic Palace"
 wv.103.a:0 "Listen to the rest of the examination."
 wv.103.b:0 "Buy a master's lexicon in five tongues."
 wv.103.c:0 "[SCOPE.sChar('wv_envoy').GetName|Y] trades a lexicon for an hour's conversation in Mikkosrie."
 wv.103.d:0 "Leave the masters to their laughing."
 wv.103.desc:0 "#Y Balthazar#! came to [GetProvince('(int32)2706').GetName|G] from a village in Werhen to learn to be a priest, and stood out because he could argue in five languages before he could read in one. The seminary still tests its students the same way. We arrived in the middle of an examination: a boy of perhaps fifteen stood before four masters and was asked the same question in Lidyan, Imperial Zanic, Astvaenic, Mazonian and Werhen.\n\nHe answered four. At the fifth he stopped, opened his mouth, closed it again, and burst out laughing at himself. To our surprise the masters laughed with him, and then passed him anyway. Werhen, one of them explained to us afterward, is not a language that anybody learns. It is a language that some people are born already annoyed in."
 wv.103.desc1:0 "\n\n[SCOPE.sChar('wv_vet').GetName|Y] listened to the Werhen question with his arms folded, and afterward told the boy, in Werhen, what the answer was. The boy wrote it down. It was the most anyone aboard had heard him say since the inn."
 wv.103.t:0 "The Seminary of Balthazar"
 wv.11.a:0 "Hire the Werhenlander."
 wv.11.b:0 "Hot meals and dry beds for everyone."
 wv.11.c:0 "Buy the innkeeper's provisions, cheese and all."
 wv.11.d:0 "When the wind drops, we sail."
 wv.11.desc:0 "The storm came round the headland exactly when the sailing master said it would, and stayed longer than anyone wanted. We put in under the lee of the cliff and went up to the only inn on that coast, all of us at once and wet to the knees. The innkeeper bolted the front door when she saw how many we were. Then she opened the kitchen door to let in a sailor with a split lip, and a cheese she had been saving for a better class of guest.\n\nBy the second day the common room smelled of wet wool, tallow and the bosun's boots. A Werhenlander with an old axe across his knees sat by the doorpost. Each morning he marked the height of the floodwater on the post with his thumbnail, and he said nothing all day. Our cook asked him to pass the salt and he passed it. That was the whole conversation.\n\nOn the third evening the bosun told the story about the sea-elf and the oyster for the third time, improving it as he went. The Werhenlander said, without looking up, that in his country they tell it better and the elf wins. The whole room laughed, the bosun loudest, and the Werhenlander went back to saying nothing. Later he took his coat down from the peg and asked who commanded our shore parties. He would lead them inland himself, he said, for a hundred gold, paid before the ship sails."
 wv.11.desc1:0 "\n\nThe storm kept us [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('wv_storm').GetValue|0Y] days under the headland, and it ate a day of Stores for every one of them."
 wv.11.desc2:0 "\n\n[SCOPE.sChar('wv_vet').GetName|Y] settled his own bill before he came aboard. The innkeeper said that he was the first guest who ever had."
 wv.11.t:0 "Three Days at the Inn"
 wv.110.a:0 "To the shrine of the Pearl Tithe."
 wv.110.b:0 "To the feast of Qhidis."
 wv.110.c:0 "To the Poets' Wharf."
 wv.110.d:0 "Buy a small supply of Stores and a basket of figs."
 wv.110.desc:0 "You can hear [GetProvince('(int32)2548').GetName|G] before you can see it. The Mazonians recite. The fishermen recite while they mend their nets, the women selling figs recite their prices, and the harbor master recited our mooring fee to us in four rhyming lines and expected us to admire the third. The language is all doubled r's and l's, so that the harbor master's name, Shuthuperre, rolled off his own tongue like surf over shingle and off ours like a dropped cask. After the third attempt our bosun gave up and called him 'sir', with such feeling that the man was visibly moved.\n\nThe Grand Port is everything the poets have always said it was, which surprised our crew, who had assumed that poets exaggerate. The yards smell of new-cut timber, the warehouses of wine from the hill estates, and the whole waterfront of tar and figs. Along the pier old women sell verses by the line, and a sailor who wants a love poem for a girl at home can have one written while he waits, with her name worked into the rhyme for one copper more.\n\nAt the end of the mole the tithe-boats were coming in, and every one of them touched at the shrine of the sea-goddess before it touched the wharf."
 wv.110.desc1:0 "\n\n[SCOPE.sChar('wv_vet').GetName|Y] said the harbor master's name right on the first try, with every r in its place. Werhen, he explained, has more of them. The harbor master shook his hand for a long moment and asked if he had ever thought of writing poetry. Actmund said that he had thought of it, once, and then had a drink until the feeling passed."
 wv.110.desc2:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] walked out to the end of the mole to watch the tithe-boats come in, and said that the Mazonians handle their boats the way other people handle horses they love."
 wv.110.desc3:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] bought a sonnet from the poets' quay for a girl in Cuwa he had never met, and kept it in his coat, he said, as an investment."
 wv.110.desc4:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] answered the harbor master's four rhyming lines with four of her own, in Mazonian, and the harbor master waived our mooring fee and asked if she was married."
 wv.110.e:0 "Buy a larger supply of Stores."
 wv.110.f:0 "Wait offshore, reciting."
 wv.110.g:0 "Sail on to Zewggadmeza."
 wv.110.h:0 "Back to the ship, and on to Zewggadmeza."
 wv.110.t:0 "The Poets' Harbor"
 wv.111.a:0 "Hear the diver out."
 wv.111.b:0 "Pay the carpenter before the surf does."
 wv.111.c:0 "Ask the diver what he charges to sail with us."
 wv.111.d:0 "Ask the diver to sail with us, though every berth is taken."
 wv.111.desc:0 "The sea-goddess of the #T Pearl Tithe#! is hung from shoulder to knee with strands of carved shell beads, one strand for every boat that ever came home to Mazos with its tithe. She has grown so heavy that the priests have had to set an iron bar across her back. While we watched, a diver came up out of the harbor, touched the oldest strand for luck, and went straight down again under our own hull without being asked.\n\nHe came up with a splinter of our keel between his teeth. 'Your seam,' he said, spitting it into his palm, 'is going. Not today. In the surf off Baetep, maybe.' He handed the splinter to our purser as though it were a bill. 'Who is paying the carpenter?'"
 wv.111.desc1:0 "\n\n[SCOPE.sChar('wv_diver').GetName|Y] told us his price while he was still dripping, and came aboard before we had agreed to it. 'You will agree,' he said. 'The seam.' He said that his father's boat had gone out one spring and never come back, and that there was no strand for it on the goddess. He said it in the same voice he used for the seam."
 wv.111.desc2:0 "\n\nThe carpenter worked through the night by lantern. In the morning the diver went down again, came up, and gave us a short nod, which in Mazos is high praise for a carpenter."
 wv.111.e:0 "Hang a strand for the boat [SCOPE.sChar('wv_diver').GetName|Y]'s father never brought home."
 wv.111.f:0 "Leave the goddess to her strands."
 wv.111.t:0 "The Pearl Tithe"
 wv.112.a:0 "Drink with the crowd."
 wv.112.b:0 "Feast the whole crew at the long tables."
 wv.112.c:0 "Leave before the singing gets any better."
 wv.112.desc:0 "The god #T Qhidis#! laughs loudest when he drinks, and once he drank from a bronze cup at this very shrine. The priests still have the flask. On feast nights they fill it for strangers, and tonight was a feast night, because in Mazos most nights are. Long tables ran down the middle of the street. Somebody played a reed pipe badly and somebody else sang over it worse, and a priest went from table to table with the bronze flask, pouring a thimbleful into every stranger's cup and watching him drink it with the face of a man waiting for a joke to land.\n\nOur cook ate three plates of something made of octopus and figs, and has spoken of very little else since."
 wv.112.desc1:0 "\n\nBy midnight the priest with the flask had stopped watching our crew drink. He had sat down at our table and was teaching the bosun a song about a fish, and the bosun, who cannot sing, was teaching it back to him."
 wv.112.t:0 "The Feast of Qhidis"
 wv.113.a:0 "Send him letters, and let him write it as we go."
 wv.113.b:0 "Commission the whole cycle, made up in advance."
 wv.113.c:0 "Tell him the truth will have to do, and walk on."
 wv.113.desc:0 "The poets of the waterfront sell by the line. A couplet costs a copper, a sonnet costs a meal, and an epic is negotiated. One old man had his stall between a fishmonger and a ropewalk, and carried the smell of both in his beard. He asked where we were going. When we told him, he dipped his pen, wrote 'World's End' at the top of a clean sheet, underlined it twice, and sat back to wait to be paid for the rest.\n\n'I can write it as you go,' he said. 'Send me letters. Or I can write it all now, which is cheaper, because then I will not have to wait to find out what happens. I will make something up. It will be better than what happens.'"
 wv.113.t:0 "The Poets' Wharf"
 wv.120.a:0 "To the Exchange, and keep a hand on the Purse."
 wv.120.b:0 "An auction? We are only looking."
 wv.120.c:0 "The Freight Hall, then. Somebody has to work."
 wv.120.d:0 "Wait offshore, and pay nobody."
 wv.120.desc:0 "The first man aboard was a broker's boy. By the time our captain had finished telling him to get off the ship he had priced the sails, the rigging, and, after a long look, the captain. All boats lead to [GetProvince('(int32)2175').GetName|G], as the saying goes, and on the wharf it was easy to believe it. We counted six languages before the gangway was down, and none of them was asking for directions, because in Zewggadmeza directions cost extra.\n\nThe incense trade hangs over the city so thickly that nobody can smell the fish market, which the islanders regard as a civic achievement. Our sailors had expected the greatest markets in the world to be loud, and were unsettled to find them so polite. Every price was given with a smile, and every smile came with a price. The Exchange, the auction houses and the Freight Hall all stand along a single street, and a painted notice at the end of it reminds visitors that the casting of spells is forbidden during trading hours.\n\n'The Gazabi has no talent for magic,' a clerk explained, 'and sees no reason why anyone else should profit from one.'"
 wv.120.desc1:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] stood on the waterfront with his eyes half closed and breathed in the incense, and our purser said afterward that it was the first time he had seen the man look at peace."
 wv.120.desc2:0 "\n\nA broker priced [SCOPE.sChar('wv_vet').GetName|Y]'s axe from across the street and named a figure. Actmund named a figure back. The broker went pale and walked away, and our purser has been trying ever since to find out what the number was."
 wv.120.desc3:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] looked at the four hundred ships in the harbor and said that he could tell which ones would sink, and that he would not be telling their owners."
 wv.120.desc4:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] counted the languages on the quay, as we had, and found nine, not six. Three of them, she said, were only ever used for cheating."
 wv.120.e:0 "Sail on to Gevanni."
 wv.120.f:0 "Back to the ship before they charge us for the air."
 wv.120.t:0 "All Boats Lead to [GetProvince('(int32)2175').GetName|G]"
 wv.121.a:0 "Sell her a share of the homecoming."
 wv.121.b:0 "Take the advance against the tariff schedule."
 wv.121.c:0 "Thank her, and keep our accounts to ourselves."
 wv.121.desc:0 "The Exchange is one long room with no chairs. Merchants stand to do business in Zewggadmeza because, a clerk told us, a man who sits down has stopped making money. [SCOPE.sChar('wv_envoy').GetName|Y] was shown to the only chair in the building. It belonged to a woman who had already bought a share in our voyage, apparently before we arrived. She did not ask for her chair back. She stood behind it and went through our accounts over [SCOPE.sChar('wv_envoy').GetName|Y]'s shoulder, down to the smallest harbor fee, and asked for every one of them to be explained.\n\nWhen the explaining was done she made two offers. She would buy a share of our homecoming outright, today, for sixty gold, against a fixed sum when the chest reached Cuwa. Or she would advance forty gold against a signed tariff schedule, to be repaid at Linupom. She said that both offers were very generous, and the merchants standing nearby nodded, as if they had heard her say so before."
 wv.121.t:0 "The Exchange"
 wv.122.a:0 "Watch the bidding, and keep our hands in our pockets."
 wv.122.b:0 "Outbid the lot of them."
 wv.122.c:0 "[SCOPE.sChar('wv_envoy').GetName|Y] bids for it, and knows exactly when to stop."
 wv.122.d:0 "Out into the dark, before anyone sees our faces."
 wv.122.desc:0 "The richest families of the Republic auction whatever their debtors could not keep, and they hold the auctions at night, by lamplight, so that the bidders cannot see each other's faces. Tonight's great lot was a bronze armillary from a Zanite house that went bankrupt two generations ago: rings within rings, every star picked out in silver, still set to the sky above a city that no longer exists.\n\nOur navigators crowded round it like boys at a sweet stall. One of them turned the outer ring with a fingertip, found #T Szing-Szing#! in its place among the silver stars, and could not stop smiling. The auctioneer watched him do it and raised the reserve."
 wv.122.desc1:0 "\n\nThe armillary went aboard wrapped in a sail. Our navigators took turns sleeping beside it, and nobody had the heart to tell them that this was not necessary."
 wv.122.t:0 "The Auction by Lamplight"
 wv.123.a:0 "Take the freight for Gellazani."
 wv.123.b:0 "Buy a small supply of Stores at the world's best price."
 wv.123.c:0 "Buy a larger supply of Stores."
 wv.123.d:0 "Out of the shouting, before someone sells us something."
 wv.123.desc:0 "Four hundred captains stood in the Freight Hall shouting cargoes and destinations at one another, and every one of them wanted to know who was going west. A Gellazanian broker pushed through the crowd and offered us a consignment for #G Gellazani#!: fifty gold on delivery, one slot in the hold, and no questions asked. Behind him a chandler's boy was already reading our Stores list upside down out of our purser's hand.\n\nStores here were the cheapest anywhere on the Marenica Sea. In Zewggadmeza everything is the cheapest somewhere, a chandler told us, and the whole trick is knowing where."
 wv.123.t:0 "The Freight Hall"
 wv.130.a:0 "To the Comitium, where the Senate sits."
 wv.130.b:0 "Into the Speakers' Squares."
 wv.130.c:0 "To the empty plinth of Zorgolis."
 wv.130.d:0 "Send the Stores round by the coast road."
 wv.130.desc:0 "Our sailors came up from the harbor of [GetProvince('(int32)2470').GetName|G] through a gate of white marble so tall that swallows nest in the carving of its lintel, and at the top of the steps they stopped dead, all of them at once, so that the men behind walked into them. The #G Forum of Gevanni#! lay open below like a bowl of light. Colonnades ran round it two stories high, every column a single stone veined with gray and rose, and between the columns stood statues in long ranks, generals and magistrates and philosophers, a whole stone city of the dead looking down at the living one. The paving underfoot had been worn into shallow channels by a thousand years of feet, and the channels shone.\n\nAnd it was loud. Bankers counted coin at tables under the arcades, lawyers argued cases in the open air, incense drifted out of three temples at once, and in every corner of every square a young man stood on a box with one arm raised, practicing a speech at the top of his voice to nobody in particular. Gevanni was a democracy before Zanis came, and it has never got over it. The Senate still meets in the Comitium at the head of the Forum, though a Zanic governor now decides what it will vote for, and the Gevannic Populus still comes to hear the speeches, and to vote, and to complain about the result.\n\nIn the middle of all that noise there is one quiet place. It is a plinth with no statue on it, and every morning somebody lays fresh flowers there. It belongs to #Y Zorgolis#!, the senator who wrote the #T Tales from the Zanic Age#! and told Gevanni to its face what it had become, and was executed for it. When word of his death reached the capital, the streets there burned. Nobody in the Forum raises their voice when they walk past his plinth, not even the young men on their boxes."
 wv.130.desc1:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] stood on the top step of the Forum with his cap in his hands, looking at the marble, and said quietly that he had never seen so much stone that was not trying to sink a ship."
 wv.130.desc2:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] asked a banker under the colonnade what the Forum would fetch if it were ever sold, and the banker, after a moment's thought, gave him a figure."
 wv.130.desc3:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] stood in the Speakers' Squares for an hour listening to a dozen young senators at once, and could repeat any of them back afterward."
 wv.130.e:0 "Buy a small supply of Stores from the bankers' cooks."
 wv.130.f:0 "Buy a larger supply of Stores."
 wv.130.g:0 "Wait offshore and listen to the speeches carry."
 wv.130.h:0 "Sail on to Durobaeraste."
 wv.130.i:0 "Back to the ship, before somebody proposes a motion about us."
 wv.130.t:0 "The Forum of [GetProvince('(int32)2470').GetName|G]"
 wv.131.a:0 "Stay for the whole letter."
 wv.131.b:0 "Pay the Senate archive for a copy of the summons."
 wv.131.c:0 "Leave the Senate to its unanimous debate."
 wv.131.desc:0 "The Senate of Gevanni meets under a bronze roof gone green with age, on stone benches polished by the seats of fifty generations of senators. It still debates everything at length, and in perfect order, and then votes for whatever the governor has already decided, which the senators regard as the highest form of their art.\n\nToday a speaker on the steps outside was reciting the letter that summoned the young Zanis home from Morrigon, the one that called him back before he could finish his search for wisdom. He skipped a line. A woman with a basket of onions on her hip supplied it from the third row, word for word, without looking up from the onions. He thanked her and began again from the top, and the crowd, which had heard the letter a thousand times, settled in to hear it once more."
 wv.131.desc1:0 "\n\nThe archivist copied the summons in a clear, old-fashioned hand and sanded it dry. At the bottom was the name of the messenger who had carried it to Zanis. Nobody on the steps had ever thought to read that far."
 wv.131.t:0 "The Comitium"
 wv.132.a:0 "Hear one speech all the way through."
 wv.132.b:0 "Take the old orator's lesson."
 wv.132.c:0 "Point at the sky, and leave."
 wv.132.desc:0 "Every young man in Gevanni who means to be a senator practices in the squares, and they practice all at once. Standing in the middle of them is like standing inside a beehive that has read law. One boy, perhaps sixteen, had chosen for his subject the mooring fee charged to foreign ships, and was denouncing it with such fire that our purser began to feel ashamed of having paid it.\n\nAn old orator in a faded toga was selling lessons by the hour from a bench beneath a statue of himself, young. He would teach our envoy the Gevanni manner, he said: how to stand, how to pause, and when to point at the sky."
 wv.132.desc1:0 "\n\nThe lesson took the whole afternoon. By the end of it our envoy could pause in a way that made the boy with the mooring fee stop in the middle of a sentence and look round."
 wv.132.t:0 "The Speakers' Squares"
 wv.133.a:0 "Lay a flower on the plinth with the others."
 wv.133.b:0 "Ask her, quietly, for a copy of the Tales."
 wv.133.c:0 "Walk on, and keep our voices down."
 wv.133.desc:0 "The flowers on the empty plinth were fresh that morning, as they are every morning, and nobody saw who brought them. An old woman sat on the step beside it with a basket of greens, and under the greens, wrapped in a vegetable seller's cloth because it is still not quite allowed, she kept copies of the #T Tales from the Zanic Age#!.\n\nShe did not offer one to us. She waited, the way someone waits who has seen a great many foreigners stop at this plinth and wonder what it is, and who knows that the ones worth selling to will ask."
 wv.133.desc1:0 "\n\nShe wrapped the book in a fresh cabbage leaf before she gave it to us. 'It keeps better that way,' she said, and then, without any change in her face: 'So does the truth.'"
 wv.133.t:0 "The Plinth of Zorgolis"
 wv.140.a:0 "To the Academy."
 wv.140.b:0 "To the Temple of Tempuchur."
 wv.140.c:0 "To Parimades' Gate."
 wv.140.d:0 "Buy a small supply of Stores, and greet the grocer properly."
 wv.140.desc:0 "In [GetProvince('(int32)2478').GetName|G] the dead emperor has not entirely left. The faith of the First Emperor keeps Zanis present in the land by ritual, and the old capital is very good at ritual. In every house we entered there was an empty chair at the table, and the guests were served only after the chair had been. Our sailors kept glancing at it, waiting for whoever it was meant for to arrive, and the old Zani gentleman who had invited us to dinner found this delightful.\n\nImperial courtesy runs to long names. The full greeting at the Academy gate takes as long as a meal. Our purser began one at the third bell of the morning and finished at the sixth, and was then asked, very politely, to begin again, because he had left out a grandmother. The city is all colonnades and cloth: bolts of dyed linen hang from every balcony to dry, so that the streets are striped with colored shade.\n\nThe Academy stands at the top of the hill. The gate below it is called Parimades' Gate, after the battlemage who turned traitor and fought his own people from the hills for the rest of his life. The children of Durobaeraste play at Parimades in the gateway every afternoon, and none of them ever wants to be Parimades."
 wv.140.desc1:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] sat through the whole of a Durobaeraste dinner without speaking, and the host said afterward that he had the best manners of any foreigner he had ever entertained."
 wv.140.desc2:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] asked the price of the empty chair at dinner, and was told that it was not for sale. He wrote that down as though it were a very interesting figure."
 wv.140.desc3:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] gave the full Imperial greeting at the Academy gate, grandmothers and all, in under the hour, and the gatekeeper wept a little."
 wv.140.e:0 "Buy a larger supply of Stores."
 wv.140.f:0 "Wait offshore, and practice the greeting."
 wv.140.g:0 "Sail on."
 wv.140.h:0 "Back to the ship. The chair can keep our place."
 wv.140.t:0 "The Empty Chair"
 wv.141.a:0 "Take her aboard. The steward can keep his seventh sheet."
 wv.141.b:0 "Take her aboard, though every berth is taken."
 wv.141.c:0 "Take her aboard and release [SCOPE.sChar('wv_vet').GetName|Y] from service."
 wv.141.d:0 "Hear her out, and leave her to the steward."
 wv.141.desc:0 "The Magonis steward allows each pupil six sheets of paper for observations at sea, and never a seventh. One of his pupils, a thin girl of nineteen with ink to the elbows, had already used two of hers writing down what the steward expected her to observe. She read them to us with a perfectly straight face. Then she turned the second sheet over and showed us, in a much smaller hand, what she had actually seen on the walk down to the harbor: a change in the swell, gulls flying low over the Baetep road, and a note that the steward was wrong about all of it.\n\nShe would come aboard on Academy terms, she said, which meant the Academy might inspect any sealed paper she touched. Or she would come for a fee, and touch nothing that was sealed, and read everything that wasn't."
 wv.141.desc1:0 "\n\n[SCOPE.sChar('wv_vet').GetName|Y] watched her from the gateway with his arms folded. His people fought the Zani for generations, and it was the Zani who burned Helluvius at Ddu-Nuinop. He said nothing. He did not need to."
 wv.141.desc2:0 "\n\n[SCOPE.sChar('wv_pupil').GetName|Y] came aboard with a satchel, a writing board and four blank sheets, and asked where the best place was to watch the swell. Our sailing master showed her. By the evening she had filled half a sheet, and the sailing master was asking her questions."
 wv.141.e:0 "Leave the steward his seventh sheet."
 wv.141.t:0 "Six Sheets"
 wv.142.a:0 "Watch them work."
 wv.142.b:0 "Have the log copied, every night, for the archive."
 wv.142.c:0 "Leave them to their two hands."
 wv.142.desc:0 "The acolytes of #T Tempuchur#!, god of learning, will copy anything brought to them at a fixed price per line, without reading it and without being surprised by it. A merchant was having his tax returns copied beside a poet having his love letters copied, and the acolyte between them was copying both at once, one with each hand.\n\nFor a fee, they told us, they would come down to our ship every evening we lay in port and copy the day's log before we slept, so that if the sea took the ship, the voyage would at least survive in Durobaeraste."
 wv.142.t:0 "The Copyists of Tempuchur"
 wv.143.a:0 "Walk on, and let the traitor have his win."
 wv.143.b:0 "Hire the sergeant to drill the deck crew."
 wv.143.c:0 "Leave the traitor to his victory."
 wv.143.desc:0 "Under the gate the children of Durobaeraste were playing at war. One side were the Emperor's legions and the other were Parimades and his hill fighters, and the second side was short of volunteers. A bigger boy was handing out wooden swords and trying to persuade someone, anyone, to be the traitor. Nobody would. In the end the smallest child in the street took a sword with a sigh, turned traitor, and won.\n\nAn old legion sergeant was watching from the wineshop on the corner. For a fee and his wine, he said, he would drill our deck crew the way the legions are drilled: badly, and until they are good."
 wv.143.t:0 "Parimades' Gate"
 wv.150.a:0 "Send our launch."
 wv.150.b:0 "Throw a rope from the dock, and keep our people dry."
 wv.150.c:0 "The lane is clear. We sail."
 wv.150.desc:0 "The landing bells began to ring after supper. Not the hour bells, but the quick, ragged ones. An outbound lighter had rolled at the harbor mouth with three people aboard, and in the dark nobody could see which way she had gone over. Her owner ran up and down the pier asking everyone whether the cargo had been insured. Then a woman came down the steps in her slippers, with a shawl over her nightdress, and asked which side of the boat her son had been sitting on.\n\nOurs was the only ship in the harbor with a launch still in the water."
 wv.150.t:0 "The Boat in the Dark"
 wv.2.a:0 "Understood. Tell the bosun to start singing."
 wv.2.b:0 "This is too complicated, Game Master. Refund the guild."
 wv.2.desc:0 "Ave Imperator. It is time, once again, to break the fourth wall a little.\n\nThe voyage to World's End is a game inside the game, and it has rules. The fleet carries its own #Y Purse#! of #Y 400#! @gold!. That is all the money it will have unless it earns more on the way, so spend it like a sailor and count it like a Guildmaster. A further #Y 80#! is sealed in the guild escrow. It pays for the house at #G Linupom#!, and nobody aboard can touch it, which is the only reason it will still be there. At other cities, we can commission a Stellaric guildhall for #Y 150 gold from the national treasury#!.\n\nThe fleet also carries #Y Stores#!, which the crew eats; a #Y Hull#!, which the sea eats; and a #Y Company#!, which is everyone aboard and their patience. All four are shown at the top of every event. Let the Stores run out and the Company starves. Let the Hull or the Company reach nothing and the voyage is over.\n\nIn the great ports you may go ashore and see the sights. The first two districts of every city are free; after that the tide waits for nobody, and a third district costs a day of Stores. Each choice can be made only once. Each district visit and certain encounters count toward #T Wonders Seen#!. The more wonders the envoy sees, the more Popularity they gain at home. At #Y 18 Wonders#! the envoy's welcome grows warmer, and at #Y 30#! the envoy earns the World's End Traveler trait.\n\nThe settlement chest and bulky goods take up #T Cargo Slots#!. #T Companions#! counts the recruited travelers aboard. Up to three may sail with the envoy, alongside the regular crew. The weather has already been decided, though nobody aboard knows it yet. A few people along the way can read it, if you find them.\n\nBring back the whole contract and Cuwa will remember your name. Bring back half and Cuwa will still be polite.\n\n#G Good luck, and have fun.#!"
 wv.2.t:0 "The Rules of the Voyage"
 wv.200.a:0 "Watch the fishermen's reading."
 wv.200.b:0 "Buy a reading for the fleet."
 wv.200.c:0 "[SCOPE.sChar('wv_envoy').GetFirstName|Y] lies down on the warm stone and reads the smoke with the priests"
 wv.200.d:0 "Pay the admiral for an escort on the outer passage."
 wv.200.desc:0 "The air at [GetProvince('(int32)5607').GetName|G] was so heavy that our sails hung from the yards like washing. Before the anchor found bottom every man aboard was soaked, and not from the spray. The jungle starts at the end of the jetty, a green wall that drips and hums, and somewhere inside it something large moved through the leaves and stopped to listen to us.\n\nThe Uriyalok came down to the water to meet us, slowly. They are Snakefolk, as old as Omniluxia, and what they want from the rest of the world is for it to stay where it is. Their island gives them everything a snake could need, and they are honestly puzzled by people who sail this far for more. Trade is done at arm's length. Our purser set a bolt of cloth on a flat stone, a long scaled hand set a jar of incense on another, and at no point did anybody's fingers come near anyone else's. Nobody blinked. The Uriyalok, we noticed, never do.\n\nAt the top of the steps the three gilded serpents of the column hold up their bowl, or the place where a bowl used to be, and the priests burn oil in a clay dish between the open jaws. They lie on the warm stone beside it, which our sailors could not stand on barefoot, and read the will of #T Euryal#! in the way the smoke climbs the coils. The admiral's patrol fleet, anchored in the bay, pays them for the weather. So do the fishermen, at a lower rate."
 wv.200.desc1:0 "\n\n[SCOPE.sChar('wv_pupil').GetName|Y] watched the smoke for an hour and wrote one line on her third sheet. 'The priests are right,' it said, 'and so is the steward, which is the first time.' Then she told the sailing master what the crossing would be like."
 wv.200.desc2:0 "\n\nOur carpenter went below to look at the seam the Mazonian diver had warned us about, came back up, and asked whether anyone aboard knew a prayer for planks."
 wv.200.desc3:0 "\n\n[SCOPE.sChar('wv_vet').GetName|Y] was the only one of us who sat down on the hot stone beside the Uriyalok priests. He sat there for an hour in his mail without sweating, as far as anyone could tell, and when he got up the oldest priest inclined its head to him, very slightly."
 wv.200.desc4:0 "\n\n[SCOPE.sChar('wv_diver').GetName|Y] went over the side at Siznl to look at the anchor and came back up with his eyes very wide. 'There are snakes down there,' he said. 'Big ones. They swim better than I do.' He was quiet for the rest of the day, which in a Mazonian is a sign of deep professional respect."
 wv.200.e:0 "Leave them in peace and set out across the Intergealian Sea."
 wv.200.t:0 "The Serpent Column at [GetProvince('(int32)5607').GetName|G]"
 wv.210.a:0 "Tow her clear."
 wv.210.b:0 "Put the crew to carrying sacks alongside the girls."
 wv.210.c:0 "Buy a small supply of barley off the wharf and keep the tide."
 wv.210.desc:0 "At [GetProvince('(int32)2547').GetName|G] the river comes down brown and slow out of Baetep, and everything in the town is measured in barley. The doorposts of the houses are notched with the height of every flood since anyone began notching them, and on some of the houses the notches go up past the lintel.\n\nA Baetepian grain boat had run aground on the bar below the wharf just as the crown's measurer was leveling the last vessel of the day. The boatman's daughters had started carrying the sacks up the bank on their heads, four girls and a great many sacks, while the boatman stood in the water pushing at the bow as though he could talk her off. The measurer looked at the sacks going up the bank uncounted, considered his duty, took off his sandals, and waded into the river up to his waist, so that the girls would have to bring every sack past him."
 wv.210.desc1:0 "\n\n[SCOPE.sChar('wv_diver').GetName|Y] was in the river before anyone had decided anything, feeling along the grain boat's keel for the place where the bar had her. He came up with a mouth full of mud and told the boatman exactly which plank to pray to."
 wv.210.t:0 "The Barley Boat"
 wv.220.a:0 "To the School steps."
 wv.220.b:0 "To the Papyrus Wharf."
 wv.220.c:0 "To the Charm Market."
 wv.220.d:0 "Take the flood road to the Pyramids of Tariku."
 wv.220.desc:0 "Nobody haggles in [GetProvince('(int32)2769').GetName|G]. Half the city has been through the #T Psiddisamman School#!, the 'Magic Mouth' that the Phanician magician Oxynen founded, so nobody needs to. They simply explain, gently and at length, and you find that you have agreed. Our purser went ashore to buy lamp oil and came back with lamp oil, a new hat, and a firm conviction that he had always wanted the hat. He could not say how it had happened. He wore it for the rest of the voyage.\n\nMyrrh smoke drifts through the colonnades in long blue scarves, and the flood plain beyond the city is so flat and so green that it looks painted on. Hawulti, Kawsem and Shewesnep traders work the wharves side by side, each of them quietly certain that all the others are being charmed. The School's front steps are the only place in the city where nothing is for sale, which makes them the busiest steps in Gellazani: everyone sits there to rest from being persuaded.\n\nInland, two days up the flood road, the Pyramids of Tariku stand on the plain."
 wv.220.desc1:0 "\n\nThe Gellazanian broker's agent met us on the wharf, counted our consignment, paid us, and thanked us so warmly that our purser tried to tip him. #G The freight from Zewggadmeza is paid.#!"
 wv.220.desc2:0 "\n\nThe Gellazanians could not persuade [SCOPE.sChar('wv_pupil').GetName|Y] of anything. She wrote down what they said, word for word, and read it back to them, and somewhere around the second paragraph they always lost their nerve."
 wv.220.desc3:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] was the only one of us the Gellazanians could not persuade of anything. He agreed with everything they said and did none of it, which they found deeply unsettling."
 wv.220.desc4:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] was persuaded to buy three things he did not want, and then sold all three on the same street for a profit before supper."
 wv.220.desc5:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] and a teacher from the Psiddisamman School spent an evening trying to persuade each other of things, very politely. Neither of them would say who won."
 wv.220.e:0 "Buy a small supply of Stores, and nothing else, whatever they say."
 wv.220.f:0 "Buy a larger supply of Stores."
 wv.220.g:0 "Wait offshore, out of earshot."
 wv.220.h:0 "Sail on to Corcantina."
 wv.220.i:0 "Back to the ship, before anyone explains anything else."
 wv.220.t:0 "Nobody Haggles in [GetProvince('(int32)2769').GetName|G]"
 wv.221.a:0 "Give him a berth."
 wv.221.b:0 "Give him a berth, though every berth is taken."
 wv.221.c:0 "Leave before the next clause."
 wv.221.desc:0 "A pupil of the School was sitting on the steps with our freight bill, reading it aloud to anyone who would listen, for practice. By the time he reached the penalty clause our mate was nodding along and reaching for his purse, convinced that the penalty ought to be paid in advance, out of simple fairness. An older pupil put a hand on the boy's arm and said, 'That's enough,' and our mate came back to himself with a jolt.\n\nThe older one was called Charias. Emperor Andenn's ban had kept the School from certifying him, he said, because he passed every examination too easily and the examiners did not trust the result. Now that he could not persuade the School of anything, he would like to see the world. He asked nothing for his passage but a berth and a share of the Stores, and he asked so reasonably that our purser had agreed before Charias finished speaking."
 wv.221.desc1:0 "\n\n[SCOPE.sChar('wv_appr').GetName|Y] came aboard with one bag and stood at the rail looking back at the School for a long moment. Then he turned to our purser and apologized, sincerely, for the hat."
 wv.221.t:0 "The School Steps"
 wv.222.a:0 "Hear about the glue, all of it."
 wv.222.b:0 "Buy treated papyrus for our charts."
 wv.222.c:0 "Leave the sheet in the bucket."
 wv.222.desc:0 "Corcantinan papyrus sells on this wharf at Arteon prices, and the Corcantinaean merchants will tell you at length why it is worth them, starting with the reeds and finishing an hour later with the glue. A chartmaker at the end of the wharf sold sheets treated with something that smelled of fish and cedar. Charts drawn on it, he said, would survive a soaking that would turn ordinary paper back into reeds, and he dropped a sheet into a bucket of seawater to prove it, and left it there while he talked."
 wv.222.desc1:0 "\n\nWhen we left, an hour later, the chartmaker took the sheet out of the bucket and showed it to us. The ink had not run."
 wv.222.t:0 "The Papyrus Wharf"
 wv.223.a:0 "Laugh, and walk on."
 wv.223.b:0 "Buy one charm, for one hard bargain."
 wv.223.c:0 "[SCOPE.sChar('wv_envoy').GetName|Y] listens to the pitch, and repeats it back to the seller word for word."
 wv.223.d:0 "Back out into the smoke."
 wv.223.desc:0 "In a covered court behind the colonnade, the students who failed out of the School sell what they learned there, by the hour. A woman with silver rings on every finger offered to make one face in any room trust us completely for the length of a single conversation. She said it so kindly that our bosun bought two charms before the purser could stop him, and then had to be talked back out of them, which took an hour and a third charm."
 wv.223.desc1:0 "\n\n[SCOPE.sChar('wv_appr').GetName|Y] would not come into the court. He said he could not bear to watch it done badly."
 wv.223.desc2:0 "\n\nThe seller listened to her own patter come back at her in her own voice, laughed until she had to sit down, and pressed a charm into [SCOPE.sChar('wv_envoy').GetName|Y]'s hand for nothing."
 wv.223.t:0 "The Charm Market"
 wv.230.a:0 "Into the oldest Pyramid."
 wv.230.b:0 "To the Armored School on the causeway."
 wv.230.c:0 "To the Pomegranate Throne."
 wv.230.d:0 "Buy a small supply of Stores, and a sack of dates."
 wv.230.desc:0 "The Pyramids of [GetProvince('(int32)2805').GetName|G] are older than anything else our sailors had ever seen, and they are not finished being old. Every year the flood comes up to them and leaves a line of dark silt on the stone, and the lines climb the faces like the rings of a tree: hundreds of them, then thousands, until the oldest are too faint to count. A child can stand at the foot of a Pyramid and put her hand on a flood that came before there were kings in Baetep.\n\nThe sun here does not shine so much as lean on you. By noon the stones were too hot to touch, the village dogs lay flat in the shade of the walls with their tongues in the dust, and the only things moving on the whole plain were the dragonflies and the Sertem governor's tax collector, who is said to feel neither heat nor shame. The people of Tariku bow to the governor's officers exactly as deeply as the law requires. When the officers have gone home they leave dates and little cakes of red dye at the shrines of the old gods, and nobody in the village sees any contradiction.\n\nThe dates were the best our crew had ever eaten, and the dye got on everything. Some of our sailors would go home to Cuwa with red palms to match their blue fingernails."
 wv.230.desc1:0 "\n\n[SCOPE.sChar('wv_pupil').GetName|Y] counted the flood lines on the oldest Pyramid, as far up as she could see them, and did a sum on the corner of her sheet. Then she crossed the sum out, very firmly, and would not say what the answer had been."
 wv.230.desc2:0 "\n\n[SCOPE.sChar('wv_appr').GetName|Y] spent ten minutes in the shade with the Sertem tax collector, talking about nothing in particular. Afterward the collector forgot to tax the village's dates. He seemed happy about it, and puzzled."
 wv.230.desc3:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] looked up at the flood lines on the Pyramid and read them like a tide table: this year high, that year low, and that one there, he said, must have taken a village."
 wv.230.desc4:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] bought a sack of dates for almost nothing, and was given another sack for free, and spent the rest of the day trying to work out how he had been cheated."
 wv.230.desc5:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] spoke to the old women at the shrines of the old gods in their own tongue, and they gave her a little cake of red dye, which she would not wash off."
 wv.230.e:0 "Buy a larger supply of Stores. They are cheaper here than anywhere."
 wv.230.f:0 "Back down the flood road to Gellazani."
 wv.230.t:0 "The Pyramids of [GetProvince('(int32)2805').GetName|G]"
 wv.231.a:0 "Hear the Djedhid visitor out."
 wv.231.b:0 "Pay the keeper for a rubbing of both names."
 wv.231.c:0 "Back out to where the sun is waiting."
 wv.231.desc:0 "Inside the low passage at the foot of the oldest Pyramid it is cool and smells of bats. The keeper lit his lamp at the place where its light reaches two names cut into the same stone, one above the other, in two different scripts. A Djedhid visitor in a plain linen robe was standing there reading them.\n\nHe read the older name first, aloud. Then he read the newer one, which belonged to a Sertem governor, and then he read the older one again, slowly, as if to make sure it was still there."
 wv.231.t:0 "Two Names on One Stone"
 wv.232.a:0 "Watch from the shade."
 wv.232.b:0 "Put our marines through the causeway."
 wv.232.c:0 "[SCOPE.sChar('wv_vet').GetName|Y] asks to run it once, in his own mail."
 wv.232.d:0 "Leave them to the sun."
 wv.232.desc:0 "Warriors still train beside the Pyramids as they did in the days of the Pharons: in full armor, at noon, in heat that made our crew sweat just watching from the shade. They run the length of the causeway, turn, and run it again. The sergeant who sets the pace runs in armor too, which is the only reason anyone obeys him."
 wv.232.desc1:0 "\n\n[SCOPE.sChar('wv_vet').GetName|Y] ran the causeway twice, the second time because the sergeant said he had not been watching the first. He came back purple and dripping, and for the first time since the inn he was grinning."
 wv.232.t:0 "The Armored School"
 wv.233.a:0 "Bow, and leave the king to his waiting."
 wv.233.b:0 "Present a Stellaric Stater, with its star falling into the sea."
 wv.233.c:0 "[SCOPE.sChar('wv_envoy').GetName|Y] presents the Stater, and explains the star in the steward's own tongue."
 wv.233.d:0 "Back away from the dais, bowing, without turning round."
 wv.233.desc:0 "The Pomegranate Throne waits under a cloth in its holy place for a Djedhid Pharon to sit on it, and the cloth itself is older than Cuwa. A Djedhid steward with a fan of white feathers led us to the edge of the dais and no farther. He asked, courteously, what Wakvircu would bring as a gift to a king who has everything and is still waiting for the rest."
 wv.233.desc1:0 "\n\nThe steward turned the coin to the light, twice, and studied the star plunging into the sea. Then he took a ring from his own hand, a plain seal of the Djedhid house, and gave it to us in exchange. 'For when you come back,' he said. 'The king will have sat down by then.'"
 wv.233.t:0 "The Pomegranate Throne"
 wv.240.a:0 "Bring our proof forward and settle it on the spot."
 wv.240.b:0 "[SCOPE.sChar('wv_envoy').GetName|Y] argues the case on the collector's own papyrus."
 wv.240.c:0 "Post surety, and sail before the sixth sheet."
 wv.240.d:0 "Pay the duty, and let the man write."
 wv.240.desc:0 "The wind at [GetProvince('(int32)3031').GetName|G] comes off the dry plains hot and full of grit, and it never stops. All along the waterfront the papyrus hangs on drying racks taller than a man, thousands of pale sheets snapping and cracking in the wind like sails, so that the whole town sounds like a fleet getting under way. Everything smells of reed sap and fish glue. Corcantina settles every argument on papyrus, and every sheet of papyrus starts another argument.\n\nOn the jetty the collector had detained a coastal crew over grain they swore came from #G Tamrat#!, and he had already written four sheets about it. A porter sat on a bollard eating his dinner and watching. Then one of the men in irons pointed at him: the porter knew where the grain came from, he shouted, because the porter had helped load it.\n\nThe porter put down his dinner. The collector turned to us, because our own hold had been filled at Tamrat, and began a fifth sheet."
 wv.240.desc1:0 "\n\nThe Tamrat boatman, who had come down the coast with us for the ride, stood up beside the porter. 'I know it is Tamrat grain,' he said, 'because those are my daughters' sacks.' The collector looked at the sacks, which were mended in a way no other sacks are mended, and put down his pen."
 wv.240.desc2:0 "\n\n[SCOPE.sChar('wv_appr').GetName|Y] leaned over the collector's shoulder, read the fifth sheet, and said one sentence about it, very quietly. The collector looked at the sentence for a long time, and then tore up all five."
 wv.240.t:0 "A Witness on the Jetty"
 wv.250.a:0 "Watch the first boat go out."
 wv.250.b:0 "Stand the fishers a season's bait money."
 wv.250.c:0 "Hire a steersman for the Intergealian crossing."
 wv.250.d:0 "Hire the crossing steersman, who has heard about the boat in the dark."
 wv.250.desc:0 "You smell [GetProvince('(int32)3212').GetName|G] before you see it: wet clay, wood smoke and hot glaze from the kilns along the shore, where the potters fire their blue ware day and night, so that the low clouds over the harbor glow faintly orange after dark. Fresh mortar is drying on half the walls in the city. Phrytheria is the capital of a young kingdom, and it is building itself as fast as it can. King Naravas has put up so much scaffolding that the scaffolders have formed their own guild, and the guild has already been on strike once. Horses and camels share the quay. The camels have opinions about the horses, and express them.\n\nWe had arrived on the morning of the spring launch. The first boat out each year carries the #T Glazed Fish#! on its prow, a fat fish of blue-glazed clay with golden scales, as an offering to the sea, and the boat that carries it pays no harbor tax for the whole season. Half the city prays to Zanis and half to Hellas, and on this one morning every one of them came down to the water to pray to the fish. The freight master stood on the dock calculating, aloud, how much of the prow the skipper might let him rent."
 wv.250.desc1:0 "\n\n[SCOPE.sChar('wv_appr').GetName|Y] watched the fishers signal from boat to boat with shuttered lanterns, and by the third signal he could read them. 'It is not a code,' he said. 'It is a conversation. That one is complaining about his brother-in-law.'"
 wv.250.e:0 "Follow the fish out of the harbor, then set a course for the Snakefolk Isles."
 wv.250.t:0 "The Spring Launch at [GetProvince('(int32)3212').GetName|G]"
 wv.3.a:0 "Two coins in Ying-Pin's bowl, in case one is too small."
 wv.3.b:0 "Stow a flask of Bloody Peninsula brandy for the bad nights."
 wv.3.c:0 "Cast off."
 wv.3.desc:0 "The whole Harbor District came down to see us off, and a good part of it came down to sell us things. Fishwives held up strings of dried eel, two boys offered to carry anything to the ships for a copper apiece, and a priest of #T Ying-Pin#!, Commander of Storms, stood beside his offering bowl with the patience of a man who knows that every sailor reaches it eventually. Our crew still had the blue of the dye vats under their fingernails. It would go halfway round the world with them before it wore off, and in every port from here to World's End it would tell people where they were from before they opened their mouths.\n\nThe night before, a storm had come in off the sea after dark and thrown our flagship against the dock until her rail splintered and her seams wept. The carpenters worked by lantern light until dawn, and by the time the crowds arrived they had pumped her dry and patched the worst of the planking, but she still sat a little low by the stern and groaned when the swell lifted her. Some of the older hands muttered that Ying-Pin had taken his offering early, and that a ship hurt before she leaves harbor seldom comes home whole. The bosun told them that the tide would not wait for omens, and that neither would the debtors at World's End. We would sail on the morning tide all the same.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] walked down to the last mooring post to see [SCOPE.sChar('wv_envoy').GetName|Y] aboard. There were no speeches. The Guildmasters distrust speeches, and had sent a ledger instead. It was bound in sealskin, and the first page had already been filled in."
 wv.3.desc1:0 "\n\nThe priest looked at the second coin, then at our bosun, and nodded as if a debt had been paid on time."
 wv.3.t:0 "The Wharf at [ROOT.GetCountry.GetCapital.GetName|G]"
 wv.300.a:0 "Hold our course across the sea."
 wv.300.b:0 "Bear down on the lantern."
 wv.300.c:0 "Heave to and wait for morning."
 wv.300.desc:0 "We had left the last lights of the coast behind when the lookout saw a lantern to leeward. It was low, much too low for a masthead, and our sailing master watched it rise and vanish between the waves, rise and vanish, which meant that whoever was holding it was in the water or very nearly. But it was moving against the wind. Somebody out there could still steer.\n\nThese waters belonged to the Phanician pirates until Cyrogelos the Loyal finished them. Our sailing master's grandfather sailed with Cyrogelos, and he still watches the dark for sails that stopped coming before he was born. He watched the lantern rise and fall nine times before he said that it was not one of theirs, and then he looked at [SCOPE.sChar('wv_envoy').GetName|Y] and waited."
 wv.300.desc1:0 "\n\nThe squall that had put the lantern there was still out there too. It had already put out our own stern lamp once, the way a hand pinches a candle, and our sailing master could feel it coming back in the soles of his feet."
 wv.300.desc2:0 "\n\nThe lantern began to blink: short, short, long. It was the fishers' code from Phrytheria. Somebody out there was saying, very calmly, that they were sinking."
 wv.300.desc3:0 "\n\n[SCOPE.sChar('wv_pupil').GetName|Y] was on deck before the lookout called, writing. 'The lantern is moving against the wind,' she said, without looking up. 'Whoever has it is not dead yet. Write that down for me, would you? My hands are cold.'"
 wv.300.t:0 "A Lantern to Leeward"
 wv.301.a:0 "Make room for them below."
 wv.301.desc:0 "We found them by the lantern, and then by their voices: four Vetalian fishermen clinging to the keel of an upturned boat, one of them holding the lantern up out of the water with an arm that had gone dead hours ago. When our crew pulled him over the rail he would not let go of it. He sat on our deck shaking, with the lantern in his lap, until our cook pried his fingers loose with hot broth.\n\nIn the morning, when they could talk, the fishermen drew our sailing master a bearing for the Morrigon coast on the back of a sail-patch, with the channels marked that are not on any chart: the safe way in through the reeds, the way their grandfathers had always come home."
 wv.301.t:0 "Out of the Water"
 wv.302.a:0 "Sail on for Morrigon."
 wv.302.desc:0 "We reached the place where the lantern had been an hour after it went out. There was a broken oar, a tangle of net, and a basket floating upside down, and nothing else. Our crew called until their voices went, and then the bosun called on his own for a long time after that.\n\nThe next morning the cook made something hot that nobody had asked for, and everybody ate it. The bosun took the broken oar we had pulled from the water and lashed it to the mast, and there it stayed until Cuwa."
 wv.302.t:0 "Only the Lantern"
 wv.310.a:0 "To the Oiling of the Champion."
 wv.310.b:0 "To the rope walk."
 wv.310.c:0 "To the Glass Wharf."
 wv.310.d:0 "Buy a small supply of Stores, and a skewer of something."
 wv.310.desc:0 "[GetProvince('(int32)2187').GetName|G] gets you by the nose first: meat smoke, wrestling oil, hot tar, and something sweet and resinous smoldering in little pots on every doorstep. Then it gets you by the ears. It was the week of the summer games, and the whole town had become a single roar. The Turisi, orcs and humans together, were packed so close along the quay that our gangway came down onto somebody's shoulders, and he carried it, and us, the last few yards, and asked for a copper.\n\nThey shout their bets in a language full of hard sounds and long names, Ampsicora and Similce and Abaraban, names that sound like old ships. The orcs are tall, tusked, scarred and enormously good-humored, and every third one we met offered to wrestle our bosun for his hat. He kept it, narrowly.\n\nIn the middle of all of it, in the shade of the great bronze Champion's plinth, a ring of orcs sat cross-legged on the stones with their eyes closed, perfectly silent, keeping the Inner Flame. The crowd flowed round them the way a river flows round rocks. Nobody stepped on them. Nobody even jostled them, not even the drunks. Orcs are prized as guards from here to the courts of emperors, a sailmaker told us, and the Narbolian ones know exactly what their silence is worth to hire."
 wv.310.desc1:0 "\n\nEvery orc on the dock wanted to wrestle [SCOPE.sChar('wv_vet').GetName|Y], and he refused them all with the same small shake of the head. The fourth one to ask was enormous and had a tusk capped in silver. Actmund looked him up and down, then bowed. The orc bowed back, and that was apparently a bout, and Actmund had apparently won it."
 wv.310.desc2:0 "\n\n[SCOPE.sChar('wv_diver').GetName|Y] walked twice round the bronze Champion, knocked on his calf with a knuckle, and announced to the crowd that the great wrestler was hollow. There was an awkward silence. Then the whole landing roared with laughter, and somebody bought him a drink, and somebody else tried to throw him into the harbor, and both of them were friends of his by nightfall."
 wv.310.desc3:0 "\n\n[SCOPE.sChar('wv_pupil').GetName|Y] spent an hour sitting at a careful distance from the orcs who keep the Inner Flame, watching their faces. She did not write anything. When one of them opened his eyes and looked at her, she looked back, and after a moment he nodded, and closed them again."
 wv.310.desc4:0 "\n\n[SCOPE.sChar('wv_appr').GetName|Y] would not bet on anything in Portua Narbolia. 'They are too honest,' he said. 'It would be like taking bread from a child, and then the child would break both my arms.'"
 wv.310.desc5:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] stood at the edge of the orcs' silent ring, and after a while sat down at the very edge of it and closed his eyes. Nobody stepped on him either."
 wv.310.desc6:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] bought a skewer of something, ate it, asked what it was, and was told. He finished it anyway, as a matter of principle."
 wv.310.desc7:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] could follow the bets being shouted across the square, and by evening she could shout them back, and the bookmakers began to look nervous."
 wv.310.e:0 "Buy a larger supply of Stores."
 wv.310.f:0 "Wait offshore and listen to the roar."
 wv.310.g:0 "Sail for Karali, under Mount Arteth."
 wv.310.h:0 "Back to the ship, and make for Mount Arteth."
 wv.310.t:0 "The Summer Games at [GetProvince('(int32)2187').GetName|G]"
 wv.311.a:0 "Watch, and shout for the smallest one."
 wv.311.b:0 "[SCOPE.sChar('wv_vet').GetName|Y] takes off his mail and steps into the ring."
 wv.311.c:0 "[SCOPE.sChar('wv_diver').GetName|Y] steps into the ring, still dripping."
 wv.311.d:0 "[SCOPE.sChar('wv_envoy').GetName|Y] steps into the ring, to everyone's alarm."
 wv.311.desc:0 "The Champion of Portua Narbolia is a blackened bronze wrestler, his arm cocked to throw and his face split in a grin that shows every tusk. Before the summer games the Turisi wrestle for the right to oil him, and the winner's name is scratched into the plinth with a nail, among hundreds of others. The oldest names have worn away under so many hands that they are only scratches now. The newest was three days old and still being celebrated.\n\nThe bouts were down to the last four, and the crowd wanted a foreigner. It began to chant something in our direction. Our sailing master, who speaks a little Turisi, translated it, and then wished he had not."
 wv.311.e:0 "Back through the crowd, hats on."
 wv.311.t:0 "The Oiling of the Champion"
 wv.312.a:0 "Hear the rest about Kinone."
 wv.312.b:0 "Buy the Narbolian towline."
 wv.312.c:0 "Walk back along the rope walk, forwards, for a change."
 wv.312.desc:0 "The rope walk runs the whole length of the harbor wall, a quarter of a mile of men walking slowly backward, twisting. The old rope seller at the far end remembered #Y Kinone#!, the explorer, who had come through years ago on his way round the world. 'He bought a line before he bought anything else,' the old man said. 'Before water. Before bread. He said you can always find water, but you can never find a rope at the moment you need one.'\n\nHe sold us the same line, he said, or one just like it: a towline of Narbolian hemp, heavy as sin and twice as strong, that would hold a sinking ship to a sound one."
 wv.312.t:0 "The Rope Walk"
 wv.313.a:0 "Buy a slot of glass for the market at Linupom."
 wv.313.b:0 "Take Ampsicora on, crate, rope and luck."
 wv.313.c:0 "Take Ampsicora on, though every berth is taken."
 wv.313.d:0 "Take Ampsicora on and put [SCOPE.sChar('wv_appr').GetName|Y] ashore."
 wv.313.desc:0 "A Turisi gambler had won a glassmaker's best crate of the season the night before, and had lost the boat he meant to carry it home in by breakfast. When the glassmaker came down to the harborside for an explanation, the gambler tipped his whole purse out onto a barrel, paid the glassmaker's apprentice first, and then turned to [SCOPE.sChar('wv_envoy').GetName|Y] with the air of a man who has just had an idea.\n\nHe proposed a three-way split on his next cargo: himself, us, and luck. He could bring his own crate, he said, and his own towline, and his own considerable charm. His name was Ampsicora. Behind him the glassmaker was offering us some of the rest of the season's glass, at a price, for anyone who could carry it to World's End and sell it there."
 wv.313.desc1:0 "\n\n[SCOPE.sChar('wv_gamb').GetName|Y] carried his crate aboard himself, on his shoulder, singing. He had the towline coiled round his waist like a sash. 'One of these will make us rich,' he told the bosun, 'and the other one will keep us alive long enough to enjoy it. I forget which.'"
 wv.313.desc2:0 "\n\n[SCOPE.sChar('wv_appr').GetName|Y] watched the gambler pay the apprentice first and said, very quietly, that it was a good trick, and that he had used it himself."
 wv.313.e:0 "Leave him to his luck."
 wv.313.t:0 "The Glass Wharf"
 wv.314.a:0 "Carry the nail home, and the hangover with it."
 wv.314.desc:0 "It took less time than anyone expected, including our champion. There was a lunge, a grunt, a great deal of dust, and then a Turisi giant was lying on his back on the stones, laughing so hard that he could not get up. The crowd lifted our champion onto its shoulders and carried him three times round the plinth.\n\nAn old orc with a nail scratched #Y Wakvircu#! into the bronze, slowly, in letters as deep as he could make them, and then handed us the nail. It is the custom, he said. The nail goes home with the name."
 wv.314.t:0 "A New Name on the Plinth"
 wv.315.a:0 "Put him to bed, and his pride with him."
 wv.315.desc:0 "It was over very quickly. Our champion went up into the air in a way none of us had known a person could, and came down in the dust in a way that made the crowd go 'ooh' all together, kindly. The Turisi who had thrown him helped him up, dusted him off, kissed him on both cheeks, and asked if he would like to try again next year.\n\nThey carried him back to the ship on a door. He insisted on walking the last ten yards, and nobody had the heart to tell him that he was walking in the wrong direction."
 wv.315.t:0 "Carried Home on a Door"
 wv.320.a:0 "Help him search."
 wv.320.b:0 "Pay him for the channel, and promise to look on the way back."
 wv.320.c:0 "Run for the harbor on our own bearing."
 wv.320.desc:0 "On the approach to Rhylgoyer the fog came down and the sea turned into reeds. They rose out of the water on every side, taller than our yards, and closed behind the ship as though she had never passed. Sound carried strangely. Our own oars sounded close and a bell sounded far away, and then the bell was close.\n\nIt was a skiff, coming out of the fog with its bell wrapped in cloth so that it rang soft. Its skipper was a Lelaichandi shipwright looking for his son, who had gone out after a morning's catch three days before and had not come back. The father knew where the channel turned, and he would show us. But first, he asked, would we make one more pass along the reeds with him, calling?"
 wv.320.desc1:0 "\n\nOur sailing master had the fishermen's sail-patch spread on his knee. The way through the reeds was on it, plain as a road."
 wv.320.desc2:0 "\n\n[SCOPE.sChar('wv_diver').GetName|Y] lay along the gunwale of the launch with his ear an inch above the water. Sound carries better below, he said. If the boy had oars, he would hear them."
 wv.320.desc3:0 "\n\nThe crew wanted to bet on whether the boy would be found. [SCOPE.sChar('wv_gamb').GetName|Y] would not take a single wager. He stood in the bows with a lantern for the whole search, calling the boy's name in Turisi, which carries."
 wv.320.t:0 "A Boat Through the Reeds"
 wv.321.a:0 "On to Rhylgoyer, all of us."
 wv.321.desc:0 "On the second pass a voice answered. It was thin and hoarse and it came from somewhere to port, and then the father was over the side of the skiff and wading, chest-deep, in the wrong direction, until our bosun turned him round by the collar. The boy was sitting in his swamped boat in the middle of a reed bed with his catch still in the bottom, three days' worth, very dead. He had refused to leave it.\n\nThe father did not speak again that night. He sat in the bow of the skiff with his son wrapped in his own coat, and every so often he reached out and touched the boy's head, as if to check that he was still there."
 wv.321.t:0 "A Voice in the Reeds"
 wv.322.a:0 "On to Rhylgoyer."
 wv.322.desc:0 "We made the pass, and another, and a third, until the fog went gray with evening. Nothing answered but the birds. At last the father thanked us, quite formally, and showed us the channel, as he had promised. When we left him he had turned his skiff back into the reeds. We could hear his bell long after we could no longer see him, soft, soft, and then not at all.\n\nNobody on our ship mentioned the boy again until Rhylgoyer. There the shipwright's wife came down to the wharf, looked at our faces, and went back up the hill without asking anything."
 wv.322.t:0 "The Bell Goes On Ringing"
 wv.330.a:0 "Promise his quay equal terms at the guildhouse."
 wv.330.b:0 "Pay for the berth in his yard."
 wv.330.c:0 "Take the berth he offers for his son."
 wv.330.d:0 "Hire the woman with no eyebrows."
 wv.330.desc:0 "The Lelaichandi built the harbor at [GetProvince('(int32)3635').GetName|G] by blowing a mountain open, and they have not stopped. Every few hours somebody on the cliff shouts a warning. Everyone in the town puts their hands over their ears without breaking off what they are saying, and the windows flex in their frames like the skin of a drum. The shipwright's yard is cut into the living rock, with the cradle for the keel sitting in a notch that was blasted to exactly its shape.\n\nThe shipwright walked twice round our hull with his hand on it, the way a horse dealer walks round a horse, and named every blow the sea had given us since Cuwa, in order. Then he offered us a berth in his yard. His price depended on one thing: whether the boats from his waterfront could use our new guildhouse at Linupom on the same terms as Linupom's own.\n\nWaiting by the yard gate was a woman with no eyebrows, a smell of saltpeter, and a list of the houses on the harbor street whose windows she owed. Her name was Brenwen. She would have blown the reef open to get the shipwright's son's boat out, she said, if anyone had known where it was."
 wv.330.desc1:0 "\n\nThe boy stood beside his father the whole time, wearing the coat, and when the shipwright got to the blow our hull had taken in the reeds the boy said 'that one was mine' and his father, for the first time, laughed."
 wv.330.desc2:0 "\n\n[SCOPE.sChar('wv_mage').GetName|Y] came aboard with a small cask under each arm and asked where we kept the fire. When she was told, she asked us to keep it somewhere else."
 wv.330.desc3:0 "\n\nOur purser walked the length of the harbor street with [SCOPE.sChar('wv_mage').GetName|Y]'s list, paying for windows. At every house the owner came out to shake her hand. One of them kissed her. She went the color of a boiled crab and walked back to the ship so fast that our purser had to run."
 wv.330.desc4:0 "\n\n[SCOPE.sChar('wv_diver').GetName|Y] and the shipwright argued about seams for an hour, in two languages and with both hands, until they agreed that everybody else in the world does it wrong."
 wv.330.desc5:0 "\n\n[SCOPE.sChar('wv_gamb').GetName|Y] bet Brenwen a gold piece that he could guess, to the breath, when the next blast would go off. He won twice. The third time she let him lose, and he paid up delighted."
 wv.330.e:0 "Hire Brenwen, though every berth is taken."
 wv.330.f:0 "Hire Brenwen, who will work cheap for the family of the boy she meant to save."
 wv.330.g:0 "Hire Brenwen, though every berth is taken."
 wv.330.h:0 "Pay [SCOPE.sChar('wv_mage').GetName|Y]'s window debts before we sail."
 wv.330.i:0 "Sail for World's End."
 wv.330.t:0 "The Harbor Blown Out of the Mountain"
 wv.400.a:0 "Wait for the full settlement, every coin of it."
 wv.400.b:0 "Take the early settlement, and the wardens' escort south."
 wv.400.c:0 "Out along the last mole."
 wv.400.d:0 "To the Warden's Hall."
 wv.400.desc:0 "There is nothing west of [GetProvince('(int32)3808').GetName|G]. You can see it from the harbor. The last mole runs out into the sea a long way, much farther than any mole needs to, as though the people who built it had wanted to get as close to the edge as they could. At the end of it there is a tavern with a painted sign. The sign says that it serves the last cup in the known world, and the tavernkeeper will tell you, if you ask, that he has checked.\n\nThe Lindute are descended from Helluvian families who fled the Nazani Empire long ago and were taken in here, at the end of everything, until the food ran short and hosts and guests had to learn to share it. Before our ropes were tied, a Lindute woman had pressed a bowl of fish soup into our purser's hands, and he had eaten half of it before anyone asked what we were selling. Their talk lilts like a hill song, all soft consonants and long vowels, and their names, Aeronwen and Aradoc and Annest, sound gentle until one of them is shouted across a harbor.\n\nOn the dock the Lindute wardens had set one of our Staters on a scale against a local weight, and were watching the needle. A carpenter with a mouthful of nails asked which mark we wanted carved over the door of the new house, which the guild's sealed escrow had already paid for. And the debtor's clerk, a nervous man with a box under his arm, said that he could settle part of the contract now, if that would help, or the whole of it, if we could afford to wait."
 wv.400.desc1:0 "\n\nThe woman from the Zewggad Exchange had a cousin in Linupom, of course. He was waiting on the wharf with her tariff schedule and a polite expression, and we paid him the forty gold before our gangway was fully down."
 wv.400.desc2:0 "\n\nThe Narbolian glass sold before it was off the ship. A Lindute tavernkeeper bought the lot and began setting it out on his shelves while our purser was still counting the money."
 wv.400.desc3:0 "\n\nThe full chest came down to the quay on a cart, with two wardens walking beside it, and it took six of our crew to lift it aboard. It sat in the hold like a second keel. Our sailing master looked at it, and then at the waterline, and said nothing in a way that everybody heard."
 wv.400.desc4:0 "\n\nThe early settlement fitted into a single chest that two men could carry. The wardens put their seals on it, and their captain said that his ships would see us safely down the southern coast."
 wv.400.desc5:0 "\n\n[SCOPE.sChar('wv_vet').GetName|Y] drank the last cup in the known world at the tavern on the mole, put the cup down, and took a flat flask out of his coat. 'In Werhen,' he told the tavernkeeper, 'we do not believe in last cups.' The tavernkeeper had one from the flask, and changed his sign the following week."
 wv.400.desc6:0 "\n\n[SCOPE.sChar('wv_mage').GetName|Y] walked the whole length of the last mole with her hands behind her back, looking at the stones, and came back and told the wardens how much longer she could make it. The wardens thanked her, politely, and asked her to please not."
 wv.400.desc7:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] stood at the end of the mole looking west until the tavernkeeper put the shutters up. When he came back he said only that the sea looked the same there as everywhere else."
 wv.400.desc8:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] sat down in the tavern on the mole and ordered the last cup in the known world, then haggled for it, and got it for half."
 wv.400.desc9:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] had the Lindute lilt by the second day. The wardens' wives said that she sounded like somebody's aunt, which in Linupom is a compliment."
 wv.400.e:0 "To the Market at World's End."
 wv.400.f:0 "Leave one of our company to keep the house."
 wv.400.g:0 "Take the road inland to Rhylpennewgo, where Zanis turned back."
 wv.400.h:0 "Sail south for Soveneria. Home is the long way round."
 wv.400.t:0 "The Last Cup in the Known World"
 wv.401.a:0 "Watch it go down, and take its bearing."
 wv.401.b:0 "Carve Szing-Szing over the door of the house."
 wv.401.c:0 "Carve the Lindute weight over the door, beside our Stater."
 wv.401.d:0 "Have the navigators take a proper reading for the cape."
 wv.401.desc:0 "We waited three nights at the end of the last mole for a clear one. On the fourth the cloud lifted at dusk. Our Stellaric priests went out to the very end of the stone with their lamps, and the tavernkeeper brought them out three cups without being asked.\n\n#T Szing-Szing#! went down into the west a little after midnight. In Cuwa it sets behind the Tayngvw Mountains, and every Stellaric child is taught that it goes down into the bay where the Visitors' star fell, to rest. Here it went down into an empty sea, with nothing behind it at all, and kept on going down until the water closed over it. Our senior priest stood with his cup in his hand and wept like a boy.\n\nThe Lindute fishermen mending their nets along the mole did not look up. They see it every night. One of them got up, quietly, and poured him another cup."
 wv.401.desc1:0 "\n\n[SCOPE.sChar('wv_pupil').GetName|Y] sat on the edge of the mole with her last sheet on her knee and did not write anything until the star was gone. Then she wrote a single word, folded the sheet, and would not tell anyone what it was."
 wv.401.desc2:0 "\n\nBefore they came in, the navigators took the star's bearing against the dark line of the southern coast and argued over it until dawn. They agreed, in the end, on what the cape would be like."
 wv.401.e:0 "Seal [SCOPE.sChar('wv_pupil').GetName|Y]'s sheets and send them home to the Academy from World's End."
 wv.401.f:0 "Back along the mole, before the cups run out."
 wv.401.t:0 "Szing-Szing Goes Down Into the Sea"
 wv.402.a:0 "Take the first voyage's papers."
 wv.402.b:0 "Ask the woman in the captain's coat where she is going next."
 wv.402.c:0 "Ask the prize captain to sail with us, though every berth is taken."
 wv.402.d:0 "Hire her and put [SCOPE.sChar('wv_gamb').GetName|Y] ashore."
 wv.402.desc:0 "The debtor came to the Warden's Hall in person, with his clerk carrying the box, and before he had said a word to us he asked whether he might have his bag back afterward. His silver had been brought up from the strongroom by a tall Lindute woman in a sea captain's coat, and one of the bags still bore the seal of a ship she had taken as a prize, years ago, off the Lindom coast. She did not answer him. She tipped the bag out onto his own scales, every coin, and handed him the empty bag.\n\nWhile the wardens counted, the debtor's clerk drew [SCOPE.sChar('wv_envoy').GetName|Y] aside. The contract had been paid once already, he said. Eighty years ago, to a Stellaric captain who sailed for home round the cape and never arrived. He still had her receipt, in a captain's hand. He wondered whether anyone in Cuwa had ever gone looking for her."
 wv.402.desc1:0 "\n\n[SCOPE.sChar('wv_prize').GetName|Y] wanted a berth east, she said, where the captains whose prizes she had taken had fewer cousins. She knew the southern coast, and she knew how a chest is divided when a ship has to be lightened, which she had done, she said, more often than she liked."
 wv.402.desc2:0 "\n\nThe tall woman in the captain's coat glanced at our single small chest, and then at us, and went back to her counting. She was looking, a warden told us, for a ship that was carrying the whole of it."
 wv.402.e:0 "Leave the debtor to his empty bag."
 wv.402.t:0 "The Warden's Hall"
 wv.403.a:0 "Buy a small supply of Stores at World's End prices."
 wv.403.b:0 "Buy a larger supply of Stores."
 wv.403.c:0 "Sell [SCOPE.sChar('wv_gamb').GetName|Y]'s crate of Narbolian glass."
 wv.403.d:0 "Let [SCOPE.sChar('wv_gamb').GetName|Y] stake some of the Purse on one game."
 wv.403.desc:0 "Everything in the market at World's End has come a very long way, and none of it is cheap. A cabbage cost what a goose costs in Cuwa. Our purser bought one anyway, for the novelty, and then wished he had bought two, because it was an excellent cabbage."
 wv.403.e:0 "Back to the dock, with one excellent cabbage."
 wv.403.t:0 "The Market at World's End"
 wv.404.a:0 "Count it before he spends any more."
 wv.404.desc:0 "[SCOPE.sChar('wv_gamb').GetName|Y] lost the first two throws on purpose, he said afterward, to make the other players comfortable. Then he won everything on the table, apologized to everyone at it, and bought the whole tavern a round with part of the winnings, which is how he came to be carried back to the ship on the shoulders of the men he had just robbed."
 wv.404.desc1:0 "\n\nOne of the men he had beaten came aboard in the morning with a basket of the last oranges in the known world, and said that he had not lost so pleasantly in years."
 wv.404.t:0 "Luck, Settled"
 wv.405.a:0 "Write it in the ledger under 'education'."
 wv.405.desc:0 "[SCOPE.sChar('wv_gamb').GetName|Y] lost. He lost cheerfully, completely and at once, and came back to the ship whistling. 'The dice at World's End are honest,' he told our purser, with deep respect. 'I had heard it, and I did not believe it.'"
 wv.405.desc1:0 "\n\nThat evening the Lindute who had won his money bought the whole crew a round with it, and toasted Ampsicora by name, and Ampsicora toasted him back. Our purser, who had to enter the loss in the ledger, did not drink."
 wv.405.t:0 "Luck, Unsettled"
 wv.406.a:0 "Present him openly. We are not ashamed of our people."
 wv.406.b:0 "Hide him below decks until we sail."
 wv.406.desc:0 "Linupom is a Zanazi city, and in Zanazi cities the harbor office keeps lists. The clerk who came out to our ship to take the mooring fee looked at [SCOPE.sChar('wv_appr').GetName|Y], then at a sheet of paper in his hand, then at [SCOPE.sChar('wv_appr').GetName|Y] again, and asked politely whether the gentleman had ever studied at the Psiddisamman School. Emperor Andenn's ban reaches a very long way. It reaches, it seems, all the way to the end of the world.\n\n[SCOPE.sChar('wv_appr').GetName|Y] smiled at the clerk and said nothing at all, which for him was a very great effort."
 wv.406.t:0 "A Face on a List"
 wv.407.a:0 "Leave [SCOPE.sChar('wv_vet').GetName|Y] to keep the walls."
 wv.407.b:0 "Leave [SCOPE.sChar('wv_diver').GetName|Y] to keep the pearl trade."
 wv.407.c:0 "Leave [SCOPE.sChar('wv_pupil').GetName|Y] to keep the observatory."
 wv.407.d:0 "Leave [SCOPE.sChar('wv_appr').GetName|Y] to keep the townsfolk."
 wv.407.desc:0 "The new house stands at the landward end of the mole, with its roof on and its shutters still unpainted. The carpenters are already arguing about the color. It needs someone to keep it: someone to sit behind its counter and keep its accounts, keep its books, and keep its promises to the Lindute when the ships from Cuwa are a year away.\n\nWhoever we leave here will not come home. They will have the house, and the last tavern, and Szing-Szing going down into the sea every night, and the house will be the better for whatever they bring to it."
 wv.407.e:0 "Leave [SCOPE.sChar('wv_gamb').GetName|Y] to keep the accounts."
 wv.407.f:0 "Leave [SCOPE.sChar('wv_mage').GetName|Y] to keep the harbor works."
 wv.407.g:0 "We will all go home together."
 wv.407.t:0 "A Master for the House at World's End"
 wv.500.a:0 "Read the messenger's name aloud from the Gevanni summons."
 wv.500.b:0 "Pay the keeper for a rubbing of the stone."
 wv.500.c:0 "Ask the assistant whether she would like to see something no one has written down yet."
 wv.500.d:0 "Ask the assistant to come, though every berth is taken."
 wv.500.desc:0 "The shrine at [GetProvince('(int32)4054').GetName|G] is small, because Zanis was not yet anyone when he stood here. It lies inland, up in iron country, where the hills are rust-red and the streams run orange, and the Chruchi smiths can be heard hammering half a valley away. A stone marks the place where the young general turned back. The keeper has told the story of that turning so often that he tells it badly, with the good parts in the wrong order.\n\nOne of our company asked him who had come to fetch Zanis home. The keeper opened his mouth and closed it again. He had been showing the stone for twenty-two years, he said, and nobody had ever asked him the messenger's name.\n\nHis assistant, a young Chruchi woman with ink on her fingers and a rubbing tucked under her arm, laughed out loud. She knew every inscription at the shrine, she said, except the one that forbade climbing on it."
 wv.500.desc1:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] unfolded the copy from Gevanni and read the name at the bottom aloud, in the place where the messenger had said it first. The keeper wrote it down on the back of his hand. Then he said, slowly, that [SCOPE.sChar('wv_envoy').GetName|Y] had come farther than Zanis ever had, and he did not seem to know whether that was a compliment."
 wv.500.desc2:0 "\n\n[SCOPE.sChar('wv_hunter').GetName|Y] came down the hill at a run with a bag on her back and the missing corner of a rubbing in her hand. 'Every inscription in this valley has been read,' she said. 'Where you are going, nobody has read anything.'"
 wv.500.desc3:0 "\n\nIt was [SCOPE.sChar('wv_pupil').GetName|Y] who asked the keeper the messenger's name. When he could not answer, she looked so pleased that the keeper's assistant laughed out loud."
 wv.500.e:0 "Back down the iron road to the ships."
 wv.500.t:0 "Where Zanis Turned Back"
 wv.510.a:0 "Cut it free, cargo and all."
 wv.510.b:0 "Brace the load and dig him out by hand."
 wv.510.c:0 "Send [SCOPE.sChar('wv_diver').GetName|Y] in under the chests."
 wv.510.d:0 "Send [SCOPE.sChar('wv_vet').GetName|Y] in to hold the load on his back."
 wv.510.desc:0 "On the passage from Soveneria to Zemmairthia a sling parted as the ship rolled, and a stack of cargo came down across the hold. The clerk who had been standing under it was down between the chests, pinned by the legs and very calm about it, the way people are calm in the first minute before it starts to hurt. The whole load had shifted to port, and it was taking the ship's list with it.\n\nThe carpenter said that they could get the clerk out by cutting the lashings and letting the load go over the side, but that he would rather not be the one who explained it to the purser."
 wv.510.desc1:0 "\n\nThe wardens' ships kept us company down the southern coast, as their captain had promised, and steered us round every shoal and rock on the way."
 wv.510.desc2:0 "\n\n[SCOPE.sChar('wv_prize').GetName|Y] stood at the steering oar for most of the southern passage, naming every shoal before the leadsman found it."
 wv.510.desc3:0 "\n\n[SCOPE.sChar('wv_mage').GetName|Y] looked at the chests, and at the clerk, and offered to blow the load clear in one go. 'He will not feel a thing,' she said, and then, more honestly: 'He will feel something.'"
 wv.510.desc4:0 "\n\nWhile the crew worked on the load, [SCOPE.sChar('wv_hunter').GetName|Y] was reading the merchants' marks on the chests aloud, one by one, and telling us who had shipped each of them, and from where, and who had probably been cheated."
 wv.510.t:0 "The Chest Overhead"
 wv.520.a:0 "To the palace wall, and the Riders."
 wv.520.b:0 "To the warrant office."
 wv.520.c:0 "To the victuallers' market."
 wv.520.d:0 "Buy a small supply of Stores, and do not argue the price."
 wv.520.desc:0 "Every man on the waterfront at [GetProvince('(int32)4588').GetName|G] was armed, and so was every woman, and so, we found out later, was the cook at our lodging, who kept a knife in her hair. The Dragkhans have an old saying: to be born Dragkhanic is to live with one foot in the grave. They say it cheerfully, the way other people say good morning.\n\nThe courtesy is extraordinary. When a Dragkhan officer stopped our purser on the landing, he did it with a bow so deep that his scabbard touched the stones behind him. He asked to see our papers as though he were asking a great favor, and thanked us for them as though we had saved his life. Our bosun bowed back so deeply that two men had to help him straighten up. The Jazari of the court were slave-soldiers once, sold off to fight other people's wars. Now they own the families who sold them, and are unfailingly kind to them, which the families find much harder to bear.\n\nAnd the whole court was packing. The emperors of Zemmairthia move their court whenever they please, so the city has a permanent smell of straw from the packing crates. Earthenware went into the straw by the cartload, furniture went out of the palace windows on ropes, and on the palace wall the tilers had begun to take down the Glazed Riders, one tile at a time."
 wv.520.desc1:0 "\n\n[SCOPE.sChar('wv_appr').GetName|Y] bowed to a Dragkhan officer with such exquisite courtesy that the officer bowed back, and then could not stop, and the two of them went on bowing to each other down the whole length of the harborside while the crew placed bets."
 wv.520.desc2:0 "\n\n[SCOPE.sChar('wv_gamb').GetName|Y] found a dice game on the Zemmairthia waterfront within an hour. Every player at the table had a knife on the table beside his cup. He won one throw and lost the next three on purpose, and afterward he called it the best night of his life."
 wv.520.desc3:0 "\n\n[SCOPE.sChar('wv_mage').GetName|Y] watched the tilers take down the Glazed Riders with something close to awe. 'I could never do that,' she said. 'I would want to know what happens if you drop one.'"
 wv.520.desc4:0 "\n\n[SCOPE.sChar('wv_hunter').GetName|Y] stood under the Glazed Riders reading the potters' marks on the backs of the fallen tiles. One of them, she said, had been signed by a woman who wanted it known that she had done the horses, and not her brother."
 wv.520.desc5:0 "\n\nThe harbor master of Zemmairthia knew [SCOPE.sChar('wv_prize').GetName|Y] by sight, and gave her the best mooring on the waterfront without being asked. She did not say why. He did not say why. The crew decided not to ask."
 wv.520.desc6:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] bowed to the Dragkhan officers exactly as deeply as they bowed to him, not a finger lower, and they treated him all week as a dangerous man."
 wv.520.desc7:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] asked a Jazari quartermaster how much the court spent on straw in a year, and the quartermaster told him, and both of them looked shaken."
 wv.520.desc8:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] learned the Dragkhan greeting on the first morning and used it on everyone. By the second morning the officers had started to bow to her first."
 wv.520.e:0 "Buy a larger supply of Stores."
 wv.520.f:0 "Wait offshore, out of bowshot."
 wv.520.g:0 "Sail on for Kyaxares."
 wv.520.h:0 "Back to the ship, bowing all the way."
 wv.520.t:0 "One Foot in the Grave"
 wv.521.a:0 "Lend them our shipwrights."
 wv.521.b:0 "[SCOPE.sChar('wv_vet').GetName|Y] goes up the ladder to take the weight."
 wv.521.c:0 "Back away from the wall, slowly."
 wv.521.desc:0 "The tilers of Zemmairthia are paid as well as generals, and the reason was on the palace wall: a long panel of glazed tiles, horsemen in red and blue under a border of white rosettes, which the court takes down and resets every time it moves. The master tiler had numbered every tile in chalk. When the last panel shifted, a crack ran down a horse's flank like lightning down a summer sky, and the workman on the ladder below caught the whole panel against his chest with both arms and stood there, not breathing.\n\nThe court clerk shouted for a carpenter. Our shipwrights were the only ones near enough to hear him."
 wv.521.desc1:0 "\n\nThe court's own shipwrights repaired our hull afterward, without being asked and without presenting a bill. A Dragkhan does not owe anyone a debt overnight, the clerk explained, because a Dragkhan may not live until morning."
 wv.521.t:0 "The Riders Come Down"
 wv.522.a:0 "Carry the warrant to Kyaxares."
 wv.522.b:0 "Buy the cracked rider, straw and all."
 wv.522.c:0 "Leave the breeder to her negotiation."
 wv.522.desc:0 "A Dragkhan officer was serving an imperial warrant on a Soventeir horse breeder for forty of her horses, for the army. She read the warrant all the way through, slowly, while the officer waited with his hands folded. Then she asked him, very politely, which of the officer's own relatives would be bringing the horses back.\n\nWhile they were negotiating, a court secretary asked whether our ship could carry a sealed copy of the warrant east to Kyaxares, for a fee in provisions. On the floor of his office, packed in straw and waiting to be thrown out, were the tiles of the last panel that had cracked in a move: a whole rider, red and blue, perfect except for a hairline crack through the horse's knee."
 wv.522.t:0 "The Warrant Office"
 wv.523.a:0 "Rest the company ashore for a day."
 wv.523.b:0 "Hire the victuallers to fill our hold."
 wv.523.c:0 "Leave the honey cakes to the courtiers."
 wv.523.desc:0 "The victuallers of the court market sell everything an army needs to move and everything a court needs to look as though it is not moving: hard bread, salt meat, pickled plums, dried fish in bales like firewood, and little cakes of honey and pepper that the courtiers eat in their carriages. The prices are southern prices, which is to say high. A Jazari quartermaster bought the whole of one stall while we were still asking what was in it."
 wv.523.t:0 "The Victuallers' Market"
 wv.525.a:0 "Pay him what the paper says she is worth."
 wv.525.b:0 "Our crew stands with her, all of it."
 wv.525.c:0 "Hand her over, and take the court's reward."
 wv.525.desc:0 "A man in a good coat stopped [SCOPE.sChar('wv_prize').GetName|Y] on the pier at Zemmairthia and called her by a name that was not hers. He was the brother, he said, of a captain whose ship she had taken off the Lindom coast twelve years before. He had a paper from the court which said that he was entitled to her, or to what she was worth, and four large men behind him agreed with the paper.\n\n[SCOPE.sChar('wv_prize').GetName|Y] read the paper all the way through, as the horse breeder had read hers. Then she looked at us."
 wv.525.t:0 "A Name That Was Not Aeronwen"
 wv.530.a:0 "Up the steps of the tomb."
 wv.530.b:0 "To the pilgrims bound for Makok."
 wv.530.c:0 "To the Zaraken factor's house."
 wv.530.d:0 "Buy a small supply of Stores. There will be no more."
 wv.530.desc:0 "In [GetProvince('(int32)4662').GetName|G] the keepers sweep the steps of the tomb of #Y Jaoz the Bold#! every morning, as they have every morning since Bachin buried his friend here. They see no reason to stop just because Jaoz has left. The coalition that took the city in 946 carried the tomb away to Makok, walking it back in stages, and the villages came out to the roadside to watch it pass. The keepers swept the steps that morning too. The pilgrims who still gather here on their way to Makok are, strictly speaking, visiting him at his old address.\n\nThe spice market is the loudest in the south: cumin and saffron and black pepper by the barrow, cinnamon in rolled bark like scrolls, and a dealer in dried chilies whose stall made our sailors weep from twenty paces. There are camels everywhere, kneeling, complaining, being unloaded. The Zarakens welcome Helluvian merchants here, which their neighbors call heresy and the merchants call good business.\n\nThis is the last market before the cape. After Kyaxares there is nobody to sell us anything at all."
 wv.530.desc1:0 "\n\nWe handed the Dragkhan warrant to the Zaraken harbor master, who read it, laughed, and gave us a sack of dates for our trouble."
 wv.530.desc10:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] read the woman's father's name aloud for her, too, when the keeper had finished. The woman thanked her in Zaraken, and Luske answered in Zaraken, and they held each other's hands a moment on the steps."
 wv.530.desc2:0 "\n\n[SCOPE.sChar('wv_vet').GetName|Y] climbed the steps of the empty tomb with his helmet under his arm. He stood in the doorway a while, and then he helped the keepers sweep."
 wv.530.desc3:0 "\n\n[SCOPE.sChar('wv_diver').GetName|Y] looked out over the spice market and the camels and the dust, and asked where the sea was. When we pointed, he went and sat on the end of the jetty with his feet in it until we sailed."
 wv.530.desc4:0 "\n\n[SCOPE.sChar('wv_gamb').GetName|Y] bought a handful of black pepper in the market, sniffed it, sneezed, and offered the dealer odds that he could sell it in Cuwa for ten times the price. The dealer took the bet, and they shook on it with great solemnity."
 wv.530.desc5:0 "\n\n[SCOPE.sChar('wv_mage').GetName|Y] found a saltpeter dealer in the Kyaxares market and came back with a sack of it under each arm, very happy, and was asked to keep the sacks somewhere else."
 wv.530.desc6:0 "\n\n[SCOPE.sChar('wv_hunter').GetName|Y] found the place on the tomb wall where Jaoz's name had been cut and then cut again, deeper, by someone who wanted to make sure. She ran her fingers over the letters and was quiet for the rest of the day."
 wv.530.desc7:0 "\n\n[SCOPE.sChar('wv_prize').GetName|Y] sold a Zaraken captain the story of how she had taken her third prize, for the price of a fat goat, and told it so well that he bought the fourth one too."
 wv.530.desc8:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] would not go into the spice market. He said that the smell got into a man's charts."
 wv.530.desc9:0 "\n\n[SCOPE.sChar('wv_envoy').GetName|Y] came out of the spice market with his eyes streaming and his purse heavier, and would not explain either."
 wv.530.e:0 "Buy a larger supply of Stores. There will be no more."
 wv.530.f:0 "Wait offshore, and pray the gates open."
 wv.530.g:0 "Sail on for the cape, as we are."
 wv.530.h:0 "Back to the ship. The cape is waiting."
 wv.530.t:0 "Sweeping the Steps of an Empty Tomb"
 wv.531.a:0 "Sweep the steps with the keepers at dawn."
 wv.531.b:0 "Have the keepers read the names of our dead."
 wv.531.c:0 "Back down the swept steps."
 wv.531.desc:0 "The steps lead up to a small temple and a stone room with nothing in it. The keepers sweep the room anyway. A woman from the pilgrim road was there when we came in, with a book she had carried from home, and she asked one of the keepers to read her father's name aloud from it, here, where Jaoz had lain. He did. Then she asked him to read it again, and he did that too, and she thanked him and went back down to the road for Makok.\n\nFor an offering, the keepers said, they would read the names of our own dead in the same room, every morning, for a year."
 wv.531.t:0 "The Tomb of Jaoz"
 wv.532.a:0 "Stand beside him in front of the keeper until he is let in."
 wv.532.b:0 "Pay for his people's passage to Makok."
 wv.532.c:0 "Put our own shoes back on."
 wv.532.desc:0 "The pilgrims for Makok take off their shoes before they go up to the tomb, and leave them in a great ring on the stones of the square. A Zaindaxan captain stood outside the ring with his boots still on, because the keeper at the gate had asked to see a foreigner's papers, and he did not have any. His people waited behind him with their bundles: a dozen families who had come up the coast from the cape country, where, he said, nobody has papers, because nobody there has ever needed them.\n\nHe knew the cape, he said. He had sailed it every year of his life."
 wv.532.desc1:0 "\n\nIn the end it was [SCOPE.sChar('wv_appr').GetName|Y] who talked to the keeper at the gate, quietly, through two changes of the guard. The Zaindaxan captain went up the steps barefoot, with his people behind him, and Charias came back to the ship looking more tired than any of us had ever seen him."
 wv.532.t:0 "The Pilgrims for Makok"
 wv.533.a:0 "Read the old page with him."
 wv.533.b:0 "Refit in his yard."
 wv.533.c:0 "[SCOPE.sChar('wv_envoy').GetName|Y] refits in his yard, and haggles for her sake as well."
 wv.533.d:0 "Thank him, and leave the ledger closed."
 wv.533.desc:0 "The Zaraken factor recognized the Helluvian captain of our second ship by his father's name before the man had introduced himself, and poured him a cup of something black and sweet before he had sat down. When we asked about the next watering place on the cape road, the factor sent a boy for his father's old ledger, and turned the pages slowly until he found a ship that had watered there eighty years ago, outbound for Cuwa. A Stellaric ship.\n\nHe turned the page to see whether she had come back. She had not. He ran his thumb down the empty page, then closed the book, and offered to refit our hull in his yard at a price which, he said, was for her sake."
 wv.533.desc1:0 "\n\n[SCOPE.sChar('wv_pupil').GetName|Y] asked the factor's leave to copy the old page, and did it in her neatest hand, and pressed it flat between her last two sheets."
 wv.533.t:0 "A Ship in an Old Ledger"
 wv.539.a:0 "Stand well off the cape, if the black sea is coming."
 wv.539.b:0 "Round the cape."
 wv.539.desc:0 "The last Kyaxares fishing boat turned back at noon on the first day out, and her crew waved their caps at us until we could not see them. After that the coast was empty. Nobody lives on the cape road, the factor had told us, except the wind, and the wind does not trade.\n\nOur purser went down into the hold with a lamp and came back worried. What we had aboard would have to last us round the cape. The sailing master asked the carpenter to check the seams again before we left."
 wv.539.desc1:0 "\n\nOur navigators had read the cape at Linupom, and they had read it right. The sea ahead was going to be black."
 wv.539.desc2:0 "\n\nOur navigators had read the cape at Linupom. It would be rough, they said, but no worse than rough."
 wv.539.desc3:0 "\n\nOur navigators had read the cape at Linupom. They promised us a gentle sea, and looked as surprised about it as we were."
 wv.539.t:0 "The Cape Road"
 wv.600.a:0 "Follow the tracks inland."
 wv.600.b:0 "Ration what we have, and sail."
 wv.600.c:0 "Put out on the fair wind while it holds."
 wv.600.desc:0 "The well at Last Water is lined with good stone, cut square and fitted without mortar by someone who knew what he was doing. The bucket came up full of sand. Our crew stood round it in silence while the bosun let it down again, and again, and each time it came up full of sand.\n\nBeside the well someone had left the capstones stacked in a neat pile, small ones on top, so that whoever came next could move them alone. There were tracks in the sand, very old and half filled, leading inland toward a line of dunes."
 wv.600.desc1:0 "\n\nThe Zaraken factor's ledger had the answer. Eighty years ago the Stellaric ship had watered here too, and someone had written down where: not at the well, but at a spring under the dunes, an hour's walk inland, that the sand had never reached."
 wv.600.desc2:0 "\n\nWhoever went inland would not be going alone. Our best shore leader was already lacing up his boots, or hers."
 wv.600.desc3:0 "\n\n[SCOPE.sChar('wv_gamb').GetName|Y] offered the crew odds on the well, five to one against water. Nobody took the bet. He went inland with the shore party anyway, singing, with a shovel over his shoulder."
 wv.600.desc4:0 "\n\n[SCOPE.sChar('wv_hunter').GetName|Y] knelt by the old tracks and read them the way other people read a letter. 'They were tired,' she said. 'They were carrying something heavy between them. And they knew where they were going.'"
 wv.600.t:0 "Last Water"
 wv.601.a:0 "Fill every cask we have."
 wv.601.desc:0 "The tracks ran for an hour and stopped at the foot of a dune. Somebody dug, without much hope, and at the depth of his arm the sand turned dark, and then wet, and then there was water: cold, clean water seeping into the hole faster than he could bail it. The whole shore party lay down on its stomach and drank like dogs.\n\nSomebody had been here before us and had marked the place with a ring of stones, half buried now. In the middle of the ring was a Stellaric Stater, very old, worn almost smooth, with the star still falling into the sea."
 wv.601.t:0 "Water Under the Dunes"
 wv.602.a:0 "Back aboard, and say nothing about it."
 wv.602.desc:0 "The tracks ran for an hour and then ran out, as tracks do in sand, and the shore party walked for another hour after that because nobody wanted to be the one to say so. They came back at dusk with their tongues swollen and their casks empty, and the bosun had to be helped the last part of the way."
 wv.602.t:0 "Sand"
 wv.610.a:0 "Take two households aboard, and their guide."
 wv.610.b:0 "Trade for a bearing through the reef."
 wv.610.c:0 "Ask [SCOPE.sChar('wv_envoy').GetName|Y] to speak with the eldest in the old words."
 wv.610.d:0 "Carry the debt book home to Cuwa."
 wv.610.desc:0 "The answer to our signal fire came from higher ground than the fire itself. Our lookout saw it first: a light where the chart showed empty shore, then a second, then a third, set in a line along a ridge above the beach. In the morning we found three old windbreaks of stacked stone and driftwood, each as long as a ship, and behind them forty people counting their goats.\n\nThey let us in when the goats were counted. They spoke a coast tongue that none of us knew, but some of the words in it were Mikkosrie, and our senior priest went white when he heard them. The eldest woman of the camp went into her house and came back with two things wrapped in oilcloth: a Stellaric captain's seal, of the kind the Guildmasters gave out eighty years ago, and a debt book in a careful old [ROOT.GetCountry.GetAdjective] hand, whose last line read 'paid at Linupom, to be carried home'.\n\nThe eldest put her finger on the captain's name in the book, and then on her own breastbone, and said the name aloud, and it was the same name. Behind her the children had begun to sing to the goats. Our senior priest knew the tune. Every child in Cuwa knows it. It is the song you sing on the wharf for a ship that is late."
 wv.610.desc1:0 "\n\n[SCOPE.sChar('wv_hunter').GetName|Y] came back down from the old camp at sunset with sand in her hair and a sea chest on her shoulder. It had been the captain's. Inside it, wrapped in a shirt, was a brass astrolabe that still turned, and a page of notes in the captain's hand about a reef, and a cut through it, and a guide."
 wv.610.desc2:0 "\n\nThe two families came aboard with their goats, which our crew had not been told about. The children went straight to the bows and stayed there, pointing at the sea, as though it were the first time they had been on it, which it was."
 wv.610.desc3:0 "\n\n[SCOPE.sChar('wv_appr').GetName|Y] had learned enough of the coast tongue by evening to make the children laugh. By midnight he had learned enough to make the eldest cry, and he came back aboard and sat at the rail with his chin on his arms until the fires behind the windbreaks went out."
 wv.610.desc4:0 "\n\nIt was [SCOPE.sChar('wv_mage').GetName|Y] who lit our signal fire, and she lit it so well that the people behind the windbreaks thought for a moment the beach itself was burning."
 wv.610.desc5:0 "\n\n[SCOPE.sChar('wv_prize').GetName|Y] stood at the edge of the windbreaks with her coat pulled round her until the goats were all counted. Afterward she said that she had lost people on a coast like this once, and that nobody had ever come for them either."
 wv.610.e:0 "Leave the book and the seal with them, and a promise."
 wv.610.f:0 "Let [SCOPE.sChar('wv_hunter').GetName|Y] go up to the old camp with the eldest."
 wv.610.g:0 "Sail for the reef."
 wv.610.t:0 "A Light Where None Is Marked"
 wv.620.a:0 "Cut straight through and trust the hull."
 wv.620.b:0 "Follow the guide through the cut."
 wv.620.c:0 "[SCOPE.sChar('wv_mage').GetName|Y] blasts the cut wider."
 wv.620.d:0 "Stand offshore and go the long way round."
 wv.620.desc:0 "Past the windbreaks the reef runs out to sea in a long white line, and the only way through it is a cut no wider than two ships. Off the cut the lead line ran out against the wind, which our sailing master had never seen a lead line do. The guide lifted a child across the coil of rope and held out her hand for a knife. Our drummer, who keeps the time for the oars, stopped drumming without being told to, and in the quiet we could hear the reef breathing."
 wv.620.desc1:0 "\n\n[SCOPE.sChar('wv_pupil').GetName|Y] took one look at the water, wrote a single line on the back of her last sheet, and handed it to the sailing master without a word. It said whether there was a second break hiding behind the first. She asked to go out in the launch to make sure. Nobody let her."
 wv.620.desc2:0 "\n\nThe guide from the windbreaks stood in the bows with her knife in her teeth and one hand raised, ready to show us the way her grandmother had shown her."
 wv.620.t:0 "The Sounding Line"
 wv.621.a:0 "Count the damage, and the heads."
 wv.621.desc:0 "We were through the first line of surf when the second came out of nowhere, a wall of white water behind the first that nobody had seen because the first had hidden it. It took us broadside. For a long moment the whole ship lay over on her beam ends, and the sea came in green over the rail, and then she came up again, slowly, shaking herself like a dog, with half her bulwark gone."
 wv.621.t:0 "The Second Break"
 wv.622.a:0 "On for home."
 wv.622.desc:0 "We went through the cut with the reef boiling on both sides close enough to spit on, and came out into still water on the far side as suddenly as walking through a door. The crew cheered so loudly that the goats began to bleat. The sailing master sat down where he stood, on the deck, and stayed there for some time."
 wv.622.t:0 "Through"
 wv.630.a:0 "Keep the whole chest aboard, and make for Cuwa."
 wv.630.b:0 "Make for Cuwa with what we carry."
 wv.630.c:0 "Put something over the side to lighten her."
 wv.630.d:0 "Rig a tow between our ships."
 wv.630.desc:0 "The cape took us the way a dog takes a rat: by the neck, shaking. When it let us go we were round, and the coast ahead was the coast that runs north to Cuwa, and the ship was not keeping up. She was low in the water and slow to answer, and she groaned when she rolled. The carpenter came up from below with his sleeves wet to the shoulder and asked to speak to [SCOPE.sChar('wv_envoy').GetName|Y] alone, which is never good news.\n\nThe mate said that there was still room in the boats for the silver if they left the papers behind. [SCOPE.sChar('wv_envoy').GetName|Y] asked him to count the people still aboard first. Then [SCOPE.sChar('wv_envoy').GetName|Y] went to look at the chest.\n\nOur sailing master said the ship was taking water faster than he liked."
 wv.630.desc1:0 "\n\nNobody needed the carpenter to tell them. Every man aboard could feel her working under his feet, the seams opening and closing like a mouth."
 wv.630.desc2:0 "\n\nShe was sound enough, the carpenter said. It was only the weight. If we were lucky, it would only be the weight."
 wv.630.desc3:0 "\n\nThe Narbolian towline ran from our bow to the sound ship ahead of us, as thick as a man's arm and singing in the wind. The old rope seller had been right about the rope."
 wv.630.desc4:0 "\n\nThat night [SCOPE.sChar('wv_envoy').GetName|Y] opened the flask of Bloody Peninsula brandy that had come all the way from the Cuwa quay, and it went round the whole ship, a mouthful each. It was the best thing anyone had tasted since Mazos."
 wv.630.desc5:0 "\n\n[SCOPE.sChar('wv_prize').GetName|Y] looked at the chest, and at the waterline, and at the boats. 'I have divided worse cargoes in worse weather,' she said. 'Tell me when.'"
 wv.630.desc_odds_full:0 "\n\n#T The passage#!  Wreck risk: [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('wv_risk').GetValue|0Y]%. If she breaks up, the boats save half the chest [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('wv_rescue').GetValue|0Y]% of the time. Lightening the ship, dumping bulky cargo and rigging a tow all cut the wreck risk."
 wv.630.desc_odds:0 "\n\n#T The passage#!  Wreck risk: [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('wv_risk').GetValue|0Y]%. If she breaks up, the boats save the chest [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('wv_rescue').GetValue|0Y]% of the time."
 wv.630.desc_odds_empty:0 "\n\n#T The passage#!  Wreck risk: [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('wv_risk').GetValue|0Y]%."
 wv.630.desc_sunk:0 "\n\nThe carpenter did not finish his report. There was nothing left to caulk and nothing left to pump against, and the sea was already in the hold. #R The Hull is gone#!."
 wv.630.desc_spent:0 "\n\nThere were not enough hands left to work her round the coast, and the ones who were left had stopped answering the bosun. #R The Company is spent#!."
 wv.630.g:0 "Into the boats."
 wv.630.g.tt:0 "#R The ship founders before the last passage#!. If carrying a chest, roll to save a reduced chest worth #G 750 gold#! before deductions."
 wv.630.h:0 "Put in at the first beach that will take us."
 wv.630.h.tt:0 "#R The Company fails before the last passage#!. Lose the envoy, the fleet and the chest."
 wv.630.e:0 "[SCOPE.sChar('wv_mage').GetName|Y] braces the hull with powder and timber."
 wv.630.f:0 "Lighten the ship: send part of the chest home by the boats' weight, and keep the rest."
 wv.630.t:0 "The Ship That Cannot Keep Up"
 wv.631.a:0 "The Odedzan armillary goes over."
 wv.631.b:0 "The crate of Narbolian glass goes over."
 wv.631.c:0 "The Glazed Rider goes over."
 wv.631.d:0 "Not yet. Back on deck."
 wv.631.desc:0 "Everything aboard had come a long way to be here. The crew stood in the hold looking at it, and nobody wanted to be the first to put a hand on anything."
 wv.631.desc1:0 "\n\nThe navigators stood in front of the armillary with their arms folded, as though somebody might try it."
 wv.631.desc2:0 "\n\nThe cracked rider from Zemmairthia lay in its straw, red and blue, looking back at us."
 wv.631.t:0 "Over the Side"
 wv.632.a:0 "Into the boats."
 wv.632.desc:0 "She broke in the middle watch, with a sound like a tree coming down. There was time, just, to get the boats away. The crew went over the side in the order the bosun had drilled into them since Cuwa, people first, and then, if there was room, the chest."
 wv.632.t:0 "The Boats"
 wv.633.a:0 "Take Ampsicora's bet."
 wv.633.b:0 "Trust the boats."
 wv.633.desc:0 "[SCOPE.sChar('wv_gamb').GetName|Y] found [SCOPE.sChar('wv_envoy').GetName|Y] by the rail as the ship began to go, and grinned through the spray like a man who has been waiting all his life for exactly this. 'Forget the boats,' he said. 'The boats will save what they can carry, which is not much. Give me the chest and the sound ship's towline, and I will run her in for the coast under every rag we have. Win, and we split it down the middle. Lose, and there is nothing to split. Double or nothing. What do you say?'"
 wv.633.t:0 "Double or Nothing"
 wv.634.a:0 "Walk them home to Cuwa."
 wv.634.desc:0 "The boats came ashore on a beach north of the cape at dawn: everyone who had been in them, cold and silent, and between two of the thwarts of the bosun's boat, one small chest. It was the part of the settlement two men could lift. The rest was on the bottom with the ship. The bosun sat on it on the sand while the crew built a fire, and would not get up, and nobody asked him to."
 wv.634.t:0 "What the Boats Carried"
 wv.635.a:0 "Bring the people home, at least."
 wv.635.desc:0 "The chest went down with the ship. We watched it go, all of us, from the boats: the stern lifting, the long slow slide, and then nothing but a patch of white water and some timbers coming up one by one, like coins dropped into a well, the wrong way round. The sea had carried the debt of Linupom for eighty years once already. It would carry it a while longer."
 wv.635.t:0 "The Sea Keeps It"
 wv.636.a:0 "Half of something is still something."
 wv.636.desc:0 "[SCOPE.sChar('wv_gamb').GetName|Y] ran her in for the coast with the towline humming and every sail we had, half of them sewn to the other half, and the sea came up green over the bow at every wave. He sang the whole way. She grounded on a sandbar in sight of a fishing village, just as the last of her decks went under, and the chest was on the beach before the tide could take it. He sat down on it, out of breath, and counted it in front of everyone, in two equal piles."
 wv.636.t:0 "Ampsicora Wins"
 wv.637.a:0 "Home."
 wv.637.desc:0 "She held. She groaned and leaked and wallowed up the coast like an old cow coming home to the byre, and the carpenter did not sleep for nine days, but she held. On the tenth morning the lookout shouted from the masthead, and then the whole crew was shouting, because there in the north, under the mountains, was the smoke of Cuwa."
 wv.637.t:0 "She Holds"
 wv.700.a:0 "Let them come up from the waterfront."
 wv.700.desc:0 "The bells of the Harbor District began when our sails were sighted off the headland, and by the time we were tied up the whole city was on the dock, the same fishwives and boys and priests who had seen us go, and twice as many again. The Guildmasters had set a table on the harborside with a scale on it, and a stool for the envoy, and the key to the house at Linupom laid beside the scale. It was the spare.\n\nThe crew came up from the ships in a line, and Cuwa looked at them. They were thinner, and browner, and some of them had red palms from the dye of Tariku to go with the blue fingernails they had left with. The bosun called the harbor master 'sir' with a feeling nobody in Cuwa had heard before. A sailor ordered a drink at the first tavern on the wharf and asked for it the Lindute way, and was surprised to be looked at."
 wv.700.desc1:0 "\n\nThere were no ships to tie up. The crew had come home overland and on other men's decks, in ones and twos, and the city met them anyway, all of them together on one morning when the last of them arrived."
 wv.700.desc10:0 "\n\nThe rubbing from Tariku had been rolled in oilcloth, and when it was opened on the steps the crowd went quiet at the two names."
 wv.700.desc11:0 "\n\nThe Djedhid seal ring was on the envoy's finger, where the steward had put it."
 wv.700.desc12:0 "\n\nThe Champion's nail came up the waterfront on a velvet cushion that the crew had sewn themselves, badly."
 wv.700.desc13:0 "\n\nThe crate of Narbolian glass came up on a gambler's shoulder, as it had gone round the world, and he was singing."
 wv.700.desc14:0 "\n\nAnd at the end, carried on its straw by six men, came the cracked rider from Zemmairthia, red and blue, and the children of the Harbor District ran alongside it to touch the horse."
 wv.700.desc15:0 "\n\nThe navigators walked behind the procession with empty hands. The armillary was on the bottom of the sea off the cape, still set to the stars."
 wv.700.desc16:0 "\n\nThere was no Narbolian glass. It had gone over the side to save the ship, and somewhere off the cape a crab is living in a very fine cup."
 wv.700.desc17:0 "\n\nThere was no rider from Zemmairthia. He was on the bottom of the sea, riding."
 wv.700.desc18:0 "\n\nAncasta carried the first captain's astrolabe up the quay herself, and set it on the Guildmasters' table beside the scale, and the oldest Guildmaster put out a finger and turned it."
 wv.700.desc19:0 "\n\n[SCOPE.sChar('wv_vet').GetName|Y] walked up the dock a little behind the envoy, did not wave at the cheering, and stopped once to buy a cake from a girl who had been selling them when we left."
 wv.700.desc2:0 "\n\nThe full chest came up from the landing on a cart, with two of the Linupom wardens walking beside it, and the Guildmasters weighed it on their scale, every coin, while the crowd counted aloud."
 wv.700.desc20:0 "\n\n[SCOPE.sChar('wv_diver').GetName|Y] stood at the top of the steps looking down at the harbor water, which he said was the dirtiest he had ever seen, and was obviously deciding to dive into it."
 wv.700.desc21:0 "\n\n[SCOPE.sChar('wv_pupil').GetName|Y] walked with her satchel against her chest. She had no paper left at all."
 wv.700.desc22:0 "\n\n[SCOPE.sChar('wv_appr').GetName|Y] had persuaded three Guildmasters of something before he reached the top of the harborside. Nobody knew what."
 wv.700.desc23:0 "\n\n[SCOPE.sChar('wv_gamb').GetName|Y] was offering odds to the crowd on how long the speeches would last."
 wv.700.desc24:0 "\n\n[SCOPE.sChar('wv_mage').GetName|Y] looked at the windows of the Harbor District with professional interest, and our purser moved to stand between her and them."
 wv.700.desc25:0 "\n\n[SCOPE.sChar('wv_hunter').GetName|Y] had already found an inscription on the harbor wall that nobody in Cuwa had read in a hundred years, and was reading it."
 wv.700.desc26:0 "\n\n[SCOPE.sChar('wv_prize').GetName|Y] walked up the pier with her hand on her sword, out of habit, and then, seeing nobody there wanted her, took it off and laughed."
 wv.700.desc27:0 "\n\nActmund did not come up the wharf. His name was read from the steps by the senior priest, in Werhen, which the priest had practiced all the way from the cape, and the crowd took off its caps."
 wv.700.desc28:0 "\n\nSomebody in the crowd had heard that the envoy had gone farther than Zanis ever went, and shouted it, and the crowd took it up and shouted it too."
 wv.700.desc29:0 "\n\nThe old Mazos poet's verses had arrived ahead of us, carried by faster ships, and half the Harbor District already knew them by heart. The envoy heard a fishwife recite the storm at the headland, and it was not at all how it had been."
 wv.700.desc3:0 "\n\nThe chest that came up from the quay was smaller than the one the clerk at Linupom had promised. The Guildmasters weighed it anyway, and wrote the weight in the ledger, and did not say anything at all."
 wv.700.desc4:0 "\n\nThere was no chest to weigh. The Guildmasters looked at the empty scale for a long time."
 wv.700.desc5:0 "\n\nBehind them came the old Mazos poet's epic, already being read aloud from the steps, in which the voyage was a great deal braver than the crew remembered."
 wv.700.desc6:0 "\n\nSomebody had brought the Tales from the Zanic Age home wrapped in its cabbage leaf, and an old Guildmaster asked to borrow it before the speeches were over."
 wv.700.desc7:0 "\n\nA sailor carried the little vial from Ddu-Nuinop up the waterfront in both hands, as though it were full to the brim."
 wv.700.desc8:0 "\n\nOur purser carried the Seminary lexicon, and kept stopping to look up the Werhen for things."
 wv.700.desc9:0 "\n\nThe navigators carried the armillary themselves, four of them, and would let nobody else touch it."
 wv.700.t:0 "The Procession at [ROOT.GetCountry.GetCapital.GetName|G]"
 wv.701.a:0 "Publish it. Let the world sail by our chart."
 wv.701.b:0 "Keep it in the guild's chest."
 wv.701.desc:0 "The guild's mapmakers spread our fragments out on the long table in the chart room: the headland marks from Balthazaria, the smoke tables of Siznl, the barley soundings, the fishermen's sail-patch, the setting of Szing-Szing at World's End and the castaway's cut through the reef. Laid edge to edge they made a coast that no chart in Omniluxia had ever shown, from Cuwa to the end of the world and back round the cape.\n\nThe senior mapmaker asked whether it was to be published, so that every captain in Luxterra could sail by it, or kept in the guild's own chest, so that only Stellaric captains could."
 wv.701.t:0 "The Mapmakers"
 wv.702.a:0 "Honor it. Their share goes back round the cape, and a waystation with it."
 wv.702.b:0 "Bury it. The book goes into the archive, closed."
 wv.702.desc:0 "The debt book from the windbreaks lay open on the Guildmasters' table, at the last page, where the first voyage's captain had written 'paid at Linupom, to be carried home' in a careful hand, eighty years ago. She had carried it as far as she could. Her people's grandchildren were still behind their windbreaks on the cape, counting their goats, waiting for a ship from Cuwa.\n\nThe oldest Guildmaster said that, strictly speaking, part of the chest had always been theirs. The youngest said that strictly speaking was not how the guild had grown rich. Then they both looked at [ROOT.GetCountry.GetRuler.GetName|Y]."
 wv.702.t:0 "The Windbreaks' Claim"
 wv.703.a:0 "Close the ledger."
 wv.703.desc:0 "When the crowd had gone home the Guildmasters sat down at the long table with the ledger in sealskin, the one they had given the envoy on the dock before the voyage, and went through it page by page, from the coins in Ying-Pin's bowl to the last cup at World's End. It took them two days. They queried a hat bought in Gellazani. They queried a cabbage.\n\nAt the end the oldest of them drew a line under the last figure, wrote the total of the voyage beneath it, [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('wv_payout').GetValue|0Y] @gold!, and closed the book. Whatever was left in the Purse went to the crew as donatives, as was the custom. Most of it was spent in the taverns of the Harbor District before nightfall, which was also the custom."
 wv.703.desc1:0 "\n\nAncasta was not at the accounting. She had gone down to the harbor to ask the price of a small ship, and how long it would take to sail one round the cape."
 wv.703.desc2:0 "\n\n"
 wv.703.t:0 "The Accounting"
 wv.704.a:0 "Pay every family from the treasury."
 wv.704.b:0 "Pay every family. The keepers at Kyaxares are already reading their names."
 wv.704.c:0 "Dispute the claims. The sea is the sea."
 wv.704.desc:0 "The families of the men who did not come home stood on the wharf a little apart from everyone else, the way the families of the drowned always stand. A widow had brought her husband's boots, as the widow at Ddu-Nuinop had, and set them down side by side at the edge of the water. The Guildmasters asked [ROOT.GetCountry.GetRuler.GetName|Y] what Cuwa owed them."
 wv.704.t:0 "The Families"
 wv.800.a:0 "Put [SCOPE.sChar('wv_vet').GetName|Y] ashore here."
 wv.800.b:0 "Put [SCOPE.sChar('wv_diver').GetName|Y] ashore here."
 wv.800.c:0 "Put [SCOPE.sChar('wv_pupil').GetName|Y] ashore here."
 wv.800.d:0 "Put [SCOPE.sChar('wv_appr').GetName|Y] ashore here."
 wv.800.desc:0 "Every berth aboard was taken. The bosun said so, then said it again louder, in case anyone had not heard, and then stood in the doorway of the companions' quarters with his arms folded, looking at [SCOPE.sChar('wv_envoy').GetName|Y].\n\nIf someone new was to come aboard, someone who had sailed with us already would have to go ashore here, in this port, and find their own way home. They would keep their life and lose their place, and take with them everything they might have been to Cuwa."
 wv.800.e:0 "Put [SCOPE.sChar('wv_gamb').GetName|Y] ashore here."
 wv.800.f:0 "Put [SCOPE.sChar('wv_mage').GetName|Y] ashore here."
 wv.800.g:0 "Put [SCOPE.sChar('wv_hunter').GetName|Y] ashore here."
 wv.800.h:0 "Put [SCOPE.sChar('wv_prize').GetName|Y] ashore here."
 wv.800.i:0 "Thank the newcomer, and keep the company as it is."
 wv.800.t:0 "No Berth Left"
 wv.840.a:0 "Into the boats."
 wv.840.desc:0 "There was no warning, or there had been nothing but warnings and we had stopped listening to them. A seam that had been weeping since the headland opened all at once, the sea came in faster than the pumps could send it out, and by the second bell the carpenter came up from below and said, quite calmly, that she was going.\n\nThe boats went over in the order the bosun had drilled into us: people first, and then, if there was room, whatever we had come for."
 wv.840.t:0 "The Ship Founders"
 wv.841.a:0 "Bring home whoever is left."
 wv.841.desc:0 "There was not enough of anything any more: not enough food, not enough water, not enough men to work the ship, and not enough hope among the ones who were left. They put in at the first beach that would take them and could not get off it again. [SCOPE.sChar('wv_envoy').GetName|Y] gave the order to make camp, and walked along the shore that evening to look at the sea, and did not come back.\n\nThe survivors were taken off that beach by a Zaraken coaster a month later, half of them too weak to climb the side. It was a long time before Cuwa learned what had happened to the voyage to World's End."
 wv.841.t:0 "The Company Fails"
 wv.900.a:0 "Well? What did luck say?"
 wv.900.desc:0 "Every few years, as regular as the tides and a good deal less predictable, [SCOPE.sChar('wv_gamb').GetName|Y] comes to the treasury with news of the three-way split: himself, [ROOT.GetCountry.GetName|Y], and luck. Luck, he says, has been consulted."
 wv.900.t:0 "The Three-Way Split"
 03_wakvircu_task_26:0 "The Commission To World's End"
 03_wakvircu_task_26_DESC:0 "A delegation has come from #G Linupom#!, the famed #T World's End Port#! at the westernmost point of #G Morrigon#!, with an old contract that was never settled.\n\n#Y This will start an event chain#!."
 03_wakvircu_task_27:0 "A House At World's End"
 03_wakvircu_task_27_DESC:0 "The house at #G Linupom#! has its roof on and its shutters painted. Confirm it in the guild's books, and let every captain in Cuwa know that there is now a Stellaric door at the end of the known world."
 desc_wv_academy_letters_mod:0 "Our court mage corresponds with the Magonis steward at Durobaeraste, who is still wrong about most things."
 desc_wv_buried_claim_mod:0 "Word has got about that Cuwa closed the book on its own castaways."
 desc_wv_cape_waystation_mod:0 "The grandchildren of the first voyage keep a waystation behind their windbreaks for every Stellaric ship that rounds the cape."
 desc_wv_champion_mod:0 "The name of Wakvircu is scratched into the plinth of the Champion of Portua Narbolia."
 desc_wv_chart_guild_mod:0 "Only Stellaric captains know the way to World's End, and they are not telling."
 desc_wv_chart_published_mod:0 "Every captain in Luxterra now sails by a Stellaric chart."
 desc_wv_door_lindute_mod:0 "The local weight of Linupom is carved beside our Stater over the door of the house at World's End."
 desc_wv_door_szing_mod:0 "The star of the Stellaric faith is carved over the door of the house at World's End."
 desc_wv_house_at_worlds_end_mod:0 "The Stellaric guildhouse at Linupom, the last port in the known world, keeps its doors open and its books balanced."
 desc_wv_magic_mouth_mod:0 "Our envoys travel with a trained persuader, and come home with better terms than they set out for."
 desc_wv_master_appr_house_mod:0 "The Stellaric house here is kept by Charias, who sailed with the voyage to World's End and stayed."
 desc_wv_master_appr_mod:0 "Charias keeps our house at Linupom, at the end of the world."
 desc_wv_master_diver_house_mod:0 "The Stellaric house here is kept by Ilurrushe, who sailed with the voyage to World's End and stayed."
 desc_wv_master_diver_mod:0 "Ilurrushe keeps our house at Linupom, at the end of the world."
 desc_wv_master_gamb_house_mod:0 "The Stellaric house here is kept by Ampsicora, who sailed with the voyage to World's End and stayed."
