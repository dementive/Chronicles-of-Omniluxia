 wv_missing_corner_trait:0 "Seeker of the Missing Corner"
 wv_missing_corner_trait_desc:0 "She has read every inscription in a valley in Morrigon, and one behind the windbreaks of the cape that no one else will ever read."
 wv_oathsworn_trait:0 "Oathsworn of Werhen"
 wv_oathsworn_trait_desc:0 "He came aboard at a headland inn for a hundred gold and went round the world. He still says very little about it."
 wv_pearl_banks_mod:0 "The Pearl Banks"
 wv_pearl_diver_trait:0 "Pearl-Diver of Mazos"
 wv_pearl_diver_trait_desc:0 "He touches the oldest strand for luck, though he has never been unlucky in his life."
 wv_pilot_book_mod:0 "The Errfalian Rutter"
 wv_powder_works_mod:0 "The Powder Works"
 wv_prize_court_mod:0 "The Prize Court"
 wv_prize_taker_trait:0 "Prize-Taker"
 wv_prize_taker_trait_desc:0 "She divides a chest the way other people divide a loaf."
 wv_reef_breaker_harbor_mod:0 "Harbor Works"
 wv_reef_breaker_trait:0 "Reef-Breaker"
 wv_reef_breaker_trait_desc:0 "She blew a mountain open for a living, and owes the windows of a whole street."
 wv_t_armillary:0 "Odedzan Armillary"
 wv_t_armillary_desc:0 "Bronze rings within rings, every star picked out in silver, still set to the sky over a Zanite city that no longer exists. It was bought by lamplight at an auction in Zewggadmeza, and Szing-Szing is in its place among the stars."
 wv_t_astrolabe:0 "The First Captain's Astrolabe"
 wv_t_astrolabe_desc:0 "A brass astrolabe that still turns, found in a sea chest behind the windbreaks of the cape, wrapped in the shirt of the Stellaric captain who never came home. Her notes on the reef are still in the lid."
 wv_t_chart:0 "Chart of World's End"
 wv_t_chart_desc:0 "The coast from Cuwa to Linupom and round the cape, drawn from the headland marks of Balthazaria, the serpent smoke of Siznl, the barley soundings of Tamrat, a Vetalian fisherman's sail-patch, the setting of Szing-Szing and a castaway's knife. No other chart in Omniluxia goes so far."
 wv_t_cycle:0 "The Stellarix Cycle"
 wv_t_cycle_desc:0 "An epic of the voyage to World's End, written in Mazos by an old poet who smelled of fish and rope, before the voyage had happened. It is very much better than what actually happened, and the crew insist on hearing it read every year."
 wv_t_glass:0 "Narbolian Glass"
 wv_t_glass_desc:0 "A glassmaker's best crate of the season, won at dice in Portua Narbolia, lost again by breakfast, and carried round the world on a gambler's shoulder."
 wv_t_lexicon:0 "Seminary Lexicon"
 wv_t_lexicon_desc:0 "A master's lexicon from the Seminary of Balthazar, giving every word in five tongues side by side. The Werhen column is noticeably shorter than the others, and in several places someone has written 'no' in the margin."
 wv_t_nail:0 "Champion's Nail"
 wv_t_nail_desc:0 "The iron nail that scratched the name of Wakvircu into the plinth of the Champion of Portua Narbolia, among hundreds of others. It is the custom of the Turisi that the nail goes home with the name."
 wv_t_pearl_strand:0 "Pearl-Tithe Strand"
 wv_t_pearl_strand_desc:0 "A strand of carved shell beads from Mazos, made for a boat that never came home. Its diver brought it to Cuwa instead."
 wv_t_pyre_ash:0 "Pyre Ash Reliquary"
 wv_t_pyre_ash_desc:0 "A stoppered glass vial no bigger than a thumb, bought from a booth on the waterfront at Ddu-Nuinop. The glassblower swore that it held a pinch of the true Ashes of Helluvius. The supply has never once run short, which the faithful consider the greater miracle."
 wv_t_rider_panel:0 "The Cracked Rider"
 wv_t_rider_panel_desc:0 "A whole horseman of the Glazed Riders of Zemmairthia, red and blue under white rosettes, perfect except for a hairline crack through the horse's knee. The court threw it out. Cuwa did not."
 wv_t_rubbing:0 "Tariku Rubbing"
 wv_t_rubbing_desc:0 "Two names from a single stone inside the oldest Pyramid of Tariku, one above the other, in two scripts. The older one was rubbed twice, at the keeper's insistence, to be sure that it was still there."
 wv_t_sea_journal:0 "Durobaeraste Sea Journal"
 wv_t_sea_journal_desc:0 "Six sheets of observations at sea, permitted by the Magonis steward and filled by his pupil. The sixth has only one word on it. She has never told anyone what it is."
 wv_t_seal_ring:0 "Djedhid Seal Ring"
 wv_t_seal_ring_desc:0 "A plain seal ring of the house of the True Pharon, given by a steward of the Pomegranate Throne in exchange for a Stellaric Stater. 'For when you come back,' he said. 'The king will have sat down by then.'"
 wv_t_tales:0 "Tales from the Zanic Age"
 wv_t_tales_desc:0 "A copy of the Tales of Zorgolis of Gevanni, bought beside his empty plinth and wrapped in a cabbage leaf, because it keeps better that way. So does the truth."
 wv_tt_envoy_factor:0 "Mholaidhgard is a seasoned guild factor with a keen eye for cargo and a reputation for driving a hard bargain."
 wv_tt_envoy_interpreter:0 "Luske is an experienced interpreter who knows the languages and customs of trading ports across the coast."
 wv_tt_envoy_pilot:0 "Kaekvir is known as an exceptional admiral, with years of experience commanding ships on long voyages."
 wv_tt_hire_appr:0 "Charias is an unlicensed apprentice with a talent for putting people at ease."
 wv_tt_hire_diver:0 "Ilurrushe is a Mazonian pearl diver who knows his way around the underside of a ship."
 wv_tt_hire_gamb:0 "Ampsicora is a Turisi gambler and trader who makes his living reading people."
 wv_tt_hire_hunter:0 "Ancasta is a Vetalian ruin hunter accustomed to guiding parties through unfamiliar country."
 wv_tt_hire_mage:0 "Brenwen is a Lelaichandi powder mage experienced in working with timber and stone."
 wv_tt_hire_prize:0 "Aeronwen is a Lindute prize captain with years of experience commanding ships along the coast."
 wv_tt_hire_pupil:0 "Anpu is an Academy pupil who studies the signs sailors read in wind and water."
 wv_tt_hire_vet:0 "Actmund is a Werhenlander veteran accustomed to leading landing parties on unfamiliar shores."
 wv_turisi_odds_trait:0 "Turisi Odds"
 wv_turisi_odds_trait_desc:0 "He pays the apprentice first, and then everybody else, eventually."
 wv_werhen_chapter_mod:0 "The Werhen Chapter"
 wv_werhen_chapter_sworn_mod:0 "The Werhen Chapter, Sworn"
 wv_worlds_end_traveler_trait:0 "World's End Traveler"
 wv_worlds_end_traveler_trait_desc:0 "Has seen Szing-Szing go down into an empty sea, and a great many other things besides."

