 # The Nazani detour
 wv.200.f:0 "Put in at Dannsdonn before we cross."
 wv.200.f.tt:0 "Take #R 12 base Hull damage#! without an escort and another #R 12#! if the seam remains unsealed. Make the optional stop at #T Dannsdonn#! in #Y 6–10 days#!."
 wv.260.t:0 "The Quay at [GetProvince('(int32)2562').GetName|G]"
 wv.260.desc:0 "At Dannsdonn the harbor clerk came aboard with a folding stool. We thought at first it was for our envoy, but he unfolded it beside the gangplank and sat down himself. From there he asked the name of the ship, the name of the country that had sent it, and whether the country intended to pay for the water it was about to drink. Our purser said that it did, within reason. The clerk wrote down only the first part.\n\nUnder the warehouse eaves there were sacks of flour enough to whiten the whole dock. A carter bound for [GetProvince('(int32)2720').GetName|G] told us there was a day when the court heard petitions from foreigners. He had carried three such petitioners up the road the month before and brought two back. The third had married his interpreter."
 wv.260.desc1:0 "\n\nThe clerk was still on his stool when we came back down to the water. He asked what we had learned at court. Our purser said we had learned who would pay for the water. The clerk shut his book and waited for a name."
 wv.260.a:0 "Take the carter's road and ask to be heard."
 wv.260.a.tt:0 "Use #R 2 Stores#! for the inland journey. Reach #T Bharamuntacho Zani#! in #Y 2–3 days#! and seek an audience."
 wv.260.b:0 "Buy enough flour to leave a little white on the decks."
 wv.260.b.tt:0 "Spend #R 24 Purse#! for #G 2 Stores#!. Stay at #T Dannsdonn#!."
 wv.260.c:0 "Tell the clerk we have had our last drink ashore."
 wv.260.c.tt:0 "Leave #T Dannsdonn#! for the #T Intergealian crossing#! in #Y 10–15 days#!."
 wv.261.t:0 "A Place on the List"
 wv.261.desc:0 "We had seen the empty chair at Durobaeraste. In [GetProvince('(int32)2720').GetName|G] every chair was taken. At the end of the long room a man in purple sleeves was listening to a dispute over a mill, and when both millers had finished he told the scribe to read the judgment back to them. The scribe read the names of the two millers and the name of the mill. The man in purple stopped him and asked what they had decided. Nobody had written that part down.\n\nWhen our turn came, the steward asked if Cuwa had sent us to renew some ancient claim. Our envoy said we were sailing to World's End to collect on a warehouse and had stopped to pay our respects. The steward made us say it twice. Then he asked which of his clerks could find World's End on the wall map. Nobody moved, but three of them looked for it."
 wv.261.desc_closed:0 "The carter stopped where the road came in sight of the walls. The gates were shut, and a man coming the other way said there would be no petitions heard that day. Our envoy asked when they would be heard. The man looked back at the gates and said he had been asking the same thing."
 wv.261.a:0 "Give them our names and show them where to look."
 wv.261.a.tt:0 "Gain #G 1 Wonder#! and earn #G 15 Political Influence#! at homecoming. Return to #T Dannsdonn#! in #Y 2–3 days#!."
 wv.261.b:0 "Ask the carter what he charges for the road back."
 wv.261.b.tt:0 "Return to #T Dannsdonn#! in #Y 2–3 days#!."

 # Mount Arteth and Soveneria
 wv.316.t:0 "What the Mountain Leaves"
 wv.316.desc:0 "The Orcs of [GetProvince('(int32)1732').GetName|G] were unloading salt when we came in. They carried the baskets two at a time, one on each shoulder, and stopped when the shadow of [GetProvince('(int32)5789').GetName|G] reached the end of the wharf. Our purser thought it was a prayer. The woman weighing the salt told him it was dinner. She said there was a time for prayer as well, but nobody she knew could manage it on an empty stomach.\n\nAt the foot of the mountain a shaman showed us a trail where the black stones shone through the grass. The first Orcs came down through that mist, he said. Guer came down the same way with an obsidian stone and a dead king's crown. Our sailing master asked how he had found the path. The shaman said kings could afford to lose their way, but we should go with somebody who knew it."
 wv.316.desc_closed:0 "The watch at [GetProvince('(int32)1732').GetName|G] would not let us put a boat in the water. We could still see [GetProvince('(int32)5789').GetName|G] above the harbor. Mist stood in the folds of the mountain all morning, and when it lifted the men on the quay were still there."
 wv.316.a:0 "Take the shaman's path and mark the headlands from above."
 wv.316.a.tt:0 "Use #R 2 Stores#! for the ascent. Gain #G 1 Wonder and 1 chart fragment#!. Collect more fragments to piece together a chart back home. Reach #T Gowia in Rohenevia#! in #Y 5–8 days#!."
 wv.316.b:0 "Buy supper for the salt crews and hear the story down here."
 wv.316.b.tt:0 "Spend #R 20 Purse#!. Gain #G up to 12 Company#!. Reach #T Gowia in Rohenevia#! in #Y 4–7 days#!."
 wv.316.c:0 "Take one last look at Arteth from the deck."
 wv.316.c.tt:0 "Reach #T Gowia in Rohenevia#! in #Y 4–7 days#!."
 wv.317.t:0 "A Horse's Measure"
 wv.317.desc:0 "At [GetProvince('(int32)2573').GetName|G] we found a horse standing on the dock with a ship's blanket over its back. Our purser asked what it cost to put a horse aboard. The ferryman said it depended on whether the horse wanted to go. This one had been brought down for the fair at Naoned and had taken exception to the boat. It had now been standing there longer than either of us cared to wait.\n\nA woman selling oatcakes said the road inland was open. From the ridge one could see the whole of Naoned and the Citadel of the Jodok above it. She had gone there once to get her brother out of the levy and come home with a husband instead. The brother was still in the levy. She gave us an oatcake to try and said she could furnish as many as we cared to carry."
 wv.317.desc_closed:0 "At [GetProvince('(int32)2573').GetName|G] the ferryman had drawn his boat up onto the landing and taken the oars home. The watch hailed us from behind the harbor chain. Nobody was going up to Naoned today, they said. They did not know who would be coming down."
 wv.317.a:0 "Buy two days of food and take the road to Naoned."
 wv.317.a.tt:0 "Use #R 2 Stores#!. Reach the #T Citadel of the Jodok#! in #Y 2–3 days#!."
 wv.317.b:0 "Buy oatcakes enough to last past the next tide."
 wv.317.b.tt:0 "Spend #R 24 Purse#! for #G 2 Stores#!. Stay at #T Gowia#!."
 wv.317.c:0 "Take the tide and leave the roads to the horses."
 wv.317.c.tt:0 "Sail for #T Rhylgoyer#!. Reach the reeds in #Y 5–8 days#!."
 wv.318.t:0 "The Citadel of the Jodok"
 wv.318.desc:0 "The road to [GetProvince('(int32)2509').GetName|G] climbed so steadily that we stopped looking back for the sea. At the citadel gate a groom was wetting the stones. The horses came in from the practice ground in twos, and when their iron shoes struck the wet stone we heard them in the yard above before we saw them in the passage below. The sergeant said the old Jodok kings had wanted a gate wide enough for two riders to charge out abreast. Nobody now could agree which king had paid for it. The groom said it was wide enough for twice the mud.\n\nDown on the flat we watched a line of riders take a turn together. The horse on the inside hardly moved and the one on the outside had to run. Our bosun said it was like turning a boat with oars on only one side. The sergeant asked whether he would care to try it from the saddle. To our surprise the bosun said he would, provided the sergeant first showed him how to get up there."
 wv.318.desc_closed:0 "When we came up the last rise to [GetProvince('(int32)2509').GetName|G], we found the road barred. Beyond the barrier someone had left a horse saddled in the rain. We could see the citadel over the roofs, but the men on the road sent us back before we got any closer."
 wv.318.a:0 "Walk the walls, then go back while there is light."
 wv.318.a.tt:0 "Gain #G 1 Wonder#!. Return to #T Gowia#! in #Y 2–3 days#!."
 wv.318.b:0 "Pay the sergeant for a morning with his riders."
 wv.318.b.tt:0 "Spend #R 20 Purse#!. Gain #G 1 Wonder#! and earn #G 10 Military Experience#! at homecoming. Return to #T Gowia#! in #Y 2–3 days#!."
 wv.318.c:0 "Turn back for the boats."
 wv.318.c.tt:0 "Return to #T Gowia#! in #Y 2–3 days#!."
 wv.515.t:0 "The Horse at the Hall Door"
 wv.515.desc:0 "We had to wait for a horse to come out of the customs shed before we could go in. It belonged to a clan chief who had brought it from Kainaxarthos to settle a debt. The clerk had put it down as six silver cups, because that was what the chief owed, and was now trying to work out how to enter the difference if the horse turned out to be worth seven.\n\nAbove the harborside at [GetProvince('(int32)4864').GetName|G], the hall had a Zanic lintel, a Helluvian lamp and iron rings at the door for the chiefs to tie their horses to. Our envoy asked the steward how long the rings had been there. Since the roof fell in the first time, he said. The horses had waited in the rain while the court made up its mind about repairing it, and when the roof went back on the chiefs insisted that the rings go up first. Down at the water our carpenter was already arguing over a length of seasoned oak."
 wv.515.desc_closed:0 "The harbor at [GetProvince('(int32)4864').GetName|G] was shut when we came up to it. From the deck we could see horses going up the road to the hall, one at a time where the street narrowed. The last rider turned to watch us, then went on. Our carpenter put his tools back in their chest."
 wv.515.a:0 "Buy the oak and give our carpenter the berth."
 wv.515.a.tt:0 "Spend #R 30 Purse#! to repair #G up to 15 Hull#!. Sail for #T Zemmairthia#! and reach the next encounter in #Y 5–8 days#!."
 wv.515.b:0 "Send a gift to the hall and sit with the chiefs."
 wv.515.b.tt:0 "Spend #R 20 Purse#!. Gain #G 1 Wonder#! and earn #G 15 Political Influence#! at homecoming. Sail for #T Zemmairthia#! and reach the next encounter in #Y 5–8 days#!."
 wv.515.c:0 "Take the tide east, while there is still light."
 wv.515.c.tt:0 "Sail for #T Zemmairthia#! and reach the next encounter in #Y 4–7 days#!."

