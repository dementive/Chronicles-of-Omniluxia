 wv_t_tadm_rule:0 "Tadm’s Folding Rule"
 wv_t_tadm_rule_desc:0 "Three short lengths of boxwood hinged with brass. At Yewubdar the schoolmaster used it to show our bosun how much of a wall he could see from the street without climbing it."
 wv_t_gozon_cup:0 "Cup from Gozon’s Mound"
 wv_t_gozon_cup_desc:0 "A guest’s cup carved from dark wood, with a thumb worn into the rim by hands that held it before ours."
 wv_t_racgerrac_cup:0 "Racgerrac’s Stone Cup"
 wv_t_racgerrac_cup_desc:0 "A stone cup cut from the mountain’s scree. The mason left one side rough so the buyer could see what the mountain had given him and where his own work began."
 wv_t_tiuban_tablet:0 "A Dwarf Scribe’s Practice Tablet"
 wv_t_tiuban_tablet_desc:0 "A clay tablet from Tiuban covered in weights and measures. On the back a pupil has added the wages of a bricklayer three times and arrived at three different sums."
 wv.700.desc30:0 "\n\nWe took the folding rule up to the school. The master opened it out on his desk and asked how far we had come to bring it. Our bosun said the girl who taught him to use it could probably tell him."
 wv.700.desc31:0 "\n\nThe cup from Gozon's Mound made it all the way to Cuwa. We set it out at supper for the one who had come farthest. There was some dispute about who that was."
 wv.700.desc32:0 "\n\nThe stone cup from Racgerrac was the only thing on the Guildmasters' table that nobody could move by knocking it with an elbow."
 wv.700.desc33:0 "\n\nAn accountant borrowed the tablet from Tiuban to see whether he could make the boy's sums agree. He gave it back on the third day and said he had found a fourth answer."
