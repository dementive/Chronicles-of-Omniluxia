 ob_report_body: "#T Drow Invasion Threat#! #R [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_threat')|0] / 100#!\n[ROOT.GetCountry.Custom('ob_report_threat_meter')]\n[ROOT.GetCountry.Custom('ob_report_crisis')]\nThreat rises by #R 5#! every half-year. Cave expeditions can reduce or increase it. The early host invades at #R 100 Threat#!.\n\n#T Order Preparedness#! #G [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_preparedness')|0] / 100#!\n[ROOT.GetCountry.Custom('ob_report_preparedness_meter')]\nEach requirement below contributes #Y 20#!. Losing forts or food lowers preparedness.\nTwo owned forts: [ROOT.GetCountry.Custom('ob_status_forts')]\nRoads agreement: [ROOT.GetCountry.Custom('ob_status_roads')]\nGrain covenant and 200 capital-state food: [ROOT.GetCountry.Custom('ob_status_grain')]\nCommon watch: [ROOT.GetCountry.Custom('ob_status_watch')]\nIntelligence: [ROOT.GetCountry.Custom('ob_status_intel')]\nExpedition: [ROOT.GetCountry.Custom('ob_status_expedition')]\nLaunch through #Y Break the Mustering Host#!: #Y 75 gold, 2 manpower, 180 days#!. At 100 preparedness, launch the expedition when you have the resources, no civil war, and threat below 100 throughout the expedition. Keep both forts and the food reserve throughout. Only a completed expedition prevents the early host. The later greater invasion remains."
 ob_order.13.t: "The Ordinance in the Record"
 ob_order.13.desc: "A clerk lays the disputed ordinance before #Y [ROOT.GetCountry.GetRuler.GetName]#!. Its opening promises unity in the defence of #G Herue#!; its operative clauses replace the two equal #Y Grandmasters#! with one commanding seal.\n\n[ROOT.GetCountry.Custom('ob_completion_13_outcome')]\n\nThe chapter keeps the ordinance with the muster rolls and household accounts that preceded it. The disagreement began with men waiting for relief. It has become a decision about who may govern the brotherhood."
 ob_order.13.a: "Preserve the ordinance and the answer beside it."
 ob_completion_13_surrender: "[ROOT.GetCountry.GetRuler.GetFirstName] now holds the seal after the former ruler accepted the demand for sole command. No war was needed to transfer the office. The chapter must still decide whether this single command should become the #T Order#!'s lasting constitution."
 ob_completion_13_war: "The demand was refused. The #T Order#! has divided into opposing chapters, each claiming the right to speak for the same oath. The #R civil war#! must end before the brotherhood can settle its constitution."
 ob_completion_13_settled: "The struggle over the seal has ended. The surviving leadership must recover #G Balthazaria#! and rebuild the chapter before deciding whether to restore two seats or retain one protector."
 ob_completion_13_pending: "The ultimatum awaits its answer. Entering the ordinance in the records does not accept or reject the demand."
 ob_order.6.b: "Strengthen the crossings before the next contest."
 ob_order.10.b: "Keep the maps with the officers who will use them."
 ob_order.18.b: "Confirm their privileges, but collect an extraordinary contribution."
 ob_order.22.b: "Invest in one province and compensate the disputed communities."
 ob_effect_13_a_tt: "Record the ultimatum already delivered to the chapter. Its #G 5 Ruler Popularity#! reward is recorded above and is not awarded again. This acknowledgement neither starts a second civil war nor replaces the ruler again."
 ob_completion_account_13_tt: "#T Already applied#!"
 ob_effect_170_back_tt: "Replace the crown-recognition policy with the #T Northern Concord#!. No treasury or influence is spent."
 ob_effect_170_4_tt: "Recognise the named cooperating ruler and grant #G +35 Opinion#! with the Order, decaying by 2 yearly. No lands are transferred and no war is automatically won."
 ob_effect_170_3_tt: "Recognise the named cooperating ruler and grant #G +35 Opinion#! with the Order, decaying by 2 yearly. No lands are transferred and no war is automatically won."
 ob_effect_170_2_tt: "Recognise the named cooperating ruler and grant #G +35 Opinion#! with the Order, decaying by 2 yearly. No lands are transferred and no war is automatically won."
 ob_effect_170_1_tt: "Recognise the named cooperating ruler and grant #G +35 Opinion#! with the Order, decaying by 2 yearly. No lands are transferred and no war is automatically won."
 ob_effect_170_0_tt: "Recognise the named cooperating ruler and grant #G +35 Opinion#! with the Order, decaying by 2 yearly. No lands are transferred and no war is automatically won."
 ob_effect_402_a_tt: "Gain #G 5 Political Influence#! for the optional #G Norrfalia#! epilogue. The ordinary formation rewards and investments are #Y not awarded again#!."
 ob_completion_account_25_tt: "#T Already applied#!"
 ob_effect_401_a_tt: "Renew the roads agreement and #Y five-year truces#! between peaceful signatories. Signatories withdraw claims on current Order-owned lands. #Y No territory is transferred#!."
 ob_effect_400_c_tt: "Keep the herald despite the breach. The Rimebound retain their foothold."
 ob_effect_400_b_tt: "End the interrogation and consecrate the surviving wards."
 ob_effect_400_a_tt: "End the interrogation and destroy the herald."
 ob_effect_302_a_tt: "The attempted division has not produced a civil-war country. The chapter reconvenes after #Y 30 days#!; no victory reward is granted."
 ob_effect_301_a_tt: "The internal war has ended. Record the surviving leadership; government reform is still decided by #T The Founding Covenant#!. No extra resources are awarded here."
 ob_effect_300_b_tt: "#R Begin a civil war#! led by the rival Grandmaster. His native rebel country receives #Y 50 Gold#!. His resources and officers depend on the course of the dispute. The engine determines the territorial and army split."
 ob_effect_300_a_tt: "#R Yield leadership to the rival Grandmaster.#! Continue playing the same country under the new ruler, without this scripted civil war. Restoring two seats later requires concessions."
 ob_effect_206_a_tt: "The operation has been cancelled. Its #R 75 Gold#! and #R 2 Manpower#! commitment is not refunded. Another expedition may be organised if time and preparations permit."
 ob_effect_205_a_tt: "The decision has already committed #R 75 Gold#! and #R 2 Manpower#!. The #Y 180-day#! operation continues while its forts and food remain available. This acknowledgement charges nothing further."
 ob_effect_204_a_tt: "The early gathering dispersed without a usable bridgehead. #Y No prevention reward is granted#!."
 ob_effect_203_a_tt: "The recorded war has ended. No victory package is granted merely for signing peace; the mission still requires the chapter seat and restored forts."
