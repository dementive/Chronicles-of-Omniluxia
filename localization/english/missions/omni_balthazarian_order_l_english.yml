l_english:
 ob_relief: "Bread Before Sermons"
 desc_ob_relief: "A granary and regular grain imports sustain the capital. Full storehouses have done rather more for public contentment than the chapter's sermons."
 ob_watch: "The Common Watch"
 desc_ob_watch: "The chapter maintains stores, watchmen, and a regular muster at this strongpoint."
 ob_trade: "The Grain Covenant"
 desc_ob_trade: "Written agreements keep the northern markets supplied."
 ob_recovery: "Bind the Wounds"
 desc_ob_recovery: "Coin and labour have been assigned to the repair of the brotherhood."
 ob_shared: "The Founding Covenant"
 desc_ob_shared: "Two Grandmasters answer to a chapter whose authority neither may set aside."
 ob_sole: "The Protector's Command"
 desc_ob_sole: "One Lord Protector now answers for the commands issued in the Order's name."
 ob_charter: "Charter of the Northern Sword"
 desc_ob_charter: "Protection of the northern faithful has been given a settled place in the religious order."
 ob_vampire_intel: "Secrets of the Bound Herald"
 desc_ob_vampire_intel: "The prisoner names passages the Drow believed forgotten. Each answer ends with a question about our own defences."
 ob_compact_cost: "Wards Beneath the Chapel"
 desc_ob_compact_cost: "Braziers, inscribed chains and an unbroken watch contain the herald. No warden is permitted to hear it alone."
 ob_final: "The Shield Before the Crown"
 desc_ob_final: "Permanent arrangements sustain the watch when its founders are no longer present."
 ob_lantern: "The Last Hearth Lantern"
 desc_ob_lantern: "A lamp recovered from the frozen hospice, now kept as a warning to those who stand watch."
 ob_watch_army: "The Northern Watch"
 desc_ob_watch_army: "A temporary defensive muster supported by the northern chapter houses."
 ob_expedition_timer: "The Counter-Expedition"
 desc_ob_expedition_timer: "The brothers are working beneath the approaches. This modifier shows the remaining six-month operation; retaining two forts and the capital food reserve is essential."
 ob_order: "Balthazarian Order"
 ob_order_desc: "Founded in #Y 795 LC#! by #Y Yvius Balthazar#! among the #Y Astvaenic#! tribes, this brotherhood of #T Helluvian#! knights guards the northern frontier against the #R Drow#! and carries the faith of #T Hellas#! into the lands it protects. Two #T Grandmasters#! share command under the founding covenant, charged with keeping their brothers faithful to a common oath.\n\nYet the wars of #G Herue#! have set knight against knight beneath rival banners. With both former masters slain at #G Kiaguthmajnnorr#! in 996 LC, their successors inherit a brotherhood whose swords must be united before they can shield the north again."
 ob_order_ruler: "Grandmaster"
 ob_order_ruler_female: "Grandmaster"
 ob_order_co_ruler: "Grandmaster"
 ob_order_co_ruler_female: "Grandmaster"
 ob_order_consort: "Consort"
 ob_order_consort_female: "Consort"
 ob_protectorate: "Balthazarian Order"
 ob_protectorate_desc: "The two seats have been replaced by one #T Lord Protector#!, who commands the brotherhood and answers for the defence of the north."
 ob_protectorate_ruler: "Lord Protector"
 ob_protectorate_ruler_female: "Lord Protector"
 ob_protectorate_co_ruler: "Lord Protector"
 ob_protectorate_co_ruler_female: "Lord Protector"
 ob_protectorate_consort: "Consort"
 ob_protectorate_consort_female: "Consort"
 ob_frontier_heard: "The Frontier Brothers Were Heard"
 ob_dual_mandate: "The Shared Chapter Mandate"
 ob_agreement_opinion: "The Northern Agreements"
 ob_grievance_opinion: "The Price of Intervention"
 ob_early_invasion_wargoal: "The Early Drow Invasion"
 war_goal_ob_early_invasion_wargoal: "The Early Drow Invasion"
 ob_order.1.a: "Their oaths still bind them. Let them return."
 ob_order.1.b: "We shall hear what each brother has done."
 ob_order.1.t: "Gather the Broken Lances"
 ob_order.1.desc: "The first veterans reach [ROOT.GetCountry.GetCapital.GetName|G] before the clerks have finished preparing the rolls. #Y [ROOT.GetCountry.GetRuler.GetName]#! watches men last seen retreating from #G Kiaguthmajnnorr#! return with patched cloaks, repaired shields, and families who have nowhere else to go.\n\nThe chapter has committed money to settling their households. Roofs, land, and a place on the rolls will give the survivors a home and the #T Order#! a reserve of experienced brothers. Some insist their fighting days are over; they have already begun correcting the gate guards.\n\n#Y [ROOT.GetCountry.GetCoRuler.GetName]#! offers to read the muster. To [ROOT.GetCountry.GetCoRuler.GetFirstName], these are also the men who could relieve the companies still holding the northern forts. The quartermaster sets the household bill beside the roll. Welcoming the veterans is the first promise. Deciding when they can serve again will require another."
 ob_order.2.a: "Ask [ROOT.GetCountry.GetCoRuler.GetFirstName] to prepare a rotation for the frontier companies."
 ob_order.2.b: "Put the returning households first; take the muster before the chapter."
 ob_order.2.t: "An Empty Seat at Supper"
 ob_order.2.desc: "For three evenings, #Y [ROOT.GetCountry.GetRuler.GetName]#! has faced an empty chair at the high table. Tonight the missing #Y Grandmaster#!, #Y [ROOT.GetCountry.GetCoRuler.GetName]#!, is in the chapel, lighting candles beneath the names of the brothers lost at #G Kiaguthmajnnorr#!. A muster roll lies open beside the altar.\n\n[ROOT.GetCountry.GetCoRuler.GetFirstName] points to the companies still holding the northern forts. Their relief is overdue. The veterans now returning to #G Balthazaria#! know those posts and could take the watch again, but the treasury is already paying to house their families.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] sets a second list beside the first: widows awaiting grain, wounded brothers awaiting shelter, children sleeping beneath unfinished roofs. Sending the veterans north at once would leave those households without help. Keeping every veteran home would leave the frontier soldiers without relief.\n\nNeither list can be put aside. Before the chapter meets, the two masters must decide which obligation to put first."
 ob_order.3.a: "Feed the families first."
 ob_order.3.b: "Purchase enough for the watch and the refugees."
 ob_order.3.t: "Bread Before Sermons"
 ob_order.3.desc: "The people waiting outside our storehouses have heard enough sermons to last the winter. They would now like something to eat. A #Y Granary#! in [ROOT.GetCountry.GetCapital.GetName|G] will keep the sacks out of the rain, but the quartermaster observes that a fine empty building feeds remarkably few children.\n\nLet us gather #Y 500 Food#! in the capital province and secure a regular import of #Y Grain#!. With sound stores and grain arriving from abroad, our people may begin to believe that the Order intends to keep them alive. #Y [ROOT.GetCountry.GetCoRuler.GetName]#! reminds #Y [ROOT.GetCountry.GetRuler.GetName]#! that the frontier garrisons also enjoy eating; we can settle the distribution once there is bread to distribute."
 ob_order.4.a: "Read the dispatches before the assembled chapter."
 ob_order.4.b: "Correct the abuses, but keep the names within the chapter."
 ob_order.4.t: "Account for the Fallen"
 ob_order.4.desc: "The last bundle of letters lies open before #Y [ROOT.GetCountry.GetRuler.GetName]#!. Between the lists of the dead lie receipts for grain that never reached them. One captain sold his wagons to a claimant; another kept his men beside an estate whose lord had promised him silver. The brothers at #G Kiaguthmajnnorr#! went hungry while their companions bargained.\n\n#Y [ROOT.GetCountry.GetCoRuler.GetName]#! reads the names twice. Some belong to men who followed him out of the snow. He will have the stolen stores restored and the watch put in order, but asks [ROOT.GetCountry.GetRuler.GetFirstName] to leave their shame within the chapter. He says there are widows who would rather remember a brave husband than hear the whole truth of his last winter.\n\nThe towns have their own dead. Opening the accounts before them may restore their trust in the #T Order#!; [ROOT.GetCountry.GetCoRuler.GetFirstName] will remember whose decision exposed his brothers' names. Keeping the names beneath the #Y Grandmaster#!'s seal would preserve those officers' experience for the watch. They would also know which master stood between them and disgrace."
 ob_order.5.a: "A Herulian king may yet serve beneath our seal."
 ob_order.5.b: "The Order must govern what these kings cannot."
 ob_order.5.t: "A Table for Four Kings"
 ob_order.5.desc: "The claimants have been heard beneath the roof of our capital. Each offers peace, provided the others first surrender their rights to the Iron Crown. Their envoys dispute the seating before they will discuss the roads. No agreement survives the first reading.\n\nYour fellow Grandmaster would preserve a Herulian crown beneath the Order's authority: let a king govern the towns and furnish men for the watch. The other seat argues that another royal court would merely shelter the next rebellion. Only the Order's own officers can answer for the roads.\n\nThe conference ends without a settlement. In private, the chapter weighs the diplomatic work of binding a king to our seal against the military preparations needed for direct rule. The claimants have shown us why someone else must establish order."
 ob_order.6.a: "Send the heralds. Summon the captains."
 ob_order.6.t: "A Backup Plan"
 ob_order.6.desc: "The last claimant's carriage has scarcely cleared the gates when the chapter servants return to the council chamber. They carry no wine this time. Across the table where the envoys quarrelled over precedence, they unroll a map of #G Great Herue#!. Iron weights pin down its curling corners.\n\nThe archivist lays out the evidence: abandoned royal duties, broken frontier oaths, petitions from towns whose protectors never came. Taken separately, each is another grievance in a kingdom full of them. Bound beneath the Order's seal, they become a claim to every divided province of #G Herue#!. Our scribes leave room for a king's signature beneath our authority. They also prepare copies that require no king at all.\n\nYour fellow #T Grandmaster#! stands over the map. Beyond its northern edge, the watch fires must already be burning. 'We asked them to settle the crown,' he says. 'They asked who would sit nearest the door.' He draws the nearest iron weight across a disputed border. 'Let us give them something else to discuss.'\n\nBy dawn, mounted heralds are waiting in the courtyard. The proclamation they carry names the lands the Order claims the right to reunite. Some courts will answer with protests. Others will call their banners. In the stables below, our captains are already choosing horses."
 ob_order.7.a: "Guarantee the warehouses and pay for the first deliveries."
 ob_order.7.t: "The Price of Open Harbours"
 ob_order.7.desc: "The harbour merchants are prepared to supply the north, my [ROOT.GetCountry.GetRulerTitle]. They are less prepared to let a restored king seize their warehouses once the danger has passed.\n\nA charter promising predictable duties and protection for civic property would bring their factors into our supply arrangements. If we govern the port ourselves, the same promises must be made to its inhabitants; a ruined harbour is of very little use, however impressive the conquest sounded at chapter."
 ob_order.8.a: "Let the grain ships sail."
 ob_order.8.b: "Require the estates to provide their share."
 ob_order.8.t: "The Grain Covenant"
 ob_order.8.desc: "Our envoys return from the northern island with a grain agreement. Ships will carry the island harvest to our capital, where expanded storehouses will hold the surplus and the grain market will bring a steady return."
 ob_order.9.a: "Entrust the watch to [ROOT.GetCountry.GetCoRuler.GetFirstName]."
 ob_order.9.b: "Pay a chapter commission to oversee the watch."
 ob_order.9.t: "One Watch, Many Banners"
 ob_order.9.desc: "The towers are supplied, but the officers have discovered a further difficulty: each believes his ruler should command the men beneath them. The #T Crimson Army#! will not readily accept a rival claimant's captain, and the brothers are unwilling to leave their stores in royal hands.\n\n#Y [ROOT.GetCountry.GetCoRuler.GetName]#! offers to take responsibility. He has the experience, and many veterans already look to him. #Y [ROOT.GetCountry.GetRuler.GetName]#! could instead name a separate chapter commission to divide that authority, though its members would expect payment for their work."
 ob_order.10.a: "Warn the northern courts. Let them see the evidence."
 ob_order.10.t: "Where the Darkness Gathers"
 ob_order.10.desc: "The brothers have laid their rough map beside the chapter’s candles. Soot has worked into the folds of the hide, and a dark stain obscures one turning. The man who drew it remembers that passage well enough.\n\nBeneath #G Mount Balthazar#!, the #R Drow#! have been gathering stores and keeping watch upon a road to the surface. We now know where that road begins. The names of the brothers who brought us this knowledge are read aloud before any orders are given."
 ob_order.11.a: "Prepare the accounts, and let every chapter be heard."
 ob_order.11.t: "The First Reckoning"
 ob_order.11.desc: "The first danger has passed, though there is little agreement over what it has proved. Some brothers credit the agreements that kept the watch supplied. Others insist that only the frontier officers understood the threat from the beginning.\n\nYour fellow #T Grandmaster#! has requested an accounting before the full chapter. His officers have already begun collecting statements. The stewards ask whether they should prepare the accounts as well; it seems unlikely that this meeting will concern military matters alone."
 ob_order.12.a: "Enter the orders and the accounts together in the chapter record."
 ob_order.12.t: "Who Gave the Orders?"
 ob_order.12.desc: "The chapter clerk brings #Y [ROOT.GetCountry.GetRuler.GetName]#! the orders issued during the northern emergency and the accounts that paid for them. The records tell two parts of the same story: soldiers needed prompt decisions, and those decisions depended on grain, wages, and households willing to sustain the watch.\n\n[ROOT.GetCountry.Custom('ob_command_account_context')]\n\nThe earlier settlement divided work between the #Y Grandmasters#! or placed its costs before the chapter. It did not settle whether either master could claim authority over the other. These records will accompany the ordinance over sole command, preserving what was ordered, what was promised, and who bore the cost."
 ob_order.14.a: "The #T Order#! must endure beyond the men who command it."
 ob_order.14.t: "Whose Oath Endures?"
 ob_order.14.desc: "The chapters have acknowledged #Y [ROOT.GetCountry.GetRuler.GetName]#! at #G Balthazaria#!. Orders can once again travel beneath a recognised seal, and the clerks have reopened the rolls of service and obligation.\n\n[ROOT.GetCountry.Custom('ob_dispute_aftermath')]\n\nRecognition is only a beginning. The returning households still need repairs, the watch still needs experienced officers, and the next generation must know whether the two seats will be restored. The immediate struggle is over; the work of governing can begin."
 ob_order.15.a: "Accept renewed oaths and allow the wounded to return."
 ob_order.15.b: "Retire the ringleaders and publish their offences."
 ob_order.15.t: "Brothers After Battle"
 ob_order.15.desc: "Repair accounts and petitions for reinstatement arrive together on #Y [ROOT.GetCountry.GetRuler.GetName]#!'s table. One commander asks to return to the watch. Another offers to retire if the chapter will leave the household estate intact. Younger brothers insist that obedience to a #Y Grandmaster#! should not condemn an entire company.\n\n[ROOT.GetCountry.Custom('ob_dispute_aftermath')]\n\nRenewed oaths would preserve experienced officers and ease the return to ordinary service. Publicly censuring and retiring the ringleaders would make the limits of obedience unmistakable, while giving the governing chapter firmer authority over appointments. Both courses must leave enough men and money to rebuild the watch."
 ob_order.16.a: "Restore the two seats under the authority of the chapter."
 ob_order.16.b: "One #Y Lord Protector#! shall answer for the #T Order#!."
 ob_order.16.t: "The Founding Covenant"
 ob_order.16.desc: "The clerks place two constitutions before #Y [ROOT.GetCountry.GetRuler.GetName]#!. Both bind the watch to the defence of the northern lands and preserve the brotherhood's obligations to its households. They differ over who may issue the orders.\n\nThe first restores two equal #Y Grandmasters#!. Their duties will be recorded, and the assembled chapter will judge disputes between the seats. The second keeps a single #Y Lord Protector#! responsible for command, with no second master sharing the seal.\n\n[ROOT.GetCountry.Custom('ob_constitution_concessions')]\n\nThe early agreement made the watch workable. This covenant must make the government endure after the men who sign it are gone."
 ob_order.17.a: "A Herulian king shall answer to the Order."
 ob_order.17.b: "No crown shall stand between the Order and its lands."
 ob_order.17.c: "The old protectorate settlement must be reconsidered."
 ob_order.17.t: "Who Shall Wear the Iron Crown?"
 ob_order.17.desc: "The claimants once left our conference unwilling to accept any peace but their own. The chapter must now settle what authority the Iron Crown may retain. One Grandmaster's answer was a king beneath our seal, preserving Herulian offices while owing obedience to the Order. The other demanded direct administration, with no royal court between the towns and the watch.\n\nIf Herue already has an independent ruler, we cannot appoint another by proclamation. We may demand that ruler's submission, or maintain our claims until conquest gives us the land. A refusal leaves the question open. Whichever policy we adopt, an independent kingdom is no final settlement: the northern union will require these lands beneath our authority."
 ob_order.18.a: "Confirm the charters and publish the obligations."
 ob_order.18.t: "The King's Peace, the Towns' Rights"
 ob_order.18.desc: "The harbour delegates have arrived carrying copies of every promise made when their grain was needed. They have brought enough clerks to read each promise aloud, should anyone at this meeting prove forgetful. The defeated estates have sent petitions as well, though their representatives are rather less confident of a welcome.\n\nThe proposed settlement confirms civic property, fixes lawful contributions, and permits the markets of #G Herue#! to recover. We can honour those terms in full and let the towns regain their confidence. We can also demand an extraordinary contribution before the charters are sealed. The treasury would welcome the money; the men obliged to provide it are unlikely to remember the occasion kindly."
 ob_order.19.a: "Accept the charter and its obligation to account for our brothers."
 ob_order.19.b: "The chapter shall judge its own servants."
 ob_order.19.t: "A Charter for the Sword"
 ob_order.19.desc: "My [ROOT.GetCountry.GetRulerTitle], our messengers have returned from the court of [ROOT.GetCountry.MakeScope.GetVariable('ob_charter_shannah').GetCharacter.GetName|Y]. The doors that once admitted us as distant petitioners now open to representatives whose names the stewards remember. Repairs paid for, services rendered, and rather more patient conversation than our knights usually enjoy have earned the Order a hearing.\n\nThe #T Shannah#!'s representatives have reviewed our arrangements in #G Herue#!. Their charter recognises the northern watch, but asks who will judge a knight who abuses the people he was sent to protect. We may accept their supervision or insist that the chapter must judge its own brothers.\n\nOur standing has secured this audience without calling in the services owed to us. Those may yet assist another petition, though what we say here will certainly be remembered."
 ob_order.20.a: "Chain the thing below the chapel. Double the watch."
 ob_order.20.t: "The Dead Beneath the Snow"
 ob_order.20.desc: "The Drow are abandoning passages beneath the northern mountains. In their flight they have broken doors cut into the rock before Herue had kings. Refugees speak of hammering under the glaciers above Lyodulgard, Nimr and Gieb. It continues after the miners have fled.\n\nA patrol found our missing brother Lanuthua standing among the bodies of its predecessors. His name was entered among the dead at Kiaguthmajnnorr. His skin was frozen through. When the captain called to him, every corpse turned its head.\n\nThe brothers brought him back in chains. He has spoken only once: 'The Rimebound remember the way south.' The oldest chapter records place that name beside rites of Melodias and an instruction to burn any body recovered from the ice. Tonight the guards heard their own voices answering him from inside his locked cell."
 ob_order.21.a: "Burn the shrine. Break the thing wearing our brother."
 ob_order.21.b: "Recover the living and seal the approaches."
 ob_order.21.c: "Bind the herald. Make it reveal the Drow roads."
 ob_order.21.t: "What the Ice Remembers"
 ob_order.21.desc: "There is no settlement beneath the glacier. Our scouts found a stair descending between walls of clear ice. People stood inside them, upright and unharmed. Some wore mail older than the Order. One woman moved her eyes as the brothers passed.\n\nAt the foot of the stair, a black stone bears the mark of Melodias. The names scratched around it belong to villages that have not yet been attacked. Fresh names appear each night. Since the Drow broke the deep seals, the ice has advanced against the wind and the dead have begun to walk out of it.\n\nWe have found an anchor of the Rimebound, not the whole of what lies below. Fire may break this foothold. The captives nearest the surface might still be recovered. Our wardens have another proposal: the chained thing knows the Drow tunnels. They believe they can make it answer. Yesterday it began calling each of them by a name known only to his mother."
 ob_order.22.a: "Confirm the obligations and compensate the affected communities."
 ob_order.22.t: "A Peace That Can Survive Its Makers"
 ob_order.22.desc: "My [ROOT.GetCountry.GetRulerTitle], a new estate-holder has refused the contribution promised by his predecessor. His steward explains that the old agreement belonged to a dead man, an interpretation which several neighbouring households have already found remarkably persuasive.\n\nThe revised settlement attaches duties to lands and offices. A successor may inherit the estate, but he will inherit its share of the watch as well. The signatories have accepted the wording, and a separate renewal will enter the passage rights, truces, and recognition of our chapter lands.\n\nOur remaining funds may support improvements in two provinces, or one improvement alongside compensation for the communities caught in the dispute. The stewards assure us that either account can be made to balance. For once, they may be telling the truth."
 ob_order.23.a: "Fund the watch and keep the muster rolls ready."
 ob_order.23.t: "Watchfires for Those Yet Unborn"
 ob_order.23.desc: "The frontier chapters have submitted their permanent establishment: stores, muster rolls, officers, and a reserve paid for before the next alarm arrives. The accounts are less glorious than a victory procession, but considerably more useful to the men who must answer that alarm.\n\nReports recovered from the early host speak of greater powers beneath the earth. We have broken one expedition, not emptied the depths. The #T Northern Watch#! will therefore maintain a limited emergency muster, with its costs and period of service entered plainly in the chapter books."
 ob_order.24.a: "Let those who come after us find the watch still standing."
 ob_order.24.t: "The Shield Before the Crown"
 ob_order.24.desc: "My [ROOT.GetCountry.GetRulerTitle], the assembled delegates have heard the settlement read aloud. The brothers know who commands them, the towns know what they owe, and the northern watch has stores and officers appointed before the next alarm.\n\n[ROOT.GetCountry.Custom('ob_ending_constitution')]\n\n[ROOT.GetCountry.Custom('ob_ending_herue')]\n\n[ROOT.GetCountry.Custom('ob_ending_crisis')]\n\n[ROOT.GetCountry.Custom('ob_ending_leadership')]"
 ob_order.100.a: "Send our representatives to the capital."
 ob_order.100.b: "We have our own affairs to settle."
 ob_order.100.t: "The Knights Request an Audience"
 ob_order.100.desc: "The Balthazarian Order invites our ruler's representatives to its capital to discuss the roads, the frontier, and the succession to Herue's Iron Crown. Attendance promises a hearing, not agreement to another claimant's demands. Our existing wars and sovereignty remain our own."
 ob_order.200.a: "Bring the reports to both Grandmasters."
 ob_order.200.t: "The Host Beneath the Snow"
 ob_order.200.desc: "My #Y [ROOT.GetCountry.GetRulerTitle]#!, the reports from beneath the northern approaches agree: the #R Drow#! are gathering stores for a host. Their preparations advance while the surface lords quarrel.\n\nThe chapter report records the growing danger. Destroying stores may set them back; a failed attack may convince their commanders to march sooner. If the threat reaches #R 100#!, the early host will emerge.\n\nWe must secure the roads, supplies, watch and frontier forts, then finish our counter-expedition before their preparations are complete. The greater powers beneath the earth remain beyond the reach of this operation."
 ob_order.201.a: "Let the north hear what the brothers have done."
 ob_order.201.t: "The Magazines Are Broken"
 ob_order.201.desc: "The expedition has returned, my [ROOT.GetCountry.GetRulerTitle]. Its officers report that the magazines were burned, the marked approaches broken, and the gathering warriors forced to disperse before their stores could be replaced.\n\nFor once, the communities waiting behind our watchtowers will hear that a host has been stopped before it reached their fields. The brothers have brought back dispatches as well. These speak of other rulers and greater preparations below; our success has ended this commander's expedition, not the danger from the #R Drow#!."
 ob_order.202.a: "Send the warning to every participating court."
 ob_order.202.t: "The Early Host Emerges"
 ob_order.202.desc: "The threat has reached its breaking point, and the reports now concern soldiers rather than stores. The #R Drow#! host has emerged and declared war upon a neighbouring northern realm. Our unfinished expedition will have no further opportunity to destroy its magazines.\n\nThe work already done still matters. An organised watch has reduced the enemy's opportunity to gather its full strength, and discovered routes have exposed some of the reinforcements. We must now endure the campaign and recover the frontier. The report names the actual attacker and defender; this host will not appear beyond an impassable waste merely to reach us."
 ob_order.203.a: "Take account of what remains, and begin the repairs."
 ob_order.203.t: "An End to the First Campaign"
 ob_order.203.desc: "The early host's war has ended, my [ROOT.GetCountry.GetRulerTitle]. The frontier reports must now be read alongside the peace settlement: surviving a campaign is not the same thing as recovering every community caught in it.\n\nBefore we claim that the first danger is resolved, the Order must be at peace, hold its chapter seat, and restore a fortified watch. The chapters are also asking who should answer for the preparations that were left unfinished. Their meeting is unlikely to be a quiet one."
 ob_order.204.a: "Record what we know, without embellishment."
 ob_order.204.t: "The Gathering Disperses"
 ob_order.204.desc: "The scouts can find no independent #R Drow#! power with a usable northern bridgehead. The gathering described in their earlier reports has dispersed or lost the lands needed to launch its expedition.\n\nThis is welcome news, though it would be dishonest to announce that our counter-expedition won a battle it never fought. No prevention reward will be claimed. The northern watch still has reason to remain vigilant against greater preparations below."
 ob_order.205.a: "Keep the staging ground supplied."
 ob_order.205.t: "Six Months beneath the Approaches"
 ob_order.205.desc: "The counter-expedition has begun. Its officers have taken the committed funds and manpower, and will need #Y 180 days#! to destroy the magazines.\n\nIf our fortified staging ground or food stores fail, the expedition must turn back. If the host emerges first, the operation is too late. The report remains available throughout; abandoning the mission tree will not stop the calendar."
 ob_order.206.a: "Bring them home and review the remaining time."
 ob_order.206.t: "The Expedition Turns Back"
 ob_order.206.desc: "Our officers have recalled the expedition. The staging arrangements no longer meet the conditions under which the brothers were sent, and they cannot remain beneath the approaches without supplies.\n\nThe committed resources have already been spent. We can organise another expedition if the frontier is restored and enough time remains before threat reaches #R 100#!. The #R Drow#! have not agreed to postpone their preparations while we make ours."
 ob_order.300.a: "Yield the seal to [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName]; spare the brotherhood a war."
 ob_order.300.b: "Reject [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName]'s demand and defend the seal by arms."
 ob_order.300.t: "One Seal for the #T Order#!"
 ob_order.300.desc: "#Y [ROOT.GetCountry.GetRuler.GetName]#! enters the chapter hall at #G Balthazaria#! to find armed retainers beside the doors. #Y [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetName]#! stands among the frontier captains with a written ordinance. The officers have kept their swords.\n\nThe ordinance gives [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] sole command of the brotherhood. Frontier appointments, stores, and military orders would pass beneath one seal. The two-seat arrangement would end.\n\n[ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] calls it a necessary answer to the northern emergency. To [ROOT.GetCountry.GetRuler.GetFirstName], it is a demand to surrender the office that both #Y Grandmasters#! swore to share. The earlier agreement over rotations and household relief has not settled this question of authority.\n\nYielding the seal will make [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] ruler of the #T Order#! under a single protector. Refusing will bring the quarrel to arms: the challenger intends to lead a rival chapter in #R civil war#!. The brothers wait for an answer."
 ob_rebel_name: "The Rival Chapter"
 ob_order.301.a: "Summon the surviving officers and account for the missing."
 ob_order.301.t: "The War Ends, the Oath Remains"
 ob_order.301.desc: "The war between the chapters has ended. #Y [ROOT.GetCountry.GetRuler.GetName]#! receives reports from officers who once shared barracks and now count one another among the dead, the missing, and the prisoners. The banners can be brought together more quickly than the men beneath them.\n\nThe fighting has settled the immediate contest for command. It has not written a constitution. The chapter must regain its seat at #G Balthazaria#!, restore order, and decide how the surviving brothers will serve together before choosing between two #Y Grandmasters#! and one #Y Lord Protector#!."
 ob_order.302.a: "Keep the garrisons at their posts until the chapter meets again."
 ob_order.302.t: "An Ultimatum Without a Rising"
 ob_order.302.desc: "#Y [ROOT.GetCountry.GetRuler.GetName]#! has refused the demand for sole command, but #Y [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetName]#! has not established a rival chapter in the field. The threatened rising has produced no separate power against which the #T Order#! can march.\n\nThe seals remain divided in purpose rather than in territory. [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] retains the second seat while the officers attempt another meeting in thirty days. There has been no victory and no reconciliation; the ultimatum must be answered again when the chapter assembles."
 ob_order.400.a: "Destroy the herald, its anchor, and every transcript."
 ob_order.400.b: "Evacuate the chapel. Bring the Shannah's exorcists."
 ob_order.400.c: "Silence the witnesses. Continue the interrogations."
 ob_order.400.t: "It Knows the Way In"
 ob_order.400.desc: "The cell is still locked. Every chain is intact. The wardens insist that nothing has escaped.\n\nFor seven nights, however, the lower chapel has filled with snow. It falls through a stone ceiling with three floors above it. Names appear in the frost on the inside of the doors. The men who answer when those names are spoken do not return to their beds. Last night a sentry saw his missing son standing on the wrong side of a mirror.\n\nWe asked the herald how to enter the Drow strongholds. With every answer, it learned the shape of our walls, the hours of our watch, and the names of the men who guarded it. The Rimebound never needed its body to leave the cell. The Shannah's exorcists demand that the link be cut. Our officers still want the next answer."
 ob_order.401.a: "Enter both undertakings in the same record."
 ob_order.401.t: "The Charter Is Renewed"
 ob_order.401.desc: "The surviving signatories have renewed the northern obligations under their present rulers. The clerks have attached the contributions to offices and estates, making it rather harder to forget them at the next succession.\n\nWhere a claimant has restored #G Herue#!, the Order's independence must also be entered in the settlement. The king has therefore been asked to withdraw claims on the chapter's existing lands in return for continued cooperation."
 ob_order.402.a: "Let Norrfalia remember the oath that brought us here."
 ob_order.402.t: "All the North Beneath Our Watch"
 ob_order.402.desc: "The lands required for #G Norrfalia#! now answer to our country or its subjects. The formation has given this northern union a name; the brotherhood must decide how faithfully it will keep the watch that justified its authority.\n\nOur constitution remains in force. A larger realm has not silently restored a second seat or taken the seal from the #T Lord Protector#!. Those who govern this country will still answer under the settlement made by its chapters."
 ob_order.170.0: "Recognise [GetCountry('GN2').GetRuler.GetName|Y]."
 ob_order.170.1: "Recognise [GetCountry('NR5').GetRuler.GetName|Y]."
 ob_order.170.2: "Recognise [GetCountry('NR8').GetRuler.GetName|Y]."
 ob_order.170.3: "Recognise [GetCountry('NR7').GetRuler.GetName|Y]."
 ob_order.170.4: "Recognise [GetCountry('HEO').GetRuler.GetName|Y]."
 ob_order.170.back: "Reopen the crown settlement."
 ob_order.170.t: "A Name for the Iron Crown"
 ob_order.170.desc: "The cooperating claimants await an answer. Each has supplied an account of his rights to the #T Iron Crown#!, and each account reaches much the same conclusion about its author.\n\nOur recognition will identify the realm whose restoration we support. It will not transfer another ruler's lands or settle his wars for him. Should that realm disappear, we may return to the report and choose another settlement."
 ob_order.500.a: "Close the chapter report."
 ob_order.500.t: "The Northern Chapter Report"
 ob_order.500.desc: "$ob_report_body$"
 ob_order_mission: "The Shield and the Iron Crown"
 ob_order_mission_DESCRIPTION: "For a century, the knights of the #T Order of Yvius Balthazar#! have carried the light of #T Hellas#! into the harsh north of #G Luxterra#!. Where the #R Drow#! once ruled, their founder raised his banner beside the tribes he had come to save, winning followers with his courage as readily as with his sermons. His brothers inherited a sacred duty: to stand between the northern peoples and the darkness beneath their feet.\n\nBut the quarrels of kings have found their way into the chapter houses. As the claimants of #G Herue#! tore their kingdom apart, knights who had sworn the same oath took up arms beneath opposing banners. Defeat followed division, and at #G Kiaguthmajnnorr#! in 996 LC, victory cost the Order both of its #Y Grandmasters#!.\n\nFive years later, two new masters sit beneath the old banners. Beyond their walls, frightened villages await protection, the #T Iron Crown#! remains bitterly contested, and the caves have grown restless once more. The north has not forgotten #Y Balthazar#!. Whether his knights are still worthy of his name remains to be seen."
 ob_order_mission_CRITERIA_DESCRIPTION: "This mission will be completed when we have restored the strength of the #T Order#!, settled its leadership, and established a lasting watch over the north."
 ob_order_mission_BUTTON_DETAILS: "Restore the brotherhood of Balthazar and bring peace to the troubled north."
 ob_order_mission_BUTTON_TOOLTIP: "The knights of Balthazar must recover their purpose before the north is lost to the quarrels of kings and the darkness below."
 ob_early_army_name: "The Host Beneath the Snow"
 ob_watch_army_name: "The Northern Watch"
 ob_deadline_tt: "The early Drow host invades at #R 100 Threat#!. Threat rises by #Y 5#! every half-year; the cave expedition can alter it. Completing the counter-expedition before 100 prevents this early host only."
 ob_ultimatum_tt: "The demand for sole command is answered in the ultimatum event. Recording the ordinance here does not repeat that choice or begin another war."
 ob_task_11_tt: "Resolve the early host, conclude peace, hold #G Balthazaria#!, and restore two owned forts. A completed counter-expedition prevents the host; otherwise its war must end before recovery is recognised."
 ob_task_1: "Gather The Broken Lances"
 ob_task_1_DESC: "Veterans of the failed northern campaign are returning to #Y [ROOT.GetCountry.GetRuler.GetName]#! with their families. Commit the treasury and the chapter's authority to settling them at the capital, restoring the households and experienced service on which the #T Order#! depends."
 ob_task_2: "The Two Seats Of Balthazar"
 ob_task_2_DESC: "#Y [ROOT.GetCountry.GetRuler.GetName]#! and #Y [ROOT.GetCountry.GetCoRuler.GetName]#! inherited equal seats at the head of the #T Order#!, but the survivors of #G Kiaguthmajnnorr#! need decisions that neither master can make alone. The frontier companies need relief; the returning households need grain, roofs, and land. Bring the two #Y Grandmasters#! together at the capital's #T Court of Law#! and agree how the chapter will meet both obligations."
 ob_task_3: "Bread Before Sermons"
 ob_task_3_DESC: "A hungry household finds little comfort in a sermon. Fill the stores of [ROOT.GetCountry.GetCapital.GetName|G] and bring grain to its gates, so that our promises may last through winter."
 ob_task_4: "Account For The Fallen"
 ob_task_4_DESC: "Letters from the lost campaign have reached #Y [ROOT.GetCountry.GetRuler.GetName]#!. Missing grain and diverted wagons helped turn a retreat into a disaster; some of the captains named in the accounts served beside #Y [ROOT.GetCountry.GetCoRuler.GetName]#!. Complete the inquiry and decide whether the findings belong before the whole chapter or within the #Y Grandmasters#!' council."
 ob_task_5: "Summon The Claimants"
 ob_task_5_DESC: "Summon the claimants to our capital and seek a settlement for #G Herue#!. If no ruler will yield, the chapter must decide how its own authority can secure the northern roads."
 ob_task_6: "A Backup Plan"
 ob_task_6_DESC: "The claimants have been heard. The Order must now assert its own right to reunite the lands of #G Great Herue#!. Draw up claims to the territories required to restore the kingdom, giving our knights a lawful cause for the campaigns ahead."
 ob_task_7: "The Price Of Open Harbors"
 ob_task_7_DESC: "The northern watch needs ships as surely as it needs swords. Win the confidence of the harbour towns, whose merchants remember every promise a king has broken."
 ob_task_8: "The Grain Covenant"
 ob_task_8_DESC: "The northern island can supply the grain our capital needs. Send a gift to the owner of [GetProvince('(int32)380').GetName|Y], befriend its governor, and establish a lasting grain trade, filling our storehouses and bringing new revenue to the capital."
 ob_task_9: "One Watch, Many Banners"
 ob_task_9_DESC: "The frontier forts need a common command as well as stores and soldiers. #Y [ROOT.GetCountry.GetRuler.GetName]#! must decide whether #Y [ROOT.GetCountry.GetCoRuler.GetName]#! should direct the watch or whether a paid commission of the chapter should share that duty. Assemble the men and restore the strongpoints before appointing their officers."
 ob_task_10: "Where The Darkness Gathers"
 ob_task_10_DESC: "Beneath #G Mount Balthazar#! lie passages the shepherds will not enter. Gather the brothers at [GetProvince('(int32)1036').GetName|G] and send them below, before whatever dwells there finds its own road to the daylight."
 ob_task_11: "The Host Beneath The Snow"
 ob_task_11_DESC: "The first danger must pass before the north can draw breath. Bring the frontier through the gathering storm, and leave its watch strong enough to greet the next dawn."
 ob_task_12: "An Accounting Of Command"
 ob_task_12_DESC: "The first northern emergency has ended, but the #T Order#!'s captains disagree over who had the right to command it. Gather their orders and the stewards' accounts at #G Balthazaria#!. #Y [ROOT.GetCountry.GetRuler.GetName]#! must establish what the chapter authorised before demands for emergency powers become a challenge to the two-seat covenant."
 ob_task_13: "The Chapter Of Broken Seals"
 ob_task_13_DESC: "Enter the demand for sole command and the answer to it in the chapter records. The ultimatum itself determines whether the seal changes hands peacefully or the #T Order#! divides in #R civil war#!; this accounting records that decision."
 ob_task_14: "Whose Oath Endures?"
 ob_task_14_DESC: "The contest for the seal has ended. Restore the chapter's seat at #G Balthazaria#! and recover the stability needed for #Y [ROOT.GetCountry.GetRuler.GetName]#! to govern. Whether authority changed hands by surrender or by war, the #T Order#! needs a recognised leadership before it can rebuild."
 ob_task_15: "Brothers After Battle"
 ob_task_15_DESC: "With command settled, #Y [ROOT.GetCountry.GetRuler.GetName]#! must repair the fortified capital and the households that sustain the watch. Once peace and building work permit, decide whether former opponents may return to service under renewed oaths or whether their leaders should be retired and publicly censured."
 ob_layout_requires_14: "Complete #Y Whose Oath Endures?#!."
 ob_task_16: "The Founding Covenant"
 ob_task_16_DESC: "The immediate dispute is settled and the capital is rebuilding. #Y [ROOT.GetCountry.GetRuler.GetName]#! must now give the #T Order#! a lasting constitution: restore two #Y Grandmasters#! under rules enforced by the chapter, or retain a single #Y Lord Protector#!. The decision will determine how the brotherhood is governed beyond the present crisis."
 ob_task_17: "Who Shall Wear The Iron Crown?"
 ob_task_17_DESC: "Settle the #T Iron Crown#! beneath the Order's authority: preserve a subordinate king, or govern #G Herue#! directly. An independent ruler must submit or be overcome before the northern union can be completed."
 ob_layout_requires_16: "Complete #Y The Founding Covenant#!."
 ob_task_18: "The King's Peace, The Towns' Rights"
 ob_task_18_DESC: "Peace will mean little if the towns merely exchange one grasping lord for another. Give their councils reason to welcome the settlement, and their children reason to trust it."
 ob_task_19: "A Charter For The Sword"
 ob_task_19_DESC: "Our swords are carried in the name of #T Hellas#!, but even a faithful hand may strike unjustly. Seek the #T Shannah#!'s recognition, and face the obligations that come with it."
 ob_task_20: "The Dead Beneath The Snow"
 ob_task_20_DESC: "The #R Drow#! have broken roads and seals beneath the northern mountains. Beyond #G Lyodulgard#!, #G Nimr#! and #G Gieb#!, something older is stirring under the glaciers. Follow the patrols that have ceased to answer."
 ob_task_21: "What The Ice Remembers"
 ob_task_21_DESC: "The #T Rimebound#! are an ancient #R Melodian#! evil beneath the northern glaciers. Their herald wears a dead brother's face. Break their foothold, rescue those still alive, or risk using what speaks through him."
 ob_task_22: "A Peace That Can Survive Its Makers"
 ob_task_22_DESC: "A good peace must endure the burial of its makers. Bind the roads, towns, and estates to promises their heirs cannot quietly leave beside the grave."
 ob_layout_requires_19: "Complete #Y A Charter for the Sword#!."
 ob_task_23: "Watchfires For Those Yet Unborn"
 ob_task_23_DESC: "One day the watchfires will be tended by men who never knew our names. Leave them full stores, sound walls, and brothers ready to answer when the beacons call."
 ob_layout_requires_22: "Complete #Y A Peace That Can Survive Its Makers#!."
 ob_task_24: "The Shield Before The Crown"
 ob_task_24_DESC: "Unite the northern lands as #G Norrfalia#! and leave the Order a watch worthy of its promises. Independent crowns and subordinate courts must give way to the government that will keep the peace."
 ob_task_25: "All The North Beneath Our Watch"
 ob_task_25_DESC: "Bring the peninsula, borderlands, and #G Great Herue#! beneath our authority. Proclaim #G Norrfalia#! and absorb its subject courts into one northern government."
 ob_chapter_report: "The Northern Chapter Report"
 ob_chapter_report_desc: "#T Drow Invasion Threat#! #R [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_threat')|0] / 100#!\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_threat_meter')]\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_crisis')]\nThreat rises by #R 5#! every half-year. Cave expeditions can reduce or increase it. The early host invades at #R 100 Threat#!.\n\n#T Order Preparedness#! #G [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_preparedness')|0] / 100#!\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_preparedness_meter')]\nEach requirement below contributes #Y 20#!. Losing forts or food lowers preparedness.\nTwo owned forts: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_forts')]\nRoads agreement: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_roads')]\nGrain covenant and 200 capital-state food: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_grain')]\nCommon watch: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_watch')]\nIntelligence: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_intel')]\nExpedition: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_expedition')]\nLaunch through #Y Break the Mustering Host#!: #Y 75 gold, 2 manpower, 180 days#!. At 100 preparedness, launch the expedition when you have the resources, no civil war, and threat below 100 throughout the expedition. Keep both forts and the food reserve throughout. Only a completed expedition prevents the early host. The later greater invasion remains."
 ob_counter_expedition: "Break the Mustering Host"
 ob_counter_expedition_desc: "Commit #Y 75 gold#! and #Y 2 manpower#! to a #Y 180-day#! expedition. Finish before threat reaches #R 100#! while retaining two owned forts, the grain covenant, and 200 food in the capital province. The operation prevents only the early host."
 ob_muster_watch: "Muster the Northern Watch"
 ob_muster_watch_desc: "Spend #Y 75 gold#! and #Y 2 manpower#! to raise six cohorts for up to #Y two years#! during a war against the #R Drow#!. The muster ends when that war ends. Cooldown: #Y ten years#!."
 ob_assume_herue: "Assume the Protectorate of Herue"
 ob_assume_herue_desc: "With #G Great Herue#! under our country or its subjects, the #T Lord Protector#! may assume responsibility for the realm. The #T Balthazarian Order#! government is preserved; the capital moves to #G Dawaon#!."
 ob_renew_congress: "Renew the Congress Invitations"
 ob_renew_congress_desc: "Spend #Y 15 gold#! and #Y 5 political influence#! to approach rulers who refused the congress. Existing signatures and unanswered invitations remain in force. Available once per year."
 ob_reconsider_crown: "Reconsider the Herulian Settlement"
 ob_reconsider_crown_desc: "Review our intended settlement if a claimant has disappeared or circumstances have changed. Earlier expenditure is not refunded. Review is available once per year."
 ob_norrfalia_epilogue: "All the North Beneath Our Watch"
 ob_norrfalia_epilogue_desc: "Record the formation of #G Norrfalia#! after the final chapter. This grants no duplicate formation investments."
 ob_last_hearth_lantern: "Lantern of the Last Watch"
 ob_last_hearth_lantern_desc: "A ward-lamp recovered from the shrine beneath the glacier. Its flame bends toward the ice even when there is no wind."
 ob_status_ready: "#G Ready#!"
 ob_status_missing: "#R Outstanding#!"
 ob_ending_constitution_0: "Two #T Grandmasters#! will continue to hold the seats of #Y Balthazar#!, with the assembled chapter empowered to settle their disputes. The brothers have seen what happens when each master gathers a country of his own."
 ob_ending_constitution_1: "The #T Lord Protector#! now holds the authority once shared between two masters. Those who supported the change expect dependable command; those who opposed it will remember the promises made when the second seat was abolished."
 ob_ending_herue_0: "The lands of Herue have entered the united government of Norrfalia. The Order now answers directly for the peace once promised by competing kings."
 ob_ending_herue_1: "The old congress has given way to Norrfalia. Its separate courts can no longer leave the northern watch dependent upon competing promises."
 ob_ending_herue_2: "The Herulian crown was brought beneath the Order's seal. With the formation of Norrfalia, its subordinate court has entered the united northern government."
 ob_ending_crisis_0: "The smaller #R Drow#! host was broken before it emerged. The people behind the watchtowers were spared a campaign, and the chapter can point to preparations that protected more than its own reputation."
 ob_ending_crisis_1: "The early gathering lost its northern bridgehead and dispersed. The chapter has recorded that welcome result without claiming an expeditionary victory it did not win."
 ob_ending_crisis_2: "The smaller #R Drow#! host emerged before the preparations were complete. Its campaign has ended, and the Order has recovered enough of its frontier to resume the watch. The greater powers below remain."
 ob_ending_leadership_0: "The former master yielded the seal rather than divide the brotherhood by arms. His successor has inherited the undertakings made before that surrender, along with the men who expect them to be honoured."
 ob_ending_leadership_1: "The dispute between the masters was settled by civil war. The surviving leadership has restored the chapters, but the names of brothers killed by brothers will remain in their records."
