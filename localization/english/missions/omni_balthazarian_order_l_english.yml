l_english:
 ob_convoy_port_tt: "Have at least #Y 2 Port#! buildings at #G Balthazaria#!."
 ob_convoy_fleet_tt: "Dock one of our fleets with at least #Y 10 ships#! at #G Balthazaria#!."
 ob_convoy_supplies_tt: "Import #Y Wood#! and #Y Salt#! into the province of #G Balthazaria#!."
 ob_towns_sworn_tt: "The coast towns of #G Herue#! swear to supply the northern watch. #Y A Peace That Can Survive Its Makers#! can enter their contributions in the estate rolls."
 ob_convoy_charters: "Escorted Merchant Convoys"
 desc_ob_convoy_charters: "Merchants load their own cargo beside the chapter's supplies. The escorts sail on published dates, so the harbormasters know when to have a berth ready."
 ob_winter_grain_fleet: "The Winter Grain Fleet"
 desc_ob_winter_grain_fleet: "The chapter has reserved convoy space for grain, and the granary keepers can draw on the holds when the roads close."
 ob_fort_relief: "Relief of the Northern Forts"
 desc_ob_fort_relief: "Men who have spent winters on the northern walls are taking their turn at home while the reserve keeps the watch."
 ob_veteran_settlement: "Holdings for the Returning Families"
 desc_ob_veteran_settlement: "The clerks have entered the veterans' households on the capital rolls, and their children have a door to wait behind when the muster bell rings."
 ob_herue_envoys: "Letters to the Courts of Herue"
 desc_ob_herue_envoys: "The envoys carry the chapter's terms to the royal courts. A king who swears fealty can keep his seat and hear the towns' petitions himself."
 ob_herue_muster: "Muster Rolls for Herue"
 desc_ob_herue_muster: "The captains have sent in their rolls, and the quartermaster can lay in the companies' pay and provisions before they take the road."
 ob_herulian_watch_oath: "The Iron Crown's Watch Oath"
 desc_ob_herulian_watch_oath: "The king's seal stands beside the chapter's on the northern muster rolls. His wardens have sworn to keep the forts supplied and send men when the watch calls."
 ob_chapter_commissioners: "Commissioners of the Chapter"
 desc_ob_chapter_commissioners: "The chapter has sent clerks to open its own courts in the Herulian towns and engineers to survey the walls of those that still bar their gates."
 ob_hospice_grain: "Grain Reserved for the Hospice"
 desc_ob_hospice_grain: "The hospice keeps the grain entered under its exemption. The next levy falls on the estates sworn to feed the watch."
 ob_relief: "Bread Before Sermons"
 desc_ob_relief: "A granary and regular grain imports sustain the capital. Full storehouses have done rather more for public contentment than the chapter's sermons."
 ob_watch: "The Common Watch"
 desc_ob_watch: "The chapter keeps a full store, a posted watch, and a muster roll that is called every month at this strongpoint."
 ob_trade: "The Grain Covenant"
 desc_ob_trade: "Contracts sealed with the merchant houses keep grain moving to the northern markets in every season."
 ob_recovery: "Bind the Wounds"
 desc_ob_recovery: "The chapter has set aside coin and labor to mend the barracks, replace the gear, and pay the arrears owed to the companies."
 ob_shared: "The Founding Covenant"
 desc_ob_shared: "The #Y Sword Master#! commands the watch; the #Y Faith Master#! administers its revenues, courts, and religious obligations. Extraordinary contributions require both seals, and the chapter hears disputes between the offices."
 ob_sole: "The Protector's Command"
 desc_ob_sole: "One Lord Protector now answers for the commands issued in the Order's name."
 ob_charter: "Charter of the Northern Sword"
 desc_ob_charter: "The See has written the protection of the northern faithful into its charters, and the watch now stands as a recognized work of the faith."
 ob_vampire_intel: "Secrets of the Bound Herald"
 desc_ob_vampire_intel: "The prisoner names passages the Drow believed forgotten, and every answer he gives ends with a question about our own defenses."
 ob_compact_cost: "Wards Beneath the Chapel"
 desc_ob_compact_cost: "Braziers, inscribed chains and an unbroken watch contain the herald. No warden is permitted to hear it alone."
 ob_final: "The Shield Before the Crown"
 desc_ob_final: "The watch's stores, pay, and reliefs are written against the land itself, so they will outlast the men who wrote them."
 ob_lantern: "The Last Hearth Lantern"
 desc_ob_lantern: "A lamp recovered from the frozen hospice, now kept as a warning to those who stand watch."
 ob_watch_army: "The Northern Watch"
 desc_ob_watch_army: "A temporary defensive muster supported by the northern chapter houses."
 ob_expedition_timer: "The Counter-Expedition"
 desc_ob_expedition_timer: "The brothers are making their way to the Drow storehouses. This shows how long remains before the raid. Keep the capital's grain reserve supplied."
 ob_order: "Balthazarian Order"
 ob_order_desc: "Founded in #Y 795 LC#! by #Y Yvius Balthazar#! among the #Y Astvaenic#! tribes, this brotherhood of #T Helluvian#! knights guards the northern frontier. Its #Y Sword Master#! commands the companies, appoints their captains, and maintains the watch. Its #Y Faith Master#! administers the estates, keeps the accounts, and answers for the brotherhood's observance of the faith of #T Hellas#!. Neither office grants authority over the other.\n\nBoth former masters fell at #G Kiaguthmajnnorr#! in 996 LC. Their successors have inherited the same covenant, rather fewer brothers, and a considerable number of unpaid accounts."
 ob_order_ruler: "Faith Master"
 ob_order_ruler_female: "Faith Master"
 ob_order_co_ruler: "Sword Master"
 ob_order_co_ruler_female: "Sword Master"
 ob_order_consort: "Consort"
 ob_order_consort_female: "Consort"
 ob_protectorate: "Balthazarian Order"
 ob_protectorate_desc: "The two seats have been replaced by one #T Lord Protector#!, who commands the brotherhood and answers for the defense of the north."
 ob_protectorate_ruler: "Lord Protector"
 ob_protectorate_ruler_female: "Lord Protector"
 ob_protectorate_co_ruler: "Lord Protector"
 ob_protectorate_co_ruler_female: "Lord Protector"
 ob_protectorate_consort: "Consort"
 ob_protectorate_consort_female: "Consort"
 ob_frontier_heard: "The Frontier Brothers Were Heard"
 ob_dual_mandate: "The Shared Chapter Mandate"
 ob_agreement_opinion: "The Northern Agreements"
 ob_grievance_opinion: "The Price of Intervention"
 ob_early_invasion_wargoal: "The Early Drow Invasion"
 war_goal_ob_early_invasion_wargoal: "The Early Drow Invasion"
 ob_order.1.a: "Send the returning veterans north to relieve the forts."
 ob_order.1.b: "Settle the returning families on holdings near the capital."
 ob_order.1.c: "Pay for both. Grant the holdings and relieve the forts in turns."
 ob_order.1.t: "Gather the Broken Lances"
 ob_order.1.desc: "The veterans of #G Kiaguthmajnnorr#! come through the gates of [ROOT.GetCountry.GetCapital.GetName|G] with patched shields and families who have lived on borrowed floors for five winters. The clerk has room for every name on the muster roll, but his list of households with a roof to spare is much shorter, and the men have started asking him which of them will be lodged first.\n\nOne brother, with frost still in his beard from the road, lays his shield on the table before [ROOT.GetCountry.GetRuler.GetName|T] and asks for a strip of land inside the walls. If the Order calls him out again, he says, his children ought to know where to wait for him. A captain from the frontier has come down with the roster of a garrison that has kept its wall for four winters without relief, and he asks for the returning men to be sent north so that his own can have their turn at home.\n\nThe quartermaster can march the veterans to the northern forts, or the clerks can settle the families on holdings near the capital. If the treasury will pay for both, he says, he can relieve the longest-serving garrisons a few at a time while the clerks find land for the rest."
 ob_order.2.a: "Hear the captains' account of the missing reserve first."
 ob_order.2.b: "Hear the stewards' account of the missing supplies first."
 ob_order.2.t: "The Inquiry at Two Empty Seats"
 ob_order.2.desc: "Two empty chairs stand beneath the banner brought home from #G Kiaguthmajnnorr#!. At the rail of the #T Court of Law#!, the families of the dead wait while the clerk reads the names of the masters who fell. The Order held the field that day, but neither the reserve nor the wagons came up when the line began to give.\n\nThe Sword Master lays the march order before the clerk. The captains had orders to move before dusk, the Sword Master says, and the stewards still had the grain under lock when the order came. The Faith Master opens the requisition book at the page where those same captains signed for it. Each master asks that their own witnesses be heard first."
 ob_order.2.desc_protector: "Two empty chairs stand beneath the banner brought home from #G Kiaguthmajnnorr#!. The Lord Protector has called the captains and stewards before the #T Court of Law#! to account for the reserve and supply wagons that never reached the field.\n\nThe captains say the grain was still under lock when their orders came. The stewards have brought the book where those same captains signed for it. The families of the dead are waiting to hear which witnesses will be called first."
 ob_order.2.desc_norskulane: "\n\n[SCOPE.sChar('ob_norskulane').GetName|Y] steps to the rail. 'I carried the march order. The reserve captain sent me to the storehouse, and the steward there said he needed another warrant. I went back to the captain empty-handed.'"
 ob_order.2.desc_tethurane: "\n\n[SCOPE.sChar('ob_tethurane').GetName|Y] lays his ration slip on the clerk's table. 'This says my company was fed that morning. We got nothing. I saw wagons inside the gate when we marched out. Ask the officers who drew those rations where they went.'"
 ob_order.3.a: "Give the households first claim on the grain."
 ob_order.3.b: "Buy the watch a separate supply."
 ob_order.3.t: "Bread Before Sermons"
 ob_order.3.desc: "Families wait outside the #Y Granary#! in [ROOT.GetCountry.GetCapital.GetName|G] while the quartermaster weighs out the first sacks of the day. Grain has been coming in steadily enough to fill the reserve, and a baker who has bought his flour one sack at a time all winter asks whether he may lay in enough for the week.\n\nThe watch has sent down its ration roll with half the entries struck through. The Faith Master asks that the granary feed the households first, since the bakers will raise their prices the moment they hear the walls were given the better sacks. The Sword Master says the men on the walls can keep their full ration without touching the households' grain, if the chapter will pay a merchant for a separate supply."
 ob_order.3.desc_protector: "By the time the quartermaster weighs the first sacks at the #Y Granary#! in [ROOT.GetCountry.GetCapital.GetName|G], a baker at the door has counted out enough coin for a week's flour. He has been buying it by the day all winter, and he asks whether the reserve is full enough for him to put the whole sum down this morning.\n\nThe steward asks the Lord Protector to give the households first claim on the grain. The captain of the watch has brought the ration roll from the walls, where half the entries have already been struck through, and he says his men can keep their full ration if the chapter buys their grain separately. He has brought the merchant's price with him."
 ob_order.4.a: "Publish the receipts alongside the roll of the dead."
 ob_order.4.b: "Publish the roll and settle the receipts within the chapter."
 ob_order.4.t: "Account for the Fallen"
 ob_order.4.desc: "The clerk has set the roll of the dead beside the chapter accounts. A woman at the library door asks for the page that lists her sons, and when he finds it, she asks him to find the provisions issued in their company's name as well. He has the receipt. The company signed for a month of bread it never ate.\n\nThe Sword Master would send every town its roll and keep the receipts inside the chapter, where the officers who signed them can answer without being shamed in their own districts, since several of them still command companies the Order cannot spare. The Faith Master asks what the towns will make of a verdict they have only heard read aloud, and would send the receipts out with the names, so that each town can see what reached its sons and what the chapter still owes."
 ob_order.4.desc_protector: "The clerk has set the roll of the dead beside the chapter accounts. A woman at the library door asks to see the page where her sons' names are entered, and then she asks to see what was issued in their company's name. The company signed for a month of bread it never ate.\n\nThe Lord Protector can send the receipts out with the roll and let the towns judge the officers for themselves, or keep the receipts within the chapter and summon the men who signed them."
 ob_order.5.t: "The Table at Balthazaria"
 ob_order.5.a: "Seal the claims and send envoys to the royal courts."
 ob_order.5.b: "Seal the claims and muster the companies for Herue."
 ob_order.5.desc: "The stewards have laid a table for the envoys of #G Herue#! in [ROOT.GetCountry.GetCapital.GetName|G]. The invitations went out to every claimant who still holds a hall in the old kingdom, and they asked one plain question: what would it take for the border villages to sow in the spring? Each guest came under the chapter's safe conduct. The stewards have set the toll rolls beside a map of the frontier, so that the rulers can point to the crossings they claim and say who should answer for the riders who use them."
 ob_order.5.desc_right_guest: "\n\n[SCOPE.sChar('ob_summit_right_king').GetName|Y] sets down a tally of missing cattle. The last patrol to cross the boundary took the beasts from a village that had already paid its taxes for the year, and if the riders come back, the wardens have orders to hold them through the winter."
 ob_order.5.desc_left_guest: "\n\n[SCOPE.sChar('ob_summit_left_king').GetName|Y] brings a copy of a boundary oath sworn before the last king died. The riders were sent as far as the old stones, the ruler says, and the villages there still pay the dues entered on that roll."
 ob_order.5.desc_private: "\n\nWhen the servants clear the table, the masters are left with a stack of claims and no one's promise of safe passage. The Faith Master would back a king who swears to keep the roads in the Order's name, since the towns already know how to bring a complaint before a royal court. The Sword Master would put the roads under our own captains and leave the kings to argue over what remains. Either course begins with warrants for lands the chapter may soon have to defend."
 ob_order.5.desc_private_protector: "\n\nWhen the servants clear the table, a steward leaves the toll rolls open before the Lord Protector. He would back a king who will answer for the crossings, since the towns already know where to take a complaint against a royal toll keeper. A captain points instead to the crossings each claimant has called his own, and he asks for warrants to post the Order's men there before the villages send their cattle out again. The clerk has the claims ready to seal whichever course is taken."
 ob_order.7.a: "Guarantee the factors' warehouses on the quay."
 ob_order.7.b: "Put the covenant cargoes into the chapter's own granary."
 ob_order.7.t: "The Grain Covenant"
 ob_order.7.desc: "The first covenant cargo was weighed on the new quay at #G Balthazaria#! this morning, and the porters had finished before the carts from the high road came through the gate. A second ship is already standing off the harbor mouth, and the clerk at the capital's granary has opened a fresh page in the shipping book for the factors who have come to sign.\n\nThe factors will keep their ships on the northern run through the winter if the chapter stands behind the goods they store on its quays, since few of them can afford to lose a hold of grain to a broken warehouse twice. The quartermaster would rather spend that guarantee on the chapter's own reserve. If the covenant cargoes go straight into the chapter granary, he says, the watch will never have to buy its bread back from the same factors in a hard month."
 ob_order.8.a: "Seize the cargo and close our harbors to the house of Vaskarn."
 ob_order.8.b: "Make the house repay the shortfall and post a weigher on every quay."
 ob_order.8.c: "Take his silver quietly and keep the false bushel in the chapter strongbox."
 ob_measure_leverage_tt: "The house of #Y Vaskarn#! now owes the chapter for its silence, and its factor knows it."
 ob_order.8.t: "The Short Measure"
 ob_order.8.desc: "The clerks have spent the season at the new weigh-house in [ROOT.GetCountry.GetCapital.GetName|G], and every cargo from the house of #Y Vaskarn#! has come up a tenth short on the chapter's measure. Their factor's bushel has a base two fingers thick, and the last sacks off his ship had a layer of chaff beneath the grain where the porters could not feel it. The house has supplied the covenant since its first sailing, so the shortfall has been eaten in the barracks, in the hospice, and in every tower on the northern wall.\n\nThe factor has come to the chapter with a purse already counted out. The captains want his cargo seized and his ships kept out of the Order's harbors, since their men were the ones who stood watch on short bread. The stewards would rather make the house repay what it took and post a chapter weigher on every quay, which would keep the other factors honest without frightening them off. The clerk who kept the tally points out that the factor would pay a good deal more than his purse to keep the matter quiet, and that a merchant who owes the chapter a secret may be worth more than one who has been driven away."
 ob_order.9.a: "Give the watch to the veterans under the Sword seal."
 ob_order.9.b: "Pay a chapter commission to keep the vigil."
 ob_order.9.t: "The Towers Without Relief"
 ob_order.9.desc: "The brothers who came back from beneath #G Mount Balthazar#! have laid their map beside the watch roll. One of the passages they drew comes out under a tower whose garrison was last relieved before the harvest, and two more surface close enough to the high road that a lookout on the wall might have heard the digging. The captain who drew the map wants every post above that road manned before the Drow can bring wagons up it.\n\nThe captains ask to put the veterans on the walls. The men already know the roads, and their families know which seal answers for their pay. The stewards would rather appoint wardens under a commission of the chapter and pay them from a separate account, where the towns can see what the watch costs and no master can borrow from it."
 ob_order.10.a: "Warn the northern courts and show them the map."
 ob_order.10.t: "Where the Darkness Gathers"
 ob_order.10.desc: "The clerk from #G Ridkiath#! reads out the names of the men who came back, and while he reads, the captain unrolls the map from #G Mount Balthazar#! across the chapter table. Soot has blackened half the hide. Where it hides a turning, the brother who drew it puts his finger on the place and tells the chapter what was there, until the masters can follow a road wide enough for carts from the Drow stores almost to the last stair below the watch.\n\nThe watch already has its copy, and the captain asks who else should see it. The northern courts have towns of their own above those roads, and a warning under the Order's seal would put them in its debt. The officers who will lead the next company below would rather keep the map among the men who have to use it, since a road the Drow learn we have drawn is a road they will guard."
 ob_order.11.a: "Enter the company on the rolls."
 ob_order.11.t: "The Winter Watch"
 ob_order.11.desc: "When the #R Drow#! first came down in strength, some wardens went a whole winter without seeing the men promised to relieve them. That danger has passed, and the forts in the #G Norrfalian Borderland#! can take in supplies and send men to one another again. Their wardens have come to the chapter with a proposal: a company that stays on the rolls through the winter, when the levies go home and the roads begin to close.\n\nThe captains have brought the names of the knights and bowmen who will take the first watches. The stewards have set aside estate revenues for the forts, although the new company will still have to eat wherever it is sent. The quartermaster has entered its first winter's provisions beside the men on the roll, so the wardens will know what they can draw before the snow comes."
 ob_order.12.a: "Honor the requisition and buy the hospice fresh grain."
 ob_order.12.t: "Two Warrants, One Granary"
 ob_order.12.desc: "Among the warrants the veterans brought home is a hospice exemption bearing the Faith seal. The steward of the hospice has come to the chapter with his copy and an empty grain sack. The captain who drew the hospice's stores lays a requisition beside it under the Sword seal, and the two warrants carry the same date.\n\nThe captain says his men on the walls were already sharing rations when he sent for the grain. The steward has a list of wounded brothers he must feed through the winter. The chapter can honor the requisition and buy the hospice a fresh supply, or uphold the exemption and put the next levy on the estates already bound to feed the watch."
 ob_order.14.a: "The #T Order#! must endure beyond the men who command it."
 ob_order.14.t: "Whose Oath Endures?"
 ob_order.14.desc: "The chapter bell at #G Balthazaria#! rings for a full assembly for the first time since the demand for sole command was read. The clerks have carried the rolls of service back into the hall and laid them open on the long table, and the brothers come forward one company at a time to hear which seal their orders will carry from now on.\n\n[ROOT.GetCountry.Custom('ob_dispute_aftermath')]\n\nWhen the last company has been read, #Y [ROOT.GetCountry.GetRuler.GetName]#! asks the clerk to enter the date beside the names, so that nobody can later claim not to have heard."
 ob_order.15.a: "Let the returning brothers swear before the assembled companies."
 ob_order.15.b: "Read the warrant and enter each refusal in the record."
 ob_order.15.t: "Brothers After Battle"
 ob_order.15.desc: "At the muster in #G Balthazaria#!, the quartermaster calls the companies from the old pay roll while the clerk counts out the wages owed to each. Several captains who broke with the chapter during the contest wait by the gate with their discharge papers in hand, although their names were never struck from the roll.\n\n[ROOT.GetCountry.Custom('ob_dispute_aftermath')]\n\nThe captains at the gate ask to swear their oaths again in front of the men who will serve beside them. The officers who kept the chapter's orders want the clerk to read the warrant first and enter each refusal in the record, so that no one can later say the matter was forgotten. The assembled companies are waiting to hear which it will be."
 ob_order.16.a: "Restore the Sword and Faith offices beneath the chapter covenant."
 ob_order.16.b: "One #Y Lord Protector#! shall answer for the #T Order#!."
 ob_order.16.t: "The Founding Covenant"
 ob_order.16.desc: "The clerks have laid two constitutions before #Y [ROOT.GetCountry.GetRuler.GetName]#!. The clerk leaves space below each draft for the seals it would require.\n\nThe first constitution restores a #Y Sword Master#! to command the companies and a #Y Faith Master#! to administer the estates, courts, and religious houses. Ordinary military orders need no second signature. Extraordinary contributions and the suspension of sworn exemptions require both seals; the assembled chapter judges disagreements.\n\nThe second entrusts both charges to one #Y Lord Protector#!. Captains and stewards would answer to the same office, whose holder must account for their conduct before the chapter.\n\n[ROOT.GetCountry.Custom('ob_constitution_concessions')]\n\n[ROOT.GetCountry.Custom('ob_warrant_record')]"
 ob_order.17.a: "A Herulian king shall answer to the Order."
 ob_order.17.b: "No crown shall stand between the Order and its lands."
 ob_order.17.t: "Who Shall Wear the Iron Crown?"
 ob_order.17.desc: "The clerks lay the toll rolls beside the claims to the Iron Crown. A steward from #G Herue#! points out the crossings where the towns used to take their toll disputes before a royal judge, and he leaves the rolls open so that the chapter's captains can see which towns have been paying for the watch while the kings argued.\n\nThe stewards would set a king back on the Herulian throne, so long as he swears fealty to the Order and answers for the crossings, although a king who still holds his crown independently may refuse to kneel. The captains would rather have no crown at all between the chapter and the towns it protects. If the lands are already the Order's to settle, they ask that the whole of Herue be governed under the chapter's own seal."
 ob_order.18.a: "Pay the headland to keep a true light under the chapter's oath."
 ob_order.18.t: "The False Lights"
 ob_order.18.desc: "The convoy sailed from #G Balthazaria#! in good order, and by the third night it was strung out along the Herulian coast with a lantern burning at the head of every ship. Below #G Ternstens#! the lookouts saw a fire on the headland where the boatmasters have always kept their own light, and the leading grain ship turned in toward it. She struck the rocks a cable's length from shore. By morning her cargo was gone from the beach, although the tide had not taken it, and the escort found the ashes of the fire on a cart at the top of the cliff, where it could be wheeled wherever the village needed it."
 ob_order.18.desc_seized: "\n\nThe ships of the house of Vaskarn no longer sail in the Order's convoys, so the escort was two hulls short that night, and the captains had to spread their lanterns thinner than they liked."
 ob_order.18.desc_weighers: "\n\nThe chapter's weigher at #G Ternstens#! found the lost cargo two days later. It was being sold in the town market by the sack, and the sacks still carried the covenant's mark."
 ob_order.18.desc_leverage: "\n\nA letter from the factor of the house of Vaskarn reached the chapter before the escort captain's report. It names the headman who moves the fire, the beach where the cargo is landed, and the merchant in #G Ternstens#! who buys it, and it asks that the chapter remember who sent it."
 ob_order.18.desc_none: "\n\nThe escort captain has brought the ship's master home. He swears on his own life that the fire stood exactly where the boatmasters' light has always stood."
 ob_order.18.desc_choice: "\n\nThe boatmasters of #G Dalanmajn#! will sail again if someone answers for the headland. The stewards would pay the village to keep a true light under the chapter's oath, since a headman who is paid for an honest fire has less reason to move it, and the coast towns behind him would swear to supply the watch in the same bargain. The escort captain would hang the wreckers from their own cart and carry their families down the coast to #G Dalanmajn#!, where they can crew the grain boats under the chapter's eye. The next convoy is already waiting in the harbor for its orders."
 ob_order.19.a: "Accept the charter and its duty to account for our brothers."
 ob_order.19.b: "The chapter shall judge its own servants."
 ob_order.19.t: "A Charter for the Sword"
 ob_order.19.desc: "On the morning the charter is read, the deacons seat [ROOT.GetCountry.GetRuler.GetFirstName] beside the envoys of kings, and the clerks of the #Y Apostolic Palace#! lay out a parchment longer than any the Order has signed since its founding. [ROOT.GetCountry.MakeScope.GetVariable('ob_charter_shannah').GetCharacter.GetName|Y] has read our accounts and heard the Faith Master's answer, and the doors that once admitted us as distant petitioners now stand open.\n\nThe charter recognizes the northern watch as a work of the faith. It also asks who will judge a knight who abuses the people he was sent to protect. We may accept the supervision of the See over such cases, or insist that the chapter judges its own servants and carry that answer home to both seals.\n\n[ROOT.GetCountry.Custom('ob_office_duties_19')]"
 ob_order.20.a: "Chain the thing below the chapel and double the watch."
 ob_order.20.t: "The Dead Beneath the Snow"
 ob_order.20.desc: "The rear guard binds #Y Lanuthua#! with the rope it brought up for Drow prisoners and carries him down to the chapel below #G Nimzur#!, and by the time the jailer arrives with a length of chain, the rope has frozen stiff on his wrists. Lanuthua watches the jailer work. When the lock is closed, he calls the man by the name his mother used for him when he was a boy, which no one in the company has ever heard.\n\nOne of the brothers remembers the shield Lanuthua carried to #G Kiaguthmajnnorr#!, because he knelt beside him on the field until he stopped breathing. The priests have brought down an older roll from #G Herue#!, which names the vampires driven out of the towns in the founder's time and records what the watch was ordered to do with any body that came back from the high ice. The jailer asks whether he should fetch a second man before he locks the chapel for the night."
 ob_order.21.a: "Send the warning, and give Lanuthua to the priests for the pyre."
 ob_order.21.t: "What the Ice Remembers"
 ob_order.21.desc: "The captain brings the map from #G Mount Balthazar#! to the chapel below #G Nimzur#!, and #Y Lanuthua#! asks him to turn it until the north road lies nearest the door. The brothers marked the stair where they came under attack, but Lanuthua shows them a lower passage that comes out above #G Nordmajnng#!. The #R Drow#! opened it for the #R Rimebound#!, he says, and in return the dead told them how the old garrisons answered a call at the gate. When he gives the answer he used to give on watch, the captain asks him to say it again. His own men are still using it.\n\nA rider waits outside while the clerk copies the new road onto the watch map, and the priests have brought dry wood down from the chapel loft. They ask to burn Lanuthua before another man on the burial roll comes asking for a place by the fire, but the captain wants him alive, because the next time the Drow come out of the mountain there may be no one left who can show us how they got there.\n\n[ROOT.GetCountry.Custom('ob_office_duties_21')]"
 ob_order.22.a: "Send the surveyors and enter what each estate owes."
 ob_order.22.t: "A Peace That Can Survive Its Makers"
 ob_order.22.desc: "The heir's steward brought his late master's seal to the chapter wrapped in a piece of linen. He laid it beside the grain warrant and asked whose name the clerk meant to put on it now. The keeper of the watch brought out a receipt from the winter when that grain had failed to come, and the steward recognized the mark of the village that had made up the load.\n\nThe court will enter the watch's share against the estate, so the next heir can see what he owes before the first wagon is called. The surveyors want to walk the boundaries while the old tenants can still tell them which fields went with the warrant. The village has sent a woman who remembers loading that winter's wagon, and she asks the court to pay for what her neighbors sent before it spends the rest on the survey.\n\n[ROOT.GetCountry.Custom('ob_office_duties_22')]"
 ob_order.23.a: "Train the relief companies and keep the paid establishment ready."
 ob_order.23.t: "Watchfires for Those Yet Unborn"
 ob_order.23.desc: "At dusk the captain lights the first beacon above #G Nordmajnng#!. The next two answer before he has come down from the tower. By the time the last catches, there is light enough to make out the slope where the road from beneath #G Mount Balthazar#! comes out. Anyone on that road can now see which heights we hold. If the #R Drow#! mean to keep the passage, they have every reason to strike before the forts settle into their new watch.\n\nAt the chapter house, the captain lays down a standing order to call out the #T Northern Watch#! if the Drow attack. He has one more request. In the last drill, two forts sent their relief companies to the same gate. Give him the men for a few weeks now, he says, and each company will know where to go when it sees the fires. The quartermaster asks for those weeks to bring in grain and enroll replacements. If the roads are cut, he says, the first companies through may be the last for some time.\n\n[ROOT.GetCountry.Custom('ob_office_duties_23')]"
 ob_order.24.a: "Keep the name of Norrfalia. The watch will stand."
 ob_order.24.b: "Raise the banner of the Iron Covenant of Saint Balthazar."
 ob_iron_order_name: "Iron Covenant of Saint Balthazar"
 ob_iron_order_adjective: "Balthazarian"
 ob_iron_order_tt: "Norrfalia takes the name #Y $ob_iron_order_name$#! and raises the old red-and-gold banner bearing Saint Balthazar's seal."
 ob_order.24.t: "The Shield Before the Crown"
 ob_order.24.desc: "The clerk reads the final roll in the temple at [ROOT.GetCountry.GetCapital.GetName|G]. He asks each town's delegate to stand when its obligations are called. The captains have brought the stores account, and their successors can see what will be left for them after this winter.\n\n[ROOT.GetCountry.Custom('ob_ending_constitution')]\n\n[ROOT.GetCountry.Custom('ob_ending_herue')]\n\n[ROOT.GetCountry.Custom('ob_ending_crisis')]\n\n[ROOT.GetCountry.Custom('ob_ending_seal')] [ROOT.GetCountry.Custom('ob_ending_see')]\n\n[ROOT.GetCountry.Custom('ob_ending_deep_host')] [ROOT.GetCountry.Custom('ob_ending_lanuthua')]\n\n[ROOT.GetCountry.Custom('ob_ending_cairn')]\n\nWhen the last name has been read, the smiths lay the #Y $ob_bastion_shield$#! on the altar. Every tower sent iron for its forging. The eldest warden turns it over so the delegates can see the names cut into the rim. 'Hold it high,' he says. 'Those are the men who stood here before you.'\n\nThe herald is waiting at the temple doors with a proclamation and a second banner. It bears Balthazar's golden seal on red. He asks which name he should read to the people on the steps. They have come from every town in Norrfalia to hear it."
 ob_order.200.a: "Lay the watch reports before the chapter."
 ob_order.200.t: "The Host Beneath the Snow"
 ob_order.200.desc: "The northern wardens have sent their tallies to the chapter. Beneath #G Mount Balthazar#!, the #R Drow#! are drawing spear companies together and laying in grain along a road wide enough for wagons, and the wardens reckon the first host will march as soon as its wagons are full.\n\nThe captains ask leave to send brothers below to burn the stores before the companies can take the road. The masters would rather not send men into the mountain on a guess. Before the brothers go, the Order must secure the roads that carry its own grain, keep the watch manned, and learn which passages lead to the storehouses, and until then the clerk will keep the wardens' reckoning in the #Y Northern Chapter Report#!."
 ob_order.201.a: "Send word to the watchtowers that the first host has broken."
 ob_order.201.t: "The Storehouses Burn"
 ob_order.201.desc: "The brothers come back with soot on their cloaks. They burned the grain and fodder in the storehouses beside the wagon road and brought down stone across the way. The wardens watched the mustering companies draw apart once it became clear their wagons would go up empty.\n\nThe captain lays a bundle of captured letters on the chapter table. The letters name other Drow lords and roads that run deeper beneath the mountain. The clerk enters the breaking of the first host in the chapter book, then makes a second copy of the letters for the watch."
 ob_order.202.a: "Send riders to warn the northern courts."
 ob_order.202.t: "The Early Host Emerges"
 ob_order.202.desc: "A rider brings word from the northern watch. The #R Drow#! host of [SCOPE.sC('ob_enemy').GetName|Y] has taken the road and declared war on [SCOPE.sC('ob_target').GetName|Y]. The wagons have gone with the spears, and the hour to break the muster by burning its stores has passed.\n\nThe wardens ask for riders to carry the names of both realms to the northern courts. Every tower on the road is to keep its beacon laid and send back word of where the host is seen."
 ob_order.203.a: "Send the wardens to reckon what the frontier needs."
 ob_order.203.t: "An End to the First Campaign"
 ob_order.203.desc: "Word has reached the chapter that the first host's war is over. The wardens are sending riders from tower to tower to learn which posts still have men, which can be provisioned before the snow, and which will have to be raised again from the foundations.\n\nThe clerk will not enter the end of the danger in the chapter book until the Order is at peace, its seat at #G Balthazaria#! is secure, and the frontier watch has been restored. The wardens have been asked to bring their rolls and warrants to the chapter when that day comes, because the brothers will want to hear how the watch was kept while the host was in the field."
 ob_order.204.a: "Enter the scouts' account in the chapter book."
 ob_order.204.t: "The Gathering Disperses"
 ob_order.204.desc: "The scouts have come back from the northern roads. They can find no Drow lord who still holds a road by which the first host could reach a northern realm. The spears have scattered, and the wardens report no wagons coming up to follow them.\n\nThe clerk asks whose deed he should enter in the chapter book. The scouts tell him to write only what they saw. The first muster has come to nothing, and the wardens will keep their rounds for whatever may yet stir below."
 ob_order.205.a: "See that the brothers' provisions keep coming."
 ob_order.205.t: "The Brothers Take the Lower Road"
 ob_order.205.desc: "The quartermaster has paid out the gold and called the brothers from the muster roll. With the scouts' maps to guide them, they will take the side passages beneath #G Mount Balthazar#! and strike at the grain and fodder laid up beside the Drow wagon road.\n\nThe captain asks for #Y 180 days#! to bring his companies into place and put the storehouses to the torch. He leaves the stewards a tally of the grain he will need from the capital. If the wagons from our own granaries cease to come, the brothers must turn back. If the Drow take the road first, the chance to scatter their muster will be gone."
 ob_order.206.a: "Receive the brothers and ask the wardens how much time remains."
 ob_order.206.t: "The Expedition Turns Back"
 ob_order.206.desc: "The captain has sent word up the stair. The brothers cannot finish the raid in time with the provisions they can draw, and he is bringing them home. The pay and provisions already issued have been entered in the chapter accounts.\n\nThe stewards may lay in fresh grain and the chapter may send the brothers down again, if the wardens reckon there is still time. Below the mountain the Drow are still gathering their spears."
 ob_order.300.a: "Yield the seal to [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] and spare the brotherhood a war."
 ob_order.300.b: "Refuse [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName]'s demand and defend the seal by arms."
 ob_order.300.t: "One Seal for the #T Order#!"
 ob_order.300.desc: "#Y [ROOT.GetCountry.GetRuler.GetName]#! enters the chapter hall at #G Balthazaria#! to find armed retainers at the doors and the frontier captains standing together at the far end of the long table. #Y [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetName]#! stands among them with a written ordinance and does not sit when the greetings are done. The officers have kept their swords, which no brother has done in that hall since the founding.\n\nThe ordinance gives [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] sole command of the brotherhood. Frontier appointments, stores, and orders of war would all pass beneath one seal, and the second seat would be left empty. [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] calls it the only answer to the emergency in the north, where the watch cannot wait on two signatures while the Drow bring their wagons up. To [ROOT.GetCountry.GetRuler.GetFirstName], it is a demand to surrender an office both #Y Masters#! swore to share, and the captains standing behind the Sword Master have made it plain what happens if the answer is no.\n\nIf [ROOT.GetCountry.GetRuler.GetFirstName] yields the seal, [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] will rule the #T Order#! as its single protector. A refusal will bring the quarrel to arms, since the challenger has already told the frontier companies to be ready to march under a rival chapter in #R civil war#!. The brothers in the hall are waiting for an answer."
 ob_rebel_name: "The Rival Chapter"
 ob_order.302.a: "Keep the garrisons at their posts until the chapter meets again."
 ob_order.302.t: "An Ultimatum Without a Rising"
 ob_order.302.desc: "#Y [ROOT.GetCountry.GetRuler.GetName]#! has refused the demand for sole command, and #Y [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetName]#! could not raise a rival chapter in the field. The captains who had promised their companies stayed in their barracks when the order came, and the forts that were meant to open their gates kept them shut.\n\n[ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] keeps the second seat, because the chapter has no one else to give it to. The clerk enters the ultimatum, the refusal, and the empty field in a single entry, and the masters tell him the matter is closed."
 ob_order.402.a: "Let Norrfalia remember the oath that brought us here."
 ob_order.402.t: "All the North Beneath Our Watch"
 ob_order.402.desc: "The clerks have copied the rolls of the peninsula, the borderland, and #G Great Herue#! into the registers of #G Norrfalia#!. Each town has sent someone who can read the old account and tell the chapter which dues were paid in grain and which were paid in service.\n\nThe delegates ask for two investments from the common treasury. They have brought the surveys with them, and they would like the first work begun while the men who walked the boundaries are still here to point them out."
 ob_order.500.a: "Close the chapter report."
 ob_order.500.t: "The Northern Chapter Report"
 ob_order.500.desc: "$ob_report_body$"
 ob_order_mission: "The Shield and the Iron Crown"
 ob_order_mission_DESCRIPTION: "For more than two centuries the knights of #T Yvius Balthazar#! have kept the northern watch. The first brothers took their oaths beside the tribes who had helped their founder drive the Drow back beneath the mountains, and the grandchildren of those tribes still send grain and sons to the same towers.\n\nWhen the kings of #G Herue#! fell to fighting over the Iron Crown, brothers of the Order took service on both sides of the quarrel. At #G Kiaguthmajnnorr#! in 996 LC the Order held the field against the Drow, although neither of its masters lived to see the companies come home. Five years later their successors are still answering for the wagons that never reached the line, and the watch has begun to report wagons of another kind on a road beneath the mountain."
 ob_order_mission_CRITERIA_DESCRIPTION: "This mission will be completed when we have restored the strength of the #T Order#!, settled its leadership, and established a lasting watch over the north."
 ob_order_mission_BUTTON_DETAILS: "Restore the brotherhood of Balthazar, settle the Iron Crown, and keep the watchfires burning in the north."
 ob_order_mission_BUTTON_TOOLTIP: "The knights of Balthazar must recover their purpose before the north is lost to the quarrels of kings and the darkness below."
 ob_early_army_name: "The Host Beneath the Snow"
 ob_watch_army_name: "The Northern Watch"
 ob_deadline_tt: "The early Drow host invades at #R 100 Threat#!. Threat rises by #Y 5#! every half-year; the cave expedition can alter it. Completing the counter-expedition before 100 prevents this early host only."
 ob_chapter_wait_for_faith_master_tt: "Wait for the Faith Master to return from #G Ddu-Nuinop#! before calling the chapter."
 ob_chapter_wait_for_charter_tt: "The hearings for #Y A Charter For The Watch#! are underway. Wait for them to finish before calling the chapter."
 ob_ultimatum_tt: "#R Calling the chapter closes the preparations for the dispute.#! Any unfinished warrants hearing, charter petition, oath gathering, or beacon preparations will be bypassed. The answer to the demand for sole command may divide the #T Order#! in #R civil war#!."
 ob_task_11_tt: "The first #R Drow#! muster has been stopped, dispersed, or defeated."
 ob_task_1: "Gather The Broken Lances"
 ob_task_1_DESC: "The veterans of #G Kiaguthmajnnorr#! are coming home to [ROOT.GetCountry.GetCapital.GetName|G] with their families, and the clerks have already run out of room on the billeting rolls. Receive them at the capital and decide what the chapter owes them. The quartermaster has brought the northern garrison rolls as well, since the men still on the walls have been waiting longer than anyone."
 ob_task_2: "The Public Inquiry"
 ob_task_2_DESC: "Both masters of the #T Order#! fell at #G Kiaguthmajnnorr#! before the reserve or the supply wagons reached the line. Convene an inquiry at the capital's #T Court of Law#! and hear the survivors in front of the families of the dead.\n\nThe captains say the stewards kept the grain under lock. The stewards want the men who signed for the wagons to say where they went. The Order held the field that day, and the widows want to know what it cost to hold it."
 ob_task_3: "Bread Before Sermons"
 ob_task_3_DESC: "The bakers of [ROOT.GetCountry.GetCapital.GetName|G] have begun to buy flour by the day, since no one will sell them a week's worth before the next convoy is in. Open a granary, keep grain coming into the capital, and fill its reserve far enough that one late convoy no longer empties the ovens."
 ob_task_4: "Account For The Fallen"
 ob_task_4_DESC: "[ROOT.GetCountry.Custom('ob_task_4_description')]"
 ob_task_4_DESC_revealed: "The chapter has given its verdict on #G Kiaguthmajnnorr#!, and the clerks at the capital's #T Library#! must now set the roll of the dead in order beside the supply accounts that survived the campaign. Every family will receive the names of its dead. Decide whether the towns will see the receipts as well, or whether the chapter will pursue the missing provisions among its own officers."
 ob_inquiry_verdict_required_tt: "The chapter has delivered its verdict on #G Kiaguthmajnnorr#!."
 ob_task_5: "Summon The Claimants"
 ob_task_5_DESC: "Win the confidence of two claimants to #G Herue#! and bring their rulers to the chapter table. Hear their disputes over the frontier before deciding whether to back a crown or put the roads under the Order's captains."
 ob_task_7: "The Grain Covenant"
 ob_task_7_DESC: "The merchants who kept the capital in bread through the winter want a quay of their own at #G Balthazaria#!, and they want the chapter's word on what it will charge them there. Build them a port and keep two grain imports coming into the Order's lands, and the factors will put their terms before the chapter as a covenant that the next master cannot quietly forget."
 ob_task_8: "The Short Measure"
 ob_task_8_DESC: "The quartermaster on the northern wall has started weighing the covenant sacks before he signs for them, and he says they have been coming up light all winter. Give the capital a market where the chapter can keep a measure of its own, and let the clerks spend a season weighing every cargo that comes off the quay before anyone is accused."
 ob_task_9: "The Dreaming"
 ob_task_9_DESC: "For seven nights the Order's ruler has dreamed of towers going dark one by one. The old teachers at #G Cheshme#! know the folk spell of #Y Dreaming#! and could show the chapter which towers those are, while the brothers who go beneath #G Mount Balthazar#! can bring back a map of the roads that run below them. Either account will give the chapter a place to begin its watch."
 ob_task_10: "Where The Darkness Gathers"
 ob_task_10_DESC: "The shepherds of #G Ridkiath#! no longer graze their flocks near the passages beneath #G Mount Balthazar#!, because the ewes that stray inside do not come back out. Secure the village and station a company there strong enough to follow the lower road into the mountain and carry its own wounded home."
 ob_task_11: "The Winter Watch"
 ob_task_11_DESC: "With the first #R Drow#! muster resolved, the wardens want a standing company to relieve the northern garrisons through winter. Secure two fortified territories in loyal provinces of the #G Norrfalian Borderland#! so the company has posts it can rely on."
 ob_task_12: "An Accounting Of Command"
 ob_task_12_DESC: "The #Y Sword Master#! has requisitioned stores that the #Y Faith Master#! exempted for the hospice. Bring the warrants and accounts to #G Balthazaria#! and decide who must bear the cost, since a brotherhood with two lawful seals ought to agree on what each of them may promise. Once the warrants have been heard, the brothers can be #Y called to the chapter#! one at a time."
 ob_task_13: "The Chapter Of Broken Seals"
 ob_task_13_DESC: "The Sword Master has brought an ordinance that would place the brotherhood under a single seal, and the captains who signed it are waiting to hear it read. Call the chapter to #G Balthazaria#! and have the demand read aloud.\n\nYou can call the chapter at once, or first spend time gathering sworn brothers, securing the beacons, or seeking a charter from the #T Shannah#!. Once the ordinance is read, any preparations still unfinished are bypassed, and you must decide whether to yield the seal, refuse it, or appeal to the See if it will hear you."
 ob_task_14: "Whose Oath Endures?"
 ob_task_14_DESC: "[ROOT.GetCountry.Custom('ob_task_14_description')]"
 ob_task_14_DESC_revealed: "The demand for sole command has been answered. Bring the chapter back to #G Balthazaria#! and let the brothers see which seal now speaks for the #T Order#!. Whether the seal changed hands by surrender, by the See's judgment, or by war, the clerks cannot reopen the rolls of service until the chapter house is ours and no rival banner is in the field."
 ob_task_15: "Brothers After Battle"
 ob_task_15_DESC: "[ROOT.GetCountry.Custom('ob_task_15_description')]"
 ob_task_15_DESC_revealed: "Bring the troops to #G Balthazaria#! under one of our own commanders and set aside the wages owed to the watch. With the men assembled, the chapter can renew the frontier oaths or read the warrant and publish the officers' refusals."
 ob_frontier_muster_tt: "Station one of our armies with at least #Y 6 cohorts#! and a non-mercenary commander at #G Balthazaria#!. The army must be standing still."
 ob_task_16: "The Founding Covenant"
 ob_task_16_DESC: "[ROOT.GetCountry.Custom('ob_task_16_description')]"
 ob_task_16_DESC_revealed: "Write a covenant that assigns command to the #Y Sword Master#! and estates, justice, and religious observance to the #Y Faith Master#!, or unite those duties beneath a #Y Lord Protector#!. The contest for the seal is over; the chapter must now decide what either office may command."
 ob_task_17: "Who Shall Wear The Iron Crown?"
 ob_task_17_DESC: "Settle the #T Iron Crown#! beneath the Order's authority: preserve a subordinate king, or govern #G Herue#! directly. An independent ruler must submit or be overcome before the northern union can be completed."
 ob_task_18: "Convoys For The Long Winter"
 ob_task_18_DESC: "The roads into #G Herue#! can carry a summer harvest, but they will not keep the inland towns supplied once the snow closes the passes. Once the Iron Crown is settled, fit out a convoy fleet at #G Balthazaria#!, with timber for repairs and salt to keep the provisions through the winter. The boatmasters of #G Dalanmajn#! will sail with it, although they warn that they lose a ship on the headland below #G Ternstens#! nearly every winter, and they no longer believe it is the weather."
 ob_task_19: "A Charter For The Watch"
 ob_task_19_DESC: "[ROOT.GetCountry.Custom('ob_task_19_description')]"
 ob_task_20: "The Dead Beneath The Snow"
 ob_task_20_DESC: "[ROOT.GetCountry.Custom('ob_task_20_description')]"
 ob_task_20_DESC_revealed: "A patrol in #G Nimzur#! broke a #R Drow#! company at the foot of the mountains. The survivors fled into the passes, leaving their wounded in the snow. By morning the wounded were gone, and tracks led uphill from the places where they had lain. Secure #G Nordmajnng#! and muster a company there to follow them. The brothers who returned from #G Mount Balthazar#! know what to look for when the trail goes underground.\n\n#Y This will start an event chain#!."
 ob_task_21: "What The Ice Remembers"
 ob_task_21_DESC: "[ROOT.GetCountry.Custom('ob_task_21_description')]"
 ob_task_21_DESC_revealed: "Take the map from #G Mount Balthazar#! to the chapel below #G Nimzur#!, where the captain can compare it with the account of his retreat. If Lanuthua is still in our custody, ask him where the passage comes out and what the Drow learned from the men they found in the ice."
 ob_task_22: "A Peace That Can Survive Its Makers"
 ob_task_22_DESC: "An estate in the borderland has passed to an heir who says his father's grain promise died with his father, and three of his neighbors are waiting to see whether the chapter agrees. Tie every contribution to the land rather than to the man who holds it. The settlement only holds if every state of the Order is loyal enough to accept it, and if the chapter can pay the surveyors who will walk the boundaries."
 ob_task_23: "Watchfires For Those Yet Unborn"
 ob_task_23_DESC: "The wardens know which forts can hold through winter. Now they need reliefs that can find those posts when a beacon goes up. Keep the two loyal forts ready and set the men to drill in the borderland or at #G Balthazaria#!. If the smiths have already armed the watch, the captains can muster from their rolls. Set aside pay, food, and men for the companies who will answer the fires. #R Lighting the full watch will be seen from below the mountain.#!"
 ob_watch_relief_ready_tt: "Outfit the watch in #Y Iron for the Watch#!, or have a #Y Training Camp#! in an owned territory in the #G Norrfalian Borderland#! or at #G Balthazaria#!."
 ob_task_24: "The Shield Before The Crown"
 ob_task_24_DESC: "Bring the delegates of #G Norrfalia#! to the capital's temple. The chapter must read its covenant, name the men who will hold the watch, and enter what the towns owe them before the next winter."
 ob_chapter_report: "The Northern Chapter Report"
 ob_chapter_report_desc: "#T Drow Invasion Threat#! #R [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_threat')|0] / 100#!\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_threat_meter')]\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_crisis')]\nWhile the early host is mustering, threat rises by #R 5#! every half-year, and expeditions can hasten or delay it. The early host invades at #R 100 Threat#!.\n\n#T Order Preparedness#! #G [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_preparedness')|0] / 100#!\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_preparedness_meter')]\nEach requirement below contributes #Y 25#!. Losing food lowers preparedness.\nRoads agreement: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_roads')]\nGrain covenant and 200 capital-state food: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_grain')]\nCommon watch: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_watch')]\nIntelligence: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_intel')]\nExpedition: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_expedition')]\nLaunch through #Y Break the Mustering Host#!: rank-scaled gold, #Y 2 manpower#!, and #Y 180 days#!. At 100 preparedness, launch the expedition when you have the resources, no civil war, and threat below 100 throughout the expedition. Keep the food reserve throughout. Only a completed expedition prevents the early host.[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_deep_host')]"
 ob_counter_expedition: "Break the Mustering Host"
 ob_counter_expedition_desc: "Commit gold based on realm rank and #Y 2 manpower#! to a #Y 180-day#! expedition to burn the Drow storehouses. Finish before threat reaches #R 100#! while retaining the grain covenant and 200 food in the capital's province. The raid breaks the first muster."
 ob_muster_watch: "Muster the Northern Watch"
 ob_muster_watch_desc: "Spend gold based on realm rank and #Y 2 manpower#! to raise six cohorts for up to #Y two years#! during a war against the #R Drow#!. The muster ends when that war ends. Cooldown: #Y ten years#!."
 ob_reconsider_crown: "Reconsider the Herulian Settlement"
 ob_reconsider_crown_desc: "Review our intended settlement if a claimant has disappeared or circumstances have changed. Earlier expenditure is not refunded. Review is available once per year."
 ob_norrfalia_epilogue: "All the North Beneath Our Watch"
 ob_norrfalia_epilogue_desc: "Enter the northern rolls in one register and approve #G 2 free province investments#! and #G 5 Political Influence#!."
 ob_status_ready: "#G Ready#!"
 ob_status_missing: "#R Outstanding#!"
 ob_ending_constitution_0: "The Sword Master takes the muster rolls and the Faith Master takes the estate accounts. A captain who wishes to override a sworn exemption must now bring both seals to the chapter."
 ob_ending_constitution_1: "The #T Lord Protector#! now holds the authority once shared between two masters. Those who supported the change expect dependable command; those who opposed it will remember the promises made when the second seat was abolished."
 ob_ending_herue_0: "The lands of Herue now answer to the united government of Norrfalia, and the Order itself keeps the peace that rival kings once promised and failed to keep."
 ob_ending_herue_2: "The Herulian king who knelt to the Order's seal has seen his court folded into the government of Norrfalia, and his tax rolls are now kept in the chapter registers."
 ob_ending_crisis_0: "The first #R Drow#! host was broken before it left the mountain. The farms behind the watchtowers never saw it, and the chapter can point to preparations that protected more than its own reputation."
 ob_ending_crisis_1: "The early gathering lost its road into the north and broke apart. The chapter has entered that welcome news without claiming a victory its brothers did not win."
 ob_ending_crisis_2: "The first #R Drow#! host came out of the mountain before the preparations were complete. Its campaign is over, and the Order has won back enough of the frontier to keep the watch again."
