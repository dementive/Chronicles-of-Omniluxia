 ob_report_crisis_0: "#G The counter-expedition broke the mustering host.#!"
 ob_report_crisis_1: "#G The early host dispersed after losing its approach.#!"
 ob_report_crisis_2: "The early invasion has ended."
 ob_report_crisis_3: "#R The early host has invaded.#!"
 ob_report_crisis_4: "The early host will emerge at #R 100 Threat#! unless the counter-expedition finishes first."
 ob_report_crisis_5: "No mustering host has yet been reported."
 ob_status_expedition_0: "#G Completed: early host prevented#!"
 ob_status_expedition_1: "Unnecessary: host dispersed"
 ob_status_expedition_2: "Closed: early crisis resolved"
 ob_status_expedition_3: "#R Too late: host invaded#!"
 ob_status_expedition_4: "#Y Underway: see The Counter-Expedition modifier for time remaining#!"
 ob_status_expedition_5: "#G Ready to launch through Break the Mustering Host#!"
 ob_status_expedition_6: "#R Threat has reached 100#!"
 ob_status_expedition_7: "Not started"
 ob_report_body: "#T Drow Invasion Threat#! #R [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_threat')|0] / 100#!\n[ROOT.GetCountry.Custom('ob_report_threat_meter')]\n[ROOT.GetCountry.Custom('ob_report_crisis')]\nWhile the early host is mustering, threat rises by #R 5#! every half-year, and expeditions can hasten or delay it. The early host invades at #R 100 Threat#!.\n\n#T Order Preparedness#! #G [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_preparedness')|0] / 100#!\n[ROOT.GetCountry.Custom('ob_report_preparedness_meter')]\nEach requirement below contributes #Y 25#!. Losing food lowers preparedness.\nRoads agreement: [ROOT.GetCountry.Custom('ob_status_roads')]\nGrain covenant and 200 capital-state food: [ROOT.GetCountry.Custom('ob_status_grain')]\nCommon watch: [ROOT.GetCountry.Custom('ob_status_watch')]\nIntelligence: [ROOT.GetCountry.Custom('ob_status_intel')]\nExpedition: [ROOT.GetCountry.Custom('ob_status_expedition')]\nLaunch through #Y Break the Mustering Host#!: rank-scaled gold, #Y 2 manpower#!, and #Y 180 days#!. At 100 preparedness, launch the expedition when you have the resources, no civil war, and threat below 100 throughout the expedition. Keep the food reserve throughout. Only a completed expedition prevents the early host.[ROOT.GetCountry.Custom('ob_report_deep_host')]"
 ob_order.10.b: "Keep the map with the officers who will use it."
 ob_order.18.b: "Hang the wreckers and resettle their families at Dalanmajn."
 ob_order.22.b: "Hear the village first and pay for the grain it sent."
 ob_effect_302_a_tt: "The attempted division failed. The dispute over the seal is settled without a war."
 ob_effect_300_b_tt: "#R Start a civil war.#! The rival chapter receives its initial lands from the split and can gain up to three additional fortified borderland states with Sword support. Unsworn officers with low loyalty can defect, and strong support can draw more frontier brothers."
 ob_rebel_reinforcements_tt: "If the Order goes to war, the rival chapter will raise #R [SCOPE.ScriptValue('ob_rebel_cohorts_svalue')|0]#! extra cohorts in #Y The Frontier Companies#!. Having #Y 3 sworn brothers#! at court and putting the wardens in charge of the beacons can each deny the rival #Y 3 cohorts#!."
 ob_effect_300_a_tt: "#R Yield leadership to the rival master.#! Continue playing the same country under the new ruler, without a civil war. Restoring two seats later requires concessions."
 ob_effect_206_a_tt: "The brothers have turned back. The gold and #R 2 Manpower#! already committed are spent. The expedition can be sent again if time and preparations permit."
 ob_effect_205_a_tt: "The brothers have drawn the expedition's gold and #R 2 Manpower#!. They need #Y 180 days#!, the capital's food reserve, and Threat below #R 100#! to burn the storehouses before the host marches."
 ob_effect_204_a_tt: "The first host dispersed without a road into the north. #Y No prevention reward is granted#!."
 ob_effect_203_a_tt: "The early host's war is over. The Order must still be at peace, hold its chapter seat, and restore its fortified watch to complete the frontier task."
 ob_effect_202_a_tt: "The early host has marched. Any counter-expedition underway is ended."
 ob_effect_200_a_tt: "The early host can march at #R 100 Threat#!. The Northern Chapter Report records the roads agreement, grain reserve, watch, and scouts' findings."
 ob_effect_17_b_tt: "Bring Great Herue under the chapter's direct rule. The settlement requires the Order to own the entire region."
 ob_effect_17_a_tt: "Restore a client kingdom on controlled Herulian lands, confirm our existing subject, or demand submission from independent Herue. Its ruler may refuse."
 ob_herue_crown_reward_tt: "Once Herue is our client, the king's watch oath grants #G +5%#! Fort Defense and #G +5%#! Manpower Recovery Speed for #Y 3 years#!."
 ob_task_17_rewards_tt: "A client king swears to supply the northern watch. Choosing direct rule gives the chapter a free Province Investment and a temporary siege bonus. The chapter can collect a settlement reward only once, even if it later reopens the question."
 ob_requirements_5_tt: "At least #Y 2#! independent Helluvian claimants to #G Herue#! within diplomatic range must each have at least #Y +65 Opinion#! of us. (Currently: #Y [SCOPE.ScriptValue('ob_friendly_herue_claimants_svalue')|0]#!/#Y 2#!)"
 ob_order.210.t: "The Receipts and the March Order"
 ob_order.210.desc: "On the second day of the inquiry, the clerk puts the march order and the signed receipts on the same table. The witnesses agree that the reserve stayed behind the walls and that no supply wagons reached the line at #G Kiaguthmajnnorr#!. A captain says the stewards held back the grain, and from the gallery a widow asks him which captain signed for the wagons. When he turns to find the receipt, she asks him to read her husband's name from the roll as well.\n\nThe Sword Master, [ROOT.GetCountry.GetCoRuler.GetName|Y], asks the clerk to call the steward who demanded a second warrant. The Faith Master, [ROOT.GetCountry.GetRuler.GetName|Y], asks to hear from the captains who signed for stores before the reserve was ordered out. A signature shows who drew the supplies, but the receipts do not say where the wagons went after that, and neither master will let the chapter reach a conclusion until their own witnesses have spoken.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] calls a recess before the benches can shout each other down. The two sets of witnesses could be examined together, but it will cost favors on both benches to arrange. The stewards have already offered their votes for another course, if the captains are made to answer for the receipts in front of the gallery. The clerk will ask the chapter for its verdict in the morning."
 ob_order.210.desc_protector: "On the second day of the inquiry, the clerk sets the march order and the signed receipts on the same table. Both sets of witnesses agree that the reserve never reached #G Kiaguthmajnnorr#!. The order gives the hour it was meant to move, and the receipts name the men who drew supplies, but neither tells the court where the wagons went.\n\nA widow in the gallery asks which of the men on those receipts still command companies. The Lord Protector can spend favors on both benches to have the witnesses examined together, or take the stewards' offer of support and call the captains to answer in front of her."
 ob_order.210.a: "Spend influence to have both benches examine the witnesses together."
 ob_order.210.b: "Take the stewards' votes and call the captains to answer before the gallery."
 ob_order.211.t: "The Verdict at Kiaguthmajnnorr"
 ob_order.211.desc: "The clerk reads back what the witnesses could agree on. The reserve never reached #G Kiaguthmajnnorr#!, and the supply wagons were still behind the walls when the line broke. The brothers rallied before dusk and held the field, but by then both masters were dead.\n\nThe Sword Master puts a finger on the entry where the steward asked for a second warrant. The Faith Master turns the page to the captains who drew stores for their own companies. A woman in the gallery asks which of those names will still be signing orders tomorrow, and the clerk waits with his pen over the book for the chapter's verdict."
 ob_order.211.desc_protector: "The clerk reads back what the witnesses could agree on. The wagons were still behind the walls when the line broke at #G Kiaguthmajnnorr#!, and although the brothers held the field, both former masters were dead by dusk.\n\nThe captains say the steward demanded a second warrant. The stewards point to the officers who signed for their own stores before the reserve was called. The clerk waits with his pen over the book for the Lord Protector's verdict."
 ob_order.211.a: "Hold the stewards responsible and clear the captains."
 ob_order.211.b: "Hold the captains responsible and clear the stewards."
 ob_two_seats_concord: "The Concord of the Two Seats"
 desc_ob_two_seats_concord: "The verdict at Kiaguthmajnnorr cleared the captains and gave them greater authority to muster and train the Order's companies."
 ob_two_seats_accounts: "The Chapter Accounts"
 desc_ob_two_seats_accounts: "The verdict at Kiaguthmajnnorr cleared the stewards and strengthened the chapter's oversight of dues, supplies, and the watch's wages."
 ob_open_accounts: "The Accounts Laid Open"
 desc_ob_open_accounts: "The chapter has answered publicly for its failings. The towns give more willingly to an Order that has earned their trust."
 ob_brothers_shielded: "The Brotherhood Preserved"
 desc_ob_brothers_shielded: "The old officers have been spared public disgrace and charged with setting the watch in order."
 ob_inquiry_resentment: "His Brothers Publicly Accused"
 ob_inquiry_gratitude: "His Brothers Spared Disgrace"
 ob_cave_returned_tt: "The expedition has returned from the caves of #G Mount Balthazar#!."
 ob_cave_army_name: "The Brothers of the Deep Watch"
 ob_cave_enter_tt: "The army has entered the caves and is unavailable on the map. Survivors return when the expedition ends."
 ob_cave_cautious_tt: "Mark the tunnels for #Y 10 days#!. Retain #Y 90%#! of the expedition's original strength before the encounter."
 ob_cave_hasty_tt: "Advance after #Y 5 days#!. Retain #Y 80%#! of the expedition's original strength before the encounter."
 ob_cave_assault_tt: "70% chance to rout the Drow and burn their supplies. Lose #R 20%#! of remaining army strength and gain #G 30 Gold#! and #G 15 Military Experience#!.\n30% chance to be driven back. Lose #R 40%#! of remaining strength and gain #G 5 Military Experience#!.\nOn return, victory lowers invasion threat by #G 20#! and defeat raises it by #R 10#! if the early invasion is still pending."
 ob_cave_flank_tt: "85% chance to rout the Drow and burn their supplies. Lose #R 10%#! of remaining army strength and gain #G 10 Military Experience#!.\n15% chance to be driven back. Lose #R 25%#! of remaining strength and gain #G 5 Military Experience#!.\nOn return, victory lowers invasion threat by #G 20#! and defeat raises it by #R 10#! if the early invasion is still pending."
 ob_cave_home_tt: "Return the surviving army and reveal the chapter report. If the early invasion is still pending, burning the stores lowers threat by #G 20#! and a defeat raises it by #R 10#!."
 ob_order.901.t: "Beneath the Mountain"
 ob_order.901.desc: "At #G Ridkiath#!, the captain has the brothers count off before they enter the passage beneath #G Mount Balthazar#!. A few hundred paces in, the floor gives way to steps wide enough for four men abreast, and someone has swept them clean. At the foot of the stair the brothers find an iron spike driven into the wall at shoulder height, then another below it, and another, so that there are hooks for lamps all the way down.\n\nThe captain asks for a man who can draw. If they stop to mark every side passage and set ropes on the steep ground, they will have a road back for the wounded. If they press on, they may reach whoever tends those lamps before word of their coming goes ahead of them."
 ob_order.901.a: "Mark every turning. We must find our way home."
 ob_order.901.b: "Keep moving while we still have the dark."
 ob_order.902.t: "The Army Beneath the Mountain"
 ob_order.902.desc: "From the mouth of a side passage, the brothers can see an army mustering on the floor of a cavern. The #R Drow#! have set their spear companies in ranks below a road cut into the rock. Beyond them, carts stand loaded with grain and spare bowstrings. A file of men is already hauling the first cart up the road toward the surface.\n\nThe captain calls up the men with the strongest shields. They can charge down the road and reach the carts before the Drow have time to turn their ranks. The scouts have also found a ledge above the camp. A company sent that way could get behind the spearmen and set the loads alight while the rest of the brothers hold their attention from the road."
 ob_order.902.a: "Charge down the road and seize the supply carts."
 ob_order.902.b: "Hold the road while a company works around their flank."
 ob_order.903.t: "Torches in the Daylight"
 ob_order.903.desc: "The sentries at #G Mount Balthazar#! hear the brothers before they see them. The men at the front call for water. Those behind them ask for hands to carry the wounded up the last stair. At the mouth of the passage a clerk starts taking names, and the captain makes him leave room on each page for men who may still be on their way.\n\nAmong the things brought up from below is a drawing of the road the Drow cut for their army. It is broad enough for wagons almost to the surface. The captain tells the clerk to make a copy for the watch as soon as he has finished with the names.\n\n[ROOT.GetCountry.Custom('ob_cave_threat_outcome')]"
 ob_order.903.a: "See to the wounded. Send the roll and map to the chapter."
 ob_cave_result_success: "The Drow pulled their companies off the road to save what they could of the grain. By then the fire had reached the carts at the back of the column. They will have to provision their army again before they can march."
 ob_cave_result_failure: "The Drow held the road. As the brothers withdrew, their rear guard saw riders leave the camp by a lower passage. The captain believes they were carrying word to the rest of the host. We should expect it sooner now."
 ob_cave_result_scout: "The brothers came away without touching the stores, and the Drow sentries never knew they had been there. The chapter has its map, although the host below is still provisioning undisturbed."
 ob_cave_result_late: "The Drow have already begun their march. Whatever was accomplished below cannot call that host back into the mountain."
 ob_cave_result_ended: "The fate of the early host has already been settled. The expedition's discoveries remain valuable to the watch."
 ob_order.171.t: "The Crown Beneath the Seal"
 ob_order.171.desc: "An envoy of the Balthazarian Order has come to court with a short letter under the chapter's seal. The knights will recognize our right to the Iron Crown if our ruler swears fealty to the Order and keeps the northern roads in its name. The throne would remain ours, although its future would be bound to whatever union the knights mean to build in the north.\n\nThe envoy has been told to wait for an answer. A refusal would not cost us a single field the Order does not already hold, but its claims on our lands would stay in force, and the knights have shown before that they are willing to press them."
 ob_order.171.a: "Keep the crown beneath the Order's protection."
 ob_order.171.b: "The Iron Crown owes them no obedience."
 ob_order.172.t: "Herue Refuses the Seal"
 ob_order.172.desc: "The envoy has come back from #G Herue#! with our letter still unsigned. The king will not kneel to the Order, the Iron Crown remains his own, and our claims on #G Great Herue#! stand unanswered. The chapter must bring these lands under its authority by treaty or by war before the northern union can be proclaimed."
 ob_order.172.a: "Then the settlement remains unfinished."
 ob_order.173.t: "A Crown Beneath Our Seal"
 ob_order.173.desc: "The envoy has come back from #G Herue#! with the king's oath beneath his seal. The Iron Crown stays on its owner's head, and the kingdom now answers to the Order as its client. When a united Norrfalia is proclaimed, the king's separate court will be folded into it, and the clerks have already begun copying his tax rolls into the chapter registers."
 ob_order.173.a: "Enter the king's obligations in the chapter records."
 ob_herue_submission: "Demand Herue's Submission"
 ob_herue_submission_desc: "Offer the independent king recognition in exchange for becoming our client. Refusal leaves our territorial claims in force."
 ob_rimebound_dread: "Names in the Frost"
 desc_ob_rimebound_dread: "Voices speak through locked doors. Men desert the night watch rather than hear their names called from the dark."
 ob_rimebound_purified: "The Chapel Reconsecrated"
 desc_ob_rimebound_purified: "The corrupted chamber is sealed and the watch renewed under the Shannah's rites."
 ob_restored_herue_requirement_tt: "A restored #G Herue#! exists and owns at least one territory."

 ob_northern_grain_trade: "The Grain Covenant"

 desc_ob_northern_grain_trade: "Regular grain imports let the capital keep larger reserves and collect more revenue at its markets."

 ob_aftermath_surrender: "The seal changed hands without a #R civil war#!. Those who accepted the transfer still expect their service and households to be protected; those who feared it are waiting to learn whether disagreement will be treated as disloyalty."

 ob_aftermath_war: "The contest reached the battlefield. Wounded brothers and the families of the dead must now live beside former opponents. Punishment may settle particular offenses, but it cannot man every empty watch post."

 ob_aftermath_other: "The immediate contest has been resolved. Captains and stewards can return to their duties, though the limits of their obedience still need to be written down."

 ob_constitution_concessions_rival: "The supporters of sole command expect their settlement to last. Restoring the second seat requires compensating the chapters they represent and securing their political consent."

 ob_constitution_concessions_other: "The chapter can restore the second seat under explicit rules, or accept sole command as a permanent office. Neither choice erases the promises made to the veterans and their households."

 ob_open_harbors: "The Open Harbors Charter"
 desc_ob_open_harbors: "Predictable duties and protected warehouses keep supplies moving through the northern harbors."
 ob_chapter_weighers: "The Chapter Weighers"
 desc_ob_chapter_weighers: "A chapter clerk with the Order's own bushel stands on every quay, and no cargo may be sold until he has weighed it."
 ob_merchants_wary: "The Closed Quays"
 desc_ob_merchants_wary: "The ships of the house of Vaskarn have been turned away from the Order's harbors, and the other factors are charging more for the risk of sailing north."

 ob_owned_all_loyal_tt: "Our provinces in the peninsula, borderland, and #G Great Herue#! have at least #Y 40 Loyalty#!."

 ob_cave_ready_army_tt: "Have one of our armies with at least #Y 2,000 soldiers#! stationed in [GetProvince('(int32)1036').GetName|Y]. The army must be stationary, out of combat, and not led by a mercenary commander."

 ob_ruler_knows_dreaming_tt: "The Order's ruler knows #Y Dreaming#!, or the expedition beneath #G Mount Balthazar#! has returned with its maps."

 ob_herue_settlement_requirement_tt: "Settle #Y Great Herue#!: form #Y Norrfalia#!, govern the entire region directly under the direct-rule settlement, or control it through our realm and subjects. If we chose the crown settlement, #Y Herue#! must be our subject."
 ob_shannah_favor_requirement_tt: "Have at least #Y 40 Favor#! with the reigning #Y Shannah#!."
 ob_shannah_relationship_requirement_tt: "Our current ruler must have an active personal relationship with the reigning #Y Shannah#!. Open the Shannah court to establish or renew it."

 ob_order.12.b: "Uphold the exemption and requisition from the military estates."

 ob_warrant_honoured: "The Military Warrant Honored"

 ob_warrant_refused: "The Military Warrant Set Aside"

 ob_warrant_record_paid: "The treasury replaced the hospice grain. The captains remember that their warrant was honored; the stewards have retained the receipt. A settlement that depends on buying the same grain twice will need rather careful accounts."

 ob_warrant_record_exempt: "The hospice retained its exemption. The captains obtained their grain from the military estates and have asked that the new covenant identify those estates before the next alarm."

 ob_warrant_record_missing: "The chapter requires a written division of duties before another northern emergency tests its seals."

 ob_order.23.b: "Fill the reserve stores and replenish the muster."

 form_norrfalia_tooltip: "We have taken the decision to form #G Norrfalia#!."

 ob_offices_19_dual: "The #Y Faith Master#! will answer for the chapter's justice before the #T Shannah#!. The #Y Sword Master#! remains responsible for enforcing its judgments among the companies."

 ob_offices_19_sole: "The #Y Lord Protector#! will answer for both the hearing and the punishment. The #T Shannah#!'s assessor has asked that this responsibility be entered explicitly."

 ob_offices_21_dual: "The #Y Sword Master#! can secure the chamber, but the #Y Faith Master#! must answer for the rites permitted within it. Neither seal will keep a careless warden alive."

 ob_offices_21_sole: "The #Y Lord Protector#! must give the order to the wardens and answer for the rites used below the chapel. The former division of offices can furnish no second signature."

 ob_offices_22_dual: "The #Y Faith Master#! will maintain the estate register and hear disputed assessments. The #Y Sword Master#! will assign service against that register and report the companies actually supplied."

 ob_offices_22_sole: "The #Y Lord Protector#! will maintain the estate register and issue the service warrants against it. The chapter insists on comparing the two returns each year."

 ob_offices_23_dual: "The #Y Sword Master#! will inspect the companies and appoint their reliefs. The #Y Faith Master#! will audit their pay and maintain the households recorded against each muster."

 ob_offices_23_sole: "The #Y Lord Protector#! will inspect the companies and approve their pay. His successors will inherit both accounts, however much they prefer reading one of them."
 ob_rimebound_pursuit_army_tt: "Station a commanded army of at least #Y 5 cohorts#! in [GetProvince('(int32)1153').GetName|G]. It must be stationary and out of combat."
 ob_order.920.t: "The Tracks Above Nordmajnng"
 ob_order.920.desc: "At [GetProvince('(int32)1153').GetName|G], the captain spreads the map from #G Mount Balthazar#! over the rail of a sheep pen and asks the patrolman to show him where the #R Drow#! left the road. The man points up the pass. They carried their wounded as far as the first turn, he says, and the next morning he found the litter there with its straps cut and the tracks going on uphill without it.\n\nA shepherd offers to take the brothers around by the summer paths once his sons come down from the high pasture, since anyone watching the pass will be watching the road. One of the veterans who went beneath the mountain puts his thumb on the last turn marked on the map. The wind has already filled half the prints, he says, and in three days there will be nothing left to follow but the shepherd's guesses."
 ob_order.920.a: "Follow the tracks before the snow covers them."
 ob_order.920.b: "Wait for the shepherd's sons and take the summer paths."
 ob_order.921.t: "The Creature in the Ice"
 ob_order.921.desc: "Above #G Nordmajnng#! the tracks leave the snow and go into a cleft in the rock, and the brothers follow them down by torchlight until the passage opens into a gallery shored with Drow timber. At the last turn of the trail a wounded man sits against the wall with his knees drawn up. When the captain brings his torch closer, the man asks him to put it out, and the captain knows the voice before he sees the face. He stood beside #Y Lanuthua#! in the line at #G Kiaguthmajnnorr#!, and he was there when Lanuthua's name was read on the burial roll.\n\nBefore anyone can lay a hand on him, ice breaks from the roof of the gallery and buries the men at the back of the file. The #R Drow#! who left their wounded in the snow have been waiting in the side passages ever since, and by the time the captain has turned the shields, the only way back to the daylight is a stair held by the rear guard and the shored passage below it.\n\nThe sappers say they can knock out the props and bring the roof down on the Drow road, but the rear guard will have to hold the stair until the timbers fall, and some of them will be on the wrong side when they do. The rest of the brothers are already lifting the wounded onto their shields. If the column climbs now, everyone who can still be carried will reach the surface, and the road will stay open behind them."
 ob_order.921.a: "Hold the stair until the props come down."
 ob_order.921.b: "Carry the wounded up the stair. Leave no brother below."
 ob_rimebound_threat_delayed_tt: "Block the Drow road and reduce early invasion threat by #G 10#!."
 ob_rimebound_threat_advanced_tt: "Leave the Drow road open and increase early invasion threat by #R 20#!, up to #R 100#!."

 ob_rimebound_country_name: "Rimebound Vampires"
 ob_rimebound_country_adj: "Rimebound"
 ob_rimebound_invasion_wargoal: "The March from the Ice"
 ob_order.923.t: "The Bell at the Northern Watch"
 ob_order.923.desc: "The rider who carried the warning north hears the bell at the watch before the walls come into sight. It is still ringing when he reaches the last rise, though no one on the walls is answering it, and the #R Rimebound#! are already inside the gate. The garrison opened it to men who came up the road in the cloaks of the watch, speaking in voices the sentries knew, and by the time the wardens understood who was speaking, the dead were on the stair and the living were running for the trees.\n\nThe rider turns his horse before the bell stops and comes into [ROOT.GetCountry.GetCapital.GetName|G] before dawn with frost in his cloak. The gatehouse is lost, he tells [ROOT.GetCountry.GetRuler.GetName|Y], and the bridge below it is in their hands. The men who escaped are gathering at the next fort, and they are asking whether the chapter means to come for them."
 ob_order.923.a: "Call out the companies. Drive the Rimebound back into the ice."
 ob_rimebound_invasion_launched_tt: "#R The Rimebound vampires have launched an invasion!#!"

 ob_order.924.t: "The Relief at the Gate"
 ob_order.924.desc: "The bridgekeeper sends word that the #R Rimebound#! have reached the far bank. The sentry there heard his own brother give the watchword from the dark, and he knew the voice before he could see the face, because his brother always drew out the last syllable. He buried that brother after #G Kiaguthmajnnorr#!.\n\nThe farms on the far side are emptying toward the bridge, and the carts are coming two abreast. There is pitch enough on the span to burn it, which would close the crossing to the Rimebound and to any #R Drow#! wagons behind them, but the families who have not yet reached it would have to take their chances at the ford. The bridgekeeper asks how long he should wait. On the near bank he can hear the relief company coming up the road, though it is still some way off."
 ob_order.924.a: "Light the pitch. Send the families toward the ford."
 ob_order.924.b: "Hold the bridge until the last family crosses."
 ob_rimebound_gate_burn_tt: "Destroy the crossing and reduce Drow invasion threat by #G 10#!."
 ob_rimebound_gate_hold_tt: "Risk losing the crossing intact and increase Drow invasion threat by #R 10#!."

 ob_order.925.t: "The Blade That Would Not Thaw"
 ob_order.925.desc: "The brothers bring the Rimebound captain's sword to [ROOT.GetCountry.GetCapital.GetName|G] wrapped in a horse blanket, and the armorer has to cut the wool away where it has frozen to the steel. Names are scratched into the blade from the hilt to the point. They are the names on the roll of the northern watch, and the armorer stops at one halfway down. That man bought a buckle from him yesterday.\n\nThe chaplain asks [ROOT.GetCountry.GetRuler.GetName|Y] to lay the #Y Rimebound Blade#! beneath an altar, where someone will be praying over it at every hour. The captain who brought it in would rather have a scabbard made and wear it himself, but first he asks to see the watch roll, so that he can learn how many of the names on the blade are still answering at muster."
 ob_order.925.a: "Lock it in the treasury until the chapter decides who will carry it."
 ob_rimebound_second_army_name: "The Rimebound Second Host"
 ob_rimebound_third_army_name: "The Rimebound Third Host"

 ob_rimebound_trait: "Rimebound"
 ob_rimebound_trait_desc: "One of the ice vampires King Shraldearjn Walantidottir banished to the northern mountains. The exiles learned to raise walls of frost against the wind and call their dead back from beneath the snow."
 ice_vampire: "Rimebound"
 rimebound_group: "Rimebound"
 ob_task_description_unrevealed: "Complete the preceding task and resolve its events to learn more."
 ob_order.9.dream: "In the dream that followed the lesson in #Y Dreaming#!, the Order's ruler watched the frontier towers go dark in order, from the pass down to the sea road. This morning the clerk found the same towers on the muster roll, and each of them still carries the name of a garrison that should have been relieved before the harvest.\n\nThe captains ask to send the veterans out while the weather holds, since the men already know the roads. The stewards would appoint wardens under the chapter seal and pay them from a separate account, where the towns can see what the watch costs."
 ob_order.16.desc_legate: "\n\nThe Shannah's legate has left a chair between the two benches. He asks to hear disputes over the warrants in person, so the See can judge whether the agreement it witnessed is being kept."
 ob_order.19.desc_local: "The clerks have brought the warrants and the watch rolls to the chapter's own altar. They have left room beneath the ordinance for the seals that can still answer for the men on the walls. A steward asks who will hear a villager's complaint when a captain takes grain he was never owed.\n\nThe chapter can enter its own charter, bind the watch to its courts, and require the captains to bring their accounts back each winter."
 ob_order.19.c: "Enter the charter under the chapter's authority."
 ob_order.21.b: "Send the warning, and keep Lanuthua alive under guard."
 ob_order.21.c: "Send the captain's map and change the watchword."
 ob_order.21.desc_archive: "The jailer brings the captain's account down to the chapel below #G Nimzur#!, where the clerk spreads it beside the map from #G Mount Balthazar#!. Lanuthua is gone, but the captain remembers where he stopped on the stair and pointed to a lower passage. A brother who knows the high pastures follows the line with his finger, and when he reaches the end, he asks for a rider to #G Nordmajnng#!, because the passage comes out on the slope above the watch.\n\nThe jailer remembers the word Lanuthua gave the sentry on the night they brought him in, and the captain says it is still the answer his men give at the gate. While the clerk copies the new road onto the watch map, the captain writes an order to change the word at every post that can still be reached before nightfall.\n\n[ROOT.GetCountry.Custom('ob_office_duties_21')]"
 ob_order.302.desc_absent: "The ordinance has been left on the long table without a master to speak for it. The captains come to the hall to ask whose seal will answer for the next muster, and the clerk asks whether the demand is still to be entered in the record.\n\nThe chapter closes the contest and calls for the second seat to be filled. The watch will take its orders from the chapter while the brothers decide how the offices are to serve together."
 ob_order.300.desc_appeal: "\n\nThe charter gives the Order a hearing at #G Ddu-Nuinop#!. If the chapter sends the ordinance south, the legate may have to answer it before either master can call his companies."
 ob_owned_fortress_building_2_tt: "Directly own at least #Y 2#! territories in the #G Norrfalian Borderland#! with a #Y Fortress#! and at least #Y 50#! loyalty in their province."

 ob_raise_winter_watch_tt: "Raise #Y The Winter Watch#! at our capital with #Y 2#! Heavy Infantry and #Y 2#! Archer cohorts."
 ob_winter_watch_endowment: "Endowment of the Winter Watch"
 desc_ob_winter_watch_endowment: "The chapter has assigned estate revenues to the upkeep of the forts that shelter and supply the Winter Watch."
