 ob_report_crisis_0: "#G The counter-expedition broke the mustering host.#!"
 ob_report_crisis_1: "#G The early host dispersed after losing its approach.#!"
 ob_report_crisis_2: "The early invasion has ended."
 ob_report_crisis_3: "#R The early host has invaded.#!"
 ob_report_crisis_4: "The early host will emerge at #R 100 Threat#! unless the counter-expedition finishes first."
 ob_report_crisis_5: "No mustering host has yet been reported."
