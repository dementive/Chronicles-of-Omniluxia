 ob_order.210.t: "The Receipts and the March Order"
 ob_order.210.desc: "On the second day of the inquiry, the clerk puts the march order and the signed receipts on the same table. The witnesses agree that the reserve stayed behind the walls and that no supply wagons reached the line at #G Kiaguthmajnnorr#!. A captain says the stewards held back the grain. From the gallery, a widow asks him which captain signed for the wagons. When he turns to find the receipt, she asks him to read her husband's name from the roll as well.\n\nThe Sword Master, [ROOT.GetCountry.GetCoRuler.GetName|Y], asks the clerk to call the steward who demanded a second warrant. The Faith Master, [ROOT.GetCountry.GetRuler.GetName|Y], asks to hear from the captains who signed for stores before the reserve was ordered out. A signature shows who drew the supplies, but the receipts do not say where the wagons went after that. Both masters want their witnesses heard before the chapter draws its conclusion.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] calls a recess. It will take favors on both benches to secure agreement to examine the witnesses together. The stewards offer their votes if the captains are called to answer for the receipts before the gallery. The clerk will ask the chapter for its verdict tomorrow."
 ob_order.210.a: "Spend influence to secure a joint examination of the witnesses"
 ob_order.210.b: "Take the stewards' support and call the captains to answer in public"
 ob_effect_210_a_tt: "Spend #R 10 Political Influence#! and gain #G 5 Stability#!. Present the final agreement in #Y 1 day#!."
 ob_effect_210_b_tt: "Gain #G 10 Political Influence#! but lose #R 5 Stability#!. Present the final agreement in #Y 1 day#!."
 ob_order.211.t: "The Verdict at Kiaguthmajnnorr"
 ob_order.211.desc: "The clerk reads back what the witnesses could agree on. The reserve never reached #G Kiaguthmajnnorr#!, and the supply wagons were still behind the walls when the line broke. The brothers rallied before dusk and held the field. By then both masters were dead.\n\nThe Sword Master puts his finger on the entry where the steward asked for a second warrant. The Faith Master turns the page to the captains who drew stores for their own companies. A woman in the gallery asks which of those names will still be signing orders tomorrow. The clerk waits for the chapter's verdict."
 ob_order.211.a: "Find the Faith Master's faction guilty and clear the Sword Master's faction"
 ob_order.211.b: "Find the Sword Master's faction guilty and clear the Faith Master's faction"
 ob_two_seats_concord: "The Concord of the Two Seats"
 desc_ob_two_seats_concord: "The verdict at Kiaguthmajnnorr cleared the captains and strengthened the Sword Master's authority to muster and train the Order's companies."
 ob_two_seats_accounts: "The Chapter Accounts"
 desc_ob_two_seats_accounts: "The verdict at Kiaguthmajnnorr cleared the stewards and strengthened the chapter's oversight of dues, supplies, and the watch's wages."
 ob_open_accounts: "The Accounts Laid Open"
 desc_ob_open_accounts: "The chapter has answered publicly for its failings. The towns give more willingly to an Order that has earned their trust."
 ob_brothers_shielded: "The Brotherhood Preserved"
 desc_ob_brothers_shielded: "The old officers have been spared public disgrace and charged with setting the watch in order."
 ob_inquiry_resentment: "His Brothers Publicly Accused"
 ob_inquiry_gratitude: "His Brothers Spared Disgrace"
 ob_preview_note_23: "Permanently unlock #T Muster the Northern Watch#!: a paid defensive muster of six cohorts against a #R Drow#! attack."
 ob_preview_choose_reward: "We will be able to choose a reward at the end of this mission."
 ob_cave_requirement_tt: "Station an army of at least #Y 2,000 soldiers#! in [GetProvince('(int32)1036').GetName|G] near #G Mount Balthazar#!."
 ob_claims_1_tt: "We will gain claims on the region of #T Balthazaria.#!"
 ob_cave_returned_tt: "The expedition has returned from the caves of #G Mount Balthazar#!."
 ob_cave_army_name: "The Brothers of the Deep Watch"
 ob_cave_enter_tt: "The army has entered the caves and is unavailable on the map. Survivors return when the expedition ends."
 ob_cave_cautious_tt: "Mark the tunnels for #Y 10 days#!. Retain #Y 90%#! of the expedition's original strength before the encounter."
 ob_cave_hasty_tt: "Advance after #Y 5 days#!. Retain #Y 80%#! of the expedition's original strength before the encounter."
 ob_cave_assault_tt: "70% chance to rout the Drow and burn their supplies. Lose #R 20%#! of remaining army strength and gain #G 30 Gold#! and #G 15 Military Experience#!.\n30% chance to be driven back. Lose #R 40%#! of remaining strength and gain #G 5 Military Experience#!.\nOn return, victory lowers invasion threat by #G 20#! and defeat raises it by #R 10#! if the early invasion is still pending."
 ob_cave_flank_tt: "85% chance to rout the Drow and burn their supplies. Lose #R 10%#! of remaining army strength and gain #G 10 Military Experience#!.\n15% chance to be driven back. Lose #R 25%#! of remaining strength and gain #G 5 Military Experience#!.\nOn return, victory lowers invasion threat by #G 20#! and defeat raises it by #R 10#! if the early invasion is still pending."
 ob_cave_home_tt: "Return the surviving army and reveal the chapter report. If the early invasion is still pending, burning the stores lowers threat by #G 20#! and a defeat raises it by #R 10#!."
 ob_order.901.t: "Beneath the Mountain"
 ob_order.901.desc: "At Ridkiath, the captain has the brothers count off before entering the passage beneath #G Mount Balthazar#!. A few hundred paces in, the floor gives way to steps wide enough for four men abreast. Someone has swept them clean. At the foot of the stair the men find an iron spike driven into the wall at shoulder height, then another, and another. There are hooks for lamps all the way down.\n\nThe captain asks for a man who can draw. If they stop to mark the side passages and set ropes on the steep ground, they will have a road back for the wounded. If they press on, they may reach whoever tends those lamps before word of their arrival goes ahead of them."
 ob_order.901.a: "Mark every turning. We must find our way home."
 ob_order.901.b: "Keep moving while we still have the dark."
 ob_order.902.t: "The Army Beneath the Mountain"
 ob_order.902.desc: "From the mouth of a side passage, the brothers can see an army mustering on the floor of a cavern. The #R Drow#! have set their spear companies in ranks below a road cut into the rock. Beyond them, carts stand loaded with grain and spare bowstrings. A file of men is already hauling the first cart up the road toward the surface.\n\nThe captain calls up the men with the strongest shields. They can charge down the road and reach the carts before the Drow have time to turn their ranks. The scouts have also found a ledge above the camp. A company sent that way could get behind the spearmen and set the loads alight while the rest of the brothers hold their attention from the road."
 ob_order.902.a: "Charge down the road and seize the supply carts."
 ob_order.902.b: "Hold the road while a company works around their flank."
 ob_order.903.t: "Torches in the Daylight"
 ob_order.903.desc: "The sentries at #G Mount Balthazar#! hear the brothers before they see them. The men at the front call for water. Those behind them ask for hands to carry the wounded up the last stair. At the mouth of the passage a clerk starts taking names, and the captain makes him leave room on each page for men who may still be on their way.\n\nAmong the things brought up from below is a drawing of the road the Drow cut for their army. It is broad enough for wagons almost to the surface. The captain tells the clerk to make a copy for the watch as soon as he has finished with the names.\n\n[ROOT.GetCountry.Custom('ob_cave_threat_outcome')]"
 ob_order.903.a: "See to the wounded. Send the roll and map to the chapter."
 ob_cave_result_success: "The Drow pulled their companies off the road to save what they could of the grain. By then the fire had reached the carts at the back of the column. They will have to provision their army again before they can march."
 ob_cave_result_failure: "The Drow held the road. As the brothers withdrew, their rear guard saw riders leave the camp by a lower passage. The captain believes they were carrying word to the rest of the host. We should expect it sooner now."
 ob_cave_result_scout: "The scouts left the stores untouched and slipped away before the watch found them. The north has gained knowledge, but the host below remains undisturbed."
 ob_cave_result_late: "The Drow have already begun their march. Whatever was accomplished below cannot call that host back into the mountain."
 ob_cave_result_ended: "The fate of the early host has already been settled. The expedition's discoveries remain valuable to the watch."
 ob_order.171.t: "The Crown Beneath the Seal"
 ob_order.171.desc: "The Balthazarian Order offers recognition of our Iron Crown in exchange for submission. Our ruler would retain the throne as the Order's client, with the kingdom's future bound to its northern union.\n\nThe alternative is refusal. The Order's territorial claims would remain, but no proclamation can make us its subject without our consent or defeat."
 ob_order.171.a: "Keep the crown beneath the Order's protection."
 ob_order.171.b: "The Iron Crown owes them no obedience."
 ob_order.172.t: "Herue Refuses the Seal"
 ob_order.172.desc: "The king has rejected submission. The Iron Crown remains independent, and our claims on Great Herue remain unanswered. The chapter must secure these lands through ordinary diplomacy or war before the northern union can be proclaimed."
 ob_order.172.a: "Then the settlement remains unfinished."
 ob_order.173.t: "A Crown Beneath Our Seal"
 ob_order.173.desc: "Herue has accepted the Order's supremacy. Its ruler keeps the Iron Crown as our client. The kingdom is now part of the authority from which a united Norrfalia may be formed; its separate administration will be absorbed when that union is proclaimed."
 ob_order.173.a: "Enter the king's obligations in the chapter records."
 ob_herue_submission: "Demand Herue's Submission"
 ob_herue_submission_desc: "Offer the independent king recognition in exchange for becoming our client. Refusal leaves our territorial claims in force."
 ob_rimebound_dread: "Names in the Frost"
 desc_ob_rimebound_dread: "Voices speak through locked doors. Men desert the night watch rather than hear their names called from the dark."
 ob_rimebound_purified: "The Chapel Reconsecrated"
 desc_ob_rimebound_purified: "The corrupted chamber is sealed and the watch renewed under the Shannah's rites."
 ob_restored_herue_requirement_tt: "A restored #G Herue#! exists and owns at least one territory."

 ob_northern_grain_trade: "The Grain Covenant"

 desc_ob_northern_grain_trade: "Regular grain imports let the capital keep larger reserves and collect more revenue at its markets."





 ob_aftermath_surrender: "The seal changed hands without a #R civil war#!. Those who accepted the transfer still expect their service and households to be protected; those who feared it are waiting to learn whether disagreement will be treated as disloyalty."

 ob_aftermath_war: "The contest reached the battlefield. Wounded brothers and the families of the dead must now live beside former opponents. Punishment may settle particular offenses, but it cannot man every empty watch post."

 ob_aftermath_other: "The immediate contest has been resolved. Captains and stewards can return to their duties, though the limits of their obedience still need to be written down."

 ob_constitution_concessions_rival: "The supporters of sole command expect their settlement to last. Restoring the second seat requires compensating the chapters they represent and securing their political consent."

 ob_constitution_concessions_other: "The chapter can restore the second seat under explicit rules, or accept sole command as a permanent office. Neither choice erases the promises made to the veterans and their households."

 ob_command_account_pending: "#Y [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetName]#!'s officers are gathering signatures for an ordinance placing all important commands beneath one seal. The period of grace after the northern emergency is already running. Entering the accounts will not postpone the coming chapter meeting."

 ob_command_account_ultimatum: "The demand for sole command has already reached the chapter. The accounts can explain the dispute, but they cannot withdraw the ordinance or answer it on behalf of the assembled brothers."

 ob_command_account_settled: "The contest over command has already been decided. The accounts now belong to the record of that settlement, so that the surviving chapter can rebuild without losing sight of the obligations that preceded the struggle."

 ob_open_harbors: "The Open Harbors Charter"
 desc_ob_open_harbors: "Predictable duties and protected warehouses keep supplies moving through the northern harbors."

 ob_owned_fortress_building_3_tt: "We own at least #Y 3#! territories with a #Y Fortress#! in the #G Norrfalian Borderland#!."
 ob_owned_military_building_1_tt: "Have at least one owned territory with a #Y Training Camp#!."
 ob_owned_all_loyal_tt: "Our provinces in the peninsula, borderland, and #G Great Herue#! have at least #Y 40 Loyalty#!."
 ob_owned_court_building_1_tt: "Have at least one owned territory with a #Y Court of Law#!."
 ob_owned_temple_building_or_library_building_1_tt: "Have at least one owned territory with a #Y Temple#! or #Y Library#!."
 ob_owned_fortress_building_1_borderland_tt: "Have at least one owned territory in the #Y Norrfalian Borderland#! with a #Y Fortress#!."
 ob_owned_temple_building_1_tt: "Have at least one owned territory with a #Y Temple#!."
 ob_port_at_balthazaria_tt: "We own #G Balthazaria#! and have built a #Y Port#! there."
 ob_fleet_ten_ships_tt: "Have a fleet of at least #Y 10 ships#!."
 ob_owned_population_building_or_basic_settlement_infratructure_building_2_tt: "Have at least #Y 2 owned territories#!, each with a #Y Granary#! or #Y Farming Settlement#!."
 ob_owned_fortress_building_1_tt: "Have at least one owned territory with a #Y Fortress#!."
 ob_owned_court_building_or_library_building_1_tt: "Have at least one owned territory with a #Y Court of Law#! or #Y Library#!."

 ob_cave_ready_army_tt: "Have one of our armies with at least #Y 2,000 soldiers#! stationed in [GetProvince('(int32)1036').GetName|Y]. The army must be stationary, out of combat, and not led by a mercenary commander."

 ob_owned_army_2_commanded_tt: "Have an army belonging to us with at least #Y 2 cohorts#! and an assigned commander."
 ob_ruler_knows_dreaming_tt: "The Faith Master knows #Y Dreaming#!, or the expedition beneath #G Mount Balthazar#! has returned with its maps."
 ob_owned_army_4_tt: "Have an army belonging to us with at least #Y 4 cohorts#!."

 ob_herue_settlement_requirement_tt: "Settle #Y Great Herue#!: form #Y Norrfalia#!, govern the entire region directly under the direct-rule settlement, or control it through our realm and subjects. If we chose the crown settlement, #Y Herue#! must be our subject."
 ob_shannah_favor_requirement_tt: "Have at least #Y 40 Favor#! with the reigning #Y Shannah#!. This Favor is retained."
 ob_shannah_relationship_requirement_tt: "Our current ruler must have an active personal relationship with the reigning #Y Shannah#!. Open the Shannah court to establish or renew it."

 ob_order.12.b: "The exemption stands. Requisition from the military estates."

 ob_warrant_honoured: "The Military Warrant Honoured"

 ob_warrant_refused: "The Military Warrant Set Aside"

 ob_warrant_record_paid: "The treasury replaced the hospice grain. The captains remember that their warrant was honored; the stewards have retained the receipt. A settlement that depends on buying the same grain twice will need rather careful accounts."

 ob_warrant_record_exempt: "The hospice retained its exemption. The captains obtained their grain from the military estates and have asked that the new covenant identify those estates before the next alarm."

 ob_warrant_record_missing: "The chapter requires a written division of duties before another northern emergency tests its seals."



 ob_order.23.b: "Fill the reserve stores and replenish the muster."

 form_norrfalia_tooltip: "We have taken the decision to form #G Norrfalia#!."

 ob_offices_19_dual: "The #Y Faith Master#! will answer for the chapter's justice before the #T Shannah#!. The #Y Sword Master#! remains responsible for enforcing its judgments among the companies."

 ob_offices_19_sole: "The #Y Lord Protector#! will answer for both the hearing and the punishment. The #T Shannah#!'s assessor has asked that this responsibility be entered explicitly."

 ob_offices_21_dual: "The #Y Sword Master#! can secure the chamber, but the #Y Faith Master#! must answer for the rites permitted within it. Neither seal will keep a careless warden alive."

 ob_offices_21_sole: "The #Y Lord Protector#! must give the order to the wardens and answer for the rites used below the chapel. The former division of offices can furnish no second signature."

 ob_offices_22_dual: "The #Y Faith Master#! will maintain the estate register and hear disputed assessments. The #Y Sword Master#! will assign service against that register and report the companies actually supplied."

 ob_offices_22_sole: "The #Y Lord Protector#! will maintain the estate register and issue the service warrants against it. The chapter insists on comparing the two returns each year."

 ob_offices_23_dual: "The #Y Sword Master#! will inspect the companies and appoint their reliefs. The #Y Faith Master#! will audit their pay and maintain the households recorded against each muster."

 ob_offices_23_sole: "The #Y Lord Protector#! will inspect the companies and approve their pay. His successors will inherit both accounts, however much they prefer reading one of them."
 ob_rimebound_pursuit_army_tt: "Station a commanded army of at least #Y 5 cohorts#! in [GetProvince('(int32)1153').GetName|G]. It must be stationary and out of combat."
 ob_order.920.t: "The Tracks Above Nordmajnng"
 ob_order.920.desc: "At [GetProvince('(int32)1153').GetName|G], the captain lays the #G Mount Balthazar#! map on a sheep pen and asks the patrolman to show where the #R Drow#! left the road. The man points up the pass. 'They carried their wounded as far as the first turn. I found the litter there with the straps cut. Nobody had gone back for it.'\n\nA shepherd offers to guide the brothers around the pass once his sons return from the high pasture, but the warriors do not feel like waiting. One of the veterans puts his thumb on the last turn marked on the map and taps three times forcefully. 'If we go now, we can follow their tracks. Give it three days and we shall have to ask the Drow themselves where they went. [ROOT.GetCountry.GetRulerTitle], there is no time to waste!'"
 ob_order.920.a: "Follow the tracks before the snow covers them"
 ob_order.920.b: "Wait for the shepherds and learn the paths"
 ob_order.921.t: "The Creatures in the Ice"
 ob_order.921.desc: "After many hours of wandering through the dark caves of #T Mount Balthazar#!, the brave warriors came across something strange; a wounded man propped against a wall at the last turn of a treacherous path. The captain of our soldiers raised his torch and saw a man he knew at #G Kiaguthmajnnorr#! tell him to put it out. 'L-Lanuthua! No, it can't be! I saw you die with my own eyes!'.\n\nAt this moment, the earth began to tremble and shake, and ice fell from above, killing dozens of the brothers. The captain ordered the men to hold their ground and protect the wounded man, but before anyone could move, the #R Drow#! were already upon them. A large contingent of the enemy had been silently stalking our forces from the moment we entered the caves. The brothers fought valiantly, but they were outnumbered and outmatched, and countless souls were sent to the bosom of Hellas that day.\n\nThe fighting dragged on, and the captain knew that they could not hold out much longer - they would have to flee to the surface if they were to survive. As they began to retreat, they could hear the sounds of screaming men and pitched battle behind them, and they knew that many of their brothers were being slaughtered."
 ob_order.921.a: "It's too late for them. Hold the passage until the props come down!"
 ob_order.921.b: "Get the wounded up the stair. Leave no brother behind!"
 ob_rimebound_threat_delayed_tt: "Block the Drow road and reduce early invasion threat by #G 10#!."
 ob_rimebound_threat_advanced_tt: "Leave the Drow road open and increase early invasion threat by #R 20#!, up to #R 100#!."

 ob_lanuthua_alive_tt: "The prisoner is alive and in our custody."
 ob_rimebound_country_name: "Rimebound Vampires"
 ob_rimebound_country_adj: "Rimebound"
 ob_rimebound_invasion_wargoal: "The March from the Ice"
 ob_order.923.t: "The Bell at the Northern Watch"
 ob_order.923.desc: "The rider [ROOT.GetCountry.GetRuler.GetName|Y] sent to warn the northern watch hears the sounds of battle before he sees the walls. By the time the soldier reaches the gate, the #R Rimebound Vampires#! are already through it. A half-hearted attempt at defending the gate begins, but it is quickly overwhelmed. Some of the soldiers begin to break rank, fleeing into the woods. Before long, the battle has turned into a slaugher.\n\nRealizing that all is lost, the rider galloped hard for [ROOT.GetCountry.GetCapital.GetName|G], returning before the dawn. 'It's too late, my Lord - the vampires have already overrun the northern watch. The gatehouse is lost, and the bridge is in their hands!"
 ob_order.923.a: "We will drive these Rimebound back into the ice!"
 ob_rimebound_invasion_launched_tt: "#R The Rimebound vampires have launched an invasion!#!"

 ob_order.924.t: "The Relief at the Gate"
 ob_order.924.desc: "The bridgekeeper sends word that the #R Rimebound#! have reached the far bank. The sentry there heard his own brother give the watchword. 'He always drew out the last syllable, my lord. I knew him before I could see his face.' He buried the man himself.\n\nThe farms are emptying toward the bridge. There is pitch enough to burn the span and close the crossing to the #R Drow#! wagons as well, but the families still on the far bank would have to take their chances at the ford. The bridgekeeper asks how long to wait. He can already hear the relief company marching."
 ob_order.924.a: "Light the pitch. Send the families toward the ford."
 ob_order.924.b: "Hold the bridge until the last family crosses."
 ob_rimebound_gate_burn_tt: "Destroy the crossing and reduce Drow invasion threat by #G 10#!."
 ob_rimebound_gate_hold_tt: "Risk losing the crossing intact and increase Drow invasion threat by #R 10#!."

 ob_order.925.t: "The Blade That Would Not Thaw"
 ob_order.925.desc: "The brothers bring the vampire captain's sword to [ROOT.GetCountry.GetCapital.GetName|G] wrapped in a horse blanket. The armorer has to cut the wool away. He finds the names of the northern watch in the steel, and stops at one halfway down the blade. 'My lord, that man bought a buckle from me yesterday.'\n\nThe reader asks [ROOT.GetCountry.GetRuler.GetName|Y] to lay the #Y Rimebound Blade#! beneath an altar where someone can keep an eye on it. The captain asks for a scabbard. 'I will wear it myself, if it pleases you. But let me see the watch roll first.'"
 ob_order.925.a: "Put it in the treasury until we decide who shall keep it."
 ob_rimebound_second_army_name: "The Rimebound Second Host"
 ob_rimebound_third_army_name: "The Rimebound Third Host"

 ob_rimebound_trait: "Rimebound"
 ob_rimebound_trait_desc: "One of the ice vampires King Shraldearjn Walantidottir banished to the northern mountains. The exiles learned to raise walls of frost against the wind and call their dead back from beneath the snow."
 ice_vampire: "Rimebound"
 rimebound_group: "Rimebound"
 ob_task_description_unrevealed: "Complete the preceding task and resolve its events to learn more."
 ob_order.9.dream: "In the dream that followed the lesson in #Y Dreaming#!, the Faith Master watched the frontier towers go dark in order. The clerk has now found the same towers on the muster roll. Each still shows the name of a garrison that should have been relieved before the harvest.\n\nThe Sword Master asks to send the veterans out while the weather holds. The stewards would appoint wardens under the chapter seal and pay them from a separate account, where the towns can see what the watch costs."
 ob_order.16.desc_legate: "\n\nThe Shannah's legate has left a chair between the two benches. He asks to hear disputes over the warrants in person, so the See can judge whether the agreement it witnessed is being kept."
 ob_order.19.desc_local: "The clerks have brought the warrants and the watch rolls to the chapter's own altar. They have left room beneath the ordinance for the seals that can still answer for the men on the walls. A steward asks who will hear a villager's complaint when a captain takes grain he was never owed.\n\nThe chapter can enter its own charter, bind the watch to its courts, and require the captains to bring their accounts back each winter."
 ob_order.19.c: "Enter the charter under the chapter's authority."
 ob_order.21.b: "Send the warning, and keep Lanuthua alive under guard."
 ob_order.21.c: "Send the captain's map and change the watchword."
 ob_order.21.desc_archive: "The gaoler brings the captain's account down to the chapel below #G Nimzur#!, where the clerk spreads it beside the map from #G Mount Balthazar#!. Lanuthua is gone, but the captain remembers where he stopped on the stairs and pointed to a lower passage. A brother who knows the high pastures follows the line with his finger, and when he reaches the end, he asks for a rider to #G Nordmajnng#!. The passage comes out on the slope above the watch.\n\nThe gaoler remembers the word Lanuthua gave the sentry on the night they brought him in, and the captain says it is still the answer his men give at the gate. While the clerk copies the new road onto the watch map, the captain writes an order to change the word at every post that can still be reached before nightfall."
 ob_order.302.desc_absent: "The ordinance has been left on the long table without a master to speak for it. The captains come to the hall to ask whose seal will answer for the next muster, and the clerk asks whether the demand is still to be entered in the record.\n\nThe chapter closes the contest and calls for the second seat to be filled. The watch will take its orders from the chapter while the brothers decide how the offices are to serve together."
 ob_order.300.desc_appeal: "\n\nThe charter gives the Order a hearing at #G Ddu-Nuinop#!. If the chapter sends the ordinance south, the legate may have to answer it before either master can call his companies."
 ob_owned_fortress_building_2_tt: "We own at least #Y 2#! territories with a #Y Fortress#! in the #G Norrfalian Borderland#!."
