 ob_report_body: "#T Drow Invasion Threat#! #R [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_threat')|0] / 100#!\n[ROOT.GetCountry.Custom('ob_report_threat_meter')]\n[ROOT.GetCountry.Custom('ob_report_crisis')]\nThreat rises by #R 5#! every half-year. Cave expeditions can reduce or increase it. The early host invades at #R 100 Threat#!.\n\n#T Order Preparedness#! #G [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_preparedness')|0] / 100#!\n[ROOT.GetCountry.Custom('ob_report_preparedness_meter')]\nEach requirement below contributes #Y 20#!. Losing forts or food lowers preparedness.\nTwo owned forts: [ROOT.GetCountry.Custom('ob_status_forts')]\nRoads agreement: [ROOT.GetCountry.Custom('ob_status_roads')]\nGrain covenant and 200 capital-state food: [ROOT.GetCountry.Custom('ob_status_grain')]\nCommon watch: [ROOT.GetCountry.Custom('ob_status_watch')]\nIntelligence: [ROOT.GetCountry.Custom('ob_status_intel')]\nExpedition: [ROOT.GetCountry.Custom('ob_status_expedition')]\nLaunch through #Y Break the Mustering Host#!: #Y 75 gold, 2 manpower, 180 days#!. At 100 preparedness, launch the expedition when you have the resources, no civil war, and threat below 100 throughout the expedition. Keep both forts and the food reserve throughout. Only a completed expedition prevents the early host. The later greater invasion remains."
 ob_order.13.t: "The Ordinance in the Record"
 ob_order.13.desc: "A clerk lays the disputed ordinance before #Y [ROOT.GetCountry.GetRuler.GetName]#!. Its opening promises unity in the defence of #G Herue#!; its operative clauses replace the two equal #Y masters#! with one commanding seal.\n\n[ROOT.GetCountry.Custom('ob_completion_13_outcome')]\n\nThe chapter keeps the ordinance with the muster rolls and household accounts that preceded it. The disagreement began with men waiting for relief. It has become a decision about who may govern the brotherhood."
 ob_order.13.a: "Preserve the ordinance and the answer beside it."
 ob_completion_13_surrender: "[ROOT.GetCountry.GetRuler.GetFirstName] now holds the seal after the former ruler accepted the demand for sole command. No war was needed to transfer the office. The chapter must still decide whether this single command should become the #T Order#!'s lasting constitution."
 ob_completion_13_war: "The demand was refused. The #T Order#! has divided into opposing chapters, each claiming the right to speak for the same oath. The #R civil war#! must end before the brotherhood can settle its constitution."
 ob_completion_13_settled: "The struggle over the seal has ended. The surviving leadership must recover #G Balthazaria#! and rebuild the chapter before deciding whether to restore two seats or retain one protector."
 ob_completion_13_pending: "The ultimatum awaits its answer. Entering the ordinance in the records does not accept or reject the demand."
 ob_order.6.b: "Strengthen the crossings before the next contest."
 ob_order.10.b: "Keep the maps with the officers who will use them."
 ob_order.18.b: "Confirm their privileges, but collect an extraordinary contribution."
 ob_order.22.b: "Improve one province and compensate the disputed communities."
 ob_effect_13_a_tt: "Record the ultimatum already delivered to the chapter. Its #G 5 Ruler Popularity#! reward is recorded above and is not awarded again. This acknowledgement neither starts a second civil war nor replaces the ruler again."
