 ob_returned_veterans: "The Brothers Return"
 ob_returned_veterans_desc: "Veterans and loyal warriors have returned to their homes, bringing their families and their old obligations to the Order. Their names stand ready on the muster rolls."
 ob_order.210.t: "The Muster Before the Chapter"
 ob_order.210.desc: "The disagreement has reached the chapter hall before #Y [ROOT.GetCountry.GetRuler.GetName]#! and #Y [ROOT.GetCountry.GetCoRuler.GetName]#! can settle it privately. On the table lie the frontier muster and the household accounts. Captains gather around one; the stewards stand behind the other.\n\n[ROOT.GetCountry.GetCoRuler.GetFirstName] calls forward a veteran carrying a repaired shield. The man has volunteered for another season on the frontier. Beside him waits a son too young for the watch. A steward asks who will finish their roof and feed the boy while his father is away.\n\nThe question silences the hall. This is no longer a choice between courage and comfort. The #T Order#! has promised to defend its neighbours and to care for the households that make that defence possible.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] can spend political authority bringing the captains and stewards into a common agreement, or insist that the chapter's household accounts take precedence over the captains' demands. Either course must end in a written division of responsibility."
 ob_order.210.a: "Bring captains and stewards together. Agree the costs before issuing orders."
 ob_order.210.b: "The captains must answer to the chapter. Open the household accounts first."
 ob_effect_210_a_tt: "Spend #R 10 Political Influence#! and gain #G 5 Stability#!. Present the final agreement in #Y 1 day#!."
 ob_effect_210_b_tt: "Gain #G 10 Political Influence#! but lose #R 5 Stability#!. Present the final agreement in #Y 1 day#!."
 ob_order.211.t: "A Place for Both Seals"
 ob_order.211.desc: "After the hearing, #Y [ROOT.GetCountry.GetRuler.GetName]#! and #Y [ROOT.GetCountry.GetCoRuler.GetName]#! remain in the hall with a clerk, the muster roll, and the unpaid accounts. Outside, the veteran waits for an answer before taking his son home.\n\nThe clerk draws up two settlements. Under the first, [ROOT.GetCountry.GetCoRuler.GetFirstName] will direct the frontier rotations while [ROOT.GetCountry.GetRuler.GetFirstName] arranges the supplies and household relief needed to sustain them. Clear responsibility will help the companies train, recover, and return to duty together.\n\nUnder the second, the chapter will oversee a common account for the watch and its dependants. Recorded dues and open trading accounts will give the stewards a firmer income and the brothers a public promise to hold both masters to.\n\nEither settlement gives the returning families an answer and puts the watch back to work. Neither changes the equality of the two seats, nor decides who may command the whole #T Order#! in the next emergency. The clerk leaves room for both seals."
 ob_order.211.a: "Give [ROOT.GetCountry.GetCoRuler.GetFirstName] the rotations; bind both seals to supplying the watch."
 ob_order.211.b: "Place the watch and its households under the chapter accounts."
 ob_effect_211_a_tt: "Gain #G 5 Stability#! and #G 5 Military Experience#!. Permanently gain #G +5% Army Morale#! and #G +5% Manpower Recovery Speed#! through #T The Concord of the Two Seats#!. Settle this dispute; the later leadership crisis remains possible."
 ob_effect_211_b_tt: "Gain #G 5 Stability#! and #G 20 Political Influence#!. Permanently gain #G +5% National Tax#! and #G +5% National Commerce Income#! through #T The Chapter Accounts#!. Settle this dispute; the later leadership crisis remains possible."
 ob_two_seats_concord: "The Concord of the Two Seats"
 desc_ob_two_seats_concord: "The #Y Grandmasters#! have divided responsibility for frontier rotations and their supplies. Companies can train and recover without leaving the returning households forgotten."
 ob_two_seats_accounts: "The Chapter Accounts"
 desc_ob_two_seats_accounts: "The watch and its dependants share accounts overseen by the chapter. Recorded dues and trusted trading agreements sustain the #T Order#!."
 ob_open_accounts: "The Accounts Laid Open"
 desc_ob_open_accounts: "The chapter has answered publicly for its failings. The towns give more willingly to an Order that has earned their trust."
 ob_brothers_shielded: "The Brotherhood Preserved"
 desc_ob_brothers_shielded: "The old officers have been spared public disgrace and charged with setting the watch in order."
 ob_inquiry_resentment: "His Brothers Publicly Accused"
 ob_inquiry_gratitude: "His Brothers Spared Disgrace"
 ob_preview_note_23: "Permanently unlock #T Muster the Northern Watch#!: a paid defensive muster of six cohorts against a #R Drow#! attack."
 ob_preview_choose_reward: "We will be able to choose a reward at the end of this mission."
 ob_preview_note_20: "A hostile Rimebound herald is brought back in chains."
 ob_cave_requirement_tt: "Station an army of at least #Y 2,000 soldiers#! in [GetProvince('(int32)1036').GetName|G] near #G Mount Balthazar#!."
 ob_claims_1_tt: "We will gain claims on the region of #T Balthazaria.#!"
 ob_cave_returned_tt: "The expedition has returned from the caves of #G Mount Balthazar#!."
 ob_cave_army_name: "The Brothers of the Deep Watch"
 ob_cave_enter_tt: "The army has entered the caves and is unavailable on the map. Survivors return when the expedition ends."
 ob_cave_cautious_tt: "Mark the tunnels for #Y 10 days#!. Retain #Y 90%#! of the expedition’s original strength before the encounter."
 ob_cave_hasty_tt: "Advance after #Y 5 days#!. Retain #Y 80%#! of the expedition’s original strength before the encounter."
 ob_cave_assault_tt: "Assault the guardroom: #Y 70% chance#! to destroy the stores, lose #R 20%#! of the remaining soldiers, gain #G 30 Gold#! and #G 15 Military Experience#!, and reduce invasion threat by #G 20#! upon returning. #Y 30% chance#! to fail, lose #R 40%#! of the remaining soldiers, gain #G 5 Military Experience#!, and raise threat by #R 10#!. Threat changes apply only before the early invasion begins."
 ob_cave_scout_tt: "Lose #R 5%#! of the remaining soldiers and gain #G 10 Military Experience#!. Escape without changing invasion threat. Return in #Y 5 days#!."
 ob_cave_home_tt: "Survivors return and reveal the chapter report if it is still unknown. Before the early invasion begins, destroyed stores reduce threat by #G 20#!; a failed assault increases it by #R 10#!. Scouting leaves threat unchanged."
 ob_order.901.t: "Beneath the Mountain"
 ob_order.901.desc: "The mouth of the cave lies above the last shepherd’s hut on #G Mount Balthazar#!. By evening the brothers have tethered their horses, wrapped their shields against the noise, and passed beneath the stone. The last torch vanishes around a bend.\n\nInside, the passage divides beneath an old carving whose face has been hacked away. A cold draught comes from the left. From the right comes the faint ring of iron striking iron. The captain calls the men close; voices carry much too easily here."
 ob_order.901.a: "Mark every turning. We must find our way home."
 ob_order.901.b: "Follow the hammering before they hear us."
 ob_order.902.t: "The Watch Below"
 ob_order.902.desc: "An arrow strikes the torchbearer before anyone sees the archer. The brothers drag him behind a spur of rock as pale figures withdraw beyond the light. There are #R Drow#! here, and they know these passages.\n\nAhead, a low doorway opens into a guardroom. Spears scrape against stone inside; someone is calling for more men. Beyond the doorway lie stacked provisions, spare bowstrings, and a path broad enough for a host to climb towards the surface.\n\nThe captain can force the doorway and break this watch, or send a few men along a narrow side passage to learn where the deeper road leads. Neither choice will bring every brother home."
 ob_order.902.a: "Shields together. Take their stores and silence that watch."
 ob_order.902.b: "Keep them watching the doorway while our scouts slip past."
 ob_order.903.t: "Torches in the Daylight"
 ob_order.903.desc: "The sentries above the cave see the light first. Then come the voices, hoarse and angry, calling for water and hands to carry the wounded. Men who marched beneath the mountain together emerge leaning upon one another. Others do not emerge at all.\n\nTheir captain brings a scrap of hide marked with the turns of the lower road. There are stores beneath #G Mount Balthazar#!, and a watch that was waiting for more than a handful of raiders. The #R Drow#! have been preparing a way into the north while its lords fought over the roads above.\n\nThe brothers ask that the names of those left below be read before the chapter. The map can wait until the wounded have been laid beside the fire.\n\n[ROOT.GetCountry.Custom('ob_cave_threat_outcome')]"
 ob_order.903.a: "Bring them home. We shall remember what they found."
 ob_cave_result_success: "The stores burned until the smoke drove the last guards from their posts. Whatever marched from these depths would need fresh provisions. The brothers have bought the north time."
 ob_cave_result_failure: "The guardroom held. Behind the retreating brothers, warning horns sounded deeper in the mountain. The Drow know that their road has been discovered; their captains will not wait as patiently now."
 ob_cave_result_scout: "The scouts left the stores untouched and slipped away before the watch found them. The north has gained knowledge, but the host below remains undisturbed."
 ob_cave_result_late: "The Drow have already begun their march. Whatever was accomplished below cannot call that host back into the mountain."
 ob_cave_result_ended: "The fate of the early host has already been settled. The expedition’s discoveries remain valuable to the watch."
 ob_order.171.t: "The Crown Beneath the Seal"
 ob_order.171.desc: "The Balthazarian Order offers recognition of our Iron Crown in exchange for submission. Our ruler would retain the throne as the Order's client, with the kingdom's future bound to its northern union.\n\nThe alternative is refusal. The Order's territorial claims would remain, but no proclamation can make us its subject without our consent or defeat."
 ob_order.171.a: "Keep the crown beneath the Order's protection."
 ob_order.171.b: "The Iron Crown owes them no obedience."
 ob_order.172.t: "Herue Refuses the Seal"
 ob_order.172.desc: "The king has rejected submission. The Iron Crown remains independent, and our claims on Great Herue remain unanswered. The chapter must secure these lands through ordinary diplomacy or war before the northern union can be proclaimed."
 ob_order.172.a: "Then the settlement remains unfinished."
 ob_order.173.t: "A Crown Beneath Our Seal"
 ob_order.173.desc: "Herue has accepted the Order's supremacy. Its ruler keeps the Iron Crown as our client. The kingdom is now part of the authority from which a united Norrfalia may be formed; its separate administration will be absorbed when that union is proclaimed."
 ob_order.173.a: "Enter the king's obligations in the chapter records."
 ob_herue_submission: "Demand Herue's Submission"
 ob_herue_submission_desc: "Offer the independent king recognition in exchange for becoming our client. Refusal leaves our territorial claims in force."
 ob_rimebound_dread: "Names in the Frost"
 desc_ob_rimebound_dread: "Voices speak through locked doors. Men desert the night watch rather than hear their names called from the dark."
 ob_rimebound_purified: "The Chapel Reconsecrated"
 desc_ob_rimebound_purified: "The corrupted chamber is sealed and the watch renewed under the Shannah's rites."
 ob_restored_herue_requirement_tt: "A restored #G Herue#! exists and owns at least one territory."

 ob_northern_grain_trade: "Northern Island Grain Trade"

 desc_ob_northern_grain_trade: "A grain agreement with the northern island supplies the capital, expands its food stores, and strengthens its tax revenues."





 ob_aftermath_surrender: "The seal changed hands without a #R civil war#!. Those who accepted the transfer still expect their service and households to be protected; those who feared it are waiting to learn whether disagreement will be treated as disloyalty."

 ob_aftermath_war: "The struggle reached the battlefield. Wounded brothers and the families of the dead must live beside former opponents. Punishment may settle particular offences, but it cannot furnish every empty watch post."

 ob_aftermath_other: "The immediate contest has been resolved. Captains and stewards can return to their duties, though the limits of their obedience still need to be written down."

 ob_constitution_concessions_rival: "The supporters of sole command expect their settlement to last. Restoring the second seat requires compensating the chapters they represent and securing their political consent."

 ob_constitution_concessions_other: "The chapter can restore the second seat under explicit rules, or accept sole command as a permanent office. Neither choice erases the promises made to the veterans and their households."

 ob_command_account_pending: "#Y [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetName]#!'s officers are gathering signatures for an ordinance placing all important commands beneath one seal. The period of grace after the northern emergency is already running. Entering the accounts will not postpone the coming chapter meeting."

 ob_command_account_ultimatum: "The demand for sole command has already reached the chapter. The accounts can explain the dispute, but they cannot withdraw the ordinance or answer it on behalf of the assembled brothers."

 ob_command_account_settled: "The contest over command has already been decided. The accounts now belong to the record of that settlement, so that the surviving chapter can rebuild without losing sight of the obligations that preceded the struggle."

 ob_open_harbors: "The Open Harbors Charter"
 desc_ob_open_harbors: "Predictable duties and protected warehouses keep supplies moving through the northern harbors."

