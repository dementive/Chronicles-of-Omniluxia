l_english:
 ob_convoy_port_tt: "Build a #Y Port#! at #G Balthazaria#!."
 ob_convoy_fleet_tt: "Dock one of our fleets with at least #Y 10 ships#! at #G Balthazaria#!."
 ob_convoy_supplies_tt: "Import #Y Wood#! and #Y Salt#! into the province of #G Balthazaria#!."
 ob_convoy_charters: "Escorted Merchant Convoys"
 desc_ob_convoy_charters: "Merchants can load their own cargo beside the chapter's supplies. The escorts leave on published dates, and the harbourmasters know when to have a berth ready."
 ob_winter_grain_fleet: "The Winter Grain Fleet"
 desc_ob_winter_grain_fleet: "The chapter has reserved convoy space for grain, and the granary keepers can draw on the holds when the roads close."
 ob_fort_relief: "Relief of the Northern Forts"
 desc_ob_fort_relief: "Men who have spent winters on the northern walls are taking their turn at home while the reserve keeps the watch."
 ob_veteran_settlement: "Holdings for the Returning Families"
 desc_ob_veteran_settlement: "The clerks have entered the veterans' households on the capital rolls. Their children have a place to wait when the muster bell rings."
 ob_herue_envoys: "Letters to the Courts of Herue"
 desc_ob_herue_envoys: "The envoys carry the chapter's terms to the royal courts. A king who swears fealty can keep his seat and hear the towns' petitions himself."
 ob_herue_muster: "Muster Rolls for Herue"
 desc_ob_herue_muster: "The captains have sent in their rolls, and the quartermaster can lay in the companies' pay and provisions before they take the road."
 ob_herulian_watch_oath: "The Iron Crown's Watch Oath"
 desc_ob_herulian_watch_oath: "The king's seal stands beside the chapter's on the northern muster rolls. His wardens have sworn to keep the forts supplied and send men when the watch calls."
 ob_chapter_commissioners: "Commissioners of the Chapter"
 desc_ob_chapter_commissioners: "The chapter has sent clerks to open its own courts and engineers to survey the walls of the towns that still bar their gates."
 ob_hospice_grain: "Grain Reserved for the Hospice"
 desc_ob_hospice_grain: "The hospice keeps the grain entered under its exemption. The next levy falls on the estates sworn to feed the watch."
 ob_relief: "Bread Before Sermons"
 desc_ob_relief: "A granary and regular grain imports sustain the capital. Full storehouses have done rather more for public contentment than the chapter's sermons."
 ob_watch: "The Common Watch"
 desc_ob_watch: "The chapter maintains stores, watchmen, and a regular muster at this strongpoint."
 ob_trade: "The Grain Covenant"
 desc_ob_trade: "Written agreements keep the northern markets supplied."
 ob_recovery: "Bind the Wounds"
 desc_ob_recovery: "Coin and labour have been assigned to the repair of the brotherhood."
 ob_shared: "The Founding Covenant"
 desc_ob_shared: "The #Y Sword Master#! commands the watch; the #Y Faith Master#! administers its revenues, courts, and religious obligations. Extraordinary contributions require both seals, and the chapter hears disputes between the offices."
 ob_sole: "The Protector's Command"
 desc_ob_sole: "One Lord Protector now answers for the commands issued in the Order's name."
 ob_charter: "Charter of the Northern Sword"
 desc_ob_charter: "Protection of the northern faithful has been given a settled place in the religious order."
 ob_vampire_intel: "Secrets of the Bound Herald"
 desc_ob_vampire_intel: "The prisoner names passages the Drow believed forgotten. Each answer ends with a question about our own defences."
 ob_compact_cost: "Wards Beneath the Chapel"
 desc_ob_compact_cost: "Braziers, inscribed chains and an unbroken watch contain the herald. No warden is permitted to hear it alone."
 ob_final: "The Shield Before the Crown"
 desc_ob_final: "Permanent arrangements sustain the watch when its founders are no longer present."
 ob_lantern: "The Last Hearth Lantern"
 desc_ob_lantern: "A lamp recovered from the frozen hospice, now kept as a warning to those who stand watch."
 ob_watch_army: "The Northern Watch"
 desc_ob_watch_army: "A temporary defensive muster supported by the northern chapter houses."
 ob_expedition_timer: "The Counter-Expedition"
 desc_ob_expedition_timer: "The brothers are making their way to the Drow storehouses. This shows how long remains before the raid. Keep the capital's grain reserve supplied."
 ob_order: "Balthazarian Order"
 ob_order_desc: "Founded in #Y 795 LC#! by #Y Yvius Balthazar#! among the #Y Astvaenic#! tribes, this brotherhood of #T Helluvian#! knights guards the northern frontier. Its #Y Sword Master#! commands the companies, appoints their captains, and maintains the watch. Its #Y Faith Master#! administers the estates, keeps the accounts, and answers for the brotherhood's observance of the faith of #T Hellas#!. Neither office grants authority over the other.\n\nBoth former masters fell at #G Kiaguthmajnnorr#! in 996 LC. Their successors have inherited the same covenant, rather fewer brothers, and a considerable number of unpaid accounts."
 ob_order_ruler: "Faith Master"
 ob_order_ruler_female: "Faith Master"
 ob_order_co_ruler: "Sword Master"
 ob_order_co_ruler_female: "Sword Master"
 ob_order_consort: "Consort"
 ob_order_consort_female: "Consort"
 ob_protectorate: "Balthazarian Order"
 ob_protectorate_desc: "The two seats have been replaced by one #T Lord Protector#!, who commands the brotherhood and answers for the defence of the north."
 ob_protectorate_ruler: "Lord Protector"
 ob_protectorate_ruler_female: "Lord Protector"
 ob_protectorate_co_ruler: "Lord Protector"
 ob_protectorate_co_ruler_female: "Lord Protector"
 ob_protectorate_consort: "Consort"
 ob_protectorate_consort_female: "Consort"
 ob_frontier_heard: "The Frontier Brothers Were Heard"
 ob_dual_mandate: "The Shared Chapter Mandate"
 ob_agreement_opinion: "The Northern Agreements"
 ob_grievance_opinion: "The Price of Intervention"
 ob_early_invasion_wargoal: "The Early Drow Invasion"
 war_goal_ob_early_invasion_wargoal: "The Early Drow Invasion"
 ob_order.1.a: "Send the returning veterans to the northern forts"
 ob_order.1.b: "Give the returning families holdings near the capital"
 ob_order.1.c: "Grant the holdings and pay to relieve the forts in turns"
 ob_order.1.t: "Gather the Broken Lances"
 ob_order.1.desc: "The veterans reach the gates of [ROOT.GetCountry.GetCapital.GetName|G] with patched shields and families who have lived on borrowed floors since #G Kiaguthmajnnorr#!. The clerk has room for their names on the muster roll, but he has a much shorter list of households with roofs to spare.\n\nOne brother, shivering from the cold and with ice still on his beard, lays his shield on the table before [ROOT.GetCountry.GetRuler.GetName|T] and asks for a strip of land within the walls. If he is called out again, he says, his children ought to know where to wait for him.\n\nIn response to his request, another soldier, a man from the frontier, sets down the roster of a garrison that has served four winters without relief. 'These are good men, loyal men, and they have guarded the borders faithfully...they deserve a few months at home.'\n\nThe quartermaster can draw on the reserve to relieve the northern posts, or the chapter can grant the families holdings near the capital. If the treasury will cover the cost of sending men north in turns, he says he can start with the longest-serving garrisons while the clerks settle the families.\n\nAs usual, the two Masters disagree. The Faith Master asks that the families be given a place to wait for their fathers, while the Sword Master says the men on the walls have earned their turn at home."
 ob_order.2.a: "Hear the captains' account of the missing reserve first"
 ob_order.2.b: "Hear the stewards' account of the missing supplies first"
 ob_order.2.t: "The Inquiry at Two Empty Seats"
 ob_order.2.desc: "Two empty chairs stand beneath the banner brought home from #G Kiaguthmajnnorr#!. At the rail of the #T Court of Law#!, the families of the dead wait while the clerk reads the names of the masters who fell. The Order held the field that day, but neither the reserve nor the wagons came when the line began to give.\n\nThe Sword Master lays the march order before the clerk. The captains had orders to move before dusk, he says, and the stewards still had the grain under lock. The Faith Master opens the requisition book at the page where the captains signed for it. Both ask that their witnesses be heard first."
 ob_order.2.desc_norskulane: "\n\n[SCOPE.sChar('ob_norskulane').GetName|Y] steps to the rail. 'I carried the march order. The reserve captain sent me to the storehouse, and the steward there said he needed another warrant. I went back to the captain empty-handed.'"
 ob_order.2.desc_tethurane: "\n\n[SCOPE.sChar('ob_tethurane').GetName|Y] lays his ration slip on the clerk's table. 'This says my company was fed that morning. We got nothing. I saw wagons inside the gate when we marched out. Ask the officers who drew those rations where they went.'"
 ob_order.3.a: "Give the households first claim on the grain."
 ob_order.3.b: "Buy supplies for the northern watch"
 ob_order.3.t: "Bread Before Sermons"
 ob_task_3_tt: "#Y We will get to choose a#! #G Reward#!."
 ob_order.3.desc: "Families wait outside the #Y Granary#! in [ROOT.GetCountry.GetCapital.GetName|G] while the quartermaster weighs the first sacks for the day. Grain has been coming in regularly enough to fill the reserve, and a baker who has been buying flour one sack at a time asks whether he can lay in enough for the week.\n\nThe watch has sent down a ration roll with half the entries struck through. The Faith Master asks that the granary feed the households first. The Sword Master says the men on the walls can keep their full ration if the chapter buys a separate supply for them."
 ob_order.4.a: "Publish the accounts alongside the roll of the dead"
 ob_order.4.b: "Publish the roll and settle the accounts within the chapter"
 ob_order.4.t: "Account for the Fallen"
 ob_order.4.desc: "The clerk has set the roll of the dead beside the chapter accounts. A woman at the library door has asked for the page that lists her sons. When the clerk finds it, she asks him to find the provisions issued in their company's name as well.\n\nThe Sword Master wants every town to have its roll and the officers who signed for the stores to answer within the chapter. Several still command companies he needs. The Faith Master asks what the towns will make of a verdict they have only heard read aloud. The names can go out with the receipts, and the towns can see what reached their sons and what the chapter still owes."
 ob_order.5.t: "The Table at Balthazaria"
 ob_order.5.a: "Seal the claims and praise diplomatic solutions"
 ob_order.5.b: "Seal the claims and muster the companies to take Herue."
 ob_order.5.desc: "The stewards have laid a table for the envoys of #G Herue#! at [ROOT.GetCountry.GetCapital.GetName|G]. Peace in the region was the topic of discussion, and the invitations sent to the local warlords bluntly asked what it would take for the border villages to sow in the spring. Each envoy who came back brought a different account of where the boundary lay, and the places left empty have drawn as much talk as those that were filled."
 ob_order.5.desc_right_guest: "\n\n[SCOPE.sChar('ob_summit_right_king').GetName|Y] sets down a tally of missing cattle. The last patrol across the boundary took the beasts from a village that had already paid its taxes for the year. If the riders come back, the wardens have orders to hold them through winter."
 ob_order.5.desc_left_guest: "\n\n[SCOPE.sChar('ob_summit_left_king').GetName|Y] brings a copy of a boundary oath sworn before the last king died. The riders were sent as far as the old stones, the envoy says, and the villages there still pay the dues entered on that roll."
 ob_order.5.desc_private: "\n\nWhen the servants clear the table, the masters have a stack of claims and no promise of safe passage. The Faith Master would back a king who swears to keep the roads in the Order's name, since the towns already know how to bring a claim before a royal court. The Sword Master would keep the roads under our own captains. Either course begins with warrants for lands the chapter may soon have to defend."
 ob_order.7.a: "Guarantee the warehouses and open the quays to the merchants' factors."
 ob_order.7.t: "The Price Of Open Harbors"
 ob_order.7.desc: "The first cargo was weighed on the new quay at #G Balthazaria#! this morning, and the porters finished before the carts from the high road had come through the gate. The harbor master says the harbor can take another ship at the same tide if the merchants are willing to send one - our port is open and ready for business.\n\nThere is good news there as well, [ROOT.GetCountry.GetRuler.GetName|Y]; the merchants have agreed to send the next cargo before the captains are paid this season. They express their gratitude for the chapter's guarantee of the warehouses, and they ask that the Order keep our ports open to their agents in the future."
 ob_order.8.a: "Open the granaries and unload the ships"
 ob_order.8.t: "The Grain Covenant"
 ob_order.8.desc: "Two consignments have come into the Order's ports, and the clerk at the capital's granary has opened a second page in the shipping book. The bakers who once waited outside with coins in their hands are asking the quartermaster when he will sell from the older sacks.\n\nThe merchants will send the next cargo if the captains are paid before they sail. The quartermaster asks leave to put one delivery on sale while it is still dry and hold back the other against the first roads lost to snow."
 ob_order.9.a: "Entrust the watch to the veterans under the Sword seal."
 ob_order.9.b: "Pay a chapter commission to keep the vigil."
 ob_order.9.t: "What The Dream Showed"
 ob_order.9.desc: "The brothers from #G Mount Balthazar#! have laid their map beside the watch roll. One passage runs beneath a tower whose garrison was last relieved before the harvest. The captain who drew the map wants every post above that road checked before the Drow can bring wagons up it.\n\nThe Sword Master asks to put the veterans on the walls. Their families know who will answer for their pay, and the captains already know the roads. The stewards would put the watch under a commission of the chapter, with the stores and wages counted under its seal."
 ob_order.10.a: "Warn the northern courts. Let them see the evidence."
 ob_order.10.t: "Where the Darkness Gathers"
 ob_order.10.desc: "The clerk from Ridkiath reads the roll while the captain spreads the map across the chapter table. Where soot hides a turn, the brother who drew it puts his finger on the hide. He traces the road from the Drow stores beneath #G Mount Balthazar#! to the last stair below the watch.\n\nThe watch has its copy. The masters must decide who else should see it."
 ob_order.11.a: "Prepare the accounts, and let every chapter be heard."
 ob_order.11.t: "The First Reckoning"
 ob_order.11.desc: "The wardens have brought the grain tallies and the names of the men who hold the borderland forts. The first danger has passed, and the posts on either side of the road have enough men to send relief to one another again.\n\nThe Sword Master has asked the clerks to bring the old requisitions as well. A garrison and a hospice drew on the same stores while the watch was short of grain, and both still hold warrants they were told to obey."
 ob_order.12.a: "Honor the warrant. Buy replacement grain for the hospice."
 ob_order.12.t: "Two Warrants, One Granary"
 ob_order.12.desc: "The hospice steward has come to the chapter with an empty grain sack and an exemption bearing the Faith seal. The captain who drew the hospice's stores lays a requisition beside it. His carries the Sword seal, and the dates on the two warrants are the same.\n\nThe captain says his men on the walls were sharing rations before he sent for the grain. The steward has a list of wounded brothers he must feed through winter. The chapter can honor the requisition and buy the hospice a fresh supply, or uphold the exemption and put the next levy on estates already bound to feed the watch."
 ob_order.14.a: "The #T Order#! must endure beyond the men who command it."
 ob_order.14.t: "Whose Oath Endures?"
 ob_order.14.desc: "The chapter bell at #G Balthazaria#! rings for a full assembly for the first time since the demand for sole command was read. The clerks have carried the rolls of service back into the hall and laid them open on the long table, and the brothers come forward one company at a time to hear which seal their orders will carry from now on.\n\n[ROOT.GetCountry.Custom('ob_dispute_aftermath')]\n\nWhen the last company has been read, #Y [ROOT.GetCountry.GetRuler.GetName]#! asks the clerk to enter the date beside the names, so that nobody can later claim not to have heard."
 ob_order.15.a: "Let the returning brothers swear before the assembled companies."
 ob_order.15.b: "Read the warrant and publish the officers' refusals."
 ob_order.15.t: "Brothers After Battle"
 ob_order.15.desc: "At the muster in #G Balthazaria#!, the quartermaster calls the companies from the old pay roll. The clerk has set aside their wages, and several captains who fell out with the chapter wait by the gate with their discharge papers. Their names are still on the roll.\n\n[ROOT.GetCountry.Custom('ob_dispute_aftermath')]\n\nThe captains at the gate ask to swear their oaths in front of the men who will serve beside them. The officers who kept the chapter's orders want the clerk to read the warrant first and enter each refusal in the record. The assembled companies are waiting to hear what the chapter will do."
 ob_order.16.a: "Restore the Sword and Faith offices beneath the chapter covenant."
 ob_order.16.b: "One #Y Lord Protector#! shall answer for the #T Order#!."
 ob_order.16.t: "The Founding Covenant"
 ob_order.16.desc: "The clerks have laid two constitutions before #Y [ROOT.GetCountry.GetRuler.GetName]#!. Beside them lie the hospice exemption and the captain's requisition. Neither document has improved with repeated reading.\n\nThe first constitution restores a #Y Sword Master#! to command the companies and a #Y Faith Master#! to administer the estates, courts, and religious houses. Ordinary military orders need no second signature. Extraordinary contributions and the suspension of sworn exemptions require both seals; the assembled chapter judges disagreements.\n\nThe second entrusts both charges to one #Y Lord Protector#!. Captains and stewards would answer to the same office, whose holder must account for their conduct before the chapter.\n\n[ROOT.GetCountry.Custom('ob_constitution_concessions')]\n\n[ROOT.GetCountry.Custom('ob_warrant_record')]"
 ob_order.17.a: "A Herulian king shall answer to the Order."
 ob_order.17.b: "No crown shall stand between the Order and its lands."
 ob_order.17.c: "The old protectorate settlement must be reconsidered."
 ob_order.17.t: "Who Shall Wear the Iron Crown?"
 ob_order.17.desc: "The clerks have laid the claims to the Iron Crown beside the maps of #G Herue#!. The Faith Master once asked for a king who would keep his court and answer to our seal. The Sword Master wanted the towns to send their accounts straight to the chapter. Their arguments have outlasted several of the men named in those claims.\n\nAn independent king can still be asked to swear fealty. If he refuses, the chapter must decide whether to keep asking or enforce its claims. If the lands are already ours to settle, we can keep a subordinate crown or take the towns directly under the chapter's authority."
 ob_order.18.a: "Put the merchant captains under contract."
 ob_order.18.t: "Convoys For The Long Winter"
 ob_order.18.desc: "The first Herulian ships to round the headland arrive with salt in their seams and news from #G Ternstens#!. Its shipwrights have timber on the quay again, and the masters of the grain boats at #G Dalanmajn#! are ready to sail under escort. They have asked who will decide what goes into their holds.\n\nThe merchants will keep ships on the route if the chapter pays their freight and gives them room for cargo of their own. The granary keepers want the first sailings reserved for grain, with one delivery for #G Balthazaria#! and another for #G Dawaon#!. The escorts are ready, and the stewards have set aside enough coin to put either plan into effect."
 ob_order.19.a: "Accept the charter and its obligation to account for our brothers."
 ob_order.19.b: "The chapter shall judge its own servants."
 ob_order.19.t: "A Charter for the Sword"
 ob_order.19.desc: "On the morning the charter is read, the deacons seat [ROOT.GetCountry.GetRuler.GetFirstName] beside the envoys of kings, and the clerks of the #Y Apostolic Palace#! lay out a parchment longer than any the Order has signed since its founding. [ROOT.GetCountry.MakeScope.GetVariable('ob_charter_shannah').GetCharacter.GetName|Y] has read our accounts and heard the Faith Master's answer, and the doors that once admitted us as distant petitioners now stand open.\n\nThe charter recognizes the northern watch as a work of the faith. It also asks who will judge a knight who abuses the people he was sent to protect. We may accept the supervision of the See over such cases, or insist that the chapter judges its own servants and carry that answer home to both seals."
 ob_order.20.a: "Chain the thing below the chapel. Double the watch."
 ob_order.20.t: "The Dead Beneath the Snow"
 ob_order.20.desc: "The rear guard binds #Y Lanuthua#! with the rope it brought for the Drow and carries him down to the chapel below #G Nimzur#!. By the time the gaoler comes with a length of chain, the rope has frozen stiff. Lanuthua calls him by the name his mother used when he was a boy.\n\nA brother recognizes the shield Lanuthua took to #G Kiaguthmajnnorr#!. He stayed beside him until he stopped breathing, and he remembers hearing the burial roll read afterward. The priests have brought down an older roll from #G Herue#!. It names the vampires driven from the towns and records what the watch was told to do with any body brought back from the high ice. The gaoler asks whether he should fetch a second man before he locks the chapel."
 ob_order.21.a: "Send the warning, and give Lanuthua to the priests for the pyre."
 ob_order.21.t: "What the Ice Remembers"
 ob_order.21.desc: "The captain brings the map from #G Mount Balthazar#! to the chapel below #G Nimzur#!, and #Y Lanuthua#! asks him to turn it until the north road lies nearest the door. The brothers marked the stair where they came under attack, but Lanuthua shows them a lower passage that comes out above #G Nordmajnng#!. The #R Drow#! opened it for the #R Rimebound#!, he says, and in return the dead told them how the old garrisons answered a call at the gate. When he gives the answer he used to give on watch, the captain asks him to say it again. His own men are still using it.\n\nA rider waits outside while the clerk copies the new road onto the watch map, and the priests have brought dry wood down from the chapel loft. They ask to burn Lanuthua before another man on the burial roll comes asking for a place by the fire, but the captain wants him alive, because the next time the Drow come out of the mountain there may be no one left who can show us how they got there."
 ob_order.22.a: "Endow the chapter estates and confirm their permanent obligations."
 ob_order.22.t: "A Peace That Can Survive Its Makers"
 ob_order.22.desc: "My [ROOT.GetCountry.GetRulerTitle], a new estate-holder has refused the contribution promised by his predecessor. His steward explains that the old agreement belonged to a dead man, an interpretation which several neighboring households have already found remarkably persuasive.\n\nThe revised settlement attaches grain, transport, and military service to lands and offices. A successor may inherit the estate, but he will inherit its share of the watch as well. Disputed assessments must come before the chapter court, where the rolls can be compared with what the companies actually received.\n\nOur remaining funds can support two provincial investments and a properly instructed estate administration, or one investment alongside compensation for the disputed communities. The latter settlement would restore confidence around the chapter seat; the former would give its governing office practical experience in managing the new register.\n\n[ROOT.GetCountry.Custom('ob_office_duties_22')]"
 ob_order.23.a: "Train the relief companies. Keep the paid establishment ready."
 ob_order.23.t: "Watchfires for Those Yet Unborn"
 ob_order.23.desc: "At dusk the captain lights the first beacon above #G Nordmajnng#!. The next two answer before he has come down from the tower. By the time the last catches, there is light enough to make out the slope where the road from beneath #G Mount Balthazar#! comes out. Anyone on that road can now see which heights we hold. If the #R Drow#! mean to keep the passage, they have every reason to strike before the forts settle into their new watch.\n\nAt the chapter house, the captain lays down a standing order to call out the #T Northern Watch#! if the Drow attack. He has one more request. In the last drill, two forts sent their relief companies to the same gate. Give him the men for a few weeks now, he says, and each company will know where to go when it sees the fires. The quartermaster asks for those weeks to bring in grain and enroll replacements. If the roads are cut, he says, the first companies through may be the last for some time.\n\n[ROOT.GetCountry.Custom('ob_office_duties_23')]"
 ob_order.24.a: "Keep the name of Norrfalia. The watch will stand."
 ob_order.24.b: "Raise the banner of the Iron Order of Saint Balthazar."
 ob_iron_order_name: "Iron Order of Saint Balthazar"
 ob_iron_order_adjective: "Balthazarian"
 ob_iron_order_tt: "Norrfalia takes the name #Y $ob_iron_order_name$#! and raises the old red-and-gold banner bearing Saint Balthazar's seal."
 ob_order.24.t: "The Shield Before the Crown"
 ob_order.24.desc: "The clerk reads the final roll in the temple at [ROOT.GetCountry.GetCapital.GetName|G]. He asks each town's delegate to stand when its obligations are called. The captains have brought the stores account, and their successors can see what will be left for them after this winter.\n\n[ROOT.GetCountry.Custom('ob_ending_constitution')]\n\n[ROOT.GetCountry.Custom('ob_ending_herue')]\n\n[ROOT.GetCountry.Custom('ob_ending_crisis')]\n\n[ROOT.GetCountry.Custom('ob_ending_seal')] [ROOT.GetCountry.Custom('ob_ending_see')]\n\n[ROOT.GetCountry.Custom('ob_ending_deep_host')] [ROOT.GetCountry.Custom('ob_ending_lanuthua')]\n\n[ROOT.GetCountry.Custom('ob_ending_cairn')]\n\nWhen the last name has been read, the smiths lay the #Y $ob_bastion_shield$#! on the altar. Every tower sent iron for its forging. The eldest warden turns it over so the delegates can see the names cut into the rim. 'Hold it high,' he says. 'Those are the men who stood here before you.'\n\nThe herald is waiting at the temple doors with a proclamation and a second banner. It bears Balthazar's golden seal on red. He asks which name he should read to the people on the steps. They have come from every town in Norrfalia to hear it."
 ob_order.100.a: "Send our representatives to the capital."
 ob_order.100.b: "We have our own affairs to settle."
 ob_order.100.t: "The Knights Request an Audience"
 ob_order.100.desc: "The Balthazarian Order invites our ruler's representatives to its capital to discuss the roads, the frontier, and the succession to Herue's Iron Crown. Attendance promises a hearing, not agreement to another claimant's demands. Our existing wars and sovereignty remain our own."
 ob_order.200.a: "Lay the watch reports before both masters."
 ob_order.200.t: "The Host Beneath the Snow"
 ob_order.200.desc: "The northern wardens have sent their tallies to the chapter. Beneath #G Mount Balthazar#!, the #R Drow#! are drawing spear companies together and laying in grain along a road wide enough for wagons. The wardens reckon the first host will march as soon as its wagons are provisioned.\n\nThe captains ask leave to send brothers below and burn the stores before the companies can take the road. First the Order must secure the roads that carry its own grain, keep the watch manned, and learn which passages lead to the Drow storehouses. The clerk will keep the wardens' reckoning in the Northern Chapter Report."
 ob_order.201.a: "Send word to the watchtowers that the first host has broken."
 ob_order.201.t: "The Storehouses Burn"
 ob_order.201.desc: "The brothers come back with soot on their cloaks. They burned the grain and fodder in the storehouses beside the wagon road and brought down stone across the way. The wardens watched the mustering companies draw apart once it became clear their wagons would go up empty.\n\nThe captain lays a bundle of captured letters before the masters. The letters name other Drow lords and roads that run deeper beneath the mountain. The clerk enters the breaking of the first host in the chapter book, then makes a second copy of the letters for the watch."
 ob_order.202.a: "Send riders to warn the northern courts."
 ob_order.202.t: "The Early Host Emerges"
 ob_order.202.desc: "A rider brings word from the northern watch. The #R Drow#! host of [SCOPE.sC('ob_enemy').GetName|Y] has taken the road and declared war on [SCOPE.sC('ob_target').GetName|Y]. The wagons have gone with the spears, and the hour to break the muster by burning its stores has passed.\n\nThe wardens ask for riders to carry the names of both realms to the northern courts. Every tower on the road is to keep its beacon laid and send back word of where the host is seen."
 ob_order.203.a: "Send the wardens to reckon what the frontier needs."
 ob_order.203.t: "An End to the First Campaign"
 ob_order.203.desc: "Word has reached the chapter that the first host's war is over. The wardens are sending riders from tower to tower to learn which posts still have men, which can be provisioned, and which must be raised again.\n\nThe brothers will enter the end of the danger in the chapter book once the Order is at peace, its seat secure, and its frontier watch restored. The masters ask the wardens to bring their rolls and warrants when that day comes. The full chapter will want to hear how the watch was kept."
 ob_order.204.a: "Enter the scouts' account in the chapter book."
 ob_order.204.t: "The Gathering Disperses"
 ob_order.204.desc: "The scouts have come back from the northern roads. They can find no Drow lord who still holds a road by which the first host could reach a northern realm. The spears have scattered, and the wardens report no wagons coming up to follow them.\n\nThe clerk asks whose deed he should enter in the chapter book. The scouts tell him to write only what they saw. The first muster has come to nothing, and the wardens will keep their rounds for whatever may yet stir below."
 ob_order.205.a: "See that the brothers' provisions keep coming."
 ob_order.205.t: "The Brothers Take the Lower Road"
 ob_order.205.desc: "The quartermaster has paid out the gold and called the brothers from the muster roll. With the scouts' maps to guide them, they will take the side passages beneath #G Mount Balthazar#! and strike at the grain and fodder laid up beside the Drow wagon road.\n\nThe captain asks for #Y 180 days#! to bring his companies into place and put the storehouses to the torch. He leaves the stewards a tally of the grain he will need from the capital. If the wagons from our own granaries cease to come, the brothers must turn back. If the Drow take the road first, the chance to scatter their muster will be gone."
 ob_order.206.a: "Receive the brothers and ask the wardens how much time remains."
 ob_order.206.t: "The Expedition Turns Back"
 ob_order.206.desc: "The captain has sent word up the stair. The brothers cannot finish the raid in time with the provisions they can draw, and he is bringing them home. The pay and provisions already issued have been entered in the chapter accounts.\n\nThe stewards may lay in fresh grain and the masters may send the brothers down again, if the wardens reckon there is still time. Below the mountain the Drow are still gathering their spears."
 ob_order.300.a: "Yield the seal to [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName]; spare the brotherhood a war."
 ob_order.300.b: "Reject [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName]'s demand and defend the seal by arms."
 ob_order.300.t: "One Seal for the #T Order#!"
 ob_order.300.desc: "#Y [ROOT.GetCountry.GetRuler.GetName]#! enters the chapter hall at #G Balthazaria#! to find armed retainers beside the doors. #Y [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetName]#! stands among the frontier captains with a written ordinance in hand and an angry look upon [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetHerHis] face. Although the customary greetings have been exchanged, the officers have kept their swords - a strange and troubling sign.\n\nThe Sword Master does not hesitate to break the silence that follows. The document in hand gives [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] sole command of the brotherhood. Frontier appointments, stores, and military orders would pass beneath one seal - the two-seat arrangement would end. [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] calls it a necessary answer to the northern emergency. To [ROOT.GetCountry.GetRuler.GetFirstName], it is a demand to surrender the office that both #Y Masters#! swore to share and a betrayal of the sacred vows that they swore to uphold.\n\nYielding the seal will make [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] ruler of the #T Order#! under a single protector. Refusing will bring the quarrel to arms; the challenger intends to lead a rival chapter in #R civil war#!. The brothers wait for an answer."
 ob_rebel_name: "The Rival Chapter"
 ob_order.301.a: "Summon the surviving officers and account for the missing."
 ob_order.301.t: "The War Ends, the Oath Remains"
 ob_order.301.desc: "The war between the chapters has ended. #Y [ROOT.GetCountry.GetRuler.GetName]#! receives reports from officers who once shared barracks and now count one another among the dead, the missing, and the prisoners. The banners can be brought together more quickly than the men beneath them.\n\nThe fighting has settled the immediate contest for command. It has not written a constitution. The chapter must regain its seat at #G Balthazaria#!, restore order, and decide how the surviving brothers will serve together before choosing between two #Y masters#! and one #Y Lord Protector#!."
 ob_order.302.a: "Keep the garrisons at their posts until the chapter meets again."
 ob_order.302.t: "An Ultimatum Without a Rising"
 ob_order.302.desc: "#Y [ROOT.GetCountry.GetRuler.GetName]#! has refused the demand for sole command, but #Y [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetName]#! could not raise a rival chapter in the field. The captains who promised him their companies stayed in their barracks when the order came, and the forts he expected to open their gates kept them shut.\n\n[ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] keeps the second seat because there is no one else to give it to. The chapter records the ultimatum, the refusal, and the empty field in the same entry, and the clerks are told that the matter is closed."
 ob_order.401.a: "Enter both undertakings in the same record."
 ob_order.401.t: "The Charter Is Renewed"
 ob_order.401.desc: "The surviving signatories have renewed the northern obligations under their present rulers. The clerks have attached the contributions to offices and estates, making it rather harder to forget them at the next succession.\n\nWhere a claimant has restored #G Herue#!, the Order's independence must also be entered in the settlement. The king has therefore been asked to withdraw claims on the chapter's existing lands in return for continued cooperation."
 ob_order.402.a: "Let Norrfalia remember the oath that brought us here."
 ob_order.402.t: "All the North Beneath Our Watch"
 ob_order.402.desc: "The clerks have copied the rolls of the peninsula, the borderland, and #G Great Herue#! into the registers of #G Norrfalia#!. Each town has sent someone who can read the old account and tell the chapter which dues were paid in grain and which were paid in service.\n\nThe delegates ask for two investments from the common treasury. They have brought the surveys with them, and they would like the first work begun while the men who walked the boundaries are still here to point them out."
 ob_order.170.0: "Recognise [GetCountry('GN2').GetRuler.GetName|Y]."
 ob_order.170.1: "Recognise [GetCountry('NR5').GetRuler.GetName|Y]."
 ob_order.170.2: "Recognise [GetCountry('NR8').GetRuler.GetName|Y]."
 ob_order.170.3: "Recognise [GetCountry('NR7').GetRuler.GetName|Y]."
 ob_order.170.4: "Recognise [GetCountry('HEO').GetRuler.GetName|Y]."
 ob_order.170.back: "Reopen the crown settlement."
 ob_order.170.t: "A Name for the Iron Crown"
 ob_order.170.desc: "The cooperating claimants await an answer. Each has supplied an account of his rights to the #T Iron Crown#!, and each account reaches much the same conclusion about its author.\n\nOur recognition will identify the realm whose restoration we support. It will not transfer another ruler's lands or settle his wars for him. Should that realm disappear, we may return to the report and choose another settlement."
 ob_order.500.a: "Close the chapter report."
 ob_order.500.t: "The Northern Chapter Report"
 ob_order.500.desc: "$ob_report_body$"
 ob_order_mission: "The Shield and the Iron Crown"
 ob_order_mission_DESCRIPTION: "For over two centuries, the knights of #T Yvius Balthazar#! have kept the northern watch. The first brothers took their oaths beside the tribes who had helped their founder drive the Drow back under the mountains, and their children still bring grain and men to the same towers.\n\nWhen the kings of #G Herue#! fell to fighting over the Iron Crown, the knights took service on opposing sides. At #G Kiaguthmajnnorr#! in 996 LC the brothers held the field against the Drow, although neither of their masters lived to see the companies come home. Five years later their successors are still answering for the wagons that failed to come, and the watch has sent word of wagons on a road beneath the mountain."
 ob_order_mission_CRITERIA_DESCRIPTION: "This mission will be completed when we have restored the strength of the #T Order#!, settled its leadership, and established a lasting watch over the north."
 ob_order_mission_BUTTON_DETAILS: "Restore the brotherhood of Balthazar and bring peace to the troubled north."
 ob_order_mission_BUTTON_TOOLTIP: "The knights of Balthazar must recover their purpose before the north is lost to the quarrels of kings and the darkness below."
 ob_early_army_name: "The Host Beneath the Snow"
 ob_watch_army_name: "The Northern Watch"
 ob_deadline_tt: "The early Drow host invades at #R 100 Threat#!. Threat rises by #Y 5#! every half-year; the cave expedition can alter it. Completing the counter-expedition before 100 prevents this early host only."
 ob_ultimatum_tt: "#R Completing this task delivers the demand for sole command.#! The answer decides whether the seal changes hands, the See judges it, or the #T Order#! divides in #R civil war#!."
 ob_task_11_tt: "Resolve the early host, make peace, and hold #G Balthazaria#! and two fortified territories in the #G Norrfalian Borderland#!. Complete the counter-expedition to prevent the host, or wait for its war or muster to end."
 ob_broken_lances_name: "The Broken Lances"
 ob_task_1: "Gather The Broken Lances"
 ob_task_1_DESC: "Veterans of the failed northern campaign are returning to #Y [ROOT.GetCountry.GetRuler.GetName]#! with their families. Commit the treasury and the chapter's authority to receiving them at the capital. The quartermaster has also brought the northern garrison rolls for the chapter to hear."
 ob_task_2: "The Public Inquiry"
 ob_task_2_DESC: "Both masters of the #T Order#! fell at #G Kiaguthmajnnorr#! before the reserve or the supply wagons reached the line. Their successors will convene an inquiry at the capital's #T Court of Law#! and hear the survivors before the families of the dead.\n\nThe Sword Master asks why the stewards held the grain. The Faith Master wants the captains who signed for the wagons to say where they went. The Order held the field, and the widows want to know what it cost to hold it."
 ob_task_3: "Bread Before Sermons"
 ob_task_3_DESC: "The bakers of [ROOT.GetCountry.GetCapital.GetName|G] have begun to buy flour by the day. Open a granary, keep grain coming into the capital, and fill its reserve far enough that a late convoy need no longer empty the ovens."
 ob_task_4: "Account For The Fallen"
 ob_task_4_DESC: "[ROOT.GetCountry.Custom('ob_task_4_description')]"
 ob_task_4_DESC_revealed: "The chapter has delivered its verdict on #G Kiaguthmajnnorr#!. The clerks at the capital's #T Library#! must now put the roll of the dead in order and reconcile the surviving supply accounts. The families will receive the names of their dead. Decide whether the towns will also see the accounts or whether the Sword Master will pursue the missing provisions within the chapter."
 ob_inquiry_verdict_required_tt: "The chapter has delivered its verdict in #Y The Public Inquiry#!."
 ob_task_5: "Summon The Claimants"
 ob_task_5_DESC: "Invite the claimants of #G Herue#! to the chapter table and ask whose riders will keep the roads. If they will give no common undertaking, the chapter can seal its claims and decide whose court should answer for the villages."
 ob_task_7: "The Price Of Open Harbors"
 ob_task_7_DESC: "The merchants who kept the capital in bread have asked where their next cargo will be unloaded. Build a port at #G Balthazaria#! and give their captains a quay they can count on when the roads close."
 ob_task_8: "The Grain Covenant"
 ob_task_8_DESC: "The new quay has given the bakers one reliable delivery. The quartermaster asks for a second grain route so one late cargo cannot empty the reserve again. Keep grain coming into the capital while merchants make the wider trade regular."
 ob_task_9: "The Dreaming"
 ob_task_9_DESC: "For seven nights the Faith Master has dreamed of towers that go dark one by one. The old teachers at #G Cheshme#! know the folk spell of #Y Dreaming#!, and the brothers who went beneath #G Mount Balthazar#! can bring back a map of the roads. Either account will give the chapter a place to begin its watch."
 ob_task_10: "Where The Darkness Gathers"
 ob_task_10_DESC: "The shepherds of #G Ridkiath#! stop counting their flocks at the mouth of the passages beneath #G Mount Balthazar#!. Secure the village and bring a company strong enough to follow the lower road and carry its wounded back."
 ob_task_11: "The Host Beneath The Snow"
 ob_task_11_DESC: "The chapter is ready to reckon with the first Drow muster once its danger has passed. Secure #G Balthazaria#!, provision the capital, and put garrisons back into two forts in the borderland."
 ob_task_12: "An Accounting Of Command"
 ob_task_12_DESC: "The #Y Sword Master#! has requisitioned stores exempted by the #Y Faith Master#!. Bring the warrants and accounts to #G Balthazaria#! and decide who must bear the cost. A brotherhood with two lawful seals ought to agree on what each may promise. Once the warrants are heard, the brothers can be #Y called to the chapter#! one at a time."
 ob_task_13: "The Chapter Of Broken Seals"
 ob_task_13_DESC: "[ROOT.GetCountry.Custom('ob_task_13_description')]"
 ob_task_13_DESC_revealed: "The Faith Master has been to #G Ddu-Nuinop#!, the brothers have been called to the chapter, and the Sword Master has his muster. Nothing is left to delay the question both masters have been avoiding since the warrants were heard. Bring the chapter to #G Balthazaria#! and let the demand for sole command be read aloud. The support each seal has gathered will decide what follows."
 ob_task_14: "Whose Oath Endures?"
 ob_task_14_DESC: "[ROOT.GetCountry.Custom('ob_task_14_description')]"
 ob_task_14_DESC_revealed: "The demand for sole command has been answered. Bring the chapter back to #G Balthazaria#! and let the brothers see which seal now speaks for the #T Order#!. Whether the seal changed hands by surrender, by the See's judgment, or by war, the clerks cannot reopen the rolls of service until the chapter house is ours and no rival banner is in the field."
 ob_task_15: "Brothers After Battle"
 ob_task_15_DESC: "[ROOT.GetCountry.Custom('ob_task_15_description')]"
 ob_task_15_DESC_revealed: "Bring the troops to #G Balthazaria#! under one of our own commanders and set aside the wages owed to the watch. With the men assembled, the chapter can renew the frontier oaths or read the warrant and publish the officers' refusals."
 ob_frontier_muster_tt: "Station one of our armies with at least #Y 6 cohorts#! and a non-mercenary commander at #G Balthazaria#!. The army must be standing still."
 ob_layout_requires_14: "Complete #Y Whose Oath Endures?#!."
 ob_task_16: "The Founding Covenant"
 ob_task_16_DESC: "[ROOT.GetCountry.Custom('ob_task_16_description')]"
 ob_task_16_DESC_revealed: "Write a covenant that assigns command to the #Y Sword Master#! and estates, justice, and religious observance to the #Y Faith Master#!, or unite those duties beneath a #Y Lord Protector#!. The contest for the seal is over; the chapter must now decide what either office may command."
 ob_task_17: "Who Shall Wear The Iron Crown?"
 ob_task_17_DESC: "Settle the #T Iron Crown#! beneath the Order's authority: preserve a subordinate king, or govern #G Herue#! directly. An independent ruler must submit or be overcome before the northern union can be completed."
 ob_layout_requires_16: "Complete #Y The Founding Covenant#!."
 ob_task_18: "Convoys For The Long Winter"
 ob_task_18_DESC: "The roads into #G Herue#! can carry a summer harvest, but they will not keep the inland towns supplied when the snow closes the passes. After settling the Iron Crown, fit out a convoy fleet at #G Balthazaria#!. The port needs timber for repairs and salt to preserve provisions, and the merchants of #G Dalanmajn#! and #G Ternstens#! are waiting to hear what the fleet will carry."
 ob_task_19: "A Charter For The Watch"
 ob_task_19_DESC: "[ROOT.GetCountry.Custom('ob_task_19_description')]"
 ob_task_20: "The Dead Beneath The Snow"
 ob_task_20_DESC: "[ROOT.GetCountry.Custom('ob_task_20_description')]"
 ob_task_20_DESC_revealed: "A patrol in #G Nimzur#! broke a #R Drow#! company at the foot of the mountains. The survivors fled into the passes, leaving their wounded in the snow. By morning the wounded were gone, and tracks led uphill from the places where they had lain. Secure #G Nordmajnng#! and muster a company there to follow them. The brothers who returned from #G Mount Balthazar#! know what to look for when the trail goes underground.\n\n#Y This will start an event chain#!."
 ob_task_21: "What The Ice Remembers"
 ob_task_21_DESC: "[ROOT.GetCountry.Custom('ob_task_21_description')]"
 ob_task_21_DESC_revealed: "Take the map from #G Mount Balthazar#! to the chapel below #G Nimzur#!, where the captain can compare it with the account of his retreat. If Lanuthua is still in our custody, ask him where the passage comes out and what the Drow learned from the men they found in the ice."
 ob_task_22: "A Peace That Can Survive Its Makers"
 ob_task_22_DESC: "An estate in the borderland has passed to an heir who says his father's grain promise died with his father, and three of his neighbors are waiting to see whether the chapter agrees. Tie every contribution to the land rather than to the man who holds it. The settlement only holds if every state of the Order is loyal enough to accept it, and if the chapter can pay the surveyors who will walk the boundaries."
 ob_layout_requires_19: "Complete #Y A Charter for the Sword#!."
 ob_task_23: "Watchfires For Those Yet Unborn"
 ob_task_23_DESC: "The next watch must inherit an establishment it can actually maintain. Assemble the forts, training grounds, reserves, and food stores; fund the permanent rolls from the chapter estates. The officers will answer for training and relief, and the accounts will show who has paid for them. #R Lighting the full watch will be seen from below the mountain.#!"
 ob_layout_requires_22: "Complete #Y A Peace That Can Survive Its Makers#!."
 ob_task_24: "The Shield Before The Crown"
 ob_task_24_DESC: "Bring the delegates of #G Norrfalia#! to the capital's temple. The chapter must read its covenant and its charter, name the men who will hold the watch, and enter what the towns owe them before the next winter."
 ob_task_25: "All The North Beneath Our Watch"
 ob_task_25_DESC: "The kings who knelt to the Order still keep their own courts and their own tax rolls. Take the peninsula, the borderlands, and #G Great Herue#! under direct rule, retire the subject courts, and let #G Norrfalia#! govern its own lands without anyone in between."
 ob_chapter_report: "The Northern Chapter Report"
 ob_chapter_report_desc: "#T Drow Invasion Threat#! #R [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_threat')|0] / 100#!\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_threat_meter')]\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_crisis')]\nWhile the early host is mustering, threat rises by #R 5#! every half-year, and expeditions can hasten or delay it. The early host invades at #R 100 Threat#!.\n\n#T Order Preparedness#! #G [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_preparedness')|0] / 100#!\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_preparedness_meter')]\nEach requirement below contributes #Y 25#!. Losing food lowers preparedness.\nRoads agreement: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_roads')]\nGrain covenant and 200 capital-state food: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_grain')]\nCommon watch: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_watch')]\nIntelligence: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_intel')]\nExpedition: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_expedition')]\nLaunch through #Y Break the Mustering Host#!: #Y 75 gold, 2 manpower, 180 days#!. At 100 preparedness, launch the expedition when you have the resources, no civil war, and threat below 100 throughout the expedition. Keep the food reserve throughout. Only a completed expedition prevents the early host.[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_deep_host')]"
 ob_counter_expedition: "Break the Mustering Host"
 ob_counter_expedition_desc: "Commit #Y 75 gold#! and #Y 2 manpower#! to a #Y 180-day#! expedition to burn the Drow storehouses. Finish before threat reaches #R 100#! while retaining the grain covenant and 200 food in the capital's province. The raid breaks the first muster."
 ob_muster_watch: "Muster the Northern Watch"
 ob_muster_watch_desc: "Spend #Y 75 gold#! and #Y 2 manpower#! to raise six cohorts for up to #Y two years#! during a war against the #R Drow#!. The muster ends when that war ends. Cooldown: #Y ten years#!."
 ob_assume_herue: "Assume the Protectorate of Herue"
 ob_assume_herue_desc: "With #G Great Herue#! under our country or its subjects, the #T Lord Protector#! may assume responsibility for the realm. The #T Balthazarian Order#! government is preserved; the capital moves to #G Dawaon#!."
 ob_renew_congress: "Renew the Congress Invitations"
 ob_renew_congress_desc: "Spend #Y 15 gold#! and #Y 5 political influence#! to approach rulers who refused the congress. Existing signatures and unanswered invitations remain in force. Available once per year."
 ob_reconsider_crown: "Reconsider the Herulian Settlement"
 ob_reconsider_crown_desc: "Review our intended settlement if a claimant has disappeared or circumstances have changed. Earlier expenditure is not refunded. Review is available once per year."
 ob_norrfalia_epilogue: "All the North Beneath Our Watch"
 ob_norrfalia_epilogue_desc: "Enter the northern rolls in one register and approve #G 2 free province investments#! and #G 5 Political Influence#!."
 ob_last_hearth_lantern: "Lantern of the Last Watch"
 ob_last_hearth_lantern_desc: "A ward-lamp recovered from the shrine beneath the glacier. Its flame bends toward the ice even when there is no wind."
 ob_status_ready: "#G Ready#!"
 ob_status_missing: "#R Outstanding#!"
 ob_ending_constitution_0: "The Sword Master takes the muster rolls and the Faith Master takes the estate accounts. A captain who wishes to override a sworn exemption must now bring both seals to the chapter."
 ob_ending_constitution_1: "The #T Lord Protector#! now holds the authority once shared between two masters. Those who supported the change expect dependable command; those who opposed it will remember the promises made when the second seat was abolished."
 ob_ending_herue_0: "The lands of Herue have entered the united government of Norrfalia. The Order now answers directly for the peace once promised by competing kings."
 ob_ending_herue_1: "The old congress has given way to Norrfalia. Its separate courts can no longer leave the northern watch dependent upon competing promises."
 ob_ending_herue_2: "The Herulian crown was brought beneath the Order's seal. With the formation of Norrfalia, its subordinate court has entered the united northern government."
 ob_ending_crisis_0: "The first #R Drow#! host was broken before it emerged. The people behind the watchtowers were spared a campaign, and the chapter can point to preparations that protected more than its own reputation."
 ob_ending_crisis_1: "The early gathering lost its northern bridgehead and dispersed. The chapter has recorded that welcome result without claiming an expeditionary victory it did not win."
 ob_ending_crisis_2: "The first #R Drow#! host emerged before the preparations were complete. Its campaign has ended, and the Order has recovered enough of its frontier to resume the watch."
 ob_ending_leadership_0: "The former master yielded the seal rather than divide the brotherhood by arms. His successor has inherited the undertakings made before that surrender, along with the men who expect them to be honoured."
 ob_ending_leadership_1: "The dispute between the masters was settled by civil war. The surviving leadership has restored the chapters, but the names of brothers killed by brothers will remain in their records."
