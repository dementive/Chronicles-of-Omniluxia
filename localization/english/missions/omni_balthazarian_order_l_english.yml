l_english:
 ob_relief: "Bread Before Sermons"
 desc_ob_relief: "A granary and regular grain imports sustain the capital. Full storehouses have done rather more for public contentment than the chapter's sermons."
 ob_watch: "The Common Watch"
 desc_ob_watch: "The chapter maintains stores, watchmen, and a regular muster at this strongpoint."
 ob_trade: "The Grain Covenant"
 desc_ob_trade: "Written agreements keep the northern markets supplied."
 ob_recovery: "Bind the Wounds"
 desc_ob_recovery: "Coin and labour have been assigned to the repair of the brotherhood."
 ob_shared: "The Founding Covenant"
 desc_ob_shared: "The #Y Sword Master#! commands the watch; the #Y Faith Master#! administers its revenues, courts, and religious obligations. Extraordinary contributions require both seals, and the chapter hears disputes between the offices."
 ob_sole: "The Protector's Command"
 desc_ob_sole: "One Lord Protector now answers for the commands issued in the Order's name."
 ob_charter: "Charter of the Northern Sword"
 desc_ob_charter: "Protection of the northern faithful has been given a settled place in the religious order."
 ob_vampire_intel: "Secrets of the Bound Herald"
 desc_ob_vampire_intel: "The prisoner names passages the Drow believed forgotten. Each answer ends with a question about our own defences."
 ob_compact_cost: "Wards Beneath the Chapel"
 desc_ob_compact_cost: "Braziers, inscribed chains and an unbroken watch contain the herald. No warden is permitted to hear it alone."
 ob_final: "The Shield Before the Crown"
 desc_ob_final: "Permanent arrangements sustain the watch when its founders are no longer present."
 ob_lantern: "The Last Hearth Lantern"
 desc_ob_lantern: "A lamp recovered from the frozen hospice, now kept as a warning to those who stand watch."
 ob_watch_army: "The Northern Watch"
 desc_ob_watch_army: "A temporary defensive muster supported by the northern chapter houses."
 ob_expedition_timer: "The Counter-Expedition"
 desc_ob_expedition_timer: "The brothers are working beneath the approaches. This modifier shows the remaining six-month operation; retaining two forts and the capital food reserve is essential."
 ob_order: "Balthazarian Order"
 ob_order_desc: "Founded in #Y 795 LC#! by #Y Yvius Balthazar#! among the #Y Astvaenic#! tribes, this brotherhood of #T Helluvian#! knights guards the northern frontier. Its #Y Sword Master#! commands the companies, appoints their captains, and maintains the watch. Its #Y Faith Master#! administers the estates, keeps the accounts, and answers for the brotherhood's observance of the faith of #T Hellas#!. Neither office grants authority over the other.\n\nBoth former masters fell at #G Kiaguthmajnnorr#! in 996 LC. Their successors have inherited the same covenant, rather fewer brothers, and a considerable number of unpaid accounts."
 ob_order_ruler: "Faith Master"
 ob_order_ruler_female: "Faith Master"
 ob_order_co_ruler: "Sword Master"
 ob_order_co_ruler_female: "Sword Master"
 ob_order_consort: "Consort"
 ob_order_consort_female: "Consort"
 ob_protectorate: "Balthazarian Order"
 ob_protectorate_desc: "The two seats have been replaced by one #T Lord Protector#!, who commands the brotherhood and answers for the defence of the north."
 ob_protectorate_ruler: "Lord Protector"
 ob_protectorate_ruler_female: "Lord Protector"
 ob_protectorate_co_ruler: "Lord Protector"
 ob_protectorate_co_ruler_female: "Lord Protector"
 ob_protectorate_consort: "Consort"
 ob_protectorate_consort_female: "Consort"
 ob_frontier_heard: "The Frontier Brothers Were Heard"
 ob_dual_mandate: "The Shared Chapter Mandate"
 ob_agreement_opinion: "The Northern Agreements"
 ob_grievance_opinion: "The Price of Intervention"
 ob_early_invasion_wargoal: "The Early Drow Invasion"
 war_goal_ob_early_invasion_wargoal: "The Early Drow Invasion"
 ob_order.1.a: "Send the veterans to relieve the northern forts"
 ob_order.1.b: "Settle the veterans outside the capital"
 ob_order.1.t: "Gather the Broken Lances"
 ob_order.1.desc: "The first veterans reach the gates of [ROOT.GetCountry.GetCapital.GetName|G] before the clerks have finished preparing for their arrival, but thankfully, we were able to accomodate them all. #Y [ROOT.GetCountry.GetRuler.GetName]#! watches men last seen retreating from #G Kiaguthmajnnorr#! return with patched cloaks, repaired shields, and families who have nowhere else to go.\n\nTwo of the veterans, [SCOPE.sChar('ob_tethurane').GetName|Y] and [SCOPE.sChar('ob_norskulane').GetName|Y], volunteer to speak on behalf of the others. [SCOPE.sChar('ob_tethurane').GetFirstName] lays a patched shield before [ROOT.GetCountry.GetRuler.GetFirstName]. 'My family has followed this shield since Kiaguthmajnnorr. Give us land near [ROOT.GetCountry.GetCapital.GetName|Y], and the next time I take it up, they will have a roof to wait under.'\n\nShaking his head no, [SCOPE.sChar('ob_norskulane').GetFirstName] turns to [ROOT.GetCountry.GetCoRuler.GetFirstName] and bows. 'My Lord, the soldiers cry out for relief. I know the men on the northern walls...their families have waited as long as ours. Send soldiers to relieve them, and let them come home too.'\n\n#Y There is disagreement between [ROOT.GetCountry.GetRuler.GetFirstName]#! and [ROOT.GetCountry.GetCoRuler.GetFirstName]#! regarding the settlement of the veterans. #Y [ROOT.GetCountry.GetRuler.GetName]#! wants to settle the warriors nearby [ROOT.GetCountry.GetCapital.GetName|G], where their families can work the land and the brothers can defend their new homes. #Y [ROOT.GetCountry.GetCoRuler.GetName]#! would send them north. The companies holding the border forts are due for relief, and the returning veterans have the experience to take their places."
 ob_order.2.a: "Hear the captains' account of the missing reserve first"
 ob_order.2.b: "Hear the stewards' account of the missing supplies first"
 ob_order.2.t: "The Inquiry at Two Empty Seats"
 ob_order.2.desc: "At the #T Court of Law#! in [ROOT.GetCountry.GetCapital.GetName|G], two empty chairs stand beneath the banner brought home from #G Kiaguthmajnnorr#!. The clerk reads the names of the former masters, who both fell there, and asks the witnesses to tell the chapter why the reserve never reached them. A large crowd of refugees, the families of the fallen soldiers that perished in the disaster, have gathered in the gallery to witness the proceedings.\n\nThe Sword Master, [ROOT.GetCountry.GetCoRuler.GetName|Y], hands the clerk a copy of the march order. 'The captains were told to move before dusk. Ask the stewards what they told the men who came for the grain.' Several captains call for the order to be read aloud.\n\nThe Faith Master, [ROOT.GetCountry.GetRuler.GetName|Y], lays the requisitions beside it. 'And when you have read the order, read the receipts. I want the men who signed for those wagons to tell us where they sent them.' The clerk asks which witnesses the chapter wishes to hear first."
 ob_order.2.desc_norskulane: "\n\n[SCOPE.sChar('ob_norskulane').GetName|Y] steps to the rail. 'I carried the march order. The reserve captain sent me to the storehouse, and the steward there said he needed another warrant. I went back to the captain empty-handed.'"
 ob_order.2.desc_tethurane: "\n\n[SCOPE.sChar('ob_tethurane').GetName|Y] lays his ration slip on the clerk's table. 'This says my company was fed that morning. We got nothing. I saw wagons inside the gate when we marched out. Ask the officers who drew those rations where they went.'"
 ob_order.3.a: "As I already said...feed the families first"
 ob_order.3.b: "Buy supplies for the northern watch"
 ob_order.3.t: "Bread Before Sermons"
 ob_task_3_tt: "#Y We will get to choose a#! #G Reward#!."
 ob_order.3.desc: "By the time [ROOT.GetCountry.GetRuler.GetName|Y] reaches the #Y Granary#! in [ROOT.GetCountry.GetCapital.GetName|G], families are already waiting outside with baskets and empty flour sacks. As the sound of the bugle and drum cracks the crisp dawn air, the quartermaster brings out a ledger and gives the signal to let the hungry people inside. The granary, a permanent structure of stone and brick, will keep the rain and snow off the grain, but there is remarkably little inside to keep dry. Grain imports arrive monthly, however, and the Faith Master promises it won't be long before our granary is overflowing.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] looks down the line as the hungry people press inside. 'Feed the families first, and then the soldiers. I want these people to know there will be bread next week as well.'\n\n[ROOT.GetCountry.GetCoRuler.GetName|Y] arrives moments later, with the northern watch's ration list folded in one hand. [ROOT.GetCountry.GetCoRuler.GetFirstName] hands it to the quartermaster and speaks in a tight voice. 'Why are we giving away so much food when I have men on the walls who are already sharing half rations? I will need at least #Y 40 Gold#! to buy them enough supplies to get through the worst of the season.'"
 ob_order.4.a: "Publish the accounts alongside the roll of the dead"
 ob_order.4.b: "Publish the roll and settle the accounts within the chapter"
 ob_order.4.t: "Account for the Fallen"
 ob_order.4.desc: "The verdict on #G Kiaguthmajnnorr#! has been entered in the chapter record. Now [ROOT.GetCountry.GetRuler.GetName|Y] has before him a fair copy of the roll of the dead and the accounts the clerks have assembled since the hearing. A woman waiting outside the library has asked for a copy of the page that lists her sons. She also wants to know what became of the provisions issued in their company's name.\n\nThe Sword Master, [ROOT.GetCountry.GetCoRuler.GetName|Y], puts the roll in the clerk's hands. 'Give her the page, and let every town have a copy of its dead. I will go through the receipts with the officers who signed them. Some still command companies we need on the frontier. If there is money or grain to recover, I want them here to answer for it.'\n\n[ROOT.GetCountry.GetRuler.GetFirstName] asks the clerk to wait. 'We told those families who the chapter held responsible. They have had to take our word for it. If we send out the names, we can send out the accounts with them and let the towns see what was issued, what reached the men, and what we still owe.'"
 ob_order.5.t: "A Table for Four Kings"
 ob_order.5.a: "A political solution is the only way to keep Herue from war"
 ob_order.5.b: "Prepare to take Herue by force"
 ob_order.5.desc: "[ROOT.GetCountry.GetRuler.GetName|Y] has invited the rulers we have befriended in #G Herue#! to supper at [ROOT.GetCountry.GetCapital.GetName|G]. Our envoys have brought back a different account from every court, and it seemed wiser to ask the men themselves how near their country was to war. For a little while the talk is pleasant enough; jokes and wine were shared, and then the Faith Master asked whether the border villages would be safe to sow in the spring."
 ob_order.5.desc_right_guest: "\n\n[SCOPE.sChar('ob_summit_right_king').GetName|Y] sets down his cup and lets out a belch. 'They would be safe enough if my neighbors would stop sending men across the boundary. The next patrol I catch on my land can spend the winter in my gaol.'"
 ob_order.5.desc_left_guest: "\n\nLaughing bitterly, [SCOPE.sChar('ob_summit_left_king').GetName|Y] asks what borders he means. 'The one your father swore to observe, or the one you drew after he died? My men have orders to ride as far as the old stones. Do not stand in their way! I will send twice as many if I have to.'"
 ob_order.5.desc_private: "\n\nBy the time the servants come to clear the table, it is plain that our guests would sooner go to war than yield a village to one another. [ROOT.GetCountry.GetRuler.GetFirstName] thanks them for coming and has their horses brought round. Only when the hall is empty does the Faith Master turn to the Sword Master. 'It is clear to see what we are dealing with; there will be a war whether we intervene or not. We should find a king willing to swear fealty and give him enough backing to hold Herue. Let him govern it in our name - this is the only way we can ensure peace in the region.'\n\nStaring outside without answering, [ROOT.GetCountry.GetCoRuler.GetFirstName] waits until the last of the horses has passed beneath the window before letting out a sigh. 'Empowering a vassal brings war to our doorstep without any of its benefits. We would still have to fight any rival claimants, and when the war was over, our vassal would have a crown in hand and we would be relying on an oath. If we are going to fight to stabilize Herue, we should take it ourselves.'"
 ob_order.6.a: "Seal the claims and send out the heralds"
 ob_order.6.t: "Lay Claim To Herue"
 ob_order.6.desc: "The guests have gone home, and [ROOT.GetCountry.GetRuler.GetName|Y] has called the archivist back to the hall. He brings the old boundaries of #G Herue#! and a bundle of sworn petitions from towns whose lords can no longer protect them. The clerks spend the next month drawing up the lands the Order will claim the right to settle.\n\nWhen the papers are ready, [ROOT.GetCountry.GetRuler.GetFirstName] asks what they will say to a king willing to swear fealty. 'That we can defend the borders we ask him to hold,' says the Sword Master, [ROOT.GetCountry.GetCoRuler.GetName|Y]. 'And the same papers tell his rivals where our captains will march if they refuse us.' The heralds take their copies from the clerk and wait for the seal."
 ob_order.7.a: "Guarantee the warehouses and pay for the first deliveries."
 ob_order.7.t: "The Price of Open Harbours"
 ob_order.7.desc: "The harbour merchants are prepared to supply the north, my [ROOT.GetCountry.GetRulerTitle]. They are less prepared to let a restored king seize their warehouses once the danger has passed.\n\nA charter promising predictable duties and protection for civic property would bring their factors into our supply arrangements. If we govern the port ourselves, the same promises must be made to its inhabitants; a ruined harbour is of very little use, however impressive the conquest sounded at chapter."
 ob_order.8.a: "Open the granaries and unload the ships"
 ob_order.8.t: "The Grain Covenant"
 ob_order.8.desc: "At the quay in [ROOT.GetCountry.GetCapital.GetName|G], [ROOT.GetCountry.GetRuler.GetName|Y] watches a porter cut the cord on the first sack unloaded from the docks. The quartermaster takes a handful of grain, rubs it between his palms, and calls for the scales. Behind him, the bakers are already arguing over who was promised the first delivery.\n\n[SCOPE.sChar('ob_grain_host').GetName|Y] hands the shipping tally to [ROOT.GetCountry.GetRuler.GetFirstName]. 'When we spoke at [GetProvince('(int32)380').GetName|G], you asked how to keep merchants coming through the winter. See that the captains are paid before they sail, and they'll remember which harbor to make for next season.'\n\n[ROOT.GetCountry.GetRuler.GetFirstName] tells the quartermaster to weigh the cargo in front of the merchants and open the new storehouses. The bakers will have grain to buy at the market, the capital can keep a reserve, and the treasury will collect its share as each cargo is sold."
 ob_order.9.a: "Entrust the watch to [ROOT.GetCountry.GetCoRuler.GetFirstName]."
 ob_order.9.b: "Pay a chapter commission to oversee the watch."
 ob_order.9.t: "One Watch, Many Banners"
 ob_order.9.desc: "The towers are supplied, but the officers have discovered a further difficulty: each believes his ruler should command the men beneath them. The #T Crimson Army#! will not readily accept a rival claimant's captain, and the brothers are unwilling to leave their stores in royal hands.\n\n#Y [ROOT.GetCountry.GetCoRuler.GetName]#! offers to take responsibility. He has the experience, and many veterans already look to him. #Y [ROOT.GetCountry.GetRuler.GetName]#! could instead name a separate chapter commission to divide that authority, though its members would expect payment for their work."
 ob_order.10.a: "Warn the northern courts. Let them see the evidence."
 ob_order.10.t: "Where the Darkness Gathers"
 ob_order.10.desc: "The clerk from Ridkiath reads the roll while the captain spreads the map across the chapter table. Where soot hides a turn, the brother who drew it puts his finger on the hide. He traces the road from the Drow stores beneath #G Mount Balthazar#! to the last stair below the watch.\n\nThe watch has its copy. The masters must decide who else should see it."
 ob_order.11.a: "Prepare the accounts, and let every chapter be heard."
 ob_order.11.t: "The First Reckoning"
 ob_order.11.desc: "The first danger has passed, though there is little agreement over what it has proved. Some brothers credit the agreements that kept the watch supplied. Others insist that only the frontier officers understood the threat from the beginning.\n\nYour fellow #Y Sword Master#! has requested an accounting before the full chapter. His officers have already begun collecting statements. The stewards ask whether they should prepare the accounts as well; it seems unlikely that this meeting will concern military matters alone."
 ob_order.12.a: "Honour the warrant. Purchase replacement grain for the hospice."
 ob_order.12.t: "Two Warrants, One Granary"
 ob_order.12.desc: "My [ROOT.GetCountry.GetRulerTitle], the hospice steward has arrived with an empty grain sack and an exemption bearing the Faith seal. The captain accompanying him carries a requisition issued under the Sword seal. Unfortunately, neither thought to bring any grain.\n\nDuring the northern emergency, the captain supplied his watch from stores promised to wounded brothers and their households. He was ordered to relieve a hungry garrison; the steward was instructed to keep the hospice through winter. Both obeyed their instructions, which has made the hearing rather more difficult.\n\nThe captain asks the chapter to honour his warrant and purchase replacement grain. The steward asks that the exemption stand, requiring military requisitions to fall upon estates already liable for service. Either judgment will determine whose orders the brothers trust when the next alarm sounds.\n\n[ROOT.GetCountry.Custom('ob_command_account_context')]"
 ob_order.14.a: "The #T Order#! must endure beyond the men who command it."
 ob_order.14.t: "Whose Oath Endures?"
 ob_order.14.desc: "The chapters have acknowledged #Y [ROOT.GetCountry.GetRuler.GetName]#! at #G Balthazaria#!. Orders can once again travel beneath a recognised seal, and the clerks have reopened the rolls of service and obligation.\n\n[ROOT.GetCountry.Custom('ob_dispute_aftermath')]\n\nRecognition is only a beginning. The returning households still need repairs, the watch still needs experienced officers, and the next generation must know whether the two seats will be restored. The immediate struggle is over; the work of governing can begin."
 ob_order.15.a: "Accept renewed oaths and allow the wounded to return."
 ob_order.15.b: "Retire the ringleaders and publish their offences."
 ob_order.15.t: "Brothers After Battle"
 ob_order.15.desc: "Repair accounts and petitions for reinstatement arrive together on #Y [ROOT.GetCountry.GetRuler.GetName]#!'s table. One commander asks to return to the watch. Another offers to retire if the chapter will leave the household estate intact. Younger brothers insist that obedience to a #Y master#! should not condemn an entire company.\n\n[ROOT.GetCountry.Custom('ob_dispute_aftermath')]\n\nRenewed oaths would preserve experienced officers and ease the return to ordinary service. Publicly censuring and retiring the ringleaders would make the limits of obedience unmistakable, while giving the governing chapter firmer authority over appointments. Both courses must leave enough men and money to rebuild the watch."
 ob_order.16.a: "Restore the Sword and Faith offices beneath the chapter covenant."
 ob_order.16.b: "One #Y Lord Protector#! shall answer for the #T Order#!."
 ob_order.16.t: "The Founding Covenant"
 ob_order.16.desc: "The clerks have laid two constitutions before #Y [ROOT.GetCountry.GetRuler.GetName]#!. Beside them lie the hospice exemption and the captain's requisition. Neither document has improved with repeated reading.\n\nThe first constitution restores a #Y Sword Master#! to command the companies and a #Y Faith Master#! to administer the estates, courts, and religious houses. Ordinary military orders need no second signature. Extraordinary contributions and the suspension of sworn exemptions require both seals; the assembled chapter judges disagreements.\n\nThe second entrusts both charges to one #Y Lord Protector#!. Captains and stewards would answer to the same office, whose holder must account for their conduct before the chapter.\n\n[ROOT.GetCountry.Custom('ob_constitution_concessions')]\n\n[ROOT.GetCountry.Custom('ob_warrant_record')]"
 ob_order.17.a: "A Herulian king shall answer to the Order."
 ob_order.17.b: "No crown shall stand between the Order and its lands."
 ob_order.17.c: "The old protectorate settlement must be reconsidered."
 ob_order.17.t: "Who Shall Wear the Iron Crown?"
 ob_order.17.desc: "The claimants once left our conference unwilling to accept any peace but their own. The chapter must now settle what authority the Iron Crown may retain. One master's answer was a king beneath our seal, preserving Herulian offices while owing obedience to the Order. The other demanded direct administration, with no royal court between the towns and the watch.\n\nIf Herue already has an independent ruler, we cannot appoint another by proclamation. We may demand that ruler's submission, or maintain our claims until conquest gives us the land. A refusal leaves the question open. Whichever policy we adopt, an independent kingdom is no final settlement: the northern union will require these lands beneath our authority."
 ob_order.18.a: "Confirm the charters and publish the obligations."
 ob_order.18.t: "The King's Peace, the Towns' Rights"
 ob_order.18.desc: "The harbour delegates have arrived carrying copies of every promise made when their grain was needed. They have brought enough clerks to read each promise aloud, should anyone at this meeting prove forgetful. The defeated estates have sent petitions as well, though their representatives are rather less confident of a welcome.\n\nThe proposed settlement confirms civic property, fixes lawful contributions, and permits the markets of #G Herue#! to recover. The military assessors ask that every charter reserve transport for the watch. The merchants will carry the grain at a fixed rate, provided a captain's requisition no longer means that payment may be discussed after the war.\n\nWe can honour the promised terms or collect an extraordinary contribution before sealing the charters. The treasury would welcome the money; the men obliged to provide it are unlikely to remember the occasion kindly.\n\n[ROOT.GetCountry.Custom('ob_office_duties_18')]"
 ob_order.19.a: "Accept the charter and its obligation to account for our brothers."
 ob_order.19.b: "The chapter shall judge its own servants."
 ob_order.19.t: "A Charter for the Sword"
 ob_order.19.desc: "My [ROOT.GetCountry.GetRulerTitle], our messengers have returned from the court of [ROOT.GetCountry.MakeScope.GetVariable('ob_charter_shannah').GetCharacter.GetName|Y]. The doors that once admitted us as distant petitioners now open to representatives whose names the stewards remember. Repairs paid for, services rendered, and rather more patient conversation than our knights usually enjoy have earned the Order a hearing.\n\nThe #T Shannah#!'s representatives have reviewed our arrangements in #G Herue#!. Their charter recognises the northern watch, but asks who will judge a knight who abuses the people he was sent to protect. We may accept their supervision or insist that the chapter must judge its own brothers.\n\nOur standing has secured this audience without calling in the services owed to us. Those may yet assist another petition, though what we say here will certainly be remembered.\n\nA knight accused of taking a farmer's oxen is entitled to a hearing before his brothers. The farmer has asked whether he is entitled to attend it. The #T Shannah#!'s representatives propose that a religious assessor sit with the chapter court; the captains object that outsiders should have no authority over men under military oath.\n\n[ROOT.GetCountry.Custom('ob_office_duties_19')]"
 ob_order.20.a: "Chain the thing below the chapel. Double the watch."
 ob_order.20.t: "The Dead Beneath the Snow"
 ob_order.20.desc: "When #Y Lanuthua#! comes after the rear guard, a brother thrusts a torch into his face. Two more grab his arms while the captain takes him by the legs. They pin him against the stair and bind him with the rope they brought for the #R Drow#!. By the time they reach the chapel below #G Nimzur#!, the rope has frozen stiff. The gaoler brings a length of chain and locks Lanuthua's wrists before the brothers dare cut him loose.\n\nOne of the brothers checks the lock twice. Lanuthua watches him in amusement and laughs bitterly. 'You tied my shield to my wrist at #G Kiaguthmajnnorr#!. I remember how your hands shook then, too.' The brother starts to say he stayed until Lanuthua was dead, but [ROOT.GetCountry.GetRuler.GetName|Y] takes him by the arm before he can finish. 'I know what he is,' the Faith Master hisses. 'We saw him drink blood...Lanuthua, a man that died long ago.' [ROOT.GetCountry.GetRuler.GetFirstName] looks at the frost creeping down the chain. 'The old rolls name a king of #G Herue#! who found vampires keeping his seals and accounts. He hanged the ones he caught and drove the rest into the mountains. Our priests had always called the hunger a sin, a sickness that feeds on your neighbors and draws on the power of #T Melodias#!. After the purge, folk in the north hardly dared speak the word.' The Faith Master points to the frost on the chain. 'The ones who survived up there were called #R Rimebound#!. The old rolls say to burn any body we bring out of the ice. I used to think they meant before it got up.'\n\n[ROOT.GetCountry.GetRuler.GetFirstName] calls for the gaoler, who shuffles up to the vampire with fear in his eyes. Lanuthua greets him by his childhood name, causing the gaoler to pray to Hellas. The man was still a boy when the Order buried Lanuthua at #G Kiaguthmajnnorr#!."
 ob_order.21.a: "Send riders to the northern watch and burn this hellspawn!"
 ob_order.21.t: "What the Ice Remembers"
 ob_order.21.desc: "For many hours, the Masters of the [ROOT.GetCountry.GetName|T] have been interrogating the #R Rimebound#! vampire. A soldier standing guard nearby stifles a yawn; it is well past the third watch. A bleary-eyed [ROOT.GetCountry.GetRuler.GetName|Y] opens the roll of the dead at #G Kiaguthmajnnorr#!. 'Lanuthua. Who carried you off the field?' The vampire looks down at the entry and smiles, revealing long fangs covered in frost. 'You have my brother's name next to mine. Did he die there too?' [ROOT.GetCountry.GetRuler.GetFirstName] shakes [ROOT.GetCountry.GetRuler.GetHerHis] head, offering that he perished the following winter. #Y Lanuthua#! laughs upon hearing this. 'No one brought my body back to [ROOT.GetCountry.GetCapital.GetName|G]? I was not buried with the rites and honors given to a Knight of Balthazar? So much for your vows of brotherhood. No, I lay where I fell until I heard someone calling from under the ground.'\n\nChanging the subject, the #Y Sword Master#! sets a map of #G Mount Balthazar#! over the ledger. 'Our brothers followed the #R Drow#! along this road. What did they open?' Opening his mouth widely, Lanuthua spits ice chunks towards the map, causing [ROOT.GetCountry.GetCoRuler.GetName|Y] to recoil in disgust. 'They broke the seal here. And there. Everywhere that was sealed, they broke. We heard them striking it for three days...they awoke us from our slumber. The #R Drow#! offered us peace beneath the mountain. They want #G Herue#! on its knees, and they asked who knew the way through its gates. We do.'\n\n [ROOT.GetCountry.GetRuler.GetFirstName]'s finger follows the road toward #G Nordmajnng#!. 'Reclaim what is yours? What do you mean?'\n\n'Ask whose hands kept the keys to those forts before your kings began hanging us. The towns shut their gates, and the #R Drow#! drove us out of the lower passages. We wandered from camp to camp for centuries. In the end there were a few dozen of us left, all fighters. You could count our ribs through our shirts.' Lanuthua pulls at his chain and frost forms over the links. 'We learned to raise walls of ice against the wind and anyone who came after us. Then we learned to call back the ones we had buried.'\n\nLanuthua shrieks in delight, eyes flashing bright blue. 'They are marching now. Your men will open the gates for them. I taught them the watchword myself. It is too late! Ha ha ha ha!'\n\nFace pale but determined, the Sword Master calls for a rider to warn the soldiers. Before the door opens, Lanuthua asks [ROOT.GetCountry.GetCoRuler.GetFirstName] to show him his brother's name again, but the Faith Master interrupts. 'We have no time for your games, wretched creature. The watch is already on alert, and the northern forts are manned - you will not leave this chapel alive.'"
 ob_order.22.a: "Endow the chapter estates and confirm their permanent obligations."
 ob_order.22.t: "A Peace That Can Survive Its Makers"
 ob_order.22.desc: "My [ROOT.GetCountry.GetRulerTitle], a new estate-holder has refused the contribution promised by his predecessor. His steward explains that the old agreement belonged to a dead man, an interpretation which several neighbouring households have already found remarkably persuasive.\n\nThe revised settlement attaches grain, transport, and military service to lands and offices. A successor may inherit the estate, but he will inherit its share of the watch as well. Disputed assessments must come before the chapter court, where the rolls can be compared with what the companies actually received. A separate renewal will record passage rights, truces, and recognition of our chapter lands.\n\nOur remaining funds can support two provincial investments and a properly instructed estate administration, or one investment alongside compensation for the disputed communities. The latter settlement would restore confidence around the chapter seat; the former would give its governing office practical experience in managing the new register.\n\n[ROOT.GetCountry.Custom('ob_office_duties_22')]"
 ob_order.23.a: "Train the relief companies. Keep the paid establishment ready."
 ob_order.23.t: "Watchfires for Those Yet Unborn"
 ob_order.23.desc: "The frontier chapters have submitted their permanent establishment: stores, muster rolls, officers, and a reserve paid for before the next alarm arrives. The accounts are less glorious than a victory procession, but considerably more useful to the men who must answer that alarm.\n\nReports recovered from the early host speak of greater powers beneath the earth. The end of the first danger has not emptied the depths. The #T Northern Watch#! will therefore maintain a limited emergency muster, with its costs and period of service entered plainly in the chapter books.\n\nThe final account leaves a choice. The chapter can spend its remaining provision on training the relief companies, or retain additional grain and replenish the manpower reserve. Both establishments preserve the standing right to muster the northern watch; the difference is what will be ready when the summons comes.\n\n[ROOT.GetCountry.Custom('ob_office_duties_23')]"
 ob_order.24.a: "Let those who come after us find the watch still standing."
 ob_order.24.t: "The Shield Before the Crown"
 ob_order.24.desc: "My [ROOT.GetCountry.GetRulerTitle], the assembled delegates have heard the settlement read aloud. The brothers know who commands them, the towns know what they owe, and the northern watch has stores and officers appointed before the next alarm.\n\n[ROOT.GetCountry.Custom('ob_ending_constitution')]\n\n[ROOT.GetCountry.Custom('ob_ending_herue')]\n\n[ROOT.GetCountry.Custom('ob_ending_crisis')]\n\n[ROOT.GetCountry.Custom('ob_ending_leadership')]"
 ob_order.100.a: "Send our representatives to the capital."
 ob_order.100.b: "We have our own affairs to settle."
 ob_order.100.t: "The Knights Request an Audience"
 ob_order.100.desc: "The Balthazarian Order invites our ruler's representatives to its capital to discuss the roads, the frontier, and the succession to Herue's Iron Crown. Attendance promises a hearing, not agreement to another claimant's demands. Our existing wars and sovereignty remain our own."
 ob_order.200.a: "Bring the reports to both masters."
 ob_order.200.t: "The Host Beneath the Snow"
 ob_order.200.desc: "My #Y [ROOT.GetCountry.GetRulerTitle]#!, the masters have put the captain's map beside the northern watch reports. The road under #G Mount Balthazar#! is broad enough for supply wagons. The #R Drow#! are gathering a host, and they have a way to bring it up.\n\nThe chapter report tracks their readiness. Burning their stores buys us time. A failed raid may bring their march forward. At #R 100#! threat, the early host will march.\n\nSecure the roads and supplies, man the watch, and ready the frontier forts. Then send the counter-expedition while there is still time to stop this host."
 ob_order.201.a: "Let the north hear what the brothers have done."
 ob_order.201.t: "The Magazines Are Broken"
 ob_order.201.desc: "The expedition has returned, my [ROOT.GetCountry.GetRulerTitle]. Its officers report that the magazines were burned, the marked approaches broken, and the gathering warriors forced to disperse before their stores could be replaced.\n\nFor once, the communities waiting behind our watchtowers will hear that a host has been stopped before it reached their fields. The brothers have brought back dispatches as well. These speak of other rulers and greater preparations below; our success has ended this commander's expedition, not the danger from the #R Drow#!."
 ob_order.202.a: "Send the warning to every participating court."
 ob_order.202.t: "The Early Host Emerges"
 ob_order.202.desc: "The threat has reached its breaking point, and the reports now concern soldiers rather than stores. The #R Drow#! host has emerged and declared war upon a neighbouring northern realm. Our unfinished expedition will have no further opportunity to destroy its magazines.\n\nThe work already done still matters. An organised watch has reduced the enemy's opportunity to gather its full strength, and discovered routes have exposed some of the reinforcements. We must now endure the campaign and recover the frontier. The report names the actual attacker and defender; this host will not appear beyond an impassable waste merely to reach us."
 ob_order.203.a: "Take account of what remains, and begin the repairs."
 ob_order.203.t: "An End to the First Campaign"
 ob_order.203.desc: "The early host's war has ended, my [ROOT.GetCountry.GetRulerTitle]. The frontier reports must now be read alongside the peace settlement: surviving a campaign is not the same thing as recovering every community caught in it.\n\nBefore we claim that the first danger is resolved, the Order must be at peace, hold its chapter seat, and restore a fortified watch. The chapters are also asking who should answer for the preparations that were left unfinished. Their meeting is unlikely to be a quiet one."
 ob_order.204.a: "Record what we know, without embellishment."
 ob_order.204.t: "The Gathering Disperses"
 ob_order.204.desc: "The scouts can find no independent #R Drow#! power with a usable northern bridgehead. The gathering described in their earlier reports has dispersed or lost the lands needed to launch its expedition.\n\nThis is welcome news, though it would be dishonest to announce that our counter-expedition won a battle it never fought. No prevention reward will be claimed. The northern watch still has reason to remain vigilant against greater preparations below."
 ob_order.205.a: "Keep the staging ground supplied."
 ob_order.205.t: "Six Months beneath the Approaches"
 ob_order.205.desc: "The counter-expedition has begun. Its officers have taken the committed funds and manpower, and will need #Y 180 days#! to destroy the magazines.\n\nIf our fortified staging ground or food stores fail, the expedition must turn back. If the host emerges first, the operation is too late. The report remains available throughout; abandoning the mission tree will not stop the calendar."
 ob_order.206.a: "Bring them home and review the remaining time."
 ob_order.206.t: "The Expedition Turns Back"
 ob_order.206.desc: "Our officers have recalled the expedition. The staging arrangements no longer meet the conditions under which the brothers were sent, and they cannot remain beneath the approaches without supplies.\n\nThe committed resources have already been spent. We can organise another expedition if the frontier is restored and enough time remains before threat reaches #R 100#!. The #R Drow#! have not agreed to postpone their preparations while we make ours."
 ob_order.300.a: "Yield the seal to [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName]; spare the brotherhood a war."
 ob_order.300.b: "Reject [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName]'s demand and defend the seal by arms."
 ob_order.300.t: "One Seal for the #T Order#!"
 ob_order.300.desc: "#Y [ROOT.GetCountry.GetRuler.GetName]#! enters the chapter hall at #G Balthazaria#! to find armed retainers beside the doors. #Y [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetName]#! stands among the frontier captains with a written ordinance. The officers have kept their swords.\n\nThe ordinance gives [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] sole command of the brotherhood. Frontier appointments, stores, and military orders would pass beneath one seal. The two-seat arrangement would end.\n\n[ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] calls it a necessary answer to the northern emergency. To [ROOT.GetCountry.GetRuler.GetFirstName], it is a demand to surrender the office that both #Y masters#! swore to share. The earlier agreement over rotations and household relief has not settled this question of authority.\n\nYielding the seal will make [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] ruler of the #T Order#! under a single protector. Refusing will bring the quarrel to arms: the challenger intends to lead a rival chapter in #R civil war#!. The brothers wait for an answer."
 ob_rebel_name: "The Rival Chapter"
 ob_order.301.a: "Summon the surviving officers and account for the missing."
 ob_order.301.t: "The War Ends, the Oath Remains"
 ob_order.301.desc: "The war between the chapters has ended. #Y [ROOT.GetCountry.GetRuler.GetName]#! receives reports from officers who once shared barracks and now count one another among the dead, the missing, and the prisoners. The banners can be brought together more quickly than the men beneath them.\n\nThe fighting has settled the immediate contest for command. It has not written a constitution. The chapter must regain its seat at #G Balthazaria#!, restore order, and decide how the surviving brothers will serve together before choosing between two #Y masters#! and one #Y Lord Protector#!."
 ob_order.302.a: "Keep the garrisons at their posts until the chapter meets again."
 ob_order.302.t: "An Ultimatum Without a Rising"
 ob_order.302.desc: "#Y [ROOT.GetCountry.GetRuler.GetName]#! has refused the demand for sole command, but #Y [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetName]#! has not established a rival chapter in the field. The threatened rising has produced no separate power against which the #T Order#! can march.\n\nThe seals remain divided in purpose rather than in territory. [ROOT.GetCountry.MakeScope.GetVariable('ob_rival').GetCharacter.GetFirstName] retains the second seat while the officers attempt another meeting in thirty days. There has been no victory and no reconciliation; the ultimatum must be answered again when the chapter assembles."
 ob_order.401.a: "Enter both undertakings in the same record."
 ob_order.401.t: "The Charter Is Renewed"
 ob_order.401.desc: "The surviving signatories have renewed the northern obligations under their present rulers. The clerks have attached the contributions to offices and estates, making it rather harder to forget them at the next succession.\n\nWhere a claimant has restored #G Herue#!, the Order's independence must also be entered in the settlement. The king has therefore been asked to withdraw claims on the chapter's existing lands in return for continued cooperation."
 ob_order.402.a: "Let Norrfalia remember the oath that brought us here."
 ob_order.402.t: "All the North Beneath Our Watch"
 ob_order.402.desc: "The lands required for #G Norrfalia#! now answer to our country or its subjects. The formation has given this northern union a name; the brotherhood must decide how faithfully it will keep the watch that justified its authority.\n\nOur constitution remains in force. A larger realm has not silently restored a second seat or taken the seal from the #T Lord Protector#!. Those who govern this country will still answer under the settlement made by its chapters."
 ob_order.170.0: "Recognise [GetCountry('GN2').GetRuler.GetName|Y]."
 ob_order.170.1: "Recognise [GetCountry('NR5').GetRuler.GetName|Y]."
 ob_order.170.2: "Recognise [GetCountry('NR8').GetRuler.GetName|Y]."
 ob_order.170.3: "Recognise [GetCountry('NR7').GetRuler.GetName|Y]."
 ob_order.170.4: "Recognise [GetCountry('HEO').GetRuler.GetName|Y]."
 ob_order.170.back: "Reopen the crown settlement."
 ob_order.170.t: "A Name for the Iron Crown"
 ob_order.170.desc: "The cooperating claimants await an answer. Each has supplied an account of his rights to the #T Iron Crown#!, and each account reaches much the same conclusion about its author.\n\nOur recognition will identify the realm whose restoration we support. It will not transfer another ruler's lands or settle his wars for him. Should that realm disappear, we may return to the report and choose another settlement."
 ob_order.500.a: "Close the chapter report."
 ob_order.500.t: "The Northern Chapter Report"
 ob_order.500.desc: "$ob_report_body$"
 ob_order_mission: "The Shield and the Iron Crown"
 ob_order_mission_DESCRIPTION: "For over two centuries, the knights of the #T Order of Yvius Balthazar#! have carried the light of #T Hellas#! into the harsh north of #G Luxterra#!. Where the #R Drow#! once ruled, their founder raised his banner beside the tribes he had come to save, winning followers with his courage as readily as with his sermons. His brothers inherited a sacred duty: to stand between the northern peoples and the darkness beneath their feet.\n\nBut the quarrels of kings have found their way into the chapter houses. As the claimants of #G Herue#! tore their kingdom apart, knights who had sworn the same oath took up arms beneath opposing banners. Defeat followed division, and at #G Kiaguthmajnnorr#! in 996 LC, victory cost the Order both of its #Y masters#!.\n\nFive years later, two new masters sit beneath the old banners. Beyond their walls, frightened villages await protection, the #T Iron Crown#! remains bitterly contested, and the caves have grown restless once more. The north has not forgotten #Y Balthazar#!. Whether his knights are still worthy of his name remains to be seen."
 ob_order_mission_CRITERIA_DESCRIPTION: "This mission will be completed when we have restored the strength of the #T Order#!, settled its leadership, and established a lasting watch over the north."
 ob_order_mission_BUTTON_DETAILS: "Restore the brotherhood of Balthazar and bring peace to the troubled north."
 ob_order_mission_BUTTON_TOOLTIP: "The knights of Balthazar must recover their purpose before the north is lost to the quarrels of kings and the darkness below."
 ob_early_army_name: "The Host Beneath the Snow"
 ob_watch_army_name: "The Northern Watch"
 ob_deadline_tt: "The early Drow host invades at #R 100 Threat#!. Threat rises by #Y 5#! every half-year; the cave expedition can alter it. Completing the counter-expedition before 100 prevents this early host only."
 ob_ultimatum_tt: "The demand for sole command is answered in the ultimatum event. Recording the ordinance here does not repeat that choice or begin another war."
 ob_task_11_tt: "Resolve the early host, conclude peace, hold #G Balthazaria#!, and restore two owned forts. A completed counter-expedition prevents the host; otherwise its war must end before recovery is recognised."
 ob_broken_lances_name: "The Broken Lances"
 ob_task_1: "Gather The Broken Lances"
 ob_task_1_DESC: "Veterans of the failed northern campaign are returning to #Y [ROOT.GetCountry.GetRuler.GetName]#! with their families. Commit the treasury and the chapter's authority to settling them at the capital, restoring the households and experienced service on which the #T Order#! depends."
 ob_task_2: "The Public Inquiry"
 ob_task_2_DESC: "Both masters of the #T Order#! fell at #G Kiaguthmajnnorr#! before the reserve or the supply wagons reached the line. Their successors will convene an inquiry at the capital's #T Court of Law#! and hear the survivors before the families of the dead.\n\nThe Sword Master, [ROOT.GetCountry.GetCoRuler.GetName|Y], asks why the stewards refused to release the grain. The Faith Master, [ROOT.GetCountry.GetRuler.GetName|Y], wants the captains who signed for the wagons to account for where they went. The chapter must decide which faction bears responsibility for the defeat. Its verdict will determine which master leaves the hearing with the stronger claim to lead the Order."
 ob_task_3: "Bread Before Sermons"
 ob_task_3_DESC: "A hungry household finds little comfort in a sermon. Fill the stores of [ROOT.GetCountry.GetCapital.GetName|G] and bring grain to its gates, so that our promises may last through winter."
 ob_task_4: "Account For The Fallen"
 ob_task_4_DESC: "[ROOT.GetCountry.Custom('ob_task_4_description')]"
 ob_task_4_DESC_revealed: "The chapter has delivered its verdict on #G Kiaguthmajnnorr#!. The clerks at the capital's #T Library#! must now put the roll of the dead in order and reconcile the surviving supply accounts. The families will receive the names of their dead. Decide whether the towns will also see the accounts or whether the Sword Master will pursue the missing provisions within the chapter."
 ob_inquiry_verdict_required_tt: "The chapter has delivered its verdict in #Y The Public Inquiry#!."
 ob_task_5: "Summon The Claimants"
 ob_task_5_DESC: "Summon the claimants to our capital and seek a settlement for #G Herue#!. If no ruler will yield, the chapter must decide how its own authority can secure the northern roads."
 ob_task_6: "Lay Claim To Herue"
 ob_task_6_DESC: "[ROOT.GetCountry.Custom('ob_task_6_description')]"
 ob_task_6_DESC_revealed: "The visit has made clear how close #G Herue#! is to war. Draw up the Order's claims to #G Great Herue#! while there is still time to send heralds to its courts. A king who swears fealty can call on us to defend those claims. If the claimants take up arms against us, our captains will know what lands they are to secure."
 ob_task_7: "The Price Of Open Harbors"
 ob_task_7_DESC: "The northern watch needs ships as surely as it needs swords. Win the confidence of the harbour towns, whose merchants remember every promise a king has broken."
 ob_task_8: "The Grain Covenant"
 ob_task_8_DESC: "A baker in [ROOT.GetCountry.GetCapital.GetName|G] has taken to leaving his shutters closed until the grain ships come in. Yesterday, a woman waited outside his shop until dusk with a copper in her hand. He had sold the last loaf before she arrived, and now she returns home to her family emptyhanded.\n\nThe food situation is stabilizing, but certainly could be better, and [ROOT.GetCountry.GetRuler.GetName|Y] can see the need for action."
 ob_task_9: "One Watch, Many Banners"
 ob_task_9_DESC: "The frontier forts need a common command as well as stores and soldiers. #Y [ROOT.GetCountry.GetRuler.GetName]#! must decide whether #Y [ROOT.GetCountry.GetCoRuler.GetName]#! should direct the watch or whether a paid commission of the chapter should share that duty. Assemble the men and restore the strongpoints before appointing their officers."
 ob_task_10: "Where The Darkness Gathers"
 ob_task_10_DESC: "Beneath #G Mount Balthazar#! lie passages the shepherds will not enter. Gather the brothers at [GetProvince('(int32)1036').GetName|G] and send them below, before whatever dwells there finds its own road to the daylight.\n\n#Y This will start an event chain#!."
 ob_task_11: "The Host Beneath The Snow"
 ob_task_11_DESC: "The first danger must pass before the north can draw breath. Bring the frontier through the gathering storm, and leave its watch strong enough to greet the next dawn."
 ob_task_12: "An Accounting Of Command"
 ob_task_12_DESC: "The #Y Sword Master#! has requisitioned stores exempted by the #Y Faith Master#!. Bring the warrants and accounts to #G Balthazaria#! and decide who must bear the cost. A brotherhood with two lawful seals ought to agree on what each may promise."
 ob_task_13: "The Chapter Of Broken Seals"
 ob_task_13_DESC: "[ROOT.GetCountry.Custom('ob_task_13_description')]"
 ob_task_13_DESC_revealed: "Enter the demand for sole command and the answer to it in the chapter records. The ultimatum itself determines whether the seal changes hands peacefully or the #T Order#! divides in #R civil war#!; this accounting records that decision."
 ob_task_14: "Whose Oath Endures?"
 ob_task_14_DESC: "[ROOT.GetCountry.Custom('ob_task_14_description')]"
 ob_task_14_DESC_revealed: "The contest for the seal has ended. Restore the chapter's seat at #G Balthazaria#! and recover the stability needed for #Y [ROOT.GetCountry.GetRuler.GetName]#! to govern. Whether authority changed hands by surrender or by war, the #T Order#! needs a recognised leadership before it can rebuild."
 ob_task_15: "Brothers After Battle"
 ob_task_15_DESC: "[ROOT.GetCountry.Custom('ob_task_15_description')]"
 ob_task_15_DESC_revealed: "With command settled, #Y [ROOT.GetCountry.GetRuler.GetName]#! must repair the fortified capital and the households that sustain the watch. Once peace and building work permit, decide whether former opponents may return to service under renewed oaths or whether their leaders should be retired and publicly censured."
 ob_layout_requires_14: "Complete #Y Whose Oath Endures?#!."
 ob_task_16: "The Founding Covenant"
 ob_task_16_DESC: "[ROOT.GetCountry.Custom('ob_task_16_description')]"
 ob_task_16_DESC_revealed: "Write a covenant that assigns command to the #Y Sword Master#! and estates, justice, and religious observance to the #Y Faith Master#!, or unite those duties beneath a #Y Lord Protector#!. The hospice warrants must have been heard before the chapter can settle the limits of either office."
 ob_task_17: "Who Shall Wear The Iron Crown?"
 ob_task_17_DESC: "Settle the #T Iron Crown#! beneath the Order's authority: preserve a subordinate king, or govern #G Herue#! directly. An independent ruler must submit or be overcome before the northern union can be completed."
 ob_layout_requires_16: "Complete #Y The Founding Covenant#!."
 ob_task_18: "The King's Peace, The Towns' Rights"
 ob_task_18_DESC: "Peace will mean little if the towns merely exchange one grasping lord for another. Give their councils reason to welcome the settlement, and their children reason to trust it."
 ob_task_19: "A Charter For The Sword"
 ob_task_19_DESC: "Our swords are carried in the name of #T Hellas#!, but even a faithful hand may strike unjustly. Seek the #T Shannah#!'s recognition, and face the obligations that come with it."
 ob_task_20: "The Dead Beneath The Snow"
 ob_task_20_DESC: "[ROOT.GetCountry.Custom('ob_task_20_description')]"
 ob_task_20_DESC_revealed: "A patrol in #G Nimzur#! broke a #R Drow#! company at the foot of the mountains. The survivors fled into the passes, leaving their wounded in the snow. By morning the wounded were gone, and tracks led uphill from the places where they had lain. Secure #G Nordmajnng#! and muster a company there to follow them. The brothers who returned from #G Mount Balthazar#! know what to look for when the trail goes underground.\n\n#Y This will start an event chain#!."
 ob_task_21: "What The Ice Remembers"
 ob_task_21_DESC: "[ROOT.GetCountry.Custom('ob_task_21_description')]"
 ob_task_21_DESC_revealed: "Lanuthua remembers the brother who knelt beside him at #G Kiaguthmajnnorr#!. Since they put him in chains, he has asked how often the northern watch changes its guard. Bring him the map from Mount Balthazar and ask what he knows about the road beneath it."
 ob_task_22: "A Peace That Can Survive Its Makers"
 ob_task_22_DESC: "A good peace must endure the burial of its makers. Bind the roads, towns, and estates to promises their heirs cannot quietly leave beside the grave."
 ob_layout_requires_19: "Complete #Y A Charter for the Sword#!."
 ob_task_23: "Watchfires For Those Yet Unborn"
 ob_task_23_DESC: "The next watch must inherit an establishment it can actually maintain. Assemble the forts, training grounds, reserves, and food stores; fund the permanent rolls from the chapter estates. The officers will answer for training and relief, and the accounts will show who has paid for them."
 ob_layout_requires_22: "Complete #Y A Peace That Can Survive Its Makers#!."
 ob_task_24: "The Shield Before The Crown"
 ob_task_24_DESC: "Unite the northern lands as #G Norrfalia#! and leave the Order a watch worthy of its promises. Independent crowns and subordinate courts must give way to the government that will keep the peace."
 ob_task_25: "All The North Beneath Our Watch"
 ob_task_25_DESC: "Bring the peninsula, borderlands, and #G Great Herue#! beneath our authority. Proclaim #G Norrfalia#! and absorb its subject courts into one northern government."
 ob_chapter_report: "The Northern Chapter Report"
 ob_chapter_report_desc: "#T Drow Invasion Threat#! #R [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_threat')|0] / 100#!\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_threat_meter')]\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_crisis')]\nThreat rises by #R 5#! every half-year. Cave expeditions can reduce or increase it. The early host invades at #R 100 Threat#!.\n\n#T Order Preparedness#! #G [GuiScope.SetRoot(Player.MakeScope).ScriptValue('ob_report_preparedness')|0] / 100#!\n[GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_report_preparedness_meter')]\nEach requirement below contributes #Y 20#!. Losing forts or food lowers preparedness.\nTwo owned forts: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_forts')]\nRoads agreement: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_roads')]\nGrain covenant and 200 capital-state food: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_grain')]\nCommon watch: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_watch')]\nIntelligence: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_intel')]\nExpedition: [GuiScope.SetRoot(Player.MakeScope).GetRootScope.GetCountry.Custom('ob_status_expedition')]\nLaunch through #Y Break the Mustering Host#!: #Y 75 gold, 2 manpower, 180 days#!. At 100 preparedness, launch the expedition when you have the resources, no civil war, and threat below 100 throughout the expedition. Keep both forts and the food reserve throughout. Only a completed expedition prevents the early host. The later greater invasion remains."
 ob_counter_expedition: "Break the Mustering Host"
 ob_counter_expedition_desc: "Commit #Y 75 gold#! and #Y 2 manpower#! to a #Y 180-day#! expedition. Finish before threat reaches #R 100#! while retaining two owned forts, the grain covenant, and 200 food in the capital province. The operation prevents only the early host."
 ob_muster_watch: "Muster the Northern Watch"
 ob_muster_watch_desc: "Spend #Y 75 gold#! and #Y 2 manpower#! to raise six cohorts for up to #Y two years#! during a war against the #R Drow#!. The muster ends when that war ends. Cooldown: #Y ten years#!."
 ob_assume_herue: "Assume the Protectorate of Herue"
 ob_assume_herue_desc: "With #G Great Herue#! under our country or its subjects, the #T Lord Protector#! may assume responsibility for the realm. The #T Balthazarian Order#! government is preserved; the capital moves to #G Dawaon#!."
 ob_renew_congress: "Renew the Congress Invitations"
 ob_renew_congress_desc: "Spend #Y 15 gold#! and #Y 5 political influence#! to approach rulers who refused the congress. Existing signatures and unanswered invitations remain in force. Available once per year."
 ob_reconsider_crown: "Reconsider the Herulian Settlement"
 ob_reconsider_crown_desc: "Review our intended settlement if a claimant has disappeared or circumstances have changed. Earlier expenditure is not refunded. Review is available once per year."
 ob_norrfalia_epilogue: "All the North Beneath Our Watch"
 ob_norrfalia_epilogue_desc: "Record the formation of #G Norrfalia#! after the final chapter. This grants no duplicate formation investments."
 ob_last_hearth_lantern: "Lantern of the Last Watch"
 ob_last_hearth_lantern_desc: "A ward-lamp recovered from the shrine beneath the glacier. Its flame bends toward the ice even when there is no wind."
 ob_status_ready: "#G Ready#!"
 ob_status_missing: "#R Outstanding#!"
 ob_ending_constitution_0: "Two #T masters#! will continue to hold the seats of #Y Balthazar#!, with the assembled chapter empowered to settle their disputes. The brothers have seen what happens when each master gathers a country of his own."
 ob_ending_constitution_1: "The #T Lord Protector#! now holds the authority once shared between two masters. Those who supported the change expect dependable command; those who opposed it will remember the promises made when the second seat was abolished."
 ob_ending_herue_0: "The lands of Herue have entered the united government of Norrfalia. The Order now answers directly for the peace once promised by competing kings."
 ob_ending_herue_1: "The old congress has given way to Norrfalia. Its separate courts can no longer leave the northern watch dependent upon competing promises."
 ob_ending_herue_2: "The Herulian crown was brought beneath the Order's seal. With the formation of Norrfalia, its subordinate court has entered the united northern government."
 ob_ending_crisis_0: "The smaller #R Drow#! host was broken before it emerged. The people behind the watchtowers were spared a campaign, and the chapter can point to preparations that protected more than its own reputation."
 ob_ending_crisis_1: "The early gathering lost its northern bridgehead and dispersed. The chapter has recorded that welcome result without claiming an expeditionary victory it did not win."
 ob_ending_crisis_2: "The smaller #R Drow#! host emerged before the preparations were complete. Its campaign has ended, and the Order has recovered enough of its frontier to resume the watch. The greater powers below remain."
 ob_ending_leadership_0: "The former master yielded the seal rather than divide the brotherhood by arms. His successor has inherited the undertakings made before that surrender, along with the men who expect them to be honoured."
 ob_ending_leadership_1: "The dispute between the masters was settled by civil war. The surviving leadership has restored the chapters, but the names of brothers killed by brothers will remain in their records."
