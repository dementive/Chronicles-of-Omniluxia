duggmannrum_stooltip_3: "#Y The#! #G Green Valley#! #Y must have#! #T 10#! #Y cities or more.#!"
duggmannrum_stooltip_4: "#G The Sennmöggen will become vassals of the King!#!"
duggmannrum_stooltip_5: "#R We shall go to war with the Order!#!"
duggmannrum_stooltip_6: "#Y Serfs will migrate to nearby cities.#!"
duggmannrum_stooltip_7: "#Y #E [GetCharacter('(int32)88').GetFirstName]#! will search for the important text that #E [GetCharacter('(int32)87').GetFirstName]#! tried to find#!"

