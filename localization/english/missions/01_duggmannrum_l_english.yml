l_english:

03_duggmannrum: "Heirs of Srrørum"
03_duggmannrum_DESCRIPTION: "My king, your father is at rest in the #Y Silver Caves#!. He spent much of his reign restoring #Y Duggmannri#! and much of the rest convincing its neighbors they could survive the restoration. After enough coalitions had spent their men trying to prove otherwise, he obtained their signatures on the #Y Eternal Peace#!. There are still raids along the border, but the men who bring us word of them usually come home alive. That was an achievement in the #G Green Valley#!.\n\nNobody heard what he said when he called you to his deathbed. The court heard you well enough when you took the crown. You mean to unite the #Y Anvindr#! under your banner, and every family that signed your father's treaty is now considering what its signature is worth."
03_duggmannrum_CRITERIA_DESCRIPTION: "This mission will be completed when [ROOT.GetCountry.GetName|T] has restored #Y [GetCharacter('(int32)65').GetFirstName]'s#! kingdom."
03_duggmannrum_BUTTON_TOOLTIP: "Let us reforge #E [GetCharacter('(int32)65').GetFirstName]'s#! kingdom!"

#Missions 
####ARMY
03_duggmannrum_task_1: "Preparing for War"
03_duggmannrum_task_1_DESC: "Your father's envoys knew which halls kept their doors open to us. The men you send now will find out how many spears stand behind those doors. Meanwhile our own captains are to see that their troops can march when called."

03_duggmannrum_task_2: "Breaking the Peace"
03_duggmannrum_task_2_DESC: "The reports agree on one point. The other kings are talking to one another. Before those talks produce another coalition, we shall send word that our army is marching on [GetCountry('SV6').GetName|T]. Every court in the #G Green Valley#! will receive the announcement. They may consult the #Y Eternal Peace#! at their leisure."

03_duggmannrum_task_3: "Negotiate with the Order"
03_duggmannrum_task_3_DESC: "My king, the knights of [GetCountry('SV1').GetName|T] can cost us more men than any other host in the valley. You have the key from #Y Veddtunn#!. Let us see whether the Grand Master values it enough to give us a hearing."

03_duggmannrum_task_4: "Conquering the Brewers"
03_duggmannrum_task_4_DESC: "The road to the #G Eastern Gate#! runs through [GetCountry('SV6').GetName|T]. Its brewers have spent a good many years selling to both sides of every quarrel. Their markets and storehouses will serve the army well once we hold them."

03_duggmannrum_task_5: "Subjugating the Scholars"
03_duggmannrum_task_5_DESC: "The scholars of [GetCountry('SV5').GetName|T] have records we shall need when the fighting is over. Tell the captains that taking #Y Veddtunn#! and bringing its books home intact are the same assignment."

03_duggmannrum_task_6: "Crushing the Traitors"
03_duggmannrum_task_6_DESC: "The #Y Droi#! still bear the name their forebears carried against #Y Hefdarr#!. Every hall in the valley has its own account of that treachery. For once they agree on where our army ought to go."

03_duggmannrum_task_7: "Controlling the Eastern Gate"
03_duggmannrum_task_7_DESC: "The #G Eastern Gate#! has kept Elven raiders out of the valley for generations. We need its defenders under our command and its soul gem mine at [GetProvince('(int32)4075').GetName|G] in working order."

03_duggmannrum_task_8: "Consolidating the Valley"
03_duggmannrum_task_8_DESC: "The army has settled who rules the valley. The officials must now settle who holds each farm, where displaced families can return, and which old obligations the crown will recognize."

####REFORMS
03_duggmannrum_task_9: "Hefdarr's Lessons"
03_duggmannrum_task_9_DESC: "#Y Hefdarr#! found good officers and ministers in houses no herald had heard of. [ROOT.GetCountry.GetRuler.GetName|Y] means to read the old accounts and see how much of that practice the present nobility can be persuaded to remember."

03_duggmannrum_task_10: "Integrating the Sennmöggen"
03_duggmannrum_task_10_DESC: "The #Y Sennmöggen#! have sworn their loyalty. The generals would put their best knights in command of the army. The men responsible for the king's safety have an equally pressing use for them."

03_duggmannrum_task_11: "The Sennfernnen"
03_duggmannrum_task_11_DESC: "The #Y Sennjallurr#! has served us for four centuries. Our neighbors have had four centuries to learn how we use it. The captains are to drill a formation that can keep its pikes together while moving across a broken field."

03_duggmannrum_task_12: "Invite Foreign Mages"
03_duggmannrum_task_12_DESC: "The valley has few mages, and those we have learned long ago to keep quiet about their work. [GetCountry('SOV').GetName|T] has teachers to spare. Our court must decide whether it can stomach taking lessons from #T Dragkhans#!."

03_duggmannrum_task_13: "Expand Gerrbaen"
03_duggmannrum_task_13_DESC: "The terraces of the #Y Gerrbaen#! were laid out for a smaller seat of power. Extend them up the hills. The crown can afford a garden worthy of the valley it now governs."

03_duggmannrum_task_14: "The Sennkallen"
03_duggmannrum_task_14_DESC: "Our infantry can hold a line. The difficulty is sending enough weight through the enemy's when the opportunity comes. The silver masks of the #Y Sennkallen#! have been known to settle that question before the charge."


#####DEVELOPMENT
03_duggmannrum_task_15: "Restore the Hthgart Brewery"
03_duggmannrum_task_15_DESC: "The old #Y Hthgart Brewery#! has been declining for near a century. The merchants of [GetProvince('(int32)3947').GetName|G] have plenty to say about its glory and rather less to sell of its beer. Give the brewers the means to change that."

03_duggmannrum_task_16: "Expand the Academies of Veddabi"
03_duggmannrum_task_16_DESC: "The scholars at [GetProvince('(int32)3988').GetName|G] have outgrown their halls. Give them room and funds to teach. They have spent years asking us to value their work and should find the expense of proving its worth agreeable."

03_duggmannrum_task_17: "Develop the Mines of Púkklantenath"
03_duggmannrum_task_17_DESC: "There are #Y soul gems#! beneath [GetProvince('(int32)4075').GetName|G] enough to keep the colleges supplied. Getting them out will take miners, shafts, and an arrangement that sees the stones reach the people who can use them."

03_duggmannrum_task_18: "Promote Urbanization"
03_duggmannrum_task_18_DESC: "The old estates keep most of our people tied to the soil. Our towns need craftsmen and merchants, and there are families on those estates who would gladly make a living at either trade if the crown let them move."

03_duggmannrum_task_19: "A Land of Plenty"
03_duggmannrum_task_19_DESC: "The valley is green where there is soil enough to grow anything. The towns are filling, and fewer hands remain on the farms. We had better improve the land we can till before the bakers begin weighing out smaller loaves."
task_19_tt: "#Y All rural farmlands must have #E Farming Settlements#! and #E ten#! or more population#!"

03_duggmannrum_task_20: "Rebuilding Our Capital"
03_duggmannrum_task_20_DESC: "[GetProvince('(int32)3883').GetName|G] served as the seat of a small kingdom. It now receives business from the whole valley, much of it in streets laid out for carts that never had to pass one another. Let us rebuild it to suit its duties."

03_duggmannrum_task_21: "Building a Grand Palace"
03_duggmannrum_task_21_DESC: "The #Y Sørrborr#! has its new streets and gardens. It still needs a palace where the king can receive the valley's nobility and make the order of precedence plain to them."

03_duggmannrum_task_22: "The True King"
03_duggmannrum_task_22_DESC: "The valley is united, the capital rebuilt, and the records of the old house are in the king's hands. The time has come for [ROOT.GetCountry.GetRuler.GetName|Y] to tell the assembled estates what name he means to wear with the crown."


#Tooltips


#Modifiers
####CONQUEST
prepared_for_war_mod: "Prepared for War"
desc_prepared_for_war_mod: "Our soverign now has the knowledge and men needed to fight our enemies for control of the #G Green Valley#!!"
uni_war_mod: "Second Unification Wars"
desc_uni_war_mod: "Sparked by #G Hartbaltt#!'s invasion of #T Jórrvetali#!, the Second #T Unification Wars#! was a period of time in which the states of the #G Green Valley#! battled each other over who would ultimately control all of the #Y Anvindr#!."

##REFORM
meritocracy_mod: "Meritocracy"
desc_meritocracy_mod: "#Y Just#! like #Y King Hefdarr#! before him, #G Hartbaltt#!'s reforms have ensured that his state is a meritocracy, allowing him to choose the best and brightest to help him run the nation."
sennfernnen_mod: "Sennfernnen"
desc_sennfernnen_mod: "Building off of the #Y Sennjallurr#!, the #Y Sennfernnen#!, or the '#Y Iron#! Squares', creates smaller units of 50 heavily armored pikemen that move across the battlefield semi-independently, protecting themselves from cavalry and allowing them to be more maneuverable than the previous #Y Sennjallurr#! allowed them to be."
foreign_mages_mod: "Foreign Mages"
desc_foreign_mages_mod: "#Y Dragkhan#! mages receive some of the best education in the world besides human ones, by inviting some of them to the #G Veddabi#! universities we may be able to learn and utilize some of their knowledge!"
gerrbaen_expanded_mod: "Gerrbaen Expanded"
desc_gerrbaen_expanded_mod: "#Y Gerrbaen#! is a large complex of public and private farms and gardens etched into the nearby #T Green#! Mountain from which the city of Gorrgerrabi was named after. Built much like the #Y Verobaen#! farms of the #Y Mythic Age#!, it grew to its largest extent in 645 LC, where it decayed in use until it was recently expanded to accommodate the Gorrgerrabi's growth."
sennkallen_mod: "Sennkallen"
desc_sennkallen_mod: "The #Y Sennkallen#! are regiments of heavily armored cavalry very similar to Cataphracts of some human states, and can smash into lightly defended infantry and cavalry."
senn_officers_mod: "Sennmöggen Officers"
desc_senn_officers_mod: "The #Y Order#! of #Y Sennmöggen#! hosts some of the best trained knights in the valley. By using them as officers to inspire and lead our troops our army's quality will soar compared to our enemies!"
senn_guard_mod: "Sennmöggen Guards"
desc_senn_guard_mod: "Knights from the #Y Order#! of #Y Sennmöggen#! are loyal above all else. With these elite knights guarding our King, he is sure to be safe against nearly all threats!"


####DEVELOPMENT
restored_brewery_mod: "Hthgart Brewery Restored"
desc_restored_brewery_mod: "Due to rumored disputes with his sons, the legendary founder of Htgath Brewery, Hlffsten, buried his secrets with him when he died in 954 LC, leading the brewery to fall into a decline. However, with some investment, its operations were once again expanded and its name spread to all corners of the #G Green Valley#!."
expanded_academy_mod: "Expanded Academies"
desc_expanded_academies_mod: "The '#Y City#! of Knowledge', #G Veddabi#!, hosts numerous universities and academies, and young nobles from across the #G Green Valley#! are often sent there to learn about the ancient classics, mathematics, sciences, and the limited amount of magical knowledge available. By expanding their operations, we can offer higher education to more than just the richest aristocratic families in our realm!"
expanded_mines_mod: "The Mines of Púkklantenath"
desc_expanded_mines_mod: "The mines of #G Púkklantenath#! are known as the 'Demon Lands', since the #Y Soul Gems#! found there often emit a powerful aura that unnerves the stereotypically suspicious and magiphobic #Y Silver Dwarves#! of the area."
state_funded_farms_mod: "Redistributed Lands"
desc_state_funded_farms_mod: "#G Hartbaltt#!'s land reforms have given farmlands to local farmers to own and work, with the hope that they would be more productive than neighboring serfs."
palace_mod: "Hartbaltt's Palace"
desc_palace_mod: "The most famous building in the neo-Hefdarric style, #G Hartbaltt#!'s Palace tries to imitate certain aspects of Hefdaric architecture while innovating with aspects of post-Hefdaric and even #T Dragkhanic#!. It's slightly fortified and it sits outside the city walls, looming over the capital as a symbol of the young King's power."
sorrborr_mod: "Sørrborr"
desc_sorrborr_mod: "#Y Sørrborr#! is a title reserved for the very few cities in the #Y Silver Dwarven#! world which achieve the status of a true #G Metropolis#!, housing grand projects, infrastructure, monuments, and trading centers."

restored_kingdom_mod: "Restored Kingdom"
desc_restored_kingdom_mod: "After centuries of division, our realm alone has unified our people! Thus, granting our sovereign the privilege of connecting our state to an ancient legacy stretching back to the #Y Mythic Age#!!"


 

#Treasures


#Events
me_duggmannrum_1_title: "$03_duggmannrum_task_1$"
me_duggmannrum_1_desc: "A year after his father's death, [GetCharacter('(int32)77').GetFirstName|Y] can still hear the old man's voice. 'You call yourself a scholar. Why ask a dying man what your ancestors have already put in books?'\n\nHis father had spent years trying to take #Y Veddtunn#!. Now he spoke of a record hidden in its tower that could give his son the right to unite the valley. 'Take back the Silver Kingdom,' he said. 'Then go beyond the Western Door.'\n\nThe captains have drawn up the muster. The envoys have brought in their reports. Only the messengers are still waiting for orders."
me_duggmannrum_1.a: "Prepare the messengers!"
me_duggmannrum_1_tooltip: "The mission task '#Y $03_duggmannrum_task_1$#!' has now been #G Completed#!!"

me_duggmannrum_2_title: "The Invasion"
me_duggmannrum_2_desc: "The heralds have read our proclamation in every hall. Our army is marching on [GetCountry('SV6').GetName|T], and the #Y Eternal Peace#! has served its last day. Several rulers took pains to appear outraged. Their officers were making preparations before our messengers left the gates."
me_duggmannrum_2.a: "We shall march until the #E Green Valley#! is ours"
me_duggmannrum_2_tooltip: "The mission task '#Y $03_duggmannrum_task_2$#!' has now been #G Completed#!!"

me_duggmannrum_3_title: "The Second Unification Wars"
me_duggmannrum_3_desc: "The #G Green Valley#! has six realms left to quarrel over the inheritance of #Y Srrørum#!. Its young soldiers have heard of border raids all their lives and have scarcely seen a pitched battle. Our officers are already calling this the #Y Second Unification Wars#!. One hopes they have the measure of the thing they have named."
me_duggmannrum_3.a: "We shall unite the #E Green Valley#! under our banner!"

me_duggmannrum_4_title: "Meeting with the Order"
me_duggmannrum_4_desc: "The #Y Srrøbondi#! expected you to demand submission, my king. Instead you knelt and asked him to be your sword. His knights laughed at first. By supper they were wondering what you had brought to make such a request.\n\nIn private he asked what your promises were worth after the #Y Eternal Peace#!. You set the red book from #Y Veddtunn#! before him. The knights swore to defend the #Y Silver Caves#! and the #Y Duggmoggen#! line. Let him read what that oath now asks of him."
me_duggmannrum_4.a: "I hope the #E Srrøbondi#! can recognize my birthright"
me_duggmannrum_4_tooltip: "The mission task '#Y $03_duggmannrum_task_3$#!' has now been #G Completed#!!"

me_duggmannrum_5_title: "Negotiations with the King"
me_duggmannrum_5_desc: "The young king asked for our swords, #Y Srrøbondi#!. Over supper he offered protection from the western realms in exchange for the Order's service. He broke the #Y Eternal Peace#! readily enough, as you pointed out to him.\n\nThen he brought out a red book from #Y Veddtunn#!. If its record is sound, he is of the #Y Duggmoggen#! line that our knights swore to defend. If it is a forgery, someone has gone to considerable trouble to learn exactly what our oath says."
me_duggmannrum_5.a: "The Order will grant the #E True King#! our strength"
me_duggmannrum_5.b: "The records must be a fake!"

me_duggmannrum_6_title: "Meeting with the Order: Success"
me_duggmannrum_6_desc: "The king has returned to [GetProvince('(int32)3883').GetName|G] with knights of the #Y Sennmöggen#! in his company. [GetCountry('SV1').GetRuler.GetName|Y] has accepted his lordship. The nobles who spent the last few weeks predicting a refusal have come to the feast with the rest."
me_duggmannrum_6.a: "Excellent!"

me_duggmannrum_7_title: "Meeting with the Order: Failure"
me_duggmannrum_7_desc: "The #Y Grand Master#! has refused the king's terms and cast doubt on his descent. The king kept his answer until he was outside the castle. By the time he reached his horses, his attendants knew exactly which walls the army would be asked to take."
me_duggmannrum_7.a: "Let us show the Sennmöggen the might of the True King!"

me_duggmannrum_8_title: "$03_duggmannrum_task_4$"
me_duggmannrum_8_desc: "The merchants of #T Jórrvetali#! governed [GetProvince('(int32)3947').GetName|G] from their council chamber. They have kept accounts here since before several of our noble houses had names. Now that the city is ours, we shall see whether its merchants can be as useful to the crown as they were to themselves."
me_duggmannrum_8.a: "I'll drink to that!"
me_duggmannrum_8_tooltip: "The mission task '#Y $03_duggmannrum_task_4$#!' has now been #G Completed#!!"

me_duggmannrum_9_title: "Entering the Labyrinth"
me_duggmannrum_9_desc: "My king, #Y Veddtunn#! is ours. Its librarians can show you the books that generations of #Y Silver Dwarves#! have come here to read. Your father's account concerns what was put away from those readers. Shall we have the lower rooms searched?"
me_duggmannrum_9.a: "Let's try not to run into any cobwebs"
me_duggmannrum_9_tooltip: "The mission task '#Y $03_duggmannrum_task_5$#!' has now been #G Completed#!!"

me_duggmannrum_10_title: "$03_duggmannrum_task_6$"
me_duggmannrum_10_desc: "The #Y Droi#! are beaten. The old songs say Duke #Y Harttol 'to Ommor'#! turned against #Y Hefdarr#! before the #Y Battle of Driorum#!, while the #Y Zanni#! were upon us. Our men sang those songs on the march. Now the crown must decide how to govern the people named in them."
me_duggmannrum_10.a: "A dwarf neither forgives nor forgets"
me_duggmannrum_10_tooltip: "The mission task '#Y $03_duggmannrum_task_6$#!' has now been #G Completed#!!"

me_duggmannrum_11_title: "$03_duggmannrum_task_7$"
me_duggmannrum_11_desc: "The #Y Khundavli#! held the #G Eastern Gate#! in the tradition of #Y Ulffgrdd 'to Jallurr'#!. We had to beat them in the field to win it. We shall need men who know the gate as well as they do if we intend to keep it."
me_duggmannrum_11.a: "Let us safeguard Ulffgrdd's legacy!"
me_duggmannrum_11_tooltip: "The mission task '#Y $03_duggmannrum_task_7$#!' has now been #G Completed#!!"

me_duggmannrum_12_title: "$03_duggmannrum_task_8$"
me_duggmannrum_12_desc: "The valley is under one crown. That has brought more petitions to [ROOT.GetCountry.GetRuler.GetName|Y] than any of the generals thought to promise him. #Y Hefdarr#! drew capable servants from beyond the old houses. It is a practice worth reviving while there are places to fill."
me_duggmannrum_12.a: "Peace at last!"
me_duggmannrum_12_tooltip: "The mission task '#Y $03_duggmannrum_task_8$#!' has now been #G Completed#!!"

me_duggmannrum_13_title: "$03_duggmannrum_task_9$"
me_duggmannrum_13_desc: "The men brought forward under the new rules are waiting for their assignments. Some will keep the king's accounts, some will run his districts, and some will march with his armies. Their patrons, where they have any, are anxious to see which work proves the most honorable."
me_duggmannrum_13.a: "Another step towards the restoration of Srrørum!"
me_duggmannrum_13_tooltip: "The mission task '#Y $03_duggmannrum_task_9$#!' has now been #G Completed#!!"

me_duggmannrum_14_title: "Integrating the Order"
me_duggmannrum_14_desc: "The first time the king met the #Y Grand Master#!, it was the king who knelt. This time [GetCharacter('(int32)78').GetName|Y] knelt and rose at his command. There was little ceremony after that. The king needs the #Y Sennmöggen#! in service and must decide where to put their best men."
me_duggmannrum_14.a: "'The Sennmöggen will lead my armies'"
me_duggmannrum_14.b: "'The Sennmöggen will be my personal guard'"
me_duggmannrum_14_tooltip: "The mission task '#Y $03_duggmannrum_task_10$#!' has now been #G Completed#!!"

me_duggmannrum_15_title: "The Grand Master Joins the Court"
me_duggmannrum_15_desc: "After supper the #Y Grand Master#! rose to speak. He would place the lands of the Order in the king's hands and take a place at court as his chief military adviser. For a moment the hall was quiet enough to hear the servants. Then the king lifted his cup and the room followed."
me_duggmannrum_15.a: "Wonderful!"

me_duggmannrum_16_title: "$03_duggmannrum_task_11$"
me_duggmannrum_16_desc: "At #Y Bárrlantpiath#! the old formation won at a price the captains still remember. Their answer is the #Y Sennfernnen#!, squares of fifty armored pikemen that can move separately and hold off cavalry on their own. At #Y Driorum#! the enemy learned how many directions an Anvindr army could come from."
me_duggmannrum_16.a: "Genius!"
me_duggmannrum_16_tooltip: "The mission task '#Y $03_duggmannrum_task_11$#!' has now been #G Completed#!!"

me_duggmannrum_17_title: "$03_duggmannrum_task_12$"
me_duggmannrum_17_desc: "[GetCountry('SOV').GetName|T] has sent young mages from schools our own scholars speak of with grudging respect. There are men in the hall who hear #T Dragkhan#! and think first of a raid. The king has given the newcomers work at court and with the army. The men who object are welcome to produce teachers of equal ability."
me_duggmannrum_17.a: "Let us hope these Dragkhans cause no trouble..."
me_duggmannrum_17_tooltip: "The mission task '#Y $03_duggmannrum_task_12$#!' has now been #G Completed#!!"

me_duggmannrum_18_title: "$03_duggmannrum_task_13$"
me_duggmannrum_18_desc: "The terraces of #Y Gerrbaen#! have been restored and extended above [GetProvince('(int32)3883').GetName|G]. The lower walks are open to the people. The royal family keeps the #Y Konungien#! at the summit, where the gardeners are said to tend some remarkable beasts. Their orders evidently say less about what to tell the public than what to feed them."
me_duggmannrum_18.a: "Glorious!"
me_duggmannrum_18_tooltip: "The mission task '#Y $03_duggmannrum_task_13$#!' has now been #G Completed#!!"

me_duggmannrum_19_title: "$03_duggmannrum_task_14$"
me_duggmannrum_19_desc: "The #Y Sennkallen#! ride in silver masks. In the #Y Second Unification Wars#! there were men who left the field as soon as those masks caught the light. The officers have put the heavy horse in order again. The next enemy may take as long as it likes to decide whether to stand."
me_duggmannrum_19.a: "Let the Iron Horsemen ride!"
me_duggmannrum_19_tooltip: "The mission task '#Y $03_duggmannrum_task_14$#!' has now been #G Completed#!!"

me_duggmannrum_20_title: "$03_duggmannrum_task_15$"
me_duggmannrum_20_desc: "From his camp above [GetProvince('(int32)3947').GetName|G], the king could see carts waiting to enter the markets again. The #Y Hthgart Brewery#! is sending out barrels at a rate its old masters would recognize. Several merchants have already petitioned for more road space."
me_duggmannrum_20.a: "Drinks on me!"
me_duggmannrum_20_tooltip: "The mission task '#Y $03_duggmannrum_task_15$#!' has now been #G Completed#!!"

me_duggmannrum_21_title: "$03_duggmannrum_task_16$"
me_duggmannrum_21_desc: "The city around #Y Veddtunn#! has new halls for lectures and study. The scholars still speak of what the library holds from the #Y Mythic Age#!. They have begun to speak, too, of what their pupils might write for people who come here after us."
me_duggmannrum_21.a: "Books, books, and more books!"
me_duggmannrum_21_tooltip: "The mission task '#Y $03_duggmannrum_task_16$#!' has now been #G Completed#!!"

me_duggmannrum_22_title: "$03_duggmannrum_task_17$"
me_duggmannrum_22_desc: "For years the scholars of [GetProvince('(int32)3988').GetName|G] asked the keepers of [GetProvince('(int32)4075').GetName|G] for #Y soul gems#! and came away empty-handed. The new shafts have changed that. The colleges are drawing up their lists of experiments faster than the miners can draw up the stones."
me_duggmannrum_22.a: "You say there are souls in these gems?"
me_duggmannrum_22_tooltip: "The mission task '#Y $03_duggmannrum_task_17$#!' has now been #G Completed#!!"

me_duggmannrum_23_title: "$03_duggmannrum_task_18$"
me_duggmannrum_23_desc: "Families formerly bound to the estates are coming into town to take up trades. The estate holders have brought us a long account of what the old arrangement provided. The towns have brought shorter accounts showing what their new workers can make."
me_duggmannrum_23.a: "Let the great cities of the valley rise!"
me_duggmannrum_23_tooltip: "The mission task '#Y $03_duggmannrum_task_18$#!' has now been #G Completed#!!"

me_duggmannrum_24_title: "$03_duggmannrum_task_19$"
me_duggmannrum_24_desc: "The towns have acquired new hands and the farms have lost them. The king has ordered improvements to the valley's food supply, and the stewards are taking stock of the land that can be put to better use. They would prefer to have their figures before the price of bread gives them an answer."
me_duggmannrum_24.a: "Ours is a people of the soil"
me_duggmannrum_24_tooltip: "The mission task '#Y $03_duggmannrum_task_19$#!' has now been #G Completed#!!"

me_duggmannrum_25_title: "$03_duggmannrum_task_20$"
me_duggmannrum_25_desc: "The king's party went through [GetProvince('(int32)3883').GetName|G] this morning. Bakers were drawing bread, smiths were at their fires, and the markets were busy before the royal guards had cleared the street. The capital now looks capable of keeping the court that has gathered in it."
me_duggmannrum_25.a: "One last step..."
me_duggmannrum_25_tooltip: "The mission task '#Y $03_duggmannrum_task_20$#!' has now been #G Completed#!!"

me_duggmannrum_26_title: "$03_duggmannrum_task_21$"
me_duggmannrum_26_desc: "The new palace stands above the #Y Sørrborr#!, with a road laid directly to the #Y Konungien#!. Its rooms carry the paintings and statues of the old #Y Silver Dwarven#! kings. The builders have finished, the musicians have been paid, and the nobles have had time to see how much stone the crown can command."
me_duggmannrum_26.a: "A powerful symbol of a powerful King!"
me_duggmannrum_26_tooltip: "The mission task '#Y $03_duggmannrum_task_21$#!' has now been #G Completed#!!"

me_duggmannrum_27_title: "The True King"
me_duggmannrum_27_desc: "On the fifth day of celebration, [GetCharacter('(int32)78').GetName|Y] came forward with the crown. The king took it in his own hands.\n\n'I am #Y Hefdarr II#! of the #Y House of Duggmöggen#!, and I claim the #Y Third Kingdom of Srrørum#! from the Western Door to the #Y Silver Caves#!. Our armies will go farther, to the #G Dragon's Pass#!, and our people will build there again.'\n\nHe crowned himself. For a moment the hall was silent. Then the men who had fought to get him there began to cheer."
me_duggmannrum_27.a: "#E #G Long Live the King!#!#!"
me_duggmannrum_27_tooltip: "The mission task '#Y $03_duggmannrum_task_22$#!' has now been #G Completed#!!"

me_duggmannrum_28_title: "A Shocking Discovery"
me_duggmannrum_28_desc: "The search beneath #Y Veddtunn#! had gone on for weeks before a party found a chamber behind a hidden door. They were gathered around a thick red book when [GetCharacter('(int32)77').GetFirstName|Y] came down to see what they had found.\n\nInside was the family record and the imperial seal of #Y Hefdarr#!, lost for centuries and exceedingly difficult to copy. The king read the passage again. His father had sent him to find his place in the line of #Y Duggmoggen#!. There it was, in ink."
me_duggmannrum_28.a: "The throne... it's my birthright!"



duggmannrum_lineage_treasure: "Ancestral Records of the Duggmoggen Family"
duggmannrum_lineage_treasure_desc: "Containing the imperial seal of the legendary #Y Hefdarr#! #Y Duggmoggen#!, this hidden archive records the family history of the #Y Duggmoggen#! clan from its inception to #Y Hefdarr's#! secret descendents."





