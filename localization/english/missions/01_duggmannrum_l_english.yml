l_english:

03_duggmannrum: "Heirs of Srrørum"
03_duggmannrum_DESCRIPTION: "The great kingdom of [GetCountry('SV3').GetName] is in mourning, as the wise king #E [GetCharacter('(int32)87').GetFirstName]#! now rests with his ancestors in the great #E Silver Caves#!. His extensive rule oversaw the slow conquest and integration of the lands surrounding [GetProvince('(int32)3883')GetName|E], finally reuniting the former lands of the historic principality of #E Duggmannri#!, creating a new power in the #E Green Valley#!. With its large population and historical significance as the core of the #E Second Kingdom of Srrørum#!, most in the valley expected the kingdom to make a bid for reunification.\n\nIt was this fear that drove the other nations to form coalition after coalition to try and stifle the potential of this rising rival. Instead of retaliating, the wise  #E [GetCharacter('(int32)87').GetFirstName]#! spent the rest of his reign devoted to making diplomatic connections and defending his territory, slowly building up his kingdom and reputation. Near the end of his rule, the former members of the latest coalition, exhausted from years of war, signed the great #E Eternal Peace#! meant to end all hostilities in the valley. While there continues to be raids and skirmishes along isolated borders, the effectiveness of this treaty has stood as perhaps the greatest accomplishment of the former king.\n\nOn his deathbed, the old royal called for his only son, #E [ROOT.GetCountry.GetRuler.GetFirstName]#!. Nobody knows what was said in that room, but what emerged from the King's chamber was not the scared young prince that had entered. His visage now resembled that of a man determined to follow a king's dying wish.\n\nOnce crowned, #E [ROOT.GetCountry.GetRuler.GetFirstName]#! made his intentions clear to the court: he alone would be the one to unite the #E Anvindr#! under his banner.\n"
03_duggmannrum_CRITERIA_DESCRIPTION: "This mission will be completed when [ROOT.GetCountry.GetName] has restored #E [GetCharacter('(int32)76').GetFirstName]'s#! kingdom."
03_duggmannrum_BUTTON_TOOLTIP: "Let us reforge #E [GetCharacter('(int32)76').GetFirstName]'s#! kingdom!"

#Missions 
####ARMY
03_duggmannrum_task_1: "Preparing for War"
03_duggmannrum_task_1_DESC: "Before #E [ROOT.GetCountry.GetRuler.GetFirstName]#! can begin his conquest of the valley, he needs information on his opponents as well as time to consolidate his own armies. Utilizing the diplomatic connections established during his father's reign, #E [ROOT.GetCountry.GetRuler.GetFirstName]#! sends spies to report on the state of the other realms of the #E Green Valley#!.\n\nMeanwhile at home, the young king begins to mobilize his forces and kingdom for a grand total war against the other nations."

03_duggmannrum_task_2: "Breaking the Peace"
03_duggmannrum_task_2_DESC: "#E [GetCharacter('(int32)88').GetFirstName]#! may be young, but he is a perceptive ruler. Based on the reports from his spies he knows that other nations are plotting against him, so to survive he must introduce an element of chaos to stifle any attempts at cooperation.\n\nFully prepared for war, the King sends out his messengers to every independent nation in the #E Green Valley#! to announce his march on [GetCountry('SV6')GetName|E], breaking the #E Eternal Peace#! created by the late king #E [GetCharacter('(int32)87').GetFirstName]#!. With this move, the #E [GetCharacter('(int32)88').GetFirstName]#! intends on exploiting the disunited nature of the six nations to divide and conquer."

03_duggmannrum_task_3: "Negotiate with the Order"
03_duggmannrum_task_3_DESC: "While our superior army is able to take on any other foe easily, the [GetCountry('SV1').GetName] presents a more formidable challenge.\n\nUsing the key he found in #E Veddtunn#!, #E [ROOT.GetCountry.GetRuler.GetFirstName]#! is confident in his ability to negotiate with the knights."

03_duggmannrum_task_4: "Conquering the Brewers"
03_duggmannrum_task_4_DESC: "Starting our conquests in the east, we must subjugate the brewers of [GetCountry('SV6').GetName] if we have any hope of reaching the #G Eastern Gate#!. Their rich markets and flavorful beer will fuel our economy and our soldier's bellies."

03_duggmannrum_task_5: "Subjugating the Scholars"
03_duggmannrum_task_5_DESC: "The scholars of [GetCountry('SV5').GetName] will be a tricky opponent to face. However, our sovereign realizes the importance of innovation in this changing world, and their services and records will be needed for his future ambitions."

03_duggmannrum_task_6: "Crushing the Traitors"
03_duggmannrum_task_6_DESC: "The infamous Droi are now one of the last obstacles in our path. Ancient enemies of #E King Hefdarr 'to Togg'#!, they are hated by all in the #E Green Valley#!. Therefore, their conquest is necessary to eliminate all threats to our power, and will be a unifying feat for our new subjects to participate in."

03_duggmannrum_task_7: "Controlling the Eastern Gate"
03_duggmannrum_task_7_DESC: "To protect our exposed eastern flank against elvish marauders we must bring the #E Guardians of the Eastern Gate#! into our growing realm. Their important soul gem mine of [GetProvince('(int32)4075').GetName] might also be important to our nation's development."

03_duggmannrum_task_8: "Consolidating the Valley"
03_duggmannrum_task_8_DESC: "Our conquests have generated a lot of chaos and migrations, we should take this time to consolidate our hold over the #E Green Valley#! and secure our position."

####REFORMS
03_duggmannrum_task_9: "Hefdarr's Lessons"
03_duggmannrum_task_9_DESC: "A scholar himself, [ROOT.GetCountry.GetRuler.GetName] hopes to learn from #E Hefdarr#!'s success during the #E Unification Wars#! and implement his policies. This includes enacting numerous meritocratic reforms that will ensure the loyalty and competency of his generals and administrators."

03_duggmannrum_task_10: "Integrating the Sennmöggen"
03_duggmannrum_task_10_DESC: "The #E Sennmöggen Knights#! are universally hailed as the best quality troops in the valley. Now that we have secured their loyalty we should choose whether to implement them into our armies as leaders or use them as elite guardsmen."

03_duggmannrum_task_11: "The Sennfernnen"
03_duggmannrum_task_11_DESC: "For nearly four hundred years the armies of the #E Green Valley#! have been employing the antiquated #E Sennjallurr#! devised by King #E Hefdarr#! himself. While the formation isn't bad, it has made warfare stale and tedious, halting #E [ROOT.GetCountry.GetRuler.GetFirstName]'s#! advance. \n\nNumerous brutal engagements like the #E Battle of Bárrlantpiath#! have given #E [ROOT.GetCountry.GetRuler.GetFirstName]#! and his generals enough experience to recognize the need for change and experiment with new tactics. After drilling their troops for hours in this new formation, #E [ROOT.GetCountry.GetRuler.GetFirstName]#! is finally ready to unveil the infamous #E Sennfernnen#! to the remaining kingdoms of the valley."

03_duggmannrum_task_12: "Invite Foreign Mages"
03_duggmannrum_task_12_DESC: "While scant few mages have existed in our highlands and in [GetProvince('(int32)3988').GetName] for centuries, the widespread distrust of mages in silver dwarven culture has caused the mage community in our nation to be relatively small and underdeveloped. To help grow our small community of ragtag mages, the King has sent diplomats to the great schools of the oppressed #E Humans#! of #E Soveneria#! to bring back mages willing to teach our young talent."

03_duggmannrum_task_13: "Expand Gerrbaen"
03_duggmannrum_task_13_DESC: "A powerful symbol of the King's authority, the #E Gerrbaen's#! capacity and scale have remained at the level of a small city. It is time to expand this wonder to be able to stand as a monument worthy of our great capital!"

03_duggmannrum_task_14: "The Sennkallen"
03_duggmannrum_task_14_DESC: "Traditional #E Anvindr#! armies rely on the core heavy infantry to push the enemy back while light cavalry and archers support the frontlines from the flanks. While this has worked to defend our lands for centuries, it has not been the best strategy for the wars of conquest #E [ROOT.GetCountry.GetRuler.GetFirstName]#! has been waging.\n\nWith the treasure the king has seized from enemy lands, #E [ROOT.GetCountry.GetRuler.GetFirstName]#! has expanded his small retinue of knights into multiple regiments of heavily armored cavalrymen riding heavily armored steeds. These #E Sennkallen#! will provide the offensive power #E [ROOT.GetCountry.GetRuler.GetFirstName]#! needs by smashing through the flanks of enemy armies and crushing their center."


#####DEVELOPMENT
03_duggmannrum_task_15: "Restore the Hthgart Brewery"
03_duggmannrum_task_15_DESC: "The once legendary #E Hthgart Brewery#! has spent nearly 100 years in decline, turning the once bustling markets of [GetProvince('(int32)3947').GetName] to shadow of its former self. It's time to honor #E Hlffstten#!'s legacy and rebuild his city and brewery."

03_duggmannrum_task_16: "Expand the Academies of Veddabi"
03_duggmannrum_task_16_DESC: "The academies and universities of [GetProvince('(int32)3988').GetName] have long served as the academic heart of the Anvindr. Now it is time to give them the proper funding they need to expand their operations and research."

03_duggmannrum_task_17: "Develop the Mines of Púkklantenath"
03_duggmannrum_task_17_DESC: "The mines of [GetProvince('(int32)4075').GetName] could become a valuable asset if we are able to use their untapped potential. By expanding them, we can supply our nation with a steady supply of #E soul gems#! which would be useful to the magical researchers of [GetProvince('(int32)3988').GetName]."

03_duggmannrum_task_18: "Promote Urbanization"
03_duggmannrum_task_18_DESC: "Our people have historically been rural, with herders living in our mountains and serfs working on large estates in the few plots of arable land in our valley. The main inhabitants of our cities have always been the wealthy nobility and the few merchants wealthy enough to live alongside them. However, to compete with the large cities of the outside world we must provide incentives for peasants to come and make our cities more productive!"

03_duggmannrum_task_19: "A Land of Plenty"
03_duggmannrum_task_19_DESC: "The #E Green Valley#!, despite its name, actually has a scarce amount of arable land. With our growing population comes a growing demand for more food, a demand that we must satisfy lest we face famine. Therefore the King has devised a program of state-funded farms to provide the food that our people need."
task_19_tt: "#Y All rural farmlands must have #E Farming Settlements#! and #E ten#! or more population#!"

03_duggmannrum_task_20: "Rebuilding Our Capital"
03_duggmannrum_task_20_DESC: "While [GetProvince('(int32)3883').GetName] has served well as the capital of a small kingdom, it no longer reflects the power that we now wield. To rebuild his capital into the seat of a dynasty worthy of being the successors to #E Hefdarr's#! Kingdom, #E [ROOT.GetCountry.GetRuler.GetFirstName]#! plans to import specialists from across the #E Green Valley#! to turn [GetProvince('(int32)3883').GetName] into a a city worthy of being named a #E Sørrborr#!!"

03_duggmannrum_task_21: "Building a Grand Palace"
03_duggmannrum_task_21_DESC: "Although the rebuilding efforts have yielded beautiful results, our great #E Sørrborr#! still lacks the crucial gem to elevate it to the capital of an empire.\n\nGathering the brightest architects and engineers from across his realm, #E ROOT.GetCountry.GetRuler.GetFirstName]#! prepares plans to build the most opulent palace in Silver Dwarven history to showcase his power and authority both abroad and at home."

03_duggmannrum_task_22: "The True King"
03_duggmannrum_task_22_DESC: "Now that he's unified, reformed, and strengthened his realm, [ROOT.GetCountry.GetRuler.GetName] plans to follow in the footsteps of #E Hefdarr#! and reveal his true ancestry, tying himself to a legacy that extends back to the #E Mythic Age#!!"


#Tooltips


#Modifiers
####CONQUEST
prepared_for_war_mod: "Prepared for War"
desc_prepared_for_war_mod: "Our soverign now has the knowledge and men needed to fight our enemies for control of the Green Valley!"
uni_war_mod: "Second Unification Wars"
desc_uni_war_mod: "Sparked by Hartbaltt's invasion of Jórrvetali, the Second Unification Wars was a period of time in which the states of the Green Valley battled each other over who would ultimately control all of the Anvindr."

##REFORM
meritocracy_mod: "Meritocracy"
desc_meritocracy_mod: "Just like King Hefdarr before him, Hartbaltt's reforms have ensured that his state is a meritocracy, allowing him to choose the best and brightest to help him run the nation."
sennfernnen_mod: "Sennfernnen"
desc_sennfernnen_mod: "Building off of the Sennjallurr, the Sennfernnen, or the 'Iron Squares', creates smaller units of 50 heavily armored pikemen that move across the battlefield semi-independently, protecting themselves from cavalry and allowing them to be more maneuverable than the previous Sennjallurr allowed them to be."
foreign_mages_mod: "Foreign Mages"
desc_foreign_mages_mod: "Dragkhan mages recieve some of the best education in the world besides human ones, by inviting some of them to the Veddabi universities we may be able to learn and utilize some of their knowledge!"
gerrbaen_expanded_mod: "Gerrbaen Expanded"
desc_gerrbaen_expanded_mod: "Gerrbaen is a large complex of public and private farms and gardens etched into the nearby Green Mountain from which the city of Gorrgerrabi was named after. Built much like the Verobaen farms of the Mythic Age, it grew to its largest extent in 645 LC, where it decayed in use until it was recently expanded to accomodate the Gorrgerrabi's growth."
sennkallen_mod: "Sennkallen"
desc_sennkallen_mod: "The Sennkallen are regiments of heavily armored cavalry very similar to Cataphracts of some human states, and can smash into lightly defended infantry and cavalry."
senn_officers_mod: "Sennmöggen Officers"
desc_senn_officers_mod: "The Order of Sennmöggen hosts some of the best trained knights in the valley. By using them as officers to inspire and lead our troops our army's quality will soar compared to our enemies!"
senn_guard_mod: "Sennmöggen Guards"
desc_senn_guard_mod: "Knights from the Order of Sennmöggen are loyal above all else. With these elite knights guarding our King, he is sure to be safe against nearly all threats!"


####DEVELOPMENT
restored_brewery_mod: "Hthgart Brewery Restored"
desc_restored_brewery_mod: "Due to rumored disputes with his sons, the legendary founder of Htgath Brewery, Hlffsten, buried his secrets with him when he died in 954 LC, leading the brewery to fall into a decline. However, with some investment, its operations were once again expanded and its name spread to all corners of the Green Valley."
expanded_academy_mod: "Expanded Academies"
desc_expanded_academies_mod: "The 'City of Knowledge', Veddabi, hosts numerous universities and academies, and young nobles from across the Green Valley are often sent there to learn about the ancient classics, mathematics, sciences, and the limited amount of magical knowledge available. By expanding their operations, we can offer higher education to more than just the richest aristocratic families in our realm!"
expanded_mines_mod: "The Mines of Púkklantenath"
desc_expanded_mines_mod: "The mines of Púkklantenath are known as the 'Demon Lands', since the Soul Gems found there often emit a powerful aura that unnerves the stereotypically suspicious and magiphobic Silver Dwarves of the area."
state_funded_farms_mod: "Redistributed Lands"
desc_state_funded_farms_mod: "Hartbaltt's land reforms have given farmlands to local farmers to own and work, with the hope that they would be more productive than neighboring serfs."
palace_mod: "Hartbaltt's Palace"
desc_palace_mod: "The most famous building in the neo-Hefdarric style, Hartbaltt's Palace tries to imitate certain aspects of Hefdaric architecture while innovating with aspects of post-Hefdaric and even Dragkhanic. It's slightly fortified and it sits outside the city walls, looming over the capital as a symbol of the young King's power."
sorrborr_mod: "Sørrborr"
desc_sorrborr_mod: "Sørrborr is a title reserved for the very few cities in the Silver Dwarven world which achieve the status of a true Metropolis, housing grand projects, infrastructure, monuments, and trading centers."

restored_kingdom_mod: "Restored Kingdom"
desc_restored_kingdom_mod: "After centuries of division, our realm alone has unified our people! Thus, granting our sovereign the privilege of connecting our state to an ancient legacy stretching back to the Mythic Age!"


 

#Treasures


#Events
me_duggmannrum_1_title: "$03_duggmannrum_task_1$"
me_duggmannrum_1_desc: "It has been over a year since the death of the former king, yet #E [GetCharacter('(int32)88').GetFirstName]#! still remembers his final conversation with his late father:\n\n'#Y My son, I have done all I can for you. My time approaches soon.#!'\n\nTears ran down the young prince's cheeks. The old man was so frail his words could be mistaken for mumbled whispers.\n\n'#G I'm not ready father. I would be lost without your guidance.#!'\n\n#E [GetCharacter('(int32)87').GetFirstName]#! looked over at his son. Although even the young man himself saw a terrified boy not ready for the responsibilities of a king, the shrewd old man saw what he could become.\n\n'#Y Foolish boy, are you not the scholar you claim to be? All the guidance you need has been preserved in the tomes written by your ancestors.#!'\n\n#E [GetCharacter('(int32)88').GetFirstName]#! wiped his eyes and chuckled. No matter how old he grew his father would still scold him as if he were a child.\n\n'#G Is that why you were always so fixated on conquering #E Veddtunn#!#!?'\n\nThe old man paused, lost in thought. Puzzled,  #E [GetCharacter('(int32)88').GetFirstName]#! studied his father's face as it made an expression he had never seen before. After a moment of contemplation, #E [GetCharacter('(int32)87').GetFirstName]#! spoke:\n\n'#Y #E Veddtunn#! holds the key my son. The key to reunifying the valley.#!'\n\n'#G How so? There aren't many military manuals we don't already possess here-#!'\n\n'#Y Deep within the secret rooms of the ancient tower resides a record, one that may grant you the legitimacy you need to rule it all...#!'\n\n'#G Rule it all? Father, if you couldn't do it what makes you think-#!'\n\n#E [GetCharacter('(int32)87').GetFirstName]#! raised his hand to silence his son's protests. After a brief pause, the old man uttered his final words.\n\n'#Y Go to #E Veddtunn#! and reclaim your birthright. Use the gifts I have left you to reconquer the Silver Kingdom, and go beyond the Western Door. This I ask of you, because I know only you can do it.#!'\n\n...\n\nAlthough its been kept a strict secret to not arouse suspicion, everyone at court knows what #E [GetCharacter('(int32)88').GetFirstName]'s#! ambitions are. With excellent information on his enemies and his nation ready to march alongside him, it is time for the entire #E Green Valley#! to learn what kind of king #E [GetCharacter('(int32)88').GetFirstName]#! intends to be."
me_duggmannrum_1.a: "Prepare the messengers!"
me_duggmannrum_1_tooltip: "The mission task '#Y $03_duggmannrum_task_1$#!' has now been #G Completed#!!"

me_duggmannrum_2_title: "The Invasion"
me_duggmannrum_2_desc: "The same scene repeats in every nation.\n\nDisplays of outrage, disbelief, and panic were soon replaced with a concealed smile that revealed their true colors. In truth, the rulers of the six nations did not wait for this day with baited breaths, but with wanton anticipation. Every nation had unresolved conflicts and grudges, some dating back centuries, that they intended to settle on the battlefield. Every nation hoped and dreamed for the opportunity to expand their reach over the #E Green Valley#!. Every nation shared the same first though when they heard #E [GetCharacter('(int32)88').GetFirstName]'s#! messengers announce his invasion of [GetCountry('SV6').GetName]:\n\n'Now's my chance!'\n\nBut none of them are #E [GetCharacter('(int32)88').GetFirstName]#!. The young king's ambitions combined with the strength of the nation left to him by his father fuel confidence in his cause and enthusiasm in the ranks.\n\nThese fools know nothing of what's to come, let our armies teach them what it means to wage war!"
me_duggmannrum_2.a: "We shall march until the #E Green Valley#! is ours"
me_duggmannrum_2_tooltip: "The mission task '#Y $03_duggmannrum_task_2$#!' has now been #G Completed#!!"

me_duggmannrum_3_title: "The Second Unification Wars"
me_duggmannrum_3_desc: "After centuries of war, the heirs of #E Srrørum#! have been whittled down to a mere six nations from the hundreds that have been lost to history. While nobody truly expected the #E Eternal Peace#! to last, there were those that hoped it would lead to a more peaceful reunification or a state of coexistence between the remaining realms. Since the fateful invasion of [GetCountry('SV6').GetName], these misguided beliefs have been crushed.\n\nAlthough many small skirmishes and raids had occurred across isolated frontiers during the peace, there hasn't been a true battle in the #E Green Valley#! in over two decades. The armies of the #E Anvindr#! are filled with young men unexperienced with the horrors of war and eager for glory, and their leaders are equally as blinded by their personal greed to avoid falling into another period of endless war.\n\nHopefully, this period of war won't be just another footnote in the long history of conflicts in the #E Green Valley#!, and instead be the final great conflict that ends the centuries of division that have claimed the lives of hundreds of thousands of #E Silver Dwarves#! across the valley.\n\nThe most optimistic of the #E Anvindr#!, namely the officers in the army of [GetCountry('SV3').GetName] are calling these conflicts the #E Second Unification Wars#! in a callback to the conquests of the legendary King #E Hefdarr#!. Let us hope that they are correct in assuming this will be the last the #E Anvindr#! see of total war in the #E Green Valley#!."
me_duggmannrum_3.a: "We shall unite the #E Green Valley#! under our banner!"

me_duggmannrum_4_title: "Meeting with the Order"
me_duggmannrum_4_desc: "When a messenger arrived asking for an audience with #E [GetCharacter('(int32)89').GetFirstName]#! with on behalf of the young king of [GetCountry('SV3').GetName], the #E Srrøbondi#! was hesitant to accept his request. This was the same belligerent man who had trampled what peace there was in the valley with his volatile actions.\n\n#E [GetCharacter('(int32)89').GetFirstName]#! agrees to the meeting, and sends the messenger back to his king with the good news. Whatever #E [GetCharacter('(int32)88').GetFirstName]'s#! motives may be, this meeting would serve as an excellent opportunity for the ambitious #E Srrøbondi#! to finally get involved in the politics of the #E Green Valley#!. Having sworn themselves to the defense of the #E Silver Caves#! and the #E Duggmoggen Clan#!, the knights of the #E Order of Sennmoggen#! consider involving themselves in the affairs of other nations a taboo ever since the death of their patron and the final #E Duggmoggen#!, King #E Hefdarr#!. If #E [GetCharacter('(int32)89').GetFirstName]#! can persuade the other senior members of the order that #E [GetCharacter('(int32)88').GetFirstName]#! poses a significant threat to the sacred #E Silver Caves#!, he might be able to mobilize the knights to carve out his own kingdom.\n\n#E [GetCharacter('(int32)89').GetFirstName]'s#! eyebrows furrow, what was the young king doing?\n\nHe was expecting a boisterous tyrant who would demand the knights submit to him, not the relatively soft-spoken young man kneeling in front of him. Kneeling in front of the leader of another nation? Whatever his aims were, #E [GetCharacter('(int32)88').GetFirstName]#! had certainly captured the attention of the #E Srrøbondi#!. The knight let out a hearty laugh.\n\n'#Y Hail fellow, it is good to meet you young #E [GetCharacter('(int32)88').GetFirstName]#!! Whatever it is you're here for I guarantee you won't find it on your knees.#!'\n\nMuffled snickers and whispers surrounded the chamber. The young king, however, looked unphased.\n\n'#G I came looking for a sword.#!'\n\n'#Y A sword?#!'\n\n'#G Yes, every great King needs a sword to both protect him and attack his enemies. I am told that you and your knights are the finest warriors in the valley, and so I came to ask you to be my sword.#!'\n\n#E [GetCharacter('(int32)89').GetFirstName]#! scoffs. What a ridiculous request! Is this just the enigmatic man's way of asking his order to submit to his nation?\n\n'#Y Humor me, o great king. Why should we?#!'\n\n#E [GetCharacter('(int32)88').GetFirstName]#! looked around the room. It was not yet time.\n\n'#Y Perhaps I may convince you over dinner?#!'\n\nAmused, the #E Srrøbondi#! chuckled.\n\n#G Of course, you must be weary from your journey after all. I assure you we have enough chairs that you need not kneel for this meal.#!'\n\n...\n\nLater that night, long after the merriment and laughs that accompanied tonight's meal, the two men conversed alone in the #E Srrøbondi's#! office.\n\n'#G Thank you again for the meal, Srrøbondi#!'\n\n'#Y Please, call me #E [GetCharacter('(int32)89').GetFirstName]#!. I should be the one thanking you for being an excellent guest. I much enjoyed the stories about your time in [GetProvince('(int32)3947')GetName|E]#!'\n\n'#G The only thing those merchants love more than coins is beer, I can guarantee you that!#!'\n\nThe two men shared a laugh, which #E [GetCharacter('(int32)88').GetFirstName]#! soon followed with a question:\n\n'#G Have you thought of my request?#!'\n\nA brief look of confusion flashed across #E [GetCharacter('(int32)89').GetFirstName]'s#! face, followed by one of recognition.\n\n'#Y Young King, I believe you have yet to convince me to give up our sovereignty#!'\n\n#E [GetCharacter('(int32)88').GetFirstName]#! frowned,\n\n'#G It's not an annexation if that's what you thought I was offering. It'd be more akin to an alliance. You lend me you armies and I protect you lands from the western nations.#!'\n\n'#Y What would we have to gain from an alliance with you? You're reputation would suggest you don't do well with treaties#!'\n\n#E [GetCharacter('(int32)88').GetFirstName]#! winced. The #E Srrøbondi#! wasn't wrong. It seemed that the only way to convince him would be appeal to the Order's oaths. The King called in one of his servants and brought out a large red book, presenting it to #E [GetCharacter('(int32)89').GetFirstName]#!.\n\n'#Y What is this?#!'\n\n'#G An argument, for the alliance#!'\n\nConfused, #E [GetCharacter('(int32)89').GetFirstName]#! opened the book, and began to read."
me_duggmannrum_4.a: "I hope the #E Srrøbondi#! can recognize my birthright"
me_duggmannrum_4_tooltip: "The mission task '#Y $03_duggmannrum_task_3$#!' has now been #G Completed#!!"

me_duggmannrum_5_title: "Negotiations with the King"
me_duggmannrum_5_desc: "When a messenger arrived asking for an audience with #E [GetCharacter('(int32)89').GetFirstName]#! with on behalf of the young king of [GetCountry('SV3').GetName], the #E Srrøbondi#! was hesitant to accept his request. This was the same belligerent man who had trampled what peace there was in the valley with his volatile actions.\n\n#E [GetCharacter('(int32)89').GetFirstName]#! agrees to the meeting, and sends the messenger back to his king with the good news. Whatever #E [GetCharacter('(int32)88').GetFirstName]'s#! motives may be, this meeting would serve as an excellent opportunity for the ambitious #E Srrøbondi#! to finally get involved in the politics of the #E Green Valley#!. Having sworn themselves to the defense of the #E Silver Caves#! and the #E Duggmoggen Clan#!, the knights of the #E Order of Sennmoggen#! consider involving themselves in the affairs of other nations a taboo ever since the death of their patron and the final #E Duggmoggen#!, King #E Hefdarr#!. If #E [GetCharacter('(int32)89').GetFirstName]#! can persuade the other senior members of the order that #E [GetCharacter('(int32)88').GetFirstName]#! poses a significant threat to the sacred #E Silver Caves#!, he might be able to mobilize the knights to carve out his own kingdom.\n\n#E [GetCharacter('(int32)89').GetFirstName]'s#! eyebrows furrow, what was the young king doing?\n\nHe was expecting a boisterous tyrant who would demand the knights submit to him, not the relatively soft-spoken young man kneeling in front of him. Kneeling in front of the leader of another nation? Whatever his aims were, #E [GetCharacter('(int32)88').GetFirstName]#! had certainly captured the attention of the #E Srrøbondi#!. The knight let out a hearty laugh.\n\n'#Y Hail fellow, it is good to meet you young #E [GetCharacter('(int32)88').GetFirstName]#!! Whatever it is you're here for I guarantee you won't find it on your knees.#!'\n\nMuffled snickers and whispers surrounded the chamber. The young king, however, looked unphased.\n\n'#G I came looking for a sword.#!'\n\n'#Y A sword?#!'\n\n'#G Yes, every great King needs a sword to both protect him and attack his enemies. I am told that you and your knights are the finest warriors in the valley, and so I came to ask you to be my sword.#!'\n\n#E [GetCharacter('(int32)89').GetFirstName]#! scoffs. What a ridiculous request! Is this just the enigmatic man's way of asking his order to submit to his nation?\n\n'#Y Humor me, o great king. Why should we?#!'\n\n#E [GetCharacter('(int32)88').GetFirstName]#! looked around the room. It was not yet time.\n\n'#Y Perhaps I may convince you over dinner?#!'\n\nAmused, the #E Srrøbondi#! chuckled.\n\n#G Of course, you must be weary from your journey after all. I assure you we have enough chairs that you need not kneel for this meal.#!'\n\n...\n\nLater that night, long after the merriment and laughs that accompanied tonight's meal, the two men conversed alone in the #E Srrøbondi's#! office.\n\n'#G Thank you again for the meal, Srrøbondi#!'\n\n'#Y Please, call me #E [GetCharacter('(int32)89').GetFirstName]#!. I should be the one thanking you for being an excellent guest. I much enjoyed the stories about your time in [GetProvince('(int32)3947')GetName|E]#!'\n\n'#G The only thing those merchants love more than coins is beer, I can guarantee you that!#!'\n\nThe two men shared a laugh, which #E [GetCharacter('(int32)88').GetFirstName]#! soon followed with a question:\n\n'#G Have you thought of my request?#!'\n\nA brief look of confusion flashed across #E [GetCharacter('(int32)89').GetFirstName]'s#! face, followed by one of recognition.\n\n'#Y Young King, I believe you have yet to convince me to give up our sovereignty#!'\n\n#E [GetCharacter('(int32)88').GetFirstName]#! frowned,\n\n'#G It's not an annexation if that's what you thought I was offering. It'd be more akin to an alliance. You lend me you armies and I protect you lands from the western nations.#!'\n\n'#Y What would we have to gain from an alliance with you? You're reputation would suggest you don't do well with treaties#!'\n\n#E [GetCharacter('(int32)88').GetFirstName]#! winced. The #E Srrøbondi#! wasn't wrong. It seemed that the only way to convince him would be appeal to the Order's oaths. The King called in one of his servants and brought out a large red book, presenting it to #E [GetCharacter('(int32)89').GetFirstName]#!.\n\n'#Y What is this?#!'\n\n'#G An argument, for the alliance#!'\n\nConfused, #E [GetCharacter('(int32)89').GetFirstName]#! opened the book, and began to read."
me_duggmannrum_5.a: "The Order will grant the #E True King#! our strength"
me_duggmannrum_5.b: "The records must be a fake!"

me_duggmannrum_6_title: "Meeting with the Order: Success"
me_duggmannrum_6_desc: "After a few tense weeks, the people rejoice when [ROOT.GetCountry.GetRuler.GetName] returns to [GetProvince('(int32)3883').GetName] triumphant!\n\nThe King holds a grand feast will all his nobles and several of the Knights that accompanied him home to celebrate his friendship with his new vassal, Grandmaster [GetCountry('SV1').GetRuler.GetName] of the Sennmöggen!"
me_duggmannrum_6.a: "Excellent!"

me_duggmannrum_7_title: "Meeting with the Order: Failure"
me_duggmannrum_7_desc: "Leaving the #E Grand Master#!'s Castle, the young King flies into a fit of rage.\n\n'He defies me and doubts my lineage? I will force him to recognize me as the true king.'"
me_duggmannrum_7.a: "Let us show the Sennmöggen the might of the True King!"

me_duggmannrum_8_title: "$03_duggmannrum_task_4$"
me_duggmannrum_8_desc: "A relatively new kingdom based on an ancient practice, #E Jórrvetali#! was founded by the merchant council of [GetProvince('(int32)3947').GetName], an ancient city with roots dating back to the #E Mythic Age#!. In fact, legends say that back when the majestic city was but a small settlement a pair of brothers were the first in #E Omniluxia#! to discover a magical drink popular amongst all dwarves: #E Beer#!!\n\nIn the last century, the city has become famous for its expansive merchant districts and innumerable taverns that serve every kind of alcohol known to dwarvenkind. Famously, #E Hthgart the Brewer#! founded his famous brewery in the city nearly a century ago. Credited with inventing fifty new types of ales, the brewery's claim to fame was its delicious #E Hthgart Ale#!, said to be the greatest beer in all of #E Omniluxia#!.\n\nSince the great brewer's death the city has been in decline, as numerous wars and bad investments have taken their toll on the infrastructure and people. Under our rule, we will use their position as the mercantile heart of the #E Green Valley#! to restore the great merchant city to its former glory!"
me_duggmannrum_8.a: "I'll drink to that!"
me_duggmannrum_8_tooltip: "The mission task '#Y $03_duggmannrum_task_4$#!' has now been #G Completed#!!"

me_duggmannrum_9_title: "Entering the Labyrinth"
me_duggmannrum_9_desc: "Fulfilling his dying father's wish, young #E [GetCharacter('(int32)88').GetName]#! has finally taken the ancient library of #E Veddtunn#!!\n\nSaid to contain information on nearly every topic known to the #E Silver Dwarves#!, the tower itself hides many secret tombs from curious scholars within its labyrinthian corridors and chambers. So vast is the library and its catacombs that it is not uncommon to hear stories of new chambers being rediscovered with the bones of long-dead scribes.\n\nAccompanied by a retinue of his loyal guard and with only a small note left by his father to guide him, #E [GetCharacter('(int32)88').GetName]#! begins his descent into the catacombs in search of the ancient treasure that is the key to the unification of the #E Green Valley#!."
me_duggmannrum_9.a: "Let's try not to run into any cobwebs"
me_duggmannrum_9_tooltip: "The mission task '#Y $03_duggmannrum_task_5$#!' has now been #G Completed#!!"

me_duggmannrum_10_title: "$03_duggmannrum_task_6$"
me_duggmannrum_10_desc: "Ever since Duke #E Harttol 'to Ommor'#!s treachery and defeat at the #E Battle of Driorum#! during the #E Great Zanni Invasion#! all of the Anvindr have despised the Droi who followed their leader against the Defender of the #E Green Valley#!, King #E Hefdarr#!. Isolated and hostile to the all of the realms of the valley, their subjugation both removed an obstacle to our rule and served as a rallying cry for our subjects.\n\nAs the saying goes:"
me_duggmannrum_10.a: "A dwarf neither forgives nor forgets"
me_duggmannrum_10_tooltip: "The mission task '#Y $03_duggmannrum_task_6$#!' has now been #G Completed#!!"

me_duggmannrum_11_title: "$03_duggmannrum_task_7$"
me_duggmannrum_11_desc: "The Defenders of the #G Eastern Gate#!, the #E Khundavli#!, are strong fighters that carry on the legacy of the great #E Ulffgrdd 'to Jallurr'#!.\n\nThrough decisive victory alone we have bested them, thus, to honor their spirit we must carry on this title and take on the mantle of Defenders of the #G Eastern Gate#!!"
me_duggmannrum_11.a: "Let us safeguard Ulffgrdd's legacy!"
me_duggmannrum_11_tooltip: "The mission task '#Y $03_duggmannrum_task_7$#!' has now been #G Completed#!!"

me_duggmannrum_12_title: "$03_duggmannrum_task_8$"
me_duggmannrum_12_desc: "With our conquest of the #E Green Valley#! completed, [ROOT.GetCountry.GetRuler.GetName] can now focus on maintaining stability in his realm.\n\nImitating the great #E King Hefdarr#!, [ROOT.GetCountry.GetRuler.GetName] tours his new realm, giving generous donations to the peasantry and assuring the loyalty of the local nobility.\n\nThrough his journeys, his hold over the #E Green Valley#! strengthens. His Kingdom finally stable and at peace, he intends to rebuild the realm in his image!"
me_duggmannrum_12.a: "Peace at last!"
me_duggmannrum_12_tooltip: "The mission task '#Y $03_duggmannrum_task_8$#!' has now been #G Completed#!!"

me_duggmannrum_13_title: "$03_duggmannrum_task_9$"
me_duggmannrum_13_desc: "With access to the brightest and most ambitious young talent in his kingdom, [ROOT.GetCountry.GetRuler.GetName] can put these loyal new men to work managing the realm and his campaigns!"
me_duggmannrum_13.a: "Another step towards the restoration of Srrørum!"
me_duggmannrum_13_tooltip: "The mission task '#Y $03_duggmannrum_task_9$#!' has now been #G Completed#!!"

me_duggmannrum_14_title: "Integrating the Order"
me_duggmannrum_14_desc: "It's a stormy evening when the King meets with the Grand Master of the #E Sennmöggen#! a second time.\n\n[GetCharacter('(int32)89').GetName] kneels upon greeting his liege, acknowledging the young king's power, rising when [ROOT.GetCountry.GetRuler.GetName] commands it.\n\nDue to the ongoing conflicts, the meeting is brief, and formalities are skipped. The King only has one goal: to add the #E Sennmöggen#! as an asset to assist him in his wars.\n\nAfter discussing the matter with the #E Grand Master#!, the King declares that:"
me_duggmannrum_14.a: "'The Sennmöggen will lead my armies'"
me_duggmannrum_14.b: "'The Sennmöggen will be my personal guard'"
me_duggmannrum_14_tooltip: "The mission task '#Y $03_duggmannrum_task_10$#!' has now been #G Completed#!!"

me_duggmannrum_15_title: "The Grand Master Joins the Court"
me_duggmannrum_15_desc: "It's a warm summer evening when the King is surprised by the arrival of his favorite vassal at his court. After greeting him warmly, both men sit and feast together as the dining hall is filled with cries of joy and celebration. After the meal, the Grand Master stands up to make an announcement. After years of working closely with his sovereign, he has decided to officially cede the lands of the #E Order#! to the King, and join his court as his chief military advisor to be able to fully support his dream of restoring #E Srrørum#!. A brief silence is followed by a great roar of approval, and the two men spend the rest of the evening laughing and celebrating the arrival of 'to Sath'."
me_duggmannrum_15.a: "Wonderful!"

me_duggmannrum_16_title: "$03_duggmannrum_task_11$"
me_duggmannrum_16_desc: "Following pyhrric victories such as the #E Battle of Bárrlantpiath#!, King [ROOT.GetCountry.GetRuler.GetName] and his generals have been experimenting with new tactics to replace the outdated #E Sennjallurr#!.\n\nWhile the old tactic was effective due to it's simplicity, it wasn't maneuverable enough to allow for an overwhelming victory. In this environment, the #E Sennfernnen#! was born.\n\nThe '#E Iron Squares#!' splits the army into smaller units of fifty heavily armored pikemen that move across the battlefield semi-autonomously, protecting themselves from cavalry and giving them more maneuverability than the stiff #E Sennjallurr#!.\n\nDrilling his armies in this new formation, [ROOT.GetCountry.GetRuler.GetName] was able to win crushing victories such as the #E Battle of Driorum#!."
me_duggmannrum_16.a: "Genius!"
me_duggmannrum_16_tooltip: "The mission task '#Y $03_duggmannrum_task_11$#!' has now been #G Completed#!!"

me_duggmannrum_17_title: "$03_duggmannrum_task_12$"
me_duggmannrum_17_desc: "While the #E Anvindr#! have been historically suspicious of magic for good reason, King [ROOT.GetCountry.GetRuler.GetName] recognizes their worth in both battle and at his court.\n\nThe dragkhanic [GetCountry('SOV').GetName] has some of the most advanced magical schools in all of #E Omniluxia.#! Ensuring good relations with this powerful state while importing many of their ambitious young mages will help kickstart the development of our own magical research and corps."
me_duggmannrum_17.a: "Let us hope these Dragkhans cause no trouble..."
me_duggmannrum_17_tooltip: "The mission task '#Y $03_duggmannrum_task_12$#!' has now been #G Completed#!!"

me_duggmannrum_18_title: "$03_duggmannrum_task_13$"
me_duggmannrum_18_desc: "The #E Gerrbaen#! is a large complex of farms and gardens etched into the nearby #E Green Hills#! that give [GetProvince('(int32)3883').GetName] its name. Construction began under #E King Hefdarr#!, and the wonder was finally completed under his successor. Having fallen somewhat into disrepair during the last few centuries, its revitalization under [ROOT.GetCountry.GetRuler.GetName] has restored it to it's intended majesty! Alongside it's existing impressive structures, newer expansions have been added to ensure [ROOT.GetCountry.GetRuler.GetName]'s influence is felt on such an important monument.\n\nAtop the mighty hill stands the #E Konungien#!, or royal gardens, a space restricted to the royal family of [GetProvince('(int32)3883').GetName]. The few groundskeepers who have seen it report seeing exotic animals, and even wilder accounts say that the king keeps wild #E Fai#! as his pets.\n\nThe remainder of the monument is enjoyed by both nobles and commoners, and seend as a symbol of the power and generosity of the kings of [GetCountry('SV3').GetName]."
me_duggmannrum_18.a: "Glorious!"
me_duggmannrum_18_tooltip: "The mission task '#Y $03_duggmannrum_task_13$#!' has now been #G Completed#!!"

me_duggmannrum_19_title: "$03_duggmannrum_task_14$"
me_duggmannrum_19_desc: "Feared armored knights, many soldiers flee once they catch a glimpse of the silver masks of the #E Sennkallen#!!\n\nStaffed mostly by nobles, this heavy cavalry contingent helped end the #E Second Unification Wars#! as it crushed most cavalry pitted against it. These #E Iron Horsemen#! were crucial in winning later battles such as the #E Battle of Púkklantenath#!, as they decisively won the day by smashed into enemy flanks!"
me_duggmannrum_19.a: "Let the Iron Horsemen ride!"
me_duggmannrum_19_tooltip: "The mission task '#Y $03_duggmannrum_task_14$#!' has now been #G Completed#!!"

me_duggmannrum_20_title: "$03_duggmannrum_task_15$"
me_duggmannrum_20_desc: "[ROOT.GetCountry.GetRuler.GetName] looks over the rejuvenated [GetProvince('(int32)3947').GetName] from his royal camp on a nearby hill.\n\nThe markets and bars buzz with activity as carts filled with goods from across his realm flood into the reborn city. At the center of it all stands the great #E Htgarth Brewery#!, its once-dormant chimneys now filling the air with smoke and a sweet aroma.\n\nThe King smiles as he beckons for his entourage to follow him into town."
me_duggmannrum_20.a: "Drinks on me!"
me_duggmannrum_20_tooltip: "The mission task '#Y $03_duggmannrum_task_15$#!' has now been #G Completed#!!"

me_duggmannrum_21_title: "$03_duggmannrum_task_16$"
me_duggmannrum_21_desc: "The '#E City of Scholars#!' hosts large academies, forums, and villas surrounding the mighty #E Veddtunn#!, a library containing knowledge stretching back to the #E Mythic Age#!! The newest additions to this great library have scholars from across the #E Green Valley#! migrating to the #E Ringed City#! in search of knowledge and ancient treasures.\n\nA scholar himself, [ROOT.GetCountry.GetRuler.GetName] encourages the nobles of his realm to send their sons to be educated at the academies of the #E 'City of Knowledge'#!.\n\n'After all', he says, 'a great statesmen should also be a great philosopher.'"
me_duggmannrum_21.a: "Books, books, and more books!"
me_duggmannrum_21_tooltip: "The mission task '#Y $03_duggmannrum_task_16$#!' has now been #G Completed#!!"

me_duggmannrum_22_title: "$03_duggmannrum_task_17$"
me_duggmannrum_22_desc: "For years the scholars of [GetProvince('(int32)3988').GetName] have tried in vain to obtain the soul gems of [GetProvince('(int32)4075').GetName] for magical research. Constantly repulsed by the hostile #E Khundavli#!, most gave up on the endeavor and abandoned what little magical research was available in the valley.\n\nWith the acquisition of both territories, these same scholars are now free study these esoteric gems for the benefit of our kingdom!"
me_duggmannrum_22.a: "You say there are souls in these gems?"
me_duggmannrum_22_tooltip: "The mission task '#Y $03_duggmannrum_task_17$#!' has now been #G Completed#!!"

me_duggmannrum_23_title: "$03_duggmannrum_task_18$"
me_duggmannrum_23_desc: "Serfdom has historically been the backbone of our realms, with most of our population living in rural villages or manor estates. However, this system does not fit in the #E Srrørum#! imagined by [ROOT.GetCountry.GetRuler.GetName].\n\nHe argues that if the #E Silver Dwarves#! are to compete with the stories of the grand cities of the #E #R Zanni#!#!, our people must recreate the sprawling urban centers of the #E First Kingdom of Srrørum#!. With the influx of serfs comes the increased available labor and merchants to fuel our local economies and workshops, bringing riches to our realm.\n\nAlongside this migration comes a somewhat more sinister goal. The movement of these people breaks down their traditional familial ties and ends cycles of violence, while slowly etching at the powerbase of powerful landed nobility. If these urbanization trends continue, [ROOT.GetCountry.GetRuler.GetName] could find himself ruling as the absolute monarch of a kingdom reminiscent of the #E First Kingdom of Srrørum#!!"
me_duggmannrum_23.a: "Let the great cities of the valley rise!"
me_duggmannrum_23_tooltip: "The mission task '#Y $03_duggmannrum_task_18$#!' has now been #G Completed#!!"

me_duggmannrum_24_title: "$03_duggmannrum_task_19$"
me_duggmannrum_24_desc: "An unseen side effect of the recent urbanization are the growing demands to feed the growing populations of the cities and make up for the depleting workforce of the rural farmlands.\n\n[ROOT.GetCountry.GetRuler.GetName] seeing the need to feed his people, has had to redistribute lands to local farmers and providing them with more funding to increase their crop yields. While this does come at a great expense to our kingdom, these new farmers will act as the backbone of our urbanization."
me_duggmannrum_24.a: "Ours is a people of the soil"
me_duggmannrum_24_tooltip: "The mission task '#Y $03_duggmannrum_task_19$#!' has now been #G Completed#!!"

me_duggmannrum_25_title: "$03_duggmannrum_task_20$"
me_duggmannrum_25_desc: "Busy streets and markets buzz as the King's entourage travel through the city. Wealth once unimaginable to the common people now exists in abundance, as the aroma of fresh bread and hot iron fill the morning air. The new market district of the city is so expansive that new merchants flood the streets everyday, and the bazaars constantly bustle with activity.\n\nNearby the large stone temple districts coincide with the housing districts, and freemen freely interact with monks as they pay a visit to the local shrines.\n\nHigher in the hills the nobility live in larger mansions brimming with luxuries unimaginable only a few years ago. During the night the city glows as street lights cast a warm inviting glow to any visitors wandering the nearby mountains.\n\nOnce closer to a small hamlet, our city has now become a true #E Sørrborr#!, a #E Great City#! of the #E Silver Dwarven#! world! All that remains is a finishing touch."
me_duggmannrum_25.a: "One last step..."
me_duggmannrum_25_tooltip: "The mission task '#Y $03_duggmannrum_task_20$#!' has now been #G Completed#!!"

me_duggmannrum_26_title: "$03_duggmannrum_task_21$"
me_duggmannrum_26_desc: "'Beautiful', gasps the King.\n\n The grand palace of his royal majesty [ROOT.GetCountry.GetRuler.GetName] now stands completed, overlooking the great #E Sørrborr#! of [GetProvince('(int32)3883').GetName], the finishing piece to a beautiful tapestry.\n\nBuilt in the #E neo-Hefdarric#! style, the palace complex features more than a thousand five-hundred rooms filled with elaborate paintings, unique designs, and grand statues of ancient #E Silver Dwarven#! heroes. The various dining areas host live musicians, who entertain guests that feast with the great king.\n\nOutside the palace is a road that leads directly to Konungien, elaboratly decorated with all mannor of well-kept flowers and hedges.\n\nIntended as symbol of power to his nobility, the finished result certainly delivers what was promised to [ROOT.GetCountry.GetRuler.GetName]. With this final step, the king feels prepared to declare the restoration of the #E Kingdom of the Silver Dwarves#!!"
me_duggmannrum_26.a: "A powerful symbol of a powerful King!"
me_duggmannrum_26_tooltip: "The mission task '#Y $03_duggmannrum_task_21$#!' has now been #G Completed#!!"

me_duggmannrum_27_title: "The True King"
me_duggmannrum_27_desc: "Looking over his prosperous realm, King [ROOT.GetCountry.GetRuler.GetName] is finally prepared to announce the restoration of an ancient legacy. He holds a grand celebration in his capital that lasts five days, culminating in a coronation ceremony in his new palace at [GetProvince('(int32)3883').GetName]. However, before [GetCharacter('(int32)89').GetName] can place the crown atop his head, the King motions for him to give him the crown, which he takes and holds above his head. As the crowd murmurs, he proclaims:\n\n'When I donn on this crown I cast off my previous identity as [ROOT.GetCountry.GetRuler.GetName] and claim my true heritage:'\n\n'I am #E Hefdarr II#!, lost descendant of the #E House of Duggmöggen#! and the true and rightful King of the #E Third Kingdom of Srrørum#!, a realm that expands from the Western Door to the Silver Caves!'\n\n'My armies will march across mountains, forests, and deserts until my people once again extend from the #E Green Valley#! to the #E Dragon's Pass#!! Our cities will be grand and our coffers full, and I will bring the Silver Dwarves into a Golden Age of prosperity unseen since the #E Mythic Age#!!'\n\nAs silence dominates the great hall, #E Hefdarr II#! places the crown atop his own head and sits on his throne. Shouts break the silence, cheering"
me_duggmannrum_27.a: "#E #G Long Live the King!#!#!"
me_duggmannrum_27_tooltip: "The mission task '#Y $03_duggmannrum_task_22$#!' has now been #G Completed#!!"

me_duggmannrum_28_title: "A Shocking Discovery"
me_duggmannrum_28_desc: "Weeks of consistent expeditions into the catacombs have bore no fruit, and doubt begins to sprout in the mind of the young king.\n\n'#G What was he even looking for?#!'\n\n'#G How does he even know this would help unify the valley?#!'\n\n'#G How does he know this even exists?#!'\n\n'#G What if my father was wrong?#!'\n\n#E [GetCharacter('(int32)88').GetFirstName]#! pauses for a second, shocked he would lose faith so easily in a man who spent his life ensuring his son would succeed. The relic must be close, the only question remains is: what is it?\n\n'#Y Sire, we've found something!#!'\n\nIntrigued, #E [GetCharacter('(int32)88').GetFirstName]#! follows the man through a small crack his men created through a hidden doorway, entering a small chamber with a handful of tomes. Inside, his men are all looking through a thick red book, murmuring anxiously.\n\nUpon seeing their king they bow and give him some space to inspect their find. On the outside the book is nothing special despite being in surprisingly good condition for an older tome. #E [GetCharacter('(int32)88').GetFirstName]#! opens the book and begins to read.\n\n'#G This cannot be...#!', he mutters. His eyes examine the page as if looking for something to verify his suspicions.\n\nThis was it, the key. The secret his father hid from him, or rather, the rumor he had believed in all his life. Although it could be a fake, the book contained the imperial seal of the legendary #E Hefdarr#! himself, a symbol nearly impossible to replicate as the item was lost centuries ago. Reading through the book again confirmed it for him, #E [GetCharacter('(int32)88').GetFirstName]#! was a descendent of the mythical king himself."
me_duggmannrum_28.a: "The throne... it's my birthright!"



duggmannrum_lineage_treasure: "Ancestral Records of the Duggmoggen Family"
duggmannrum_lineage_treasure_desc: "Containing the imperial seal of the legendary Hefdarr Duggmoggen, this hidden archive records the family history of the Duggmoggen clan from its inception to Hefdarr's secret descendents."





