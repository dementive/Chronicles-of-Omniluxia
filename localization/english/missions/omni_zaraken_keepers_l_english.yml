l_english:
 zaraken_custodial_monarchy:0 "Custodial Monarchy"
 zaraken_custodial_monarchy_desc:0 "The Keepers hold the Tomb of Jaoz and the roads by which pilgrims reach it, and they settle what may be charged at the gates. The crown used to dispute the last of these. Its letters on the matter are still kept in good order."
 zaraken_custodial_monarchy_ruler:0 "Elder Keeper"
 zaraken_custodial_monarchy_ruler_female:0 "Elder Keeper"
 elder_keeper_trait:0 "Elder Keeper"
 elder_keeper_trait_desc:0 "The Elder Keeper inherits the keys of the tomb, the seal of the realm, and a list of repairs that could not be undertaken in the late Elder's lifetime. The seal is in better condition than the roof."
 me_zaraken.148.b:0 "Give me the Elder's seal. The marshal can keep his."
 me_zaraken.148.b.tt:0 "Continue playing as the #Y Keepers of the Tomb#! in the ongoing civil war against the Zarakens. We will command their lands and armies of the Keepers under a #Y Custodial Monarchy#!, and the Zaraken crown will pass to AI control. Win the war to pursue #Y $03_zaraken_task_18$#! from the Keeper side."
 03_zaraken_task_18_DESC_keepers:0 "The watch at #G Kyaxares#! has hung the Elder's orders beside the old muster roll, and the district captains who have come to swear have asked which of the two they should bring to the coronation. Both, says the clerk, since the new seal will have to answer for arrears under the old one. Raise Kyaxares to a metropolis and bring all five districts to peace under the Elder's rule, so the delegates can witness the crown of the #Y Neo-Zaraken Empire#!."
 03_zaraken_t18_keeper_victory_tt:0 "Win the civil war as the #Y Keepers of the Tomb#!."
 03_zaraken_t18_keeper_rewards_tt:0 "Keep the #Y Custodial Monarchy#! and pass the #Y Elder Keeper#! office and trait to each succeeding ruler. Adopt the #Y $zaraken_jaoz_heritage$#! and gain #Y Oaths at the Coronation#! (+0.02 monthly provincial loyalty)."
 me_zaraken.3.desc_keepers:0 "The Keeper of the Tomb brought the keys to the coronation in the same bag he had carried through the war, and the herald asked him to take them out before the delegates came forward. The captains laid their old warrants beside the keys, since some of the men still on the rolls had been paid by the crown and others by the tomb. The Elder heard each captain in turn and ordered the clerk to reckon both sums. The men had stood their watches either way.\n\nWhen the herald read out the title of the #Y Neo-Zaraken Empire#!, the delegates asked where the next Elder would receive the seal. At the tomb, said the clerk, who had already written it down. He had left the name blank, but the roads and the watches were entered in full."
