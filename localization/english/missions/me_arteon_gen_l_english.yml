l_english:
 me_arteon_gen.1.t: "Battle-Tested Warriors"
 me_arteon_gen.1.desc: "#G Arteon#! does not grant peace — it grants survivors. [ROOT.GetCountry.GetRuler.GetName|Y] stands before the assembled warriors of the realm, their battle-scarred faces a testament to generations of warfare on this blood-soaked shore.\n\nNo great speech is given. None is needed. The drums of war have never stopped beating here. What matters now is whether those who answer them are ready for what comes next - they are."
 me_arteon_gen.1.a: "We were born ready"
 me_arteon_gen.2.t: "Mercenary Contracts"
 me_arteon_gen.2.desc: "From taverns of distant ports and war camps of foreign kingdoms, sellswords and spear-for-hire pour into [ROOT.GetCountry.GetCapital.GetName|Y]. Coin has a language all its own, and [ROOT.GetCountry.GetRuler.GetName|Y] speaks it fluently. With mercenary bands now under contract, [ROOT.GetCountry.GetAdjective] forces gain the strength of warriors who have fought in a dozen different wars — men who care little for the politics of #Y Arteon#!, but everything for gold."
 me_arteon_gen.2.a: "We buy today what we cannot yet breed."
 me_arteon_gen.3.t: "Slaver Defenses"
 me_arteon_gen.3.desc: "For too long, the black sails of the #R Great Slaver Navies#! have darkened the coastlines of #Y Arteon#!, leaving burned villages and empty homes in their wake. [ROOT.GetCountry.GetRuler.GetName|Y] has ordered the construction of coastal watchtowers, hardened harbors, and a standing fleet to meet any raiders before they reach our shores. Let them come. They will find no easy prey here."
 me_arteon_gen.3.a: "Our coasts are ours to defend."
 me_arteon_gen.4.t: "Our Homeland"
 me_arteon_gen.4.desc: "One of the first carters from the neighboring district had to leave his wagon in the yard at [ROOT.GetCountry.GetCapital.GetName|Y] while the keeper looked for somewhere dry to unload it. The carter had brought the village's harvest tally under his coat, and when the keeper saw how many loads were still coming, he sent for the stewards of the towns around the capital.\n\nThey found room in lofts that had stood empty since the roads grew unsafe, and the carpenters have already replaced the boards that went soft. The keepers can now tell the villages which doors will be open when their carts arrive, so more grain reaches a dry bin and there is room to keep it through the lean months."
 me_arteon_gen.4.a: "Have the keepers take in the grain."
 me_arteon_gen.15.t: "The Artheousan Claim"
 me_arteon_gen.15.desc: "The highland priests of #T Artheous#! have long spoken of a day when a true heir would emerge from the chaos of the #R Isle of Eternal War#!. As [ROOT.GetCountry.GetRuler.GetName|Y] accepts the sacred rites before the assembled faithful, a silence falls over the crowd — one that carries the weight of generations of suffering and endurance. The #T Artheousan#! claim to this island is not merely political. It is written in blood and in the will of the war god himself."
 me_arteon_gen.15.a: "Artheous marches with us."
 me_arteon_gen.16.t: "The Ascendic Path"
 me_arteon_gen.16.desc: "The #Y High Elven#! creed of #G Ascendance#! holds that mastery of the self precedes mastery of others. [ROOT.GetCountry.GetRuler.GetName|Y] has long meditated upon this principle, and emerged from contemplation with a clarity of purpose that unsettles even the closest advisors. The #R Isle of Eternal War#! is not a problem to be solved with brute force alone. It is a puzzle that yields to patience, philosophy, and the measured application of power."
 me_arteon_gen.16.a: "We rise above the chaos."
 me_arteon_gen.17.t: "Viktreic Omostthanat"
 me_arteon_gen.17.desc: "The banners of [ROOT.GetCountry.GetName|Y] are raised in the name of [GetDeityDefinition('omen_viza').GetName|G]! [ROOT.GetCountry.GetRuler.GetName|Y], burning with divine conviction, has called upon the faithful to take up arms in a holy Omostthanat. The sermons spread through our camps like wildfire: #Y Arteon#! must be consecrated in the name of the victory goddess, and every unbeliever is an enemy of the divine order. Let the #R Isle of Eternal War#! become the #T Isle of Sacred Victory#!."
 me_arteon_gen.17.a: "For [GetDeityDefinition('omen_viza').GetName|G] and glory!"
 me_arteon_gen.18.t: "Conquer The South"
 me_arteon_gen.18.desc: "The armies of #T Artheous#! have descended from the highland passes with a fury that matches the war god's own legend. #Y City#! by city, the south of #Y Arteon#! has been brought to heel beneath the #T Artheousan#! banner. Our enemies burned their bridges and prayed to foreign gods as they fled — but #T Artheous#! was already waiting for them on the far bank. The south is ours. Let the invaders take note."
 me_arteon_gen.18.a: "The war god is pleased."
 me_arteon_gen.19.t: "Exploit Feuds On Arteon"
 me_arteon_gen.19.desc: "While lesser rulers reach for the sword as a first resort, [ROOT.GetCountry.GetRuler.GetName|Y] has reached instead for the quill, the sealed letter, and the well-placed whisper. The feuding factions of #Y Arteon#! — their hatreds ancient, their grudges deep — have been carefully played against one another. Alliances that should have held have crumbled. Walls that should have stood have opened from within. The island devours itself, and we grow stronger from the feast."
 me_arteon_gen.19.a: "Patience is the sharpest blade."
 me_arteon_gen.20.t: "Funding The Faithful"
 me_arteon_gen.20.desc: "The coffers of the faithful overflow. Trade routes bring precious metals into our temples, and the priests of [GetDeityDefinition('omen_viza').GetName|G] ensure that not a coin is wasted on frivolity. Our holy wars demand fuel, and the merchants of [ROOT.GetCountry.GetCapital.GetName|Y] have answered the call with surprising eagerness — for gold blessed in the name of the victory goddess is gold doubly spent."
 me_arteon_gen.20.a: "The faithful shall want for nothing."
 me_arteon_gen.21.t: "Purge The Invaders"
 me_arteon_gen.21.desc: "A roar rises from ten thousand #T Artheousan#! throats as the last of the coastal invaders are driven into the sea. [ROOT.GetCountry.GetRuler.GetName|Y] stands upon the bluffs where the #T First Great War#! began, looking out at the retreating sails. The wounds of that ancient conflict are not healed — they never fully are — but today they have been answered. The gods of the highlands do not forget insults. Neither do their chosen."
 me_arteon_gen.21.a: "Drive them from our shores forever."
 me_arteon_gen.22.t: "Purge The Viza Abominations"
 me_arteon_gen.22.desc: "The zealots of [GetDeityDefinition('omen_viza').GetName|G] had long screamed their battle-prayers from the shrines of #Y Eastern Arteon#!, hurling fanatical armies against any who would not bow to their goddess. Now their shrines are silent. [ROOT.GetCountry.GetRuler.GetName|Y] has personally overseen the purging of the eastern coast, stripping the holy sites of their power and scattering the faithful. A quiet settles over the east that it has not known in living memory."
 me_arteon_gen.22.a: "The madness ends here."
 me_arteon_gen.23.t: "Light Of Viza"
 me_arteon_gen.23.desc: "[GetDeityDefinition('omen_viza').GetName|G] has sent a sign. The priests say so, and the fires in the great temple of [ROOT.GetCountry.GetCapital.GetName|Y] blaze with a light that no wind can extinguish. Worshippers of the victory goddess crowd every street of the capital. The fervor of the faithful is not merely spiritual — it is a weapon, sharpened on the whetstone of absolute belief. [ROOT.GetCountry.GetRuler.GetName|Y] stands in the inner sanctum, and for a moment, [ROOT.GetCountry.GetRuler.GetSheHe] feels the goddess's eyes upon [ROOT.GetCountry.GetRuler.GetHerHim]."
 me_arteon_gen.23.a: "We walk in divine light."
 me_arteon_gen.24.t: "The First Great War Avenged"
 me_arteon_gen.24.desc: "They say that on the day the #T First Great War#! ended, the survivors wept not from relief but from exhaustion — there were not enough of them left to feel joy. [ROOT.GetCountry.GetRuler.GetName|Y] has carried that grief to the west and repaid it in full. The banners of [ROOT.GetCountry.GetAdjective] enemies no longer fly over the hills where the ancestors of this people fell. The #R Isle of Eternal War#! has not known peace — but it has, at last, known justice."
 me_arteon_gen.24.a: "Our ancestors can rest."
 me_arteon_gen.25.t: "High Elven Supremacy"
 me_arteon_gen.25.desc: "The eastern clerks have taken rooms in [ROOT.GetCountry.GetCapital.GetName|Y], and the families who came with them have begun asking which households will stand surety for theirs. The #Y High Elven#! masters who called them here have set a day for the first hearings, when the towns will learn what the new rolls require of them.\n\nThe captains ask to be heard after the petitioners. They have brought toll receipts from the northern roads and want to know how many men the eastern towns can send when the summons comes."
 me_arteon_gen.25.a: "Call the eastern towns to their hearings."
 me_arteon_gen.26.t: "Divine Judgment"
 me_arteon_gen.26.desc: "The first wagons sent by the wardens reached #Y Malasam#! before dark, and the companies that took the district had set guards at the doors of a storehouse for them. One of the wagoners had made the crossing the year before and remembered paying for the right to unload at the same doors.\n\nThe priest who blessed the wagons asks to send a runner back to the temple of [GetDeityDefinition('omen_viza').GetName|G]. The captains have given him a second message for the wardens. They have somewhere to lay in provisions, and they will need the next wagons before they can take the road again."
 me_arteon_gen.26.a: "Send word to the wardens."
 me_arteon_gen.9.t: "[ROOT.GetCountry.Custom('get_arteon_generic_task_9_name')]"
 me_arteon_gen.9.desc: "The smiths brought the finished blade to the hall while the clerks were still copying the rolls from the North. A carter who had once kept every receipt for the northern tolls asked for a place where he could see it, and the captain at the door let him stand beside the men who had brought the rolls in.\n\nWhen [ROOT.GetCountry.GetRuler.GetName|Y] took the sword, the clerks asked where the heralds should carry their writs next. Some of the carter's old receipts were for roads that still lead to another lord's hall."
 me_arteon_gen.9.a: "Enter the blade and the rolls in our keeping."
 me_arteon_gen.10.t: "Rebuild The Cities"
 me_arteon_gen.10.desc: "The hammers of peace ring out across #Y Arteon#! for the first time in memory. Workers fill the cracked streets that armies once claimed, laying fresh stone over old blood. [ROOT.GetCountry.GetRuler.GetName|Y] walks through a city that was rubble not long ago and sees in it not what it was, but what it shall be. The #R Isle of Eternal War#! has been many things to many peoples. Today, for just a moment, it is something almost beautiful."
 me_arteon_gen.10.a: "Build it stronger than before."
 me_arteon_gen.11.t: "Grand Navy"
 me_arteon_gen.11.desc: "The harbor masters have posted the new watch at the quays, and the pilots who used to wait for a clear horizon now ask which escort will see them out. One shipwright has chalked his yard's mark beside every vessel his apprentices helped launch, and the youngest has already gone down to the water to count them.\n\nThe merchants have asked for regular days to sail, so their carts can come in when the convoy is ready to leave. The captains have agreed to hear them once the watch at the mouth of the harbor has been assigned."
 me_arteon_gen.11.a: "Post the convoy days at the quays."
 me_arteon_gen.12.t: "Fortify The Capital"
 me_arteon_gen.12.desc: "#Y Stone#! does not lie. The walls that now ring [ROOT.GetCountry.GetCapital.GetName|Y] speak plainly to any who contemplate treachery or invasion: you will not pass. [ROOT.GetCountry.GetRuler.GetName|Y] has invested not merely in height and thickness, but in the full apparatus of a defended capital — garrisons, supply lines, courts of law, and the administrative centers that will keep the realm functioning even in the worst of sieges. Come what may."
 me_arteon_gen.12.a: "Let them come. We are ready."
 me_arteon_gen.13.t: "Lasting Peace"
 me_arteon_gen.13.desc: "The last shore sent its rolls to [ROOT.GetCountry.GetCapital.GetName|Y] with a clerk who knew which dues had already been paid. While the keepers opened the other bundles, he found three villages entered on two rolls under different names.\n\nThe garrison captains have signed off on the walls and the city elders have finished their repairs. The clerks can now enter the capital among the island's great cities and issue a single account of what each shore owes."
 me_arteon_gen.13.a: "Seal the rolls of all four shores."
 me_arteon_gen.14.t: "United Arteon"
 me_arteon_gen.14.desc: "For as long as history has been written, #Y Arteon#! has been a wound — a place where civilizations went to bleed, where armies rose and fell with the seasons, where no faction held the whole for more than a generation. Now, for the first time since the ancients drew breath, the island stands united beneath a single sovereign. [ROOT.GetCountry.GetRuler.GetName|Y] accepts the Crown of #T Arteon#! not with ceremony and celebration, but with the quiet gravity of one who truly understands what it cost to reach this moment. The #R Isle of Eternal War#! has a new name today. Let the world learn it."
 me_arteon_gen.14.a: "Long live [ROOT.GetCountry.GetName|Y]!"
 me_arteon_gen.27.t: "The Blood-Drinker Ascendant"
 me_arteon_gen.27.desc: "#R Blood Drinker#! has tasted the hand of its chosen lord, [ROOT.GetCountry.GetRuler.GetName|Y], and the [ROOT.GetCountry.GetRulerTitle] of [ROOT.GetCountry.GetName|Y] has used its unholy powers to destroy the other vampires on #Y Arteon#! in one fell swoop.\n\nA #R Vampiric Council#! had been called by [ROOT.GetCountry.GetRuler.GetFirstName|Y], and [ROOT.GetCountry.GetRuler.GetHerHis] foolish vampiric kinsmen came freely of their own accords to their deaths. One by one, they were each and every one of them slain by the mighty [ROOT.GetCountry.GetRuler.GetFirstName|Y], who seized their realms and power in a display of ultimate authority."
 me_arteon_gen.27.a: "There can be only one vampire on Arteon!"
 me_arteon_gen.27_tt: "Every other #R Vampire#! ruling on the island of #Y Arteon#! has been #R Killed#! by our Ruler, and we have conquered their former territories."
 me_arteon_gen_eptelon.1.t: "Eptelonian Warriors"
 me_arteon_gen_eptelon.1.desc:0 "Our envoys spent the season in the hill villages around [GetProvince('(int32)653').GetName|Y], and they came home with the name of every chief who resents the harbor masters. The city still shelters the captains who raid our coasts, but its farms and fishing towns no longer believe it can protect them.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] has laid claim to the lands around the port. Several Eptelonian captains have offered to drill our light infantry in the hill tactics they use to hold the narrow roads."
 me_arteon_gen_eptelon.1.a: "Eptelon will serve us well."
 me_arteon_gen_eptelon.2.t: "Expeditionary Force"
 me_arteon_gen_eptelon.2.desc: "A fleet of transports escorts a force of heavy infantry and archers across the narrow strait, their banners catching the sea wind. [ROOT.GetCountry.GetRuler.GetName|Y] has committed both coin and ships to the subjugation of #Y Eptelon#!, and the assembled officers know there is no half-measure here. The island must be seized. Its defenders are fierce, but they are divided — and [ROOT.GetCountry.GetAdjective] commanders know how to exploit a divided enemy."
 me_arteon_gen_eptelon.2.a: "The expedition sets out. May fortune favor us."
 me_arteon_gen_eptelon.3.t: "Refugee Labor"
 me_arteon_gen_eptelon.3.desc: "In the wake of the #Y Eptelonian#! campaigns, streams of displaced peoples have made their way to [ROOT.GetCountry.GetCapital.GetName|Y] — some fleeing war, others driven from their homes by our advancing armies. [ROOT.GetCountry.GetRuler.GetName|Y] has seen to it that this flow of humanity does not go to waste. Put to work in mines, workshops, and fields, the labor of the displaced will fund the next phase of expansion."
 me_arteon_gen_eptelon.3.a: "Every war produces its survivors. We will use them."
 me_arteon_gen_arth.1.t: "The Fang Of Arteon"
 me_arteon_gen_arth.1.desc: "The priests of #T Artheous#! had spoken of the #T Fang#! in hushed, reverent tones for generations — a relic said to have been carried by the first #T Artheousan#! war-king, a blade that would mark its bearer as the chosen of the war god. Whether the legend is true or merely useful, [ROOT.GetCountry.GetRuler.GetName|Y] now holds the #T Fang#! in hand. The weight of it feels different from other blades. The warriors who witness it fall silent. Sometimes, the legend is the point."
 me_arteon_gen_arth.1.a: "Let all of Arteon see what we carry."
 me_arteon_gen_arth.2.t: "Horteonian Auxiliaries"
 me_arteon_gen_arth.2.desc:0 "The #Y Horteonian#! chieftains came down from [GetProvince('(int32)410').GetName|Y] and [GetProvince('(int32)425').GetName|Y] to hear what [ROOT.GetCountry.GetAdjective] rule would ask of their people, and they brought their own bread, because they did not yet trust our hospitality. They have worked other men's fields and fought other men's wars for generations, and they wanted to know which of the two we had in mind.\n\nOur captains want the young men under our standards, where their endurance would serve the war for the west. The stewards of the northern farms would rather settle whole families on the fields our wars have emptied, where they would pay dues and raise sons who think of [ROOT.GetCountry.GetCapital.GetName|Y] as their own."
 me_arteon_gen_arth.2.a:0 "Enlist them under our standards."

 # Home ladder, iron, old faiths, Atheus, route finales (2026-11-09)
 me_arteon_gen.30.t:0 "The Boundary Stones"
 me_arteon_gen.30.desc:0 "The elders of the home valleys came to [ROOT.GetCountry.GetCapital.GetName|Y] with their boundary rolls, and for the first time in living memory none of them had to ask a foreign lord's leave to make the journey. Each brought a story of a field or a spring that the neighboring chiefs had taken in a bad year, and by the end of the council the scribes had written down more lost pasture than the valleys could ever have grazed.\n\nThe war captains want those rolls read aloud on the borders with the levies standing behind the readers, because a claim pressed now will cost less blood than one pressed after the neighbors have built their walls. The stewards would rather send grain and cloth across the boundary and buy a few quiet years, while the younger chiefs say the quickest profit lies in the border villages themselves, where the herds are fat and nobody keeps a night watch."
 me_arteon_gen.30.a:0 "Read the rolls on the borders."
 me_arteon_gen.30.b:0 "Send gifts to the border chiefs."
 me_arteon_gen.30.c:0 "Raid the border villages."
 me_arteon_gen.31.t:0 "The Heartland United"
 me_arteon_gen.31.desc:0 "When the last hall in our home region sent its dues to [ROOT.GetCountry.GetCapital.GetName|Y], the clerks spent three days burning the old tally sticks that recorded what each valley owed to which chief. Merchants who once paid a toll at every ford now carry their goods to the capital on a single pass, and the drovers say the roads have not been this busy since their grandfathers' time.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] has ordered new granaries and courts for the capital so that the wealth of the heartland stays where it was gathered. The elders who once argued over boundary stones now argue over which of their sons will sit in those courts, and that is an argument the crown can afford."
 me_arteon_gen.31.a:0 "Build on what we hold."
 me_arteon_gen.32.t:0 "The Keepers' Road"
 me_arteon_gen.32.desc:0 "The keepers of the old shrines have walked from [ROOT.GetCountry.GetCapital.GetName|Y] to the edge of our lands, and at every crossroads they found villagers who still leave bread for gods the conquerors never bothered to name. The priests of the three great faiths call these people backward, but they have also learned how many of them stayed loyal to the old altars through every war on the island.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] must decide where the keepers go next, and our claims will follow them. The south has the largest villages and the busiest markets, the east lies under the zealots of [GetDeityDefinition('omen_viza').GetName|G], the west still remembers the #T First Great War#!, and the north belongs to dynasties that have outlived every faith on the island."
 me_arteon_gen.32.a:0 "Carry the shrines to the south."
 me_arteon_gen.32.b:0 "Carry the shrines to the east."
 me_arteon_gen.32.c:0 "Carry the shrines to the west."
 me_arteon_gen.32.d:0 "Carry the shrines to the north."
 me_arteon_gen.33.t:0 "The Old Gods Prevail"
 me_arteon_gen.33.desc:0 "The keepers have rekindled the hearths of shrines that stood cold for generations, and the villages of the shore we chose now bring their harvest offerings to priests who speak their own dialect. Traders returning to [ROOT.GetCountry.GetCapital.GetName|Y] report that the market days there have gone back to the old festival calendar, and nobody asked the crown's permission for it.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] has let the custom stand, because villages that keep their own feasts also keep their own watches. The captains have begun asking the keepers which northern roads the pilgrims use and where they put up for the night."
 me_arteon_gen.33.a:0 "Let the old fires burn."
 me_arteon_gen.34.t:0 "The Grave Of Atheus"
 me_arteon_gen.34.desc:0 "The sarcophagus of #T Atheus#! has rested in our treasury since it came into our hands, and the guards on that vault ask to be relieved more often than any others in [ROOT.GetCountry.GetCapital.GetName|Y]. The priests say the conqueror who started #Y Arteon#!'s long wars should not lie in a ruler's treasury as if he were an honored ancestor, and the oldest of them wants it broken in the square where the whole city can watch.\n\nThe war captains want it kept, because a conqueror's coffin in our hands tells every rival what became of the last man who tried to rule this island by force. The treasury clerks, meanwhile, have found merchants on the mainland who will pay well for the gold leaf and grave goods, provided nobody asks where they were dug up."
 me_arteon_gen.34.a:0 "Break it in the square."
 me_arteon_gen.34.b:0 "Keep it where our enemies can see it."
 me_arteon_gen.34.c:0 "Sell the grave goods."
 me_arteon_gen.35.t:0 "Open The Iron Hills"
 me_arteon_gen.35.desc:0 "The overseers have cut new galleries into the hills, and the ore carts now leave for [ROOT.GetCountry.GetCapital.GetName|Y] twice a day instead of once a week. The first loads went to the smiths who had waited longest, and by the end of the month they were turning away the same buyers who used to set the price.\n\nThe mine captains have asked [ROOT.GetCountry.GetRuler.GetName|Y] for more hands and more timber to shore up the deeper shafts, because the best seams run under ground that has not been worked since before the wars. For now the ore keeps coming, and the levies have noticed that their spearheads are no longer patched with other men's iron."
 me_arteon_gen.35.a:0 "Keep the carts moving."
 me_arteon_gen.36.t:0 "The Smiths' Charter"
 me_arteon_gen.36.desc:0 "The guild masters arrived at the palace with ledgers showing how much iron the market of [ROOT.GetCountry.GetCapital.GetName|Y] could sell to foreign ships at the summer fair, and they argued that a country with full markets can hire any army it needs. The war captains came the next morning with a list of cohorts still fighting in leather, and they argued that iron sold abroad comes back as spearheads pointed at us.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] cannot give both of them the charter, because whoever holds it will decide where each season's surplus goes. The guild would keep the forges busy for merchants and the captains would keep them busy for the armories, and whichever side loses has already promised to remember the decision."
 me_arteon_gen.36.a:0 "The guild holds the charter."
 me_arteon_gen.36.b:0 "The war captains hold the charter."
 me_arteon_gen.37.t:0 "Forges Of The Eternal War"
 me_arteon_gen.37.desc:0 "The forges of [ROOT.GetCountry.GetCapital.GetName|Y] now burn through the night, and the smoke has become so familiar that the farmers outside the walls use it to judge the wind. Every cohort that marches from the capital carries iron dug and worked under our banner, and the foreign merchants who once sold blades on #Y Arteon#! have started buying them from us instead.\n\nThe prospectors have followed the old seams into the quarries and found ore where the masons had only ever looked for building stone. [ROOT.GetCountry.GetRuler.GetName|Y] has sent miners after them, because on an island where war never quite ends, the country that makes the weapons decides who fights."
 me_arteon_gen.37.a:0 "Let the forges burn."
 me_arteon_gen.37_seam_tt:0 "A #Y Stone#! or #Y Base Metals#! territory of ours on #Y Arteon#! now produces #Y Iron#!."
 me_arteon_gen.14.desc_ascendic:0 "The #Y High Elven#! scholars who came to #Y Arteon#! as colonists and stayed as conquerors have finally seen the whole island answer to a single court, and they are already writing it into their histories as the completion of the work #T Atheus#! began. [ROOT.GetCountry.GetRuler.GetName|Y] received the Crown of #T Arteon#! in [ROOT.GetCountry.GetCapital.GetName|Y] from the oldest of the Ascendic masters, who had lived through more of the island's wars than any mortal in the hall.\n\nThe native chiefs who knelt that day did so because they had run out of other choices, and the court knows it. The new order will be judged by whether it outlasts the ruler who built it, which is the only test the Ascendic philosophy has ever recognized."
 me_arteon_gen.14.desc_two_altars:0 "The eastern elders who came to see the crown set on [ROOT.GetCountry.GetRuler.GetName|Y] asked to stand with the families from [GetProvince('(int32)662').GetName|Y]. One of them brought the copy of the shrine agreement that had hung by his ward's door, with a crease where the rain had got under the cord.\n\nWhen the herald asked which priests should be called forward, the families named the keepers of both altars. The eastern elder waited for the reading to finish, then took his copy to the clerk and asked for a fresh seal before he carried it home."
 me_arteon_gen.14.desc_viktreic:0 "The priests of [GetDeityDefinition('omen_viza').GetName|G] carried the Crown of #T Arteon#! through the streets of [ROOT.GetCountry.GetCapital.GetName|Y] before they set it on the head of [ROOT.GetCountry.GetRuler.GetName|Y], and the crowds that followed them sang the hymns that once announced each new holy war. For the first time in the island's history, the faith that taught its followers to conquer has nothing left on #Y Arteon#! to conquer.\n\nThe temple wardens are already arguing over what a holy war becomes once it has won. Some want the armies sent across the sea, while the older priests say the goddess has been answered and the island must now learn to live under her law."
 me_arteon_gen.14.desc_old_faith:0 "The keepers of the old shrines walked at the head of the procession that carried the Crown of #T Arteon#! into [ROOT.GetCountry.GetCapital.GetName|Y], and they lit the same fires their grandparents had lit before any of the three great faiths reached the island. [ROOT.GetCountry.GetRuler.GetName|Y] took the crown before altars the conquerors had called heathen, and the villages that kept those altars through every war sent more offerings that week than the treasury clerks could count.\n\nThe priests of the three great faiths still live on #Y Arteon#!, and none of them has agreed to bow. The crown will have to decide whether to leave them their temples, but it no longer needs their blessing to rule."
 me_arteon_gen_arth.2.b:0 "Settle them on the northern farms."

 # Heritage events (2026-11-09)
 me_arteon_gen.40.t:0 "The Floods Of The Myahud"
 me_arteon_gen.40.desc:0 "The headmen of the floodplain villages came to [ROOT.GetCountry.GetCapital.GetName|Y] carrying the marks they cut into the doorposts each spring, and the highest of them stood above a child's head. They want earth banks raised along the river at [GetProvince('(int32)881').GetName|Y], [GetProvince('(int32)966').GetName|Y] and [GetProvince('(int32)1013').GetName|Y], and the priests of [GetDeityDefinition('omen_fisa').GetName|G] have already blessed the baskets the diggers will carry.\n\nThe royal stewards would rather leave the river as it is. The silt the floods leave behind is what makes the fields around [GetProvince('(int32)888').GetName|Y] the richest on the island, and they warn that a dike which saves one village's harvest sends the water into the next one."
 me_arteon_gen.40.a:0 "Raise Fisa's dikes."
 me_arteon_gen.40.b:0 "Let the river keep its old bed."
 me_arteon_gen.41.t:0 "The Four Shrines Of Victory"
 me_arteon_gen.41.desc:0 "For the first time since the Zornakyan kings united the Myahudyan peoples, the shrines at [GetProvince('(int32)888').GetName|Y], [GetProvince('(int32)770').GetName|Y], [GetProvince('(int32)919').GetName|Y] and [GetProvince('(int32)1035').GetName|Y] answer to one crown, and their priests have come to [ROOT.GetCountry.GetCapital.GetName|Y] together. Each has brought gifts and petitions, and each has made sure to arrive before the others.\n\nThe priests of [GetDeityDefinition('omen_viza').GetName|G] ask for a war levy in the goddess's name, those of [GetDeityDefinition('omen_fisa').GetName|G] ask for seed grain and labor for the dikes, and the keepers of [GetDeityDefinition('omen_tuma').GetName|G]'s pendants ask for the caravan roads to be cleared of tolls. [ROOT.GetCountry.GetRuler.GetName|Y] can favor only one of them without insulting the other two."
 me_arteon_gen.41.a:0 "The crown carries the face of Viza."
 me_arteon_gen.41.b:0 "The crown carries the face of Fisa."
 me_arteon_gen.41.c:0 "The crown carries the face of Tuma."
 me_arteon_gen.42.t:0 "Ask Who Carries The Provisions"
 me_arteon_gen.42.desc:0 "Our clerks spent the season counting the families who haul grain and salt between the markets of the middle country, and they came back with more names than any lord has ever listed among his vassals. Most of those families have cousins in two or three jurisdictions, and many have been carrying for the same houses since before the last wars.\n\nThe treasury wants a toll on every pack train, which would pay for itself within a year. The carriers' elders ask instead for the right to keep the roads around [ROOT.GetCountry.GetCapital.GetName|Y] themselves, in exchange for keeping our armies fed wherever they march."
 me_arteon_gen.42.a:0 "Tax the carrier families."
 me_arteon_gen.42.b:0 "Grant them the road rights."
 me_arteon_gen.43.t:0 "Kin On Both Sides Of The Boundary"
 me_arteon_gen.43.desc:0 "A carrier family brought word from cousins in the villages across our border, where the lord has fallen behind on his dues and his people have stopped expecting him to protect them. The headmen there would open their gates to us if our silver pays what their lord owes, and they have sent the names of the gate wardens as proof.\n\nThe court is divided. Some want the land taken quietly now, others would rather marry into the headmen's families and wait, and the oldest steward suggests simply writing down every grievance the villagers have against their lord so that a claim will be ready when it is needed."
 me_arteon_gen.43.a:0 "Pay the gate wardens."
 me_arteon_gen.43.b:0 "Marry into their families."
 me_arteon_gen.43.c:0 "Write down their grievances."
 me_arteon_gen.44.t:0 "Guest-Right"
 me_arteon_gen.44.desc:0 "The elders of the western families met under the old oak at [ROOT.GetCountry.GetCapital.GetName|Y] and recited the roads on which each house can claim a bed and a meal, a list so long that the recital lasted until dusk. Every house on it has fed travelers through famine years, and every house expects the same in return.\n\nThe captains want guest-right written into the law of the realm, so that any column marching under our banner is fed wherever it stops. The elders would rather it stayed a family custom that the crown honors, because a law can be broken by a decree while a custom can only be broken by a family."
 me_arteon_gen.44.a:0 "Make it the law of the realm."
 me_arteon_gen.44.b:0 "Keep it a family custom."
 me_arteon_gen.45.t:0 "The Houses That Kept Faith"
 me_arteon_gen.45.desc:0 "The heads of the houses that stayed loyal through the wars came to [ROOT.GetCountry.GetCapital.GetName|Y] with their old banners, some so faded that the devices could no longer be read. Each of them remembers the lords who came and went, and each of them expects the crown to remember what their families gave.\n\nThe captains who won those wars want the honors for themselves, and the treasury points out that honors can also be sold. [ROOT.GetCountry.GetRuler.GetName|Y] must decide whose loyalty the realm will be built on."
 me_arteon_gen.45.a:0 "Confirm the old houses."
 me_arteon_gen.45.b:0 "Raise new houses from our captains."
 me_arteon_gen.45.c:0 "Sell the honors."
 me_arteon_gen.46.t:0 "Artheous Was A Man"
 me_arteon_gen.46.desc:0 "The new shrine in [ROOT.GetCountry.GetCapital.GetName|Y] shows #T Artheous#! as our ancestors taught, a man with a spear and a wound in his side, kneeling beside the goddess who helped him kill the Wyrms. Pilgrims have come from every northern valley to see it, and some of the southern traders who saw it have carried the news home.\n\nThe priests say the Elders of the south might accept the rite as a gift if it were sent to them, which would end a quarrel older than any living family. The northern clans would rather keep it, since it is the one thing the south has never been able to take from them."
 me_arteon_gen.46.a:0 "Send the rite south to the Elders."
 me_arteon_gen.46.b:0 "Keep the northern rite."
 me_arteon_gen.47.t:0 "The Cousins' Curse"
 me_arteon_gen.47.desc:0 "Our scouts came back from the mountain passes with the same story the shepherds have told for generations, of villages where nobody goes out after dark and of lords who are never seen at noon. The houses that swore the #R Unholy Pact#! are our own blood, and that makes their crimes our shame in the eyes of the rest of the island.\n\nThe captains want to march on the cursed keeps while our heavy infantry is ready. The older counselors remind [ROOT.GetCountry.GetRuler.GetName|Y] that those keeps have stood for centuries, and that a truce with the cousins would keep their raids away from our valleys while we finish other wars."
 me_arteon_gen.47.a:0 "Break with the cursed cousins."
 me_arteon_gen.47.b:0 "Shelter under their walls."
 me_arteon_gen.48.t:0 "Word From Heskoh"
 me_arteon_gen.48.desc:0 "The squadron returned from [GetCountry('UPL').GetName|Y] with letters, gifts, and a handful of passengers whose grandparents fled the north after the #T First Great War#!. They speak our dialect with a strange accent, and they still keep the northern rite in their homes.\n\nMore families would come if we sent ships for them, and the merchants of [GetCountry('UPL').GetName|Y] would gladly trade with a country that remembers them. [ROOT.GetCountry.GetRuler.GetName|Y] can bring the exiles home or keep the sea road open for trade."
 me_arteon_gen.48.a:0 "Bring the exiles' grandchildren home."
 me_arteon_gen.48.b:0 "Keep the sea road open."
 me_arteon_gen.49.t:0 "The Cousins' Oath"
 me_arteon_gen.49.desc:0 "The crypt beneath our keep was opened for the first time in a generation, and the heirs of the other two houses came down into it after sunset with the same silver bowl their ancestors used. Each of them knows what the oath has given our families, and each of them knows what it has cost our subjects.\n\nRenewing it would bind the three houses to keep their wars away from one another for another generation. Letting it lapse would leave [ROOT.GetCountry.GetRuler.GetName|Y] free to take what the cousins hold, and the cousins free to try the same."
 me_arteon_gen.49.a:0 "Renew the oath."
 me_arteon_gen.49.b:0 "Let the oath lapse."
 me_arteon_gen.50.t:0 "The Lord Who Gave The Gift"
 me_arteon_gen.50.desc:0 "Our agents spent half a year following the oldest stories of the #R Vampire Lord#!, and every trail led east to the hills where the faithful of #T Yedidyhan#! keep their rites. The priests there whisper that the stranger who came to the three princes was their god himself, in the years when he wandered before he vanished, but none of them will say so twice.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] can follow the trail into [GetCountry('AR3').GetName|Y] and see what the faithful are willing to share, or seal the records in the crypt and let the name stay unspoken."
 me_arteon_gen.50.a:0 "Follow the rumors to the Yedidyah."
 me_arteon_gen.50.b:0 "Seal the crypt and forget the name."
 me_arteon_gen.51.t:0 "The Bardidzor Compact"
 me_arteon_gen.51.desc:0 "The #Y Zwyegweyan#! notables of [GetProvince('(int32)791').GetName|Y] and [GetProvince('(int32)942').GetName|Y] came to court wearing their best, and they asked for the same rights the #Y Bardidzor#! have held since the compact was first sworn. They have paid their dues without complaint since the cities fell, and they say their loyalty deserves the same reward.\n\nThe Bardidzor lords answered that a privilege shared with every conquered city is no privilege at all. Their swords have kept the kingdom standing, and they expect [ROOT.GetCountry.GetRuler.GetName|Y] to remember it."
 me_arteon_gen.51.a:0 "Extend the compact to the Zwyegweyan."
 me_arteon_gen.51.b:0 "Keep it to the Bardidzor."
 me_arteon_gen.52.t:0 "Seekers Of The Eternal Night"
 me_arteon_gen.52.desc:0 "The seekers came back after a year on the roads, thinner and quieter than they left. They followed every rumor of the First Vampire from the mountain shrines to the desert wells, and in one village they burned a house that the villagers swore had sheltered him.\n\nThey did not find #T Yedidyhan#!. What they did bring home, they laid before [ROOT.GetCountry.GetRuler.GetName|Y] in silence."
 me_arteon_gen.52.a:0 "The Night will come."
 me_arteon_gen.53.t:0 "The Missionaries Of The Wyrm-Slayer"
 me_arteon_gen.53.desc:0 "The missionaries preached in the market of [ROOT.GetCountry.GetCapital.GetName|Y] for a month, telling how #T Artheousan#! slew the great wyrm and took the woman born from its dying breath as his bride, and every Horteonian kingdom on the island has long since knelt to that story. Their preaching has drawn larger crowds each week, and some of our own warriors have started wearing the Wyrm-Slayer's sign.\n\nThe keepers of the old gods want the missionaries sent back where they came from. Others at court point out that every Artheousan ruler on #Y Arteon#! would treat us as kin if we accepted the faith, and that our armies are about to need friends."
 me_arteon_gen.53.a:0 "Send the missionaries home."
 me_arteon_gen.53.b:0 "Take the Wyrm-Slayer's faith."
 me_arteon_gen.54.t:0 "The Nivan Cairns"
 me_arteon_gen.54.desc:0 "The veterans raised the cairns on the hills around [GetProvince('(int32)410').GetName|Y] stone by stone, and the families of the north brought what they remembered of the names to be carved on them. Some of the names were older than the families' own records, and the carvers cut them anyway.\n\nA captain who led the work has asked to serve [ROOT.GetCountry.GetRuler.GetName|Y] in the next war, and the young men who carried the stones have asked to serve under him."
 me_arteon_gen.54.a:0 "We remember them."
 me_arteon_gen.55.t:0 "The Charter Roll"
 me_arteon_gen.55.desc:0 "The envoy from #Y Ousred'Eson#! arrived one week and the envoy from #Y Ussonbrifhaerme#! the next, and each of them read the same old claim over the colonies in a different name. Both crowns still want soldiers and tribute from the colonies their ancestors founded, and both offer mercenaries and favor in return.\n\nThe keepers of the Charter Roll in [ROOT.GetCountry.GetCapital.GetName|Y] remind [ROOT.GetCountry.GetRuler.GetName|Y] that our rights were paid for in the #T Second Great War of Arteon#!, and that answering either crown means admitting that it has a claim."
 me_arteon_gen.55.a:0 "Answer Ousred'Eson."
 me_arteon_gen.55.b:0 "Answer Ussonbrifhaerme."
 me_arteon_gen.55.c:0 "Answer neither."
 me_arteon_gen.56.t:0 "The Slave Ledger"
 me_arteon_gen.56.desc:0 "The ledger of human slaves in [ROOT.GetCountry.GetCapital.GetName|Y] now runs to more pages than the roll of our own citizens, and the overseers have asked for more guards after a fire in the slave quarters last winter. The #R Great Slaver Navies#! offer another shipment at a good price, and the plantation lords want it.\n\nA smaller faction at court argues that freedmen with land to lose would defend it, and that a colony which depends on chained hands will one day face those hands in the dark."
 me_arteon_gen.56.a:0 "Free the capital's slaves."
 me_arteon_gen.56.b:0 "Buy more from the slaver navies."
 me_arteon_gen.57.t:0 "The Field Of Athlarethere"
 me_arteon_gen.57.desc:0 "The farmers around [GetProvince('(int32)420').GetName|Y] still turn up arrowheads and broken helms from the battle where #T Atheus the Younger#! fell, and they leave them in a heap by the road out of respect or superstition. Pilgrims from both Atheusian crowns pass through each year to look at the field, and both crowns have asked for a monument.\n\nA cenotaph would earn the gratitude of both claimants. Ploughing the field under would put the best farmland in the province back to work and end the pilgrimages."
 me_arteon_gen.57.a:0 "Raise a cenotaph."
 me_arteon_gen.57.b:0 "Plough the field under."
 me_arteon_gen.58.t:0 "Two Altars In Saousvad'E"
 me_arteon_gen.58.desc:0 "The Ascendic priests and the keepers of the Artheousan shrines both came to court on the same morning, and both asked [ROOT.GetCountry.GetRuler.GetName|Y] to attend their feast on the same day. Neither will move their date, and each says the other's feast was the later invention.\n\nThe realm has lived with two altars since the first Alusians married into the Sarian clans, and many families keep both. One faith would make the realm easier to rule, but the half that lost would remember it."
 me_arteon_gen.58.a:0 "Keep both altars under our protection."
 me_arteon_gen.58.a_tt:0 "On the #T Ascendic#! path, we can settle with the eastern shrine keepers and make the crown's protection of both altars permanent."
 me_arteon_gen.58.b:0 "Let the court attend the feast of our own priests."
 me_arteon_gen.59.t:0 "The Day The Conqueror Fell"
 me_arteon_gen.59.desc:0 "On the morning of the anniversary, the watch opened the gates of [GetProvince('(int32)662').GetName|Y] for the families carrying a broken blade to the stones where #T Atheus the Conqueror#! fell. The town has kept the day since before our kingdom was founded, and this year the ward elders have asked the crown to put up prizes so the villages can join in the games.\n\nThe swordmasters of [GetProvince('(int32)684').GetName|Y] came down for the anniversary with a pupil who knows the #T Blade Storm#!. The captain of the watch saw the pupil at drill and brought the fighter to court. He asks us to use the silver set aside for the day to pay the fighter's wages."
 me_arteon_gen.59.a:0 "Hold the games."
 me_arteon_gen.59.b:0 "Take the swordmasters' pupil into our service."
 me_arteon_gen.59.b_tt:0 "An Alu-sarian fighter who knows #T Blade Storm#! joins our court with #G +7 Martial#!."

 me_arteon_gen.60.t:0 "Writs For The Four Shores"
 me_arteon_gen.60.desc:0 "The carters who gave us the northern toll receipts have come back to the hall. The keepers have set those receipts alongside the other shore rolls, with a mark beside every district where our writ has yet to be read.\n\nThe heralds are ready to carry the writs. The smiths have set aside a bar for #R Grand Illuminator#! and ask to finish the blade when the northern houses have lost their lands."
 me_arteon_gen.60.desc_vampire:0 "The northern toll receipts have come to the hall with the names of the houses that issued them. The keepers have set them alongside the other shore rolls, with a mark beside every district where our writ has yet to be read.\n\nThe envoys are ready to carry the writs. The smiths have set aside a bar for #R Blood Drinker#! and ask to finish it when the North answers to our crown."
 me_arteon_gen.60.a:0 "Send out the writs under our seal."
 me_arteon_gen.61.t:0 "The Rolls Of The Four Shores"
 me_arteon_gen.61.desc:0 "The last shore sent its rolls to [ROOT.GetCountry.GetCapital.GetName|Y] with a clerk who knew which dues had already been paid. He waited while the keepers opened the other bundles, and by the time they called him over, he had found three villages entered on two rolls under different names.\n\nThe city elders have brought their own lists of streets that need masons and wells that need clearing. The captain of the capital guard has come with the account for the walls, and both are willing to stay while the treasury hears the other out."
 me_arteon_gen.61.a:0 "Hear the city elders and the captain."
 me_arteon_gen.62.t:0 "The Eastern Compact"
 me_arteon_gen.62.desc:0 "The elders of the eastern towns brought their ward rolls to court, and one of the keepers from [GetProvince('(int32)919').GetName|Y] laid his shrine keys beside them. He said he could account for the oil and grain that the sanctuary had taken in during the war, if there would still be a door for him to open when he went home.\n\nThe families who keep both feasts at [GetProvince('(int32)662').GetName|Y] offered to stand witness while the ward rolls were read. By the time the clerks finished, the keeper had put the keys back in his belt and asked for a copy of the agreement to hang where his neighbors could read it."
 me_arteon_gen.62.a:0 "Give the keeper a copy under our seal."
 me_arteon_gen.63.t:0 "A Court For Both Altars"
 me_arteon_gen.63.desc:0 "The first households from the eastern towns came to take up rooms near the court, and the ward clerks put their names beside the families who had agreed to lodge them. A priest who came with the new households asked who would hear a complaint if a captain took their shrine's stores on a feast day.\n\nThe keepers of both altars have agreed to sit while the petitions are read. They brought the settlement from [GetProvince('(int32)662').GetName|Y] and asked the clerks to set it where a petitioner can point to the words without having to bring a priest along."
 me_arteon_gen.63.a:0 "Read the settlement at the first hearing."
