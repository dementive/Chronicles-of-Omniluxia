l_english:

 03_cymeva: "The High Elves of Cymeva"
 03_cymeva_DESCRIPTION: "Following the deaths of both #Y Calidriel#! and #Y Cymeva#!, the #Y High Elven#! kingdoms of [ROOT.GetCountry.GetName|T] and [GetCountry('ATH').GetName|T] coexisted in accordance with the #Y #G Great High Elven Peace#!#!.\n\nThe #Y Cymevans#! under [GetCharacter('(int32)113').GetName|Y] have used the last two hundred years of peace to settle parts of #G Northern Eptelon#! as well as send out #Y #R Slaver Ships#!#! to raid the coasts of #Y Arteon#! and #G Eptelon#!. Focusing on rebuilding their economy, forming a professional standing army of elite soldiers, and accruing slaves to do the menial labor so that elven men may join the army, the #Y Cymevans#! are prepared to finally challenge [GetCharacter('(int32)22').GetName|Y] for control of #G Horteon#!!"
 03_cymeva_CRITERIA_DESCRIPTION: "This mission will be completed when [ROOT.GetCountry.GetName|T] has united the #Y High Elves#! of #G Horteon#!."
 03_cymeva_BUTTON_TOOLTIP: "We will unite the High Elves under our rule!"

 03_cymeva_task_1: "A National Spirit"
 03_cymeva_task_1_DESC: "Even after the #Y #R Great High Elven Civil War#!#! our people considered themselves culturally connected to those in the west. We were all #Y High Elves#! descended from the sons of #Y #R Atheus the Conqueror#!#!! However, centuries of division and isolation has created a unique identity in the more cosmopolitan elves that population the #Y Cymevan#! realm, and it is time to decide if this new culture truly defines who we are."
 
 03_cymeva_task_2: "Vaur-Ac Warriors"
 03_cymeva_task_2_DESC: "Traditional elven warriors fight in half-plated steel armor, either accompanied with a longbow or with a #Y Trac#!, called a 'Glaive' by the #Y Horteonians#!. Under [GetCharacter('(int32)113').GetName|Y] we have established a professional army, so now it is imperative that we select the best of the best to form an elite unite of warriors to serve as shock infantry for the battles to come: the #Y Vaur-Ac Warriors#!."

 03_cymeva_task_3: "Hua-roc Auxiliaries"
 03_cymeva_task_3_DESC: "The backbone of our society and our armies, the #Y Hua-roc#! are the various slave peoples who work our estates and serve as light infantry meant to wear down our enemies. Due to our lack of manpower, it might be a good idea to employ they slave-soldiers to assist our more disciplined #G Elven#! regiments."

 03_cymeva_task_4: "Ending the Peace"
 03_cymeva_task_4_DESC: "The #T High Elven Peace#! has lasted ever since the death of the two kings that started the #Y #R Great High Elven Civil War#!#!, however, it did not determine a decisive victor. With manpower from our colonies supporting our standing army, we can finally continue the #Y #R Great Elven Civil War#!#! and firmly declare ourselves the victors!"

 03_cymeva_task_5: "Unite the High Elves"
 03_cymeva_task_5_DESC: "With the #Y Atheusians#! defeated, we can finally claim complete control over the entire #Y High Elven Realm of Horteon#!, one of the greatest powers in the history of #G Omniluxia#!!"

 03_cymeva_task_6: "Develop the Slave Estates"
 03_cymeva_task_6_DESC: "While we are lucky enough to hold the most fertile areas of #G Horteon#!, our lack of men means that we do not have enough to work our vast fields, nor does our noble nature entice us to do such menial labor. By creating large slave estates worked by the #Y Hua-roc#! we can focus on more important and sophisticated crafts."

 03_cymeva_task_7: "The Pearl of Horteon"
 03_cymeva_task_7_DESC: "The #Y Pearl of Horteon#!, [GetProvince('(int32)142').GetName|Y], is known across the #Y Herpolian#! and #Y Arteptolian#! seas for producing the finest pearls in #G Omniluxia#!. Local pearl divers and jewelers are some of the best in their craft, and should we help develop their city their exports would be unmatched!"

 03_cymeva_task_8: "The First City"
 03_cymeva_task_8_DESC: "[GetProvince('(int32)345').GetName|Y], or the '#Y First City#!', is known as the first #Y High Elven#! city founded by #T Atheus the Conqueror#! himself! Despite the official capital of the empire moving to [GetProvince('(int32)142').GetName|Y], our city has remained an important religious and cultural center for our people.\n\nLet us rebuild the great #Y First City of Atheus#! into a cultural hub of the #Y High Elven#! people!"

 03_cymeva_task_9: "Raise the Great Slaver Navy"
 03_cymeva_task_9_DESC: "After the end of the #T High Elven Civil War#! what was once the #Y Great Slaver Navy#! was split between the two #Y Elfrealms#! and underfunded. While we've made an effort to rebuild it, recent colonizations and skirmishes with the [GetCountry('ATH').GetName|T] have meant that our navy has taken a backseat to the development of our army.\n\nNow is the time to rebuild #T Atheus#!' great fleet, and look beyong the #G Herpolian Sea#!!"

 03_cymeva_task_10: "Controlling the Colonies"
 03_cymeva_task_10_DESC: "Our #Y Eptelonian#! colonies have long chafed under our rule, believing themselves to know better than the rightful descendents of #T Atheus the Conqueror#!. Skirmishes with the [GetCountry('ATH').GetName|T] and the neglect of our navy has given the colonies relative autonomy, with the upstart [GetCountry('HE3').GetName|T] even breaking their ties with us.\n\nIt is time to take direct control over our unruly subjects and show the north who the true rulers of #G Eptelon#! are!"

 03_cymeva_task_11: "Dominate Eptelon"
 03_cymeva_task_11_DESC: "With our colonies firmly under our control, all that's left is to subjugate the various divided #Y Eptelonian#! tribes. We shall dominate the continent that refused to bow to #T Atheus the Conqueror#!!"

 03_cymeva_task_12: "Fortify the East"
 03_cymeva_task_12_DESC: "While we struggle to defeat the [GetCountry('ATH').GetName|T], it is important not to forget the various #Y Horteonian#! tribes to our north and east. Divided they are weak, however if they were to attack simultaneously it would be a disaster not seen since the #Y Fourth Atheusian-Horteonian Wars#!! We must make sure that our border is well-defended to prevent such attacks."

 03_cymeva_task_13: "Pacify the North"
 03_cymeva_task_13_DESC: "With our border secured, the time has come to finally subjugate the last free #Y Horteonians#! of the north! Let us finally unite the #Y Land of Fire and Ice#! under our rule!"

 03_cymeva_task_14: "An Eastern Capital"
 03_cymeva_task_14_DESC: "The dreaded city of [GetProvince('(int32)264').GetName|Y] has stood as a symbol of #Y Horteonian#! resistance since the #Y Fourth Atheusian-Horteonian Wars#!, mocking our race with its longevity. However, with the #Y Horteonians#! defeated and the city under our control, it is pertinent that we convert this symbol of resistance into one of submission to our rule. The #Y Bulwark of Horteon#! will become our new #Y Eastern Capital#!!"




### EVENTS
  me_cymeva_1_title: "Sons of Cymeva"
  me_cymeva_1_desc: "Centuries have passed since our people could consider themselves part of a whole #Y Atheusian#! realm. While #Y High Elves#! live long lives, very few if any remain that can still recall the days of the united #Y High Order#!.\n\nIn that time, our people have become more urban, cosmopolitan, and belligerent than our rural western 'brothers'. With war looming on the horizon, many wonder if we should continue to claim the legacy of #Y #R Atheus the Conqueror#!#! or promote our local culture as sons of #Y Cymeva#!."
  me_cymeva_1.a: "We are Atheusians!"
  me_cymeva_1_tooltip.a: "#T [GetCountry('ACY').GetName] will uphold the #E Atheusian#! culure#!"
  me_cymeva_1.b: "We are Cymevans!"
  me_cymeva_1_tooltip.b: "#T [GetCountry('ACY').GetName] will embrace their unique #E Cymevan#! culture#!"

  me_cymeva_2_title: "The End of the High Elven Peace"
  me_cymeva_2_desc: "For close to five centuries our people have been divided between the two #Y Elfrealms#! of #G Horteon#!, stifling our growth and costing us our empire.\n\nNo longer shall we accept this status quo!\n\nMessengers have already been sent to the colonies, calling for additional manpower to bolster our forces. Our #Y Horteonian#! subjects as recruited to serve as scouts and auxiliaries. Our armies now march with purpose towards [GetProvince('(int32)142').GetName|Y], seeking to fulfill #Y [GetCharacter('(int32)113').GetFirstName]'s#! dream to restore the #Y High Order#! and the #Y Ascendic Empire#! under our rightful rule, as the true successors of #T Atheus the Conqueror#!!"
  me_cymeva_2.a: "Onwards! To glory!"
  me_cymeva_2_tooltip: "#R We will declare war on the [GetCountry('ATH').GetName]#!"

  me_cymeva_3_title: "The Great Civil War Continues"
  me_cymeva_3_desc: "My lord, terrible news. It seems that the presumptuous and prideful [GetCharacter('(int32)113').GetName|Y] has let his greed and ambition get in the way of reason!\n\nThe forces of [GetCountry('ACY').GetName|T] now march on our lands, seeking to take [GetProvince('(int32)142').GetName|Y] and reunite the #Y High Order of Atheus#!.\n\nHowever, this fight is far from over, and we are more than able to defeat this upstart on the battlefield. Their troops are trained as professional soldiers much like in the days of #Y Atheus the Great#!, but what we lack in quality we more than make up in quantity.\n\nShould we defeat the #Y Cymevans#!, there is hope that we could unite the #Y Elfrealms#! of the north under our banner, and finally honor the legacy of #T Atheus#!!"
  me_cymeva_3.a: "Rally the troops in the name of Atheus!"
  me_cymeva_3_tooltip: "#R We will fight [GetCountry('ACY').GetName] to unite the #E High Elves#!#!"

  me_cymeva_4_title: "A Call to Arms"
  me_cymeva_4_desc: "My King, word has come from our overlord, [GetCharacter('(int32)113').GetName|Y]! He demands men and gold for his war to unite the #Y Elfrealms#! of #G Horteon#! under his banner!\n\nObviously our men are eager to serve alongside their countrymen in #G Horteon#!, and I have no doubts of your loyalty to [GetProvince('(int32)345').GetName|Y], but there have been murmurs of dissent coming from both the government and the people.\n\nSpeculations that the #Y Cymevans#! see us nothing more as extra manpower have begun circulating, and there are those that would prefer to see our overlord punished rather than succeed.\n\nOf course, the loyalty of the men and of the people is to you, my King. We shall follow you to the battlefield, whether it be against or for the #Y Cymevans#!."
  me_cymeva_4.a: "Now's our chance!"
  me_cymeva_4_tooltip.a: "#R We will lead a war of independence against [GetCountry('ACY').GetName]#!"
  me_cymeva_4.b: "Ready the ships!"
  me_cymeva_4_tooltip.b: "#R We will join [GetCountry('ACY').GetName]'s war against [GetCountry('ATH').GetName]#!"

  me_cymeva_5_title: "The Colonies in Revolt"
  me_cymeva_5_desc: "Great #Y [GetCharacter('(int32)113').GetFirstName]#!, terrible news from the colonies! It seems that our colony, [SCOPE.sCountry('horteonic_subject').GetName|T], has responded to our call to arms with a declaration of independence!\n\nNormally, crushing their small army would not be a troubling affair, our current campaign against [GetCountry('ATH').GetName|T] means that we cannot afford to stretch our forces too thin!\n\nGreat King, I know your wisdom will see us through this turmoil. Should we win this war quickly, the traitors shall be punished!"
  me_cymeva_5.a: "They dare rise up against me?"
  me_cymeva_5_tooltip: "#R [SCOPE.sCountry('horteonic_subject').GetName] will lead a war of independence against us!#!"

  me_cymeva_6_title: "The High Elven Civil War Continues"
  me_cymeva_6_desc: "Great King, word has reached us from the far lands of #G Horteon#!! Little information reaches us from this distant land, the extent of our knowledge tells us that it is a cold land with a few human tribes dominated by the two great #Y Elfrealms#! of the #Y High Elves#! that have lived in peace far longer than we can remember.\n\nDespite this knowledge, word has arrived that the two realms now fight for control over the #Y Land of Fire and Ice#! in a bitter struggle that will see only one victor."
  me_cymeva_6.a: "Those pointy-eared snobs are still fighting?"
  me_cymeva_6_tooltip: "#R The two elfrealms will clash over who will control the #E High Elves#! of #E Horteon#!!#!"

  me_cymeva_7_title: "The Elfrealms at War"
  me_cymeva_7_desc: "Great Chief! Word comes from the dreaded #Y Elfrealms#! of the south.\n\nMerchants and travelers have been spreading the news that the #Y #R Great Elven Civil War#!#! has continued, and that the #Y Elfrealms#! once again face each other on the battlefield.\n\nThe last time they were at odds our people were too disorganized and disheartened to fight, however we have no such luxury now! They have encroached on our territory and taken our people to serve then as slaves. Every opportunity that we don't take now is a chance missed to retake our homeland.\n\nNow seems like an excellent time to strike, if we are able to rally our tribesmen against the #Y High Elves#!, we might yet still have a chance at freeing #G Horteon#!!"
  me_cymeva_7.a: "Rally the warriors!"
  me_cymeva_7_tooltip: "#Y We will gain claims on the #E #R Elfrealms#!#!#!"

  me_cymeva_8_title: "$03_cymeva_task_6$"
  me_cymeva_8_desc: "My lord, hundreds of #Y Hua-roc#! have been moving to the various slave estates of the honorable #Y Uoma-arc#!. These great nobles of our country have wisely put these men to work on their various farms and mines, providing crucial nourishment for our soldiers.\n\nAs the #Y Hua-roc#! provide for the #Y Uoma-arc#!, so will they generously provide for our state my king."
  me_cymeva_8.a: "Tell them to work harder!"
  me_cymeva_8_tooltip: "The mission task '#Y $03_cymeva_task_6$#!' has now been #G Completed#!!"

  me_cymeva_9_title: "$03_cymeva_task_7$"
  me_cymeva_9_desc: "Honorable king, the #Y Alrec-rai#! of [GetProvince('(int32)360').GetName|Y] have come bearing great news! The pearl divers have encountered a large and nearly perfectly spherical pearl worth more than twenty times its weight in gold!\n\nSuch an important discovery was assessed for dedication by the local #Y Alrec-rai#!, who determined its qualities to make it fit enough to be dedicated to the great #T Atheus the Conqueror#!!\n\nSuch an important find during your reign can only mean your current enlightened rule is blessed by the #Y Ascended#! themselves!"
  me_cymeva_9.a: "What a beauty!"
  me_cymeva_9_tooltip: "The mission task '#Y $03_cymeva_task_7$#!' has now been #G Completed#!!"

  me_cymeva_10_title: "$03_cymeva_task_8$"
  me_cymeva_10_desc: "Enlightened King, large scale construction on the capital has been completed!\n\nHosting large districts for the honored #Y Uoma-arc#!, entertainment districts for the common man, and large mills for the #Y Hua-roc#!, our capital has never been more prosperous! Our famous silks now outmatch anything the western #Y High Elves#! could ever hope to produce, and our enlightened #Y Uoma-arc#! are the most intellectual scholars found on the island!\n\nHowever, the gem of our capital has to the be the impressive #Y Ouvomo District#!. Hosting great temple complexes dedicated to the #Y Ascended#!, this expansive area grants the honored #Y Alrec-rai#! a space to discuss their philosophies. Truly, our city and your rule is one blessed by the #Y Ascended#!!"
  me_cymeva_10.a: "A city worthy of Atheus!"
  me_cymeva_10_tooltip: "The mission task '#Y $03_cymeva_task_8$#!' has now been #G Completed#!!"

  me_cymeva_11_title: "$03_cymeva_task_9$"
  me_cymeva_11_desc: "Mighty prows distinguish the great fleet that has been assembled on the docks of [GetProvince('(int32)345').GetName|Y]. Their great sails sway in the morning breeze, and their decks are busy with crewmembers preparing them for their future voyages. Inside these vessels carry large cages to store captured prisoners, as well as a lavish cabins for the captain, as only the best would be allowed for an #Y Uoma-arc#!.\n\nWatching his mighty war fleet from a distance, [ROOT.GetCountry.GetRuler.GetName|Y] sets his sights on lands beyond #G Horteon#!."
  me_cymeva_11.a: "To Eptelon!"
  me_cymeva_11_tooltip: "The mission task '#Y $03_cymeva_task_9$#!' has now been #G Completed#!!"

  me_cymeva_12_title: "$03_cymeva_task_10$"
  me_cymeva_12_desc: "As [ROOT.GetCountry.GetRuler.GetName|Y] steps foot on the port of [GetProvince('(int32)450').GetName|Y], he is greeted by the former princes of his colonies. In a historic move, the King has decided to be the first #Y High Elven#! monarch to physically step foot on the island, seeking to symbolize his dominance over the region. However, it is evident to all that #Y Eptelonian#! freedom would be caged alongside the petty kings of [GetProvince('(int32)456').GetName|Y].\n\nProstrating themselves before him, the princes swear fealty to him. Accepting their submission, the King beckons for them to rise."
  me_cymeva_12.a: "Well? Let us feast!"
  me_cymeva_12_tooltip: "The mission task '#Y $03_cymeva_task_10$#!' has now been #G Completed#!!"

  me_cymeva_13_title: "$03_cymeva_task_11$"
  me_cymeva_13_desc: "From the northern plains, to the southern swamps, all of #G Eptelon#! now bows to [ROOT.GetCountry.GetRuler.GetName|Y]!\n\nEver since the #T First Great War of Arteon#! and the expeditions of the #Y Great Slaver Navy#! under #T Atheus the Conqueror#! the #Y High Elves#! have tried time and time again to penetrate the highlands and jungles of this savage land, only to be turned back to the norther coasts. However, no longer are we content to simply raid the interior, now our governor procures us a steady supply of slaves and tribute from the conquered hill tribes of #G Eptelon#!!\n\nTaking notice of our success, many realms of #Y Arteon#! elf and human alike have begun to plot against our rightful control of the island. Perhaps it will soon be time to finish the late #T Atheus#!' wishes and finally subjugate the #Y Land of Eternal War#!..."
  me_cymeva_13.a: "Is there truly anyone who can challenge me?"
  me_cymeva_13_tooltip: "The mission task '#Y $03_cymeva_task_11$#!' has now been #G Completed#!!"

  me_cymeva_14_title: "$03_cymeva_task_13$"
  me_cymeva_14_desc: "Honored king, the #Y Northern Horteonians#! flee from our armies, their captured brethren now joining the ranks of our #Y Hua-roc#!!\n\nOur men have consistently won decisive battle against their chiefs, dividing and conquering as to slowly and securely assure our conquests. Our generals report making it as far as the hills of the #Y Gnomes#!!\n\nThe best news to come from this campaign is the fall of [GetProvince('(int32)264').GetName|Y], the #Y Bulwark of Horteon#!! Having repelled our forces for more than five hundred years, this singular settlement has stood as a symbol of #Y Horteonian#! resistance, with its famous port providing the interior with many of their imports. No longer shall their walls halt #Y High Elven#! ambitions, as the mighty citadel is now ours!"
  me_cymeva_14.a: "Put these misers to work!"
  me_cymeva_14_tooltip: "The mission task '#Y $03_cymeva_task_13$#!' has now been #G Completed#!!"

  me_cymeva_15_title: "$03_cymeva_task_14$"
  me_cymeva_15_desc: "Enlightened ruler, construction on what was once [GetProvince('(int32)264').GetName|Y] has been completed!\n\nTheir infamous walls that once defended against our soldiers now protect our frontier from northern raiders, and their ports now bustle with #Y High Elven#! merchants who have been outcompeteing the local #Y Horteonians#!! Without their imports, the remaining northern #Y Horteonians#! will remain weak and isolated. They shall soon find themselves working as our #Y Hua-roc#!!\n\nThe new districts built have provided enough acommodations to attract various #Y Uoma-arc#! and #Y Alrec-rai#! to the city, who have brought many commoners with them. Rebuilding large sections of the city in the #Y High Elven#! style, [GetProvince('(int32)264').GetName|Y] has truly become our #Y Eastern Capital#!!"
  me_cymeva_15.a: "Excellent!"
  me_cymeva_15_tooltip: "The mission task '#Y $03_cymeva_task_14$#!' has now been #G Completed#!!"




