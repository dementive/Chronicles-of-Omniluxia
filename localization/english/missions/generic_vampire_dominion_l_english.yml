l_english:
 generic_vampire_dominion_title:0 "Dominion of the Night"
 generic_vampire_dominion:0 "The Sapping of [SCOPE.sP('generic_vampire_dominion_target').GetName]"
 generic_vampire_dominion_DESCRIPTION:0 "[ROOT.GetCountry.GetRuler.GetName|Y] has chosen the province of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] as [ROOT.GetCountry.GetRuler.GetHerHis] discreet larder for darker rites. Its people will endure a season of pallor, dread, and missing hours, while their [ROOT.GetCountry.GetRulerTitle] rises from the blood feast sharper, stronger, and more terrible than before."
 generic_vampire_dominion_CRITERIA_DESCRIPTION:0 "This mission will be considered complete after the vampire ruler has drawn enough strength from #R [SCOPE.sP('generic_vampire_dominion_target').GetName]#! to found an undying court."

 generic_vampire_dominion_first_thirst:0 "The First Thirst"
 generic_vampire_dominion_first_thirst_DESC:0 "After weeks of travel, [ROOT.GetCountry.GetRuler.GetName|Y] has finally arrived in [SCOPE.sP('generic_vampire_dominion_target').GetName|Y]. The [ROOT.GetCountry.GetAdjective|Y] [ROOT.GetCountry.GetRulerTitle|T] has felt compelled by some strange inner urging to do [ROOT.GetCountry.GetRuler.GetHerHis] dark work here."
 
 generic_vampire_dominion_cull_skeptics:0 "Cull The Firebrands"
 generic_vampire_dominion_cull_skeptics_DESC:0 "There are people in [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] that have seen too much and talk too freely - they have forgotten what it means to be afraid. Fear will teach a man to lower his eyes, to keep his mouth shut - lessons that are sorely needed in this godforsaken province.\n\n#R We will only be able to select three missions from this row before all others bypass.#!"
 
 generic_vampire_dominion_midnight_feeding:0 "The Midnight Tithe"
 generic_vampire_dominion_midnight_feeding_DESC:0 "The strongest households will leave a bowl, a name, and an unlocked door at midnight. By morning they will remember nothing but the command to obey.\n\n#R We will only be able to select three missions from this row before all others bypass.#!"
 
 generic_vampire_dominion_thralls_in_silk: "Undead Thralls"
 generic_vampire_dominion_thralls_in_silk_DESC:0 "Five souls from the region will be quietly surrendered to the dark, and in their place, a pale host of #R Wraiths#! will gather that answer to [ROOT.GetCountry.GetRuler.GetName|Y].\n\n#R We will only be able to select three missions from this row before all others bypass.#!" 
 
 generic_vampire_dominion_sealed_crypt:0 "The Sealed Crypt"
 generic_vampire_dominion_sealed_crypt_DESC:0 "A cold chamber will be dug beneath [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] in a long-abandoned temple to some forgotten god, a place where the sun cannot pry and the stones remember every whispered oath.\n\n#R We will only be able to select three missions from this row before all others bypass.#!"
 
 generic_vampire_dominion_taste_for_politics:0 "A Taste For Politics"
 generic_vampire_dominion_taste_for_politics_DESC:0 "Envoys, advocates, and ambitious local worthies all carry excellent blood. Their secrets are almost as nourishing as their terror.\n\n#R We will only be able to select three missions from this row before all others bypass.#!"
 
 generic_vampire_dominion_pale_retinue:0 "The Pale Retinue"
 generic_vampire_dominion_pale_retinue_DESC:0 "The bravest youths of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] will guard the night roads. They will be less brave afterward, but far more useful."
 
 generic_vampire_dominion_court_of_whispers:0 "Court Of Whispers"
 generic_vampire_dominion_court_of_whispers_DESC:0 "Every secret in [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] will eventually pass through to the same dark room. By dawn, [ROOT.GetCountry.GetRuler.GetFirstName|Y] will know which lies are worth forgetting, and which ones are worth repeating."
 
 generic_vampire_dominion_unnatural_mist:0 "The Mist That Does Not Lift"
 generic_vampire_dominion_unnatural_mist_DESC:0 "A grey veil will settle over [SCOPE.sP('generic_vampire_dominion_target').GetName|Y]. Travelers will lose roads they have walked since childhood, and the ruler will never lose a scent.\n\n#R We will only be able to select three missions from this row before all others bypass.#!"
 
 generic_vampire_dominion_drained_herds:0 "Livestock Found Drained"
 generic_vampire_dominion_drained_herds_DESC:0 "The stories being told by the farmers and shepherds living in [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] are all of the same; at sunrise their cattle will be found pale in the fields, drained of every drop of blood.\n\n#R We will only be able to select three missions from this row before all others bypass.#!"
 
 generic_vampire_dominion_wolves_at_treeline:0 "Wolves At The Treeline"
 generic_vampire_dominion_wolves_at_treeline_DESC:0 "The villagers living in [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] are afraid to travel during the day by themselves and never at night, for there are packs of wolves stalking the forests and streets that have been killing people and animals.\n\n#R We will only be able to select three missions from this row before all others bypass.#!"
 
 generic_vampire_dominion_crows_never_leave:0 "The Crows Never Leave"
 generic_vampire_dominion_crows_never_leave_DESC:0 "Black wings gather on rooftops and the streets are filled with the raucous laughter of malicious crows. They see everything in [SCOPE.sP('generic_vampire_dominion_target').GetName|Y], and it is whispered by the villagers that some master has taught them where to look.\n\n#R We will only be able to select three missions from this row before all others bypass.#!"
 
 generic_vampire_dominion_candlelight_never_gutters:0 "Candlelight Never Flickers"
 generic_vampire_dominion_candlelight_never_gutters_DESC:0 "The people of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] will work all night rather than close their eyes - they are tormented by strange dreams and are afraid of what they see in them.\n\n#R We will only be able to select three missions from this row before all others bypass.#!"
 
 generic_vampire_dominion_silence_after_dusk:0 "Silence After Dusk"
 generic_vampire_dominion_silence_after_dusk_DESC:0 "At sunset, [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] will become obediently still, with all sounds of life disappearing into the night. All shops close their doors, and no one will leave their homes for any reason. There are no songs in the air, no creaking sound of cartwheels in the alleyways - just dead silence after dusk."
 
 generic_vampire_dominion_undying_court:0 "The Undying Court"
 generic_vampire_dominion_undying_court_DESC:0 "[SCOPE.sP('generic_vampire_dominion_target').GetName|Y] has yielded blood, fear, secrets, beasts, and sleepless devotion. It is time to crown the harvest and leave an undying court in its wake."
 
 generic_vampire_dominion_bloodless_nights_pmod:0 "Bloodless Nights"
 generic_vampire_dominion_bloodless_nights_pmod_desc:0 "People wake weak and bloodless, unable to explain the pinprick wounds at their throats."
 generic_vampire_dominion_culled_doubters_pmod:0 "Culled Firebrands"
 generic_vampire_dominion_culled_doubters_pmod_desc:0 "The loudest agitators have vanished and are no longer a thorn in our side. The survivors are quiet, obedient, and much less likely to cause trouble."
 generic_vampire_dominion_night_tithe_pmod:0 "The Night Tithe"
 generic_vampire_dominion_night_tithe_pmod_desc:0 "Households leave offerings after sundown, and every offering seems to leave the province a little weaker."
 generic_vampire_dominion_thrall_levies_pmod:0 "Thrall Levies"
 generic_vampire_dominion_thrall_levies_pmod_desc:0 "Able-bodied locals have been drawn into private service, leaving farms and muster rolls thin."
 generic_vampire_dominion_sealed_crypt_pmod:0 "The Sealed Crypt"
 generic_vampire_dominion_sealed_crypt_pmod_desc:0 "A hidden crypt chills the land above it. The locals avoid the place, though none can say why."
 generic_vampire_dominion_guest_who_never_left_pmod:0 "Pulling the Strings"
 generic_vampire_dominion_guest_who_never_left_pmod_desc:0 "We have taken an interest in micromanaging the local political affairs in our provinces in order to ensure we get what we want out of the region."
 generic_vampire_dominion_pale_retinue_pmod:0 "The Pale Retinue"
 generic_vampire_dominion_pale_retinue_pmod_desc:0 "The province's strongest recruits have become silent attendants to the throne."
 generic_vampire_dominion_court_of_whispers_pmod:0 "Court of Whispers"
 generic_vampire_dominion_court_of_whispers_pmod_desc:0 "Informers and frightened petitioners crowd the shadows. Good ideas die quickly in such air."
 generic_vampire_dominion_unnatural_mist_pmod:0 "Unnatural Mist"
 generic_vampire_dominion_unnatural_mist_pmod_desc:0 "A strange mist clings to the roads and fields, slowing travelers and dulling local labor."
 generic_vampire_dominion_drained_herds_pmod:0 "The Drained Herds"
 generic_vampire_dominion_drained_herds_pmod_desc:0 "Livestock are found empty in the morning fields, and the granaries seem to empty with them."
 generic_vampire_dominion_wolves_grown_bold_pmod:0 "Wolves Grown Bold"
 generic_vampire_dominion_wolves_grown_bold_pmod_desc:0 "Predators prowl too close to the roads, and fewer locals volunteer for hard service."
 generic_vampire_dominion_where_crows_gather_pmod:0 "Where the Crows Gather"
 generic_vampire_dominion_where_crows_gather_pmod_desc:0 "Watching birds crowd the shrines and rooftops, souring worship and daily life."
 generic_vampire_dominion_sleepless_village_pmod:0 "The Sleepless Village"
 generic_vampire_dominion_sleepless_village_pmod_desc:0 "The people keep candles burning until dawn. Work continues, but no one works well without sleep."
 generic_vampire_dominion_quiet_hours_pmod:0 "The Quiet Hours"
 generic_vampire_dominion_quiet_hours_pmod_desc:0 "Fear keeps the peace after sunset, though markets and hearths both suffer from the silence."
 generic_vampire_dominion_seat_of_pale_court_pmod:0 "Seat of the Pale Court"
 generic_vampire_dominion_seat_of_pale_court_pmod_desc:0 "The province has become a chosen haunt of the ruler's undying court, honored only in the way prey is honored."
 generic_vampire_dominion_culled_doubters_cmod:0 "Culled the Skeptics"
 generic_vampire_dominion_culled_doubters_cmod_desc:0 "Those who questioned the ruler's nature have learned that discretion is healthier than curiosity."
 generic_vampire_dominion_taste_for_politics_cmod:0 "A Taste for Politics"
 generic_vampire_dominion_taste_for_politics_cmod_desc:0 "Diplomacy seems easier after sampling the fears and ambitions of important guests."
 generic_vampire_dominion_pale_retinue_cmod:0 "The Pale Retinue"
 generic_vampire_dominion_pale_retinue_cmod_desc:0 "Unnaturally loyal attendants haunt the palace corridors and obey without hesitation."
 generic_vampire_dominion_realm_of_the_undying_cmod:0 "Realm of the Undying"
 generic_vampire_dominion_realm_of_the_undying_cmod_desc:0 "The realm remembers a season when the night ruled openly and few dared to resist."

 generic_vampire_dominion_vigor_of_the_drained_charmod:0 "Vigor of the Drained"
 generic_vampire_dominion_vigor_of_the_drained_charmod_desc:0 "The promise of a fresh hunt has invigorated us."
 generic_vampire_dominion_scent_of_obedience_charmod:0 "Scent of Obedience"
 generic_vampire_dominion_scent_of_obedience_charmod_desc:0 "Fear has a flavor that can be smelled, and we have learned to savor it."
 generic_vampire_dominion_warm_blood_charmod:0 "Warm Blood"
 generic_vampire_dominion_warm_blood_charmod_desc:0 "Fresh strength burns beneath dead flesh."
 generic_vampire_dominion_silken_thralls_charmod:0 "Undead Thralls"
 generic_vampire_dominion_silken_thralls_charmod_desc:0 "Charmed servants anticipate commands before they are spoken - the best kinds of soldiers."
 generic_vampire_dominion_deathless_repose_charmod:0 "Deathless Repose"
 generic_vampire_dominion_deathless_repose_charmod_desc:0 "Hidden rest and stolen warmth make us unnervingly lucid."
 generic_vampire_dominion_sweetened_tongue_charmod:0 "Sweetened Tongue"
 generic_vampire_dominion_sweetened_tongue_charmod_desc:0 "Our voice carries the softness of invitation and the weight of a locked door."
 generic_vampire_dominion_pale_captain_charmod:0 "Pale Captain"
 generic_vampire_dominion_pale_captain_charmod_desc:0 "We command with cold precision, and bloodless attendants move as one."
 generic_vampire_dominion_whisper_drinker_charmod:0 "Whisper Drinker"
 generic_vampire_dominion_whisper_drinker_charmod_desc:0 "Secrets settle in the mind like rich wine, and we drink deeply from the chalice."
 generic_vampire_dominion_mist_walker_charmod:0 "Mist Walker"
 generic_vampire_dominion_mist_walker_charmod_desc:0 "No fog can confuse a predator who made it..."
 generic_vampire_dominion_beast_blood_charmod:0 "Beast Blood"
 generic_vampire_dominion_beast_blood_charmod_desc:0 "Cruder feedings stir older instincts, which we will allow ourselves to indulge."
 generic_vampire_dominion_lord_of_hungers_charmod:0 "Lord of Hunger"
 generic_vampire_dominion_lord_of_hungers_charmod_desc:0 "Packs of starving wolves seem to follow us wherever we go, much to the dismay of those around us."
 generic_vampire_dominion_carrion_sight_charmod:0 "Carrion Sight"
 generic_vampire_dominion_carrion_sight_charmod_desc:0 "Omens gather wherever weakness is about to become useful."
 generic_vampire_dominion_sleepless_mind_charmod:0 "Sleepless Mind"
 generic_vampire_dominion_sleepless_mind_charmod_desc:0 "The stolen sleepless nights will never be returned to us, but it is too late for that now."
 generic_vampire_dominion_dusk_command_charmod:0 "Dusk Command"
 generic_vampire_dominion_dusk_command_charmod_desc:0 "When the sun falls, every voice seems to wait for our permission to even breathe."
 generic_vampire_dominion_lord_of_the_sapped_domain_charmod:0 "Lord of the Sapped Domain"
 generic_vampire_dominion_lord_of_the_sapped_domain_charmod_desc:0 "An entire province's dread has been rendered into poise, hunger, and terrible authority."

#############################################
# MISSION EVENTS - THE SAPPING OF A PROVINCE
#############################################

 me_vampire_dominion_1_title:0 "The First Thirst"
 me_vampire_dominion_1_desc:0 "The carriages of [ROOT.GetCountry.GetRuler.GetName|Y] came into [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] at dusk, unannounced and unaccompanied by heralds, and the magistrates of the province were left scrambling to arrange lodgings and lamplight for a [ROOT.GetCountry.GetRulerTitle|T] that nobody expected to see this far from the capital.\n\nThey need not have troubled themselves. The [ROOT.GetCountry.GetRuler.GetFirstName] declined the banquet and declined the baths, offering muted apologies for refusing the hospitality each time, and asked instead to be taken through the older streets - the ones near the river, where the houses lean against each other and the alleys run out of light long before the sun finishes setting. [ROOT.GetCountry.GetRuler.GetFirstName] insisted that [ROOT.GetCountry.GetRuler.GetSheHe] would find lodging here.\n\nHours later, in a cold, dark room in the corner of a house that was about to collapse, [ROOT.GetCountry.GetRuler.GetFirstName] listened to the province breathing in its sleep - #R thousands#! of hearts, all of them warm, all of them close - and found it very good."
 me_vampire_dominion_1.a:0 "A quiet province, a full larder. Let us begin"

 me_vampire_dominion_2_title:0 "Undead Thralls"
 me_vampire_dominion_2_desc:0 "They were nobody in particular. A ferryman with a bad leg, two brothers who dug clay, a widow who sold bread at the eastern gate, a boy whose name is no longer written anywhere. Five souls out of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y], the sort of people whose absence takes three days to notice and three weeks to report, and when their neighbors finally went looking, what they found in the reeds below the mill was arranged in a way that suggested unhurried, deliberate work.\n\nThe province was still arguing about which bandit gang to blame when the bodies stood up.\n\nThey came out of the dark before the funeral rites were finished, grey-lipped and slack-jawed, moving with the awful patience of men wading through deep water. Their wounds did not bleed, for there was nothing left in them to bleed. They did not speak, and they did not stop, and when the gate-watch put three spears into the ferryman he simply looked down at the shafts standing out of his chest with the mild puzzlement of a man who has forgotten where he left his hat. More rose in the days that followed - from the pauper pits, from the plague-ground, from wherever the province had been careless about its dead. By the end of the week there was a #R column#! of them, pale and shuffling and perfectly silent, drawn up on the field outside the walls like a legion waiting for orders.\n\nThey received them. [ROOT.GetCountry.GetRuler.GetName|Y] walked the ranks at midnight without a torch, and the wraiths turned their ruined faces to follow [ROOT.GetCountry.GetRuler.GetHerHim] the way sunflowers turn. Whatever these things once were, they belong to [ROOT.GetCountry.GetRuler.GetHerHis] now - and unlike the living, they require neither pay, nor bread, nor persuasion, nor sleep."
 me_vampire_dominion_2.a:0 "The dead complain far less than the living"

 me_vampire_dominion_3_title:0 "Cull The Firebrands"
 me_vampire_dominion_3_desc:0 "Every province has its loud men. The advocate who cannot resist a crowd, or perhaps the priest who has decided that courage is a form of piety, or maybe even the worst of all - the retired officer who says at every dinner table exactly what everyone else is thinking - and in [SCOPE.sP('generic_vampire_dominion_target').GetName|Y], there were perhaps thirty such men and women. These firebrands had begun to say the same word to one another in lowered voices, a word that suggests unholy creatures of the night, and it is not a word that [ROOT.GetCountry.GetRuler.GetFirstName] can permit to be spoken aloud twice.\n\nWhat was remarkable was not the killing but the aftermath. No bodies were displayed, no proscription lists were posted in the forum, no soldiers were seen. The province was simply given a week of quiet vanishings and then left to draw its own conclusions, and the conclusions it drew were far more useful than anything a magistrate could have nailed to a wall. Men who had been shouting in the wine-shops on the first day of the month were, by the last, discovering an urgent interest in their own gardens.\n\nThe survivors have learned the lesson that fear teaches better than any tutor; to lower the eyes, to soften the voice, and to remember that in [SCOPE.sP('generic_vampire_dominion_target').GetName|Y], the walls have begun to listen."
 me_vampire_dominion_3.a:0 "Silence is the only oration I wish to hear"

 me_vampire_dominion_4_title:0 "The Midnight Tithe"
 me_vampire_dominion_4_desc:0 "No edict was ever issued. No tax-farmer was ever appointed, no ledger was ever opened, and if you had asked the governor of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] whether a new tribute had been laid upon the province he would have denied it with perfect honesty. And yet by the end of the season, every household from the river quarter to the upper terraces was setting something out on the doorstep before the lamps were doused.\n\nIt began with the wrong sort of coincidences. A cooper who refused to leave his bowl lost three goats in a night, all of them found dry as kindling. A tanner who called the whole business peasant superstition buried his mother that same month, and she had not been ill. A shipwright's family laughed about it over supper, and by the feast of the new moon there was one fewer place set at their table, and the shipwright has not spoken since. The province is not a stupid place. It counted the pattern, and it learned.\n\nSo now they leave what they can spare, and some of them leave what they cannot. A cup of blood from the slaughtering. A lock of hair. A name, written on a shard and weighted with a stone - though nobody will say who taught them to do that, or what happens to the ones whose names are written. The offerings are gone by dawn and the vessels are always returned, washed and stacked neatly, which the old women insist is the most frightening detail of all.\n\nThe #R Midnight Tithe#! costs [ROOT.GetCountry.GetRuler.GetName|Y] nothing to collect and no one at all to enforce, and it is paid more reliably than any levy in the realm. Terror, once properly planted, harvests itself."
 me_vampire_dominion_4.a:0 "They pay gladly. I have never once had to ask"

 me_vampire_dominion_5_title:0 "The Sealed Crypt"
 me_vampire_dominion_5_desc:0 "On the western edge of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y], past the tanneries and the flooded fields, there is a district that appears on no tax survey and in no procession route. A temple stood there once, raised to a god whose name has worn off the lintel, and the ground has been swallowing it for four hundred years - the roof gone, the columns leaning inward like mourners, the whole sunken shrine sitting in a hollow of black water that the marsh refills every spring. The province had agreed, without ever discussing it, to pretend the place was not there.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] bought it, sight unseen, and the seller left the province within the fortnight. The work was done by laborers brought in from elsewhere, who were housed apart and who went home when it was finished, and none of them will speak about what they dug. The old altar floor was lifted. Below it they cut a chamber, and below that another, and the stone that was hauled in for the sealing was the heavy black kind that keeps its cold through the height of summer. There is one door. It is closed from the inside. There are no windows, and no lamps have ever been lit down there, because the occupant has no need of light and would find it disagreeable.\n\nWhat the province noticed was the temperature. The air in that district has gone wrong - a damp, mineral chill that lifts off the ground at sunset and makes your teeth ache, and it spreads a little further outward each year. The children have already made up a rhyme about it. Their parents have already forbidden them to sing it after dark.\n\nNow the [ROOT.GetCountry.GetRulerTitle|T] has a bed that the sun cannot pry into, in stones that will remember every oath sworn above them, and [ROOT.GetCountry.GetRuler.GetSheHe] will still be sleeping there long after everyone who watched it being built is dust."
 me_vampire_dominion_5.a:0 "Let it be sealed. I have all the time in the world..."

 me_vampire_dominion_6_title:0 "A Taste For Politics"
 me_vampire_dominion_6_desc:0 "The provincial council of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] had spent a generation perfecting the art of doing nothing slowly. Eleven men, four factions, three families that had not spoken since a wedding two decades past, and an agenda so thoroughly deadlocked that the aqueduct repairs had been deferred eleven years running. [ROOT.GetCountry.GetRuler.GetName|Y] resolved the matter in a single season, and did it without once raising [ROOT.GetCountry.GetRuler.GetHerHis] voice in the chamber.\n\nThree councilors were bought, which was cheaper than anyone expected. Two were shown documents that they had believed safely burned. One was offered nothing at all, merely visited at home, and thereafter voted whichever way [ROOT.GetCountry.GetRuler.GetFirstName] happened to be looking. And two - the eldest of the obstinate family, and the sharp young magistrate who had begun asking why the [ROOT.GetCountry.GetRulerTitle] never dined - were reported to have died of a fever that visited only their two houses and troubled no one else in the district.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] found the whole business unexpectedly #E delicious#!. Not the blood alone, though ambitious men do carry a richer vintage than shepherds, but the terror underneath it: the particular flavor of a proud man realizing, halfway through a courteous sentence, exactly what is sitting across the table from him. It is a taste that cannot be got from a farmhand.\n\nAnd the province, absurdly, has never been better governed. The aqueduct is repaired. The grain dole arrives on the day it is promised. The remaining councilors attend every session, vote unanimously, and go home before sundown - and if their hands shake a little when they sign, the ink dries just the same."
 me_vampire_dominion_6.a:0 "Order is simply what remains when the arguing stops"

 me_vampire_dominion_7_title:0 "Livestock Found Drained"
 me_vampire_dominion_7_desc:0 "The herdsmen of the district came down to the market at [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] with a story that nobody wanted to hear twice. Twelve head of cattle in one night, upright in the field, still standing in the postures they had died in - and every one of them dry. Not butchered. Not torn. Not opened by wolves or worried by dogs. The hides were unbroken save for two small punctures at the throat, and beneath them the beasts were as hollow and light as paper lanterns, so that a strong man could tip one over with a hand and hear it #E rattle#!.\n\nThe ground beneath them was clean. That is the detail the farmers keep returning to, and it is the one that empties the wine-shops when it is told. There was no blood in the animals and there was no blood in the grass. Something took every drop and left no trace of the taking.\n\nIt has not stopped. Sheep on the high pasture, a plough-team in its own byre with the door still barred from the inside, the fine bay mare that a landowner had brought at ruinous expense from three provinces away. The season's calving has failed. The tanners will not touch the dried hides and the butchers will not touch the meat, and the priests have run out of rites to perform over dead cattle. Farmhands now refuse to sleep near the herds, so the herds are unwatched, so the losses grow.\n\nFrom the wall above the fields, [ROOT.GetCountry.GetRuler.GetName|Y] surveys the ruin of the province's wealth with mild satisfaction. Beast-blood is a coarse vintage, thin and grassy and beneath the dignity of a proper [ROOT.GetCountry.GetRulerTitle] - but it is plentiful, it costs nothing, and no magistrate has ever opened an inquiry over a cow."
 me_vampire_dominion_7.a:0 "A crude vintage - but the herds do not file complaints"

 me_vampire_dominion_8_title:0 "The Mist That Does Not Lift"
 me_vampire_dominion_8_desc:0 "The province of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] has known fog before. It sits low by the river in the autumn, it clings to the fields at dawn, and it burns away by the third hour like fog is supposed to do. What has come over the province now is not that.\n\nIt rises at sunset. It rises from the paving stones themselves, from the dry cobbles of the upper city where there is no water within a mile, welling up out of the ground in slow grey ropes until the streets are filled to the height of a man's chest and the torches at the crossroads are reduced to soft orange smudges hanging in nothing. It has no smell. It is #E cold#! in a way that damp air is not, a still, dead, cellar cold, and it does not drift, because there is no wind inside it - a banner will hang limp in the mist while the flags on the hill above snap and crack in a gale.\n\nMen have begun losing roads they have walked since childhood. A carter who has run the eastern route for thirty years spent an entire night going in circles within sight of his own gate, and swore afterwards that he heard his wife calling him from a direction where no house stands. Two watchmen walked off the quay. The night markets have closed. Mothers count their children at dusk and then count them again, and the sound of the counting carries oddly through the murk.\n\nAnd through all of it walks [ROOT.GetCountry.GetRuler.GetName|Y], unhurried and unerring, because no fog can confuse a predator who made it. [ROOT.GetCountry.GetRuler.GetSheHe] does not need to see the streets of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y]. [ROOT.GetCountry.GetRuler.GetSheHe] can smell every warm thing hiding in them."
 me_vampire_dominion_8.a:0 "Let them stumble. I have never walked more surely"

 me_vampire_dominion_9_title:0 "Wolves At The Treeline"
 me_vampire_dominion_9_desc:0 "The hunters of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] agree on two points and quarrel about everything else. The first is that there are far more wolves in the province than the forest could possibly feed. The second is that they are starving anyway.\n\nThey are wrong-looking animals - too lean for their size, ribs standing out beneath coats gone patchy and grey, and they do not behave as wolves behave. A proper wolf fears fire and hates a crowd and will not come within a bowshot of a village in daylight. These sit at the treeline in the middle of the afternoon, thirty or forty of them, ranked in the shade with their heads level, watching the fields being worked. They do not howl. Hunters who have taken wolves for forty years say that the silence is what turns their stomachs.\n\nThe strays went first, then the dogs, then the goats brought in at night from the outlying farms. In the month since, four shepherds have not come home, a wedding party on the north road was scattered and two of its number were never accounted for, and at the hamlet below the ridge the pack came over a wall - a wall, in the dark, in a body, the way soldiers take a rampart - and carried off a child from a barred house while the whole village beat pots and screamed. The road to the timber country has been abandoned. The outlying farms are emptying. Men go armed to the well.\n\nAnd on the ridge above the treeline, where the pack turns to face [ROOT.GetCountry.GetRuler.GetHerHim] and lowers its heads like courtiers, [ROOT.GetCountry.GetRuler.GetName|Y] is discovering that hunger recognizes hunger, and that the beasts of the field have understood what [ROOT.GetCountry.GetRuler.GetSheHe] is far more quickly than the men have."
 me_vampire_dominion_9.a:0 "They know their master. The people will be slower"

 me_vampire_dominion_10_title:0 "The Crows Never Leave"
 me_vampire_dominion_10_desc:0 "First they took the rooftops, then the porticoes, then the shrines. Now there is not a ledge, lintel, statue, or bare branch in [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] that is not occupied by crows and ravens sitting shoulder to shoulder in their hundreds, and the forum at midday sounds like a battlefield an hour after the battle. Nobody can say where they came from. Nobody can say why they have not moved on. There is no carrion to hold them, and yet they are fat.\n\nThey are also, and this is the part the province cannot forgive, #E attentive#!. A crow will look at you and look away. These do not look away. Merchants opening their stalls find a dozen black heads swiveling in unison to track them across the square. A tax collector counting coins on the temple steps discovered his entire audience had risen onto the balustrade behind him without a sound. The birds foul the altars, drown out the invocations, and settle on the roof of any house where someone lies dying - a full day, the neighbors swear, before the dying begins.\n\nThe priests have tried netting them, poisoning them, and finally beseeching them, and none of the three has made the slightest impression. The augurs, whose whole profession is the reading of birds, have quietly stopped taking commissions; when a man's trade is to find meaning in the flight of crows, and the crows will not fly, there is nothing left to sell but the truth, and the truth is that something is being watched here, and it is not the sky.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] finds the arrangement convenient. There is very little that happens in [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] under an open roof that does not eventually reach [ROOT.GetCountry.GetRuler.GetHerHim], and the birds ask for nothing but the leavings."
 me_vampire_dominion_10.a:0 "A thousand eyes, and not one of them needs paying"

 me_vampire_dominion_11_title:0 "Candlelight Never Flickers"
 me_vampire_dominion_11_desc:0 "The chandlers of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] have never been so rich, and they are the most frightened men in the province, because they know exactly how much wax and oil is being burned between midnight and dawn and they know what it means.\n\nThe dreams began in the river quarter and spread outward through the city like a stain in cloth. They are not the ordinary horrors of a bad winter. They are the same dream, dreamt in the same night by people who have never met - a low room, a door that will not close, and something standing very patiently on the other side of it, waiting to be invited. Men wake with their jaws clenched hard enough to crack teeth. Children wake screaming a name that no adult in the household will repeat. A weaver on the upper terrace hanged herself in the fourth week rather than shut her eyes again, and her neighbors, who did not weep, said only that they understood.\n\nSo the province has stopped sleeping. Every window in the city burns all night, whole streets lit up like a festival that nobody is enjoying, and the people sit at their looms and their benches and their accounts until the sky goes grey, because work is the only thing that keeps the door in the dream from opening. The output of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] has never been higher. The quality of it has never been worse. Men are being crushed under carts they walked in front of with their eyes open. Ledgers are copied twice and both copies are wrong.\n\nAnd [ROOT.GetCountry.GetRuler.GetName|Y] keeps them at it, because a province that does not sleep is a province that cannot conspire, cannot organize, cannot hold a thought in its head for longer than an hour - and exhausted men will agree to almost anything if it means being allowed to sit down."
 me_vampire_dominion_11.a:0 "Let them work. Sleep is a luxury I gave up long ago."

 me_vampire_dominion_12_title:0 "The Pale Retinue"
 me_vampire_dominion_12_desc:0 "They were the finest young people in the province: the sons and daughters of the landowners and the shipping families and the old council houses, the ones raised on horses and rhetoric and expected to inherit [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] in their turn. [ROOT.GetCountry.GetRuler.GetName|Y] received them one at a time, by candlelight, in a room with the shutters drawn, and each of them walked in as an heir and walked out as something else.\n\nThere is no mark on them. That is what breaks their parents. They are courteous, they eat at the family table, they answer to their own names - and they are #R hollow#!, with a stillness behind the eyes that no amount of shouting or weeping will disturb, and at a certain hour of the evening they simply rise and go, and nothing on earth will keep them in the house.\n\nWhat they do afterwards has made the province's roads impassable. They ride in bands of a dozen or more, well-horsed and well-armed with their fathers' money, and they take the caravans on the timber road and the market carts on the river road and the pilgrims going up to the shrine, and they do not merely rob them. A wool merchant who survived by lying in a ditch said that the worst of it was the quiet - no shouting, no boasting, no argument over the spoils, just well-bred children going through the baggage of the dead with the calm of servants clearing a table. Three of the great houses have recognized their own heirs among the raiders and have said nothing, because to name them is to lose them entirely.\n\nSo the elite of the province have been made to arm, feed, and mourn the very brigands who are strangling it, and every one of those brigands answers to a voice that they will follow into the sea if [ROOT.GetCountry.GetRuler.GetFirstName] asks it of them."
 me_vampire_dominion_12.a:0 "Their fathers gave me the province. Their children keep it."

 me_vampire_dominion_13_title:0 "Silence After Dusk"
 me_vampire_dominion_13_desc:0 "A traveler who came into [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] at the wrong hour left this account, and it has been copied in three realms since.\n\nHe reached the gate as the last of the light went out of the sky and found it open, unguarded, and unbarred. Beyond it lay a city of some size - forty thousand souls at least, by the look of the roofs - and it made no sound whatsoever. Not the noise of a city gone to bed, he was careful to write, for a sleeping city still creaks and mutters and barks. This was the silence of a held breath. No dogs. No shutters. No cartwheel on stone, no argument through a wall, no baby, no drunk, no watchman calling the hour, and no light except the thin bars leaking around bolted shutters, thousands upon thousands of them, so that he knew the houses were full of people sitting perfectly still in the dark within arm's reach of him. He walked the length of the main street and heard nothing but his own boots, and he wrote that he began to walk more quietly, and could not have said why.\n\nHe knocked at eleven doors. None opened. At the twelfth a woman's voice on the other side told him, without unbarring it, to get off the street, and would say nothing more no matter how he pleaded. He spent the night beneath a cart. He wrote that shortly after the middle hour something walked past him without hurrying, and that he did not look, and that he has never in his life been so glad of a decision.\n\nBy day, [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] is a province like any other - markets, quarrels, commerce, complaint. At sunset it becomes the private property of [ROOT.GetCountry.GetRuler.GetName|Y], and every living thing in it knows to be indoors, and quiet, and grateful for the walls."
 me_vampire_dominion_13.a:0 "The nights are mine now. They keep them well."

 me_vampire_dominion_14_title:0 "Court Of Whispers"
 me_vampire_dominion_14_desc:0 "There are no informers in the provincial court of [SCOPE.sP('generic_vampire_dominion_target').GetName|Y]. [ROOT.GetCountry.GetRuler.GetName|Y] has never needed to recruit one, and would consider the practice beneath [ROOT.GetCountry.GetRuler.GetHerHim] - informers must be paid, and protected, and eventually believed, and every one of them is a door that can be opened from the other side. It is far simpler to arrange matters so that no one in the room is capable of lying.\n\nThey do not know they are doing it. That is the horror of the thing, for those few clear-headed enough to have noticed. A secretary comes in with a rehearsed half-truth about the grain accounts, and hears his own voice give the whole figure, and the shortfall, and the name of the cousin who took it. A magistrate's wife, asked a pleasantry about the weather, explains at length what her husband said about the [ROOT.GetCountry.GetRulerTitle] over supper and who else was at the table. They walk out into the corridor already forgetting, feeling only that odd lightness of a confession well made, and it is not until much later - sometimes years - that they understand what they left in that room.\n\nThe court has developed its own miserable customs in response. Men write nothing down. Men rehearse nothing, on the theory that a rehearsed lie is what the [ROOT.GetCountry.GetRulerTitle|E] reaches for first. Men have stopped confiding in their wives, their brothers, and their gods, because a secret shared is a secret that will be in that cold room by the end of the month. The province is now governed by people who are afraid to think in the presence of their own governor.\n\nAnd so every plot in [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] dies in the cradle, betrayed by mouths that never meant to speak, and [ROOT.GetCountry.GetRuler.GetFirstName] retires each dawn knowing which lies are worth forgetting and which are worth repeating."
 me_vampire_dominion_14.a:0 "Everything they know, I know. It is a fine arrangement."

 me_vampire_dominion_15_title:0 "The Undying Court"
 me_vampire_dominion_15_desc:0 "It is finished. [SCOPE.sP('generic_vampire_dominion_target').GetName|Y] has given up its blood, its herds, its sleep, its secrets, and its children, and there is nothing further in the province worth the taking. The mist will thin in a few years. The wolves will drift back into the hills. The crows will find some other roof. Two generations from now the whole affair will have shrunk down to a set of stories that the grandmothers tell badly and the young men laugh at, and the laughing will stop only when someone asks why the western district is still empty, and why nobody has ever unsealed the black door beneath the sunken temple.\n\nBut [ROOT.GetCountry.GetRuler.GetFirstName] does not intend to leave the province ungoverned, and a wise [ROOT.GetCountry.GetRulerTitle] does not build a thing only to abandon it. On the last night, three of the court were invited to attend [ROOT.GetCountry.GetRuler.GetHerHim] alone - trusted people, useful people, people who had proven over the long season that they possessed the two qualities that matter: obedience, and a strong stomach. They were told what was being offered. It is not recorded that any of them refused.\n\nThey will be ill for a month. Their families will sit up with them and pray, and mourn a little when the fevers come, and rejoice when the fevers break - and then, slowly, over a year or two, the households will begin to notice small things. That the windows are shuttered at odd hours. That there is never any appetite at the table. That whatever else time is doing to the rest of us, it appears to have forgotten about them entirely.\n\n[ROOT.GetCountry.GetRuler.GetFirstName] departs at moonrise, sated, sharper, and stronger than [ROOT.GetCountry.GetRuler.GetSheHe] has been in a century, and leaves behind an #R Undying Court#! that will hold this ground long after every living soul who feared it has gone into the earth. Mortal dominions are inherited. This one will simply never change hands."
 me_vampire_dominion_15.a:0 "Rise. The night is long, and we shall see all of it."

 me_vampire_dominion_2_tooltip:0 "#R Five#! #Y pops have been taken from the most populous settlement in the state.#!\n#Y A host of#! #R Undead Wraiths#! #Y has risen at#! [SCOPE.sP('generic_vampire_dominion_capital').GetName|T]#Y , led by a deathless commander.#!"
