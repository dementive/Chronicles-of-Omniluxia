l_english:

 # Ambition name and description
 scheme_mana:0 "Scheme: Mana"
 scheme_mana_desc:0 "This character will spend the coming year in focused magical study, accepting a steady Health penalty in exchange for recurring Mana breakthroughs and a final burst of magical energy."

 # Character interaction
 pick_mana_ambition:0 "Scheme: Mana"
 pick_mana_ambition_act:0 "Begin Mana Gathering"
 pick_mana_ambition_past:0 "Began Mana Gathering"
 pick_mana_ambition_tooltip:0 "[target.GetName] will lose #R -0.25#! Health each month until the Scheme ends.\n[target.GetName] may gain #G +5#!, #G +15#!, or #G +25#! @magic_influx! from meditation events during the Scheme.\nUpon completion, [target.GetName] will gain #G +20#! @magic_influx!."
 pick_mana_ambition_not_max_tt:0 "This character's Mana is not already near maximum."
 scheme_mana_has_tt:0 "Has the Mana scheme active."

 # Finish tooltip
 scheme_mana_finish_tt:0 "Completes the Mana scheme, gaining #G +20#! @magic_influx!."

 # Mana gain tooltips
 scheme_mana_gain_5_tt:0 "Gain #G +5#! @magic_influx!"
 scheme_mana_gain_15_tt:0 "Gain #G +15#! @magic_influx!"
 scheme_mana_gain_25_tt:0 "Gain #G +25#! @magic_influx!"

 # Monthly events
 scheme_mana.1_title:0 "Focused Meditation"
 scheme_mana.1_desc:0 "[scope:actor.GetName] withdraws from the world's distractions, spending long hours in arcane meditation. The effort is rewarded: magical energy flows steadily back into [scope:actor.GetHerHis] reserves."
 scheme_mana.1.a:0 "The mind is a vessel — and it fills."

 scheme_mana.2_title:0 "Deep Trance"
 scheme_mana.2_desc:0 "[scope:actor.GetName] enters an unusually deep trance, losing all sense of time as [scope:actor.GetSheHe] communes with raw magical currents. When [scope:actor.GetSheHe] surfaces, [scope:actor.GetHerHis] reserves are significantly replenished."
 scheme_mana.2.a:0 "Power surges through me."

 scheme_mana.3_title:0 "Interrupted Study"
 scheme_mana.3_desc:0 "Duties and petitioners interrupt [scope:actor.GetName]'s studies before [scope:actor.GetSheHe] can achieve any great breakthrough. Still, even a brief session yields a trickle of recovered energy."
 scheme_mana.3.a:0 "Every moment counts."
