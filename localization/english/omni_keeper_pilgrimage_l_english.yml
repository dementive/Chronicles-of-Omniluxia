l_english:
 omni_open_pilgrims_book:0 "Open the Pilgrims' Book"
 omni_open_pilgrims_book_desc:0 "The keepers at #G Kyaxares#! take down the names of those who come to the grave of #Y Jaoz#! and what they leave for the road. Once in five years the Elder hears from the people who see to the travelers between the gates and the tomb."
 omni_keeper_pilgrimage_tomb_tt:0 "Directly own #G Kyaxares#!, where #Y Jaoz#! is buried."
 omni_keeper_pilgrimage_ready_tt:0 "The Pilgrims' Book has not been opened in the last #Y 5 years#!."
 omni_keeper_pilgrimage_open_tt:0 "Open the Pilgrims' Book and decide how to spend the offerings. This decision is available once every #Y 5 years#!."
 omni_keeper_pilgrimage.1.desc:0 "When the Elder opened the book at #G Kyaxares#!, the captain of the road watch and the keeper of the hospice both laid down a receipt for the same mule. The captain said it had carried grain to the watch posts all winter, and the hospice keeper said it had brought pilgrims up from the lower gate on the days the captain had no grain to send. The clerk checked both receipts and found that the only thing anyone had paid for was the mule's fodder.\n\nThe captain asks for silver to bring back the men he sent home when their pay ran out, while the hospice keeper has brought a list of villages where travelers have been sleeping in the byres. The toll clerk says the road would be easier on everybody if we paid the gatekeepers what they were owed and let the pilgrims through without a charge. He has brought his own receipt, which the Elder asks him to keep until the others have been read."
 omni_keeper_pilgrimage.1.a:0 "Pay the watches and call up their riders."
 omni_keeper_pilgrimage.1.a_tt:0 "Muster #Y 2 Light Cavalry cohorts#! at #G Kyaxares#!. Our fortified territories in the #G Golden Foothills#! gain #G +20%#! Fort Defense for #Y 3 years#!."
 omni_keeper_pilgrimage.1.b:0 "Open a hospice where the roads have grown hard."
 omni_keeper_pilgrimage.1.b_tt:0 "[SCOPE.sP('omni_keeper_hospice_site').GetName|Y] gains #G +3#! Local Migration Attraction for #Y 3 years#!, and its province gains #G 15#! loyalty."
 omni_keeper_pilgrimage.1.c:0 "Pay the gatekeepers and let the pilgrims through."
 omni_keeper_pilgrimage.1.c_tt:0 "Gain #G +5%#! Local Population Happiness in our territories in the #G Golden Foothills#! for #Y 3 years#!."
 omni_keeper_pilgrimage.1.d:0 "Close the book until we have the silver."
 omni_keeper_road_watch_mod:0 "Paid Road Watch"
 omni_keeper_hospice_mod:0 "Pilgrims' Hospice"
 omni_keeper_toll_remission_mod:0 "Pilgrim Tolls Remitted"
 omni_keeper_open_gates_mod:0 "Open Gates for Pilgrims"
