l_english:
 item_artifact_Cyrogley_crown_of_eagalia_modifier:0 "Crown of Ytalia"
 desc_item_artifact_Cyrogley_crown_of_eagalia_modifier:0 "Forged in the legendary fires of ancient Eagalia, this majestic crown is said to grant its wearer the wisdom and authority of the long-lost rulers of Ytalia."
 item_artifact_treasure_axe_of_Fiorinoes_modifier:0 "Axe of Nuvian"
 desc_item_artifact_treasure_axe_of_Fiorinoes_modifier:0 "A devastating weapon once wielded by the great Nuvian. Its heavy blade is etched with runes that still seem to glow with a faint, otherworldly heat."
 item_artifact_treasure_Dunydurcerg_royal_scale_modifier:0 "Dragonscale Medal"
 desc_item_artifact_treasure_Dunydurcerg_royal_scale_modifier:0 "Cast from the iridescent scales of a fallen drake, this royal medal signifies indomitable courage and commands absolute respect from both friend and foe."
 item_artifact_treasure_krak_diadem_modifier:0 "Diadem of Zehi"
 desc_item_artifact_treasure_krak_diadem_modifier:0 "An elegant diadem once worn by the enigmatic Zehi. It is cold to the touch and whispers faint prophecies to those who listen closely."
 item_artifact_treasure_spear_krak_modifier:0 "Spear of Lehi"
 desc_item_artifact_treasure_spear_krak_modifier:0 "A beautifully balanced spear with a point that never dulls. Legends claim it was blessed by Lehi himself to always strike true."
 item_artifact_treasure_Shield_krak_modifier:0 "Grom-Face Shield"
 desc_item_artifact_treasure_Shield_krak_modifier:0 "Bearing the terrifying visage of Grom, this heavy bronze shield is designed not just to deflect blows, but to paralyze enemies with fear."
 item_artifact_treasure_grom_axe_modifier:0 "Grom Axe"
 desc_item_artifact_treasure_grom_axe_modifier:0 "A crude but brutally effective weapon, this heavy axe was favored by the fearsome Groms to shatter both enemy shields and their resolve."
 item_artifact_treasure_lech_cape_modifier:0 "Lehi's Cape"
 desc_item_artifact_treasure_lech_cape_modifier:0 "Woven from mysterious, weightless threads, this dark crimson cape belonged to the fabled Lehi and is said to bring good fortune in battle."
 item_artifact_treasure_ros_bow_modifier:0 "Ros bow(Rus)"
 desc_item_artifact_treasure_ros_bow_modifier:0 "An ancient composite bow of remarkable tension. Only the strongest archers can draw its string, unleashing arrows with terrifying velocity."
 item_artifact_treasure_zehia_horse_saddle_modifier:0 "Zehi horse saddle"
 desc_item_artifact_treasure_zehia_horse_saddle_modifier:0 "Crafted from perfectly preserved leather and silver, this saddle allows a rider and their mount to move as one, defying fatigue."
 item_artifact_treasure_martyr_modifier:0 "Martyr's Sword"
 desc_item_artifact_treasure_martyr_modifier:0 "Stained with the blood of a forgotten saint, this holy blade burns with righteous fury when drawn against the wicked."
 item_artifact_treasure_wolf_tooth_modifier:0 "Wolf Tooth Necklace"
 desc_item_artifact_treasure_wolf_tooth_modifier:0 "A primal talisman strung with the fangs of an alpha wolf. It is believed to grant the wearer the ferocity and cunning of a wild predator."
 item_artifact_treasure_eternity_shield_modifier:0 "Shield of Eternity"
 desc_item_artifact_treasure_eternity_shield_modifier:0 "A flawless shield forged from an unknown, indestructible alloy. Time itself seems to flow differently around its polished surface."
 item_artifact_treasure_invisible_ring_modifier:0 "Invisible Ring"
 desc_item_artifact_treasure_invisible_ring_modifier:0 "A masterwork of arcane deceit, this simple band is rumored to obscure the wearer from the sight of their enemies—or perhaps just their creditors."
 item_artifact_treasure_flame_chalice_modifier:0 "Chalice of Flame"
 desc_item_artifact_treasure_flame_chalice_modifier:0 "A golden goblet that constantly radiates warmth. Any liquid poured into it begins to boil, making it a favorite among priests of fire."
 item_artifact_treasure_agony_band_modifier:0 "Band of Agony"
 desc_item_artifact_treasure_agony_band_modifier:0 "An oppressive iron circlet that inflicts a dull ache upon the wearer, supposedly sharpening their focus and punishing any weakness."
 item_artifact_treasure_fire_fleece_modifier:0 "Fleece of Fire"
 desc_item_artifact_treasure_fire_fleece_modifier:0 "A mystical cloak seemingly woven from embers. It warms the body and invigorates the spirit, burning those who dare touch the wearer."
 item_artifact_treasure_mending_cloak_modifier:0 "Mending Cloak"
 desc_item_artifact_treasure_mending_cloak_modifier:0 "A rare garment stitched with restorative enchantments. Minor cuts and bruises are said to slowly knit themselves back together while it is worn."
 item_artifact_treasure_primal_maul_modifier:0 "Primal Maul"
 desc_item_artifact_treasure_primal_maul_modifier:0 "A massive, unwieldy hammer carved from a single piece of ancient stone. It takes tremendous strength just to lift, let alone swing."
 item_artifact_treasure_arcane_doomblade_modifier:0 "Arcane Doomblade"
 desc_item_artifact_treasure_arcane_doomblade_modifier:0 "A weapon steeped in dark magic, its obsidian edge hums with a menacing frequency. It is a blade meant only for executing the most profound ambitions."
 item_artifact_treasure_dragon_blade_modifier:0 "Dragon's Iron Blade"
 desc_item_artifact_treasure_dragon_blade_modifier:0 "Forged in the legendary heat of a dragon's breath, this heavy iron sword cleaves through conventional armor as if it were parchment."
 item_artifact_treasure_sword_rebels_modifier:0 "Rebels Of The Sword"
 desc_item_artifact_treasure_sword_rebels_modifier:0 "A renowned blade passed down among the leaders of a famous uprising. It is a symbol of defiance that rallies commoners to the cause of liberty."
 item_artifact_treasure_nuvians_robe_orcanite_modifier:0 "Nuvian's Robe"
 desc_item_artifact_treasure_nuvians_robe_orcanite_modifier:0 "A flowing garment once draped over the shoulders of Nuvian. The rich fabric seems to shift in color depending on the light."
 item_artifact_treasure_sword_of_artheousan_modifier:0 "Sword of Artheousan"
 desc_item_artifact_treasure_sword_of_artheousan_modifier:0 "A magnificent longsword bearing the royal crest of Artheousan. It is said to sing a low, inspiring note when swung in righteous combat."
 item_artifact_treasure_ascendic_diadem_modifier:0 "Ascendic Diadem"
 desc_item_artifact_treasure_ascendic_diadem_modifier:0 "A crown representing the ultimate divine right to rule. It is believed to elevate the wearer's mind, opening their thoughts to the heavens."
 item_artifact_treasure_ring_of_feelings_modifier:0 "Ring of Feelings"
 desc_item_artifact_treasure_ring_of_feelings_modifier:0 "An unusual band containing a gemstone that changes hue based on the immediate emotional state of those standing nearby."
 item_artifact_treasure_hobgob_droitra_dagger_modifier:0 "Silver Droitra Dagger"
 desc_item_artifact_treasure_hobgob_droitra_dagger_modifier:0 "A wicked, curved blade heavily coated in silver. Often used in dark rituals, it is incredibly effective at slipping past conventional defenses."
 item_artifact_treasure_kinone_bowl_of_plenty_modifier:0 "Never-Empty Bowl"
 desc_item_artifact_treasure_kinone_bowl_of_plenty_modifier:0 "A seemingly ordinary wooden bowl that, according to myth, will always provide enough sustenance to keep a starving traveler alive."
 item_artifact_treasure_sword_of_the_victory_goddess_modifier:0 "Sword of the Victory Goddess"
 desc_item_artifact_treasure_sword_of_the_victory_goddess_modifier:0 "Blessed by the divine patron of triumph, this radiant weapon is a beacon of hope on the battlefield, practically guaranteeing martial success."
 item_artifact_treasure_helm_of_the_mother_warrior_modifier:0 "Helm of the Mother Warrior"
 desc_item_artifact_treasure_helm_of_the_mother_warrior_modifier:0 "A protective helm celebrating the fierce, protective spirit of the Mother. It grants the wearer unparalleled resilience when defending their kin."
 item_artifact_treasure_roldalls_shield_modifier:0 "Roldall's Shield"
 desc_item_artifact_treasure_roldalls_shield_modifier:0 "The legendary bulwark of Roldall, renowned for withstanding a dozen blows that would have shattered any ordinary defense."
 item_artifact_iron_crown_of_herue_modifier:0 "Iron Crown of Herue"
 desc_item_artifact_iron_crown_of_herue_modifier:0 "A stark, unadorned iron circlet. It eschews worldly wealth to symbolize the unyielding, iron-willed rule of the ancient kings of Herue."

 omni_artifacts.1.t:0 "Reliquary Hoard"
 omni_artifacts.1.desc:0 "Our country's vast reliquary contains artifacts of immense power. Which relic shall the ruler bear?"
 omni_artifacts.2.t:0 "Return to Reliquary"
 omni_artifacts.2.desc:0 "The burden of power is great. Which artifact shall be returned to the national hoard?"

