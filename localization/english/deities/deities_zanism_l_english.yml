l_english:
 ## the_first_emperor ##
 deity_first_emperor:0 "$omen_first_emperor$"
 omen_first_emperor:1 "Zanis"
 omen_first_emperor_desc:4 "#T Zanis#! was an #Y Eageli-Zani#! general who invaded and conquered all of #T Luxterra#!. It is said he looked to the horizon and asked why it did not belong to him, before claiming that very horizon by the right of conquest. His name literally means 'the one of the people,' and thus, the #Y Geallian#! people regard #T Zanis#! as a demi-god who will protect them in times of need. Despite his #Y Eageli#! origin, the Empire became a unifying force for all #Y Geallian#! people. The new #Y Zanic#! people wish to once more capture the brilliance of #R Zanis#! the Great and his empire."

 deity_sol:0 "$omen_sol$"
 omen_sol:0 "Cyrogelos"
 omen_sol_desc:0 "#Y Cyrogelos#! was a #Y Ytali#! general who aided the great #Y Emperor#! #R Zanis#!. First, as a knight, the noble #Y Cyrogelos#! defended the general #R Zanis#! in the face of a mutiny by the soldiers. In honor of this ultimate test of loyalty, when #R Zanis#! became the king, he appointed #Y Cyrogelos#! to be the head of the army. Upon the conquest of his people, #Y Cyrogelos#! became the King of the #Y Ytali#! who served under the now First #Y Emperor#!, #R Zanis#!."

 deity_minerva:0 "$omen_minerva$"
 omen_minerva:1 "Mina"
 omen_minerva_desc:4 "#Y Mina#! is a goddess of wisdom and tactics. It is said that she blessed the First #Y Emperor#! #R Zanis#! before his battle against the #Y Baetepi#!. After the battle, #R Zanis#! sacrificed three camels and one elephant to #Y Mina#!, paying gratitude for the blessing of battle genius.\n\n#Y Mina#! was not originally a #Y Geallian#! goddess, and became part of the pantheon during the #T Classical Geallian Age#! from the mixture of #Y Geallian#! and #Y Illorian#!."

 deity_mercurio:0 "$omen_mercurio$"
 omen_mercurio:1 "Lupegen"
 omen_mercurio_desc:4 "#Y Lupegen#! is the primordial god of wolves. Originating from #Y Pre-Geallian#! beliefs, #Y Lupegen#! made an impression on the incoming #Y Geallian#!, who adopted him into their pantheon. In fact, belief in #Y Lupagen#! continued strongly up past the #T Imperial Zani#! age. #R Zanis#! himself was said to keep a the company of a wolf during his hunts in his time as a general. In modern #Y Zanic#! culture, #Y Lupegen#!'s foreign origins are long lost, and remains a quintessential #Y Zanic#! god."

 deity_ceresia:0 "$omen_ceresia$"
 omen_ceresia:1 "Wishtheon"
 omen_ceresia_desc:4 "Better known in other pantheons where he is the supreme deity, #G Wishtheon#! is the most prominent god of the #Y Proto-Omniluxian#! people. In most #Y Geallian#! cultures he is known as the greatest of all the gods, however he is not actively worshipped as much as other deities. This is because #G Wishtheon#! is seen as a primordial god, and therefore, not present in mortal affairs. Despite this, he surged in popularity once again when #Y Emperor#! #R Zanis#! shouted at the highest point of his Empire '#G Wishtheon#!, are you watching?'"

 deity_plutoni:0 "$omen_plutoni$"
 omen_plutoni:1 "Renn"
 omen_plutoni_desc:4 "#Y Renn#! in #Y Zanic#! folklore is the god of the dead and the guide of spirits. Likely influenced from the #Y Baetepi#! god #G Annis#!, #Y Renn#!'s best known story involves the guidance of #R Zanis#! after his passing:\n\n#Y Renn#! asked #R Zanis#! if he thought he deserved to be let into the realm of the dead. #R Zanis#! said no, stating that since he had caught the horizon of the mortal plain, he should be offered the chance to catch the horizon of the divine plain. #Y Renn#!, impressed with the #Y Emperor#!'s ambition, allowed #R Zanis#! to enter the divine plain, where he ascended to the status of a demi-god."

 deity_jupiteri:0 "$omen_jupiteri$"
 omen_jupiteri:1 "Onge"
 omen_jupiteri_desc:4 "Known to the #Y Geallians#! as #Y Onge#!, the #G Father of Stone#! can be found throughout #Y Proto-Omniluxian#! peoples' beliefs. The father of #T Dwarves#!, he was helped in this endeavor by his counterpart, the #G Mother of Earth#!, #G Ange#!. To the #Y Zanic#! people, #Y Onge#! is considered a primordial God, and is not usually worshipped directly."
 
 deity_fortuna:0 "$omen_fortuna$"
 omen_fortuna:1 "Ange"
 omen_fortuna_desc:4 "Known throughout the lands by different names, #G Ange#! is the #G Mother of Earth#! fond throughout #Y Proto-Omniluxian#! peoples' beliefs. She is said to have given birth to all living matter, including #T Elves#!, the #G Zerywany#!, and, of course, #T Humans#!. In #Y Zani#! beliefs, #G Ange#! is sometimes said to be the mother of #R Zanis#!. In other mythes, she simply blesses #R Zanis#! to rule over all her creations."

 deity_wisheamu:0 "$omen_wisheamu$"
 omen_wisheamu:1 "Wisheamu Wachumagel"
 omen_wisheamu_desc:4 "Known to the #G Geallians#! as #Y Wishmeau Wachumagel#!, the elusive #R Lord of Time#! is especially revered by the descendants of #T Zanis#! and Sumun. Credited with dominion over the days, the #G Luxterran Calendar#!, and the seasons, Wishmeau is often considered one of the most powerful #Y Zanic#! gods, and is often tied to the pursuit of immortality."

 deity_sumun:0 "$omen_sumun$"
 omen_sumun:1 "Sumun"
 omen_sumun_desc:4 "The legendary founder of the #T Eagelian Kingdom#!, Sumun is credited with uniting the Eagelian peoples under one banner. An excellent statesman, he oversaw the introduction of the #G Luxterran Calendar#!, the renewed worship of #Y Wisheamu Wachumagel#! and #Y Mina#!, and the expansion of Eagelian influence as his kingdom became a local power."

 deity_mares:0 "$omen_mares$"
 omen_mares:1 "Mares"
 omen_mares_desc:4 "The great #T God of War#!, #R Mares#! represents the violence, anger, and vengeance experienced by the #Y Geallians#! in the unending conquests of the #T Zani Empire#!. Worshipped for his strength, #R Mares#! is said to appear to soldiers close to death, granting them his strength so they may fall in battle with honor.\n\nWhile there are those who claim that he originates as an #Y Illorian#! god, the #Y Geallian#! faithful vehemently argue that he has been worshipped by them since the time of the #Y Geallian League#!."



 ## Generic ##
 deity_deified_ruler_desc:0 "This character was once a mere mortal but is now considered a god. Now, [CHARACTER.GetSheHe] is worshiped in a way that resembles that of [DEITY.GetDeityType.GetName|Y] but will also grant additional benefits when [CHARACTER.GetHerHis] omen is invoked."