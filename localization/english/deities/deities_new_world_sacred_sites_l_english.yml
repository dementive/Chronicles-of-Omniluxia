l_english:
 deity_nw_sixfold_ancestor:0 "$omen_nw_sixfold_ancestor$"
 omen_nw_sixfold_ancestor:0 "The Sixfold Ancestor"
 omen_nw_sixfold_ancestor_desc:0 "In Luthrhunith, six ancestral effigies face a single hearth. The Jade Dwarves teach that their lineages descend from all six children of the Stone Father, and that no clan can prosper by forgetting the others. The Sixfold Ancestor is their shared image of this sacred kinship: an oath to build together and stand together."
 nw_jade_oathstone:0 "Oathstone of the Six Hearths"
 nw_jade_oathstone_desc:0 "Six interlocking tablets of green stone surround a hollow for the embers of an ancestral hearth. Each tablet bears a different lineage-mark; the priests insist that an oath sworn upon only one is no oath at all. Muster-rolls and reconciliations are sealed before the assembled stones."
 deity_nw_returning_beacon:0 "$omen_nw_returning_beacon$"
 omen_nw_returning_beacon:0 "The Beacon That Waits"
 omen_nw_returning_beacon_desc:0 "Above Eresteria's cothon, the faithful keep a beacon burning for Na'athran's return. Its light is both a sacred promise and a practical guide through the coastal shoals. Harbor-wardens pray that every vessel brought safely home is one more watch faithfully kept before the emperor comes again."
 nw_lantern_last_watch:0 "Lantern of the Last Watch"
 nw_lantern_last_watch_desc:0 "The sea-darkened lantern is said to have passed from watch-captain to watch-captain without its inner flame ever being extinguished. Its keepers mix fresh oil beneath the old, refusing to let one generation's vigil end before the next has begun. Pilots and pilgrims alike offer thanks before its light."
 deity_nw_first_spore:0 "$omen_nw_first_spore$"
 omen_nw_first_spore:0 "The First Spore"
 omen_nw_first_spore_desc:0 "The priest-gardeners of Yokoshkyo preserve a lineage of spores that they believe reaches back to the first awakening of Kagayamashko. Within the Imperial Canon, every new bloom is another mind awaiting reunion with the whole. Offerings of grain and living mycelium are laid beneath the sanctuary's open crown."
 nw_amber_first_bloom:0 "Amber of the First Bloom"
 nw_amber_first_bloom_desc:0 "A clear bead of amber encloses a branching filament, suspended within a circlet of living fungus. Imperial gardeners call it a memory of the First Bloom. Its custodians use the relic as a focus when blessing granaries and teaching young mages to listen to the communal mind."
 deity_nw_sleeper_everywhen:0 "$omen_nw_sleeper_everywhen$"
 omen_nw_sleeper_everywhen:0 "The Sleeper Between Ages"
 omen_nw_sleeper_everywhen_desc:0 "The dream-keepers of Mimgong speak of a sleeper encountered in Ijminga who remembers both the first ancestor and the last descendant. No two witnesses agree upon the sleeper's face. Those who rest upon the summit of the Steps of the Everywhen seek counsel across the ages, then return to compare their visions with the living."
 nw_mask_unborn_ancestor:0 "Mask of the Unborn Ancestor"
 nw_mask_unborn_ancestor_desc:0 "One side of this bark mask bears the lined face of an elder; the other remains smooth and uncarved. Dream-keepers lend it to those seeking ancestors in Ijminga, teaching that some of the wisest guides may belong to generations yet unborn. Their accounts are preserved beside the mask for scholars and initiates."
