l_english:
 ## kuulvaal ##
 deity_wekuaa:0 "$omen_wekuaa$"
 omen_wekuaa:0 "Wekuaa"
 omen_wekuaa_desc:4 "#G Wielkopan#!, known to the #Y Gnomes#! as #Y #G Wekuaa#!#!, is their one and only true god. The creator of their race, the #Y Gnomes#! offer him daily prayers to thank and honor him for their continued survival in their glaciel cities, hoping that one day he will send them a #Y #Y Messiah#!#! to deliver them back to #Y #G Jaaltuvsk#!#!!"

 deity_akoo:0 "$omen_akoo$"
 omen_akoo:0 "Åkoo"
 omen_akoo_desc:0 "#T Åkoo#!, the #R Taalvut of War#!, fights alongside his people when they pray for his guidance. Said to have revealed the secrets of #Y Projection Magic#! to the #Y Jemskoo#!, #T Åkoo#! is seen as an inspiring figure who protects #Y Gnomish#! warriors in battle."

 deity_maa:0 "$omen_maa$"
 omen_maa:0 "Maa"
 omen_maa_desc:4 "Icons of #Y Maa#!, the #Y #G Taalvut of Craftsmen#!#!, can be found across workshops in every #Y Gnomish#! city. He encourages values of self-reliance and artistic beauty amongst the #Y Gnomish#! craftsmen, and those who pray to him insist on pricing their goods fairly to both compensate their hard work and allow the customer to appreciate their artistry."

 deity_taavku:0 "$omen_taavku$"
 omen_taavku:0 "Taavku"
 omen_taavku_desc:4 "Icons of the warlike #T Taavku#!, #Y #Y Taalvut of the Winter#!#!, are often held in pendants of warriors who seek his strength. Unlike the inspiring and warm #Y #R Åkoo#!#!, #Y #T Taavku#!#! is cold and pragmatic, with her followers extolling discipline over all other virtues."

 deity_dverkuu:0 "$omen_dverkuu$"
 omen_dverkuu:0 "Dverkuu"
 omen_dverkuu_desc:4 "#Y Dverkuu#!, #Y #T Taalvut of Music#!#! is a patron of #Y Gnomish#! music and the inventor of the #Y Snoorskut#!, a brass instrument similar to a saxophone. Musicians often carry a pendant carrying his icon inside hoping that he will bless them during performances."

 deity_puaaku:0 "$omen_puaaku$"
 omen_puaaku:0 "Puaaku"
 omen_puaaku_desc:4 "#Y Puaaku#!, #Y #Y Taalvut of Pacts and Agreements#!#! is one of the most important angels to the #Y Gnomish#! people. When merchants or diplomats meet to discuss agreements or make trades, they often do it in a room with his icon overhead, to assure that all deals made are beneficial to both parties."

 deity_guual:0 "$omen_guual$"
 omen_guual:0 "Guual"
 omen_guual_desc:4 "#Y Guual#!, the #Y #G Taalvut of the Hearth#!#! is one of the most popular angels amongst both the common people and the priesthood. Her iconography covers the walls of many #Y Vaals#!, or temples, and it is popular tradition to offer her a piece of ones meal by throwing it into a nearby fireplace in hopes that she will bless the city's #Y Iaawu Hearth#! with a strong glow this season."
 
 deity_bvulaar:0 "$omen_bvulaar$"
 omen_bvulaar:0 "Bvulaar"
 omen_bvulaar_desc:4 "The #Y Taalvut of Summer#!, #Y Bvulaar#!, is often celebrated during the #Y Waa Festival#! held on the summer solstice. Devout followers of #G Wekuaa#! often ask her to help persuade him to extend the brief northern summers as long as possible, which are a bright and warm respite in their icy homelands."

 deity_tuaal:0 "$omen_tuaal$"
 omen_tuaal:0 "Tuaal"
 omen_tuaal_desc:4 "#Y Tuaal#!, the beloved #Y #G Taalvut of Peace#!#!, can be found in every #Y Gnomish#! household as well as every #Y Gnomish#! #Y Vaal#!, where his icons stand as a hopeful reminder that peace, safety, and growth will always follow war, death, and destruction."

 ## Generic ##
 deity_deified_ruler_desc:0 "This character was once a mere mortal but is now considered a god. Now, [CHARACTER.GetSheHe] is worshiped in a way that resembles that of [DEITY.GetDeityType.GetName|Y] but will also grant additional benefits when [CHARACTER.GetHerHis] omen is invoked."