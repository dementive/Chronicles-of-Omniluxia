l_english:
 ## helluvian ##
deity_opeliaz:0 "$omen_opeliaz$"
omen_opeliaz:0 "Yvius O-Peliaz"
omen_opeliaz_desc:0 "The humble hero of the #Y Kainaxari#! faithful, #Y O-Peliaz#! was a champion of the people who defended and expanded helluvian communities across #G Kainaxarthos#!.\n\nBorn in #G Susdepun#! to a local noble family, #Y O-Peliaz#! was driven to the egalitarian teachings of #Y Helluvians#! after spending his childhood witnessing the cruel reality of slave life on his family's #Y Amsinenn#!. Named a #T Yvius#! in 732 LC for his near obsessive devotion to the faith, he traveled to the far ends of the #Y Nazani Empire#! to support the persecuted #T Helluvian#! communities of northern #G Kainaxarthos#!, where he exceeded expectations and spread the word of #T Hellas#! across the entire province.\n\nWhen his city of #G Bubdonno#! was attacked by #Y Nazani#! soldiers, he organized a local militia that drove the emperor's inquisitors out of the city, inspiring local 'Holy Militias' that would challenge #Y Nazani#! authority in the region until the arrival of the #Y Sovenerians#! long after his execution."

deity_hellas:0 "$omen_hellas$"
omen_hellas:0 "Hellas"
omen_hellas_desc:0 "The #Y 'Creator of All Things That Can Never Be Known'#!, often referred to as #G 'Hellas'#! or '#T Great Father#!', is the sole god of the #T Helluvian#! faith. He is revered as a merciful deity who created all creatures in his image, making him very popular amongst both humans as well as other intelligent races. He is all-powerful and omni-present, watching over his children and allowing the faithful who repent their sins into his heaven, where they may enjoy eternal peace."

deity_helluvius:0 "$omen_helluvius$"
omen_helluvius:0 "Helluvius"
omen_helluvius_desc:0 "Born in #G Ka-Shorrnnurr#!, #G Helluvius#! was the great prophet who preached the word of #G Hellas#! to the people of #Y Northern Luxterra#!. The semi-divine child of #G Hellas#!, he allowed himself to be burned at the stake by the #R Zani#! at #G Ddu-Nuinop#! to save the souls of all intelligent beings. The scriptures say he burned for 3 days, and on the third day his ashes were gathered and preserved by his followers who were protected from the explosion that caused the #R Great Collapse#!, with his spirit defending their homes and farms from smoke, toxic rains, and disease."

deity_balthazar:0 "$omen_balthazar$"
omen_balthazar:0 "Yvius Balthazar"
omen_balthazar_desc:0 "Born near #G Erdutegh#!, young #Y Balthazar#! grew up in one of the first #T Helluvian#! communities in #Y Werhen#!. Intending to trained as a priest, he left his village to learn from the clergy at #G Ddu-Nuinop#!, where he stood out amongst his peers due to his magnetic personality and linguistic abilities. His abilities were rewarded when the #T Shannah#! named him a #T Yvius#!, and tasked him with converting the #Y Norrfalie#!. Once he arrived, he quickly befriended and rallied the local tribes against the satanic #Y Drow#!, who ruled over much of #G Norrfalia#! at the time, beginning the #G Svardenni#!, or Reconquest, of the north."

deity_vadar:0 "$omen_vadar$"
omen_vadar:0 "Vadar"
omen_vadar_desc:0 "Vadar is a deity of War"

deity_uttarasmake:0 "$omen_uttarasmake$"
omen_uttarasmake:0 "Uttarasmake the Great"
omen_uttarasmake_desc:0 "The legendary founder of the #T Soventeir Empire#!, #T Uttarasmake the Great#! is revered like a god amongst his people, especially those that still cling onto old rites.\n\nWhile most #Y Helluvians#! view him as a saint-like figure for taming the savage #Y Dragkhans#! and ending their demonic rituals, rumors persist that claim the great emperor never truly converted, and kept ivory idols close to his chest until the end of his days."

deity_vimies:0 "$omen_vimies$"
omen_vimies:0 "Vimies"
omen_vimies_desc:0 "Vimies is a deity of Fertility"

deity_norraksgaelg:0 "omen_norraksgaelg"
omen_norraksgaelg:0 "King Norraksgaelg"
omen_norraksgaelg_desc:0 "Legendary founder of the #Y Walandottir#! dynasty, King Norraksgaelg was a helluvian convert who rallied the humans of #G Herue#! under his banner during the #G Svardenni#!. During his campaigns he conquered much of modern #G Herue#! from the #Y Drow#! kingdom of Iolsim, founding the #G Kingdom of Herue#! atop the ruins of their old capital, which he renamed #G Dawaon#!. For many across #G Herue#!, Norraksgaelg remains a popular folk hero, and for those who still cling on to the old ways he is worshipped as a semi-divine figure."

deity_omlos:0 "$omen_omlos$"
omen_omlos:0 "Omlos"
omen_omlos_desc:0 "Omlos is a deity of War"

deity_pouirruipa:0 "$omen_pouirruipa$"
omen_pouirruipa:0 "Pouirruipa the Follower"
omen_pouirruipa_desc:0 "Born in the city of #G Ddu-Nuimatatt#!, #Y Pouirruipa 'Kr-Oprros'#! or #Y Pouirruipa 'the Follower'#! served as an accountant for a temple of #Y #R Aentora#!#!. While he was not the first to join #Y #G Helluvius#!#!' travels, he was the most loyal, abandoning his former life to stand by his side until his end at the hands of the #Y #R Zani#!#!.\n\nWith the #Y Great Prophet#! having risen, his followers turned to #T Pouirruipa#! for guidance, who tried his best to continue #Y #G Helluvius#!#!' teachings and keep their community safe from persecution, becoming the first #T Shannah#! of the #Y Helluvians#!."

deity_zeglous:0 "$omen_zeglous$"
omen_zeglous:0 "Zeglous"
omen_zeglous_desc:0 "Zeglous is a deity of Fertility"

deity_iztix:0 "$omen_iztix$"
omen_iztix:0 "Iztix"
omen_iztix_desc:0 "Iztix is a deity of #T Economy#!"

