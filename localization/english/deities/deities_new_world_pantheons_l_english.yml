l_english:
 ## New World pantheons ##
deity_drakhya_flame_war:0 "$omen_drakhya_flame_war$"
omen_drakhya_flame_war:0 "The Cinder Drake"
omen_drakhya_flame_war_desc:0 "The war-aspect of the #E Drakhic Flame#! is the Old Drake's burning wrath, called upon when enemies must be broken in smoke and ash."

deity_drakhya_flame_culture:0 "$omen_drakhya_flame_culture$"
omen_drakhya_flame_culture:0 "The Ember Crown"
omen_drakhya_flame_culture_desc:0 "The Ember Crown blesses rulers who keep the eternal coals, binding law, memory, and sacred fire into a single rite of command."

deity_drakhya_flame_economy:0 "$omen_drakhya_flame_economy$"
omen_drakhya_flame_economy:0 "The Golden Brazier"
omen_drakhya_flame_economy_desc:0 "The Golden Brazier is tended by temple keepers who teach that wealth must be purified by flame before it can serve the faithful."

deity_drakhya_flame_fertility:0 "$omen_drakhya_flame_fertility$"
omen_drakhya_flame_fertility:0 "The First Dawn"
omen_drakhya_flame_fertility_desc:0 "The First Dawn recalls the heat that stirred life from cold stone, warming eggs, fields, and hearths beneath the Old Drake's gaze."

deity_the_hive_concord_war:0 "$omen_the_hive_concord_war$"
omen_the_hive_concord_war:0 "The Iron Mandible"
omen_the_hive_concord_war_desc:0 "The Iron Mandible is the Concord's will made violent, a sacred command that turns every warrior into one striking limb of the hive."

deity_the_hive_concord_culture:0 "$omen_the_hive_concord_culture$"
omen_the_hive_concord_culture:0 "The Shared Thought"
omen_the_hive_concord_culture_desc:0 "The Shared Thought gathers memory, law, and custom into the brood-mind, where no lesson is lost and no voice is wholly alone."

deity_the_hive_concord_economy:0 "$omen_the_hive_concord_economy$"
omen_the_hive_concord_economy:0 "The Honeyed Ledger"
omen_the_hive_concord_economy_desc:0 "The Honeyed Ledger sanctifies ordered labor, careful stores, and the tribute each small life gives to the survival of the whole."

deity_the_hive_concord_fertility:0 "$omen_the_hive_concord_fertility$"
omen_the_hive_concord_fertility:0 "The Brood Womb"
omen_the_hive_concord_fertility_desc:0 "The Brood Womb is honored in warm chambers below the earth, where the Concord renews itself in eggs, larvae, and patient care."

deity_sky_covenant_war:0 "$omen_sky_covenant_war$"
omen_sky_covenant_war:0 "The Spear Wind"
omen_sky_covenant_war_desc:0 "The Spear Wind is invoked from high cliffs before battle, carrying warriors into sudden strikes and scattering those who stand against the storm."

deity_sky_covenant_culture:0 "$omen_sky_covenant_culture$"
omen_sky_covenant_culture:0 "The Oath of Clouds"
omen_sky_covenant_culture_desc:0 "The Oath of Clouds preserves the promises sworn to the Four Winds, keeping clans bound by honor even when they wander far apart."

deity_sky_covenant_economy:0 "$omen_sky_covenant_economy$"
omen_sky_covenant_economy:0 "The High Market"
omen_sky_covenant_economy_desc:0 "The High Market blesses cliff-roads, aeries, and caravan winds, guiding trade along paths that lowland feet rarely dare to follow."

deity_sky_covenant_fertility:0 "$omen_sky_covenant_fertility$"
omen_sky_covenant_fertility:0 "The Rain Caller"
omen_sky_covenant_fertility_desc:0 "The Rain Caller softens the hard earth below the peaks, bringing cloudbursts, clean springs, and the promise of another season."

deity_the_great_mycelium_war:0 "$omen_the_great_mycelium_war$"
omen_the_great_mycelium_war:0 "The Spore Host"
omen_the_great_mycelium_war_desc:0 "The Spore Host rises where the faithful fall, teaching that no defeat is final while the dead can feed another advance."

deity_the_great_mycelium_culture:0 "$omen_the_great_mycelium_culture$"
omen_the_great_mycelium_culture:0 "The Rooted Memory"
omen_the_great_mycelium_culture_desc:0 "The Rooted Memory carries old wisdom through hidden threads beneath the soil, linking village, grove, and grave into one living mind."

deity_the_great_mycelium_economy:0 "$omen_the_great_mycelium_economy$"
omen_the_great_mycelium_economy:0 "The Rotting Bounty"
omen_the_great_mycelium_economy_desc:0 "The Rotting Bounty blesses compost, cellar, and storehouse, turning waste into wealth and decay into patient abundance."

deity_the_great_mycelium_fertility:0 "$omen_the_great_mycelium_fertility$"
omen_the_great_mycelium_fertility:0 "The Bloom Below"
omen_the_great_mycelium_fertility_desc:0 "The Bloom Below is the sacred promise that every buried thing will root again, feeding new life from what has willingly returned."

deity_dust_oracles_war:0 "$omen_dust_oracles_war$"
omen_dust_oracles_war:0 "The Buried Spear"
omen_dust_oracles_war_desc:0 "The Buried Spear is a prophecy of ambush and patience, warning that armies swallowed by the waste rarely know which dune hid their doom."

deity_dust_oracles_culture:0 "$omen_dust_oracles_culture$"
omen_dust_oracles_culture:0 "The Veiled Seer"
omen_dust_oracles_culture_desc:0 "The Veiled Seer reads law and memory in drifting dust, preserving the words that survive when stone tablets and proud cities vanish."

deity_dust_oracles_economy:0 "$omen_dust_oracles_economy$"
omen_dust_oracles_economy:0 "The Caravan Star"
omen_dust_oracles_economy_desc:0 "The Caravan Star guides merchants between wells and ruins, blessing those who know that water, silence, and timing are all forms of wealth."

deity_dust_oracles_fertility:0 "$omen_dust_oracles_fertility$"
omen_dust_oracles_fertility:0 "The Hidden Well"
omen_dust_oracles_fertility_desc:0 "The Hidden Well is the mercy beneath the waste, a secret source of life revealed only to the patient and the properly warned."

deity_stoneblood_rite_war:0 "$omen_stoneblood_rite_war$"
omen_stoneblood_rite_war:0 "The Granite Oath"
omen_stoneblood_rite_war_desc:0 "The Granite Oath is sworn before battle with blood on stone, binding warriors to hold fast until the mountain itself gives way."

deity_stoneblood_rite_culture:0 "$omen_stoneblood_rite_culture$"
omen_stoneblood_rite_culture:0 "The Deep Hearth"
omen_stoneblood_rite_culture_desc:0 "The Deep Hearth keeps clan law beneath the roots of the world, where every promise is carved, witnessed, and remembered."

deity_stoneblood_rite_economy:0 "$omen_stoneblood_rite_economy$"
omen_stoneblood_rite_economy:0 "The Vein of Plenty"
omen_stoneblood_rite_economy_desc:0 "The Vein of Plenty is honored by miners, masons, and treasurers who believe the earth grants wealth only to steady hands."

deity_stoneblood_rite_fertility:0 "$omen_stoneblood_rite_fertility$"
omen_stoneblood_rite_fertility:0 "The Earth's Slow Heart"
omen_stoneblood_rite_fertility_desc:0 "The Earth's Slow Heart beats beneath field and cavern, feeding roots, children, and herds through the deep patience of stone."

deity_moonhowl_pact_war:0 "$omen_moonhowl_pact_war$"
omen_moonhowl_pact_war:0 "The Red Hunt"
omen_moonhowl_pact_war_desc:0 "The Red Hunt is the pack's sacred frenzy, loosed beneath the moon when prey must be run down and challengers made silent."

deity_moonhowl_pact_culture:0 "$omen_moonhowl_pact_culture$"
omen_moonhowl_pact_culture:0 "The Silver Name"
omen_moonhowl_pact_culture_desc:0 "The Silver Name is how a pack remembers its worthy chiefs, singers, and oath-kin, carried from throat to throat in moonlit rites."

deity_moonhowl_pact_economy:0 "$omen_moonhowl_pact_economy$"
omen_moonhowl_pact_economy:0 "The Shared Kill"
omen_moonhowl_pact_economy_desc:0 "The Shared Kill blesses the fair division of meat, spoils, and tribute, for a pack that eats together survives together."

deity_moonhowl_pact_fertility:0 "$omen_moonhowl_pact_fertility$"
omen_moonhowl_pact_fertility:0 "The Den Mother"
omen_moonhowl_pact_fertility_desc:0 "The Den Mother guards cubs, hearths, and winter stores, teaching that the pack's future is the holiest prize of the hunt."

deity_tide_mothers_war:0 "$omen_tide_mothers_war$"
omen_tide_mothers_war:0 "The Drowning Wave"
omen_tide_mothers_war_desc:0 "The Drowning Wave is the Tide Mothers' wrath, called upon to smash hulls, flood camps, and drag oath-breakers beneath the foam."

deity_tide_mothers_culture:0 "$omen_tide_mothers_culture$"
omen_tide_mothers_culture:0 "The Shell Song"
omen_tide_mothers_culture_desc:0 "The Shell Song carries law, ancestry, and harbor custom across the coast, sounding in every inlet where the Tide Mothers are praised."

deity_tide_mothers_economy:0 "$omen_tide_mothers_economy$"
omen_tide_mothers_economy:0 "The Pearl Tithe"
omen_tide_mothers_economy_desc:0 "The Pearl Tithe blesses fishers, divers, and traders who return a proper share of the sea's wealth to the mothers below."

deity_tide_mothers_fertility:0 "$omen_tide_mothers_fertility$"
omen_tide_mothers_fertility:0 "The First Wave"
omen_tide_mothers_fertility_desc:0 "The First Wave is remembered as the birth of all waters, renewing nets, wombs, rains, and reefs with each returning tide."
