l_english:
 ## Illorian Religion ##
deity_aentora:0 "$omen_aentora$"
omen_aentora:0 "Aentora"
omen_aentora_desc:0 "The Goddess of Life, #E Aentora#! is the creator and patron of man. For the good of all men, she sent the #E #G Everything-King#!#!, #E Kulnnona#!, to drive out the monstrous #E Muerthans#! from #E Marrenica#!, establishing the homeland of her chosen people, the #E Aentoran-Torr#!."

deity_muerthos:0 "$omen_muerthos$"
omen_muerthos:0 "Muerthos"
omen_muerthos_desc:0 "The God of Death, #E Muerthos#! is the opposing twin deity to #E Aentora#!. Feared by men, #E Muerthos#! is still acknowledged by the wretched #E Aentora-Torr#! as a necessary balance to the life-giving #E Aentora#!. However, he remains the primary antagonist to humanity, and resents them for exterminating his children, the scaly #E Muerthans#!."

deity_kulnnona:0 "$omen_kulnnona$"
omen_kulnnona:0 "Kulnnona"
omen_kulnnona_desc:0 "Praise be to the #E Everything-King#!! Rightful ruler of Man and it's conquered homeland, #E Marrenica#!.\n\nUnder his rule, the beastly #E Muerthans#! were decisively defeated and driven to the far reaches of #E Marrenica#!, were they were hunted to extinction by his descendants, allowing man to proliferate across #E Omniluxia#!!"

deity_kyrranno:0 "$omen_kyrranno$"
omen_kyrranno:0 "Kyrranno"
omen_kyrranno_desc:0 "As the #E Twin Gods#! balance the universe, the twin sons #E Kyrrano and Pthellane#! served to balance the #E Yollorrnan Tokrratona#!!\n\n#E Kyrrano#! accompanied his father, #E Kulnnona the Everything-King#! on his conquests, and while his brother, #E Pthellanne#! was essential to the victories that conquered the empire, #E Kyrranno#! was fundamental to it's foundation. He diligently and carefully granted lands to loyal clergymen and nobility who worked to develop the wild forests and plains of #E Marrenica#!, as well as supported his father as the new emperor of the many disparate tribes that fought with him."

deity_pthellanne:0 "$omen_pthellanne$"
omen_pthellanne:0 "Pthellane"
omen_pthellanne_desc:0 "As the #E Twin Gods#! balance the universe, the twin sons #E Kyrrano and Pthellane#! served to balance the #E Yollorrnan Tokrratona#!!\n\nMighty #E Pthellanne#! was known as #E The Shield#!, as he was known to defend impossible positions during the great #E Conquest of Marrenica#! led by his father, the #E Everything-King#!. After the conquests, #E Pthellanne#! worked as his father's right hand man, brutally crushing rebellions and hunting #E Muerthan#! bands who still roamed the isolated hills and forests of the countryside."

deity_minna:0 "$omen_minna$"
omen_minna:0 "Minna"
omen_minna_desc:0 "The goddess of strategic victory, it is said that she appears to generals who make a great sacrifice before an important battle to bless them with the strategies they will need to win. Due to the #E Aentora-Torr#!'s reverance of superior ability and skill in battle, #E Minna#! is often revered over the more brutish #E Marres#!."

deity_marrena:0 "$omen_marrena$"
omen_marrena:0 "Marrena"
omen_marrena_desc:0 "The beautiful Ocean Goddess #E Marrena#! serves as the guardian spirit of the #E Marrenica Sea#!, providing calm waters for the sons of the #E Everything-King#!.\n\nHer most famous story involves her encounter with the #E Everthing-King#! long before he became emperor. It is said that the famous hero saw her singing when she was just the spirit of a mountain spring, and her beauty captivated him so that he promised her dominion over the whole ocean if she would marry him. The goddess acquiesced to his fervent demands, and in time bore him the twin sons #E Kyrrano and Pthellanne#!."

deity_shtushrenn:0 "$omen_shtushrenn$"
omen_shtushrenn:0 "Shtushrenn"
omen_shtushrenn_desc:0 "God of Roads, Merchants, and Messengers, the winged god #E Shtushrenn#! has kept the vibrant merchant community of #E Marrenica#! safe since the times of the #E Everything-King#!. However, to more bitter vendors he's also known as the god of #E Theives#!, as stories are told of cunning merchants with winged shoes swindling local vendors and wooing shopkeepers' wives traveling across #E Marrenica#!."

