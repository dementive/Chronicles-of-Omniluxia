l_english:
 ## kinone_pantheon ##
deity_mobubu:0 "$omen_mobubu$" # 2
omen_mobubu:0 "M'o-Bu-Bu"
omen_mobubu_desc:0 "Koni-Koni #E M'o-Bu-Bu#! was born at the end of the #E 1st Age#!, and lived a semi-nomadic lifestyle with his clan in the #E Peaceful Valley#!. Taking heavy inspiration from #E Da-Wa'i#!, he sought to preach a philosophy that would bring peace to the various warring clans who were moving into the valley. He lived in a time before writing, thus his exact words are lost to generations of oral history. What survived, the #E 2nd Kino#!, has been etched into the psyche of #E Kinones#! society.\n\n'#G My neighbors want to fight,\nI prepare a meal,\nWe sit and talk,\nBoth men are happy,\nNeither are hurt.#!'"

deity_kon:0 "$omen_kon$"
omen_kon:0 "Kon"
omen_kon_desc:0 "While the exact nature of #E Kon#! is debated, there are two things all #E Kinones#! faithful agree on: he is all-powerful and he judges only one's #E Kino#!. There are many claims about #E Kon#!. There are many stories about him. As he existed before writing, it is debated what is true about him and what is not. However, there is one story that stays consistent amongst all the #E Kinones#! clans:\n\n'#G A young Kinones walked amongst the mountains of the Great South and saw a bright light. Blinded, he cried out, 'Who owns the light that blinds me?'\nA great voice responded, 'Kon blinds you, and should you wish to see again you are to follow my instructions.'\nThe Kinones responds, 'What do you wish me to do.'\nKon replies, 'When you die, show me a Kino worthy of a second life.'#!'"

deity_dawai:0 "$omen_dawai$" # 1
omen_dawai:0 "Da-W'ai"
omen_dawai_desc:0 "The mysterious Koni-Koni #E Da-Wa'i#! lived in the #E 1st Age#!, a time before writing. All his sayings were passed down orally, with his teachings only written down many centuries after his death. Despite this, the ideas and rhetoric of the #E 1st Kino#! have influenced all future #E Kinones#! philosophy, theology, and literature.\n\n'#G Protect the innocent,\nCare for the elderly,\nPray for the sick,\nAdopt the orphaned,\nMay Kon accept my Kino.#!'"

deity_ndukxa:0 "$omen_ndukxa$" # 6
omen_ndukxa:0 "Nd'u-Kxa"
omen_ndukxa_desc:0 "With the rise of great clans near the end of the #E 2nd Age#! and the beginning of the #E 3rd Age#!, came the rise of tyrants and cruel B'au-B'au's. Witnessing such cruelty firsthand, the young #E Nd'u-Kxa#! would spend the rest of his life tutoring and preaching what would become the #E 6th Kino#!, attempting to correct these young tyrants and promote humility and charitability.\n\n'#G A young ruler asks,\nWhy should I give to others?,\nI respond with patience,\nKon will not ask for coins,\nHe will ask for your Kino.#!'"

deity_mvunda:0 "$omen_mvunda$" # 9
omen_mvunda:0 "Mvu-Nd'a"
omen_mvunda_desc:0 "The first of the #E Three Sages#!, Koni-Koni #E Mvu-Nd'a#!'s writings are controversial due to their various interpretations. The chaos of the #E 4th Age#! shaped the young warrior, who wrote his memoirs, #E Mv'o-Mv'o#!, during the latter half of his life. The writings that would make up the #E 9th Kino#! reflected on how to end the chaos, and the sacrifices necessary to achieve peace.\n\n#G 'Many clans start wars,\nChaos and death follows,\nOne Great Clan mediates,\nPeace without conflict,\nSafety through unity.#!"

deity_mamakxa:0 "$omen_mamakxa$" # 3
omen_mamakxa:0 "Ma-Ma-Kxa"
omen_mamakxa_desc:0 "Born at the beginning of the #E 2nd Age#!, Koni-Koni #E Ma-Ma-Kxa#!'s writings were crucial for the development of #E Kinones#! philosophy and theology as his writings were some of the first to tackle societal and moral problems. While the writings that make up the #E 3rd Kino#! cover a wide range of topics, they all focus on meditation and inner reflection as way to find answers and meaning.\n\n'#G My breathing slows,\nI feel the wind,\nI feel the grass,\nMy soul rests,\nMy mind is clear.#!'"

deity_khoreu:0 "$omen_khoreu$" # 4
omen_khoreu:0 "Kho R'eu"
omen_khoreu_desc:0 "Koni-Koni #E Kho R'eu#! is not quoted often, nor are many of her sayings remembered. As the only female prophet, she is unfortunately not as prolific as her male counterparts. However, her writings have have a deep impact on the #E Kinones#!' relationship with their environment, which has had a deep impact on their culture. Despite being a member of a prominent clan during the #E 2nd Age#!, she insisted on helping out local farmers and getting involved in the process herself, emphasizing the key points of the #E 4th Kino#!.\n\n'#G The right livelihood,\nWork that doesn't harm,\nThe land must be sustained,\nLest the grain not grow,\nAnd our children starve.#!'"

deity_gagabau:0 "$omen_gagabau$" # 8
omen_gagabau:0 "Ga-Ga-B'au"
omen_gagabau_desc:0 "Koni-Koni #E Ga-Ga-B'au#! is well-known amongst the various merchants and B'au-B'au across the valley. Although his writings are from the #E 3rd Age#!, their popularity is a reason why other races view the #E Kinones#! so favorably. The #E 8th Kino#! reflects his life as a wandering merchant who despised the sleazy tactics used by the growing merchant class.\n\n'#G A man offers me five coins,\nHe wants to buy a pelt,\nI tell him it's old,\nAnd ask for three coins,\nBecause my integrity is worth more.#!'"

deity_mposoreu:0 "$omen_mposoreu$" # 7
omen_mposoreu:0 "Mpo-S'o R'eu"
omen_mposoreu_desc:0 "Koni-Koni #E Mpo-S'o R'eu#! is held in particular high regard by the #E Ndeni#! clans of the hills, who often quote his words and practice a form of martial arts said to be practiced by him. He was born in the #E 3rd Age#!, and while the time was relatively peaceful, it was a time when great clans began consolidating their rule and needed guidance on how to rule. His philosophy, the #E 7th Kino#!, focuses on the health of the body and the senses, arguing that a strong person makes a strong leader.\n\n'#G I walk across the mountains,\nThe wind blows fiercely,\nDespite the cold,\nMy clan follows me,\nBecause I am strong.#!"

deity_lolofofo:0 "$omen_lolofofo$" # 5
omen_lolofofo:0 "L'o-L'o-Fo-Fo"
omen_lolofofo_desc:0 "Koni-Koni #E L'o-L'o-Fo-Fo#! is probably the most famous Koni-Koni, particularly amongst foreigners, who often confuse him with #E Kon#!. His writings and sayings are frequently quoted, particularly amongst the southern #E Npani#!, were he is seen as a folk hero. He was raised on a southern farm during the relatively peaceful #E 2nd Age#!, and his teachings, the #E 5th Kino#! reflect the culture at the time.\n\n'#G A traveler visits me,\nHe asks to stay the night,\nI take him in,\nAnd treat him kindly,\n For I know he is Kon in disguise.#!'"

deity_moko:0 "$omen_moko$" # 11
omen_moko:0 "Mo-K'o"
omen_moko_desc:0 "Born shortly after the death of Koni-Koni #E N'de-Bu#!, #E Mo-K'o#! is considered the the final member of the #E Three Sages#!, prominent Koni-Koni during the #E 4th Age#! who have shaped Kinones society in the #E 5th Age#!. As a member of a wealthy clan, he spent most of his life as a philosopher and tutor, trying to find a solution to the chaos and divisions that defined the #E 4th Age#!. Ultimately, he compiled his writings into one work, #E Km'o-Mbu-Mbu Kreu#!, and gifted it to the heir of a prominent clan who spread what came to be known as the #E 11th Kino#! across the valley.\n\n'#G I am faithful to my family,\nMy wife is faithful to me,\nMy children are faithful to me,\nTogether we are one,\nTogether we are strong.#!'"

deity_kmokho:0 "$omen_kmokho$" # 12
omen_kmokho:0 "Km'o-Kho"
omen_kmokho_desc:0 "#E Km'o-Kho#! is the final and most recent Koni-Koni, having been born shortly after the beginning of the #E 5th Age#!. He lived through the famines and misery that followed the #R Great Trial#!, and served as his B'au-B'au's steward before eventually retiring to his family farm. His #E Kino#!, the #E 12th Kino#!, has defined one of the core aspects and values of Kinones society in the #E 5th Age#!.\n\n'#G I have worked for a lord,\nI cannot eat gold,\nMy family hungers,\nI return to my farm,\nWe are happy and fed.#!'"

deity_ndebu:0 "$omen_ndebu$" # 10
omen_ndebu:0 "N'de-Bu"
omen_ndebu_desc:0 "While #E L'o-L'o-Fo-Fo#! is the most famous Koni-Koni, many B'au-B'au would argue that #E N'de-Bu#! is the important, as his #E Kino#! has become the backbone of #E Kinones#! society in the #E 5th Age#!. Known as one of the #E Three Sages#!, he grew up amongst the northern #E Zhuni#! tribes during the turbulent #E 4th Age#!, and became an important statesman and philosopher during his time. His writing would be collected and become the #E N'u-N'u K'reu#!, which serves as the basis of the #E 10th Kino#!.\n\n'#G I take care of my crops, they feed me,\nI respect my sons, they respect me,\nI pray to #E Kon#!, he grants me wisdom,\nReciprocity is the basis of our world,\nThose who understand find order where chaos existed.#!'"
