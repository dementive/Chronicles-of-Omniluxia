deity_wazad_five:0 "$omen_wazad_five$"
omen_wazad_five:0 "Mindful Wazad"
omen_wazad_five_desc:0 "In the #E Mindful Wazad#!, #E Gozon#! touches on the various stages of awakening, and meditation techniques that allow followers to achieve these enlightened states of mind.\n\n'#G The mind is like a river,\nWhen thoughts block flow of the water, the mind remains troubled and mortal,\nWhen the stream flows around the blockage, the mind is strained and anchored,\nOnly when the blockage is removed can a mind truly be present and at peace.#!"

deity_wazad_six:0 "$omen_wazad_six$"
omen_wazad_six:0 "Earth Wazad"
omen_wazad_six_desc:0 "The most influential #E Wazad#! on the development of Orcish society, as #E Gozon's#! words have been interpreted to justify the foundational values of the Orcish people.\n\n'#G Structure creates mountains, inpenetrable like Mount Arteth,\nThe land provides, earth's bounty is enough to feed all,\nStructure enforces what the land provides, in this way both combine to form a harmonous society.#!'"

