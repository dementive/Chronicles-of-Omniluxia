omen_gozon_desc:0 "Gozon, Lord of the Orcs, is known by many names "

deity_mogddu:0 "$omen_mogddu$"
omen_mogddu:0 "Mogddu"
omen_mogddu_desc:0 "#E Mogddu#!, grand deity of a million faces, is a being difficult to understand for most foreigners on the Bloody Isles. The #E One Soul#! is split between every living being, from the gods to mere mortals, and when they perish their life force returns to the Earth through it. Indeed, for a shattered piece of the whole to permanently reunite with the #E Great One#! in holy #E Otziggu#!."

