l_english:
 omni_loot.1.t:0 "What the Baggage Train Left"
 omni_loot.1.desc:0 "By the time our men reached the enemy's baggage train, its guards had gone after their general, who had got clear of the field. One of our soldiers brought back a wax tablet with a tally of the packs. The quartermaster sat down on a wheel rut and read from it while the men went down the line cutting cords.\n\n[ROOT.Char.GetName|Y] has taken charge of what they found. The quartermaster has made a tally of his own, for there will be men at the next muster who remember carrying a heavier load than the one they set down."
 omni_loot.2.t:0 "The Empty Wagons"
 omni_loot.2.desc:0 "When [ROOT.Char.GetName|Y] reached our lines, the teamsters were still watching the road for the last of the wagons. A few came in after dark with their covers hanging loose. The drivers said the enemy had made them stand in the ditch while the packs were opened.\n\nOur quartermaster went down the line with the old tally in his hand, asking which things had been carried off and which might still turn up with the stragglers. By dawn he had a list of what the victors took."
 omni_loot.3.t:0 "The Dead General's Baggage"
 omni_loot.3.desc:0 "Our men found the enemy general among the fallen, and word reached the baggage guard before it reached the far end of the field. By the time [ROOT.Char.GetName|Y] sent men to the wagons, the guards had gone and one of the drivers was still there, trying to get a wheel out of a rut.\n\nThe driver showed our men which packs had come from the general's tent, and they carried the contents to [ROOT.Char.GetName|Y]. The clerk who took them down had to borrow a lamp to finish the tally."
 omni_loot.4.t:0 "A Tally from the Field"
 omni_loot.4.desc:0 "The enemy general got away while our companies were still calling men back to their standards. Some of the men came in by the wagon road, where they found the enemy's baggage with the lashings still tied. They cut the loads free and brought them in between them, taking turns where the road climbed.\n\nThe men have laid what they carried before you. They asked the clerk to take down their names beside the goods, since by morning there would be plenty of men who remembered having helped."
 omni_loot.5.t:0 "The Wagons at Dusk"
 omni_loot.5.desc:0 "The enemy's wagoners were still waiting for orders when word came down the line that their general had fallen. Most of them took the horses and left, and our soldiers found the wagons standing where the teams had been unhitched. It took until dusk to carry what they found back to our lines.\n\nThe soldiers have brought the haul before you, and the clerk has entered each piece as it came in. He did his counting by the gate, where the men who carried it could see what went down on the tablet."
 omni_loot_excellent:0 "Enter it in the tally."
 omni_loot_curse_them:0 "Let us see what they took."
 omni_loot_taken_tt:0 "Goods taken"
 omni_loot_lost_tt:0 "Goods lost"
 omni_loot_item_tt:0 "• #Y [THIS.GetFlagName]#!"
