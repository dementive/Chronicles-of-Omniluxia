l_english:
 omni_loot.1.t:0 "Spoils of the Defeated"
 omni_loot.1.desc:0 "The enemy general survived the battle, but their camp and baggage train did not escape so lightly. [ROOT.Char.GetName] has claimed a share of the plunder."
 omni_loot.2.t:0 "Stripped of Spoils"
 omni_loot.2.desc:0 "[ROOT.Char.GetName] survived the defeat, but the victors picked over the camp before withdrawing, leaving little behind."
 omni_loot.3.t:0 "A Fallen Foe's Fortune"
 omni_loot.3.desc:0 "With the enemy general slain, their personal effects and camp fell entirely into [ROOT.Char.GetName]'s hands."
 omni_loot.4.t:0 "Loot from the Field"
 omni_loot.4.desc:0 "The soldiers of [Root.GetName] have returned from the field with plunder gathered from the enemy's camp."
 omni_loot.5.t:0 "Spoils of a Slain Commander"
 omni_loot.5.desc:0 "With the enemy commander dead, the soldiers of [Root.GetName] have gathered a rich haul of plunder from the field."
 omni_loot_excellent:0 "Excellent."
 omni_loot_curse_them:0 "Curse them!"
