l_english:
 omni_tutorial_city_works:0 "Royal Works"
 omni_tutorial_boost:0 "Royal Progress"
 OMNI_TUTORIAL_TT:0 "Play #G A Royal Progress#! as the #T Copper Dwarven#! hold of #Y Darinfur#!: visit cities, equip gear, learn #T Folk#! magic, ward your capital, go adventuring, and break a siege with magic and a battering ram. The #Y Royal Progress Papers#! cover advanced spells, mage cohorts and mercenaries, treasures and scrolls, education and courtship, dynastic unions, disease outbreaks, and natural disasters."
# Tutorial objective descriptions use plain text, matching vanilla: TutorialItem.GetEffect
# cannot resolve dynamic name expressions here. Event dialogue below keeps its scopes.
 omni_tut_market:0 "Market Day"
 omni_tut_market_desc:0 "#W Visit the market of #G Bad-Darinfur#!.#!\n\nThe stallholders under the hold have sold to the throne through stewards for as long as anyone can remember, and few of them have seen the face stamped on their coins. Select your ruler, press #Y Visit City#! on the character window, and choose #Y Market#!.\n\nEach culture forges its own wares, so what hangs in these stalls will not be what hangs in a foreign market, and the merchants who carry goods between them know it better than anyone."
 omni_tut_guild:0 "Hall of Hired Swords"
 omni_tut_guild_desc:0 "#W Build an Adventurer's Guild.#!\n\nAdventurers have passed through our halls for years, drinking in our taverns and signing their contracts under other people's roofs. Guild halls can only stand in a city, so open the buildings of #G Bad-Darinfur#! and raise an #G Adventurer's Guild#! beside the market. While the tutorial lasts, our masons build far faster than usual, so start it now and let it rise while you see to the rest."
 omni_tut_equip:0 "Dressed for the Occasion"
 omni_tut_equip_desc:0 "#W Buy a piece of gear at the market.#!\n\nWhen your ruler buys a weapon, a coat of mail, or any other piece of army gear, the realm commissions it: the treasury pays, and the gear waits under #Y Items#! on the ruler's character window. Choose #Y Equip an item#! to put it on and give your armies its bonuses. The smiths of Bad-Darinfur have set aside a plain axe at a price the treasury will hardly notice. Books, crowns, and charms are different, because they are bought from the ruler's own purse and wait in the inventory until you equip them from #Y Items#! on the ruler's character window.\n\nGenerals and courtiers who shop on their own account pay from their own purses, and the quartermasters can usually tell who has been shopping by the state of their pay."
 omni_tut_hearthward:0 "The Hedge-Witch's Fee"
 omni_tut_hearthward_desc:0 "#W Learn Hearthward from a Folk teacher.#!\n\nVillage magic is taught at a kitchen table, one paid lesson at a time. The nearest hedge-witch keeps a #Y Wizard Hut#! at #G Pfa-Pfa Mbv'au#!, capital of #G Mpo-Bu#!, southwest of us. Use #Y Atlas Map Mode#! or the #Y Wizard Huts#! button above the minimap to find it.\n\nAsk #G Mpo-Bu#! for #Y Military Access#! (they will agree), march your ruler's army there, open #Y Visit City#! and choose #Y Visit the local Folk teacher#!. #Y Hearthward#! costs #Y 50 gold#! from the ruler's purse."
 omni_tut_ward:0 "Walls That Hum"
 omni_tut_ward_desc:0 "#W Cast Hearthward on #G Bad-Darinfur#!.#!\n\nA ward settles wherever the caster's army is standing, so the guards on the gates of #G Bad-Darinfur#! will only feel it if your ruler brings the army home first. With the ruler's army in the capital, select it and choose #Y Hearthward#! under #Y Battle Blessings#!. You can also cast it from the #T Folk#! spellbook on the ruler's character window.\n\nThe ward lasts half a year, and the captain of the gate has already asked whether his men should report the humming in the stone or simply get used to it."
 omni_tut_academy:0 "Ivory Towers"
 omni_tut_academy_desc:0 "#W Optional: enroll at a Magic Academy.#!\n\nThere is no #G Magic Academy#! in Darinfur, but the masters of the nearest one have written to say they would be honored to enroll your ruler, and the letter mentions their fees in its second sentence. Bring the ruler to a settlement with an academy that we own, control, or hold #Y Military Access#! to, open #Y Visit City#!, choose #Y Magic Academy#! and then #Y Study Magic#!, and pick a school and a course.\n\nStudy takes months and continues while the ruler travels. The #G Mage Towers#! sell their advanced spells only to masters, however royal the beginner who knocks."
 omni_tut_set_out:0 "The Road Calls"
 omni_tut_set_out_desc:0 "#W Set out on an adventure, with the capital warded.#!\n\nThe guild has posted its first contracts, and the companions who drink in its hall are curious to see whether a ruler will sign one. Visit the #G Adventurer's Guild#! as your ruler, choose it from #Y Visit City#!, gather companions and take a contract. The guild will not send a ruler out while the realm is at war.\n\nWhile your ruler is away, #G Bad-Darinfur#! will be left to the regent and to the ward on its gates, so make sure the ward is still humming when the ruler leaves."
 omni_tut_home:0 "Home, With Stories"
 omni_tut_home_desc:0 "#W Return from the adventure.#!\n\nThe court has made arrangements for a triumphal return and, more quietly, for a funeral. Bring your ruler home with whatever the road gave up. Coin found on the road goes to the treasury, and items found on the way can be equipped from #Y Items#! like anything bought in a market."
 omni_tut_ram:0 "A Ram, Bought Retail"
 omni_tut_ram_desc:0 "#W Buy a Battering Ram.#!\n\nThe engineers say a gate can be starved out or broken in, and that breaking it is quicker when someone has paid a foundry for a proper ram. The court had a #Y Foundry#! raised beside the market of #G Bad-Darinfur#! when the journey began, so bring your ruler there, open #Y Visit City#!, and then choose #Y Siege Supplies#!.\n\nThe ram costs #Y 200 gold#! from the commander's purse. The court has set aside enough to cover any shortfall on the ruler's first ram in #G Bad-Darinfur#!."
 omni_tutorial_ram_allowance_tt:0 "The tutorial allowance covers any shortfall in the ruler's purse for this ram."
 omni_tut_battle_spell:0 "Turn Their Feet to Mud"
 omni_tut_battle_spell_desc:0 "#W Cast a spell in battle.#!\n\nHave your ruler lead the army against the raiders. When the fighting starts, your ruler will have one good chance to decide the battle with something other than steel. Use the #Y spell button#! on the army during the fighting, or answer the prompt when it appears, and cast a battle spell such as the #T Folk#! charm #Y Turn Feet to Mud#!."
 omni_tut_breach:0 "Knock, Knock"
 omni_tut_breach_desc:0 "#W Spend the Battering Ram in a siege.#!\n\nThe raiders have spent their time behind the walls repairing the gate with timber from our own stores. Besiege their stronghold with the ruler's army, then open #Y Siege Supplies#! in the siege window and spend the #Y Battering Ram#! to put the gate back in its proper condition."
 omni_tut_retake:0 "Under Old Management"
 omni_tut_retake_desc:0 "#W Retake the settlement the raiders seized.#!\n\nOccupation gives you the upper hand in the peace talks. Demand the settlement so it belongs to Darinfur again, then click this objective's checkbox to finish the tutorial and unlock #Y $omni_ach_royal_progress$#!. The families who stayed have kept a careful account of what was taken, and they would like the crown to read it. The walls the raiders built will stay, with our thanks."
 omni_tutorial.1.t:0 "A Royal Progress"
 omni_tutorial.1.desc:0 "The [ROOT.GetCountry.GetAdjective] Council at [ROOT.GetCountry.GetCapital.GetName|Y] heard the news before the ink on the decree was dry, and preparations for the royal adventure began at once. When [ROOT.GetCountry.GetRuler.GetName|Y], the beloved [ROOT.GetCountry.GetRulerTitle|T] of [ROOT.GetCountry.GetName|Y] asked to see the markets, the hedge-witches and the roads of Darinfur in person, the treasurer began drawing up a budget, the marshal sent for a bodyguard, and the chamberlain, who has arranged every ceremony of the current reign from a desk deep in the hold, asked whether the whole thing might be done by letter.\n\nNone of them were able to change [ROOT.GetCountry.GetRuler.GetFirstName]'s mind, however, and the regent has been left to see that the journey is done with as little loss of coin and honor as possible. The treasury has set aside a small sum for the ruler's discretion, but has also asked that the ruler not be too hard on the masons who will be raising a foundry beside the market in [GetProvince('(int32)1409').GetName|G], since it is their first day on the job.\n\nThe chamberlain has left the council papers in order. To read them, open #Y Decisions#! and choose #Y Consult the Royal Progress Papers#!."
 omni_tutorial.1.a:0 "Fetch my traveling cloak."
 omni_tutorial.1.a.tt:0 "Follow the steps in the #Y Tutorial#! panel. The #Y City#!, #Y Item#! and #Y Magic Instructions#! decisions hold the full reference whenever you want more detail."
 omni_tutorial.3.t:0 "Paid in Silver, Taught in Smoke"
 omni_tutorial.3.desc:0 "The hedge-witch of [GetProvince('(int32)1641').GetName|G] keeps her hut beside the Kino temple, where the smoke from both chimneys mingles and neither the priests nor she will say whose is whose. [SCOPE.sChar('omni_folk_tutor').GetName|Y] did not stand when a dwarven king ducked through her door with his boots still dusty from the border road. She went on stirring a pot that smelled of iron filings and burnt sage, pointed at the silver, and counted it twice before she said a word about the lesson. Then she weighed it in her palm, in case the counting had been wrong.\n\nThe lesson was smoke and patience. She cast pinches of ash on the coals, traced the old marks in the air, and made [ROOT.GetCountry.GetRuler.GetName|Y] say each word of #Y Hearthward#! until the flame bent toward the door and stayed there. The dwarves carve the same charm above their gates, she said, but they learned it from someone, and she would rather not say who. When [ROOT.GetCountry.GetRuler.GetName|Y] got a syllable wrong, she rapped the table with a spoon and the work began again.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] is now a #T Folk Practitioner#!, with a small store of #Y mana#! that refills a little each month. At the door, [SCOPE.sChar('omni_folk_tutor').GetName|Y] gave her last advice without looking up: a ward does nothing in a satchel, and the gates of [GetProvince('(int32)1409').GetName|G] would be a sensible place to try it before anyone tested them. She added that if the ward failed, it would be the caster's fault and not the charm's, and she would not be refunding the silver."
 omni_tutorial.3.a:0 "Thank her, then march for home."
 omni_tutorial.3.a.tt:0 "Bring your ruler's army to [GetProvince('(int32)1409').GetName|G], select the army, and choose #Y Hearthward#! under #Y Battle Blessings#!. It costs #Y 15#! base mana and lasts #Y 180 days#!."
 omni_tutorial.4.t:0 "Leave to Pass"
 omni_tutorial.4.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the elders of [GetProvince('(int32)1641').GetName|G] grew tired of waiting for our envoy and sent their own. Their letter grants our armies leave to cross Mpo-Bu, on the understanding that the royal progress pays for what it eats and does not stable its mules in the temple. It ends by noting that the hedge-witch is expecting a visitor, and has already raised her prices."
 omni_tutorial.4.a:0 "Send our thanks, and the mules elsewhere."
 omni_tutorial.4.a.tt:0 "Mpo-Bu has granted #Y Military Access#!. March your ruler's army to [GetProvince('(int32)1641').GetName|G] and visit the Folk teacher there."
 omni_tutorial_mpo_bu_welcome:0 "Welcomed the Royal Progress"
 omni_tutorial.10.t:0 "Visitors at the Gate"
 omni_tutorial.10.desc_warded:0 "My [ROOT.GetCountry.GetRulerTitle], a fortnight after [ROOT.GetCountry.GetRuler.GetName|Y] left on the guild's contract, a band of raiders came up the road to [GetProvince('(int32)1409').GetName|G] with ladders and grapnels, expecting the gate to be as thinly manned as the taverns had told them. When the first grapnel bit the stone, the ward that [ROOT.GetCountry.GetRuler.GetName|Y] had cast began to hum, and the watch on the gatehouse say the raiders stood listening for nearly a minute before they ran.\n\nThey left behind two mules and a ladder, and the quartermaster has entered both in the stores as property of the crown. The captain of the gate would like the regent to remember that his men were also on the walls, and he has asked whether the next ward might be cast a little closer to the barracks."
 omni_tutorial.10.desc_open:0 "My [ROOT.GetCountry.GetRulerTitle], a fortnight after [ROOT.GetCountry.GetRuler.GetName|Y] left on the guild's contract, a band of raiders came up the road to [GetProvince('(int32)1409').GetName|G] with ladders and grapnels, expecting the gate to be as thinly manned as the taverns had told them. The taverns were right, and by the time the watch had been roused, two storehouses by the lower gate had been emptied and the raiders were back on the road.\n\nThe merchants who rent those storehouses have brought their ledgers to the regent and want to know who will pay for what was lost. The hedge-witches in the lower town have been heard telling anyone who will listen that a ward on the gate would have cost the ruler fifteen mana, and that the storehouses cost rather more."
 omni_tutorial.10.a:0 "Sell the mules and pay the watch."
 omni_tutorial.10.b:0 "Pay the merchants, and ward the gate next time."
 omni_tutorial.19.t:0 "The Raiders Return"
 omni_tutorial.19.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the raiders who came to our gate while you were on the road have spent the season in the high villages, telling everyone who would buy them a drink how close they came to the capital. When our scouts followed them into the passes, they found camps three times the size of the band that fled, and the men in them were sharpening axes rather than counting loot.\n\nThe marshal expects them to fall on one of our border settlements within the month. He asks that we buy a #Y Battering Ram#! from the foundry while there is still time to haul it to the border. Once the raiders are inside, he says, the smiths will have more to do than they can manage."
 omni_tutorial.19.a:0 "Then we will be ready for them."
 omni_tutorial.19.a.tt:0 "In #Y 20 days#!, raiders will seize a border settlement and declare war.\nBuy a #Y Battering Ram#! (#Y 200 gold#!, with an allowance for any shortfall) in [GetProvince('(int32)1409').GetName|G]: #Y Visit City#!, then #Y Siege Supplies#!."
 omni_tutorial.20.t:0 "Raiders Take [SCOPE.sProvince('omni_tut_raid_province').GetName]"
 omni_tutorial.20.desc:0 "My [ROOT.GetCountry.GetRulerTitle], the raiders came down from the passes before dawn and were inside [SCOPE.sProvince('omni_tut_raid_province').GetName|G] before the watchfires could be lit. Their chief, [SCOPE.sChar('omni_tut_raider_chief').GetName|Y], has since declared the settlement a kingdom and set the townsfolk to building walls, which the elders say is more work than the place has done for its own defense in a generation.\n\nA messenger has brought his demand for tribute, written on the back of one of our own tax receipts. The families who fled to the next valley are waiting to hear whether the crown means to come for them, and the masons who were pressed into raising those walls would be glad to see them used against the men who ordered them built."
 omni_tutorial.20.a:0 "Fetch the ram."
 omni_tutorial.20.a.tt:0 "We are at war with the raiders. Defeat their army with [ROOT.GetCountry.GetRuler.GetName|Y] in command and cast a spell during the battle, then breach the walls of [SCOPE.sProvince('omni_tut_raid_province').GetName|G] with the #Y Battering Ram#! and take the settlement back."
 omni_tutorial.31.t:0 "Arrows Are Becoming Personal"
 omni_tutorial.31.desc:0 "The raiders have closed to bowshot, and [ROOT.GetCountry.GetRuler.GetName|Y], who is commanding from considerably nearer the front than the court would like, can see their chief pacing behind the shield wall. The standard-bearer, the horn-blower and two of the companions from the guild have all, at one moment or another, reminded the ruler that the spellbook will not open itself.\n\nBefore the march, the hedge-witch pressed a flask of something bitter into [ROOT.GetCountry.GetRuler.GetName|Y]'s hand and said it would carry the ruler through one good spell, and she has since sent a note to the treasury saying what it cost."
 omni_tutorial.31.a:0 "Open the spellbook."
 omni_tutorial.31.a.tt:0 "The witch's tonic restores #Y mana#! to #Y 40#!. Opens the battle spellbook, where #Y Turn Feet to Mud#! or any other battle spell you know can be cast.\nIn later battles, use the #Y spell button#! on the army, which appears only when the army's commander is the caster."
 omni_tutorial.31.b:0 "Hold the line with steel."
 omni_tutorial.31.b.tt:0 "The battle continues without magic. The prompt returns in the next battle."
 omni_tutorial_complete_tt:0 "#T Tutorial Complete#!\nAchievement unlocked: #Y $omni_ach_royal_progress$#!\nOpen the Objectives panel to review your progress."
 omni_tutorial.90.t:0 "Tutorial Complete"
 omni_tutorial.90.desc:0 "[ROOT.GetCountry.GetRuler.GetName|Y] has come home to a hold that ran perfectly well in [ROOT.GetCountry.GetRuler.GetHerHis] absence, although the regent would like it known that this was not without effort. In the months since the cloak was packed, the ruler has bargained in the markets, learned a charm at a kitchen table, set the gates humming, signed a guild contract and come back to tell of it, and mired an army before knocking down a gate that our own masons were made to build.\n\nThe treasurer has closed the accounts for the journey and found them less ruinous than he feared, and the marshal has asked to keep the ram's crew on the rolls. The chamberlain, for his part, has asked whether the next progress might be done by letter.\n\nThe chamberlain has left the council papers in order. To read them, open #Y Decisions#! and choose #Y Consult the Royal Progress Papers#!."
 omni_tutorial.90.a:0 "Continue playing as Darinfur"
 omni_tutorial.90.a.tt:0 "The #Y City#!, #Y Item#! and #Y Magic Instructions#! decisions remain available for reference."
