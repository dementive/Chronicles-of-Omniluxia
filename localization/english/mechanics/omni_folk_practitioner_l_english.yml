l_english:
 omni_folk_practitioner_status:0 "Folk Practitioner"
 omni_folk_practitioner_status_desc:0 "This character has learned the old arts from a local teacher. Their first lesson grants 25 mana, a reserve of at least 200 mana, and a base regeneration of at least 2 mana per month before fatigue. Further lessons grant knowledge, not additional starting mana. Folk instruction does not grant academy disciplines."
