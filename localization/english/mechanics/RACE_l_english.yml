race_policy_complete_title: "The Last Report"

race_policy_complete_desc: "My [ROOT.GetCountry.GetRulerTitle], our officials have returned with the final report on the people placed under their supervision. There are no more eligible communities requiring attention under the policy: integration concerns cultures still awaiting acceptance, while expulsion concerns families still living within our borders.\n\nThe undertaking has ended, and its burden on our government has been lifted. For once, the clerks have run out of work before the treasury has run out of patience."

race_policy_complete.a: "Then let the officials put their ledgers away"

race_policy_blocked_title: "A Road That Leads Nowhere"

race_policy_blocked_desc: "My [ROOT.GetCountry.GetRulerTitle], our officials have encountered a rather substantial difficulty with the expulsion orders: they cannot find an owned land border leading into foreign territory. The families marked for removal therefore remain within our realm.\n\nThe policy will wait and check again in #Y 180 days#!. We can maintain the orders, along with their ongoing cost, or abandon the undertaking for now. No families will be moved until a destination becomes available."

race_policy_blocked.a: "Keep the orders in place for now"
