me_racial_events_2_title: "Half Elves"
me_racial_events_2_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Half Elven#! communities have made their homes within our borders, and our officials would very much like to know what they should make of them.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."
me_racial_events_2.a: "Integrate"
me_racial_events_2.b: "Expel"
me_racial_events_2.c: "End Focus"
me_racial_events_2.d: "Return to Main Menu"
me_racial_events.2_tooltip: "#Y This will return to the main menu#!"

me_racial_events_3_title: "Wood Elves"
me_racial_events_3_desc: "My [ROOT.GetCountry.GetRulerTitle], in forests and settlements throughout our realm, #Y Wood Elves#! live under our rule. Their future here is a matter that cannot be left to the local officials alone.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_4_title: "Orcs"
me_racial_events_4_desc: "My [ROOT.GetCountry.GetRulerTitle], our #Y Orcish#! subjects have attracted no shortage of attention from officials and neighbors alike. Whether that attention brings opportunity or trouble may well depend upon us.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_5_title: "Dwarves"
me_racial_events_5_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Dwarven#! families live and labor within our realm, while our advisors debate what place they ought to have in its future.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_6_title: "Naga"
me_racial_events_6_desc: "My [ROOT.GetCountry.GetRulerTitle], reports concerning our #Y Naga#! subjects have reached the capital, and our officials await a clear answer on how these communities are to be treated.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_7_title: "Snakefolk"
me_racial_events_7_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Snakefolk#! communities live within our borders, and the question of their place in the realm has found its way to our court.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_8_title: "Goblins"
me_racial_events_8_desc: "My [ROOT.GetCountry.GetRulerTitle], our #Y Goblin#! subjects have become the subject of much discussion at court. As usual, everyone has an opinion, and everyone expects us to settle the matter.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_9_title: "Hobgoblins"
me_racial_events_9_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Hobgoblin#! communities have established themselves in our lands, and our officials are asking how they should be treated.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_10_title: "Dragkhans"
me_racial_events_10_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Dragkhan#! communities live beneath our rule, and their future has become a matter of some importance to our advisors.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_11_title: "Drow"
me_racial_events_11_desc: "My [ROOT.GetCountry.GetRulerTitle], our #Y Drow#! subjects have drawn the attention of the court, where our advisors cannot seem to agree on how they should be treated.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_12_title: "Sea Elves"
me_racial_events_12_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Sea Elves#! have made their homes within our realm, and their place in our society is a matter for us to decide.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_13_title: "Vampires"
me_racial_events_13_desc: "My [ROOT.GetCountry.GetRulerTitle], the presence of #Y Vampires#! in our realm has given our officials plenty to discuss, and more than a few reasons to look over their shoulders.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_14_title: "Halflings"
me_racial_events_14_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Halfling#! families have settled throughout our lands, and our advisors are eager to know what future we intend for them.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_15_title: "Kinones"
me_racial_events_15_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Kinones#! live within our borders, and our officials have brought their concerns about these communities before the court.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_16_title: "Gnomes"
me_racial_events_16_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Gnomish#! communities have found a place in our realm, though our officials are still arguing over what that place should be.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_17_title: "High Elves"
me_racial_events_17_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y High Elves#! live under our rule, and the question of their future has reached the ears of our advisors.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_18_title: "Wraiths"
me_racial_events_18_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Wraithkin#! communities dwell within our borders, much to the fascination of some of our subjects and the concern of others.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_19_title: "Zorg"
me_racial_events_19_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Zorg#! communities have made their homes in our realm, and our advisors are asking what we intend for them.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_20_title: "Humans"
me_racial_events_20_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Human#! communities live within our borders, and our officials are seeking direction on how they should be treated.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_39_title: "Arame"
me_racial_events_39_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Arame#! communities have made their homes in our lands, and their future under our rule is a matter for the court.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_40_title: "Ettin"
me_racial_events_40_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Ettin#! live within our realm, and our officials would appreciate a decision on how their communities should be treated.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_41_title: "Golem"
me_racial_events_41_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Golems#! can be found within our borders, and our advisors have brought the question of their place in the realm to our attention.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_42_title: "Ayrith"
me_racial_events_42_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Ayrith#! communities live under our rule, and our officials await guidance on their future.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_43_title: "Chivix"
me_racial_events_43_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Chivix#! communities have established themselves in our lands, and their place in the realm is a matter for us to decide.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

me_racial_events_44_title: "Mycelar"
me_racial_events_44_desc: "My [ROOT.GetCountry.GetRulerTitle], #Y Mycelar#! communities live within our borders, and our advisors have come seeking direction on how they should be treated.\n\nShall we welcome these people more fully into our society, or turn them away? The choice, as ever, is yours."

# Integration/Expel Events

me_racial_events_21_title: "Migrants Arrive"
me_racial_events_21_desc: "#G Wise#! #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!, a large migrant caravan from the [SCOPE.sCountryCulture('chosen_culture').GetCulture.GetName|Y] community of [SCOPE.sP('village_hometown').GetName|Y] have made their way to our capital!\n\nThe arrival of these families at [ROOT.GetCountry.GetCapital.GetName|G] has created a small crisis within the city, as the new residents require both food and housing that our settlement is currently not capable of providing. Officials warn that, despite their best efforts, overcrowding and starvation will continue to be a problem for many months until they are able to properly resettle the new arrivals.\n\nThe issues these new arrivals have caused have pushed many local residents to petition you to remove these vagrants at once! Running contrary to these demands, several advisors have suggested that the taxation collected from these new residents could be put towards city improvements.\n\nWhat must be done with these new arrivals?"
me_racial_events_21.a: "We must expand our city to welcome them!"
me_racial_events_21.b: "Send them away"
me_racial_events_21.c: "I don't have time for this"
end_focus_tooltip: "#Y We will stop focusing on this race#!"

me_racial_events_22_title: "Locals Demand Autonomy"
me_racial_events_22_desc: "Troubling news from our frontiers, O #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!!\n\nIt appears that unrest is simmering amongst the [SCOPE.sCountryCulture('chosen_culture').GetCulture.GetName|Y] of [SCOPE.sP('autonomous_community').GetName|Y]. Their local leaders claim their community suffers under our yoke, and ask for more autonomy under our rule. They argue that their community's acceptance of our rule and laws entitles them to the consideration of their demands. How presumptuous!\n\nDespite their outrageous arguments, their offer might be worth considering. Their integration into our society may serve as an example to others like them, and spare us the cost of ensuring their obedience."
me_racial_events_22.a: "Allow it to keep the peace"
me_racial_events_22.b: "They are under our control and will obey us!"

me_racial_events_23_title: "Prominent Minister"
me_racial_events_23_desc: "Great #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!, rumors spread like wildfires amongst the court!\n\nIt appears that minister #Y [SCOPE.sCharacter('original_minister').GetFirstName]#! has been caught up in a minor corruption scandal, and news of [SCOPE.sCharacter('original_minister').GetHerHis] alleged crimes have smeared his reputation at court. However disappointing this news is, it presents us with a unique opportunity. If we decided to, we could seize this opportune moment to step in and secure his loyalty by silencing this baseless slander.\n\nAlternatively, we could take advantage of a new, promising face that has recently made an impact at court. Young #Y [SCOPE.sCharacter('talented_minister').GetFirstName]#! has taken the court by storm ever since his arrival, with his wit and capability convincing many to recommend him as a possible replacement for #Y [SCOPE.sCharacter('original_minister').GetName]#!. Although [SCOPE.sCharacter('talented_minister').GetHerHis] skill is undeniable, #Y [SCOPE.sCharacter('talented_minister').GetFirstName]'s#! humble background as a peasant from the [SCOPE.sCountryCulture('chosen_culture').GetCulture.GetName|Y] people might ruffle some feathers amongst the older elites.\n\nThere is much to gain and much to lose from either decision, however, ultimately the choice is yours. What must be done?"
me_racial_events_23.a: "#E [SCOPE.sCharacter('talented_minister').GetFirstName]#! seems like a better fit for the job"
me_racial_events_23.b: "#E [SCOPE.sCharacter('original_minister').GetFirstName]#! deserves [SCOPE.sCharacter('original_minister').GetHerHis] position"

me_racial_events_24_title: "Integrated Conversion"
me_racial_events_24_desc: "My [ROOT.GetCountry.GetRulerTitle], there is curious news from the countryside. Some of our subjects have begun adopting the customs of an integrated community, and our officials are wondering whether to encourage the change.\n\nIt seems that living together has accomplished what so many speeches could not. Shall we give these families a little assistance, or leave them to find their own way?"
me_racial_events_24.a: "Great!"
me_racial_events_24.b: "We should encourage this"

me_racial_events_25_title: "Refugees Flee"
me_racial_events_25_desc: "#G Wise#! #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!, news from the border!\n\nIt appears our guards have stopped a large caravan of [SCOPE.sCountryCulture('chosen_culture').GetCulture.GetName|Y] peasants attempting to leave the country. They carry with them few belongings but what they need to survive. However, when checked, our soldiers found that they had brought along a few weapons such as bows and spears that they claim they needed to 'protect themselves' in what could be hostile lands.\n\nLetting them go would be harmless enough, its not like these vagabonds pose any threat to us. However, we could use the contraband as an excuse to extract 'donations' from this group in exchange for safe passage. What should we do?"
me_racial_events_25.a: "Seize their belongings!"
me_racial_events_25.b: "Let them go"

me_racial_events_26_title: "Unrest Grows"
me_racial_events_26_desc: "Great #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!, there is troubling news from our [SCOPE.sCountryCulture('chosen_culture').GetCulture.GetName|Y] territories!\n\nOur orders have not been well-received by the local community of [SCOPE.sP('angry_minority_town').GetName|Y], who refuse to move from their ancestral lands. Several of their elders have begun subtly encouraging treasonous actions, and it appears that most of the town is preparing to violently resist our rule. This behavior is unacceptable, and will surely encourage neighboring [SCOPE.sCountryCulture('chosen_culture').GetCulture.GetName|Y] towns to stay and revolt.\n\nOfficials in the region have proposed three possible actions: negotiating with the townsfolk to avoid a rebellion, root out their leaders and snuff out the growing revolt, or burning the town to serve as an example to other would-be rebels. What should we do?"
me_racial_events_26.a: "We must be able to reach a compromise"
me_racial_events_26.b: "Make an example of their leaders"
me_racial_events_26.c: "Burn it all"

me_racial_events_27_title: "Incoming Settlers"
me_racial_events_27_desc: "Excellent news from the hinterlands, O #Y [ROOT.GetCountry.GetRuler.GetFirstName]#!!\n\nIt appears that our resettlement efforts have borne fruit, as many families from the crowded hovels of [SCOPE.sP('settler_home').GetName|Y] have traveled to settle in the lands of the [SCOPE.sCountryCulture('chosen_culture').GetCulture.GetName|Y]! With loyal colonists in the region, it is only a matter of time before our control over their former lands is secured.\n\nDespite this good news, minor skirmishes in the province of [SCOPE.sP('settler_colony').GetName|Y] have escalated from a minor inconvenience to a noticeable problem. Although our intentions from the beginning were to undermine the unruly locals, such outright favoritism towards incoming settlers may inspire revolts or retribution from the [SCOPE.sCountryCulture('chosen_culture').GetCulture.GetName|Y]. \n\nOne of the officials from the town has suggested resettling the locals from the area to avoid further bloodshed, while another urges us to maintain a temporary peace by punishing the settlers. What should we do?"
me_racial_events_27.a: "There is nothing we can do"
me_racial_events_27.b: "Punish the Settlers"
me_racial_events_27.c: "Resettle the locals"

# Specific Events

# Integrate
me_racial_events_28_title: "A Place at the Table"
me_racial_events_28_desc: "My [ROOT.GetCountry.GetRulerTitle], the children of our integrated #Y Halfling#! families are adopting the customs of the wider realm, much to the surprise of officials who were still debating how to introduce them.\n\nWe could leave these families to find their own way, or spend money encouraging others to follow their example. Our advisors recommend the latter, as advisors so often do when the money belongs to the treasury."
me_racial_events_28.a: "Let them find their own way"
me_racial_events_28.b: "Encourage the change"

me_racial_events_29_title: "Neighbors Become Kinsmen"
me_racial_events_29_desc: "My [ROOT.GetCountry.GetRulerTitle], families from our integrated communities have begun taking up the customs of our people. Our officials call it a great success, although the families seem to have managed quite well without their assistance.\n\nWe could leave these families to find their own way, or spend money encouraging others to follow their example. Our advisors recommend the latter, as advisors so often do when the money belongs to the treasury."
me_racial_events_29.a: "Let them find their own way"
me_racial_events_29.b: "Encourage the change"

me_racial_events_30_title: "Between Two Worlds"
me_racial_events_30_desc: "My [ROOT.GetCountry.GetRulerTitle], some of our integrated #Y Half Elven#! families have begun adopting the customs of the wider realm. What the court describes as a great achievement appears, to the families concerned, to be an ordinary part of life.\n\nWe could leave these families to find their own way, or spend money encouraging others to follow their example. Our advisors recommend the latter, as advisors so often do when the money belongs to the treasury."
me_racial_events_30.a: "Let them find their own way"
me_racial_events_30.b: "Encourage the change"

me_racial_events_31_title: "Familiar Customs, New Faces"
me_racial_events_31_desc: "My [ROOT.GetCountry.GetRulerTitle], our integrated communities are becoming familiar faces in the markets and villages of the realm. Their children increasingly speak and live as our own people do, and our officials are eager to claim the credit.\n\nWe could leave these families to find their own way, or spend money encouraging others to follow their example. Our advisors recommend the latter, as advisors so often do when the money belongs to the treasury."
me_racial_events_31.a: "Let them find their own way"
me_racial_events_31.b: "Encourage the change"

me_racial_events_32_title: "A New Generation"
me_racial_events_32_desc: "My [ROOT.GetCountry.GetRulerTitle], there is curious news concerning our integrated #Y Naga#! communities. Some families have adopted the customs of our people, and the magistrates are already drafting a report on their own remarkable success.\n\nWe could leave these families to find their own way, or spend money encouraging others to follow their example. Our advisors recommend the latter, as advisors so often do when the money belongs to the treasury."
me_racial_events_32.a: "Let them find their own way"
me_racial_events_32.b: "Encourage the change"

me_racial_events_33_title: "Old Names, New Customs"
me_racial_events_33_desc: "My [ROOT.GetCountry.GetRulerTitle], our officials report that families from our integrated communities are adopting the customs of our people. The old distinctions are fading, though one would hardly know it from the amount of paperwork this has produced.\n\nWe could leave these families to find their own way, or spend money encouraging others to follow their example. Our advisors recommend the latter, as advisors so often do when the money belongs to the treasury."
me_racial_events_33.a: "Let them find their own way"
me_racial_events_33.b: "Encourage the change"

# Expel
me_racial_events_34_title: "The Book Is Still Open"
me_racial_events_34_desc: "My [ROOT.GetCountry.GetRulerTitle], a delegation of elders has arrived at court carrying a book so heavy that two attendants are needed to hold it. Its pages contain a remarkably thorough account of every wrong the #Y Dragkhans#! have ever done us, including several that nobody alive could possibly remember.\n\nOur efforts to welcome Dragkhan communities have offended the keepers of these grudges. They demand that we abandon this foolishness at once. We could insist upon reconciliation, though persuading the court will consume some of our influence. Otherwise, we may let the elders have their way; our new subjects will certainly hear of it."
me_racial_events_34.a: "The book may remember. We must look ahead."
me_racial_events_34.b: "Let the elders be heard"

me_racial_events_35_title: "Chains Beneath the Welcome"
me_racial_events_35_desc: "My [ROOT.GetCountry.GetRulerTitle], there is troubling news from our #Y Human#! communities. Our officials have spoken at great length about welcoming them into society, but some of their families still remember the chains, and fine words have done little to quiet their anger.\n\nA violent disturbance has brought the matter before the court. We could spend money repairing the damage and addressing their grievances, or send soldiers to restore order. The latter may quiet the streets, but it will hardly convince these people that our welcome was sincere."
me_racial_events_35.a: "Pay for relief and hear their grievances"
me_racial_events_35.b: "Send soldiers to restore order"

me_racial_events_36_title: "An Ugly Trade"
me_racial_events_36_desc: "My [ROOT.GetCountry.GetRulerTitle], our magistrates have brought us a most unpleasant report. Several #Y Gnomes#! have been found murdered, and the guards suspect traders who have been selling their remains as ingredients for miraculous remedies. Apparently there is no shortage of fools willing to buy such things.\n\nThe Gnomish community is demanding protection. A proper investigation and compensation for the families will be expensive, but dismissing their petition would be a very public admission that our promises of acceptance mean little."
me_racial_events_36.a: "Find the killers and assist the families"
me_racial_events_36.b: "The treasury cannot answer every petition"

me_racial_events_37_title: "Trouble on the Merchant Road"
me_racial_events_37_desc: "My [ROOT.GetCountry.GetRulerTitle], a party of merchants has arrived at the capital with empty wagons and a great many complaints. They claim that #Y Goblin#! raiders took their goods, and now demand punishment for a nearby Goblin settlement. The settlement denies having anything to do with the attack.\n\nOur officials suggest compensating the merchants while seeking an agreement with the local community. The captains would rather send a patrol and compel obedience. One course will burden the treasury; the other will cost us soldiers and much of the trust we have been trying to build."
me_racial_events_37.a: "Compensate the merchants and seek an agreement"
me_racial_events_37.b: "Send a patrol. We need the road secured."

me_racial_events_38_title: "A Welcome With Conditions"
me_racial_events_38_desc: "My [ROOT.GetCountry.GetRulerTitle], the leaders of our #Y Drow#! communities have sent a petition that has caused considerable irritation among the courtiers. They are willing to cooperate with our officials, but insist that their own grievances must be heard before further demands are made of them.\n\nSome at court consider this an excellent beginning. Others consider it an excellent reason to remind the petitioners who rules these lands. We could spend our influence securing a compromise, or satisfy the court by dismissing the petition. The Drow are unlikely to mistake the meaning of either answer."
me_racial_events_38.a: "Find a compromise the court will accept"
me_racial_events_38.b: "They will obey the same orders as everyone else"



racial_focus_mod: "Race Focus"
racial_focus_mod_desc: "Focusing our government on settling racial issues is utilizing significant resources"
integrate_tooltip: "Begin #G cultural integration#!. Every #Y 180 days#!, acceptance advances for one populated, unintegrated culture of this race. At #Y level 4#! it receives native cultural integration. Pops retain their #Y original culture#!. The focus ends when all its populated cultures are integrated."
expel_tooltip: "Begin #R expulsion#!. Every #Y 180 days#!, up to #Y 3 pops#! of a matching culture move from one territory into foreign territory across a land border. Pops retain their culture. If no foreign destination exists, the policy waits and reports the blockage. The focus ends when no matching pops remain."
ignore_tooltip: "End this racial focus at #G no cost#! and remove its ongoing penalties. Another focus may begin after #Y 366 days#!, once outstanding reports have expired."
revolt_tooltip.1: "#G We will raze the settlement and enforce our control on the province!#!"
revolt_tooltip.2: "#R Local separatists will stage a revolt!#!"


