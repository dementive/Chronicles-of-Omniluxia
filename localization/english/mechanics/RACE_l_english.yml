l_english:

racial_events: "Manage Races"
racial_events_desc: "Open the race management menu to integrate or expel a minority. Only one focus can be active at a time."

me_racial_events_1_title: "Race Management Menu" # Choose Race
me_racial_events_1_desc: "My [ROOT.GetCountry.GetRulerTitle], our realm is home to many peoples, and their future is ours to shape. Our officials can devote their attention to #G integrating#! a community or #R expelling#! it, though they can manage only one such undertaking at a time.\n\nBeginning a focus costs #Y 25#! political influence and places an ongoing burden on our government. We may end it at no cost from the chosen people's page, though a new focus must wait #Y 366 days#! while outstanding orders expire. Who shall receive our attention?"
me_racial_events_1.a: "Half Elf"
me_racial_events_1.b: "Wood Elf"
me_racial_events_1.c: "Orc"
me_racial_events_1.d: "Dwarf"
me_racial_events_1.e: "Naga"
