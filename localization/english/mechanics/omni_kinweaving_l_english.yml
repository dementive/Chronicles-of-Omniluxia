l_english:
 me_zorgo_magic_focus.7.kinweaving:0 "#E Kinweaving#!"
 omni_kinweaving_effect_tt:0 "Transforms #Y one local pop#! into your country's #Y primary culture#!, bypassing racial assimilation penalties. Preserves the pop's religion and social class. Requires an owned, controlled territory at the caster's location or a commanded army's location. The territory cannot receive Kinweaving again for #Y 365 days#!, regardless of caster."
 omni_kinweaving_mana_tt:0 "Base cost: #Y 100 mana#!. Terrain and caster rank modify the final cost."
 omni_kinweaving_cooldown:0 "Kinweaving: Settling into a New Form"
 omni_kinweaving_cooldown_desc:0 "A local inhabitant has been transformed into the ruling people's form and culture. This territory cannot receive another Kinweaving ritual until this modifier expires."
