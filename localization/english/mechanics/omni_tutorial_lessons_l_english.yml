l_english:
 omni_review_royal_progress_lessons:0 "Consult the Royal Progress Papers"
 omni_review_royal_progress_lessons_desc:0 "The clerks have kept the papers the council assembled for the royal progress. Ask to see the ones you need."
 omni_tutorial_lessons.1.t:0 "The Royal Progress Papers"
 omni_tutorial_lessons.1.desc:0 "The chamberlain has set the papers from the royal progress on the council table. He put the marshal's accounts beside the letters from the academy, since the two men have been sending him to each other for answers. The other clerks stayed to see which papers you would ask for."
 omni_tutorial_lessons.close:0 "Leave the papers with the chamberlain."
 omni_tutorial_lessons.back:0 "Bring me the other papers."
 omni_tutorial_lessons.2.t:0 "The Marshal's Papers"
 omni_tutorial_lessons.2.open:0 "Ask the marshal about magic."
 omni_tutorial_lessons.2.desc:0 "The marshal had the ram crew put its expenses on one sheet, and the academy masters sent him three more for the things a ram cannot do. He has asked the quartermaster to keep them together, since it is usually the same captain who comes looking for all four.\n\nAt a #Y Mage Tower#!, use #Y Visit City#! to look for advanced spells in a school your visitor has mastered. Check the price and requirements before buying. A commander who can cast #Y Fast March#! can quicken an army along its route for seven days at a cost in mana and morale. Order a march and watch its arrival date change. At a siege with a qualified caster or mage unit, open the siege spell control and check what the available spell will do before casting."
 omni_tutorial_lessons.3.t:0 "Names on the Pay Roll"
 omni_tutorial_lessons.3.open:0 "Ask the quartermaster about mages."
 omni_tutorial_lessons.3.desc:0 "The quartermaster brought two pay rolls to the hall. One had space for a mage cohort and the other bore the seal of a company whose captain had asked for his silver before his people crossed the border. The marshal sent both rolls back with a request to see what each company could do.\n\nIn legion recruitment, inspect the #Y Imperial Mages#! and #Y Folk Mages#! entries. Their tooltips list the required laws, resources, and local or realm conditions. When a cohort is available, recruit it and inspect its army's spell controls. In the mercenary list, look for the magic indicator and compare the hiring price and upkeep before taking a company into service."
 omni_tutorial_lessons.4.t:0 "The Vault and the Library"
 omni_tutorial_lessons.4.open:0 "Ask the keepers about their shelves."
 omni_tutorial_lessons.4.desc:0 "When the keeper brought up a treasure from the vault, the clerk left its place in the ledger open so that he would know where to enter it again. A librarian who had come to collect payment for a scroll watched him do it and asked whether the court kept as careful a record of what it read.\n\nOpen #Y Items#! on a character to inspect the treasure options. Equipping a treasure takes it from the realm's vault and makes it a personal artifact. Use #Y Return a Treasure#! to put it back. To give ordinary gear away, use the gift interaction on an eligible adult at your court and inspect the item before confirming. At a city with a #Y Library#!, use #Y Visit City#! and #Y Browse Scrolls#! to see what is in stock. Read the tooltip before paying. A scroll you have already read can be opened again when it is in stock."
 omni_tutorial_lessons.5.t:0 "Papers from the Court"
 omni_tutorial_lessons.5.open:0 "Ask the steward about the household."
 omni_tutorial_lessons.5.desc:0 "A tutor arrived with a list of the children he had been asked to teach, and the steward made him wait while an envoy read out the terms of a marriage. By the time the envoy finished, the tutor had put a mark beside the names of the children whose families had yet to say what they wanted taught.\n\nOpen #Y Educate Child#! on an eligible child and inspect the education choices before choosing one. The #Y Seduce Character#! interaction can lead to a courtship with costs, rejection, or discovery. Read the choices as they arise. When the dynastic marriage alert appears, open the ruler and inspect a qualifying foreign match. Acceptance can bind the other crown as a junior partner, and a child of the marriage who inherits that crown can strengthen the claim to a fuller union."
 omni_tutorial_lessons.6.t:0 "Reports from the Roads"
 omni_tutorial_lessons.6.open:0 "Ask the council about emergencies."
 omni_tutorial_lessons.6.desc:0 "The council received one report from a watchman who had closed the road when people began to fall ill, and another from a village where the elders had counted the damage before asking the crown for help. Both reports named the people who would have to carry out any orders sent from the hall.\n\nWhen a #Y disease outbreak#! begins, inspect the affected territory and compare the cost of containment with the risk of the outbreak worsening or spreading. Check the resolution report for the outcome. When a #Y natural disaster#! strikes, read the local report before choosing how to respond. Some chains offer a further chance to prepare. Check the territory's modifiers for the effects of the damage and any relief."
