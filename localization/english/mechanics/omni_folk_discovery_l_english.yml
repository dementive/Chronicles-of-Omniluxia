 omni_folk_discovery.learn_dreaming:0 "Learn: $me_zorgo_magic_focus.7.a$ (50 gold)"
 omni_folk_discovery.effect_dreaming:0 "#T $me_zorgo_magic_focus.7.a$#!\nHas a 10% chance of a reward: 50% of successful casts grant +10 military experience, 40% grant the caster +1 permanent Martial, and 10% grant one innovation."
 omni_folk_discovery.learn_scramble:0 "Learn: $me_zorgo_magic_focus.7.b$ (50 gold)"
 omni_folk_discovery.effect_scramble:0 "#T $me_zorgo_magic_focus.7.b$#!\nFor 180 days, the caster grants commanded heavy and light infantry +7.5% movement speed."
 omni_folk_discovery.learn_water_walker:0 "Learn: $me_zorgo_magic_focus.7.c$ (50 gold)"
 omni_folk_discovery.effect_water_walker:0 "#T $me_zorgo_magic_focus.7.c$#!\nFor 180 days, the caster grants commanded fleets +85% ship capture chance, +25% naval damage dealt, and +25% naval damage taken."
 omni_folk_discovery.learn_unified_blades:0 "Learn: $me_zorgo_magic_focus.7.d$ (50 gold)"
 omni_folk_discovery.effect_unified_blades:0 "#T $me_zorgo_magic_focus.7.d$#!\nFor 180 days, the caster grants commanded heavy and light infantry +12.5% offense and +7.5% discipline."
 omni_folk_discovery.learn_golden_hands:0 "Learn: $me_zorgo_magic_focus.7.e$ (50 gold)"
 omni_folk_discovery.effect_golden_hands:0 "#T $me_zorgo_magic_focus.7.e$#!\nHas a 10% chance to grant the country one free provincial investment. Otherwise, no investment is granted."
 omni_folk_discovery.learn_craftsmans_knowledge:0 "Learn: $me_zorgo_magic_focus.7.f$ (50 gold)"
 omni_folk_discovery.effect_craftsmans_knowledge:0 "#T $me_zorgo_magic_focus.7.f$#!\nHas a 10% chance to permanently grant the caster +1 Finesse."
 omni_folk_discovery.learn_cafeas_breath:0 "Learn: $me_zorgo_magic_focus.7.g$ (50 gold)"
 omni_folk_discovery.effect_cafeas_breath:0 "#T $me_zorgo_magic_focus.7.g$#!\nRemoves one caster affliction, taking the first present in this order: Hunchback, Limp, Castrated, Blind, Maimed, One-Eyed, Brain Damaged. The shared caster-eligibility rule blocks casting while Brain Damaged."
 omni_folk_discovery.learn_bloodlust:0 "Learn: $me_zorgo_magic_focus.7.h$ (50 gold)"
 omni_folk_discovery.effect_bloodlust:0 "#T $me_zorgo_magic_focus.7.h$#!\nFor 180 days, the caster gains +10 Martial but -12 Charisma, Finesse, and Zeal. The trait also carries country penalties of -0.02 monthly stability, -5% tax income, and -0.02 monthly province loyalty."
 omni_folk_discovery.learn_naathrans_blessing:0 "Learn: $me_zorgo_magic_focus.7.i$ (50 gold)"
 omni_folk_discovery.effect_naathrans_blessing:0 "#T $me_zorgo_magic_focus.7.i$#!\nHas a 10% chance to grant the country one free provincial investment."
 omni_folk_discovery.learn_serpentine_scrying:0 "Learn: $me_zorgo_magic_focus.7.k$ (50 gold)"
 omni_folk_discovery.effect_serpentine_scrying:0 "#T $me_zorgo_magic_focus.7.k$#!\nHas a 10% chance to grant the country +8 military experience."
 omni_folk_discovery.learn_raging_dragon:0 "Learn: $me_zorgo_magic_focus.7.l$ (50 gold)"
 omni_folk_discovery.effect_raging_dragon:0 "#T $me_zorgo_magic_focus.7.l$#!\nFor 180 days, the caster grants commanded light cavalry, heavy cavalry, and horse archers +7.5% offense and +12.5% movement speed."
 omni_folk_discovery.learn_gozons_blessing:0 "Learn: $me_zorgo_magic_focus.7.j$ (50 gold)"
 omni_folk_discovery.effect_gozons_blessing:0 "#T $me_zorgo_magic_focus.7.j$#!\nHas a 10% chance to permanently grant the caster +1, +2, or +3 Zeal, with equal chances."
 omni_folk_discovery.learn_victorys_blessing:0 "Learn: $me_zorgo_magic_focus.7.n$ (50 gold)"
 omni_folk_discovery.effect_victorys_blessing:0 "#T $me_zorgo_magic_focus.7.n$#!\nFor 180 days, the caster gains +3 Martial and commanded armies gain +25% land morale."
 omni_folk_discovery.learn_revelations_of_the_way:0 "Learn: $me_zorgo_magic_focus.7.o$ (50 gold)"
 omni_folk_discovery.effect_revelations_of_the_way:0 "#T $me_zorgo_magic_focus.7.o$#!\nHas a 10% chance of a reward: +1 permanent caster Zeal, +1 permanent caster Martial, or one innovation, with equal chances."
 omni_folk_discovery.learn_kons_wisdom:0 "Learn: $me_zorgo_magic_focus.7.p$ (50 gold)"
 omni_folk_discovery.effect_kons_wisdom:0 "#T $me_zorgo_magic_focus.7.p$#!\nHas a 10% chance to permanently grant the caster +1 to one randomly selected attribute: Martial, Charisma, Finesse, or Zeal, with equal chances."
 omni_folk_discovery.learn_berserker_rage:0 "Learn: $me_zorgo_magic_focus.7.q$ (50 gold)"
 omni_folk_discovery.effect_berserker_rage:0 "#T $me_zorgo_magic_focus.7.q$#!\nFor 180 days, the caster gains +10 Martial but -10 Charisma, Finesse, and Zeal; commanded armies gain +5% land morale. The trait also carries country penalties of -0.02 monthly stability, -5% tax income, and -0.02 monthly province loyalty."
 omni_folk_discovery.learn_channeled_stars:0 "Learn: $me_zorgo_magic_focus.7.r$ (50 gold)"
 omni_folk_discovery.effect_channeled_stars:0 "#T $me_zorgo_magic_focus.7.r$#!\nHas a 10% chance to permanently grant the caster +1 to one randomly selected attribute: Martial, Charisma, Finesse, or Zeal, with equal chances. Otherwise, no attribute is increased."
 omni_folk_discovery.learn_ancestral_rumination:0 "Learn: $me_zorgo_magic_focus.7.s$ (50 gold)"
 omni_folk_discovery.effect_ancestral_rumination:0 "#T $me_zorgo_magic_focus.7.s$#!\nHas a 10% chance of a reward: +8 military experience, one innovation, or +1 permanent caster Zeal, with equal chances."
 omni_folk_discovery.learn_explosion:0 "Learn: $me_zorgo_magic_focus.7.t$ (50 gold)"
 omni_folk_discovery.effect_explosion:0 "#T $me_zorgo_magic_focus.7.t$#!\nIn an enemy-owned territory where a caster-commanded army stands, kills approximately one fifth of the pops. For 64 days, the territory also receives -50% local defensiveness, -50% garrison size, and -0.04 local population growth."
 omni_folk_discovery.learn_coils_of_the_serpent:0 "Learn: $me_zorgo_magic_focus.7.v$ (50 gold)"
 omni_folk_discovery.effect_coils_of_the_serpent:0 "#T $me_zorgo_magic_focus.7.v$#!\nGrants the country +10% enslavement efficiency for 365 days. Recasting refreshes the duration."
 omni_folk_discovery.learn_great_flare:0 "Learn: $me_zorgo_magic_focus.14.a$ (50 gold)"
 omni_folk_discovery.effect_great_flare:0 "#T $me_zorgo_magic_focus.14.a$#!\nDestroys one randomly selected army or navy commanded by the targeted character."
 omni_folk_discovery.learn_blade_storm:0 "Learn: $me_zorgo_magic_focus.14.b$ (50 gold)"
 omni_folk_discovery.effect_blade_storm:0 "#T $me_zorgo_magic_focus.14.b$#!\nReduces the targeted character's Health by 2."
 omni_folk_discovery.learn_steal:0 "Learn: $me_zorgo_magic_focus.14.c$ (50 gold)"
 omni_folk_discovery.effect_steal:0 "#T $me_zorgo_magic_focus.14.c$#!\nAn offensive spell cast in battle on an enemy general whose country is at war with yours. Removes 25 personal gold from the target and adds 25 gold to your country's treasury. The target must have at least 25 gold."
 omni_folk_discovery.learn_stinging_nettles:0 "Learn: $me_zorgo_magic_focus.14.d$ (50 gold)"
 omni_folk_discovery.effect_stinging_nettles:0 "#T $me_zorgo_magic_focus.14.d$#!\nDeals 5% damage to one randomly selected unit commanded by the targeted character."
 omni_folk_discovery.learn_serpentine_swords:0 "Learn: $me_zorgo_magic_focus.14.e$ (50 gold)"
 omni_folk_discovery.effect_serpentine_swords:0 "#T $me_zorgo_magic_focus.14.e$#!\nDeals 5% damage to one randomly selected unit commanded by the targeted character."
 omni_folk_discovery.learn_imperial_dragons_claw:0 "Learn: $me_zorgo_magic_focus.14.f$ (50 gold)"
 omni_folk_discovery.effect_imperial_dragons_claw:0 "#T $me_zorgo_magic_focus.14.f$#!\nDeals 8% damage to one randomly selected unit commanded by the targeted character."
 omni_folk_discovery.learn_sword_of_jaoz:0 "Learn: $me_zorgo_magic_focus.14.g$ (50 gold)"
 omni_folk_discovery.effect_sword_of_jaoz:0 "#T $me_zorgo_magic_focus.14.g$#!\nGives the targeted character Maimed; kills the character instead if already Maimed."
 omni_folk_discovery.learn_hellas_light:0 "Learn: $me_zorgo_magic_focus.14.h$ (50 gold)"
 omni_folk_discovery.effect_hellas_light:0 "#T $me_zorgo_magic_focus.14.h$#!\nGives the targeted character Blind; kills the character instead if already Blind."
 omni_folk_discovery.learn_hypnosis:0 "Learn: $me_zorgo_magic_focus.21.a$ (50 gold)"
 omni_folk_discovery.effect_hypnosis:0 "#T $me_zorgo_magic_focus.21.a$#!\nGives the targeted character Submissive; if already Submissive, gives Weak-Willed; if both are already present, grants +15 Loyalty, decaying by 1 per year."
 omni_folk_discovery.learn_cafeas_grace:0 "Learn: $me_zorgo_magic_focus.21.b$ (50 gold)"
 omni_folk_discovery.effect_cafeas_grace:0 "#T $me_zorgo_magic_focus.21.b$#!\nGrants the targeted character +1 Charisma and +35% fertility for 365 days."
 omni_folk_discovery.learn_atheus_blessing:0 "Learn: $me_zorgo_magic_focus.21.c$ (50 gold)"
 omni_folk_discovery.effect_atheus_blessing:0 "#T $me_zorgo_magic_focus.21.c$#!\nGrants the targeted character +1 Charisma and +25% fertility for 365 days."
 omni_folk_discovery.learn_kinweaving:0 "Learn: $me_zorgo_magic_focus.7.kinweaving$ (50 gold)"
 omni_folk_discovery.effect_kinweaving:0 "#T $me_zorgo_magic_focus.7.kinweaving$#!\nTransforms one non-primary-culture pop in an owned, controlled territory at the caster's location or a commanded army's location into the casting country's primary culture. Preserves religion and pop type. A shared territory cooldown prevents another transformation there for 365 days, regardless of caster."
 omni_folk_discovery.directory_desc:0 "A carter remembers a lamp burning beyond the last field; a soldier recalls a healer who asked where he had learned his prayers. Following such accounts, our traveller gathers names of those said to keep the #T old arts#!. Their doors seldom bear a sign, but the people nearby know whom to seek.\n\nNo reliable directions to a #T wizard hut#! have been gathered for this region. A local #T Mage Tower#! may still offer instruction in the traditions of its people and faith. To visit a teacher abroad, our traveller will need #Y military access#! or control of the territory."
 omni_folk_discovery.region_100:0 "Asking after the #T old arts#! in #G $ant_island_central_region$#! brings accounts of quiet dwellings beyond the busy roads. Some speakers lower their voices; others give directions readily, remembering a cured fever or a blessing over a difficult harvest. Our traveller sets down the names, and the particular traditions each teacher is said to preserve.\n\n#T Local teachers#!\n[GetProvince('(int32)4902').GetName|G] — $me_zorgo_magic_focus.14.b$\n[GetProvince('(int32)4914').GetName|G] — $me_zorgo_magic_focus.7.g$\n\nA visit need not await conquest: #Y military access#! is enough to approach a teacher in foreign lands. In wartime, the territory must first be brought under our control. Each lesson costs the visiting pupil #Y 50 gold#! from their own purse."
