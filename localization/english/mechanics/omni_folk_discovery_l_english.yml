 omni_folk_discovery.learn_dreaming:0 "Learn: $me_zorgo_magic_focus.7.a$ (50 gold)"
 omni_folk_discovery.effect_dreaming:0 "Base casting cost: 50 mana. Random outcome: 50% chance of +10 country military experience, 40% chance of +1 permanent caster Martial, or 10% chance of +1 country innovation. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_scramble:0 "Learn: $me_zorgo_magic_focus.7.b$ (50 gold)"
 omni_folk_discovery.effect_scramble:0 "Base casting cost: 15 mana. For 180 days, the caster grants commanded heavy and light infantry +7.5% movement speed. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_water_walker:0 "Learn: $me_zorgo_magic_focus.7.c$ (50 gold)"
 omni_folk_discovery.effect_water_walker:0 "Base casting cost: 15 mana. For 180 days, the caster grants commanded fleets +85% ship capture chance, +25% naval damage dealt, and +25% naval damage taken. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_unified_blades:0 "Learn: $me_zorgo_magic_focus.7.d$ (50 gold)"
 omni_folk_discovery.effect_unified_blades:0 "Base casting cost: 25 mana. For 180 days, the caster grants commanded heavy and light infantry +12.5% offense and +7.5% discipline. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_golden_hands:0 "Learn: $me_zorgo_magic_focus.7.e$ (50 gold)"
 omni_folk_discovery.effect_golden_hands:0 "Base casting cost: 50 mana. Grants the country one free provincial investment. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_craftsmans_knowledge:0 "Learn: $me_zorgo_magic_focus.7.f$ (50 gold)"
 omni_folk_discovery.effect_craftsmans_knowledge:0 "Base casting cost: 50 mana. Permanently grants the caster +1 Finesse. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_cafeas_breath:0 "Learn: $me_zorgo_magic_focus.7.g$ (50 gold)"
 omni_folk_discovery.effect_cafeas_breath:0 "Base casting cost: 75 mana. Removes one caster affliction, taking the first present in this order: Hunchback, Limp, Castrated, Blind, Maimed, One-Eyed, Brain Damaged. The shared caster-eligibility rule blocks casting while Brain Damaged. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_bloodlust:0 "Learn: $me_zorgo_magic_focus.7.h$ (50 gold)"
 omni_folk_discovery.effect_bloodlust:0 "Base casting cost: 50 mana. For 180 days, the caster gains +10 Martial but -12 Charisma, Finesse, and Zeal. The trait also carries country penalties of -0.02 monthly stability, -5% tax income, and -0.02 monthly province loyalty. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_naathrans_blessing:0 "Learn: $me_zorgo_magic_focus.7.i$ (50 gold)"
 omni_folk_discovery.effect_naathrans_blessing:0 "Base casting cost: 50 mana. Grants the country one free provincial investment. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_serpentine_scrying:0 "Learn: $me_zorgo_magic_focus.7.k$ (50 gold)"
 omni_folk_discovery.effect_serpentine_scrying:0 "Base casting cost: 15 mana. Grants the country +8 military experience. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_raging_dragon:0 "Learn: $me_zorgo_magic_focus.7.l$ (50 gold)"
 omni_folk_discovery.effect_raging_dragon:0 "Base casting cost: 50 mana. For 180 days, the caster grants commanded light cavalry, heavy cavalry, and horse archers +7.5% offense and +12.5% movement speed. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_gozons_blessing:0 "Learn: $me_zorgo_magic_focus.7.j$ (50 gold)"
 omni_folk_discovery.effect_gozons_blessing:0 "Base casting cost: 50 mana. Permanently grants the caster +1, +2, or +3 Zeal, with equal chances. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_victorys_blessing:0 "Learn: $me_zorgo_magic_focus.7.n$ (50 gold)"
 omni_folk_discovery.effect_victorys_blessing:0 "Base casting cost: 25 mana. For 180 days, the caster gains +3 Martial and commanded armies gain +25% land morale. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_revelations_of_the_way:0 "Learn: $me_zorgo_magic_focus.7.o$ (50 gold)"
 omni_folk_discovery.effect_revelations_of_the_way:0 "Base casting cost: 50 mana. Equal chance of +1 permanent caster Zeal, +1 permanent caster Martial, or +1 country innovation. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_kons_wisdom:0 "Learn: $me_zorgo_magic_focus.7.p$ (50 gold)"
 omni_folk_discovery.effect_kons_wisdom:0 "Base casting cost: 50 mana. Permanently grants the caster +1 to one randomly selected attribute: Martial, Charisma, Finesse, or Zeal, with equal chances. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_berserker_rage:0 "Learn: $me_zorgo_magic_focus.7.q$ (50 gold)"
 omni_folk_discovery.effect_berserker_rage:0 "Base casting cost: 25 mana. For 180 days, the caster gains +10 Martial but -10 Charisma, Finesse, and Zeal; commanded armies gain +5% land morale. The trait also carries country penalties of -0.02 monthly stability, -5% tax income, and -0.02 monthly province loyalty. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_channeled_stars:0 "Learn: $me_zorgo_magic_focus.7.r$ (50 gold)"
 omni_folk_discovery.effect_channeled_stars:0 "Base casting cost: 50 mana. Permanently grants the caster +1 to one randomly selected attribute: Martial, Charisma, Finesse, or Zeal, with equal chances. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_ancestral_rumination:0 "Learn: $me_zorgo_magic_focus.7.s$ (50 gold)"
 omni_folk_discovery.effect_ancestral_rumination:0 "Base casting cost: 50 mana. Equal chance of +8 country military experience, +1 country innovation, or +1 permanent caster Zeal. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_explosion:0 "Learn: $me_zorgo_magic_focus.7.t$ (50 gold)"
 omni_folk_discovery.effect_explosion:0 "Base casting cost: 75 mana. In an enemy-owned territory where a caster-commanded army stands, kills approximately one fifth of the pops. For 64 days, the territory also receives -50% local defensiveness, -50% garrison size, and -0.04 local population growth. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_coils_of_the_serpent:0 "Learn: $me_zorgo_magic_focus.7.v$ (50 gold)"
 omni_folk_discovery.effect_coils_of_the_serpent:0 "Base casting cost: 50 mana. Grants the country +10% enslavement efficiency for 365 days. Recasting refreshes the duration. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_great_flare:0 "Learn: $me_zorgo_magic_focus.14.a$ (50 gold)"
 omni_folk_discovery.effect_great_flare:0 "Base casting cost: 200 mana. Destroys one randomly selected army or navy commanded by the targeted character. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_blade_storm:0 "Learn: $me_zorgo_magic_focus.14.b$ (50 gold)"
 omni_folk_discovery.effect_blade_storm:0 "Base casting cost: 50 mana. Reduces the targeted character's Health by 2. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_steal:0 "Learn: $me_zorgo_magic_focus.14.c$ (50 gold)"
 omni_folk_discovery.effect_steal:0 "Base casting cost: 15 mana. Removes 25 personal gold from the targeted character and adds 25 gold to the casting country's treasury. Requires the target to have at least 25 gold. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_stinging_nettles:0 "Learn: $me_zorgo_magic_focus.14.d$ (50 gold)"
 omni_folk_discovery.effect_stinging_nettles:0 "Base casting cost: 25 mana. Deals 5% damage to one randomly selected unit commanded by the targeted character. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_serpentine_swords:0 "Learn: $me_zorgo_magic_focus.14.e$ (50 gold)"
 omni_folk_discovery.effect_serpentine_swords:0 "Base casting cost: 25 mana. Deals 5% damage to one randomly selected unit commanded by the targeted character. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_imperial_dragons_claw:0 "Learn: $me_zorgo_magic_focus.14.f$ (50 gold)"
 omni_folk_discovery.effect_imperial_dragons_claw:0 "Base casting cost: 25 mana. Deals 8% damage to one randomly selected unit commanded by the targeted character. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_sword_of_jaoz:0 "Learn: $me_zorgo_magic_focus.14.g$ (50 gold)"
 omni_folk_discovery.effect_sword_of_jaoz:0 "Base casting cost: 50 mana. Gives the targeted character Maimed; kills the character instead if already Maimed. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_hellas_light:0 "Learn: $me_zorgo_magic_focus.14.h$ (50 gold)"
 omni_folk_discovery.effect_hellas_light:0 "Base casting cost: 50 mana. Gives the targeted character Blind; kills the character instead if already Blind. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_hypnosis:0 "Learn: $me_zorgo_magic_focus.21.a$ (50 gold)"
 omni_folk_discovery.effect_hypnosis:0 "Base casting cost: 50 mana. Gives the targeted character Submissive; if already Submissive, gives Weak-Willed; if both are already present, grants +15 Loyalty, decaying by 1 per year. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_cafeas_grace:0 "Learn: $me_zorgo_magic_focus.21.b$ (50 gold)"
 omni_folk_discovery.effect_cafeas_grace:0 "Base casting cost: 15 mana. Grants the targeted character +1 Charisma and +35% fertility for 365 days. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_atheus_blessing:0 "Learn: $me_zorgo_magic_focus.21.c$ (50 gold)"
 omni_folk_discovery.effect_atheus_blessing:0 "Base casting cost: 15 mana. Grants the targeted character +1 Charisma and +25% fertility for 365 days. Terrain and caster rank modify the final mana cost."
 omni_folk_discovery.learn_kinweaving:0 "Learn: $me_zorgo_magic_focus.7.kinweaving$ (50 gold)"
 omni_folk_discovery.effect_kinweaving:0 "Base casting cost: 100 mana. Transforms one non-primary-culture pop in an owned, controlled territory at the caster's location or a commanded army's location into the casting country's primary culture. Preserves religion and pop type. A shared territory cooldown prevents another transformation there for 365 days, regardless of caster. Terrain and caster rank modify the final mana cost."
