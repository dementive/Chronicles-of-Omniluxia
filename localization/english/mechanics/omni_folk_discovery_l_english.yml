l_english:
 omni_folk_discovery.title:0 "Local Folk Traditions"
 omni_folk_discovery.desc:0 "In [SCOPE.sP('omni_folk_teacher').GetName|G], [SCOPE.sChar('omni_folk_tutor').GetName|Y] has agreed to receive [SCOPE.sChar('omni_city_visitor').GetName|Y]. A few worn notes lie beside the lamp, their margins crowded with corrections in several hands. The teacher sets them aside. Before any words are copied, the visitor must learn how to speak them.\n\nSuch knowledge has passed from master to apprentice through generations of war, migration, and changing faiths. The #T Mage Towers#! teach the traditions of the people around them; the keepers of the #T wizard huts#! hold to the particular spells entrusted to their care. A foreign tongue or unfamiliar ancestry need not bar a willing pupil from either door.\n\nThe teacher asks #Y 50 gold#! from the visitor's own purse for each lesson. An #Y adult pupil#! may learn any offered spell they do not already know, and carry that knowledge away with them. No academy schooling is required: the teacher will show an ordinary pupil how to gather and husband a small reserve of #T mana#!. Further study buys new knowledge, not a fresh supply of power."
 OMNI_FOLK_NICKNAME_HEARTHKEEPER:0 "the Hearthkeeper"
 OMNI_FOLK_NICKNAME_ASH_READER:0 "the Ash Reader"
 OMNI_FOLK_NICKNAME_WAYSIDE_SAGE:0 "the Wayside Sage"
 OMNI_FOLK_NICKNAME_MOONWATCHER:0 "the Moonwatcher"
 OMNI_FOLK_NICKNAME_THREADBINDER:0 "the Threadbinder"
 OMNI_FOLK_NICKNAME_LANTERN_KEEPER:0 "the Lantern Keeper"
 omni_folk_discovery.visit:0 "Visit the local Folk teacher"
 omni_folk_discovery.tower:0 "Ask about local Folk traditions"
 omni_folk_discovery.requirements:0 "Requires an eligible adult with 50 personal gold who does not already know this spell. Academy training is not required."
 omni_folk_discovery.learned:0 "Permanently learn this Folk spell and unlock the Folk casting menus. Ordinary first-time pupils become Folk Practitioners: 25 starting mana, a 100-mana reserve, and 2 base mana per month. Later lessons do not refill mana. Normal casting costs and target requirements still apply."
 omni_folk_discovery.gain_practitioner:0 "Gain #Y Folk Practitioner#!: 25 mana now, a 100-mana reserve and +2 mana per month."
 omni_folk_discovery.directory:0 "Locate wizard huts in this region"
 omni_folk_discovery.directory_title:0 "Regional Wizard Huts"
 omni_folk_atlas_label:0 "Wizard Hut"
 omni_folk_atlas_fallback:0 "Wizard Hut"
 omni_folk_atlas_hut_1416:0 "#T Wizard Hut: [GetProvince('(int32)1416').GetName]#!\nTraditions taught: $me_zorgo_magic_focus.14.g$\n\nBring an eligible adult here and open the character City interaction menu to visit the local Folk teacher. No academy training is required. Each permanent lesson costs 50 personal gold. Ownership, control, or military access is required to visit. This fixed hut remains here when culture or religion changes."
