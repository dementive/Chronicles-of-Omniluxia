l_english:
 omni_items_button_commander_only_tt:0 "Only the ruler (items) or one of your own generals or admirals (siege supplies) can open this."
 omni_cmd_gear_unit_layer_tt:0 "#T Commander's gear:#! the item's army bonus applies to the army or fleet this commander leads, not the whole realm."
 omni_cmd_gear.1.t:0 "Commander's Gear"
 omni_cmd_gear.1.desc:0 "[SCOPE.sChar('omni_gear_holder').GetName|Y] reviews the siege supplies they carry on campaign.\n\nSupplies are used on a settlement their army is besieging. Only the ruler equips items.\n\n#T Siege supplies carried#!\nBattering Rams: #Y [SCOPE.sChar('omni_gear_holder').MakeScope.Var('omni_kit_ram').GetValue|0]#!  Sapper Charges: #Y [SCOPE.sChar('omni_gear_holder').MakeScope.Var('omni_kit_sapper').GetValue|0]#!  Alchemist's Fire: #Y [SCOPE.sChar('omni_gear_holder').MakeScope.Var('omni_kit_fire').GetValue|0]#!  Plague Jars: #Y [SCOPE.sChar('omni_gear_holder').MakeScope.Var('omni_kit_plague').GetValue|0]#!"
 omni_cmd_gear.1.equip:0 "#Y Equip an item#!"
 omni_cmd_gear.1.unequip:0 "Unequip an item"
 omni_cmd_gear.1.siege:0 "#R Use siege supplies#!"
 omni_cmd_gear.2.t:0 "Equip an Item"
 omni_cmd_gear.2.desc:0 "Which item should [SCOPE.sChar('omni_gear_holder').GetName|Y] take up? Its army bonus goes to the force they lead."
 omni_cmd_gear.3.t:0 "Unequip an Item"
 omni_cmd_gear.3.desc:0 "Which item should [SCOPE.sChar('omni_gear_holder').GetName|Y] set aside?"
 omni_cmd_gear.4.t:0 "Siege Supplies"
 omni_cmd_gear.4.desc:0 "[SCOPE.sChar('omni_gear_holder').GetName|Y]'s army is besieging the city. Which supplies should be brought forward?\n\nBattering Rams: #Y [SCOPE.sChar('omni_gear_holder').MakeScope.Var('omni_kit_ram').GetValue|0]#!  Sapper Charges: #Y [SCOPE.sChar('omni_gear_holder').MakeScope.Var('omni_kit_sapper').GetValue|0]#!  Alchemist's Fire: #Y [SCOPE.sChar('omni_gear_holder').MakeScope.Var('omni_kit_fire').GetValue|0]#!  Plague Jars: #Y [SCOPE.sChar('omni_gear_holder').MakeScope.Var('omni_kit_plague').GetValue|0]#!"
 omni_cmd_gear.4.ram:0 "Drive a #Y Battering Ram#! against the gates"
 omni_cmd_gear.4.sapper:0 "Detonate #Y Sapper Charges#! under the walls"
 omni_cmd_gear.4.fire:0 "Hurl #R Alchemist's Fire#! into the garrison"
 omni_cmd_gear.4.plague:0 "Catapult #R Plague Jars#! over the walls"
 omni_kit_ram_use_tt:0 "#T Battering Ram#!: the besieged fort suffers #Y +1#! breach immediately."
 omni_kit_sapper_use_tt:0 "#T Sapper Charges#!: the besieged city gets #R -25%#! Local Defensive for #Y 30 days#!."
 omni_kit_fire_use_tt:0 "#T Alchemist's Fire#!: the besieged city gets #R -30%#! Garrison Size for #Y 30 days#!."
 omni_kit_plague_use_tt:0 "#T Plague Jars#!: the besieged city gets #R -60%#! Local Food and #R -10%#! Garrison Size for #Y 45 days#!."
 omni_def_stores_use_tt:0 "#T Siege Stores#!: the city gets #G +75%#! Local Food for #Y 90 days#!."
 omni_def_gates_use_tt:0 "#T Reinforced Gates#!: the city gets #G +25%#! Local Defensive and #G +15%#! Garrison Size for #Y 90 days#!."
 omni_def_wards_use_tt:0 "#T Ward Stones#!: for #Y 90 days#! no hostile siege magic can be cast on the city, and it gets #G +5%#! Local Defensive."
 omni_siege_supply.visit:0 "#Y Siege Supplies#!"
 omni_siege_supply.1.t:0 "Siege Supplies"
 omni_siege_supply.1.desc:0 "Sappers, smiths and alchemists offer their wares. Siege kits are paid from [SCOPE.sChar('omni_city_visitor').GetName|Y]'s own purse and carried with them. Defensive stores are paid from the treasury and kept by the realm. A market sells stores, fire and plague jars. Rams, charges and gates also require a foundry; ward stones require a magic academy or mage tower. Required buildings must be in the same accessible settlement. You can hold up to #Y 3#! of each.\n\n#T Carried by [SCOPE.sChar('omni_city_visitor').GetName]#!\nBattering Rams: #Y [SCOPE.sChar('omni_city_visitor').MakeScope.Var('omni_kit_ram').GetValue|0]#!  Sapper Charges: #Y [SCOPE.sChar('omni_city_visitor').MakeScope.Var('omni_kit_sapper').GetValue|0]#!  Alchemist's Fire: #Y [SCOPE.sChar('omni_city_visitor').MakeScope.Var('omni_kit_fire').GetValue|0]#!  Plague Jars: #Y [SCOPE.sChar('omni_city_visitor').MakeScope.Var('omni_kit_plague').GetValue|0]#!\n\n#T Realm stores#!\nSiege Stores: #Y [ROOT.GetCharacter.GetCountry.MakeScope.Var('omni_def_stores').GetValue|0]#!  Reinforced Gates: #Y [ROOT.GetCharacter.GetCountry.MakeScope.Var('omni_def_gates').GetValue|0]#!  Ward Stones: #Y [ROOT.GetCharacter.GetCountry.MakeScope.Var('omni_def_wards').GetValue|0]#!"
 omni_siege_supply.1.ram:0 "Buy a #Y Battering Ram#! (#Y 200#! gold)"
 omni_siege_supply.1.sapper:0 "Buy #Y Sapper Charges#! (#Y 180#! gold)"
 omni_siege_supply.1.fire:0 "Buy #Y Alchemist's Fire#! (#Y 160#! gold)"
 omni_siege_supply.1.plague:0 "Buy #Y Plague Jars#! (#Y 225#! gold)"
 omni_siege_supply.1.stores:0 "Buy #G Siege Stores#! for the realm (#Y 150#! from the treasury)"
 omni_siege_supply.1.gates:0 "Buy #G Reinforced Gates#! for the realm (#Y 220#! from the treasury)"
 omni_siege_supply.1.wards:0 "Buy #G Ward Stones#! for the realm (#Y 300#! from the treasury)"
 omni_siege_supply_carried_tt:0 "Carried by this character. Use it from the siege window or their gear menu while their army besieges a city."
 omni_siege_supply_stored_tt:0 "Kept in the realm's stores. Use it from the siege window of one of your besieged cities."
 omni_siege_supply.10.t:0 "Siege Engines at the Walls"
 omni_siege_supply.10.desc:0 "The enemy commander [SCOPE.sChar('omni_gear_holder').GetName|Y] has brought siege supplies to bear on [SCOPE.sP('omni_kit_target').GetName|Y]. The defenders are reeling."
 omni_siege_supply.10.a:0 "We will hold."
 omni_siege_supply.20.t:0 "Defend the City"
 omni_siege_supply.20.desc:0 "[SCOPE.sP('omni_defense_province').GetName|Y] is under siege. Which of the realm's stores should be sent to its defenders?\n\nSiege Stores: #Y [ROOT.GetCharacter.GetCountry.MakeScope.Var('omni_def_stores').GetValue|0]#!  Reinforced Gates: #Y [ROOT.GetCharacter.GetCountry.MakeScope.Var('omni_def_gates').GetValue|0]#!  Ward Stones: #Y [ROOT.GetCharacter.GetCountry.MakeScope.Var('omni_def_wards').GetValue|0]#!"
 omni_siege_supply.20.stores:0 "Open the #G Siege Stores#!"
 omni_siege_supply.20.gates:0 "Brace the #G Reinforced Gates#!"
 omni_siege_supply.20.wards:0 "Raise the #G Ward Stones#!"
 omni_siege_kit_button_tt:0 "#T Siege Supplies#!\nUse the battering rams, sapper charges, alchemist's fire and plague jars this commander carries. Buy them at an accessible market; rams and charges also require a foundry in the same settlement."
 omni_siege_kit_button_none_tt:0 "This commander carries no siege supplies."
 omni_siege_defense_button_tt:0 "#T Defend the City#!\nSend the realm's siege stores, reinforced gates or ward stones to this city. Buy them at an accessible market; gates also require a foundry, and wards a magic academy or mage tower, in the same settlement."
 omni_siege_defense_button_none_tt:0 "The realm has no defensive siege stores. Buy them at an accessible market; gates also require a foundry, and wards a magic academy or mage tower, in the same settlement."
 omni_siege_warded_tt:0 "#R Ward Stones#! protect this city: no siege magic can be cast on it."
 omni_kit_sapper_mod:0 "Sapper Charges"
 omni_kit_fire_mod:0 "Alchemist's Fire"
 omni_kit_plague_mod:0 "Plague Jars"
 omni_def_stores_mod:0 "Siege Stores"
 omni_def_gates_mod:0 "Reinforced Gates"
 omni_def_wards_mod:0 "Ward Stones"
