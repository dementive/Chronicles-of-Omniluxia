 opinion_engage_in_piracy_raided_us:0 "Sponsored Piracy Against Us"
 omni_piracy.1.t:0 "Pirates Raid Our Coast"
 omni_piracy.1.desc:0 "Foreign-sponsored privateers have been preying on commerce along our coast. The damage is still contained, but merchants and local officials are demanding that we respond before this becomes a habit."
 omni_piracy.1.a:0 "Declare war on their sponsors."
 omni_piracy.1.b:0 "Condemn their sponsors."
 omni_piracy.1.c:0 "This is not worth a war."
 omni_piracy.10.t:0 "Rich Plunder from the Coast"
 omni_piracy.10.desc:0 "Our privateers have had an exceptional month raiding the shores of [SCOPE.sP('omni_piracy_raided_province').GetName]. Merchant convoys were intercepted without resistance, coastal warehouses yielded their stores, and several local noble families paid handsomely to spare their estates. The crews return laden with gold, silks, and exotic goods."
 omni_piracy.10.a:0 "A bountiful haul!"
 omni_piracy.11.t:0 "Blood and Treasure"
 omni_piracy.11.desc:0 "Raiding parties from our fleet descended on the coast of [SCOPE.sP('omni_piracy_raided_province').GetName] this month. While many returned with stolen gold and chains of captives dragged to the ships, not all came back. The defenders fought fiercely, and several of our ships were damaged or lost in the fighting. Still, the holds are not empty."
 omni_piracy.11.a:0 "The sea gives and takes."
 omni_piracy.12.t:0 "Raiders Repulsed"
 omni_piracy.12.desc:0 "Our pirate fleet operating off [SCOPE.sP('omni_piracy_raided_province').GetName] met with disaster this month. Coastal patrols were waiting, local militia had been forewarned, and every attempted landing was met with spears and arrows. Our crews limped back to the ships with nothing to show for their losses but wounded pride and shattered hulls."
 omni_piracy.12.a:0 "Curse the fates!"
 omni_piracy.13.t:0 "Catastrophe at Sea"
 omni_piracy.13.desc:0 "A terrible calamity has befallen our privateers off [SCOPE.sP('omni_piracy_raided_province').GetName]. What began as a routine raiding month turned to nightmare — a sudden tempest scattered the fleet, or perhaps a waiting war fleet caught our ships against the cliffs, or a sea beast rose from the depths to shatter hulls like kindling. Survivors speak of horrors that will haunt them forever. The fleet is broken."
 omni_piracy.13.a:0 "How could this happen?"
