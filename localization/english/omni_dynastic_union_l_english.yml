 omni_dynastic_union.1.t:0 "A Marriage of Crowns"
 omni_dynastic_union.1.desc:0 "Envoys from [SCOPE.sC('dynastic_senior_country').GetName] have arrived with a proposal of unusual gravity: a marriage between [SCOPE.sChar('dynastic_senior_ruler').GetName] and [SCOPE.sChar('dynastic_junior_ruler').GetName].\n\nThis is no ordinary courtship. Their offer would bind our crown to theirs, preserving our royal dignity while acknowledging their seniority in the shared dynasty."
 omni_dynastic_union.1.a:0 "Let the crowns be bound."
 omni_dynastic_union.1.b:0 "Our crown stands alone."
 omni_dynastic_union.2.t:0 "The Crowns Are Bound"
 omni_dynastic_union.2.desc:0 "The marriage of [SCOPE.sChar('dynastic_senior_ruler').GetName|Y] and [SCOPE.sChar('dynastic_junior_ruler').GetName|Y] has been sworn before both courts with sacred vows and celebrations that took place over many months in both countries. Finally, after weeks of touring the countryside to receive the blessings of the people, our new royal spouse has come to reside with [ROOT.GetCountry.GetRuler.GetFirstName] in the [ROOT.GetCountry.GetAdjective] capital of [ROOT.GetCountry.GetCapital.GetName|T].\n\nIn [SCOPE.sChar('dynastic_junior_ruler').GetFirstName]'s absence from [SCOPE.sC('dynastic_junior_country').GetName|Y], [SCOPE.sC('dynastic_junior_country').GetRuler.GetName|Y] has been installed to govern the junior realm locally in our name. Thus one marriage binds two courts; supreme authority over two realms remains with [ROOT.GetCountry.GetRuler.GetFirstName] and the #T House of [ROOT.GetCountry.GetRuler.GetFamilyDisplayAdjective]#!, while its daily rule rests in the hands of our loyal appointed representative."
 omni_dynastic_union.2.a:0 "One house, two crowns!"
 omni_dynastic_union.8.t:0 "A Proposal Between Crowns"
 omni_dynastic_union.8.desc:0 "Our council has prepared a formal offer of marriage between [SCOPE.sChar('dynastic_senior_ruler').GetName|Y] and [SCOPE.sChar('dynastic_junior_ruler').GetName|Y], ruler of [SCOPE.sC('dynastic_junior_country').GetName|Y]. Acceptance would bind the two sovereign houses and place their realm beneath ours as the junior crown of a dynastic union."
 omni_dynastic_union.8.a:0 "Send the proposal with all due ceremony"
 omni_dynastic_union.8.b:0 "Withdraw the proposal"
 omni_dynastic_union.9.t:0 "The Proposal Refused"
 omni_dynastic_union.9.desc:0 "The court of [SCOPE.sC('dynastic_junior_country').GetName|Y] has rejected the proposed marriage between our ruler and [SCOPE.sChar('dynastic_junior_ruler').GetName|Y]. Their crown has chosen to stand alone, at least for now."
 omni_dynastic_union.9.a:0 "An insult remembered."
 omni_dynastic_union.3.t:0 "A Union Ready"
 omni_dynastic_union.3.desc:0 "There is good news from [SCOPE.sC('dynastic_union_subject').GetCapital.GetName|T], my [ROOT.GetCountry.GetRulerTitle]. Even though the marriage alliance has been concluded, the junior crown of [SCOPE.sC('dynastic_union_subject').GetName|Y] has remained loyal beneath our dynastic compact.Their nobles now speak openly of a fuller union, and the machinery of state may be prepared for complete integration."
 omni_dynastic_union.3.a:0 "Unite the crowns fully."
 omni_dynastic_union.3.a.tt:0 "#T Unite the Crowns Fully#!\n[SCOPE.sC('dynastic_union_subject').GetName|Y] will be completely integrated into [ROOT.GetCountry.GetName|Y].\n\n#G Every territory owned by the junior crown will pass to us.#!\n#G Their treasures will be transferred to our realm.#!\n#Y Their subject status will end when their country is absorbed.#!\n#Y The diplomatic-annexation settlement will decide which prominent families are received at our court; the remaining characters will pass into obscurity.#!"
 omni_dynastic_union.3.b:0 "Let the compact continue."
 omni_dynastic_union.4.t:0 "The Junior Crown Passes"
 omni_dynastic_union.4.desc:0 "Messengers arrived this morning from [SCOPE.sC('dynastic_senior_country').GetCapital|T] with shocking news. [SCOPE.sChar('former_ruler').GetName|Y], whose marriage bound our crown to [SCOPE.sC('dynastic_senior_country').GetName|Y], has died. Our new ruler inherits more than a throne; they inherit a contested compact, watched closely by nobles who wonder whether the old oaths still hold."
 omni_dynastic_union.4.a:0 "Let the crowns be united at once."
 omni_dynastic_union.4.b:0 "Renew the oaths."
 omni_dynastic_union.4.c:0 "The compact dies with [SCOPE.sChar('former_ruler').GetName]"
 omni_dynastic_union.4.d:0 "Dissolve the compact peacefully."
 omni_dynastic_union.5.t:0 "The Senior Crown Passes"
 omni_dynastic_union.5.desc:0 "[SCOPE.sChar('former_ruler').GetName|Y], whose marriage gave our house seniority over [SCOPE.sC('dynastic_union_subject').GetName|Y], has died. The junior crown now weighs the old oaths against its own claim, and our succession may decide whether the union endures."
 omni_dynastic_union.5.a:0 "The oaths must be renewed."
 omni_dynastic_union.5.b:0 "Release them from the compact."
 omni_dynastic_union.5.c:0 "They shall test their claim by war."
 omni_dynastic_union.6.t:0 "The Child of Two Crowns"
 omni_dynastic_union.6.desc:0 "[ROOT.GetRuler.GetName|Y] has ascended the junior throne as the child of the marriage that bound our realm to [SCOPE.sC('dynastic_senior_country').GetName|Y]. To many nobles, this is the moment the compact was made for; one bloodline now speaks for both crowns. Others mutter that such a union would erase ancient rights and argue against any integration, believing that the old ways should be honored."
 omni_dynastic_union.6.a:0 "Fuse the crowns together."
 omni_dynastic_union.6.b:0 "Recognize the shared heir, but keep both crowns."
 omni_dynastic_union.6.c:0 "The pretenders must be answered."
 omni_dynastic_union.7.t:0 "An Heir of Both Crowns"
 omni_dynastic_union.7.desc:0 "[ROOT.GetRuler.GetName] now wears the senior crown as a child of the marriage that bound us to [SCOPE.sC('dynastic_union_subject').GetName]. The claim to rule both realms has never been clearer, though rival branches may yet challenge the settlement."
 omni_dynastic_union.7.a:0 "One heir, one realm."
 omni_dynastic_union.7.b:0 "Let the compact mature."
 omni_dynastic_union.7.c:0 "Prepare for rival claimants."
 omni_dynastic_union.10.t:0 "A New Senior Crown"
 omni_dynastic_union.10.desc:0 "[SCOPE.sChar('dynastic_dead_senior_ruler').GetName|Y], whose authority stood above our crown under the dynastic compact, has died. [SCOPE.sChar('dynastic_new_senior_ruler').GetName|Y] now rules [SCOPE.sC('dynastic_senior_country').GetName|Y], and the senior court has called upon us to renew the old oaths.\n\nOur nobles accept that the union may outlive the monarch who forged it, but succession is also the moment when every promise between the two crowns may be weighed anew."
 omni_dynastic_union.10.a:0 "Recognize the new senior crown."
 omni_dynastic_union.10.b:0 "Renew the oaths—but only with concessions."
 omni_dynastic_union.10.c:0 "The compact died with the old monarch."
 omni_dynastic_union.11.t:0 "The Compact Is Ended"
 omni_dynastic_union.11.desc:0 "[SCOPE.sChar('dynastic_dead_senior_ruler').GetName|Y] is dead, and [SCOPE.sChar('dynastic_new_senior_ruler').GetName|Y]'s court has declined to inherit the authority once claimed over our crown. The envoys of [SCOPE.sC('dynastic_senior_country').GetName|Y] have formally released us from the dynastic compact. Our crown is sovereign once more."
 omni_dynastic_union.11.a:0 "Our crown stands alone."
 omni_dynastic_union.12.t:0 "The Crowns Contested"
 omni_dynastic_union.12.desc:0 "The death of [SCOPE.sChar('dynastic_dead_senior_ruler').GetName|Y] has shattered the old certainty between the crowns. Our court refuses to bow automatically to [SCOPE.sChar('dynastic_new_senior_ruler').GetName|Y], and the succession of [SCOPE.sC('dynastic_senior_country').GetName|Y] has become a struggle over which branch of the dynasty possesses the stronger claim. The matter will now be settled by force."
 omni_dynastic_union.12.a:0 "Let the stronger crown prevail."
