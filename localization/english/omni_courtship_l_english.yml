l_english:
 omni_courtship.1.t:0 "A Proposal from Abroad"
 omni_courtship.1.desc:0 "[SCOPE.sChar('omni_courtship_suitor').GetName] has asked [SCOPE.sChar('target').GetName] to leave our country and marry. Will we allow the match?"
 omni_courtship.1.a:0 "Give our blessing."
 omni_courtship.1.b:0 "Decline the proposal."
 omni_courtship.2.t:0 "A Wedding at Court"
 omni_courtship.2.desc:0 "[SCOPE.sChar('target').GetName] accepted the proposal and joined our court. The wedding with [SCOPE.sChar('omni_courtship_suitor').GetName] has taken place."
 omni_courtship.3.t:0 "Proposal Declined"
 omni_courtship.3.desc:0 "Our proposal to marry [SCOPE.sChar('target').GetName] has been declined."
 omni_courtship.4.t:0 "Proposal Lapsed"
 omni_courtship.4.desc:0 "Circumstances changed while our proposal was pending. The marriage cannot go ahead."
 omni_courtship.acknowledge:0 "Very well."
