l_english:
 seedwatcher_trait:0 "Seedwatcher"
 seedwatcher_trait_desc:0 "The ruler of Wenelru inherits the duty of tending the #G Root of the First Spring#! at #G Venerurich#! and learns the first rites of Seedwatching upon taking office."
 omni_wenelru_carry_first_leaf:0 "Carry the First Leaf"
 omni_wenelru_carry_first_leaf_desc:0 "Name an Aneic forest settlement whose households will carry a bowl of their soil to the Root of First Spring at Venerurich. The keepers would like to know which one before anybody starts digging."
 omni_wenelru_exchange_seeds:0 "Exchange Seeds with Nirmegos"
 omni_wenelru_exchange_seeds_desc:0 "Send a pack train to the shrine at Nirmegos so its keepers and the households of Wenelru can trade seed, packet for packet."
 omni_wenelru_restore_hearth:0 "Restore a Covenant Hearth"
 omni_wenelru_restore_hearth_desc:0 "Name a thinly settled forest village to receive the seed from Nirmegos, along with a family willing to work ground that nobody has worked in some time."
 omni_wenelru_open_picker_leaf_tt:0 "Opens a list of eligible settlements. The #Y 30#! @political_influence! political influence is spent only once you choose one."
 omni_wenelru_open_picker_restore_tt:0 "Opens a list of eligible villages. The #Y 20#! @political_influence! political influence is spent only once you choose one."

 omni_wenelru_picker_title:0 "Choose a Settlement"
 omni_wenelru_picker_leaf_desc:0 "The keepers at #G $PROV2356$#! will take soil from one settlement this year, and they would prefer to be told which one rather than find out. Only #Y Aneic#! forest settlements under your control without a #Y Covenant Hearth#! are listed.\nChoosing costs #Y 30#! @political_influence! political influence."
 omni_wenelru_picker_restore_desc:0 "The packets from Nirmegos will go to one village, and the families who sent their own seed have asked to know where. Only forest settlements with #Y 3#! or fewer pops and no #Y Covenant Hearth#! are listed.\nChoosing costs #Y 20#! @political_influence! political influence."
 omni_wenelru_picker_empty:0 "No settlement still meets the conditions."
 omni_wenelru_picker_row_name:0 "[Scope.GetProvince.GetNameWithNoTooltip]"
 omni_wenelru_picker_row_tt:0 "Choose this settlement."

 omni_wenelru.1.t:0 "A Bowl of Soil"
 omni_wenelru.1.desc:0 "[SCOPE.sChar('wenelru_delegate').GetName|Y] came up to #G $PROV2356$#! carrying a bowl of soil from [SCOPE.sProvince('wenelru_hearth').GetName|G], wrapped in a cloth, and set it down beneath #Y $wonder_root_of_first_spring$#! while the keepers settled whose turn it was to hold the ladder. Custom says the soil comes from the edge of the oldest grove. One family had dug theirs from the path to the wells instead, and assured everyone that #T Mother Cafea#! would not mind, although the neighbors who use the path have made it clear that they mind.\n\nThe #Y Seedwatcher#!, [ROOT.GetCountry.GetRuler.GetName|Y], pressed a fallen leaf into the bowl before the keepers took it away. The leaf goes home with the delegation, the families will turn it into their first furrow, and whatever comes up will be carried back here next spring. The delegation would like to know whether the Seedwatcher means to see them off at the gate, or simply to hear afterward that they left."
 omni_wenelru.1.a:0 "Send the leaf home with [SCOPE.sChar('wenelru_delegate').GetName]."
 omni_wenelru.1.b:0 "Walk the first mile with them, and pay for the bread."

 omni_wenelru.3.t:0 "The Hearth Takes Root"
 omni_wenelru.3.desc:0 "[SCOPE.sChar('wenelru_delegate').GetName|Y] came back to #G $PROV2356$#! with the first shoots from [SCOPE.sProvince('wenelru_hearth').GetName|G], wrapped in damp cloth for the walk. The keepers shook the loose earth out beneath #Y $wonder_root_of_first_spring$#! and set the shoots down for #T Mother Cafea#!, while the #Y Seedwatcher#!, [ROOT.GetCountry.GetRuler.GetName|Y], heard the clerk read out the families who had cleared the furrow.\n\nThe clerk then asked, as clerks will, whether the path to the wells was still open. It was. The family whose boundary had crossed it turned out to be the one that sent the damp cloth, which the neighbors took as an apology and the family did not correct. The clerk entered every household in the hearth register, then spent some time looking for a column in which to enter the cloth."
 omni_wenelru.3.a:0 "Enter [SCOPE.sProvince('wenelru_hearth').GetName] in the hearth register."

 omni_wenelru.4.t:0 "The Covenant Renews Its Oaths"
 omni_wenelru.4.desc:0 "[SCOPE.sChar('wenelru_successor').GetName|Y] had reached the last page of the hearth register when [SCOPE.sChar('wenelru_delegate').GetName|Y] asked for one name to be read again. Two households took over a grove after the children of its first keepers moved away, and they have kept it ever since on the understanding that someone would eventually say so out loud. A new Seedwatcher seemed a good moment to ask.\n\nThe delegates will renew their vows if each household may keep the grove it tends. Venerurich, meanwhile, needs hands to clear its planting beds and seed to fill them, and the keepers have brought an empty measure so the delegates can see exactly how much each hearth would be asked to send. The delegates have looked at the measure for longer than was strictly necessary."
 omni_wenelru.4.a:0 "Confirm each household in the grove it keeps."
 omni_wenelru.4.b:0 "Fill the measure, and call the households to Venerurich."

 omni_wenelru.5.t:0 "Seed from Nirmegos"
 omni_wenelru.5.desc:0 "The keepers at Nirmegos have sent a list of the seed they can spare from the World's Lungs, written small to fit on one board. [SCOPE.sChar('wenelru_shrine_ruler').GetName|Y] offers our delegation safe passage, provided they bring seed back for the shrine's own beds, and the keepers ask that every packet carry the name of the place where it was gathered, since they have been sent unlabeled seed before and are still finding out what it was.\n\nThe households at Venerurich have set aside enough to make the journey worth the walk. They ask [ROOT.GetCountry.GetRuler.GetName|Y] to pay for the pack animals and for the people walking beside them, who will miss the sowing at home while they are gone."
 omni_wenelru.5.a:0 "Pay for the pack train."
 omni_wenelru.5.b:0 "Keep our seed at home."

 omni_wenelru.6.t:0 "A Hearth Restored"
 omni_wenelru.6.desc:0 "[SCOPE.sChar('wenelru_delegate').GetName|Y] brought [ROOT.GetCountry.GetRuler.GetName|Y] a wooden peg from a field at [SCOPE.sProvince('wenelru_hearth').GetName|G], where a family has agreed to take up ground that has gone untended since its last keepers left. The neighbors have offered to show them where the water runs after rain, which is a polite way of saying it runs through the house if the old ditch is not cleared first.\n\nThe family asks for one packet from Nirmegos and leave to tend the grove beside the field. The households who sent their own seed to the shrine have walked over to watch the first packet opened, and have brought their spades on the understanding that watching is rarely all that anyone does."
 omni_wenelru.6.a:0 "Open the packet and settle the household."

 omni_wenelru.8.t:0 "The Packets from Nirmegos"
 omni_wenelru.8.desc:0 "The travelers came back to Venerurich with the seed sewn into the lining of a pack cloth to keep it dry. [SCOPE.sChar('wenelru_shrine_ruler').GetName|Y] had the shrine keepers mark every packet before the party left, and one of our travelers copied the marks onto a board so the households could read them without unpicking the stitches.\n\n[ROOT.GetCountry.GetRuler.GetName|Y] has been asked to hold the seed for a hearth that has lost its keepers. The families who sent their own seed to Nirmegos would like to be present when it is opened, partly out of piety and partly to make sure the right packet goes in the ground."
 omni_wenelru.8.a:0 "Keep the packets for a household that needs them."

 omni_wenelru.9.t:0 "The Bowl Comes Back Empty"
 omni_wenelru.9.desc:0 "[SCOPE.sChar('wenelru_delegate').GetName|Y] returned to #G $PROV2356$#! at the end of the year without shoots. The households at [SCOPE.sProvince('wenelru_hearth').GetName|G] had turned the furrow and pressed in the leaf, but by spring the settlement was no longer one that could keep a covenant hearth, and the keepers will not set down shoots from ground that answers to someone else.\n\nThe clerk has crossed the names out of the register neatly enough that they can still be read. The keepers have kept the bowl, on the grounds that it will be needed again in five years."
 omni_wenelru.9.a:0 "Wash the bowl."

 omni_wenelru_first_leaf_wait_tt:0 "In one year, if the settlement still qualifies, it gains a #Y Covenant Hearth#!."
 omni_wenelru_first_leaf_cooldown_tt:0 "Five years must pass between First Leaf rites."
 omni_wenelru_first_leaf_done_tt:0 "The settlement has established a #Y Covenant Hearth#!."
 omni_wenelru_first_leaf_failed_tt:0 "The rite has failed. The political influence is not returned."
 omni_wenelru_seed_exchange_tt:0 "The delegation returns in 90 days. If the exchange falls through, the travel money is returned."
 omni_wenelru_seeds_arrived_tt:0 "Unlocks the #Y Restore a Covenant Hearth#! decision."
 omni_wenelru_covenant_hearth:0 "Covenant Hearth"
 desc_omni_wenelru_covenant_hearth:0 "The households here keep a hearth entered in the register of the Seedwatcher at Venerurich."
 omni_wenelru_grove_rights:0 "Renewed Grove Rights"
 desc_omni_wenelru_grove_rights:0 "The Seedwatcher has said out loud that each household may keep the grove it tends."
 omni_wenelru_household_labor:0 "Covenant Household Labor"
 desc_omni_wenelru_household_labor:0 "Households from the covenant hearths have come to clear and plant the beds at Venerurich."
