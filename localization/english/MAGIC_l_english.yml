me_magic_menu.3_title: "Study Aldic Magic"
me_magic_menu.3_visitor_desc: "#Y #Y Aldic#!#! magic manipulates the soul, mind, and flesh. Its practitioners include #Y #Y Illusionists#!#!, infamous for bending minds and deceiving enemies, and #Y #Y Clerics#!#!, who turn the same principles toward healing wounds and curing disease.\n\nLooking through the spells available, [SCOPE.sChar('target').GetName|Y] must choose what [SCOPE.sChar('target').GetSheHe] wishes to learn."
me_magic_menu.3_desc: "#Y #Y Aldic#!#! magicians are some of the most infamous and praised of any of the four schools, with it's users subdivided into two major classes: #Y #Y Illusionist#!#! and #Y #Y Cleric#!#!.\n\nCapable of manipulating the soul, mind, and flesh of conscious beings, these magicians are capable of both creating great suffering and healing fatal wounds. Most prominent #Y #Y Aldic#!#! magicians often become renown healers or diplomats, with the latter often using their abilities to manipulate the masses or opponents for their gain.\n\nMost of these men are of the #Y #Y Illusionist#!#! class, who devote themselves to the manipulation of the mind and soul. Tricksters by nature, illusionists have been historically persecuted and their research restricted because of the great damage they do to society. Able to manipulate their way into high political positions and manipulate great generals into retreating prematurely, magicians of this class are some of the most powerful in #Y #Y Omniluxia#!#!.\n\nThose who choose the humble #Y #Y Cleric#!#! class are typically the exact opposite of the often malevolent #Y #Y Illusionists#!#!. Choosing to use their abilities for good, these clerics try to manipulate the flesh and mind of conscious races in order to heal them, with the most powerful #Y #Y Clerics#!#! able to cure fatal diseases and even improve the natural abilities of their patient. However, there are those who abuse such powers in order to cause harm rather than cure others.\n\nLooking through the spells available to them, [ROOT.GetCountry.GetRuler.GetName|Y] must choose what to learn."
me_magic_menu.3.a: "Study Beginner #Y #E Cleric#!#! Spells"
