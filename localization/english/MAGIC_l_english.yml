# Magic Studying Events

# Phase One

me_magic_studying.1_title: "Novel Excitement"
me_magic_studying.1_desc: "As with most new mages, #Y [SCOPE.sChar('target').GetFirstName]#! exudes a sense of excitement at the novel prospect of becoming a magician.\n\nSuch a hopeful attitude will help [SCOPE.sChar('target').GetHerHim] through the intense studying and stress that comes with learning the necessary steps to begin casting magic. Even when this optimism fades, there is no doubt that #Y [SCOPE.sChar('target').GetFirstName]#!'s determination will see [SCOPE.sChar('target').GetHerHim] through [SCOPE.sChar('target').GetHerHis] studies."
me_magic_studying.1.a: "I'm sure I'll be great in no time!"

me_magic_studying.2_title: "Overworked"
me_magic_studying.2_desc: "It is common to find those who follow the mage's path push themselves as much as they can in their pursuit of the arcane. However, such a feverish pursuit is often paid in the price of the vitality of the mage in question.\n\n#Y [SCOPE.sChar('target').GetFirstName]#! has been diligently at work for many moons. Constantly arched over tomes and frantically scribbling down notes, [SCOPE.sChar('target').GetSheHe] barely gives [SCOPE.sChar('target').GetHerHim]self the time to properly rest! This comes at a price, as over the next few weeks [SCOPE.sChar('target').GetFirstName|Y] falls ill to a terrible sickness, pushing their progress back by months. Hopefully, upon recovering, #Y [SCOPE.sChar('target').GetFirstName]#! will have learned that the only thing holding back a mage's mind is their body."
me_magic_studying.2.a: "All I need is a little nap"

me_magic_studying.3_title: "Shortcuts"
me_magic_studying.3_desc: "Despite being an astute student, #Y [SCOPE.sChar('target').GetFirstName]#! has been having a difficult time comprehending the most recent material he's been researching. Even after days of going over the incantations [SCOPE.sChar('target').GetSheHe]'s been assigned, it just seems like #Y [SCOPE.sChar('target').GetFirstName]#! is unable to progress.\n\nAfter consulting with [SCOPE.sChar('target').GetHerHis] teachers, [SCOPE.sChar('target').GetSheHe] has been advised to continue this arduous method of recounting the same incantations, since they will form the base of all the spells he intends to learn.\n\nHowever, one of #Y [SCOPE.sChar('target').GetFirstName]#!'s peers, who has far surpassed [SCOPE.sChar('target').GetHerHis] level, has offered to share their secrets with [SCOPE.sChar('target').GetHerHim], for the right price of course. Although #Y [SCOPE.sChar('target').GetFirstName]#! is bound understand the concepts eventually, this private tutor could significantly speed up the process."
me_magic_studying.3.a: "Why wait?"
me_magic_studying.3.b: "These things take time"

me_magic_studying.4_title: "Steady Advance"
me_magic_studying.4_desc: "For most, the first few steps required to master a set of spells is the most difficult, as they have to deal with foreign incantations and unfamiliar uses of their mana reserves, however, #Y [SCOPE.sChar('target').GetFirstName]#! has been quickly adapting to every new challenge that faces [SCOPE.sChar('target').GetHerHim].\n\nThe voracious appetite for books and knowledge displayed by #Y [SCOPE.sChar('target').GetFirstName]#! has impressed many of [SCOPE.sChar('target').GetHerHis] peers and teachers, and [SCOPE.sChar('target').GetSheHe] has quickly become one of the brightest pupils in the academy."
me_magic_studying.4.a: "Bring me a challenge!"

me_magic_studying.5_title: "A Flash of Light"
me_magic_studying.5_desc: "#Y [SCOPE.sChar('target').GetFirstName]#!, confident after many moons of studying, prepares an incantation circle. The measurements must be percise, as #T Omnic#! magic is unforgiving to even the smallest mistakes. This spell, meant to fire a powerful beam of light at a nearby hill, would showcase #Y [SCOPE.sChar('target').GetFirstName]#!'s progress as a young mage!\n\nSuddenly, a brilliant flash of light momentarily blinds those present. As #Y [SCOPE.sChar('target').GetFirstName]#! opens [SCOPE.sChar('target').GetHerHis] eyes, [SCOPE.sChar('target').GetSheHe] notices the smoking crater that was once a sprawling market. It seems like #Y [SCOPE.sChar('target').GetFirstName]#!'s calculations were off, or perhaps [SCOPE.sChar('target').GetSheHe] was sabotaged by a rival? Regardless, it is evident to all that [SCOPE.sChar('target').GetHerHis] requires more training to ensure these kinds of accidents no longer occur."
me_magic_studying.5.a: "They'll rebuild"

me_magic_studying.6_title: "Doubt and Regret"
me_magic_studying.6_desc: "Studying the dark arts of #Y #R Melodian#!#! magic is no easy endeavor, nor is it one for the faint of heart. The taboo nature of this school means that any prospective student will have to pour in additional time and effort into accruing the necessary knowledge to be able to access even a fraction of the #Y #R Blood Goddess#!#!' power.\n\nAside from the extensive research and cost, the sheer depravity of the rituals necessary to summon the goddess' power are enough to drive most away from this dark path. Having had to endure months of these vile rituals, #Y [SCOPE.sChar('target').GetFirstName]#! has had to take a step back to make sure that the power they seek is truly worth the reputation that comes with it, and the cost of the sins they will have to perform."
me_magic_studying.6.a: "I am better than this"
me_magic_studying.6.b: "Melodia's power calls to me..."

me_magic_studying.7_title: "Growing Pains"
me_magic_studying.7_desc: "For aspiring #Y Clerics#! reputation is everything, as patients will only trust a well-experienced mage with their life. This experience, however, is often gained through trial and error, and in the case of #Y Clerical#! work errors are often fatal.\n\nUnfortunately, #Y [SCOPE.sChar('target').GetFirstName]#! is not as experienced as they believed. When #Y [SCOPE.sChar('unfortunate_soul').GetFirstName]#! came to #Y [SCOPE.sChar('target').GetFirstName]#! for help, [SCOPE.sChar('unfortunate_soul').GetSheHe] was unaware that such a decision would be their last. One slight miscalculation was all it took to botch the healing spell, and the results were fatal.\n\nAccidentally killing a respected member of the elite would have destroyed #Y [SCOPE.sChar('target').GetFirstName]#!'s reputation and ensured [SCOPE.sChar('target').GetSheHe] never was allowed to practice magic again, so a necessary price had to be paid."
me_magic_studying.7.a: "Sorry!"

me_magic_studying.8_title: "Getting into the Flow"
me_magic_studying.8_desc: "After the initial few months of study, #Y [SCOPE.sChar('target').GetFirstName]#! has started to get accustomed to his studies. [SCOPE.sChar('target').GetHerHis] routine has grown to accommodate his magical studies, and even [SCOPE.sChar('target').GetHerHis] body has grown accustomed to the extensive use of mana required of [SCOPE.sChar('target').GetHerHim]!"
me_magic_studying.8.a: "Bring me more books!"

me_magic_studying.9_title: "The Price of Magic"
me_magic_studying.9_desc: "Of all the sacrifices made to master the mystic arts, money is one universally spent by all who walk down the path of the arcane. Many mages often bankrupt themselves to continue their research, and must find either generous patrons or state funding, both of which are difficult to come by.\n\n#Y [SCOPE.sChar('target').GetFirstName]#! has found themselves in such a predicament, and now faces bankruptcy to continue their studies. However, as a member of the royal court [SCOPE.sChar('target').GetSheHe] is in a unique position. #Y [SCOPE.sChar('target').GetFirstName]#! could acquire state funding to the detriment of the realm, or choose to call in a few political favors to collect half the amount due and foot the rest of the cost themselves at the expense of [SCOPE.sChar('target').GetHerHis] studies."
me_magic_studying.9.a: "The state will provide for my education!"
me_magic_studying.9.b: "I'll have to call in some favors"
me_magic_studying.9.c: "Damn!"

me_magic_studying.10_title: "Neglecting Duties"
me_magic_studying.10_desc: "All future magicians are aware of the great sacrifices one must make to earn their title and status in the world of mages, and balancing studies with courtly duties is a herculean task. Despite this, #Y [SCOPE.sChar('target').GetFirstName]#! has shown themselves to be able to keep up with both the demands of the state and the academy.\n\nHowever, as [SCOPE.sChar('target').GetHerHis] lessons grow harder and progress stalls, the aspiring mage slowly spends more time in [SCOPE.sChar('target').GetHerHis] study, often forgetting to attend meetings at court or failing to perform [SCOPE.sChar('target').GetHerHis] duties to the realm. As [SCOPE.sChar('target').GetSheHe] struggles to maintain this work-study balance, many at court have become aware of the neglect #Y [SCOPE.sChar('target').GetFirstName]#! has shown for [SCOPE.sChar('target').GetHerHis] duties.\n\nDespite their best efforts, the effects of #Y [SCOPE.sChar('target').GetFirstName]#!'s actions have begun to show, and rumors now circulate regarding how [SCOPE.sChar('target').GetSheHe] spends their time."
me_magic_studying.10.a: "Let me just finish this manuscript!"

me_magic_studying.11_title: "Attuned with the Divine"
me_magic_studying.11_desc: "It is said that the few who have the mental fortitude to endure the training necessary to become a #T Hierophant#! are the closest to understanding the divine. #Y Mages#! of this class are often become great spiritual leaders, and the few who glimpse further beyond tend to withdraw from public life and become ascetic monks, searching for divine truth through magic.\n\nAfter intense study of the #Y Divine Language#! and meditation, #Y [SCOPE.sChar('target').GetFirstName]#! has finally become attuned enough to see beyond one of the layers that hides the divine."
me_magic_studying.11.a: "Its all so clear now!"

me_magic_studying.12_title: "A Clouded Vision"
me_magic_studying.12_desc: "It is often said that #T Hierophants#! are born, not made. While one can learn the #Y Divine Language#! through intensive study, they will never truly understand it as well as a natural talent who seems to be truly attuned with the divine forces that govern this world. This requirement of natural talent is what defines the #T Hierophant#! class, and makes it the rarest in #G Omniluxia#!.\n\nUnfortunately, it seems like #Y [SCOPE.sChar('target').GetFirstName]#! was not born with the skills to understand the nature of the divine. The more [SCOPE.sChar('target').GetSheHe] tries to understand divine magic, the more confused [SCOPE.sChar('target').GetSheHe] becomes! Perhaps the ambitious mage may one day be able to channel the power of the gods, but for now [SCOPE.sChar('target').GetSheHe] must study harder if [SCOPE.sChar('target').GetSheHe] ever intends to get there."
me_magic_studying.12.a: "It just doesn't make sense!"

me_magic_studying.13_title: "A Melodian Pact"
me_magic_studying.13_desc: "While the price to learn magic will always be high, those who choose to follow the dark path of the #R Melodian#! school must sacrifice much more than the average mage.\n\nAlthough they appear to be distinct to the average person, an educated mage knows that pacts are curses are similar concepts. They are contracts made with godlike beings in which the mage or victim will be afflicted with the desired effect deriving from the being's power.\n\nHowever, where they do differ is in what a mage sacrifices to channel this being's power and the degree of contact between the two. Curses require small pieces of a mage's vitality in the form of mana or blood offered to the being in a formal ritual. Pacts require direct contact with the god, and they often demand things important to the mage, such as a loved one or one's soul. While the strength of a pact or curse depend on the importance of what is offered and the power of the god, pacts are often much stronger than curses due to their more intimate nature, and exorcising a pact is almost impossible once it is established.\n\n#R Melodian#! magic offers many powerful hexes, however, the more advanced spells of this school require a pact with the #R #E Dark Goddess#!#! herself. With #R Melodias'#! reputation as the patron of the marauding goblins, deep gnomes, hobgoblins, and drow, forming a pact with such a hated figure is sure to besmirch #Y [SCOPE.sChar('target').GetFirstName]#!'s reputation.\n\nFinally, the price of the pact must be considered. For such power, it is sure that the #Y #R Dark Goddess#!#! will demand nothing less than #Y [SCOPE.sChar('target').GetFirstName]#!'s soul. As an aspiring #R Necromancer#!, #Y [SCOPE.sChar('target').GetFirstName]#! must know deep in [SCOPE.sChar('target').GetHerHis] heart that no bound soul is truly free."
me_magic_studying.13.a: "I'm not sure I can commit to this"
me_magic_studying.13.b: "#R I pledge my soul to thee, #E Melodias#!#!"

me_magic_studying.14_title: "A Melodian Pact"
me_magic_studying.14_desc: "While the price to learn magic will always be high, those who choose to follow the dark path of the #R Melodian#! school must sacrifice much more than the average mage.\n\nAlthough they appear to be distinct to the average person, an educated mage knows that pacts are curses are similar concepts. They are contracts made with godlike beings in which the mage or victim will be afflicted with the desired effect deriving from the being's power.\n\nHowever, where they do differ is in what a mage sacrifices to channel this being's power and the degree of contact between the two. Curses require small pieces of a mage's vitality in the form of mana or blood offered to the being in a formal ritual. Pacts require direct contact with the god, and they often demand things important to the mage, such as a loved one or one's soul. While the strength of a pact or curse depend on the importance of what is offered and the power of the god, pacts are often much stronger than curses due to their more intimate nature, and exorcising a pact is almost impossible once it is established.\n\n#R Melodian#! magic offers many powerful hexes, however, the more advanced spells of this school require a pact with the #R #E Dark Goddess#!#! herself. With #R Melodias'#! reputation as the patron of the marauding goblins, deep gnomes, hobgoblins, and drow, forming a pact with such a hated figure is sure to besmirch #Y [SCOPE.sChar('target').GetFirstName]#!'s reputation.\n\nFinally, the price of the pact must be considered. For such power, it is sure that the #Y #R Dark Goddess#!#! will demand nothing less than #Y [SCOPE.sChar('target').GetFirstName]#!'s soul. As an aspiring #R Warlock#!, #Y [SCOPE.sChar('target').GetFirstName]#! must even the mightiest general is not truly free."
me_magic_studying.14.a: "I'm not sure I can commit to this"
me_magic_studying.14.b: "#R I pledge my soul to thee, #E Melodias#!#!"

me_magic_studying.15_title: "Cured"
me_magic_studying.15_desc: "Years of studying has made #Y [SCOPE.sChar('target').GetFirstName]#! an experienced and well-educated cleric, however, their skills will be put to the ultimate test on live patients. Although [SCOPE.sChar('target').GetSheHe] is nervous, [SCOPE.sChar('target').GetSheHe] is confident in [SCOPE.sChar('target').GetHerHis] skills and ready to prove [SCOPE.sChar('target').GetHerHim]self as a proper #Y Cleric#!!\n\nThe preparations are long and tedious, and the impatience of the patient just adds to the stress #Y [SCOPE.sChar('target').GetFirstName]#! is feeling. Finally, after taking the final measurements, #Y [SCOPE.sChar('target').GetFirstName]#! casts the spell.\n\nThere's a brief moment where #Y [SCOPE.sChar('target').GetFirstName]#! believes [SCOPE.sChar('target').GetSheHe]'s' failed, but this fear is quickly replaced with joy as the patient stands up, rejuvenated and full of life. The man is cured, and #Y [SCOPE.sChar('target').GetFirstName]#! has proven [SCOPE.sChar('target').GetHerHim]self as a proper #Y Cleric#!!"
me_magic_studying.15.a: "Its a miracle!"

me_magic_studying.16_title: "Swallowed by the Trees"
me_magic_studying.16_desc: "Over the last few months #Y [SCOPE.sChar('target').GetFirstName]#! has spent all of [SCOPE.sChar('target').GetHerHis] time in the wilderness, observing and understanding how life grew, flourished, evolved, and died. However, part of [SCOPE.sChar('target').GetHerHis] research required knowledge only found in an academy, so [SCOPE.sChar('target').GetSheHe] has spent the last few days gathering the materials needed for the incantation necessary to gain the knowledge [SCOPE.sChar('target').GetSheHe] seeks.\n\nUnfortunately, the adventurous mage based [SCOPE.sChar('target').GetHerHis] calculations on a model that was meant for a more natural environment, and [SCOPE.sChar('target').GetHerHis] spell quickly grew out of hand, killing and destorying a large part of the city. As the culprit, #Y [SCOPE.sChar('target').GetFirstName]#! has been sentenced to cleaning up the mess [SCOPE.sChar('target').GetSheHe] caused for the next few months."
me_magic_studying.16.a: "The city needed more greenery"

me_magic_studying.17_title: "A Mind Warped"
me_magic_studying.17_desc: "A brilliant opportunity has arisen for #Y [SCOPE.sChar('target').GetFirstName]#! to test out [SCOPE.sChar('target').GetHerHis] arcane prowess!\n\nIt appears that #Y [SCOPE.sChar('unfortunate_madman').GetFirstName]#! has discovered a shocking secret that would compromise [SCOPE.sChar('target').GetHerHis] position at court. The scoundrel has refused any bribes or favors and has stated [SCOPE.sChar('unfortunate_madman').GetHerHis] intention to expose [SCOPE.sChar('target').GetHerHim]. Therefore, #Y [SCOPE.sChar('target').GetFirstName]#! has reasonably decided that #Y [SCOPE.sChar('unfortunate_madman').GetFirstName]#! requires a little 'convincing', and knows just the spell to do it.\n\nThat night, #Y [SCOPE.sChar('target').GetFirstName]#! corners #Y [SCOPE.sChar('unfortunate_madman').GetFirstName]#! in [SCOPE.sChar('unfortunate_madman').GetHerHis] chambers. Before [SCOPE.sChar('unfortunate_madman').GetSheHe] can call for help, #Y [SCOPE.sChar('target').GetFirstName]#! casts [SCOPE.sChar('target').GetHerHis] spell. However, the spell, hastily crafted, is cast incorrectly. Before he can even process the pain, #Y [SCOPE.sChar('unfortunate_madman').GetFirstName]#!'s mind breaks. As lucidity warps into insanity, [SCOPE.sChar('unfortunate_madman').GetSheHe] collapses to the floor, [SCOPE.sChar('unfortunate_madman').GetHerHis] body unmoving."
me_magic_studying.17.a: "Oops!"

me_magic_studying.18_title: "Earthquake"
me_magic_studying.18_desc: "The ground opens up, indiscriminately swallowing the terrified civilians of [SCOPE.sP('rock_city').GetName|Y] as buildings collapse on top of them, crushing hundreds instantly. #Y Families#! are separated, homes are flattened, entire fields and pastures are lost as the earth crumbles underneath the town.\n\nThe aftermath of the earthquake is catastrophic for the local community. Those families that survived the disaster are either displaced, homeless, or starving. The former residents pray for help from the gods, but their prayers remain unanswered. They demand answers from the divine, and they are met with silence.\n\nWho is responsible for such a catastrophe? The gods? Mother Nature? Or was it just fate that decided they would be victims of such a tragedy?\n\nThe truth, occulted by the government, was that a powerful incantation caused this quake. One casted by a student mage whose minor miscalculations led to the death of hundreds. A mage whose powerful connections allowed them to escape the blame, but wouldn't allow them to escape the consequences of their actions."
me_magic_studying.18.a: "We can fix this, right?"

me_magic_studying.19_title: "Burnt Out"
me_magic_studying.19_desc: "Throughout [SCOPE.sChar('target').GetHerHis] studies, [SCOPE.sChar('target').GetFirstName|Y] has shown a determination unmatched by any other students in [SCOPE.sChar('target').GetHerHis] class. Everyone is aware of the sacrifices one must make to learn the arcane arts, and thus all look at [SCOPE.sChar('target').GetFirstName|Y] with admiration, as well as with worry.\n\nThere is a thin line between determination and obsession, and after weeks of relentless study, [SCOPE.sChar('target').GetFirstName|Y]'s body cannot keep up with the demands of [SCOPE.sChar('target').GetHerHis] mind. They are found the following morning by other students, unconcious on the floor with various tomes scattered across [SCOPE.sChar('target').GetHerHis] desk.\n\nWaking up hours later in a small infirmary, it is clear that the young pupil must take a break, lest [SCOPE.sChar('target').GetHerHis] studies consume them."
me_magic_studying.19.a: "Perhaps I should take a break"

me_magic_studying.20_title: "The Costs of Magic"
me_magic_studying.20_desc: "Studying magic takes time and effort, but most importantly of all: money\n\nBooks, teachers, food, lodging, none of these are free, and #Y [SCOPE.sChar('target').GetFirstName]#! has found themselves in a financial predicament.\n\nNeeding to procure a new source of funding, #Y [SCOPE.sChar('target').GetFirstName]#! looks for allies amongst the political elite. After some searching, [SCOPE.sChar('political_friend').GetName|Y] has offered to be [SCOPE.sChar('target').GetHerHis] patron, for a price."
me_magic_studying.20.a: "Friends help each other"
me_magic_studying.20.b: "I'll find the money somewhere else"

me_magic_studying.21_title: "Mastering Magic Studies"
me_magic_studying.21_desc: "At long last, #Y [SCOPE.sChar('target').GetFirstName]#! has managed to acquire the final few tomes left related to their studies. Countless hours of studying has led to this moment, and even though it's been a long journey, #Y [SCOPE.sChar('target').GetFirstName]#! feels it has been worth it. [SCOPE.sChar('target').GetHerHis] determination to learn has involved both setbacks and triumphs, but #Y [SCOPE.sChar('target').GetFirstName]#! now stands victorious at the final stretch.\n\nAfter reading through and mastering these final few tomes, #Y [SCOPE.sChar('target').GetFirstName]#!'s great journey will come to an end, and [SCOPE.sChar('target').GetHerHis] new arcane abilities will start [SCOPE.sChar('target').GetHerHim] on a new journey!"
me_magic_studying.21.a: "Just a few more books!"

me_magic_studying.22_title: "Blinded"
me_magic_studying.22_desc: "A curious student, #Y [SCOPE.sChar('target').GetFirstName]#! is always pushing the boundaries of their abilities. However, experimenting with magic can often cause unforseen and deadly consequences.\n\nWhile #Y [SCOPE.sChar('target').GetFirstName]#! deconstructed one of the newest incantations [SCOPE.sChar('target').GetSheHe] had learned, [SCOPE.sChar('target').GetSheHe] decided to run a small experiment to see if they could amplify the spells power by introducing new words from a similar incantation. Thus, when #Y [SCOPE.sChar('target').GetFirstName]#! cast the spell it began to glow brighter than it had before, requiring more mana to stabilize it.\n\nAt first the mage celebrated, as [SCOPE.sChar('target').GetHerHis] experiment had produced the desired results. However, it quickly became clear that the fledgling mage could not control [SCOPE.sChar('target').GetHerHis] mana output, and the fluctuations [SCOPE.sChar('target').GetSheHe] produced caused the spell to fail, immediately showering the room in a brilliant light."
me_magic_studying.22.a: "It burns!"

me_magic_studying.23_title: "Melodian Madness"
me_magic_studying.23_desc: "#Y #R Kill the children of the Mother Earth\n\nKill the children of Father Stone\n\nKill the children of the World Serpents\n\nKill the children of Na'athran\n\nKill the children of Wielkopan\n\nKill the chosen of Wishtheon\nThe children of the Twins\nThose who rallied them all to seal me\nThose foolish enough to free me\nThese I hate the most\nThey are arrogant, power-hungry, young, naive\nShow them no mercy\n\nTake my essence, and use it well servant.#!#!"
me_magic_studying.23.a: "#R #E KILL KILL KILL KILL#!#!"
me_magic_studying.23.b: "Blood and madness make for a poor tutor"

me_magic_studying.24_title: "Grand Earthworks"
me_magic_studying.24_desc: "Having almost finished [SCOPE.sChar('target').GetHerHis] studies, #Y [SCOPE.sChar('target').GetFirstName]#! has one final test left before [SCOPE.sChar('target').GetSheHe] can complete [SCOPE.sChar('target').GetHerHis] training: using their #Y Earth#! spells to create a large structure.\n\nAt the outskirts of [GetProvince('elemental_good_target').GetName|G], #Y [SCOPE.sChar('target').GetFirstName]#! prepares [SCOPE.sChar('target').GetHerHis] incantation, drawing large circles around where they intend to uproot the earth. Curious locals watch as #Y [SCOPE.sChar('target').GetFirstName]#! traces out a large area in preparation for [SCOPE.sChar('target').GetHerHis] spell, offering bread and wine to the weary mage.\n\nFinally, the outline is done. #Y [SCOPE.sChar('target').GetFirstName]#! sits atop the largest incantation circle and begins to utter the spell. Locals watch in amazement as the ground rises up, creating a small hill. Atop the hill large stone walls raise out of the ground and form a crude fort, completing the spell.\n\n#Y [SCOPE.sChar('target').GetFirstName]#! lays down, exhausted, as the locals come up to thank [SCOPE.sChar('target').GetHerHim] for creating such a defense for their community."
me_magic_studying.24.a: "Soon, I'll be able to make something twice this size!"

me_magic_studying.25_title: "A Generous Donation"
me_magic_studying.25_desc: "After several months of studying, #Y [SCOPE.sChar('target').GetFirstName]#! is eager to test out a new #Y Charm#! spell [SCOPE.sChar('target').GetSheHe]'s learned.\n\nAt a small gathering, #Y [SCOPE.sChar('target').GetFirstName]#! approaches #Y [SCOPE.sChar('easy_pickings').GetFirstName]#! with a bright smile and a friendly demeanor. The two chat for a while, drink, eat, and laugh together. Once #Y [SCOPE.sChar('easy_pickings').GetFirstName]#!'s guard is down, #Y [SCOPE.sChar('target').GetFirstName]#! seizes [SCOPE.sChar('target').GetHerHis] chance.\n\nWhile #Y [SCOPE.sChar('easy_pickings').GetFirstName]#! isn't looking, #Y [SCOPE.sChar('target').GetFirstName]#! utters the #Y Charm#! incantation [SCOPE.sChar('target').GetSheHe]'s learnt. Then, [SCOPE.sChar('target').GetSheHe] subtly mentions seeking funding to purchase more books necessary for [SCOPE.sChar('target').GetHerHis] studies, emphasizing the importance of a sizable contribution. Under [SCOPE.sChar('target').GetHerHis] spell, #Y [SCOPE.sChar('easy_pickings').GetFirstName]#! offers to provide a generous gift necessary to pay for these books."
me_magic_studying.25.a: "Your contribution is appreciated!"

me_magic_studying.26_title: "Nature's Bounty"
me_magic_studying.26_desc: "#Y [SCOPE.sChar('target').GetFirstName]#! stands outside of a ruined orchard. Bandits had recently ravaged this town, and anything they were unable to carry off was burned.\n\n#Y [SCOPE.sChar('target').GetFirstName]#! examines the dead trees, and begins gathering ash to use for an incantation circle. The work is difficult, but [SCOPE.sChar('target').GetHerHis] unwavering diligence completes the task within a couple of hours. With the circle complete, #Y [SCOPE.sChar('target').GetFirstName]#! lays down the various materials necessary for the spell across the circle, careful to ensure that they are the correct quantities. With everything set up, [SCOPE.sChar('target').GetSheHe] begins the spell.\n\nFor a moment nothing happens. Perhaps the measurements were off? Or maybe [SCOPE.sChar('target').GetSheHe] didn't use enough mana?\n\nSlowly but steadily, green sprouts appear out of the ground. Over the next few days, young apple and orange trees blossom across the orchard, their sturdy branches swaying in the wind."
me_magic_studying.26.a: "Beautiful!"
me_magic_studying.26.b: "My knowledge grows as steadily as the roots of these mighty trees"

# GRADUATION T1
me_magic_studying.27_title: "Graduation"
me_magic_studying.27_desc: "After years spent researching, finding both teachers and tomes, and spending sleepless nights scouring books for proper incantations needed to begin spells, [SCOPE.sChar('target').GetName|Y] has finally taken [SCOPE.sChar('target').GetHerHis] first steps into the world of the arcane and learned basic #Y #T Diviner#!#! spells of the #Y #T Omnic#! School#!!\n\nAs a proper #Y Mage#!, #Y [SCOPE.sChar('target').GetFirstName]#! can now choose to continue [SCOPE.sChar('target').GetHerHis] research into higher level #Y #T Diviner#!#! spells if [SCOPE.sChar('target').GetSheHe] chooses to do so!"
me_magic_studying.27.a: "All shall know my name!"

