# Special Spells
me_magic_studying.51_title: "Graduation"
me_magic_studying.51_desc: "After years of studying at the prestigious #E Magonis School of Summoning Magic#!, [SCOPE.sChar('target').GetName] has mastered the #E Lubes Style#! used by #E Magonis the Wise#! himself!\n\nNow able to summon #E Battle Beasts#!, #E [SCOPE.sChar('target').GetFirstName]#! will be a fearsome foe indeed!"
me_magic_studying.51.a: "The Wise One guides me!"

me_magic_studying.52_title: "Graduation"
me_magic_studying.52_desc: "After years of studying in the frigid conditions of #E Polaria#!, [SCOPE.sChar('target').GetName] has mastered the #E Taanka Style#! of the #E Jemskoo#! gnomes!\n\nNow able to create large #E Battle Avatars#!, #E [SCOPE.sChar('target').GetFirstName]#! can become one of the most dangerous opponents one could find themselves facing on any battlefield!"
me_magic_studying.52.a: "Taanka's strength now flows through my veins!"

me_magic_studying.53_title: "Graduation"
me_magic_studying.53_desc: "After years of studying amongst the #E Exiled Mages#! of [GetProvince('(int32)5031').GetName], [SCOPE.sChar('target').GetName] has mastered the #E Zare Jad Style#!!\n\nAble to to shield [SCOPE.sChar('target').GetHerHis] allies, #E [SCOPE.sChar('target').GetFirstName]#! will be a necessity in any army facing a magical opponent!"
me_magic_studying.53.a: "The Grey One's scales will protect me!"

me_magic_studying.54_title: "Graduation"
me_magic_studying.54_desc: "After years of studying at the holy #E Beige Palace#!, [SCOPE.sChar('target').GetName] has mastered the #E Hellarui Style#! practiced by the #E Helluvian#! faithful!\n\nWith #E Hellas'#! blessing, #E [SCOPE.sChar('target').GetFirstName]#! can protect and heal those truly in need!"
me_magic_studying.54.a: "Hellas give me strength!"

me_magic_studying.55_title: "Graduation"
me_magic_studying.55_desc: "After years of studying amongst the deceitful disciples of the #E Psiddisamman School of Charm Magic#!, [SCOPE.sChar('target').GetName] has mastered the #E Psiddisamman Style#!!\n\nNow possessing powerful charm magic, #E [SCOPE.sChar('target').GetFirstName]#! is to be feared by both peasants and emperors alike!"
me_magic_studying.55.a: "Who could say no to me?"

me_magic_studying.56_title: "Graduation"
me_magic_studying.56_desc: "After years of studying in the great libraries of #E Veddtunn#!, [SCOPE.sChar('target').GetName] has mastered the #E Gerrtágadi Style#! of the Silver Dwarves!\n\nAble to shape solid rock through touch, #E [SCOPE.sChar('target').GetFirstName]#! has the capabilities to make truly astounding works of art!"
me_magic_studying.56.a: "Rock on!"

me_magic_studying.57_title: "Graduation"
me_magic_studying.57_desc: "After years of studying amongst the secretive #E Shoishoni#!, [SCOPE.sChar('target').GetName] has mastered the #E Ponikar Style#! of the #E Blood Mages#!!\n\nNow a powerful #R Melodian#! mage, #E [SCOPE.sChar('target').GetFirstName]#!'s' hexes have the power to threaten the lives of even the most powerful of Omniluxia within days!"
me_magic_studying.57.a: "I have plans that I cannot share with you right now because the haters will try and stop me"

me_magic_studying.58_title: "Graduation"
me_magic_studying.58_desc: "After years of studying amongst the few students lucky enough to attend the #E Jelenia School of Soul Magic#!, [SCOPE.sChar('target').GetName] has mastered the #E Starogii Style#!!\n\nBeing proficient in the arcane art of manipulating the souls of living beings, the possibilities this style offers are only equal to the terrifying implications of what experienced mages could do with this power."
me_magic_studying.58.a: "May Jelenia show me the way"

