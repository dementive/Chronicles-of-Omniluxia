me_zorgo_magic_focus.24_title: "Warborn Curse"
me_zorgo_magic_focus.24_desc: "Dark magic has changed [SCOPE.sChar('target').GetName|Y], turning a skull-marked curse into a more martial, warlike form."
me_zorgo_magic_focus.24.a: "Let the curse be reforged."

me_zorgo_magic_focus.998_title: "The Wellspring Opens"
me_zorgo_magic_focus.998_desc: "A deep hum rises beneath the palace floors as unseen channels of raw mana answer [ROOT.GetCountry.GetRuler.GetName|Y]. Candle flames bend toward [ROOT.GetCountry.GetRuler.GetHerHim], ink lifts from old spellbooks in shining threads, and the air tastes briefly of rain over stone.\n\nCurrent #T Mana#!: #Y [ROOT.GetCountry.GetRuler.MakeScope.Var('magic').GetValue|0]#!\nMaximum #T Mana#!: #G [ROOT.GetCountry.GetRuler.MakeScope.Var('magic_max').GetValue|0]#!\n\nWith a word, [ROOT.GetCountry.GetRuler.GetPraenomen] can draw the reservoir full again."
me_zorgo_magic_focus.998.a: "Let the mana flow."
me_zorgo_magic_focus.998_tooltip: "Our mana is restored to its current maximum."

me_zorgo_magic_focus.999_title: "Warborn Curse"
me_zorgo_magic_focus.999_desc: "Swirls of magic mist blanket [ROOT.GetCountry.GetRuler.GetName|Y], infusing [ROOT.GetCountry.GetRuler.GetHerHim] with arcane abilities."
me_zorgo_magic_focus.999.a: "I have been blessed with the power of magic!"
me_zorgo_magic_focus.997_title: "An Archmage Emerges"
me_zorgo_magic_focus.997_desc: "Arcane rumor draws a wandering adept to the court of [ROOT.GetCountry.GetRuler.GetName|Y]. [SCOPE.sChar('new_archmage').GetName|Y] kneels, and in a flash of raw mana reveals the full breadth of [SCOPE.sChar('new_archmage').GetHerHis] power — a true#! #G Archmage#! #Y willing to serve.#!"
me_zorgo_magic_focus.997.a: "The court has its mage."
me_zorgo_magic_focus.997_tooltip: "#Y Spawns a random#! #G Archmage#! #Y in our court, versed in every school and brimming with mana."


# Learn Magic Menu

me_magic_menu.1_title: "Study Magic"
me_magic_menu.1_visitor_desc: "After much thought, [SCOPE.sChar('target').GetName|Y] has decided to dedicate [SCOPE.sChar('target').GetHerselfHimself] to discovering the arcane. Such a task will be a significant investment, but success would add greatly to [SCOPE.sChar('target').GetHerHis] magical arsenal. Should [SCOPE.sChar('target').GetFirstName|Y] master the basic spells of each class, [SCOPE.sChar('target').GetSheHe] may be able to specialize and even become an acknowledged master of that school.\n\nBefore beginning [SCOPE.sChar('target').GetHerHis] studies, [SCOPE.sChar('target').GetFirstName|Y] must decide which school of magic to learn from."
me_magic_menu.1_desc: "After much thought, [ROOT.GetCountry.GetRuler.GetName|Y] has decided to dedicate himself to discovering the arcane. Such a task will be a significant investment, however their success would add to [ROOT.GetCountry.GetRuler.GetHerHis] magical arsenal. Should [ROOT.GetCountry.GetRuler.GetFirstName|Y] master the basic spells of each class, [ROOT.GetCountry.GetRuler.GetSheHe] may be able to specialize and even become an acknowledge master of said school!\n\nBefore [ROOT.GetCountry.GetRuler.GetSheHe] begins [ROOT.GetCountry.GetRuler.GetHerHis] studies, [ROOT.GetCountry.GetRuler.GetFirstName|Y] must ask [ROOT.GetCountry.GetRuler.GetHerHim]self which school of magic [ROOT.GetCountry.GetRuler.GetSheHe] intends to learn from."
me_magic_menu.1.a: "Let us see what the #T Omnic#! school can offer me"
me_magic_menu.1a_tooltip: "#Y We will view the #T Omnic#! spells available to learn#!\n\n#T Omnic#! magic shapes pure mana into devastating energy, protective armor, and divine revelation."
me_magic_menu.1.b: "I would like to see what enchantments the #Y Aldic#! school can teach me"
me_magic_menu.1b_tooltip: "#Y We will view the #Y Aldic#! spells available to learn#!\n\n#Y Aldic#! magic manipulates the mind, soul, and flesh, offering illusions, influence, healing, and restoration."
me_magic_menu.1.c: "The #G Amten#! school may have powerful spells"
me_magic_menu.1c_tooltip: "#Y We will view the #G Amten#! spells available to learn#!\n\n#G Amten#! magic commands nature and the elements, shaping fire, water, earth, air, plants, and beasts."
me_magic_menu.1.d: "Perhaps #R Melodian#! magic can offer me far more powerful hexes..."
me_magic_menu.1d_tooltip: "#Y We will view the #R Melodian#! spells available to learn#!\n\n#R Melodian#! magic draws on blood, curses, pacts, and necromancy to unleash powerful but dangerous hexes."
me_magic_menu.1.e: "I will not learn a new spell right now"
me_magic_menu.1e_tooltip: "#Y This will close the menu#!"

me_magic_menu.2_title: "Study Omnic Magic"
me_magic_menu.2_visitor_desc: "The #Y #T Omnic#!#! school is one of the oldest and most powerful in #G Omniluxia#!. Its mages are divided chiefly between #Y #T Diviners#!#!, who shape pure mana into beams and physical armor, and #Y #T Hierophants#!#!, who invoke the power of the #Y Sealed Gods#! against dark magic.\n\nLooking through the spells available, [SCOPE.sChar('target').GetName|Y] must choose what [SCOPE.sChar('target').GetSheHe] wishes to learn."
me_magic_menu.2_desc: "The #Y #T Omnic#!#! school of magic is one of the oldest and most powerful in #G Omniluxia#!, with it's users subdivided into two major classes: #Y #T Diviner#!#! and #Y #T Hierophant#!#!.\n\n#Y #T Omnic#!#! magic pertains to the concentration of mana into the form of pure energy. While such magic is often seen by many is simple, more advanced spells attributed to godlike beings are far more devastating than anything the other schools can cast.\n\nMages of the #Y #T Diviner#!#! class concentrate their mana into pure energy to be released as beams or manifested as physical armors.\n\nMeanwhile, those of the #Y #T Hierophant#!#! class try to tap into the power of the #Y Sealed Gods#! to combat #Y #R Melodian#!#! magic.\n\nLooking through the spells available to them, [ROOT.GetCountry.GetRuler.GetName|Y] must choose what to learn."
