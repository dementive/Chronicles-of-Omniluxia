me_magic_menu.4_title: "Study Amnic Magic"
me_magic_menu.4_visitor_desc: "The widespread #Y #G Amten#!#! school concerns the manipulation of the natural world. #Y #G Elementalists#!#! command fire, water, earth, and air, while #Y #G Druids#!#! work their magic through plants and animals, bringing life even to barren land.\n\nLooking through the spells available, [SCOPE.sChar('target').GetName|Y] must choose what [SCOPE.sChar('target').GetSheHe] wishes to learn."
me_magic_menu.4_desc: "The most common and research school, #Y #G Amten#!#! magic pertains to the manipulation of the natural world, with it's users subdivided into two major classes: #Y #G Elementalist#!#! and #Y #G Druid#!#!.\n\n#Y #G Amten#!#! magicians can be found across #G Omniluxia#!, as most #Y folk magic#! can be categorized as part of the #Y #G Amten#!#! school. These magicians have the power to both destroy and build settlements at will, and are the most likely to be found in rural villages, where they help construct houses and bring rains.\n\nThe #Y #G Elementalist#!#! class is one of the most common in #G Omniluxia#! right after the #Y #G Druid#!#!. #Y #G Elementalists#!#! work with all physical elements of the world, and can manipulate all forms of fire, water, earth, and even air. Most of these magicians are not academy-trained, rather they are folk magicians utilizing magic passed down to them through centuries. However, the most powerful #Y #G Elementalists#!#! can change the tide of entire wars.\n\nThe most common class in #G Omniluxia#!, the #Y #G Druids#!#! cast spells that pertain to all living things. While their magic does not affect conscious races like the #Y #Y Illusionist#!#!, their powerful spells can manipulate surrounding plants and animals, bringing life to barren wastelands. Most commonly found amongst the #Y Wood Elves#!, #Y #G Druids#!#! can be seen throughout #G Omniluxia#!, and are often called upon by rural farmers to help them keep their crops healthy.\n\nLooking through the spells available to them, [ROOT.GetCountry.GetRuler.GetName|Y] must choose what to learn."
me_magic_menu.4.a: "Study Beginner #G #E Elementalist#!#! Spells"
me_magic_menu.4a_tooltip: "#Y We will study the Beginner #E #G Elementalist#!#! class spells#!"
