me_magic_menu.5_title: "Study Melodian Magic"
me_magic_menu.5_visitor_desc: "#Y #R Melodian#!#! witchcraft draws upon the dark goddess #Y #R Melodias#!#!. #Y #R Necromancers#!#! use her power to manipulate the dead and the living, while #Y #R Warlocks#!#! turn it toward enhancing themselves and destroying their enemies.\n\nSifting through the forbidden works at hand, [SCOPE.sChar('target').GetName|Y] must choose which dark arts [SCOPE.sChar('target').GetSheHe] wishes to learn."
me_magic_menu.5_desc: "All witchcraft categorized as #Y #R Melodian#!#! magic draws from the power of the dark goddess #Y #R Melodias#!#! herself, and users are often split into two major classes: #Y #R Necromancers#!#! and #Y #R Warlocks#!#!.\n\nTo utilize her power, most who desire to use dark magic typically sacrifice something or form a pact with the #Y #R Dark Goddess#!#! to be allowed to use her strength. While this type of magic has always been somewhat taboo, the stark increase in strength of users following the #Y #R Great Collapse#!#! and the awakening of many #Y #R Melodian#!#! races has meant that those seeking her power are ostracized, and few works pertaining to her magic remain. However, those dedicated enough to seek her strength will be able to find sources to help them.\n\nThose who are called #Y #R Necromancers#!#! use their pact with #Y #R Melodias#!#! to cast dark magic to manipulate both the dead and the living. Many have speculated that one who becomes entranced enough with such a power could become a #Y #R Lich#!#!.\n\nThe most common user of #Y #R Melodian#!#! magic, #Y #R Warlocks#!#! utilize #Y #R Melodias#!#!' power to enhance their own abilities and destroy their enemies with unthinkable brutality and savagery.\n\nSifting through the few works they could find, [ROOT.GetCountry.GetRuler.GetName|Y] must choose which dark arts to learn."
me_magic_menu.5.a: "Study Beginner #R #E Necromancer#!#! Spells"
me_magic_menu.5a_tooltip: "#Y We will study the Beginner #E #R Necromancer#!#! class spells#!"
