me_magic_studying.34_desc: "After years spent researching, finding both teachers and tomes, and spending sleepless nights scouring books for proper incantations needed to complete a spell, [SCOPE.sChar('target').GetName] has finally taken [SCOPE.sChar('target').GetHerHis] first steps into the world of the arcane and learned basic #E #Y Cleric#!#! spells of the #E #Y Aldic#! School#!!\n\nAs a proper #E Mage#!, #E [SCOPE.sChar('target').GetFirstName]#! can now choose to continue [SCOPE.sChar('target').GetHerHis] research into higher level #E #Y Cleric#!#! spells if [SCOPE.sChar('target').GetSheHe] chooses to do so!"
me_magic_studying.34.a: "All shall know my name!"

# GRADUATION T2
me_magic_studying.35_title: "Graduation"
me_magic_studying.35_desc: "At long last, [SCOPE.sChar('target').GetName] has finally honed and trained [SCOPE.sChar('target').GetHerHis] skills to the point that [SCOPE.sChar('target').GetSheHe] can truly be called a #E #T Diviner#!#!, a master of the divine energies that form the basis of the #E #T Omnic#! School#!.\n\nAfter years of long, intensive research and many long nights spent in the academy, #E [SCOPE.sChar('target').GetFirstName]#! has learned a new tier of #E #T Diviner #!#! spells, and can now progress to master his chosen class."
me_magic_studying.35.a: "There is still much to learn!"

