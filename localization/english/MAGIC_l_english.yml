me_magic_studying.43_title: "Graduation"
me_magic_studying.43_desc: "After years spent researching, finding both teachers and tomes, and spending sleepless nights scouring books for proper incantations needed to create spells, [SCOPE.sChar('target').GetName|Y] has taken [SCOPE.sChar('target').GetHerHis] final steps in [SCOPE.sChar('target').GetHerHis] journey to master the arcane arts, having learned advanced #Y #T Diviner#!#! spells of the #Y #T Omnic#! School#!!\n\nAs a wise #G Archmage#!, #Y [SCOPE.sChar('target').GetFirstName]#! can now choose to branch out and research spells from other classes if [SCOPE.sChar('target').GetSheHe] desires to!"
me_magic_studying.43.a: "There's always more to learn!"

