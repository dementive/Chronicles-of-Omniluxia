magically_attuned_trait: "Magically Attuned"
magically_attuned_trait_desc: "Whether due to [CHARACTER.GetHerHis] bloodline or sheer luck, learning and casting magic has always come naturally to [CHARACTER.GetPraenomen]."
magically_inept_trait: "Magically Inept"
magically_inept_trait_desc: "Unfortunately for [CHARACTER.GetPraenomen], the arcane arts have always been difficult to master, whether due to [CHARACTER.GetHerHis] bloodline or a stroke of misfortune."
magical_sickness_trait: "Mana Sickness"
magical_sickness_trait_desc: "Whether because [CHARACTER.GetSheHe] is courageous or stupid, [CHARACTER.GetPraenomen] has overused the mana in [CHARACTER.GetHerHis] soul, temporarily weakening [CHARACTER.GetHerHis] physical body and spellcasting abilities."
blood_angel_curse_trait: "Blood Angel Curse"
blood_angel_curse_trait_desc: "[CHARACTER.GetPraenomen], known to the faithful as the prophesized #Y Blood Angel#!, has been blessed with the ability to control her own blood and the blood of those she defeats in battle."

me_zorgo_magic_focus.23_title: "Warborn Dissolves"
me_zorgo_magic_focus.23_desc: "The mysterious #Y Warborn#! are #Y Wraiths#! given life once again by #Y Necromancers#! with the exclusive task of waging war. However, since their spirits are amalgamations made of various souls who were great warriors in life, their physical form is very volatile compared to other #Y Wraiths#!.\n\nToday it seems that #Y [SCOPE.sChar('dead_skelebro').GetFirstName]'s#! time has come, as his physical form has begun its slow decay since this morning. Although his service will not be forgotten, it is certain that his absence will be noticed."
# --- Instant battle spells: cast during an active battle (me_zorgo_magic_focus.29) ---
me_zorgo_magic_focus.29_title: "Battlefield Spellcraft"
me_zorgo_magic_focus.29_desc: "The battle is joined, and there is no time for marching charms or camp blessings. What spell shall [SCOPE.sChar('selected_mage').GetName|Y] cast against the enemy facing us?"
me_zorgo_magic_focus.29.e: "Dread Omen"
me_zorgo_magic_focus.29.g: "Crushing Terror"

omni_battle_haste_tt: "\n#Y Floods your force with resolve, granting#! #G +25% Land and Naval Morale#! #Y while the battle is joined.#!\n\n"
omni_battle_haste_2_tt: "\n#Y Chokes the enemy's courage, immediately damaging their morale and inflicting#! #R -25% Land and Naval Morale#! #Y on the opposing force in this battle.#!\n\n"
omni_battle_haste_3_tt: "\n#Y Fills your warriors and sailors with heroic fury, granting#! #G +50% Land and Naval Morale#! #Y while the battle is joined.#!\n\n"
omni_battle_haste_4_tt: "\n#Y Smothers the enemy beneath supernatural dread, immediately dropping their morale by roughly half and inflicting#! #R -50% Land and Naval Morale#! #Y on the opposing force in this battle.#!\n\n"
omni_battle_rally_tt: "\n#Y Lifts their spirits, granting#! #G +20% Land and Naval Morale#! #Y and#! #G +10% Land and Naval Morale Recovery#!.\n\n"
omni_battle_discipline_tt: "\n#Y Steadies the ranks and crews, granting#! #G +5% Discipline#! #Y on land and stronger naval combat performance at sea.#!\n\n"
omni_battle_blessing_tt: "\n#Y A complete battle blessing:#! #G +15% Movement Speed#!, #G +15% Morale#! #Y and stronger combat performance on land or sea. #T Archmage only#!.\n\n"
omni_arcane_aegis_tt: "\n#Y Seals the unit behind arcane wards, granting#! #G +10% Land and Naval Morale#!, #G +5% Discipline#! #Y and#! #G -5% Naval Damage Taken#! #Y for#! #G 30 days#!.\n\n"
omni_battle_clarity_tt: "\n#Y Sharpens discipline and recovery, granting#! #G +10% Land and Naval Morale Recovery#! #Y and#! #G +3% Discipline#! #Y for#! #G 30 days#!.\n\n"
omni_conjured_supply_tt: "\n#Y Conjures lasting supplies for the country, granting#! #G +10% Monthly Food#! #Y and#! #G +10% Supply Limit#! #Y for#! #G 30 days#!.\n\n"
omni_spectral_boarders_tt: "\n#Y Calls ghostly marines to the fleet, granting#! #G +10% Naval Damage Done#!, #G +10% Naval Morale#!, #G +10% Navy Movement Speed#! #Y and#! #G -5% Naval Damage Taken#! #Y for#! #G 30 days#!.\n\n"
omni_blighted_ground_tt: "\n#Y The enemy army suffers#! #R -20% Army Movement Speed#!, #R -5% Land Morale#! #Y and#! #R -3% Discipline#! #Y for#! #G 30 days#!. #Y Blighted earth clings to their boots and sours their advance.#!\n\n"
omni_mudbind_tt: "\n#Y The enemy army suffers#! #R -35% Army Movement Speed#! #Y and#! #R -5% Land Morale Recovery#! #Y for#! #G 30 days#!. #Y Heavy mud and magic mire hold them in place.#!\n\n"
omni_cursed_rigging_tt: "\n#Y The enemy fleet suffers#! #R -35% Navy Movement Speed#!, #R +10% Naval Damage Taken#! #Y and#! #R -5% Naval Morale#! #Y for#! #G 30 days#!. #Y A curse tangles the rigging and panics the crew.#!\n\n"
omni_fear_hex_tt: "\n#Y The enemy army and fleet suffer#! #R -10% Morale#!, #R -5% Morale Recovery#! #Y and#! #R -5% Discipline#! #Y for#! #G 30 days#!. #Y Fear seeps into every rank and deck.#!\n\n"
omni_storm_wrack_tt: "\n#Y The enemy army and fleet suffer#! #R -10% Movement Speed#!, #R -5% Morale#! #Y and#! #R +5% Naval Damage Taken#! #Y for#! #G 30 days#!. #Y A violent storm lashes both land and sea forces.#!\n\n"
omni_harbor_ward_tt: "\n#Y The capital province gains#! #G +15% Fortification Defense#!, #G +10% Garrison Size#! #Y and#! #G +10% Local Monthly Food#! #Y for#! #G 1 year#!. #Y Protective wards guard the harbor and walls.#!\n\n"
omni_unrest_cleansing_tt: "\n#Y The country gains#! #G -5% Unrest#! #Y and#! #G +5% Population Happiness#! #Y for#! #G 1 year#!. #Y A calming enchantment eases local tension.#!\n\n"
omni_migration_beacon_tt: "\n#Y The capital province gains#! #G +5 Local Migration Attraction#! #Y and#! #G +3% Local Population Growth#! #Y for#! #G 1 year#!. #Y A bright beacon draws settlers home.#!\n\n"
omni_weathercall_growth_tt: "\n#Y The capital province gains#! #G +25% Local Monthly Food#! #Y and#! #G +2% Local Population Growth#! #Y for#! #G 1 year#!. #Y Fair weather and blessed rains aid the harvest.#!\n\n"

