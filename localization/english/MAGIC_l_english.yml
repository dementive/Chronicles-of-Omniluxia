me_magic_studying.32_title: "Graduation"
me_magic_studying.32_desc: "After years spent researching, finding both teachers and tomes, and spending sleepless nights scouring books for proper incantations needed to begin spells, [SCOPE.sChar('target').GetName] has finally taken [SCOPE.sChar('target').GetHerHis] first steps into the world of the arcane and learned basic #E #G Elementalist#!#! spells of the #E #G Amten#! School#!!\n\nAs a proper #E Mage#!, #E [SCOPE.sChar('target').GetFirstName]#! can now choose to continue [SCOPE.sChar('target').GetHerHis] research into higher level #E #G Elementalist#!#! spells if [SCOPE.sChar('target').GetSheHe] chooses to do so!"
me_magic_studying.32.a: "All shall know my name!"

me_magic_studying.33_title: "Graduation"
me_magic_studying.33_desc: "After years spent researching, finding both teachers and tomes, and spending sleepless nights scouring books for proper incantations needed to begin spells, [SCOPE.sChar('target').GetName] has finally taken [SCOPE.sChar('target').GetHerHis] first steps into the world of the arcane and learned basic #E #Y Illusionist#!#! spells of the #E #Y Aldic#! School#!!\n\nAs a proper #E Mage#!, #E [SCOPE.sChar('target').GetFirstName]#! can now choose to continue [SCOPE.sChar('target').GetHerHis] research into higher level #E #Y Illusionist#!#! spells if [SCOPE.sChar('target').GetSheHe] chooses to do so!"
me_magic_studying.33.a: "All shall know my name!"

me_magic_studying.34_title: "Graduation"
