me_magic_studying.19_title: "Burnt Out"
me_magic_studying.19_desc: "Throughout [SCOPE.sChar('target').GetHerHis] studies, [SCOPE.sChar('target').GetFirstName] has shown a determination unmatched by any other students in [SCOPE.sChar('target').GetHerHis] class. Everyone is aware of the sacrifices one must make to learn the arcane arts, and thus all look at [SCOPE.sChar('target').GetFirstName] with admiration, as well as with worry.\n\nThere is a thin line between determination and obsession, and after weeks of relentless study, [SCOPE.sChar('target').GetFirstName]'s body cannot keep up with the demands of [SCOPE.sChar('target').GetHerHis] mind. They are found the following morning by other students, unconcious on the floor with various tomes scattered across [SCOPE.sChar('target').GetHerHis] desk.\n\nWaking up hours later in a small infirmary, it is clear that the young pupil must take a break, lest [SCOPE.sChar('target').GetHerHis] studies consume them."
me_magic_studying.19.a: "Perhaps I should take a break"

me_magic_studying.20_title: "The Costs of Magic"
me_magic_studying.20_desc: "Studying magic takes time and effort, but most importantly of all: money\n\nBooks, teachers, food, lodging, none of these are free, and #E [SCOPE.sChar('target').GetFirstName]#! has found themselves in a financial predicament.\n\nNeeding to procure a new source of funding, #E [SCOPE.sChar('target').GetFirstName]#! looks for allies amongst the political elite. After some searching, [SCOPE.sChar('political_friend').GetName] has offered to be [SCOPE.sChar('target').GetHerHis] patron, for a price."
me_magic_studying.20.a: "Friends help each other"
me_magic_studying.20.b: "I'll find the money somewhere else"

me_magic_studying.21_title: "Mastering Magic Studies"
me_magic_studying.21_desc: "At long last, #E [SCOPE.sChar('target').GetFirstName]#! has managed to acquire the final few tomes left related to their studies. Countless hours of studying has led to this moment, and even though it's been a long journey, #E [SCOPE.sChar('target').GetFirstName]#! feels it has been worth it. [SCOPE.sChar('target').GetHerHis] determination to learn has involved both setbacks and triumphs, but #E [SCOPE.sChar('target').GetFirstName]#! now stands victorious at the final stretch.\n\nAfter reading through and mastering these final few tomes, #E [SCOPE.sChar('target').GetFirstName]#!'s great journey will come to an end, and [SCOPE.sChar('target').GetHerHis] new arcane abilities will start [SCOPE.sChar('target').GetHerHim] on a new journey!"
me_magic_studying.21.a: "Just a few more books!"

me_magic_studying.22_title: "Diviner Accident"
me_magic_studying.22_desc: "A curious student, #E [SCOPE.sChar('target').GetFirstName]#! is always pushing the boundaries of their abilities. However, experimenting with magic can often cause unforseen and deadly consequences.\n\nWhile #E [SCOPE.sChar('target').GetFirstName]#! deconstructed one of the newest incantations [SCOPE.sChar('target').GetSheHe] had learned, [SCOPE.sChar('target').GetSheHe] decided to run a small experiment to see if they could amplify the spells power by introducing new words from a similar incantation. Thus, when #E [SCOPE.sChar('target').GetFirstName]#! cast the spell it began to glow brighter than it had before, requiring more mana to stabilize it.\n\nAt first the mage celebrated, as [SCOPE.sChar('target').GetHerHis] experiment had produced the desired results. However, it quickly became clear that the fledgling mage could not control [SCOPE.sChar('target').GetHerHis] mana output, and the fluctuations [SCOPE.sChar('target').GetSheHe] produced caused the spell to fail, immediately showering the room in a brilliant light."
me_magic_studying.22.a: "It burns!"

