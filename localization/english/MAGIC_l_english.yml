# Magic Studying Events

# Phase One

me_magic_studying.1_title: "Novel Excitement"
me_magic_studying.1_desc: "As with most new mages, #E [SCOPE.sChar('target').GetFirstName]#! exudes a sense of excitement at the novel prospect of becoming a magician.\n\nSuch a hopeful attitude with help [SCOPE.sChar('target').GetHerHim] through the intense studying and stress that comes with learning the necessary steps to begin casting magic. Even when this optimism fades, there is no doubt that #E [SCOPE.sChar('target').GetFirstName]#!'s determination will see [SCOPE.sChar('target').GetHerHim] through [ROOT.GetCountry.GetRuler.GetHerHis] studies."
me_magic_studying.1.a: "I'm sure I'll be great in no time!"

me_magic_studying.2_title: "Overworked"
me_magic_studying.2_desc: ""
me_magic_studying.2.a: "All I need is a little nap"

me_magic_studying.3_title: "Shortcuts"
me_magic_studying.3_desc: "Despite being an astute student, #E [SCOPE.sChar('target').GetFirstName]#! has been having a difficult time comprehending the most recent material he's been researching. Even after days of going over the incantations [SCOPE.sChar('target').GetSheHe]'s been assigned, it just seems like #E [SCOPE.sChar('target').GetFirstName]#! is unable to progress.\n\nAfter consulting with [SCOPE.sChar('target').GetHerHis] teachers, [SCOPE.sChar('target').GetSheHe] has been advised to continue this arduous method of recounting the same incantations, since they will form the base of all the spells he intends to learn.\n\nHowever, one of #E [SCOPE.sChar('target').GetFirstName]#!'s peers, who has far surpassed [SCOPE.sChar('target').GetHerHis] level, has let [SCOPE.sChar('target').GetHerHim] know their secret: by skipping these essential but boring lessons, they were able to progress much quicker than all of ther classmates. Of course, doing so would make #E [SCOPE.sChar('target').GetFirstName]#!'s future spells more unstable and prone to failure, however [SCOPE.sChar('target').GetSheHe] would be able to leg up on all of his classmates."
me_magic_studying.3.a: "Why wait?"
me_magic_studying.3.b: "These things take time"

me_magic_studying.4_title: "Steady Advance"
me_magic_studying.4_desc: "For most, the first few steps required to master a set of spells is the most difficult, as they have to deal with foreign incantations and unfamiliar uses of their mana reserves, however, #E [SCOPE.sChar('target').GetFirstName]#! has been quickly adapting to every new challenge that faces [SCOPE.sChar('target').GetHerHim].\n\nThe voracious appetite for books and knowledge displayed by #E [SCOPE.sChar('target').GetFirstName]#! has impressed many of [SCOPE.sChar('target').GetHerHis] peers and teachers, and [SCOPE.sChar('target').GetSheHe] has quickly become one of the brightest pupils in the academy."
me_magic_studying.4.a: "Bring me a challenge!"

me_magic_studying.5_title: "Diviner Accident"
me_magic_studying.5_desc: "Got too cocky and blew up the city"
me_magic_studying.5.a: "They'll rebuild"

me_magic_studying.6_title: "Doubt and Regret"
me_magic_studying.6_desc: "disgusted with melodian theory"
me_magic_studying.6.a: "I'm sure I'll be great in no time!"

me_magic_studying.7_title: "Novel Excitement"
me_magic_studying.7_desc: ""
me_magic_studying.7.a: "I'm sure I'll be great in no time!"

me_magic_studying.8_title: "Getting into the Flow"
me_magic_studying.8_desc: "After the initial few months of study, #E [SCOPE.sChar('target').GetFirstName]#! has started to get accustomed to his studies. [SCOPE.sChar('target').GetHerHis] routine has grown to accomodate his magical studies, and even [SCOPE.sChar('target').GetHerHis] body has grown accustomed to the extensive use of mana required of [SCOPE.sChar('target').GetHerHim]!"
me_magic_studying.8.a: "Bring me more books!"

me_magic_studying.9_title: "The Costs of Magic"
me_magic_studying.9_desc: "Of all the sacrifices made to master the mystic arts, money is one universally spent by all who walk down the path of the arcane. Many mages often bankrupt themselves to continue their research, and must find either generous patrons or state funding, both of which are difficult to come by.\n\n#E [SCOPE.sChar('target').GetFirstName]#! has found themselves in such a predicament, and now faces bankruptcy to continue their studies. However, as a member of the royal court [SCOPE.sChar('target').GetSheHe] is in a unique position. #E [SCOPE.sChar('target').GetFirstName]#! could acquire state funding to the detriment of the realm, or choose to call in a few political favors to collect half the amount due and foot the rest of the cost themselves at the expense of [SCOPE.sChar('target').GetHerHis] studies."
me_magic_studying.9.a: "The state will provide for my education!"
me_magic_studying.9.b: "I'll have to call in some favors"

me_magic_studying.10_title: "Neglecting Duties"
me_magic_studying.10_desc: "All future magicians are aware of the great sacrifices one must make to earn their title and status in the world of mages, and balancing studies with courtly duties is a herculean task. Despite this, #E [SCOPE.sChar('target').GetFirstName]#! has shown themselves to be able to keep up with both the demands of the state and the academy.\n\nHowever, as [SCOPE.sChar('target').GetHerHis] lessons grow harder and progress stalls, the aspiring mage slowly spends more time in [SCOPE.sChar('target').GetHerHis] study, often forgetting to attend meetings at court or failing to perform [SCOPE.sChar('target').GetHerHis] duties to the realm. As [SCOPE.sChar('target').GetSheHe] struggles to maintain this work-study balance, many at court have become aware of the neglect #E [SCOPE.sChar('target').GetFirstName]#! has shown for [SCOPE.sChar('target').GetHerHis] duties.\n\nDespite their best efforts, the effects of #E [SCOPE.sChar('target').GetFirstName]#!'s actions have begun to show, and rumors now circulate regarding how [SCOPE.sChar('target').GetSheHe] spends their time."
me_magic_studying.10.a: "Let me just finish this manuscript!"

