me_magic_studying.30_desc: "After years spent researching, finding both teachers and tomes, and spending sleepless nights scouring books for proper incantations needed to begin spells, [SCOPE.sChar('target').GetName] has finally taken [SCOPE.sChar('target').GetHerHis] first steps into the world of the arcane and learned basic #E #R Warlock#!#! spells of the #E #R Melodian#! School#!!\n\nAs a proper #E Mage#!, #E [SCOPE.sChar('target').GetFirstName]#! can now choose to continue [SCOPE.sChar('target').GetHerHis] research into higher level #E #R Warlock#!#! spells if [SCOPE.sChar('target').GetSheHe] chooses to do so!"
me_magic_studying.30.a: "All shall know my name!"

