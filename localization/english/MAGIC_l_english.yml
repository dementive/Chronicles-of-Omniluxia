# Special Spells
me_magic_studying.51_title: "Graduation"
me_magic_studying.51_desc: "After years of studying at the prestigious #G Magonis School of Summoning Magic#!, [SCOPE.sChar('target').GetName|Y] has mastered the #T Lubes Style#! used by #Y Magonis the Wise#! himself!\n\nNow able to summon #Y Battle Beasts#!, #Y [SCOPE.sChar('target').GetFirstName]#! will be a fearsome foe indeed!"
me_magic_studying.51.a: "The Wise One guides me!"

me_magic_studying.52_title: "Graduation"
me_magic_studying.52_desc: "After years of studying in the frigid conditions of #G Polaria#!, [SCOPE.sChar('target').GetName|Y] has mastered the #T Taanka Style#! of the #Y Jemskoo#! gnomes!\n\nNow able to create large #Y Battle Avatars#!, #Y [SCOPE.sChar('target').GetFirstName]#! can become one of the most dangerous opponents one could find themselves facing on any battlefield!"
me_magic_studying.52.a: "Taanka's strength now flows through my veins!"

me_magic_studying.53_title: "Graduation"
me_magic_studying.53_desc: "After years of studying amongst the #Y Exiled Mages#! of [GetProvince('(int32)5031').GetName|G], [SCOPE.sChar('target').GetName|Y] has mastered the #T Zare Jad Style#!!\n\nAble to shield [SCOPE.sChar('target').GetHerHis] allies, #Y [SCOPE.sChar('target').GetFirstName]#! will be a necessity in any army facing a magical opponent!"
me_magic_studying.53.a: "The Gray One's scales will protect me!"

me_magic_studying.54_title: "Graduation"
me_magic_studying.54_desc: "After years of studying at the holy #Y Beige Palace#!, [SCOPE.sChar('target').GetName|Y] has mastered the #T Hellarui Style#! practiced by the #T Helluvian#! faithful!\n\nWith #Y Hellas'#! blessing, #Y [SCOPE.sChar('target').GetFirstName]#! can protect and heal those truly in need!"
me_magic_studying.54.a: "Hellas give me strength!"

me_magic_studying.55_title: "Graduation"
me_magic_studying.55_desc: "After years of studying amongst the deceitful disciples of the #G Psiddisamman School of Charm Magic#!, [SCOPE.sChar('target').GetName|Y] has mastered the #T Psiddisamman Style#!!\n\nNow possessing powerful charm magic, #Y [SCOPE.sChar('target').GetFirstName]#! is to be feared by both peasants and emperors alike!"
me_magic_studying.55.a: "Who could say no to me?"

me_magic_studying.56_title: "Graduation"
me_magic_studying.56_desc: "After years of studying in the great libraries of #Y Veddtunn#!, [SCOPE.sChar('target').GetName|Y] has mastered the #T Gerrtágadi Style#! of the #Y Silver Dwarves#!!\n\nAble to shape solid rock through touch, #Y [SCOPE.sChar('target').GetFirstName]#! has the capabilities to make truly astounding works of art!"
me_magic_studying.56.a: "Rock on!"

me_magic_studying.57_title: "Graduation"
me_magic_studying.57_desc: "After years of studying amongst the secretive #Y Shoishoni#!, [SCOPE.sChar('target').GetName|Y] has mastered the #T Ponikar Style#! of the #Y Blood Mages#!!\n\nNow a powerful #R Melodian#! mage, #Y [SCOPE.sChar('target').GetFirstName]#!'s' hexes have the power to threaten the lives of even the most powerful of #G Omniluxia#! within days!"
me_magic_studying.57.a: "I have plans that I cannot share with you right now because the haters will try and stop me"

me_magic_studying.58_title: "Graduation"
me_magic_studying.58_desc: "After years of studying amongst the few students lucky enough to attend the #G Jelenia School of Soul Magic#!, [SCOPE.sChar('target').GetName|Y] has mastered the #T Starogii Style#!!\n\nBeing proficient in the arcane art of manipulating the souls of living beings, the possibilities this style offers are only equal to the terrifying implications of what experienced mages could do with this power."
me_magic_studying.58.a: "May Jelenia show me the way"

