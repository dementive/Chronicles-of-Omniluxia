me_magic_studying.27_title: "Graduation"
me_magic_studying.27_desc: "After years spent researching, finding both teachers and tomes, and spending sleepless nights scouring books for proper incantations needed to complete a spell, [SCOPE.sChar('target').GetName] has finally taken [SCOPE.sChar('target').GetHerHis] first steps into the world of the arcane and learned basic #E #T Diviner#!#! spells of the #E #T Omnic#! School#!!\n\nAs a proper #E Mage#!, #E [SCOPE.sChar('target').GetFirstName]#! can now choose to continue [SCOPE.sChar('target').GetHerHis] research into higher level #E #T Diviner#!#! spells if [SCOPE.sChar('target').GetSheHe] chooses to do so!"
me_magic_studying.27.a: "All shall know my name!"

