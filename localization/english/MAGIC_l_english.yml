me_zorgo_magic_focus.25_title: "Magic Instructions"
me_zorgo_magic_focus.25_desc: "#T How magic works#!\n\nIf you have access to a #T Mage Academy#!, a character can begin the process of learning how to cast spells and will eventually become a #T Mage#! if they graduate. Open the magic icon in the character window to see the character's known spells and available spellbooks. The ruler's magic is not automatically shared with every courtier, but each magic caster has access to their own spells.\n\n#T Learning Magic#!\n\nFormal study is started from the magic menu by choosing a school and paying the displayed study cost. Studying has a cooldown and there are many random events, some good and some bad, as a character attempts to master the arcane arts.\n\n#T Schools And Progression#!\nThe four schools are #T Omnic#! (pure mana and divine power), #Y Aldic#! (mind, soul, and healing), #G Amten#! (nature and the elements), and #R Melodian#! (curses, blood, and the dead). Each school contains distinct classes and beginner, intermediate, and advanced tiers. Unlocking a tier or class makes some of its spells available - you might have to continue studying or buy spells at a #G Mage Tower#! to learn new ones.\n\n#T Places And Restrictions#!\n\nMelodian study requires an open-magic law or an eligible #T Melodian#! culture. Check a spell's tooltip for its mana cost, target requirements, cooldown, and any other effects."
me_zorgo_magic_focus.25.a: "I still don't get it"

#################### Siege Spells ####################
omni_siege_magic_unit_button: "Cast a Siege Spell"
omni_siege_magic_unit_button_tooltip: "#T Cast A Spell#!\nOpen the spellbook and unleash your magic upon the settlement your army is besieging - breach its walls, rot its garrison, or bless the coming assault."
omni_siege_need_mana_tt: "The commander has enough banked mana to cast a siege spell."
omni_unit_magic_need_mana_tt: "An available mage has enough banked mana to cast a spell."

me_zorgo_magic_focus.30_title: "Magic of the Siege"
me_zorgo_magic_focus.30_desc: "The walls of the besieged settlement stand defiant before the army led by [SCOPE.sChar('target').GetName|Y]. With the right incantation our magic could bring them down, wither the defenders within, or steel our soldiers for the final push. What spell shall we weave?"
me_zorgo_magic_focus.30.a: "Breaching Tremor - crack their walls open"
me_zorgo_magic_focus.30.b: "Wasting Rot - starve and weaken the garrison"
me_zorgo_magic_focus.30.c: "Storm of the Siege - bless our army for the assault"
me_zorgo_magic_focus.30.d: "Burning Pitch - smother the defenders in smoke"
me_zorgo_magic_focus.30.e: "Counterward - break their magical protections"
me_zorgo_magic_focus.30.f: "Illusion Walls - make the fort seem stronger"

omni_siege_breach_tt: "#Y The besieged settlement suffers#! #R -5% Fortification Defense#! #Y for#! #G 90 days#!. #Y Magical energy will crack the walls open and reveal a breach for the besiegers.#!"
omni_siege_rot_tt: "#Y The besieged settlement suffers#! #R -50% Garrison Size#! #Y and#! #R -75% Local Food#! #Y for#! #G 90 days#!. #Y Pestilence will spread quickly, rotting the defenders from within.#!"
omni_siege_assault_blessing_tt: "#Y Our besieging army gains#! #G +25% Assault Ability#! #Y and#! #G +25% Siege Ability#! #Y for#! #G 90 days.#! #Y A war-blessing will drive our soldiers onward, sharpening their assault and hastening the siege.#!"
omni_siege_burning_pitch_tt: "#Y The besieged settlement suffers#! #R -25% Local Food#!, #R -25% Garrison Size#! #Y and#! #R -5% Fortification Defense#! #Y for#! #G 90 days#!. #Y Burning pitch fills the walls with choking smoke and fire.#!"
omni_siege_counterward_tt: "#Y The besieged settlement suffers#! #R -15% Fortification Defense#!, #R -10% Garrison Size#! #Y and#! #R -10% Local Food#! #Y for#! #G 90 days#!. #Y A counterspell unthreads the defenders' protections.#!"
omni_siege_illusion_walls_tt: "#Y The besieged settlement gains#! #G +15% Fortification Defense#! #Y and#! #G +25% Garrison Size#! #Y for#! #G 90 days#!. #Y Illusions make the walls seem more daunting than they are.#!"

