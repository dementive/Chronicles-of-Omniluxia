# Melodian Spells
melodian_warlock_spell_t1_trait: "Rage"
melodian_warlock_spell_t1_trait_desc: "Channeling #Y Melodias#!' energy allows for a massive increase in strength, but at the cost of losing everything else."
skull_curse_trait: "Skull Curse"
skull_curse_trait_desc: "The dreaded #Y Skull Curse#! cast by #Y Necromancers#! is the primary reason they are universally reviled and rejected from wider society. Any victim that falls under this curse will slowly fade until even their bones are visible, eventually becoming a nameless #Y Wraith#! meant to serve their new master."
melodian_warlock_spell_t2_trait: "Dark Visions"
melodian_warlock_spell_t2_trait_desc: "#Y #R YOUNG MORTAL, YOUR GODS HAVE LONG SINCE ABANDONED YOU. EVEN NOW, MY SERVANTS COME FOR THE HEADS OF YOU AND YOUR PEOPLE. GIVE UP, AND SERVE ME.#!#!"
blood_curse_trait: "Blood Curse"
blood_curse_trait_desc: "The signature spell of the #Y Shoishoni#! mages, the blood curse requires a small sacrifice from the casting mage to cast a hex that rapidly saps the vitality out of its victim until nothing is left but an empty husk."


