# SPELLS

# Folk Spells
copper_halfling_folk_trait: "Scramble"
copper_halfling_folk_trait_desc: "Smaller in stature than the humans that surround them and not as tough as their dwarven cousins, halflings have learned to focus their magic on maneuverability over everything else."
austropetolian_folk_trait: "Water Walker"
austropetolian_folk_trait_desc: "With their lives based on piracy and fishing, spells like Water Walker allow the #Y Naga#! to traverse the #G Austropetolian Archipelago#! without much difficulty."
milon_folk_trait: "Unified Blades"
milon_folk_trait_desc: "The signature spell of House M'lon. The caster unites the minds and blades of the soldiers to amplify each individual strike with the strength of the collective army."
drow_folk_trait: "Bloodlust"
drow_folk_trait_desc: "Similar to Rage, Bloodlust channels #Y Melodias#!' power to enhance the caster's strength at the expense of their sanity. This technique has been used by #Y Drow#! for centuries, and has helped them in their conquest of the surface world."
dragkhan_folk_trait: "Raging Dragon"
dragkhan_folk_trait_desc: "Traditional #T Dragkhanic#! folk magic like Raging #Y Dragon#! focuses"
vampire_folk_trait: "Beastly Transformation"
vampire_folk_trait_desc: "Transformation abilities are signature vampire skills, allowing vampires to nimbly escape danger by transforming into a mouse or spread terror in an enemy camp transformed as a bear."
viktriec_folk_trait: "Victory's Blessing"
viktriec_folk_trait_desc: "This mage calls upon the Victory goddess to bless their troops in battle."
northlander_folk_trait: "Berserker Rage"
northlander_folk_trait_desc: "For centuries the Northmen have utilized various plants and herbs to tap into a state of fury unseen by those in #G Eagelia#!. When those herbs went extinct, shamans tried to replicate this state through magic, becoming the first Berserkers."
aneic_folk_trait: "Cafea's Blessing"
aneic_folk_trait_desc: "This character has been blessed with fertility by the goddess #G Cafea#! herself!"
high_elf_folk_trait: "Atheus' Blessing"
high_elf_folk_trait_desc: "This character has been blessed with the fertility of the first #Y High Elves#! in #Y Atheus the Conqueror's#! armada!"
blood_angel_folk_trait: "Blood Boil"
blood_angel_folk_trait_desc: "[CHARACTER.GetPraenomen]'s blood rushes throughout [CHARACTER.GetHerHis] body, pushed by the immense amounts of mana in [CHARACTER.GetHerHis] veins, blessing [CHARACTER.GetHerHis] with superhuman strength and speed."

# Omnic Spells
omnic_diviner_spell_t1_trait: "Light Shields"
omnic_diviner_spell_t1_trait_desc: "This mage has cast powerful shields of hardened light around their retinue."
omnic_diviner_spell_t2_mod: "Warded Walls"
omnic_diviner_spell_t3_mod: "Spirit Bomb"
taanka_avatar_trait: "Battle Avatar"
taanka_avatar_trait_desc: "This mage has cast a large, powerful exoskeleton around themselves."
dragonscale_dome_mod: "Dragonscale Dome"
omnic_hierophant_spell_t1_trait: "Revelation"
omnic_hierophant_spell_t1_trait_desc: "This mage has opened their mind to #T Omnic#! revelation, sharpening their insight and guiding nearby scholars toward clearer understanding."
omnic_hierophant_spell_t2_trait: "Blessing"
omnic_hierophant_spell_t2_trait_desc: "This mage is suffused with a protective #T Omnic#! blessing, strengthening their vitality and magnifying the sacred rites performed in their name."
dragonscale_personal_trait: "Dragonscale Shields"
dragonscale_personal_trait_desc: "This character has used the #Y Zare Jad#! style to casted defensive light shields around themselves and their retinue."

# Aldic Spells
charm_magic_self_trait: "Silver Tongue"
charm_magic_self_trait_desc: "This mage has concentrated their mana into their words, making every argument they present particularly persuasive."
fortified_soul_trait: "Fortified Soul"
fortified_soul_trait_desc: "This character has fortified their soul through spells from the #T Starogii Style#!, improving their vitality and will."
aldic_cleric_spell_t1_trait: "Restoration"
aldic_cleric_spell_t1_trait_desc: "This mage has cast healing magic across the soldiers of their army."
aldic_illusionist_spell_t1_trait: "Altered Inspiration"
aldic_illusionist_spell_t1_trait_desc: "This mage has cast illusion magic across their army, shaping their thoughts and inspiring them in the face of the enemy."
