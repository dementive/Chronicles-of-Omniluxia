# SPELLS

# Folk Spells
copper_halfling_folk_trait: "Scramble"
copper_halfling_folk_trait_desc: "Smaller in stature than the humans that surround them and not as tough as their dwarven cousins, halflings have learned to focus their magic on maneuverability over everything else."
austropetolian_folk_trait: "Water Walker"
austropetolian_folk_trait_desc: "With their lives based on piracy and fishing, spells like Water Walker allow the Naga to traverse the Austropetolian Archipelago without much difficulty."
milon_folk_trait: "Unified Blades"
milon_folk_trait_desc: "The signature spell of House M'lon. The caster unites the minds and blades of the soldiers to amplify each individual strike with the strength of the collective army."
drow_folk_trait: "Bloodlust"
drow_folk_trait_desc: "Similar to Rage, Bloodlust channels Melodias' power to enhance the caster's strength at the expense of their sanity. This technique has been used by Drow for centuries, and has helped them in their conquest of the surface world."
dragkhan_folk_trait: "Raging Dragon"
dragkhan_folk_trait_desc: "Traditional Dragkhanic folk magic like Raging Dragon focuses"
vampire_folk_trait: "Beastly Transformation"
vampire_folk_trait_desc: "Transformation abilities are signature vampire skills, allowing vampires to nimbly escape danger by transforming into a mouse or spread terror in an enemy camp transformed as a bear."
viktriec_folk_trait: "Victory's Blessing"
viktriec_folk_trait_desc: "This mage calls upon the Victory goddess to bless their troops in battle."
northlander_folk_trait: "Berserker Rage"
northlander_folk_trait_desc: "For centuries the Northmen have utilized various plants and herbs to tap into a state of fury unseen by those in Eagelia. When those herbs went extinct, shamans tried to replicate this state through magic, becoming the first Berserkers."

# Omnic Spells
omnic_diviner_spell_t1_trait: "Light Shields"
omnic_diviner_spell_t1_trait_desc: "This mage has cast powerful shields of hardened light around their retinue."
omnic_diviner_spell_t2_mod: "Warded Walls"
taanka_avatar_trait: "Battle Avater"
taanka_avatar_trait_desc: "This mage has cast a large, powerful exoskeleton around themselves."
dragonscale_dome_mod: "Dragonscale Dome"
omnic_hierophant_spell_t1_trait: "Revelation"
omnic_hierophant_spell_t2_trait: "Blessing"

# Aldic Spells
charm_magic_self_trait: "Silver Tongue"
charm_magic_self_trait_desc: "This mage has concentrated their mana into their words, making every argument they present particularly persuasive."
fortified_soul_trait: "Fortified Soul"
fortified_soul_trait_desc: "This character has fortified their soul through spells from the Starogii Style, improving their vitality and will."
aldic_cleric_spell_t1_trait: "Restoration"
aldic_cleric_spell_t1_trait_desc: "This mage has cast healing magic across the soldiers of their army."
