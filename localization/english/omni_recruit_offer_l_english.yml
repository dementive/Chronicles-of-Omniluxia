l_english:
 omni_recruit_offer.1.t:0 "Court Invitation Accepted"
 omni_recruit_offer.1.desc:0 "[SCOPE.sChar('target').GetName] accepted our invitation and joined our court."
 omni_recruit_offer.1.a:0 "Welcome to our court."
 omni_recruit_offer.2.t:0 "Court Invitation Declined"
 omni_recruit_offer.2.desc:0 "[SCOPE.sChar('target').GetName] chose to stay. We have spent the gold and political influence committed to the invitation."
 omni_recruit_offer.2.a:0 "So be it."
