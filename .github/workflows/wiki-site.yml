name: Build wiki site

# The `gollum` event fires whenever a page in this repository's wiki is
# created or edited, so the published site rebuilds itself within a minute
# of anyone editing the wiki on GitHub. No local step is required.
on:
  gollum:
  push:
    branches: [main]
    paths:
      - 'tools/wiki_site/**'
      - 'gfx/loadingscreens/**'
      - 'gfx/interface/frontend/**'
      - '.github/workflows/wiki-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wiki-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the mod repository
        uses: actions/checkout@v4

      - name: Check out the wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install markdown pillow

      - name: Grade the mod's art into web plates
        run: python tools/wiki_site/build_art.py --out .wiki/site/preview/assets/img

      # Keep production on the same renderer and assets as the reviewed preview.
      # The wiki's Markdown alone is insufficient for its interactive features.
      - name: Build the site from the wiki renderer
        run: |
          python .wiki/site/build.py \
            --wiki .wiki \
            --out .wiki/site/preview \
            --base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Check generated links and assets
        run: |
          python .wiki/tools/check_site.py .wiki/site/preview
          python tools/wiki_site/check_deployed_features.py .wiki/site/preview
          node .wiki/tools/test_search.cjs
          node .wiki/tools/test_world_atlas.cjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .wiki/site/preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
