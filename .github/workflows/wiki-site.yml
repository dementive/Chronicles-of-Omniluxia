name: Build wiki site

# The `gollum` event fires whenever a page in this repository's wiki is
# created or edited, so the published site rebuilds itself within a minute
# of anyone editing the wiki on GitHub. No local step is required.
on:
  gollum:
  push:
    branches: [main]
    paths:
      - 'tools/wiki_site/**'
      - 'gfx/loadingscreens/**'
      - 'gfx/interface/frontend/**'
      - '.github/workflows/wiki-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wiki-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the mod repository
        uses: actions/checkout@v4

      - name: Check out the wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install markdown pillow

      - name: Grade the mod's art into web plates
        run: python tools/wiki_site/build_art.py --out docs/assets/img

      - name: Build the site
        run: |
          python tools/wiki_site/build.py \
            --wiki .wiki \
            --out docs \
            --base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      # These asset collections are maintained alongside the wiki content.
      # Merge them after the generator writes the mod-owned asset bundle so a
      # wiki edit can add an icon or map without requiring a mod-repo commit.
      - name: Copy wiki-owned assets
        run: |
          for asset_dir in flags icons maps; do
            if [ -d ".wiki/site/assets/${asset_dir}" ]; then
              mkdir -p "docs/assets/${asset_dir}"
              cp -R ".wiki/site/assets/${asset_dir}/." "docs/assets/${asset_dir}/"
            fi
          done

      - name: Check generated links and assets
        run: python tools/wiki_site/check_site.py docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
